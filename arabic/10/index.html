<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اللغة العربية — الصف العاشر</title>
<meta name="theme-color" content="#b8891f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Ruqaa";src:url("../../shared/fonts/aref-ruqaa-arabic-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--pri:#b8891f;--pri2:#7a5a10;--bg:#fff7dc;--card:#fff;--ink:#3a2a08;--mut:#7d6a3e;--gold:#e0b84a;--bd:#ecdca8;--onpri:#fff;--soft:#fbf1cf;--fs:16px}
:root[data-theme=green]{--pri:#0e7a55;--pri2:#0a5c40;--bg:#f1f7ee;--ink:#0b3b2c;--mut:#5f7a6e;--bd:#cfe3d4;--soft:#e2f0e6}
:root[data-theme=blue]{--pri:#1e5fa8;--pri2:#123f75;--bg:#eef4fb;--ink:#12263f;--mut:#58708f;--bd:#cddcee;--soft:#dfeaf7}
:root[data-theme=rose]{--pri:#a3243b;--pri2:#74142a;--bg:#fbf0f1;--ink:#3b1018;--mut:#85535c;--bd:#ecccd1;--soft:#f6dde0}
:root[data-theme=dark]{--pri:#e0b84a;--pri2:#f1d27a;--bg:#14110a;--card:#201b10;--ink:#f3ead0;--mut:#b9a97a;--bd:#3a3220;--soft:#2a2314;--onpri:#1b1405}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh;transition:background .25s,color .25s}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{margin:0;font-family:"Ruqaa","Plex Arabic",serif;color:var(--pri2)}
/* ===== مدخل ذهبي متحرّك ===== */
#intro{position:fixed;inset:0;z-index:50;overflow:auto;display:grid;place-items:center;padding:18px;background:linear-gradient(120deg,#f6dc8a,#d9a92f,#f9e7a6,#c8921b);background-size:300% 300%;animation:gold 12s ease infinite}
@keyframes gold{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#intro::before{content:"";position:fixed;inset:-50%;opacity:.28;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' fill='none' stroke='%237a5a10' stroke-width='3' stroke-linejoin='round'><path d='M14 30h30a8 8 0 0 1 8 8v36a8 8 0 0 0-8-8H14zM90 30H60a8 8 0 0 0-8 8v36a8 8 0 0 1 8-8h30z' transform='translate(4 6)'/><rect x='92' y='96' width='42' height='52' rx='4' transform='rotate(-12 113 122)'/><path d='M100 110h26M100 122h26M100 134h18' transform='rotate(-12 113 122)'/><path d='M20 112l22-22 10 10-22 22-14 4z'/></svg>");background-size:160px;animation:drift 40s linear infinite;transform:rotate(-8deg)}
@keyframes drift{to{background-position:320px 160px}}
.ibox{position:relative;width:100%;max-width:420px;background:rgba(255,252,240,.94);border:2px solid #fff;border-radius:26px;padding:22px 20px;box-shadow:0 14px 40px rgba(90,60,0,.3);text-align:center}
.ibox h1{font-size:1.7rem;line-height:1.4}
.ibox p{margin:6px 0 14px;color:var(--mut)}
.fld{display:block;text-align:right;margin:12px 0 4px;font-weight:700;color:var(--pri2)}
.in{width:100%;border:2px solid var(--bd);border-radius:14px;background:#fff;color:#3a2a08;padding:11px 14px;outline:none}
.in:focus{border-color:var(--pri)}
.sec{display:flex;gap:8px}.sec button{flex:1;border:2px solid var(--bd);background:#fff;color:#3a2a08;border-radius:14px;padding:10px 4px;font-weight:700}
.sec button.on{background:var(--pri);border-color:var(--pri2);color:#fff}
.btn{display:block;width:100%;margin-top:18px;border:0;border-radius:16px;padding:13px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);font-weight:700;font-size:1.1rem;box-shadow:0 5px 14px rgba(0,0,0,.2)}
.btn:disabled{opacity:.45}
.err{color:#b3261e;min-height:1.4em;font-size:.9rem}
.hikma{margin:14px 0 4px;padding:16px;border-radius:18px;background:var(--soft);border:1.5px dashed var(--pri);font-size:1.25rem;line-height:2;font-family:"Ruqaa","Plex Arabic",serif;color:#3a2a08}
.hikma small{display:block;font-family:"Plex Arabic",sans-serif;font-size:.85rem;color:var(--mut)}
.lamp{font-size:2.6rem;animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
/* ===== التطبيق ===== */
#app{max-width:640px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{flex:1;font-size:1.3rem;line-height:1.3}
.ib{flex:none;width:44px;height:44px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);display:grid;place-items:center;font-size:1.3rem;color:var(--ink)}
.av{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--gold);background:var(--soft);overflow:hidden;padding:0;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.av i{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.55);color:#fff;font-size:.6rem;font-style:normal;text-align:center;line-height:1.5}
.hello{border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.hello b{display:block;font-size:1.15rem}.hello small{opacity:.9}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:2px solid var(--bd);background:var(--card);border-radius:16px;padding:11px 6px;font-weight:700}
.tabs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri2)}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:1.5px solid var(--bd);background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.unit .n{flex:none;width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--pri2);display:grid;place-items:center;font-weight:700;border:2px solid var(--gold)}
.unit b{flex:1}.unit span{color:var(--mut)}
.read{white-space:pre-wrap;line-height:2.1;font-size:1.05rem}
.empty{color:var(--mut);text-align:center;padding:18px 6px}
.poem{font-family:"Ruqaa","Plex Arabic",serif;font-size:1.25rem;text-align:center}
#nav{position:fixed;inset-inline:0;bottom:0;z-index:20;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1.5px solid var(--bd)}
#nav button{flex:1;border:2px solid var(--gold);background:var(--soft);border-radius:16px;padding:9px 6px;font-weight:700;color:var(--ink);line-height:1.4;font-size:.95rem}
#nav button:active{background:var(--gold)}
/* درج الإعدادات */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}
#drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(86vw,340px);background:var(--bg);z-index:61;padding:16px 14px;overflow:auto;box-shadow:0 0 30px rgba(0,0,0,.4);animation:dr .22s ease}
@keyframes dr{from{transform:translateX(100%)}}
#drawer h2{margin-bottom:10px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:1.5px solid var(--bd);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.mi span:first-child{font-size:1.3rem}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid var(--bd)}
.sw button.on{border-color:var(--ink)}
.q{width:100%;margin-bottom:10px}
.w{display:flex;gap:10px;justify-content:space-between;border-bottom:1px dashed var(--bd);padding:8px 2px}.w b{color:var(--pri2)}
.chk{display:flex;align-items:center;gap:12px;border:1.5px solid var(--bd);background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;width:100%;text-align:right}
.chk .b{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--pri);display:grid;place-items:center;font-weight:700}
.chk.on .b{background:var(--pri);color:var(--onpri)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#2a2008;color:#fff;border-radius:999px;padding:9px 18px;z-index:90;max-width:90vw;text-align:center}
</style>
</head>
<body>
<section id="intro" hidden></section>
<main id="app" hidden></main>

<script src="data/curriculum.js"></script>
<script src="data/dict.js"></script>
<script src="data/wisdom.js"></script>
<script>

      };

    f.click();
  }

  /* ===== المدخل ===== */

  function showIntro(edit) {

    var btns = ["عاشر ١", "عاشر ٢", "عاشر ٣"].map(function (s) {
      var b = h("button", { type: "button", t: s, on: { click: function () { sec = s; btns.forEach(function (x) { x.classList.toggle("on", x === b); }); } } });
      if (s === sec) b.className = "on"; return b;
    });

      if (!sec) { err.textContent = "اختر الشعبة."; return; }

    } } });
    box.appendChild(h("div", { cls: "ibox" }, [h("div", { cls: "lamp", t: "📖" }), h("h1", { t: "اللغة العربية" }), h("p", { t: "الصف العاشر — مرحباً بك" }),
      h("label", { cls: "fld", t: "اسمك الثلاثي" }), name, h("label", { cls: "fld", t: "الشعبة" }), h("div", { cls: "sec" }, btns), err, next]));
  }
  function step2() {

      h("button", { cls: "btn", t: "ابدأ يا بطل 🚀", on: { click: function () { S.done = 1; save(); box.hidden = true; location.hash = "home"; route(); } } })]));
  }

  /* ===== القائمة والإعدادات ===== */

  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });

    if (deferred) { deferred.prompt(); deferred = null; }
    else if (matchMedia("(display-mode: standalone)").matches) toast("التطبيق مثبّت بالفعل");
    else toast("من قائمة المتصفح اختر «إضافة إلى الشاشة الرئيسية»");
  }
  function shareApp() {
    var u = location.href.split("#")[0], d = { title: "اللغة العربية — الصف العاشر", text: "تطبيق اللغة العربية للصف العاشر", url: u };
    if (navigator.share) navigator.share(d).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { toast("نُسخ رابط التطبيق"); }, function () { toast(u); });

  function closeMenu() { var a = $("#veil"), b = $("#drawer"); if (a) a.remove(); if (b) b.remove(); }
  function sheet(title, kids) {

    D.body.appendChild(h("div", { id: "veil", on: { click: closeMenu } })); D.body.appendChild(d);
  }
  function mi(icon, text, fn) { return h("button", { cls: "mi", on: { click: fn } }, [h("span", { t: icon }), h("span", { t: text })]); }
  function openMenu() {

      mi("🎨", "تغيير اللون", colorSheet),
      mi("🔠", "حجم الخط", fontSheet),
      mi("⬇️", "تنزيل التطبيق", function () { closeMenu(); installApp(); }),
      mi("📤", "مشاركة التطبيق", function () { closeMenu(); shareApp(); }),
      mi("📚", "القاموس المعجمي", function () { closeMenu(); location.hash = "dict"; }),
      mi("⭐", "المحفوظات", function () { closeMenu(); location.hash = "mem"; }),
      mi("💡", "حكمة اليوم", function () { var w = wisdomToday(); sheet("حكمة اليوم", [h("div", { cls: "hikma" }, [D.createTextNode(w[0]), h("small", { t: "— " + w[1] })])]); }),
      mi("✏️", "تعديل الاسم والشعبة", function () { closeMenu(); showIntro(true); }),
      mi("🗑️", "حذف بياناتي من هذا الجهاز", function () { if (confirm("سيُحذف اسمك وصورتك ومحفوظاتك من هذا الجهاز. متأكد؟")) { try { localStorage.removeItem(KEY); } catch (e) {} location.hash = ""; location.reload(); } })
    ]);
  }
  function colorSheet() {

  /* ===== الصفحات ===== */
  var app = $("#app");
  function top(title, back) {

  function findUnit(id) { var r = null; ARA.semesters.forEach(function (s) { s.units.forEach(function (u) { if (u.id === id) r = u; }); }); return r; }

    app.replaceChildren(top("اللغة العربية"), h("div", { cls: "hello" }, [h("b", { t: "أهلاً يا " + first + " 👋" }), h("small", { t: S.sec })]),
      h("div", { cls: "tabs" }, ARA.semesters.map(function (s) { return h("button", { t: s.name, cls: s.id === sem.id ? "on" : "", on: { click: function () { S.tab = s.id; save(); home(); } } }); })), h("div", null, list));

  }
  var KIND = { read: "مطالعة", poem: "نص شعري", gram: "قواعد لغوية", rhet: "بلاغة", aruz: "عروض", expr: "تعبير", imla: "إملاء" };
  function semOf(id) { var r = null; ARA.semesters.forEach(function (s) { s.units.forEach(function (u) { if (u.id === id) r = s; }); }); return r; }
  function unit(id, tab) {
    var u = findUnit(id); if (!u) return home(); var sem = semOf(id);
    var groups = [["read", "المطالعة", ["read"]], ["poem", "القصيدة", ["poem"]], ["gram", "القواعد", ["gram", "rhet", "aruz", "imla", "expr"]]].map(function (g) {
      return [g[0], g[1], u.items.filter(function (i) { return g[2].indexOf(i.k) >= 0; })];
    }).filter(function (g) { return g[2].length; });
    var cur = groups.filter(function (g) { return g[0] === tab; })[0] || groups[0];
    var cards = cur ? cur[2].map(function (i) {
      return h("div", { cls: "card" }, [h("small", { t: KIND[i.k], style: "color:var(--mut)" }), h("h2", { t: i.t, style: "margin-bottom:8px" }),
        i.x ? h("div", { cls: "read" + (i.k === "poem" ? " poem" : ""), t: i.x }) : h("div", { cls: "empty", t: "نص الدرس في الكتاب المدرسي" }),
        h("button", { cls: "btn", style: "margin-top:8px", t: "📖 افتح الكتاب" + (u.pg ? " (الوحدة من صفحة " + u.pg + ")" : ""), on: { click: function () { openLink(ARA.links[sem.book]); } } })]);
    }) : [h("div", { cls: "empty", t: "سيُضاف المحتوى قريباً." })];
    app.replaceChildren.apply(app, [top(u.n, true), groups.length ? h("div", { cls: "tabs" }, groups.map(function (g) { return h("button", { t: g[1], cls: cur && g[0] === cur[0] ? "on" : "", on: { click: function () { unit(id, g[0]); } } }); })) : null].filter(Boolean).concat(cards));
    nav(false);
  }
  function dict() {
    var grp = S.dg || 1, q = h("input", { cls: "in q", placeholder: "ابحث عن كلمة…", type: "search" }), out = h("div", { cls: "card" });
    function draw() { var s = q.value.trim(), items = DICT[grp].filter(function (w) { return !s || w[0].indexOf(s) >= 0 || w[1].indexOf(s) >= 0; }); out.replaceChildren.apply(out, items.length ? items.map(function (w) { return h("div", { cls: "w" }, [h("b", { t: w[0] }), h("span", { t: w[1] })]); }) : [h("div", { cls: "empty", t: "لا نتائج." })]); }
    q.addEventListener("input", draw);
    app.replaceChildren(top("القاموس المعجمي", true), h("div", { cls: "tabs" }, [[1, "المجموعة الأولى (الفصل الأول)"], [2, "المجموعة الثانية (الفصل الثاني)"]].map(function (g) { return h("button", { t: g[1], cls: g[0] === grp ? "on" : "", on: { click: function () { S.dg = g[0]; save(); dict(); } } }); })), q, out);
    draw(); nav(false);
  }
  function mem() {
    var items = [];
    ARA.semesters.forEach(function (s) { s.units.forEach(function (u) { u.items.forEach(function (i, n) { if (i.k === "poem") items.push([u.id + ":" + n, s, u, i]); }); }); });
    var done = items.filter(function (i) { return S.mem[i[0]]; }).length;
    app.replaceChildren(top("المحفوظات", true), h("div", { cls: "hello" }, [h("b", { t: "حفظتَ " + done + " من " + items.length }), h("small", { t: "اضغط على القصيدة لتعليمها «محفوظة»" })]),
      h("div", null, items.map(function (i) { var on = !!S.mem[i[0]]; return h("button", { cls: "chk" + (on ? " on" : ""), on: { click: function () { S.mem[i[0]] = !on; save(); mem(); } } }, [h("span", { cls: "b", t: on ? "✓" : "" }), h("span", { t: i[1].name + " — " + i[3].t })]); })));
    nav(false);
  }
  function nav(show) {
    var n = $("#nav"); n.hidden = !show; if (!show) return; n.replaceChildren(
      h("button", { t: "📘 خماسي بالكتاب المدرسي", on: { click: bookSheet } }),
      h("button", { t: "📦 بالرزمة التعليمية", on: { click: function () { openLink(ARA.links.pack); } } }));
  }
  function bookSheet() { sheet("الكتاب المدرسي", [mi("📗", "الجزء الأول (الفصل الأول)", function () { closeMenu(); openLink(ARA.links.book1); }), mi("📘", "الجزء الثاني (الفصل الثاني)", function () { closeMenu(); openLink(ARA.links.book2); })]); }
  function openLink(u) { if (u) window.open(u, "_blank", "noopener"); else toast("الرابط غير مضاف بعد"); }

  function route() {
    closeMenu();
    if (!S.done || !S.name) { return showIntro(false); }
    $("#intro").hidden = true; app.hidden = false;
    var p = (location.hash || "#home").slice(1).split("/");
    if (p[0] === "unit") unit(p[1]); else if (p[0] === "dict") dict(); else if (p[0] === "mem") mem(); else home();
    scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
