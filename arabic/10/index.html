.fld{display:block;text-align:right;margin:12px 0 4px;font-weight:700;color:#7a5a10}
.in{width:100%;border:2px solid #ecdca8;border-radius:14px;background:#fff;color:#3a2a08;padding:11px 14px;outline:none}
.in:focus{border-color:#c89622}

.err{color:#b3261e;min-height:1.4em;font-size:.9rem}

.hikma small{display:block;font-family:"Plex Arabic",sans-serif;font-size:.85rem;color:#7d6a3e}

#app{position:relative;max-width:640px;margin:0 auto;padding:14px 14px calc(104px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{flex:1;font-size:1.35rem;line-height:1.3}
.ib{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--cardb);background:var(--card);display:grid;place-items:center;font-size:1.2rem;color:var(--ink);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ib svg,.ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av{flex:none;width:60px;height:60px;border-radius:18px;border:2px solid var(--g);background:var(--solid);overflow:hidden;padding:0;position:relative;box-shadow:0 0 0 3px rgba(227,185,77,.18),0 6px 14px rgba(0,0,0,.35)}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.av i{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.55);color:#fff;font-size:.58rem;font-style:normal;text-align:center;line-height:1.5}
.hi b{display:block;font-size:1.15rem}.hi b em{font-style:normal;color:var(--g)}.hi small{color:var(--mut)}
