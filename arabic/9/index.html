<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اللغة العربية — الصف التاسع</title>
<meta name="theme-color" content="#0d0904">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Ruqaa";src:url("../../shared/fonts/aref-ruqaa-arabic-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--gold:linear-gradient(135deg,#ff9bb9 0%,#ec3a74 46%,#a5123f 100%);--g:#ff86ab;--ongold:#fff;
--ink:#fdeef3;--mut:#d9a7b8;--card:rgba(255,255,255,.07);--cardb:rgba(255,130,170,.28);--solid:#2a0b16;--bg1:#3b0a1c;--bg2:#1a0509;--fs:16px;--ok:#2fbf71;--bad:#ff5a6e;color-scheme:dark}
:root[data-mode=light]{--ink:#4a1020;--mut:#9a5a6c;--card:rgba(255,255,255,.78);--cardb:rgba(214,51,108,.3);--solid:#fff6f9;--g:#c2185b;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;color:var(--ink);line-height:1.8;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2)) fixed;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' fill='none' stroke='%23ff86ab' stroke-width='3' stroke-linejoin='round'><path d='M14 30h30a8 8 0 0 1 8 8v36a8 8 0 0 0-8-8H14zM90 30H60a8 8 0 0 0-8 8v36a8 8 0 0 1 8-8h30z' transform='translate(4 6)'/><rect x='92' y='96' width='42' height='52' rx='4' transform='rotate(-12 113 122)'/><path d='M20 112l22-22 10 10-22 22-14 4z'/></svg>");background-size:160px}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}
/* المدخل */
#intro{position:fixed;inset:0;z-index:50;overflow:auto;display:grid;place-items:center;padding:18px;background:linear-gradient(120deg,#ffb3c8,#ec3a74,#ff8fb1,#b3124a,#ff9bb9);background-size:300% 300%;animation:grad 12s ease infinite}
@keyframes grad{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
#intro::before{content:"";position:fixed;inset:-50%;opacity:.26;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' fill='none' stroke='%237a0f33' stroke-width='3' stroke-linejoin='round'><path d='M14 30h30a8 8 0 0 1 8 8v36a8 8 0 0 0-8-8H14zM90 30H60a8 8 0 0 0-8 8v36a8 8 0 0 1 8-8h30z' transform='translate(4 6)'/><rect x='92' y='96' width='42' height='52' rx='4' transform='rotate(-12 113 122)'/><path d='M100 110h26M100 122h26M100 134h18' transform='rotate(-12 113 122)'/><path d='M20 112l22-22 10 10-22 22-14 4z'/></svg>");background-size:160px;animation:drift 40s linear infinite;transform:rotate(-8deg)}
@keyframes drift{to{background-position:320px 160px}}
.ibox{position:relative;width:100%;max-width:420px;background:rgba(255,246,249,.95);color:#4a1020;border:2px solid #fff;border-radius:26px;padding:22px 20px;box-shadow:0 14px 40px rgba(110,10,40,.35);text-align:center}
.ibox h1{font-size:1.6rem;line-height:1.4;color:#a5123f}
.ibox p{margin:6px 0 14px;color:#9a5a6c}
.fld{display:block;text-align:right;margin:12px 0 4px;font-weight:700;color:#a5123f}
.in{width:100%;border:2px solid #f6c3d3;border-radius:14px;background:#fff;color:#4a1020;padding:11px 14px;outline:none}
.in:focus{border-color:#ec3a74}
.sec{display:flex;gap:8px}.sec button{flex:1;border:2px solid #f6c3d3;background:#fff;color:#4a1020;border-radius:14px;padding:10px 4px;font-weight:700}
.sec button.on{background:var(--gold);border-color:#a5123f;color:#fff}
.err{color:#b3261e;min-height:1.4em;font-size:.9rem}
.hikma{margin:14px 0 4px;padding:18px 16px;border-radius:18px;background:#ffe6ee;border:1.5px dashed #ec3a74;font-size:1.4rem;line-height:2;font-family:"Ruqaa","Plex Arabic",serif;color:#7a0f33}
.hikma small{display:block;font-family:"Plex Arabic",sans-serif;font-size:.85rem;color:#9a5a6c}
.lamp{font-size:2.6rem;animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
/* مكوّنات */
.btn{display:block;width:100%;margin-top:16px;border:0;border-radius:16px;padding:13px;background:var(--gold);color:var(--ongold);font-weight:700;font-size:1.05rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(165,18,63,.4)}
.btn.sm{display:inline-block;width:auto;margin:0;padding:8px 18px;font-size:.95rem}
#app{position:relative;max-width:640px;margin:0 auto;padding:14px 14px calc(104px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{flex:1;font-size:1.35rem;line-height:1.3}
.ib{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--cardb);background:var(--card);display:grid;place-items:center;color:var(--ink);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ib svg,.ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av{flex:none;width:60px;height:60px;border-radius:18px;border:2px solid var(--g);background:var(--solid);overflow:hidden;padding:0;position:relative;box-shadow:0 0 0 3px rgba(255,134,171,.2),0 6px 14px rgba(0,0,0,.35)}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.av i{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.55);color:#fff;font-size:.58rem;font-style:normal;text-align:center;line-height:1.5}
.hi b{display:block;font-size:1.15rem}.hi b em{font-style:normal;color:var(--g)}.hi small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--cardb);border-radius:22px;padding:14px;margin-bottom:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.sem{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:16px}
.sem .rn{flex:none;width:62px;height:62px;border-radius:18px;background:var(--gold);color:var(--ongold);display:grid;place-items:center;font-size:1.7rem;font-weight:700;font-family:"Ruqaa",serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px rgba(165,18,63,.45)}
.sem b{display:block;font-size:1.3rem}.sem small{color:var(--mut)}
.pents{display:flex;gap:14px;margin:18px 0}
.pent{flex:1;border:0;padding:2px;background:var(--gold);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);aspect-ratio:1/.96}
.pent span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;padding-top:14%;text-align:center;font-weight:700;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);background:linear-gradient(160deg,var(--solid),var(--bg2));color:var(--ink);font-size:.95rem;line-height:1.35}
.pent svg{width:30px;height:30px;stroke:var(--g);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pent small{color:var(--mut);font-weight:400}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:13px 14px}
.unit .n{flex:none;width:42px;height:42px;border-radius:14px;background:var(--gold);color:var(--ongold);display:grid;place-items:center;font-weight:700}
.unit b{flex:1}.unit span{color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:12px;padding:5px;border-radius:16px;background:var(--card);border:1px solid var(--cardb)}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 4px;font-weight:700}
.tabs button.on{background:var(--gold);color:var(--ongold);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.kind{color:var(--g);font-size:.85rem}
.read{white-space:pre-wrap;line-height:2.1}.poem{font-family:"Ruqaa","Plex Arabic",serif;font-size:1.25rem;text-align:center}
.empty{color:var(--mut);text-align:center;padding:12px 6px}
.row2{display:flex;gap:8px;margin-top:8px}.row2 .btn{margin-top:0;flex:1;padding:11px 6px;font-size:.95rem}
.btn.alt{background:transparent;color:var(--g);border:1.5px solid var(--g);box-shadow:none}
.lnk{display:flex;align-items:center;gap:12px}.lnk>div{flex:1}.lnk b{display:block;font-size:1.1rem}.lnk small{color:var(--mut)}
.lnk .gl{flex:none;border:1px solid var(--g);color:var(--g);background:transparent;border-radius:999px;padding:6px 14px;font-size:.9rem}
.in2{width:100%;border:1px solid var(--cardb);border-radius:14px;background:var(--card);color:var(--ink);padding:11px 14px;outline:none;margin-bottom:12px}
.w{display:flex;gap:10px;justify-content:space-between;border-bottom:1px dashed var(--cardb);padding:8px 2px}.w b{color:var(--g)}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:right;margin-bottom:8px;padding:12px}
.chk .b{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--g);display:grid;place-items:center;font-weight:700}
.chk.on .b{background:var(--gold);color:var(--ongold)}
.sg{display:flex;padding:5px;border-radius:16px;background:rgba(0,0,0,.2);gap:4px}.sg button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 4px;font-weight:700}.sg button.on{background:var(--gold);color:var(--ongold)}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0 14px}.sw button{aspect-ratio:1;border-radius:16px;border:2px solid transparent;box-shadow:0 3px 8px rgba(0,0,0,.25)}.sw button.on{border-color:var(--g);outline:2px solid rgba(255,134,171,.4)}
.lbl{color:var(--mut);margin:10px 0 2px}
.tabs.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs.sc button{flex:none;padding:9px 14px;white-space:nowrap}
.tx{line-height:2.1}.tx p{margin:0 0 10px}.tx-h{color:var(--g);font-size:1.05rem;margin:14px 0 6px}.tx-b{position:relative;padding-inline-start:16px;margin-bottom:4px}.tx-b::before{content:"•";position:absolute;inset-inline-start:2px;color:var(--g)}.tx-q{margin:0 0 10px;padding:8px 10px;border-radius:12px;background:rgba(127,127,127,.12)}
.rv-b{margin-top:8px!important}
.rv-b{font-size:1.05rem!important;font-weight:700!important;color:var(--ink)!important;border-width:2px!important;padding:13px 12px!important;background:var(--card)!important;text-align:center}
.rv-b::before{content:"👁️ ";font-size:1.1rem}.rv-b:disabled{opacity:1!important;color:var(--mut)!important;border-style:dashed!important;font-weight:400!important;font-size:.92rem!important}.rv-b:disabled::before{content:""}.btn:disabled{opacity:.55}

/* برواز الاختبارات المرصّع */

@keyframes spark{50%{transform:scale(1.3) rotate(10deg);filter:drop-shadow(0 0 9px #fff) brightness(1.5)}}

 background:linear-gradient(150deg,#9a6a28 0%,#6b4518 42%,#3d250c 100%) padding-box,repeating-linear-gradient(55deg,#fff6c4 0 4px,#d9a93a 4px 8px,#8a5f12 8px 12px,#f1cf6a 12px 16px) border-box;
 box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 0 1px rgba(255,236,160,.55),0 0 18px rgba(227,185,77,.3),inset 0 2px 3px rgba(255,236,170,.55),inset 0 -3px 6px rgba(0,0,0,.55)}
