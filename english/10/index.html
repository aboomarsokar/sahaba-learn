<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1250">
<link rel="icon" type="image/jpeg" href="images/logo.jpg">
<title>LEXORA</title>
<style>
@font-face{font-family:"Ruqaa";src:url("fonts/aref-ruqaa-arabic-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Vibes";src:url("fonts/great-vibes-latin-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Cinzel";src:url("fonts/cinzel-latin-700.woff2") format("woff2");font-weight:700;font-display:swap}

:root{
  --bg1:#1b0b3a; --bg2:#3b1a78; --bg3:#6a2fb8;
  --gold:#f3c969; --gold2:#ffe7a8;
  --text:#fff; --muted:#e4d8ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100dvh;overflow-x:hidden;color:var(--text);
  font-family:"Ruqaa",serif;
  background:
    radial-gradient(ellipse 80% 60% at 50% 38%, var(--bg3) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 85% 100%, #8e3fd0 0%, transparent 70%),
    linear-gradient(160deg, var(--bg2) 0%, var(--bg1) 100%);
  background-color:var(--bg1);
}

/* ---- الكلمات التحفيزية في الخلفية ---- */
.words{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.words span{
  position:absolute;white-space:nowrap;
  font-family:"Cinzel",serif;font-weight:700;letter-spacing:.12em;
  color:#fff;opacity:var(--o,.14);
  font-size:var(--s,1.2rem);
  transform:rotate(var(--r,0deg));
  animation:drift var(--d,14s) ease-in-out infinite alternate;
  animation-delay:var(--dl,0s);
}
.words span.hl{color:var(--gold);text-shadow:0 0 18px rgba(243,201,105,.45)}
@keyframes drift{
  from{transform:translateY(0) rotate(var(--r,0deg))}
  to{transform:translateY(-14px) rotate(var(--r,0deg))}
}

/* ---- المحتوى ---- */
main{
  position:relative;z-index:1;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.1rem;padding:2rem 16px calc(2rem + env(safe-area-inset-bottom,0px));
  text-align:center;
}
.logo{
  width:clamp(130px,34vw,180px);aspect-ratio:1;border-radius:50%;
  background:#fff;padding:6px;
  box-shadow:0 0 0 4px rgba(243,201,105,.6),0 0 40px rgba(243,201,105,.35),0 12px 30px rgba(0,0,0,.35);
  animation:rise .9s ease-out both;
}
.logo img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}

.brand{
  font-family:"Cinzel",serif;font-weight:700;direction:ltr;
  font-size:clamp(2.6rem,11vw,4.2rem);letter-spacing:.18em;margin-inline-start:.18em;
  background:linear-gradient(180deg,var(--gold2) 0%,var(--gold) 55%,#c9902f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.35));
  animation:rise .9s .15s ease-out both;
}
.divider{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:rise .9s .25s ease-out both}

.quote-en{
  font-family:"Vibes",cursive;direction:ltr;
  font-size:clamp(1.6rem,6.2vw,2.3rem);line-height:1.35;max-width:640px;
  color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35);
  animation:rise .9s .35s ease-out both;
}
.quote-ar{
  font-family:"Ruqaa",serif;font-weight:700;
  font-size:clamp(1.25rem,5vw,1.7rem);line-height:1.8;max-width:600px;
  color:var(--muted);
  animation:rise .9s .5s ease-out both;
}

.start{
  margin-top:.8rem;font-family:"Ruqaa",serif;font-weight:700;
  font-size:clamp(1.3rem,5vw,1.6rem);color:#2a1250;
  padding:.7rem 2.4rem;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  box-shadow:0 8px 24px rgba(243,201,105,.35),inset 0 -3px 0 rgba(0,0,0,.12);
  transition:transform .2s,box-shadow .2s;
  animation:rise .9s .65s ease-out both, glow 2.6s 1.6s ease-in-out infinite;
}
.start:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(243,201,105,.5)}
.start:active{transform:translateY(1px)}
.start:focus-visible{outline:3px solid #fff;outline-offset:4px}

/* ---- شاشة الملف الشخصي ---- */
[hidden]{display:none!important}
.profile{gap:1rem;justify-content:flex-start;padding-top:calc(1.6rem + env(safe-area-inset-top,0px))}
.profile h2{font-family:"Ruqaa",serif;font-weight:700;font-size:clamp(1.6rem,6vw,2.1rem);color:var(--gold2);animation:rise .6s ease-out both}
.preview{
  width:110px;height:110px;border-radius:28px;overflow:hidden;
  background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.35);
  display:grid;place-items:center;color:var(--muted);font-family:"Plex Arabic",sans-serif;font-size:.85rem;
  animation:rise .6s .1s ease-out both;
}
.preview.on{border:3px solid var(--gold);box-shadow:0 0 28px rgba(243,201,105,.45)}
.preview img{width:100%;height:100%;object-fit:cover;display:block}
.name{
  width:min(100%,360px);font-family:"Plex Arabic",sans-serif;font-size:1.1rem;text-align:center;
  padding:.75rem 1rem;border-radius:14px;color:#fff;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);outline:none;
  animation:rise .6s .2s ease-out both;
}
.name::placeholder{color:rgba(228,216,255,.65)}
.name:focus{border-color:var(--gold);background:rgba(255,255,255,.14)}
.grid{
  width:min(100%,560px);display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;
  padding:12px;border-radius:20px;background:rgba(10,4,30,.35);border:1px solid rgba(255,255,255,.12);
  animation:rise .6s .3s ease-out both;
}
.av{aspect-ratio:1;border-radius:16px;overflow:hidden;padding:0;cursor:pointer;background:none;
  border:2px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av:hover{transform:scale(1.04)}
.av[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(243,201,105,.35);transform:scale(1.04)}
.av:focus-visible{outline:3px solid #fff;outline-offset:2px}
#go{position:sticky;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:2;animation:rise .6s .4s ease-out both}
.start:disabled{opacity:.45;cursor:not-allowed;animation:none;box-shadow:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 8px 34px rgba(243,201,105,.65),inset 0 -3px 0 rgba(0,0,0,.12)}}
@media (max-width:600px){
  .words .w-wis{top:15%!important;right:auto!important;left:34%}
  .words .w-cre{bottom:11%!important;left:4%!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="words" aria-hidden="true">
  <span style="top:5%;left:6%;--s:1.5rem;--r:-8deg;--o:.18;--d:13s">Growth</span>
  <span class="hl" style="top:9%;right:5%;--s:1.1rem;--r:6deg;--o:.35;--d:16s;--dl:-3s">Focus</span>
  <span style="top:24%;left:-2%;--s:2.1rem;--r:-90deg;--o:.10;--d:18s">Innovation</span>
  <span style="top:30%;right:-4%;--s:1.4rem;--r:90deg;--o:.13;--d:15s;--dl:-6s">Empowerment</span>
  <span class="hl" style="top:47%;left:4%;--s:1rem;--r:-4deg;--o:.30;--d:12s;--dl:-2s">Dedication</span>
  <span class="w-wis" style="top:56%;right:3%;--s:1.6rem;--r:5deg;--o:.15;--d:17s;--dl:-8s">Wisdom</span>
  <span class="w-cre" style="bottom:22%;left:8%;--s:1.3rem;--r:7deg;--o:.14;--d:14s;--dl:-5s">Creativity</span>
  <span class="hl" style="bottom:15%;right:9%;--s:1.15rem;--r:-6deg;--o:.32;--d:16s;--dl:-1s">Motivation</span>
  <span style="bottom:5%;left:22%;--s:1.8rem;--r:-3deg;--o:.12;--d:19s;--dl:-9s">Inspiration</span>
  <span style="top:2%;left:38%;--s:1.2rem;--r:2deg;--o:.12;--d:15s;--dl:-4s">Achievement</span>
</div>

<main id="intro">
  <div class="logo"><img src="images/logo.jpg" alt="شعار مدرسة التابعين الشرعية لتحفيظ القرآن الكريم"></div>
  <h1 class="brand">LEXORA</h1>
  <div class="divider"></div>
  <p class="quote-en" lang="en">English isn't just a language you learn, but a skill that makes you stand out.</p>
  <p class="quote-ar">اللغة الإنجليزية ليست مجرد لغة تتعلّمها، بل مهارة تصنع بها التميّز.</p>
  <button class="start" type="button" id="start">ابدأ رحلتك الآن</button>
</main>

<main id="profile" class="profile" hidden>
  <h2>اختر صورتك واكتب اسمك</h2>
  <div class="preview" id="preview">صورتك</div>
  <input class="name" id="name" type="text" maxlength="30" placeholder="اسمك" autocomplete="name" aria-label="اسمك">
  <div class="grid" id="grid" role="group" aria-label="الصور الشخصية"></div>
  <button class="start" type="button" id="go" disabled>متابعة</button>
</main>

<script>
(function(){
  var KEY='lexora-profile';
  var labels=['English','Big Ben','Learn English','Headphones','Dream Big','Books','You Can Do It','London Bus','I Love English','Quill',
    'Union Jack','Global Language','ABC','Success','Better Tomorrow','Listen & Learn','Knowledge','Be Excellent','Phone Box','Speak English',
    'Study Hard','Set Goals','Tower Bridge','Think in English','English Book','Achieve More','Expand Your Mind','Keep Learning','Improve Yourself','English Forever'];
  var intro=document.getElementById('intro'),prof=document.getElementById('profile'),
      grid=document.getElementById('grid'),nameIn=document.getElementById('name'),
      go=document.getElementById('go'),preview=document.getElementById('preview'),chosen=null;

  function src(i){return 'images/avatars/'+(i<10?'0':'')+i+'.webp'}
  function update(){go.disabled=!(chosen&&nameIn.value.trim())}
  function pick(i){
    chosen=i;
    grid.querySelectorAll('.av').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.i==i)});
    preview.innerHTML='<img src="'+src(i)+'" alt="">';preview.classList.add('on');update();
  }
  labels.forEach(function(l,k){
    var i=k+1,b=document.createElement('button');
    b.type='button';b.className='av';b.dataset.i=i;b.setAttribute('aria-pressed','false');
    b.innerHTML='<img src="'+src(i)+'" alt="'+l+'" loading="lazy">';
    b.addEventListener('click',function(){pick(i)});grid.appendChild(b);
  });

  try{var saved=JSON.parse(localStorage.getItem(KEY)||'null');
    if(saved){nameIn.value=saved.name||'';if(saved.avatar)pick(saved.avatar)}}catch(e){}

  nameIn.addEventListener('input',update);
  document.getElementById('start').addEventListener('click',function(){
    intro.hidden=true;prof.hidden=false;window.scrollTo(0,0);
  });
  go.addEventListener('click',function(){
    try{localStorage.setItem(KEY,JSON.stringify({name:nameIn.value.trim(),avatar:chosen}))}catch(e){}
    // الانتقال للصفحة التالية يُضاف حين تصل صورتها
  });
})();
</script>

</body>
</html>
