<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--hd:#113D2E;--hd2:#0b2c21;--bg:#FAF6EB;--card:#fff;--ink:#113D2E;--mut:#5f7a6e;--g:#0e6b3c;--y:#E3B94D;--bd:#e9dfc8;--ok:#1f9d55;--bad:#d63c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
/* الرأس */
.hdr{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 40px;position:relative}
.hdr .row1{display:flex;align-items:center;gap:12px}
.av{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--y);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--g);font-weight:700;font-size:1.4rem}

.hi{flex:1;min-width:0}.hi b{display:block;font-size:1.2rem;line-height:1.3}
.pts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#f3dc92;font-size:.9rem;margin-top:0}

.portal{display:flex;align-items:center;gap:6px;color:var(--y);text-decoration:none;font-weight:700;font-size:.9rem;flex:none}

.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--bd);border-radius:999px;padding:6px 14px;margin-bottom:6px}

.sec{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:700;margin:4px 0 8px}
.sec i{font-style:normal;color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;grid-auto-rows:clamp(92px,calc((100svh - 300px) / 4),132px)}
.uc{border:0;border-radius:18px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;box-shadow:0 3px 0 rgba(0,0,0,.08);color:#0e2a3a;text-align:center;position:relative;overflow:hidden}

.card>svg{width:60px;height:60px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:right}
.cont .t{flex:1;min-width:0}.cont .t b{display:block;font-size:1.1rem}.cont .t small{color:var(--mut)}
.bar{height:10px;background:#ece6d4;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--y);border-radius:99px}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:var(--ink);background:conic-gradient(var(--y) calc(var(--p)*1%),#ece6d4 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.85rem}
.daily{background:linear-gradient(135deg,#f6e3a1,#e3b94d);border:2px solid #cfa23a;border-radius:26px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.daily .tr{font-size:3rem;line-height:1}
.daily b{font-size:1.3rem;display:block}.daily small{display:block;margin:2px 0 10px;color:#4a3a10}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--hd);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700}
.cta.alt{background:var(--g)}
/* التنقّل */
.nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);border-radius:26px 26px 0 0;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(17,61,46,.08);z-index:20}

.nav a svg{width:28px;height:28px}
.nav a.on{color:#b8902f}

.top{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.4}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:1.3rem}
.body{padding:16px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;width:100%;text-align:right;text-decoration:none;color:inherit}
.row .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:700;background:#fbf0c8;border:1px solid var(--y)}
.row .ic svg{width:34px;height:34px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx small{color:var(--mut)}
.row .go{color:var(--mut);font-size:1.3rem}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:#e0d9c4}.dots i.on{background:var(--ok)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;border:1.5px solid #b5d4be;background:#fff;color:var(--g);border-radius:999px;padding:6px 16px;font-weight:700}
.tb.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 0 var(--y)}
.lc h3{margin:14px 0 6px;font-size:1.1rem;color:var(--g)}
.lc p{margin:8px 0}.lc ul{margin:8px 0;padding-inline-start:20px}.lc li{margin:4px 0}
.note{background:#fdf0d8;border-inline-start:5px solid #f08a00;border-radius:12px;padding:8px 12px;margin:10px 0}
.exm{background:#e6f3ec;border-inline-start:5px solid var(--g);border-radius:12px;padding:8px 12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--bd);padding:6px 8px;text-align:center}.tbl th{background:#d7e8dc}
.lv{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px;margin-bottom:10px;border:2px solid;background:#fff;width:100%;text-align:right}
.lv i{font-style:normal;font-size:1.8rem}.lv b{display:block}.lv small{color:var(--mut)}
.lv .st{margin-inline-start:auto;font-weight:700}

.prog{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y)}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 14px;line-height:1.7}
.kk{display:inline-block;font-size:.75rem;background:#e6f3ec;color:var(--g);border-radius:99px;padding:0 10px;margin-bottom:6px}
.op{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:1.02rem}
.op.ok{border-color:var(--ok);background:#e5f6ec}.op.bad{border-color:var(--bad);background:#fde9e9}
.hint{background:#fff6dc;border:1px solid var(--y);border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.res{text-align:center;padding:24px 8px}.res .big{font-size:3.4rem}.res h2{margin:6px 0}
.stars{font-size:2.2rem;letter-spacing:4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat div{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;color:var(--g)}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bd div{background:#fff;border:1px solid var(--y);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem;line-height:1.4}.bd i{display:block;font-style:normal;font-size:1.8rem}
.wis{text-align:center}.wis small{color:var(--mut)}
.btn{display:block;width:100%;text-align:center;border:0;background:linear-gradient(135deg,#1a8350,var(--g));color:#fff;border-radius:14px;padding:12px;font-weight:700;margin-top:10px;text-decoration:none}
.btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.empty{color:var(--mut);text-align:center;padding:20px}
/* درس البطاقات التفاعلية */
.dots2{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}.dots2 button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:#d9d2bd;transition:.2s}.dots2 button.on{width:26px;border-radius:99px;background:var(--y)}.dots2 button.dn{background:var(--ok)}
.deck{position:relative;overflow:hidden;touch-action:pan-y}
.dc{background:#fff;border:1px solid var(--bd);border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(17,61,46,.06);animation:slin .32s ease both}
.dc.rev{animation-name:slinr}
@keyframes slin{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes slinr{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.dc h3{margin:0 0 8px;font-size:1.15rem;color:var(--g);display:flex;align-items:center;gap:8px}.dc h3 em{font-style:normal;background:var(--y);color:#3b2a08;border-radius:99px;font-size:.75rem;padding:0 9px}
.dc h3 svg{width:34px;height:34px;flex:none}
.dc p{margin:8px 0}.dc ul{margin:8px 0;padding-inline-start:20px}.dc li{margin:4px 0}
.fcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fc{display:grid;perspective:700px;border:0;background:none;padding:0;text-align:center}.fc.wide{grid-column:1/-1}
.fc>span{grid-area:1/1;backface-visibility:hidden;transition:transform .45s;border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:78px}
.ff{background:linear-gradient(135deg,#1a8350,#0e6b3c);color:#fff}.ff b{font-size:1rem}.ff small{opacity:.8;font-size:.72rem}
.fb{background:#fff7da;border:1.5px solid var(--y);transform:rotateY(180deg);font-size:.88rem;line-height:1.55;color:var(--ink)}
.fc.on .ff{transform:rotateY(180deg)}.fc.on .fb{transform:rotateY(360deg)}
.chk{background:#eef7f1;border:1.5px dashed #7fb897;border-radius:18px;padding:12px;margin-top:14px}
.ck-h{font-weight:700;color:var(--g);margin-bottom:4px}.ck-q{font-weight:700;margin-bottom:8px}
.ck-o{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:.95rem}
.ck-o.ok{border-color:var(--ok);background:#e5f6ec}.ck-o.bad{border-color:var(--bad);background:#fde9e9}
.ck-f{font-size:.9rem;margin-top:4px}
.dnav{display:flex;gap:10px;margin-top:12px}.dnav button{flex:1;border:0;border-radius:14px;padding:11px;font-weight:700;background:#fff;border:1.5px solid var(--g);color:var(--g)}.dnav button.pri{background:var(--g);color:#fff}.dnav button[disabled]{opacity:.35}
.rq{display:flex;gap:10px;align-items:flex-start;background:#f7f2e1;border-radius:14px;padding:10px 12px;margin:8px 0;width:100%;text-align:right;border:0}.rq i{font-style:normal;width:24px;height:24px;border-radius:50%;border:2px solid var(--g);display:grid;place-items:center;flex:none;color:#fff;font-size:.85rem}.rq.on i{background:var(--ok);border-color:var(--ok)}.rq.on{opacity:.7}
</style>

<script>
(function(){
"use strict";
var D = window.SCI, $ = function (s, r) { return (r || document).querySelector(s); };
var PASS = 0.75, LVN = [{n:"مستكشف",i:"🧭",c:"#0d9488"},{n:"متقدّم",i:"🚀",c:"#ea7a0b"},{n:"المتميّز",i:"🏆",c:"#7c3aed"}];

function ar(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})}
function profile(){try{return JSON.parse(localStorage.getItem("sahaba-portal-profile")||"null")||{}}catch(e){return {}}}
/* ---------- الحالة ---------- */
var KEY="sci8:st", S;
function load(){var d={xp:0,p:{},uq:{},daily:{},last:null,days:[],cert:0,chk:{}},o={};try{o=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}for(var k in d)if(o[k]==null)o[k]=d[k];return o}
S=load();
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
if(S.days.indexOf(today())<0){S.days.push(today());S.days=S.days.slice(-60)}
function P(u,l){var k=u+"-"+l;return S.p[k]||(S.p[k]={lv:[0,0,0],b:0})}
function lessonDone(u,l){return !!P(u,l).b}
function totals(){var t=0,d=0,un=0;D.units.forEach(function(x,u){var c=0;x.lessons.forEach(function(_,l){t++;if(lessonDone(u,l)){d++;c++}});if(c==x.lessons.length)un++});return {t:t,d:d,u:un}}
function level(){return Math.floor(S.xp/100)+1}
function streak(){var n=0,d=new Date();for(;;){var k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(S.days.indexOf(k)<0)break;n++;d.setDate(d.getDate()-1)}return n}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}publish()}
function publish(){try{var t=totals(),b=[],c=[];D.units.forEach(function(x,u){x.lessons.forEach(function(l,i){if(lessonDone(u,i))b.push({i:"🏅",t:l.t})})});
 if(t.d==t.t&&t.t){if(!S.cert)S.cert=Date.now();c.push({t:"إتمام مادة العلوم العامة — الصف الثامن",d:new Date(S.cert).toLocaleDateString("ar")})}
 localStorage.setItem("sahaba-ach:science/8",JSON.stringify({pct:t.t?Math.round(t.d*100/t.t):0,units:{done:t.u,total:D.units.length},certs:c,badges:b,extra:["⭐ "+ar(S.xp)+" نقطة • المستوى "+ar(level()),"🔥 أيام متتالية: "+ar(streak())],updated:new Date().toISOString()}))}catch(e){}}
/* ---------- أيقونات ---------- */
var K='stroke="#1c3d52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';
var IC={
 cell:'<circle cx="32" cy="32" r="23" fill="#cdeccf" '+K+'/><circle cx="27" cy="27" r="9" fill="#b9a4ef" '+K+'/><circle cx="43" cy="39" r="4" fill="#f7a8a8" '+K+'/><circle cx="24" cy="43" r="3.5" fill="#f7e18a" '+K+'/>',
 split:'<circle cx="21" cy="32" r="15" fill="#cdeccf" '+K+'/><circle cx="43" cy="32" r="15" fill="#cdeccf" '+K+'/><circle cx="21" cy="32" r="5.5" fill="#b9a4ef" '+K+'/><circle cx="43" cy="32" r="5.5" fill="#b9a4ef" '+K+'/>',
 bolt:'<path d="M37 5 L15 37 H28 L24 59 L49 25 H35 Z" fill="#ffd54a" '+K+'/>',
 atom:'<ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#5b4bd6" stroke-width="3"/><ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#5b4bd6" stroke-width="3" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#5b4bd6" stroke-width="3" transform="rotate(120 32 32)"/><circle cx="32" cy="32" r="6" fill="#ff9f43" '+K+'/>',
 mol:'<path d="M32 22 L16 44 M32 22 L48 44" '+K+'/><circle cx="32" cy="20" r="11" fill="#ff8a80" '+K+'/><circle cx="15" cy="46" r="8" fill="#fff" '+K+'/><circle cx="49" cy="46" r="8" fill="#fff" '+K+'/>',
 flask:'<path d="M25 6 H39 V22 L55 50 Q59 59 50 59 H14 Q5 59 9 50 L25 22 Z" fill="#fff" '+K+'/><path d="M19 40 H45 L53 52 Q55 57 50 57 H14 Q9 57 11 52 Z" fill="#f5a623" stroke="none"/><circle cx="29" cy="46" r="3" fill="#fff"/><circle cx="38" cy="50" r="2.5" fill="#fff"/><circle cx="46" cy="9" r="2.5" fill="#f5a623"/><circle cx="51" cy="4" r="2" fill="#f5a623"/>',
 wave:'<path d="M4 34 Q11 8 18 34 T32 34 T46 34 T60 34" fill="none" stroke="#1f6fd1" stroke-width="4.5" stroke-linecap="round"/><path d="M4 46 Q11 28 18 46 T32 46 T46 46 T60 46" fill="none" stroke="#6aa7f0" stroke-width="3" stroke-linecap="round"/>',
 plant:'<path d="M19 40 H45 L42 59 H22 Z" fill="#c97b4a" '+K+'/><path d="M32 40 V26" '+K+'/><path d="M32 30 C19 30 13 22 13 12 C27 12 32 19 32 30Z" fill="#6cc04a" '+K+'/><path d="M32 26 C45 26 51 18 51 8 C37 8 32 15 32 26Z" fill="#8fd16a" '+K+'/>'
};
function svg(k,cls){return '<svg viewBox="0 0 64 64" '+(cls?'class="'+cls+'" ':'')+'aria-hidden="true">'+IC[k]+'</svg>'}
var NAV=[["home","الرئيسية",'<path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/>'],["lessons","دروسي",'<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z M12 6v14"/>'],["quizzes","الاختبارات",'<path d="M9 3h6M10 3v6L4 20a1.5 1.5 0 0 0 1.4 2h13.2A1.5 1.5 0 0 0 20 20L14 9V3"/><path d="M7.5 15h9"/>'],["points","نقاطي",'<path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>'],["me","حسابي",'<circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c.8-4.6 4.3-6.5 8.5-6.5s7.7 1.9 8.5 6.5z"/>']];

function topbar(t,back){return '<div class="top"><a class="ib" href="'+(back||"#home")+'" aria-label="رجوع">›</a><h1>'+esc(t)+'</h1><a class="ib" href="../../index.html" aria-label="بوابة الصحابة التعليمية">🏠</a></div>'}

/* ---------- الرئيسية ---------- */
var query="";
