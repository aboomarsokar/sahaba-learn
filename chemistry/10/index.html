<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>الكيمياء — قريباً</title>
<script>(function(){try{var pre=["phy10:","che10:","bio10:","pcb"];Object.keys(localStorage).forEach(function(k){if(pre.some(function(p){return k.indexOf(p)===0})||/^sahaba-ach:(physics|chemistry|biology|science)\//.test(k))localStorage.removeItem(k)});
if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(/^(phy10-|che10-|bio10-|pcb-)/.test(k))caches.delete(k)})});
if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(/\/(physics|chemistry|biology|science)\/10\//.test(r.scope))r.unregister()})});
try{indexedDB.deleteDatabase("pcbflags")}catch(e){}}catch(e){}})();
location.replace("../../index.html");</script></head>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#123C46;color:#fff"><p>تطبيق الكيمياء قيد الإعداد وسيعود قريباً.</p><p><a style="color:#E6C168" href="../../index.html">العودة إلى بوابة الصحابة التعليمية</a></p></body></html>
