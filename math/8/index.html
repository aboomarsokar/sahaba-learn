م اجمع الأضلاع الثلاثة.","حديقة مستطيلة طولها ١٨ م ومساحتها ٢١٦ م². ما طول قطرها؟":"احسب العرض أولاً من المساحة ÷ الطول، ثم طبّق فيثاغورس على المستطيل.","عمود كهرباء ارتفاعه ٧ م يُشدّ منه سلك إلى سطح منزل ارتفاعه ٣ م، ويبعد المنزل عن العمود ٣ م. ما طول السلك؟":"الفرق بين الارتفاعين ضلع في مثلث قائم، والبعد الأفقي ضلع ثانٍ.","مثلث متساوي الساقين طول كلّ من ساقيه ١٣ سم وقاعدته ١٠ سم. ما ارتفاعه المرسوم على القاعدة (وهو ينصّفها)؟":"الارتفاع يقسم المثلث إلى مثلثين قائمين: وتر ١٣ وضلع ٥."}},{"t":"عكس نظرية فيثاغورس","e":["# نشاط ١: هل المثلث قائم الزاوية؟","مثلث أ ب ج أطوال أضلاعه ٩ سم و١٢ سم و١٥ سم. نختبر هل يحقّق نظرية فيثاغورس.","- مربّع أطول ضلع (١٥)² = ٢٢٥ سم²","- مجموع مربّعي الضلعين الآخرين (٩)² + (١٢)² = ٨١ + ١٤٤ = ٢٢٥ سم²","- المجموعان متساويان، فالمثلث يحقّق نظرية فيثاغورس، ونتحقّق بالقياس أنّ زاويته في ب قائمة","# عكس نظرية فيثاغورس","- عكس نظرية فيثاغورس: إذا كانت مساحة المربّع المنشأ على أطول أضلاع المثلث تساوي مجموع مساحتي المربّعين المنشأين على الضلعين الآخرين فإنّ الزاوية المقابلة للضلع الأكبر تكون قائمة.","إذا كان (أ ج)² = (أ ب)² + (ب ج)² فإنّ المثلث أ ب ج قائم الزاوية في ب.","! نبدأ دائماً بمربّع أطول ضلع، ونقارنه بمجموع مربّعي الضلعين الأقصر.","# إذا لم يتحقّق الشرط","في مثلث ضلعاه القصيران ٤ سم و٤ سم وأطول ضلع فيه √٤٨ سم: مربّع أطول ضلع = ٤٨، ومجموع مربّعي الآخرين = ١٦ + ١٦ = ٣٢، والعددان مختلفان.","- إذا كان مربّع الضلع الأطول ≠ مجموع مربّعي الضلعين الآخرين فالمثلث لا يحقّق نظرية فيثاغورس","- نتحقّق بالقياس أنّ هذا المثلث غير قائم الزاوية","# الأعداد الفيثاغورية","- الأعداد الفيثاغورية: هي الأعداد الطبيعية التي تحقّق نظرية فيثاغورس، مثل ٣، ٤، ٥.","|الأعداد|هل هي فيثاغورية؟","|٦، ٨، ١٠|نعم؛ لأنّ ٣٦ + ٦٤ = ١٠٠ = (١٠)²","|٩، ١٣، ٢٠|لا؛ لأنّ ٨١ + ١٦٩ = ٢٥٠ ≠ ٤٠٠","|٧٤، ٤٨، ٥٥|لا؛ لأنّ ٢٣٠٤ + ٣٠٢٥ = ٥٣٢٩ ≠ ٥٤٧٦ = (٧٤)²","! الأعداد ١، ١، √٢ تصلح أطوالاً لمثلث قائم لأنّ ١ + ١ = ٢، لكنها ليست أعداداً فيثاغورية لأنّ √٢ ليس عدداً طبيعياً.","# أمثلة محلولة","? هل تصلح الأطوال ٣٫٦ سم و٤٫٨ سم و٦ سم أضلاعاً لمثلث قائم الزاوية؟ || أطول ضلع ٦: ٦² = ٣٦. (٣٫٦)² + (٤٫٨)² = ١٢٫٩٦ + ٢٣٫٠٤ = ٣٦. المجموعان متساويان، فالمثلث قائم الزاوية.","? هل المثلث الذي أطوال أضلاعه ١١ و٦٠ و٦١ قائم الزاوية؟ || (٦١)² = ٣٧٢١. (١١)² + (٦٠)² = ١٢١ + ٣٦٠٠ = ٣٧٢١. نعم، المثلث قائم الزاوية.","? في دائرة نصف قطرها ١٠ سم، وتر أ ب بعد مركزها م عنه ٦ سم (م ج عمودي على الوتر ويقسمه إلى نصفين). أجد طول الوتر أ ب. || في المثلث القائم م ج أ: (أ ج)² = ١٠² − ٦² = ١٠٠ − ٣٦ = ٦٤ ← أ ج = ٨ سم، وأ ب = ٢ × ٨ = ١٦ سم.","? درج أبعاده: الارتفاع ٢٫٤ م والقاعدة ٣٫٢ م والمنحدر ٤ م. هل زاوية الارتفاع مع القاعدة قائمة؟ || (٢٫٤)² + (٣٫٢)² = ٥٫٧٦ + ١٠٫٢٤ = ١٦ = (٤)². نعم، تحقّق عكس نظرية فيثاغورس فالزاوية قائمة.","# مهمة تعليمية: زاوية الغرفة","باستعمال المتر وحده، نقيس ٣٠ سم من أحد الجدارين عند الزاوية و٤٠ سم من الجدار الآخر، فإذا كان البعد بين النقطتين ٥٠ سم فالزاوية قائمة لأنّ ٣٠² + ٤٠² = ٥٠².","! الأعداد ٣ و٤ و٥ وأضعافها (٦، ٨، ١٠) أعداد فيثاغورية تفيد النجّار في اختبار الزوايا القائمة."],"q":["- ما نصّ عكس نظرية فيثاغورس؟ وماذا نقارن عند تطبيقه؟","- ما المقصود بالأعداد الفيثاغورية؟ اذكر ثلاثية منها.","- هل المثلث الذي أطواله ٥ و١٢ و١٣ سم قائم الزاوية؟ علّل إجابتك.","- هل تصلح الأطوال ٤ و٥ و٦ سم أضلاعاً لمثلث قائم الزاوية؟ لماذا؟","- كيف تتأكّد باستعمال المتر وحده أنّ زاوية غرفة قائمة؟"],"quiz":[{"l":0,"k":"n","q":"ما نصّ عكس نظرية فيثاغورس؟","o":["إذا كان مثلث قائماً فمربّع وتره يساوي مجموع مربّعي ضلعيه فقط","إذا كان مربّع أطول ضلع = مجموع مربّعي الضلعين الآخرين فالمثلث قائم الزاوية","إذا كان أحد أضلاع المثلث ضعف الآخر فالمثلث قائم","إذا تساوى ضلعان في مثلث فهو قائم الزاوية"],"a":1},{"l":0,"k":"n","q":"أيّ زاوية تكون قائمة في المثلث الذي يحقّق عكس نظرية فيثاغورس؟","o":["الزاوية المقابلة للضلع الأصغر","أيّ زاوية في المثلث","الزاوية المجاورة للضلع الأكبر","الزاوية المقابلة للضلع الأكبر"],"a":3},{"l":0,"k":"n","q":"ماذا تُسمّى الأعداد الطبيعية التي تحقّق نظرية فيثاغورس؟","o":["أعداداً فيثاغورية","أعداداً أولية","أعداداً نسبية","أعداداً مربّعة"],"a":0},{"l":0,"k":"n","q":"أيّ الثلاثيات الآتية فيثاغورية؟","o":["٣، ٤، ٦","٢، ٣، ٤","٣، ٤، ٥","٤، ٥، ٦"],"a":2},{"l":0,"k":"n","q":"ع سم (ج منتصف الوتر). ما طول أ ب؟":"في المثلث القائم م ج أ جد أ ج ثم ضاعفه لأنّ ج منتصف الوتر.","مثلث أطوال أضلاعه ١٥ و٢٠ و٢٥ سم. ما مساحته؟":"أثبت أولاً أنه قائم، ثم استعمل ضلعي القائمة: ½ × ١٥ × ٢٠."}},{"t":"تطابق المثلثات","e":["# تعريف التطابق","- المثلثان المتطابقان: هما مثلثان أضلاعهما المتناظرة متساوية، وقياسات زواياهما المتناظرة متساوية.","إذا تطابق المثلثان أ ب ج و م ل ك فإنّ الضلع أ ب يناظر الضلع م ل، والزاوية أ تناظر الزاوية م، وهكذا لكلّ ضلعين وزاويتين متناظرين.","! لا يلزم قياس الأضلاع والزوايا الستّة كلّها؛ يكفي التحقّق من إحدى حالات التطابق الأربع.","# الحالة الأولى: ثلاثة أضلاع (ض، ض، ض)","- تتطابق مثلثان إذا كانت أطوال الأضلاع المتناظرة في المثلثين متساوية.","? في الشكل: أ د = ب هـ، ب د = ج هـ، وب منتصف أ ج. أثبت أنّ المثلثين أ د ب و ب هـ ج متطابقان. || أ د = ب هـ (معطى)، ب د = ج هـ (معطى)، أ ب = ب ج لأنّ ب منتصف أ ج. إذن الأضلاع الثلاثة المتناظرة متساوية، فالمثلثان متطابقان وفق (ض، ض، ض).","# الحالة الثانية: ضلعان وزاوية محصورة (ض، ز، ض)","- تتطابق مثلثان إذا تساوى طولا ضلعين في كلّ منهما، وتساوى قياس الزاوية المحصورة بين هذين الضلعين في كلّ منهما.","? في مثلثين: أ ج = ج هـ، ب ج = ج د، وزاوية أ ج ب = زاوية هـ ج د (تقابل بالرأس). أيّ حالة تثبت التطابق؟ || ضلعان متساويان والزاوية المحصورة بينهما متساوية، فالمثلثان متطابقان وفق الحالة الثانية (ض، ز، ض).","! الزاوية المحصورة هي الزاوية التي يكون ضلعا المثلث المعطيان ضلعين لها.","# الحالة الثالثة: زاويتان وضلع (ز، ض، ز)","- تتطابق مثلثان إذا تساوى فيهما طول ضلع، وقياس الزاويتين المرسومتين عند نهايتي ذلك الضلع.","في المثلثين أ ب ج و د ن و: أ ب = د ن = ٢ سم، وزاوية أ = زاوية د = ٤٠°، وزاوية ب = زاوية ن = ٧٥°، فالمثلثان متطابقان وفق (ز، ض، ز)، ويمكن لباسل استعمالهما في زخرفة لوحة.","? مثلثان متطابقان فيهما زاويتان ٥٠° و٣٥°. ما قياس الزاوية الثالثة؟ || مجموع زوايا المثلث ١٨٠°، فالثالثة = ١٨٠° − (٥٠° + ٣٥°) = ٩٥°.","# الحالة الرابعة: وتر وضلع وقائمة","- تتطابق مثلثان قائما الزاوية إذا تساوى طول ضلع ووتر في أحدهما مع نظيريهما في المثلث الآخر.","? أ ب ج مثلث متساوي الساقين (أ ب = أ ج)، وأ هـ عمودي على ب ج. أبحث في تطابق المثلثين أ هـ ج و أ هـ ب. || الوتران أ ب = أ ج (معطى)، والضلع أ هـ مشترك، والزاويتان عند هـ قائمتان. فالمثلثان متطابقان وفق (وتر، ضلع، قائمة).","# كيف أختار حالة التطابق","|المعطيات المتساوية|الحالة","|ثلاثة أضلاع|(ض، ض، ض)","|ضلعان والزاوية المحصورة بينهما|(ض، ز، ض)","|زاويتان وضلع بينهما|(ز، ض، ز)","|وتر وضلع في مثلثين قائمين|(وتر، ضلع، قائمة)","# مهمة تعليمية","رسم رامي القطع ج د، ج أ، ج ب، ورسم أ ب عموداً على ب ج، وأ د عموداً على د ج، مع أ د = أ ب. المثلثان أ ج ب و أ ج د قائما الزاوية، وفيهما أ ب = أ د والوتر أ ج مشترك، فهما متطابقان، وتنتج من التطابق أنّ ج أ ينصّف الزاوية ب ج د.","? في الشكل: ب د ينصّف الزاوية ب، أ ب = ج ب = ١٨ سم، أ د = ٥ سم. أثبت تطابق أ ب د و ج ب د، ثم أجد د ج. || أ ب = ج ب (معطى)، وزاوية أ ب د = زاوية ج ب د (ب د ينصّف الزاوية)، وب د ضلع مشترك. فالمثلثان متطابقان وفق (ض، ز، ض). ومن التطابق د ج = أ د = ٥ سم."],"q":["- ما المقصود بتطابق مثلثين؟","- اذكر حالات التطابق الأربع ومعنى كلّ منها.","- ما الزاوية المحصورة بين ضلعين؟ ولماذا نحتاج إليها في الحالة (ض، ز، ض)؟","- مثلثان متطابقان فيهما زاويتان ٦٠° و٥٥°، ما قياس الزاوية الثالثة في كلّ منهما؟","- مثلثان قائما الزاوية، وتر أحدهما ١٠ سم وأحد ضلعيه ٦ سم، وهما كذلك في الثاني. هل هما متطابقان؟ ولماذا؟"],"quiz":[{"l":0,"k":"n","q":"ما تعريف المثلثين المتطابقين؟","o":["لهما المساحة نفسها فقط","أضلاعهما المتناظرة متساوية وزواياهما المتناظرة متساوية","لهما قياسات الزوايا نفسها فقط","لهما المحيط نفسه فقط"],"a":1},{"l":0,"k":"n","q":"ماذا يعني الرمز (ض، ض، ض) في حالات التطابق؟","o":["تساوي ضلعين وزاوية","تساوي زاويتين وضلع","تساوي وتر وضلع في مثلث قائم","تساوي ثلاثة أضلاع متناظرة"],"a":3},{"l":0,"k":"n","q":"ماذا يعني الرمز (ض، ز، ض)؟","o":["ضلعان والزاوية المحصورة بينهما","ضلع وزاويتان","ثلاثة أضلاع","ثلاث زوايا"],"a":0},{"l":0,"k":"n","q":"ماذا يعني الرمز (ز، ض، ز)؟","o":["ضلعان وزاوية بينهما","ثلاث زوايا","زاويتان والضلع الواقع بينهما","ثلاثة أضلاع"],"a":2},{"l":0,"k":"n","q":"تتطابق مثلثان قائما الزاوية إذا تساوى فيهما:","o":["ضلع القائمة فقط","محيطاهما فقط","وتر وضلع من ضلعي القائمة","زاوي وازيين","- زاوية ب هـ د = زاوية ب أ ج لأنهما متناظرتان أيضاً","- الزاوية ب مشتركة بين المثلثين، فالزوايا الثلاث المتناظرة متساوية","- لذلك المثلثان هـ ب د و أ ب ج متشابهان، ويُكتب ذلك بالرمز ∼ ويُقرأ «يشابه»","! نلاحظ أنّ المثلثين المتشابهين قد يختلفان في الحجم ويتساويان في الزوايا.","# تعريف التشابه","- التشابه بالزوايا: يتشابه مثلثان إذا تساوت قياسات الزوايا المتناظرة في المثلثين.","- التشابه بالأضلاع: يتشابه مثلثان إذا كانت أطوال الأضلاع المتناظرة فيهما متناسبة.","|نوع التحقّق|ما نفحصه","|بالزوايا|الزوايا المتناظرة متساوية","|بالأضلاع|نسب الأضلاع المتناظرة متساوية","# نشاط ٢: تناسب الأضلاع","مثلثان: الأول أ ب ج أضلاعه أ ب = ٥ سم، ب ج = ١٥ سم، أ ج = ١٢ سم، والثاني س ص ع أضلاعه س ص = ٤ سم، ص ع = ١٢ سم، س ع = ٩٫٦ سم.","? أحسب النسب أ ب / س ص و ب ج / ص ع و أ ج / س ع، ماذا تلاحظ؟ || أ ب / س ص = ٥/٤ = ١٫٢٥، ب ج / ص ع = ١٥/١٢ = ١٫٢٥، أ ج / س ع = ١٢/٩٫٦ = ١٫٢٥. النسب الثلاث متساوية، فالأضلاع المتناظرة متناسبة والمثلثان متشابهان (أ ب ج تكبير لـ س ص ع).","# نشاط ٣: مستقيم موازٍ لأحد الأضلاع","في المثلث ل م ن رُسم هـ و موازياً لـ م ن، حيث ل هـ = ٩ سم، هـ م = ٣ سم، ل و = ٩ سم، و ن = ٣ سم، هـ و = ١٢ سم، م ن = ١٦ سم.","- زاوية م = زاوية هـ، وزاوية ن = زاوية و (متناظرتان)، والزاوية ل مشتركة، فالمثلثان متشابهان","- ل م = ٩ + ٣ = ١٢ سم، ونسبة ل م / ل هـ = ١٢/٩ = ٤/٣","- م ن / هـ و = ١٦/١٢ = ٤/٣، وكذلك ل ن / ل و = ١٢/٩ = ٤/٣","! أطوال الأضلاع المتناظرة في المثلثين المتشابهين متناسبة، وتساوي النسبة نفسها.","# نشاط ٤: ارتفاع إشارة المرور","وضع جهاد مرآة مستوية تبعد ١٢ م عن أسفل الإشارة، ووقف على بُعد ٣ م من المرآة وطوله ١٫٥ م. زاوية السقوط تساوي زاوية الانعكاس، فيتكوّن مثلثان متشابهان.","? أجد ارتفاع إشارة المرور ع. || المثلثان متشابهان: ١٢/٣ = ع/١٫٥ ← ٣ × ع = ١٢ × ١٫٥ = ١٨ ← ع = ٦ م.","# أمثلة محلولة","? المثلثان س ص ع و أ ب ج متشابهان، وأ ب يناظر س ص: أ ب = ٦، س ص = ٩، ص ع = ١٢. أجد ب ج. || ب ج / ص ع = أ ب / س ص ← ب ج / ١٢ = ٦/٩ ← ب ج = ١٢ × ٦ ÷ ٩ = ٨.","? في المثلث أ ب ج، س ص موازٍ لـ ب ج حيث أ س = ٢ سم، أ ب = ٦ سم، ب ج = ١٢ سم. أجد س ص. || المثلثان أ س ص و أ ب ج متشابهان: س ص / ب ج = أ س / أ ب ← س ص / ١٢ = ٢/٦ ← س ص = ٤ سم.","# مهمة تعليمية: مصباح وظلّ","مصباح إنارة ارتفاعه ٣ م على عمود، وشخص طوله ١٫٨ م يسير بجانب العمود.","? أجد طول ظلّ الشخص عندما يكون على بُعد ٥ م من العمود. || ليكن طول الظلّ س. المثلث الكبير (العمود وطرف الظلّ) يشابه المثلث الصغير (الشخص وظلّه): ٣ / ١٫٨ = (٥ + س) / س ← ٣س = ١٫٨(٥ + س) = ٩ + ١٫٨س ← ١٫٢س = ٩ ← س = ٧٫٥ م.","? أجد بُعد الشخص عن العمود إذا كان طول ظلّه ٣ م. || ٣ / ١٫٨ = (ب + ٣) / ٣ ← ب + ٣ = ٣ × ٣ ÷ ١٫٨ = ٥ ← ب = ٢ م."],"q":["- متى يتشابه مثلثان؟ اذكر طريقتين للتحقّق.","- ما الفرق بين المثلثين المتطابقين والمتشابهين؟","- المثلثان أ ب ج و س ص ع متشابهان، أ ب = ٦ سم، س ص = ٩ سم، ب ج = ٨ سم، أجد ص ع.","- شخص طوله ١٫٥ م يظلّه ٢ م، وفي اللحظة نفسها ظلّ عمود ١٢ م، ما ارتفاع العمود؟","- لماذا يكفي تساوي زاويتين لإثبات تشابه مثلثين؟"],"quiz":[{"l":0,"k":"n","q":"متى يتشابه مثلثان بحسب الرزمة؟","o":["إذا تساوى محيطاهما","إذا تساوت قياسات الزوايا المتناظرة فيهما","إذا كان لهما ضلع مشترك فقط","إذا كان لهما عدد الأضلاع نفسه"],"a":1},{"l":0,"k":"n","q":"أيّ شرط آخر يكفي لتشابه مثلثين؟","o":["أن تتساوى مساحتاهما","أن يتساوى طول أقصر ضلع فيهما فقط","أن يكون أحدهما قائماً","أن تكون أطوال الأضلاع المتناظرة متناسبة"],"a":3},{"l":0,"k":"n","q":"ما الرمز الذي يُستعمل للدلالة على التشابه؟","o":["∼","=","≠","⊥"],"a":0},{"l":0,"k":"n","q":"المستقيم الموازي لأحد أضلاع المثلث والذي يقطع الضلعين الآخرين يُكوّن:","o":["مثلثاً يطابقه دائماً","شبه منحرف فقط","مثلثاً يشابه المثلث الأصلي","دائرة"],"a":2},{"l":0,"k":"n","q":"عند رسم مستقيم موازٍ لـ ب ج داخل المثلث أ ب ج، فالزاويتان المتناظرتان بين المتوازيين:","o":["مجموعهما ٩٠°","مجموعهما ١٨٠°","متساويتان","مختلفتان دائماً"],"a":2},{"l":0,"k":"n","q":"في المثلثين المتشابهين تكون أطوال الأضلاع المتناظرة:","o":["متناسبة","متساوية دائماً","مختلفة بلا علاقة","مجموعها ثابت"],"a":0},{"l":0,"k":"n","q":"الزاوية التي تشترك بين المثلث الصغير والكبير عند رسم مستقيم موازٍ للقاعدة هي:","o":["زاوية القاعدة اليمنى","زاوية القاعدة اليسرى","لا توجد زاوية مشتركة","زاوية الرأس"],"a":3},{"l":0,"k":"n","q": حديقة في أسبوع ٢٤٠٠، وزاوية قطاع الخميس ٣٠°. كم زائراً يوم الخميس؟",["٣٠٠","٢٠٠","٨٠","١٢٠"],1],[2,"لثماني قيم مجموعها ٣٢ ومجموع مربّعاتها ١٦٠. ما التباين؟",["٢","٤","٥","١٦"],1],[2,"أيّ القيم الآتية لا يمكن أن تكون تباين مجموعة؟",["٠","٤","٠٫٥","−٤"],3],[2,"مجموعتان لهما المدى نفسه. ما المقياس الأدقّ للمقارنة بين تشتّتهما؟",["الانحراف المعياري","المدى","أكبر قيمة","عدد القيم"],0]],"lessons":[{"t":"تمثيل البيانات بطريقة القطاعات الدائرية","e":["# ما القطاع الدائري؟","- القطاع الدائري: هو الجزء المحصور بين نصفي قطرين وقوس في دائرة.","- زاوية القطاع الدائري: = (عدد عناصر القطاع ÷ العدد الكلي) × ٣٦٠°","- مجموع زوايا القطاعات الدائرية: لجميع البيانات = ٣٦٠°","! نستعمل القطاعات الدائرية لنقارن أجزاء البيانات بالكلّ، فكلّما كبر عدد العناصر كبرت زاوية قطاعها.","# خطوات التمثيل بالقطاعات الدائرية","- نجمع القيم كلّها لنحصل على العدد الكلي","- نحسب زاوية كلّ قطاع من القانون: (القيمة ÷ المجموع) × ٣٦٠°","- نتأكّد أنّ مجموع الزوايا ٣٦٠°","- نرسم دائرة ونقسمها بالمنقلة إلى قطاعات بحسب الزوايا، ونلوّن كلّ قطاع ونكتب اسمه","# نشاط ١: طلبة الكليات","|الكلية|العدد","|الهندسة|١٢٠","|العلوم|١٨٠","|الآداب|٢٤٠","|التجارة|١٨٠","المجموع الكلي = ١٢٠ + ١٨٠ + ٢٤٠ + ١٨٠ = ٧٢٠ طالباً.","? أحسب زاوية قطاع كلّ كلّية. || الهندسة: (١٢٠/٧٢٠) × ٣٦٠° = ٦٠°. العلوم: (١٨٠/٧٢٠) × ٣٦٠° = ٩٠°. الآداب: (٢٤٠/٧٢٠) × ٣٦٠° = ١٢٠°. التجارة: (١٨٠/٧٢٠) × ٣٦٠° = ٩٠°. المجموع ٦٠ + ٩٠ + ١٢٠ + ٩٠ = ٣٦٠° فالحساب صحيح.","# نشاط ٢: صفوف المدرسة","تضمّ مدرسة ٣ صفوف دراسية، وعدد طالباتها ٢٤٠ طالبة. زاوية قطاع الصف الثاني عشر ٩٠°، وزاوية قطاع الصف العاشر ١٥٠°.","? أجد عدد طالبات الصف الحادي عشر. || زاوية الصف الحادي عشر = ٣٦٠° − (٩٠° + ١٥٠°) = ١٢٠°. ومن القانون: ١٢٠° = (العدد ÷ ٢٤٠) × ٣٦٠° ← العدد = ١٢٠ × ٢٤٠ ÷ ٣٦٠ = ٨٠ طالبة.","! إذا عُرفت زاويتا قطاعين من ثلاثة فالثالث = ٣٦٠° ناقص مجموع الزاويتين، ثم نحسب العدد من القانون.","# تمارين محلولة","? أنشطة مؤسسة شبابية خلال ٦ أشهر: رياضي ١٠، ثقافي ٤، اجتماعي ٦، تعليمي ٨، فني ٢. أجد زاوية كلّ قطاع. || المجموع = ١٠ + ٤ + ٦ + ٨ + ٢ = ٣٠. رياضي: ١٠/٣٠ × ٣٦٠° = ١٢٠°. ثقافي: ٤/٣٠ × ٣٦٠° = ٤٨°. اجتماعي: ٦/٣٠ × ٣٦٠° = ٧٢°. تعليمي: ٨/٣٠ × ٣٦٠° = ٩٦°. فنّي: ٢/٣٠ × ٣٦٠° = ٢٤°. المجموع = ٣٦٠°.","? بلغ عدد مشجّعي فريق في خمس مباريات ٤٨٠٠ متفرّج، وكانت زاوية قطاع المباراة الرابعة ١٢٠°. ما عدد مشجّعيه في المباراة الرابعة؟ || العدد = (١٢٠/٣٦٠) × ٤٨٠٠ = ١٦٠٠ متفرّج.","? زاوية قطاع زوّار حديقة حيوان في اليوم الثالث ٦٠°، وعدد زوّارها في ذلك اليوم ٢٠٠ شخص. ما عدد زوّار الأسبوع؟ || ٦٠° = (٢٠٠ ÷ العدد الكلي) × ٣٦٠° ← العدد الكلي = ٢٠٠ × ٣٦٠ ÷ ٦٠ = ١٢٠٠ زائر.","? تقدّم ٦٠ طالباً لامتحان اللغة الإنجليزية وحصل ١٢ منهم على العلامة الكاملة. ما زاوية القطاع الذي يمثّلهم؟ || (١٢/٦٠) × ٣٦٠° = ٧٢°."],"q":["- ما القطاع الدائري؟ وكم يساوي مجموع زوايا القطاعات؟","- اكتب قانون زاوية القطاع الدائري.","- بيانات: ٤٠ كتاباً علمياً و٦٠ أدبياً و١٠٠ تاريخياً. أجد زاوية كلّ قطاع.","- في مدرسة ٣٠٠ طالب، زاوية قطاع الصف الثامن ١٢٠°. كم طالباً في الصف الثامن؟","- ما فائدة التمثيل بالقطاعات الدائرية مقارنة بالجدول؟"],"quiz":[{"l":0,"k":"n","q":"ما القطاع الدائري؟","o":["الجزء المحصور بين وترين في دائرة","الجزء المحصور بين نصفي قطرين وقوس في دائرة","الدائرة كاملة","نصف قطر فقط"],"a":1},{"l":0,"k":"n","q":"ما قانون زاوية القطاع الدائري؟","o":["(العدد الكلي ÷ عدد عناصر القطاع) × ٣٦٠°","عدد عناصر القطاع × ١٨٠°","عدد عناصر القطاع + ٣٦٠°","(عدد عناصر القطاع ÷ العدد الكلي) × ٣٦٠°"],"a":3},{"l":0,"k":"n","q":"كم يساوي مجموع زوايا القطاعات الدائرية لجميع البيانات؟","o":["٣٦٠°","١٨٠°","٩٠°","٢٧٠°"],"a":0},{"l":0,"k":"n","q":"قطاع دائري زاويته ١٨٠° يمثّل:","o":["ربع البيانات","كل البيانات","نصف البيانات","ثلث البيانات"],"a":2},{"l":0,"k":"n","q":"يستعمل التمثيل بالقطاعات الدائرية خاصة لـ:","o":["حساب الوسط الحسابي فقط","رسم المثلثات","مقارنة أجزاء البيانات بالكلّ","قياس الزوايا فقط"],"a":2},{"l":0,"k":"n","q":"كلّما زادت قيمة عنصر ما بالنسبة للمجموع فإنّ زاوية قطاعه:","o":["تكبر","تصغر","تبقى ٣٦٠°","تصبح صفراً"],"a":0},{"l":0,"k":"n","q":"ما الأداة التي تُستعمل لرسم القطاعات بالزوايا المحسوبة؟","o":["المسطرة فقط","الفرجار فقط","المثلث القائم","المنقلة"],"a":3},{"l":0,"k":"n","q":"أيّ الخطوات ال وجب.","# نشاط ٣: القيم ٠، ١، ٢، ٣، ٤","? أجد التباين والانحراف المعياري للقيم ٠، ١، ٢، ٣، ٤. || ن = ٥، مجموع س = ١٠ ← الوسط س̄ = ١٠/٥ = ٢. مربّعات القيم: ٠، ١، ٤، ٩، ١٦ فمجموع س² = ٣٠. التباين σ² = (٣٠ − ٥ × ٢²) ÷ ٥ = (٣٠ − ٢٠) ÷ ٥ = ٢. الانحراف المعياري σ = √٢.","# نشاط ٤ ونشاط ٥","? عند إيجاد الانحراف المعياري لثماني قيم وُجد أنّ مجموع س = ٢٤ ومجموع س² = ٨٠. || س̄ = ٢٤/٨ = ٣. التباين = (٨٠ − ٨ × ٣²) ÷ ٨ = (٨٠ − ٧٢) ÷ ٨ = ٨ ÷ ٨ = ١. الانحراف المعياري = √١ = ١.","? سُجّلت سنوات الخبرة لطاقم روضة أطفال: ١، ٢، ٣، ٤، ٥، ٦، ٧. أجد المدى والانحراف المعياري. || المدى = ٧ − ١ = ٦ سنوات. ن = ٧، مجموع س = ٢٨ فالوسط ٤. مجموع س² = ١ + ٤ + ٩ + ١٦ + ٢٥ + ٣٦ + ٤٩ = ١٤٠. التباين = (١٤٠ − ٧ × ١٦) ÷ ٧ = (١٤٠ − ١١٢) ÷ ٧ = ٤. الانحراف المعياري = ٢ سنة.","! التباين والانحراف المعياري يأخذان في الاعتبار جميع القيم، ويعطيان وصفاً أدق لتشتّت البيانات، ولذا فهما من أكثر مقاييس التشتّت استخداماً.","# تمارين محلولة","? أعمار موظفين في دائرة حكومية: ٢٨، ٣٤، ٤٦، ٥٠، ٣٢. أجد المدى والتباين والانحراف المعياري. || المدى = ٥٠ − ٢٨ = ٢٢. الوسط = ١٩٠/٥ = ٣٨. مجموع س² = ٧٨٤ + ١١٥٦ + ٢١١٦ + ٢٥٠٠ + ١٠٢٤ = ٧٥٨٠. التباين = (٧٥٨٠ − ٥ × ١٤٤٤) ÷ ٥ = (٧٥٨٠ − ٧٢٢٠) ÷ ٥ = ٧٢. الانحراف المعياري = √٧٢ (تقريباً ٨٫٥).","? لثماني قيم مجموعها ٣٢ ومجموع مربّعاتها ١٤٤. أجد التباين والانحراف المعياري. || س̄ = ٣٢/٨ = ٤. التباين = (١٤٤ − ٨ × ١٦) ÷ ٨ = (١٤٤ − ١٢٨) ÷ ٨ = ٢. الانحراف المعياري = √٢.","? مدى ١٠ قيم يساوي ١٣ وأصغرها −٦. ما أكبرها؟ || أكبر قيمة = المدى + أصغر قيمة = ١٣ + (−٦) = ٧.","? تباين مجموعة قيم يساوي ٢٥، ووسطها الحسابي يزيد عن انحرافها المعياري بمقدار ٦٠. ما وسطها؟ || الانحراف المعياري = √٢٥ = ٥، فالوسط = ٥ + ٦٠ = ٦٥.","# مهمة تعليمية","? أكتب ست قيم مداها وتباينها يساويان صفراً. || نكتب ست قيم متساوية مثل ٧، ٧، ٧، ٧، ٧، ٧؛ فالمدى = ٧ − ٧ = ٠ والوسط ٧ وكلّ انحراف ٠ فالتباين = ٠."],"q":["- عرّف المدى. ولماذا لا يكفي وحده لوصف التشتّت؟","- اكتب صيغة التباين وعلاقته بالانحراف المعياري.","- جد المدى والتباين والانحراف المعياري للقيم ٢، ٤، ٤، ٤، ٥، ٥، ٧، ٩.","- لثماني قيم مجموعها ٣٢ ومجموع مربّعاتها ١٤٤، جد ا ١٣","−٤ ± √١٣"],"a":3},{"l":2,"k":"p","q":"جذرا المعادلة ص² + ٣ص − ١٠ = ٠ بإكمال المربع هما:","o":["−٢ و ٥","١ و −١٠","٢ و −٥","٢ و ٥"],"a":2},{"l":2,"k":"p","q":"جذرا المعادلة ٢س² + ٥س − ٣ = ٠ هما:","o":["−١/٢ و ٣","٣ و ١/٢","١/٢ و −٣","٥/٤ و −٧/٤"],"a":2},{"l":2,"k":"n","q":"لماذا لا يوجد حلّ حقيقي للمعادلة س² = −٩؟","o":["لأن الجذر التربيعي للعدد ٩ غير موجود","لأن س = −٣ فقط","لأن المعادلة من الدرجة الثالثة","لأن مربّع أيّ عدد حقيقي لا يكون سالباً"],"a":3},{"l":2,"k":"p","q":"إذا كانت س = ٠٫١٦ ف² وكانت س = ٤ فإن ف (البعد الأفقي) يساوي:","o":["٢٥ م","٥ م","٠٫٥ م","٤ م"],"a":1},{"l":2,"k":"p","q":"جذرا المعادلة س² − ١٠س + ٢٥ = ١١ هما:","o":["٥ ± √١١","٥ ± ١١","−٥ ± √١١","١٠ ± √١١"],"a":0},{"l":2,"k":"p","q":"عدد الحلول الحقيقية للمعادلة (س − ٥)² = −٤ هو:","o":["١","٢","صفر","٤"],"a":2},{"l":2,"k":"p","q":"إذا أُضيف ٩ إلى طرفَي المعادلة س² + ٦س = ٢ فإن الطرف الأيمن يصبح:","o":["٩","١١","٢","١٨"],"a":1},{"l":2,"k":"p","q":"أيّ العبارات الآتية مربّع كامل؟","o":["س² + ١٢س + ١٢","س² + ١٢س + ٣٦","س² + ١٢س + ٦","س² + ١٢س + ٢٤"],"a":1}],"hints":{"لإكمال المربع في س² + ب س نُضيف إلى الطرفين:":"نضيف مربّع نصف معامل س.","جذرا المعادلة (س − ٤)² = ٨١ هما:":"س − ٤ = ±٩.","بعد إكمال المربع تصبح المعادلة س² + ٦س − ٢ = ٠ على الصورة:":"انقل −٢ إلى الطرف الآخر ثم أضف ٩ للطرفين.","جذرا المعادلة س² + ٨س + ١٦ = ١٣ هما:":"الطرف الأيسر مربّع كامل (س + ٤)².","جذرا المعادلة ص² + ٣ص − ١٠ = ٠ بإكمال المربع هما:":"أضف (٣/٢)² = ٩/٤ للطرفين.","جذرا المعادلة ٢س² + ٥س − ٣ = ٠ هما:":"اقسم على ٢ ثم أضف (٥/٤)² = ٢٥/١٦.","إذا كانت س = ٠٫١٦ ف² وكانت س = ٤ فإن ف (البعد الأفقي) يساوي:":"ف² = ٤ ÷ ٠٫١٦ = ٢٥، ولا نقبل البعد السالب.","أيّ العبارات الآتية مربّع كامل؟":"المربّع الكامل (س + هـ)² = س² + ٢هـ س + هـ²."}},{"t":"حلّ المعادلة التربيعية بالقانون العام","e":["# مميّز المعادلة التربيعية","- المميّز: المقدار ب² − ٤أجـ للمعادلة التربيعية أس² + ب س + جـ = ٠، ويُحدّد عدد الحلول (الجذور) لتلك المعادلة","قبل أن نحلّ المعادلة نحسب مميّزها لنعرف كم جذراً حقيقياً لها، ولا نحتاج لذلك إلى حلّها كاملةً.","|قيمة المميّز|عدد الجذور الحقيقية|نوع الجذور","|موجب (ب² − ٤أجـ > ٠)|جذران|حقيقيان مختلفان","|يساوي صفراً (ب² − ٤أجـ = ٠)|جذر واحد|مكرّر (الجذران متساويان)","|سالب (ب² − ٤أجـ < ٠)|لا يوجد|لا حلّ في مجموعة الأعداد الحقيقية","! عندما يكون المميّز سالباً لا يوجد جذر حقيقي، لأن الجذر التربيعي لعدد سالب ليس عدداً حقيقياً.","# القانون العام","يمكن إيجاد جذور المعادلة أس² + ب س + جـ = ٠ (أ ≠ ٠) إن أمكن حلّها باستخدام القانون العام: س = (−ب ± √(ب² − ٤أجـ)) ÷ ٢أ","! حدّد أ وب وجـ بإشاراتها أولاً (ومنها −ب وب²)، ثم احسب المميّز، ثم عوّض في القانون.","# أمثلة محلولة","? أجد المميّز وجذور المعادلة: س² + ٥س + ٤ = ٠ || أ = ١، ب = ٥، جـ = ٤. المميّز = ٢٥ − ٤ × ١ × ٤ = ٢٥ − ١٦ = ٩ (موجب: جذران مختلفان). بالتحليل (س + ٤)(س + ١) = ٠ ومنها س = −٤ أو س = −١.","? أجد المميّز وجذور المعادلة: ٤ص² + ١٢ص + ٩ = ٠ || أ = ٤، ب = ١٢، جـ = ٩. المميّز = ١٤٤ − ٤ × ٤ × ٩ = ١٤٤ − ١٤٤ = ٠ (جذر واحد مكرّر). نحلّل: (٢ص + ٣)² = ٠ ومنها ص = −٣/٢.","? أجد المميّز وجذور المعادلة: س² − ٢س + ٣ = ٠ || أ = ١، ب = −٢، جـ = ٣. المميّز = (−٢)² − ٤ × ١ × ٣ = ٤ − ١٢ = −٨ (سالب). لا يوجد جذور حقيقية.","? أحلّ بالقانون العام: ٢س² − ٥س − ٣ = ٠ || أ = ٢، ب = −٥، جـ = −٣. المميّز = ٢٥ − ٤(٢)(−٣) = ٢٥ + ٢٤ = ٤٩. س = (٥ ± √٤٩) ÷ ٤ = (٥ ± ٧) ÷ ٤. إمّا س = ١٢/٤ = ٣، أو س = −٢/٤ = −١/٢.","? أحلّ بالقانون العام: ٢ص² + ١ = ٦ص || نرتّب: ٢ص² − ٦ص + ١ = ٠، أ = ٢، ب = −٦، جـ = ١. المميّز = ٣٦ − ٨ = ٢٨. ص = (٦ ± √٢٨) ÷ ٤ = (٣ ± √٧) ÷ ٢.","# مسألة حياتية","? يمكن تمثيل ارتفاع كرة بالمعادلة ع = −٥ز² + ١٠ز + ١٥ حيث ز الزمن بالثواني. متى تصل الكرة إلى الأرض (ع = ٠)؟ || −٥ز² + ١٠ز + ١٥ = ٠، نقسم على −٥: ز² − ٢ز − ٣ = ٠. المميّز = ٤ + ١٢ = ١٦. ز = (٢ ± ٤) ÷ ٢ فتكون ز = ٣ أو ز = −١. نرفض الزمن السالب، فتصل الكرة إلى الأرض بعد ٣ ثوانٍ."],"q":["- ما المقصود بمميّز المعادلة التربيعية؟ وماذا تخبرنا قيمته؟","- اكتب القانون العام لحلّ المعادلة التربيعية.","- أجد مميّز المعادلة ٥س² + ٣س + ١ = ٠ وأحدّد عدد جذورها.","- أحلّ المعادلة ٤س² − ١٢س + ٥ = ٠ مستخدماً القانون العام.","- ما قيمة ك التي تجعل جذرَي المعادلة ٣س² − ٦س + ك = ٠ متساويين؟"],"quiz":[{"l":0,  ص + ص²) − ص(٤س² + ٢س ص + ص²) = ٨س³ + ٤س²ص + ٢س ص² − ٤س²ص − ٢س ص² − ص³ = ٨س³ − ص³. نلاحظ أن الحدود الوسطى تحذف بعضها وتبقى ٨س³ − ص³ فقط.","# فرق مكعبين","- الفرق بين مكعبين: المقدار الجبري أ³ − ب³، ويُحلَّل وفقاً للقاعدة: أ³ − ب³ = (أ − ب)(أ² + أب + ب²)","! في العامل الثلاثي لفرق المكعبين كلّ الإشارات موجبة: أ² + أب + ب²، والعامل الأول (أ − ب) يحمل إشارة المقدار نفسها.","# مجموع مكعبين","- مجموع المكعبين: المقدار الجبري أ³ + ب³، ويُحلَّل وفقاً للقاعدة: أ³ + ب³ = (أ + ب)(أ² − أب + ب²)","! في مجموع المكعبين تكون إشارة الحدّ الأوسط في العامل الثلاثي سالبة: أ² − أب + ب².","|المقدار|القاعدة|العامل الثلاثي","|أ³ − ب³|(أ − ب)(أ² + أب + ب²)|أ² + أب + ب²","|أ³ + ب³|(أ + ب)(أ² − أب + ب²)|أ² − أب + ب²","# خطوات التحليل","- أكتب كلّ حدّ على صورة مكعّب: س³ = (س)³ و ٢٧ = (٣)³ و ٨ص³ = (٢ص)³","- أحدّد أ و ب ثم أطبّق القاعدة المناسبة (فرق أم مجموع)","- أتحقّق بالضرب أو أتأكّد من إشارات العاملين","# أمثلة محلولة","? أحلّل: س³ − ٢٧ || س³ − ٢٧ = س³ − (٣)³ = (س − ٣)(س² + ٣س + ٩).","? أحلّل: ١٢٥س³ − ٨ص³ || = (٥س)³ − (٢ص)³ = (٥س − ٢ص)(٢٥س² + ١٠س ص + ٤ص²).","? أحلّل: ٨ − ٦٤س³ || = (٢)³ − (٤س)³ = (٢ − ٤س)(٤ + ٨س + ١٦س²).","? أحلّل: ص³ + ٦٤ || = ص³ + (٤)³ = (ص + ٤)(ص² − ٤ص + ١٦).","? أحلّل: ٨أ³ + ٣٤٣ || = (٢أ)³ + (٧)³ = (٢أ + ٧)(٤أ² − ١٤أ + ٤٩).","? أحلّل إلى العوامل الأولية: ٢١٦س³ − ٨ || نخرج العامل المشترك: ٨(٢٧س³ − ١) = ٨[(٣س)³ − (١)³] = ٨(٣س − ١)(٩س² + ٣س + ١).","# استعمالات في الحساب","? أجد قيمة: (٧ − ٥)(٤٩ + ٣٥ + ٢٥) || المقدار على صورة (أ − ب)(أ² + أب + ب²) حيث أ = ٧، ب = ٥، ولذلك يساوي ٧³ − ٥³ = ٣٤٣ − ١٢٥ = ٢١٨.","? إذا كان س = ص + ٤ وكان س² + س ص + ص² = ٤٩، فما قيمة س³ − ص³؟ || س³ − ص³ = (س − ص)(س² + س ص + ص²). س − ص = ٤، فالناتج = ٤ × ٤٩ = ١٩٦."],"q":["- اكتب قاعدة تحليل الفرق بين مكعبين وقاعدة تحليل مجموع مكعبين، وما الفرق بين العاملين الثلاثيين فيهما؟","- حلّل المقدار س³ − ٦٤.","- حلّل المقدار ٢٧ + ٦٤ك³.","- ما قيمة (٢٠ − ١٧)(٤٠٠ + ٣٤٠ + ٢٨٩) دون إجراء الضرب مباشرةً؟","- اكتب (٣س − ١)(٩س² + ٣س + ١) في أبسط صورة."],"quiz":[{"l":0,"k":"n","q":"قاعدة تحليل الفرق بين مكعبين أ³ − ب³ س³ − ١","٣س³ − ١"],"a":2},{"l":1,"k":"p","q":"تحليل المقدار س³ + ١ هو:","o":["(س + ١)(س² + س + ١)","(س − ١)(س² + س + ١)","(س + ١)(س² − ١)","(س + ١)(س² − س + ١)"],"a":3},{"l":2,"k":"p","q":"قيمة المقدار (٧ − ٥)(٤٩ + ٣٥ + ٢٥) تساوي:","o":["٢١٨","٩٨","٣٤٣","١٢٥"],"a":0},{"l":2,"k":"p","q":"قيمة المقدار (٢٠ − ١٧)(٤٠٠ + ٣٤٠ + ٢٨٩) تساوي:","o":["٣٠٨٧","١٢٩١٣","٣٠٧٨","٣٣٧٨"],"a":0},{"l":2,"k":"p","q":"إذا كان س = ص + ٤ وكان س² + س ص + ص² = ٤٩ فإن س³ − ص³ تساوي:","o":["٥٣","١٩٦","٤٩","٢٩٤"],"a":1},{"l":2,"k":"p","q":"تحليل المقدار ٢٧ + ٦٤ك³ هو:","o":["(٣ + ٤ك)(٩ + ١٢ك + ١٦ك²)","(٣ − ٤ك)(٩ + ١٢ك + ١٦ك²)","(٣ + ٤ك)(٩ − ٦ك + ١٦ك²)","(٣ + ٤ك)(٩ − ١٢ك + ١٦ك²)"],"a":3},{"l":2,"k":"p","q":"تحليل المقدار ٢ل³ − ١٦ تحليلاً كاملاً هو:","o":["٢(ل − ٢)(ل² − ٢ل + ٤)","٢(ل + ٢)(ل² − ٢ل + ٤)","٢(ل − ٢)(ل² + ٢ل + ٤)","٢(ل − ٤)(ل² + ٤ل + ١٦)"],"a":2},{"l":2,"k":"n","q":"أيّ المقادير الآتية لا يمكن تحليله بقاعدة المكعّبين؟","o":["س³ + ٩","س³ + ١٢٥","٢٧س³ − ١","ص³ − ٦٤"],"a":0},{"l":2,"k":"p","q":"قيمة م التي تجعل (س − م)(س² + ٢س + ٤) فرقاً بين مكعبين هي:","o":["٤","−٢","٢","−٨"],"a":2},{"l":2,"k":"p","q":"ناتج (ن² − ١)(ن⁴ + ن² + ١) هو:","o":["ن⁸ − ١","ن⁶ − ١","ن⁶ + ١","ن⁴ − ١"],"a":1}],"hints":{"في العامل الثلاثي لمجموع مكعبين تكون إشارة الحدّ الأوسط:":"تذكّر: أ² − أب + ب².","تحليل المقدار س³ − ٢٧ هو:":"٢٧ = (٣)³ فاستعمل قاعدة الفرق.","تحليل المقدار ٨ − ٦٤س³ هو:":"٨ = (٢)³ و ٦٤س³ = (٤س)³.","ناتج (٣س − ١)(٩س² + ٣س + ١) في أبسط صورة هو:":"هو فرق مكعبين (٣س)³ − (١)³.","قيمة المقدار (٧ − ٥)(٤٩ + ٣٥ + ٢٥) تساوي:":"هو ٧³ − ٥³.","قيمة المقدار (٢٠ − ١٧)(٤٠٠ + ٣٤٠ + ٢٨٩) تساوي:":"هو ٢٠³ − ١٧³ = ٨٠٠٠ − ٤٩١٣.","إذا كان س = ص + ٤ وكان س² + س ص + ص² = ٤٩ فإن س³ − ص³ تساوي:":"س³ − ص³ = (س − ص)(س² + س ص + ص²).","تحليل المقدار ٢ل³ − ١٦ تحليلاً كاملاً هو:":"أخرج العامل المشترك ٢ أولاً.","أيّ المقادير الآتية لا يمكن تحليله بقاعدة المكعّبين؟":"ابحث عن الحدّ الذي ليس مكعّباً كاملاً.","قيمة م التي تجعل (س − م)(س² + ٢س + ٤) فرقاً بين مكعبين هي:":"العامل الثلاثي أ² + أب + ب² فيه ب² = ٤.","ناتج (ن² − ١)(ن⁴ + ن² + ١) هو:":"فرق مكعبين: أ = ن²، ب = ١."}},{"t":"حلّ معادلتين خطيتين بمتغيّرين","e":["# ما حلّ المعادلتين؟","- حلّ المعادلة: عملية إيجاد جميع قيم س التي تحقّق المعادلة، وتُسمّى مجموعة قيم س التي تحقّق المعادلة مجموعة الحلّ","- نظام معادلتين خطيتين: معادلتان من الدرجة الأولى في متغيّرين (س، ص)، وحلّه قيمتان تحقّقان المعادلتين معاً","نتعلّم طريقتين لحلّ معادلتين خطيتين بمتغيّرين هما: التعويض والحذف.","# أولاً: طريقة التعويض","- أختار إحدى المعادلتين وأجعل أحد المتغيّرين موضوعاً للقانون","- أعوّض قيمة المتغيّر موضوع القانون في المعادلة الأخرى","- أحلّ المعادلة الناتجة التي تضمّ متغيّراً واحداً","- أعوّض قيمة هذا المتغيّر في إحدى المعادلتين لأجد قيمة المتغيّر الثاني","! تحقّق من صحّة الحلّ دائماً بتعويض القيمتين في المعادلتين معاً.","? أحلّ بالتعويض: ٢س + ٣ص = ١٦ ، ٣س − ص = ٢ || من المعادلة الثانية: ص = ٣س − ٢. نعوّض في الأولى: ٢س + ٣(٣س − ٢) = ١٦ ومنها ٢س + ٩س − ٦ = ١٦ فتكون ١١س = ٢٢ ومنها س = ٢. ثم ص = ٣(٢) − ٢ = ٤. التحقّق: ٢(٢) + ٣(٤) = ١٦ ✓ و ٣(٢) − ٤ = ٢ ✓. الحلّ: س = ٢، ص = ٤.","? أحلّ بالتعويض: س + ٣ص = ١ ، ٣س − ٤ص = −٢٣ || من الأولى: س = ١ − ٣ص. نعوّض في الثانية: ٣(١ − ٣ص) − ٤ص = −٢٣ ومنها ٣ − ٩ص − ٤ص = −٢٣ فتكون −١٣ص = −٢٦ ومنها ص = ٢. ثم س = ١ − ٣(٢) = −٥. الحلّ: س = −٥، ص = ٢.","# ثانياً: طريقة الحذف","تقوم الفكرة على جمع المعادلتين أو طرحهما (أو صورتيهما بعد الضرب في عدد) لحذف أحد المتغيّرين بحيث تنتج معادلة بمتغيّر واحد.","! إذا لم تتساوَ معاملات المتغيّر المراد حذفه (أو تتعاكس) نضرب طرفَي إحدى المعادلتين أو كليهما بعددٍ مناسب أولاً.","? أحلّ بالحذف: ٣س + ص = ١٠ ، س + ص = ٤ || معاملا ص متساويان، فنطرح المعادلتين: (٣س − س) + (ص − ص) = ١٠ − ٤ ومنها ٢س = ٦ فتكون س = ٣. نعوّض في الثانية: ٣ + ص = ٤ ومنها ص = ١. الحلّ: س = ٣، ص = ١.","? أحلّ بالحذف: ٢س + ٣ص = ١ ، ٣س − ٤ص = ١٠ || معاملا س غير متساويين. نضرب الأولى في −٣: −٦س − ٩ص = −٣، ونضرب الثانية في ٢: ٦س − ٨ص = ٢٠. بجمعهما: −١٧ص = ١٧ ومنها ص = −١. نعوّض في الأولى: ٢س + ٣(−١) = ١ ومنها ٢س = ٤ فتكون س = ٢. الحلّ: س = ٢، ص = −١.","# مسألة حياتية","? تُباع التذاكر في مدينة ملاهٍ بسعر دينار واحد للأطفال ودينارين للكبار. إذا كان عائد بيع التذاكر في أحد الأيام ٥٦٠ ديناراً، وكان عدد الزائرين من الصغار يزيد ٨٠ شخصاً على عدد الزائرين من الكبار، فما عدد زائري المدينة في ذلك اليوم؟ || نفرض عدد الكبار س وعدد الصغار ص. ص = س + ٨٠ وكذلك ٢س + ص = ٥٦٠. نعوّض: ٢س + س + ٨٠ = ٥٦٠ ومنها ٣س = ٤٨٠ فتكون س = ١٦٠ (كبار). ص = ١٦٠ + ٨٠ = ٢٤٠ (صغار). عدد الزائرين = ١٦٠ + ٢٤٠ = ٤٠٠ زائر."],"q":["- ما معنى حلّ معادلتين خطيتين بمتغيّرين؟ وما الطريقتان اللتان تعلّمتهما؟","- اذكر خطوات طريقة التعويض بالترتيب.","- حلّ بطريقة التعويض: ٤س + ص = ١ ، ٥س − ٣ص = −٢٠.","- حلّ بطريقة الحذف: س + ٣ص = ٣ ، ٢س + ص = −٤ (استعمل الضرب في عدد مناسب).","- أفكّر: هل يتغيّر ناتج س إذا عوّضنا قيمة ص في المعادلة الثانية بدلاً من الأولى؟ ولماذا؟"],"quiz":[{"l":0,"k":"n","q":"حلّ معادلتين خطيتين بمتغيّرين يعني:","o":["إيجاد قيمة متغيّر واحد فقط","إيجاد قيمتي المتغيّرين اللتين تحقّقان المعادلتين معاً","ضرب المعادلتين ببعضهما","رسم المعادلتين دون حساب"],"a":1},{"l":0,"k":"n","q":"الطريقتان المتعلَّمتان لحلّ معادلتين خطيتين هما:","o":["الجمع والقسمة","التحليل والقانون العام","إكمال المربع والتحليل","التعويض والحذف"],"a":3},{"l":0,"k":"n","q":"أول خطوة في طريقة التعويض هي:","o":["جمع المعادلتين","جعل أحد المتغيّرين موضوعاً للقانون في إحدى المعادلتين","ضرب المعادلتين","قسمة المعادلتين"],"a":1},{"l":0,"k":"n","q":"تقوم فكرة طريقة الحذف على:","o":["تعويض قيمة عشوائية","تحليل المعادلتين","جمع المعادلتين أو طرحهما لحذف أحد المتغيّرين","أخذ الجذر التربيعي"],"a":2},{"l":0,"k":"n","q":"تُسمّى مجموعة قيم المتغيّرات التي تحقّق المعادلة:","o":["المميّز","مجموعة الحلّ","المعامل","الحدّ الثابت"],"a":1},{"l":0,"k":"n","q":"إذا لم تتساوَ معاملات المتغيّر المراد حذفه في طريقة الحذف فإننا:","o":["نضرب إحدى المعادلتين أو كلتيهما بعدد مناسب","نحذف إحدى المعادلتين","نغيّر المتغيّر","نقسم على صفر"],"a":0},{"l":0,"k":"n","q":"بعد إيجاد قيمة أحد المتغيّرين نجد الآخر عن طريق:","o":["إهمالها","تعويضها في إحدى المعادلتين","ضربها في المعادلة الأخرى","تربيعها"],"a":1},{"l":0,"k":"n","q":"للتأكّد من صحة حلّ النظام نقوم بـ:","o":["تعويض القيمتين في المعادلتين الأص "q":"هل تتغيّر قيمة س إذا عوّضنا قيمة ص في المعادلة الثانية بدلاً من الأولى؟","o":["لا، لأن القيمتين تحقّقان المعادلتين معاً","نعم، دائماً","نعم، إذا كانت ص سالبة","لا يمكن التعويض في الثانية"],"a":0},{"l":2,"k":"p","q":"بطرح المعادلة س + ص = ٤ من ٣س + ص = ١٠ نحصل على:","o":["٤س = ١٤","٢س + ٢ص = ٦","٢س = ٦","٢ص = ٦"],"a":2}],"hints":{"حلّ النظام: س + ص = ٤ ، ٣س + ص = ١٠ هو:":"اطرح المعادلة الأولى من الثانية.","حلّ النظام: ٢س + ٣ص = ١٦ ، ٣س − ص = ٢ هو:":"اجعل ص موضوع القانون من المعادلة الثانية.","حلّ النظام: ٤س + ص = ١ ، ٥س − ٣ص = −٢٠ هو:":"من الأولى ص = ١ − ٤س.","في مسألة التذاكر (الكبار بدينارين والصغار بدينار، العائد ٥٦٠ ديناراً، والصغار يزيدون على الكبار ٨٠)، عدد الكبار:":"كوّن المعادلتين: ص = س + ٨٠ و ٢س + ص = ٥٦٠.","حلّ النظام: س + ٣ص = ٣ ، ٢س + ص = −٤ هو:":"عوّض س = ٣ − ٣ص في المعادلة الثانية.","إذا كان س + ص = ١٠ و س − ص = ٤ فإنّ س × ص تساوي:":"اجمع المعادلتين لتجد س ثم أوجد ص."}}]},{"title":"القياس والأشكال","ic":"cyl","color":"#cfe2b0","uq":[[0,"مساحة متوازي الأضلاع تساوي:",["½ × القاعدة × الارتفاع","القاعدة × الارتفاع","القاعدة + الارتفاع","٢ × القاعدة"],1],[0,"طول قوس القطاع الدائري يساوي:",["(٣٦٠° ÷ زاوية القطاع) × محيط الدائرة","زاوية القطاع × نصف القطر","(زاوية القطاع ÷ ٣٦٠°) × محيط الدائرة","محيط الدائرة ÷ ٢"],2],[0,"المساحة الجانبية للأسطوانة تساوي:",["π نق² ع","٢π نق ع","٢π نق²","π نق ع"],1],[0,"حجم المخروط القائم يساوي:",["π نق² ع","⅓ π نق² ع","π نق ل","½ π نق² ع"],1],[1,"مساحة قطاع زاويته ٩٠° في دائرة نصف قطرها ١٤ سم (π = ٢٢/٧):",["٦١٦ سم²","٣٠٨ سم²","٧٧ سم²","١٥٤ سم²"],3],[1,"حجم أسطوانة نصف قطر قاعدتها ٣ سم وارتفاعها ٥ سم:",["٣٠π سم³","١٥π سم³","٤٥π سم³","٧٥π سم³"],2],[1,"المساحة الجانبية لمخروط نصف قطر قاعدته ٣ سم وراسمه ٥ سم:",["٣٠π سم²","٩π سم²","١٢π سم²","١٥π سم²"],3],[1,"مساحة متوازي أضلاع قاعدته ١٢ سم وارتفاعه ٥ سم:",["٦٠ سم²","٣٠ سم²","١٧ سم²","١٢٠ سم²"],0],[2,"المساحة الكلية لمخروط نصف قطر قاعدته ٦ سم وارتفاعه ٨ سم:",["٦٠π سم²","٩٦π سم²","٣٦π سم²","١٢٠π سم²"],1],[2,"أسطوانة ومخروط مشتركان في القاعدة والارتفاع، وحجم الأسطوانة ٩٠ سم³، فحجم المخروط:",["٤٥ سم³","٦٠ سم³","٢٧٠ سم³","٣٠ سم³"],3],[2,"طول قوس قطاع زاويته ١٢٠° في دائرة نصف قطرها ٦ سم:",["٢π سم","٦π سم","١٢π سم","٤π سم"],3],[2,"أسطوانة مساحتها الجانبية ١٢٠π سم² وارتفاعها ١٠ سم، فنصف قطر قاعدتها:",["١٢ سم","٦ سم","٣ سم","٦٠ سم"],1]],"lessons":[{"t":"متوازي الأضلاع","e":["# أتذكّر وأتعلّم","- خاصية متوازي الأضلاع: كلّ ضلعين متقابلين فيه متساويان في الطول","- إنشاء متوازي أضلاع من مثلث: يمكن إنشاء متوازي أضلاع من مثلثٍ معلوم باستخدام الخاصية السابقة، بإضافة مثلثٍ يطابقه يشاركه أحد أضلاعه","إذا نسخنا المثلث وقلبناه وألصقناه بالمثلث الأصلي على أحد أضلاعه تتكوّن أربعة أضلاع كلّ ضلعين متقابلين فيها متساويان، أي يتكوّن متوازي أضلاع.","# نشاط: قطعة أرض","? يمتلك مزارعٌ قطعة أرض مثلثة الشكل مساحتها ١٠٠٠ م². اشترى قطعة مجاورة لها الأبعاد نفسها لتصبح أرضه على شكل متوازي أضلاع. ما مساحة الأرض التي أصبح يملكها؟ || قطعة الأرض الجديدة تطابق الأصلية، فمساحة متوازي الأضلاع = ٢ × مساحة المثلث = ٢ × ١٠٠٠ = ٢٠٠٠ م².","# قاعدة المساحة","! مساحة متوازي الأضلاع = ٢ × مساحة المثلث المشترك معه في القاعدة والارتفاع.","بما أن مساحة المثلث = ½ × القاعدة × الارتفاع فإن مساحة متوازي الأضلاع = ٢ × ½ × القاعدة × الارتفاع = القاعدة × الارتفاع.","|الشكل|المساحة","|المثلث|½ × القاعدة × الارتفاع","|متوازي الأضلاع|القاعدة × الارتفاع = ٢ × مساحة المثلث","# أمثلة محلولة","? دب جـ مثلث متساوي الأضلاع طول ضلعه ٦ سم، أجد مساحة متوازي الأضلاع أ ب جـ د المنشأ منه || مساحة المتوازي = ٢ × مساحة المثلث دب جـ. نرسم الارتفاع ب هـ فيكون هـ منتصف القاعدة (دهـ = ٣ سم). بفيثاغورس: (بد)² = (بهـ)² + (دهـ)² ومنها ٣٦ = (بهـ)² + ٩، فـ (بهـ)² = ٢٧ وبهـ = √٢٧ = ٣√٣ سم. مساحة المثلث = ½ × ٦ × ٣√٣ = ٩√٣ سم². مساحة متوازي الأضلاع = ٢ × ٩√٣ = ١٨√٣ سم².","? أ ب جـ د متوازي أضلاع، أ د ب مثلث متساوي الساقين قائم الزاوية في د، وأ د = ٤ سم. أجد مساحة متوازي الأضلاع || المثلث أدب قائم في د ومتساوي الساقين فدب = أد = ٤ سم. مساحته = ½ × ٤ × ٤ = ٨ سم². مساحة متوازي الأضلاع = ٢ × ٨ = ١٦ سم².","? مساحة متوازي أضلاع ٨٤ سم² وارتفاعه ٧ سم، ما طول قاعدته؟ || المساحة = القاعدة × الارتفاع، فالقاعدة = ٨٤ ÷ ٧ = ١٢ سم.","# السداسي المنتظم","إذا قُسّم السداسي المنتظم الذي مركزه م إلى ستة مثلثات متطابقة، فإن كلّ متوازي أضلاع يتكوّن من مثلثين منها، ومساحته ضعف مساحة المثلث الواحد.","? في سداسي منتظم مركزه م مساحة متوازي الأضلاع أ ب جـ م فيه ٢٠ سم². ما مساحة الشكل الرباعي أ و جـ ب (نصف السداسي)؟ || متوازي الأضلاع أ ب جـ م يتكوّن من مثلثين، فمساحة كلّ مثلث ٢٠ ÷ ٢ = ١٠ سم². الشكل أ و جـ ب (الجزء العلوي من السداسي) يتكوّن من ٣ مثلثات: ٣ × ١٠ = ٣٠ سم².","! المثلثات التي تتشارك قاعدةً واحدة وارتفاعاً واحداً تتساوى مساحاتها مهما اختلف شكلها."],"q":["- اكتب قاعدة مساحة متوازي الأضلاع بدلالة مساحة المثلث المشترك معه في القاعدة والارتفاع.","- كيف ننشئ متوازي أضلاع من مثلث معلوم؟ ولماذا تتحقّق خاصية الضلعين المتقابلين المتساويين؟","- مثلث مساحته ٣٦ سم²؛ ما مساحة متوازي الأضلاع الذي يشترك معه في القاعدة والارتفاع؟","- اشتق قانون مساحة متوازي الأضلاع = القاعدة × الارتفاع من قانون مساحة المثلث.","- وُرّثت قطعة أرض مثلثة بين ثلاثة إخوة وأرادوا تقسيمها بالتساوي مع بقاء حديقة مشتركة؛ كيف تستعمل المساحة لتحكم على عدالة التقسيم؟"],"quiz":[{"l":0,"k":"n","q":"من خصائص متوازي الأضلاع أنّ:","o":["جميع أضلاعه متساوية دائماً","جميع زواياه قائمة","كلّ ضلعين متقابلين فيه متساويان في الطول","قطراه متعامدان دائماً"],"a":2},{"l":0,"k":"n","q":"يمكن إنشاء متوازي أضلاع من مثلث معلوم باستخدام خاصية:","o":["تساوي الأقطار","تعامد الأضلاع","تساوي جميع الزوايا","كلّ ضلعين متقابلين متساويان في الطول"],"a":3},{"l":0,"k":"n","q":"مساحة متوازي الأضلاع تساوي:","o":["½ × مساحة المثلث","٢ × مساحة المثلث المشترك معه في القاعدة والارتفاع","٣ × مساحة المثلث","مساحة المثلث نفسها"],"a":1},{"l":0,"k":"n","q":"مساحة المثلث تساوي:","o":["القاعدة × الارتفاع","½ × مجموع الضلعين","½ × القاعدة × الارتفاع","٢ × القاعدة"],"a":2},{"l":0,"k":"n","q":"مساحة متوازي الأضلاع بدلالة قاعدته وارتفاعه هي:","o":["القاعدة × الارتفاع","½ × القاعدة × الارتفاع","٢ × القاعدة × الارتفاع","القاعدة + الارتفاع"],"a":0},{"l":0,"k":"n","q":"الارتفاع في متوازي الأضلاع هو:","o":["الضلع المائل","القطر","العمود الواصل بين القاعدة والضلع المقابل لها","نصف القاعدة"],"a":2 ائرة|٤٥°|١/٨|١/٨","! هذه النسب الثلاث متساوية دائماً، ومنها تُشتقّ كلّ قوانين القطاع.","# القوانين","إذا كانت هـ زاوية القطاع الدائري في دائرة فإن: هـ ÷ ٣٦٠° = طول القوس ÷ محيط الدائرة = مساحة القطاع ÷ مساحة الدائرة.","- زاوية القطاع = (طول القوس ÷ محيط الدائرة) × ٣٦٠°","- طول القوس = (زاوية القطاع ÷ ٣٦٠°) × محيط الدائرة","- مساحة القطاع = (طول القوس ÷ محيط الدائرة) × مساحة الدائرة = ½ × طول القوس × نصف القطر","# أمثلة على القطاع","? قطاع دائري في دائرة نصف قطرها ١٤ سم وطول قوسه ١١ سم، أجد قياس زاوية قطاعه (π = ٢٢/٧) || محيط الدائرة = ٢ × ٢٢/٧ × ١٤ = ٨٨ سم. زاوية القطاع = (١١ ÷ ٨٨) × ٣٦٠° = ١/٨ × ٣٦٠° = ٤٥°.","? رُسم قطاع في دائرة نصف قطرها ٣٫٥ سم زاويته ٣٠°، ما طول القوس المقابل؟ (π = ٢٢/٧) || طول القوس = (٣٠ ÷ ٣٦٠) × ٢π × ٣٫٥ = ١/١٢ × ٢ × ٢٢/٧ × ٣٫٥ = ١/١٢ × ٢٢ = ١١/٦ ≈ ١٫٨٣ سم.","? أراد مهندس إعادة تعشيب المنطقة التالفة من دائرة الوسط في ملعب كرة قدم، وهي قطاع طول قوسه ٢٢ م ونصف قطر الدائرة ٩٫١٥ م. ما مساحة القطاع؟ || مساحة القطاع = ½ × طول القوس × نصف القطر = ½ × ٢٢ × ٩٫١٥ = ١٠٠٫٦٥ م².","? أجد زاوية قطاع دائري في دائرة نصف قطرها ٧ سم وطول قوسه ٥٫٦π سم || زاوية القطاع = (٥٫٦π ÷ (٢π × ٧)) × ٣٦٠° = (٥٫٦ ÷ ١٤) × ٣٦٠° = ٠٫٤ × ٣٦٠° = ١٤٤°.","? قطاع دائري محيطه ٢٥ سم (مجموع طول قوسه ونصفي قطريه) ومساحته ٣٦ سم². أجد نصف القطر وطول القوس || نفرض نصف القطر نق وطول القوس ل: ل = ٢٥ − ٢نق، والمساحة ½ × ل × نق = ٣٦ ومنها نق(٢٥ − ٢نق) = ٧٢ أي ٢نق² − ٢٥نق + ٧٢ = ٠. المميّز = ٦٢٥ − ٥٧٦ = ٤٩، فنق = (٢٥ ± ٧) ÷ ٤ = ٨ أو ٤٫٥. إذا كان نق = ٨ فالقوس ٩ سم، وإذا كان نق = ٤٫٥ فالقوس ١٦ سم؛ وكلا الحلّين مقبول.","# القطعة الدائرية","- القطعة الدائرية: الجزء المحصور بين قوسٍ ووترٍ يمرّ بنهايتي ذلك القوس في الدائرة","! زاوية القطعة الدائرية تساوي زاوية القطاع الدائري المشتركة معها في القوس نفسه.","? في دائرة مركزها م، زاوية القطاع الدائري أ م جـ تساوي ١٢٠°. ما زاوية القطعة الدائرية أ ب جـ؟ || القطعة والقطاع يشتركان في القوس أ ب جـ، فزاوية القطعة = زاوية القطاع = ١٢٠°."],"q":["- عرّف القطاع الدائري والقطعة الدائرية ووضّح الفرق بينهما.","- اكتب القانون الذي يربط زاوية القطاع بطول القوس ومحيط ا بيعية في نصف القطر.","محيط شكل المسبح السابق (نصفا قطر + القوس) يساوي:":"القوس = ¼ × ٢ × ٢٢/٧ × ١٤ = ٢٢ م."}},{"t":"الأسطوانة","e":["# ما الأسطوانة؟","- الأسطوانة الدائرية القائمة: المجسّم المتولّد من دوران مستطيل دورةً كاملة حول أحد أضلاعه","- قاعدتا الأسطوانة: الدائرتان المتطابقتان في طرفَي الأسطوانة","# نشاط: شبكة الأسطوانة","- نحضر علبة معدنية أسطوانية مغلقة من القاعدتين وقطعة كرتون مستطيلة عرضها يساوي طول مولّد الأسطوانة","- ندير الأسطوانة على قطعة الكرتون حتى يعود المولّد ملامساً لسطح القطعة، فنحدّد المنطقة التي دارت عليها","- نقصّ المستطيل الناتج: طوله يساوي محيط قاعدة الأسطوانة وعرضه يساوي ارتفاعها","- نرسم قاعدتي الأسطوانة ونقصّهما فتكتمل الشبكة","! شبكة الأسطوانة الدائرية القائمة: مستطيل طول أحد أضلاعه محيط القاعدة وطول ضلعه الآخر ارتفاع الأسطوانة، ودائرتان متطابقتان هما القاعدتان.","# المساحة الجانبية والكلية","|الكمية|القانون","|المساحة الجانبية|محيط القاعدة × الارتفاع = ٢π نق ع","|مساحة القاعدة|π نق²","|المساحة الكلية|المساحة الجانبية + مساحة القاعدتين = ٢π نق ع + ٢π نق²","! المساحة الجانبية هي مساحة المستطيل في الشبكة؛ والكلية تضيف إليها القاعدتين الدائريتين.","# أمثلة على المساحة","? يراد بناء أسطوانة مفتوحة القاعدتين من مستطيل طوله ٧π سم وعرضه ٣ سم. ما مساحتها الجانبية؟ || ارتفاع الأسطوانة = عرض المستطيل = ٣ سم، ومحيط القاعدة = طول المستطيل = ٧π سم. المساحة الجانبية = محيط القاعدة × الارتفاع = ٧π × ٣ = ٢١π سم².","? أجد المساحة الكلية لأسطوانة نصف قطر قاعدتها ٥ سم وارتفاعها ٧ سم || المساحة الجانبية = ٢π × ٥ × ٧ = ٧٠π سم². مساحة القاعدة = π × ٥² = ٢٥π، ومساحة القاعدتين = ٥٠π. المساحة الكلية = ٧٠π + ٥٠π = ١٢٠π سم².","? ما المساحة الكلية لأسطوانة نصف قطر قاعدتها ٣٫٥ سم وارتفاعها ٨ سم؟ (π = ٢٢/٧) || المساحة الكلية = ٢π نق ع + ٢π نق² = ٢π(٣٫٥)(٨) + ٢π(٣٫٥)² = ٥٦π + ٢٤٫٥π = ٨٠٫٥π = ٨٠٫٥ × ٢٢/٧ = ٢٥٣ سم².","# الحجم","وعاءٌ أسطواني نصف قطر قاعدته ٤ سم وارتفاعه ٣٫٥ سم مُلئ بالماء ثم أُفرغ في مخبار مدرّج، فأشار التدريج إلى ١٧٦ سم³. وهذا يساوي مساحة القاعدة × الارتفاع.","! حجم الأسطوانة = مساحة القاعدة × الارتفاع = π نق² ع.","? أتحقّق: حجم الأسطوانة التي نصف قطر قاعدتها ٤ سم وارتفاعها ٣٫٥ سم (π = ٢٢/٧) || الحجم = π نق² ع = ٢٢/٧ × ١٦ × ٣٫٥ = ٢٢ × ١٦ × ٠٫٥ = ١٧٦ سم³، وهو ما أظهره المخبار المدرّج.","? علبة أسطوانية ارتفاعها ١٠ سم وحجمها ٢٥٠π سم³، ما نصف قطر قاعدتها؟ || π نق² × ١٠ = ٢٥٠π ومنها نق² = ٢٥ فيكون نق = ٥ سم.","# مهمة تعليمية","? وعاءان لتخزين الزيت: الأول أسطواني قطره ١٤ سم وارتفاعه ١٤ سم، والثاني مكعّب طول ضلعه ١٤ سم. أيّهما يتسع لكمية أكبر؟ (π = ٢٢/٧) || حجم الأسطوانة = ٢٢/٧ × ٧² × ١٤ = ٢٢ × ٧ × ١٤ = ٢١٥٦ سم³. حجم المكعّب = ١٤³ = ٢٧٤٤ سم³. الوعاء المكعّب يتسع لكمية أكبر."],"q":["- عرّف الأسطوانة الدائرية القائمة، وصِف شبكتها.","- اكتب قانون المساحة الجانبية وقانون المساحة الكلية للأسطوانة.","- أسطوانة محيط قاعدتها ٢٠π سم وارتفاعها ١٠ سم؛ أجد مساحتها الجانبية.","- علبة صابون أسطوانية حجمها ٣٢٠π سم³ ونصف قطر قاعدتها ٨ سم؛ كم يبلغ ارتفاعها؟","- أسطوانتان لهما الحجم نفسه، الأولى نصف قطرها ٨ سم وارتفاعها ١٠ سم والثانية نصف قطرها ٤ سم؛ ما ارتفاع الثانية؟"],"quiz":[{"l":0,"k":"n","q":"تتولّد الأسطوانة الدائرية القائمة من دوران:","o":["مثلث قائم الزاوية حول ضلعه","دائرة حول قطرها","شبه منحرف حول قاعدته","مستطيل دورة كاملة حول أحد أضلاعه"],"a":3},{"l":0,"k":"n","q":"شبكة الأسطوانة الدائرية القائمة تتكوّن من:","o":["مستطيل ودائرتين متطابقتين","مثلث ودائرة","مستطيلين فقط","قطاع دائري ودائرة"],"a":0},{"l":0,"k":"n","q":"طول أحد ضلعَي المستطيل في شبكة الأسطوانة يساوي:","o":["نصف قطر القاعدة","قطر القاعدة","مساحة القاعدة","محيط القاعدة"],"a":3},{"l":0,"k":"n","q":"طول الضلع الآخر للمستطيل في الشبكة يساوي:","o":["ارتفاع الأسطوانة","نصف القطر","محيط القاعدة","القطر"],"a":0},{"l":0,"k":"n","q":"المساحة الجانبية للأسطوانة تساوي:","o":["π نق² ع","π نق ع","٢π نق ع","٢π نق²"],"a":2},{"l":0,"k":"n","q":"المساحة الكلية للأسطوانة تساوي:","o":["المساحة الجانبية + مساحة القاعدتين","المساحة الجانبية فقط","مساحة القاعدة × الارتفاع","المساحة الجانبية − مساحة القاعدتين"],"a":0},{"l":0,"k":"n","q":"حجم الأسطوانة يساوي:","o":["محيط القاعدة × الارتفاع","مساحة القاعدة × الارتفاع","½ × مساحة القاعدة × الارتفاع","٢π نق ع"],"a":1},{"l":0,"k":"n","q": ,{"l":2,"k":"n","q":"إذا تضاعف ارتفاع أسطوانة وبقي نصف قطرها ثابتاً فإن حجمها:","o":["يصبح أربعة أمثال","لا يتغيّر","يقلّ إلى النصف","يتضاعف"],"a":3},{"l":2,"k":"n","q":"لحساب مساحة المعدن اللازم لصنع علبة أسطوانية مغلقة نستعمل:","o":["المساحة الكلية","المساحة الجانبية فقط","الحجم","مساحة قاعدة واحدة"],"a":0}],"hints":{"أسطوانة مفتوحة صُنعت من مستطيل طوله ٧π سم وعرضه ٣ سم، مساحتها الجانبية:":"المساحة الجانبية = مساحة المستطيل.","المساحة الكلية للأسطوانة السابقة (نق = ٥، ع = ٧):":"أضف مساحة القاعدتين ٢ × ٢٥π.","أسطوانة ارتفاعها ١٠ سم وحجمها ٢٥٠π سم³، فنصف قطر قاعدتها:":"π نق² × ١٠ = ٢٥٠π.","أسطوانتان متساويتا الحجم: الأولى نق = ٨ سم وع = ١٠ سم، والثانية نق = ٤ سم. ارتفاع الثانية:":"حجم الأولى ٦٤٠π؛ ساوِه بـ π × ١٦ × ع.","إذا تضاعف نصف قطر قاعدة أسطوانة وبقي ارتفاعها ثابتاً فإن حجمها:":"نصف القطر مربَّع في قانون الحجم.","وعاء أسطواني قطره ١٤ سم وارتفاعه ١٤ سم ووعاء مكعّب ضلعه ١٤ سم، فأيّهما يتسع لكمية أكبر؟":"احسب الحجمين: ٢١٥٦ و ٢٧٤٤.","مستطيل طوله ٧π سم لُفّ ليصبح أسطوانة؛ نصف قطر قاعدتها:":"محيط القاعدة ٢π نق = ٧π.","أسطوانة محيط قاعدتها ١٠π سم وارتفاعها ٢ سم، مساحتها الكلية:":"نق = ٥: الجانبية ٢٠π والقاعدتان ٥٠π."}},{"t":"المخروط","e":["# ما المخروط القائم؟","- المخروط القائم: المجسّم المتولّد من دوران مثلثٍ قائم الزاوية دورةً كاملة حول أحد ضلعيه القائمين","- راسم المخروط: قطعة مستقيمة تصل رأس المخروط وأيّة نقطة تقع على دائرة قاعدته","- ارتفاع المخروط: العمود النازل من رأس المخروط على قاعدة المخروط","# نشاط: شبكة المخروط","- نرسم دائرة نصف قطرها يساوي طول راسم المخروط، ونضع المخروط في مركزها بحيث ينطبق الراسم على نصف القطر","- ندير المخروط حتى يعود الراسم ملامساً لسطح الدائرة، فالشكل الناتج عن الدوران الكامل هو قطاع دائري","- نقصّ القطاع، ثم نرسم قاعدة المخروط ونقصّها فتكتمل الشبكة","! شبكة المخروط الدائري القائم قطاعٌ دائري نصف قطر دائرته يساوي راسم المخروط، ودائرةٌ نصف قطرها يساوي نصف قطر قاعدة المخروط. فـ طول راسم المخروط = نصف قطر القطاع، ومحيط قاعدة المخروط = طول قوس القطاع.","# المساحة الجانبية والكلية","|الكمية|القانون","|المساحة الجانبية|π × نق × ل (نق نصف قطر القاعدة، ل الراسم)","|المساحة الكلية|المساحة الجانبية + مساحة القاعدة = π نق ل + π نق²","|العلاقة بين الأبعاد|ل² = نق² + ع² (فيثاغورس)","المساحة الجانبية للمخروط = ½ × نصف قطر دائرة القطاع × طول قوس القطاع = ½ × ل × ٢π نق = π نق ل.","? أجد المساحة الجانبية لمخروط دائري قائم قطر قاعدته ٢ م وطول راسمه ٣٫٥ م (π = ٢٢/٧) || نصف قطر القاعدة نق = ١ م. المساحة الجانبية = π نق ل = ٢٢/٧ × ١ × ٣٫٥ = ١١ م².","? مخروط دائري قائم نصف قطر قاعدته ٩ سم وارتفاعه ١٢ سم، ما مساحته الجانبية؟ || ل² = نق² + ع² = ٩² + ١٢² = ٨١ + ١٤٤ = ٢٢٥، ومنها ل = ١٥ سم. المساحة الجانبية = π × ٩ × ١٥ = ١٣٥π سم².","? أبيّن أن المساحة الكلية لمخروط دائري قائم نصف قطر قاعدته ٧ سم وطول راسمه ٢٠ سم تساوي ٥٩٤ سم² (π = ٢٢/٧) || المساحة الجانبية = π × ٧ × ٢٠ = ١٤٠π = ١٤٠ × ٢٢/٧ = ٤٤٠ سم². مساحة القاعدة = π × ٧² = ٢٢/٧ × ٤٩ = ١٥٤ سم². المساحة الكلية = ٤٤٠ + ١٥٤ = ٥٩٤ سم².","? مخروط قائم نصف قطر قاعدته ٤ سم ومساحته الجانبية ٦٢٫٨ سم² (π = ٣٫١٤)، أجد راسمه وارتفاعه || المساحة الجانبية = π نق ل فـ ٦٢٫٨ = ٣٫١٤ × ٤ × ل ومنها ل = ٦٢٫٨ ÷ ١٢٫٥٦ = ٥ سم. ع² = ل² − نق² = ٢٥ − ١٦ = ٩ فيكون ع = ٣ سم.","? شبكة مخروط: قطاع دائري نصف قطره ١٤ سم، ونصف قطر قاعدة المخروط ٣٫٥ سم. أجد طول قوس القطاع (π = ٢٢/٧) || طول القوس = محيط قاعدة المخروط = ٢π × ٣٫٥ = ٧π = ٧ × ٢٢/٧ = ٢٢ سم.","# الحجم","نملأ مخروطاً بالرمل ونفرغه في أسطوانة تشاركه في القاعدة والارتفاع، ونكرّر حتى تمتلئ الأسطوانة؛ فنلاحظ أن عدد المخاريط التي تملأ الأسطوانة يساوي ٣.","! حجم المخروط = ⅓ × حجم الأسطوانة المشتركة معه في القاعدة والارتفاع = ⅓ π نق² ع.","# مهمة تعليمية: صومعة الحبوب","? صومعة لتخزين الحبوب ذات قاعدة مخروطية نصف قطر قاعدتها ٣ م وارتفاعها ٤ م، وارتفاع الصومعة الكلّي ١٢ م. أجد حجم الصومعة || الصومعة مخروط في الأسفل وفوقه أسطوانة، ارتفاع الأسطوانة = ١٢ − ٤ = ٨ م. حجم الأسطوانة = π × ٩ × ٨ = ٧٢π. حجم المخروط = ⅓ × π × ٩ × ٤ = ١٢π. الحجم الكلي = ٧٢π + ١٢π = ٨٤π ≈ ٢٦٣٫٧٦ م³ (π = ٣٫١٤)."],"q":["- عرّف المخروط القائم، وما راسمه وما ارتفاعه؟","- صِف شبكة المخروط الدائري القائم، وما العلاقة بين أبعاد القطاع وأبعاد المخروط؟","- اكتب قانون المساحة الجانبية للمخر
