<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الرياضيات — الصف الثامن</title>
<meta name="theme-color" content="#0a5230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../shared/icons/portal-192.png">
<link rel="apple-touch-icon" href="../../shared/icons/portal-180.png">
<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--hd:#0a5230;--hd2:#073d22;--bg:#FAF6EB;--card:#fff;--ink:#0a5230;--mut:#4b7a5f;--g:#00a152;--y:#ffc107;--bd:#e9dfc8;--ok:#1f9d55;--bad:#d63c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:min(760px,100%);margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
/* الرأس */
.hdr{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 40px;position:relative}
.hdr .row1{display:flex;align-items:center;gap:12px}
.av{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--y);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--g);font-weight:700;font-size:1.4rem}
.av img{width:100%;height:100%;object-fit:cover}
.hi{flex:1;min-width:0}.hi b{display:block;font-size:1.2rem;line-height:1.3}
.pts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#f3dc92;font-size:.9rem;margin-top:0}
.pts .dr-chip{padding:0 9px !important;font-size:.78rem !important}
.portal{display:flex;align-items:center;gap:6px;color:var(--y);text-decoration:none;font-weight:700;font-size:.9rem;flex:none}
.portal svg{width:24px;height:24px}
.sheet{background:var(--bg);margin-top:-26px;border-radius:26px 26px 0 0;padding:12px 16px 0;position:relative}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--bd);border-radius:999px;padding:6px 14px;margin-bottom:6px}
.search input{border:0;outline:0;background:transparent;flex:1;font:inherit;color:var(--ink);min-width:0}
.search svg{width:20px;height:20px;color:var(--mut);flex:none}
.sec{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:700;margin:4px 0 8px}
.sec i{font-style:normal;color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;grid-auto-rows:clamp(92px,calc((100svh - 300px) / 4),132px)}
.uc{border:0;border-radius:18px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;box-shadow:0 5px 0 var(--s,#007a3d);color:#fff;text-align:center;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.uc svg{width:clamp(36px,6.5svh,52px);height:clamp(36px,6.5svh,52px);flex:none;background:#fff;border-radius:50%;padding:5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.uc b{font-size:.92rem;line-height:1.25}
.uc small{font-size:.74rem;opacity:.95;font-weight:600}
.uc .dn{position:absolute;top:6px;inset-inline-start:6px;background:#fff;border-radius:99px;font-size:.68rem;padding:0 7px;font-weight:700;color:var(--g)}
#drToast{top:0 !important;bottom:auto !important;border-radius:0 0 14px 14px !important;font-size:.72rem !important;padding:3px 14px !important;opacity:.92}
.card>svg{width:60px;height:60px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:right}
.cont .t{flex:1;min-width:0}.cont .t b{display:block;font-size:1.1rem}.cont .t small{color:var(--mut)}
.bar{height:10px;background:#ece6d4;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--y);border-radius:99px}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:var(--ink);background:conic-gradient(var(--y) calc(var(--p)*1%),#ece6d4 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.85rem}
.daily{background:linear-gradient(135deg,#f6e3a1,#ffc107);border:2px solid #cfa23a;border-radius:26px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.daily .tr{font-size:3rem;line-height:1}
.daily b{font-size:1.3rem;display:block}.daily small{display:block;margin:2px 0 10px;color:#4a3a10}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--hd);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700}
.cta.alt{background:var(--g)}
/* التنقّل */
.nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);border-radius:26px 26px 0 0;display:grid;grid-template-columns:repeat(var(--n,5),1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(17,61,46,.08);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8a8a8a;text-decoration:none;font-size:.82rem;font-weight:700;padding:4px 0}
.nav a svg{width:28px;height:28px}
.nav a.on{color:#b8902f}
/* شاشات داخلية */
.top{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.4}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:1.3rem}
.body{padding:16px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;width:100%;text-align:right;text-decoration:none;color:inherit}
.row .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:700;background:#fbf0c8;border:1px solid var(--y)}
.row .ic svg{width:34px;height:34px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx small{color:var(--mut)}
.row .go{color:var(--mut);font-size:1.3rem}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:#e0d9c4}.dots i.on{background:var(--ok)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;border:1.5px solid #7fe0a2;background:#fff;color:var(--g);border-radius:999px;padding:6px 16px;font-weight:700}
.tb.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 0 var(--y)}
.lc h3{margin:14px 0 6px;font-size:1.1rem;color:var(--g)}
.lc p{margin:8px 0}.lc ul{margin:8px 0;padding-inline-start:20px}.lc li{margin:4px 0}
.note{background:#fdf0d8;border-inline-start:5px solid #f08a00;border-radius:12px;padding:8px 12px;margin:10px 0}
.exm{background:#e6f3ec;border-inline-start:5px solid var(--g);border-radius:12px;padding:8px 12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--bd);padding:6px 8px;text-align:center}.tbl th{background:#d7e8dc}
.lv{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px;margin-bottom:10px;border:2px solid;background:#fff;width:100%;text-align:right}
.lv i{font-style:normal;font-size:1.8rem}.lv b{display:block}.lv small{color:var(--mut)}
.lv .st{margin-inline-start:auto;font-weight:700}
/* الاختبار */
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y)}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 14px;line-height:1.7}
.kk{display:inline-block;font-size:.75rem;background:#e6f3ec;color:var(--g);border-radius:99px;padding:0 10px;margin-bottom:6px}
.op{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:1.02rem}
.op.ok{border-color:var(--ok);background:#e5f6ec}.op.bad{border-color:var(--bad);background:#fde9e9}
.hint{background:#fff6dc;border:1px solid var(--y);border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.res{text-align:center;padding:24px 8px}.res .big{font-size:3.4rem}.res h2{margin:6px 0}
.stars{font-size:2.2rem;letter-spacing:4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat div{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;color:var(--g)}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bd div{background:#fff;border:1px solid var(--y);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem;line-height:1.4}.bd i{display:block;font-style:normal;font-size:1.8rem}
.wis{text-align:center}.wis small{color:var(--mut)}
.btn{display:block;width:100%;text-align:center;border:0;background:linear-gradient(135deg,#00c853,var(--g));color:#fff;border-radius:14px;padding:12px;font-weight:700;margin-top:10px;text-decoration:none}
.btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.empty{color:var(--mut);text-align:center;padding:20px}
@media (min-width:640px){.grid,.mg{grid-template-columns:repeat(3,1fr)}.nav{max-width:760px}.grid{grid-auto-rows:clamp(110px,18svh,150px)}}
@media (max-width:340px){.grid,.mg{grid-template-columns:1fr}.hi b{font-size:1rem}}
/* محاكاة جرّب بنفسك */
.wgv{display:grid;place-items:center;margin:4px 0}
.wgbig{text-align:center;font-size:1.45rem;font-weight:800;margin:8px 0;padding:8px;border-radius:16px;background:linear-gradient(135deg,#fff3c4,#ffe082);color:#4e2a00}
.wgbig span{display:inline-block;background:#ff6d00;color:#fff;border-radius:10px;padding:0 10px}.wgbig b{color:#d50000}.wgbig small{display:block;font-size:.85rem;color:#6d4c00;font-weight:600}
.wgc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.wgc span{font-weight:700;min-width:100%}
.wgc button{flex:1;min-width:58px;border:0;border-radius:14px;padding:10px 4px;font:800 1.05rem inherit;background:#fff;color:var(--c);box-shadow:inset 0 0 0 3px var(--c);cursor:pointer;transition:.15s}.wgc button.on{background:var(--c);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.wgs{margin:8px 0}.wgs label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}.wgs input{width:100%;height:30px}
.wgm{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7c4dff,#e040fb);color:#fff;border-radius:16px;padding:10px 12px;margin:10px 0;font-weight:700}
.wgn{display:block;width:100%;border:0;border-radius:14px;padding:11px;margin-top:8px;font:800 1rem inherit;color:#fff;background:linear-gradient(135deg,#ff6d00,#ffab00);box-shadow:0 4px 0 #c43e00;cursor:pointer}.wgn.g{background:linear-gradient(135deg,#00c853,#64dd17);box-shadow:0 4px 0 #008a39}
.wgrow{display:flex;gap:8px}.wgrow .wgn{flex:1}
.wgok{background:#00c853;color:#fff;border-radius:14px;padding:8px;text-align:center;font-weight:800;margin-top:8px;animation:wgpop .4s}
.wgb{text-align:center;font-size:2.2rem;animation:wgpop .5s}
@keyframes wgpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.wgst{position:relative;height:90px;border-radius:16px;overflow:hidden;background:linear-gradient(#80d8ff,#e1f5fe 60%,#a5d6a7 60%)}.wgball{position:absolute;bottom:8px;left:0;line-height:1;transition:font-size .2s}
@keyframes wgrun{from{left:-40px}to{left:100%}}
.wgsvg{width:100%;height:auto}
.wgbars{display:flex;gap:10px;height:92px;align-items:flex-end;justify-content:center;margin:6px 0}.wgbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:56px}.wgbars i{display:block;width:100%;border-radius:8px 8px 0 0;min-height:2px;transition:height .15s}.wgbars span{font-weight:800}
.wgat{display:flex;gap:8px;align-items:center}.wgai{flex:1;font-size:.92rem;line-height:1.7}.wgtag{color:#fff;border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:700}
.wgel{margin-top:6px}.wgrow2{display:flex;gap:3px;align-items:center;margin:4px 0;flex-wrap:wrap}.wgrow2>small{width:100%;color:#6a5a2a;font-weight:700}
.wgrow2 button{width:38px;height:44px;border:0;border-radius:10px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgrow2 button small{font-size:.6rem;opacity:.85}.wgrow2 button b{font-size:.95rem}.wgrow2 button.on{transform:translateY(-3px) scale(1.12);outline:3px solid #fff;box-shadow:0 0 0 3px #111}
.wgcv{width:100%;height:auto;border-radius:16px;display:block}
.wgsnd{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}.wgsnd>b{width:100%}.wgsnd button{flex:1;border:0;border-radius:12px;padding:8px 2px;background:var(--c);color:#fff;font:800 .95rem inherit;display:flex;flex-direction:column;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgsnd small{font-weight:500;opacity:.9}.wgsr{width:100%;background:#e3f2fd;border-radius:12px;padding:8px;font-weight:700}
.wgcard{text-align:center;background:linear-gradient(135deg,#fff3c4,#ffe0b2);border-radius:20px;padding:14px;margin-bottom:10px}.wgem{font-size:4rem;line-height:1.2}.wgcard b{font-size:1.2rem;display:block}.wgcard small{color:#6d4c00}
.wgks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wgks button{border:0;border-radius:14px;padding:12px 4px;color:#fff;font:800 1rem inherit;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.22);cursor:pointer}.wgks button:last-child{grid-column:1/-1}.wgks button.ok{outline:4px solid #fff;box-shadow:0 0 0 4px #00c853}.wgks button.no{animation:wgshake .4s}.wgks button[disabled]{opacity:.55}
@keyframes wgshake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.wgmsg{text-align:center;font-weight:800;margin-top:10px;min-height:1.6em}.wgfin{text-align:center;padding:10px}.wgfin b{font-size:1.6rem}

/* عناصر تفاعلية */
.ipb{height:7px;background:#ece6d4;border-radius:99px;overflow:hidden;margin:6px 0 2px}.ipb i{display:block;height:100%;width:0;background:var(--y);transition:width .35s}
.ipt{display:block;color:var(--mut);font-size:.8rem;margin-bottom:6px}
.pt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:right;background:#f4f8ee;border:2px solid #d7e6c4;border-radius:14px;padding:9px 12px;margin:6px 0;font-size:1rem;line-height:1.6}
.pt::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid #9bbf86;flex:none;margin-top:2px;transition:.2s;display:grid;place-items:center;color:#fff;font-size:.8rem}
.pt.done{background:#e5f6ec;border-color:var(--ok)}.pt.done::before{content:"✓";background:var(--ok);border-color:var(--ok)}
.cl{display:inline-block;min-width:52px;border:0;border-radius:8px;background:var(--y);color:#3b2a08;padding:0 8px;font:inherit;font-weight:700;letter-spacing:2px;animation:pulse 1.6s infinite}
.cl.rv{background:#d8f0e0;color:var(--g);letter-spacing:0;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,185,77,.35)}}
.ip{margin:10px 0}
.nt,.ex2{display:block;width:100%;text-align:right;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:1rem;line-height:1.6;border:2px dashed}
.nt{background:#fdf0d8;border-color:#f08a00}.ex2{background:#e6f3ec;border-color:var(--g)}
.nt .bd2,.ex2 .bd2{display:none}.nt.done .bd2,.ex2.done .bd2{display:block;margin-top:4px;font-weight:700}.nt.done .hd2,.ex2.done .hd2{display:none}
.nt.done,.ex2.done{border-style:solid}
.tbw{overflow-x:auto;margin:10px 0}.tbw .tbl{margin:0}.tbl td.mk{background:#e9efe0;color:transparent;cursor:pointer;user-select:none}.tbl td.mk.rv{background:none;color:inherit}
.tbs{display:block;margin:6px auto 0;border:0;background:var(--y);color:#3b2a08;border-radius:99px;padding:4px 16px;font-weight:700;font-size:.85rem}
/* الرياضيات */
.t-math{--bg:#f6f0dd;--ink:#17402b;--mut:#5f7a63;--g:#1d5a3b;--bd:#e8e0c4}
.mh{display:flex;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top)) 18px 4px}
.mhi{flex:1}.mhi b{font-size:1.8rem;line-height:1.25;display:block}.mhi small{color:#6a8a5c;font-size:1rem}
.mportal{display:inline-block;margin-top:6px;background:#fffaf0;border:1.5px solid #cfe3b0;border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:700;color:#1d5a3b;text-decoration:none}
.mav{width:76px;height:76px;background:#1d4d35;color:#fff;border:6px solid #cfe3b0;font-size:2rem}
.pc{margin:14px 16px;background:linear-gradient(135deg,#00a152,#00e676);color:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 0 #007a3d}
.pct{display:flex;justify-content:space-between;align-items:center}.pct b{font-size:1.35rem}
.chp{background:#fff;color:#00a152;border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem}
.pcr{display:flex;justify-content:space-between;margin:10px 0 6px;font-size:.95rem}
.bar.big{height:14px;background:#d5dcc0}.bar.big i{background:#1d5a3b}
.pcs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}.chp2{background:#fff;color:#0a5230;border-radius:99px;padding:3px 14px;font-weight:700;font-size:.92rem}.chp2.g{background:#ffc107;color:#3b2a00}
.sec2{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 8px;font-size:1.3rem}.sec2 a{font-size:.95rem;color:#3d7a4f;text-decoration:none;font-weight:400}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 10px}
.mu{border:0;border-radius:22px;padding:14px 8px;text-align:center;text-decoration:none;color:#fff;box-shadow:0 6px 0 var(--s,#007a3d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:124px;position:relative;font:inherit;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.mu.w{grid-column:1/-1}
.mu svg{width:46px;height:46px;filter:brightness(0) invert(1)}.mu b{font-size:1.1rem}.mu small{font-size:.85rem;opacity:.95;font-weight:600}
.mu .dn{position:absolute;top:8px;inset-inline-start:8px;background:#1d5a3b;color:#fff;border-radius:99px;font-size:.7rem;padding:0 8px}
.t-math .nav{background:#fffaf0}.t-math .nav a.on{color:#1d4d35}
/* الآلة الحاسبة */
#calc{position:fixed;inset:0;background:rgba(17,40,28,.55);z-index:50;display:grid;place-items:end center}
.cbox{width:100%;max-width:520px;background:#fffaf0;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:slin .25s ease both}
.cd{background:#e9f0d5;border-radius:16px;padding:10px 14px;text-align:left;direction:ltr;min-height:76px}.cd small{display:block;color:var(--mut);min-height:22px;word-break:break-all}.cd b{font-size:2rem;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;direction:ltr}
.ck button{border:0;border-radius:14px;padding:13px 0;font-size:1.25rem;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 2px 0 #e0d8bc}.ck button.o{background:#cfe3b0}.ck button.eq{background:#1d5a3b;color:#fff;grid-column:span 2}.ck button.cx{background:#f6d8d0}
.cclose{display:block;margin:10px auto 0;border:0;background:none;color:var(--mut);font-weight:700}
/* درس البطاقات التفاعلية */

يل العدد النسبي إلى كسر عشري","الطريقة الأولى: نضرب البسط والمقام في عددٍ يجعل المقام ١٠ أو ١٠٠ أو ١٠٠٠ ...","الطريقة الثانية: نقسم البسط على المقام.","! إذا انتهت القسمة فالكسر العشري منتهٍ، وإذا تكرّر الباقي فالكسر العشري دوريّ.","|الكسر|الطريقة|الكسر العشري","|-٣/٤|نضرب في ٢٥: -٧٥/١٠٠|-٠٫٧٥","|٩/٤٠|نضرب في ٢٥: ٢٢٥/١٠٠٠|٠٫٢٢٥","|٣/٨|قسمة ٣ ÷ ٨|٠٫٣٧٥ منتهٍ","|١/٣|قسمة ١ ÷ ٣ (الباقي ١ يتكرّر)|٠٫٣٣٣… دوري","# أمثلة","? اكتب ٣/٨ على صورة كسر عشري. || نقسم ٣ ÷ ٨ = ٠٫٣٧٥ ؛ انتهت القسمة فهو كسر عشري منتهٍ.","? اكتب ١/٣ على صورة كسر عشري، ماذا تلاحظ؟ || ١ ÷ ٣ = ٠٫٣٣٣… ؛ الباقي ١ يتكرّر فالقسمة لا تنتهي، إذن ١/٣ كسر عشري دوريّ وهو عدد نسبي.","? لعب راشد ١١ مباراة وفاز في ثلاثٍ منها. عبّر عن نسبة فوزه كعدد عشري دوري. || النسبة = ٣/١١ ؛ ٣ ÷ ١١ = ٠٫٢٧٢٧… أي ٠٫٢٧ دوري (يتكرّر الرقمان ٢٧).","? مع خليل مئة دينار تصدّق منها بعشرين ديناراً. اكتب العدد النسبي الذي يعبّر عن نسبة صدقته. || النسبة = ٢٠/١٠٠ = ١/٥ = ٠٫٢","# تدرّب","الأعداد ٠٫٦ و-٥ و√١٢١ كلّها أعداد نسبية لأن كلّاً منها يمكن كتابته بالصورة أ/ب.","العدد √١٢١ = ١١ ينتمي إلى مجموعات الأعداد ط وص ون معاً."],"q":["- ما المقصود بالعدد النسبي؟ وما رمز مجموعته؟","- اكتب العدد ٢٫٣٥ على الصورة أ/ب.","- حوّل ٩/٤٠ إلى كسر عشري بطريقتين.","- متى يكون الكسر العشري منتهياً ومتى يكون دورياً؟ مثّل لكلٍّ.","- لماذا العدد -√٩ عدد نسبي؟"],"quiz":[{"l":0,"k":"n","q":"أيّ الأعداد الآتية يسمّى عدداً نسبياً؟","o":["العدد الذي مقامه صفر","العدد الذي يمكن كتابته بالصورة أ/ب حيث أ، ب صحيحان وب ≠ ٠","العدد الذي لا يمكن كتابته على صورة كسر","العدد الصحيح فقط"],"a":1},{"l":0,"k":"n","q":"الرمز الذي يُرمز به لمجموعة الأعداد النسبية هو:","o":["ن","ط","ص","ح"],"a":0},{"l":0,"k":"n","q":"في الصورة أ/ب للعدد النسبي، شرط المقام ب هو:","o":["ب = ٠","ب = ١ فقط","ب ≠ ٠","ب < ٠ فقط"],"a":2},{"l":0,"k":"n","q":"أيّ العلاقات الآتية صحيحة بين المجموعات ط وص ون؟","o":["ط ⊂ ص ⊂ ن","ن ⊂ ص ⊂ ط","ص ⊂ ط ⊂ ن","ط ⊂ ن ⊂ ص"],"a":0},{"l":0,"k":"n","q":"أيّ عدد عشري دوري هو عدد:","o":["غير نسبي","صحيح فقط","طبيعي فقط","نسبي"],"a":3},{"l":0,"k":"n","q":"إحدى طرق تحويل العدد ا ],"a":0},{"l":2,"k":"p","q":"٣ ١/٢ بالصورة العشرية يساوي:","o":["٣٫٥","٣٫١٢","٣٫٢","٤٫٥"],"a":0},{"l":2,"k":"p","q":"٧/٢٠ بالصورة العشرية يساوي:","o":["٠٫٣٥","٠٫٧٢٠","٠٫٣٧","٠٫٢٧"],"a":0}],"hints":{"الرمز الذي يُرمز به لمجموعة الأعداد النسبية هو:":"ط للطبيعية وص للصحيحة؛ فما رمز مجموعتهما الأوسع؟","الكسر ٩/٤٠ يساوي:":"اضرب البسط والمقام في ٢٥ ليصبح المقام ١٠٠٠.","فاز راشد في ٣ مباريات من ١١. أيّ الآتي يعبّر عن نسبة فوزه؟":"قسّم عدد المباريات التي فاز بها على العدد الكلي ولاحظ تكرّر الباقي.","قيمة ١١/٢٥ ككسر عشري هي:":"اضرب البسط والمقام في ٤ ليصبح المقام ١٠٠."}},{"t":"الجذر التربيعي والجذر التكعيبي لعدد نسبي","e":["# قاعدة الجذر التربيعي لعدد نسبي","إذا أمكن كتابة العدد النسبي جـ كحاصل ضرب عددين نسبيين موجبين متساويين فإن √جـ عدد نسبي موجب.","- الجذر التربيعي لكسر: √(أ/ب) = √أ / √ب بشرط ب ≠ ٠","- العدد المربّع الكامل: عدد جذره التربيعي عدد نسبي، مثل ٩ و٤٩/٦٤ و٠٫٠١","! جذر الكسر = جذر البسط ÷ جذر المقام، وللعدد العشري نحوّله أولاً إلى كسر عادي.","# نشاط ١: قيمة الجذر","|المطلوب|الخطوات|الناتج","|√(١/٩)|√١ ÷ √٩|١/٣","|√٠٫٠١|√(١/١٠٠) = ١/١٠|٠٫١","|√(٦٤/٩)|√٦٤ ÷ √٩|٨/٣","# الجذر التكعيبي لعدد نسبي","تعريف: إذا كان جـ = أ³/ب³ حيث ب ≠ ٠ فإن ∛جـ = ∛(أ³)/∛(ب³) = أ/ب، وهو عدد نسبي.","- الجذر التكعيبي: العدد الذي إذا ضُرب في نفسه ثلاث مرّات أعطى العدد، وله جذر تكعيبي لأيّ عدد نسبي حتى السالب","! لا جذر تربيعي حقيقي لعدد سالب، لكن للعدد السالب جذر تكعيبي سالب، مثل ∛(-٨) = -٢.","|المطلوب|الخطوات|الناتج","|∛(٢٧/٨)|∛٢٧ ÷ ∛٨|٣/٢","|∛(-٠٫٠٠١)|∛(-١/١٠٠٠)|-٠٫١","# أمثلة محلولة","? أوجد √(٤٩/٨١). || √(٤٩/٨١) = √٤٩ ÷ √٨١ = ٧/٩","? أوجد √١٫٤٤. || ١٫٤٤ = ١٤٤/١٠٠ ، √(١٤٤/١٠٠) = ١٢/١٠ = ١٫٢","? أوجد ∛(-٨/٢٧). || ∛(-٨) ÷ ∛٢٧ = -٢/٣","? صمّم مكعّباً حجمه ٧٢٩/٨ سم³، فما طول ضلعه؟ || طول الضلع = ∛(٧٢٩/٨) = ∛٧٢٩ ÷ ∛٨ = ٩/٢ = ٤٫٥ سم","# تدرّب","الأنماط √(١/٩) = ١/٣ ، √(١/١٦) = ١/٤ ، √(١/٢٥) = ١/٥ تتبع القاعدة نفسها؛ فالحدّ التالي √(١/٣٦) = ١/٦.","في النمط ∛(-٨) ، ∛(-٢٧) ، ∛(-٦٤) تكون النواتج -٢ ثم -٣ ثم -٤، والحدّ التالي ∛(-١٢٥) = -٥."],"q":["- كيف تجد الجذر التربيعي لكسر عادي؟ مثّل.","- أوجد √٠٫٦٤ و√(٣٦/٢٥).","- أوجد ∛(٨/١٢٥) و∛(-٠٫٠٠٨).","- لماذا يوجد جذر تكعيبي لعدد سالب ولا يوجد جذر تربيعي حقيقي له؟","- مكعّب حجمه ٢٧/٨ م³: ما طول ضلعه؟"],"quiz":[{"l":0,"k":"n","q":"قاعدة الجذر التربيعي للكسر √(أ/ب) تساوي:","o":["√أ / √ب","√أ × √ب","√(أ + ب)","أ / ب"],"a":0},{"l":0,"k":"n","q":"الجذر التربيعي للعدد ٩ هو:","o":["٣","٣٣","٤٫٥","٨١"],"a":0},{"l":0,"k":"n","q":"الجذر التكعيبي للعدد ٨ هو:","o":["٢","٤","١٦","٣"],"a":0},{"l":0,"k":"n","q":"أيّ الأعداد الآتية لا يوجد له جذر تربيعي حقيقي؟","o":["٤","٠","-٤","١٦"],"a":2},{"l":0,"k":"n","q":"الجذر التكعيبي للعدد -٢٧ هو:","o":["٣","-٣","-٩","لا يوجد"],"a":1},{"l":0,"k":"n","q":"العدد الذي جذره التربيعي عدد نسبي يسمّى:","o":["مكعّباً كاملاً","عدداً أولياً","مربّعاً كاملاً","عدداً دورياً"],"a":2},{"l":0,"k":"n","q":"قاعدة الجذر التكعيبي للكسر ∛(أ³/ب³) تساوي:","o":["أ³/ب","أ/ب³","أ/ب","أ×ب"],"a":2},{"l":0,"k":"n","q":"√٠٫٠١ تساوي:","o":["٠٫٠٠١","٠٫١","٠٫٥","١٠"],"a":1},{"l":1,"k":"p","q":"قيمة √(١/٤) تساوي:","o":["١/٢","١/٨","١/١٦","٢"],"a":0},{"l":1,"k":"p","q":"قيمة √(٩/١٦) تساوي:","o":["٣/٨","٣/٤","٩/٤","٣/١٦"],"a":1},{"l":1,"k":"p","q":"قيمة √٠٫٠٩ تساوي:","o":["٠٫٠٣","٠٫٩","٠٫٠٩","٠٫٣"],"a":3},{"l":1,"k":"p","q":"قيمة √١٫٢١ تساوي:","o":["١٫٢","١٫٠١","١٫٣","١٫١"],"a":3},{"l":1,"k":"p","q":"قيمة √(٤٩/٦٤) تساوي:","o":["٤٩/٨","٧/٦٤","٧/٨","٨/٧"],"a":2},{"l":1,"k":"p","q":"قيمة ∛(٨/٢٧) تساوي:","o":["٨/٣","٢/٩","٣/٢","٢/٣"],"a":3},{"l":1,"k":"p","q":"قيمة ∛(-٢٧/٦٤) تساوي:","o":["٣/٤","-٩/٤","-٣/٤","-٣/٦٤"],"a":2},{"l":1,"k":"p","q":"قيمة ∛٠٫٠٦٤ تساوي:","o":["٠٫٤","٠٫٠٤","٠٫٨","٠٫٠٢"],"a":0},{"l":2,"k":"p","q":"مكعّب حجمه ٣٤٣/٨ سم³؛ طول ضلعه يساوي:","o":["٧/٢ سم","٧/٨ سم","٣٤٣/٢ سم","٧/٤ سم"],"a":0},{"l":2,"k":"p","q":"خزان مكعّب حجمه ٢٧/٨ م³، وصفيحة مربّعة مساحتها ٣٦/٢٥ م². هل تغطي الصفيحة وجهه العلوي؟","o":["نعم، لأن مساحة الوجه ٣/٢ م² فقط","نعم، لأن المساحتين متساويتان","لا، لأن مساحة الوجه ٩/٤ م² وهي أكبر من ٣٦/٢٥ م²","لا، لأن مساحة الوجه ٣/٢ م² وهي أكبر"],"a":2},{"l":2,"k":"p","q":"إذا كان √س = ٢/٣ فإن س تساوي:","o":["٤/٣","٢/٩","٨/٢٧","٤/٩"],"a":3},{"l":2,"k":"p","q":"إذا كان ∛س = -٣/٥ فإن س تساوي:","o":["-٩/٢٥","٢٧/١٢٥","-٢٧/١٢٥","-٣/١٢٥"],"a":2},{"l":2,"k":"p","q":"ضلع مربّع مساحته ٢٫٢٥ م² يساوي:","o":["١٫١٢٥ م","٤٫٥ م","١٫٢٥ م","١٫٥ م"],"a":3},{"l":2,"k":"p","q":"قيمة √(٤/٩) + √(١/٩) تساوي:","o":["٥/٩","٥/٣","١/٣","١"],"a":3},{"l":2,"k":"p","q":"قيمة ∛(٨/٢٧) × √(٩/٤) تساوي:","o":["٢/٣","١","٣/٢","٦/٦٧"],"a":1},{"l":2,"k":"p","q":"قيمة √(١٦/٨١) - ∛(١/٢٧) تساوي:","o":["١/٣","١/٩","١/٦","٧/٩"],"a":1}],"hints":{"أيّ الأعداد الآتية لا يوجد له جذر تربيعي حقيقي؟":"ما الذي ينتج عن ضرب عدد في نفسه: موجب أم سالب؟","قيمة √٠٫٠٩ تساوي:":"حوّل ٠٫٠٩ إلى ٩/١٠٠ ثم خذ جذر البسط وجذر المقام.","مكعّب حجمه ٣٤٣/٨ سم³؛ طول ضلعه يساوي:":"طول ضلع المكعّب = الجذر التكعيبي لحجمه.","خزان مكعّب حجمه ٢٧/٨ م³، وصفيحة مربّعة مساحتها ٣٦/٢٥ م². هل تغطي الصفيحة وجهه العلوي؟":"احسب ضلع الخزان أولاً ثم مساحة وجهه (الضلع × الضلع) وقارنها بمساحة الصفيحة."}},{"t":"مقارنة الأعداد النسبية","e":["# طرق المقارنة","لمقارنة عددين نسبيين نستعمل إحدى الطرق الآتية: توحيد المقامات، أو تحويل العددين إلى كسور عشرية، أو إيجاد الفرق بينهما.","- توحيد المقامات: نحوّل الكسرين إلى كسرين متكافئين لهما المقام نفسه ثم نقارن البسطين","- التحويل إلى كسر عشري: نقسم البسط على المقام لكلّ عدد ثم نقارن الأرقام منزلةً منزلة","- الفرق بين عددين: إذا كان أ - ب موجباً فإن أ > ب، وإذا كان سالباً فإن أ < ب","! كلّ عدد موجب أكبر من أيّ عدد سالب، والصفر أكبر من كلّ عدد سالب.","# نشاط ١: مقارنة زوج من الأعداد","|الزوج|الطريقة|النتيجة","|-٥/٧ ، ٣/٤|سالب مقابل موجب|-٥/٧ < ٣/٤","|-٥/٨ ، -٣/٤|-٣/٤ = -٦/٨ ثم نقارن -٥ و-٦|-٥/٨ > -٣/٤","|٢٫٥٤ ، ٢٫٤٥|نقارن منزلة الأعشار ٥ و٤|٢٫٥٤ > ٢٫٤٥","# أمثلة محلولة","? قارن بين ٣/٥ و٢/٣. || نوحّد المقامين (١٥): ٣/٥ = ٩/١٥ ، ٢/٣ = ١٠/١٥ ؛ بما أن ٩ < ١٠ فإن ٣/٥ < ٢/٣","? رتّب تصاعدياً: ١٫٧٥ ، -∛(٢٧/٨) ، √(٩/٤). || ∛(٢٧/٨) = ٣/٢ فالعدد الثاني -٣/٢ = -١٫٥ ؛ √(٩/٤) = ٣/٢ = ١٫٥ ؛ الترتيب التصاعدي: -∛(٢٧/٨) ، √(٩/٤) ، ١٫٧٥","? ضع الإشارة المناسبة (< أو > أو =): ٠٫٢٤ □ ∛(١/٦٤). || ∛(١/٦٤) = ١/٤ = ٠٫٢٥ ؛ بما أن ٠٫٢٤ < ٠٫٢٥ فإن ٠٫٢٤ < ∛(١/٦٤)","? ضع الإشارة المناسبة: ٤/٩ □ ٠٫٤٤٤… || ٤/٩ = ٤ ÷ ٩ = ٠٫٤٤٤… فالعددان متساويان ٤/٩ = ٠٫٤٤٤…","# مهمة: خزان شريف","يريد شريف تغطية الوجه العلوي لخزان مكعّب حجمه ٢٧/٨ م³ بصفيحة مربّعة مساحتها ٣٦/٢٥ م². ضلع الخزان = ٣/٢ م فمساحة وجهه = ٩/٤ = ٢٫٢٥ م² ، ومساحة الصفيحة = ١٫٤٤ م².","! بما أن ١٫٤٤ < ٢٫٢٥ فلا تكفي الصفيحة لتغطية الوجه العلوي.","# تدرّب","لترتيب أعداد تنازلياً نكتبها من الأكبر إلى الأصغر، فمثلاً: ٣/٢ ، ١ ، صفر ، -١/٢ ، -١٫٧٥","عند مقارنة عددين سالبين يكون الأكبر هو الأقرب إلى الصفر."],"q":["- اشرح طريقتين لمقارنة عددين نسبيين.","- قارن بين -٣/٤ و-٥/٦ مع التوضيح.","- رتّب تصاعدياً: ٠٫٧ ، ٥/٧ ، -١ ، ٢/٣.","- هل ٠٫٢٤ أكبر من ∛(١/٦٤)؟ ولماذا؟","- ضع الإشارة المناسبة: ١٫٧٧ □ √(٢٥/١٦)."],"quiz":[{"l":0,"k":"n","q":"أيّ العددين أكبر: عدد موجب أم عدد سالب؟","o":["العدد السالب","العدد الموجب","هما متساويان دائماً","لا يمكن المقارنة"],"a":1},{"l":0,"k":"n","q":"عند مقارنة كسرين مقاماهما مختلفان نبدأ عادةً بـ:","o":["جمع المقامين","توحيد المقامين","طرح البسطين فقط","ضرب البسطين"],"a":1},{"l":0,"k":"n","q":"إذا كان الفرق أ - ب عدداً موجباً فإن:","o":["أ < ب","أ = ب","أ > ب","أ = -ب"],"a":2},{"l":0,"k":"n","q":"الصفر مقارنةً بأيّ عدد سالب:","o":["أصغر منه","يساويه","لا يُقارن به","أكبر منه"],"a":3},{"l":0,"k":"n","q":"عند مقارنة عددين سالبين يكون الأكبر هو:","o":["الأقرب إلى الصفر","الأبعد عن الصفر","الذي مقامه أكبر دائماً","الذي بسطه أكبر دائماً"],"a":0},{"l":0,"k":"n","q":"لترتيب الأعداد تصاعدياً نكتبها من:","o":["الأصغر إلى الأكبر","الأكبر إلى الأصغر","الأقرب للصفر فقط","البسط الأكبر فقط"],"a":0},{"l":0,"k":"n","q":"للمقارنة بين ٢٫٥٤ و٢٫٤٥ نقارن أولاً منزلة:","o":["الآحاد فقط","المئات","الأجزاء من ألف","الأعشار"],"a":3},{"l":0,"k":"n","q":"إحدى طرق المقارنة بين عددين نسبيين هي:","o":["جمع بسطيهما","ضرب مقاميهما فقط","تحويلهما إلى كسور عشرية","حذف الإشارة"],"a":2},{"l":1,"k":"p","q":"أيّ الآتي صحيح؟","o":["٣/٥ > ٢/٣","٣/٥ < ٢/٣","٣/٥ = ٢/٣","٣/٥ > ١"],"a":1},{"l":1,"k":"p","q":"أيّ الآتي صحيح؟","o":["-٣/٤ < -٥/٦","-٣/٤ > -٥/٦","-٣/٤ = -٥/٦","-٣/٤ < - ية وطرحها","e":["# قاعدة الجمع","لجمع عددين نسبيين نستعمل القاعدة: أ/ب + جـ/د = (أ×د + ب×جـ) / (ب×د)، حيث ب ≠ ٠ ، د ≠ ٠.","- الإغلاق: عملية الجمع مغلقة على ن؛ فمجموع عددين نسبيين عدد نسبي","- الإبدال: عملية الجمع تبديلية على ن، أي أ + ب = ب + أ","- التجميع: عملية الجمع تجميعية على ن، أي (أ + ب) + جـ = أ + (ب + جـ)","- العنصر المحايد: الصفر هو المحايد الجمعي لأن أ + ٠ = أ","- النظير الجمعي: لكلّ عدد نسبي أ/ب نظير جمعي هو -أ/ب بحيث أ/ب + (-أ/ب) = ٠","! نظير العدد ٠٫٢٥ هو -٠٫٢٥، ونظير -٢/٥ هو ٢/٥.","|العدد|نظيره الجمعي|المجموع","|٤|-٤|صفر","|٠٫٢٥|-٠٫٢٥|صفر","|-٢/٥|٢/٥|صفر","# قاعدة الطرح","عملية الطرح مغلقة على ن: أ/ب - جـ/د = (أ×د - ب×جـ) / (ب×د).","! الطرح ليس تبديلياً وليس تجميعياً على ن؛ فمثلاً ٥ - ٢ ≠ ٢ - ٥.","# أمثلة محلولة","? أوجد -٣/٥ + ٢/٧. || المقام المشترك ٣٥ ؛ -٣/٥ = -٢١/٣٥ و٢/٧ = ١٠/٣٥ ؛ المجموع = (-٢١ + ١٠)/٣٥ = -١١/٣٥","? أوجد ٢/٣ - √٠٫٠١. || √٠٫٠١ = ٠٫١ = ١/١٠ ؛ ٢/٣ - ١/١٠ = ٢٠/٣٠ - ٣/٣٠ = ١٧/٣٠","? ما محيط مثلث أطوال أضلاعه ٢٫٥ سم و٤٫٢٥ سم و√(٨١/١٦) سم؟ || √(٨١/١٦) = ٩/٤ = ٢٫٢٥ ؛ المحيط = ٢٫٥ + ٤٫٢٥ + ٢٫٢٥ = ٩ سم","? بيّن بمثال عددي أن الطرح ليس تجميعياً. || (١٠ - ٤) - ٣ = ٣ بينما ١٠ - (٤ - ٣) = ٩ ؛ النتيجتان مختلفتان","# مهمة: تبرّعات الصفوف","تبرّع طلبة الصف الأول بمبلغ ١٩ ١/٢ ديناراً، والثاني بمبلغ ١٦ ١/٤ ديناراً، والثالث بمبلغ ٢٢ ديناراً.","مجموع ما تبرّع به الطلبة = ١٩٫٥ + ١٦٫٢٥ + ٢٢ = ٥٧٫٧٥ ديناراً.","الفرق بين تبرّع الصف الأول والثاني = ١٩٫٥ - ١٦٫٢٥ = ٣٫٢٥ دينار أي ٣ ١/٤ دينار."],"q":["- اكتب قاعدة جمع عددين نسبيين، وما الذي يحدث إذا اختلف المقاما؟","- اذكر خصائص عملية الجمع على ن.","- ما النظير الجمعي للعدد -٢/٥؟ وما ناتج جمعهما؟","- بيّن بمثال عددي أن الطرح ليس تبديلياً على ن.","- أوجد ٢/٥ + ١/٢ - ٣."],"quiz":[{"l":0,"k":"n","q":"عملية الجمع على ن مغلقة؛ أي أن مجموع عددين نسبيين:","o":["عدد غير نسبي","عدد نسبي","عدد صحيح دائماً","صفر دائماً"],"a":1},{"l":0,"k":"n","q":"العنصر المحايد الجمعي في ن هو:","o":["١","-١","٠","أ"],"a":2},{"l":0,"k":"n","q":"النظير الجمعي للعدد أ/ب هو:","o":["-أ/ب","ب/أ","أ/ب","١/ب"],"a":0},{"l":0,"k":"n","q":"الخاصية وهي عدد غير نسبي","! يتميّز العدد العشري غير النسبي بأنه غير منتهٍ وغير دوري، مثل ٢٫١٢١١٢١١١٢١١١١… (لا يتكرّر نمطٌ ثابت).","# ملاحظات مهمة","- إذا كان جـ عدداً نسبياً موجباً ليس مربعاً كاملاً فإن √جـ عدد غير نسبي، وإذا لم يكن مكعباً كاملاً فإن ∛جـ عدد غير نسبي","- مجموع عدد نسبي وعدد غير نسبي هو عدد غير نسبي، مثل ٣ + √٢","- ك × π عدد غير نسبي لكلّ ك ∈ ن ، ك ≠ صفر","- النسبة الذهبية عدد غير نسبي","# نشاط: أيّ الأعداد غير نسبي؟","|العدد|السبب|الحكم","|√١٠|١٠ ليست مربعاً كاملاً|غير نسبي","|√٠٫٢٥|٠٫٢٥ مربع العدد ٠٫٥|نسبي","|∛٢٥|٢٥ ليست مكعباً كاملاً|غير نسبي","|٣π|حاصل ضرب عدد نسبي غير صفري في π|غير نسبي","# تبسيط الجذور","إذا كان أ، ب غير سالبين فإن √(أب) = √أ × √ب ، وكذلك ∛(أب) = ∛أ × ∛ب.","? اكتب √٤٤ بأبسط صورة. || √٤٤ = √(٤ × ١١) = √٤ × √١١ = ٢√١١","? اكتب √٤٥ بأبسط صورة. || √٤٥ = √(٩ × ٥) = √٩ × √٥ = ٣√٥","? اكتب ∛٥٦ بأبسط صورة. || ∛٥٦ = ∛(٨ × ٧) = ∛٨ × ∛٧ = ٢∛٧","? أعطِ قيمة تقريبية للعدد √٧٠. || ٨² = ٦٤ و٩² = ٨١ فالجذر بين ٨ و٩؛ ٨٫٣٧² ≈ ٧٠ إذن √٧٠ ≈ ٨٫٤","# تدرّب","العدد ٣ + √٢ غير نسبي لأن الجزء العشري في ناتج الجمع غير منتهٍ وغير دوري.","من الأعداد -٢ ، -١ ، ١ ، ١٠ ، ١٨ أكبر ناتج قسمة ممكن هو ١٨ ÷ ١ = ١٨ وأصغره ١٨ ÷ (-١) = -١٨."],"q":["- ما العدد غير النسبي؟ مثّل بعددين.","- لماذا √١٠ عدد غير نسبي بينما √٠٫٢٥ عدد نسبي؟","- اكتب √٦٣ و∛٥٦ بأبسط صورة.","- أعطِ قيمة تقريبية للعدد √٧٠.","- هل ٣ + √٢ عدد نسبي؟ وضّح."],"quiz":[{"l":0,"k":"n","q":"العدد غير النسبي هو العدد الذي:","o":["لا يمكن كتابته بالصورة أ/ب","يمكن كتابته بالصورة أ/ب","كسره العشري دوري","هو دائماً عدد صحيح"],"a":0},{"l":0,"k":"n","q":"يُرمز لمجموعة الأعداد غير النسبية بالرمز:","o":["ن","ص","ط","ن̅"],"a":3},{"l":0,"k":"n","q":"الكسر العشري للعدد غير النسبي يكون:","o":["منتهياً","دورياً","غير منتهٍ وغير دوري","صفراً"],"a":2},{"l":0,"k":"n","q":"أيّ الآتي عدد غير نسبي؟","o":["π","٣٫١٤","٢٢/٧","٣"],"a":0},{"l":0,"k":"n","q":"إذا كان جـ عدداً نسبياً موجباً وليس مربعاً كاملاً فإن √جـ:","o":["عدد غير نسبي","عدد نسبي","عدد صحيح","صفر"],"a":0},{"l":0,"k":"n","q":"النسبة الذهبية هي عدد:","o":["نسبي","غير نسب نسبي و√٢٠ نسبي","كلاهما نسبي","√٢٥ نسبي و√٢٠ غير نسبي","كلاهما غير نسبي"],"a":2}],"hints":{"أيّ الآتي عدد غير نسبي؟":"π هي نسبة محيط الدائرة إلى قطرها.","أيّ الأعداد الآتية نسبي؟":"ضع ٠٫٢٥ على صورة مربّع عدد نسبي.","العدد ٠٫١٠١١٠١١١٠١١١١… (يزداد عدد الآحاد كلّ مرّة) هو:":"هل يتكرّر في هذا العدد نمط ثابت بعينه؟","لماذا يُشترط ك ≠ ٠ في العبارة «ك × π عدد غير نسبي»؟":"ماذا ينتج عن ضرب π في الصفر؟"}},{"t":"العمليات على الأعداد غير النسبية","e":["# خصائص الجمع والضرب","العمليات على الأعداد غير النسبية تتبع قواعد الجذور، فنجمع الجذور المتشابهة ونبسّط قبل الجمع.","- الجمع على ن̅: عملية الجمع تبديلية على الأعداد غير النسبية، ويمكن جمع الجذور المتشابهة مثل ٣√٢ + ٢√٢ = ٥√٢","- ضرب الجذور: √أ × √ب = √(أب) و∛أ × ∛ب = ∛(أب) لأيّ عددين غير سالبين","- التجميع: عملية الضرب تجميعية على الأعداد غير النسبية: √أ × √ب × √جـ = √(أبجـ)","- الضرب غير مغلق: حاصل ضرب عددين غير نسبيين قد يكون نسبياً، مثل √٢ × √٢ = ٢","! عملية الضرب ليست مغلقة على مجموعة الأعداد غير النسبية.","# تبسيط ثم جمع","|الجذر|التبسيط","|√٨|٢√٢","|√١٨|٣√٢","|√٢٧|٣√٣","|√١٢|٢√٣","# أمثلة محلولة","? أوجد بأبسط صورة (٣ + √٥) - (٥ + √٢٠). || √٢٠ = ٢√٥ ؛ ٣ + √٥ - ٥ - ٢√٥ = (٣ - ٥) + (√٥ - ٢√٥) = -٢ - √٥","? صالة مستطيلة طولها (٢٠ + √٣) م وعرضها (٢٠ - √٣) م، ما مساحتها؟ || المساحة = (٢٠ + √٣)(٢٠ - √٣) = ٤٠٠ - ٢٠√٣ + ٢٠√٣ - ٣ = ٣٩٧ م²","? بيّن أن (√٢ × √٥) × √١٠ = √٢ × (√٥ × √١٠). || الطرف الأيسر: √١٠ × √١٠ = ١٠ ؛ الطرف الأيمن: √٢ × √٥٠ = √٢ × ٥√٢ = ٥ × ٢ = ١٠ ؛ النتيجتان متساويتان","? أوجد √٢٧ + √١٢. || √٢٧ = ٣√٣ و√١٢ = ٢√٣ ؛ المجموع = ٥√٣","? ما محيط مستطيل بعداه (√٢٠ - √٢) و(√٥ + √٨) سم؟ || المحيط = ٢ × [(٢√٥ - √٢) + (√٥ + ٢√٢)] = ٢ × (٣√٥ + √٢) = ٦√٥ + ٢√٢ سم","# تدرّب","حاصل ضرب √٦ × √٢ × √٣ = √٣٦ = ٦ وهو عدد نسبي.","حاصل ضرب (√٥ + ٢)(√٥ - ٢) = ٥ - ٤ = ١ وهو عدد نسبي أيضاً."],"q":["- اذكر خصائص الجمع والضرب على الأعداد غير النسبية.","- بيّن بمثال أن الضرب ليس مغلقاً على الأعداد غير النسبية.","- أوجد √٦ × √٢ × √٣.","- اكتب √٨ + √١٨ بأبسط صورة.","- أوجد مساحة مستطيل بعداه (٢٠ + √٣) و(٢٠ - √٣)."],"quiz":[{"l":0,"k":"n","q":" √٥ + ٢)(√٥ - ٢) يساوي:","o":["٩","١","٥ - ٢√٥","٣"],"a":1},{"l":2,"k":"p","q":"ناتج (√٣ + ١)² يساوي:","o":["٤ + ٢√٣","٤","٣ + ١","٢ + ٢√٣"],"a":0},{"l":2,"k":"p","q":"ناتج √٧٢ - √٥٠ يساوي:","o":["٢","√٢٢","٦√٢","√٢"],"a":3},{"l":2,"k":"p","q":"ناتج (٢√٣)(٣√٣) يساوي:","o":["١٨","٦√٣","٥√٣","٦"],"a":0},{"l":2,"k":"p","q":"قيمة √٦ × √٢ × √٣ تساوي:","o":["√١١","٦","٣٦","٢٢"],"a":1}],"hints":{"ناتج √٥ × √٢٠ يساوي:":"اضرب ما تحت الجذرين ثم خذ الجذر.","ناتج (٣ + √٥) - (٥ + √٢٠) بأبسط صورة هو:":"بسّط √٢٠ أولاً إلى ٢√٥.","محيط مستطيل بعداه (√٢٠ - √٢) و(√٥ + √٨) سم يساوي:":"بسّط كلّ جذر ثم اجمع البعدين وضاعف الناتج."}}]},{"title":"المقادير الجبرية","ic":"alg","color":"#cfe2b0","uq":[[0,"أيّ الحدود الآتية يشابه الحدّ ٤س²ص؟",["٤س ص²","٧س²ص","٤س²","٤ص²"],1],[0,"أيّ العبارات الآتية فرقٌ بين مربّعين؟",["٤س − ٢٥","س² − ٥","٤س² + ٢٥","٤س² − ٢٥"],3],[1,"ناتج (٣س² − ٢س + ١) − (س² − ٥س − ٤) هو:",["٢س² + ٣س − ٣","٢س² + ٣س + ٥","٢س² − ٧س − ٣","٤س² − ٧س − ٣"],1],[1,"ناتج (س + ٤)(س − ٣) هو:",["س² − س − ١٢","س² + ٧س − ١٢","س² + س − ١٢","س² − ١٢"],2],[1,"مفكوك (٢س + ٣)² هو:",["٤س² + ٩","٤س² + ٦س + ٩","٤س² + ١٢س + ٩","٢س² + ١٢س + ٩"],2],[1,"التحليل الكامل لـ ١٠أ²ب + ١٥أب² هو:",["٥أب(٢أ + ٣ب²)","أب(١٠أ + ١٥ب)","٥(٢أ²ب + ٣أب²)","٥أب(٢أ + ٣ب)"],3],[1,"تحليل س² − ٩س + ٢٠ هو:",["(س − ٤)(س − ٥)","(س − ٢)(س − ١٠)","(س + ٤)(س + ٥)","(س − ٤)(س + ٥)"],0],[1,"تحليل ٤س² − ٢٥ هو:",["(٢س + ٢٥)(٢س − ١)","(٤س + ٥)(س − ٥)","(٢س − ٥)(٢س − ٥)","(٢س + ٥)(٢س − ٥)"],3],[1,"ناتج (١٨س⁴ − ١٢س³) ÷ ٦س² هو:",["٣س³ − ٢س²","٣س² − ٢","١٢س² − ٦س","٣س² − ٢س"],3],[2,"ناتج (س² − س − ٦) ÷ (س − ٣) هو:",["س + ٢","س + ٣","س − ٢","س − ٣"],0],[2,"مستطيل مساحته (س² + ٧س + ١٠) وعرضه (س + ٢). فمحيطه يساوي:",["٤س + ١٤","٢س + ١٤","٢س + ٧","٤س + ١٠"],0],[2,"إذا كان أ + ب = ٧ وكان أب = ١٢ فإن أ² + ب² يساوي:",["٤٩","١٩","٣١","٢٥"],3]],"lessons":[{"t":"جمع المقادير الجبرية وطرحها","e":["# نشاط تمهيدي: تمثيل المقادير بالقطع الجبرية","نمثّل المقادير الجبرية بقطعٍ جبرية: مربّع كبير يمثّل س²، ومربّع أحمر يمثّل ص²، ومستطيل يمثّل س، ومربّع صغير يمثّل ١.","التمثيل الأول يمثّل المقدار ٣س + ص² + ١، والتمثيل الثاني يمثّل المقدار ٣س² + ٢س + ص² + ٣.","عند تجميع القطع من النوع نفسه نجد: ٣ قطع س²، وقطعتان ص²، و٥ قطع س، و٤ وحدات.","إذن مجموع المقدارين = ٣س² + ٥س + ٢ص² + ٤.","# القاعدة: الحدود المتشابهة","- الحدّان المتشابهان: حدّان لهما المتغيّرات نفسها وبالأسس نفسها، ويختلفان في المعامل فقط.","- المعامل: العدد الذي يضرب المتغيّر في الحدّ، مثل ٥ في ٥س².","- الحدّ الثابت: حدّ لا يحوي متغيّراً، مثل ٦ في ٣س + ٦.","عند جمع مقدارين جبريّين أو طرحهما نجمع أو نطرح معاملات الحدود المتشابهة فقط ونبقي المتغيّر وأسّه كما هما.","! تذكّر: ٣س² و٣س ليسا متشابهين لأنّ أسّ س يختلف، فلا يجوز جمعهما في حدٍّ واحد.","|الحدّان|متشابهان؟|السبب","|٤س و٧س|نعم|المتغيّر س بالأسّ نفسه","|٣أب و٥أ|لا|أب يحوي متغيّرين وأ يحوي متغيّراً واحداً","|٢ص² و−ص²|نعم|المتغيّر ص² نفسه والمعاملان مختلفان","# قاعدة الطرح","عند طرح مقدار جبري من آخر نغيّر إشارة كلّ حدٍّ في المقدار المطروح (نوزّع الإشارة السالبة على جميع حدوده) ثم نجمع الحدود المتشابهة.","! الخطأ الشائع: تغيير إشارة الحدّ الأول فقط في المقدار المطروح؛ والصواب تغيير إشارة جميع الحدود.","# أمثلة محلولة","? أجد ناتج (٣س² + ٥س − ٢) + (س² − ٧س + ٦) بأبسط صورة. || نجمع الحدود المتشابهة: س²: ٣+١=٤، س: ٥−٧=−٢، الثابت: −٢+٦=٤. الناتج = ٤س² − ٢س + ٤.","? أجد ناتج (٩س² − ٣س + ٥) − (٣س² + ٢س − ١) بأبسط صورة. || نغيّر إشارة كلّ حدّ في المطروح: ٩س² − ٣س + ٥ − ٣س² − ٢س + ١. ثم نجمع: س²: ٩−٣=٦، س: −٣−٢=−٥، الثابت: ٥+١=٦. الناتج = ٦س² − ٥س + ٦.","? أجد ناتج (−٢أب + ٣ب² + ٣) + (٥أ² + أب + ٢أ − ٦). || الحدود المتشابهة: −٢أب + أب = −أب، و٣ − ٦ = −٣، والباقي كما هو. الناتج = ٥أ² − أب + ٢أ + ٣ب² − ٣.","? حديقة على شكل رباعي أضلاعها (س + ٧) و(٢س + ١) و(٣س + ٢) وس. أجد طول السياج اللازم لإحاطتها بأبسط صورة. || المحيط = مجموع الأضلاع = (س+٧)+(٢س+١)+(٣س+٢)+س. نجمع س: ١+٢+٣+١=٧، والثوابت: ٧+١+٢=١٠. المحيط = ٧س + ١٠.","? مساحة صفيحة معدنية (٣ص² + ٣ص + ٢) قُطع منها جزء مساحته (ص² + ٢ص). أجد المقدار الباقي. || الباقي = المساحة الكلية − المقطوع = (٣ص² + ٣ص + ٢) − (ص² + ٢ص) = ٣ص² + ٣ص + ٢ − ص² − ٢ص = ٢ص² + ص + ٢.","# تدرّب","? أجد ناتج (−ص² + ٥ص − ٦) + (٢ص² − ٣ص + ٥). || ص²: −١+٢=١، ص: ٥−٣=٢، الثابت: −٦+٥=−١. الناتج = ص² + ٢ص − ١.","? أجد ناتج (٩س² − ٣س + ٥) − (٣س² + ٢س − ١) + (س² − ٢س − ٣). || نغيّر إشارة حدود المطروح ونجمع: س²: ٩−٣+١=٧، س: −٣−٢−٢=−٧، الثابت: ٥+١−٣=٣. الناتج = ٧س² − ٧س + ٣."],"q":["- ما الحدّان المتشابهان؟ أعطِ مثالاً على حدّين متشابهين وآخر على حدّين غير متشابهين.","- كيف نجمع مقدارين جبريّين؟ ولماذا لا نجمع ٣س² مع ٥س؟","- ماذا نفعل بإشارات حدود المقدار عند طرحه من مقدار آخر؟","- أجد بأبسط صورة: (٢س² + س − ٤) − (س² − ٣س + ١)."],"quiz":[{"l":0,"k":"n","q":"عند جمع مقدارين جبريّين نجمع:","o":["كل الحدود دون النظر إلى متغيّراتها","معاملات الحدود المتشابهة","المعاملات والأسس معاً","الأسس معاً"],"a":1},{"l":0,"k":"n","q":"أيّ الحدود الآتية يشابه الحدّ ٣س²؟","o":["٣ص²","٣س","٥س³","٥س²"],"a":3},{"l":0,"k":"n","q":"معامل س في الحدّ −٧س هو:","o":["١","−٧","٧","س"],"a":1},{"l":0,"k":"n","q":"عند طرح مقدار جبري من آخر فإننا:","o":["نضرب المعاملات ببعضها","نغيّر إشارة الحدّ الأول فقط ثم نجمع","نطرح الأسس من بعضها","نغيّر إشارة كلّ حدّ من حدود المقدار المطروح ثم نجمع"],"a":3},{"l":0,"k":"n","q":"الحدّ الثابت في المقدار ٣س² + ٥س − ٧ هو:","o":["٥","٣","−٧","٧"],"a":2},{"l":0,"k":"n","q":"ناتج ٤س + ٧س هو:","o":["٢٨س","١١س²","٣س","١١س"],"a":3},{"l":0,"k":"n","q":"أيّ الحدود الآتية لا يشابه ٢أب؟","o":["٢أ²ب","٧أب","١٠أب","−أب"],"a":0},{"l":0,"k":"n","q":"عدد الحدود في المقدار ٣س² − ٥س + ٦ هو:","o":["٤","١","٢","٣"],"a":3},{"l":1,"k":"p","q":"ناتج (٣س² + ٤س − ٥) + (٢س² − ٦س + ٨) بأبسط صورة هو:","o":["س² + ١٠س − ١٣","٣س² − ٢س + ٣","٥س² − ٢س","٥س² − ٢س + ٣"],"a":3},{"l":1,"k":"p","q":"ناتج (٥س² − ٢س + ٧) − (٢س² + ٣س − ٤) بأبسط صورة هو:","o":["٧س² + س + ٣","٣س² − ٥س + ١١","٣س² − ٥س + ٣","٣س² + س + ٣"],"a":1},{"l":1,"k":"p","q":"ناتج (٤أ² + أب − ٣) + (أ² − ٣أب + ٥) هو:","o":["٥أ² − ٢أب + ٢","٥أ² + ٤أب − ٨","٣أ² + ٤أب − ٨","٥أ² − ٤أب + ٢"],"a":0},{"l":1,"k":"p","q":"ناتج (٧ص² − ٢ص + ١) − (٣ص² − ٥ص − ٦) هو:","o":["٤ص² + ٣ص + ٧","٤ص² − ٧ص − ٥","٤ص² + ٣ص − ٥","١٠ص² − ٧ص − ٥"],"a":0},{"l":1,"k":"p","q":"قطعة أرض أضلاعها: (٢س + ١) و(س + ٤) و(٣س − ٢). ما محيطها؟","o":["٦س + ٧","٦س² + ٣","٦س + ٣","٦س − ٣"],"a":2},{"l":1,"k":"p","q":"إذا كان أ = ٣س + ٢ص − ١ و ب = س − ٤ص + ٦ فإن أ + ب تساوي:","o":["٢س + ٦ص − ٧","٤س + ٦ص + ٥","٤س − ٢ص + ٥","٤س − ٢ص − ٥"],"a":2},{"l":1,"k":"p","q":"ناتج (٢س² + ٥س) − (س² + س) هو:","o":["س² + ٤س","٣س² + ٦س","٥س²","س² + ٦س"],"a":0},{"l":1,"k":"p","q":"أبسط صورة للمقدار (−٢ص² + ٣ص) + (ص² − ٧ص + ٢) هي:","o":["−٣ص² + ١٠ص − ٢","−ص² + ٤ص + ٢","−ص² − ٤ص + ٢","−ص² − ٤ص − ٢"],"a":2},{"l":2,"k":"p","q":"ناتج (٣س² − ٤س + ١) − (س² + ٢س − ٥) + (٢س² − س + ٣) هو:","o":["٢س² − س − ٧","−٥س + ٣","٦س² − ٣س − ١","٤س² − ٧س + ٩"],"a":3},{"l":2,"k":"p","q":"ناتج (٣س² − ٤س + ١) + (س² + ٢س − ٥) − (٢س² − س + ٣) هو:","o":["٤س² − ٧س + ٩","٦س² − ٣س − ١","−٥س + ٣","٢س² − س − ٧"],"a":3},{"l":2,"k":"p","q":"مجموع مقدارين هو ٥س² − ٣س + ٩، وأحدهما ٢س² + س − ٤. فالمقدار الآخر هو:","o":["−٣س² + ٤س − ١٣","٣س² − ٤س + ٥","٧س² − ٢س + ٥","٣س² − ٤س + ١٣"],"a":3},{"l":2,"k":"p","q":"ما المقدار الذي يجب جمعه إلى س² + ٣س − ٢ ليصبح الناتج ٤س² − س + ٦؟","o":["٣س² + ٢س + ٤","٣س² − ٤س + ٨","٥س² + ٢س + ٤","−٣س² + ٤س − ٨"],"a":1},{"l":2,"k":"p","q":"مثلّث أطوال أضلاعه (٢س + ٣) و(٣س − ١) و(س + ٧). محيطه عندما س = ٢ يساوي:","o":["٣٣","١٥","٢١","٢٧"],"a":2},{"l":2,"k":"p","q":"مستطيل محيطه ١٠س + ٦ وطوله (٣س + ٥). فعرضه يساوي:","o":["٢س − ٢","٢س + ٢","٧س + ١","٢س − ٥"],"a":0},{"l":2,"k":"p","q":"ما قيمة (٣س² + ٢س) − (س² − ٤س) عندما س = ١؟","o":["١٠","٤","٨","٦"],"a":2},{"l":2,"k":"p","q":"مساحة صفيحة (٥ص² + ٢ص + ٧) قُطع منها جزء مساحته (٢ص² − ٣ص + ١). فإذا كانت ص = ٢ فمساحة الباقي تساوي:","o":["٣١","١٩","٢٨","٢٧"],"a":2}],"hints":{"عند طرح مقدار جبري من آخر فإننا:":"لا تغيّر إشارة الحدّ الأول وحده؛ وزّع الإشارة السالبة على كل حدود المقدار المطروح.","ناتج (٣س² + ٤س − ٥) + (٢س² − ٦س + ٨) بأبسط صورة هو:":"اجمع معاملات س² معاً، ثم معاملات س، ثم الحدود الثابتة.","مجموع مقدارين هو ٥س² − ٣س + ٩، وأحدهما ٢س² + س − ٤. فالمقدار الآخر هو:":"المقدار الآخر = المجموع − المقدار المعلوم؛ اطرح حدّاً حدّاً."}},{"t":"ضرب المقادير الجبرية","e":["# نشاط تمهيدي: لوحة الإعلانات","لوحة زجاجية مكوّنة من ثلاث قطع عرضها س، وأطوالها ٢ و ص و س.","مساحة اللوحة = العرض × الطول = س(س + ص + ٢) = س² + س ص + ٢س.","ومساحتها أيضاً = مجموع مساحات القطع الثلاث = ٢س + س ص + س²، وهو الناتج نفسه بترتيبٍ مختلف للحدود.","# قاعدة: خاصية التوزيع","- خاصية توزيع الضرب على الجمع: أ(ب + ج) = أب + أج، ويمكن استخدامها لأيّ عدد من الحدود.","- ضرب حدّ جبري في مقدار جبري: نضرب الحدّ في كلّ حدّ من حدود المقدار، ونضرب المعاملات معاً والمتغيّرات المتماثلة بجمع أسسها.","- ضرب مقدارين جبريّين: (أ + ب)(ج + د) = أ(ج + د) + ب(ج + د) = أج + أد + بج + بد.","! عند ضرب المتغيّر نفسه نجمع الأسس: س × س² = س³، وليس س².","# مربّع مجموع حدّين ومربّع الفرق","- مفكوك مربّع مجموع حدّين: مربّع الحدّ الأول + ٢ × الحدّ الأول × الحدّ الثاني + مربّع الحدّ الثاني؛ أي (أ + ب)² = أ² + ٢أب + ب².","- مفكوك مربّع الفرق بين حدّين: مربّع الحدّ الأول − ٢ × الحدّ الأول × الحدّ الثاني + مربّع الحدّ الثاني؛ أي (أ − ب)² = أ² − ٢أب + ب².","! (أ + ب)² لا يساوي أ² + ب²؛ ننسى الحدّ الأوسط ٢أب كثيراً.","|المقدار|المفكوك","|(س + ١)²|س² + ٢س + ١","|(٢س + ٢)²|٤س² + ٨س + ٤","|(س − ٣)²|س² − ٦س + ٩","# أمثلة محلولة","? أجد ناتج ٣(س² − ١) + س(٥س − ١) بأبسط صورة. || نوزّع: ٣س² − ٣ + ٥س² − س = ٨س² − س − ٣.","? أجد ناتج ٢أب(أ² + ٥ب²). || ٢أب × أ² + ٢أب × ٥ب² = ٢أ³ب + ١٠أب³.","? أجد ناتج (٥م ل + ٣)(٣ل + م). || نضرب كلّ حدّ في الأول بالمقدار الثاني: ٥م ل(٣ل + م) + ٣(٣ل + م) = ١٥م ل² + ٥م² ل + ٩ل + ٣م. الناتج = ٥م² ل + ١٥م ل² + ٣م + ٩ل.","? أجد ناتج (س + ٢)(س + ٣). || س(س + ٣) + ٢(س + ٣) = س² + ٣س + ٢س + ٦ = س² + ٥س + ٦.","? أفكّ (٣س + ص)². || مربّع الحدّ الأول = ٩س²، ٢ × ٣س × ص = ٦س ص، مربّع الحدّ الثاني = ص². الناتج = ٩س² + ٦س ص + ص².","? أفكّ (٢س − ٣ص)². || (٢س)² − ٢ × ٢س × ٣ص + (٣ص)² = ٤س² − ١٢س ص + ٩ص².","# تدرّب","? أكتب ناتج ضرب (٣ف + ٢)(٣ف − ٢) وأجد قيمته عندما ف = ٤. || (٣ف + ٢)(٣ف − ٢) = ٩ف² − ٦ف + ٦ف − ٤ = ٩ف² − ٤. وعندما ف = ٤: ٩ × ١٦ − ٤ = ١٤٤ − ٤ = ١٤٠. (تحقّق: (١٤)(١٠) = ١٤٠).","? إذا كان (أ + ب) = ٨ وكان أ² + ب² = ٤٠، أجد أب و(أ − ب)². || (أ + ب)² = أ² + ٢أب + ب² ⇒ ٦٤ = ٤٠ + ٢أب ⇒ أب = ١٢. و(أ − ب)² = أ² − ٢أب + ب² = ٤٠ − ٢٤ = ١٦.","? أبسّط س(س − ٢) + (س + ٣)². || س² − ٢س + س² + ٦س + ٩ = ٢س² + ٤س + ٩."],"q":["- اكتب خاصية توزيع الضرب على الجمع، وطبّقها على ٢س(س + ٥).","- كيف نضرب مقدارين جبريّين كلّ منهما من حدّين؟","- اكتب مفكوك (أ + ب)² و(أ − ب)²، وما الفرق بينهما؟","- أجد ناتج (٣س + ٢)² ثم (٣س − ٢)².","- لماذا ناتج س × س² يساوي س³؟"],"quiz":[{"l":0,"k":"n","q":"خاصية توزيع الضرب على الجمع تعني أنّ أ(ب + ج) =","o":["أب × أج","أ + ب ج","أب + أج","أب + ج"],"a":2},{"l":0,"k":"n","q":"مفكوك (أ + ب)² هو:","o":["أ² + أب + ب²","أ² + ب²","أ² − ٢أب + ب²","أ² + ٢أب + ب²"],"a":3},{"l":0,"k":"n","q":"مفكوك (أ − ب)² هو:","o":["أ² − ب²","أ² − ٢أب + ب²","أ² − أب + ب²","أ² + ٢أب + ب²"],"a":1},{"l":0,"k":"n","q":"ناتج س × س² هو:","o":["س³","٢س³","س⁶","س²"],"a":0},{"l":0,"k":"n","q":"ناتج ٣س × ٥س هو:","o":["٨س²","١٥س","٨س","١٥س²"],"a":3},{"l":0,"k":"n","q":"مفكوك مربّع مجموع حدّين = مربّع الحدّ الأول + ٢ × الحدّ الأول × الحدّ الثاني +","o":["ناتج طرح الحدّين","٢ × مربّع الحدّ الثاني","الحدّ الثاني","مربّع الحدّ الثاني"],"a":3},{"l":0,"k":"n","q":"عند ضرب (أ + ب)(ج + د) نضرب:","o":["الحدّ الأول فقط في المقدار الثاني","كلّ حدّ في المقدار الأول بكلّ حدّ في المقدار الثاني","المعاملات فقط ونهمل المتغيّرات","الحدّين الأخيرين فقط"],"a":1},{"l":0,"k":"n","q":"ناتج س(س + ٣) هو:","o":["س² + ٣","س² + ٣س","٤س","٢س + ٣"],"a":1},{"l":1,"k":"p","q":"ناتج (س + ٤)(س + ٥) هو:","o":["س² + ٩س + ٢٠","س² + ٩س + ٩","س² + ٢٠س + ٩","س² + ٢٠"],"a":0},{"l":1,"k":"p","q":"ناتج (س − ٤)(س + ٥) هو:","o":["س² + س − ٢٠","س² − س + ٢٠","س² − ٢٠","س² + ٩س − ٢٠"],"a":0},{"l":1,"k":"p","q":"مفكوك (٣س + ص)² هو:","o":["٩س² + ص²","٣س² + ٦س ص + ص²","٩س² + ٣س ص + ص²","٩س² + ٦س ص + ص²"],"a":3},{"l":1,"k":"p","q":"مفكوك (٢س − ٣ص)² هو:","o":["٤س² − ٩ص²","٤س² − ١٢س ص + ٩ص²","٤س² − ٦س ص + ٩ص²","٤س² + ١٢س ص + ٩ص²"],"a":1},{"l":1,"k":"p","q":"ناتج ٣س(٢س² − س + ٤) هو:","o":["٦س² − ٣س + ١٢","٦س³ − س + ٤","٦س³ − ٣س + ١٢","٦س³ − ٣س² + ١٢س"],"a":3},{"l":1,"k":"p","q":"ناتج ٢أب(أ² + ٥ب²) هو:","o":["٢أ³ب + ١٠أ²ب³","٢أ³ب + ١٠أب³","٢أ²ب + ١٠أب²","٢أ³ب + ٥ب²"],"a":1},{"l":1,"k":"p","q":"قيمة (٣ف + ٢)(٣ف − ٢) عندما ف = ٤ هي:","o":["١٦٠","١٤٤","١٤٠","١٣٦"],"a":2},{"l":1,"k":"p","q":"قيمة (س + ٥)² عندما س = ٣ هي:","o":["٤٩","٦٤","٣٤","٢٤"],"a":1},{"l":2,"k":"p","q":"ناتج (٢س + ١)(س² − س + ٣) هو:","o":["٢س³ − س² + ٥س + ٣","٢س³ − س² + ٥س + ١","٢س³ − ٣س² + ٥س + ٣","٢س³ − س² + ٥س − ٣"],"a":0},{"l":2,"k":"p","q":"أبسط صورة للمقدار (س + ٢)(س − ٢) + (س + ١)² هي:","o":["٢س² + ٢س + ٥","٢س² − ٣","٢س² + ١","٢س² + ٢س − ٣"],"a":3},{"l":2,"k":"p","q":"ناتج (س + ٣)² − (س − ٣)² هو:","o":["١٨","٢س² + ١٨","١٢س","١٢"],"a":2},{"l":2,"k":"p","q":"إذا كان أ + ب = ٨ وكان أ² + ب² = ٤٠ فإن أب يساوي:","o":["١٦","١٢","٦","٢٤"],"a":1},{"l":2,"k":"p","q":"إذا كان أ − ب = ٢ وكان أب = ٣ فإن أ² + ب² يساوي:","o":["٤","٧","١٣","١٠"],"a":3},{"l":2,"k":"p","q":"مستطيل طوله (٣س + ٢) وعرضه (س − ١). مساحته عندما س = ٣ تساوي:","o":["٢٥","٢٢","١١","٣٣"],"a":1},{"l":2,"k":"p","q":"ناتج (س + ٢)(س + ٣) − س(س + ٥) هو:","o":["١١","٢س² + ٦","٥س + ٦","٦"],"a":3},{"l":2,"k":"p","q":"إذا كان (أ + ب)² = ٤٩ وكان أ² + ب² = ٢٥ فإن أب يساوي:","o":["٢٤","١٦","١٢","٧"],"a":2}],"hints":{"مفكوك (٣س + ص)² هو:":"افتح القوسين بتوزيع كلّ حدّ على الآخر ولا تنسَ الحدّ الأوسط ٢أب.","ناتج ٣س(٢س² − س + ٤) هو:":"اضرب ٣س في كلّ حدّ من حدود المقدار داخل القوس واحداً واحداً.","إذا كان أ + ب = ٨ وكان أ² + ب² = ٤٠ فإن أب يساوي:":"(أ + ب)² = أ² + ٢أب + ب²؛ اعوّض المعطيات ثم أوجد أب."}},{"t":"تحليل المقادير الجبرية بإخراج العامل المشترك","e":["# نشاط تمهيدي: ما العامل المشترك؟","التحليل إلى العوامل عملية عكسية للضرب: نكتب المقدار الجبري على صورة حاصل ضرب عوامله.","لنحلّل ٦أ + ١٨أ²: نكتب ٦أ = ٦ × أ و١٨أ² = ٦ × ٣ × أ × أ، فنلاحظ أنّ العامل المشترك الأكبر للحدّين هو ٦أ.","ومنه: ٦أ + ١٨أ² = ٦أ × ١ + ٦أ × ٣أ = ٦أ(١ + ٣أ).","# القاعدة","- العامل المشترك الأكبر (ع.م.أ): أكبر حدٍّ جبري يقسم جميع حدود المقدار دون باقٍ.","- خطوات إخراج العامل المشترك: نجد ع.م.أ للمعاملات، ثم نأخذ كلّ متغيّر مشترك بأصغر أسٍّ له، ثم نقسم كلّ حدّ على العامل المشترك فنكتب النواتج داخل القوس.","- التحليل بالتجميع: نجمع الحدود في مجموعات يشترك أفراد كلٍّ منها بعاملٍ، ثم نخرج العامل المشترك من كلّ مجموعة، وأخيراً نخرج المقدار المشترك بين المجموعات.","! للتحقّق من صحة التحليل اضرب العوامل مرة أخرى، فإن حصلت على المقدار الأصلي فالتحليل صحيح.","# أمثلة: العامل المشترك حدّ جبري","? أحلّل ١٦أس + ١٤س²ص إلى عوامله. || ع.م.أ للمعاملين ١٦ و١٤ هو ٢، والمتغيّر المشترك س بأصغر أسّ (س¹). إذن العامل المشترك ٢س. نقسم: ١٦أس ÷ ٢س = ٨أ، و١٤س²ص ÷ ٢س = ٧س ص. الناتج = ٢س(٧س ص + ٨أ).","? أحلّل ١٤أب + ٢١ب². || ع.م.أ للمعاملين ١٤ و٢١ هو ٧، والمتغيّر المشترك ب. العامل المشترك ٧ب. الناتج = ٧ب(٢أ + ٣ب).","? أحلّل ١٢س³ − ١٨س². || ع.م.أ للمعاملين = ٦، وأصغر أسّ لـ س هو ٢، فالعامل المشترك ٦س². نقسم: ١٢س³ ÷ ٦س² = ٢س، و−١٨س² ÷ ٦س² = −٣. الناتج = ٦س²(٢س − ٣).","# أمثلة: العامل المشترك مقدارٌ بين قوسين","? أحلّل أ(٣ب − ٤) − ٨(٣ب − ٤). || المقدار (٣ب − ٤) عاملٌ مشترك بين الحدّين، فنخرجه: (٣ب − ٤)(أ − ٨).","? أحلّل (أ + ١)(أ − ٢) − (أ + ١)(أ − ٤). || العامل المشترك (أ + ١): (أ + ١)[(أ − ٢) − (أ − ٤)] = (أ + ١)(أ − ٢ − أ + ٤) = (أ + ١)(٢) = ٢(أ + ١).","# أمثلة: التحليل بالتجميع","? أحلّل أس − أص + بس − بص. || نجمع الحدّين الأولين والحدّين الأخيرين: (أس − أص) + (بس − بص) = أ(س − ص) + ب(س − ص). نخرج العامل المشترك (س − ص): (س − ص)(أ + ب).","? أحلّل س ص + ٢س + ٢ص + ٤. || (س ص + ٢س) + (٢ص + ٤) = س(ص + ٢) + ٢(ص + ٢) = (ص + ٢)(س + ٢).","# تدرّب","? أحلّل −٥س ص − ٤٠ص² إلى عوامله. || العامل المشترك −٥ص (نخرج إشارة السالب حتى يبقى الحدّ الأول داخل القوس موجباً): −٥ص(س + ٨ص). تحقّق: −٥ص × س = −٥س ص، −٥ص × ٨ص = −٤٠ص².","? أحلّل ٢٠أه + ٤به + ١٠أس + ٢بس إلى عواملها الأولية. || نجمّع: (٢٠أه + ٤به) + (١٠أس + ٢بس) = ٤ه(٥أ + ب) + ٢س(٥أ + ب) = (٥أ + ب)(٤ه + ٢س) = ٢(٥أ + ب)(س + ٢ه).","? مساحة مستطيل ٣س² + ٥س متراً مربّعاً وعرضه س متراً. ما طوله؟ || المساحة = الطول × العرض. نحلّل: ٣س² + ٥س = س(٣س + ٥). فالعرض س والطول (٣س + ٥) متراً."],"q":["- ما معنى تحليل مقدار جبري؟ وكيف نتحقّق من صحة التحليل؟","- كيف نجد العامل المشترك الأكبر لحدّين جبريّين؟","- حلّل ٦أ + ١٨أ² وبيّن خطواتك.","- كيف نحلّل مقداراً من أربعة حدود بالتجميع؟ وضّح ذلك بمثال."],"quiz":[{"l":0,"k":"n","q":"العامل المشترك الأكبر للحدّين ٦أ و١٨أ² هو:","o":["٦أ","١٨أ²","٣أ","٦"],"a":0},{"l":0,"k":"n","q":"تحليل المقدار الجبري يعني كتابته على صورة:","o":["ناتج قسمته على نفسه","حاصل ضرب عوامله","فرق بين مقدارين","مجموع حدود أخرى"],"a":1},{"l":0,"k":"n","q":"العامل المشترك الأكبر للعددين ١٢ و١٨ هو:","o":["٢","٣","٦","٣٦"],"a":2},{"l":0,"k":"n","q":"عند إخراج عامل مشترك متغيّر نأخذ من المتغيّر المشترك:","o":["الأسّ الأصغر","الأسّ الأكبر","حاصل ضرب الأسس","مجموع الأسس"],"a":0},{"l":0,"k":"n","q":"تحليل ٥س + ١٠ هو:","o":["٥(س + ٥)","٥(س + ٢)","س(٥ + ١٠)","٥(س + ١٠)"],"a":1},{"l":0,"k":"n","q":"يُستخدم التحليل بالتجميع عادةً مع مقدار جبري:","o":["فيه حدّ ثابت فقط","عدد حدوده أربعة","حدٌّ واحد","جميع حدوده متشابهة"],"a":1},{"l":0,"k":"n","q":"إذا ضربنا عوامل مقدار بعد تحليله فإننا نحصل على:","o":["مقدار مختلف دائماً","صفر","المقدار الأصلي نفسه","العامل المشترك فقط"],"a":2},{"l":0,"k":"n","q":"العامل المشترك بين الحدّين ٣س² و٩س هو:","o":["٣س²","٣س","٩س","س²"],"a":1},{"l":1,"k":"p","q":"عند إخراج العامل المشترك الأكبر من ١٤أب + ٢١ب² نحصل على:","o":["٧ب(٢أ + ٣ب²)","٧(٢أب + ٣ب²)","٧ب(٢أ + ٣ب)","ب(١٤أ + ٢١ب)"],"a":2},{"l":1,"k":"p","q":"تحليل ٦س² + ٩س إلى عوامله هو:","o":["٣(٢س² + ٣س)","س(٦س + ٩)","٣س(٢س + ٩)","٣س(٢س + ٣)"],"a":3},{"l":1,"k":"p","q":"تحليل ١٢س³ − ١٨س² بإخراج العامل المشترك الأكبر هو:","o":["٦س²(٢س − ٣)","٦س²(٢س − ١٨)","١٢س²(س − ١٨)","٦س(٢س² − ٣س)"],"a":0},{"l":1,"k":"p","q":"تحليل −٥س ص − ٤٠ص² هو:","o":["٥ص(س + ٨ص)","−٥ص(س + ٨ص)","−٥ص(س − ٨ص)","−٥س(٨ص² + ص)"],"a":1},{"l":1,"k":"p","q":"تحليل س ص + ٢س + ٢ص + ٤ هو:","o":["(س + ٤)(ص + ٢)","(س + ٢)(ص + ٤)","(س + ٢)(ص + ٢)","(س + ص)(٢)"],"a":2},{"l":1,"k":"p","q":"تحليل أ(٣ب − ٤) − ٨(٣ب − ٤) هو:","o":["(أ − ٨)(٣ب + ٤)","(٣ب − ٤)(أ + ٨)","(٣ب − ٤)(أ − ٨)","(٣ب − ٤)(أ − ٤)"],"a":2},{"l":1,"k":"p","q":"تحليل أس − أص + بس − بص هو:","o":["(س − ص)(أب)","(س − ص)(أ − ب)","(س + ص)(أ + ب)","(س − ص)(أ + ب)"],"a":3},{"l":1,"k":"p","q":"أيّ الآتي هو التحليل الكامل لـ ٣س ص + ٦ص؟","o":["٣ص(س + ٢)","٣ص(س + ٦)","٣(س ص + ٢ص)","ص(٣س + ٦)"],"a":0},{"l":2,"k":"p","q":"العامل المشترك الأكبر للحدود ١٢أ²ب و١٨أب² و٣٠أب هو:","o":["١٢أب","٦أب","٣أب","٦أ²ب²"],"a":1},{"l":2,"k":"p","q":"حلّل (أ + ١)(أ − ٢) − (أ + ١)(أ − ٤) بأبسط صورة:","o":["٢(أ + ١)","−٢(أ + ١)","(أ + ١)(أ − ٦)","٢(أ − ١)"],"a":0},{"l":2,"k":"p","q":"تحليل ١٢ + ٨ص − ٣س − ٢س ص هو:","o":["(٤ − س)(٣ص + ٢)","(٣ + ٢ص)(٤ − س)","(٣ − ٢ص)(٤ − س)","(٣ + ٢ص)(٤ + س)"],"a":1},{"l":2,"k":"p","q":"التحليل الكامل لـ ٢٠أه + ٤به + ١٠أس + ٢بس هو:","o":["(٥أ + ب)(س + ٢ه)","٢(أ + ٥ب)(س + ٢ه)","٢(٥أ + ب)(س + ه)","٢(٥أ + ب)(س + ٢ه)"],"a":3},{"l":2,"k":"p","q":"مستطيل مساحته (٣س² + ٥س) وعرضه س. فطوله يساوي:","o":["٨س","٣س² + ٥","٣س + ٥","٣س² + ٤س"],"a":2},{"l":2,"k":"p","q":"قيمة ٣٧ × ٢٥ + ٣٧ × ٧٥ بإخراج العامل المشترك هي:","o":["٣٦٠٠","٢٧٠٠","٣٧٠٠","٣٧٠"],"a":2},{"l":2,"k":"p","q":"إذا كان أ + ب = ٥ وكان أب = ٦ فإن أ²ب + أب² يساوي:","o":["١١","٢٥","٣٦","٣٠"],"a":3},{"l":2,"k":"p","q":"مستطيل مساحته (٦س² + ٤س) وعرضه ٢س. محيطه يساوي:","o":["١٠س + ٤","٥س + ٢","٦س + ٤","٨س + ٤"],"a":0}],"hints":{"عند إخراج العامل المشترك الأكبر من ١٤أب + ٢١ب² نحصل على:":"ابحث عن أكبر عدد يقسم المعاملين، ثم خذ المتغيّر المشترك بأصغر أسّ.","تحليل أ(٣ب − ٤) − ٨(٣ب − ٤) هو:":"لاحظ أنّ (٣ب − ٤) يتكرّر في الحدّين؛ أخرجه كعامل مشترك.","تحليل ١٢ + ٨ص − ٣س − ٢س ص هو:":"اجمع الحدّين الأولين معاً والحدّين الأخيرين معاً ثم أخرج عاملاً من كلّ مجموعة."}},{"t":"تحليل العبارة التربيعية","e":["# نشاط ١: ما العبارة التربيعية؟","- العبارة التربيعية: مقدار جبري يمكن كتابته بالصورة أس² + بس + ج، حيث أ وب وج أعداد ثابتة وأ ≠ ٠.","- معامل س²: العدد أ، ومعامل س: العدد ب، والحدّ الثابت: العدد ج.","|المقدار|عبارة تربيعية؟|أ، ب، ج","|س² + ٥س + ٦|نعم|أ = ١، ب = ٥، ج = ٦","|س² + ٩ − ٦س|نعم|أ = ١، ب = −٦، ج = ٩","|س³ + س + ٦|لا|أعلى أسّ للمتغيّر ٣","|٥(س − ١)|لا|أعلى أسّ للمتغيّر ١","|٨ − س² − ٢س|نعم|أ = −١، ب = −٢، ج = ٨","# تحليل المربّع الكامل","العبارة التربيعية المكتوبة بالصورة س² ± ٢دس + د² تُسمّى مربّعاً كاملاً، ويكون تحليلها (س ± د)(س ± د) = (س ± د)².","! لتعرف أنّ العبارة مربّع كامل: الحدّ الأول مربّع كامل، والأخير مربّع كامل، والحدّ الأوسط = ٢ × (جذر الأول) × (جذر الأخير).","? أحلّل س² + ١٠س + ٢٥. || س² = (س)²، و٢٥ = (٥)²، و٢ × س × ٥ = ١٠س ✓. إذن س² + ١٠س + ٢٥ = (س + ٥)² = (س + ٥)(س + ٥).","? أحلّل س² − ٨س + ١٦. || س² = (س)²، ١٦ = (٤)²، ٢ × س × ٤ = ٨س، والإشارة سالبة. إذن = (س − ٤)².","? أحلّل ٤س² − ٢٠س + ٢٥. || ٤س² = (٢س)²، ٢٥ = (٥)²، ٢ × ٢س × ٥ = ٢٠س ✓. إذن = (٢س − ٥)².","# تحليل س² + بس + ج بالبحث عن عددين","لتحليل س² + بس + ج نبحث عن عددين م و ن بحيث م + ن = ب و م × ن = ج، فيكون التحليل (س + م)(س + ن).","- إذا كان ج موجباً: م و ن متشابهان في الإشارة وتكون إشارتهما تبعاً لإشارة ب.","- إذا كان ج سالباً: م و ن مختلفان في الإشارة، وتتبع إشارةُ الأكبر منهما إشارةَ ب.","! تحقّق دائماً بالضرب: (س + م)(س + ن) = س² + (م + ن)س + م ن.","? أحلّل س² + ٧س + ١٠. || ج = ١٠ = ٢ × ٥، وب = ٧ = ٢ + ٥. إذن = (س + ٢)(س + ٥).","? أحلّل س² − ١١س + ١٨. || ج = ١٨ موجب وب = −١١ سالب فالعددان سالبان: −٢ × −٩ = ١٨ و−٢ + −٩ = −١١. إذن = (س − ٢)(س − ٩).","? أحلّل س² + ٢س − ٣. || ج = −٣ = ٣ × −١ ، وب = ٢ = ٣ + (−١). إذن = (س + ٣)(س − ١).","? أحلّل س² − ١٠س − ٢٤. || ج = −٢٤ = ٢ × −١٢ ، وب = −١٠ = ٢ + (−١٢) (الأكبر ١٢ سالب مثل إشارة ب). إذن = (س + ٢)(س − ١٢).","# التحليل بطريقة الضرب التبادلي (أ ≠ ١)","عندما يكون معامل س² أكبر من ١ نكتب عوامل الحدّ أس² وعوامل الحدّ الثابت ج، ونجرّب الضرب التبادلي حتى يكون مجموع حاصلي الضرب الداخلي والخارجي يساوي الحدّ الأوسط بس.","! بعد إيجاد العوامل اضرب القوسين للتأكد من أنّ الحدّ الأوسط صحيح.","? أحلّل ٣س² − ١٦س + ٢١. || عوامل ٣س²: ٣س و س. عوامل ٢١: −٧ و −٣. نجرّب (٣س − ٧)(س − ٣): الحدّ الأوسط = −٩س − ٧س = −١٦س ✓. إذن = (٣س − ٧)(س − ٣).","? أحلّل ٦ص² − ١٩ص + ١٠. || نجرّب (٢ص − ٥)(٣ص − ٢): الحدّ الأوسط = −٤ص − ١٥ص = −١٩ص ✓، والحدّ الثابت (−٥)(−٢) = ١٠ ✓. إذن = (٢ص − ٥)(٣ص − ٢).","# تدرّب","? أحلّل ٩س² − ٦س ص + ص². || ٩س² = (٣س)²، ص² = (ص)²، ٢ × ٣س × ص = ٦س ص ✓. إذن = (٣س − ص)².","? ما قيمة ك التي تجعل س² + ك س − ١٩ = (س − ١٩)(س + ١) صحيحاً؟ || (س − ١٩)(س + ١) = س² + س − ١٩س − ١٩ = س² − ١٨س − ١٩. بالمقارنة: ك = −١٨.","? مساحة لوح خلايا شمسية مستطيل (س² + ٢٤س − ٨١). أكتب محيطه. || نحلّل: س² + ٢٤س − ٨١: عددان حاصل ضربهما −٨١ ومجموعهما ٢٤: ٢٧ و −٣. = (س + ٢٧)(س − ٣). المحيط = ٢[(س + ٢٧) + (س − ٣)] = ٢(٢س + ٢٤) = ٤س + ٤٨."],"q":["- ما العبارة التربيعية؟ وكيف نحدّد قيم أ وب وج فيها؟","- متى تكون العبارة التربيعية مربّعاً كاملاً؟ وكيف نحلّلها؟","- حلّل س² + ٧س + ١٠ وبيّن كيف اخترت العددين.","- ماذا تقول عن إشارتي العددين م و ن إذا كان ج سالباً؟","- حلّل ٣س² − ١٦س + ٢١ بالضرب التبادلي."],"quiz":[{"l":0,"k":"n","q":"العبارة التربيعية هي مقدار جبري يمكن كتابته بالصورة:","o":["أس + ب","أس² + بس + ج حيث أ = ٠","أس³ + بس + ج","أس² + بس + ج حيث أ ≠ ٠"],"a":3},{"l":0,"k":"n","q":"أيّ المقادير الآتية عبارة تربيعية؟","o":["س + ٧","س² + ٥س + ٦","س³ + س + ٦","٥(س − ١)"],"a":1},{"l":0,"k":"n","q":"معامل س² في العبارة ٣س² − ٢س + ٧ هو:","o":["٢","٧","٣","−٢"],"a":2},{"l":0,"k":"n","q":"الحدّ الثابت في العبارة س² + ٥س + ٦ هو:","o":["س²","٦","١","٥"],"a":1},{"l":0,"k":"n","q":"العبارة التربيعية س² + ٢دس + د² تُسمّى:","o":["عاملاً مشتركاً","فرقاً بين مربّعين","مقداراً ثابتاً","مربّعاً كاملاً"],"a":3},{"l":0,"k":"n","q":"تحليل المربّع الكامل س² + ٢دس + د² هو:","o":["س² + د²","(س + د)²","(س − د)²","(س + د)(س − د)"],"a":1},{"l":0,"k":"n","q":"لتحليل س² + بس + ج نبحث عن عددين م و ن بحيث:","o":["م + ن = ج و م − ن = ب","م + ن = ب و م × ن = ج","م × ن = ب و م + ن = ج","م = ن = ج"],"a":1},{"l":0,"k":"n","q":"إذا كان ج موجباً في س² + بس + ج فإنّ إشارتي العددين م و ن:","o":["موجبتان دائماً","متشابهتان وتتبعان إشارة ب","سالبتان دائماً","مختلفتان دائماً"],"a":1},{"l":1,"k":"p","q":"تحليل س² + ٧س + ١٠ هو:","o":["(س − ٢)(س − ٥)","(س + ٢)(س + ٥)","(س + ١)(س + ١٠)","(س + ٧)(س + ١٠)"],"a":1},{"l":1,"k":"p","q":"تحليل س² − ٤س + ٣ هو:","o":["(س − ٤)(س + ٣)","(س + ١)(س + ٣)","(س − ١)(س − ٣)","(س − ١)(س + ٣)"],"a":2},{"l":1,"k":"p","q":"تحليل س² − ١١س + ١٨ هو:","o":["(س − ١)(س − ١٨)","(س + ٢)(س + ٩)","(س − ٣)(س − ٦)","(س − ٢)(س − ٩)"],"a":3},{"l":1,"k":"p","q": مة ك."}},{"t":"تحليل الفرق بين مربّعين","e":["# القاعدة: الفرق بين مربّعين","- الفرق بين مربّعين: مقدار جبري من حدّين، كلٌّ منهما مربّع كامل، وبينهما إشارة طرح، مثل س² − ص².","- قاعدة التحليل: س² − ص² = (س + ص)(س − ص)؛ أي مجموع الجذرين × الفرق بين الجذرين.","المعنى الهندسي: الفرق بين مساحتي مربّعين يساوي مساحة مستطيل طوله مجموع ضلعي المربّعين وعرضه الفرق بين طولي ضلعيهما.","! المجموع س² + ص² لا يُحلَّل بهذه القاعدة؛ المطلوب دائماً إشارة طرح بين مربّعين.","# نشاط: تحليل عبارات","|العبارة|التحليل","|ص² − ٢٥|(ص + ٥)(ص − ٥)","|ص² − ٦٤|(ص + ٨)(ص − ٨)","|٤ص² − ١٤٤|(٢ص + ١٢)(٢ص − ١٢)","|٢٥م² − ٩ل²|(٥م + ٣ل)(٥م − ٣ل)","|٤أ² − ٩|(٢أ + ٣)(٢أ − ٣)","# أمثلة محلولة","? أحلّل ص² − ٢٥. || ص² = (ص)² و٢٥ = (٥)². إذن ص² − ٢٥ = (ص + ٥)(ص − ٥).","? أحلّل ٢٥م² − ٩ل². || ٢٥م² = (٥م)² و٩ل² = (٣ل)². إذن = (٥م + ٣ل)(٥م − ٣ل).","? أحلّل ١٤٤أ² − ١٠٠ب². || ١٤٤أ² = (١٢أ)² و١٠٠ب² = (١٠ب)²، فيكون = (١٢أ + ١٠ب)(١٢أ − ١٠ب). ونلاحظ أنّ كلاً من القوسين له عامل مشترك ٢، فالتحليل الكامل = ٤(٦أ + ٥ب)(٦أ − ٥ب).","? أحلّل ٨س² − ٧٢. || نخرج العامل المشترك ٨ أولاً: ٨(س² − ٩) ثم نحلّل الفرق بين مربّعين: ٨(س + ٣)(س − ٣).","# استخدام القاعدة في الحساب والمسائل","? أجد القيمة العددية للمقدار (٦٧٥)² − (٣٢٥)² بطريقتين. || الطريقة الأولى (التربيع): ٦٧٥² = ٤٥٥٦٢٥ و٣٢٥² = ١٠٥٦٢٥، والفرق = ٣٥٠٠٠٠. الطريقة الثانية (الفرق بين مربّعين): (٦٧٥ + ٣٢٥)(٦٧٥ − ٣٢٥) = ١٠٠٠ × ٣٥٠ = ٣٥٠٠٠٠. الطريقتان تعطيان الناتج نفسه والثانية أسرع.","? أعبّر عن المقدار (١٠٤) × (٩٦) بصورة فرقٍ بين مربّعين ثم أجد قيمته. || ١٠٤ = ١٠٠ + ٤ و٩٦ = ١٠٠ − ٤. إذن ١٠٤ × ٩٦ = (١٠٠ + ٤)(١٠٠ − ٤) = (١٠٠)² − (٤)² = ١٠٠٠٠ − ١٦ = ٩٩٨٤.","? أكتب ناتج (ص − ٩)(ص + ٩) وناتج (٦س + ١)(٦س − ١). || (ص − ٩)(ص + ٩) = ص² − ٨١، و(٦س + ١)(٦س − ١) = ٣٦س² − ١.","# تدرّب","? إذا كان س² − ص² = ٤٨ وكان س + ص = ١٦ فما قيمة س − ص؟ || س² − ص² = (س + ص)(س − ص) ⇒ ٤٨ = ١٦ × (س − ص) ⇒ س − ص = ٣.","? مربّعان يزيد طول ضلع الأول على طول ضلع الثاني وحدة واحدة، وتزيد مساحة الأول على مساحة الثاني ٧ وحدات مربّعة. ما طول ضلع المربّع الأصغر؟ || نفرض ضلع الأصغر س والأكبر س + ١. الفرق في المساحة: (س + ١)² − س² = (س + ١ + س)(س + ١ − س) = (٢س + ١)(١) = ٧ ⇒ ٢س = ٦ ⇒ س = ٣ وحدات."],"q":["- متى نستخدم قاعدة الفرق بين مربّعين؟ اكتبها بالرموز.","- هل يمكن تحليل س² + ٩ بالقاعدة نفسها؟ ولماذا؟","- حلّل ٢٥م² − ٩ل² و٤ص² − ١٤٤ مع إخراج العامل المشترك حين يلزم.","- كيف تحسب ١٠٤ × ٩٦ ذهنياً باستخدام الفرق بين مربّعين؟","- كيف تحسب (٦٧٥)² − (٣٢٥)² بطريقتين؟"],"quiz":[{"l":0,"k":"n","q":"تحليل الفرق بين مربّعين س² − ص² هو:","o":["(س + ص)(س + ص)","(س − ص)(س − ص)","(س + ص)(س − ص)","س(س − ص)"],"a":2},{"l":0,"k":"n","q":"أيّ المقادير الآتية فرقٌ بين مربّعين؟","o":["٤س² − ٩","٢س − ٩","س² + ٩","س² − ٣"],"a":0},{"l":0,"k":"n","q":"الجذر التربيعي للحدّ ٢٥س² هو:","o":["٥س²","١٢٫٥س","٢٥س","٥س"],"a":3},{"l":0,"k":"n","q":"ناتج (س + ٥)(س − ٥) هو:","o":["س² + ٢٥","س² − ١٠س + ٢٥","س² − ٢٥","س² − ١٠"],"a":2},{"l":0,"k":"n","q":"أيّ العبارات الآتية لا يمكن تحليلها بقاعدة الفرق بين مربّعين؟","o":["س² − ١٦","٤س² − ٩ص²","س² + ١٦","أ² − ٢٥ب²"],"a":2},{"l":0,"k":"n","q":"تحليل ص² − ٢٥ هو:","o":["(ص − ٢٥)(ص + ١)","(ص + ٥)(ص − ٥)","(ص − ٥)²","(ص + ٥)²"],"a":1},{"l":0,"k":"n","q":"الفرق بين مساحتي مربّعين طولا ضلعيهما س و ص (س > ص) يساوي:","o":["س² − ص²","س − ص","س² + ص²","(س − ص)²"],"a":0},{"l":0,"k":"n","q":"عند تحليل الفرق بين مربّعين يكون أحد العاملين مجموع الجذرين، والآخر:","o":["مربّع مجموعهما","حاصل ضربهما","الفرق بينهما","ضعف أحدهما"],"a":2},{"l":1,"k":"p","q":"تحليل ٢٥م² − ٩ل² هو:","o":["(٥م + ٣ل)(٥م − ٣ل)","(٢٥م + ٩ل)(م − ل)","(٥م + ٣ل)(٥م + ٣ل)","(٥م − ٣ل)(٥م − ٣ل)"],"a":0},{"l":1,"k":"p","q":"تحليل ٤أ² − ٩ هو:","o":["(٢أ − ٣)(٢أ − ٣)","(٢أ + ٣)(٢أ − ٣)","(٤أ + ٩)(أ − ١)","(٢أ + ٩)(٢أ − ١)"],"a":1},{"l":1,"k":"p","q":"تحليل ص² − ٦٤ هو:","o":["(ص + ٤)(ص − ١٦)","(ص + ٨)(ص − ٨)","(ص + ٣٢)(ص − ٢)","(ص − ٨)(ص − ٨)"],"a":1},{"l":1,"k":"p","q":"التحليل الكامل لـ ٨س² − ٧٢ هو:","o":["٨(س + ٣)(س + ٣)","٨(س + ٩)(س − ٨)","٨(س + ٣)(س − ٣)","(س + ٣)(س − ٣)"],"a":2},{"l":1,"k":"p","q":"ناتج (ص − ٩)(ص + ٩) هو:","o":["ص² + ٨١","ص² − ١٨","ص² − ١٨ص + ٨١","ص² − ٨١"],"a":3},{"l":1,"k":"p","q":"ناتج (٦س + ١)(٦س − ١) هو:","o":["٣٦س² + ١","٣٦س² − ١٢س + ١","٦س² − ١","٣٦س² − ١"],"a":3},{"l":1,"k":"p","q":"قيمة (٦٧٥)² − (٣٢٥)² هي:","o":["٣٥٠٠٠","٣٣٠٠٠٠","٣٥٠٠٠٠","٤٥٦٠٠٠"],"a":2},{"l":1,"k":"p","q":"قيمة ١٠٤ × ٩٦ باستخدام الفرق بين مربّعين هي:","o":["٩٩٨٤","١٠٠٠٠","٩٩٨٠","٩٩٩٦"],"a":0},{"l":2,"k":"p","q":"التحليل الكامل لـ ١٤٤أ² − ١٠٠ب² هو:","o":["٤(٦أ + ٥ب)(٦أ + ٥ب)","٤(٦أ + ٥ب)(٦أ − ٥ب)","(٦أ + ٥ب)(٦أ − ٥ب)","٢(١٢أ + ١٠ب)(١٢أ − ١٠ب)"],"a":1},{"l":2,"k":"p","q":"إذا كان س² − ص² = ٤٨ وكان س + ص = ١٦ فإن س − ص يساوي:","o":["١٢","٦٤","٤","٣"],"a":3},{"l":2,"k":"p","q":"إذا كان س² − ص² = ١٤ وكان س − ص = ٢ فإن س + ص يساوي:","o":["٢٨","٧","١٦","١٢"],"a":1},{"l":2,"k":"p","q":"مربّعان يزيد ضلع الأول على ضلع الثاني بمقدار ١، وتزيد مساحته على مساحة الثاني بمقدار ٧. فطول ضلع الأصغر يساوي:","o":["٣","٧","٢","٤"],"a":0},{"l":2,"k":"p","q":"التحليل الكامل لـ س⁴ − ١٦ هو:","o":["(س² + ٤)(س² + ٤)","(س + ٤)(س − ٤)","(س² + ٤)(س + ٢)(س − ٢)","(س² − ٤)(س² − ٤)"],"a":2},{"l":2,"k":"p","q":"قيمة (٩٩)² − (١)² هي:","o":["٩٨٠١","٩٩٠٠","٩٨٠٠","٩٧٠٠"],"a":2},{"l":2,"k":"p","q":"ناتج (٢أ + ٣ب)² − (٢أ − ٣ب)² هو:","o":["٨أ² + ١٨ب²","١٢أب","١٨ب²","٢٤أب"],"a":3},{"l":2,"k":"p","q":"قطعة أرض مربّعة طول ضلعها س قُطع منها مربّع طول ضلعه ٣. فإذا كان الباقي (س² − ٩) فإنّ تحليله هو:","o":["(س + ٣)²","(س + ٣)(س − ٣)","(س − ٩)(س + ١)","(س − ٣)²"],"a":1}],"hints":{"تحليل ٢٥م² − ٩ل² هو:":"الجذر التربيعي للحدّ ٢٥م² هو ٥م وللحدّ ٩ل² هو ٣ل؛ ثم اكتب (جذر + جذر)(جذر − جذر).","التحليل الكامل لـ ٨س² − ٧٢ هو:":"ابدأ بإخراج العامل المشترك ٨ أولاً، ثم انظر هل ما بداخل القوس فرق بين مربّعين.","قيمة (٦٧٥)² − (٣٢٥)² هي:":"اكتب ٦٧٥ + ٣٢٥ و٦٧٥ − ٣٢٥ ثم اضرب الناتجين.","إذا كان س² − ص² = ٤٨ وكان س + ص = ١٦ فإن س − ص يساوي:":"س² − ص² = (س + ص)(س − ص)؛ عوّض القيم المعلومة واقسم."}},{"t":"قسمة المقادير الجبرية","e":["# نشاط ١: القسمة على حدّ جبري","لنجد (٢٦ه² + ١٤ه⁴) ÷ ٢ه: نكتبها كسراً ثم نقسم كلّ حدّ على ٢ه.","(٢٦ه² + ١٤ه⁴) ÷ ٢ه = ٢٦ه²/٢ه + ١٤ه⁴/٢ه = ١٣ه + ٧ه³.","وكذلك (٩ل³م⁴ − ١٨ل م²) ÷ ٣ل م² = ٩ل³م⁴/٣ل م² − ١٨ل م²/٣ل م² = ٣ل²م² − ٦.","! عند قسمة مقدار جبري على حدّ جبري لا يساوي صفراً يمكن قسمة كلّ حدٍّ من حدود المقدار على هذا الحدّ.","# القاعدة","- قسمة حدٍّ على حدّ: نقسم المعاملين، ونقسم المتغيّرات المتماثلة بطرح الأسس (س⁵ ÷ س² = س³).","- قسمة مقدار على حدّ جبري: نقسم كلّ حدّ من حدود المقدار على الحدّ المعطى (الحدّ ≠ ٠).","- قسمة مقدار على مقدار: نحلّل البسط والمقام (إن أمكن) ثم نختصر العامل المشترك بينهما.","! لا يجوز القسمة على صفر، فإذا قسمنا على (س + ١) مثلاً فنشترط أن س ≠ −١.","# نشاط ٢: استخدام التحليل في القسمة","|القسمة|بعد التحليل|الناتج","|(س² + ٥س + ٤) ÷ (س + ١)|(س + ١)(س + ٤) ÷ (س + ١)|س + ٤","|(س² − ٤) ÷ (س + ٢)|(س + ٢)(س − ٢) ÷ (س + ٢)|س − ٢","|(س² − ٣س) ÷ (س − ٣)|س(س − ٣) ÷ (س − ٣)|س","# أمثلة محلولة","? أجد ناتج (٢٧أ²س⁷) ÷ (٩أس). || نقسم المعاملين: ٢٧ ÷ ٩ = ٣. ونطرح الأسس: أ² ÷ أ = أ، و س⁷ ÷ س = س⁶. الناتج = ٣أس⁶.","? أجد ناتج (١٢س³ − ٨س² + ٤س) ÷ ٤س. || نقسم كلّ حدّ على ٤س: ١٢س³ ÷ ٤س = ٣س²، −٨س² ÷ ٤س = −٢س، ٤س ÷ ٤س = ١. الناتج = ٣س² − ٢س + ١.","? أجد ناتج (س² + ٧س + ١٢) ÷ (س + ٣). || نحلّل البسط: س² + ٧س + ١٢ = (س + ٣)(س + ٤) لأنّ ٣ × ٤ = ١٢ و٣ + ٤ = ٧. ثم نختصر: (س + ٣)(س + ٤) ÷ (س + ٣) = س + ٤ (حيث س ≠ −٣).","? إذا كان ناتج ضرب حدّين جبريّين هو −٦٤س³ص³ وكان الحدّ الأول ١٦س²، فما الحدّ الثاني؟ || الحدّ الثاني = ناتج الضرب ÷ الحدّ الأول = −٦٤س³ص³ ÷ ١٦س² = −٤س ص³. تحقّق: ١٦س² × (−٤س ص³) = −٦٤س³ص³ ✓.","? حديقة مستطيلة مساحتها (س² + ١٧س + ٣٠) م² وعرضها (س + ٢) م. ما طولها؟ || الطول = المساحة ÷ العرض. نحلّل: س² + ١٧س + ٣٠ = (س + ٢)(س + ١٥) لأنّ ٢ × ١٥ = ٣٠ و٢ + ١٥ = ١٧. الطول = (س + ١٥) م.","# تدرّب","? أجد ناتج (٢س² − س − ٣) ÷ (٢س − ٣). || نحلّل: ٢س² − س − ٣ = (٢س − ٣)(س + ١) (فالحدّ الأوسط: ٢س − ٣س = −س ✓). ثم نختصر: الناتج = س + ١.","? أجد ناتج (٢٠أ³ب² − ١٥أ²ب³) ÷ ٥أ²ب². || ٢٠أ³ب² ÷ ٥أ²ب² = ٤أ، و−١٥أ²ب³ ÷ ٥أ²ب² = −٣ب. الناتج = ٤أ − ٣ب."],"q":["- كيف نقسم مقداراً جبرياً على حدّ جبري؟ وضّح بمثال.","- كيف نستخدم التحليل في قسمة مقدار على مقدار؟","- لماذا لا نقسم على صفر؟ وما الشرط على المتغيّر في (س² − ٤) ÷ (س + ٢)؟","- أجد ناتج (٩ل³م⁴ − ١٨ل م²) ÷ ٣ل م².","- حديقة مساحتها (س² + ١٧س + ٣٠) وعرضها (س + ٢). ما طولها؟"],"quiz":[{"l":0,"k":"n","q":"عند قسمة مقدار جبري على حدّ جبري لا يساوي صفراً نقسم:","o":["الحدّ الأول فقط","الحدّ الأخير فقط","كلّ حدّ من حدود المقدار على هذا الحدّ","المعاملات فقط ونهمل المتغيّرات"],"a":2},{"l":0,"k":"n","q":"ناتج س⁵ ÷ س² هو:","o":["س³","س¹⁰","س⁷","س⁵/٢"],"a":0},{"l":0,"k":"n","q":"ناتج ١٢س ÷ ٤س هو:","o":["٣","٨س","٨","٣س"],"a":0},{"l":0,"k":"n","q":"ناتج (٢٦ه² + ١٤ه⁴) ÷ ٢ه هو:","o":["١٣ + ٧ه²","١٣ه + ٧ه³","١٣ه² + ٧ه⁴","١٣ه + ٧ه²"],"a":1},{"l":0,"k":"n","q":"لا يجوز القسمة على:","o":["عدد موجب","حدّ جبري لا يساوي صفراً","العدد ١","صفر"],"a":3},{"l":0,"k":"n","q":"نستخدم التحليل في قسمة المقادير الجبرية من أجل:","o":["ضرب البسط في المقام","جمع الأسس","اختصار العامل المشترك بين البسط والمقام","طرح المعاملات"],"a":2},{"l":0,"k":"n","q":"ناتج (س + ١)(س + ٤) ÷ (س + ١) هو:","o":["س","(س + ٤)²","س + ١","س + ٤"],"a":3},{"l":0,"k":"n","q":"ناتج ٩س² ÷ ٣س هو:","o":["٣س²","٣","٣س","٦س"],"a":2},{"l":1,"k":"p","q":"ناتج (٢٧أ²س⁷) ÷ (٩أس) هو:","o":["٣أ²س⁶","٣أس⁶","٣أس⁷","١٨أس⁶"],"a":1},{"l":1,"k":"p","q":"ناتج (٩ل³ م⁴ − ١٨ل م²) ÷ (٣ل م²) هو:","o":["٣ل² م² − ١٨","٣ل² م² − ٦","٣ل² م² + ٦","٦ل² م² − ٦"],"a":1},{"l":1,"k":"p","q":"ناتج (س² + ٧س + ١٢) ÷ (س + ٣) هو:","o":["س + ١٢","س + ٤","س + ٣","س + ٧"],"a":1},{"l":1,"k":"p","q":"ناتج (س² − ٤) ÷ (س + ٢) هو:","o":["س − ٢","س − ٤","س + ٢","س² − ٢"],"a":0},{"l":1,"k":"p","q":"ناتج (س² − ٣س) ÷ (س − ٣) هو:","o":["س − ٣","س + ٣","س","س²"],"a":2},{"l":1,"k":"p","q":"ناتج (١٢س³ − ٨س² + ٤س) ÷ (٤س) هو:","o":["٣س³ − ٢س² + س","٣س² − ٢س + ١","٣س² + ٢س","٣س² − ٢س"],"a":1},{"l":1,"k":"p","q":"ناتج (س² − ٩) ÷ (س − ٣) هو:","o":["س − ٣","س² − ٣","س − ٩","س + ٣"],"a":3},{"l":1,"k":"p","q":"ناتج (س² + ٥س + ٤) ÷ (س + ١) هو:","o":["س + ٤","س + ١","س + ٥","س² + ٤"],"a":0},{"l":2,"k":"p","q":"ناتج (٢س² − س − ٣) ÷ (٢س − ٣) هو:","o":["س − ١","٢س + ١","س + ١","س + ٣"],"a":2},{"l":2,"k":"p","q":"ناتج (٦س² + ٥س − ٦) ÷ (٢س + ٣) هو:","o":["٣س − ٢","٣س − ٣","٢س − ٣","٣س + ٢"],"a":0},{"l":2,"k":"p","q":"ناتج (س² − ١٦ص²) ÷ (س − ٤ص) هو:","o":["س + ١٦ص","س − ٤ص","س + ٤ص","س − ٤ص²"],"a":2},{"l":2,"k":"p","q":"إذا كان ناتج ضرب حدّين جبريّين −٦٤س³ص³ وكان الأول ١٦س² فإن الحدّ الثاني هو:","o":["−٤س ص³","−٤٨س ص³","٤س ص","−٤س³ ص³"],"a":0},{"l":2,"k":"p","q":"ناتج (٩س² − ٦س + ١) ÷ (٣س − ١) هو:","o":["س − ١","٣س² − ١","٣س − ١","٣س + ١"],"a":2},{"l":2,"k":"p","q":"حديقة مستطيلة مساحتها (س² + ١٧س + ٣٠) وعرضها (س + ٢). فطولها يساوي:","o":["س + ١٥","س + ١٠","س + ٢٨","س + ٣"],"a":0},{"l":2,"k":"p","q":"ناتج (٢٠أ³ب² − ١٥أ²ب³) ÷ (٥أ²ب²) هو:","o":["٤أ − ٣ب","٤أ² − ٣ب","١٥أ − ١٠ب","٤أ + ٣ب"],"a":0},{"l":2,"k":"p","q":"ناتج (س² + ٥س + ٦) ÷ (س + ٢) + (س² − ١) ÷ (س − ١) هو:","o":["٢س + ٢","٢س² + ٤","٢س + ٤","٢س + ١"],"a":2}],"hints":{"ناتج (٩ل³ م⁴ − ١٨ل م²) ÷ (٣ل م²) هو:":"اقسم كلّ حدّ في البسط على ٣ل م² على حدة: قسمة المعاملات ثم طرح الأسس.","ناتج (س² + ٧س + ١٢) ÷ (س + ٣) هو:":"حلّل س² + ٧س + ١٢ إلى عاملين ثم اختصر العامل المشترك مع المقام.","ناتج (٢س² − س − ٣) ÷ (٢س − ٣) هو:":"حلّل ٢س² − س − ٣ بالضرب التبادلي فيظهر العامل (٢س − ٣).","حديقة مستطيلة مساحتها (س² + ١٧س + ٣٠) وعرضها (س + ٢). فطولها يساوي:":"الطول = المساحة ÷ العرض؛ حلّل المساحة أولاً."}}]},{"title":"فيثاغورس والتطابق والتشابه","ic":"tri","color":"#cfe2b0","uq":[[0,"ما اسم الضلع المقابل للزاوية القائمة في المثلث القائم، وما ميزته؟",["ضلع القائمة، وهو أقصر الأضلاع","الارتفاع، وهو أوسط الأضلاع","القاعدة، وهو أصغر الأضلاع","الوتر، وهو أطول الأضلاع"],3],[1,"مثلث قائم ضلعا قائمته ٥ سم و١٢ سم. ما طول وتره؟",["١٣ سم","١٧ سم","٧ سم","٦٠ سم"],0],[1,"مثلث قائم وتره ١٠ سم وأحد ضلعي قائمته ٦ سم. ما الضلع الآخر؟",["٤ سم","١٦ سم","٨ سم","٧ سم"],2],[1,"أيّ الثلاثيات الآتية تصلح أطوالاً لأضلاع مثلث قائم الزاوية؟",["٦، ٧، ٩","٤، ٥، ٧","٨، ١٥، ١٧","٥، ٦، ٨"],2],[0,"أيّ مما يأتي لا يكفي وحده لإثبات تطابق مثلثين؟",["تساوي الزوايا الثلاث المتناظرة","تساوي الأضلاع الثلاثة المتناظرة","تساوي ضلعين والزاوية المحصورة بينهما","تساوي وتر وضلع في مثلثين قائمين"],0],[0,"المثلثان المتشابهان تكون أضلاعهما المتناظرة:",["متساوية وزواياهما مختلفة","متساوية في الطول فقط","متناسبة وزواياهما مختلفة","متناسبة وزواياهما المتناظرة متساوية"],3],[1,"مثلثان أضلاع الأول ٤ و٦ و٨ سم وأضلاع الثاني ٦ و٩ و١٢ سم. ما نسبة التكبير؟",["٢/٣","٣/٢","٢","١"],1],[1,"مثلثان متطابقان، في أحدهما زاويتان ٥٠° و٦٠°. ما الزاوية الثالثة في الآخر؟",["٦٠°","٧٠°","٨٠°","١١٠°"],1],[2,"سلّم طوله ١٣ م يستند إلى جدار على ارتفاع ١٢ م. كم يبعد أسفله عن الجدار؟",["٦ م","١ م","٢٥ م","٥ م"],3],[2,"مثلث قائم وتره ٢٠ سم وأحد ضلعيه ١٦ سم. ما مساحته؟",["٩٦ سم²","١٢٠ سم²","١٩٢ سم²","٤٨ سم²"],0],[2,"شخص طوله ١٫٥ م ظلّه ٢ م، وفي اللحظة نفسها ظلّ عمود ١٢ م. ما ارتفاع العمود؟",["٨ م","١٦ م","٩ م","٦ م"],2],[2,"مثلثان قائما الزاوية، وتر كلّ منهما ١٠ سم وأحد ضلعي قائمته ٦ سم. أيّ حالة تثبت تطابقهما؟",["(ض، ض، ض)","(ز، ض، ز)","(وتر، ضلع، قائمة)","لا يمكن إثبات التطابق"],2]],"lessons":[{"t":"نظرية فيثاغورس","e":["# نشاط ١: المربّعات المنشأة على أضلاع المثلث","رُسم المثلث ك ل م القائم الزاوية في ل، وفيه ل ك = ٣ سم، ل م = ٤ سم، م ك = ٥ سم، ثم رُسم مربّع على كلّ ضلع من أضلاعه.","- مساحة المربّع المنشأ على الوتر ك م = ٥ × ٥ = ٢٥ سم²","- مساحة المربّع المنشأ على الضلع ل ك = ٣ × ٣ = ٩ سم²","- مساحة المربّع المنشأ على الضلع ل م = ٤ × ٤ = ١٦ سم²","- مجموع مساحتي المربّعين على ضلعي القائمة = ٩ + ١٦ = ٢٥ وهو يساوي مساحة مربّع الوتر","! نلاحظ أنّ مساحة المربّع المنشأ على الوتر تساوي مجموع مساحتي المربّعين المنشأين على ضلعي الزاوية القائمة.","# نظرية فيثاغورس","- نظرية فيثاغورس: في المثلث القائم الزاوية تكون مساحة المربّع المنشأ على الوتر تساوي مجموع مساحتي المربّعين المنشأين على ضلعي الزاوية القائمة.","- الوتر: هو الضلع المقابل للزاوية القائمة، وهو أطول أضلاع المثلث القائم.","- ضلعا الزاوية القائمة: هما الضلعان اللذان يحيطان بالزاوية القائمة.","في المثلث أ ب ج القائم الزاوية في ب تُكتب النظرية هكذا: (أ ج)² = (أ ب)² + (ب ج)²، أي أنّ مربّع الوتر يساوي مجموع مربّعي الضلعين الآخرين.","! تُستعمل نظرية فيثاغورس في المثلث القائم الزاوية فقط، ويكون الوتر وحده في أحد طرفي المعادلة.","# كيف نستعمل النظرية","|المطلوب|القانون","|إيجاد الوتر|الوتر² = (الضلع الأول)² + (الضلع الثاني)²","|إيجاد أحد ضلعي القائمة|الضلع² = الوتر² − (الضلع الآخر)²","|بعد إيجاد الضلع²|نأخذ الجذر التربيعي الموجب لإيجاد طول الضلع","# نشاط ٢: السلّم والبناية","يضع ضابط الدفاع المدني سلّماً طوله ١٠ م على أرض مستوية بحيث يلامس أعلاه قمة بناية ارتفاعها ٨ م. المطلوب بُعد أسفل السلّم عن البناية.","? ما بُعد الطرف السفلي للسلّم عن أسفل البناية إذا كان طول السلّم ١٠ م وارتفاع البناية ٨ م؟ || السلّم هو الوتر، والمثلث قائم عند أسفل البناية. (١٠)² = (٨)² + (البعد)² ← ١٠٠ = ٦٤ + (البعد)² ← (البعد)² = ١٠٠ − ٦٤ = ٣٦ ← البعد = ٦ م.","# نشاط ٣: إيجاد طول ضلع مجهول","? مثلث ك ل م قائم الزاوية في ل، فيه ل ك = ٤٫٢ وحدة، ل م = ٥٫٨ وحدة. أجد طول الوتر ك م = س. || س² = (٤٫٢)² + (٥٫٨)² = ١٧٫٦٤ + ٣٣٫٦٤ = ٥١٫٢٨ ← س = √٥١٫٢٨ وحدة طول (تقريباً ٧٫٢).","? مثلث قائم الزاوية وتره ٦ وحدات وأحد ضلعي قائمته ٢ وحدة. أجد الضلع الآخر ص. || ص² + (٢)² = (٦)² ← ص² = ٣٦ − ٤ = ٣٢ ← ص = √٣٢ وحدة طول (تقريباً ٥٫٧).","# تمارين محلولة","? أجد س في المثلث القائم الذي ضلعا قائمته ٩ سم و١٢ سم ووتره س. || س² = ٩² + ١٢² = ٨١ + ١٤٤ = ٢٢٥ ← س = ١٥ سم.","? مثلث قائم وتره ١٣ سم وأحد ضلعي قائمته ١٢ سم. أجد الضلع الآخر س. || س² = ١٣² − ١٢² = ١٦٩ − ١٤٤ = ٢٥ ← س = ٥ سم.","? أحسب محيط المثلث أ ب ج القائم الزاوية في ب إذا كان أ ب = ١٥ سم وأ ج = ٢٥ سم. || أ ج هو الوتر: (ب ج)² = ٢٥² − ١٥² = ٦٢٥ − ٢٢٥ = ٤٠٠ ← ب ج = ٢٠ سم. المحيط = ١٥ + ٢٠ + ٢٥ = ٦٠ سم.","? حديقة مستطيلة طولها ١٨ م ومساحتها ٢١٦ م². ما طول قُطرها؟ || العرض = ٢١٦ ÷ ١٨ = ١٢ م. القطر وتر المثلث القائم: (القطر)² = ١٨² + ١٢² = ٣٢٤ + ١٤٤ = ٤٦٨ ← القطر = √٤٦٨ = ٦√١٣ م (تقريباً ٢١٫٦ م).","# مهمة تعليمية: سلك كهربائي","تقع نقطة على قمة عمود كهرباء ارتفاعه ٧ م، ويُشدّ منها سلك إلى سطح منزل ارتفاعه ٣ م يبعد عن العمود ٣ م.","? ما طول السلك؟ || الفرق في الارتفاع = ٧ − ٣ = ٤ م، والبعد الأفقي = ٣ م، والسلك هو الوتر: (السلك)² = ٤² + ٣² = ١٦ + ٩ = ٢٥ ← السلك = ٥ م.","! عند تطبيق فيثاغورس على مسألة من الواقع ارسم شكلاً توضيحياً، وحدّد الزاوية القائمة والوتر أولاً."],"q":["- ما نصّ نظرية فيثاغورس؟ وفي أيّ مثلث تُطبَّق؟","- ما الوتر؟ وكيف تعرفه في المثلث القائم؟","- مثلث قائم الزاوية ضلعا قائمته ٦ سم و٨ سم، أجد طول وتره.","- مثلث قائم وتره ١٧ سم وأحد ضلعي قائمته ٨ سم، أجد الضلع الآخر ثم محيط المثلث.","- سلّم طوله ٥ م يلامس جداراً على ارتفاع ٤ م، ما بُعد أسفل السلّم عن الجدار؟"],"quiz":[{"l":0,"k":"n","q":"ما اسم الضلع المقابل للزاوية القائمة في المثلث القائم؟","o":["أقصر ضلع","الوتر","ضلع القائمة","الارتفاع"],"a":1},{"l":0,"k":"n","q":"ما نصّ نظرية فيثاغورس في المثلث القائم؟","o":["مساحة المربّع على الوتر = الفرق بين مساحتي المربّعين الآخرين","مساحة المربّع على الوتر = حاصل ضرب الضلعين الآخرين","طول الوتر = مجموع طولي الضلعين الآخرين","مساحة المربّع على الوتر = مجموع مساحتي المربّعين على ضلعي القائمة"],"a":3},{"l":0,"k":"n","q":"في المثلث أ ب ج القائم الزاوية في ب، أيّ العلاقات الآتية صحيحة؟","o":["(أ ج)² = (أ ب)² + (ب ج)²","(أ ب)² = (أ ج)² + (ب ج)²","(ب ج)² = (أ ب)² + (أ ج)²","أ ج = أ ب + ب ج"],"a":0},{"l":0,"k":"n","q":"أيّ المثلثات الآتية تُطبَّق عليه نظرية فيثاغورس؟","o":["أيّ مثلث","المثلث المنفرج الزاوية فقط","المثلث القائم الزاوية","المثلث الحادّ الزوايا فقط"],"a":2},{"l":0,"k":"n","q":"الوتر في المثلث القائم الزاوية هو:","o":["أقصر أضلاعه","الضلع الأوسط طولاً","أطول أضلاعه","أحد ضلعي الزاوية القائمة"],"a":2},{"l":0,"k":"n","q":"ما مساحة المربّع الذي طول ضلعه ٥ سم؟","o":["٢٥ سم²","١٠ سم²","٢٠ سم²","٥ سم²"],"a":0},{"l":0,"k":"n","q":"أيّ الضلعين يحيطان بالزاوية القائمة في المثلث القائم؟","o":["الوتر وأحد الضلعين","الوتر فقط","لا ضلعين محدّدين","ضلعا القائمة"],"a":3},{"l":0,"k":"n","q":"إذا كان ضلعا الزاوية القائمة في مثلث ٣ سم و٤ سم فإن الوتر يساوي:","o":["٧ سم","٥ سم","٦ سم","١٢ سم"],"a":1},{"l":1,"k":"p","q":"مثلث قائم ضلعا قائمته ٦ سم و٨ سم. ما طول وتره؟","o":["١٤ سم","٤٨ سم","١٠ سم","٧ سم"],"a":2},{"l":1,"k":"p","q":"مثلث قائم وتره ١٣ سم وأحد ضلعي قائمته ٥ سم. ما طول الضلع الآخر؟","o":["٨ سم","١٨ سم","١٢ سم","١٤٤ سم"],"a":2},{"l":1,"k":"p","q":"في مثلث قائم ضلعا قائمته ٩ و١٢، ما طول الوتر؟","o":["١٥","٢١","١٣","٢٢٥"],"a":0},{"l":1,"k":"p","q":"سلّم طوله ١٠ م يلامس جداراً على ارتفاع ٨ م. كم يبعد أسفل السلّم عن الجدار؟","o":["٢ م","١٨ م","٨ م","٦ م"],"a":3},{"l":1
