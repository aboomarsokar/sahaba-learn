 ٣ر² − ٣ر + ١ صفراً؟":"المنحنى مفتوح إلى الأعلى؛ قارن قيمة الرأس (القيمة الصغرى) بالصفر.","القطع المكافئ ق(س) = س² − ٦س + ٥ يمرّ بالنقطة (١ ، ٠) ومحور تماثله س = ٣. إذن يمرّ أيضاً بالنقطة:":"النقاط المتماثلة تبعد المسافة نفسها عن محور التماثل في الجهتين وبالارتفاع نفسه."}},{"t":"الاقتران النسبي","e":["# نشاط تمهيدي: قاعة التبريد","في القاعات الكبيرة يحاول المهندسون أن تكون نسبة مساحة سطح المجسّم إلى حجمه صغيرة لتقليل استهلاك الطاقة في التبريد. قاعة طولها س متر وعرضها س متر وارتفاعها س متر.","المساحة الكلية للقاعة = ٤ × س × س + ٢س² = ٦س²، وحجم القاعة = س × س × س = س³.","نسبة المساحة الكلية إلى الحجم = ٦س² ÷ س³ = ٦/س (س ≠ ٠). هذه النسبة اقتران في س، وصورته كسر بسطه ومقامه كثيرا حدود.","# التعريف: الاقتران النسبي","يُسمّى الاقتران المكتوب على صورة ق(س) = هـ(س)/ل(س)، حيث هـ(س)، ل(س) كثيرا حدود، اقتراناً نسبياً، ومجال الاقتران ق(س) هو ح ما عدا أصفار الاقتران ل(س) (أي ما عدا أصفار المقام).","? أكتب أمثلة لاقترانات نسبية. || ق(س) = (٣س + ٤)/(س² − ٥) حيث س ≠ ±√٥، وكذلك ٦/س (س ≠ ٠)، و(س² − ١)/(س + ٢) (س ≠ −٢). البسط والمقام كثيرا حدود دائماً.","! لا نقسم على صفر أبداً: كلّ قيمة تجعل المقام صفراً تُستبعد من المجال.","# مجال الاقتران النسبي","لإيجاد المجال: نضع المقام = صفر ونحلّ المعادلة، فتكون القيم الناتجة هي ما نستبعده من ح.","? أجد مجال ق(س) = (٣س² − ٤)/(٢س + ٦). || أصفار المقام: ٢س + ٦ = ٠ ، ٢س = −٦ ، س = −٣. مجال ق(س) = ح − {−٣}.","? أجد مجال ق(س) = س/(س² − ٥س + ٦). || نحلّل المقام: س² − ٥س + ٦ = (س − ٢)(س − ٣) = ٠. إمّا س − ٢ = ٠ أو س − ٣ = ٠ ، فس = ٢ أو س = ٣. مجال ق(س) = ح − {٢ ، ٣}.","? أجد مجال ق(س) = (٣س + ١)/(س(س² − ١)). || المقام س(س − ١)(س + ١) = ٠ فيكون س = ٠ أو ١ أو −١. المجال = ح − {−١ ، ٠ ، ١}.","? أجد مجال ق(س) = ٥/(س² + ٤). || س² + ٤ = ٠ لا حلّ لها في ح لأنّ س² + ٤ ≥ ٤ دائماً. المقام لا يساوي صفراً أبداً فالمجال = ح كاملة.","# أصفار الاقتران النسبي","أصفار الاقتران النسبي هي القيم التي تجعل قيمة البسط = صفر، ولا يكون المقام مساوياً صفراً عندها.","- نضع البسط = صفر ونحلّ.","- نتأكّد أنّ كلّ حلٍّ لا يجعل المقام صفراً، وإلا فهو غير مقبول.","? أجد أصفار ق(س) = (س + ٣)/(س² − ٣س − ٤) ، س ≠ −١ ، ٤. || نضع البسط: س + ٣ = ٠ فيكون س = −٣. المقام عند −٣ = ٩ + ٩ − ٤ = ١٤ ≠ ٠. صفر الاقتران هو −٣ وهو صفر البسط.","? أجد أصفار ق(س) = (س² − ٤س − ١٢)/(س³ − ٢٧) ، س ≠ ٣. || البسط: س² − ٤س − ١٢ = (س + ٢)(س − ٦) = ٠ فيكون س = −٢ أو س = ٦. المقام عندهما ≠ ٠ (٦³ − ٢٧ = ١٨٩ ، (−٢)³ − ٢٧ = −٣٥). أصفار الاقتران −٢ و٦.","? ما قيم س التي تجعل البسط صفراً في ق(س) = ٣/(س² − ٥)، س ≠ ±√٥؟ || البسط عدد ثابت ٣ ≠ ٠ دائماً، فلا توجد قيمة تجعله صفراً. إذن ليس للاقتران أصفار.","? أجد أصفار ق(س) = (س² − ٩)/(س − ٣). || البسط: س² − ٩ = (س − ٣)(س + ٣) = ٠ فيكون س = ٣ أو س = −٣. لكنّ س = ٣ تجعل المقام صفراً فهي مستبعدة. الصفر الوحيد هو −٣.","! خطأ شائع: عدّ كلّ جذور البسط أصفاراً دون التحقّق من المقام، كما في (س² − ٩)/(س − ٣) حيث س = ٣ ليست صفراً.","|المطلوب|نضع|ملاحظة","|المجال|المقام = ٠|نستبعد حلوله من ح","|الأصفار|البسط = ٠|نستبعد ما يجعل المقام ٠","# أمثلة من تمارين ومسائل","? أجد أصفار ق(س) = (س² − ٤)/(س³ + ٤س) ، س ≠ ٠. || البسط (س − ٢)(س + ٢) = ٠ فيكون س = ٢ أو س = −٢. المقام عند كلٍّ منهما ≠ ٠ (٢³ + ٨ = ١٦). الأصفار ٢ و−٢.","? أجد أصفار ق(س) = (س³ + ٩س² + ١٨س)/(س² + ١). || البسط س(س² + ٩س + ١٨) = س(س + ٣)(س + ٦) = ٠ فيكون س = ٠ أو −٣ أو −٦. المقام س² + ١ ≥ ١ دائماً. الأصفار ٠ و−٣ و−٦.","? تمّت تعبئة خزانين: الأول قاعدته مربعة طول ضلعها س وارتفاعه م، والثاني قاعدته مستطيلة بعداها (س + ١) و(س − ٢) وارتفاعه م. أجد نسبة حجم الخزان الثاني إلى الأول، وأحدّد القيم غير المناسبة لـ س. || حجم الأول س²م وحجم الثاني (س + ١)(س − ٢)م. النسبة = (س + ١)(س − ٢)م ÷ (س²م) = (س + ١)(س − ٢)/س² ، س ≠ ٠. ولكي تكون الأبعاد موجبة يجب أن يكون س − ٢ > ٠ فلا تصلح س = ٢ (العرض صفر)، بينما تصلح س = ٤."],"q":["- ما الاقتران النسبي؟ أعطِ مثالين عليه.","- كيف أجد مجال الاقتران النسبي؟ ولماذا نستبعد أصفار المقام؟","- أجد مجال الاقتران ق(س) = (٣س + ١)/(س(س² − ١)).","- كيف أجد أصفار الاقتران النسبي؟ وما الشرط الذي يجب التحقّق منه؟","- أجد أصفار الاقتران ق(س) = (س² − ٤)/(س³ + ٤س) ، س ≠ ٠."],"quiz":[{"l":0,"k":"n","q":"الاقتران النسبي هو اقتران على صورة:","o":["كسر بسطه ومقامه أعداد صحيحة ها س متر، نسبة مساحتها الكلية (٦س²) إلى حجمها (س³) تساوي عندما س = ٣ :","o":["٦","١٨","٢","٣"],"a":2},{"l":2,"k":"p","q":"أصفار الاقتران ق(س) = (س² − ٩)/(س − ٣) هي:","o":["٣ و −٣","−٣ فقط","٣ فقط","لا توجد أصفار"],"a":1},{"l":2,"k":"p","q":"مجال الاقتران ق(س) = (س + ١)/(س² − ٩) هو:","o":["ح − {−٣ ، ٣}","ح − {−١}","ح − {٩}","ح − {−٣}"],"a":0},{"l":2,"k":"p","q":"أصفار الاقتران ق(س) = (س³ + ٩س² + ١٨س)/(س² + ١) هي:","o":["٠ و ٣ و ٦","−٣ و −٦ فقط","لا توجد أصفار","٠ و −٣ و −٦"],"a":3},{"l":2,"k":"p","q":"خزان قاعدته مربعة ضلعها س وآخر قاعدته مستطيلة بعداها (س + ١) و(س − ٢) والارتفاع نفسه. نسبة حجم الثاني إلى الأول:","o":["(س − ٢)/(س + ١)","س²/((س + ١)(س − ٢))","(س + ١)(س − ٢)/س²","(س + ١)(س − ٢)/س"],"a":2},{"l":2,"k":"p","q":"في الخزانين السابقين، أيّ القيم الآتية لا تصلح بعداً مناسباً لـ س؟","o":["٤","٢","٥","٦"],"a":1},{"l":2,"k":"p","q":"قيمة ق(٢) للاقتران ق(س) = (٣س + ١)/(س² − ٩) تساوي:","o":["−٧/٥","٧/٥","−٧/١٣","٧/١٣"],"a":0},{"l":2,"k":"p","q":"الاقتران ق(س) = (س + ٢)/(س² − ٥س + ك) غير معرّف عند س = ٢. قيمة ك تساوي:","o":["−٦","١٤","٤","٦"],"a":3},{"l":2,"k":"p","q":"عدد أصفار الاقتران ق(س) = (٢س − ٦)/(س² − ٦س + ٩) هو:","o":["صفر واحد هو ٣","صفران هما ٣ و −٣","لا توجد أصفار لأنّ س = ٣ تجعل المقام صفراً","صفر واحد هو ٦"],"a":2}],"hints":{"مجال الاقتران ق(س) = س/(س² − ٥س + ٦) هو:":"ضع المقام = ٠ وحلّله إلى عاملين ثم ساوِ كلّ عامل بالصفر.","أصفار الاقتران ق(س) = (س² − ٩)/(س − ٣) هي:":"حلّ البسط = ٠ يعطي قيمتين، لكن تحقّق هل إحداهما تجعل المقام صفراً.","قيمة ق(٢) للاقتران ق(س) = (٣س + ١)/(س² − ٩) تساوي:":"عوّض س = ٢ في البسط وفي المقام كلٌّ على حدة، وانتبه لإشارة المقام.","الاقتران ق(س) = (س + ٢)/(س² − ٥س + ك) غير معرّف عند س = ٢. قيمة ك تساوي:":"الاقتران غير معرّف حيث يساوي المقام صفراً؛ عوّض س = ٢ في المقام وساوِه بالصفر.","في الخزانين السابقين، أيّ القيم الآتية لا تصلح بعداً مناسباً لـ س؟":"أبعاد الخزان يجب أن تكون أعداداً موجبة؛ انظر إلى العامل (س − ٢)."}},{"t":"قوانين الاحتمالات","e":["# نشاط تمهيدي: رمي قطعة نقد مرّتين","نلقي قطعة نقد معدنية مرّتين متتاليتين ونلاحظ الوجه الظاهر: (ص) صورة، و(ك) كتابة. الفضاء العيني للتجربة: Ω = {(ص، ص)، (ص، ك)، (ك، ص)، (ك، ك)}، وعدد عناصره ٤.","ليكن ح١ حادث ظهور كتابة واحدة فقط، وح٢ حادث ظهور صورة واحدة على الأقل. إذن: ح١ = {(ص، ك)، (ك، ص)}، وح٢ = {(ص، ص)، (ص، ك)، (ك، ص)}.","ل(ح١) = ٢/٤ = ١/٢، ول(ح٢) = ٣/٤.","تقاطع الحادثين ح١ ∩ ح٢ = {(ص، ك)، (ك، ص)} فاحتماله ٢/٤ = ١/٢. واتحادهما ح١ ∪ ح٢ = {(ص، ص)، (ص، ك)، (ك، ص)} فاحتماله ٣/٤.","احتمال عدم وقوع ح٢ هو ل(ح٢′) = ١ − ٣/٤ = ١/٤ (الحادث {(ك، ك)}).","# الاحتمال والحادث المتمّم","إذا كان Ω الفضاء العيني لتجربة عشوائية وكان لكل عنصر فيه فرصة الظهور نفسها، وكان الحادث ح ⊆ Ω فإنّ: ل(ح) = عدد عناصر ح ÷ عدد عناصر Ω.","المتمّم: احتمال عدم وقوع الحادث ح هو ل(ح′) = ١ − ل(ح). نرمز لمتمّم الحادث ح بالرمز ح′.","! احتمال أي حادث يقع بين صفر و١، ومجموع احتمال الحادث ومتمّمه يساوي ١ دائماً.","# قانون الاتحاد والتقاطع","إذا كان ح١ ، ح٢ حادثين في Ω فإنّ: ل(ح١ ∪ ح٢) = ل(ح١) + ل(ح٢) − ل(ح١ ∩ ح٢).","نطرح ل(ح١ ∩ ح٢) لأنّ العناصر المشتركة بين الحادثين تُحسب مرّتين عند جمع احتماليهما.","! الخطأ الشائع: جمع ل(ح١) + ل(ح٢) فقط دون طرح احتمال التقاطع، وهذا صحيح فقط إذا كان الحادثان منفصلين.","# الحوادث المنفصلة","الحادثان المنفصلان لا يمكن أن يقعا معاً، أي ح١ ∩ ح٢ = Ø، ومنه ل(ح١ ∩ ح٢) = صفر. وفي هذه الحالة: ل(ح١ ∪ ح٢) = ل(ح١) + ل(ح٢).","|الحالة|قانون الاتحاد|ملاحظة","|حادثان عامّان|ل(ح١) + ل(ح٢) − ل(ح١ ∩ ح٢)|نطرح احتمال التقاطع","|حادثان منفصلان|ل(ح١) + ل(ح٢)|ل(ح١ ∩ ح٢) = صفر","# حدوث حادث دون الآخر وقاعدتا المتمّم","احتمال حدوث ح١ وعدم حدوث ح٢ هو: ل(ح١ − ح٢) = ل(ح١ ∩ ح٢′) = ل(ح١) − ل(ح١ ∩ ح٢).","وكذلك ل(ح٢ − ح١) = ل(ح٢) − ل(ح١ ∩ ح٢).","قاعدتا المتمّم: (ح١ ∩ ح٢)′ = ح١′ ∪ ح٢′، و(ح١ ∪ ح٢)′ = ح١′ ∩ ح٢′. ومنهما: ل((ح١ ∪ ح٢)′) = ١ − ل(ح١ ∪ ح٢).","! لا تكتب ل(ح١ − ح٢) = ل(ح١) − ل(ح٢)؛ الصواب أن نطرح ل(ح١ ∩ ح٢).","# أمثلة محلولة","? في صندوق ٦ بطاقات مرقّمة بالأعداد ٣، ٧، ٩، ٢٤، ٢٧، ٣٦. سُحبت بطاقة عشوائياً. ح١ حادث ظهور عدد من مضاعفات ٣، وح٢ حادث ظهور عدد من مضاعفات ٦. أجد ل(ح١ ∩ ح٢) ول(ح١ ∪ ح٢). || Ω = {٣، ٧، ٩، ٢٤، ٢٧، ٣٦}، وح١ = {٣، ٩، ٢٤، ٢٧، ٣٦} وح٢ = {٢٤، ٣٦}. ح١ ∩ ح٢ = {٢٤، ٣٦} فاحتماله ٢/٦ = ١/٣. وح١ ∪ ح٢ = ح١ لأنّ ح٢ ⊆ ح١ فاحتماله ٥/٦. وبالقانون: ٥/٦ + ٢/٦ − ٢/٦ = ٥/٦.","? احتمال أن ينجز مقاول مشروعاً سكنياً وتجارياً معاً في الموعد ١/٤، واحتمال إنجاز السكني ٣/٤، واحتمال إنجاز التجاري ٢/٣. أجد احتمال أن ينجز السكني فقط، ثم التجاري فقط. || ل(السكني فقط) = ل(ح١) − ل(ح١ ∩ ح٢) = ٣/٤ − ١/٤ = ٢/٤ = ١/٢. ل(التجاري فقط) = ٢/٣ − ١/٤ = ٨/١٢ − ٣/١٢ = ٥/١٢.","? ليكن ل(ح١) = ٠٫٣، ل(ح٢) = ٠٫٥، ل(ح١ ∩ ح٢) = ٠٫٢. أجد: ل(ح١ ∪ ح٢)، ل(ح١′)، ل(ح١ − ح٢)، ل((ح١ ∪ ح٢)′). || ل(ح١ ∪ ح٢) = ٠٫٣ + ٠٫٥ − ٠٫٢ = ٠٫٦. ل(ح١′) = ١ − ٠٫٣ = ٠٫٧. ل(ح١ − ح٢) = ٠٫٣ − ٠٫٢ = ٠٫١. ل((ح١ ∪ ح٢)′) = ١ − ٠٫٦ = ٠٫٤.","? لدى عائلة ثلاثة أطفال، ما احتمال أن يكون لديها بنتان وولد؟ || Ω ٨ عناصر متساوية الفرصة: (ولد/بنت للأطفال الثلاثة). الحالات المطلوبة: (ب، ب، و)، (ب، و، ب)، (و، ب، ب) أي ٣ حالات. الاحتمال = ٣/٨.","? نرمي حجري نرد منتظمين مرّة واحدة. أجد احتمال ظهور عددين مجموعهما ٧، وعددين فرديّين، وعددين مجموعهما ٣ على الأكثر. || Ω فيه ٣٦ عنصراً. المجموع ٧: (١،٦)، (٢،٥)، (٣،٤)، (٤،٣)، (٥،٢)، (٦،١) أي ٦ فالاحتمال ٦/٣٦ = ١/٦. عددان فرديان: ٣ × ٣ = ٩ فالاحتمال ٩/٣٦ = ١/٤. المجموع ≤ ٣: (١،١)، (١،٢)، (٢،١) أي ٣ فالاحتمال ٣/٣٦ = ١/١٢.","? ل(ح١) = ٠٫٦، ل(ح٢) = ٠٫٣، ل(ح١ ∩ ح٢) = ٠٫١٥. أحسب ل(ح١ − ح٢) ول(ح١′ ∩ ح٢′). || ل(ح١ − ح٢) = ٠٫٦ − ٠٫١٥ = ٠٫٤٥. ل(ح١ ∪ ح٢) = ٠٫٦ + ٠٫٣ − ٠٫١٥ = ٠٫٧٥. ل(ح١′ ∩ ح٢′) = ل((ح١ ∪ ح٢)′) = ١ − ٠٫٧٥ = ٠٫٢٥.","? ل(ح١ ∪ ح٢) = ٠٫٦٥، ل(ح١) = ٠٫٤، ل(ح٢) = ٠٫٢٥. هل الحادثان منفصلان؟ || ل(ح١) + ل(ح٢) = ٠٫٤ + ٠٫٢٥ = ٠٫٦٥ = ل(ح١ ∪ ح٢). إذن ل(ح١ ∩ ح٢) = صفر، فالحادثان منفصلان.","? احتمال نجاح طالب في الفيزياء ٠٫٧٥، وفي الكيمياء ٠٫٨، وفي الامتحانين معاً ٠٫٦٥. أجد احتمال نجاحه في أحد الامتحانين على الأقل، وفي الكيمياء فقط. || على الأقل في أحدهما: ٠٫٧٥ + ٠٫٨ − ٠٫٦٥ = ٠٫٩. الكيمياء فقط: ٠٫٨ − ٠٫٦٥ = ٠٫١٥."],"q":["- ما قانون احتمال اتحاد حادثين؟ وماذا يصبح إذا كانا منفصلين؟","- كيف أجد احتمال حدوث الحادث ح١ وعدم حدوث ح٢؟","- ما العلاقة بين ل(ح) ول(ح′)؟ وما قاعدتا المتمّم؟","- لدى عائلة ثلاثة أطفال، ما احتمال أن يكون لديها بنتان وولد؟","- نرمي حجري نرد منتظمين، أجد احتمال ظهو ن الاتحاد."}},{"t":"الدائرة","e":["# نشاط تمهيدي: الحصان والرجل","في تربية الخيول يمسك الرجل طرف حبل يمتدّ إلى رسن الحصان فيدور الحصان ببعدٍ ثابت عن الرجل. المسار الناتج دائرة مركزها موقع الرجل الثابت، ونصف قطرها طول الحبل.","المحل الهندسي: هو مسار نقطة تتحرّك في المستوى الديكارتي تحت شروط معيّنة، فتنتج هذه المسارات أشكالاً هندسية.","الدائرة: هي المحل الهندسي لنقطة تتحرّك في المستوى بحيث تبعد بعداً ثابتاً عن نقطة ثابتة تُسمّى مركز الدائرة (م). ويُسمّى البعد الثابت نصف قطر الدائرة (نق).","# معادلة الدائرة التي مركزها نقطة الأصل","لتكن النقطة (س، ص) على دائرة مركزها نقطة الأصل م(٠، ٠). بقانون المسافة بين نقطتين: م(س، ص) = √((س − ٠)² + (ص − ٠)²) = نق، وبتربيع الطرفين نحصل على المعادلة.","معادلة الدائرة التي مركزها (٠، ٠) ونصف قطرها نق هي: س² + ص² = نق².","# معادلة الدائرة التي مركزها (د، هـ)","إذا كان المركز النقطة (د، هـ) ونصف القطر نق فإنّ بُعد أي نقطة (س، ص) عن المركز يساوي نق، فتكون المعادلة: (س − د)² + (ص − هـ)² = نق².","! انتبه لإشارتي المركز: في (س + ٣)² + (ص − ٢)² = ٩ يكون المركز (−٣، ٢) وليس (٣، −٢).","# الصورة القياسية للمعادلة","عند فكّ الأقواس في (س − د)² + (ص − هـ)² = نق² نحصل على الصورة القياسية: س² + ص² + ٢ل س + ٢ك ص + جـ = ٠، حيث ل = −د ، ك = −هـ ، جـ = د² + هـ² − نق².","في الصورة القياسية: مركز الدائرة (−ل، −ك)، ونصف قطرها نق = √(ل² + ك² − جـ)، ويجب أن يكون ل² + ك² − جـ > ٠.","لاحظ أنّ معامل س² يساوي معامل ص²، وأنّه لا يوجد حدّ س ص في المعادلة.","|الصورة|المعادلة|المركز ونصف القطر","|مركزها الأصل|س² + ص² = نق²|المركز (٠، ٠)، نصف القطر نق","|مركزها (د، هـ)|(س − د)² + (ص − هـ)² = نق²|المركز (د، هـ)، نصف القطر نق","|القياسية|س² + ص² + ٢ل س + ٢ك ص + جـ = ٠|المركز (−ل، −ك)، نق = √(ل² + ك² − جـ)","# أمثلة محلولة","? أكتب معادلة الدائرة التي مركزها (٠، ٠) وطول نصف قطرها ٤ سم. || س² + ص² = نق² = ٤² = ١٦، فالمعادلة: س² + ص² = ١٦.","? أكتب معادلة الدائرة التي مركزها (٢، ١) وطول نصف قطرها ٣ سم، ثم أفكّ الأقواس. || المعادلة: (س − ٢)² + (ص − ١)² = ٩. بفكّ الأقواس: س² − ٤س + ٤ + ص² − ٢ص + ١ = ٩، أي س² + ص² − ٤س − ٢ص + ٥ = ٩، ومنه س² − ٤س + ص² − ٢ص = ٤.","? أجد معادلة الدائرة التي مركزها (−٣، ٢) وطول قطرها ٦ سم. || نصف القطر = ٦ ÷ ٢ = ٣. المعادلة: (س + ٣)² + (ص − ٢)² = ٩.","? أجد معادلة الدائرة التي مركزها (−٢، −٧) وتمرّ بالنقطة (٤، −٨). || نصف القطر هو المسافة بين المركز والنقطة: نق² = (٤ − (−٢))² + (−٨ − (−٧))² = ٣٦ + ١ = ٣٧. المعادلة: (س + ٢)² + (ص + ٧)² = ٣٧.","? أجد مركز الدائرة (س − ٣)² + (ص + ٤)² = ١٦ ونصف قطرها. || بالمقارنة مع (س − د)² + (ص − هـ)² = نق²: د = ٣ ، هـ = −٤ ، نق² = ١٦. المركز (٣، −٤) ونصف القطر ٤.","? أجد مركز الدائرة س² + ص² − ١٢س = ١٤ ونصف قطرها. || نكتبها س² + ص² − ١٢س − ١٤ = ٠: ٢ل = −١٢ فـ ل = −٦، ك = ٠، جـ = −١٤. المركز (−ل، −ك) = (٦، ٠). نق = √(٣٦ + ٠ + ١٤) = √٥٠ = ٥√٢.","? أحوّل المعادلة ٢س² + ٢ص² − ١٢س = ٣٢ إلى الصورة القياسية وأجد المركز ونصف القطر. || نكتبها ٢س² + ٢ص² − ١٢س − ٣٢ = ٠ ونقسم على ٢: س² + ص² − ٦س − ١٦ = ٠. ٢ل = −٦ فـ ل = −٣، ك = ٠، جـ = −١٦. المركز (٣، ٠)، ونق = √(٩ + ٠ + ١٦) = √٢٥ = ٥ وحدات.","? أيّ المعادلتين تمثّل دائرة: س² − ص² = ٣٦ أم س² + ص² − ٤س = ٩؟ || الأولى فيها إشارة سالبة بين س² و ص² فمعاملاهما مختلفان، فليست دائرة. الثانية معاملا س² و ص² متساويان ولا يوجد حدّ س ص، ول = −٢ ، ك = ٠ ، جـ = −٩ فـ ل² + ك² − جـ = ٤ + ٩ = ١٣ > ٠، فهي دائرة.","? أجد قيمة ك التي تجعل نصف قطر الدائرة س² + ص² + ٤س + ٢ك ص − ١٢ = ٠ يساوي ٥ وحدات. || ل = ٢ ، جـ = −١٢. نق² = ل² + ك² − جـ = ٤ + ك² + ١٢ = ٢٥ فـ ك² = ٩ ومنه ك = ٣ أو ك = −٣.","? رسم معلّم التربية الرياضية دائرة في وسط ملعب في مستوى ديكارتي مركزها (−٢، ٤) ونصف قطرها ٦ م. ما معادلتها؟ || (س + ٢)² + (ص − ٤)² = ٣٦.","! الخطأ الشائع: كتابة نق بدل نق² في الطرف الأيمن، أو نسيان أنّ نصف القطر الحقيقي هو الجذر التربيعي للعدد الظاهر في المعادلة."],"q":["- ما تعريف الدائرة كمحلّ هندسي؟ وما معنى مركزها ونصف قطرها؟","- أكتب معادلة الدائرة التي مركزها (٣، −٢) وطول قطرها ٦ سم.","- أجد مركز الدائرة ونصف قطرها: (س − ٣)² + (ص + ٤)² = ١٦.","- أيّ المعادلات الآتية تمثّل دائرة: س² − ص² = ٣٦ ، س² + ص² − ٤س = ٩ ، ٨س² + ٨ص² + ٢س ص = ١٠ ، س² + ٢ص² − ٥ = ٠؟","- أجد قيمة ك التي تجعل نصف قطر الدائرة س² + ص² + ٤س + ٢ك ص − ١٢ = ٠ يساوي ٥ وحدات."],"quiz":[{"l":0,"k":"n", ائرة؟","o":["س² + ٢ص² = ٨","س² + ص² − ٤س + ٦ص − ٣ = ٠","س² − ص² = ٤","س² + ص² + س ص = ١"],"a":1},{"l":1,"k":"p","q":"الصورة القياسية للدائرة (س − ١)² + (ص + ٢)² = ٩ هي:","o":["س² + ص² − ٢س + ٤ص − ٤ = ٠","س² + ص² − ٢س − ٤ص − ٤ = ٠","س² + ص² + ٢س − ٤ص − ٤ = ٠","س² + ص² − ٢س + ٤ص + ٥ = ٠"],"a":0},{"l":2,"k":"p","q":"معادلة الدائرة التي مركزها (−٢، ٣) وتمرّ بالنقطة (١، ٧) هي:","o":["(س + ٢)² + (ص − ٣)² = ٢٥","(س + ٢)² + (ص − ٣)² = ٥","(س − ٢)² + (ص + ٣)² = ٢٥","(س + ٢)² + (ص − ٣)² = ٣٧"],"a":0},{"l":2,"k":"p","q":"معادلة الدائرة التي مركزها (٠، ٠) وتمرّ بالنقطة (٦، ٨) هي:","o":["س² + ص² = ١٠","س² + ص² = ١٤","س² + ص² = ٤٨","س² + ص² = ١٠٠"],"a":3},{"l":2,"k":"p","q":"إذا كان نصف قطر الدائرة س² + ص² + ٤س + ٢ك ص − ١٢ = ٠ يساوي ٥ وحدات فإنّ ك تساوي:","o":["٣ فقط","٩","٣ أو −٣","٥ أو −٥"],"a":2},{"l":2,"k":"p","q":"نصف قطر الدائرة ٢س² + ٢ص² − ٨س + ١٢ص − ٨ = ٠ يساوي:","o":["١٧","√١٧","√١٣","٤"],"a":1},{"l":2,"k":"p","q":"أيّ النقاط الآتية تقع على الدائرة (س − ١)² + (ص + ٢)² = ٢٥؟","o":["(٤، ١)","(٤، ٢)","(٠، ٠)","(١، ٢)"],"a":1},{"l":2,"k":"p","q":"إذا كانت الدائرة س² + ص² − ١٠س + ٢ص + جـ = ٠ نصف قطرها ٦ فإنّ جـ تساوي:","o":["−١٠","١٠","٦٢","−٣٦"],"a":0},{"l":2,"k":"p","q":"المعادلة ٣س² + ٣ص² − ١٢س + ٦ص + ٣٠ = ٠:","o":["دائرة نصف قطرها ٥","دائرة مركزها (٢، −١) ونصف قطرها ١٠","لا تمثّل دائرة لأنّ معاملي س² و ص² متساويان","لا تمثّل دائرة لأنّ ل² + ك² − جـ سالب"],"a":3},{"l":2,"k":"p","q":"الصورة القياسية لمعادلة الدائرة التي مركزها (−٢، ٤) ونصف قطرها ٦ هي:","o":["س² + ص² − ٤س + ٨ص − ١٦ = ٠","س² + ص² + ٤س − ٨ص + ٢٤ = ٠","س² + ص² + ٤س − ٨ص − ١٦ = ٠","س² + ص² + ٤س − ٨ص − ٣٦ = ٠"],"a":2}],"hints":{"معادلة الدائرة التي مركزها (−٢، ٣) وتمرّ بالنقطة (١، ٧) هي:":"نصف القطر هو المسافة بين المركز والنقطة؛ احسب مربّعها بقانون المسافة.","إذا كان نصف قطر الدائرة س² + ص² + ٤س + ٢ك ص − ١٢ = ٠ يساوي ٥ وحدات فإنّ ك تساوي:":"اكتب نق² = ل² + ك² − جـ = ٢٥ وحلّ المعادلة في ك (قد يكون لها حلّان).","مركز الدائرة (س − ٣)² + (ص + ٤)² = ١٦ هو:":"قارن مع (س − د)² + (ص − هـ)²: انتبه إلى أنّ + ٤ تعني هـ = −٤.","المعادلة ٣س² + ٣ص² − ١٢س + ٦ص + ٣٠ = ٠:":"اقسم على معامل س² أولاً ثم احسب ل² + ك² − جـ وانظر إلى إشارته.","أيّ النقاط الآتية تقع على الدائرة (س − ١)² + (ص + ٢)² = ٢٥؟":"عوّض إحداثيات كل نقطة في المعادلة وانظر أيّها يعطي ٢٥."}},{"t":"الزوايا المركزية والزوايا المحيطية","e":["# نشاط تمهيدي: دولاب المياه","في دولاب المياه، مركز الدائرة م، والقطعة المستقيمة من المركز إلى أي نقطة على الدائرة نصف قطر، والقطعة الواصلة بين نقطتين على الدائرة وتر، والجزء من الدائرة بين نقطتين قوس.","نلاحظ موقع رأس الزاوية في كل شكل: فقد يكون في المركز وقد يكون على الدائرة.","# الزاوية المركزية والزاوية المحيطية","الزاوية المركزية: هي الزاوية التي يقع رأسها في مركز الدائرة، وضلعاها نصفا قطرين في الدائرة.","الزاوية المحيطية: هي الزاوية التي يقع رأسها على الدائرة، وضلعاها وتران في الدائرة.","! تذكّر: الزاويتان المركزية والمحيطية «مشتركتان في القوس» إذا رُسمتا على القوس نفسه.","# العلاقة بين المركزية والمحيطية","قياس الزاوية المركزية يساوي ضعفي قياس الزاوية المحيطية المشتركة معها في القوس نفسه.","البرهان في الحالة الأبسط: إذا كان نصفا القطرين م أ و م ب يصنعان مثلثاً متساوي الساقين م أ ب، فالزاوية الخارجة عن المثلث تساوي مجموع الزاويتين الداخليتين البعيدتين عنها، وهما متساويتان، فتكون ضعف إحداهما.","أي زاويتين محيطيتين مرسومتين على قوس واحد في الدائرة متساويتان في القياس (لأنّ كلاً منهما نصف المركزية نفسها).","! الزاوية المنعكسة: إذا كانت الزاوية المركزية الصغرى على القوس الأصغر ه، فالمنعكسة = ٣٦٠° − ه، وهي ضعف المحيطية المرسومة على القوس الأكبر.","# الزاوية المحيطية المرسومة على قطر","إذا كان وتر الزاوية المحيطية قطراً في الدائرة فالزاوية المركزية على القطر مستقيمة قياسها ١٨٠°، وتكون المحيطية = ١٨٠° ÷ ٢ = ٩٠°. أي أنّ الزاوية المحيطية المرسومة على قطر الدائرة قائمة دائماً.","# المماس والزاوية المماسية","المماس: هو المستقيم الذي يشترك مع الدائرة في نقطة واحدة تُعرف بنقطة التماس.","الزاوية المماسية: هي الزاوية المحصورة بين المماس والوتر المارّ بنقطة التماس.","الزاوية المماسية تساوي الزاوية المحيطية المرسومة على القوس المحصور بين ضلعيها، من الجهة الأخرى للوتر، وتساوي نصف الزاوية المركزية المشتركة معها في القوس نفسه.","|الزاويتان|العلاقة","|المركزية والمحيطية على القوس نفسه|المركزية = ٢ × المحيطية","|محيطيتان على القوس نفسه|متساويتان","|محيطية على قطر|٩٠°","|مماسية ومحيطية على القوس نفسه|متساويتان","|مماسية ومركزية على القوس نفسه|المماسية = نصف المركزية","# أمثلة محلولة","? في دائرة مركزها م، قياس الزاوية المركزية أ م ب = ١٣٠°. أجد قياس الزاوية المحيطية أ جـ ب المشتركة معها في القوس. || المحيطية = نصف المركزية = ١٣٠° ÷ ٢ = ٦٥°.","? في دائرة مركزها م، الزاوية أ م ب = ١٥٠°. أجد قياس الزاوية المحيطية أ جـ ب على القوس الأكبر، والمحيطية أ د ب على القوس الأصغر. || أ جـ ب = ١٥٠° ÷ ٢ = ٧٥°. الزاوية المنعكسة أ م ب = ٣٦٠° − ١٥٠° = ٢١٠°، فالمحيطية أ د ب = ٢١٠° ÷ ٢ = ١٠٥°.","? في دائرة مركزها م، الزاوية أ م ب = ٨٠°، والنقطتان جـ و ن على القوس الأكبر. أجد قياس الزاويتين أ جـ ب و أ ن ب. || كلتاهما محيطية على القوس نفسه، فقياس كل منهما = ٨٠° ÷ ٢ = ٤٠°، وهما متساويتان.","? أبيّن أنّ قياس الزاوية المحيطية المرسومة على قطر الدائرة يساوي ٩٠°. || إذا كان الوتر قطراً فالزاوية المركزية المشتركة معه في القوس زاوية مستقيمة قياسها ١٨٠°. والمحيطية = نصف المركزية = ١٨٠° ÷ ٢ = ٩٠°.","? في مثلث أ ب جـ مرسوم داخل دائرة مركزها م، وكان أ ب قطراً والزاوية جـ أ ب = ٤٠°. أجد الزاوية أ ب جـ. || الزاوية أ جـ ب محيطية على القطر فتساوي ٩٠°. مجموع زوايا المثلث ١٨٠° فـ أ ب جـ = ١٨٠° − ٩٠° − ٤٠° = ٥٠°.","? في الدائرة التي مركزها م، المماس عند أ والوتر أ ب. إذا كانت الزاوية المماسية = ٤٠° فما الزاوية المركزية أ م ب؟ وما الزاوية أ ب م؟ || المركزية = ٢ × المماسية = ٨٠°. المثلث م أ ب متساوي الساقين (م أ = م ب نصفا قطرين) فكل زاوية قاعدة = (١٨٠° − ٨٠°) ÷ ٢ = ٥٠°، أي أ ب م = ٥٠°.","? الزاوية المركزية على قوس تساوي (٣س − ١٠)° والمحيطية المشتركة معها (س + ١٠)°. أجد س. || المركزية = ٢ × المحيطية: ٣س − ١٠ = ٢(س + ١٠) = ٢س + ٢٠ ومنه س = ٣٠. فالمحيطية ٤٠° والمركزية ٨٠°."],"q":["- ما الفرق بين الزاوية المركزية والزاوية المحيطية؟","- ما العلاقة بين قياس الزاوية المركزية والمحيطية المشتركتين في القوس نفسه؟","- أبيّن أنّ قياس الزاوية المحيطية المرسومة على قطر الدائرة يساوي ٩٠°.","- في دائرة مركزها م قياس الزاوية
