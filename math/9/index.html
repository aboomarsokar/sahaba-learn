ران الخطي وأُعطيت القاعدة فمجاله ومجاله المقابل الأعداد الحقيقية ح، أي ق : ح ← ح.","|الاقتران|خطي؟|السبب","|ق(س) = ٣س + ١|نعم|على الصورة أس + ب","|هـ(س) = ٦س²|لا|الأس ٢ وليس على الصورة أس + ب","|هـ(س) = ٥س|نعم|أ = ٥، ب = ٠","|م(س) = ٢ − س|نعم|أ = −١، ب = ٢","|و(س) = ١٠ + ٣/س|لا|س في المقام","# تمثيل الاقتران الخطي","نمثّل الاقتران الخطي في المستوى الديكارتي بتعيين نقطتين على الأقل تنتميان إليه ثم نصل بينهما بخط مستقيم.","! الخطأ الشائع: الاكتفاء بنقطة واحدة؛ النقطتان تحدّدان المستقيم، والأفضل ثلاث نقاط للتحقّق.","# حالتان خاصتان","- الاقتران المحايد: ق(س) = س، حالة خاصة من الاقتران الخطي (أ = ١، ب = ٠)، ويمرّ مستقيمه بنقطة الأصل، وصورة كل عنصر هي نفسه.","- الاقتران الثابت: ق(س) = ب حيث ب ∈ ح؛ صورة كل عنصر هي ب نفسها (مستقيم أفقي). وهو أ = ٠ فلا يدخل في تعريف الاقتران الخطي.","فكّر وناقش: الاقتران ق(س) = صفر يمثّل في المستوى الديكارتي المحور السيني (خط أفقي ينطبق عليه).","# أمثلة محلولة","? أمثّل ق(س) = ٣س + ١ في المستوى الديكارتي. || نختار قيماً لـ س: ق(−١) = ٣ × (−١) + ١ = −٢ فالنقطة (−١، −٢). ق(٠) = ١ فالنقطة (٠، ١). ق(١) = ٣ + ١ = ٤ فالنقطة (١، ٤). نعيّن النقاط ونصل بينها بمستقيم.","? إذا كان ق(س) = ٥س + ٢، أجد ق(٤)، ق(٠)، ق(−١). || ق(٤) = ٥ × ٤ + ٢ = ٢٢. ق(٠) = ٢. ق(−١) = −٥ + ٢ = −٣.","? أمثّل ق(س) = ١ − ٢س. || ق(−١) = ١ + ٢ = ٣، ق(٠) = ١، ق(١) = ١ − ٢ = −١. النقاط (−١، ٣)، (٠، ١)، (١، −١)، ونصل بينها بمستقيم يهبط من اليسار إلى اليمين.","? قطعة أرض مربّعة طول ضلعها س متراً، يريد صاحبها إقامة سياج حولها وتكلفة المتر ٥ دنانير. أكتب الاقتران الذي يمثّل التكلفة، ثم أجد التكلفة إذا كان طول الضلع ٣٢ م. || المحيط = ٤س، والتكلفة ق(س) = ٥ × ٤س = ٢٠س (اقتران خطي). عند س = ٣٢: ق(٣٢) = ٢٠ × ٣٢ = ٦٤٠ ديناراً.","? أي الاقترانين ثابت وأيهما محايد؟ ق : ١ ← ١، ٢ ← ٢، ٣ ← ٣، ٤ ← ٤. هـ : ٢ ← ٧، ٤ ← ٧، ٦ ← ٧. || ق تُرجع كل عنصر نفسه فهي محايدة (ق(س) = س). هـ ترجع العدد ٧ لكل عنصر فهي ثابتة (هـ(س) = ٧).","# تدرّب","? أيّ الاقترانين خطي: ق(س) = ٢س³ − ١ أم م(س) = ٢ − س؟ ولماذا؟ || ق ليس خطياً لأن الأس ٣. م خطي لأنه على الصورة أس + ب بـ أ = −١ و ب = ٢."],"q":["- ما شروط الاقتران الخطي ق(س) = أس + ب؟ ولماذا ق(س) = ٦س² ليس خطياً؟","- أيّ الاقترانات الآتية خطي ولماذا؟ ق(س) = ٢س³ − ١، هـ(س) = ٥س، م(س) = ٢ − س، و(س) = ١٠ + ٣/س.","- إذا كان ق(س) = ٥س + ٢، أجد ق(٤)، ق(٠)، ق(−١).","- أمثّل في المستوى الديكارتي كلاً من: ق(س) = س + ٣، ق(س) = ١ − ٢س، ق(س) = −٣.","- قطعة أرض مربّعة طول ضلعها س متراً وتكلفة سياجها ٥ دنانير للمتر. أكتب اقتران التكلفة وأجدها إذا كان الضلع ٣٢ م."],"quiz":[{"l":0,"k":"n","q":"الاقتران الخطي صورته العامة:","o":["ق(س) = أس² + ب","ق(س) = أس + ب حيث أ ≠ ٠","ق(س) = أ/س + ب","ق(س) = ب فقط"],"a":1},{"l":0,"k":"n","q":"أيّ الاقترانات الآتية خطي؟","o":["ق(س) = ٣س + ١","ق(س) = س² + ١","ق(س) = ٥/س","ق(س) = ٧"],"a":0},{"l":0,"k":"n","q":"الاقتران المحايد قاعدته:","o":["ق(س) = ٠","ق(س) = −س","ق(س) = ١","ق(س) = س"],"a":3},{"l":0,"k":"n","q":"الاقتران الثابت قاعدته:","o":["ق(س) = س","ق(س) = أس + ب حيث أ ≠ ٠","ق(س) = ب حيث ب عدد حقيقي","ق(س) = س²"],"a":2},{"l":0,"k":"n","q":"يمثَّل الاقتران الخطي في المستوى الديكارتي بـ:","o":["قطع منحنٍ","خط مستقيم","نقطة واحدة","دائرة"],"a":1},{"l":0,"k":"n","q":"أقل عدد من النقاط يلزم لتمثيل الاقتران الخطي هو:","o":["نقطتان","نقطة واحدة","أربع نقاط","ست نقاط"],"a":0},{"l":0,"k":"n","q":"إذا لم يُعطَ مجال الاقتران الخطي فمجاله:","o":["الأعداد الطبيعية","الصفر فقط","الأعداد الصحيحة السالبة","الأعداد الحقيقية ح"],"a":3},{"l":0,"k":"n","q":"معامل س في الاقتران ق(س) = −٤س + ٧ هو:","o":["٧","٤","−٤","−٧"],"a":2},{"l":1,"k":"p","q":"إذا كان ق(س) = ٣س + ١ فإن ق(٢) =","o":["٥","٧","٩","٦"],"a":1},{"l":1,"k":"p","q":"إذا كان ق(س) = ٥س + ٢ فإن ق(−١) =","o":["−٣","٧","−٧","٣"],"a":0},{"l":1,"k":"p","q":"أيّ النقاط الآتية تنتمي إلى تمثيل ق(س) = ٣س + ١؟","o":["(١، ٣)","(٢، ٨)","(٠، ٣)","(١، ٤)"],"a":3},{"l":1,"k":"p","q":"إذا كان ق(س) = ٢ − س فإن ق(٥) =","o":["٣","٧","−٣","−٧"],"a":2},{"l":1,"k":"p","q":"إذا كان ق(س) = ٢س − ٣ وكان ق(س) = ٧ فإن س =","o":["٢","٥","٤","١١"],"a":1},{"l":1,"k":"p","q":"تعطي بلدية ٢٥ شجرة مقابل كل دونم. عدد الأشجار لمن زرع ٨ دونمات:","o":["٢٠٠","١٨٠","٣٣","٢٥٠"],"a":0},{"l":1,"k":"p","q":"قطعة نين ق، هـ ويُرمز له بالرمز (هـ ∘ ق) ويُقرأ هـ بعد ق.","بشكل عام: (هـ ∘ ق)(س) = هـ(ق(س)).","- نبدأ بالاقتران الأقرب إلى س (ق)، ونعوّض ناتجه في الاقتران الآخر (هـ).","- (ق ∘ هـ)(س) = ق(هـ(س)): نبدأ بهـ ثم ق.","# التركيب ليس إبدالياً","بشكل عام (هـ ∘ ق)(س) ≠ (ق ∘ هـ)(س)؛ فترتيب تطبيق الاقترانين يغيّر الناتج.","! الخطأ الشائع: البدء من الاقتران الأقرب إلى اليسار؛ في (هـ ∘ ق)(٢) نحسب ق(٢) أولاً ثم نعوّض في هـ.","|الرمز|الترتيب|معناه","|(هـ ∘ ق)(س)|ق ثم هـ|هـ(ق(س))","|(ق ∘ هـ)(س)|هـ ثم ق|ق(هـ(س))","# أمثلة محلولة","? إذا كان ق(س) = ٢س + ١ و هـ(س) = ٤س − ٣، أجد (هـ ∘ ق)(٢). || (هـ ∘ ق)(٢) = هـ(ق(٢)). ق(٢) = ٢ × ٢ + ١ = ٥. هـ(٥) = ٤ × ٥ − ٣ = ١٧.","? إذا كان ق(س) = ٣ + ٢س و هـ(س) = ٥س − ١، أجد (هـ ∘ ق)(س) و(ق ∘ هـ)(س). || (هـ ∘ ق)(س) = هـ(٣ + ٢س) = ٥(٣ + ٢س) − ١ = ١٥ + ١٠س − ١ = ١٤ + ١٠س. (ق ∘ هـ)(س) = ق(٥س − ١) = ٣ + ٢(٥س − ١) = ٣ + ١٠س − ٢ = ١ + ١٠س. الناتجان مختلفان.","? إذا كان ق(س) = س² و هـ(س) = ٣س − ١، أجد (هـ ∘ ق)(١) و(ق ∘ هـ)(١). || (هـ ∘ ق)(١) = هـ(ق(١)) = هـ(١) = ٣ × ١ − ١ = ٢. (ق ∘ هـ)(١) = ق(هـ(١)) = ق(٢) = ٤. النتيجتان مختلفتان.","? إذا كان ق(س) = ٢س − ٥ و هـ(س) = ٣س + ٤، أجد (ق ∘ هـ)(٣) و(هـ ∘ ق)(٠). || هـ(٣) = ٣ × ٣ + ٤ = ١٣، فـ (ق ∘ هـ)(٣) = ق(١٣) = ٢ × ١٣ − ٥ = ٢١. ق(٠) = −٥، فـ (هـ ∘ ق)(٠) = هـ(−٥) = ٣ × (−٥) + ٤ = −١١.","? إذا كان ق(س) = س² + ٣، أجد (ق ∘ ق)(−٢). || ق(−٢) = ٤ + ٣ = ٧. ثم ق(٧) = ٤٩ + ٣ = ٥٢. إذن (ق ∘ ق)(−٢) = ٥٢.","? إذا كان ق(س) = ١ − ٥س و هـ(س) = ٢س، أجد (ق ∘ هـ)(س). || (ق ∘ هـ)(س) = ق(٢س) = ١ − ٥ × ٢س = ١ − ١٠س.","? إذا كان ق(س) = س² − ١ و هـ(س) = س + ٥، أجد (ق ∘ هـ)(س). || ق(هـ(س)) = ق(س + ٥) = (س + ٥)² − ١ = س² + ١٠س + ٢٥ − ١ = س² + ١٠س + ٢٤.","? إذا كان ق(س) = ٢س² + ٣س + ١ و هـ(س) = ٣س، أجد (ق ∘ هـ)(س). || ق(٣س) = ٢(٣س)² + ٣(٣س) + ١ = ١٨س² + ٩س + ١.","? إذا كان ق(س) = س + ٣ و هـ(س) = س² و م(س) = ١ + ٢س، أجد ((ق ∘ هـ) ∘ م)(٢). || م(٢) = ١ + ٤ = ٥. هـ(٥) = ٢٥. ق(٢٥) = ٢٨. الناتج ٢٨.","? شركة توصيل تحسب الأجرة الأساسية ق(س) = ٠٫٥س + ١ حيث س المسافة بالكيلومتر، ثم تضيف رسوم خدمة هـ(ص) = ١٫١ص حيث ص الأجرة الأساسية. أجد الأجرة النهائية لمسافة ١٠ كم. || نطبّق ق أولاً (الأجرة الأساسية) ثم هـ (الرسوم): ق(١٠) = ٠٫٥ × ١٠ + ١ = ٦. هـ(٦) = ١٫١ × ٦ = ٦٫٦. والاقتران الواحد: (هـ ∘ ق)(س) = ١٫١(٠٫٥س + ١) = ٠٫٥٥س + ١٫١، وعند س = ١٠ نحصل على ٦٫٦.","# تدرّب","? إذا كان ق(س) = س² و هـ(س) = س + ٣، أجد (هـ ∘ ق)(٢). || ق(٢) = ٤ ثم هـ(٤) = ٤ + ٣ = ٧."],"q":["- ماذا نقصد بتركيب الاقترانين ق، هـ؟ وكيف نقرأ (هـ ∘ ق)(س)؟","- هل (هـ ∘ ق)(س) = (ق ∘ هـ)(س) دائماً؟ وضّح بمثال.","- إذا كان ق(س) = ٢س − ٥، هـ(س) = ٣س + ٤، أجد (ق ∘ هـ)(٣)، (هـ ∘ ق)(٠).","- إذا كان ق(س) = س² + ٣، أجد (ق ∘ ق)(−٢).","- أجد (ق ∘ هـ)(س) إذا كان ق(س) = ١ − ٥س، هـ(س) = ٢س."],"quiz":[{"l":0,"k":"n","q":"(هـ ∘ ق)(س) يساوي:","o":["ق(هـ(س))","هـ(ق(س))","هـ(س) × ق(س)","هـ(س) + ق(س)"],"a":1},{"l":0,"k":"n","q":"يُقرأ الرمز (هـ ∘ ق):","o":["هـ بعد ق","هـ قبل ق","هـ مضروباً في ق","هـ على ق"],"a":0},{"l":0,"k":"n","q":"في حساب (هـ ∘ ق)(٢) نطبّق أولاً الاقتران:","o":["هـ","(هـ ∘ ق)","لا فرق في الترتيب","ق"],"a":3},{"l":0,"k":"n","q":"بشكل عام (هـ ∘ ق)(س) و(ق ∘ هـ)(س):","o":["متساويان دائماً","متساويان إذا كان س موجباً","غير متساويين","أحدهما صفر دائماً"],"a":2},{"l":0,"k":"n","q":"(ق ∘ هـ)(س) يساوي:","o":["هـ(ق(س))","ق(هـ(س))","ق(س) × هـ(س)","ق(س) − هـ(س)"],"a":1},{"l":0,"k":"n","q":"تركيب الاقترانات عملية تُجرى على:","o":["اقترانين لإنتاج اقتران جديد","عددين فقط","مجموعتين فقط","نقطتين في المستوى"],"a":0},{"l":0,"k":"n","q":"إذا كانت ١٠٠ دولار = ٧٠ ديناراً و٧٠ ديناراً = ٣٧٠ ريالاً فإن ١٠٠ دولار =","o":["٧٠ ريالاً","٤٤٠ ريالاً","١٠٠ ريال","٣٧٠ ريالاً"],"a":3},{"l":0,"k":"n","q":"في (ق ∘ هـ)(س) نطبّق أولاً الاقتران:","o":["ق","(ق ∘ هـ)","هـ","لا فرق في الترتيب"],"a":2},{"l":1,"k":"p","q":"ق(س) = ٢س + ١ و هـ(س) = ٤س − ٣. (هـ ∘ ق)(٢) =","o":["١١","١٧","٨","٢٥"],"a":1},{"l":1,"k":"p","q":"في الاقترانين السابقين (ق(س) = ٢س + ١، هـ(س) = ٤س − ٣): (ق ∘ هـ)(٢) =","o":["١١","١٧","٩","٥"],"a":0},{"l":1,"k":"p","q":"ق(س) = س + ٣ و هـ(س) = ٢س. (هـ ∘ ق)(١) =","o":["٥","٧","٦","٨"],"a":3},{"l":1,"k":"p","q":"ق(س) = ٢س − ٥ و هـ(س) = ٣س + ٤. (ق ∘ هـ)(٣) =","o":["١١","−١١","٢١","١٣"],"a":2},{"l":1,"k":"p","q":"ق(س) = س² + ٣. (ق ∘ ق)(−٢) =","o":["١٦","٥٢","٤٩","٧"],"a":1},{"l":1,"k":"p","q":"ق(س) = س² و هـ(س) = س + ٣. (هـ ∘ ق)(٢) =","o":["٧","٢٥","٨","٥"],"a":0},{"l":1,"k":"p","q":"ق(س) = ١ − ٥س و هـ(س) = ٢س. (ق ∘ هـ)(س) =","o":["٢ − ١٠س","١ − ٧س","٢ − ٥س","١ − ١٠س"],"a":3},{"l":1,"k":"p","q":"ق(س) = ٣ + ٢س و هـ(س) = ٥س − ١. (هـ ∘ ق)(س) =","o":["١ + ١٠س","١٤ + ٧س","١٤ + ١٠س","٢ + ١٠س"],"a":2},{"l":2,"k":"p","q":"ق(س) = س² − ١ و هـ(س) = س + ٥. (ق ∘ هـ)(س) =","o":["س² + ٢٤","س² + ١٠س + ٢٤","س² + ٤","س² + ٥س + ٢٤"],"a":1},{"l":2,"k":"p","q":"ق(س) = ٢س² + ٣س + ١ و هـ(س) = ٣س. (ق ∘ هـ)(س) =","o":["١٨س² + ٩س + ١","٦س² + ٩س + ١","١٨س² + ٣س + ١","٦س² + ٣س + ١"],"a":0},{"l":2,"k":"p","q":"ق(س) = س + ٣، هـ(س) = س²، م(س) = ١ + ٢س. ((ق ∘ هـ) ∘ م)(٢) =","o":["٣٣","١٢","٢٥","٢٨"],"a":3},{"l":2,"k":"p","q":"ق(س) = ٠٫٥س + ١ وهـ(ص) = ١٫١ص. الأجرة النهائية (هـ ∘ ق)(١٠) =","o":["٦","٥٫٥","٦٫٦","٧"],"a":2},{"l":2,"k":"p","q":"ق(س) = ٢س + ١ و هـ(س) = س − ٣. (هـ ∘ ق)(س) =","o":["٢س − ٥","٢س − ٢","٢س + ٣","س − ٢"],"a":1},{"l":2,"k":"p","q":"ق(س) = ٣س و هـ(س) = س − ٢. (هـ ∘ ق)(٤) − (ق ∘ هـ)(٤) =","o":["٤","٠","٦","١٠"],"a":0},{"l":2,"k":"p","q":"ق(س) = ٢س − ١. (ق ∘ ق)(س) =","o":["٤س − ١","٢س − ٢","٤س² − ١","٤س − ٣"],"a":3},{"l":2,"k":"p","q":"ق(س) = س + ٢ و هـ(س) = س + ٣. (ق ∘ هـ)(١٠) =","o":["١٣","١٢","١٥","٣٠"],"a":2}],"hints":{"في الاقترانين السابقين (ق(س) = ٢س + ١، هـ(س) = ٤س − ٣): (ق ∘ هـ)(٢) =":"طبّق هـ على ٢ أولاً ثم ق على الناتج.","ق(س) = ٣ + ٢س و هـ(س) = ٥س − ١. (هـ ∘ ق)(س) =":"ضع ق(س) كاملاً مكان س في هـ وانتبه إلى توزيع الضرب.","ق(س) = س + ٣، هـ(س) = س²، م(س) = ١ + ٢س. ((ق ∘ هـ) ∘ م)(٢) =":"ابدأ بـ م(٢) ثم هـ ثم ق.","ق(س) = ٣س و هـ(س) = س − ٢. (هـ ∘ ق)(٤) − (ق ∘ هـ)(٤) =":"احسب كل تركيب على حدة ثم اطرح."}},{"t":"الجداول التكرارية","e":["# نشاط تمهيدي: جدول تكراري لبيانات مفردة","رصد الجهاز المركزي للإحصاء الفلسطيني عدد الشهداء في محافظة القدس خلال الفترة ١٩٩٤–٢٠١٥م (٢٢ سنة)، فبلغ مجموعهم ١٥٦ شهيداً، وكان عددهم في السنوات المتتالية كما يأتي:","١٥، ٦، ٨، ٣، ٤، ٣، ١٥، ١٩، ١٦، ٥، ٢، ٢، ٢، ٩، ٢، ١، ٠، ٣، ١، ١، ١٥، ٢٤","إذا رتّبنا القيم المختلفة تصاعدياً وكتبنا بجانب كلّ قيمة عدد مرات ظهورها (تكرارها) حصلنا على جدول تكراري:","|عدد الشهداء في السنة|عدد السنوات (التكرار)","|٠|١","|١|٣","|٢|٤","|٣|٣","|٤|١","|٥|١","|٦|١","|٨|١","|٩|١","|١٥|٣","|١٦|١","|١٩|١","|٢٤|١","مجموع التكرارات = ٢٢ سنة، وهو عدد القيم الكلي. عدد السنوات التي لم يكن فيها شهداء هو ١، وعدد السنوات التي كان فيها شهيدان في السنة هو ٤.","! لو كانت البيانات كبيرة العدد ومتباعدة القيم لصعب علينا كتابة كلّ قيمةٍ وحدها؛ فنجمع القيم المتقاربة في فئات.","# التعريفات الأساسية","- الجدول التكراري: جدول يبيّن عدد مرات ظهور كلّ قيمة أو كلّ فئةٍ من البيانات.","- التكرار (ت): عدد القيم التي تقع في الفئة أو عدد مرات ظهور القيمة.","- الفئة: مجموعة تحوي عدداً من القيم المتقاربة.","- مدى البيانات = أكبر قيمة − أصغر قيمة.","- طول الفئة = المدى ÷ عدد الفئات، وإذا كان الناتج عشرياً يفضَّل تقريبه إلى العدد الصحيح الذي يليه مباشرة.","# خطوات بناء جدول تكراري بفئات","- ١) نحسب المدى = أكبر قيمة − أصغر قيمة.","- ٢) نحسب طول الفئة = المدى ÷ عدد الفئات (ونقرّبه إلى العدد الصحيح الذي يليه إن كان عشرياً).","- ٣) الحدّ الأدنى للفئة الأولى = أصغر قيمة في البيانات.","- ٤) الحدّ الأعلى للفئة الأولى = الحدّ الأدنى + طول الفئة − ١.","- ٥) تبدأ كلّ فئة بعد نهاية سابقتها بواحد، ونستمر حتى تشمل الفئة الأخيرة أكبر قيمة.","- ٦) نعدّ القيم الواقعة في كلّ فئة (بالإشارة) فنحصل على التكرار؛ ويجب أن يساوي مجموع التكرارات عدد القيم الكلي.","! تأكّد دائماً أنّ الحدّ الأعلى للفئة الأخيرة لا يقلّ عن أكبر قيمة في البيانات، وإلا فزد طول الفئة واحداً وأعد البناء.","# مثال تطبيقي: علامات ٣٠ طالباً","علامات ٣٠ طالباً في امتحان اللغة العربية: ١٤، ١٦، ٢٠، ٢٣، ١٠، ١٣، ١٧، ٢١، ٢٩، ١٨، ١٢، ١٩، ٢٠، ٢٣، ٢٧، ٢٥، ٢٢، ٢١، ٢٥، ٢٩، ١٨، ٢٠، ٢٨، ٢٤، ١٧، ٢١، ٢٥، ٢٤، ٢٢، ١٨. ننظّمها في خمس فئات:","|الفئة|التكرار","|١٠–١٣|٣","|١٤–١٧|٤","|١٨–٢١|١٠","|٢٢–٢٥|٩","|٢٦–٢٩|٤","# تمثيل البيانات بالقطاعات الدائرية","- القطاع الدائري: الجزء المحصور بين نصفي قطرين وقوس في دائرة.","- تمثّل الدائرة الكاملة جميع التكرارات، ويمثّل كلّ قطاعٍ فئةً أو قيمةً من البيانات.","- زاوية القطاع الدائري = (عدد عناصر القطاع ÷ العدد الكلي) × ٣٦٠°.","- مجموع زوايا القطاعات الدائرية لجميع البيانات = ٣٦٠°.","|الحالة|الزاوية","|قطاعٌ يمثّل نصف البيانات|١٨٠°","|قطاعٌ يمثّل ربع البيانات|٩٠°","|قطاعٌ يمثّل ١٠٪ من البيانات|٣٦°","|جميع القطاعات معاً|٣٦٠°","# أمثلة محلولة","? أستخرج من الجدول التكراري لعدد الشهداء في محافظة القدس: كم سنةً كان فيها ٣ شهداء؟ وكم سنةً كان فيها أكثر من ١٥ شهيداً؟ || التكرار المقابل للقيمة ٣ هو ٣، فعدد السنوات ٣. القيم الأكبر من ١٥ هي ١٦ (تكرارها ١) و١٩ (١) و٢٤ (١)، فعدد السنوات = ١ + ١ + ١ = ٣.","? أنظّم علامات الطلاب الثلاثين المذكورة أعلاه في جدول تكراري من ٥ فئات. || أصغر علامة ١٠ وأكبر علامة ٢٩ فالمدى = ٢٩ − ١٠ = ١٩. طول الفئة = ١٩ ÷ ٥ = ٣٫٨ فنقرّبه إلى ٤. الفئة الأولى تبدأ من ١٠ وتنتهي عند ١٠ + ٤ − ١ = ١٣. فتكون الفئات: ١٠–١٣ ، ١٤–١٧ ، ١٨–٢١ ، ٢٢–٢٥ ، ٢٦–٢٩. بالعدّ تكون التكرارات: ٣، ٤، ١٠، ٩، ٤ ومجموعها ٣٠ وهو عدد الطلاب.","? وزن ٢٠ حقيبة (كغم): ٦، ١١، ٨، ١٤، ٩، ١٣، ٥، ١٢، ١٠، ٧، ١٥، ٨، ١٢، ٩، ١١، ١٠، ٦، ١٣، ١٤، ٧. أنظّمها في جدول تكراري من ٤ فئات. || المدى = ١٥ − ٥ = ١٠. طول الفئة = ١٠ ÷ ٤ = ٢٫٥ فنقرّبه إلى ٣. الفئة الأولى: من ٥ إلى ٥ + ٣ − ١ = ٧. الفئات: ٥–٧، ٨–١٠، ١١–١٣، ١٤–١٦. التكرارات: ٥، ٦، ٦، ٣ ومجموعها ٢٠.","? علامات ٢٦ طالباً في الرياضيات: ٣٠، ٢٥، ١٤، ١٣، ١٤، ١٢، ٢٥، ٢٢، ١٢، ١١، ٢٣، ٢٤، ٣٠، ١٨، ١٧، ١٦، ١٢، ٢٥، ١٤، ١٩، ٢٠، ٢٠، ٣١، ٢٩، ٢٨، ٢٧. أنظّمها في خمس فئات. || أصغر علامة ١١ وأكبر علامة ٣١ فالمدى = ٢٠. طول الفئة = ٢٠ ÷ ٥ = ٤. لكنّ الفئات ذات الطول ٤ هي ١١–١٤ ، ١٥–١٨ ، ١٩–٢٢ ، ٢٣–٢٦ ، ٢٧–٣٠ وهي لا تشمل العلامة ٣١! فنزيد الطول إلى ٥: الفئات ١١–١٥، ١٦–٢٠، ٢١–٢٥، ٢٦–٣٠، ٣١–٣٥ وتكراراتها ٨، ٦، ٦، ٥، ١ ومجموعها ٢٦.","? يبيّن الجدول عدد طلبة أربع كليات: الهندسة ١٢٠، العلوم ١٨٠، الآداب ٢٤٠، التجارة ١٨٠. أجد زاوية القطاع الدائري لكلّ كلية. || العدد الكلي = ١٢٠ + ١٨٠ + ٢٤٠ + ١٨٠ = ٧٢٠. الهندسة: ١٢٠ ÷ ٧٢٠ × ٣٦٠ = ٦٠°. العلوم: ١٨٠ ÷ ٧٢٠ × ٣٦٠ = ٩٠°. الآداب: ٢٤٠ ÷ ٧٢٠ × ٣٦٠ = ١٢٠°. التجارة: ١٨٠ ÷ ٧٢٠ × ٣٦٠ = ٩٠°. المجموع = ٦٠ + ٩٠ + ١٢٠ + ٩٠ = ٣٦٠° ✓.","? عدد صناديق محاصيل الفواكه: التفاح ٦٠، البلح ٦٠، الموز ٥٠، الإجاص ٤٠، الفراولة ٣٠. أجد زاوية كلّ قطاع. || العدد الكلي = ٢٤٠. التفاح: ٦٠ ÷ ٢٤٠ × ٣٦٠ = ٩٠°. البلح = ٩٠° (تكراره مثل التفاح). الموز: ٥٠ ÷ ٢٤٠ × ٣٦٠ = ٧٥°. الإجاص: ٤٠ ÷ ٢٤٠ × ٣٦٠ = ٦٠°. الفراولة: ٣٠ ÷ ٢٤٠ × ٣٦٠ = ٤٥°. المجموع = ٩٠ + ٩٠ + ٧٥ + ٦٠ + ٤٥ = ٣٦٠° ✓.","? تضمّ مدرسة ٣ صفوف دراسية عدد طالباتها ٢٤٠. زاوية قطاع الصف الثاني عشر ٩٠° وزاوية قطاع الصف العاشر ١٥٠°. أجد عدد طالبات الصف الحادي عشر. || زاوية قطاع الصف الحادي عشر = ٣٦٠° − (١٥٠° + ٩٠°) = ١٢٠°. من القانون: ١٢٠ = (عدد الطالبات ÷ ٢٤٠) × ٣٦٠، فعدد الطالبات = ١٢٠ × ٢٤٠ ÷ ٣٦٠ = ٨٠ طالبة.","# تدرّب","? أنظّم البيانات الآتية (٤٥ قيمة) في جدول تكراري عدد فئاته ٥: ٣٤، ٣٤، ٣٨، ٣٥، ٤٣، ٤٨، ٤٦، ٢٧، ٣٠، ٣١، ٣٢، ٣٧، ٤٠، ٣٩، ٣٣، ٣٠، ٣٢، ٢٦، ٤١، ٣٦، ٣١، ٣٤، ٣١، ٢٦، ٣٨، ٣٩، ٤٢، ٣٧، ٣٥، ٣١، ٢٨، ٤٠، ٣٧، ٣٥، ٣٥، ٣٨، ٣٣، ٤٤، ٣٤، ٤٤، ٣٩، ٣٢، ٣٠، ٢٩، ٤٩. || أصغر قيمة ٢٦ وأكبر قيمة ٤٩ فالمدى = ٢٣. طول الفئة = ٢٣ ÷ ٥ = ٤٫٦ فنقرّبه إلى ٥. الفئات: ٢٦–٣٠، ٣١–٣٥، ٣٦–٤٠، ٤١–٤٥، ٤٦–٥٠. التكرارات: ٨، ١٧، ١٢، ٥، ٣ ومجموعها ٤٥.","? بلغ عدد مشجعي فريق كرة قدم في خمس مباريات ٤٨٠٠ متفرّج، فإذا مُثّلت أعدادهم بالقطاعات الدائرية وكانت زاوية قطاع المباراة الرابعة ١٢٠°، فما عدد مشجعي الفريق في تلك المباراة؟ || عدد المشجعين = ١٢٠ ÷ ٣٦٠ × ٤٨٠٠ = ١٦٠٠ متفرّج."],"q":["- ما الجدول التكراري؟ ولماذا نجمع البيانات الكبيرة في فئات؟","- كيف نحسب طول الفئة؟ وماذا نفعل إذا كان الناتج عشرياً؟ وكيف نجد الحدّ الأعلى للفئة الأولى؟","- أنظّم البيانات الآتية في جدول تكراري من ٤ فئات: ٧، ١٢، ٩، ١٥، ١١، ٢٠، ٨، ١٣، ١٦، ١٠، ١٤، ١٨.","- في مدرسة ١٢٠ طالباً اختار ٣٠ منهم النشاط الرياضي. ما زاوية القطاع الدائري الذي يمثّلهم؟","- مُثّلت أعداد زوّار حديقة خلال أسبوع بالقطاعات الدائرية، فكانت زاوية قطاع اليوم الثالث ٦٠° وعدد زوّاره ٢٠٠ زائر. ما عدد زوّار الأسبوع؟"],"quiz":[{"l":0,"k":"n","q":"الجدول التكراري يبيّن:","o":["مجموع القيم فقط","عدد مرات ظهور كلّ قيمة أو كلّ فئة من البيانات","أكبر قيمة وأصغر قيمة فقط","الوسط الحسابي للقيم فقط"],"a":1},{"l":0,"k":"n","q":"الفئة في الجدول التكراري هي:","o":["أكبر قيمة في البيانات","عدد مرات تكرار قيمة واحد ب. ابدأ الفئة الأولى من ٢٣ ثم عدّ قيم الفئة الثانية.","أصغر قيمة ١١ وأكبر قيمة ٣١ ونريد ٥ فئات. أصغر طول صحيح للفئة يجعل الفئات تشمل جميع القيم هو:":"طول ٤ يعطي فئات تنتهي عند ٣٠ فقط؛ جرّب طول ٥ وانظر أين تنتهي الفئة الأخيرة."}},{"t":"مقاييس النزعة المركزية للجداول التكرارية","e":["# نشاط تمهيدي: مقاييس النزعة المركزية للبيانات المفردة","تتعدّد المؤسسات الثقافية في فلسطين، وقد رصد الجهاز المركزي للإحصاء عدد المراكز الثقافية العاملة في ١٦ محافظة فلسطينية عام ٢٠١٥م فكانت: ٦٧، ١٢، ٤٥، ٨٧، ٢٩، ١٣، ٣٢، ١٢، ٥٠، ٨١، ٨٣، ١٦، ٣٠، ١٧، ٩، ٩.","- الوسط الحسابي = مجموع القيم ÷ عددها = ٥٩٢ ÷ ١٦ = ٣٧ مركزاً ثقافياً.","- الوسيط: نرتّب القيم تصاعدياً: ٩، ٩، ١٢، ١٢، ١٣، ١٦، ١٧، ٢٩، ٣٠، ٣٢، ٤٥، ٥٠، ٦٧، ٨١، ٨٣، ٨٧. عدد القيم زوجي، فالوسيط هو الوسط الحسابي للقيمتين الوسطيّتين ٢٩ و٣٠ = ٢٩٫٥.","- المنوال: القيمة الأكثر تكراراً، وهنا القيمتان ٩ و١٢ (كلٌّ منهما تكررت مرتين).","! في الجداول التكرارية لا تظهر القيم الأصلية، بل فئات؛ لذلك نعتمد على مركز الفئة ليمثّل قيم الفئة كلّها.","# مركز الفئة","مركز الفئة = (الحدّ الأدنى + الحدّ الأعلى) ÷ ٢.","- الفئة ٥–٩ مركزها (٥ + ٩) ÷ ٢ = ٧، والفئة ١٠–١٤ مركزها ١٢، والفئة ٢٠–٢٤ مركزها ٢٢.","! مركز الفئة قد يكون عدداً كسرياً: مركز الفئة ٦٠–٦٩ هو ٦٤٫٥.","# أولاً: الوسط الحسابي للجدول التكراري","الوسط الحسابي (س̄) = Σ(س × ت) ÷ Σت، حيث س̄: الوسط الحسابي، ت: تكرار الفئة، Σت: مجموع التكرارات، س: مركز الفئة، Σ: رمز المجموع.","نضيف إلى الجدول عموداً لمركز الفئة (س) وعموداً لحاصل الضرب (س × ت)، ثم نجمع العمودين. المثال: سرعة الرياح (كم/س) لعشرين يوماً متتالياً في فصل الربيع:","|الفئات|التكرار (ت)|مركز الفئة (س)|س × ت","|٥–٩|٥|٧|٣٥","|١٠–١٤|٢|١٢|٢٤","|١٥–١٩|٦|١٧|١٠٢","|٢٠–٢٤|٣|٢٢|٦٦","|٢٥–٢٩|٤|٢٧|١٠٨","|المجموع|٢٠|—|٣٣٥","الوسط الحسابي = ٣٣٥ ÷ ٢٠ = ١٦٫٧٥ كم/س.","# ثانياً: المنوال للجدول التكراري","المنوال للجداول التكرارية هو مركز الفئة الأكثر تكراراً. وتُسمّى الفئة الأكثر تكراراً الفئة المنوالية.","|المقياس|في البيانات المفردة|في الجدول التكراري","|الوسط الحسابي|مجموع القيم ÷ عددها|Σ(س × ت) ÷ Σت","|المنوال|القيمة الأكثر تكراراً|مركز الفئة الأكثر تكراراً","|الوسيط|القيمة الوسطى بعد الترتيب|لا نحسبه في هذا الدرس","# أمثلة محلولة","? أجد الوسط الحسابي لسرعة الرياح في الجدول أعلاه. || مراكز الفئات: ٧ ، ١٢ ، ١٧ ، ٢٢ ، ٢٧. نحسب س × ت: ٧×٥ = ٣٥ ، ١٢×٢ = ٢٤ ، ١٧×٦ = ١٠٢ ، ٢٢×٣ = ٦٦ ، ٢٧×٤ = ١٠٨. Σ(س × ت) = ٣٣٥ ، Σت = ٢٠. الوسط = ٣٣٥ ÷ ٢٠ = ١٦٫٧٥ كم/س.","? في الجدول التكراري: الفئات ١–٥ ، ٦–١٠ ، ١١–١٥ ، ١٦–٢٠ وتكراراتها ٢ ، ٤ ، ٣ ، ١. أجد مراكز الفئات والمنوال. || مراكز الفئات: ٣ ، ٨ ، ١٣ ، ١٨. أكبر تكرار هو ٤ وهو للفئة ٦–١٠ (الفئة المنوالية). المنوال = مركزها = (٦ + ١٠) ÷ ٢ = ٨.","? يمثّل الجدول توزيع علامات ٣٢ طالباً في أحد المباحث: الفئات ٤٠–٤٤ ، ٤٥–٤٩ ، ٥٠–٥٤ ، ٥٥–٥٩ ، ٦٠–٦٤ ، ٦٥–٦٩ وتكراراتها ٢ ، ٦ ، ٨ ، ٧ ، ٥ ، ٤. أجد المنوال والوسط الحسابي. || أكبر تكرار ٨ والفئة المنوالية ٥٠–٥٤، فالمنوال = (٥٠ + ٥٤) ÷ ٢ = ٥٢. الوسط: المراكز ٤٢ ، ٤٧ ، ٥٢ ، ٥٧ ، ٦٢ ، ٦٧ و س × ت = ٨٤ ، ٢٨٢ ، ٤١٦ ، ٣٩٩ ، ٣١٠ ، ٢٦٨ ومجموعها ١٧٥٩. الوسط = ١٧٥٩ ÷ ٣٢ ≈ ٥٤٫٩٧.","? الجدول التكراري الآتي يمثّل علامات ٢٠ طالباً في الإحصاء: الفئات ٥–٩ ، ١٠–١٤ ، ١٥–١٩ ، ٢٠–٢٤ ، ٢٥–٢٩ وتكراراتها ٥ ، ١ ، ٣ ، ٧ ، ٤. أجد الوسط الحسابي والمنوال. || المراكز: ٧ ، ١٢ ، ١٧ ، ٢٢ ، ٢٧. س × ت: ٣٥ ، ١٢ ، ٥١ ، ١٥٤ ، ١٠٨ ومجموعها ٣٦٠. الوسط = ٣٦٠ ÷ ٢٠ = ١٨. الفئة الأكثر تكراراً ٢٠–٢٤ (تكرارها ٧) فالمنوال = ٢٢.","? يوزّع الجدول علامات ٤٠ طالبةً في مبحث الرياضيات: الفئات ٣–٧ ، ٨–١٢ ، ١٣–١٧ ، ١٨–٢٢ ، ٢٣–٢٧ وتكراراتها ٣ ، ٥ ، ١٢ ، ١٨ ، ٢. أجد الوسط الحسابي. || المراكز: ٥ ، ١٠ ، ١٥ ، ٢٠ ، ٢٥. س × ت: ١٥ ، ٥٠ ، ١٨٠ ، ٣٦٠ ، ٥٠ ومجموعها ٦٥٥. الوسط = ٦٥٥ ÷ ٤٠ = ١٦٫٣٧٥ ≈ ١٦٫٤.","? في جدول تكراري كان Σت = ٢٥ وΣ(س × ت) = ٥٠٠. ما الوسط الحسابي؟ وإذا كان منوال الجدول مركز الفئة ٣٠–٣٤ فما قيمته؟ || الوسط = ٥٠٠ ÷ ٢٥ = ٢٠. مركز الفئة ٣٠–٣٤ هو (٣٠ + ٣٤) ÷ ٢ = ٣٢، فالمنوال = ٣٢.","# أخطاء شائعة","! الخطأ: استعمال الحدّ الأدنى أو الأعلى للفئة بدل مركزها في حساب (س × ت). الصواب: نستعمل مركز الفئة دائماً.","! الخطأ: القسمة على عدد الفئات. الصواب: القسمة على مجموع التكرارات Σت، أي عدد القيم الكلي.","! الخطأ: كتابة تكرار الفئة الأكثر تكراراً على أنه المنوال. الصواب: المنوال هو مركز تلك الفئة وليس تكرارها.","# تدرّب","? أجد الوسط الحسابي والمنوال للجدول: الفئات ١٠–١٩ ، ٢٠–٢٩ ، ٣٠–٣٩ وتكراراتها ٤ ، ٦ ، ١٠. || المراكز: ١٤٫٥ ، ٢٤٫٥ ، ٣٤٫٥. س × ت: ٥٨ ، ١٤٧ ، ٣٤٥ ومجموعها ٥٥٠. Σت = ٢٠. الوسط = ٥٥٠ ÷ ٢٠ = ٢٧٫٥. الفئة المنوالية ٣٠–٣٩ فالمنوال = ٣٤٫٥."],"q":["- كيف نحسب مركز الفئة؟ أجد مركز الفئة ٣٠–٣٤.","- اكتب قانون الوسط الحسابي للجدول التكراري وبيّن معنى كلّ رمزٍ فيه.","- ما المنوال للجداول التكرارية؟ وما الفرق بينه وبين تكرار الفئة؟","- الجدول: الفئات ٠–٤ ، ٥–٩ ، ١٠–١٤ وتكراراتها ٢ ، ٥ ، ٣. أجد الوسط الحسابي والمنوال.","- لماذا نستعمل مركز الفئة بدل القيم الأصلية عند حساب الوسط الحسابي من الجدول التكراري؟"],"quiz":[{"l":0,"k":"n","q":"مركز الفئة يساوي:","o":["الحدّ الأدنى للفئة","الحدّ الأعلى − الحدّ الأدنى","(الحدّ الأدنى + الحدّ الأعلى) ÷ ٢","طول الفئة ÷ ٢"],"a":2},{"l":0,"k":"n","q":"الوسط الحسابي للجدول التكراري يساوي:","o":["مجموع (س × ت) ÷ مجموع التكرارات","مجموع س ÷ مجموع ت","مجموع ت ÷ مجموع (س × ت)","مجموع (س × ت) ÷ عدد الفئات"],"a":0},{"l":0,"k":"n","q":"في قانون الوسط الحسابي للجدول التكراري يرمز (ت) إلى:","o":["مركز الفئة","تكرار الفئة","طول الفئة","الحدّ الأعلى للفئة"],"a":1},{"l":0,"k":"n","q":"المنوال للجدول التكراري هو:","o":["مركز الفئة الأكثر تكراراً","الفئة الأقل تكراراً","الحدّ الأدنى للفئة الأكثر تكراراً","مجموع التكرارات"],"a":0},{"l":0,"k":"n","q":"مركز الفئة ٣٠–٣٤ يساوي:","o":["٣٠","٣٢","٣٤","٦٤"],"a":1},{"l":0,"k":"n","q":"الفئة المنوالية هي الفئة التي:","o":["مركزها أكبر","تكرارها أصغر","تكرارها أكبر","حدّها الأدنى أصغر"],"a":2},{"l":0,"k":"n","q":"في عمود (س × ت) نضرب:","o":["الحدّ الأدنى في الحدّ الأعلى","طول الفئة في تكرارها","التكرارات ببعضها","مركز كلّ فئة في تكرارها"],"a":3},{"l":0,"k":"n","q":"مجموع التكرارات Σت في الجدول التكراري يمثّل:","o":["عدد الفئات","مجموع مراكز الفئات","العدد الكلي للقيم","أكبر تكرار"],"a":2},{"l":1,"k":"p","q":"مركز الفئة ٤٥–٤٩ يساوي:","o":["٤٥","٤٧","٤٩","٩٤"],"a":1},{"l":1,"k":"p","q":"في جدولٍ فئاته ١–٥ ، ٦–١٠ ، ١١–١٥ ، ١٦–٢٠ وتكراراتها ٢ ، ٤ ، ٣ ، ١ يكون المنوال:","o":["٤","٨","١٣","٦"],"a":1},{"l":1,"k":"p","q" ٤ وتكراراتها ٢ ، ٥ ، ٣. الوسط الحسابي يساوي:":"المراكز ٢ و٧ و١٢؛ اضرب كلّ مركز بتكراره، واجمع، ثم اقسم على مجموع التكرارات (١٠).","الفئات ٥–٩ ، ١٠–١٤ ، ١٥–١٩ ، ٢٠–٢٤ ، ٢٥–٢٩ وتكراراتها ٥ ، ٢ ، ٦ ، ٣ ، ٤. الوسط الحسابي لسرعة الرياح يساوي:":"احسب س × ت لكلّ فئة (٣٥ ، ٢٤ ، …) ثم اقسم المجموع على ٢٠.","مراكز فئات جدول ١٠ ، ٢٠ ، ٣٠ وتكراراتها ٤ ، س ، ٦ والوسط الحسابي ٢١. قيمة س تساوي:":"اكتب المعادلة: (٤٠ + ٢٠س + ١٨٠) ÷ (١٠ + س) = ٢١ ثم حلّها.","الفئات ٠–٩ ، ١٠–١٩ ، ٢٠–٢٩ ، ٣٠–٣٩ وتكراراتها ٥ ، ١٥ ، ٢٥ ، ٥. الوسط الحسابي يساوي:":"مراكز هذه الفئات أعداد كسرية (٤٫٥ ، ١٤٫٥ ، …)؛ لا تهمل الكسر."}},{"t":"الانحراف المعياري للجداول التكرارية","e":["# نشاط تمهيدي: من يبتعد عن الوسط؟","رصد الجهاز المركزي للإحصاء عدد حوادث الطرق في فلسطين عام ٢٠١٤م بحسب الأشهر، فكان: ٦٤٧، ٥٩٣، ٦١٨، ٦٧٤، ٧٤٦، ٦٦٠، ٦٤٩، ٦٨٥، ١١٧٩، ٥٥٨، ٥٧٤، ٥٩٤.","- المعدّل الشهري = مجموع الحوادث ÷ ١٢ = ٨١٧٧ ÷ ١٢ ≈ ٦٨١٫٤ حادثاً.","- أبعد القيم عن المعدّل هي ١١٧٩ لأنّ الفرق بينها وبين المعدّل أكبر ما يكون (حوالي ٤٩٨).","- أقرب قيمة إلى المعدّل هي ٦٨٥ (فرقها عن المعدّل حوالي ٣٫٦).","فكرة الانحراف: نقيس ابتعاد القيم عن وسطها الحسابي لنعرف هل هي متقاربة أم مبعثرة، وهذا ما تقيسه مقاييس التشتت.","# تذكير: مقاييس التشتت للبيانات المفردة","- المدى = أكبر قيمة − أصغر قيمة، ولا يمكن أن يكون سالباً، لكنه لا يصف التشتت بدقة لأنه يعتمد على قيمتين فقط.","- التباين (σ²) = Σ(س − س̄)² ÷ ن، ويمكن حسابه من الصيغة المختصرة: σ² = (Σس² − ن × س̄²) ÷ ن.","- الانحراف المعياري (σ) = الجذر التربيعي للتباين = √σ².","! لا يمكن أن يكون التباين سالباً لأنه مجموع مربّعات مقسوم على عدد القيم.","# الانحراف المعياري للجدول التكراري","الانحراف المعياري للجداول التكرارية هو الجذر التربيعي لمجموع حاصل ضرب التكرارات في مربّع انحراف مراكز الفئات عن الوسط الحسابي مقسوماً على مجموع التكرارات:","σ = √[ Σ( (س − س̄)² × ت ) ÷ Σت ]، حيث ت: تكرار الفئة، س: مركز الفئة، س̄: الوسط الحسابي.","# خطوات الحساب","- ١) نجد مركز كلّ فئة (س).","- ٢) نحسب س × ت ثم الوسط الحسابي س̄ = Σ(س × ت) ÷ Σت.","- ٣) نحسب انحراف كلّ مركز عن الوسط (س − س̄) ثم نربّعه (س − س̄)².","- ٤) نضرب كلّ مربّع في تكرار فئته: (س − س̄)² × ت ثم نجمع العمود.","- ٥) نقسم المجموع على Σت فنحصل على التباين، ونأخذ الجذر التربيعي فنحصل على σ.","نطبّق الخطوات على علامات الطلبة (الصف التاسع) في الرياضيات:","|الفئات|ت|س|س × ت|(س − س̄)²|(س − س̄)² × ت","|٢٧–٣٥|٣|٣١|٩٣|٩٠٠|٢٧٠٠","|٣٦–٤٤|٥|٤٠|٢٠٠|٤٤١|٢٢٠٥","|٤٥–٥٣|٦|٤٩|٢٩٤|١٤٤|٨٦٤","|٥٤–٦٢|٨|٥٨|٤٦٤|٩|٧٢","|٦٣–٧١|٧|٦٧|٤٦٩|٣٦|٢٥٢","|٧٢–٨٠|٧|٧٦|٥٣٢|٢٢٥|١٥٧٥","|٨١–٨٩|٦|٨٥|٥١٠|٥٧٦|٣٤٥٦","|المجموع|٤٢|—|٢٥٦٢|—|١١١٢٤","س̄ = ٢٥٦٢ ÷ ٤٢ = ٦١. التباين = ١١١٢٤ ÷ ٤٢ ≈ ٢٦٤٫٨٦. الانحراف المعياري σ = √٢٦٤٫٨٦ ≈ ١٦٫٢٧.","! كلّما كان الانحراف المعياري أصغر كانت القيم أقرب إلى وسطها الحسابي (أقل تشتتاً)، وكلّما كان أكبر كانت أكثر تشتتاً.","# أمثلة محلولة","? أجد التباين والانحراف المعياري للقيم ٠ ، ١ ، ٢ ، ٣ ، ٤. || س̄ = ١٠ ÷ ٥ = ٢. Σس² = ٠ + ١ + ٤ + ٩ + ١٦ = ٣٠. التباين = (٣٠ − ٥ × ٢²) ÷ ٥ = (٣٠ − ٢٠) ÷ ٥ = ٢. الانحراف المعياري = √٢ ≈ ١٫٤١.","? عند إيجاد الانحراف المعياري لثماني قيم س وُجد أنّ Σس = ٢٤ وΣس² = ٨٠. أكمل إيجاده. || س̄ = ٢٤ ÷ ٨ = ٣. التباين = (٨٠ − ٨ × ٣²) ÷ ٨ = (٨٠ − ٧٢) ÷ ٨ = ١. الانحراف المعياري = √١ = ١.","? سُجّلت سنوات الخبرة لدى طاقم روضة أطفال: ١ ، ٢ ، ٣ ، ٤ ، ٥ ، ٦ ، ٧. أجد المدى والانحراف المعياري. || المدى = ٧ − ١ = ٦ سنوات. س̄ = ٢٨ ÷ ٧ = ٤. Σس² = ١٤٠. التباين = (١٤٠ − ٧ × ١٦) ÷ ٧ = (١٤٠ − ١١٢) ÷ ٧ = ٤. الانحراف المعياري = ٢ سنة.","? أجد الانحراف المعياري للجدول: الفئات ١–٥ ، ٦–١٠ ، ١١–١٥ ، ١٦–٢٠ وتكراراتها ١ ، ٢ ، ٣ ، ٤. || المراكز: ٣ ، ٨ ، ١٣ ، ١٨. س × ت: ٣ ، ١٦ ، ٣٩ ، ٧٢ ومجموعها ١٣٠، Σت = ١٠ فالوسط = ١٣. (س − س̄)²: ١٠٠ ، ٢٥ ، ٠ ، ٢٥. ضربها في التكرارات: ١٠٠ ، ٥٠ ، ٠ ، ١٠٠ ومجموعها ٢٥٠. التباين = ٢٥٠ ÷ ١٠ = ٢٥. الانحراف المعياري = √٢٥ = ٥.","? الجدول التكراري الآتي يمثّل علامات ٢٠ طالباً في الإحصاء: الفئات ٥–٩ ، ١٠–١٤ ، ١٥–١٩ ، ٢٠–٢٤ ، ٢٥–٢٩ وتكراراتها ٥ ، ١ ، ٣ ، ٧ ، ٤. أحسب الانحراف المعياري. || المراكز: ٧ ، ١٢ ، ١٧ ، ٢٢ ، ٢٧ والوسط س̄ = ٣٦٠ ÷ ٢٠ = ١٨. (س − س̄)²: ١٢١ ، ٣٦ ، ١ ، ١٦ ، ٨١. ضربها في التكرارات: ٦٠٥ ، ٣٦ ، ٣ ، ١١٢ ، ٣٢٤ ومجموعها ١٠٨٠. التباين = ١٠٨٠ ÷ ٢٠ = ٥٤. الانحراف المعياري = √٥٤ ≈ ٧٫٣٥.","? في مجموعتين من الطلاب كان الوسط الحسابي لأطوالهم متساوياً، والانحراف المعياري للأولى ٤ سم وللثانية ١٫٤ سم. أيّ المجموعتين أطوالها أكثر تجانساً؟ || الانحراف المعياري للثانية أصغر (١٫٤ < ٤)، فأطوالها أقرب إلى وسطها وأكثر تجانساً، أما أطوال الأولى فأكثر تشتتاً.","# أخطاء شائعة","! الخطأ: نسيان ضرب (س − س̄)² في التكرار ت. الصواب: لكلّ فئة نضرب مربّع انحراف مركزها في تكرارها.","! الخطأ: القسمة على عدد الفئات. الصواب: نقسم على مجموع التكرارات Σت.","! الخطأ: التوقف عند التباين. الصواب: الانحراف المعياري هو الجذر التربيعي للتباين.","! الخطأ: تربيع الوسط بدل تربيع الفرق. الصواب: (س − س̄)² أي نطرح أولاً ثم نربّع.","# تدرّب","? أجد الانحراف المعياري لجدولٍ فئتاه مركزاهما ١٠ و٢٠ وتكرار كلّ منهما ٥. || س̄ = (١٠×٥ + ٢٠×٥) ÷ ١٠ = ١٥. (س − س̄)² = ٢٥ لكلّ فئة. التباين = (٢٥×٥ + ٢٥×٥) ÷ ١٠ = ٢٥. الانحراف المعياري = ٥."],"q":["- أكتب قانون الانحراف المعياري للجدول التكراري، وأبيّن معنى كلّ رمزٍ فيه.","- أحسب الانحراف المعياري للجدول: الفئات ٠–٤ ، ٥–٩ ، ١٠–١٤ وتكراراتها ٢ ، ٥ ، ٣.","- ما الفرق بين التباين والانحراف المعياري؟ ولماذا لا يكون التباين سالباً؟","- أحسب الانحراف المعياري لعلامات ٤٠ طالباً: الفئات ٣–٧ ، ٨–١٢ ، ١٣–١٧ ، ١٨–٢٢ ، ٢٣–٢٧ وتكراراتها ٣ ، ٥ ، ١٢ ، ١٨ ، ٢.","- مجموعتان لهما الوسط الحسابي نفسه والانحراف المعياري للأولى ٤ وللثانية ١٠. أيّهما أكثر تجانساً؟ ولماذا؟"],"quiz":[{"l":0,"k":"n","q":"الانحراف المعياري للجدول التكراري يساوي:","o":["√[ Σ((س − س̄)² × ت) ÷ Σت ]","Σ(س × ت) ÷ Σت","Σ((س − س̄) × ت) ÷ Σت","Σ((س − س̄)² × ت) ÷ Σت"],"a":0},{"l":0,"k":"n","q":"الانحراف المعياري هو:","o":["مربّع التباين","الفرق بين أكبر قيمة وأصغر قيمة","الجذر التربيعي للتباين","الوسط الحسابي للانحرافات"],"a":2},{"l":0,"k":"n","q":"إذا كان الانحراف المعياري ٣ فإنّ التباين يساوي:","o":["٦","٩","٣","٢٧"],"a":1},{"l":0,"k":"n","q":"لا يمكن أن يكون التباين:","o":["صفراً","عدداً كسرياً","أكبر من ١٠٠","سالباً"],"a":3},{"l":0,"k":"n","q":"أيّ المقاييس الآتية من مقاييس التشتت؟","o":["الوسط الحسابي","الانحراف المعياري","المنوال","مركز الفئة"],"a":1},{"l":0,"k":"n","q":"كلّما صغر الانحراف المعياري دلّ ذلك على أنّ ا اتها ٢ ، ٤ ، ٦ ، ٨. الانحراف المعياري يساوي:","o":["٣","٩","٨","٦"],"a":0},{"l":2,"k":"p","q":"الفئات ١–٥ ، ٦–١٠ ، ١١–١٥ ، ١٦–٢٠ ، ٢١–٢٥ وتكراراتها ١ ، ٢ ، ٦ ، ٢ ، ١. الوسط الحسابي والانحراف المعياري على الترتيب:","o":["١٣ و ٢٥","١٨ و ٥","١٣ و ٥","١٣ و ١"],"a":2},{"l":2,"k":"p","q":"انحراف معياري لعلامات ٣٠ طالباً يساوي صفراً. نستنتج أنّ:","o":["جميع العلامات صفر","الوسط الحسابي للعلامات صفر","جميع العلامات متساوية","نصف الطلاب راسبون"],"a":2},{"l":2,"k":"p","q":"جدول فئتاه مركزاهما ٢٠ و٤٠ وتكرار كلّ منهما متساوٍ. الانحراف المعياري يساوي:","o":["٢٠","٥","٣٠","١٠"],"a":3},{"l":2,"k":"p","q":"الفئات ٣–٧ ، ٨–١٢ ، ١٣–١٧ ، ١٨–٢٢ ، ٢٣–٢٧ وتكراراتها ٣ ، ٥ ، ١٢ ، ١٨ ، ٢. الانحراف المعياري يساوي تقريباً:","o":["٢٥","٥","١٦٫٤","٤"],"a":1}],"hints":{"وسط جدول تكراري ٦١ ومركز إحدى فئاته ٤٠. قيمة (س − س̄)² لهذه الفئة تساوي:":"اطرح الوسط من المركز أولاً ثم ربّع النتيجة.","لثماني قيم س كان Σس = ٢٤ وΣس² = ٨٠. الانحراف المعياري لهذه القيم يساوي:":"احسب الوسط أولاً (٢٤ ÷ ٨)، ثم التباين = (٨٠ − ٨ × الوسط²) ÷ ٨.","الفئات ٥–٩ ، ١٠–١٤ ، ١٥–١٩ ، ٢٠–٢٤ ، ٢٥–٢٩ وتكراراتها ٥ ، ١ ، ٣ ، ٧ ، ٤. الانحراف المعياري (مقرّباً إلى منزلتين عشريتين) يساوي:":"الوسط ١٨؛ اضرب كلّ مربّع انحراف في تكرار فئته قبل الجمع، ولا تنسَ الجذر في النهاية.","الفئات ١–٣ ، ٤–٦ ، ٧–٩ ، ١٠–١٢ وتكراراتها ٢ ، ٤ ، ٦ ، ٨. الانحراف المعياري يساوي:":"احسب الوسط أولاً؛ سيظهر أنّ مجموع (س − س̄)² × ت يساوي ١٨٠.","الفئات ٣–٧ ، ٨–١٢ ، ١٣–١٧ ، ١٨–٢٢ ، ٢٣–٢٧ وتكراراتها ٣ ، ٥ ، ١٢ ، ١٨ ، ٢. الانحراف المعياري يساوي تقريباً:":"الوسط ≈ ١٦٫٣٨؛ التباين يقارب ٢٥."}}]},{"title":"المثلثات والمتباينات وكثيرات الحدود","ic":"tri","color":"#cfe2b0","uq":[[1,"قيمة جا ٣٠° + جتا ٦٠° تساوي:",["١","١/٢","√٣","٠"],0],[1,"إذا كان جا س = ٦/١٠ وكانت س زاوية حادة فإن قتا س تساوي:",["٣/٥","٥/٤","٤/٥","٥/٣"],3],[1,"المجموعة {س : س ∈ ح ، ٢ ≤ س < ٩} تُكتب بصورة فترة:",["⁦]٢ ، ٩]⁩","⁦[٢ ، ٩]⁩","⁦[٢ ، ٩[⁩","⁦]٢ ، ٩[⁩"],2],[1,"مجموعة حل المتباينة ٣س − ٤ ≥ ٨ هي:",["س ≤ ٤","س ≥ ٤","س ≥ ٣","س ≤ ٣"],1],[2,"مجموعة حل المتباينة −٣س + ٢ < ١١ بصورة فترة هي:",["⁦]−∞ ، −٣[⁩","⁦[−٣ ، ∞[⁩","⁦]٣ ، ∞[⁩","⁦]−٣ ، ∞[⁩"],3],[2,"إذا كان جتا (٩٠° − س) = ٣/٥ وكانت س زاوية حادة فإن ظا س تساوي:",["٣/٤","٤/٣","٥/٣","٣/٥"],0],[1,"أيّ النقاط الآتية تنتمي إلى منطقة حل المتباينة ٢س + ص < ٥؟",["(١ ، ٢)","(٢ ، ١)","(١ ، ٣)","(٣ ، ٠)"],0],[1,"المستقيم الحدودي للمتباينة س − ٣ص ≥ ٦ يُرسم:",["متقطعاً","متصلاً","على محور السينات فقط","على محور الصادات فقط"],1],[1,"درجة كثير الحدود ق(س) = ٥س² − ٣س⁶ + ٧س − ١ هي:",["٢","٧","٦","٥"],2],[2,"إذا كان ق(س) = س² − ٥س + ٦ فإن أصفار ق هي:",["١ و ٦","٢ و ٣","−٢ و −٣","٢ و −٣"],1],[2,"إذا كان ق(س) = ٣س² + ٢س − ١ ، هـ(س) = س² − ٤س + ٥ فإن (ق − هـ)(س) تساوي:",["٢س² − ٢س + ٤","٢س² + ٦س − ٦","٤س² − ٢س + ٤","٢س² + ٦س + ٤"],1],[2,"أيّ النقاط الآتية تنتمي إلى منطقة حل النظام: ص ≥ ١ ، س < ٢ ، س + ص ≤ ٤؟",["(٢ ، ١)","(٠ ، ٠)","(١ ، ٢)","(١ ، ٤)"],2]],"lessons":[{"t":"النسب المثلثية","e":["# نشاط تمهيدي: النسبة بين ضلعين","تعاني الزراعة في فلسطين من نقص المياه، فيحفر المزارعون آبار مياه لأغراض الري. أراد مزارع معرفة انخفاض مستوى سطح الماء في بئر قطره ١ م، فاعتمد على تشابه مثلثين قائمين وكوّن التناسب: ١٢٠/(١٢٠ + ١٠٠) = ١٨٠/(س + ١٨٠).","بضرب الطرفين في الوسطين: ١٢٠ × (س + ١٨٠) = ١٨٠ × ٢٢٠، ومنها س + ١٨٠ = ٣٣٠ فيكون س = ١٥٠ سم، أي انخفض مستوى الماء ١٥٠ سم.","! تذكّر: النسبة بين طولي ضلعين من أضلاع المثلث القائم الزاوية تُسمّى نسبة مثلثية، وهي ثابتة لكل المثلثات القائمة المتشابهة التي لها الزاوية الحادة نفسها.","# أضلاع المثلث القائم بالنسبة إلى زاوية حادة","في المثلث أ ب جـ القائم في ب نحدّد الأضلاع بالنسبة إلى الزاوية الحادة أ:","- الوتر: الضلع أ جـ المقابل للزاوية القائمة، وهو أطول أضلاع المثلث.","- المقابل: الضلع ب جـ، لأنه يقع في مقابل الزاوية أ.","- المجاور: الضلع أ ب، لأنه يجاور الزاوية أ (غير الوتر).","! عند الانتقال إلى الزاوية الحادة جـ تتبدّل الأدوار: يصبح أ ب هو المقابل وب جـ هو المجاور، أما الوتر فيبقى كما هو.","# النسب المثلثية الأساسية","|النسبة|الرمز|القاعدة","|جيب الزاوية أ|جا أ|المقابل ÷ الوتر","|جيب تمام الزاوية أ|جتا أ|المجاور ÷ الوتر","|ظل الزاوية أ|ظا أ|المقابل ÷ المجاور","- إذا كانت س زاوية حادة فإن ٠ < جا س < ١ و ٠ < جتا س < ١، لأن الوتر أطول من كل من الضلعين الآخرين.","- أما ظا س فيمكن أن تأخذ أي قيمة موجبة (أصغر من ١ أو أكبر منها) لأنها نسبة بين ضلعين قائمين.","# النسب المثلثية للزوايا الخاصة","في المثلث أ د ب القائم في د، فيه أ د = ٣ وحدات والزاوية ب = ٣٠°: جا ٣٠° = ١/٢ = أ د/أ ب = ٣/أ ب، ومنها أ ب = ٦ وحدات، وب د = √(٣٦ − ٩) = √٢٧ = ٣√٣ وحدة.","فيكون: جتا ٣٠° = ب د/أ ب = ٣√٣/٦ = √٣/٢، وظا ٣٠° = أ د/ب د = ٣/(٣√٣) = ١/√٣ = √٣/٣. وللزاوية ٦٠° (وهي الزاوية أ في المثلث نفسه) تنعكس الأدوار.","|الزاوية|جا|جتا|ظا","|٣٠°|١/٢|√٣/٢|√٣/٣","|٤٥°|√٢/٢|√٢/٢|١","|٦٠°|√٣/٢|١/٢|√٣","# الزاوية ٤٥° ولوح التزلج","لوح تزلج يرتفع أحد طرفيه ١ م عن الأرض ويصنع مع الأرض زاوية ٤٥°. المثلث القائم هنا متساوي الساقين (الزاويتان الحادتان ٤٥°) فالمجاور = المقابل = ١ م، وطول اللوح (الوتر) = √(١ + ١) = √٢ م.","إذن جا ٤٥° = جتا ٤٥° = ١/√٢ = √٢/٢، وظا ٤٥° = ١/١ = ١.","# إيجاد الزاوية بالآلة الحاسبة","إذا عُلمت إحدى النسب المثلثية لزاوية حادة وأردنا قياس الزاوية نستعمل الآلة الحاسبة العلمية (على وضع الدرجات): الزاوية التي جيبها ٠٫٥ نجدها بتسلسل Shift ثم sin ثم ٠٫٥ ثم = فتظهر ٣٠°، ويُرمز لذلك sin⁻¹. وبالمثل cos⁻¹ للجيب تمام و tan⁻¹ للظل.","! الخطأ الشائع: ترك الآلة الحاسبة على وضع الراديان بدل الدرجات، فتظهر قيم خاطئة. تأكد من الوضع (DEG) قبل الحساب.","# أمثلة محلولة","? أ ب جـ مثلث قائم الزاوية في ب، أ ب = ٨ سم، أ جـ = ١٠ سم. أجد النسب المثلثية الأساسية للزاوية الصغرى. || نجد ب جـ = √(١٠٠ − ٦٤) = √٣٦ = ٦ سم. الزاوية الصغرى تقابل أقصر ضلع (ب جـ = ٦) وهي الزاوية أ. جا أ = ٦/١٠ = ٣/٥، جتا أ = ٨/١٠ = ٤/٥، ظا أ = ٦/٨ = ٣/٤.","? أ ب جـ مثلث قائم في ب، جتا جـ = ٢/٣ و أ جـ = ٣ وحدات. أجد ظا جـ و جا جـ. || جتا جـ = المجاور/الوتر = ب جـ/٣ = ٢/٣ فيكون ب جـ = ٢. ثم (أ ب)² = (أ جـ)² − (ب جـ)² = ٩ − ٤ = ٥ فيكون أ ب = √٥. ظا جـ = المقابل/المجاور = أ ب/ب جـ = √٥/٢، وجا جـ = أ ب/أ جـ = √٥/٣.","? أ ب جـ مثلث قائم في ب، جا جـ = √٥/٣ و أ ب = √٥. أجد جتا جـ و ظا جـ. || جا جـ = أ ب/أ جـ = √٥/أ جـ = √٥/٣ فيكون أ جـ = ٣. ب جـ = √(٩ − ٥) = ٢. إذن جتا جـ = ٢/٣، ظا جـ = √٥/٢.","? في مثلث قائم الزاوية أحد ضلعيه القائمين ٥ سم والآخر ١٢ سم. أجد النسب المثلثية الأساسية للزاوية التي يقابلها الضلع ٥. || الوتر = √(٢٥ + ١٤٤) = ١٣ سم. المقابل = ٥ والمجاور = ١٢. جا = ٥/١٣، جتا = ١٢/١٣، ظا = ٥/١٢.","? سلّم يستند إلى حائط ويصنع مع الأرض زاوية ٧٥°، وتبعد قاعدته عن الحائط ٢ م. ما طول السلّم؟ || قاعدة السلّم هي الضلع المجاور للزاوية ٧٥° والسلّم هو الوتر، فجتا ٧٥° = ٢/طول السلّم. الطول = ٢ ÷ جتا ٧٥° ≈ ٢ ÷ ٠٫٢٥٩ ≈ ٧٫٧٣ م.","? من نقطة تبعد ٣ م عن قاعدة منزل ارتفاعه ٦ م رُصدت قمة المنزل. أحسب زاوية ارتفاع القمة. || نرسم مثلثاً قائماً: المجاور ٣ م والمقابل ٦ م، فظا س = ٦/٣ = ٢. الزاوية س = tan⁻¹(٢) ≈ ٦٣٫٤° بالآلة الحاسبة.","# أخطاء شائعة","! الخطأ: تحديد المقابل والمجاور دون ربطهما بالزاوية المطلوبة؛ والصواب أن نبدأ بتعيين الزاوية ثم المقابل لها ثم المجاور.","! الخطأ: كتابة جا س = ١٫٢ أو جتا س = ١٫٥ لزاوية حادة؛ فجيب الزاوية الحادة وجيب تمامها دائماً أصغر من ١.","! الخطأ: استعمال أي ضلعين في النسبة دون التحقق من أن المثلث قائم الزاوية، فالنسب المثلثية الأساسية تُعرَّف في المثلث القائم فقط."],"q":["- أ ب جـ مثلث قائم الزاوية في ب، أ ب = ٨ سم، أ جـ = ١٠ سم. أجد قيم النسب المثلثية الأساسية للزاوية الصغرى.","- أ ب جـ مثلث قائم الزاوية في ب، جا جـ = √٥/٣ و أ ب = √٥. أجد جتا جـ وظا جـ.","- زاوية الأمان التي يمكن أن يستند بها سلّم على حائط هي ٧٥° تقريباً مع الأرض. إذا كانت قاعدة السلّم تبعد مترين عن الحائط الرأسي فما طول السلّم؟","- من نقطة تبعد ٣ أمتار عن قاعدة منزل ارتفاعه ٦ أمتار رُصدت قمة المنزل. أرسم شكلاً يبيّن زاوية ارتفاع القمة ثم أحسب قيمتها."],"quiz":[{"l":0,"k":"n","q":"الوتر في المثلث القائم الزاوية هو:","o":["أقصر أضلاع المثلث","الضلع المقابل للزاوية القائمة وهو أطول الأضلاع","الضلع المجاور للزاوية الحادة المعطاة","الضلع المقابل للزاوية الحادة المعطاة"],"a":1},{"l":0,"k":"n","q":"جيب الزاوية الحادة أ (جا أ) في المثلث القائم يساوي:","o":["المجاور ÷ الوتر","المقابل ÷ المجاور","الوتر ÷ المقابل","المقابل ÷ الوتر"],"a":3},{"l":0,"k":"n","q":"جيب تمام الزاوية الحادة أ (جتا أ) يساوي:","o":["المجاور ÷ الوتر","المقابل ÷ الوتر","المقابل ÷ المجاور","المجاور ÷ المقابل"],"a":0},{"l":0,"k":"n","q":"ظل الزاوية الحادة أ ( سم و ب جـ = ١٠ سم. إذا رُسم العمود أ د من أ على ب جـ فإن جا ب تساوي:","o":["٥/١٣","١٢/٥","١٢/١٣","٥/١٢"],"a":2},{"l":2,"k":"p","q":"مستطيل بُعداه ٦ سم و٨ سم. جيب الزاوية بين قطره والضلع الأطول (٨ سم) يساوي:","o":["٣/٥","٤/٥","٣/٤","٤/٣"],"a":0},{"l":2,"k":"p","q":"إذا كانت س زاوية حادة وكان جتا س = ٢/٣ فإن ظا س تساوي:","o":["٢/√٥","√٥/٢","√٥/٣","٣/٢"],"a":1},{"l":2,"k":"p","q":"أضلاع مثلث قائم الزاوية ٧ سم و٢٤ سم و٢٥ سم. ظل أصغر زواياه الحادة يساوي:","o":["٢٤/٧","٧/٢٥","٢٤/٢٥","٧/٢٤"],"a":3},{"l":2,"k":"p","q":"يستند رأس سلّم إلى حائط على ارتفاع ١٢ م وتبعد قاعدته ٥ م عن الحائط. جيب زاوية ميل السلّم مع الأرض يساوي:","o":["٥/١٣","١٢/١٣","١٢/٥","٥/١٢"],"a":1},{"l":2,"k":"p","q":"إذا كان جا س = ٠٫٦ وكانت س زاوية حادة فإن قياسها بالآلة الحاسبة يساوي تقريباً:","o":["٥٣٫١°","٣٠°","٣٦٫٩°","٦٠°"],"a":2}],"hints":{"في مثلث قائم الزاوية طول الضلع المقابل للزاوية أ يساوي ٥ سم والوتر ١٣ سم، فإن جا أ تساوي:":"جا أ هي المقابل ÷ الوتر؛ عوّض الطولين المعطيين مباشرة.","في مثلث قائم جتا س = ٣/٥ والوتر ١٠ سم، فإن طول الضلع المجاور للزاوية س يساوي:":"جتا س = المجاور ÷ الوتر؛ اضرب الكسر في طول الوتر لتجد المجاور.","أ ب جـ مثلث قائم في ب، جا أ = ٥/١٣ وطول ب جـ = ١٠ سم. قيمة ظا جـ تساوي:":"ب جـ هو المقابل للزاوية أ؛ أوجد الوتر من النسبة ثم أ ب بفيثاغورس، وانتبه إلى أن أ ب هو المقابل للزاوية جـ.","إذا كانت س زاوية حادة وكان جتا س = ٢/٣ فإن ظا س تساوي:":"ارسم مثلثاً مجاوره ٢ ووتره ٣ ثم أوجد المقابل بنظرية فيثاغورس."}},{"t":"النسب المثلثية الثانوية","e":["# نشاط تمهيدي: النخلة المنكسرة","تتعرض بعض أشجار النخيل في فلسطين للكسر. إذا انكسرت نخلة طولها قبل السقوط ٢٠ م وكان طول الجزء المائل منها على الأرض ١٣ م، فهل يمكن معرفة الزاوية س التي يصنعها هذا الجزء مع سطح الأرض؟","الجزء القائم المتبقي = ٢٠ − ١٣ = ٧ م وهو المقابل للزاوية س، والجزء المائل ١٣ م هو الوتر، فيكون جا س = ٧/١٣ وتساوي الزاوية س ≈ ٣٢٫٦° (sin⁻¹ ٧/١٣ بالآلة الحاسبة). ويمكن إيجاد س بنسب مثلثية أخرى أيضاً.","# اكتشاف النسب الثانوية","س ص ع مثلث متساوي الساقين فيه س ص = س ع = ١٧ وحدة و ص ع = ١٦ وحدة. نرسم العمود س د على ص ع فينصفه: ص د = ٨، وطول س د = √(٢٨٩ − ٦٤) = √٢٢٥ = ١٥ وحدة (نظرية فيثاغورس).","عندئذ: جا ص = س د/س ص = ١٥/١٧ ، جتا ص = ص د/س ص = ٨/١٧ ، ظا ص = س د/ص د = ١٥/٨.","وبقلب هذه النسب نحصل على: س ص/س د = ١٧/١٥ = ١/جا ص ، س ص/ص د = ١٧/٨ = ١/جتا ص ، ص د/س د = ٨/١٥ = ١/ظا ص.","# التعريف: النسب المثلثية الثانوية","النسب المثلثية الناتجة عن مقلوب النسب المثلثية الأساسية تُسمّى النسب المثلثية الثانوية.","|النسبة|الرمز|القاعدة","|قاطع الزاوية س|قا س|١/جتا س = الوتر ÷ المجاور","|قاطع تمام الزاوية س|قتا س|١/جا س = الوتر ÷ المقابل","|ظل تمام الزاوية س|ظتا س|١/ظا س = المجاور ÷ المقابل","! ألاحظ أن النسبة المثلثية × مقلوبها = ١، أي: جا س × قتا س = ١ ، جتا س × قا س = ١ ، ظا س × ظتا س = ١.","# العلاقة بين نسب الزاوية ومتمّمتها","في المثلث أ ب جـ القائم في ب لدينا: الزاوية أ + الزاوية جـ = ٩٠°، أي أن جـ = ٩٠° − أ، فكل زاوية هي متمّمة الأخرى. وبمقارنة النسب نجد أن مقابل أ هو مجاور جـ والعكس.","- جا أ = جتا (٩٠° − أ)، والعكس صحيح: جا الزاوية = جتا المتمّمة.","- ظا أ = ظتا (٩٠° − أ)، والعكس صحيح: ظل الزاوية = ظتا المتمّمة.","- قا أ = قتا (٩٠° − أ)، والعكس صحيح: قا الزاوية = قتا المتمّمة.","|الزاوية أ|متمّمتها ٩٠° − أ|مثال","|جا ٣٠°|جتا ٦٠°|كلاهما ١/٢","|ظا ٧٠°|ظتا ٢٠°|كلاهما ظا ٧٠° نفسها","|قا ٣٥°|قتا ٥٥°|كلاهما ١/جتا ٣٥°","# أمثلة محلولة","? أ ب جـ مثلث قائم في ب، أ ب = ٧ سم، أ جـ = ٨ سم. أجد قا أ، قتا أ، ظتا أ. || ب جـ = √(٦٤ − ٤٩) = √١٥ سم. قا أ = الوتر/المجاور = ٨/٧. قتا أ = الوتر/المقابل = ٨/√١٥. ظتا أ = المجاور/المقابل = ٧/√١٥.","? في المثلث السابق أجد جا أ × قتا أ وجتا أ × قا أ. || جا أ = √١٥/٨ و قتا أ = ٨/√١٥ فحاصل ضربهما = ١. وجتا أ = ٧/٨ و قا أ = ٨/٧ فحاصل ضربهما = ١.","? مخزن حبوب أسطواني يعلوه غطاء مخروطي، نصف قطر قاعدته ١٤ م، ونصف قطر الغطاء يزيد متراً واحداً (أي ١٥ م). أجد طول راسم الغطاء س إذا كان قياس زاوية ميل الراسم مع الأفقي ٣٠°. || قا ٣٠° = س/١٥ وقا ٣٠° = ١/جتا ٣٠° = ٢/√٣. فيكون س = ١٥ × ٢/√٣ = ٣٠/√٣ = ١٠√٣ ≈ ١٧٫٣ م.","? أ ج هـ مثلث قائم في جـ، جتا هـ = ١/٥ و أ هـ = ١٠ وحدات. أجد قيم النسب المثلثية الأخرى للزاوية هـ. || جتا هـ = جـ هـ/أ هـ = ١/٥ فتكون جـ هـ = ٢. أ جـ = √(١٠٠ − ٤) = √٩٦ = ٤√٦. جا هـ = أ جـ/١٠ = √٩٦/١٠ = √٢٤/٥، ظا هـ = √٩٦/٢ = √٢٤، قا هـ = ٥، قتا هـ = ١٠/√٩٦ = ٥/√٢٤، ظتا هـ = ١/√٢٤.","? بالمعطيات السابقة أجد قيمة المقدار قتا(٩٠° − هـ) × قا(٩٠° − هـ) ÷ ظتا هـ. || قتا(٩٠° − هـ) = قا هـ = ٥ و قا(٩٠° − هـ) = قتا هـ = ٥/√٢٤. البسط = ٥ × ٥/√٢٤ = ٢٥/√٢٤. نقسم على ظتا هـ = ١/√٢٤: ٢٥/√٢٤ × √٢٤ = ٢٥.","? س ص ع مثلث قائم في ص، س ص = ص ع = ٥ سم. أجد جتا ع، ظا ع، قا ع، قتا ع. || المثلث قائم متساوي الساقين فالزاوية ع = ٤٥° والوتر س ع = ٥√٢. جتا ع = ٥/(٥√٢) = ١/√٢ = √٢/٢، ظا ع = ١، قا ع = √٢، قتا ع = √٢.","? أ جـ هـ مثلث قائم في جـ، جتا (٩٠° − هـ) = ٢/٣، أ هـ = ٣ وحدات. أجد جا هـ، ظا هـ، ظتا (٩٠° − هـ). || جا هـ = جتا (٩٠° − هـ) = ٢/٣. المقابل ٢ والوتر ٣ فالمجاور = √(٩ − ٤) = √٥. ظا هـ = ٢/√٥، وظتا (٩٠° − هـ) = ظا هـ = ٢/√٥.","# أخطاء شائعة","! الخطأ: الخلط بين مقلوب النسبة ونسبة متمّمتها؛ فقا س هي ١/جتا س وليست ١/جا س.","! الخطأ: كتابة ظتا س = ١/جا س؛ والصواب ظتا س = ١/ظا س = جتا س/جا س.","! الخطأ: كتابة جا أ = جتا (٩٠° + أ)؛ والمتمّمة تكون ٩٠° − أ فقط."],"q":["- س ص ع مثلث قائم الزاوية في ص، س ص = ص ع = ٥ سم. أجد كلاً من: جتا ع، ظا ع، قا ع، قتا ع.","- أ جـ هـ مثلث قائم الزاوية في جـ، جتا (٩٠° − هـ) = ٢/٣، أ هـ = ٣ وحدات. أجد: جا هـ، ظا هـ، ظتا (٩٠° − هـ).","- أ ب جـ مثلث قائم في ب، أ ب = ٧ سم، أ جـ = ٨ سم. أجد قا أ وقتا أ وظتا أ، ثم أتحقق أن جا أ × قتا أ = ١.","- أذكر العلاقة بين النسب المثلثية للزاوية أ ومتمّمتها (٩٠° − أ) لكل من الجيب والظل والقاطع."],"quiz":[{"l":0,"k":"n","q":"قاطع الزاوية س (قا س) يساوي:","o":["١/جتا س (الوتر ÷ المجاور)","١/جا س","١/ظا س","جا س/جتا س"],"a":0},{"l":0,"k":"n","q":"قاطع تمام الزاوية س (قتا س) يساوي:","o":["١/جتا س","١/جا س (الوتر ÷ المقابل)","١/ظا س","جتا س/جا س"],"a":1},{"l":0,"k":"n","q":"قيمة قا ٦٠° تساوي:","o":["١/٢","√٣","٢","٢/√٣"],"a":2},{"l":0,"k":"n","q":"جا س × قتا س تساوي دائماً:","o":["٠","جتا س","١","ظا س"],"a":2},{"l":0,"k":"n","q":"إذا كانت أ زاوية حادة فإن جا أ تساوي:","o":["جتا (٩٠° + أ)","جتا (٩٠° − أ)","جتا (١٨٠° − أ)","جتا أ"],"a":1},{"l":0,"k":"n","q":"إذا كانت أ زاوية حادة فإن قا أ تساو ,"|أقل من|<|فقر الدم: س < ١٣","- في مسألة الخلاط، الزمن الإضافي الممكن م يحقق م + ٣٥ ≤ ٦٠ أي م ≤ ٢٥ ثانية.","# مقارنة الأعداد وخصائص المتباينات","تعريف: العدد الحقيقي أ أكبر من العدد الحقيقي ب (أ > ب) إذا كان أ − ب عدداً موجباً، أي أ − ب > ٠.","ليكن أ، ب، جـ أعداداً حقيقية وأ > ب، فإن:","- أ + جـ > ب + جـ (الجمع أو الطرح من الطرفين لا يغيّر الإشارة).","- إذا كان جـ موجباً فإن أ جـ > ب جـ و أ/جـ > ب/جـ (لا تتغيّر الإشارة).","- إذا كان جـ سالباً فإن أ جـ < ب جـ و أ/جـ < ب/جـ (تنعكس الإشارة).","- هذه الخصائص صحيحة أيضاً إذا كانت الإشارة ≥.","|الحالة|المتباينة الأصلية|بعد العملية","|جمع ٣ للطرفين|٥ < ١٢|٨ < ١٥ (تبقى)","|ضرب في ٣ (موجب)|٥ < ١٢|١٥ < ٣٦ (تبقى)","|ضرب في −٢ (سالب)|٥ < ١٢|−١٠ > −٢٤ (تنعكس)","|قسمة على −٦ (سالب)|−٢٤ < ٣٦|٤ > −٦ (تنعكس)","# حل المتباينة","حل المتباينة: إيجاد قيمة أو قيم المتغير التي تجعل المتباينة صحيحة عند تعويضها فيها، ومجموعة هذه القيم تُسمّى مجموعة حل المتباينة. نحلّها بخطوات تشبه حل المعادلة، مع قلب الإشارة عند الضرب أو القسمة في عدد سالب.","! الخطأ الشائع: نسيان قلب إشارة المتباينة عند الضرب أو القسمة على عدد سالب (مثلاً −٢س > ٦ تعطي س < −٣ وليس س > −٣).","# المتباينة المركبة","إذا ظهر المتغير بين متباينتين مثل أ < س ≤ ب فإننا نحلّ كلاً من المتباينتين، ومجموعة الحل هي تقاطع مجموعتي الحل.","# أمثلة محلولة","? أجد مجموعة حل المتباينة ٢س − ٢ ≥ ٢٠ في ح وأمثّلها على خط الأعداد. || نضيف ٢ للطرفين: ٢س ≥ ٢٢. نقسم على ٢ (موجب): س ≥ ١١. مجموعة الحل = ⁦[١١ ، ∞[⁩. نمثّلها بدائرة مغلقة عند ١١ وسهم نحو اليمين.","? أجد مجموعة حل المتباينة ٣س + ٥ ≤ ٢٠. || نطرح ٥: ٣س ≤ ١٥. نقسم على ٣: س ≤ ٥. مجموعة الحل = ⁦]−∞ ، ٥]⁩.","? أجد مجموعة حل المتباينة −٤س + ٣ < ١١. || نطرح ٣: −٤س < ٨. نقسم على −٤ (سالب) فتنعكس الإشارة: س > −٢. مجموعة الحل = ⁦]−٢ ، ∞[⁩.","? أجد مجموعة حل المتباينة ٥س − ٧ ≥ ٢س + ٨. || نطرح ٢س من الطرفين: ٣س − ٧ ≥ ٨. نضيف ٧: ٣س ≥ ١٥. فتكون س ≥ ٥. مجموعة الحل = ⁦[٥ ، ∞[⁩.","? أحلّ المتباينة ٢(ص + ٥) − ص > ٥. || نفتح القوس: ٢ص + ١٠ − ص > ٥ أي ص + ١٠ > ٥. نطرح ١٠: ص > −٥. مجموعة الحل = ⁦]−٥ ، ∞[⁩.","? حلّت إشراق وندى المتباينة ٢س + ٣ > ٤س + ٩. أجد ال ١ ديناراً، وهو أكبر من ٣٠، فلا تستطيع سميرة شراءهما.","- شراء ٣ كغم دجاج و٣ كغم جبنة يكلّف ١٢ + ١٥ = ٢٧ ديناراً وهو أقل من ٣٠، فتستطيع شراءهما.","# التعريف: المتباينة الخطية بمتغيرين","المتباينة الخطية بمتغيرين: عبارة رياضية فيها متغيران وإحدى الإشارات <، >، ≤، ≥، وتُكتب بإحدى الصور: أس + بص + جـ < ٠، أس + بص + جـ > ٠، أس + بص + جـ ≤ ٠، أس + بص + جـ ≥ ٠، حيث أ، ب، جـ أعداد حقيقية وأ، ب ≠ ٠.","! في أمثلة الكتاب تظهر أيضاً متباينات بسيطة مثل س ≤ ٣ و ص > −١ (يُهمل فيها أحد المتغيرين)، وتُمثَّل بالطريقة نفسها.","نظام المتباينات: أيّ مجموعة من المتباينات. ومنطقة حلّ النظام هي المنطقة التي تحقق جميع المتباينات فيه معاً.","# خطوات تمثيل متباينة في المستوى الديكارتي","- ١) نرسم المستقيم الحدودي بعد استبدال إشارة المتباينة بإشارة =.","- ٢) نحدد نوع المستقيم: متصل إذا كانت الإشارة ≤ أو ≥ (نقاطه من الحل)، ومتقطع إذا كانت < أو > (نقاطه ليست من الحل).","- ٣) نختار نقطة اختبار لا تقع على المستقيم، وأسهلها (٠ ، ٠)، ونعوّض إحداثييها في المتباينة.","- ٤) إذا تحققت المتباينة ظلّلنا الجهة التي فيها نقطة الاختبار، وإلا ظلّلنا الجهة الأخرى.","|الإشارة|المستقيم الحدودي|هل نقاط المستقيم من الحل؟","|≤ أو ≥|متصل|نعم","|< أو >|متقطع|لا","! الخطأ الشائع: رسم المستقيم متصلاً مع الإشارة < أو >، أو تظليل الجهة من غير اختبار نقطة.","# أمثلة محلولة","? أمثّل مجموعة حل المتباينة س ≤ ٣ في المستوى الديكارتي، وأبيّن هل النقطة (٥ ، ١) من الحل. || المستقيم الحدودي س = ٣ مستقيم عمودي (يوازي محور الصادات). الإشارة ≤ فيُرسم متصلاً. نختبر (٠ ، ٠): ٠ ≤ ٣ صحيحة، فنظلل الجهة التي فيها نقطة الأصل (يسار المستقيم). النقطة (٥ ، ١): ٥ ≤ ٣ خطأ، فهي خارج منطقة الحل.","? أمثّل مجموعة حل المتباينة ص > −١. || المستقيم الحدودي ص = −١ مستقيم أفقي. الإشارة > فيُرسم متقطعاً. نختبر (٠ ، ٠): ٠ > −١ صحيحة، فنظلل المنطقة التي فوق المستقيم (دون المستقيم نفسه).","? أمثّل مجموعة حل المتباينة ٢س + ٣ص ≤ ١٢. || نرسم ٢س + ٣ص = ١٢: إذا كانت س = ٠ فإن ص = ٤، وإذا كانت ص = ٠ فإن س = ٦، فنصل النقطتين (٠ ، ٤) و(٦ ، ٠) بمستقيم متصل. نختبر (٠ ، ٠): ٠ ≤ ١٢ صحيحة، فنظلل الجهة التي فيها نقطة الأصل. النقطة (١ ، ٢): ٢ + ٦ = ٨ ≤ ١٢ فهي من الحل، والنقطة (٤ ، ٣): ٨ + ٩ = ١٧ > ١٢ فليست منه.","? أمثّل مجموعة حل المتباينة س + ٢ص < ٤. || نرسم س + ٢ص = ٤ بالنقطتين (٤ ، ٠) و(٠ ، ٢)، والمستقيم متقطع لأن الإشارة <. نختبر (١ ، ٠): ١ + ٠ = ١ < ٤ صحيحة، فنظلل الجهة التي فيها هذه النقطة (الجهة السفلية من المستقيم، وفيها نقطة الأصل).","? أمثّل مجموعة حل المتباينة ص > ٢س. || المستقيم ص = ٢س يمر بنقطة الأصل، فلا نستعملها نقطةَ اختبار. نختار (١ ، ٠): ٠ > ٢ خطأ، فنظلل الجهة الأخرى، أي المنطقة التي فوق المستقيم المتقطع.","? أجد منطقة حل النظام: س + ٢ص < ٤ ، س ≤ ١ ، ص ≥ −١. || نمثّل كل متباينة وحدها: ١) س + ٢ص < ٤: مستقيم متقطع ونظلل الجهة السفلية. ٢) س ≤ ١: مستقيم عمودي متصل ونظلل يساره. ٣) ص ≥ −١: مستقيم أفقي متصل ونظلل ما فوقه. منطقة الحل هي الجزء المشترك بين التظليلات الثلاثة. النقطة (٠ ، ٠) تحققها كلها فهي من الحل، والنقطة (١ ، −١) من الحل أيضاً لأن المستقيمين المتصلين يشملان نقاطهما، أما (٢ ، ٠) فلا لأن ٢ ≤ ١ خطأ.","? يشتري أحمد دفاتر عددها س بدينارين للدفتر وأقلاماً عددها ص بدينار للقلم، ومعه ١٠ دنانير على الأكثر. أكتب النظام الذي يعبّر عن ذلك. || المبلغ المدفوع ٢س + ص لا يزيد عن ١٠: ٢س + ص ≤ ١٠، والعددان غير سالبين: س ≥ ٠، ص ≥ ٠. منطقة الحل مثلث رؤوسه (٠ ، ٠) و(٥ ، ٠) و(٠ ، ١٠).","? أكتب نظام المتباينات الذي تمثّل منطقة حلّه الجهة التي يمين المستقيم س = ٢ (دون المستقيم) وتحت المستقيم ص = −٣ (مع المستقيم). || يمين المستقيم س = ٢ تعني س > ٢، والمستقيم متقطع. وتحت المستقيم ص = −٣ مع المستقيم تعني ص ≤ −٣ بمستقيم متصل. النظام: س > ٢ ، ص ≤ −٣.","# تدرّب","? أيّ النقطتين (٢ ، ١) و(٤ ، ٣) تنتمي إلى منطقة حل المتباينة ٣س − ٢ص ≥ ٦؟ || (٢ ، ١): ٦ − ٢ = ٤ ≥ ٦ خطأ. (٤ ، ٣): ١٢ − ٦ = ٦ ≥ ٦ صحيحة، لأن الإشارة ≥ تشمل المساواة. إذن النقطة (٤ ، ٣) هي التي تنتمي إلى الحل (وهي على المستقيم الحدودي المتصل)."],"q":["- ما الفرق بين رسم المستقيم الحدودي في المتباينة س + ٢ص < ٤ ورسمه في المتباينة س + ٢ص ≤ ٤؟","- أمثّل بيانياً مجموعة حل المتباينة ص ≥ −٢، ثم أبيّن هل النقطة (٣ ، −٥) من الحل.","- أمثّل بيانياً مجموعة حل المتباينة ٣س − ٢ص > ٦ مستعملاً نقطة اختبار مناسبة.","- أجد بالرسم في المستوى الديكارتي منطقة حل النظام: ص ≥ −٢ ، ص ≤ ٣ − س.","- رصد تاجر ٦٠ ديناراً لشراء نوعين من الزيت سعر الأول ٦ دنانير للتر وسعر الثاني ٨ دنانير للتر. أكتب المتباينة التي تعبّر عن ذلك مع شرطي عدم سالبية الكميتين."],"quiz":[{"l":0,"k":"n","q":"المتباينة الخطية بمتغيرين هي عبارة رياضية:","o":["فيها متغير واحد فقط وإشارة =","فيها متغيران وإحدى الإشارات <، >، ≤، ≥","فيها متغيران وإشارة = فقط","فيها ثلاثة متغيرات على الأقل"],"a":1},{"l":0,"k":"n","q":"المستقيم الحدودي للمتباينة ٢س + ص ≤ ٥ هو:","o":["٢س + ص ≥ ٥","ص = ٥","٢س + ص = ٥","٢س = ٥ − ص²"],"a":2},{"l":0,"k":"n","q":"نرسم المستقيم الحدودي متقطعاً عندما تكون إشارة المتباينة:","o":["< أو >","≤ أو ≥","= فقط","≤ فقط"],"a":0},{"l":0,"k":"n","q":"نرسم المستقيم الحدودي متصلاً عندما تكون إشارة المتباينة:","o":["< أو >","< فقط","> فقط","≤ أو ≥"],"a":3},{"l":0,"k":"n","q":"نختار نقطة الاختبار لتحديد منطقة الحل بحيث:","o":["تقع على المستقيم الحدودي","لا تقع على المستقيم الحدودي","تكون دائماً (١ ، ١)","تكون دائماً على محور السينات"],"a":1},{"l":0,"k":"n","q":"منطقة حل نظام من المتباينات هي المنطقة التي:","o":["تحقق متباينة واحدة فقط منها","تحقق أي متباينة منها","تحقق جميع المتباينات في النظام","لا تحقق أي متباينة منها"],"a":2},{"l":0,"k":"n","q":"المستقيم س = ٣ في المستوى الديكارتي مستقيم:","o":["عمودي يوازي محور الصادات","أفقي يوازي محور السينات","يمر بنقطة الأصل","يصنع زاوية ٤٥° مع المحورين"],"a":0},{"l":0,"k":"n","q":"المستقيم ص = −١ في المستوى الديكارتي مستقيم:","o":["عمودي يوازي محور الصادات","يمر بنقطة الأصل","يقطع محور السينات عند (−١ ، ٠)","أفقي يوازي محور السينات"],"a":3},{"l":1,"k":"p","q":"أيّ النقاط الآتية تقع ضمن منطقة حل المتباينة ٢س + ٣ص ≤ ١٢؟","o":["(٣ ، ٤)","(١ ، ٢)","(٦ ، ٢)","(٥ ، ٣)"],"a":1},{"l":1,"k":"p","q":"أيّ النقاط الآتية تقع ضمن منطقة حل المتباينة س ≤ ٣؟","o":["(٣ ، ٧)","(٥ ، ١)","(٤ ، ٠)","(٦ ، −٢)"],"a":0},{"l":1,"k":"p","q":"أيّ النقاط الآتية تحقق المتباينة س + ٢ص < ٤؟","o":["(٠ ، ٢)","(٢ ، ١)","(٤ ، ٠)","(١ ، ٠)"],"a":3},{"l":1,"k":"p","q":"عند تمثيل ص > −١ بيانياً نرسم المستقيم ص = −١ ونظلل:","o":["منطقة فوق المستقيم والمستقيم متصل","منطقة تحت المستقيم والمستقيم متقطع","منطقة فوق المستقيم والمستقيم متقطع","منطقة تحت المستقيم والمستقيم متصل"],"a":2},{"l":1,"k":"p","q":"عند تمثيل ٣س − ٢ص ≥ ٦ نجد أن نقطة الأصل (٠ ، ٠):","o":["تحقق المتباينة فنظلل الجهة التي تحويها","لا تحقق المتباينة فنظلل الجهة التي لا تحويها","تقع على المستقيم الحدودي","تحقق المتباينة والمستقيم متقطع"],"a":1},{"l":1,"k":"p","q":"يقطع المستقيم ٢س + ٣ص = ١٢ محور السينات عند النقطة:","o":["(٦ ، ٠)","(٠ ، ٦)","(٤ ، ٠)","(١٢ ، ٠)"],"a":0},{"l":1,"k":"p","q":"ترصد سميرة ٣٠ ديناراً لشراء دجاج (٤ دنانير للكغم) وجبنة (٥ دنانير للكغم). أيّ الشراءات الآتية (س كغم دجاج ، ص كغم جبنة) ممكن؟","o":["(٤ ، ٣)","(٣ ، ٤)","(١ ، ٦)","(٢ ، ٤)"],"a":3},{"l":1,"k":"p","q":"النقطة (١ ، ٢) تحقق نظام المتباينات:","o":["س > ١ ، ص > ٠","س + ص < ٣ ، ص > ٠","س ≥ ١ ، ص ≤ ٢","س ≤ ٠ ، ص ≥ ٢"],"a":2},{"l":2,"k":"p","q":"أيّ النقاط الآتية تنتمي إلى منطقة حل النظام: س + ٢ص < ٤ ، س ≤ ١ ، ص ≥ −١؟","o":["(١ ، −١)","(٢ ، ٠)","(٠ ، ٢)","(−٢ ، −٢)"],"a":0},{"l":2,"k":"p","q":"كم نقطة إحداثياها عددان صحيحان غير سالبين تحقق س + ص ≤ ٢؟","o":["٣","٤","٥","٦"],"a":3},{"l":2,"k":"p","q":"مساحة منطقة حل النظام: س ≥ ٠ ، ص ≥ ٠ ، ٢س + ص ≤ ١٠ هي:","o":["٥٠ وحدة مربعة","٢٥ وحدة مربعة","١٥ وحدة مربعة","١٠ وحدات مربعة"],"a":1},{"l":2,"k":"p","q":"يشتري أحمد دفاتر (س) ثمن الدفتر دينارين، وأقلاماً (ص) ثمن القلم دينار، ومعه ١٠ دنانير على الأكثر. المتباينة التي تعبّر عن ذلك هي:","o":["٢س + ص ≥ ١٠","س + ٢ص ≤ ١٠","٢س + ص ≤ ١٠","٢س + ص < ٢"],"a":2},{"l":2,"k":"p","q":"عند تمثيل ص ≥ ٢س لا نختار نقطة الأصل (٠ ، ٠) نقطةَ اختبار لأنها:","o":["تقع على المستقيم ص = ٢س","تحقق المتباينة دائماً","لا تحقق أي متباينة","تقع على المستقيم ص = ٠ فقط"],"a":0},{"l":2,"k":"p","q":"النظام الذي يمثل المنطقة: «يمين المستقيم س = ٢ (دون المستقيم نفسه) وتحت المستقيم ص = −٣ (مع المستقيم نفسه)» هو:","o":["س < ٢ ، ص ≤ −٣","س > ٢ ، ص ≥ −٣","س ≥ ٢ ، ص < −٣","س > ٢ ، ص ≤ −٣"],"a":3},{"l":2,"k":"p","q":"النقطة (أ ، ٣) تحقق المتباينة ٢س − ص ≥ ٥. أصغر قيمة صحيحة للعدد أ هي:","o":["٣","٤","٥","٢"],"a":1},{"l":2,"k":"p","q":"يشتري سليم س كغم تفاح (٣ دنانير للكغم) وص كغم برتقال (دينارين للكغم) بمبلغ لا يزيد عن ١٨ ديناراً. أيّ الشراءات (س ، ص) الآتية ممكن؟","o":["(٢ ، ٥)","(٤ ، ٤)","(٥ ، ٢)","(٣ ، ٥)"],"a":0}],"hints":{"المستقيم الحدودي للمتباينة ٢س + ص ≤ ٥ هو:":"المستقيم الحدودي هو الحدّ الفاصل بين المنطقتين؛ استبدل إشارة المتباينة بإشارة المساواة.","أيّ النقاط الآتية تحقق المتباينة س + ٢ص < ٤؟":"عوّض إحداثيي كل نقطة في المتباينة، وانتبه: الإشارة < لا تقبل المساواة.","عند تمثيل ٣س − ٢ص ≥ ٦ نجد أن نقطة الأصل (٠ ، ٠):":"عوّض س = ٠ و ص = ٠ في الطرف الأيسر واسأل: هل ٠ ≥ ٦ صحيحة؟","كم نقطة إحداثياها عددان صحيحان غير سالبين تحقق س + ص ≤ ٢؟":"عدّ النقاط حسب قيمة ص: ص = ٠ ثم ١ ثم ٢، وانظر كم قيمة لـ س تناسب كل حالة.","مساحة منطقة حل النظام: س ≥ ٠ ، ص ≥ ٠ ، ٢س + ص ≤ ١٠ هي:":"ابحث عن نقطتي تقاطع المستقيم ٢س + ص = ١٠ مع المحورين؛ المنطقة مثلث قائم.","النقطة (أ ، ٣) تحقق المتباينة ٢س − ص ≥ ٥. أصغر قيمة صحيحة للعدد أ هي:":"عوّض ص = ٣ ثم حلّ المتباينة ٢أ − ٣ ≥ ٥ بالنسبة إلى أ."}},{"t":"كثيرات الحدود","e":["# نشاط تمهيدي: حركات الصرّاف الآلي","يحتوي الصرّاف الآلي صناديق من فئات العملات المتداولة. إذا كانت س = ١٠ فيمكن التعبير عن الحركات ١٠ ، ٨٠ ، ١٠٠ ، ٣٠٠ بالمقادير الجبرية: س ، ٨س ، س² ، ٣س² على التوالي.","مجموع الحركات بالرموز: س + ٨س + س² + ٣س² = ٤س² + ٩س. وعند س = ١٠ يكون المجموع ٤٠٠ + ٩٠ = ٤٩٠، وهو مجموع ١٠ + ٨٠ + ١٠٠ + ٣٠٠ فعلاً.","# التعريف: الاقتران كثير الحدود","الاقتران كثير الحدود على ح: اقتران معرَّف على ح، ويتكوّن من حدٍّ أو مجموع حدود جبرية عدّة، وتكون فيه أسس المتغير أعداداً صحيحة غير سالبة.","يُعبَّر عنه بالصورة: ق(س) = أₙسⁿ + أₙ₋₁سⁿ⁻¹ + … + أ₂س² + أ₁س + أ₀، حيث أ₀ ، أ₁ ، … ، أₙ أعداد حقيقية تُسمّى معاملات كثير الحدود، وn عدد صحيح غير سالب.","- درجة كثير الحدود: أكبر أسّ للمتغير فيه (مهما كان ترتيب الحدود).","- معامل الحدّ: العدد الذي يضرب المتغير، مثل −٦ في الحدّ −٦س².","! تذكّر: ق(س) = ٣ اقتران ثابت وهو كثير حدود من الدرجة الصفرية لأنه يمكن كتابته ٣س⁰.","|الدرجة|الاسم|مثال","|صفر|ثابت|ق(س) = ٣","|١|خطّي|ق(س) = ٤س + ١","|٢|تربيعي|ق(س) = ٣س² + ٥س − ٤","|٣|تكعيبي|ق(س) = ٢س³ − ٤س","# تساوي كثيري حدود","يتساوى كثيرا الحدود إذا كان لهما الدرجة نفسها، وكانت معاملات قوى س المتناظرة متساوية.","! الأسّ الكسري أو السالب يُخرج الاقتران من كثيرات الحدود: ٣/س = ٣س⁻¹ و √س = س^(١/٢) ليسا كثيري حدود.","# صفر الاقتران","إذا كان ق(س) اقتراناً وكان ق(م) = ٠ فإن العدد م يُسمّى صفراً للاقتران ق(س). لإيجاد الأصفار نحلّ المعادلة ق(س) = ٠.","# أمثلة محلولة","? أبيّن هل ق(س) = ٢س⁵ − ١٥س + ٩ كثير حدود، وأكتب درجته. || نعم؛ أسس المتغير (٥ و١ و٠) أعداد صحيحة غير سالبة. أكبر أسّ ٥، فهو كثير حدود من الدرجة الخامسة.","? أبيّن هل ق(س) = ٦س − ∛س كثير حدود. || ∛س = س^(١/٣) وأسّها ١/٣ ليس عدداً صحيحاً، فالاقتران ليس كثير حدود.","? أبيّن هل ق(س) = س² − ٥س³ − ٧ + ٣س⁴ − ٢س كثير حدود، وأكتب درجته. || نعم؛ كل الأسس صحيحة غير سالبة (٢ ، ٣ ، ٠ ، ٤ ، ١). أكبر أسّ ٤ فالدرجة الرابعة، حتى لو لم تكن الحدود مرتبة.","? أبيّن هل ق(س) = س + ٥/س⁻⁴ كثير حدود. || ٥/س⁻⁴ = ٥س⁴، فيكون ق(س) = س + ٥س⁴، وهو كثير حدود من الدرجة الرابعة.","? أبيّن هل ق(س) = ٥س + ٢/س كثير حدود. || ٢/س = ٢س⁻¹ وأسّها سالب، فالاقتران ليس كثير حدود.","? إذا كان ق(س) = ٣س² + بس + جـ ، هـ(س) = أس² + ٣س + ٥ وكان ق(س) = هـ(س)، أجد أ ، ب ، جـ. || بمساواة المعاملات المتناظرة: معامل س²: أ = ٣، معامل س: ب = ٣، الحدّ الثابت: جـ = ٥.","? إذا كان ق(س) = (أ − ٣)س² + ٢س + (جـ + ١) ، ك(س) = ٤س² + بس + ٧ وكان ق(س) = ك(س)، أجد أ ، ب ، جـ. || أ − ٣ = ٤ فتكون أ = ٧. ب = ٢. جـ + ١ = ٧ فتكون جـ = ٦.","? أجد صفر الاقتران ق(س) = ٢س + ٤. || نضع ق(س) = ٠: ٢س + ٤ = ٠، ٢س = −٤، س = −٢. التحقق: ق(−٢) = −٤ + ٤ = ٠ ✓. إذن الصفر هو −٢.","? أجد صفر الاقتران ق(س) = ٣ − ٧س. || ٣ − ٧س = ٠ فـ ٧س = ٣ ومنها س = ٣/٧.","? أجد أصفار الاقتران ق(س) = س² + ٥س − ١٤. || نحلّل: س² + ٥س − ١٤ = (س + ٧)(س − ٢) = ٠، فيكون س = −٧ أو س = ٢. التحقق: ق(٢) = ٤ + ١٠ − ١٤ = ٠ ✓ وق(−٧) = ٤٩ − ٣٥ − ١٤ = ٠ ✓.","? أجد أصفار الاقتران ق(س) = س² − ٤. || س² − ٤ = ٠ فـ س² = ٤، ومنها س = ٢ أو س = −٢.","# تدرّب","? أبيّن هل ق(س) = ٣س² + ٢س − √٥ كثير حدود، وأكتب درجته. || الأسس ٢ و١ و٠ صحيحة غير سالبة، و√٥ عدد حقيقي (حدّ ثابت)، فهو كثير حدود من الدرجة الثانية."],"q":["- أبيّن أيّ الاقترانات الآتية تمثّل كثير حدود، ثم أكتب درجته: (أ) ق(س) = ٢س² − ٥س + ١ (ب) ق(س) = س² − ٥س³ − ٧ + ٣س⁴ − ٢س.","- أجد أصفار الاقترانات: (أ) ق(س) = ٣ − ٧س (ب) ق(س) = س² + ٥س − ١٤ (جـ) ق(س) = س² − ٤.","- هل ق(س) = س + ٥/س⁻⁴ كثير حدود؟ ولماذا؟","- ما شرط تساوي كثيري حدود؟ وأجد قيم أ ، ب ، جـ إذا كان ٣س² + بس + جـ = أس² + ٣س + ٥."],"quiz":[{"l":0,"k":"n","q":"الاقتران كثير الحدود هو اقتران تكون فيه أسس المتغير:","o":["أعداداً سالبة فقط","أعداداً كسرية فقط","أعداداً صحيحة غير سالبة","أيّ أعداد حقيقية"],"a":2},{"l":0,"k":"n","q":"درجة كثير الحدود ٣س⁵ − ٢س + ٧ هي:","o":["٥","٣","٢","٧"],"a":0},{"l":0,"k":"n","q":"معامل س² في كثير الحدود ٤س³ − ٦س² + ٧ هو:","o":["٦","٤","٢","−٦"],"a":3},{"l":0,"k":"n","q":"درجة الاقتران الثابت ق(س) = ٣ هي:","o":["١","صفر","٣","غير معرّفة"],"a":1},{"l":0,"k":"n","q":"أيّ الاقترانات الآتية يمثّل كثير حدود؟","o":["ق(س) = ٢س³ + ٥","ق(س) = ٣/س + ١","ق(س) = √س + ٢","ق(س) = س⁻² + ١"],"a":0},{"l":0,"k":"n","q":"إذا كان ق(م) = ٠ فإن العدد م يُسمّى:","o":["معاملاً للاقتران ق","درجة الاقتران ق","صفراً للاقتران ق","حداً ثابتاً في ق"],"a":2},{"l":0,"k":"n","q":"يتساوى كثيرا الحدود إذا:","o":["كانت لهما الدرجة نفسها فقط","كانت لهما الدرجة نفسها ومعاملات قوى س المتناظرة متساوية","كان لهما عدد الحدود نفسه فقط","كان مجموع معاملاتهما صفراً"],"a":1},{"l":0,"k":"n","q":"درجة كثير الحدود ق(س) = ٤س + ١ هي:","o":["٠","٢","٤","١"],"a":3},{"l":1,"k":"p","q":"درجة كثير الحدود ق(س) = س² − ٥س³ − ٧ + ٣س⁴ − ٢س هي:","o":["٢","٤","٣","٧"],"a":1},{"l":1,"k":"p","q":"أيّ الاقترانات الآتية ليس كثير حدود؟","o":["ق(س) = ٢س − ٣","ق(س) = س⁴ + س − ١","ق(س) = س + ٣/س","ق(س) = ٧"],"a":2},{"l":1,"k":"p","q":"صفر الاقتران ق(س) = ٣س − ١٢ هو:","o":["٤","−٤","١٢","٣"],"a":0},{"l":1,"k":"p","q":"أصفار الاقتران ق(س) = س² − ٩ هي:","o":["٣ و −٣","٣ فقط","٩ و −٩","٠ و ٩"],"a":0},{"l":1,"k":"p","q":"إذا كان ق(س) = س³ − ٢س + ١ فإن ق(٢) تساوي:","o":["٣","٧","٥","١٣"],"a":2},{"l":1,"k":"p","q":"إذا كان ق(س) = ٢س² + بس + جـ ، هـ(س) = أس² + ٣س + ٥ ، وكان ق(س) = هـ(س) فإن أ + ب + جـ تساوي:","o":["٨","١٠","٧","١٢"],"a":1},{"l":1,"k":"p","q":"إذا كان ق(س) = ٣س² + ٢س فما قيمة ق(١٠)؟","o":["٣٠٢","٥٠","٣٢","٣٢٠"],"a":3},{"l":1,"k":"p","q":"أيّ الاقترانات الآتية كثير حدود من الدرجة الثالثة؟","o":["ق(س) = ٢س³ − ٤س","ق(س) = ٣س² + ٥","ق(س) = س⁴ − ١","ق(س) = ٧"],"a":0},{"l":2,"k":"p","q":"ق(س) = (م − ٢)س³ + ٥س² − س. تكون درجة ق ٢ عندما تكون قيمة م:","o":["٠","٢","٥","−٢"],"a":1},{"l":2,"k":"p","q":"إذا كان العدد ٢ صفراً للاقتران ق(س) = س² + ٥س + ك فإن ك تساوي:","o":["−١٤","١٤","−٦","٦"],"a":0},{"l":2,"k":"p","q":"إذا كان ق(س) = ٢س³ + (أ − ١)س² + ٥ ، هـ(س) = ٢س³ + ٤س² + (ب + ٣) ، وكان ق(س) = هـ(س) فإن أ + ب تساوي:","o":["٥","٩","٧","٣"],"a":2},{"l":2,"k":"p","q":"أصفار الاقتران ق(س) = س² + ٥س − ١٤ هي:","o":["٢ و ٧","−٢ و ٧","−٢ و −٧","٢ و −٧"],"a":3},{"l":2,"k":"p","q":"العدد −١ صفر للاقتران:","o":["ق(س) = ٢س³ − س² + ٣","ق(س) = س² + س + ٢","ق(س) = س³ + ٢","ق(س) = ٢س − ١"],"a":0},{"l":2,"k":"p","q":"إذا كان ق(س) = س² − ٣س + ٢ فإن قيمة ق(٤) − ق(١) تساوي:","o":["٤","٦","٢","٨"],"a":1},{"l":2,"k":"p","q":"ق(س) = أس² + بس + جـ ، وكان ق(٠) = ٥ ، ق(١) = ٩ ، ق(−١) = ٣. فإن قيمة أ تساوي:","o":["٢","٣","١","−١"],"a":2},{"l":2,"k":"p","q":"مستطيل طوله (س + ٣) وعرضه (س − ١). مساحته كثير حدود درجته:","o":["صفر","١","٣","٢"],"a":3}],"hints":{"الاقتران كثير الحدود هو اقتران تكون فيه أسس المتغير:":"تذكّر: س¹ و س² و س³ … و س⁰ كلها مقبولة، فما الذي لا يُقبل من الأسس؟","أيّ الاقترانات الآتية ليس كثير حدود؟":"اكتب كل حدّ على صورة س مرفوعة إلى أسّ، وانظر هل يظهر أسّ سالب.","درجة كثير الحدود ق(س) = س² − ٥س³ − ٧ + ٣س⁴ − ٢س هي:":"الحدود غير مرتّبة؛ ابحث عن أكبر أسّ للمتغير أياً كان موضعه.","إذا كان ق(س) = ٢س² + بس + جـ ، هـ(س) = أس² + ٣س + ٥ ، وكان ق(س) = هـ(س) فإن أ + ب + جـ تساوي:":"قارن معاملات القوى المتناظرة: معامل س² مع س² ثم س مع س ثم الحدّ الثابت.","إذا كان العدد ٢ صفراً للاقتران ق(س) = س² + ٥س + ك فإن ك تساوي:":"الصفر يعني ق(٢) = ٠؛ عوّض س = ٢ وحلّ المعادلة في ك.","ق(س) = (م − ٢)س³ + ٥س² − س. تكون درجة ق ٢ عندما تكون قيمة م:":"لتكون الدرجة ٢ يجب أن يختفي حدّ س³؛ فماذا يجب أن يكون معامله؟","أصفار الاقتران ق(س) = س² + ٥س − ١٤ هي:":"حلّل المقدار إلى عاملين، أو عوّض كل قيمة معروضة في ق وتحقق من أن الناتج صفر."}},{"t":"جمع كثيرات الحدود وطرحها","e":["# نشاط تمهيدي: غرفتا اللاعبين","رسم مهندس غرفتين لملابس اللاعبين، مساحة إحداهما س² ومساحة الأخرى أربعة أضعافها أي ٤س².","- مجموع مساحتيهما = س² + ٤س² = ٥س².","- الفرق بين مساحتيهما = ٤س² − س² = ٣س².","الجمع والطرح هنا يتمّان بالحدود المتشابهة: نجمع أو نطرح المعاملات ونبقي س² كما هي.","# ضرب كثير الحدود بعدد ثابت","إذا كان ق(س) = أₙسⁿ + أₙ₋₁سⁿ⁻¹ + … + أ₂س² + أ₁س + أ₀ وكان جـ عدداً ثابتاً فإن جـ ق(س) = جـأₙسⁿ + جـأₙ₋₁سⁿ⁻¹ + … + جـأ₂س² + جـأ₁س + جـأ₀، أي نضرب كل معامل في العدد.","# أولاً: جمع كثيرات الحدود","ليكن ق(س) ، هـ(س) كثيري حدود، فإن (ق + هـ)(س) كثير حدود، بحيث: (ق + هـ)(س) = ق(س) + هـ(س).","- نكتب المقدارين ونجمع الحدود المتشابهة (التي لها القوة نفسها للمتغير).","- ناتج جمع كثيري حدود هو كثير حدود درجته أقل أو تساوي أعلى درجتي الاقترانين.","# ثانياً: طرح كثيرات الحدود","ليكن ق(س) ، هـ(س) كثيري حدود، فإن (ق − هـ)(س) كثير حدود، بحيث: (ق − هـ)(س) = ق(س) − هـ(س).","- نغيّر إشارة كل حدّ في كثير الحدود المطروح ثم نجمع الحدود المتشابهة.","! الخطأ الشائع: تغيير إشارة الحدّ الأول وحده في المطروح؛ والصواب تغيير إشارة جميع حدوده.","! درجة ناتج الطرح (كالجمع) قد تقلّ عن درجتي الاقترانين إذا اختفى الحدّ الأعلى: (س³ + ٢س) − (س³ − س) = ٣س من الدرجة الأولى.","# أمثلة محلولة","? إذا كان ق(س) = ٣س² + ٥س − ١ ، هـ(س) = ٢س² − ٢س ، أجد (ق + هـ)(س). || (ق + هـ)(س) = (٣س² + ٥س − ١) + (٢س² − ٢س). س²: ٣ + ٢ = ٥، س: ٥ − ٢ = ٣، الثابت: −١. الناتج = ٥س² + ٣س − ١ وهو من الدرجة الثانية.","? إذا كان ق(س) = ٧س² + ٥س − ١ ، هـ(س) = ٢س² − ٢س + ٧ ، أجد (ق − هـ)(س) و٣ق(س). || (ق − هـ)(س) = ٧س² + ٥س − ١ − ٢س² + ٢س − ٧ (غيّرنا إشارة كل حدود هـ). س²: ٧ − ٢ = ٥، س: ٥ + ٢ = ٧، الثابت: −١ − ٧ = −٨. الناتج = ٥س² + ٧س − ٨. أما ٣ق(س) = ٢١س² + ١٥س − ٣.","? إذا كان ق(س) = ٦س³ + ٥س² − ١ ، هـ(س) = ٣س² + س + ٤ ، ك(س) = ٢س² − ٤ ، أجد (ق + هـ)(س) و(هـ − ك)(س). || (ق + هـ)(س) = ٦س³ + (٥ + ٣)س² + س + (−١ + ٤) = ٦س³ + ٨س² + س + ٣. (هـ − ك)(س) = ٣س² + س + ٤ − ٢س² + ٤ = س² + س + ٨.","? في المثال السابق، أجد (ق + ك)(−١) و(هـ − ٤ق)(س). || (ق + ك)(س) = ٦س³ + ٧س² − ٥، فـ (ق + ك)(−١) = −٦ + ٧ − ٥ = −٤. وللتحقق: ق(−١) = −٢ وك(−١) = −٢ ومجموعهما −٤ ✓. أما (هـ − ٤ق)(س) = ٣س² + س + ٤ − ٢٤س³ − ٢٠س² + ٤ = −٢٤س³ − ١٧س² + س + ٨.","? إذا كان ق(س) = ٦س² + ٥س ، هـ(س) = ٣س² + س + ٤ ، ك(س) = ٢س³ + ٦ ، أجد (هـ − ٤ك)(س) و(ق + ك)(س) مع درجة كل ناتج. || هـ − ٤ك = ٣س² + س + ٤ − ٨س³ − ٢٤ = −٨س³ + ٣س² + س − ٢٠ (الدرجة ٣). ق + ك = ٢س³ + ٦س² + ٥س + ٦ (الدرجة ٣).","? ليكن ق كثير حدود من الدرجة الثالثة، وهـ من الدرجة الرابعة، وك من الدرجة الخامسة. أجد درجة (ق + هـ) و(ق − ك) و(ق + هـ + ك). || درجة الناتج في الجمع والطرح تساوي أعلى الدرجتين عندما تختلفان: (ق + هـ) من الدرجة ٤، و(ق − ك) من الدرجة ٥، و(ق + هـ + ك) من الدرجة ٥.","# تدرّب","? أجد (ق + هـ)(س) إذا كان ق(س) = س³ + ٢س² − ٤ ، هـ(س) = ٣س³ − س + ٥. || س³: ١ + ٣ = ٤، س²: ٢، س: −١، الثابت: −٤ + ٥ = ١. الناتج = ٤س³ + ٢س² − س + ١."],"q":["- إذا كان ق(س) = ٦س³ + ٥س² − ١ ، هـ(س) = ٣س² + س + ٤ ، ك(س) = ٢س² − ٤ ، أجد: (ق + هـ)(س) و(هـ − ك)(س) و(ق + ك)(−١) و(هـ − ٤ق)(س).","- ق كثير حدود من الدرجة الثالثة وهـ من الدرجة الرابعة وك من الدرجة الخامسة. ما درجة كل من: (ق + هـ)(س) ، (ق − ك)(س) ، (ق + هـ + ك)(س)؟","- ما درجة ناتج طرح كثيري حدود؟ أعطِ مثالاً تقلّ فيه الدرجة عن درجتي المقدارين.","- إذا كان ق(س) = ٦س² + ٥س ، هـ(س) = ٣س² + س + ٤ ، ك(س) = ٢س³ + ٦ ، أجد (هـ − ٤ك)(س) و(ق + ك)(س) وأحدد درجة كل ناتج."],"quiz":[{"l":0,"k":"n","q":"إذا كان ق(س) ، هـ(س) كثيري حدود فإن (ق + هـ)(س) تساوي:","o":["ق(س) × هـ(س)","ق(س) + هـ(س)","ق(س) − هـ(س)","ق(س) ÷ هـ(س)"],"a":1},{"l":0,"k":"n","q":"ناتج جمع كثيري حدود هو كثير حدود درجته:","o":["أقل من أو تساوي أعلى درجتي الاقترانين","أكبر دائماً من درجتي الاقترانين","مجموع درجتي الاقترانين","صفر دائماً"],"a":0},{"l":0,"k":"n","q":"(ق − هـ)(س) تساوي:","o":["هـ(س) − ق(س)","ق(س) + هـ(س)","ق(س) − هـ(س)","ق(س) × هـ(س)"],"a":2},{"l":0,"k":"n","q":"عند طرح كثير حدود من آخر نغيّر إشارة:","o":["كل حدود كثير الحدود المطروح","الحدّ الأول فقط في المطروح","الحدّ الثابت فقط","كل حدود المطروح منه"],"a":0},{"l":0,"k":"n","q": k":"p","q":"إذا كان ق(س) = ٦س³ + ٥س² − ١ ، هـ(س) = ٣س² + س + ٤ فإن (هـ − ٤ق)(س) تساوي:","o":["−٢٤س³ − ٢٣س² + س + ٨","٢٤س³ + ١٧س² − س − ٨","−٢٤س³ − ١٧س² + س + ٨","−٢٤س³ − ١٧س² + س"],"a":2},{"l":2,"k":"p","q":"إذا كان ق(س) = ٦س³ + ٥س² − ١ ، ك(س) = ٢س² − ٤ فما قيمة (ق + ك)(−١)؟","o":["−٤","−٢","٤","٢"],"a":0},{"l":2,"k":"p","q":"مساحتا غرفتين س² و ٤س² (بالمتر المربع). إذا كانت س = ٣ فالفرق بين مساحتيهما بالمتر المربع يساوي:","o":["٤٥","٢٧","٩","٣٦"],"a":1},{"l":2,"k":"p","q":"ما كثير الحدود الذي يجب طرحه من ٣س² + ٥س − ٢ ليكون الناتج س² + ٢س + ٤؟","o":["٤س² + ٧س + ٢","٢س² + ٣س + ٦","٢س² + ٣س − ٢","٢س² + ٣س − ٦"],"a":3},{"l":2,"k":"p","q":"مثلث أطوال أضلاعه (٢س² + ١) و(س² + ٣س) و(٣س² − س + ٢). محيطه يساوي:","o":["٦س² + ٤س + ٣","٦س⁶ + ٢س + ٣","٦س² + ٢س + ٣","٦س² − ٢س + ١"],"a":2}],"hints":{"عند طرح كثير حدود من آخر نغيّر إشارة:":"الإشارة السالبة التي قبل القوس توزّع على كل حدّ داخله، لا على الحدّ الأول وحده.","إذا كان ق(س) = ٣س² + ٥س − ١ ، هـ(س) = ٢س² − ٢س فإن (ق + هـ)(س) تساوي:":"اجمع الحدود المتشابهة فقط: معاملات س² معاً ثم معاملات س ثم الثوابت، والأسس لا تُجمع.","إذا كان ق(س) = ٧س² + ٥س − ١ ، هـ(س) = ٢س² − ٢س + ٧ فإن (ق − هـ)(س) تساوي:":"اطرح هـ(س) حدّاً حدّاً بعد تغيير إشارة كل حدّ فيه؛ انتبه إلى −٢س فتصبح +٢س.","إذا كان ق(س) = ٢س² − ٣س + ١ ، هـ(س) = س² + ٤ فما قيمة (ق + هـ)(٢)؟":"يمكنك حساب ق(٢) و هـ(٢) كلاً على حدة ثم جمعهما.","إذا كان ق(س) = ٣س³ + ٢س ، هـ(س) = ٣س³ − س² فإن درجة (ق − هـ) هي:":"اطرح أولاً، ولاحظ ماذا يحدث لحدّ س³ ثم حدّد أكبر أسّ يبقى.","مجموع كثيري حدود هو ٥س² − ٣س + ٩، وأحدهما ٢س² + س − ٤. فالآخر يساوي:":"الآخر = المجموع − المعلوم؛ اطرح حدّاً حدّاً وانتبه للإشارات.","ما كثير الحدود الذي يجب طرحه من ٣س² + ٥س − ٢ ليكون الناتج س² + ٢س + ٤؟":"المطروح = المطروح منه − الناتج؛ اطرح (س² + ٢س + ٤) من (٣س² + ٥س − ٢)."}}]},{"title":"الاقترانات والاحتمالات والدائرة","ic":"cyl","color":"#cfe2b0","uq":[[1,"ناتج (س + ٢)(س − ٣) هو:",["س² − س − ٦","س² + س − ٦","س² − ٥س − ٦","س² − ٦"],0],[1,"ناتج قسمة (س³ + ٣س² − ٤) على (س + ٢) هو:",["س² + ٥س + ١٠","س² + س + ٢","س² − س + ٢","س² + س − ٢"],3],[1,"الإحداثي السيني لرأس القطع المكافئ ق(س) = س² + ٢س − ٣ هو:",["−١","١","٢","−٢"],0],[2,"أصفار الاقتران ق(س) = ١ − س² هي:",["٠ فقط","١ و −١","١ فقط","لا توجد أصفار"],1],[1,"مجال الاقتران ق(س) = ٣/(س − ٥) هو:",["ح − {٣}","ح − {−٥}","ح","ح − {٥}"],3],[2,"أصفار الاقتران ق(س) = (س² − ٩)/(س − ٣) هي:",["٣ و −٣","٣ فقط","لا توجد أصفار","−٣ فقط"],3],[1,"ل(ح١) = ٠٫٤٥ و ل(ح٢) = ٠٫٣٥ و ل(ح١ ∩ ح٢) = ٠٫١٥. فإنّ ل(ح١ ∪ ح٢) تساوي:",["٠٫٨","٠٫٩٥","٠٫٦٥","٠٫٣"],2],[1,"احتمال نجاح طالب في الرياضيات ٠٫٧ وفي العلوم ٠٫٦ وفي المادتين معاً ٠٫٥. احتمال نجاحه في الرياضيات فقط:",["٠٫٢","٠٫١","٠٫٣","٠٫٧"],0],[1,"مركز الدائرة (س + ١)² + (ص − ٥)² = ٤٩ ونصف قطرها:",["(١، −٥) و٧","(−١، ٥) و٤٩","(١، −٥) و٤٩","(−١، ٥) و٧"],3],[2,"معادلة الدائرة التي مركزها (١، −١) وتمرّ بالنقطة (٤، ٣) هي:",["(س + ١)² + (ص − ١)² = ٢٥","(س − ١)² + (ص + ١)² = ٢٥","(س − ١)² + (ص + ١)² = ٥","(س − ١)² + (ص + ١)² = ٧"],1],[1,"زاوية محيطية قياسها ٣٧° مشتركة في القوس مع زاوية مركزية. قياس الزاوية المركزية:",["١٨٫٥°","٣٧°","٧٤°","١٤٣°"],2],[2,"في مثلث أ ب جـ مرسوم في دائرة، أ جـ قطر، والزاوية جـ = ٥٥°. قياس الزاوية أ هو:",["٣٥°","٥٥°","٩٠°","١٢٥°"],0]],"lessons":[{"t":"ضرب كثيرات الحدود وقسمتها","e":["# نشاط تمهيدي: مساحة بيت","يملك سمير قطعة أرض مربعة طول ضلعها س متر، ويريد بناء بيت عليها بحيث يترك مساحات حوله (ارتدادات): ٥ م من جهة، و٤ م من الجهة المقابلة، و٣ م على كلّ من الجهتين الجانبيتين.","طول البيت = س − (٣ + ٣) = س − ٦، وعرضه = س − (٥ + ٤) = س − ٩.","مساحة البيت = الطول × العرض = (س − ٦)(س − ٩) = س² − ٩س − ٦س + ٥٤ = س² − ١٥س + ٥٤. أي أنّنا ضربنا كثيري حدود فحصلنا على كثير حدود.","# أولاً: ضرب كثيرات الحدود","إذا كان ق(س)، هـ(س) كثيري حدود فإنّ (ق × هـ)(س) كثير حدود، ويكون: (ق × هـ)(س) = ق(س) × هـ(س).","- نضرب كلّ حدٍّ في المقدار الأول بكلّ حدٍّ في المقدار الثاني (خاصية التوزيع)، ثم نجمع الحدود المتشابهة.","- عند ضرب الحدود نضرب المعاملات ونجمع الأسس: س² × س³ = س⁵.","- درجة حاصل ضرب كثيري حدود = مجموع درجتيهما.","! تذكّر: ق × هـ حاصل ضرب الاقترانين، وليس تركيباً ولا جمعاً: (ق × هـ)(س) = ق(س) × هـ(س).","? إذا كان ق(س) = س² + ٣ ، هـ(س) = ٤س + ٢ ، أجد (ق × هـ)(س). || (ق × هـ)(س) = (س² + ٣)(٤س + ٢) = س² × ٤س + س² × ٢ + ٣ × ٤س + ٣ × ٢ = ٤س³ + ٢س² + ١٢س + ٦. درجة الناتج ٣ = ٢ + ١.","? إذا كان ق(س) = ٢س³ − ٥س² + ١ ، ك(س) = س² − ٣س ، أجد (ق × ك)(س). || نضرب كلّ حدٍّ من ق بكلّ حدٍّ من ك: ٢س³ × س² = ٢س⁵ ، ٢س³ × (−٣س) = −٦س⁴ ، −٥س² × س² = −٥س⁴ ، −٥س² × (−٣س) = ١٥س³ ، ١ × س² = س² ، ١ × (−٣س) = −٣س. نجمع المتشابهة: الناتج = ٢س⁵ − ١١س⁴ + ١٥س³ + س² − ٣س. درجته ٥ = ٣ + ٢.","? إذا كان ق(س) = س² − ٥س ، هـ(س) = س + ٢ ، أجد (ق × هـ)(س). || (س² − ٥س)(س + ٢) = س³ + ٢س² − ٥س² − ١٠س = س³ − ٣س² − ١٠س.","? أكتب درجة ناتج ضرب ق(س) = ٢س⁴ − س في هـ(س) = س³ + ٥ دون إجراء الضرب. || درجة ق = ٤ ودرجة هـ = ٣، فدرجة الناتج = ٤ + ٣ = ٧.","# ثانياً: قسمة كثيرات الحدود","نبدأ بقسمة حدٍّ على حدّ، بشرط أن يكون المقسوم عليه غير صفر: ٣س² ÷ س = ٣س ، وس³ ÷ س² = س ، و(س² − س) ÷ س = س(س − ١) ÷ س = س − ١ ، و٤س² ÷ س = ٤س (س ≠ ٠).","إذا كان ق(س)، هـ(س) كثيري حدود فإنّ (ق ÷ هـ)(س) = ق(س) ÷ هـ(س)، حيث هـ(س) ≠ صفر لكلّ س ∈ ح.","# القسمة الطويلة: الخطوات","- ١) نرتّب حدود المقسوم والمقسوم عليه تنازلياً حسب قوى س.","- ٢) نقسم الحدّ الأول في المقسوم على الحدّ الأول في المقسوم عليه، ونضع الناتج حدّاً أول في ناتج القسمة.","- ٣) نضرب هذا الحدّ في كلّ حدٍّ من المقسوم عليه، ونطرح الناتج من المقسوم.","- ٤) نكرّر الخطوتين ٢ و٣ حتى نصل إلى باقٍ درجته أقلّ من درجة المقسوم عليه.","! الخطأ الشائع: ترك الحدود المفقودة، ففي ٧س + س³ + ١٢ نكتبه س³ + ٠س² + ٧س + ١٢ حتى لا تختلّ الأعمدة. والخطأ الثاني: عدم تغيير إشارات كلّ ما نطرحه.","? إذا كان ق(س) = ٧س + س³ + ١٢ ، هـ(س) = س + ٢ ، أجد ق(س) ÷ هـ(س). || نرتّب: س³ + ٠س² + ٧س + ١٢ ÷ (س + ٢). س³ ÷ س = س² ، نضرب س² في (س + ٢) = س³ + ٢س² ونطرح فيبقى −٢س² + ٧س + ١٢. ثم −٢س² ÷ س = −٢س ، نضرب فنحصل −٢س² − ٤س ونطرح فيبقى ١١س + ١٢. ثم ١١س ÷ س = ١١ ، نضرب ١١(س + ٢) = ١١س + ٢٢ ونطرح فيبقى −١٠. الناتج س² − ٢س + ١١ والباقي −١٠.","? كيف نتحقّق من صحة الحلّ السابق؟ || المقسوم = المقسوم عليه × ناتج القسمة + الباقي: (س + ٢)(س² − ٢س + ١١) − ١٠ = س³ − ٢س² + ١١س + ٢س² − ٤س + ٢٢ − ١٠ = س³ + ٧س + ١٢ ✓.","? أجد ناتج قسمة (٣س² + س³ − ٤) على (س + ٢). || نرتّب: س³ + ٣س² + ٠س − ٤. س³ ÷ س = س² ، نطرح س³ + ٢س² فيبقى س² + ٠س − ٤. س² ÷ س = س ، نطرح س² + ٢س فيبقى −٢س − ٤. −٢س ÷ س = −٢ ، نطرح −٢س − ٤ فيبقى صفر. الناتج س² + س − ٢ والباقي صفر.","? أجد (٣س² − ١) ÷ (س − ١). || ٣س² ÷ س = ٣س ، نطرح ٣س² − ٣س فيبقى ٣س − ١. ٣س ÷ س = ٣ ، نطرح ٣س − ٣ فيبقى ٢. الناتج ٣س + ٣ والباقي ٢.","? أجد (٦س³ + ٣س + ٢) ÷ (٢س² + ١). || ٦س³ ÷ ٢س² = ٣س ، نطرح ٦س³ + ٣س فيبقى ٢، ودرجته (٠) أقلّ من درجة المقسوم عليه (٢). الناتج ٣س والباقي ٢.","? أكتب درجة ناتج قسمة ق(س) = ٢س³ − ٨س² + ١ على هـ(س) = س + ٦ دون إجراء القسمة. || درجة ناتج القسمة = درجة المقسوم − درجة المقسوم عليه = ٣ − ١ = ٢.","# الباقي صفر يعني عاملاً","في (٣س² + س³ − ٤) ÷ (س + ٢) كان الباقي صفراً، فيكون س³ + ٣س² − ٤ = (س + ٢)(س² + س − ٢)، ونقول إنّ (س + ٢) عامل من عوامل س³ + ٣س² − ٤، وكذلك ناتج القسمة (س² + س − ٢) عامل منه.","إذا كان باقي قسمة اقتران كثير حدود على اقتران كثير حدود آخر يساوي صفراً فإنّ المقسوم عليه عامل من عوامل المقسوم.","? أبيّن باستخدام القسمة الطويلة أنّ (س − ٢) عامل من عوامل س³ − ٨. || نكتب س³ + ٠س² + ٠س − ٨ ÷ (س − ٢): الحدّ الأول س²، نطرح س³ − ٢س² فيبقى ٢س² + ٠س − ٨؛ ثم ٢س، نطرح ٢س² − ٤س فيبقى ٤س − ٨؛ ثم ٤، نطرح ٤س − ٨ فيبقى صفر. الباقي صفر، إذن (س − ٢) عامل، وس³ − ٨ = (س − ٢)(س² + ٢س + ٤).","# مسألة: خزان الماء","خزان ماء أسطواني حجمه بالليترات ٥(٢س² + س − ٣) وارتفاعه ٢س + ٣. لحساب مساحة قاعدته: مساحة القاعدة = الحجم ÷ الارتفاع.","- طريقة أحمد (القسمة الطويلة): (١٠س² + ٥س − ١٥) ÷ (٢س + ٣) = ٥س − ٥.","- طريقة فاطمة (التحليل): ٥(٢س + ٣)(س − ١) ÷ (٢س + ٣) = ٥(س − ١) = ٥س − ٥.","مساحة القاعدة = (٥س − ٥) وحدة مربعة بالطريقتين، وهذا يؤكّد أنّ الطريقتين صحيحتان.","# أمثلة من تمارين ومسائل","? إذا كان ق(س) = س³ − ٥س² + ٣ ، هـ(س) = س² + ١ ، أجد ق(س) × هـ(س) + ٥ . || ق × هـ = (س³ − ٥س² + ٣)(س² + ١) = س⁵ + س³ − ٥س⁴ − ٥س² + ٣س² + ٣ = س⁵ − ٥س⁴ + س³ − ٢س² + ٣. ثم نضيف ٥: س⁵ − ٥س⁴ + س³ − ٢س² + ٨.","? في المثال السابق أجد ق(س) ÷ هـ(س). || س³ ÷ س² = س ، نطرح س³ + س فيبقى −٥س² − س + ٣. −٥س² ÷ س² = −٥ ، نطرح −٥س² − ٥ فيبقى −س + ٨. الناتج س − ٥ والباقي −س + ٨.","? أبيّن أنّ (س + ١) عامل من عوامل س³ + ١. || س³ + ٠س² + ٠س + ١ ÷ (س + ١): س² ثم −س ثم ١، والباقي صفر. إذن (س + ١) عامل، وناتج القسمة س² − س + ١.","? قطعتا أرض: الأولى مربعة طول ضلعها (س + ٣)، والثانية مستطيلة بعداها (س + ١٣) و(س − ٢). هل تتساوى مساحتاهما عندما س = ١٢؟ وعندما س = ٧؟ || المساحة الأولى (س + ٣)² = س² + ٦س + ٩ ، والثانية (س + ١٣)(س − ٢) = س² + ١١س − ٢٦. عند س = ١٢: ٢٢٥ و٢٥٠ فلا تتساوى. عند س = ٧: ١٠٠ و١٠٠ فتتساوى (المعادلة ٥س = ٣٥)."],"q":["- أضرب (س² − ٥س) في (س + ٢). ثم أضرب (س³ + ٢س + ١) في (س + ٢).","- ما درجة حاصل ضرب كثيري حدود؟ وما درجة ناتج قسمة كثير حدود على آخر؟","- أجد ناتج (٣س² − ١) ÷ (س − ١) والباقي.","- ما الخطوات الأربع للقسمة الطويلة؟ ومتى نتوقّف عن القسمة؟","- أبيّن باستخدام القسمة الطويلة أنّ (س − ٢) عامل من عوامل س³ − ٨."],"quiz":[{"l":0,"k":"n","q":"(ق × هـ)(س) تساوي:","o":["ق(س) + هـ(س)","ق(س) × هـ(س)","ق(س) ÷ هـ(س)","ق(هـ(س))"],"a":1},{"l":0,"k":"n","q":"درجة حاصل ضرب كثيري حدود درجتاهما ٣ و٢ هي:","o":["٥","٦","٣","١"],"a":0},{"l":0,"k":"n","q":"يشترط في (ق ÷ هـ)(س) أن يكون:","o":["ق(س) ≠ صفر","س = ١","ق(س) = هـ(س)","هـ(س) ≠ صفر"],"a":3},{"l":0,"k":"n","q":"ناتج قسمة ٣س² على س (س ≠ ٠) هو:","o":["٣س²","٣","٣س","٢س"],"a":2},{"l":0,"k":"n","q":"إذا كان باقي قسمة كثير حدود على آخر يساوي صفراً فإنّ المقسوم عليه:","o":["يساوي المقسوم","عامل من عوامل المقسوم","أعلى درجة من المقسوم","يساوي الباقي"],"a":1},{"l":0,"k":"n","q":"الخطوة الأولى في القسمة الطويلة لكثيري حدود هي:","o":["ترتيب الحدود تنازلياً حسب قوى س","ضرب المقسوم في المقسوم عليه","جمع الحدود الثابتة","طرح الأسس"],"a":0},{"l":0,"k":"n","q":"ناتج س² × س³ هو:","o":["س⁶","٢س⁵","س⁴","س⁵"],"a":3},{"l":0,"k":"n","q":"في القسمة الطويلة نقسم الحدّ الأول في المقسوم على:","o":["الحدّ الأخير في المقسوم عليه","الحدّ الثابت في المقسوم عليه","الحدّ الأول في المقسوم عليه","كلّ حدود المقسوم عليه"],"a":2},{"l":1,"k":"p","q":"ناتج (س + ٣)(س − ٥) بأبسط صورة هو:","o":["س² + ٢س − ١٥","س² − ٢س − ١٥","س² − ٢س + ١٥","س² − ٨س − ١٥"],"a":1},{"l":1,"k":"p","q":"ناتج (٢س − ١)( ","باقي قسمة (س² + ٥س + ٧) على (س + ٢) يساوي:":"نفّذ القسمة الطويلة؛ الباقي هو ما تبقّى بعد أن تصبح درجته أقل من درجة المقسوم عليه.","أيّ الاقترانات الآتية عامل من عوامل س³ − ٨؟":"المقسوم عليه عاملٌ إذا كان باقي القسمة صفراً؛ جرّب القسمة على كلّ خيار أو عوّض بجذره.","قُسم ق(س) على (س + ١) فكان ناتج القسمة س² − ٣س + ٢ والباقي ٥. فإنّ ق(س) =":"المقسوم = المقسوم عليه × ناتج القسمة + الباقي.","مربع طول ضلعه (س + ٣) ومستطيل بعداه (س + ١٣) و(س − ٢). عند أيّ قيمة لـ س تتساوى مساحتاهما؟":"ساوِ س² + ٦س + ٩ بـ (س + ١٣)(س − ٢) بعد فكّهما، فيختفي حدّ س²."}},{"t":"الاقتران التربيعي","e":["# نشاط تمهيدي: حركة المياه في النافورة","كثير من حركة الأشياء في الطبيعة تحصل بطريقة منظّمة وضمن قوانين ثابتة. فالمياه المتدفّقة من نافورة ترسم شكلاً منظّماً منحنياً مفتوحاً إلى الأسفل.","أمثلة أخرى لها الحركة نفسها: مسار كرة قُذفت إلى الأعلى، ومسار نافورة، وقوس باب (مثل قوس الباب الحديدي في المسجد الأقصى الذي نعبّر عنه بالاقتران هـ(س) = ١٦ − س²).","# التعريف: الاقتران التربيعي","يُسمّى كثير الحدود ق(س) = أس² + ب س + جـ، حيث أ، ب، جـ أعداد حقيقية، أ ≠ صفر، اقتراناً تربيعياً.","|الاقتران|هل هو تربيعي؟|السبب","|ق(س) = س² + ٢س − ٣|نعم|الدرجة الثانية وأ = ١","|ق(س) = ٣س² − ١٢س|نعم|أ = ٣ ، ب = −١٢ ، جـ = ٠","|ق(س) = ١ − س²|نعم|أ = −١ ، ب = ٠ ، جـ = ١","|ق(س) = ٢س + ٥|لا|لا يحوي حدّاً من الدرجة الثانية (أ = ٠)","# تمثيل ق(س) = س² بيانياً","نكمل جدول القيم ثم نعيّن النقاط ونصل بينها:","|س|−٣|−٢|−١|٠|١|٢|٣","|ص = ق(س) = س²|٩|٤|١|٠|١|٤|٩","عند تمثيل ق(س) = س² في المستوى الديكارتي يظهر منحنى يُسمّى قطعاً مكافئاً. هو مفتوح إلى الأعلى لأنّ معامل س² موجب. ونقطة التقائه بمحور التماثل تسمّى رأس القطع، ومحور التماثل هنا محور الصادات (س = ٠).","! لاحظ: ق(−٢) = ق(٢) = ٤ ، فالنقاط متماثلة حول محور التماثل.","# خطوات تمثيل الاقتران التربيعي","نمثّل ق(س) = س² + ٢س − ٣ (أ = ١ ، ب = ٢ ، جـ = −٣):","- ١) نجد الإحداثي السيني للرأس: س = −ب ÷ ٢أ = −٢ ÷ ٢ = −١.","- ٢) نكوّن جدول قيم حول الرأس (قيماً من −٣ إلى ١):","|س|−٣|−٢|−١|٠|١","|ص = ق(س)|٠|−٣|−٤|−٣|٠","- ٣) إحداثيات الرأس (−١ ، −٤) لأنّ ق(−١) = (−١)² + ٢(−١) − ٣ = ١ − ٢ − ٣ = −٤.","- ٤) نعيّن النقاط في المستوى الديكارتي ونصل بينها بمنحنى متّصل.","# قراءة المنحنى","- نقطتا تقاطع المنحنى مع محور السينات: (−٣ ، ٠) و(١ ، ٠)؛ أي أصفار الاقتران −٣ و١ لأنّ ق(−٣) = ق(١) = ٠.","- الاقتران مفتوح إلى الأعلى لأنّ معامل س² (أ = ١) موجب.","- الإحداثي الصادي للرأس ق(−١) = −٤ وهي القيمة الصغرى للاقتران.","- نقطة تقاطع المنحنى مع محور الصادات (٠ ، −٣) لأنّ ق(٠) = جـ = −٣.","|إشارة المعامل أ|اتجاه الفتحة|الرأس","|أ > ٠ (موجب)|إلى الأعلى|نقطة القيمة الصغرى","|أ < ٠ (سالب)|إلى الأسفل|نقطة القيمة العظمى","! الخطأ الشائع: حساب س = ب ÷ ٢أ بدل −ب ÷ ٢أ؛ فينتج رأسٌ في الجهة المعاكسة. انتبه للإشارة السالبة.","# أمثلة محلولة","? أمثّل الاقتران ق(س) = س² + ٦س + ٩ في المستوى الديكارتي. || س = −٦ ÷ ٢ = −٣. جدول: ق(−٥) = ٤ ، ق(−٤) = ١ ، ق(−٣) = ٠ ، ق(−٢) = ١ ، ق(−١) = ٤ ، ق(٠) = ٩. الرأس (−٣ ، ٠)، والمنحنى مفتوح إلى الأعلى ويمسّ محور السينات عند −٣ فقط.","? أمثّل الاقتران ق(س) = ٣س² − ١٢س. || س = ١٢ ÷ ٦ = ٢. جدول: ق(٠) = ٠ ، ق(١) = ٣ − ١٢ = −٩ ، ق(٢) = ١٢ − ٢٤ = −١٢ ، ق(٣) = ٢٧ − ٣٦ = −٩ ، ق(٤) = ٤٨ − ٤٨ = ٠. الرأس (٢ ، −١٢)، والأصفار ٠ و٤، ومفتوح إلى الأعلى.","? أمثّل الاقتران ق(س) = ١ − س². || أ = −١ سالب إذن مفتوح إلى الأسفل. س = ٠ ÷ (−٢) = ٠. جدول: ق(−٢) = −٣ ، ق(−١) = ٠ ، ق(٠) = ١ ، ق(١) = ٠ ، ق(٢) = −٣. الرأس (٠ ، ١) وهي القيمة العظمى، والأصفار ±١.","? قوس باب يُمثَّل بالاقتران هـ(س) = ١٦ − س² حيث ينطبق محور الصادات على محور تماثله ومحور السينات على قاعدته. أجد عرض القوس عند قاعدته وارتفاعه. || نقاط التقاطع مع محور السينات: ١٦ − س² = ٠ فيكون س = ٤ أو س = −٤، فعرض القاعدة = ٤ − (−٤) = ٨. الارتفاع = الإحداثي الصادي للرأس = هـ(٠) = ١٦.","? عدد الخلايا السداسية في قرص العسل يُمثَّل بالاقتران هـ(ر) = ٣ر² − ٣ر + ١ حيث ر عدد الحلقات. هل يمكن أن يساوي هـ(ر) صفراً؟ || ر = ٣ ÷ ٦ = ١/٢ ، وهـ(١/٢) = ٣/٤ − ٣/٢ + ١ = ١/٤. المنحنى مفتوح إلى الأعلى وأصغر قيمة له ١/٤ > ٠، فلا يمس محور السينات ولا يساوي صفراً أبداً. وهـ(١) = ١ ، هـ(٢) = ٧ ، هـ(٣) = ١٩.","? أجد الرأس والأصفار ونقطة التقاطع مع محور الصادات للاقتران ق(س) = س² − ٤س − ٥. || س = ٤ ÷ ٢ = ٢ ، ق(٢) = ٤ − ٨ − ٥ =
