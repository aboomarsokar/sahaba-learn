<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الرياضيات — الصف التاسع</title>
<meta name="theme-color" content="#0a5230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../shared/icons/portal-192.png">
<link rel="apple-touch-icon" href="../../shared/icons/portal-180.png">
<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--hd:#0a5230;--hd2:#073d22;--bg:#FAF6EB;--card:#fff;--ink:#0a5230;--mut:#4b7a5f;--g:#00a152;--y:#ffc107;--bd:#e9dfc8;--ok:#1f9d55;--bad:#d63c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:min(760px,100%);margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
/* الرأس */
.hdr{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 40px;position:relative}
.hdr .row1{display:flex;align-items:center;gap:12px}
.av{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--y);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--g);font-weight:700;font-size:1.4rem}
.av img{width:100%;height:100%;object-fit:cover}
.hi{flex:1;min-width:0}.hi b{display:block;font-size:1.2rem;line-height:1.3}
.pts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#f3dc92;font-size:.9rem;margin-top:0}
.pts .dr-chip{padding:0 9px !important;font-size:.78rem !important}
.portal{display:flex;align-items:center;gap:6px;color:var(--y);text-decoration:none;font-weight:700;font-size:.9rem;flex:none}
.portal svg{width:24px;height:24px}
.sheet{background:var(--bg);margin-top:-26px;border-radius:26px 26px 0 0;padding:12px 16px 0;position:relative}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--bd);border-radius:999px;padding:6px 14px;margin-bottom:6px}
.search input{border:0;outline:0;background:transparent;flex:1;font:inherit;color:var(--ink);min-width:0}
.search svg{width:20px;height:20px;color:var(--mut);flex:none}
.sec{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:700;margin:4px 0 8px}
.sec i{font-style:normal;color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;grid-auto-rows:clamp(92px,calc((100svh - 300px) / 4),132px)}
.uc{border:0;border-radius:18px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;box-shadow:0 5px 0 var(--s,#007a3d);color:#fff;text-align:center;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.uc svg{width:clamp(36px,6.5svh,52px);height:clamp(36px,6.5svh,52px);flex:none;background:#fff;border-radius:50%;padding:5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.uc b{font-size:.92rem;line-height:1.25}
.uc small{font-size:.74rem;opacity:.95;font-weight:600}
.uc .dn{position:absolute;top:6px;inset-inline-start:6px;background:#fff;border-radius:99px;font-size:.68rem;padding:0 7px;font-weight:700;color:var(--g)}
#drToast{top:0 !important;bottom:auto !important;border-radius:0 0 14px 14px !important;font-size:.72rem !important;padding:3px 14px !important;opacity:.92}
.card>svg{width:60px;height:60px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:right}
.cont .t{flex:1;min-width:0}.cont .t b{display:block;font-size:1.1rem}.cont .t small{color:var(--mut)}
.bar{height:10px;background:#ece6d4;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--y);border-radius:99px}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:var(--ink);background:conic-gradient(var(--y) calc(var(--p)*1%),#ece6d4 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.85rem}
.daily{background:linear-gradient(135deg,#f6e3a1,#ffc107);border:2px solid #cfa23a;border-radius:26px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.daily .tr{font-size:3rem;line-height:1}
.daily b{font-size:1.3rem;display:block}.daily small{display:block;margin:2px 0 10px;color:#4a3a10}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--hd);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700}
.cta.alt{background:var(--g)}
/* التنقّل */
.nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);border-radius:26px 26px 0 0;display:grid;grid-template-columns:repeat(var(--n,5),1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(17,61,46,.08);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8a8a8a;text-decoration:none;font-size:.82rem;font-weight:700;padding:4px 0}
.nav a svg{width:28px;height:28px}
.nav a.on{color:#b8902f}
/* شاشات داخلية */
.top{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.4}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:1.3rem}
.body{padding:16px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;width:100%;text-align:right;text-decoration:none;color:inherit}
.row .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:700;background:#fbf0c8;border:1px solid var(--y)}
.row .ic svg{width:34px;height:34px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx small{color:var(--mut)}
.row .go{color:var(--mut);font-size:1.3rem}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:#e0d9c4}.dots i.on{background:var(--ok)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;border:1.5px solid #7fe0a2;background:#fff;color:var(--g);border-radius:999px;padding:6px 16px;font-weight:700}
.tb.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 0 var(--y)}
.lc h3{margin:14px 0 6px;font-size:1.1rem;color:var(--g)}
.lc p{margin:8px 0}.lc ul{margin:8px 0;padding-inline-start:20px}.lc li{margin:4px 0}
.note{background:#fdf0d8;border-inline-start:5px solid #f08a00;border-radius:12px;padding:8px 12px;margin:10px 0}
.exm{background:#e6f3ec;border-inline-start:5px solid var(--g);border-radius:12px;padding:8px 12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--bd);padding:6px 8px;text-align:center}.tbl th{background:#d7e8dc}
.lv{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px;margin-bottom:10px;border:2px solid;background:#fff;width:100%;text-align:right}
.lv i{font-style:normal;font-size:1.8rem}.lv b{display:block}.lv small{color:var(--mut)}
.lv .st{margin-inline-start:auto;font-weight:700}
/* الاختبار */
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y)}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 14px;line-height:1.7}
.kk{display:inline-block;font-size:.75rem;background:#e6f3ec;color:var(--g);border-radius:99px;padding:0 10px;margin-bottom:6px}
.op{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:1.02rem}
.op.ok{border-color:var(--ok);background:#e5f6ec}.op.bad{border-color:var(--bad);background:#fde9e9}
.hint{background:#fff6dc;border:1px solid var(--y);border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.res{text-align:center;padding:24px 8px}.res .big{font-size:3.4rem}.res h2{margin:6px 0}
.stars{font-size:2.2rem;letter-spacing:4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat div{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;color:var(--g)}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bd div{background:#fff;border:1px solid var(--y);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem;line-height:1.4}.bd i{display:block;font-style:normal;font-size:1.8rem}
.wis{text-align:center}.wis small{color:var(--mut)}
.btn{display:block;width:100%;text-align:center;border:0;background:linear-gradient(135deg,#00c853,var(--g));color:#fff;border-radius:14px;padding:12px;font-weight:700;margin-top:10px;text-decoration:none}
.btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.empty{color:var(--mut);text-align:center;padding:20px}
@media (min-width:640px){.grid,.mg{grid-template-columns:repeat(3,1fr)}.nav{max-width:760px}.grid{grid-auto-rows:clamp(110px,18svh,150px)}}
@media (max-width:340px){.grid,.mg{grid-template-columns:1fr}.hi b{font-size:1rem}}
/* محاكاة جرّب بنفسك */
.wgv{display:grid;place-items:center;margin:4px 0}
.wgbig{text-align:center;font-size:1.45rem;font-weight:800;margin:8px 0;padding:8px;border-radius:16px;background:linear-gradient(135deg,#fff3c4,#ffe082);color:#4e2a00}
.wgbig span{display:inline-block;background:#ff6d00;color:#fff;border-radius:10px;padding:0 10px}.wgbig b{color:#d50000}.wgbig small{display:block;font-size:.85rem;color:#6d4c00;font-weight:600}
.wgc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.wgc span{font-weight:700;min-width:100%}
.wgc button{flex:1;min-width:58px;border:0;border-radius:14px;padding:10px 4px;font:800 1.05rem inherit;background:#fff;color:var(--c);box-shadow:inset 0 0 0 3px var(--c);cursor:pointer;transition:.15s}.wgc button.on{background:var(--c);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.wgs{margin:8px 0}.wgs label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}.wgs input{width:100%;height:30px}
.wgm{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7c4dff,#e040fb);color:#fff;border-radius:16px;padding:10px 12px;margin:10px 0;font-weight:700}
.wgn{display:block;width:100%;border:0;border-radius:14px;padding:11px;margin-top:8px;font:800 1rem inherit;color:#fff;background:linear-gradient(135deg,#ff6d00,#ffab00);box-shadow:0 4px 0 #c43e00;cursor:pointer}.wgn.g{background:linear-gradient(135deg,#00c853,#64dd17);box-shadow:0 4px 0 #008a39}
.wgrow{display:flex;gap:8px}.wgrow .wgn{flex:1}
.wgok{background:#00c853;color:#fff;border-radius:14px;padding:8px;text-align:center;font-weight:800;margin-top:8px;animation:wgpop .4s}
.wgb{text-align:center;font-size:2.2rem;animation:wgpop .5s}
@keyframes wgpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.wgst{position:relative;height:90px;border-radius:16px;overflow:hidden;background:linear-gradient(#80d8ff,#e1f5fe 60%,#a5d6a7 60%)}.wgball{position:absolute;bottom:8px;left:0;line-height:1;transition:font-size .2s}
@keyframes wgrun{from{left:-40px}to{left:100%}}
.wgsvg{width:100%;height:auto}
.wgbars{display:flex;gap:10px;height:92px;align-items:flex-end;justify-content:center;margin:6px 0}.wgbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:56px}.wgbars i{display:block;width:100%;border-radius:8px 8px 0 0;min-height:2px;transition:height .15s}.wgbars span{font-weight:800}
.wgat{display:flex;gap:8px;align-items:center}.wgai{flex:1;font-size:.92rem;line-height:1.7}.wgtag{color:#fff;border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:700}
.wgel{margin-top:6px}.wgrow2{display:flex;gap:3px;align-items:center;margin:4px 0;flex-wrap:wrap}.wgrow2>small{width:100%;color:#6a5a2a;font-weight:700}
.wgrow2 button{width:38px;height:44px;border:0;border-radius:10px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgrow2 button small{font-size:.6rem;opacity:.85}.wgrow2 button b{font-size:.95rem}.wgrow2 button.on{transform:translateY(-3px) scale(1.12);outline:3px solid #fff;box-shadow:0 0 0 3px #111}
.wgcv{width:100%;height:auto;border-radius:16px;display:block}
.wgsnd{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}.wgsnd>b{width:100%}.wgsnd button{flex:1;border:0;border-radius:12px;padding:8px 2px;background:var(--c);color:#fff;font:800 .95rem inherit;display:flex;flex-direction:column;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgsnd small{font-weight:500;opacity:.9}.wgsr{width:100%;background:#e3f2fd;border-radius:12px;padding:8px;font-weight:700}
.wgcard{text-align:center;background:linear-gradient(135deg,#fff3c4,#ffe0b2);border-radius:20px;padding:14px;margin-bottom:10px}.wgem{font-size:4rem;line-height:1.2}.wgcard b{font-size:1.2rem;display:block}.wgcard small{color:#6d4c00}
.wgks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wgks button{border:0;border-radius:14px;padding:12px 4px;color:#fff;font:800 1rem inherit;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.22);cursor:pointer}.wgks button:last-child{grid-column:1/-1}.wgks button.ok{outline:4px solid #fff;box-shadow:0 0 0 4px #00c853}.wgks button.no{animation:wgshake .4s}.wgks button[disabled]{opacity:.55}
@keyframes wgshake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.wgmsg{text-align:center;font-weight:800;margin-top:10px;min-height:1.6em}.wgfin{text-align:center;padding:10px}.wgfin b{font-size:1.6rem}

/* عناصر تفاعلية */
.ipb{height:7px;background:#ece6d4;border-radius:99px;overflow:hidden;margin:6px 0 2px}.ipb i{display:block;height:100%;width:0;background:var(--y);transition:width .35s}
.ipt{display:block;color:var(--mut);font-size:.8rem;margin-bottom:6px}
.pt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:right;background:#f4f8ee;border:2px solid #d7e6c4;border-radius:14px;padding:9px 12px;margin:6px 0;font-size:1rem;line-height:1.6}
.pt::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid #9bbf86;flex:none;margin-top:2px;transition:.2s;display:grid;place-items:center;color:#fff;font-size:.8rem}
.pt.done{background:#e5f6ec;border-color:var(--ok)}.pt.done::before{content:"✓";background:var(--ok);border-color:var(--ok)}
.cl{display:inline-block;min-width:52px;border:0;border-radius:8px;background:var(--y);color:#3b2a08;padding:0 8px;font:inherit;font-weight:700;letter-spacing:2px;animation:pulse 1.6s infinite}
.cl.rv{background:#d8f0e0;color:var(--g);letter-spacing:0;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,185,77,.35)}}
.ip{margin:10px 0}
.nt,.ex2{display:block;width:100%;text-align:right;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:1rem;line-height:1.6;border:2px dashed}
.nt{background:#fdf0d8;border-color:#f08a00}.ex2{background:#e6f3ec;border-color:var(--g)}
.nt .bd2,.ex2 .bd2{display:none}.nt.done .bd2,.ex2.done .bd2{display:block;margin-top:4px;font-weight:700}.nt.done .hd2,.ex2.done .hd2{display:none}
.nt.done,.ex2.done{border-style:solid}
.tbw{overflow-x:auto;margin:10px 0}.tbw .tbl{margin:0}.tbl td.mk{background:#e9efe0;color:transparent;cursor:pointer;user-select:none}.tbl td.mk.rv{background:none;color:inherit}
.tbs{display:block;margin:6px auto 0;border:0;background:var(--y);color:#3b2a08;border-radius:99px;padding:4px 16px;font-weight:700;font-size:.85rem}
/* الرياضيات */
.t-math{--bg:#f6f0dd;--ink:#17402b;--mut:#5f7a63;--g:#1d5a3b;--bd:#e8e0c4}
.mh{display:flex;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top)) 18px 4px}
.mhi{flex:1}.mhi b{font-size:1.8rem;line-height:1.25;display:block}.mhi small{color:#6a8a5c;font-size:1rem}
.mportal{display:inline-block;margin-top:6px;background:#fffaf0;border:1.5px solid #cfe3b0;border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:700;color:#1d5a3b;text-decoration:none}
.mav{width:76px;height:76px;background:#1d4d35;color:#fff;border:6px solid #cfe3b0;font-size:2rem}
.pc{margin:14px 16px;background:linear-gradient(135deg,#00a152,#00e676);color:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 0 #007a3d}
.pct{display:flex;justify-content:space-between;align-items:center}.pct b{font-size:1.35rem}
.chp{background:#fff;color:#00a152;border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem}
.pcr{display:flex;justify-content:space-between;margin:10px 0 6px;font-size:.95rem}
.bar.big{height:14px;background:#d5dcc0}.bar.big i{background:#1d5a3b}
.pcs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}.chp2{background:#fff;color:#0a5230;border-radius:99px;padding:3px 14px;font-weight:700;font-size:.92rem}.chp2.g{background:#ffc107;color:#3b2a00}
.sec2{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 8px;font-size:1.3rem}.sec2 a{font-size:.95rem;color:#3d7a4f;text-decoration:none;font-weight:400}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 10px}
.mu{border:0;border-radius:22px;padding:14px 8px;text-align:center;text-decoration:none;color:#fff;box-shadow:0 6px 0 var(--s,#007a3d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:124px;position:relative;font:inherit;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.mu.w{grid-column:1/-1}
.mu svg{width:46px;height:46px;filter:brightness(0) invert(1)}.mu b{font-size:1.1rem}.mu small{font-size:.85rem;opacity:.95;font-weight:600}
.mu .dn{position:absolute;top:8px;inset-inline-start:8px;background:#1d5a3b;color:#fff;border-radius:99px;font-size:.7rem;padding:0 8px}
.t-math .nav{background:#fffaf0}.t-math .nav a.on{color:#1d4d35}
/* الآلة الحاسبة */
#calc{position:fixed;inset:0;background:rgba(17,40,28,.55);z-index:50;display:grid;place-items:end center}
.cbox{width:100%;max-width:520px;background:#fffaf0;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:slin .25s ease both}
.cd{background:#e9f0d5;border-radius:16px;padding:10px 14px;text-align:left;direction:ltr;min-height:76px}.cd small{display:block;color:var(--mut);min-height:22px;word-break:break-all}.cd b{font-size:2rem;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;direction:ltr}
.ck button{border:0;border-radius:14px;padding:13px 0;font-size:1.25rem;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 2px 0 #e0d8bc}.ck button.o{background:#cfe3b0}.ck button.eq{background:#1d5a3b;color:#fff;grid-column:span 2}.ck button.cx{background:#f6d8d0}
.cclose{display:block;margin:10px auto 0;border:0;background:none;color:var(--mut);font-weight:700}
/* درس البطاقات التفاعلية */

window.SCI={"cfg":{"widgets":false,"name":"الرياضيات","hello":"مرحباً","unitsTitle":"الوحدات الدراسية","unitsHint":"أربع وحدات من رزمة الرياضيات: الأعداد الحقيقية والمستوى الديكارتي، والعلاقات والاقترانات والإحصاء، والمثلثات والمتباينات وكثيرات الحدود، والاقترانات والاحتمالات والدائرة. اضغط وحدة لترى دروسها.","theme":"math","key":"math9:st","wid":"math","kxid":"math9","student":"طالب الرياضيات","packT":"رزمة الرياضيات","dir":"math/9","gradeName":"الصف التاسع","gradeFor":"للصف التاسع"},"units":[{"title":"الأعداد الحقيقية والمستوى الديكارتي","ic":"frac","color":"#cfe2b0","uq":[[0,"أيّ الأعداد الآتية غير نسبي؟",["√٤٩","٠٫٣٣٣…","√٧","٢/٣"],2],[1,"ناتج √٢٠ + √٤٥ − √٥ بأبسط صورة هو:",["٤√٥","٦√٥","٢√٥","√٦٠"],0],[1,"قيمة |٣ − √١٠| تساوي:",["٣ − √١٠","√١٠ − ٣","√١٠ + ٣","٠"],1],[1,"بعد إنطاق المقام يصبح ١/(√٣ − ١) مساوياً:",["√٣ − ١","(√٣ + ١)/٤","(√٣ + ١)/٢","√٣ + ١"],2],[2,"قيمة (٢ − √٣)⁴ × (٢ + √٣)⁴ تساوي:",["−١","١","٧","٠"],1],[2,"قيمة (٢⁻¹)⁻³ × ٢⁻² تساوي:",["٢","١/٢","٨","١/٤"],0],[0,"المسافة بين النقطتين (٣ ، ٤) وَ (٠ ، ٠) تساوي:",["٥","٧","١","٢٥"],0],[1,"منتصف القطعة التي طرفاها (٢ ، ٦) وَ (٨ ، −٢) هو:",["(٥ ، ٤)","(٦ ، ٨)","(٣ ، ٢)","(٥ ، ٢)"],3],[1,"ميل الخط المارّ بالنقطتين (١ ، ٣) وَ (٣ ، ٩) يساوي:",["٣","٢","١/٣","٦"],0],[1,"معادلة الخط المستقيم الذي ميله ٢ ومقطعه الصادي −٣ هي:",["ص = −٣س + ٢","ص = ٢س − ٣","ص = ٢س + ٣","س = ٢ص − ٣"],1],[2,"المسافة بين منتصف القطعة (٠ ، ٠)–(٦ ، ٨) وَ نقطة الأصل تساوي:",["٥","١٠","٧","٢٥"],0],[2,"الخط المارّ بالنقطتين (١ ، ١) وَ (٣ ، ٥) يوازي الخط:",["ص = ٢س + ٧","ص = −٢س + ١","ص = ١/٢ س","ص = ٣س"],0]],"lessons":[{"t":"الأعداد الحقيقية","e":["# نشاط تمهيدي: البحر الميت","يتناقص ارتفاع سطح البحر الميت قرابة متر واحد في السنة. خلال سنة ونصف يتناقص ٣/٢ م، وخلال سنتين و٤ أشهر يتناقص ٧/٣ م.","كلا العددين كسر عادي، أي عدد نسبي ينتمي إلى المجموعة ن. أمّا أعداد مثل √٢ وπ فلا يمكن كتابتها على صورة كسر.","# مجموعات الأعداد","- ط: الأعداد الطبيعية، مثل ١ و٢ و٣ …","- ص: الأعداد الصحيحة، مثل −٣ و٠ و٥، وتضمّ الأعداد الطبيعية.","- ن: الأعداد النسبية، وهي كل عدد يمكن كتابته على الصورة أ/ب حيث أ، ب عددان صحيحان وب ≠ ٠؛ وكتابته العشرية منتهية أو دورية.","- ن̅: الأعداد غير النسبية، وهي أعداد كتابتها العشرية غير منتهية وغير دورية، مثل √٢ وπ وَ ٠٫١٥١١٥١١١٥١ …","مجموعة الأعداد الناتجة من اتحاد النسبية وغير النسبية تسمّى الأعداد الحقيقية ويُرمز لها بالرمز ح، أي: ح = ن ∪ ن̅.","تتداخل المجموعات هكذا: ط ⊂ ص ⊂ ن ⊂ ح، أمّا النسبية وغير النسبية فلا يشتركان في أي عدد.","# تصنيف الأعداد","|العدد|المجموعات التي ينتمي إليها|السبب","|−٦|ص، ن، ح|عدد صحيح سالب","|١ ٥/٩|ن، ح|كسر عادي (١٤/٩)","|٠٫٦٨|ن، ح|عشري منتهٍ = ٦٨/١٠٠","|٠٫٢٣٢٣…|ن، ح|عشري دوري (٢٣ تتكرر)","|√٢|ن̅، ح|٢ ليس مربّعاً كاملاً","|π|ن̅، ح|كتابته العشرية لا تنتهي ولا تتكرر","|−√٩|ص، ن، ح|−√٩ = −٣","|٢/٥|ن، ح|كسر عادي","|√٦٤|ط، ص، ن، ح|√٦٤ = ٨","|٠٫١٥١١٥١١١٥…|ن̅، ح|عدد الآحاد قبل كل ٥ يزداد، فلا يوجد نمط دوري","# الجذور: متى تكون نسبية؟","- جذر العدد المربّع الكامل (أو المكعّب الكامل) عدد نسبي: √٤٩ = ٧، ∛٢٧ = ٣، ∛(−٨) = −٢.","- جذر العدد الذي ليس مربّعاً كاملاً (أو مكعباً كاملاً) عدد غير نسبي: √٢، √١٢، ∛٤.","! ليست كل الجذور غير نسبية: √٦٤ = ٨ عدد طبيعي، و∛(−١٢٥) = −٥ عدد صحيح.","# تمثيل الأعداد على خط الأعداد ومقارنتها","نمثّل العدد غير النسبي بقيمة تقريبية: π ≈ ٣٫١٤، و√٥ ≈ ٢٫٢٤ لأن ٢² = ٤ و٣² = ٩ فالجذر بين ٢ و٣ وأقرب إلى ٢.","لمقارنة عددين نكتبهما بالصورة نفسها (عشرية تقريبية أو جذرية)؛ والعدد الأبعد نحو اليمين على خط الأعداد هو الأكبر.","# أمثلة محلولة","? أكتب جميع مجموعات الأعداد التي ينتمي إليها كل عدد: (أ) ∛٥٤  (ب) ٨/٢٥  (ج) −√١٠٠. || ∛٥٤: لأن ٢٧ < ٥٤ < ٦٤ فهو ليس مكعباً كاملاً، فهو غير نسبي، فينتمي إلى غير النسبية وإلى ح فقط. ٨/٢٥ كسر، فهو ينتمي إلى ن وإلى ح. −√١٠٠ = −١٠ فهو ينتمي إلى ص وإلى ن وإلى ح.","? هل √٠٫٠٤ عدد نسبي؟ || √٠٫٠٤ = ٠٫٢ = ١/٥، فهو كسر عادي؛ إذن عدد نسبي.","? أقارن بين √٢٤ و٥٫٥. || ٥٫٥² = ٣٠٫٢٥ وهو أكبر من ٢٤، فـ ٥٫٥ أكبر من √٢٤. إذن √٢٤ < ٥٫٥.","? أقارن بين −٢/٩ و−٠٫٢. || −٢/٩ = −٠٫٢٢٢… ، وفي الأعداد السالبة يكون الأبعد عن الصفر هو الأصغر. إذن −٢/٩ < −٠٫٢.","? أقارن بين ∛٦٤ و٦٠/١٥. || ∛٦٤ = ٤، و٦٠/١٥ = ٤. إذن العددان متساويان.","? أرتّب تصاعدياً الأعداد: √٥، −π، −١/٢، ٢٫٣٣٣… || نقرّب: √٥ ≈ ٢٫٢٤، −π ≈ −٣٫١٤، −١/٢ = −٠٫٥، ٢٫٣٣٣… الترتيب: −π < −١/٢ < √٥ < ٢٫٣٣٣…","# أخطاء شائعة","! الخطأ: «√٩ غير نسبي لأنه جذر». الصواب: √٩ = ٣ عدد صحيح.","! الخطأ: «π = ٢٢/٧». الصواب: ٢٢/٧ مجرد قيمة تقريبية، أمّا π فغير نسبي.","! الخطأ: «٠٫٣٣٣… غير نسبي لأنه لا ينتهي». الصواب: العدد العشري الدوري نسبي (٠٫٣٣٣… = ١/٣)، وغير النسبي هو الذي لا ينتهي ولا يتكرر."],"q":["- أكتب جميع مجموعات الأعداد التي ينتمي إليها كل من: ٨/٢٥، −٥/١٣، ∛٥٤، ٢٫١٢١١٢١١١٢١….","- أمثّل بشكل تقريبي على خط الأعداد: −٢٫٤، √٥، −١/٦.","- أقارن بين كل عددين: (√٢٤ ، ٥٫٥)، (−٢/٩ ، −٠٫٢)، (∛٦٤ ، ٦٠/١٥).","- هل جميع الجذور التربيعية أعداد غير نسبية؟ أوضّح بأمثلة عددية.","- هل جميع الجذور التكعيبية أعداد غير نسبية؟ أوضّح بأمثلة عددية."],"quiz":[{"l":0,"k":"n","q":"اتحاد مجموعة الأعداد النسبية ومجموعة الأعداد غير النسبية يسمّى مجموعة:","o":["الأعداد الصحيحة","الأعداد الطبيعية","الأعداد غير النسبية","الأعداد الحقيقية"],"a":3},{"l":0,"k":"n","q":"أيّ الأعداد الآتية غير نسبي؟","o":["٣/٥","٠٫٧٥","√٤٩","π"],"a":3},{"l":0,"k":"n","q":"العدد ٢/٥ هو عدد:","o":["نسبي","غير نسبي","طبيعي","صحيح"],"a":0},{"l":0,"k":"n","q":"العدد √٢ هو عدد:","o":["نسبي","غير نسبي","صحيح","طبيعي"],"a":1},{"l":0,"k":"n","q":"الكتابة العشرية للعدد غير النسبي:","o":["منتهية دائماً","غير منتهية وغير دورية","دورية دائماً","منتهية أو دورية"],"a":1},{"l":0,"k":"n","q":"أيّ العلاقات الآتية صحيحة؟","o":["ن ⊂ ص","ح ⊂ ن","غير النسبية ⊂ ن","ط ⊂ ص"],"a":3},{"l":0,"k":"n","q":"قيمة ∛٢٧ تساوي:","o":["٩","٣","٢٤","٨١"],"a":1},{"l":0,"k":"n","q":"أصغر مجموعة ينتمي إليها العدد −٧ من بين الآتية هي:","o":["الأعداد الصحيحة","الأعداد الطبيعية","الأعداد غير النسبية","لا ينتمي إلى ح"],"a":0},{"l":1,"k":"p","q":"أيّ الأعداد الآتية نسبي؟","o":["√٢","√٥","√١٠","√٨١"],"a":3},{"l":1,"k":"p","q":"أيّ الأعداد الآتية ينتمي إلى مجموعة الأعداد الصحيحة؟","o":["٣/٤","√٣","−√٣٦","٠٫٥"],"a":2},{"l":1,"k":"p","q":"العدد ٠٫٦٦٦… (الرقم ٦ يتكرر) هو عدد:","o":["غير نسبي لأنه لا ينتهي","نسبي لأنه عشري دوري","صحيح","طبيعي"],"a":1} بين ٩ و١٦؟","من بين الأعداد √٤ ، ∛٨ ، √٣ ، π ، −٠٫٢٥ عدد الأعداد النسبية يساوي:":"أيّ الأعداد مربّع كامل أو مكعّب كامل؟ جذورها نسبية. أمّا √٣ وπ فغير نسبيين.","أصغر عدد صحيح أكبر من √٣٠ هو:":"جد ٥² و٦² ثم ضع ٣٠ بينهما.","عدد الأعداد الصحيحة التي تقع بين √٥ و√٥٠ يساوي:":"قرّب √٥ ≈ ٢٫٢ و√٥٠ ≈ ٧٫١ ثم عدّ الأعداد الصحيحة بينهما.","أيّ المقارنات الآتية صحيحة؟":"قارن مربّع ٥٫٥ بالعدد ٣٠."}},{"t":"جمع الأعداد الحقيقية وطرحها","e":["# نشاط تمهيدي: مبنى نقابة المهندسين في الخليل","يتوسّط المبنى مكعّب يعلوه هرم زجاجي، طول ضلع قاعدة أحد أوجهه ٣ أمتار وطول الحافة الجانبية (٣√٣)/٢ متراً.","محيط الوجه الجانبي للهرم = ٣ + (٣√٣)/٢ + (٣√٣)/٢ = ٣ + ٣√٣ ≈ ٨٫٢ متراً.","العدد الذي يمثّل المحيط عدد غير نسبي؛ فجمع عدد نسبي وعدد غير نسبي أعطانا عدداً حقيقياً غير نسبي.","# تعريف الطرح وجمع الجذور","لأيّ عددين حقيقيين أ، ب: أ − ب = أ + (−ب).","- الجذران المتشابهان: لهما العدد نفسه تحت الجذر، مثل ٣√٥ و٦√٥.","- نبسّط كل جذر أولاً (نُخرج المربّعات الكاملة)، ثم نجمع أو نطرح معاملات الجذور المتشابهة ونُبقي ما تحت الجذر كما هو.","- لا نجمع جذرين غير متشابهين: √٢ + √٣ لا تساوي √٥.","! الخطأ الشائع: ٢√٣ + ٣√٣ = ٥√٦. الصواب: ٥√٣ ؛ نجمع المعاملين ولا نغيّر ما تحت الجذر.","# خواص عملية الجمع على الأعداد الحقيقية","|الخاصية|بالرموز|مثال عددي","|الانغلاق|أ + ب ∈ ح|٤ + ١/٣ = ٤ ١/٣ ∈ ح","|التبديلية|أ + ب = ب + أ|√٢ + ٥ = ٥ + √٢","|التجميعية|(أ + ب) + جـ = أ + (ب + جـ)|(٢ + √٣) + ٥ = ٢ + (√٣ + ٥)","|العنصر المحايد الجمعي|أ + ٠ = ٠ + أ = أ|√٧ + ٠ = √٧","|النظير الجمعي|أ + (−أ) = (−أ) + أ = ٠|٣√٢ + (−٣√٢) = ٠","# حل معادلات بسيطة","لحلّ معادلة مثل س + أ = ب نطرح أ من الطرفين (النظير الجمعي)؛ فنحصل على س = ب − أ.","# أمثلة محلولة","? أبسّط: √٤٥ + ٦√٥ − √٢٠ − √٢٥. || نبسّط الجذور: √٤٥ = ٣√٥ و√٢٠ = ٢√٥ و√٢٥ = ٥. المقدار = ٣√٥ + ٦√٥ − ٢√٥ − ٥ = ٧√٥ − ٥.","? أجد ناتج √١٢ + √٢٧ بأبسط صورة. || √١٢ = ٢√٣ و√٢٧ = ٣√٣. المجموع = ٥√٣.","? أجد ناتج ٥√٢ − √٨ + √١٨. || √٨ = ٢√٢ و√١٨ = ٣√٢. الناتج = ٥√٢ − ٢√٢ + ٣√٢ = ٦√٢.","? أجد ناتج √٥٠ − √٣٢ + ٣. || √٥٠ = ٥√٢ و√٣٢ = ٤√٢. الناتج = ٥√٢ − ٤√٢ + ٣ = √٢ + ٣.","? أجد قيمة س: س + √٢ = √٥٠. || √٥٠ = ٥√٢. نطرح √٢ من الطرفين: س = ٥√٢ − √٢ = ٤√٢.","? مثلث أطوال أضلاعه √١٢ و√٢٧ و√٤٨ سم. أجد محيطه. || √١٢ = ٢√٣ و√٢٧ = ٣√٣ و√٤٨ = ٤√٣. المحيط = ٢√٣ + ٣√٣ + ٤√٣ = ٩√٣ سم.","? أذكر الخاصية المستخدمة: (أ) √٥ + ٠ = √٥  (ب) ٣√٢ + (−٣√٢) = ٠  (ج) (٢ + √٣) + ٥ = ٢ + (√٣ + ٥). || (أ) العنصر المحايد الجمعي. (ب) النظير الجمعي. (ج) التجميعية.","? أبيّن بمثال أنّ مجموعة الأعداد غير النسبية (ن̅) غير مغلقة على الجمع وعلى الطرح. || الجمع: √٢ + (−√٢) = ٠ وهو عدد نسبي لا ينتمي إلى ن̅ مع أنّ √٢ و(−√٢) ينتميان إليه. الطرح: π − π = ٠ عدد نسبي أيضاً. إذن الناتج قد يخرج من المجموعة.","# تدرّب","? أجد قيمة س: س − √٣ = ٣√٣. || نجمع √٣ للطرفين: س = ٣√٣ + √٣ = ٤√٣.","? أجد ناتج (٢ + √٣) + (٥ − √٣). || نجمع الحدود: ٢ + ٥ = ٧ و√٣ − √٣ = ٠. الناتج = ٧."],"q":["- أجد قيمة كل مما يأتي وأكتبه بأبسط صورة: ١٫٩١ + (−٠٫٢)، و−√١٢٥ + ١١.","- أبسّط: √٢٨ − (√٧ + √٦٣).","- أذكر الخاصية المستخدمة في: ٠ = (−√٤) + √٤، و٥/١٧ + (−٣) = (−٣) + ٥/١٧.","- أحلّ المعادلة: س − √٢ = √٨."],"quiz":[{"l":0,"k":"n","q":"الطرح أ − ب يساوي:","o":["أ × (−ب)","أ + (−ب)","ب − أ","أ + ب"],"a":1},{"l":0,"k":"n","q":"النظير الجمعي للعدد √٣ هو:","o":["√٣","−√٣","١/√٣","٠"],"a":1},{"l":0,"k":"n","q":"العنصر المحايد الجمعي في مجموعة الأعداد الحقيقية هو:","o":["٠","١","−١","أ"],"a":0},{"l":0,"k":"n","q":"الخاصية أ + ب = ب + أ تسمّى:","o":["التجميعية","الانغلاق","النظير الجمعي","التبديلية"],"a":3},{"l":0,"k":"n","q":"الخاصية (أ + ب) + جـ = أ + (ب + جـ) تسمّى:","o":["التبديلية","التجميعية","الانغلاق","العنصر المحايد"],"a":1},{"l":0,"k":"n","q":"أيّ الحدود الآتية يشابه الحد ٣√٥؟","o":["٧√٥","٣√٢","٥√٣","٣√١٠"],"a":0},{"l":0,"k":"n","q":"ناتج ٤√٢ + ٣√٢ هو:","o":["٧√٤","١٢√٢","٧√٢","٧"],"a":2},{"l":0,"k":"n","q":"أ + (−أ) يساوي:","o":["٠","١","٢أ","أ"],"a":0},{"l":1,"k":"p","q":"أبسط صورة للعدد √٢٠ هي:","o":["٤√٥","٢√٥","٥√٢","١٠"],"a":1},{"l":1,"k":"p","q":"ناتج √١٢ + √٣ هو:","o":["√١٥","٢√٣","٣√٣","٣√٦"],"a":2},{"l":1,"k":"p","q":"ناتج ٥√٣ − ٢√٣ − √٣ هو:","o":["٢√٣","٣√٣","٦√٣","٢"],"a":0},{"l":1,"k":"p","q":"ناتج √٤٥ − √٢٠ هو:","o":["٥√٥","٢٥","√٥","٣√٥"],"a":2},{"l":1,"k":"p","q":"ناتج ٣√٢ + √٨ هو:","o":["٥√٤","٥√٢","٣√١٠","٦√٢"],"a":1},{"l":1,"k":"p","q":"قيمة س في المعادلة س + √٣ = √٧٥ هي:","o":["٥√٣","√٧٢","٢٥√٣","٤√٣"],"a":3},{"l":1,"k":"p","q":"قيمة س في المعادلة س − √٥ = ٣√٥ هي:","o":["٤√٥","٢√٥","٣√٥","−٢√٥"],"a":0},{"l":1,"k":"p","q":"ناتج (٢ + √٣) + (٥ − √٣) هو:","o":["٧","٧ + ٢√٣","٧ − ٢√٣","٣"],"a":0},{"l":2,"k":"p","q":"محيط مثلث أطوال أضلاعه √٢٧ و√١٢ و√٤٨ سم يساوي:","o":["٦√٣ سم","١٢√٣ سم","٩√٣ سم","√٨٧ سم"],"a":2},{"l":2,"k":"p","q":"ناتج √٧٢ − √٥٠ + √٢ هو:","o":["٣√٢","√٢","٢√٢","٤√٢"],"a":2},{"l":2,"k":"p","q":"ناتج (٣√٥ − ٢) − (√٥ − ٤) هو:","o":["٢√٥ − ٦","٤√٥ + ٢","٢√٥ − ٢","٢√٥ + ٢"],"a":3},{"l":2,"k":"p","q":"مجموع عددين يساوي ٨√٣ + ٢ وأحدهما ٣√٣ − ١، فالعدد الآخر هو:","o":["٥√٣ + ١","٥√٣ + ٣","١١√٣ + ١","٥√٣ − ٣"],"a":1},{"l":2,"k":"p","q":"إذا كان س = ٢√٧ و ص = √٢٨ + √٦٣ فإن ص − س تساوي:","o":["٧√٧","٣√٧","٥√٧","√٧"],"a":1},{"l":2,"k":"p","q":"أيّ العبارات الآتية صحيحة؟","o":["٢√٣ + ٣√٣ = ٥√٣","√٣ + √٢ = √٥","٢√٣ + ٣√٣ = ٥√٦","√٩ + √١٦ = √٢٥"],"a":0},{"l":2,"k":"p","q":"قطعة سلك طولها ٦√٢ + ٤ متراً، قُطع منها ٢√٨ متراً. طول الباقي بالمتر:","o":["٢√٢ + ٤","١٠√٢ + ٤","٢√٢ − ٤","٢√٢"],"a":0},{"l":2,"k":"p","q":"قيمة س في المعادلة س − (√٥ + ٣) = ٢√٥ − ١ هي:","o":["√٥ + ٤","٣√٥ − ٤","٣√٥ + ٢","٣√٥ + ٤"],"a":2}],"hints":{"النظير الجمعي للعدد √٣ هو:":"النظير الجمعي لعدد هو العدد الذي إذا جُمع معه كان الناتج صفراً.","أبسط صورة للعدد √٢٠ هي:":"أخرج من تحت الجذر أكبر مربّع كامل: ٢٠ = ٤ × ٥.","قيمة س في المعادلة س + √٣ = √٧٥ هي:":"بسّط √٧٥ أولاً: ٧٥ = ٢٥ × ٣، ثم اطرح √٣ من الطرفين.","ناتج √٧٢ − √٥٠ + √٢ هو:":"بسّط كل جذر إلى مضاعف √٢ ثم اجمع واطرح المعاملات.","مجموع عددين يساوي ٨√٣ + ٢ وأحدهما ٣√٣ − ١، فالعدد الآخر هو:":"المقدار الآخر = المجموع − المقدار المعلوم؛ اطرح حدّاً حدّاً.","أيّ العبارات الآتية صحيحة؟":"الجذران يُجمعان بجمع المعاملين فقط إذا كان ما تحت الجذر واحداً؛ وإلا فلا يُجمعان."}},{"t":"ضرب الأعداد الحقيقية وقسمتها","e":["# نشاط تمهيدي: قبة الصخرة","قاعدة مسجد قبة الصخرة المشرّفة مثمّن منتظم، طول ضلعه يساوي تقريباً ٢١٫٦ متراً. لأن للمثمّن ٨ أضلاع متساوية فإن محيطه ≈ ٨ × ٢١٫٦ = ١٧٢٫٨ متراً.","# ضرب الجذور وقسمتها","- لكل عددين غير سالبين أ، ب: √أ × √ب = √(أ × ب).","- √أ ÷ √ب = √(أ/ب) بشرط ب > ٠.","- √٢٥٠ × √٩٠ = √٢٢٥٠٠ = ١٥٠. وبطريقة أخرى: √٢٥٠ = ٥√١٠ و√٩٠ = ٣√١٠ فالناتج ١٥ × ١٠ = ١٥٠.","- √١٨ ÷ √٢ = √٩ = ٣، أمّا √٢ ÷ √١٨ = √(١/٩) = ١/٣؛ فالقسمة ليست تبديلية.","- √٣ × √٣ = √٩ = ٣؛ وعموماً (√أ)² = أ.","# خواص عملية الضرب على الأعداد الحقيقية","|الخاصية|بالرموز|مثال عددي","|الانغلاق|أ × ب ∈ ح|٢ × √٩ = ٦ ∈ ح","|التبديلية|أ × ب = ب × أ|√١٨ × ٤ = ٤ × √١٨","|التجميعية|(أ × ب) × جـ = أ × (ب × جـ)|(٢ × ٣/٤) × (−٥) = ٢ × (٣/٤ × (−٥))","|العنصر المحايد الضربي|أ × ١ = ١ × أ = أ|٢٫٣ × ١ = ٢٫٣","|النظير الضربي|أ × ١/أ = ١ (أ ≠ ٠)|√٧ × ١/√٧ = ١","|التوزيع على الجمع والطرح|أ × (ب ± جـ) = (أ × ب) ± (أ × جـ)|√٢ × (٣ + √٢) = ٣√٢ + ٢","# إنطاق المقام","تحويل الجذور الصمّاء في مقام عدد حقيقي إلى عدد نسبي يسمّى إنطاق المقام. نضرب البسط والمقام في العدد نفسه الذي يخلّص المقام من الجذر.","- العددان ٢ + √٧ و ٢ − √٧ عددان مترافقان، وحاصل ضربهما ٢² − (√٧)² = ٤ − ٧ = −٣ عدد نسبي.","- عند إنطاق مقام على الصورة (أ + √ب) نضرب في مرافقه (أ − √ب).","! لا نضرب البسط فقط؛ نضرب البسط والمقام في العدد نفسه حتى لا تتغيّر قيمة الكسر.","# حل معادلات فيها جذور","المعادلة ٥ + √٣ س = ٢س: ننقل الحدود التي فيها س إلى طرف واحد: ٥ = ٢س − √٣ س = س(٢ − √٣)، ثم س = ٥/(٢ − √٣).","نُنطق المقام بالضرب في المرافق (٢ + √٣): س = ٥(٢ + √٣)/(٤ − ٣) = ١٠ + ٥√٣.","# أمثلة محلولة","? أجد ناتج √١٢ × √٦ بأبسط صورة. || √١٢ × √٦ = √٧٢ = √(٣٦ × ٢) = ٦√٢.","? أجد ناتج ٣√٢ × ٥√٨. || نضرب المعاملات: ٣ × ٥ = ١٥، ونضرب الجذور: √٢ × √٨ = √١٦ = ٤. الناتج = ١٥ × ٤ = ٦٠.","? أجد ناتج √٤٨ ÷ √٣. || √٤٨ ÷ √٣ = √(٤٨/٣) = √١٦ = ٤.","? أجد ناتج ٦√١٠ ÷ ٢√٥. || نقسم المعاملين: ٦ ÷ ٢ = ٣، ونقسم الجذرين: √١٠ ÷ √٥ = √٢. الناتج = ٣√٢.","? أجد ناتج √٢ (√٨ + √٣). || بالتوزيع: √٢ × √٨ + √٢ × √٣ = √١٦ + √٦ = ٤ + √٦.","? أجد ناتج (٣ + √٢)(٣ − √٢). || العددان مترافقان: ٣² − (√٢)² = ٩ − ٢ = ٧.","? أجد ناتج (٢ + √٣)(٢ + √٣). || نوزّع: ٤ + ٢√٣ + ٢√٣ + ٣ = ٧ + ٤√٣.","? أنطق مقام ٦/√٣. || نضرب في √٣/√٣: ٦√٣/٣ = ٢√٣.","? أنطق مقام ١٥/√٦. || ١٥/√٦ × √٦/√٦ = ١٥√٦/٦ = ٥√٦/٢.","? أنطق مقام ٤/(√٥ − ١). || نضرب في مرافق المقام (√٥ + ١): ٤(√٥ + ١)/(٥ − ١) = ٤(√٥ + ١)/٤ = √٥ + ١.","? أنطق مقام ١/(٢ − √٧). || نضرب في (٢ + √٧): (٢ + √٧)/(٤ − ٧) = (٢ + √٧)/(−٣) = −(٢ + √٧)/٣.","? أحلّ المعادلة √٢ س = ٦. || س = ٦/√٢ = ٦√٢/٢ = ٣√٢.","# تدرّب","? أجد ناتج √٤٥ × √٥. || √٢٢٥ = ١٥.","? أنطق مقام ١/(٢√٢). || ١/(٢√٢) × √٢/√٢ = √٢/٤."],"q":["- أجد ناتج كل مما يأتي بأبسط صورة: √٢ − √٨، و١٢٫٥ × (−√٠٫٠٤)، و√١٤٤/√٣٦ × √(١/٣٦).","- أكتب بأبسط صورة: ١/(٢√٢).","- أحلّ المعادلة ٢√٢ س = ٤ وأكتب قيمة س بأبسط صورة.","- أنطق مقام ١/(√٥ − ٢) وأكتب الناتج بأبسط صورة."],"quiz":[{"l":0,"k":"n","q":"لكل عددين غير سالبين أ، ب فإن √أ × √ب تساوي:","o":["√(أ + ب)","√(أ × ب)","√أ + √ب","أ × ب"],"a":1},{"l":0,"k":"n","q":"إنطاق المقام يعني:","o":["تحويل البسط إلى عدد صحيح","تحويل الجذور الصمّاء في المقام إلى عدد نسبي","حذف المقام من الكسر","ضرب المقام في نفسه فقط"],"a":1},{"l":0,"k":"n","q":"العدد المرافق للعدد ٣ + √٢ هو:","o":["−٣ + √٢","−٣ − √٢","٣ − √٢","٣ × √٢"],"a":2},{"l":0,"k":"n","q":"النظير الضربي للعدد ٥ هو:","o":["−٥","٥","٠","١/٥"],"a":3},{"l":0,"k":"n","q":"العنصر المحايد الضربي في مجموعة الأعداد الحقيقية هو:","o":["٠","١","−١","أ"],"a":1},{"l":0,"k":"n","q":"ناتج √٣ × √٣ هو:","o":["٦","√٦","٣","٩"],"a":2},{"l":0,"k":"n","q":"ناتج √١٦ ÷ √٤ هو:","o":["٤","٨","١٢","٢"],"a":3},{"l":0,"k":"n","q":"الخاصية أ × (ب + جـ) = أ × ب + أ × جـ تسمّى خاصية:","o":["التبديل","التجميع","النظير الضربي","التوزيع"],"a":3},{"l":1,"k":"p","q":"ناتج √٢ × √٨ هو:","o":["١٠","١٦","٤","٨"],"a":2},{"l":1,"k":"p","q":"ناتج √١٨ ÷ √٢ هو:","o":["٣","٩","٦","١٦"],"a":0},{"l":1,"k":"p","q":"ناتج ٣√٥ × ٢√٥ هو:","o":["٦√٥","١٠","٣٠","٦٥"],"a":2},{"l":1,"k":"p","q":"ناتج (٢ + √٥)(٢ − √٥) هو:","o":["١","٩","٤ − √٥","−١"],"a":3},{"l":1,"k":"p","q":"ناتج √٣ (√٣ + ٢) هو:","o":["٣ + √٣","٥√٣","٣ + ٢√٣","٣√٣ + ٢"],"a":2},{"l":1,"k":"p","q":"بعد إنطاق المقام يصبح ٦/√٣ مساوياً:","o":["٣√٢","٦√٣","√٣","٢√٣"],"a":3},{"l":1,"k":"p","q":"بعد إنطاق المقام يصبح ٤/(√٣ + ١) مساوياً:","o":["٢√٣ − ٢","٢√٣ + ٢","٤√٣ − ٤","√٣ − ١"],"a":0},{"l":1,"k":"p","q":"قيمة س في المعادلة ٢س = ٦√٥ هي:","o":["٦√٥","٣","١٢√٥","٣√٥"],"a":3},{"l":2,"k":"p","q":"مساحة مستطيل طوله √٢٠ سم وعرضه √٥ سم تساوي:","o":["٢٥ سم²","١٠√٥ سم²","١٠ سم²","٥ سم²"],"a":2},{"l":2,"k":"p","q":"مربّع مساحته ٧٢ سم². محيطه يساوي:","o":["١٢√٢ سم","٦√٢ سم","٢٤√٢ سم","٣٦√٢ سم"],"a":2},{"l":2,"k":"p","q":"ناتج (√٥ + √٢)(√٥ − √٢) هو:","o":["٧","٣","١","√٣"],"a":1},{"l":2,"k":"p","q":"ناتج ١/(√٥ − √٢) بعد إنطاق المقام:","o":["(√٥ + √٢)/٣","(√٥ + √٢)/٧","√٥ + √٢","(√٥ − √٢)/٣"],"a":0},{"l":2,"k":"p","q":"حلّ المعادلة ٥ + √٣ س = ٢س هو:","o":["١٠ + ٥√٣","١٠ − ٥√٣","٥ + ٥√٣","٥"],"a":0},{"l":2,"k":"p","q":"قيمة (٢√٣)² تساوي:","o":["٦","٤√٣","١٢","٩"],"a":2},{"l":2,"k":"p","q":"إذا كان س = √٣ + ١ و ص = √٣ − ١ فإن س × ص تساوي:","o":["٤","٢√٣","٢","٠"],"a":2},{"l":2,"k":"p","q":"ناتج (٣ − √٢)(٣ + √٢) − ٥ يساوي:","o":["٤","٢","٧","١٢"],"a":1}],"hints":{"النظير الضربي للعدد ٥ هو:":"النظير الضربي لعدد هو العدد الذي إذا ضُرب فيه كان الناتج ١.","ناتج (٢ + √٥)(٢ − √٥) هو:":"المرافق يغيّر الإشارة بين الحدّين فقط؛ ثم استعمل: (أ + ب)(أ − ب) = أ² − ب².","بعد إنطاق المقام يصبح ٦/√٣ مساوياً:":"اضرب البسط والمقام في √٣ ثم بسّط الكسر.","قيمة س في المعادلة ٢س = ٦√٥ هي:":"اقسم الطرفين على ٢.","ناتج ١/(√٥ − √٢) بعد إنطاق المقام:":"اضرب البسط والمقام في (√٥ + √٢) ثم اجمع في المقام: ٥ − ٢.","حلّ المعادلة ٥ + √٣ س = ٢س هو:":"انقل حدّي س إلى طرف واحد، واكتب س عاملاً مشتركاً، ثم أنطق المقام.","إذا كان س = √٣ + ١ و ص = √٣ − ١ فإن س × ص تساوي:":"ناتج الضرب (س)(ص) يعطي: (√٣)² − ١² ؛ احسب."}},{"t":"القيمة المطلقة","e":["# نشاط تمهيدي: البعد عن الصفر","عدد الوحدات التي يبعدها العدد الحقيقي أ عن الصفر على خط الأعداد تسمّى القيمة المطلقة للعدد أ، ويُرمز لها بالرمز |أ|.","على خط الأعداد: العدد ٢ يبعد وحدتين عن الصفر فـ |٢| = ٢، والعدد −٢ يبعد وحدتين أيضاً فـ |−٢| = ٢. إذن |٢| = |−٢| = ٢.","# التعريف","إذا كان أ ∈ ح فإن: |أ| = أ إذا كان أ ≥ ٠، و|أ| = −أ إذا كان أ < ٠.","- القيمة المطلقة لأي عدد حقيقي لا تكون سالبة أبداً: |أ| ≥ ٠.","- |أ| = |−أ| ؛ العددان المتقابلان لهما القيمة المطلقة نفسها.","- |٠| = ٠.","! إذا كان أ سالباً فإن −أ موجب؛ ولذلك |أ| = −أ لا يعني أن الناتج سالب. مثال: |−٥| = −(−٥) = ٥.","# الجذر التربيعي للمربّع","إذا كان س عدداً حقيقياً فإن √(س²) = |س|.","- √((−٣)²) = √٩ = ٣ = |−٣|.","- √(٧²) = ٧ = |٧|.","! لا نكتب √(س²) = س إلا إذا كان س ≥ ٠؛ فمثلاً √((−٣)²) = ٣ وليس −٣.","# حل معادلات من الصورة س² = عدد","المعادلة س² = ٦: نأخذ الجذر التربيعي للطرفين، فيكون √(س²) = |س| = √٦، ومنها س = √٦ أو س = −√٦، أي س = ±√٦.","! للمعادلة س² = عدد موجب حلّان لا حلّ واحد؛ والعدد السالب ليس له جذر تربيعي حقيقي.","# أمثلة محلولة","? أجد |١ − √٢|. || √٢ ≈ ١٫٤١ أكبر من ١ فالعدد ١ − √٢ سالب. إذن |١ − √٢| = −(١ − √٢) = √٢ − ١.","? أجد |٤ − ٧| و|٧ − ٤|. || |٤ − ٧| = |−٣| = ٣، و|٧ − ٤| = |٣| = ٣. نلاحظ أنهما متساويان.","? أجد |√٢ − √٣|. || √٣ أكبر من √٢ فالفرق √٢ − √٣ سالب. إذن |√٢ − √٣| = √٣ − √٢.","? أجد |π − ٤|. || π ≈ ٣٫١٤ أصغر من ٤، فالفرق π − ٤ سالب. إذن |π − ٤| = ٤ − π.","? أجد |٢√٣ − √١٢|. || √١٢ = ٢√٣ فالفرق = ٠. إذن |٢√٣ − √١٢| = |٠| = ٠.","? أجد قيمة √((٣ − π)²). || √((٣ − π)²) = |٣ − π| = π − ٣ لأن π أكبر من ٣.","? أجد قيم س التي تحقّق س² = ٩ باستخدام تعريف القيمة المطلقة. || √(س²) = |س| = √٩ = ٣. ومنها س = ٣ أو س = −٣.","? أجد قيم س التي تحقّق (س + ٧)² = ٢٠. || |س + ٧| = √٢٠ = ٢√٥. ومنها س + ٧ = ٢√٥ أو س + ٧ = −٢√٥. إذن س = −٧ + ٢√٥ أو س = −٧ − ٢√٥.","? أحلّ المعادلة |س − ٢| = ٥. || إمّا س − ٢ = ٥ فتكون س = ٧، أو س − ٢ = −٥ فتكون س = −٣.","? أجد المسافة بين العددين ٢ و−٣ على خط الأعداد. || المسافة = |٢ − (−٣)| = |٥| = ٥ وحدات.","# تدرّب","? أجد |−٥| + |٣|. || ٥ + ٣ = ٨.","? أحلّ المعادلة س² = ١١. || |س| = √١١ ومنها س = ±√١١."],"q":["- أجد قيمة كل مما يأتي: |−٥|، |١٫٦|، |٤ − ٨٧|.","- أجد قيمة |٢√٣ − √٢|.","- أجد قيم س التي تحقّق كلاً من المعادلتين باستخدام تعريف القيمة المطلقة: س² = ٣، و(س + ٧)² = ٢٠.","- أجد قيمة |٠| و|π/٢| × ٢."],"quiz":[{"l":0,"k":"n","q :"p","q":"عدد حلول المعادلة (س + ١)² = ٠ هو:","o":["حلّ واحد","حلّان","لا يوجد حلّ","ثلاثة حلول"],"a":0},{"l":2,"k":"p","q":"أيّ العبارات الآتية صحيحة لكل عدد حقيقي أ؟","o":["|أ| ≥ ٠","|أ| = أ","|أ| = −أ","|أ| > ٠"],"a":0},{"l":2,"k":"p","q":"قيمة |٣ − √٧| − |√٧ − ٣| تساوي:","o":["٦ − ٢√٧","٠","٢√٧ − ٦","٦"],"a":1}],"hints":{"|أ| = −أ عندما يكون:":"حين يكون أ سالباً يكون −أ موجباً، وهذا ما يجعل القيمة المطلقة غير سالبة.","قيمة |١ − √٣| تساوي:":"هل ١ − √٣ موجب أم سالب؟ قارن √٣ بالعدد ١ قبل أن تفكّ القيمة المطلقة.","حلّ المعادلة س² = ١١ هو:":"للمعادلة س² = عدد موجب حلّان؛ خذ الجذر التربيعي للطرفين ثم استعمل √(س²) = |س|.","حلّ المعادلة (س − ٣)² = ٥ هو:":"خذ الجذر التربيعي للطرفين: |س − ٣| = √٥، ثم افصل حالتين.","قيمة |٢√٣ − ٣√٢| تساوي:":"قارن ٢√٣ ≈ ٣٫٤٦ مع ٣√٢ ≈ ٤٫٢٤ لتعرف أيّ الفرق موجب.","قيمة |٣ − √٧| − |√٧ − ٣| تساوي:":"قارن ٣ مع √٧: أيّهما أكبر؟ ثم فكّ كلاً من القيمتين المطلقتين."}},{"t":"الأسس وقوانينها (١)","e":["# نشاط تمهيدي: تحليل الأعداد إلى عواملها الأولية","٦٤ = ٢ × ٢ × ٢ × ٢ × ٢ × ٢ = ٢⁶، و٥٠٠ = ٢ × ٢ × ٥ × ٥ × ٥ = ٢² × ٥³.","اختصرنا الضرب المتكرر بكتابة العدد وفوقه عدد مرات تكراره: هذا هو الأس.","# تعريف الأس","إذا كان أ عدداً حقيقياً وكان ن عدداً صحيحاً موجباً فإن أ^ن = أ × أ × أ × … × أ (ن مرة)، حيث أ هو الأساس، و«ن» هو الأس.","- ٨ × ٨ × ٨ × ٨ = ٨⁴.","- ١٠ × ١٠ × ١٠ × ١٠ × ١٠ × ١٠ = ١٠⁶.","- (−٧) × (−٧) × (−٧) = (−٧)³.","! (−٢)⁴ = ١٦ أمّا −٢⁴ = −١٦؛ فالأس في (−٢)⁴ يشمل الإشارة، وفي −٢⁴ يشمل العدد ٢ فقط.","# قوانين الأسس","إذا كان أ، ب عددين حقيقيين، وكان م، ن عددين صحيحين موجبين فإن:","|القانون|الصورة|مثال","|ضرب قوى الأساس نفسه|أ^م × أ^ن = أ^(م+ن)|٣⁴ × ٣² = ٣⁶ = ٧٢٩","|قسمة قوى الأساس نفسه (أ ≠ ٠)|أ^م ÷ أ^ن = أ^(م−ن)|٧⁵ ÷ ٧² = ٧³ = ٣٤٣","|قوة حاصل الضرب|(أ × ب)^ن = أ^ن × ب^ن|(٢ × ٣)³ = ٢³ × ٣³ = ٢١٦","|قوة ناتج القسمة (ب ≠ ٠)|(أ/ب)^ن = أ^ن/ب^ن|(٣/٢)⁴ = ٨١/١٦","! لا نضرب الأساسات: ٢³ × ٢⁴ = ٢⁷ وليس ٤⁷. ونجمع الأسس ولا نضربها: ٣² × ٣³ = ٣⁵ لا ٣⁶.","# الأس صفر","إذا كان أ ≠ ٠ فإن أ⁰ = ١.","نتأكّد بطريقتين لحساب ٢³/٢³: الأولى: ناتج قسمة عدد على نفسه = ١. o":["٧¹⁵","٧⁵⁴","١³","٧³"],"a":3},{"l":1,"k":"p","q":"قيمة (٢ × ٥)³ تساوي:","o":["٢٠٠","١٠٠","٢١٠","١٠٠٠"],"a":3},{"l":1,"k":"p","q":"قيمة (٢/٣)³ تساوي:","o":["٨/٢٧","٢/٢٧","٨/٩","٦/٩"],"a":0},{"l":1,"k":"p","q":"قيمة (−٣)⁴ تساوي:","o":["−٨١","١٢","−١٢","٨١"],"a":3},{"l":1,"k":"p","q":"قيمة ٦⁰ + ٤⁰ تساوي:","o":["٠","١","٢","١٠"],"a":2},{"l":1,"k":"p","q":"ناتج ٢³ × ٢⁴ ÷ ٢⁵ هو:","o":["٢¹²","٨","١٦","٤"],"a":3},{"l":1,"k":"p","q":"قيمة (√٣)⁴ تساوي:","o":["٩","٣","٦","١٢"],"a":0},{"l":2,"k":"p","q":"قيمة (٢ − √٥)⁶ × (٢ + √٥)⁶ تساوي:","o":["−١","٩","١","٠"],"a":2},{"l":2,"k":"p","q":"قيمة ٣⁵ × ٩ ÷ ٣⁴ تساوي:","o":["٢٧","٨١","٩","٦٣"],"a":0},{"l":2,"k":"p","q":"أيّ التعابير الآتية يساوي ٢⁸؟","o":["٢⁴ × ٢²","٤⁴","٨⁴","٤⁷"],"a":1},{"l":2,"k":"p","q":"قيمة ٢⁵ ÷ ٢³ + ٣² × ٣⁰ تساوي:","o":["١٣","١٠","٤٥","١٧"],"a":0},{"l":2,"k":"p","q":"إذا كان ٢^س × ٢⁴ = ٢⁹ فإن س تساوي:","o":["٤","١٣","٣٦","٥"],"a":3},{"l":2,"k":"p","q":"إذا كان ٣^س ÷ ٣² = ٨١ فإن س تساوي:","o":["٢","٦","٤","٨"],"a":1},{"l":2,"k":"p","q":"ناتج (−١)²⁵ + (−١)²⁶ هو:","o":["٠","−٢","٢","١"],"a":0},{"l":2,"k":"p","q":"قيمة ١٠⁶ ÷ (٢⁶ × ٥⁶) تساوي:","o":["١٠","٠","١٠⁶","١"],"a":3}],"hints":{"إذا كان أ ≠ ٠ فإن أ⁰ تساوي:":"ما ناتج قسمة أي عدد غير الصفر على نفسه؟ ثم طبّق قانون القسمة على الأس.","قيمة (٢/٣)³ تساوي:":"ارفع البسط والمقام كلاً إلى الأس ٣ على حدة.","قيمة (٢ − √٥)⁶ × (٢ + √٥)⁶ تساوي:":"(٢−√٥)(٢+√٥) = ٤ − ٥ = −١، ثم ارفع القوة الزوجية.","أيّ التعابير الآتية يساوي ٢⁸؟":"اكتب ٤ = ٢² ثم ارفع القوة؛ هل يمكنك المقارنة بالأسس؟ جرّب ٤⁴ = (٢²)⁴.","إذا كان ٢^س × ٢⁴ = ٢⁹ فإن س تساوي:":"الأساس واحد في الطرفين (٢)؛ جمعُ الأسس في الطرف الأيسر يجب أن يساوي ٩.","إذا كان ٣^س ÷ ٣² = ٨١ فإن س تساوي:":"اطرح أس المقام من أس البسط واجعله يساوي أس ٨١ = ٣⁴."}},{"t":"الأسس وقوانينها (٢)","e":["# نشاط تمهيدي: محمود وصهيب","كلّف المعلّم محموداً وصهيباً إيجاد قيمة ((١/٢)²)³ و(١/٢)⁶.","محمود: ((١/٢)²)³ = (١/٤)³ = ١/٤ × ١/٤ × ١/٤ = ١/٦٤.","صهيب: (١/٢)⁶ = ١/٢ × ١/٢ × ١/٢ × ١/٢ × ١/٢ × ١/٢ = ١/٦٤.","النتيجة واحدة، فنلاحظ أن ٢ × ٣ = ٦؛ نضرب الأسس عند رفع القوة إلى قوة.","# قوة القوة","إذا كان أ ≠ ٠ وكان م، ن عددين صحيحين فإن (أ^م)^ن = أ^(م×ن).","- (٢³)² = ٢⁶ = ٦٤.","- ((√٢)²)³ = (√٢)⁶ = ٢³ = ٨.","! لا تخلط: ٢³ × ٢² = ٢⁵ (نجمع الأسس)، أمّا (٢³)² = ٢⁶ (نضرب الأسس).","# الأس السالب","إذا كان أ ≠ ٠ وكان ن عدداً صحيحاً موجباً فإن أ^(−ن) = ١/أ^ن.","- ٣⁻² = ١/٣² = ١/٩.","- (٢/٣)⁻³ = ١/(٢/٣)³ = ١/(٨/٢٧) = ٢٧/٨ = (٣/٢)³؛ أي نقلب الكسر ونحوّل الأس إلى موجب.","! ٢⁻³ = ١/٨ وليس −٨؛ والأس السالب لا يجعل العدد سالباً. وكذلك ٣⁻¹ = ١/٣ لا −٣.","# المعادلات الأسّية","إذا كان أ عدداً موجباً وأ ≠ ١ وكان أ^س = أ^ن فإن س = ن. أي إذا تساوت الأساسات تساوت الأسس.","- نحلّ ٢^س = ٥١٢ بكتابة ٥١٢ = ٢⁹، ثم س = ٩.","# الأسس الكسرية","قوانين الأسس السابقة صحيحة للقوى الكسرية أيضاً. فمثلاً ٥^(١/٢) × ٥^(١/٢) = ٥¹ = ٥، وهذا يطابق √٥ × √٥ = ٥.","إذا كان أ عدداً حقيقياً موجباً، وكان م، ن عددين صحيحين موجبين فإن: أ^(١/ن) = ⁿ√أ ، وأ^(م/ن) = (ⁿ√أ)^م = ⁿ√(أ^م)، ويُسمّى ن دليل الجذر.","- ٢٧^(١/٣) = ∛٢٧ = ٣، و(−٢٧)^(١/٣) = ∛(−٢٧) = −٣، و٦٤^(١/٢) = √٦٤ = ٨.","# أمثلة محلولة","? أجد قيمة (٢³)². || (٢³)² = ٢^(٣×٢) = ٢⁶ = ٦٤.","? أجد قيمة ٤⁻². || ٤⁻² = ١/٤² = ١/١٦.","? أجد قيمة (٢/٣)⁻³. || نقلب الكسر: (٣/٢)³ = ٢٧/٨.","? أجد قيمة ٢⁻³ × ٢⁵. || ٢^(−٣+٥) = ٢² = ٤.","? أكتب بأبسط صورة (٣س² ص³)⁴. || نرفع كل عامل إلى الأس ٤: ٣⁴ × (س²)⁴ × (ص³)⁴ = ٨١ س⁸ ص¹².","? أكتب بأبسط صورة (٣م⁴)² ÷ م⁵. || (٣م⁴)² = ٩م⁸، ثم ٩م⁸ ÷ م⁵ = ٩م³.","? إذا كان ل = √٢ و م = ٣ فأجد ل⁻⁴ × م². || ل⁻⁴ = ١/(√٢)⁴ = ١/٤، وم² = ٩. الناتج = ٩/٤.","? أحلّ المعادلة ٣^س = ٨١. || ٨١ = ٣⁴ فيكون ٣^س = ٣⁴، ومنها س = ٤.","? أحلّ المعادلة ٣^س × ٩ = ٨١. || ٣^س × ٣² = ٣⁴ ⟹ ٣^(س+٢) = ٣⁴، ومنها س + ٢ = ٤، أي س = ٢.","? أحلّ المعادلة ٥^(٢س) ÷ ٥^س = ١٢٥. || ٥^(٢س−س) = ٥^س = ١٢٥ = ٥³، ومنها س = ٣.","? أجد قيمة ٨^(٢/٣) و١٦^(٣/٤). || ٨^(٢/٣) = (∛٨)² = ٢² = ٤. و١٦^(٣/٤) = (⁴√١٦)³ = ٢³ = ٨.","# تدرّب","? أجد قيمة ٢⁻¹ + ٢⁻¹. || ١/٢ + ١/٢ = ١.","? أحلّ المعادلة ٤^س = ٨. || نكتب ٤ = ٢² و٨ = ٢³ فيكون ٢^(٢س) = ٢³، ومنها ٢س = ٣، أي س = ٣/٢."],"q":["- أجد قيمة ((٢)³)²، ثم أستنتج القانون العام لقوة القوة (أ^م)^ن.","- أكتب بأبسط صورة: (٣س² ص³)⁴، و(٣م⁴)² ÷ م⁵.","- أجد قيمة س في: ٣^س = ٨١، و٥^(٢س) ÷ ٥^س = ١٢٥.","- أجد قيمة ٢٧^(١/٣) و٦٤^(١/٣) و(−٢٧)^(١/٣)."],"quiz":[{"l":0,"k":"n","q":"(أ^م)^ن تساوي:","o":["أ^(م×ن)","أ^(م+ن)","أ^(م−ن)","أ^م × أ^ن"],"a":0},{"l":0,"k":"n","q":"أ^(−ن) (أ ≠ ٠) تساوي:","o":["−أ^ن","أ^ن","١/أ^ن","−١/أ^ن"],"a":2},{"l":0,"k":"n","q":"أ^(١/ن) (أ موجب) تساوي:","o":["أ × ن","أ ÷ ن","أ^ن","الجذر النوني للعدد أ"],"a":3},{"l":0,"k":"n","q":"قيمة ٣⁻¹ تساوي:","o":["−٣","١/٣","٣","−١/٣"],"a":1},{"l":0,"k":"n","q":"(٢²)³ تساوي:","o":["٢⁵","٢⁸","٤⁵","٢⁶"],"a":3},{"l":0,"k":"n","q":"إذا كان أ^س = أ^ن حيث أ موجب وأ ≠ ١ فإن:","o":["س = أ","س = ن²","س = ن","س = ٠"],"a":2},{"l":0,"k":"n","q":"في الصورة أ^(م/ن) يسمّى العدد ن:","o":["الأساس","الأس","دليل الجذر","المعامل"],"a":2},{"l":0,"k":"n","q":"قيمة ٩^(١/٢) تساوي:","o":["٣","٤٫٥","٨١","١/٩"],"a":0},{"l":1,"k":"p","q":"قيمة (٢⁴)² تساوي:","o":["٢⁶","٢²","٤⁶","٢⁸"],"a":3},{"l":1,"k":"p","q":"قيمة ٥⁻² تساوي:","o":["−٢٥","١/٢٥","−١٠","١/١٠"],"a":1},{"l":1,"k":"p","q":"(٣س²)³ تساوي:","o":["٩س⁶","٢٧س⁵","٣س⁶","٢٧س⁶"],"a":3},{"l":1,"k":"p","q":"قيمة (١/٢)⁻³ تساوي:","o":["١/٨","٨","−٨","٦"],"a":1},{"l":1,"k":"p","q":"قيمة ٢٧^(١/٣) تساوي:","o":["٣","٩","٢٤","١٣٫٥"],"a":0},{"l":1,"k":"p","q":"حلّ المعادلة ٢^س = ١٢٨ هو:","o":["س = ٦","س = ٨","س = ٧","س = ٦٤"],"a":2},{"l":1,"k":"p","q":"ناتج (م⁴)³ ÷ م⁵ هو:","o":["م²","م⁷","م¹⁷","م¹⁵"],"a":1},{"l":1,"k":"p","q":"ناتج ٤^(١/٢) × ٤^(١/٢) هو:","o":["٢","١٦","٨","٤"],"a":3},{"l":2,"k":"p","q":"حلّ المعادلة ٣^(٢س) = ٨١ هو:","o":["س = ٤","س = ١","س = ٦","س = ٢"],"a":3},{"l":2,"k":"p","q":"حلّ المعادلة ٥^س ÷ ٥² = ١٢٥ هو:","o":["س = ٥","س = ٣","س = ١","س = ٧"],"a":0},{"l":2,"k":"p","q":"قيمة ٨^(٢/٣) تساوي:","o":["٤","١٦","٢","٨/٣"],"a":0},{"l":2,"k":"p","q":"ناتج ٢⁻³ × ٢⁵ هو:","o":["١/٤","٨","١٦","٤"],"a":3},{"l":2,"k":"p","q":"قيمة (١/٣)⁻² + ٣⁻² تساوي:","o":["٢٠/٩","٨٢/٩","٩","٩٠/٩"],"a":1},{"l":2,"k":"p","q":"إذا كان ل = √٢ و م = ٣ فإن ل⁻⁴ × م² تساوي:","o":["٩/٢","٣٦","٩/٤","٤/٩"],"a":2},{"l":2,"k":"p","q":"قيمة ٢⁻¹ + ٢⁻¹ تساوي:","o":["١","١/٤","١/٢","٢"],"a":0},{"l":2,"k":"p","q":"حلّ المعادلة ٤^س = ٨ هو:","o":["س = ٣/٢","س = ٢","س = ٣","س = ٢/٣"],"a":0}],"hints":{"أ^(−ن) (أ ≠ ٠) تساوي:":"الأس السالب لا يجعل العدد سالباً؛ بل يقلب العدد (مقلوب).","قيمة ٢٧^(١/٣) تساوي:":"٢٧ = ٣³؛ فما العدد الذي مكعّبه ٢٧؟","حلّ المعادلة ٣^(٢س) = ٨١ هو:":"اكتب ٨١ = ٣⁴ ثم ساوِ الأسّين: ٢س = ٤.","قيمة ٨^(٢/٣) تساوي:":"٨^(٢/٣) = (∛٨)²: احسب الجذر التكعيبي أولاً.","قيمة (١/٣)⁻² + ٣⁻² تساوي:":"(١/٣)⁻² = ٣² = ٩، و٣⁻² = ١/٩؛ اجمعهما.","إذا كان ل = √٢ و م = ٣ فإن ل⁻⁴ × م² تساوي:":"ل⁻⁴ = ١/ل⁴، و(√٢)⁴ = ((√٢)²)² = ٤.","حلّ المعادلة ٤^س = ٨ هو:":"اكتب ٤ = ٢² و٨ = ٢³ ثم ساوِ الأسّين."}},{"t":"المسافة بين نقطتين","e":["# نشاط تمهيدي: أقصر طريق بين مئذنتين","للمسجد الأقصى عدّة مآذن. أراد شخص أن ينتقل من مئذنة باب الأسباط إلى مئذنة باب السلسلة، وأمامه مسلكان: الأول من مئذنة باب الأسباط إلى مئذنة باب الغوانمة ثم إلى مئذنة باب السلسلة، والثاني مباشرةً في خطّ مستقيم.","المسلك الثاني (القطعة المستقيمة) هو الأقصر؛ فالمسافة بين نقطتين هي طول القطعة المستقيمة الواصلة بينهما، فكيف نحسبها في المستوى الديكارتي؟","نمثّل النقاط أ(٠ ، ٠)، ب(٤ ، ٠)، جـ(٤ ، ٣). المثلث أ ب جـ قائم الزاوية في ب. المسافة أ ب = ٤ − ٠ = ٤ وحدات (فرق السينات)، والمسافة ب جـ = ٣ − ٠ = ٣ وحدات (فرق الصادات).","وبنظرية فيثاغورس: أ جـ² = ٤² + ٣² = ١٦ + ٩ = ٢٥، إذن أ جـ = ٥ وحدات.","# قانون المسافة بين نقطتين","لتكن أ(س₁ ، ص₁) وب(س₂ ، ص₂) نقطتين في المستوى. نرسم من أ خطاً أفقياً ومن ب خطاً رأسياً يلتقيان في جـ(س₂ ، ص₁). فيكون طول الضلع الأفقي = س₂ − س₁ وطول الضلع الرأسي = ص₂ − ص₁، والمسافة أ ب هي وتر المثلث القائم.","- المسافة أ ب = √((س₂ − س₁)² + (ص₂ − ص₁)²)","- ترتيب النقطتين لا يهمّ؛ لأن مربّع الفرق لا يتغيّر إذا عكسنا الطرح.","- المسافة دائماً عدد غير سالب، وتساوي صفراً فقط إذا انطبقت النقطتان.","- إذا كانت النقطتان على خطّ أفقي (ص₁ = ص₂) فالمسافة = |س₂ − س₁|، وإذا كانتا على خطّ رأسي (س₁ = س₂) فالمسافة = |ص₂ − ص₁|.","! خطأ شائع: نسيان الجذر التربيعي في النهاية، أو جمع الإحداثيات بدل طرحها، أو طرح س من ص.","# أمثلة محلولة","? إذا كانت م(−٢ ، −٢)، ن(٢ ، ١)، أجد المسافة م ن. || م ن = √((٢ − (−٢))² + (١ − (−٢))²) = √(٤² + ٣²) = √(١٦ + ٩) = √٢٥ = ٥ وحدات.","? أجد المسافة بين ن(٢ ، ١) وَ ل(٦ ، ٤). || ن ل = √((٦ − ٢)² + (٤ − ١)²) = √(١٦ + ٩) = ٥ وحدات.","? أحسب المسافة بين أ(٢ ، ٧) وَ ب(٦ ، ١١). || أ ب = √((٦ − ٢)² + (١١ − ٧)²) = √(١٦ + ١٦) = √٣٢ = ٤√٢ وحدة.","? أحسب المسافة بين م(٥ ، −٢) وَ ن(−١ ، ٦). || م ن = √((−١ − ٥)² + (٦ − (−٢))²) = √(٣٦ + ٦٤) = √١٠٠ = ١٠ وحدات.","# النقاط على استقامة واحدة","إذا كانت م(−٢ ، −٢)، ن(٢ ، ١)، ل(٦ ، ٤) فإن م ن = ٥ وحدات، ون ل = ٥ وحدات، وَ م ل = √(٨² + ٦²) = ١٠ وحدات. لاحظ أن م ن + ن ل = م ل.","- إذا كان مجموع طولي قطعتين = طول القطعة الثالثة (أ ب + ب جـ = أ جـ) فالنقاط أ، ب، جـ تقع على استقامة واحدة.","- أما إذا كان مجموع أقصر مسافتين أكبر من الثالثة فهي رؤوس مثلث.","? هل النقاط أ(−٢ ، ٥)، ب(٣ ، ٣)، جـ(−٤ ، ٣) تقع على استقامة واحدة؟ || أ ب = √(٥² + ٢²) = √٢٩ ≈ ٥٫٤، وَ ب جـ = ٧، وَ أ جـ = √(٢² + ٢²) = √٨ ≈ ٢٫٨. أقصر مجموع: ٢٫٨ + ٥٫٤ = ٨٫٢ ≠ ٧ (طول الأطول)، فلا تقع على استقامة واحدة.","# تحديد نوع المثلث من أطوال أضلاعه","- متساوي الأضلاع: الأضلاع الثلاثة متساوية.","- متساوي الساقين: ضلعان متساويان.","- قائم الزاوية: مربّع أطول ضلع = مجموع مربّعي الضلعين الآخرين (عكس نظرية فيثاغورس).","? ما نوع المثلث ك ل م الذي رؤوسه ك(٠ ، ٤)، ل(٢ ، ٢)، م(٠ ، ٠)؟ || ك ل = √(٤ + ٤) = √٨، ك م = ٤، ل م = √(٤ + ٤) = √٨. ك ل = ل م فالمثلث متساوي الساقين، وَ ك ل² + ل م² = ٨ + ٨ = ١٦ = ك م² فهو أيضاً قائم الزاوية في ل: متساوي الساقين وقائم الزاوية.","? ما نوع المثلث الذي رؤوسه أ(١ ، ٤)، ب(−١ ، −٢)، جـ(٢ ، −٣)؟ || أ ب² = ٤ + ٣٦ = ٤٠، أ جـ² = ١ + ٤٩ = ٥٠، ب جـ² = ٩ + ١ = ١٠. الأضلاع مختلفة، وَ أ ب² + ب جـ² = ٤٠ + ١٠ = ٥٠ = أ جـ². فهو قائم الزاوية في ب ومختلف الأضلاع.","? أبيّن أن أ(٢ ، ٤)، ب(−٣ ، ٠)، جـ(−٧ ، ٥)، د(−٢ ، ٩) رؤوس مربّع. || أ ب² = ٢٥ + ١٦ = ٤١، ب جـ² = ١٦ + ٢٥ = ٤١، جـ د² = ٢٥ + ١٦ = ٤١، د أ² = ١٦ + ٢٥ = ٤١: الأضلاع الأربعة متساوية. القطران: أ جـ² = ٨١ + ١ = ٨٢ وَ ب د² = ١ + ٨١ = ٨٢ متساويان. شكل رباعي أضلاعه متساوية وقطراه متساويان فهو مربّع.","# إيجاد إحداثي مجهول من المسافة","? إذا كانت المسافة بين م(أ ، ٧) وَ ن(−٢ ، ٣) تساوي ٥ وحدات، أجد قيمة/قيم أ. || ٥ = √((−٢ − أ)² + (٣ − ٧)²) فنربّع: ٢٥ = (أ + ٢)² + ١٦، أي (أ + ٢)² = ٩. إذن أ + ٢ = ٣ أو أ + ٢ = −٣، فأ = ١ أو أ = −٥. (بالتحليل: أ² + ٤أ − ٥ = ٠ أي (أ + ٥)(أ − ١) = ٠.)","! لاحظ أن المعادلة التربيعية قد تعطي قيمتين للمجهول، وكلتاهما مقبولة لأن هناك نقطتين على المستوى تبعدان المسافة نفسها.","# تدرّب","? أجد قيمة/قيم أ إذا كانت المسافة بين ل(أ ، ٧) وَ ك(٣أ − ١ ، −٥) تساوي ١٣ وحدة. || ١٣² = (٣أ − ١ − أ)² + (−٥ − ٧)²، أي ١٦٩ = (٢أ − ١)² + ١٤٤، فَ (٢أ − ١)² = ٢٥. إذن ٢أ − ١ = ٥ أو ٢أ − ١ = −٥، فأ = ٣ أو أ = −٢.","? هل النقاط أ(−٢ ، ٥)، ب(٣ ، ٣)، جـ(−٤ ، ٣) على استقامة واحدة؟ || كما في المثال أعلاه: لا، لأن مجموع أصغر طولين لا يساوي الأكبر."],"q":["- ما قانون المسافة بين النقطتين (س₁ ، ص₁) وَ (س₂ ، ص₂)؟ ومن أي نظرية نشتقّه؟","- أحسب المسافة بين النقطتين أ(٢ ، ٧) وَ ب(٦ ، ١١).","- كيف أعرف من أطوال الأضلاع أن المثلث قائم الزاوية؟ أبيّن ذلك للمثلث الذي رؤوسه أ(١ ، ٤)، ب(−١ ، −٢)، جـ(٢ ، −٣).","- إذا كانت المسافة بين ل(أ ، ٧) وَ ك(٣أ − ١ ، −٥) تساوي ١٣ وحدة، أجد قيمة/قيم أ.","- كيف أستخدم المسافات لأعرف إن كانت ثلاث نقاط على استقامة واحدة؟ أطبّق ذلك على أ(−٢ ، ٥)، ب(٣ ، ٣)، جـ(−٤ ، ٣)."],"quiz":[{"l":0,"k":"n","q":"قانون المسافة بين النقطتين (س₁ ، ص₁) وَ (س₂ ، ص₂) هو:","o":["(س₂ − س₁)² + (ص₂ − ص₁)²","√((س₂ − س₁)² + (ص₂ − ص₁)²)","√((س₂ + س₁)² + (ص₂ + ص₁)²)","(س₂ − س₁) + (ص₂ − ص₁)"],"a":1},{"l":0,"k":"n","q":"يُشتقّ قانون المسافة بين نقطتين من:","o":["نظرية فيثاغورس","نظرية طاليس","خاصية الزوايا المتبادلة","قانون الجيب"],"a":0},{"l":0,"k":"n","q":"المسافة بين النقطتين (٠ ، ٠) وَ (٣ ، ٤) تساوي:","o":["٧","١","٢٥","٥"],"a":3},{"l":0,"k":"n","q":"المسافة بين النقطتين (١ ، ٢) وَ (١ ، ٧) تساوي:","o":["٦","٧","٥","٢"],"a":2},{"l":0,"k":"n","q":"إذا كان أ ب + ب جـ = أ جـ فإن النقاط أ، ب، جـ:","o":["رؤوس مثلث قائم","تقع على استقامة واحدة","رؤوس مثلث متساوي الأضلاع","تقع على دائرة واحدة"],"a":1},{"l":0,"k":"n","q":"يكون المثلث متساوي الساقين إذا كان فيه:","o":["ضلعان متساويان في الطول","زاويتان مجموعات النقاط الآتية تقع على استقامة واحدة؟","o":["(١ ، ١)، (٢ ، ٣)، (٤ ، ٧)","(٠ ، ٠)، (٢ ، ١)، (٣ ، ٣)","(١ ، ٢)، (٢ ، ٥)، (٣ ، ٦)","(٠ ، ١)، (١ ، ٣)، (٢ ، ٦)"],"a":0},{"l":2,"k":"p","q":"أيّ المثلثات الآتية قائم الزاوية؟ المثلث الذي رؤوسه:","o":["(٠ ، ٠)، (٤ ، ٠)، (٢ ، ٣)","(٠ ، ٠)، (٤ ، ٠)، (٥ ، ٣)","(٠ ، ٠)، (٣ ، ٠)، (١ ، ٣)","(٠ ، ٠)، (٤ ، ٠)، (٤ ، ٣)"],"a":3},{"l":2,"k":"p","q":"أطوال أضلاع المثلث الذي رؤوسه (٠ ، ٠)، (٣ ، ٤)، (٦ ، ٠) هي:","o":["٣ ، ٤ ، ٥","٥ ، ٦ ، ٧","٥ ، ٥ ، ٦","٥ ، ٥ ، ١٠"],"a":2}],"hints":{"قانون المسافة بين النقطتين (س₁ ، ص₁) وَ (س₂ ، ص₂) هو:":"ارسم المثلث القائم الذي وتره المسافة المطلوبة؛ ضلعاه فرق السينات وفرق الصادات.","المسافة بين النقطتين (٣ ، ٢) وَ (٥ ، ٦) تساوي:":"احسب فرق السينات وفرق الصادات، ربّع كلاً منهما، اجمع ثم خذ الجذر التربيعي، وبسّط إن أمكن.","إذا كانت المسافة بين (أ ، ١) وَ (٤ ، ٥) تساوي ٥ وحدات فإن قيمتي أ هما:":"ربّع طرفي المعادلة لتتخلّص من الجذر، ثم تذكّر أن (٤ − أ)² = ٩ لها حلّان.","أيّ مجموعات النقاط الآتية تقع على استقامة واحدة؟":"احسب ميل أو مسافات كل ثلاث نقاط؛ في الاستقامة الواحدة يساوي أكبر طول مجموع الطولين الآخرين."}},{"t":"إحداثيات منتصف القطعة المستقيمة","e":["# نشاط تمهيدي: منتصف الملعب","خطّطت اللجنة الرياضية ملعباً وبقي تحديد نقطة منتصفه. اقترح محمد استخدام خيط يُشدّ بين طرفي الملعب. ويمكن في المستوى الديكارتي تحديد المنتصف بالحساب من الإحداثيات دون خيط.","نمثّل النقطتين أ(−١ ، ٤)، ب(٥ ، ٢) ونصل بينهما، ثم نمثّل جـ(٢ ، ٣). عند قياس المسافة من جـ إلى كلٍّ من أ وب بالمسطرة نجدهما متساويتين: جـ هي منتصف القطعة أ ب.","نلاحظ أن: ٢ = (−١ + ٥)/٢ وأن ٣ = (٤ + ٢)/٢. أي أن كل إحداثي من المنتصف هو متوسط الإحداثيين المقابلين.","# قانون نقطة المنتصف","إذا كانت أ(س₁ ، ص₁)، ب(س₂ ، ص₂) نقطتين في المستوى الديكارتي، فإن إحداثيات منتصف القطعة المستقيمة أ ب هي:","- ((س₁ + س₂)/٢ ، (ص₁ + ص₂)/٢)","- نجمع السينين ونقسم على ٢، ونجمع الصادين ونقسم على ٢.","- منتصف القطعة يبعد المسافة نفسها عن طرفيها، ويقسمها إلى قطعتين متساويتين.","- ترتيب الطرفين لا يغيّر الناتج لأن الجمع إبدالي.","! خطأ شائع: طرح الإحداثيين بدل جمعهما (هذا قانون المسافة والميل لا المنتصف)، أو نسيان القسمة على ٢.","# أمثلة محلولة","? أجد منتصف القطعة أ ب حيث أ(٢ ، ٤)، ب(٦ ، ٠). || السيني = (٢ + ٦)/٢ = ٤، والصادي = (٤ + ٠)/٢ = ٢. المنتصف (٤ ، ٢).","? أجد منتصف القطعة أ ب حيث أ(٧ ، −٥)، ب(−٣ ، ٥). || السيني = (٧ + (−٣))/٢ = ٤/٢ = ٢، والصادي = (−٥ + ٥)/٢ = ٠. المنتصف (٢ ، ٠).","? لتكن أ(٩ ، ٣)، ب(٥ ، ١)، جـ(−٤ ، ٨). أجد منتصف أ ب ومنتصف أ جـ. || منتصف أ ب = ((٩ + ٥)/٢ ، (٣ + ١)/٢) = (٧ ، ٢). منتصف أ جـ = ((٩ − ٤)/٢ ، (٣ + ٨)/٢) = (٥/٢ ، ١١/٢).","# إيجاد أحد الطرفين إذا عُلم المنتصف والطرف الآخر","? أ، ب، جـ ثلاثة مواقع في المستوى، الموقع ب(٦ ، −٤) هو منتصف أ جـ، وموقع أ(٥ ، −٣). ما موقع جـ؟ || نفرض جـ(س₂ ، ص₂). (٦ ، −٤) = ((٥ + س₂)/٢ ، (−٣ + ص₂)/٢). من السيني: ٥ + س₂ = ١٢ فَ س₂ = ٧. ومن الصادي: −٣ + ص₂ = −٨ فَ ص₂ = −٥. موقع جـ (٧ ، −٥).","? إذا كانت جـ(س ، −٣) منتصف أ ب حيث أ(−٣ ، ص)، ب(٩ ، ١١)، أجد س وَ ص. || س = (−٣ + ٩)/٢ = ٣. وَ −٣ = (ص + ١١)/٢ فَ ص + ١١ = −٦ فَ ص = −١٧.","- طريقة مختصرة: الطرف الآخر = ٢ × المنتصف − الطرف المعلوم (لكل إحداثي).","# متوازي الأضلاع والقطران","قطرا متوازي الأضلاع ينصّف كلٌّ منهما الآخر، أي أن لهما المنتصف نفسه (نقطة تقاطع القطرين).","? رُسم متوازي الأضلاع أ ب جـ د حيث أ(٣ ، ٢)، ب(٤ ، −٥)، جـ(٠ ، −٣). أجد نقطة تقاطع قطريه ثم إحداثيي د. || نقطة التقاطع م هي منتصف القطر أ جـ: ((٣ + ٠)/٢ ، (٢ − ٣)/٢) = (٣/٢ ، −١/٢). وهي أيضاً منتصف ب د: ٣/٢ = (٤ + س)/٢ فَ س = −١، وَ −١/٢ = (−٥ + ص)/٢ فَ ص = ٤. إذن د(−١ ، ٤).","# نقاط على استقامة واحدة متساوية البعد","? أ، ب، جـ، د أربع نقاط على استقامة واحدة، أ ب = ب جـ = جـ د، حيث أ(١ ، ٣)، جـ(٥ ، ١). أجد ب ود. || أ ب = ب جـ يعني أن ب منتصف أ جـ: ب = ((١ + ٥)/٢ ، (٣ + ١)/٢) = (٣ ، ٢). وَ ب جـ = جـ د يعني أن جـ منتصف ب د: (٥ ، ١) = ((٣ + س)/٢ ، (٢ + ص)/٢) فَ س = ٧ وَ ص = ٠. د(٧ ، ٠).","? أ ب جـ مثلث فيه أ ب = أ جـ، أ(−٣ ، ٠)، ب(٣ ، ٤)، جـ(١ ، −٦). أجد طول القطعة المرسومة من أ على منتصف ب جـ. || منتصف ب جـ = ((٣ + ١)/٢ ، (٤ − ٦)/٢) = (٢ ، −١). الطول = √((٢ − (−٣))² + (−١ − ٠)²) = √(٢٥ + ١) = √٢٦ وحدة.","# تدرّب","? أجد إحداثيي منتصف أ ب حيث أ(٧ ، −٥)، ب(−٣ ، ٥). || (٢ ، ٠) كما في المثال الثاني.","? أجد منتصف القطعة التي طرفاها (−٤ ، ٣) وَ (٢ ، −١). || ((−٤ + ٢)/٢ ، (٣ − ١)/٢) = (−١ ، ١)."],"q":["- ما قانون إحداثيي منتصف القطعة المستقيمة أ ب؟ ولماذا يبعد المنتصف المسافة نفسها عن الطرفين؟","- أجد إحداثيي جـ منتصف أ ب في كلّ من: أ(٢ ، ٤)، ب(٦ ، ٠) وَ أ(٧ ، −٥)، ب(−٣ ، ٥).","- إذا كانت جـ(س ، −٣) منتصف أ ب، أ(−٣ ، ص)، ب(٩ ، ١١)، أجد كلاً من س وَ ص.","- منتصف القطعة أ ب هو (٦ ، −٤) وطرفها أ(٥ ، −٣). كيف أجد الطرف الآخر؟","- كيف أجد الرأس الرابع د لمتوازي أضلاع إذا علمتُ ثلاثة رؤوس منه؟"],"quiz":[{"l":0,"k":"n","q":"إحداثيا منتصف القطعة المستقيمة الواصلة بين (س₁ ، ص₁) وَ (س₂ ، ص₂) هما:","o":["((س₂ − س₁)/٢ ، (ص₂ − ص₁)/٢)","(س₁ + س₂ ، ص₁ + ص₂)","((س₁ + س₂)/٢ ، (ص₁ + ص₂)/٢)","((س₁ + ص₁)/٢ ، (س₂ + ص₂)/٢)"],"a":2},{"l":0,"k":"n","q":"نقطة منتصف القطعة المستقيمة تكون:","o":["أقرب إلى الطرف الأول","على البعد نفسه من الطرفين","أبعد عن الطرف الثاني","خارج القطعة"],"a":1},{"l":0,"k":"n","q":"منتصف القطعة الواصلة بين (٠ ، ٠) وَ (٤ ، ٦) هو:","o":["(٢ ، ٣)","(٤ ، ٦)","(٨ ، ١٢)","(٢ ، ٦)"],"a":0},{"l":0,"k":"n","q":"السيني لمنتصف القطعة الواصلة بين (٢ ، ١) وَ (٨ ، ٥) يساوي:","o":["٦","٣","١٠","٥"],"a":3},{"l":0,"k":"n","q":"منتصف القطعة الواصلة بين (١ ، ٥) وَ (٧ ، ٥) هو:","o":["(٣ ، ٥)","(٨ ، ١٠)","(٤ ، ٥)","(٤ ، ٠)"],"a":2},{"l":0,"k":"n","q":"قطرا متوازي الأضلاع:","o":["متعامدان دائماً","ينصّف كلٌّ منهما الآخر","متساويان في الطول دائماً","لا يتقاطعان"],"a":1},{"l":0,"k":"n","q":"إذا كانت جـ منتصف أ ب فإن:","o":["أ جـ = جـ ب","أ جـ = ٢ جـ ب","أ جـ + جـ ب = ٠","أ ب = جـ ب"],"a":0},{"l":0,"k":"n","q":"إذا كان منتصف القطعة أ ب هو م فإن إحداثيات الطرف ب تساوي:","o":["٢ × (إحداثيات أ) + (إحداثيات م)","(إحداثيات م) − (إحداثيات أ)","(إحداثيات أ) + (إحداثيات م)","٢ × (إحداثيات م) − (إحداثيات أ)"],"a":3},{"l":1,"k":"p","q":"منتصف القطعة التي طرفاها (٢ ، ٤) وَ (٦ ، ٠) هو:","o":["(٤ ، ٤)","(٨ ، ٤)","(٤ ، ٢)","(٢ ، ٢)"],"a":2},{"l":1,"k":"p","q":"منتصف القطعة التي طرفاها (٧ ، −٥) وَ (−٣ ، ٥) هو:","o":["(٥ ، ٠)","(٢ ، ٠)","(٢ ، ٥)","(٤ ، ٠)"],"a":1},{" بّع (نقطة تقاطع قطريه) هو:","o":["(٦ ، ٤)","(٢ ، ٣)","(١٢ ، ٨)","(٣ ، ٢)"],"a":3}],"hints":{"إحداثيا منتصف القطعة المستقيمة الواصلة بين (س₁ ، ص₁) وَ (س₂ ، ص₂) هما:":"المنتصف هو متوسط الإحداثيين: اجمع ثم اقسم على ٢ لكل إحداثي على حدة.","منتصف القطعة أ ب هو م(٦ ، −٤) وطرفها أ(٥ ، −٣). إحداثيا ب هما:":"اكتب (٥ + س)/٢ = ٦ و(−٣ + ص)/٢ = −٤ ثم حلّ كلاً منهما.","أ ب جـ د متوازي أضلاع فيه أ(١ ، ١)، ب(٥ ، ٢)، جـ(٦ ، ٦). إحداثيا الرأس د هما:":"قطرا متوازي الأضلاع ينصّف كل منهما الآخر: منتصف أ جـ هو نفسه منتصف ب د."}},{"t":"ميل الخط المستقيم","e":["# نشاط تمهيدي: ميل السطح المائل","يشترط قانون دمج ذوي الإعاقة في المدارس وجود سطوح مائلة تسهّل حركة الكراسي المتحركة، وتسمح الإرشادات بارتفاع عمودي أقصاه متر واحد لكل ١٢ متراً أفقياً. النسبة ١/١٢ تسمّى ميل السطح المائل، وتصف شدّة انحداره.","إذا كان الارتفاع العمودي ١/٢ متر فإن أقلّ بُعد أفقي مناسب = ١٢ × ١/٢ = ٦ أمتار. وميل السطح = الارتفاع ÷ البعد الأفقي = ١/١٢.","أيّهما أكثر انحداراً: سطح ميله ١/١٢ أم سطح ميله ١/١٥؟ ١/١٢ أكبر من ١/١٥، فهو الأكثر انحداراً. كلما كبر الميل زاد الانحدار.","# تعريف ميل الخط المستقيم","إذا كانت أ(س₁ ، ص₁)، ب(س₂ ، ص₂) نقطتين على الخط المستقيم أ ب فإن ميل الخط المستقيم أ ب (م) = التغيّر العمودي ÷ التغيّر الأفقي = Δص / Δس = (ص₂ − ص₁)/(س₂ − س₁)، حيث س₂ ≠ س₁.","- التغيّر العمودي هو فرق الصادات، والتغيّر الأفقي هو فرق السينات.","- لا يتغيّر الميل باختيار نقطتين أخريين على الخط نفسه، ولا بتبديل ترتيب النقطتين (ما دمنا نحافظ على الترتيب نفسه في البسط والمقام).","- ميل موجب: الخط صاعد من اليسار إلى اليمين. ميل سالب: الخط هابط. وكلما زادت القيمة المطلقة للميل زاد الانحدار.","! خطأ شائع: عكس الترتيب في أحد الفرقين (ص₂ − ص₁ فوق وَ س₁ − س₂ تحت) فتنعكس إشارة الميل.","# أمثلة محلولة","? أجد ميل الخط المستقيم المارّ بالنقطتين (٣ ، ٥) وَ (٠ ، −٢). || م = (−٢ − ٥)/(٠ − ٣) = (−٧)/(−٣) = ٧/٣.","? أجد ميل الخط المستقيم ر ل حيث ر(−٤ ، ٣)، ل(٠ ، ١). || م = (١ − ٣)/(٠ − (−٤)) = −٢/٤ = −١/٢. الميل سالب فالخط هابط.","? أجد ميل الخط المستقيم أ ب حيث أ(−١ ، ٢)، ب(٥ ، ٤). || م = (٤ − ٢)/(٥ − (−١)) = ٢/٦ = ١/٣.","# الميل والزاوية","ميل الخط المستقيم = ظا هـ، حيث هـ الزاوية التي يصنعها الخط المستقيم مع محور السينات الموجب. (في مثلث قائم يُمثّل الميل ظلّ الزاوية: المقابل ÷ المجاور، وتتساوى الزوايا المتناظرة فيتساوى الميل عند أي نقطتين.)","? أجد ميل الخط المستقيم الذي يصنع زاوية قياسها ٦٠° مع محور السينات الموجب. || م = ظا ٦٠° = √٣.","? أجد ميل الخط المستقيم أ ب إذا كانت زاوية ميله = ٤٥°. || م = ظا ٤٥° = ١.","# الخط الأفقي والخط الرأسي","- الخط الأفقي (الموازي لمحور السينات): ص₂ = ص₁ فالبسط = ٠ وميله = ٠.","- الخط الرأسي (الموازي لمحور الصادات): س₂ = س₁ فالمقام = ٠، وميله غير معرّف (لا نقسم على صفر).","? أجد ميل الخط المار بالنقطتين أ(٢ ، ١) وَ ب(−١ ، ١). || م = (١ − ١)/(−١ − ٢) = ٠/(−٣) = ٠. الخط أ ب يوازي محور السينات.","? أجد ميل الخط المار بالنقطتين ل(٢ ، ١) وَ ر(٢ ، ٣). || س₂ − س₁ = ٢ − ٢ = ٠ فالميل غير معرّف. الخط ر ل يوازي محور الصادات.","# استقامة النقاط بالميل","تقع ثلاث نقاط أ، ب، جـ على استقامة واحدة إذا تساوى ميل أ ب مع ميل ب جـ (فهما على الخط نفسه لأنهما يشتركان بالنقطة ب).","? أبيّن باستخدام الميل أن النقاط أ(٢ ، −١)، ب(٣ ، ٢)، جـ(٤ ، ٥) تقع على استقامة واحدة. || ميل أ ب = (٢ − (−١))/(٣ − ٢) = ٣. ميل ب جـ = (٥ − ٢)/(٤ − ٣) = ٣. الميلان متساويان والنقطة ب مشتركة، فالنقاط الثلاث على استقامة واحدة.","? هل الخط المار بالنقطتين (٢ ، ٤)، (٤ ، ٥) أكثر انحداراً من الخط المار بالنقطتين (١ ، ٤)، (٤ ، ٥)؟ || ميل الأول = (٥ − ٤)/(٤ − ٢) = ١/٢، وميل الثاني = (٥ − ٤)/(٤ − ١) = ١/٣. ١/٢ > ١/٣ فالأول أكثر انحداراً.","# تدرّب","? أجد ميل أ ب إذا كانت أ(٢ ، −١)، ب(٤ ، −١). || م = ٠/٢ = ٠ (خط أفقي).","? سطح مائل ارتفاعه ٢ م وبعده الأفقي ٢٤ م. ما ميله؟ وهل هو مناسب لكرسي متحرك (ميل أقصى ١/١٢)؟ || الميل = ٢/٢٤ = ١/١٢، وهو الحدّ الأقصى المسموح فهو مناسب."],"q":["- كيف أحسب ميل الخط المستقيم المارّ بالنقطتين أ(س₁ ، ص₁) وَ ب(س₂ ، ص₂)؟ ومتى يكون الميل غير معرّف؟","- أجد ميل الخط المستقيم أ ب في كلّ من: أ(−١ ، ٢)، ب(٥ ، ٤) وَ أ(٢ ، −١)، ب(٤ ، −١).","- ما الميل الذي يصنع مع محور السينات الموجب زاوية ٤٥°؟ وما ميل الخط الأفقي وميل الخط الرأسي؟","- أبيّن باستخدام الميل أن النقاط أ(٢ ، −١)، ب(٣ ، ٢)، جـ(٤ ، ٥) تقع على استقامة واحدة.","- كيف أعرف من الميل أيّ خطّين أكثر انحداراً؟ وماذا يعني الميل السالب؟"],"quiz":[{"l":0,"k":"n","q":"ميل الخط المستقيم المارّ بالنقطتين (س₁ ، ص₁) وَ (س₂ ، ص₂) يساوي:","o":["(ص₂ − ص₁)/(س₂ − س₁)","(س₂ − س₁)/(ص₂ − ص₁)","(ص₂ + ص₁)/(س₂ + س₁)","(ص₂ − ص₁) × (س₂ − س₁)"],"a":0},{"l":0,"k":"n","q":"ميل الخط المستقيم الموازي لمحور السينات يساوي:","o":["١","−١","غير معرّف","صفراً"],"a":3},{"l":0,"k":"n","q":"ميل الخط المستقيم الموازي لمحور الصادات هو:","o":["صفر","١","غير معرّف","−١"],"a":2},{"l":0,"k":"n","q":"ميل الخط المستقيم يساوي ظا هـ حيث هـ هي الزاوية التي يصنعها الخط مع:","o":["محور الصادات الموجب","محور السينات الموجب","محور السينات السالب فقط","الخط العمودي عليه"],"a":1},{"l":0,"k":"n","q":"الخط المستقيم الذي ميله موجب يكون:","o":["صاعداً من اليسار إلى اليمين","هابطاً من اليسار إلى اليمين","أفقياً","رأسياً"],"a":0},{"l":0,"k":"n","q":"سطحان مائلان ميلاهما ١/١٢ وَ ١/١٥، الأكثر انحداراً هو الذي ميله:","o":["١/١٥","لا فرق بينهما","لا يمكن المقارنة","١/١٢"],"a":3},{"l":0,"k":"n","q":"ميل الخط المستقيم الذي يصنع زاوية ٤٥° مع محور السينات الموجب هو:","o":["٠","٤٥","١","−١"],"a":2},{"l":0,"k":"n","q":"تقع النقاط أ، ب، جـ على استقامة واحدة إذا كان:","o":["ميل أ ب = ٠","ميل أ ب = ميل ب جـ","ميل أ ب × ميل ب جـ = ١","أ ب = ب جـ دائماً"],"a":1},{"l":1,"k":"p","q":"ميل الخط المستقيم المارّ بالنقطتين (١ ، ٢) وَ (٤ ، ٨) يساوي:","o":["٢","٣","١/٢","−٢"],"a":0},{"l":1,"k":"p","q":"ميل الخط المستقيم المارّ بالنقطتين (−١ ، ٢) وَ (٥ ، ٤) يساوي:","o":["٣","٢/٣","−١/٣","١/٣"],"a":3},{"l":1,"k":"p","q":"ميل الخط المستقيم المارّ بالنقطتين (٣ ، ٥) وَ (٠ ، −٢) يساوي:","o":["٣/٧","−٧/٣","٧/٣","٥/٢"],"a":2},{"l":1,"k":"p","q":"ميل الخط المستقيم المارّ بالنقطتين (−٤ ، ٣) وَ (٠ ، ١) يساوي:","o":["١/٢","−١/٢","−٢","−١/٤"],"a":1},{"l":1,"k":"p","q":"ميل الخط المستقيم المارّ بالنقطتين (٢ ، −١) وَ (٤ ، −١) يساوي:","o":["٠","غير معرّف","١","−١"],"a":0},{"l":1,"k":"p","q":"ميل الخط المستقيم الذي يصنع زاوية ٦٠° مع محور السينات الموجب هو:","o":["١","٦٠","١/√٣","√٣"],"a":3},{"l":1,"k" }},{"t":"معادلة الخط المستقيم","e":["# نشاط تمهيدي: نمو نبتة","نبتة فاصولياء طولها ٣ سم تنمو بمعدل ٢ سم يومياً، فيكون طولها ص سم بعد س يوماً حسب العلاقة ص = ٢س + ٣.","|س (يوماً)|٠|١|٢|٣","|ص (الطول)|٣|٥|٧|٩","طول النبتة في نهاية اليوم الخامس = ٢ × ٥ + ٣ = ١٣ سم، وفي نهاية اليوم الحادي عشر = ٢ × ١١ + ٣ = ٢٥ سم.","عند تمثيل العلاقة بيانياً نحصل على خط مستقيم ميله = (٥ − ٣)/(١ − ٠) = ٢ (وهو معدل النمو)، ويقطع محور الصادات عند ٣ (الطول الابتدائي).","# المعادلة بدلالة الميل والمقطع الصادي","الإحداثي الصادي لنقطة تقاطع الخط المستقيم مع محور الصادات يُسمّى المقطع الصادي.","- معادلة الخط المستقيم الذي ميله م ومقطعه الصادي جـ: ص = م س + جـ، حيث م، جـ عددان حقيقيان.","- معامل س هو الميل، والحدّ الثابت هو المقطع الصادي (إذا كانت المعادلة بصورة ص = …).","- معادلة محور السينات: ص = ٠، ومعادلة محور الصادات: س = ٠.","- معادلة الخط الأفقي: ص = عدد ثابت (ميله ٠)، ومعادلة الخط الرأسي: س = عدد ثابت (ميله غير معرّف).","? أجد معادلة الخط المستقيم الذي ميله ٣/٤ ويقطع محور الصادات عند النقطة (٠ ، −٢). || ص = م س + جـ، م = ٣/٤ والمقطع الصادي جـ = −٢. إذن ص = ٣/٤ س − ٢.","# أحدّد الميل والمقطع من المعادلة","|المعادلة|الميل|المقطع الصادي","|ص = ٢س − ٥|٢|−٥","|ص = س|١|٠","|ص = −٢|٠|−٢","|٣ص = ٦ + ١٢س|٤|٢","! لإيجاد الميل والمقطع من معادلة مثل ٣ص = ٦ + ١٢س نقسم الطرفين على معامل ص أولاً لنكتبها بالصورة ص = م س + جـ: ص = ٢ + ٤س.","# معادلة الخط بدلالة نقطة وميل","إذا كانت ع(س ، ص) نقطة على الخط المستقيم الذي ميله م ويمرّ بالنقطة (س₁ ، ص₁) فإن (ص − ص₁)/(س − س₁) = م، ومنه:","- ص − ص₁ = م (س − س₁)، أي ص = م (س − س₁) + ص₁.","? أجد معادلة الخط المستقيم الذي يمرّ بالنقطة أ(٢ ، ٣) وميله ٤. || ص = م (س − س₁) + ص₁ = ٤(س − ٢) + ٣ = ٤س − ٨ + ٣. إذن ص = ٤س − ٥.","? ما معادلة الخط المستقيم الذي يمرّ بالنقطة (−٣ ، ٤) ويوازي محور السينات؟ || الخط الموازي لمحور السينات ميله صفر، فمعادلته ص = ٤.","# معادلة الخط المار بنقطتين","نحسب الميل م من النقطتين ثم نعوّض في ص − ص₁ = م (س − س₁) بأيّ من النقطتين.","? أجد معادلة الخط المستقيم المار بالنقطتين أ(١ ، ٥)، ب(٤ ، ٣). || م = (٣ − ٥)/(٤ − ١) = −٢/٣. ص − ٥ = −٢/٣ (س − ١) فَ ص = −٢/٣ س + ٢/٣ + ٥ = −٢/٣ س + ١٧/٣.","? أجد معادلة الخط المستقيم الذي مقطعه السيني ٥ ومقطعه الصادي ٣. || المستقيم يمرّ بالنقطتين (٥ ، ٠) وَ (٠ ، ٣): م = (٣ − ٠)/(٠ − ٥) = −٣/٥، والمقطع الصادي ٣. إذن ص = −٣/٥ س + ٣.","? أجد معادلة الخط المستقيم المار بنقطة الأصل والنقطة (٢ ، −٣). || م = (−٣ − ٠)/(٢ − ٠) = −٣/٢، والمقطع ٠. إذن ص = −٣/٢ س.","# الخطان المتوازيان والمتعامدان","- إذا توازى خطان مستقيمان فميلاهما متساويان، والعكس صحيح (مثل ص = ٢س − ١ وَ ص = ٢س + ٣، ميل كلٍّ منهما ٢).","- إذا تعامد خطان مستقيمان فحاصل ضرب ميليهما = −١ (أي أن ميل أحدهما = −١/ميل الآخر)، والعكس صحيح.","? الخط ل₁ يمر بالنقطتين (١ ، ٠)، (−١ ، −١) والخط ل₂ يمر بالنقطتين (١ ، ٠)، (٠ ، ٢). أبيّن أنهما متعامدان. || م₁ = (−١ − ٠)/(−١ − ١) = ١/٢، م₂ = (٢ − ٠)/(٠ − ١) = −٢. م₁ × م₂ = ١/٢ × (−٢) = −١، فالخطان متعامدان.","? أجد معادلة الخط المار بنقطة الأصل والعمودي على المستقيم ٣س − ص − ١ = ٠. || ص = ٣س − ١ فميله ٣، وميل العمودي = −١/٣. يمرّ بنقطة الأصل فالمقطع ٠: ص = −١/٣ س.","# نقطة على الخط؟ ومجهول في المعادلة","- تقع نقطة على الخط المستقيم إذا حققت إحداثياتها معادلته (نعوّض س وَ ص فتصحّ المعادلة).","? أبيّن أيّ النقطتين أ(٢ ، −٣)، ب(٥ ، −١) تقع على الخط س + ٢ص = ٣. || أ: ٢ + ٢(−٣) = −٤ ≠ ٣ فلا تقع عليه. ب: ٥ + ٢(−١) = ٣ فتقع عليه.","? إذا كانت النقطة (١ ، −٢) تقع على الخط أس + ٢ص − ٧ = ٠، أجد أ. || نعوّض: أ × ١ + ٢ × (−٢) − ٧ = ٠ فَ أ − ١١ = ٠ فَ أ = ١١.","? أجد قيمة هـ التي تجعل ص = (هـ + ٣)س + ٢ يوازي محور السينات. || الخط الأفقي ميله ٠: هـ + ٣ = ٠ فَ هـ = −٣.","# تدرّب","? أجد معادلة الخط المستقيم الذي ميله −٣/٢ ومقطعه الصادي ٤. || ص = −٣/٢ س + ٤.","? أجد معادلة الخط المار بالنقطتين (٧ ، ١) وَ (−٢ ، ٣). || م = (٣ − ١)/(−٢ − ٧) = −٢/٩. ص − ١ = −٢/٩ (س − ٧) فَ ص = −٢/٩ س + ١٤/٩ + ١ = −٢/٩ س + ٢٣/٩.","? أجد معادلة الخط الموازي لمحور الصادات والمارّ بالنقطة (−٣ ، ٤). || الخط الرأسي معادلته س = عدد ثابت: س = −٣."],"q":["- ما معادلة الخط المستقيم بدلالة الميل والمقطع الصادي؟ وما معنى كلٍّ من م وَ جـ؟","- أجد معادلة الخط المستقيم الذي ميله −٣/٢ ومقطعه الصادي ٤.","- أجد معادلة الخط المارّ بالنقطتين (٧ ، ١) وَ (−٢ ، ٣).","- ما العلاقة بين ميلي خطّين متوازيين؟ وبين ميلي خطّين متعامدين؟","- أجد معادلة الخط المستقيم الموازي لمحور الصادات والمارّ بالنقطة (−٣ ، ٤)."],"quiz":[{"l":0,"k":"n","q":"معادلة الخط المستقيم الذي ميله م ومقطعه الصادي جـ هي:","o":["ص = جـ س + م","ص = م + جـ + س","م = ص س + جـ","ص = م س + جـ"],"a":3},{"l":0,"k":"n","q":"ميل الخط المستقيم ص = ٣س + ٥ يساوي:","o":["٥","٨","٣","١٥"],"a":2},{"l":0,"k":"n","q":"المقطع الصادي للخط المستقيم ص = ٣س + ٥ يساوي:","o":["٣","٥","−٥","٠"],"a":1},{"l":0,"k":"n","q":"معادلة محور السينات هي:","o":["ص = ٠","س = ٠","ص = س","س = ص = ١"],"a":0},{"l":0,"k":"n","q":"معادلة محور الصادات هي:","o":["ص = ٠","ص = س","ص = ١","س = ٠"],"a":3},{"l":0,"k":"n","q":"إذا توازى مستقيمان فإن:","o":["حاصل ضرب ميليهما = −١","مقطعيهما الصاديين متساويان دائماً","ميلَيهما متساويان","ميل أحدهما صفر"],"a":2},{"l":0,"k":"n","q":"إذا تعامد مستقيمان (غير أفقي أو رأسي) فإن:","o":["ميلَيهما متساويان","حاصل ضرب ميليهما = −١","مجموع ميليهما = ٠ دائماً","حاصل ضرب ميليهما = ١"],"a":1},{"l":0,"k":"n","q":"معادلة الخط المستقيم الذي ميله م ويمرّ بالنقطة (س₁ ، ص₁) هي:","o":["ص − ص₁ = م (س − س₁)","ص + ص₁ = م (س + س₁)","ص − س₁ = م (س − ص₁)","ص = م + (س − س₁)"],"a":0},{"l":1,"k":"p","q":"معادلة الخط المستقيم الذي ميله ٣ ومقطعه الصادي −٢ هي:","o":["ص = −٢س + ٣","ص = ٣س + ٢","ص = ١/٣ س − ٢","ص = ٣س − ٢"],"a":3},{"l":1,"k":"p","q":"معادلة الخط المستقيم الذي ميله ٣ ويمرّ بالنقطة (١ ، ٢) هي:","o":["ص = ٣س + ٢","ص = ٣س + ٥","ص = ٣س − ١","ص = ٣س + ١"],"a":2},{"l":1,"k":"p","q":"معادلة الخط المستقيم المارّ بالنقطتين (٠ ، ٠) وَ (٢ ، ٤) هي:","o":["ص = ١/٢ س","ص = ٢س","ص = ٢س + ٤","ص = ٤س + ٢"],"a":1},{"l":1,"k":"p","q":"المقطع الصادي للخط المستقيم الذي معادلته ٣ص = ٦س + ١٢ هو:","o":["٤","٢","١٢","٦"],"a":0},{"l":1,"k":"p","q":"معادلة الخط المستقيم الذي ميله ٤ ويمرّ بالنقطة (٢ ، ٣) هي:","o":["ص = ٤س + ٣","ص = ٤س − ٨","ص = ٤س + ٥","ص = ٤س − ٥"],"a":3},{"l":1,"k":"p","q":"أيّ النقاط الآتية تقع على الخط المستقيم ص = ٢س − ١؟","o":["(٥ ، ٣)","(٢ ، ٥)","(٣ ، ٥)","(١  وتتساويان في حالة أ = ب.","إذا كان ن(أ) عدد عناصر أ وكان ن(ب) عدد عناصر ب، فإن: ن(أ × ب) = ن(أ) × ن(ب).","! تذكّر: أ × أ مجموعة أيضاً، وعدد عناصرها ن(أ) × ن(أ)؛ فإذا كان في أ ثلاثة عناصر ففي أ × أ تسعة أزواج.","# تساوي زوجين مرتّبين","(س، ص) = (ع، ل) إذا وفقط إذا كان س = ع و ص = ل. أي أن المسقطين الأولين متساويان والمسقطين الثانيين متساويان.","# أمثلة محلولة","? إذا كانت أ = {٢، ٤، ٦} وكانت ب = {٧، ٨}، أكتب أ × ب. || نأخذ كل عنصر من أ ونقرنه بكل عنصر من ب: أ × ب = {(٢، ٧)، (٢، ٨)، (٤، ٧)، (٤، ٨)، (٦، ٧)، (٦، ٨)}. عدد الأزواج = ٣ × ٢ = ٦.","? أ = {١، ٢، ٣}، ب = {٦، ٨}. أكتب أ × ب و ب × أ وأقارن بينهما. || أ × ب = {(١، ٦)، (١، ٨)، (٢، ٦)، (٢، ٨)، (٣، ٦)، (٣، ٨)}. ب × أ = {(٦، ١)، (٦، ٢)، (٦، ٣)، (٨، ١)، (٨، ٢)، (٨، ٣)}. العدد متساوٍ (٦ أزواج) لكن الأزواج مختلفة، فالزوج (١، ٦) مثلاً في أ × ب وليس في ب × أ. إذن أ × ب ≠ ب × أ.","? أ = {٢، ٤، ٦}، ب = {٤، ٥}. أجد أ × أ وعدد عناصر كلٍّ من أ × أ و أ × ب. || أ × أ = {(٢، ٢)، (٢، ٤)، (٢، ٦)، (٤، ٢)، (٤، ٤)، (٤، ٦)، (٦، ٢)، (٦، ٤)، (٦، ٦)}، وعدد عناصرها ٣ × ٣ = ٩. أما أ × ب فعدد عناصرها ٣ × ٢ = ٦.","? إذا علمت أن (س − ١، ٧) = (٩، ص − ١)، أجد قيمة س، ص. || نساوي المسقطين الأولين: س − ١ = ٩ ومنها س = ١٠. ونساوي المسقطين الثانيين: ٧ = ص − ١ ومنها ص = ٨.","? إذا علمت أن (س²، ٧) = (٤٩، ص + ٨)، أجد قيمة س، ص. || س² = ٤٩ ومنها س = ٧ أو س = −٧ (قيمتان). ٧ = ص + ٨ ومنها ص = −١.","? أجد قيم س، ص الحقيقية التي تحقّق (س، ص²) = (٢س − ٢، ١). || س = ٢س − ٢ ومنها س = ٢. ص² = ١ ومنها ص = ١ أو ص = −١.","? أ = {٣، ٥، ٧، ٩}، ب = {س : س عدد طبيعي محصور بين ٤ و ٢٣ ويقبل القسمة على ٥ دون باقٍ}. ما عدد عناصر أ × ب؟ || ب = {٥، ١٠، ١٥، ٢٠} أي ٤ عناصر. ن(أ) = ٤. إذن ن(أ × ب) = ٤ × ٤ = ١٦.","# أخطاء شائعة","! الخطأ: كتابة الزوج بترتيب معكوس. (٧، ٢) ∈ أ × ب فقط إذا كان ٧ ∈ أ و ٢ ∈ ب.","! الخطأ: نسيان القيمة السالبة عند حلّ س² = ٤٩؛ لهذه المعادلة حلّان: ٧ و −٧.","|الحالة|النتيجة","|أ × ب|المسقط الأول من أ والثاني من ب","|ب × أ|المسقط الأول من ب والثاني من أ","|ن(أ × ب)|ن(أ) × ن(ب)"],"q":["- ما المقصود بالضرب الديكارتي للمجموعتين أ، ب؟ وكيف نحسب عدد عناصره؟ يلوواط/ساعة (ص) في أحد المنازل عدة أيام، فكانت النتائج: (٨، ٦)، (٦، ٥)، (٥، ٤٫٥)، (٤، ٣٫٢٥)، (٣، ٢)، (٢، ١٫٦).","نسمّي هذه الأزواج المرتّبة علاقة بين عدد المصابيح وكمية الطاقة المستهلكة. فإذا كان عدد المصابيح ٦ فالطاقة المستهلكة ٥ كيلوواط/ساعة.","# تعريف العلاقة والمجال والمدى","العلاقة: هي أيّ مجموعة من الأزواج المرتّبة.","- مجال العلاقة: مجموعة كل المساقط الأولى للأزواج المرتّبة في العلاقة.","- مدى العلاقة: مجموعة كل المساقط الثانية للأزواج المرتّبة في العلاقة.","مثال: العلاقة ع = {(١، ٢)، (٣، ٦)، (٤، ٨)، (٥، ١٠)} مجالها {١، ٣، ٤، ٥} ومداها {٢، ٦، ٨، ١٠}، ونلاحظ أن كل مسقط ثانٍ هو ضعف المسقط الأول.","# العلاقة من مجموعة إلى مجموعة","أي مجموعة جزئية من أ × ب تسمّى علاقة من المجموعة أ إلى المجموعة ب، ونكتب ع ⊆ أ × ب.","إذا كانت أ = ب فتسمّى العلاقة علاقة على أ. وقد تُعرَّف العلاقة بقاعدة مثل ع = {(س، ص) ∈ أ × ب : س − ص = ١}.","! تنبيه: يجب أن يكون المسقط الأول من أ والمسقط الثاني من ب في كل زوج؛ فإذا وُجد زوج خارج أ × ب فالمجموعة ليست علاقة من أ إلى ب.","# تمثيل العلاقة","- بالأزواج المرتّبة، مثل {(٢، ١)، (٣، ٢)، (٤، ٣)}.","- بالمخطط السهمي: نرسم مجموعتين ونصل كل مسقط أول بمسقطه الثاني بسهم.","- بالمستوى الديكارتي: نمثّل كل زوج (س، ص) بنقطة، فنعيّن س على المحور الأفقي وص على المحور الرأسي.","# أمثلة محلولة","? لتكن أ = {٢، ٣، ٤}، ب = {٠، ١، ٢، ٣}، والعلاقة ع من أ إلى ب معرّفة بالقاعدة س − ص = ١. أكتب ع بالأزواج المرتّبة. || نبحث عن الأزواج التي فرق مسقطيها ١: ٢ − ١ = ١، ٣ − ٢ = ١، ٤ − ٣ = ١. إذن ع = {(٢، ١)، (٣، ٢)، (٤، ٣)}. ويمكن تمثيلها بالسهم: ٢ ← ١، ٣ ← ٢، ٤ ← ٣.","? أجد المجال والمدى للعلاقة ع = {(١، ٢)، (١، ٤)، (٣، ٢)، (٥، −٦)، (٦، ٦)}. || المساقط الأولى: ١، ١، ٣، ٥، ٦ فالمجال = {١، ٣، ٥، ٦}. المساقط الثانية: ٢، ٤، ٢، −٦، ٦ فالمدى = {٢، ٤، −٦، ٦}. (لا نكرّر العنصر في المجموعة.)","? أ = {١، ٢، ٣، ٤، ٥، ٦} وع علاقة على أ حيث ع = {(س، ص) ∈ أ × أ : س = ص + ٣}. أكتب ع بالأزواج المرتّبة. || س = ص + ٣: ص = ١ ← س = ٤، ص = ٢ ← س = ٥، ص = ٣ ← س = ٦، أما ص = ٤ فتعطي س = ٧ وهو ليس في أ. إذن ع = {(٤، ١)، (٥، ٢)، (٦، ٣)}.","? أ = {١، ٢، ٣}، ب = {٢، ٣، ٤، ٦، ٩}، والعلاقة ع م ا.","# قاعدة الاقتران","قد يُعطى الاقتران بقاعدة مثل ق(س) = ٢س، فنجد الصورة بالتعويض عن س في القاعدة.","# أمثلة محلولة","? أ = {٠، ١، ٢، ٣}، ب = {٠، ١، ٢، ٣، ٤، ٥، ٦، ٧}، ق : أ ← ب بالقاعدة ق(س) = ٢س. أكتب ق بالأزواج، وأجد المجال والمدى والمجال المقابل. || ق(٠) = ٠، ق(١) = ٢، ق(٢) = ٤، ق(٣) = ٦. ق = {(٠، ٠)، (١، ٢)، (٢، ٤)، (٣، ٦)}. المجال = {٠، ١، ٢، ٣}، المدى = {٠، ٢، ٤، ٦}، المجال المقابل = {٠، ١، ٢، ٣، ٤، ٥، ٦، ٧}.","? ق : ص ← ص بالقاعدة ق(س) = ٢س + ١ (ص مجموعة الأعداد الصحيحة). أجد ق(−٢)، ق(−١)، ق(٠)، ق(١). || ق(−٢) = ٢ × (−٢) + ١ = −٣. ق(−١) = −٢ + ١ = −١. ق(٠) = ١. ق(١) = ٢ + ١ = ٣.","? في الاقتران السابق، إذا كان الزوج المرتّب (س، ١١) يحقّق قاعدة ق فما قيمة س؟ || يعني ق(س) = ١١، أي ٢س + ١ = ١١، ومنها ٢س = ١٠ فتكون س = ٥.","? ق = {(٢، ١)، (٥، ١)، (٣، ٣)}. أجد ق(٣)، ق(٥)، ق(٢). || نقرأ الصورة من الزوج: ق(٣) = ٣، ق(٥) = ١، ق(٢) = ١. (عنصران لهما الصورة نفسها، وهذا مسموح.)","? ق : ح ← ح، ق(س) = أس − ٦، وق(٢) = صفر. أجد قيمة أ. || ق(٢) = ٢أ − ٦ = ٠ ومنها ٢أ = ٦ فتكون أ = ٣.","? أ = {١، ٢، ٣، ٤}، ب = {٠، ١، ٢، ٣، ٤}، ق : أ ← ب بالقاعدة ق(س) = س − ١. أجد المدى. || ق(١) = ٠، ق(٢) = ١، ق(٣) = ٢، ق(٤) = ٣. المدى = {٠، ١، ٢، ٣}.","? ق : ح ← ح، ق(س) = س². أجد ق(−٢)، ق(٥)، ق(½)، ق(√٣)، ثم أجد أ إذا كان ق(أ) = ٣٦. || ق(−٢) = ٤، ق(٥) = ٢٥، ق(½) = ¼، ق(√٣) = ٣. ق(أ) = أ² = ٣٦ ومنها أ = ٦ أو أ = −٦.","? أ = {١، ٢، ٣، ٤، ٥}، ق(س) = ٢س إذا كانت س زوجية، وق(س) = س + ٢ إذا كانت س فردية. أجد ق(١)، ق(٢)، ق(٣)، ق(٤)، ق(٥). || ١ فردي: ق(١) = ٣. ٢ زوجي: ق(٢) = ٤. ٣ فردي: ق(٣) = ٥. ٤ زوجي: ق(٤) = ٨. ٥ فردي: ق(٥) = ٧.","# تدرّب","? أيّ العلاقات الآتية اقتران من أ = {١، ٢، ٣}؟ ع₁ = {(١، ٣)، (٢، ٥)، (٣، ٧)}، ع₂ = {(١، ٣)، (٢، ٥)، (٢، ٨)}، ع₃ = {(١، ٣)، (٢، ٥)}. || ع₁ اقتران: لكل عنصر صورة واحدة. ع₂ ليست اقتراناً: العنصر ٢ له صورتان (٥ و٨). ع₃ ليست اقتراناً: العنصر ٣ ليس له صورة."],"q":["- ما تعريف الاقتران؟ وما الفرق بين المجال والمجال المقابل والمدى؟","- هل كل علاقة اقتران؟ أعطِ مثالاً على علاقة ليست اقتراناً ووضّح السبب.","- إذا كان ق = {(٢، ١)، (٥، ١)، (٣، ٣)}، أجد ق(٣)، ق(٥)، ق(٢).",
