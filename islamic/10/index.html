<!DOCTYPE html>

<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Ruqaa";src:url("../../shared/fonts/aref-ruqaa-arabic-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--pri:#113D2E;--pri2:#0b2c21;--bg:#FAF6EB;--card:#ffffff;--ink:#113D2E;--mut:#5f7a6e;--gold:#8B4200;--bd:#EEE4DB;--onpri:#ffffff;--ok:#1f9d5c;--bad:#c9443b;--soft:#E2ECE1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;min-height:100vh;transition:background .25s,color .25s}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-family:"Ruqaa","Plex Arabic",serif;color:var(--pri2)}
#app{max-width:600px;margin:0 auto;padding:12px 14px calc(92px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.top h1{flex:1;font-size:1.35rem;line-height:1.3}
.ib{flex:none;width:42px;height:42px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);display:grid;place-items:center;font-size:1.2rem;text-decoration:none;color:var(--ink)}
.wallet{display:flex;align-items:center;gap:6px;border:1.5px solid var(--gold);background:var(--card);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700}
.wallet img{width:30px;height:30px;object-fit:contain}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.hello{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border:0}
.hello b{display:block;font-size:1.1rem}.hello small{opacity:.85}
.ring{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--gold)) calc(var(--p)*1%),rgba(127,127,127,.28) 0);position:relative;font-weight:700}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(0,0,0,.32)}
.medals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.medal{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:700;border:3px solid var(--bd);background:var(--soft);color:var(--mut);font-size:.85rem}.medal.s{border-color:#aeb7c7;background:linear-gradient(135deg,#f1f4fa,#c9d1e0);color:#33405a}.medal.g{border-color:#d4af37;background:linear-gradient(135deg,#fff2b8,#d9ad2f);color:#4a3600;animation:pul 2.4s ease-in-out infinite}@keyframes pul{50%{box-shadow:0 0 14px rgba(212,175,55,.8)}}
.path{position:relative;margin:6px 14px}.path::before{content:"";position:absolute;inset-block:8px;inset-inline-start:11px;width:3px;background:linear-gradient(var(--pri),var(--gold));border-radius:3px}.pn{position:relative;padding:4px 40px 12px 0}.pn::before{content:"";position:absolute;inset-inline-start:2px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--bd);border:3px solid var(--card)}.pn.on::before{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.ring span{position:relative;font-size:.95rem}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{flex:1;padding:9px 10px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);font-weight:700}
.tab[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.book{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.book .bi{font-size:1.7rem}
.book b{display:block}.book small{color:var(--mut)}
.uc{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1.5px solid var(--bd);background:var(--card);border-radius:20px;padding:12px;margin-bottom:10px}
.uc .ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:1.6rem}
.uc .tx{flex:1;min-width:0}.uc b{display:block;font-size:1.02rem}.uc small{color:var(--mut)}
.bar{height:7px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold));border-radius:9px}
.chev{color:var(--mut);font-size:1.2rem}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:1.5px solid var(--bd);background:var(--card);border-radius:18px;padding:11px;margin-bottom:9px}
.lrow .no{flex:none;min-width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:700}
.lrow .tx{flex:1;min-width:0}.lrow b{display:block;font-size:.97rem;line-height:1.5}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:.72rem;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--mut);font-weight:700}
.chip.on{background:var(--pri);color:var(--onpri)}
.lrow.off{opacity:.55}
.modes{display:flex;gap:8px;margin:0 0 12px}
.mode{flex:1;padding:9px 4px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);font-weight:700;font-size:.92rem}
.mode[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.dots{display:flex;gap:4px;justify-content:center;margin:0 0 10px}.dots i{width:18px;height:5px;border-radius:5px;background:var(--bd)}.dots i.on{background:var(--pri)}
.blk h3{font-size:1.25rem;margin-bottom:8px}
.blk p{margin:0 0 10px;font-size:1.02rem}
.def{background:var(--soft);border-inline-start:5px solid var(--gold);border-radius:12px;padding:10px 12px;font-weight:700;margin-top:6px}
.verse{font-family:"Noto Naskh Arabic","Traditional Arabic","Amiri",serif;font-size:1.45rem;line-height:2.4;text-align:justify;background:linear-gradient(180deg,#fffaf0,var(--card));border:1.5px solid var(--gold);border-radius:18px;padding:14px;color:#113D2E}
.vref{font-size:.82rem;color:var(--mut);margin:6px 2px}
.meaning{margin-top:8px;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:.98rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;border:0;background:var(--pri);color:var(--onpri);font-weight:700}
.btn.gold{background:linear-gradient(135deg,#e9cd7e,var(--gold));color:#3b2a00}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--bd)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{min-height:96px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);padding:10px;text-align:center;display:grid;place-items:center;font-weight:700}
.fc.flip{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:400;font-size:.92rem}
.li{display:flex;gap:10px;margin-bottom:8px}.li .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3b2a00;display:grid;place-items:center;font-weight:700}
.li .t{flex:1;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:8px 12px}
.q{background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:14px}
.qtop{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;margin-bottom:8px}
.qq{font-size:1.08rem;font-weight:700;margin-bottom:12px}
.opt{display:block;width:100%;text-align:start;padding:11px 14px;margin-bottom:8px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card)}
.opt.sel{border-color:var(--pri);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:#e5f6ec}.opt.no{border-color:var(--bad);background:#fbe9e7}
.fb{margin-top:10px;padding:10px 12px;border-radius:14px;font-size:.95rem}.fb.ok{background:#e5f6ec;color:#14633a}.fb.no{background:#fbe9e7;color:#8a2a22}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{padding:10px 8px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);font-size:.9rem;text-align:center}
.mi.sel{border-color:var(--pri);background:var(--soft)}.mi.done{border-color:var(--ok);background:#e5f6ec;pointer-events:none}.mi.bad{border-color:var(--bad);background:#fbe9e7}
.res{text-align:center}.res .big{font-size:2.6rem;font-weight:700;color:var(--pri2)}
.gain{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1.5px solid var(--gold);border-radius:999px;padding:3px 12px;font-weight:700;margin:3px}
.gain img{width:22px;height:22px;object-fit:contain}
.rev{border-top:1px dashed var(--bd);padding:10px 0;font-size:.92rem}.rev b{display:block}
.store-h{display:flex;align-items:center;gap:12px}.store-h img{width:64px;height:64px;object-fit:contain}
.sw{display:flex;align-items:center;gap:10px;border:1.5px solid var(--bd);background:var(--card);border-radius:18px;padding:10px;margin-bottom:9px}
.sw .dots2{display:flex;flex:none}.sw .dots2 i{width:22px;height:40px;display:block}.sw .dots2 i:first-child{border-radius:0 10px 10px 0}.sw .dots2 i:last-child{border-radius:10px 0 0 10px}
.sw .tx{flex:1;min-width:0}.sw b{display:block}.sw small{color:var(--mut)}
.pbar{position:fixed;left:10px;right:10px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pbar span{flex:1 1 140px;font-weight:700}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .card{margin:0;text-align:center}.stat b{display:block;font-size:1.5rem;color:var(--pri2)}.stat small{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:18px 8px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--card);border-top:1.5px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.72rem;color:var(--mut);padding:4px 0;font-weight:700}
#nav button span{font-size:1.25rem;line-height:1.3}
#nav button[aria-current=page]{color:var(--pri)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#102a20;color:#fff;border-radius:999px;padding:8px 18px;z-index:40;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;animation:tin .3s}
.toast img{width:22px;height:22px}@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1}}
</style>
</head>

  }

  function overallPct() { var t = 0; ALL.forEach(function (l) { t += lessonPct(l.id); }); return ALL.length ? Math.round(t / ALL.length) : 0; }

  function toast(html) { var o = $(".toast"); if (o) o.remove(); var d = document.createElement("div"); d.className = "toast"; d.innerHTML = html; document.body.appendChild(d); setTimeout(function () { if (d.parentNode) d.remove(); }, 2600); }
  function gain(n, why) {

    toast('<img src="images/durra.webp" alt="">+' + toAr(n) + " دُرّة — " + esc(why)); refreshWallet();
  }

  function publish() {

      var badges = []; ALL.forEach(function (l) { var s = S.L[l.id]; if (s && s.msBest >= 90) badges.push({ i: "🏅", t: l.t }); });

    } catch (e) {}
  }

  /* ---------------- التوجيه ---------------- */

    R.v = p.v || (p.unit ? "unit" : p.lesson ? "lesson" : "home"); R.unit = p.unit; R.lesson = p.lesson; R.mode = p.m || "learn";

  /* ---- وضع التعلّم ---- */
  function learn(body, id, data) {
    var i = 0, B = data.learn;
    function draw() {
      var b = B[i], h = '<div class="dots">' + B.map(function (_, j) { return "<i" + (j <= i ? ' class="on"' : "") + "></i>"; }).join("") + '</div><div class="card blk">' + blk(b) + "</div>";
      h += '<div class="row">' + (i > 0 ? '<button class="btn ghost" type="button" id="pv">› السابق</button>' : "") + '<button class="btn" type="button" id="nx">' + (i === B.length - 1 ? "أتممتُ الدرس ✓" : "التالي ‹") + "</button></div>";
      body.innerHTML = h; window.scrollTo(0, 0); wire(b);

    function blk(b) {

      if (b.k === "verse") { var vt = b.v.a.map(function (t, j) { return t + " ﴿" + toAr(b.v.from + j) + "﴾"; }).join(" "); if (b.plain) vt = b.v.a[0]; return "<h3>" + esc(b.h) + '</h3><div class="verse">﴿ ' + vt + ' ﴾</div><div class="vref">' + esc(b.ref) + '</div><button class="btn ghost" type="button" id="mn">المعنى الإجمالي</button><div class="meaning" id="mnt" hidden>' + esc(b.m) + "</div>"; }
      if (b.k === "terms") return "<h3>" + esc(b.h) + '</h3><div class="fgrid">' + b.t.map(function (t, j) { return '<button class="fc" type="button" data-f="' + j + '">' + esc(t[0]) + "</button>"; }).join("") + "</div>";
      if (b.k === "list") return "<h3>" + esc(b.h) + "</h3>" + b.items.map(function (t, j) { return '<div class="li"' + (j ? " hidden" : "") + ' data-i="' + j + '"><span class="n">' + toAr(j + 1) + '</span><span class="t">' + esc(t) + "</span></div>"; }).join("") + (b.items.length > 1 ? '<div class="row"><button class="btn ghost" type="button" id="more">أظهر التالي ⌄</button></div>' : "");
      if (b.k === "think") return "<h3>🤔 " + esc(b.h) + "</h3><p><b>" + esc(b.q) + '</b></p><button class="btn ghost" type="button" id="ans">أظهر الإجابة</button><div class="meaning" id="ant" hidden>' + esc(b.a) + "</div>";

    function wire(b) {

      if (b.k === "think") $("#ans").addEventListener("click", function () { $("#ant").hidden = false; this.hidden = true; });
      if (b.k === "terms") body.querySelectorAll("[data-f]").forEach(function (c) { c.addEventListener("click", function () { var j = +c.dataset.f, f = c.classList.toggle("flip"); c.textContent = f ? b.t[j][1] : b.t[j][0]; }); });
      if (b.k === "list") { var m = $("#more"); if (m) m.addEventListener("click", function () { var hid = body.querySelector(".li[hidden]"); if (hid) hid.hidden = false; if (!body.querySelector(".li[hidden]")) m.hidden = true; }); }
    }
    function finish() {
      var s = st(id), first = !s.learn; s.learn = 1; var rev = false;
      if (first) gain(5, "إتمام وضع التعلّم");
      else if (s.rev !== today()) { s.rev = today(); gain(2, "مراجعة درس سابق"); rev = true; }
      save();
      body.innerHTML = '<div class="card res"><div class="big">✅</div><h3>أحسنت! أتممتَ وضع التعلّم</h3><p>جاهز للتحدّي؟ اختبر فهمك بأسئلة متنوّعة واكسب عملات دُرّة.</p><div class="row"><button class="btn gold" type="button" id="gc">🎯 ابدأ التحدّي</button><button class="btn ghost" type="button" id="gr">راجع من البداية</button></div></div>';
      $("#gc").addEventListener("click", function () { go("lesson=" + id + "&m=ch"); }); $("#gr").addEventListener("click", function () { i = 0; draw(); });

    if (g) { body.innerHTML = g; $("#st").addEventListener("click", draw); } else draw();
  }

  /* ---- محرّك الأسئلة ---- */
  function quiz(root, qs, o, done) {
    var i = 0, score = 0, mist = [], res = [];
    function head() { return '<div class="qtop"><span>سؤال ' + toAr(i + 1) + " من " + toAr(qs.length) + "</span><span>" + (o.instant ? "تحدّي" : "إتقان") + '</span></div><div class="bar"><i style="width:' + Math.round(i / qs.length * 100) + '%"></i></div><div style="height:10px"></div>'; }
    function next(ok, partial) {
      var v = partial != null ? partial : (ok ? 1 : 0); score += v; if (v < 1) mist.push(i); res.push(v);
      i++; if (i >= qs.length) done({ score: score, total: qs.length, mist: mist, res: res }); else show();
    }
    function show() {
      var q = qs[i].q0, ty = q.t; window.scrollTo(0, 0);
      var box = '<div class="q">' + head() + '<div class="qq">' + esc(q.q) + "</div><div id=\"qa\"></div><div id=\"fb\"></div></div>";
      root.innerHTML = box; var qa = $("#qa", root), fb = $("#fb", root);
      function feedback(ok, extra) {
        if (!o.instant) { next(ok); return; }
        fb.innerHTML = '<div class="fb ' + (ok ? "ok" : "no") + '">' + (ok ? "✅ إجابة صحيحة. " : "❌ " + (extra || "") + " ") + esc(q.why || "") + '</div><div class="row"><button class="btn" type="button" id="nq">' + (i === qs.length - 1 ? "النتيجة ‹" : "التالي ‹") + "</button></div>";
        $("#nq", root).addEventListener("click", function () { next(ok); });
      }
      if (ty === "mc" || ty === "fill" || ty === "tf") {
        var opts = ty === "tf" ? [{ t: "صحيحة", v: true }, { t: "خاطئة", v: false }] : shuffle(q.o.map(function (t, k) { return { t: t, v: k === q.a }; }));
        qa.innerHTML = opts.map(function (x, k) { return '<button class="opt" type="button" data-k="' + k + '">' + esc(x.t) + "</button>"; }).join("");
        var locked = false;
        qa.querySelectorAll(".opt").forEach(function (b) { b.addEventListener("click", function () {
          if (locked) return; locked = true; var x = opts[+b.dataset.k], ok = ty === "tf" ? x.v === q.a : x.v;
          if (o.instant) { b.classList.add(ok ? "ok" : "no"); if (!ok) { var right = ty === "tf" ? (q.a ? 0 : 1) : opts.map(function (y) { return y.v; }).indexOf(true); qa.querySelectorAll(".opt")[right].classList.add("ok"); } }
          else b.classList.add("sel");
          feedback(ok, "الجواب الصحيح: " + (ty === "tf" ? (q.a ? "صحيحة" : "خاطئة") : q.o[q.a]) + ".");
        }); });
      } else if (ty === "match") {
        var L = q.pairs.map(function (p, k) { return { t: p[0], k: k }; }), Rr = shuffle(q.pairs.map(function (p, k) { return { t: p[1], k: k }; })), sel = null, got = 0, err = 0;
        qa.innerHTML = '<div class="mt"><div id="ml">' + L.map(function (x) { return '<button class="mi" type="button" style="width:100%;margin-bottom:8px" data-k="' + x.k + '">' + esc(x.t) + "</button>"; }).join("") + '</div><div id="mr">' + Rr.map(function (x) { return '<button class="mi" type="button" style="width:100%;margin-bottom:8px" data-k="' + x.k + '">' + esc(x.t) + "</button>"; }).join("") + "</div></div>";
        qa.querySelectorAll("#ml .mi").forEach(function (b) { b.addEventListener("click", function () { qa.querySelectorAll("#ml .mi").forEach(function (z) { z.classList.remove("sel"); }); b.classList.add("sel"); sel = b; }); });
        qa.querySelectorAll("#mr .mi").forEach(function (b) { b.addEventListener("click", function () {
          if (!sel) return; if (sel.dataset.k === b.dataset.k) { sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); sel = null; got++;
            if (got === q.pairs.length) { var v = err === 0 ? 1 : err <= 2 ? 0.5 : 0; if (o.instant) { fb.innerHTML = '<div class="fb ' + (v === 1 ? "ok" : "no") + '">' + (v === 1 ? "✅ أحسنت! وصلتَ كل الأزواج بلا خطأ." : "أخطأتَ " + toAr(err) + " مرّات؛ راجع الأزواج وأعد المحاولة لاحقاً.") + '</div><div class="row"><button class="btn" type="button" id="nq">' + (i === qs.length - 1 ? "النتيجة ‹" : "التالي ‹") + "</button></div>"; $("#nq", root).addEventListener("click", function () { next(v === 1, v); }); } else next(v === 1, v); }
          } else { err++; b.classList.add("bad"); setTimeout(function () { b.classList.remove("bad"); }, 450); }
        }); });
      } else if (ty === "order") {
        var pool = shuffle(q.items.map(function (t, k) { return { t: t, k: k }; })), seq = [];
        function drawO() {
          qa.innerHTML = '<p style="margin:0 0 8px;color:var(--mut);font-size:.9rem">اضغط العناصر بالترتيب الصحيح:</p><div id="oseq">' + (seq.length ? seq.map(function (x, n) { return '<div class="li"><span class="n">' + toAr(n + 1) + '</span><span class="t">' + esc(x.t) + "</span></div>"; }).join("") : '<div class="empty" style="padding:6px">لم تختر شيئاً بعد</div>') + '</div><div id="opool" style="margin-top:8px">' +
            pool.filter(function (x) { return seq.indexOf(x) < 0; }).map(function (x) { return '<button class="opt" type="button" data-k="' + x.k + '">' + esc(x.t) + "</button>"; }).join("") + '</div><div class="row"><button class="btn ghost" type="button" id="ound"' + (seq.length ? "" : " disabled") + '>↶ تراجع</button><button class="btn" type="button" id="ochk"' + (seq.length === pool.length ? "" : " disabled") + ">تحقّق ✓</button></div>";
          qa.querySelectorAll("#opool .opt").forEach(function (b) { b.addEventListener("click", function () { seq.push(pool.filter(function (x) { return String(x.k) === b.dataset.k; })[0]); drawO(); }); });
          $("#ound", qa).addEventListener("click", function () { seq.pop(); drawO(); });
          $("#ochk", qa).addEventListener("click", function () {
            var good = seq.every(function (x, n) { return x.k === n; }); $("#ochk", qa).disabled = true; $("#ound", qa).disabled = true;
            feedback(good, "الترتيب الصحيح: " + q.items.join(" ← ") + ".");
          });
        }
        drawO();
      }
    }
    show();
  }
  function prep(arr, lid, mode) { return arr.map(function (q, k) { return { q0: q, id: lid + ":" + mode + ":" + k }; }); }
  function recordMistakes(qs, mist) { mist.forEach(function (k) { var q = qs[k], m = S.mis[q.id] || (S.mis[q.id] = { n: 0, q: q.q0.q, l: q.id.split(":")[0] }); m.n++; }); }

  /* ---- وضع التحدّي ---- */
  function challenge(body, id, data) {
    var qs = shuffle(prep(data.ch, id, "ch"));
    body.innerHTML = '<div class="card res"><div class="big">🎯</div><h3>وضع التحدّي</h3><p>' + toAr(qs.length) + ' أسئلة متنوّعة مع تغذية راجعة فورية. انجح بنسبة ٧٠٪ فأكثر لتكسب ١٠ دُرّات.</p><div class="row"><button class="btn gold" type="button" id="go">ابدأ التحدّي</button></div></div>';
    $("#go").addEventListener("click", function () {
      quiz(body, qs, { instant: true }, function (r) {
        recordMistakes(qs, r.mist);
        var pct = Math.round(r.score / r.total * 100), s = st(id), msg = "", first = !s.chDone;
        s.chBest = Math.max(s.chBest || 0, pct); if (pct >= 70) { if (first) { s.chDone = 1; gain(10, "نجاح في التحدّي"); msg = ""; } else msg = "<p>سبق أن ربحتَ مكافأة هذا التحدّي.</p>"; } save();
        body.innerHTML = '<div class="card res"><div class="big">' + toAr(pct) + "٪</div><h3>" + (pct >= 70 ? "أحسنت! نجحتَ في التحدّي 🎉" : "قريب جداً! حاول مرة أخرى 💪") + "</h3><p>" + toAr(Math.round(r.score * 10) / 10) + " من " + toAr(r.total) + " صحيحة</p>" + msg + '<div class="row"><button class="btn ghost" type="button" id="ag">أعد التحدّي</button><button class="btn gold" type="button" id="gm">🏆 إلى وضع الإتقان</button></div></div>';
        $("#ag").addEventListener("click", function () { challenge(body, id, data); }); $("#gm").addEventListener("click", function () { go("lesson=" + id + "&m=ms"); });
      });
    });
  }

  /* ---- وضع الإتقان ---- */
  function level(p) { return p >= 90 ? "متقن 🌟" : p >= 75 ? "جيد جداً 👍" : p >= 60 ? "جيد 🙂" : "يحتاج إلى مراجعة 📚"; }
  function mastery(body, id, data) {
    var qs = shuffle(prep(data.ms, id, "ms")), s0 = st(id);
    body.innerHTML = '<div class="card res"><div class="big">🏆</div><h3>وضع الإتقان</h3><p>اختبار شامل للدرس (' + toAr(qs.length) + ' أسئلة) بتصحيح تلقائي بعد الانتهاء، ثم مراجعة أخطائك.' + (s0.msBest ? "<br>أفضل نتيجة لك: " + toAr(s0.msBest) + "٪" : "") + '</p><div class="row"><button class="btn gold" type="button" id="go">ابدأ الاختبار</button></div></div>';
    $("#go").addEventListener("click", function () {
      var answers = [];
      quiz(body, qs, { instant: false }, function (r) {
        recordMistakes(qs, r.mist);
        var pct = Math.round(r.score / r.total * 100), s = st(id), prev = s.msBest || 0, g = [];
        s.msBest = Math.max(prev, pct); s.msTries = (s.msTries || 0) + 1;
        if (pct >= 70 && !s.m70) { s.m70 = 1; gain(15, "إتقان الدرس (٧٠٪+)"); g.push("+١٥"); }
        if (pct >= 90 && !s.m90) { s.m90 = 1; gain(10, "تفوّق في الإتقان (٩٠٪+)"); g.push("+١٠"); }
        var u = UNITS.filter(function (x) { return x.id === lessonMeta(id).unit; })[0];
        if (u && !S.unitDone[u.id] && u.lessons.every(function (l) { return (S.L[l.id] || {}).msBest >= 70; })) { S.unitDone[u.id] = 1; gain(50, "إنهاء وحدة: " + u.t); }
        save();
        var rev = r.mist.map(function (k) { var q = qs[k].q0, ans = q.t === "tf" ? (q.a ? "صحيحة" : "خاطئة") : q.t === "match" ? q.pairs.map(function (p) { return p[0] + " ← " + p[1]; }).join("، ") : q.t === "order" ? q.items.join(" ← ") : q.o[q.a];
          return '<div class="rev"><b>' + esc(q.q) + "</b>✔ " + esc(ans) + (q.why ? "<br><small>" + esc(q.why) + "</small>" : "") + "</div>"; }).join("");
        body.innerHTML = '<div class="card res"><div class="big">' + toAr(pct) + "٪</div><h3>" + level(pct) + "</h3><p>مستوى الإتقان لهذا الدرس: " + toAr(s.msBest) + "٪ (أفضل نتيجة)</p>" + (r.mist.length ? '<h3 style="margin-top:8px">راجع أخطاءك</h3><div style="text-align:start">' + rev + "</div>" : "<p>🌟 لا أخطاء! إجابات كاملة.</p>") + '<div class="row"><button class="btn ghost" type="button" id="ag">أعد الاختبار</button><button class="btn" type="button" id="bk">العودة للوحدة</button></div></div>';
        $("#ag").addEventListener("click", function () { mastery(body, id, data); }); $("#bk").addEventListener("click", function () { go("unit=" + lessonMeta(id).unit); });
      });
    });
  }

  /* ---------------- الكتب ---------------- */
  function vBooks(app) {
    app.innerHTML = top("الكتب المدرسية") + D.terms.map(function (t) { return '<a class="card book" href="' + esc(t.book) + '" target="_blank" rel="noopener"><span class="bi">📕</span><span><b>كتاب التربية الإسلامية — ' + t.name + '</b><small>الصف العاشر • يُفتح على Google Drive (يحتاج إنترنت)</small></span></a>'; }).join("") + '<p class="empty">الكتب روابطُ خارجية فلا تُخزَّن في الجهاز، أمّا الدروس التفاعلية فتعمل بلا إنترنت.</p>';
    bindTop(app);
  }

  /* ---------------- المتجر ---------------- */
  var preview = null;
  function vStore(app) {
    var tabs = [["colors", "🎨 الألوان"], ["bg", "🖼️ الخلفيات"], ["profile", "👤 الملف"], ["ach", "🏅 الإنجازات"]];
    var h = top("متجر دُرّة").replace('data-g2="store"', 'data-g2="store"');
    h += '<div class="card store-h"><img src="images/durra.webp" alt="دُرّة"><div><b style="font-size:1.4rem">' + toAr(S.coins) + ' دُرّة</b><br><small style="color:var(--mut)">ربحتَ ' + toAr(S.earned) + " • أنفقتَ " + toAr(S.spent) + '</small></div></div>';
    h += '<div class="tabs" style="flex-wrap:wrap">' + tabs.map(function (t) { return '<button class="tab" type="button" data-s="' + t[0] + '" aria-pressed="' + (R.tab === t[0]) + '" style="flex:1 1 40%">' + t[1] + "</button>"; }).join("") + "</div>";
    if (R.tab === "colors") {
      h += THEMES.map(function (t) { var own = S.owned.indexOf(t.id) >= 0, act = S.theme === t.id;
        return '<div class="sw"><span class="dots2"><i style="background:' + t.v.pri + '"></i><i style="background:' + t.v.gold + '"></i><i style="background:' + t.v.bg + ';border:1px solid #0002"></i></span><span class="tx"><b>' + t.n + "</b><small>" + (act ? "مفعّل الآن ✓" : own ? "مملوك" : toAr(t.price) + " دُرّة") + '</small></span><button class="btn ghost" type="button" data-p="' + t.id + '">معاينة</button>' + (own ? (act ? "" : '<button class="btn" type="button" data-a="' + t.id + '">تفعيل</button>') : '<button class="btn gold" type="button" data-b="' + t.id + '">شراء</button>') + "</div>"; }).join("");
      h += '<div class="row"><button class="btn ghost" type="button" id="rst">↺ العودة إلى الألوان الأساسية</button></div>';
    } else h += storeOther(R.tab);
    app.innerHTML = h; bindTop(app);
    app.querySelectorAll("[data-s]").forEach(function (b) { b.addEventListener("click", function () { R.tab = b.dataset.s; applyTheme(S.theme); preview = null; render(); }); });
    app.querySelectorAll("[data-p]").forEach(function (b) { b.addEventListener("click", function () { startPreview(b.dataset.p); }); });
    app.querySelectorAll("[data-a]").forEach(function (b) { b.addEventListener("click", function () { S.theme = b.dataset.a; save(); applyTheme(S.theme); toast("تمّ تفعيل اللون ✓"); render(); }); });
    app.querySelectorAll("[data-b]").forEach(function (b) { b.addEventListener("click", function () { buy(b.dataset.b); }); });
    var r = $("#rst"); if (r) r.addEventListener("click", function () { S.theme = "emerald"; save(); applyTheme("emerald"); toast("عدتَ إلى الألوان الأساسية"); render(); });
    app.querySelectorAll("[data-xb]").forEach(function (b) { b.addEventListener("click", function () { buyItem(b.dataset.k, b.dataset.xb); }); });
    app.querySelectorAll("[data-xa]").forEach(function (b) { b.addEventListener("click", function () { S.sel[b.dataset.k] = b.dataset.xa; save(); if (b.dataset.k === "bg") applyBg(S.sel.bg); toast("تمّ التفعيل ✓"); render(); }); });
    app.querySelectorAll("[data-xp]").forEach(function (b) { b.addEventListener("click", function () { startBgPreview(b.dataset.xp); }); });
  }
  var KIND = { bg: "bg", profile: "card", ach: "ach" };
  function sample(kind, it) {
    if (kind === "card") return '<div class="card hello" style="margin:0;padding:8px 12px;background:' + it.bg + ";color:" + it.fg + ";border:" + it.bd + '"><b>مرحباً يا طالب</b></div>';
    if (kind === "frame") return '<span class="ring" style="--p:70;--rc:' + it.col + ";box-shadow:" + it.glow + ';width:44px;height:44px;color:#fff"><span style="font-size:.7rem;color:var(--ink)">٧٠٪</span></span>';
    if (kind === "bg") return '<span style="display:block;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--bd);background-color:var(--bg);background-image:' + (it.css === "none" ? "none" : it.css) + ';background-size:' + (it.id === "geo" || it.id === "special" ? "32px 32px,cover" : "cover") + '"></span>';
    return "";
  }
  function storeRows(kind, extra) {
    return CAT[kind].map(function (it) {
      var own = S.own[kind].indexOf(it.id) >= 0 || (it.unlock && bgUnlocked(it)), act = S.sel[kind] === it.id, lock = it.unlock && !bgUnlocked(it);
      return '<div class="sw"><span style="flex:none;min-width:48px;display:flex;justify-content:center">' + sample(kind, it) + '</span><span class="tx"><b>' + esc(it.n) + "</b><small>" + (act ? "مفعّل الآن ✓" : lock ? "🔒 أنهِ وحدة كاملة بإتقان (٧٠٪+) لتفتحها" : own ? "مملوك" : toAr(it.price) + " دُرّة") + (it.d ? " • " + esc(it.d) : "") + "</small></span>" +
        (extra && kind === "bg" && !act ? '<button class="btn ghost" type="button" data-xp="' + it.id + '">معاينة</button>' : "") +
        (lock ? "" : own ? (act ? "" : '<button class="btn" type="button" data-k="' + kind + '" data-xa="' + it.id + '">تفعيل</button>') : '<button class="btn gold" type="button" data-k="' + kind + '" data-xb="' + it.id + '">شراء</button>') + "</div>";
    }).join("");
  }
  function storeOther(tab) {
    if (tab === "bg") return '<p class="empty" style="padding:4px 4px 10px">خلفيات التطبيق؛ للوضع الداكن استعمل لون «الليلي» من قسم الألوان.</p>' + storeRows("bg", true);
    if (tab === "profile") return "<h3>بطاقة الطالب</h3>" + storeRows("card") + '<h3 style="margin-top:12px">إطار نسبة التقدّم</h3>' + storeRows("frame");
    return "<h3>تصميم صفحة الإنجازات</h3>" + storeRows("ach");
  }
  function buyItem(kind, id) {
    var it = catItem(kind, id); if (S.own[kind].indexOf(id) >= 0) return;
    if (S.coins < it.price) { toast("رصيدك لا يكفي — تحتاج " + toAr(it.price - S.coins) + " دُرّة إضافية"); return; }
    S.coins -= it.price; S.spent += it.price; S.own[kind].push(id); S.sel[kind] = id; S.log.push({ d: Date.now(), t: "شراء: " + it.n, a: -it.price }); save();
    if (kind === "bg") applyBg(id); toast("تمّ شراء «" + esc(it.n) + "» وتفعيله 🎉"); render();
  }
  function startBgPreview(id) {
    applyBg(id); var o = $(".pbar"); if (o) o.remove(); var it = catItem("bg", id), d = document.createElement("div"); d.className = "pbar";
    d.innerHTML = "<span>معاينة: " + esc(it.n) + '</span><button class="btn ghost" type="button" id="pc">إلغاء المعاينة</button>'; document.body.appendChild(d);
    $("#pc").addEventListener("click", function () { applyBg(S.sel.bg); d.remove(); });
  }
  function startPreview(id) {
    var t = themeById(id); applyTheme(id); preview = id; var o = $(".pbar"); if (o) o.remove(); var own = S.owned.indexOf(id) >= 0;
    var d = document.createElement("div"); d.className = "pbar";
    d.innerHTML = "<span>معاينة: " + t.n + "</span>" + (own ? '<button class="btn" type="button" id="pa">تفعيل</button>' : '<button class="btn gold" type="button" id="pb">شراء بـ ' + toAr(t.price) + " دُرّة</button>") + '<button class="btn ghost" type="button" id="pc">إلغاء المعاينة</button>';
    document.body.appendChild(d);
    var pa = $("#pa"); if (pa) pa.addEventListener("click", function () { S.theme = id; save(); d.remove(); render(); toast("تمّ تفعيل اللون ✓"); });
    var pb = $("#pb"); if (pb) pb.addEventListener("click", function () { d.remove(); buy(id); });
    $("#pc").addEventListener("click", function () { applyTheme(S.theme); d.remove(); preview = null; });
  }
  function buy(id) {
    var t = themeById(id); if (S.owned.indexOf(id) >= 0) return;
    if (S.coins < t.price) { toast("رصيدك لا يكفي — تحتاج " + toAr(t.price - S.coins) + " دُرّة إضافية"); applyTheme(S.theme); return; }
    S.coins -= t.price; S.spent += t.price; S.owned.push(id); S.theme = id; S.log.push({ d: Date.now(), t: "شراء لون: " + t.n, a: -t.price }); save(); applyTheme(id);
    toast("تمّ شراء «" + esc(t.n) + "» وتفعيله 🎉"); render();
  }

  /* ---------------- تقدّمي ---------------- */
  function vProgress(app) {
    var mastered = ALL.filter(function (l) { return (S.L[l.id] || {}).msBest >= 70; }).length, learned = ALL.filter(function (l) { return (S.L[l.id] || {}).learn; }).length;
    var tried = ALL.filter(function (l) { return (S.L[l.id] || {}).msBest; }), avg = tried.length ? Math.round(tried.reduce(function (a, l) { return a + S.L[l.id].msBest; }, 0) / tried.length) : 0;
    var h = top("تقدّمي").replace('data-back', 'data-back');
    h += '<div class="stat"><div class="card"><b>' + toAr(overallPct()) + '٪</b><small>التقدّم الكلّي</small></div><div class="card"><b>' + toAr(learned) + "/" + toAr(ALL.length) + "</b><small>دروس أتممتُ تعلّمها</small></div><div class=\"card\"><b>" + toAr(mastered) + '</b><small>دروس متقنة (٧٠٪+)</small></div><div class="card"><b>' + toAr(avg) + "٪</b><small>متوسط نتائج الإتقان</small></div></div>";
    h += helloCard(overallPct(), userName(), "margin-top:12px;");
    if (S.sel.ach === "medals") h += '<div class="card"><h3>لوحة الأوسمة 🏅</h3><div class="medals">' + ALL.map(function (l, n) { var m = (S.L[l.id] || {}).msBest || 0; return '<div class="medal ' + (m >= 90 ? "g" : m >= 70 ? "s" : "") + '" title="' + esc(l.t) + '">' + toAr(n + 1) + "</div>"; }).join("") + '</div><p class="empty" style="padding:8px 0 0">ذهبي ≥٩٠٪ • فضّي ≥٧٠٪</p></div>';
    else if (S.sel.ach === "path") h += '<div class="card"><h3>مسار الرحلة 🧭</h3><div class="path">' + UNITS.map(function (u) { var p = unitPct(u); return '<div class="pn' + (p >= 70 ? " on" : "") + '"><b>' + (u.id > 6 ? "ف٢ " : "") + toAr(unitNo(u)) + ". " + esc(u.t) + '</b> <small style="color:var(--mut)">' + toAr(p) + '٪</small></div>'; }).join("") + "</div></div>";
    else     h += '<div class="card" style="margin-top:12px"><h3>الوحدات</h3>' + UNITS.map(function (u) { var p = unitPct(u); return "<p style=\"margin:8px 0 0\"><b>" + (u.id > 6 ? "ف٢ " : "") + toAr(unitNo(u)) + ". " + esc(u.t) + '</b> <small style="color:var(--mut)">' + toAr(p) + '٪</small><span class="bar"><i style="width:' + p + '%"></i></span></p>'; }).join("") + "</div>";
    var ms = Object.keys(S.mis).map(function (k) { return S.mis[k]; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 6);
    h += '<div class="card"><h3>الأخطاء المتكرّرة</h3>' + (ms.length ? ms.map(function (m) { return '<div class="rev"><b>' + esc(m.q) + "</b><small>أخطأتَ فيه " + toAr(m.n) + " مرّات</small></div>"; }).join("") : '<p class="empty">لا أخطاء مسجّلة بعد.</p>') + "</div>";
    h += '<div class="card"><h3>دُرّة: الأرباح والمشتريات</h3><p>الرصيد: <b>' + toAr(S.coins) + "</b> • المكتسب: " + toAr(S.earned) + " • المصروف: " + toAr(S.spent) + "</p>" + (S.log.length ? S.log.slice(-8).reverse().map(function (x) { return '<div class="rev"><b>' + (x.a > 0 ? "+" : "") + toAr(x.a) + " دُرّة</b><small>" + esc(x.t) + "</small></div>"; }).join("") : '<p class="empty">لم تكسب عملات بعد، ابدأ درساً!</p>') + "</div>";
    h += '<div class="card"><h3>المفتوح في المتجر</h3><p>' + S.owned.map(function (id) { return themeById(id).n; }).join(" • ") + "</p></div>";
    app.innerHTML = h; bindTop(app);
  }

  /* ---------------- الإعدادات ---------------- */
  var KX = null;
  function vSettings(app) {
    app.innerHTML = top("الإعدادات") + '<div class="card"><h3>الجولة التعريفية</h3><p>أعد جولة كينيكس لتتعرّف على أقسام التطبيق.</p><div id="kxr"></div></div><div class="card"><h3>بوابة الصحابة التعليمية</h3><a class="btn" href="../../index.html">🏠 العودة إلى البوابة</a></div><div class="card"><h3>بياناتي</h3><p>تُحفظ عملاتك وتقدّمك ومشترياتك في هذا الجهاز فقط.</p><button class="btn ghost" type="button" id="wipe" style="color:var(--bad)">🗑️ حذف تقدّمي في هذا التطبيق</button></div><div class="card"><h3>عن التطبيق</h3><p>التربية الإسلامية للصف العاشر — محتوى الكتاب المدرسي (الجزء الأول، الوحدة الأولى حالياً)، وتُضاف بقية الوحدات تباعاً. يعمل بلا إنترنت ويُحدَّث تلقائياً.</p></div>';
    bindTop(app); if (KX) SahabaIntro.replay(KX, $("#kxr"));
    $("#wipe").addEventListener("click", function () { if (confirm("سيُحذف تقدّمك وعملاتك ومشترياتك من هذا الجهاز. هل أنت متأكد؟")) { try { localStorage.removeItem(KEY); } catch (e) {} location.hash = "home"; location.reload(); } });
  }

  /* ---------------- البدء + الغلاف + الجولة ---------------- */
  applyTheme(S.theme); applyBg(S.sel.bg);
  KX = { id: APPID, kinex: "../../shared/kinex.jpg", steps: [
    { t: "أهلاً بك، أنا كينيكس", x: "أهلاً بك يا {name}! أنا مرشدك في بوابة الصحابة التعليمية، وهذا تطبيق التربية الإسلامية للصف العاشر. سأعرّفك عليه في دقيقة، وبعدها أبقى معك في كل درس حتى تتفوّق بإذن الله.", s: null, i: 1 },
    { t: "💎 عملة دُرّة", x: "كلّما أتممتَ درساً أو أتقنتَ اختباراً ربحتَ عملات دُرّة تُحفظ في محفظتك. اضغط عليها لتفتح المتجر.", s: ".wallet" },
    { t: "📚 الفصلان والوحدات", x: "اختر الفصل الأول أو الثاني، ثم الوحدة التي تريدها. الشريط الأخضر يريك تقدّمك في كل وحدة.", s: ".units" },
    { t: "🎯 ثلاثة أوضاع لكل درس", x: "في كل درس تتعلّم أولاً بشرح تفاعلي وبطاقات مراجعة، ثم تتحدّى نفسك بأسئلة متنوّعة، ثم تُثبت إتقانك باختبار شامل يصحّح نفسه ويريك أخطاءك.", s: null },
    { t: "📕 الكتب المدرسية", x: "من هنا تفتح كتاب كل فصل على Google Drive لتراجع منه متى شئت.", s: "#nav [data-g=books]" },
    { t: "💎 متجر دُرّة", x: "اشترِ بعملاتك ألواناً جديدة لتطبيقك، وعاين اللون قبل أن تشتريه، ويمكنك العودة إلى الألوان الأساسية في أي وقت.", s: "#nav [data-g=store]" },
    { t: "📊 تقدّمي", x: "هنا ترى نسبة إتقانك ودروسك وأخطاءك المتكرّرة وأرباحك ومشترياتك.", s: "#nav [data-g=progress]" },
    { t: "أنا معك دائماً 🚀", x: "ابدأ اليوم بدرس واحد وأنا معك. وللعودة إلى بوابة الصحابة التعليمية اضغط زرّ 🏠 أعلى الصفحة. بالتوفيق دائماً! ✨", s: null }],
    cover: "../../shared/covers/islamic.webp", ready: function () { return R.v === "home" && !document.getElementById("shc"); },
    userName: function () { return userName(); } };
  SahabaIntro.run(KX);
  publish(); route();
})();
</script>
<script src="../../shared/update-notify.js" data-app="التربية الإسلامية" data-icon="icon-192.png" defer></script>
</body>
