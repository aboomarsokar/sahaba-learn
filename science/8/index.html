سيوم والأكسجين في طرف النواتج؟","o":["٢ كالسيوم و١ أكسجين","٢ كالسيوم و٢ أكسجين","١ كالسيوم و١ أكسجين","٤ كالسيوم و٢ أكسجين"],"a":1},{"l":2,"k":"p","q":"أُضيفت قطرة من محلول اليود إلى الحليب فلم يتغيّر لونه. ما الاستنتاج الصحيح؟","o":["تكوّن راسب غير مرئي","حدث تفاعل لكن اللون لا يتغيّر","أُنتج غاز عديم اللون","لم يحدث تفاعل كيميائي بين اليود والحليب"],"a":3},{"l":2,"k":"p","q":"في التفاعل 2Al + 3H₂SO₄ ← Al₂(SO₄)₃ + 3H₂، ما الدلالتان على حدوث التفاعل في أنبوب الاختبار؟","o":["تكوّن راسب وانخفاض الحرارة","وميض ضوئي وتغيّر اللون","ارتفاع درجة الحرارة وتصاعد غاز الهيدروجين","تكوّن راسب وتغيّر اللون"],"a":2},{"l":2,"k":"p","q":"ما المعادلة الموزونة لاحتراق الصوديوم في الكلور لتكوين ملح الطعام؟ (Na + Cl₂ ← NaCl)","o":["Na + Cl₂ ← NaCl₂","2Na + Cl₂ ← 2NaCl","2Na + 2Cl₂ ← 2NaCl","Na + Cl₂ ← 2NaCl"],"a":1},{"l":2,"k":"p","q":"في Zn + 2HCl ← ZnCl₂ + H₂ كم ذرّة كلور في الطرف الأيمن؟","o":["٢","١","٤","٠"],"a":0},{"l":2,"k":"p","q":"وازن المعادلة: Mg + HCl ← MgCl₂ + H₂. ما المعادلة الموزونة؟","o":["Mg + 2HCl ← MgCl₂ + H₂","Mg + HCl ← MgCl₂ + H₂","2Mg + HCl ← MgCl₂ + H₂","Mg + 2HCl ← MgCl₂ + 2H₂"],"a":0}],"hints":{"ما الغاز الذي ينتج من تفاعل الخارصين مع حمض الهيدروكلوريك؟":"البالون ينتفخ بغازٍ أخفّ الغازات؛ ما اسم الغاز الذي رمزه H₂؟","ما دلالة حدوث التفاعل عند احتراق المغنيسيوم؟":"المغنيسيوم يحترق بلهبٍ لامع جدّاً.","ما دلالة حدوث التفاعل: AgNO₃(aq) + NaCl(aq) ← AgCl(s) + NaNO₃(aq)؟":"ابحث عن المادة التي حالتها (s) بين النواتج.","وازن المعادلة: HgO(s) ← Hg(l) + O₂(g). ما المعادلة الموزونة؟":"عدد ذرّات الأكسجين في الناتج ٢؛ كم يلزم أن يكون عددها في المتفاعل؟","في المعادلة 2Al + 3H₂SO₄ ← Al₂(SO₄)₃ + 3H₂ كم ذرّة هيدروجين في الطرف الأيسر (المتفاعلات)؟":"اضرب المعامل ٣ في عدد ذرّات الهيدروجين في H₂SO₄."}},{"t":"أنواع المركّبات الكيميائية","e":["# ١- الحموض (أنشطة ١ – ٣)","- أثر الحموض على ورقة دوّار الشمس: تغيّر الحموض لون كاشف دوّار الشمس الأزرق إلى اللون الأحمر، بينما لا يتغيّر لون كاشف دوّار الشمس الأحمر.","- توجد الحموض الطبيعية في الحمضيّات كالليمون والبرتقال، وفي الفواكه كالتفاح والمشمش والخوخ، وفي بعض النباتات الورقية مثل الحميض. وتوجد أنواع عدّة من الحموض الكيميائية.","|الحمض|الصيغة|أهمّيته","|الهيدروكلوريك|HCl|في معدة الإنسان","|الكبريتيك|H₂SO₄|في بطارية السيارة","|النيتريك|HNO₃|في صناعة الأسمدة","|الخليك (الأسيتيك)|CH₃COOH|في صناعة الخل","- توصيل الحموض للتيار الكهربائي: عند غمس صفيحتين متّصلتين بدارة (بطارية ومصباح) في محلول حمض الهيدروكلوريك المخفّف تضيء اللمبة، فالمحلول يوصل التيار الكهربائي.","- انطلاق غاز الهيدروجين: عند وضع شريط مغنيسيوم في حمض الهيدروكلوريك المخفّف يتصاعد غاز الهيدروجين (Mg + 2HCl ← MgCl₂ + H₂). مع احتياطات السلامة: النظارة الواقية والقفّازات واستعمال الحمض المخفّف فقط؛ ويُكشف الغاز بتقريب عود ثقاب مشتعل من فوهة الأنبوب.","! الحموض طعمها حامض، وتغيّر ورقة دوّار الشمس من الأزرق إلى الأحمر، ومحاليلها المائية موصلة للتيار الكهربائي. يُضاف الحمض تدريجياً إلى الماء فيتأيّن الحمض مطلقاً أيون الهيدروجين: HCl(aq) ← H⁺(aq) + Cl⁻(aq).","# ٢- القواعد (أنشطة ٤ – ٥)","- أثر القواعد على ورقة دوّار الشمس: تغيّر القواعد لون كاشف دوّار الشمس الأحمر إلى الأزرق، بينما لا تؤثّر على كاشف دوّار الشمس الأزرق. (تجربة الرماد وهيدروكسيد الصوديوم).","- القواعد ملمسها ناعم كالصابون، كاوية للجلد، وطعمها مرّ، بعضها يذوب في الماء وبعضها لا يذوب. توصل محاليلها التيار الكهربائي.","|القاعدة|الصيغة|الاستخدام","|هيدروكسيد الصوديوم|NaOH|صناعة الصابون الصلب","|هيدروكسيد البوتاسيوم|KOH|صناعة الصابون السائل","|هيدروكسيد المغنيسيوم|Mg(OH)₂|علاج حموضة المعدة","! تتأيّن القواعد في الماء منتجةً أيون الهيدروكسيل OH⁻؛ فمثلاً يتأيّن هيدروكسيد البوتاسيوم: KOH(s) ← K⁺(aq) + OH⁻(aq). وهيدروكسيد الصوديوم: NaOH(s) ← Na⁺(aq) + OH⁻(aq).","# ٣- الأملاح (نشاط ٦)","- عند تفاعل حمض قوي مع قاعدة قوية ينتج ملح وماء، ويُسمّى تفاعل التعادل. الملح مركّب كيميائي ينتج من اتّحاد الشقّ الموجب من القاعدة مع الشقّ السالب من الحمض، مثل Na⁺ مع Cl⁻.","- مثال: NaOH + HCl ← NaCl + H₂O؛ وأثناء إضافة الحمض إلى محلول هيدروكسيد الصوديوم مع التحريك يتحوّل لون ورقة دوّار الشمس إلى الزهري، ثم يُبخَّر الماء فيتكوّن الملح (ملح الطعام).","|الملح|الصيغة|الاستخدام","|كلوريد الصوديوم|NaCl|حفظ الأجبان والمخلّلات","|بايكربونات الصوديوم|NaHCO₃|صناعة الخبز والكعك","|كبريتات المغنيسيوم|MgSO₄|علاج الإمساك","|كبريتات النحاس|CuSO₄|الطلاء الكهربائي","# ٤- الأكاسيد (نشاط ٧)","- عند تسخين الكبريت بلهب بنسن ينتج غاز: الكبريت + الأكسجين ← غاز ثاني أكسيد الكبريت (S + O₂ ← SO₂)، وتتغيّر ورقة دوّار الشمس الزرقاء إلى الحمراء.","- الأكاسيد مركّبات كيميائية تنتج من اتّحاد العنصر مع الأكسجين، وهي نوعان:","- ١- أكاسيد قاعدية: تنتج من تفاعل العنصر الفلزّي (تكافؤه موجب) مع الأكسجين، ومحاليلها تحوّل لون ورقة دوّار الشمس الحمراء إلى اللون الأزرق.","- ٢- أكاسيد حمضية: تنتج من اتّحاد العنصر اللافلزّي (تكافؤه سالب) مع الأكسجين، ومحاليلها تحوّل لون ورقة دوّار الشمس الزرقاء إلى اللون الأحمر.","|الأكسيد|الصيغة|الاستخدام","|ثاني أكسيد الرصاص|PbO₂|صناعة بطارية السيارة","|أكسيد الخارصين|ZnO|صناعة الدهانات","|ثاني أكسيد الكربون|CO₂|إطفاء الحرائق","|أكسيد السيليكون|SiO₂|صناعة الزجاج","! تمرين: Ca(s) + O₂(g) ← 2CaO أكسيد قاعدي (الكالسيوم فلز). C(s) + O₂(g) ← CO₂(g) أكسيد حمضي (الكربون لافلز).","# ملخّص المقارنة بين الأنواع","|النوع|الكاشف|التأيّن / التكوين","|حمض|الأزرق ← أحمر|يعطي H⁺ في الماء","|قاعدة|الأحمر ← أزرق|يعطي OH⁻ في الماء","|ملح|ينتج من تعادل حمض وقاعدة|شقّ موجب من القاعدة وسالب من الحمض","|أكسيد قاعدي / حمضي|قاعدي: يزرّق الأحمر؛ حمضي: يحمرّ الأزرق|فلز + O₂ / لافلز + O₂"],"q":["- كيف تميّز الحمض من القاعدة بورقة دوّار الشمس؟","- اكتب معادلة تأيّن كلٍّ من: HCl وKOH وNaOH في الماء.","- ما تفاعل التعادل؟ وما نواتجه؟ اكتب معادلةً مثالاً عليه.","- ما الفرق بين الأكسيد القاعدي والأكسيد الحمضي؟ مثّل لكلٍّ منهما.","- اذكر مثالاً على استخدام كلٍّ من: حمض، قاعدة، ملح، أكسيد."],"quiz":[{"l":0,"k":"n","q":"كيف تغيّر الحموض لون ورقة دوّار الشمس؟","o":["الأزرق إلى الأخضر","لا تغيّر لونها","الأحمر إلى الأزرق","الأزرق إلى الأحمر"],"a":3},{"l":0,"k":"n","q":"كيف تغيّر القواعد لون ورقة دوّار الشمس؟","o":["الأحمر إلى الأزرق","الأحمر إلى الأخضر","لا تغيّر لونها","الأزرق إلى الأحمر"],"a":0},{"l":0,"k":"n","q":"ما صيغة حمض الهيدروكلوريك؟","o":["HNO₃","H₂SO₄","HCl","CH₃COOH"],"a":2},{"l":0,"k":"n","q" "ما الصوت المنعكس الذي يُسمع بعد زوال الصوت الأصلي؟",["الرنين","الاتّساع","الصدى","التردّد"],2],[1,"موجة تكمل ٨ دورات كلّ ٤ ثوانٍ. ما تردّدها؟",["٠٫٥ هيرتز","٢ هيرتز","٣٢ هيرتز","٤ هيرتز"],1],[1,"طول موجة ٣ سم وزمنها الدوري ٢ ث. ما سرعتها؟",["١٫٥ سم/ث","٦ سم/ث","٣ سم/ث","٠٫٦٧ سم/ث"],0],[1,"أقلّ مسافة بين المصدر والحاجز لسماع الصدى بوضوح في الهواء:",["٣٤ م","٣٤٠ م","٨٫٥ م","١٧ م"],3],[1,"ما مدى التردّد المسموع للإنسان؟",["٦٠ هيرتز – ٦٠ كيلو هيرتز","٧ – ٢٠٠ كيلو هيرتز","٢٠ هيرتز – ٢٠ كيلو هيرتز","١٠ – ٢٠ هيرتز"],2],[2,"سمع شخص صوتاً بعد ٦ ث وكان بعد مصدره ٢٠٤٠ م. ما سرعة الصوت؟",["٣٤ م/ث","٣٤٠ م/ث","١٢٢٤٠ م/ث","٣٤٠٠ م/ث"],1],[2,"موجة سرعتها ٢٠ م/ث وتردّدها ٥ هيرتز. ما طولها الموجي؟",["٤ م","١٠٠ م","٢٥ م","٠٫٢٥ م"],0],[2,"سُمع صدى بعد ٢ ث في الهواء. كم المسافة بين المصدر والحاجز؟",["٦٨٠ م","١٧٠ م","٣٤ م","٣٤٠ م"],3],[2,"إذا تضاعف تردّد موجة مع ثبات سرعتها فإن طولها الموجي:",["يصبح الضعف","لا يتغيّر","يصبح النصف","يصبح أربعة أمثال"],2]],"lessons":[{"t":"خصائص الأمواج","e":["# الموجات المستعرضة","نشاط ١: الموجة المائيّة. يشكّل الماء وسطاً مادّياً تتحرّك فيه الموجة لتُحدث فيه اضطرابات تجعله يتحرّك مهتزّاً إلى الأعلى والأسفل. الأمواج التي تتحرّك بهذه الطريقة تُسمّى الأمواج المستعرضة؛ حيث يكون اتّجاه انتشار الموجة عموديّاً على اتّجاه حركة جزيئات الوسط.","- تكون الرياح هي المسبّب الأساسي لتكوّن الأمواج المائيّة، وكلّما اشتدّت الرياح كبُرت الموجة وزاد ارتفاعها.","- تتحرّك الأمواج في المحيطات والبحار لمسافات طويلة إلى أن تتلاشى عند اصطدامها بالشاطئ.","نشاط ٢: حبل يتراقص. الحبل وسط مادّي تنتقل فيه الموجة، بينما تتحرّك جزيئات الحبل إلى الأعلى والأسفل، فاتّجاه الانتشار عموديّ على اتّجاه حركة الجزيئات، وهي موجة مستعرضة. ويبقى الحبل مكانه.","# الموجات الطوليّة","نشاط ٣: الموجة الطوليّة في نابض (زنبرك). عند سحب النابض بيد وإطلاقه تتحرّك فيه موجة من تضاغطات وتخلخلات، وتتحرّك جزيئات النابض بموازاة اتّجاه حركة الموجة نفسه؛ وتُسمّى موجة طوليّة.","- أمثلة أخرى: لعبة الزنبرك (سلينكي)، وأمواج الصوت التي تنتشر في الهواء تتحرّك كأمواج طوليّة.","# التردّد والزمن الدوري","في نشاط ٤: تكرّر الشريط الملوّن ارتفاعاً وهبوطاً. تمتاز حركة جميع الأمواج بأنها تكرّر نفسها بعد مرور زمن يُسمّى الزمن الدوري للموجة (ن)، حيث تُكمل الموجة دورة كاملة بعد مرور هذا الزمن.","- الزمن الدوري هو الزمن بين قمّتين متتاليتين أو قاعين متتاليين، ويُقاس بالثانية.","- أقصى إزاحة عموديّة للموجة عن المحور الأفقي تُسمّى اتّساع الموجة.","- تردّد الموجة (د) هو عدد الدورات الكاملة التي تتمّها الموجة في الثانية الواحدة، وهو مقلوب الزمن الدوري: د = ١ ÷ ن، ويُقاس بوحدة (١/ث) وتُسمّى الهيرتز (Hz) نسبة إلى العالم هنريتش هيرتز.","# مثال محلول","موجة تكمل ٨ دورات كلّ ٤ ثوانٍ: الزمن الدوري ن = ٤ ÷ ٨ = ٠٫٥ ث، والتردّد د = ١ ÷ ٠٫٥ = ٢ هيرتز.","# الطول الموجي وسرعة الموجة","الطول الموجي (ل) هو مقدار الإزاحة لدورة كاملة، أي المسافة التي تقطعها الموجة خلال زمنها الدوري، وهي المسافة بين قمّتين متتاليتين أو قاعين متتاليين.","! سرعة الموجة = الطول الموجي ÷ الزمن الدوري = الطول الموجي × التردّد، أي: ع = ل ÷ ن = ل × د","# مثال محلول","موجة في حبل طولها الموجي ٣ سم وزمنها الدوري ٢ ث: السرعة = ٣ ÷ ٢ = ١٫٥ سم/ث."],"q":["- ما الفرق بين الموجة المستعرضة والموجة الطوليّة؟ أعطِ مثالاً لكلّ منهما.","- عرّف الزمن الدوري والتردّد، واكتب العلاقة بينهما وبيّن وحدة التردّد.","- ما المقصود بالطول الموجي واتّساع الموجة؟","- موجة تكمل ١٠ دورات كلّ ٥ ثوانٍ: احسب زمنها الدوري وتردّدها.","- اكتب قانون سرعة الموجة، ثم احسب سرعة موجة طولها الموجي ٢ م وتردّدها ١٠ هيرتز."],"quiz":[{"l":0,"k":"n","q":"في الموجة المستعرضة يكون اتّجاه انتشار الموجة بالنسبة لحركة جزيئات الوسط:","o":["عموديّاً","موازياً","مائلاً بزاوية ٤٥°","لولبيّاً"],"a":0},{"l":0,"k":"n","q":"في الموجة الطوليّة يكون اتّجاه حركة جزيئات الوسط بالنسبة لاتّجاه انتشار الموجة:","o":["عموديّاً","مائلاً بزاوية ٤٥°","معاكساً دائماً بزاوية قائمة","موازياً"],"a":3},{"l":0,"k":"n","q":"أيّ الآتي مثال على الموجات الطوليّة؟","o":["الموجة في الحبل المتراقص","موجة مياه البحر","أمواج الصوت في الهواء","الموجة المائيّة المستعرضة"],"a":2},{"l":0,"k":"n","q":"ما الزمن الدوري للموجة؟","o":["عدد الدورات في الثانية","الزمن اللازم لإتمام دورة كاملة","أقصى إزاحة للموجة","المسافة بين قمّتين"],"a":1},{"l":0,"k":"n","q":"ما وحدة قياس التردّد؟","o":["الهيرتز","الثانية","المتر","الجول"],"a":0},{"l":0,"k":"n","q":"ما المسبّب الأساسي لتكوّن الأمواج المائيّة في البحار والمحيطات؟","o":["المدّ فقط","الجاذبيّة الأرضيّة وحدها","الضوء","الرياح"],"a":3},{"l":0,"k":"n","q":"التردّد هو:","o":["الزمن بين قمّتين","أقصى إزاحة للموجة","عدد الدورات الكاملة في الثانية الواحدة","المسافة بين قاعين"],"a":2},{"l":0,"k":"n","q":"الطول الموجي هو المسافة بين:","o":["قمّة وقاع متتاليين دائماً","قمّتين متتاليتين","نقطتين أيّتين","المصدر والشاطئ فقط"],"a":1},{"l":1,"k":"p","q":"موجة تكمل ٨ دورات كلّ ٤ ثوانٍ. ما زمنها الدوري؟","o":["٢ ثانية","٠٫٥ ثانية","٣٢ ثانية","٤ ثوانٍ"],"a":1},{"l":1,"k":"p","q":"الموجة نفسها (٨ دورات كلّ ٤ ث). ما تردّدها؟","o":["٢ هيرتز","٠٫٥ هيرتز","٤ هيرتز","٣٢ هيرتز"],"a":0},{"l":1,"k":"p","q":"موجة زمنها الدوري ٠٫٢ ث. ما تردّدها؟","o":["٠٫٢ هيرتز","٢ هيرتز","٢٠ هيرتز","٥ هيرتز"],"a":3},{"l":1,"k":"p","q":"موجة في حبل: طولها الموجي ٣ سم وزمنها الدوري ٢ ث. ما سرعتها؟","o":["٦ سم/ث","٠٫٦٦ سم/ث","١٫٥ سم/ث","٣ سم/ث"],"a":2},{"l":1,"k":"p","q":"موجة تردّدها ١٠ هيرتز وطولها الموجي ٢ م. ما سرعتها؟","o":["٥ م/ث","٢٠ م/ث","١٢ م/ث","٠٫٢ م/ث"],"a":1},{"l":1,"k":"p","q":"سحبنا نابضاً بيدنا وأطلقناه فتحرّكت جزيئاته بموازاة حركة الموجة. نوع الموجة:","o":["طوليّة","مستعرضة","مائيّة فقط","لا تُعدّ موجة"],"a":0},{"l":1,"k":"p","q":"عند تحريك طرف الحبل إلى الأعلى والأسفل تنتقل الموجة على الحبل. ماذا يحدث لموضع الحبل نفسه؟","o":["ينتقل مع الموجة","يتلاشى","يتحوّل إلى نابض","يبقى مكانه وتتحرّك الموجة فقط"],"a":3},{"l":1,"k":"p","q":"الزمن الدوري لموجة ٤ ثوانٍ. ما الذي يمثّله هذا الزمن على الرسم البياني؟","o":["أقصى ارتفاع للقمّة","المسافة بين قمّة وقاع","الزمن بين قمّتين متتاليتين","عدد القمم"],"a":2},{"l":2,"k":"p","q":"موجة سرعتها ٢٠ م/ث وتردّدها ٥ هيرتز. ما طولها الموجي؟","o":["١٠٠ م","٠٫٢٥ م","٤ م","١٥ م"],"a":2},{"l":2,"k":"p","q":"موجة طولها الموجي ٠٫٥ م وسرعتها ١٠٠ م/ث. ما تردّدها؟","o":["٥٠ هيرتز","٢٠٠ هيرتز","٥٠٠ هيرتز","٠٫٠٠٥ هيرتز"],"a":1},{"l":2,"k":"p","q":"تردّد موجة ٥٠ هيرتز. ما زمنها الدوري؟","o":["٠٫٠٢ ث","٠٫٢ ث","٢ ث","٥٠ ث"],"a":0},{"l":2,"k":"p","q":"تُكمل موجة ٦ دورات في ٣ ثوانٍ. ما تردّدها وزمنها الدوري؟","o":["٢ هيرتز و٢ ث","٠٫٥ هيرتز و٢ ث","١٨ هيرتز و٠٫٠٦ ث","٢ هيرتز و٠٫٥ ث"],"a":3},{"l":2,"k":"p","q":"إذا تضاعف تردّد موجة مع بقاء سرعتها ثابتة فإن طولها الموجي:","o":["يصبح الضعف","لا يتغيّر","يصبح النصف","يصبح أربعة أمثال"],"a":2},{"l":2,"k":"p","q":"موجة زمنها الدوري ٠٫١ ث وطولها الموجي ٢ م. ما سرعتها؟","o":["٠٫٢ م/ث","٢٠ م/ث","٢ م/ث","٢٠٠ م/ث"],"a":1},{"l":2,"k":"p","q":"تُكمل موجة ١٢ دورة في ٦ ثوانٍ وطولها الموجي ٥ سم. ما سرعتها؟","o":["١٠ سم/ث","٢٫٥ سم/ث","٣٠ سم/ث","٦٠ سم/ث"],"a":0},{"l":2,"k":"p","q":"موجتان تقطعان الثانية نفسها: الأولى ٣ دورات والثانية ٥ دورات. أيّهما زمنها الدوري أكبر؟","o":["الثانية","متساويان","لا يمكن المقارنة","الأولى"],"a":3}],"hints":{"في الموجة المستعرضة يكون اتّجاه انتشار الموجة بالنسبة لحركة جزيئات الوسط:":"في الحبل المتراقص: الجزيئات تتحرّك أعلى/أسفل والموجة تنتشر أفقيّاً.","موجة تكمل ٨ دورات كلّ ٤ ثوانٍ. ما زمنها الدوري؟":"ن = الزمن ÷ عدد الدورات.","موجة تردّدها ١٠ هيرتز وطولها الموجي ٢ م. ما سرعتها؟":"ع = ل × د.","موجة سرعتها ٢٠ م/ث وتردّدها ٥ هيرتز. ما طولها الموجي؟":"ل = ع ÷ د.","إذا تضاعف تردّد موجة مع بقاء سرعتها ثابتة فإن طولها الموجي:":"ع = ل × د؛ سرعة ثابتة تعني أن ل و د تتناسبان عكسيّاً.","تُكمل موجة ١٢ دورة في ٦ ثوانٍ وطولها الموجي ٥ سم. ما سرعتها؟":"احسب د أولاً ثم ع = ل × د."}},{"t":"أمواج الصوت","e":["# نشأة الصوت وانتشاره","يُعدّ الصوت وسيلة تخاطب وتفاهم بين الناس. ينتقل الصوت في الهواء على شكل أمواج طوليّة تنشأ من اهتزاز جسم ما، وتتكوّن من تضاغطات وتخلخلات متتابعة، فتتكوّن كل موجة من تضاغط وتخلخل. طول الموجة الواحدة هو المسافة بين مركزي تضاغطين متتاليين أو مركزي تخلخلين متتاليين. وتبلغ سرعة الصوت في الهواء حوالي ٣٤٠ م/ث.","# نشاط ١: الاهتزاز يولّد صوتاً","- عند طرق الشوكة الرنّانة بالمطرقة تُصدر صوتاً، وعند إمساك فرعيها باليد يتوقّف الصوت لتوقّف الاهتزاز.","- تتحرّك الكرة البلاستيكية المعلّقة أمام الشوكة المهتزّة بسبب اهتزازها.","- ينشأ الصوت نتيجة اهتزاز الأجسام وينقطع عند توقّفها، ويصل إلى الأذن على شكل تضاغطات وتخلخلات تسبّب اهتزاز طبلة الأذن ثم انتقاله إلى الأذن الوسطى والداخلية ثم الدماغ الذي يفسّر الصوت.","# نشاط ٢: الصوت لا ينتقل في الفراغ","عند تفريغ الهواء من الناقوس الزجاجي يضعف صوت الجرس ويختفي، وعند عودة الهواء يعود الصوت. فالصوت بحاجة إلى وسط مادّي لينتقل خلاله ولا ينتقل مطلقاً في الفراغ.","# نشاط ٣ و٤: انتقال الصوت في الأوساط","ينتقل الصوت في الأوساط الصُّلبة (مثل الخيط)، والسائلة (مثل الماء)، والغازيّة. وتعتمد سرعته على النسبة بين معاملي المرونة والكثافة للوسط، وكلّما كبُرت هذه النسبة زادت سرعة الصوت.","|الوسط المادي|سرعة الصوت (م/ث)","|الهواء|٣٤٠","|الهيليوم|٩٦٠","|الماء|١٤٨٠","|البنزين|١٢٩٠","|الفولاذ|٥٩٠٠","|النحاس|٣٥٧٠","! سرعة الصوت في الماء أكبر منها في الهواء، وفي الفولاذ أكبر منها في الماء.","# نشاط ٥: الصدى وانعكاس الصوت","تنعكس الأمواج الصوتيّة عند سقوطها على بعض الأجسام وتُسمع مرة أخرى من مكان إصدارها؛ ويُسمّى الصوت المنعكس الصدى. يحتاج الجهاز العصبي إلى فترة زمنيّة لا تقلّ عن ٠٫١ ثانية للتمييز بين إشارتين عصبيّتين، وخلالها يقطع الصوت ٣٤ م ذهاباً وإياباً، فلا تقلّ المسافة بين المصدر والحاجز عن ١٧ م ليُسمع الصدى بوضوح.","- مثال: إذا كان الزمن بين إصدار الصراخ وسماع صداه ٢ ثانية فإن المسافة الكليّة = ٣٤٠ × ٢ = ٦٨٠ م، والمسافة بين الجبلين = ٣٤٠ م.","# نشاط ٦: امتصاص الصوت","تُغلَّف جدران الاستوديوهات والقاعات الكبيرة بمواد لَيّنة قادرة على الاهتزاز وامتصاص طاقة الأمواج الصوتيّة، فتمنع الصدى وتشويش الصوت.","# نشاط ٧: مدى السمع","|الكائن الحي|مدى التردّد المسموع","|الإنسان|٢٠ هيرتز – ٢٠ كيلو هيرتز","|القطط|٦٠ هيرتز – ٦٠ كيلو هيرتز","|الخفاش|٧ كيلو هيرتز – ٢٠٠ كيلو هيرتز","الأصوات التي يقلّ تردّدها عن المدى المسموع تسمّى دون السمعيّة، والتي يزيد تردّدها عنه فوق السمعيّة. وقدرة الكائن الحي على السماع تعود إلى تركيب غشاء الطبلة الذي يهتزّ بتردّد الموجة الواقعة عليه.","# نشاط ٨: التردّد الطبيعي والرنين","لكلّ جسم تردّد خاص به يُسمّى التردّد الطبيعي للجسم. وعندما يهتزّ أحد الأجسام بتردّد مقداره مساوٍ للتردّد الطبيعي لجسم آخر قريب منه فإن الجسم الآخر يبدأ بالاهتزاز، وهذا ما يُسمّى الرنين. ومن أمثلته منع القائد الجنود من السير بانتظام أثناء عبورهم الجسر، وتكسّر زجاج النوافذ بسبب بعض الانفجارات القويّة."],"q":["- لماذا لا ينتقل الصوت في الفراغ؟ صِف النشاط الذي يبيّن ذلك.","- قارن بين سرعة الصوت في الهواء والماء والفولاذ، وما العامل الذي تعتمد عليه؟","- ما الصدى؟ ولماذا يجب أن تكون المسافة بين المصدر والحاجز ١٧ م على الأقلّ؟","- احسب المسافة بين جبلين إذا سُمع الصدى بعد ٢ ثانية وسرعة الصوت ٣٤٠ م/ث.","- ما الرنين؟ أعطِ مثالين، وبيّن لماذا تُغلَّف جدران الاستوديوهات بمواد لينة.","- ما مدى التردّد المسموع للإنسان؟ وما الأصوات فوق السمعيّة ودون السمعيّة؟"],"quiz":[{"l":0,"k":"n","q":"ما الذي يُنتج الصوت؟","o":["اهتزاز الأجسام","سكون الأجسام","انعدام المادة","الضوء"],"a":0},{"l":0,"k":"n","q":"ما سرعة الصوت في الهواء تقريباً؟","o":["٣٠٠ م/ث","١٤٨٠ م/ث","٣٤ م/ث","٣٤٠ م/ث"],"a":3},{"l":0,"k":"n","q":"أمواج الصوت في الهواء هي موجات:","o":["مستعرضة","ضوئيّة","طوليّة","كهرومغناطيسيّة في الفراغ"],"a":2},{"l":0,"k":"n","q":"لماذا لا ينتقل الصوت في الفراغ؟","o":["لأن الفراغ ساخن","لأنه يحتاج إلى وسط مادّي","لأن الصوت ضوء","لأن الفراغ شديد الكثافة"],"a":1},{"l":0,"k":"n","q":"ما الصوت المنعكس الذي نسمعه بعد زوال الصوت الأصلي؟","o":["الصدى","الرنين","الاهتزاز","التضاغط"],"a":0},{"l":0,"k":"n","q":"ما مدى التردّد المسموع للإنسان؟","o":["٦٠ هيرتز – ٦٠ كيلو هيرتز","٧ – ٢٠٠ كيلو هيرتز","صفر – ٢٠ هيرتز","٢٠ هيرتز – ٢٠ كيلو هيرتز"],"a":3},{"l":0,"k":"n","q":"ما ظاهرة اهتزاز جسم ساكن بتأثير جسم مهتزّ بجانبه؟","o":["الصدى","التأثير","الرنين","الشحن"],"a":2},{"l":0,"k":"n","q":"ما الوسط الذي تكون فيه سرعة الصوت أقلّ بين الآتي؟","o":["الماء","الهواء","الفولاذ","النحاس"],"a":1},{"l":1,"k":"p","q":"صرخ هديل في جبل فسمع الصدى بعد ٢ ث. ما المسافة الكليّة التي قطعها الصوت (ذهاباً وإياباً) بسرعة ٣٤٠ م/ث؟","o":["٣٤٠ م","٦٨٠ م","١٧٠ م","١٣٦٠ م"],"a":1},{"l":1,"k":"p","q":"في السؤال السابق، ما المسافة بين هديل والجبل المقابل؟","o":["٣٤٠ م","٦٨٠ م","١٧٠ م","٢ م"],"a":0},{"l":1,"k":"p","q":"ما أقلّ مسافة بين مصدر الصوت والحاجز لسماع الصدى بوضوح؟","o":["٣٤ م","٣٤٠ م","٠٫١ م","١٧ م"],"a":3},{"l":1,"k":"p","q":"سم هو؟",["الصنوبر","الخنشار","البندورة","الأسفاغنوم"],1]],"lessons":[{"t":"تصنيف الكائنات الحية","e":["# لماذا نصنّف؟","يُقسَّم الكائنات الحية بناءً على صفاتٍ مظهرية مشتركة مثل الشكل ومكان المعيشة وطريقة التغذية، وذلك لتسهيل دراستها والتعامل معها ووضع الأنواع المكتشفة حديثاً في مكانها المناسب، وهذا ما يُسمّى علمياً التصنيف.","تطوّر علم التصنيف منذ عهد أرسطو إلى عصرنا الحاضر، وتناول دراسة علمية دقيقة لتنوّع الكائنات الحية تتضمّن تعريفاً لكلٍّ من النوع والجنس.","- النوع: الوحدة الأساسية في تصنيف الكائنات الحية، أفرادٌ متشابهون تركيبياً ووظيفياً قادرون على التزاوج فيما بينهم وإنتاج نسلٍ خصب.","- الجنس: مجموعة أنواع من الكائنات الحية تشترك معاً في صفات مشتركة.","# الاسم العلمي","اتّفق العلماء على اعتماد اللغة اللاتينية في كتابة الاسم العلمي الخاص لكلّ كائن حي لتسهيل التواصل بينهم على اختلاف جنسياتهم ولغاتهم.","- يتكوّن الاسم العلمي من مقطعين: المقطع الأول يدلّ على الجنس ويبدأ بحرفٍ كبير، والمقطع الثاني يدلّ على النوع ويبدأ بحرفٍ صغير.","- يُكتب بخطٍّ مائل، وإذا كُتب بخط اليد يوضع خطٌّ تحت كلّ مقطع.","- الاسم العلمي للقطّة Felis catus، وللإنسان Homo sapiens (Homo جنس، sapiens نوع)، وللغزال الجبلي الفلسطيني Gazella gazella gollica.","! الاسم العلمي يميّز الكائن عن أفراد الجنس الواحد من الكائنات الحية.","# مستويات التصنيف","تُوضع الأنواع المتشابهة في جنس، والأجناس المتشابهة في عائلة (فصيلة)، والعائلات المتشابهة في رتبة، والرتب المتشابهة في صفّ (طائفة)، والصفوف المتشابهة في قبيلة (شعبة)، والقبائل المتشابهة في مملكة.","|المستوى|مثال: القطّ","|المملكة|الحيوانية","|القبيلة|الحبليات","|الصف|الثدييات","|الرتبة|اللواحم","|العائلة|السنوريات","|الجنس|Felis (وللنمر والأسد Panthera)","مثال للمقارنة: النوع كالمنزل، والجنس كالشارع، والعائلة كالحيّ، والرتبة كالمدينة، ثم المحافظة فالدولة فالقارة. ومثال نباتي: الجنس Rosa، العائلة الوردية، الرتبة الورديات، الصف ذات الفلقتين، القبيلة البذريات، المملكة النباتية.","! النمر والأسد من الجنس نفسه (Panthera)؛ وإن كان الأسد من نوع leo فاسمه العلمي Panthera leo.","# تطوّر أنظمة التصنيف","- أرسطو أوّل من صنّف الكائنات الحية، وأضاف جون ري مفهوم النوع.","- لينيوس صنّفها إلى مملكتين: نباتية وحيوانية.","- ظهرت كائنات تجمع صفات النبات والحيوان مثل اليوغلينا والتريبانوسوما وفطر الترايكوفايتون (سبب القدم الرياضي)، فوضع العالم الأمريكي ويتكر في القرن العشرين نظاماً من خمس ممالك: البدائيات والطلائعيات والفطريات والنباتات والحيوانات.","- في القرن الحادي والعشرين صنّف فوستا وزملاؤه الكائنات إلى ثلاثة مجالات: البكتيريا القديمة، والبكتيريا الحقيقية، وحقيقية النواة (طلائعيات، فطريات، نباتات، حيوانات)، وبذلك يصبح عدد الممالك ست.","- سنتناول الكائنات وفق تصنيف ويتكر."],"q":["- ما التصنيف؟ ولماذا نصنّف الكائنات الحية؟","- عرّف النوع والجنس.","- ما قواعد كتابة الاسم العلمي؟ وما دلالة كلّ مقطع؟","- رتّب مستويات التصنيف من الأصغر إلى الأكبر.","- ما الممالك الخمس في تصنيف ويتكر؟ ولماذا ظهر هذا التصنيف؟"],"quiz":[{"l":0,"k":"n","q":"ما الوحدة الأساسية في تصنيف الكائنات الحية؟","o":["النوع","الجنس","العائلة","المملكة"],"a":0},{"l":0,"k":"n","q":"ما اللغة المعتمدة لكتابة الاسم العلمي؟","o":["العربية","اللاتينية","الإنجليزية","اليونانية"],"a":1},{"l":0,"k":"n","q":"من مقطعين يتكوّن الاسم العلمي، فأيّهما يدلّ على الجنس؟","o":["المقطع الثاني","المقطع الأول","كلاهما","لا يدلّ أيّ منهما على الجنس"],"a":1},{"l":0,"k":"n","q":"كيف يُكتب الاسم العلمي مطبوعاً؟","o":["بخطٍّ عريض فقط","بين قوسين","بخطٍّ مائل","بحروف عربية"],"a":2},{"l":0,"k":"n","q":"كم ممالك الكائنات الحية حسب ويتكر؟","o":["5","4","6","8"],"a":0},{"l":0,"k":"n","q":"من العالم الذي صنّف الكائنات إلى مملكتين: نباتية وحيوانية؟","o":["ويتكر","لينيوس","أرسطو","فوستا"],"a":1},{"l":0,"k":"n","q":"ما أكبر مستوى في مستويات التصنيف؟","o":["القبيلة","الصف","المملكة","النوع"],"a":2},{"l":0,"k":"n","q":"أيّ الأسماء العلمية الآتية للإنسان مكتوبٌ بصورة صحيحة؟","o":["Homo sapiens","homo sapiens","Homo Sapiens","homo Sapiens"],"a":0},{"l":1,"k":"p","q":"كائنان يتزاوجان وينتجان نسلاً عقيماً. هل هما من نوعٍ واحد؟","o":["نعم دائماً","نعم إن تشابها في الشكل فقط","لا؛ لأن النوع ينتج نسلاً خصباً","لا يمكن معرفة ذلك أبداً"],"a":2},{"l":1,"k":"p","q":"إذا كان الأسد من نوع leo وهو من الجنس Panthera كالنمر ات في مملكة واحدة فقط","لأن كائنات جمعت صفات النبات والحيوان لم تجد مكاناً مناسباً","لأنه لم يستعمل أسماء","لأنه أنشأ ست ممالك"],"a":1},{"l":2,"k":"p","q":"أيّ الكائنات الآتية ينتمي إلى الجنس نفسه؟","o":["النمر والأسد","القطة والأسد","القطة والنمر","الإنسان والقطّة"],"a":0},{"l":2,"k":"p","q":"في التصنيف الهرمي للقط: في أيّ مستوىً تقع «الثدييات»؟","o":["الرتبة","القبيلة","العائلة","الصف"],"a":3}],"hints":{"من مقطعين يتكوّن الاسم العلمي، فأيّهما يدلّ على الجنس؟":"هو المقطع الذي يبدأ بحرف كبير.","كائنان يتزاوجان وينتجان نسلاً عقيماً. هل هما من نوعٍ واحد؟":"تذكّر تعريف النوع: التزاوج وإنتاج نسلٍ ماذا؟","رتّب تصاعدياً: الصف، النوع، العائلة، الجنس.":"ابدأ من أكثر المجموعات تشابهاً بين أفرادها."}},{"t":"ممالك البدائيات والطلائعيات والفطريات","e":["# مملكة البكتيريا (البدائيات)","تُعدّ البكتيريا من الكائنات الحية بدائية النواة. منها النافع للإنسان كالبكتيريا المستخدمة في الصناعة وإنتاج الهرمونات، ومنها الضارّ الذي يسبّب أمراضاً للإنسان والحيوان والنبات.","- تُصنَّف البكتيريا بطرق عدّة: حاجتها للأكسجين، ونوع تغذيتها، ودرجة الحرارة، وشكلها.","- تركيبها: سيتوبلازم يحتوي كروموسوماً منفرداً ويخلو من العضيّات المتخصّصة، ولها أسواط أو أهداب في بعض الأنواع، ومادة وراثية.","- تُصنَّف حسب الحركة إلى بكتيريا متحركة بالأسواط أو الأهداب، وبكتيريا غير قادرة على الحركة، ولا تمتلك جميع الأنواع العدد نفسه من الأسواط.","- تتكاثر لاجنسياً بالانشطار الثنائي.","# مملكة الطلائعيات","تُقسَّم إلى: طلائعيات شبيهة بالنباتات (الطحالب)، وطلائعيات شبيهة بالحيوانات (الأوّليات)، وطلائعيات شبيهة بالفطريات (الفطريات الغروية).","- من الطلائعيات التي تعيش في مياه البرك والمستنقعات: اليوغلينا، السبيروجيرا، البراميسيوم، الأميبا. واخضرار مياه البرك الراكدة سببه الطحالب.","- الطحالب: من أقدم الكائنات الحية (أحافير تعود لملايين السنين) وفوائدها في الزراعة والصناعة والطب والغذاء وهندسة الجينات.","- تُصنَّف حسب الصبغة الموجودة في خلاياها (إضافةً إلى الكلوروفيل) إلى خضراء وحمراء وبنية وذهبية، وهي ذاتية التغذية ضوئياً، وتختلف في تركيب جُدر خلاياها وطبيعة الغذاء الذي تخزّنه (فالدياتومات تخزّن الغذاء زيوتاً).","# الأوّليات والمرض","تنتقل معظم مسبّبات أمراض الأوّليات عبر كائنٍ حيّ ناقل، وتُصنَّف إلى أربع قبائل:","|القبيلة|مثال","|السوطيات|تريبانوسوما","|الأميبيات|أميبا","|البوغيات|بلازموديوم","|الهدبيات|براميسيوم","# الطلائعيات شبيهة الفطريات","تعيش الفطريات الغروية في التربة الرطبة وقطع الخشب المتعفّنة وأوراق النباتات وعلى المواد العضوية المتحلّلة، وتبدو كتلاً بروتوبلازمية لزجة بألوان مختلفة، وتنتج أجساماً ثمرية شبيهة بتركيب الفطريات.","# مملكة الفطريات","- الخميرة: حقيقية النواة، وحيدة الخلية، غير ذاتية التغذية، تتكاثر لاجنسياً بالتبرعم، تُضاف إلى العجين لتكسبه نكهة مميزة وتنفخه وتعطيه القوام المطلوب.","- خصائص الفطريات: حقيقية النواة، منها وحيد الخلية (الخميرة) وعديد الخلايا (المشروم).","- طريقة التكاثر: جنسي (البياض الدقيقي) أو لاجنسي (عفن الخبز).","- طريقة التغذية: ترمّم (عفن البنسيليوم)، وتقايض (فطر يتقايض مع الطحالب)، وتطفّل (فطر القدم الرياضي).","- تنمو الفطريات في بيئاتٍ رطبة، وفلسطين مشهورة بتنوّعها."],"q":["- ما الأجزاء الرئيسة للخلية البكتيرية؟ وما أهمية الأسواط والمادة الوراثية؟","- إلامَ تُقسَّم مملكة الطلائعيات؟ مع مثالٍ لكلّ قسم.","- كيف تُصنَّف الطحالب؟ وما سبب اخضرار مياه البرك الراكدة؟","- اذكر قبائل الأوّليات الأربع مع مثالٍ لكلٍّ منها.","- قارن بين التغذية الترمّمية والتطفّلية والتقايض في الفطريات مع مثال."],"quiz":[{"l":0,"k":"n","q":"البكتيريا من الكائنات الحية:","o":["بدائية النواة","حقيقية النواة","عديمة المادة الوراثية","ذات جدار نباتي وبلاستيدات"],"a":0},{"l":0,"k":"n","q":"كيف تتكاثر البكتيريا لاجنسياً؟","o":["التبرعم","التجزئة","الانشطار الثنائي","بالأبواغ فقط"],"a":2},{"l":0,"k":"n","q":"أيّ الآتية من الطلائعيات الشبيهة بالنباتات؟","o":["الأوّليات","الفطريات الغروية","المشروم","الطحالب"],"a":3},{"l":0,"k":"n","q":"ما الكائن الذي ينتمي إلى قبيلة الهدبيات؟","o":["البلازموديوم","البراميسيوم","الأميبا","التريبانوسوما"],"a":1},{"l":0,"k":"n","q":"ما سبب اخضرار مياه البرك الراكدة؟","o":["تكاثر البلازموديوم","وجود المشروم","بكتيريا الجرح","نمو الطحالب"],"a":3},{"l":0,"k":"n","q":"كيف تتكاثر الخميرة؟","o":["التجزئة","الانشطار الثنائي","التبرعم","الدرنات"],"a أوراق إلى السيقان والجذور","وتُصنَّف النباتات الوعائية إلى نباتات لابذرية ونباتات بذرية.","- النباتات اللابذرية: تعيش في أماكن يتوفّر فيها الظلّ والرطوبة، وتتكاثر بالأبواغ الموجودة في محافظ بوغية على السطح السفلي للورقة، مثل الخنشار وكزبرة البئر.","- النباتات البذرية: تكوّن بذوراً تتكاثر بها، وتُصنَّف إلى معرّاة البذور ومغطّاة البذور.","# النباتات معرّاة البذور","تتواجد بذورها في إبط كلّ حرشفة من حراشف المخروط الأنثوي (مثل الصنوبر)، أي أنها ظاهرة غير مغطّاة بثمرة، ومن هنا جاءت التسمية.","- تضمّ المخروطيات أشجاراً كبيرة مثل الصنوبر والسرو والكينا والإثل، ويصل ارتفاع معظم أنواعها إلى أكثر من عشرين متراً.","- تتميّز بقوّتها في تحمّل الرياح ومقاومة الجفاف وانخفاض الحرارة وتراكم الثلوج.","- أوراقها رفيعة إبرية مغطّاة بمادة شمعية ما يقلّل التبخّر ويساعد في احتفاظ الأوراق بالماء.","# النباتات مغطّاة البذور","تتواجد بذورها داخل الثمار (مثل البندورة). ويُستخرج من ثمار كثير منها وبذورها زيوتٌ متنوعة لها استخدامات عديدة إضافةً إلى كونها مادة غذائية، مثل الزيتون والسمسم والذرة الصفراء.","تُصنَّف اعتماداً على عدد فلقات البذرة:","|ذوات الفلقة الواحدة|ذوات الفلقتين","|عروق الأوراق متوازية|عروق الأوراق متشابكة","|القمح والشعير والذرة|الفول والخرّوب والعدس"],"q":["- لماذا سُمّيت النباتات اللاوعائية بهذا الاسم؟ وما أجزاؤها؟","- ما وظيفة كلٍّ من الخشب واللحاء؟","- كيف تتكاثر النباتات اللابذرية؟ وأين توجد الأبواغ؟","- ما سبب تسمية النباتات معرّاة البذور؟ وما تلاؤم أوراق المخروطيات مع بيئتها؟","- قارن بين ذوات الفلقة وذوات الفلقتين من حيث عدد الفلقات وشكل عروق الأوراق مع مثالين."],"quiz":[{"l":0,"k":"n","q":"لماذا سُمّيت النباتات اللاوعائية بهذا الاسم؟","o":["لافتقارها إلى الأوراق","لأنها تعيش في الماء","لافتقارها إلى أوعية ناقلة","لأنها لا تتكاثر"],"a":2},{"l":0,"k":"n","q":"أيّ الآتية من النباتات اللاوعائية؟","o":["الخنشار","الصنوبر","الأسفاغنوم","البندورة"],"a":2},{"l":0,"k":"n","q":"ما الوعاء الذي ينقل الماء والأملاح من الجذور إلى الأوراق؟","o":["اللحاء","الخشب","الفلقة","المخروط"],"a":1},{"l":0,"k":"n","q":"ما الوعاء الذي ينقل الغذاء من الأوراق إلى باقي أجزاء النبات؟","o":["الخشب","اللحاء","الحرشفة","الجدار الخلوي"],"a":1},{"l":0,"k":"n","q":"كيف تتكاثر النباتات اللابذرية؟","o":["بالبذور","بالأبواغ","بالثمار","بالانقسام المنصف فقط"],"a":1},{"l":0,"k":"n","q":"أين توجد بذور النباتات معرّاة البذور؟","o":["في إبط حراشف المخروط الأنثوي","داخل الثمار","في الجذور","في الأوراق"],"a":0},{"l":0,"k":"n","q":"أين توجد البذور في النباتات مغطّاة البذور؟","o":["على المخروط","في الأبواغ","داخل الثمار","لا توجد بذور"],"a":2},{"l":0,"k":"n","q":"أيّ الأشجار الآتية من المخروطيات؟","o":["الزيتون","القمح","البندورة","الصنوبر"],"a":3},{"l":1,"k":"p","q":"نبتةٌ صغيرة بين 1 و20 سم تنمو على صخرٍ رطب بلا جذور حقيقية. ماذا تكون؟","o":["نباتاً بذرياً","نباتاً لاوعائياً","شجرة مخروطية","نباتاً مغطّى البذور"],"a":1},{"l":1,"k":"p","q":"وُجدت نقاط بنّية على السطح السفلي لورقة نبات يعيش في الظلّ. ماذا تحتوي؟","o":["بذوراً داخل ثمرة","محافظ بوغية فيها أبواغ","جذوراً","بلاستيدات ملوّنة فقط"],"a":1},{"l":1,"k":"p","q":"لماذا تحتفظ أوراق الصنوبر بالماء رغم الجفاف؟","o":["لأنها إبرية مغطّاة بمادة شمعية تقلّل التبخّر","لأنها عريضة","لأنها تفتقر إلى الأوعية","لأنها بلا أوراق"],"a":0},{"l":1,"k":"p","q":"بذرة تحوي فلقتين وأوراقها عروقها متشابكة. أيّ هذه النباتات؟","o":["القمح","الذرة","الفول","الشعير"],"a":2},{"l":1,"k":"p","q":"نبات ذو عروق متوازية في أوراقه. إلى أيّ مجموعة ينتمي؟","o":["ذوات الفلقة الواحدة","ذوات الفلقتين","معرّاة البذور","اللابذرية"],"a":0},{"l":1,"k":"p","q":"ما أساس تصنيف النباتات مغطّاة البذور إلى مجموعتين؟","o":["لون الزهرة","طول الساق","مكان المعيشة","عدد فلقات البذرة"],"a":3},{"l":1,"k":"p","q":"ما العضو الذي يُستخرج منه زيت الزيتون؟","o":["الجذر","الثمرة","الورقة","الساق"],"a":1},{"l":1,"k":"p","q":"الصنوبر يتحمّل الرياح والثلوج. أيّ صفة تدعم ذلك؟","o":["أوراقه العريضة الرقيقة","قوّته وأوراقه الإبرية الشمعية","افتقاره إلى الساق","كونه لاوعائياً"],"a":1},{"l":2,"k":"p","q":"صنّف: الخنشار، الصنوبر، البندورة، الأسفاغنوم إلى (لاوعائي، وعائي لابذري، معرّاة البذور، مغطّاة البذور).","o":["الأسفاغنوم مغطّاة، البندورة لاوعائي، الصنوبر لابذري، الخنشار معرّاة","كلها وعائية بذرية","كلها لاوعائية","الأسفاغنوم لاوعائي، الخنشار وعائي لابذري، الصنوبر معرّاة، البندورة مغطّاة"],"a":3},{"l":2,"k":"p","q":"ما الاسم الأنسب لنبات تتكاثر به الأبواغ وتنقل المواد فيه أوعية ويعيش في الظلّ والرطوبة؟","o":["نبات لاوعائي","نبات وعائي لابذري","نبات معرّاة البذور","نبات مغطّى البذور"],"a":1},{"l":2,"k":"p","q":"أيّ العبارات صحيحة؟","o":["الخشب ينقل الغذاء واللحاء ينقل الماء","الخشب واللحاء يوجدان في اللاوعائيات","الخشب ينقل الماء والأملاح واللحاء ينقل الغذاء","الخشب واللحاء ينقلان البذور"],"a":2},{"l":2,"k":"p","q":"تضمّ مخروطات الصنوبر بذوراً ظاهرة على حراشفها، بينما البندورة بذورها داخل ثمرة. ما الفرق الصحيح؟","o":["الأول مغطّاة والثاني معرّاة","كلاهما لابذري","الأول معرّاة البذور والثاني مغطّاة البذور","كلاهما لاوعائي"],"a":2},{"l":2,"k":"p","q":"لماذا تحتاج النباتات الوعائية إلى أوعية ناقلة بخلاف الطحالب والحزازيات الصغيرة؟","o":["لتنقل الماء والغذاء بين الجذور والأوراق في جسمها الكبير","لتتكاثر بالأبواغ","لتصبح بلا بذور","لتفقد أوراقها"],"a":0},{"l":2,"k":"p","q":"السمسم والزيتون والذرة نباتات منتجة للزيت. أيّها يُصنَّف ذوات الفلقة الواحدة؟","o":["الذرة","الزيتون","السمسم","جميعها ذوات فلقتين"],"a":0},{"l":2,"k":"p","q":"لماذا يصعب ظهور نباتٍ لاوعائي بارتفاع عشرات الأمتار؟","o":["لأنه يملك جذوراً قوية","لأن بذوره ثقيلة","لأنه يفتقر إلى أوعية ناقلة تنقل الماء إلى الأعالي","لأن أوراقه شمعية"],"a":2},{"l":2,"k":"p","q":"ما الصفة المشتركة بين المخروطيات الكبيرة كالصنوبر والسرو؟","o":["أوراق عريضة وبذور داخل الثمار","بلا جذور","تتكاثر بالأبواغ","ارتفاع كبير وأوراق إبرية"],"a":3}],"hints":{"أيّ الآتية من النباتات اللاوعائية؟":"اللاوعائيات لها أشباه جذور وسيقان وأوراق.","ما الوعاء الذي ينقل الغذاء من الأوراق إلى باقي أجزاء النبات؟":"اسأل: أيّهما يحمل الغذاء المصنوع في الأوراق؟","نبتةٌ صغيرة بين 1 و20 سم تنمو على صخرٍ رطب بلا جذور حقيقية. ماذا تكون؟":"فكّر في النباتات التي بلا أوعية ناقلة وبحجم صغير.","صنّف: الخنشار، الصنوبر، البندورة، الأسفاغنوم إلى (لاوعائي، وعائي لابذري، معرّاة البذور، مغطّاة البذور).":"ابدأ بالسؤال: هل لها أوعية ناقلة؟ ثم هل تكوّن بذوراً؟"}},{"t":"المملكة الحيوانية","e":["# تصنيف الحيوانات","تُصنَّف الحيوانات إلى فقاريات ولافقاريات اعتماداً على وجود العمود الفقري أو عدمه، وقد تُصنَّف أيضاً بحسب مكان معيشتها إلى مائية أو برّية.","# أولاً: اللافقاريات","تُقسَّم إلى 8 قبائل: المساميات، اللاسعات، الديدان المفلطحة، الديدان الأسطوانية، الديدان الحلقية، الرخويات، الجلد شوكيات، المفصليات.","- المساميات (الإسفنجيات): تعيش في المياه فرادى أو مستعمرات مثبتة على الصخور، من أبسط اللافقاريات، تغذيتها غير ذاتية، جسمها كالإناء فيه مسامّ وثغور (فسُمّيت المساميات)، ولا أنسجة ولا أعضاء ولا أجهزة لها.","- اللاسعات (الجوفمعويات): تعيش في المياه المالحة وبعضها في العذبة، فرادى (هيدرا، قنديل البحر) أو مستعمرات (شقائق النعمان، المرجان). لها تجويف معوي يتصل بالخارج بالفم (فسُمّيت الجوفمعويات) ولوامس فيها خلايا لاسعة تشلّ حركة الفريسة وتدافع عن النفس. لسعة قنديل البحر مؤلمة وسامّة ويُسعَف باستعمال الخلّ أو عصير الليمون لأن إفرازات اللسعة مادة قاعدية.","# الديدان والرخويات والجلد شوكيات","- الديدان (المفلطحة، الأسطوانية، الحلقية): لافقاريات ثلاثية الطبقات؛ المفلطحة بلا تجويف جسمي، والأسطوانية والحلقية لها تجويف جسمي. نافعها ديدان الأرض (تزيد خصوبة التربة وتهويتها) وضارّها الأسكارس. وعثر بلهارس عام 1851م على البلهارسيا وتنتقل يرقاتها عبر قواقع مائية ناقلة وتعيش في الأوعية الدموية.","- الرخويات: آلاف الأنواع؛ بعضها ناعم الجسم كالأخطبوط والحبّار، وبعضها له غطاء خارجي كالمحار والحلزون، ويتكوّن جسمها من الرأس والقدم والكتلة الحشوية.","- الجلد شوكيات: حيوانات بحرية بطيئة الحركة، جلدها سميك عليه أشواك، لها هيكل داخلي كلسي، مثل نجم البحر وقنفذ البحر وخيار البحر.","# المفصليات","أكثر من مليون نوع، وهي أكبر قبيلة عدداً في المملكة الحيوانية، وسُمّيت بذلك لأن أجسامها وأقدامها متمفصلة.","|الصف|مثال","|العنكبيات|العقرب","|عديدة الأرجل|عصا موسى وأمّ أربع وأربعين","|القشريات|الجمبري","|الحشرات|النحل","# ثانياً: الحبليات (الفقاريات)","سُمّيت الحبليات لاحتواء أجنّتها على حبلٍ ظهري قد يختفي أو يتحوّل إلى عمود فقري من عظام أو غضاريف يمتدّ على الناحية الظهرية، وهي الفقاريات، وتشمل اللافكيات والفكيات (الأسماك والبرمائيات والزواحف والطيور والثدييات).","|الصف|أهمّ صفاته","|الأسماك الغضروفية|هيكل غضروفي، كلها في المياه المالحة، 5 أزواج خياشيم أو أكثر على جانبي الجسم، أمثلة: القرش والوطواط","|الأسماك العظمية|هيكل عظمي، مالحة وعذبة، شكل انسيابي وجسم مغطى بقشور، أمثلة: البلطي والسلمون، مثانة عوم تمكّنها من الطفو والغوص (مبدأ الغواصات)","|البرمائيات|جلد رطب غير مغطى، يوضع البيض قرب الماء ويُخصَّب خارجياً، صغارها تتنفس بالخياشيم وتتحول إلى ضفادع تتنفس بالرئتين (علاجم، سلمندرات، ضفادع)","|الزواحف|تتنفس بالرئتين، حراشف قرنية، دم بارد وبيات شتوي، أطراف قصيرة تزحف","|الطيور|فقاريات تتكاثر بالبيض، جسم مغزلي مغطى بالريش، دم حارّ، أجنحة، بعضها لا يطير كالبطريق والنعام","|الثدييات|دم حارّ، جلد مغطى بالشعر أو الوبر أو الصوف أو الفراء، ترضع صغارها بالغدد اللبنية","- الأسماك والبرمائيات والزواحف من ذوات الدم البارد (تتغيّر حرارتها بحرارة الوسط)، والطيور والثدييات من ذوات الدم الحار (حرارتها ثابتة).","# أنواع الثدييات","- الأوّلية: تضع بيضاً يفقس خارج جسمها، مثل آكل النمل الشوكي وخلد الماء.","- الكيسية: صغارها غير مكتملة النموّ فتدخل كيساً في بطن الأمّ وتلتقط الأثداء، مثل الكنغر والكوالا (موطنهما أستراليا).","- المشيمية: تكمل أجنّتها نموّها داخل الرحم وتتّصل بدم الأمّ بالحبل السري والمشيمة، مثل الماعز والإنسان."],"q":["- اذكر قبائل اللافقاريات الثماني.","- لماذا سُمّيت المساميات واللاسعات بهذا الاسم؟ وكيف تُسعَف لسعة قنديل البحر ولماذا؟","- اذكر أمثلة على المفصليات وصفوفها، وما سبب تسميتها؟","- قارن بين الأسماك الغضروفية والعظمية.","- ما الفروق بين الثدييات الأولية والكيسية والمشيمية؟"],"quiz":[{"l":0,"k":"n","q":"كم قبيلة من اللافقاريات في المملكة الحيوانية بحسب الكتاب؟","o":["أربع","ستّ","اثنتا عشرة","ثمانٍ"],"a":3},{"l":0,"k":"n","q":"لماذا سُمّيت المساميات بهذا الاسم؟","o":["لأنها تعيش في الماء","لأن جسمها فيه مسامّ وثغور","لأن لها لوامس","لأن لها مثانة عوم"],"a":1},{"l":0,"k":"n","q":"ما سبب تسمية اللاسعات بهذا الاسم؟","o":["وجود تجويف معوي","وجود أسواط","احتواء لوامسها على خلايا لاسعة","وجود مسامّ"],"a":2},{"l":0,"k":"n","q":"ما أكبر قبيلة من حيث العدد في المملكة الحيوانية؟","o":["الرخويات","المفصليات","الديدان
