<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>العلوم العامة — الصف الثامن</title>
<meta name="theme-color" content="#0a5230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../shared/icons/portal-192.png">
<link rel="apple-touch-icon" href="../../shared/icons/portal-180.png">
<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--hd:#0a5230;--hd2:#073d22;--bg:#FAF6EB;--card:#fff;--ink:#0a5230;--mut:#4b7a5f;--g:#00a152;--y:#ffc107;--bd:#e9dfc8;--ok:#1f9d55;--bad:#d63c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
/* الرأس */
.hdr{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 40px;position:relative}
.hdr .row1{display:flex;align-items:center;gap:12px}
.av{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--y);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--g);font-weight:700;font-size:1.4rem}
.av img{width:100%;height:100%;object-fit:cover}
.hi{flex:1;min-width:0}.hi b{display:block;font-size:1.2rem;line-height:1.3}
.pts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#f3dc92;font-size:.9rem;margin-top:0}
.pts .dr-chip{padding:0 9px !important;font-size:.78rem !important}
.portal{display:flex;align-items:center;gap:6px;color:var(--y);text-decoration:none;font-weight:700;font-size:.9rem;flex:none}
.portal svg{width:24px;height:24px}
.sheet{background:var(--bg);margin-top:-26px;border-radius:26px 26px 0 0;padding:12px 16px 0;position:relative}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--bd);border-radius:999px;padding:6px 14px;margin-bottom:6px}
.search input{border:0;outline:0;background:transparent;flex:1;font:inherit;color:var(--ink);min-width:0}
.search svg{width:20px;height:20px;color:var(--mut);flex:none}
.sec{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:700;margin:4px 0 8px}
.sec i{font-style:normal;color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;grid-auto-rows:clamp(92px,calc((100svh - 300px) / 4),132px)}
.uc{border:0;border-radius:18px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;box-shadow:0 5px 0 var(--s,#007a3d);color:#fff;text-align:center;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.uc svg{width:clamp(36px,6.5svh,52px);height:clamp(36px,6.5svh,52px);flex:none;background:#fff;border-radius:50%;padding:5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.uc b{font-size:.92rem;line-height:1.25}
.uc small{font-size:.74rem;opacity:.95;font-weight:600}
.uc .dn{position:absolute;top:6px;inset-inline-start:6px;background:#fff;border-radius:99px;font-size:.68rem;padding:0 7px;font-weight:700;color:var(--g)}
#drToast{top:0 !important;bottom:auto !important;border-radius:0 0 14px 14px !important;font-size:.72rem !important;padding:3px 14px !important;opacity:.92}
.card>svg{width:60px;height:60px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:right}
.cont .t{flex:1;min-width:0}.cont .t b{display:block;font-size:1.1rem}.cont .t small{color:var(--mut)}
.bar{height:10px;background:#ece6d4;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--y);border-radius:99px}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:var(--ink);background:conic-gradient(var(--y) calc(var(--p)*1%),#ece6d4 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.85rem}
.daily{background:linear-gradient(135deg,#f6e3a1,#ffc107);border:2px solid #cfa23a;border-radius:26px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.daily .tr{font-size:3rem;line-height:1}
.daily b{font-size:1.3rem;display:block}.daily small{display:block;margin:2px 0 10px;color:#4a3a10}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--hd);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700}
.cta.alt{background:var(--g)}
/* التنقّل */
.nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);border-radius:26px 26px 0 0;display:grid;grid-template-columns:repeat(var(--n,5),1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(17,61,46,.08);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8a8a8a;text-decoration:none;font-size:.82rem;font-weight:700;padding:4px 0}
.nav a svg{width:28px;height:28px}
.nav a.on{color:#b8902f}
/* شاشات داخلية */
.top{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.4}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:1.3rem}
.body{padding:16px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;width:100%;text-align:right;text-decoration:none;color:inherit}
.row .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:700;background:#fbf0c8;border:1px solid var(--y)}
.row .ic svg{width:34px;height:34px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx small{color:var(--mut)}
.row .go{color:var(--mut);font-size:1.3rem}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:#e0d9c4}.dots i.on{background:var(--ok)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;border:1.5px solid #7fe0a2;background:#fff;color:var(--g);border-radius:999px;padding:6px 16px;font-weight:700}
.tb.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 0 var(--y)}
.lc h3{margin:14px 0 6px;font-size:1.1rem;color:var(--g)}
.lc p{margin:8px 0}.lc ul{margin:8px 0;padding-inline-start:20px}.lc li{margin:4px 0}
.note{background:#fdf0d8;border-inline-start:5px solid #f08a00;border-radius:12px;padding:8px 12px;margin:10px 0}
.exm{background:#e6f3ec;border-inline-start:5px solid var(--g);border-radius:12px;padding:8px 12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--bd);padding:6px 8px;text-align:center}.tbl th{background:#d7e8dc}
.lv{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px;margin-bottom:10px;border:2px solid;background:#fff;width:100%;text-align:right}
.lv i{font-style:normal;font-size:1.8rem}.lv b{display:block}.lv small{color:var(--mut)}
.lv .st{margin-inline-start:auto;font-weight:700}
/* الاختبار */
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y)}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 14px;line-height:1.7}
.kk{display:inline-block;font-size:.75rem;background:#e6f3ec;color:var(--g);border-radius:99px;padding:0 10px;margin-bottom:6px}
.op{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:1.02rem}
.op.ok{border-color:var(--ok);background:#e5f6ec}.op.bad{border-color:var(--bad);background:#fde9e9}
.hint{background:#fff6dc;border:1px solid var(--y);border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.res{text-align:center;padding:24px 8px}.res .big{font-size:3.4rem}.res h2{margin:6px 0}
.stars{font-size:2.2rem;letter-spacing:4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat div{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;color:var(--g)}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bd div{background:#fff;border:1px solid var(--y);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem;line-height:1.4}.bd i{display:block;font-style:normal;font-size:1.8rem}
.wis{text-align:center}.wis small{color:var(--mut)}
.btn{display:block;width:100%;text-align:center;border:0;background:linear-gradient(135deg,#00c853,var(--g));color:#fff;border-radius:14px;padding:12px;font-weight:700;margin-top:10px;text-decoration:none}
.btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.empty{color:var(--mut);text-align:center;padding:20px}
/* محاكاة جرّب بنفسك */
.wgv{display:grid;place-items:center;margin:4px 0}
.wgbig{text-align:center;font-size:1.45rem;font-weight:800;margin:8px 0;padding:8px;border-radius:16px;background:linear-gradient(135deg,#fff3c4,#ffe082);color:#4e2a00}
.wgbig span{display:inline-block;background:#ff6d00;color:#fff;border-radius:10px;padding:0 10px}.wgbig b{color:#d50000}.wgbig small{display:block;font-size:.85rem;color:#6d4c00;font-weight:600}
.wgc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.wgc span{font-weight:700;min-width:100%}
.wgc button{flex:1;min-width:58px;border:0;border-radius:14px;padding:10px 4px;font:800 1.05rem inherit;background:#fff;color:var(--c);box-shadow:inset 0 0 0 3px var(--c);cursor:pointer;transition:.15s}.wgc button.on{background:var(--c);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.wgs{margin:8px 0}.wgs label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}.wgs input{width:100%;height:30px}
.wgm{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7c4dff,#e040fb);color:#fff;border-radius:16px;padding:10px 12px;margin:10px 0;font-weight:700}
.wgn{display:block;width:100%;border:0;border-radius:14px;padding:11px;margin-top:8px;font:800 1rem inherit;color:#fff;background:linear-gradient(135deg,#ff6d00,#ffab00);box-shadow:0 4px 0 #c43e00;cursor:pointer}.wgn.g{background:linear-gradient(135deg,#00c853,#64dd17);box-shadow:0 4px 0 #008a39}
.wgrow{display:flex;gap:8px}.wgrow .wgn{flex:1}
.wgok{background:#00c853;color:#fff;border-radius:14px;padding:8px;text-align:center;font-weight:800;margin-top:8px;animation:wgpop .4s}
.wgb{text-align:center;font-size:2.2rem;animation:wgpop .5s}
@keyframes wgpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.wgst{position:relative;height:90px;border-radius:16px;overflow:hidden;background:linear-gradient(#80d8ff,#e1f5fe 60%,#a5d6a7 60%)}.wgball{position:absolute;bottom:8px;left:0;line-height:1;transition:font-size .2s}
@keyframes wgrun{from{left:-40px}to{left:100%}}
.wgsvg{width:100%;height:auto}
.wgbars{display:flex;gap:10px;height:92px;align-items:flex-end;justify-content:center;margin:6px 0}.wgbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:56px}.wgbars i{display:block;width:100%;border-radius:8px 8px 0 0;min-height:2px;transition:height .15s}.wgbars span{font-weight:800}
.wgat{display:flex;gap:8px;align-items:center}.wgai{flex:1;font-size:.92rem;line-height:1.7}.wgtag{color:#fff;border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:700}
.wgel{margin-top:6px}.wgrow2{display:flex;gap:3px;align-items:center;margin:4px 0;flex-wrap:wrap}.wgrow2>small{width:100%;color:#6a5a2a;font-weight:700}
.wgrow2 button{width:38px;height:44px;border:0;border-radius:10px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgrow2 button small{font-size:.6rem;opacity:.85}.wgrow2 button b{font-size:.95rem}.wgrow2 button.on{transform:translateY(-3px) scale(1.12);outline:3px solid #fff;box-shadow:0 0 0 3px #111}
.wgcv{width:100%;height:auto;border-radius:16px;display:block}
.wgsnd{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}.wgsnd>b{width:100%}.wgsnd button{flex:1;border:0;border-radius:12px;padding:8px 2px;background:var(--c);color:#fff;font:800 .95rem inherit;display:flex;flex-direction:column;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgsnd small{font-weight:500;opacity:.9}.wgsr{width:100%;background:#e3f2fd;border-radius:12px;padding:8px;font-weight:700}
.wgcard{text-align:center;background:linear-gradient(135deg,#fff3c4,#ffe0b2);border-radius:20px;padding:14px;margin-bottom:10px}.wgem{font-size:4rem;line-height:1.2}.wgcard b{font-size:1.2rem;display:block}.wgcard small{color:#6d4c00}
.wgks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wgks button{border:0;border-radius:14px;padding:12px 4px;color:#fff;font:800 1rem inherit;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.22);cursor:pointer}.wgks button:last-child{grid-column:1/-1}.wgks button.ok{outline:4px solid #fff;box-shadow:0 0 0 4px #00c853}.wgks button.no{animation:wgshake .4s}.wgks button[disabled]{opacity:.55}
@keyframes wgshake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.wgmsg{text-align:center;font-weight:800;margin-top:10px;min-height:1.6em}.wgfin{text-align:center;padding:10px}.wgfin b{font-size:1.6rem}

/* عناصر تفاعلية */
.ipb{height:7px;background:#ece6d4;border-radius:99px;overflow:hidden;margin:6px 0 2px}.ipb i{display:block;height:100%;width:0;background:var(--y);transition:width .35s}
.ipt{display:block;color:var(--mut);font-size:.8rem;margin-bottom:6px}
.pt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:right;background:#f4f8ee;border:2px solid #d7e6c4;border-radius:14px;padding:9px 12px;margin:6px 0;font-size:1rem;line-height:1.6}
.pt::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid #9bbf86;flex:none;margin-top:2px;transition:.2s;display:grid;place-items:center;color:#fff;font-size:.8rem}
.pt.done{background:#e5f6ec;border-color:var(--ok)}.pt.done::before{content:"✓";background:var(--ok);border-color:var(--ok)}
.cl{display:inline-block;min-width:52px;border:0;border-radius:8px;background:var(--y);color:#3b2a08;padding:0 8px;font:inherit;font-weight:700;letter-spacing:2px;animation:pulse 1.6s infinite}
.cl.rv{background:#d8f0e0;color:var(--g);letter-spacing:0;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,185,77,.35)}}
.ip{margin:10px 0}
.nt,.ex2{display:block;width:100%;text-align:right;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:1rem;line-height:1.6;border:2px dashed}
.nt{background:#fdf0d8;border-color:#f08a00}.ex2{background:#e6f3ec;border-color:var(--g)}
.nt .bd2,.ex2 .bd2{display:none}.nt.done .bd2,.ex2.done .bd2{display:block;margin-top:4px;font-weight:700}.nt.done .hd2,.ex2.done .hd2{display:none}
.nt.done,.ex2.done{border-style:solid}
.tbw{overflow-x:auto;margin:10px 0}.tbw .tbl{margin:0}.tbl td.mk{background:#e9efe0;color:transparent;cursor:pointer;user-select:none}.tbl td.mk.rv{background:none;color:inherit}
.tbs{display:block;margin:6px auto 0;border:0;background:var(--y);color:#3b2a08;border-radius:99px;padding:4px 16px;font-weight:700;font-size:.85rem}
/* الرياضيات */
.t-math{--bg:#f6f0dd;--ink:#17402b;--mut:#5f7a63;--g:#1d5a3b;--bd:#e8e0c4}
.mh{display:flex;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top)) 18px 4px}
.mhi{flex:1}.mhi b{font-size:1.8rem;line-height:1.25;display:block}.mhi small{color:#6a8a5c;font-size:1rem}
.mportal{display:inline-block;margin-top:6px;background:#fffaf0;border:1.5px solid #cfe3b0;border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:700;color:#1d5a3b;text-decoration:none}
.mav{width:76px;height:76px;background:#1d4d35;color:#fff;border:6px solid #cfe3b0;font-size:2rem}
.pc{margin:14px 16px;background:linear-gradient(135deg,#00a152,#00e676);color:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 0 #007a3d}
.pct{display:flex;justify-content:space-between;align-items:center}.pct b{font-size:1.35rem}
.chp{background:#fff;color:#00a152;border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem}
.pcr{display:flex;justify-content:space-between;margin:10px 0 6px;font-size:.95rem}
.bar.big{height:14px;background:#d5dcc0}.bar.big i{background:#1d5a3b}
.pcs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}.chp2{background:#fff;color:#0a5230;border-radius:99px;padding:3px 14px;font-weight:700;font-size:.92rem}.chp2.g{background:#ffc107;color:#3b2a00}
.sec2{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 8px;font-size:1.3rem}.sec2 a{font-size:.95rem;color:#3d7a4f;text-decoration:none;font-weight:400}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 10px}
.mu{border:0;border-radius:22px;padding:14px 8px;text-align:center;text-decoration:none;color:#fff;box-shadow:0 6px 0 var(--s,#007a3d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:124px;position:relative;font:inherit;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.mu.w{grid-column:1/-1}
.mu svg{width:46px;height:46px;filter:brightness(0) invert(1)}.mu b{font-size:1.1rem}.mu small{font-size:.85rem;opacity:.95;font-weight:600}
.mu .dn{position:absolute;top:8px;inset-inline-start:8px;background:#1d5a3b;color:#fff;border-radius:99px;font-size:.7rem;padding:0 8px}
.t-math .nav{background:#fffaf0}.t-math .nav a.on{color:#1d4d35}
/* الآلة الحاسبة */
#calc{position:fixed;inset:0;background:rgba(17,40,28,.55);z-index:50;display:grid;place-items:end center}
.cbox{width:100%;max-width:520px;background:#fffaf0;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:slin .25s ease both}
.cd{background:#e9f0d5;border-radius:16px;padding:10px 14px;text-align:left;direction:ltr;min-height:76px}.cd small{display:block;color:var(--mut);min-height:22px;word-break:break-all}.cd b{font-size:2rem;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;direction:ltr}
.ck button{border:0;border-radius:14px;padding:13px 0;font-size:1.25rem;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 2px 0 #e0d8bc}.ck button.o{background:#cfe3b0}.ck button.eq{background:#1d5a3b;color:#fff;grid-column:span 2}.ck button.cx{background:#f6d8d0}
.cclose{display:block;margin:10px auto 0;border:0;background:none;color:var(--mut);font-weight:700}
/* درس البطاقات التفاعلية */
.dots2{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}.dots2 button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:#d9d2bd;transition:.2s}.dots2 button.on{width:26px;border-radius:99px;background:var(--y)}.dots2 button.dn{background:var(--ok)}
.deck{position:relative;overflow:hidden;touch-action:pan-y}

.dnav{display:flex;gap:10px;margin-top:12px}.dnav button{flex:1;border:0;border-radius:14px;padding:11px;font-weight:700;background:#fff;border:1.5px solid var(--g);color:var(--g)}.dnav button.pri{background:var(--g);color:#fff}.dnav button[disabled]{opacity:.35}

<script>
window.SCI={"cfg":{"widgets":true,"name":"العلوم العامة","hello":"أهلاً يا بطل العلوم!","unitsTitle":"وحدات العلوم","unitsHint":"ثماني وحدات تغطّي الخلية والطاقة والذرّة والكيمياء والأمواج وتصنيف الكائنات. اضغط وحدة لترى دروسها.","theme":"sci","key":"sci8:st","wid":"science","kxid":"science8","student":"طالب العلوم","packT":"رزمة العلوم والحياة","dir":"science/8"},"units":[{"title":"المجاهر وعالم الخلية","ic":"cell","color":"#8fd3fb","uq":[[0,"ما الجزء الذي يتحكّم في شدّة الإضاءة في المجهر المركّب؟",["المنضدة","الحاجب","العدسة العينية","المثبّت"],1],[0,"ما تكبير عينةٍ تحت عدسة شيئية × 40 وعينية × 15؟",["55","25","600","60"],2],[0,"أيّ المجاهر تكبيره أكثر من مليون مرة؟",["المركّب","التشريحي","جميعها","الإلكتروني"],3],[0,"أيّ الأجزاء الآتية يحيط بالخلية النباتية ويحميها من الانفجار؟",["الجدار الخلوي","النواة","الميتوكندريا","السيتوسول"],0],[1,"عيّنة مفصليات كاملة تُفحَص بأيّ مجهر؟",["الإلكتروني","التشريحي","المركّب","لا يلزم مجهر"],1],[1,"ما الذي يحدث في الانتشار؟",["تنتقل من الأقل إلى الأكثر","تنتقل المادة من الوسط الأكثر تركيزاً إلى الأقل","لا تنتقل المادة","ينتقل الماء فقط عبر غشاء"],1],[1,"خلية تحوي مريكزات وفجوات صغيرة بلا جدار. ما نوعها؟",["نباتية","بكتيرية","حيوانية","فطرية"],2],[1,"لماذا تُعدّ الإنزيمات مهمّة داخل الخلية؟",["تحيط بالخلية","تخزّن المادة الوراثية","تعطي اللون الأخضر","تنشّط التفاعلات الحيوية"],3],[2,"أراد طالب تكبيراً كلياً 400 باستعمال عينية × 10. ما العدسة الشيئية؟",["× 4","× 40","× 410","× 390"],1],[2,"لماذا تتلاءم خلية الدم الحمراء مع وظيفتها؟",["فيها نواة كبيرة","جدارها سميك","ممتلئة بالهيموغلوبين وغشاؤها مرن مقعّر","فيها بلاستيدات"],2],[2,"أيّ العبارات صحيحة عن الأسموزية؟",["ينتقل المذاب الى الماء النقي بلا غشاء","لا تحدث في الخلية","تحدث في النواة فقط","ينتقل الماء إلى المحلول الأكثر تركيزاً عبر غشاء شبه منفذ"],3],[2,"لماذا لا تُرى العضيّات في المجهر المركّب العادي؟",["لحاجتها إلى تكبير أعلى كالمجهر الإلكتروني","لأنها بلا غشاء","لأنها غير موجودة","لأنها كبيرة جداً"],0]],"lessons":[{"t":"المجاهر","e":["# المجهر المركّب","العين المجرّدة لا ترى الخلايا ولا الكائنات الدقيقة، فنستعين بالمجهر لنكبّر الصورة ونرى التفاصيل. في نشاط (١) تفحّصنا المجهر المركّب في المدرسة لنتعرّف أجزاءه الأساسية ووظائفها.","- العدسة العينية: العدسة التي ننظر منها، وعليها رقمٌ مثل (× 10) أو (× 15) يدلّ على قوة تكبيرها.","- العدسات الشيئية: عدّة عدساتٍ مختلفة التكبير (× 10، × 40 …) مثبّتة على قرصٍ يدور، ونختار منها ما يناسب العينة.","- المنضدة: الجزء الذي نضع عليه الشريحة، وتُثبَّت الشريحة عليها بالمَلاقط (المثبّتات).","- الحاجب (الفتحة): الجزء الذي يتحكّم في شدّة الإضاءة التي تصل إلى الشريحة.","# مقدار التكبير","الأرقام المكتوبة على العدسات (× 10) أو (× 40) ترمز إلى مقدار تكبير العدسة، أي كم مرّةً تكبّر الصورة. وُجدت عدّة عدساتٍ شيئية متفاوتة التكبير حتى نتدرّج من تكبيرٍ صغير يعطي مجالاً أوسع إلى تكبيرٍ كبير يُظهر تفاصيل أدقّ.","! مقدار التكبير الكلّي = تكبير العدسة الشيئية × تكبير العدسة العينية.","مثال محلول: عينةٌ تحت عدسة شيئية × 40 وعدسة عينية × 15، فالتكبير = 40 × 15 = 600 مرّة.","# المجهر التشريحي","سُمّي المجهر التشريحي بهذا الاسم لأنه يُستعمل في تشريح العينات وفحصها، فنضع تحته عيناتٍ كاملةً أكبر حجماً (مثل المفصليات) ونفحصها دون تقطيعها إلى شرائح رقيقة.","|وجه المقارنة|المجهر المركّب|المجهر التشريحي","|العينة المستخدمة|شرائح رقيقة شفّافة وكائنات دقيقة|عيّنات كاملة أكبر حجماً كالمفصليات","|الأجزاء المشاهَدة|الأجزاء الداخلية للخلية والعينة|الشكل الخارجي للعينة","|مقدار التكبير|كبير (حاصل ضرب العدستين)|أقلّ من المركّب","# المجهر الإلكتروني","يُعدّ المجهر الإلكتروني أحدث المجاهر، اخترع في أواسط القرن العشرين، وله أنواعٌ عدّة. يعتمد مبدأ عمله على مرور حزمةٍ من الإلكترونات عبر العينة المراد مشاهدتها.","! يكبّر الصورة أكثر من مليون مرة، وبفضله درس العلماء تفاصيل الخلية وعضيّاتها والعمليات الحيوية داخلها.","- العضيّات لا يمكن رؤيتها إلا بالمجهر الإلكتروني."],"q":["- ما الأجزاء الأساسية التي يتركّب منها المجهر المركّب؟ اذكر وظيفة اثنين منها.","- لماذا توجد عدّة عدساتٍ شيئية متفاوتة التكبير؟","- احسب مقدار التكبير لعينةٍ تحت عدسة شيئية × 10 وعدسة عينية × 15.","- قارن بين المجهر المركّب والمجهر التشريحي من حيث العينة المستخدمة ومقدار التكبير.","- ما الذي يميّز المجهر الإلكتروني عن غيره، وماذا استفاد العلماء منه؟"],"quiz":[{"l":0,"k":"n","q":"ما الجزء الذي نضع عليه الشريحة في المجهر المركّب؟","o":["العدسة العينية","الحاجب","قرص العدسات الشيئية","المنضدة"],"a":3},{"l":0,"k":"n","q":"إلى ماذا ترمز الأرقام (× 10) و(× 40) المكتوبة على العدسات؟","o":["عدد العدسات في المجهر","شدّة الإضاءة","حجم الشريحة","مقدار تكبير العدسة"],"a":3},{"l":0,"k":"n","q":"ما الجزء الذي يتحكّم في شدّة الإضاءة الواصلة إلى الشريحة؟","o":["المنضدة","العدسة العينية","المثبّت","الحاجب"],"a":3},{"l":0,"k":"n","q":"كيف تُثبَّت الشريحة على المنضدة؟","o":["بالضغط عليها بالإصبع","بالملاقط (المثبّتات)","بوضعها تحت العدسة العينية","بربطها بالحاجب"],"a":1},{"l":0,"k":"n","q":"لماذا سُمّي المجهر التشريحي بهذا الاسم؟","o":["لأنه يشرح أجزاء الخلية الداخلية","لأنه يُستعمل في تشريح العينات وفحصها","لأنه يكبّر أكثر من مليون مرة","لأنه يستخدم الإلكترونات"],"a":1},{"l":0,"k":"n","q":"أيّ المجاهر الآتية أحدثها؟","o":["المجهر المركّب","المجهر التشريحي","كلّها بالحداثة نفسها","المجهر الإلكتروني"],"a":3},{"l":0,"k":"n","q":"على ماذا يعتمد مبدأ عمل المجهر الإلكتروني؟","o":["مرور الضوء عبر عدستين فقط","مرور حزمة من الإلكترونات عبر العينة","انعكاس الضوء عن مرآة","تسليط الحرارة على العينة"],"a":1},{"l":0,"k":"n","q":"كم مرّةً يمكن أن يكبّر المجهر الإلكتروني الصورة؟","o":["أكثر من مليون مرة","نحو عشر مرّات","مئة مرة","ألف مرة بالضبط"],"a":0},{"l":1,"k":"p","q":"عينة تحت عدسة شيئية × 40 وعدسة عينية × 15. ما مقدار التكبير؟","o":["55","25","400","600"],"a":3},{"l":1,"k":"p","q":"استعمل طالب عدسة شيئية × 10 وعينية × 10. ما التكبير الكلّي؟","o":["20","10","100","1000"],"a":2},{"l":1,"k":"p","q":"أراد طالب فحص حشرة كاملة دون تقطيعها. أيّ مجهرٍ يختار؟","o":["الإلكتروني","التشريحي","المركّب مع الشريحة الرقيقة","لا يحتاج إلى مجهر أبداً"],"a":1},{"l":1,"k":"p","q":"لاحظ طالب أن صورة العينة شديدة السطوع وتؤذي العين. ماذا يفعل؟","o":["يعدّل الحاجب ليقلّل الإضاءة","يبدّل العدسة العينية","يرفع المنضدة","يزيل الشريحة"],"a":0},{"l":1,"k":"p","q":"أيّ عينة مناسبة لف "عند الانتقال من عدسة شيئية × 10 إلى × 40 مع ثبات العينية، ماذا يحدث للتكبير الكلّي؟","o":["يبقى كما هو","يصبح نصفه","يصبح عشرة أضعاف","يصبح أربعة أضعاف"],"a":3}],"hints":{"ما الجزء الذي نضع عليه الشريحة في المجهر المركّب؟":"فكّر في المكان الذي تستقرّ عليه العينة أثناء الفحص.","عينة تحت عدسة شيئية × 40 وعدسة عينية × 15. ما مقدار التكبير؟":"التكبير الكلّي حاصل ضرب تكبير العدستين لا مجموعهما.","عدسة شيئية × 40 وتكبير كلّي 800. ما تكبير العدسة العينية؟":"اقسم التكبير الكلّي على تكبير العدسة الشيئية.","أيّ العبارات صحيحة؟":"قارن بين قدرة كلّ مجهر على إظهار تفاصيل الخلية."}},{"t":"عالم الخلية","e":["# تخصّص الخلايا","تتخصّص خلايا الكائنات الحية كما يتخصّص كلّ مهنيٍّ في مهنته وكلّ عالمٍ في علمه. ففي جسم الإنسان 200 نوعٍ على الأقلّ من الخلايا المتخصّصة، واختلاف صفاتها التركيبية يمكّنها من القيام بوظيفةٍ محدّدة (التلاؤم بين التركيب والوظيفة).","- الجلد أكبر أعضاء الجسم، ويستبدل يومياً ما يقارب ألفي مليون خلية جلدية بالانقسام.","- الخلايا العصبية والعضلية لا تُستبدل.","|الخلية|التلاؤم بين التركيب والوظيفة","|خلية الدم الحمراء|لا تحوي نواة في طور النضج، ويمتلئ السيتوبلازم بالهيموغلوبين، وغشاؤها مرن ومقعّر الوجهين","|الخلية العصبية|محور أسطواني طويل معزول كهربائياً، ونهاياتها متشعّبة","# نظرية الخلية","تتميّز الكائنات الحية عن المكوّنات غير الحية بخصائص الحياة: تستخدم الطاقة، تنمو، تتكاثر (تتضاعف)، وتستجيب للمؤثرات.","! الخلايا هي الوحدات الأساسية للحياة، وتمثّل المادة الحية في الكائن الحي، وتتضمّن جميع الأجزاء الحية، وتؤدّي وظيفتها التنظيمية بتشكيل الأنسجة المتخصّصة.","# مكوّنات الخلية","للخلية ثلاثة أجزاء أساسية: الغشاء الخلوي، والنواة، والسيتوبلازم. وتختلف الخلية النباتية عن الحيوانية في بعض العضيّات.","- الغشاء الخلوي: غشاء رقيق جداً يحيط بجميع الخلايا ويعزلها عن محيطها ويحفظ محتوياتها وينظّم دخول المواد وخروجها حسب حاجتها. يتكوّن من طبقتين من الليبيدات المفسفرة تتخلّلهما مواد أخرى مثل البروتينات التي يعمل بعضها كنواقل متخصّصة.","- الانتشار: انتقال المادة من الوسط الأكثر تركيزاً إلى الوسط الأقلّ تركيزاً حتى يتساوى التركيز، ومنه انتقال غازات التنفس. مثاله: يتلوّن الماء الساخن بلون الشاي عند وضع كيس الشاي فيه.","- الخاصية الأسموزية: انتقال جزيئات الماء (المذيب) من المحلول الأقلّ تركيزاً بالمادة المذابة إلى المحلول الأكثر تركيزاً بها عبر غشاءٍ شبه منفذ.","- النواة: جسم كروي أو شبه كروي في معظم الخلايا تتحكّم بجميع الأنشطة داخل الخلية (وقت حدوثها ومدّتها). تتكوّن من غلاف نووي به ثقوب، وسائل نووي، ونويّة، والمادة الوراثية المحمولة على الكروموسومات والتي تعطي الكائن صفاته.","- السيتوبلازم: وسط ملائم للتفاعلات الكيميائية الحيوية، يتكوّن من سائل هلامي مذاب فيه مواد كثيرة يسمّى السيتوسول، ويملأ معظم حجم الخلية وتوجد فيه العضيّات.","# العضيّات والمواد الكيميائية","- عضيّات لا غشائية كالرايبوسومات، وعضيّات غشائية كالميتوكندريا، وتؤدّي كلّ عضيّة وظيفةً معيّنة، ولا تُرى العضيّات إلا بالمجهر الإلكتروني.","- الفجوات: فجوة مركزية واحدة في الخلية النباتية، تحوي ماءً وأملاحاً وسكّريات.","- المريكزات: توجد في الخلايا الحيوانية، وكلّ مريكز أسطوانة جوفاء من خيوط بروتينية تسمّى أنيبيبات دقيقة، ولها دور مهمّ في انقسام الخلية الحيوانية.","- الجدار الخلوي: يحيط بالغشاء الخلوي في الخلايا النباتية (ويوجد أيضاً في الفطريات وبعض البكتيريا)، يحافظ على الشكل والحجم ويحمي الخلية من الانفجار عند دخول الماء ومن الانكماش عند خروجه.","|البلاستيدات (في الخلايا النباتية)|الأهمية","|خضراء|تكسب النبات اللون الأخضر وفيها تفاعلات البناء الضوئي","|ملوّنة|تعطي الثمار والأزهار لونها المميّز","|عديمة اللون|تخزّن النشا والدهون والبروتين","- الإنزيمات: مجموعة كبيرة متنوّعة معظمها بروتينات، تُنتَج في الرايبوسومات، وهي عوامل حيوية تنشّط التفاعلات داخل الخلية: تحلّل جزيئات الغذاء ليسهل امتصاصها، وتحلّل المواد السامة كالكحوليات ليسهل التخلّص منها، وتبني جزيئات جديدة كالبروتينات والدهون."],"q":["- اذكر ثلاثاً من خصائص الحياة وبيّن أهمية الخلية للكائن الحي.","- كيف تتلاءم خلية الدم الحمراء مع وظيفتها؟","- ما الفرق بين الانتشار والخاصية الأسموزية؟","- ما أجزاء النواة؟ وما دورها في الخلية؟","- قارن بين الخلية النباتية والحيوانية في العضيّات التي تميّز كلّاً منهما."],"quiz":[{"l":0,"k":"n","q":"ما الجزء من الخلية الذي يعزلها عن محيطها وينظّم دخول المواد وخروجها؟","o":["النواة","الغشاء الخل {"t":"انقسام الخلايا","e":["# الكروموسومات وعددها","لكلّ كائنٍ حيٍّ عددٌ ثابت من الكروموسومات في أنوية خلاياه الجسمية، ولا علاقة بين حجم الكائن وعدد كروموسوماته (ففي نشاط (١) ظهرت أعدادٌ مثل 46 و48 و14 و48 لكائنات مختلفة الحجم). وعدد الكروموسومات لا يحدّد وحده صفات الكائن، فكائنان قد يتشابه عدد كروموسوماتهما (48) ويختلفان في الصفات.","! في الإنسان يبلغ عدد الكروموسومات في كلّ خلية جسمية 46 كروموسوماً.","# تضاعف الكروموسومات","كثيرٌ من خلايا أجسامنا تنقسم وتتكاثر فتضاعف أعدادها، وتنتج خلايا جديدة قد تكون مطابقة للأصلية أو غير مطابقة.","- قبل الانقسام تكون الكروموسومات مفردةً وعلى شكل خيوط طويلة رفيعة متشابكة داخل النواة تسمّى الشبكة الكروماتينية.","- لا يمكن مشاهدتها كروموسوماتٍ مستقلة بوضوح عند عدم انقسام الخلية.","- يحدث تضاعفٌ لمادة الوراثة (DNA) والعضيّات قبل بدء الانقسام، فيظهر كلّ كروموسوم متضاعف تحت المجهر الإلكتروني مكوّناً من كروماتيدين (أصلي وجديد) يرتبطان بنقطة تسمّى السنترومير.","# أنواع الانقسام","تتكوّن أجسام الكائنات عديدة الخلايا التي تتكاثر جنسياً من نوعين من الخلايا:","- الخلايا الجسمية: تنقسم نواتها بالانقسام المتساوي وينتج عنه خليتان (ابنتان) فيهما العدد نفسه من الكروموسومات (خلية بـ 46 كروموسوماً ← خليتان في كلّ منهما 46).","- الخلايا التناسلية (المنتجة للغاميتات): في الأعضاء الجنسية الذكرية والأنثوية، وتنقسم نواتها بالانقسام المنصّف منتجةً الغاميتات.","# الانقسام المتساوي","قبل دخول الخلية في الانقسام تمرّ بمرحلة تحضيرية تسمّى الطور البيني، تنمو فيها الخلية ويزداد حجمها وتتضاعف كمية المادة الوراثية (DNA).","يحدث الانقسام المتساوي في الكائنات وحيدة الخلية لتتكاثر (كالبراميسيوم)، وفي عديدة الخلايا (كالإنسان) من أجل النمو وتعويض الخلايا التالفة.","- أطواره: التمهيدي (يظهر الكروموسوم المتضاعف وتتكوّن خيوط المغزل) ← الاستوائي (تترتّب الكروموسومات في منتصف الخلية) ← الانفصالي (يفترق الكروماتيدان) ← النهائي (تنقسم الخلية إلى خليتين).","- للمريكزات وخيوط المغزل دور مهمّ في عملية الانقسام في الخلية الحيوانية.","- يوجد المريكز في الخلية الحيوانية، وفي ذلك دليلٌ على أن الخلية المعروضة في الشكل حيوانية.","# الانقسام المنصّف ومتلازمة داون","ينتج عن الانقسام المنصّف لخلية تناسلية أربع خلايا، تحتوي كلّ منها على نصف العدد الأصلي من الكروموسومات في الخلية الأم (46 ← 23) وتسمّى غاميتات (حيوانات منوية أو بويضات).","! يسهم الانقسام المنصّف في ثبات عدد الكروموسومات في خلايا النوع الواحد.","أيّ تغيّر في عدد الكروموسومات، نقصاً أو زيادة، يُحدث تغيّراً في صفات الكائن الحي، وهو ما يسمّى الطفرة. فمتلازمة داون ناتجة عن زيادة كروموسوم، فتحتوي كلّ خلية جسمية على 47 كروموسوماً.","- من صفات المصاب بها: ثنيةٌ إضافية في جفن العين، قصر القامة، رأس منبسط، جبهة بارزة، لسان كبير الحجم، يدان وقدمان قصيرتان، وصعوباتٌ في التعلّم."],"q":["- هل يحدّد عدد الكروموسومات حجم الكائن الحي أو صفاته؟ وضّح.","- ما الفرق بين الكروموسوم والكروماتيد؟ وما السنترومير؟","- ما أهمية الطور البيني؟ وماذا يحدث إن لم تمرّ به الخلية؟","- قارن بين الانقسام المتساوي والمنصّف من حيث الخلايا التي يحدث فيها وعدد الخلايا الناتجة وعدد الكروموسومات.","- ما سبب متلازمة داون؟ اذكر ثلاثاً من صفات المصابين بها."],"quiz":[{"l":0,"k":"n","q":"كم عدد الكروموسومات في الخلية الجسمية للإنسان؟","o":["23","46","47","92"],"a":1},{"l":0,"k":"n","q":"ما اسم الشبكة من الخيوط الرفيعة المتشابكة داخل النواة قبل الانقسام؟","o":["شبكة السيتوبلازم","الشبكة الكروماتينية","الغلاف النووي","المغزل"],"a":1},{"l":0,"k":"n","q":"بماذا يرتبط الكروماتيدان في الكروموسوم المتضاعف؟","o":["النويّة","الميتوكندريا","السنترومير","المريكز"],"a":2},{"l":0,"k":"n","q":"ما اسم المرحلة التحضيرية التي تسبق الانقسام؟","o":["الطور الاستوائي","الطور الانفصالي","الطور النهائي","الطور البيني"],"a":3},{"l":0,"k":"n","q":"ما عدد الخلايا الناتجة عن الانقسام المتساوي لخلية واحدة؟","o":["أربع","اثنتان","واحدة","ثماني"],"a":1},{"l":0,"k":"n","q":"ما اسم الخلايا الناتجة عن الانقسام المنصّف؟","o":["الخلايا الجسمية","الأنسجة","الغاميتات","الكروماتيدات"],"a":2},{"l":0,"k":"n","q":"كم كروموسوماً في الخلية المصابة بمتلازمة داون؟","o":["45","46","48","47"],"a":3},{"l":0,"k":"n","q":"ما اسم التغيّر في عدد الكروموسومات الذي يُحدث تغيّراً في صفات الكائن الحي؟","o":["الانتشار","التضاعف الطبيعي","النموّ","الطفرة"],"a":3},{"l":1,"k":"p","q":"أيّ خلايا الإنسان الآتية تنقسم انقساماً منصّفاً؟","o":["خلايا الجلد","خلايا الجنين النامي","الخلايا المنتجة للحيوانات المنوية","خلايا جرح يلتئم"],"a":2},{"l":1,"k":"p","q":"التئام الجروح ونموّ الأجنّة في الأرحام يحدثان بـ:","o":["الانقسام المتساوي","الانقسام المنصّف","الانتشار","الإخصاب فقط"],"a":0},{"l":1,"k":"p","q":"لماذا تترتّب الكروموسومات في منتصف الخلية في الطور الاستوائي؟","o":["لتختفي من الخلية","لتتحوّل إلى عضيّات","لتتهيّأ لتوزَّع بالتساوي على الخليتين الجديدتين","لتتضاعف مرّة أخرى"],"a":2},{"l":1,"k":"p","q":"ماذا يحدث إن لم تمرّ الخلية بالطور البيني قبل الانقسام؟","o":["تنقسم أسرع وبلا مشكلة","تتحوّل إلى خلية تناسلية","تفقد الغشاء الخلوي","لا تنمو ولا تتضاعف مادتها الوراثية فلا تنقسم انقساماً سليماً"],"a":3},{"l":1,"k":"p","q":"ادّعت سلمى أن عدد كروموسومات خلايا جلدها يساوي عدد كروموسومات خلايا جلد رنيم، وردّت رنيم بأنهما من أبوين مختلفين. من على حقّ؟","o":["رنيم؛ لأن الأبوين مختلفان","كلتاهما مخطئة","سلمى؛ فعدد الكروموسومات ثابت في النوع الواحد (46)","رنيم؛ لأن عدد الكروموسومات يتغيّر بين الأفراد"],"a":2},{"l":1,"k":"p","q":"في الشكل: خلية أمّ فيها 46 كروموسوماً انقسمت إلى خليتين فيهما 46 لكلٍّ. ما نوع الانقسام؟","o":["منصّف","ثنائي","لاجنسي فقط","متساوٍ"],"a":3},{"l":1,"k":"p","q":"خلية حيوانية في الطور الاستوائي ظهرت فيها مريكزات وخيوط مغزل. ما فائدة هذه التراكيب؟","o":["تساعد على انقسام الخلية","تنتج الإنزيمات","تخزّن النشا","تحمي من الانفجار"],"a":0},{"l":1,"k":"p","q":"أيّ العمليات الآتية ينتج عنها خلايا مطابقة للخلية الأصل؟","o":["الانقسام المنصّف","تكوين الغاميتات","كلّ الانقسامات تنتج غاميتات","الانقسام المتساوي"],"a":3},{"l":2,"k":"p","q":"خلية تناسلية فيها 46 كروموسوماً انقسمت انقساماً منصّفاً. كم خلية وكم كروموسوماً في كلّ منها؟","o":["2 خليتان، 46 كروموسوماً","4 خلايا، 46 كروموسوماً","4 خلايا، 23 كروموسوماً","2 خليتان، 23 كروموسوماً"],"a":2},{"l":2,"k":"p","q":"لو أن حيواناً منوياً يحمل 24 كروموسوماً أخصب بويضة تحمل 23، فكم كروموسوماً في الزايجوت؟","o":["46","24","47","23"],"a":2},{"l":2,"k":"p","q":"ما النتيجة المتوقّعة إن احتوت الغاميتة على عدد كروموسومات أقلّ أو أكبر من العدد النصفي؟","o":["لا شيء يتغيّر","خلل في عدد الكروموسومات وتغيّر في الصفات (طفرة) في الجنين","يتضاعف عدد الغاميتات","يتحول الجنين إلى خلية جلدية"],"a":1},{"l":2,"k":"p","q":"كائن عدد كروموسومات خلاياه الجسمية 14. كم كروموسوماً في غاميتاته؟","o":["7","14","28","3"],"a":0},{"l":2,"k":"p","q":"لماذا يجب أن ينتج الانقسام المنصّف غاميتات بنصف العدد؟","o":["ليبقى عدد الكروموسومات ثابتاً في النوع بعد الإخصاب","ليتضاعف العدد في كلّ جيل","ليصبح الجنين أكبر حجماً","ليلغي الصفات الوراثية"],"a":0},{"l":2,"k":"p","q":"تعتبر خلايا الجلد أكثر الخلايا استبدالاً. أيّ انقسامٍ يتعهّدها؟","o":["المنصّف، لأنه ينتج غاميتات جلدية","الانتشار الأسموزي","المتساوي، لأنه يعوّض الخلايا التالفة ويحافظ على العدد","لا انقسام يتعلق بالجلد"],"a":2},{"l":2,"k":"p","q":"خليتان ابنتان ناتجتان عن خلية جسمية عددها 48 كروموسوماً. ما عدد الكروموسومات في كلّ منهما؟","o":["24","96","48","12"],"a":2},{"l":2,"k":"p","q":"أيّ عبارةٍ صحيحة عن الطور البيني؟","o":["تتوزّع فيه الكروموسومات على خليتين","تتضاعف فيه كمية DNA وتنمو الخلية","تتحوّل فيه الخلية إلى غاميتات","تختفي النواة تماماً دون عودة"],"a":1}],"hints":{"ما اسم المرحلة التحضيرية التي تسبق الانقسام؟":"هي مرحلةٌ تنمو فيها الخلية وتتضاعف فيها كمية DNA.","ما اسم الخلايا الناتجة عن الانقسام المنصّف؟":"ابحث عن اسم الخلايا التناسلية الناتجة.","أيّ خلايا الإنسان الآتية تنقسم انقساماً منصّفاً؟":"اسأل: أيّها ينتج غاميتات؟","خلية تناسلية فيها 46 كروموسوماً انقسمت انقساماً منصّفاً. كم خلية وكم كروموسوماً في كلّ منها؟":"تذكّر أن الانقسام المنصّف ينتج أربع خلايا بنصف العدد."}},{"t":"التكاثر","e":["# نوعا التكاثر","- التكاثر الجنسي: ينتج عنه أبناء تتشارك في بعض الصفات مع آبائها لكنها لا تشبه تماماً أيّاً من الأبوين.","- التكاثر اللاجنسي: ينتج عنه نسخٌ طِبق الأصل عن الآباء.","# التكاثر الجنسي","تتكاثر معظم الكائنات الحية عديدة الخلايا (الحيوانية والنباتية) تكاثراً جنسياً، وتحتاج إلى ذكرٍ وأنثى من النوع نفسه لتنتج نسلاً جديداً.","ففي الإنسان يلزم التقاء حيوان منوي من الزوج مع بويضة من الزوجة ليكوّنا بويضة مخصّبة (زايجوت) تتطوّر في رحم الزوجة لتكوّن الجنين.","يستمرّ نموّ الطفل بعد الولادة، وفي نهاية مرحلة النموّ (الشباب) يُقدَّر عدد خلايا جسمه بالترليونات، ويتغيّر حجمه وكتلته ومظهره، وتحدث تغيّرات نفسية واجتماعية واسعة خاصة في المراهقة.","# النمو ومرحلة المراهقة","- مرحلة نموّ الجنين أسرع مراحل النموّ؛ ولو استمرّت الخلايا بالنموّ والانقسام بالسرعة نفسها لبلغت كتلة الطفل بعد سنة من ولادته 10 ملايين طن.","- تنخفض سرعة النموّ بعد الولادة لكنها تبقى سريعة في أول سنتين، ثم تنخفض، ثم تتسارع ثانيةً في المراهقة، وتظهر تغيّرات جسدية مثل زيادة الطول.","- لا يوجد سنٌّ محدّدة للمراهقة: قد تبدأ قبل الثانية عشرة بنصف سنة وقد تتأخّر سنة أو أكثر، وقد تنتهي في سنّ 20 أو تمتدّ إلى 24 أحياناً.","- لا تحدث التغيّرات نفسها عند الجميع في وقتٍ واحد؛ فتتفاوت سرعتها وتختلف عند الفتيان عن الفتيات بسبب اختلاف البنية.","- لا يمكن الانتقال من الطفولة إلى الشباب دون المرور بمرحلة المراهقة.","! النضوج الجنسي: تبدأ الدورة الشهرية عند الإناث، ولا يُشترط ظهور جميع الخصائص الجنسية في البداية. وفي الذكور تبدأ بزيادة حجم الخصيتين ونموّ شعر العانة وحدوث ظاهرة الاحتلام.","- الاحتلام ظاهرة طبيعية تدلّ على النموّ والبلوغ، ولا تحدث عند الجميع في وقتٍ محدّد، ويجب عندها الاستحمام وتغيير الملابس وشراشف السرير.","- الحيض أحد مؤشرات بلوغ الفتاة وليس دماً فاسداً؛ يُراعى فيه الاستحمام والنظافة العامة.","- الثقافة الجنسية تحمي من المخاطر الصحية، ومنها الحذر من انتقال الأمراض الجنسية مثل الإيدز.","# التكاثر اللاجنسي","من أبسط طرق التكاثر، يحدث في البكتيريا والأوّليات والفطريات والعديد من الحيوانات والنباتات، ولا يحتاج إلى ذكرٍ وأنثى.","|الكائن|طريقة التكاثر اللاجنسي","|البكتيريا|الانشطار الثنائي","|الخميرة|التبرعم","|نجم البحر|التجزئة","|النبات|تكاثر خضري","# التكاثر الخضري في النباتات","هو إكثار النباتات باستخدام أجزائها الخضرية أو الجذرية بعيداً عن جنين البذرة الناتج عن التلقيح والإخصاب.","|الطريقة|الوصف|مثال","|السيقان (الرايزومات)|سيقان تنمو أفقياً وتكوّن براعم تخرج منها الجذور|النعناع","|الدرنات|سيقان منتفخة تنمو لتكوّن عدّة نباتات|البطاطا","|الفسائل|براعم قرب قاعدة النبتة تكوّن فرعاً وجذوراً فتُفصل وتُزرع|النخيل والموز","|العُقَل|قطع من الساق فيها ثلاثة براعم على الأقل تُزرع|العنب والتين والورد الجوري","|الأبصال|ساق قرصية تحمل برعماً طرفياً كبيراً تحيط به قواعد الأوراق|البصل والثوم والقيصلان","|الترقيد|دفن غصن دون فصله عن الأم حتى يكوّن جذوراً عرضية ثم فصله|العنب والتين والرمان","|التطعيم|تثبيت غصن على جذع شجرة من نوع قريب|غصن الخوخ على اللوز المرّ"],"q":["- ما الفرق بين التكاثر الجنسي واللاجنسي من حيث صفات الأبناء؟","- صف باختصار ما يحدث في تكوين الجنين في الإنسان.","- اذكر ثلاثاً من علامات مرحلة المراهقة.","- عدّد أربع طرق للتكاثر الخضري مع مثالٍ لكلٍّ منها.","- لماذا لا يُعدّ دم الحيض فاسداً؟ وماذا نفعل عند الاحتلام أو الحيض؟"],"quiz":[{"l":0,"k":"n","q":"ما نوع التكاثر الذي ينتج نسخاً طِبق الأصل عن الآباء؟","o":["الجنسي","التزاوج","الإخصاب","اللاجنسي"],"a":3},{"l":0,"k":"n","q":"ماذا تسمّى البويضة المخصّبة؟","o":["الزايجوت","الغاميتة","الجنين المتأخر","الكروماتيد"],"a":0},{"l":0,"k":"n","q":"كيف تتكاثر الخميرة؟","o":["الانشطار الثنائي","التبرعم","التجزئة","بالبذور"],"a":1},{"l":0,"k":"n","q":"كيف تتكاثر البكتيريا لاجنسياً؟","o":["التبرعم","التجزئة","بالفسائل","الانشطار الثنائي"],"a":3},{"l":0,"k":"n","q":"ما طريقة تكاثر نجم البحر اللاجنسي؟","o":["التبرعم","التجزئة","الانشطار الثنائي","الترقيد"],"a":1},{"l":0,"k":"n","q":"ما الطريقة التي تُستعمل في تكاثر النعناع؟","o":["الدرنات","الأبصال","السيقان الأفقية (الرايزومات)","الترقيد"],"a":2},{"l":0,"k":"n","q":"أيّ المراحل الآتية يزداد فيها اهتمام الإنسان بمظهره؟","o":["المراهقة","الطفولة المبكرة","الشيخوخة","ما قبل الولادة"],"a":0},{"l":0,"k":"n","q":"ما الجزء الذي تزرعه عند التكاثر بالعُقَل؟","o":["ورقة واحدة","قطعة ساق فيها ثلاثة براعم على الأقل","بذرة","زهرة"],"a":1},{"l":1,"k":"p","q":"زُرعت درنة بطاطا فنمت منها عدّة نباتات. ما نوع التكاثر؟","o":["خضري (لاجنسي)","جنسي","تبرعم","تجزئة"],"a":0},{"l":1,"k":"p","q":"فصل مزارع براعم نبتت قرب قاعدة نخلة وزرعها. ماذا استعمل؟","o":["الفسائل","الأبصال","العُقَل","الدرنات"],"a":0},{"l":1,"k":"p","q":"دفن مزارع غصن عنب في التراب دون قطعه فتكوّنت جذور ثم فصله. ما الطريقة؟","o":["الترقيد","التطعيم","الأبصال"," ٠ م","٥٠ م"],0],[2,"سيّارة ١ كغم بسرعة ٨ م/ث على ارتفاع ٤ م. ما طاقتها الحركيّة عند ارتفاع ٢ م على المسار الأملس نفسه؟",["٧٢ جول","٣٢ جول","٢٠ جول","٥٢ جول"],3],[2,"كرة ٠٫١٢ كغم أُسقطت من ٥ م. ما سرعتها قبيل ملامسة الأرض؟",["٥ م/ث","٦ م/ث","١٠ م/ث","٥٠ م/ث"],2]],"lessons":[{"t":"طاقة الحركة","e":["# مفهوم طاقة الحركة","إذا أثّرت قوّة أو مجموعة من القوى الخارجية في جسم ما فإنها تُسبّب تغيّراً في حركته؛ فقد يتحرّك الجسم الساكن نتيجة لتأثير هذه القوى.","عندما يتحرّك الجسم بسرعة ما فإنه يمتلك شكلاً من أشكال الطاقة نتيجة لحركته، تُسمّى الطاقة الحركيّة للجسم.","# نشاط ٢: أثر كتلة الجسم المتحرّك","المواد والأدوات: كرة كتلتها صغيرة، وكرة كتلتها كبيرة (لهما الحجم نفسه)، ومسطرة، ووعاء فيه رمل.","- نُسقط الكرة صغيرة الكتلة في وعاء الرمل ونقيس مقدار انغراسها بالمسطرة.","- نُسقط الكرة كبيرة الكتلة من الارتفاع نفسه ونقيس مقدار انغراسها.","- نقارن: الكرة كبيرة الكتلة تنغرس في الرمل أكثر من الصغيرة.","! لكتلة الجسم دور مهم في مقدار الطاقة التي يمتلكها: كلّما زادت كتلة الجسم المتحرّك تزداد طاقة الحركة التي يمتلكها.","# نشاط ٣: أثر سرعة الجسم المتحرّك","- نُسقط الكرة في وعاء الرمل سقوطاً حرّاً ونقيس عمق انغراسها.","- نُخرج الكرة ونسوّي سطح الرمل ثم نضربها في الرمل بقوّة إلى الأسفل ونقيس عمق انغراسها.","- الكرة المضروبة بقوّة (أسرع) تنغرس أعمق من الكرة الساقطة سقوطاً حرّاً.","! كلّما زادت سرعة الجسم تزداد طاقته الحركيّة.","# قانون طاقة الحركة","طاقة الحركة = ½ × الكتلة × (السرعة)²، أي: طح = ½ × ك × ع²","وفق نظام الوحدات العالمي: وحدة الطاقة هي الجول (J)، والكتلة بوحدة الكيلوغرام (كغم)، والسرعة بوحدة م/ث.","# مثال محلول","تتحرّك كرة كتلتها ١ كغم على سطح أفقي أملس بسرعة ثابتة مقدارها ٩ م/ث. طح = ½ × ١ × (٩)² = ½ × ١ × ٨١ = ٤٠٫٥ جول.","# سؤال الكتاب","ركض عدنان حول الملعب بسرعة ثابتة ٢ م/ث وكتلته ٤٥ كغم: طاقته الحركيّة = ½ × ٤٥ × ٢² = ٩٠ جول. وإذا أصبحت سرعته ٤ م/ث فطاقته = ½ × ٤٥ × ١٦ = ٣٦٠ جول، أي تزداد إلى أربعة أمثال (ضعف السرعة يعطي أربعة أمثال الطاقة)."],"q":["- ما المقصود بطاقة الحركة؟ ومتى يمتلكها الجسم؟","- كيف بيّن نشاط الكرتين في الرمل أثر الكتلة في طاقة الحركة؟ ولماذا نُسقط ا لحركيّة؟":"طح = ½ × ك × ع²؛ ربّع السرعة أولاً ثم اضرب.","ركض عدنان (٤٥ كغم) بسرعة ثابتة ٢ م/ث. ما طاقته الحركيّة؟":"طح = ½ × ٤٥ × ٢²؛ احسب ٢² أولاً.","جسم طاقته الحركيّة ١٠٠ جول وكتلته ٢ كغم. ما سرعته؟":"طح = ½ ك ع²؛ ع² = ٢ × طح ÷ ك."}},{"t":"طاقة الوضع","e":["# مفهوم طاقة الوضع","نشاط التفاحة: جلس إسحاق نيوتن تحت شجرة تفاح فسقطت تفاحة إلى الأسفل نحو الأرض. سقوطها رأسياً نحو الأرض بسبب الجاذبيّة الأرضيّة، وسرعتها لحظة الاصطدام بالأرض أكبر من سرعتها لحظة سقوطها عن الغصن.","عندما كانت التفاحة على غصن الشجرة اختزنت شكلاً من أشكال الطاقة، وعندما بدأت بالسقوط بدأ هذا الشكل بالتحوّل إلى طاقة حركيّة تدريجيّاً حتى وصلت الأرض.","! الطاقة المخزونة في الجسم بسبب موقعه (وضعه) على ارتفاع معيّن من سطح الأرض، أو أيّ نقطة مرجعيّة أخرى، تُسمّى طاقة الوضع في مجال الجاذبيّة الأرضيّة.","# نشاط ٢: أثر الكتلة في طاقة الوضع","- ضع الحقيبة المدرسيّة إلى جانب قلم الرصاص على الأرض.","- ارفع القلم إلى مستوى رأسك ثم الحقيبة إلى المستوى نفسه، وقارن الجهد المبذول.","- الحقيبة تحتاج إلى جهد أكبر لأن كتلتها أكبر.","! كلّما تزداد كتلة الجسم تزداد طاقة الوضع التي يمتلكها بالنسبة إلى ارتفاعه عن سطح الأرض.","# نشاط ٣: أثر الارتفاع","نرفع الحقيبة بالتدريج: إلى مستوى الصدر، ثم الرأس، ثم فوق الرأس على امتداد الذراعين. أكبر جهد يلزم عند أعلى ارتفاع، أي أنّ طاقة الوضع تزداد بزيادة الارتفاع عن مستوى الأرض.","# قانون طاقة الوضع","طاقة الوضع = الكتلة × تسارع الجاذبيّة الأرضيّة × الارتفاع العمودي، أي: طو = ك × جـ × ف، حيث جـ ≈ ١٠ م/ث²","الوحدات: الطاقة بالجول، الكتلة بالكغم، التسارع بـ م/ث²، الارتفاع بالمتر.","- تُحسب طاقة الوضع بالنسبة إلى نقطة مرجعيّة، ونستخدم سطح الأرض مرجعاً فتكون طاقة الوضع صفراً عند مستوى الأرض.","- إذا كان الجسم فوق النقطة المرجعيّة فطاقة الوضع موجبة، وإن كان أسفلها فسالبة، وإن كان عندها فصفر.","# مثال محلول","سهى كتلتها ٤٠ كغم في الطابق الثاني الذي يرتفع ٣ م عن الأرض: طو = ٤٠ × ١٠ × ٣ = ١٢٠٠ جول.","# سؤال الكتاب","خزّان ماء كتلته مع الماء ١٠٠٠ كغم على سطح بناية ارتفاعها ٧ م: طو = ١٠٠٠ × ١٠ × ٧ = ٧٠٠٠٠ جول.","# طاقة الوضع المرونيّة","تمتاز بعض المواد بالمرونة (مثل المطّاط أو النابض): يتغيّر شكلها إذا أثّرت فيها قوّة ثم تعود إلى شكلها الأصلي بعد زوال القوة. وتختزن الأجسام المرنة طاقة وضع مرونيّة عند تأثّرها بقوّة خارجيّة تؤدّي إلى انبساطها أو انضغاطها."],"q":["- ما المقصود بطاقة الوضع في مجال الجاذبيّة الأرضيّة؟ ومن أين تأتي طاقة التفاحة المعلّقة؟","- كيف تتغيّر طاقة الوضع بزيادة كتلة الجسم؟ وبزيادة ارتفاعه؟","- اكتب قانون طاقة الوضع واذكر وحدات كلّ كمية فيه.","- احسب طاقة الوضع لجسم كتلته ٥ كغم على ارتفاع ٤ م عن الأرض.","- ما طاقة الوضع المرونيّة؟ أعطِ مثالين لأجسام تمتلكها."],"quiz":[{"l":0,"k":"n","q":"ما اسم الطاقة المخزونة في الجسم بسبب موقعه على ارتفاع معيّن من سطح الأرض؟","o":["طاقة الوضع","طاقة الحركة","الطاقة الصوتيّة","الطاقة الحراريّة"],"a":0},{"l":0,"k":"n","q":"في سقوط التفاحة عن الغصن، طاقة الوضع تتحوّل تدريجيّاً إلى:","o":["طاقة صوتيّة","كتلة","ارتفاع","طاقة حركة"],"a":3},{"l":0,"k":"n","q":"أيّ العلاقات الآتية تمثّل طاقة الوضع؟","o":["½ × ك × ع²","ك × ع","ك × جـ × ف","جـ × ع"],"a":2},{"l":0,"k":"n","q":"ما القيمة التقريبيّة لتسارع الجاذبيّة الأرضيّة المستخدمة في الكتاب؟","o":["١ م/ث²","١٠ م/ث²","١٠٠ م/ث²","٣٤٠ م/ث²"],"a":1},{"l":0,"k":"n","q":"عند مستوى سطح الأرض (المرجع) تكون طاقة الوضع:","o":["صفراً","موجبة دائماً","سالبة دائماً","أكبر ما يمكن"],"a":0},{"l":0,"k":"n","q":"كلّما ارتفع الجسم عن مستوى الأرض فإن طاقة الوضع التي يختزنها:","o":["تقلّ","تبقى ثابتة","تصبح سالبة","تزداد"],"a":3},{"l":0,"k":"n","q":"ما وحدة قياس طاقة الوضع؟","o":["م/ث²","الكيلوغرام","الجول","المتر"],"a":2},{"l":0,"k":"n","q":"أيّ الأجسام الآتية يمتاز بالمرونة ويختزن طاقة وضع مرونيّة؟","o":["الحجر","النابض (الزنبرك)","قطعة الحديد الصلبة","الرمل"],"a":1},{"l":1,"k":"p","q":"سهى كتلتها ٤٠ كغم في طابق يرتفع ٣ م عن الأرض. ما طاقة وضعها؟","o":["١٢٠ جول","١٢٠٠ جول","٤٠٠ جول","٣٠٠ جول"],"a":1},{"l":1,"k":"p","q":"جسم كتلته ٢ كغم على ارتفاع ٥ م عن الأرض. ما طاقة وضعه؟","o":["١٠٠ جول","١٠ جول","٥٠ جول","٢٠٠ جول"],"a":0},{"l":1,"k":"p","q":"جسم كتلته ٥ كغم على ارتفاع ٤ م. ما طاقة وضعه؟","o":["٢٠ جول","١٠٠ جول","٤٠٠ جول","٢٠٠ جول"],"a":3},{"l":1,"k":"p","q":"رفعنا الحق عند مستوى المرجع نفسه؟","سهى كتلتها ٤٠ كغم في طابق يرتفع ٣ م عن الأرض. ما طاقة وضعها؟":"طو = ك × جـ × ف؛ اضرب ٤٠ × ١٠ × ٣.","خزّان كتلته مع الماء ١٠٠٠ كغم على سطح بناية ارتفاعها ٧ م. ما طاقة وضعه؟":"١٠٠٠ × ١٠ × ٧ = ؟","جسم طاقة وضعه ١٠٠ جول وكتلته ٢ كغم. على أيّ ارتفاع هو؟":"ف = طو ÷ (ك × جـ).","جسم كتلته ٣ كغم يقع ٢ م تحت مستوى المرجع. ما طاقة وضعه؟":"الارتفاع هنا سالب."}},{"t":"قانون حفظ الطاقة","e":["# أشكال الطاقة وتحوّلاتها","للطاقة أشكال كثيرة، كما أنها تتحوّل من شكل إلى آخر؛ فمثلاً تتحوّل طاقة الحركة إلى طاقة وضع، أو العكس.","في نشاط ١: كرة بيد طالبة على ارتفاع (أ) تمتلك طاقة وضع وطاقة حركتها صفر لحظة ثبوتها، وعند نزولها (ب) تتحوّل طاقة الوضع إلى طاقة حركة. تعتمد طاقة الوضع على الكتلة والارتفاع، وتعتمد طاقة الحركة على الكتلة والسرعة.","# الطاقة الميكانيكيّة","الطاقة الميكانيكيّة لجسم هي مجموع طاقتي الحركة والوضع له في أيّة نقطة من مساره: طم = طح + طو","# مثال محلول","قُذف جسم في مجال الجاذبيّة الأرضيّة وكانت طاقته الميكانيكيّة ١٢ جول. في نقطة ما أصبحت طاقته الحركيّة ٥ جول. طم = طح + طو ⇐ ١٢ = ٥ + طو ⇐ طو = ١٢ − ٥ = ٧ جول.","# نشاط ٢: قانون حفظ الطاقة الميكانيكيّة","نقذف كرة صغيرة رأسياً إلى الأعلى (المسار أ ← ب ← جـ ثم نزولاً جـ ← د ← هـ) ونتتبّع طاقتيها.","- أثناء الصعود: تتناقص سرعة الكرة فتتناقص طاقة حركتها، وتتحوّل إلى طاقة وضع تزداد بالمقدار نفسه، حتى تصل إلى أقصى ارتفاع فتصبح سرعتها وطاقة حركتها صفراً.","- أثناء النزول: تتحوّل طاقة الوضع إلى طاقة حركة فتزداد سرعتها وطاقة حركتها، ويكون مقدار النقصان في طاقة الوضع مساوياً لمقدار الزيادة في طاقة الحركة.","- هذا في حال غياب مقاومة الهواء والاحتكاك.","! قانون حفظ الطاقة الميكانيكيّة: الطاقة الميكانيكيّة مقدار ثابت لا يتغيّر في أيّة نقطة من مسار الجسم.","# مثال: السيّارة الكهربائيّة","سيّارة كتلتها ١ كغم تتحرّك على مسار أملس ملتوٍ بسرعة ٨ م/ث عند ارتفاع (ف = ٤ م). طم = ½ × ١ × ٨² + ١ × ١٠ × ٤ = ٣٢ + ٤٠ = ٧٢ جول عند النقطة (أ)، وهي نفسها في أيّة نقطة أخرى. عند النقطة (جـ) حيث طو = صفر: ٧٢ = طح + صفر، فطح = ٧٢ جول.","عند النقطة (ب) على ارتفاع ٢ م: طو = ١ × ١٠ × ٢ = ٢٠ جول (وتكون طح = ٧٢ − ٢٠ = ٥٢ جول).","# أسئلة اختبر نفسك","- عند زيادة طاقة الوضع لجسم تنقص طاقة حركته إذا بقيت الطاقة الميكانيكيّة ثابتة؛ والسيّارتان السريعتان تمتلكان طاقة حركة أكبر من البطيئتين فتكون أضرار التصادم أكبر.","- طاقة الحركة تمتاز دائماً بأنها موجبة (أو صفر)، ووحدة قياس طاقة الوضع هي الجول."],"q":["- عرّف الطاقة الميكانيكيّة واكتب علاقتها.","- اذكر نصّ قانون حفظ الطاقة الميكانيكيّة ومتى ينطبق.","- صِف تحوّلات الطاقة لكرة مقذوفة رأسياً إلى الأعلى أثناء الصعود وأثناء النزول.","- ما طاقة الوضع لجسم طاقته الميكانيكيّة ٣٠ جول وطاقة حركته ١٨ جول؟","- لماذا تكون طاقة حركة الكرة صفراً عند أقصى ارتفاع؟"],"quiz":[{"l":0,"k":"n","q":"ما الطاقة الميكانيكيّة لجسم؟","o":["مجموع طاقتي الحركة والوضع له","طاقة الحركة فقط","طاقة الوضع فقط","الفرق بين طاقتي الحركة والوضع"],"a":0},{"l":0,"k":"n","q":"أيّ العلاقات تمثّل الطاقة الميكانيكيّة؟","o":["طم = طح − طو","طم = طح × طو","طم = ك × جـ","طم = طح + طو"],"a":3},{"l":0,"k":"n","q":"ينصّ قانون حفظ الطاقة الميكانيكيّة على أنّ الطاقة الميكانيكيّة:","o":["تزداد باستمرار","تنقص باستمرار","مقدار ثابت لا يتغيّر في أيّة نقطة من المسار","تساوي صفراً"],"a":2},{"l":0,"k":"n","q":"عند صعود كرة مقذوفة رأسياً إلى الأعلى، طاقة حركتها:","o":["تزداد","تتحوّل إلى طاقة وضع","تبقى ثابتة","تتحوّل إلى كتلة"],"a":1},{"l":0,"k":"n","q":"أثناء سقوط الكرة تتحوّل طاقة الوضع إلى:","o":["طاقة حركة","طاقة صوتيّة","ارتفاع","طاقة ضوئيّة"],"a":0},{"l":0,"k":"n","q":"عند أقصى ارتفاع تصل إليه الكرة المقذوفة رأسياً تكون طاقة حركتها:","o":["أكبر ما يمكن","تساوي طاقتها الميكانيكيّة","سالبة","صفراً"],"a":3},{"l":0,"k":"n","q":"يصحّ تطبيق قانون حفظ الطاقة الميكانيكيّة كما في الكتاب عند:","o":["وجود احتكاك كبير","سكون الجسم دائماً","غياب مقاومة الهواء والاحتكاك","غياب الجاذبيّة"],"a":2},{"l":0,"k":"n","q":"تتحوّل الطاقة من شكل إلى آخر، فمثلاً تتحوّل طاقة الحركة إلى:","o":["كتلة","طاقة وضع","مسافة","زمن"],"a":1},{"l":1,"k":"p","q":"طاقة جسم الميكانيكيّة ١٢ جول وطاقة حركته ٥ جول. ما طاقة وضعه؟","o":["١٧ جول","٧ جول","٦٠ جول","٢٫٤ جول"],"a":1},{"l":1,"k":"p","q":"طم = ٣٠ جول وطح = ١٨ جول. ما طو؟","o":["١٢ جول ٨، ١","٢، ٨، ٨، ٢"],1]],"lessons":[{"t":"التوزيع الإلكتروني للذرّة","e":["# مكوّنات الذرّة (نشاط ١: إلكتروناتي حول نواتي)","نمذجت مجموعةٌ من الطلبة ذرّة عنصر الكربون C: تتوسّط النواةُ الذرّةَ، وتدور الإلكترونات حولها في مستويات الطاقة. في نموذج الكربون يوجد إلكترونان في مستوى الطاقة الأول وأربعة إلكترونات في المستوى الثاني.","|الجسيم|الشحنة|مكانه في الذرّة","|البروتون|موجبة (+)|داخل النواة","|النيوترون|متعادل (بلا شحنة)|داخل النواة","|الإلكترون|سالبة (−)|يدور حول النواة في مستويات الطاقة","- شحنة النواة موجبة لأنّها تحوي البروتونات الموجبة والنيوترونات المتعادلة.","# العدد الذرّي والعدد الكتلي","- العدد الذرّي لأيّة ذرّة يساوي عدد البروتونات في نواتها.","- تكون الذرّة متعادلة كهربائياً حين يكون عدد البروتونات في النواة مساوياً لعدد الإلكترونات التي تدور حولها في مستويات الطاقة.","- العدد الكتلي للذرّة = عدد البروتونات + عدد النيوترونات.","! مثال: ذرّة الفسفور P عددها الذرّي ١٥ وعددها الكتلي ٣١، فهي تحوي ١٥ بروتوناً و١٥ إلكتروناً و(٣١ − ١٥) = ١٦ نيوتروناً.","# السعة القصوى لمستويات الطاقة (نشاط ٢)","يبيّن الشكل أنّ لكلّ مستوى طاقةٍ حدّاً أقصى لما يتّسع له من الإلكترونات، وهذا الحدّ يزداد كلّما ابتعد المستوى عن النواة وازدادت طاقته.","|رقم مستوى الطاقة (ن)|مربّع الرقم (ن²)|السعة القصوى (٢ن²)","|١|١|٢","|٢|٤|٨","|٣|٩|١٨","|٤|١٦|٣٢","! السعة القصوى من الإلكترونات في المستوى ن = ٢ن²، حيث ن رقم مستوى الطاقة.","# التوزيع الإلكتروني للذرّة (نشاط ٣)","تتوزّع الإلكترونات حول النواة في مستويات الطاقة المختلفة، ويتّسع كلّ مستوى لعددٍ معيّنٍ منها. يمكن تمثيل التوزيع الإلكتروني لذرّة العنصر بكتابة عدد الإلكترونات التي يتّسع لها كلّ مستوى من مستويات الطاقة بحسب رقمه وبُعده عن النواة.","|العنصر|عدد البروتونات|عدد الإلكترونات|التوزيع الإلكتروني","|الأكسجين O|٨|٨|٢، ٦","|المغنيسيوم Mg|١٢|١٢|٢، ٨، ٢","|الكلور Cl|١٧|١٧|٢، ٨، ٧","|البوتاسيوم K|١٩|١٩|٢، ٨، ٨، ١","|الكالسيوم Ca|٢٠|٢٠|٢، ٨، ٨، ٢","- عدد البروتونات في كلّ ذرّةٍ يساوي عدد الإلكترونات فيها.","# إلكترونات التكافؤ (نشاط ٣: إلكترونات التكافؤ)","|العنصر|الرمز|البروتونات|الإلكترونات|التوزيع|إلكترونات المستوى الأخير","|أكسجين|O|٨|٨|٢، ٦|٦","|ليثيوم|Li|٣|٣|٢، ١|١","|نيون|Ne|١٠|١٠|٢، ٨|٨","|ألمنيوم|Al|١٣|١٣|٢، ٨، ٣|٣","|كبريت|S|١٦|١٦|٢، ٨، ٦|٦","- للأكسجين والكبريت العدد نفسه من إلكترونات المستوى الأخير (٦)، وللبوتاسيوم العدد نفسه الذي لليثيوم (١)، وللآرغون العدد نفسه الذي للنيون (٨).","! تُسمّى إلكترونات مستوى الطاقة الأخير في التوزيع الإلكتروني للذرّة إلكترونات التكافؤ، وهي التي تحدّد الصفات الكيميائية والفيزيائية للعنصر."],"q":["- ما الجسيمات الموجودة في النواة، وما شحنة كلٍّ منها؟","- كيف تحسب عدد النيوترونات في ذرّةٍ إذا عرفت عددها الذرّي وعددها الكتلي؟","- ما السعة القصوى للمستويات الأربعة الأولى من الإلكترونات؟ وما العلاقة التي تربطها برقم المستوى؟","- اكتب التوزيع الإلكتروني لذرّة الكالسيوم ₂₀Ca، وحدّد عدد إلكترونات التكافؤ فيها.","- ما المقصود بإلكترونات التكافؤ؟ وماذا تحدّد في العنصر؟"],"quiz":[{"l":0,"k":"n","q":"ما شحنة نواة الذرّة؟","o":["متعادلة","موجبة","تتغيّر بتغيّر عدد الإلكترونات","سالبة"],"a":1},{"l":0,"k":"n","q":"العدد الذرّي لأيّة ذرّة يساوي عدد:","o":["البروتونات في نواتها","الإلكترونات في المستوى الأخير فقط","البروتونات والنيوترونات معاً","النيوترونات في نواتها"],"a":0},{"l":0,"k":"n","q":"العدد الكتلي للذرّة يساوي:","o":["الفرق بين عدد البروتونات والإلكترونات","عدد الإلكترونات فقط","مجموع عددَي البروتونات والنيوترونات","عدد البروتونات فقط"],"a":2},{"l":0,"k":"n","q":"ما العلاقة التي تعطي السعة القصوى من الإلكترونات في مستوى الطاقة ن؟","o":["٢ن²","ن²","٢ + ن","٢ن"],"a":0},{"l":0,"k":"n","q":"ما السعة القصوى من الإلكترونات لمستوى الطاقة الثاني؟","o":["٢","٨","٣٢","١٨"],"a":1},{"l":0,"k":"n","q":"تُسمّى الإلكترونات الموجودة في مستوى الطاقة الأخير:","o":["نيوترونات المستوى","إلكترونات النواة","بروتونات التكافؤ","إلكترونات التكافؤ"],"a":3},{"l":0,"k":"n","q":"ما رمز عنصر الكربون؟","o":["Co","Ca","C","Cl"],"a":2},{"l":0,"k":"n","q":"تكون الذرّة متعادلة كهربائياً عندما:","o":["تمتلئ جميع مستويات الطاقة","يتساوى عدد النيوترونات وعدد الإلكترونات","يكون عدد النيوترونات أكبر من البروتونات","يتساوى عدد البروتونات وعدد الإلكترونات"],"a":3},{"l":1,"k":"p","q":"ذرّة الفسفور ₁₅³¹P: كم عدد النيوترونات فيها؟","o":["٣١","١٥","٤٦","١٦"],"a":3},{"l":1,"k":"p","q":"ما التوزيع الإلكتروني لذرّة الأكسجين ₈O؟","o":["٦، ٢","٢، ٨","٢، ٦","٨"],"a":2},{"l":1,"k":"p","q":"ما التوزيع الإلكتروني لذرّة المغنيسيوم ₁₂Mg؟","o":["٢، ٨، ١","٢، ٨، ٢","٨، ٢، ٢","٢، ٦، ٤"],"a":1},{"l":1,"k":"p","q":"كم إلكترون تكافؤ في ذرّة الكلور ₁₇Cl؟","o":["٢","١٧","٨","٧"],"a":3},{"l":1,"k":"p","q":"كم عدد إلكترونات ذرّة النيون ₁₀Ne، وكم إلكتروناً في مستواها الأخير؟","o":["١٠ إلكترونات، ٨ منها في المستوى الأخير","٨ إلكترونات، ٨ منها في المستوى الأخير","٢٠ إلكتروناً، ٨ منها في المستوى الأخير","١٠ إلكترونات، ٢ منها في المستوى الأخير"],"a":0},{"l":1,"k":"p","q":"أيّ العناصر الآتية له العدد نفسه من إلكترونات التكافؤ الذي لليثيوم ₃Li (٢، ١)؟","o":["النيون ₁₀Ne","الأكسجين ₈O","البوتاسيوم ₁₉K (٢، ٨، ٨، ١)","الألمنيوم ₁₃Al"],"a":2},{"l":1,"k":"p","q":"ذرّتان: الأولى توزيعها (٢، ٦) والثانية (٢، ٨، ٦). ماذا تشتركان فيه؟","o":["العدد الذرّي","عدد إلكترونات التكافؤ (٦)","عدد مستويات الطاقة","العدد الكتلي"],"a":1},{"l":1,"k":"p","q":"ما التوزيع الإلكتروني لذرّة الألمنيوم ₁₃Al؟","o":["٢، ٨، ٣","٢، ٣، ٨","٢، ٨، ٢، ١","٣، ٨، ٢"],"a":0},{"l":2,"k":"p","q":"عنصر عدده الكتلي ٢٣ وعدد إلكتروناته ١١، فما عدد النيوترونات فيه؟","o":["٣٤","٢٣","١١","١٢"],"a":3},{"l":2,"k":"p","q":"ما التوزيع الإلكتروني لذرّة الكالسيوم ₂₀Ca؟","o":["٢، ٨، ١٠","٢، ٨، ٨، ١","٢، ١٨","٢، ٨، ٨، ٢"],"a":3},{"l":2,"k":"p","q":"ذرّة عدد إلكترونات مستواها الأخير ٣، وتحوي ثلاثة مستويات مملوءة بحسب سعتها (٢، ٨، ٣). ما عددها الذرّي؟","o":["٣","١٣","١١","٨"],"a":1},{"l":2,"k":"p","q":"ذرّة توزيعها الإلكتروني (٢، ٨، ٨). ما عددها الذرّي، وأيّ عنصرٍ هي؟","o":["١٠ وهي النيون Ne","١٨ وهي الآرغون Ar","١٦ وهي الكبريت S","٢٠ وهي الكالسيوم Ca"],"a":1},{"l":2,"k":"p","q":"ما أقصى عدد من الإلكترونات يتّسع له المستوى الرابع بحسب العلاقة ٢ن²؟","o":["١٨","٦٤","٣٢","١٦"],"a":2},{"l":2,"k":"p","q":"ذرّة عدد بروتوناتها ١٦. كم عدد إلكترونات التكافؤ فيها؟","o":["٦","٢","٨","١٦"],"a":0},{"l":2,"k":"p","q":"عنصر توزيعه الإلكتروني (٢، ٨، ٧) وعدده الكتلي ٣٥. كم عدد النيوترونات في ذرّته؟","o":["١٨","١٧","٣٥","٧"],"a":0},{"l":2,"k":"p","q":"أيّ التوزيعات الآتية لا يمكن أن يكون لذرّةٍ في حالتها المتعادلة وفق سعات مستويات الطاقة؟","o":["٢، ٨، ١","٢، ٦","٢، ٩، ١","٢، ٨، ٨، ٢"],"a":2}],"hints":{"العدد الذرّي لأيّة ذرّة يساوي عدد:":"تذكّر: العدد الذرّي يُكتب أسفل رمز العنصر ويدلّ على الجسيمات الموجبة داخل النواة.","ذرّة الفسفور ₁₅³¹P: كم عدد النيوترونات فيها؟":"العدد الكتلي = البروتونات + النيوترونات، فاطرح عدد البروتونات من العدد الكتلي.","عنصر عدده الكتلي ٢٣ وعدد إلكتروناته ١١، فما عدد النيوترونات فيه؟":"ذرّة متعادلة: عدد البروتونات = عدد الإلكترونات = ١١؛ ثمّ اطرحه من العدد الكتلي.","ذرّة عدد إلكترونات مستواها الأخير ٣، وتحوي ثلاثة مستويات مملوءة بحسب سعتها (٢، ٨، ٣). ما عددها الذرّي؟":"اجمع الأعداد في التوزيع (٢ + ٨ + ٣) لتحصل على عدد الإلكترونات وهو نفسه عدد البروتونات.","أيّ التوزيعات الآتية لا يمكن أن يكون لذرّةٍ في حالتها المتعادلة وفق سعات مستويات الطاقة؟":"قارن عدد الإلكترونات في كلّ مستوى بسعته القصوى ٢ن²: المستوى الثاني يتّسع لـ ٨ فقط."}},{"t":"العناصر والجدول الدوري","e":["# الجدول الدوري الحديث (نشاط ١)","توصّل العلماء إلى ترتيبٍ للعناصر الكيميائية في جدول يُسمّى الجدول الدوري الحديث. يظهر في الجدول ١٨ عموداً و٧ صفوف.","- يُسمّى العمود في الجدول الدوري مجموعة، ويُسمّى الصفّ دورة.","- تتوزّع العناصر بين عائلتين (A, B)، وسيتمّ التركيز على عناصر المجموعة A.","# مجموعة العنصر (نشاط ٢)","|العنصر|الرمز|التوزيع الإلكتروني|إلكترونات التكافؤ","|البريليوم|Be (٤)|٢، ٢|٢","|المغنيسيوم|Mg (١٢)|٢، ٨، ٢|٢","|الكالسيوم|Ca (٢٠)|٢، ٨، ٨، ٢|٢","|الفلور|F (٩)|٢، ٧|٧","|الكلور|Cl (١٧)|٢، ٨، ٧|٧","- تترتّب العناصر التي لها عدد إلكترونات التكافؤ نفسه في المجموعة نفسها، وتتشابه عناصر المجموعة الواحدة في صفاتها الكيميائية، كما هو الحال مع البوتاسيوم والصوديوم إذ لهما العدد نفسه من إلكترونات التكافؤ.","- يُعبَّر عن رقم المجموعة بعدد يُكتب باللغة اللاتينية (B, A)؛ فالمجموعة الأولى IA والثانية IIA. وهكذا فالبريليوم والمغنيسيوم والكالسيوم في المجموعة IIA، والفلور والكلور في المجموعة VIIA.","! رقم المجموعة (A) = عدد إلكترونات التكافؤ.","# دورة العنصر (نشاط ٣)","عناصر الصفّ الثاني: Li وBe وB وC وN وO وF وNe، توزيعاتها على الترتيب: ٢،١ — ٢،٢ — ٢،٣ — ٢،٤ — ٢،٥ — ٢،٦ — ٢،٧ — ٢،٨. جميعها له مستويا طاقة، وهي في الدورة الثانية.","- تترتّب العناصر التي تتوزّع إلكتروناتها في العدد نفسه من مستويات الطاقة في الدورة نفسها.","! رقم الدورة = عدد مستويات الطاقة في ذرّة العنصر.","|العنصر|التوزيع|عدد المستويات|رقم الدورة","|الكالسيوم ₂₀Ca|٢، ٨، ٨، ٢|٤|٤","|الألمنيوم ₁₃Al|٢، ٨، ٣|٣|٣","|الفسفور ₁₅P|٢، ٨، ٥|٣|٣","|الآرغون ₁₈Ar|٢، ٨، ٨|٣|٣","# موقع العنصر في الجدول الدوري (نشاط ٤)","|وجه المقارنة|البوتاسيوم K|الفلور F","|العدد الذرّي|١٩|٩","|عدد الإلكترونات|١٩|٩","|التوزيع الإلكتروني|٢، ٨، ٨، ١|٢، ٧","|إلكترونات التكافؤ|١|٧","|رقم المجموعة|IA|VIIA","|عدد مستويات الطاقة|٤|٢","|رقم الدورة|٤|٢","لتحديد موقع عنصرٍ بدقّة نحتاج إلى معرفة رقم المجموعة ورقم الدورة. مثال: الدورة الثانية والمجموعة IIA هي البريليوم Be؛ والدورة الثالثة والمجموعة VIA هي الكبريت S؛ والدورة الرابعة والمجموعة IA هي البوتاسيوم K.","! عنصر مجهول عدده الذرّي ١٦: توزيعه (٢، ٨، ٦)، فمجموعته VIA ودورته الثالثة، وبالجدول الدوري هو الكبريت S.","# العائلات الشائعة في الجدول الدوري (أنشطة ٥ – ٧)","- المجموعة الأولى IA: تبدأ بالليثيوم Li وتنتهي بالفرانسيوم Fr وتُسمّى العناصر القلوية، ولكلّ عنصر منها إلكترون تكافؤ واحد (Li, Na, K, Rb, Cs, Fr). مثال: الصوديوم موجود في ملح الطعام.","- المجموعة الثانية IIA: تبدأ بالبريليوم Be وتنتهي بالراديوم Ra وتُسمّى العناصر القلوية الترابية، ولكلّ عنصر منها إلكترونا تكافؤ (Be, Mg, Ca, Sr, Ba, Ra). مثال: الكالسيوم يوجد بنسبةٍ عالية في الحليب.","- المجموعة السابعة VIIA: تُسمّى الهالوجينات، وهي F وCl وBr وI وAt؛ عناصر نشيطة كيميائياً لا توجد حرّةً في الطبيعة بل على شكل مركّبات. تتدرّج حالتها الفيزيائية: غازية للفلور والكلور، سائلة للبروم، وصلبة لليود والأستاتين. كلمة هالوجينات تعني مكوّنات الملح؛ لأنّ لها القدرة على تكوين الأملاح، فمثلاً عند تفاعل الكلور مع الصوديوم يتكوّن كلوريد الصوديوم (ملح الطعام).","- المجموعة الثامنة VIIIA: تبدأ بالهيليوم He وتنتهي بالرادون Rn وتُسمّى الغازات النبيلة (He, Ne, Ar, Kr, Xe, Rn)؛ لا تتفاعل مع العناصر الأخرى في الظروف الطبيعية فتوصف بأنّها مستقرّة. توزيع النيون (٢، ٨) والآرغون (٢، ٨، ٨): مستواهما الأخير مكتمل، ورقم مجموعة كلٍّ منهما VIIIA. الهيليوم هو الغاز النبيل الذي تُعبَّأ به المناطيد.","# الجدول الدوري مصدر للمعلومات (نشاط ٨)","- من الجدول الدوري نعرف رقم المجموعة والدورة، فنتوقّع الصفات المتشابهة: فالعناصر المتشابهة مع الفلور F هي الكلور Cl والبروم Br واليود I والأستاتين At (مجموعته VIIA)، والمتشابهة مع الكالسيوم Ca هي Be وMg وSr وBa وRa (مجموعته IIA).","- العنصر الواقع في الدورة الخامسة والمجموعة السابعة هو اليود I."],"q":["- ما الفرق بين المجموعة والدورة في الجدول الدوري؟ وكم عدد كلٍّ منهما؟","- كيف تحدّد رقم مجموعة العنصر ورقم دورته من توزيعه الإلكتروني؟ طبّق ذلك على الفسفور ₁₅P.","- لماذا تتشابه عناصر المجموعة الواحدة في صفاتها الكيميائية؟","- اذكر اسم كلٍّ من المجموعتين IA وVIIA وخاصّيةً مميّزة لكلٍّ منهما.","- لماذا توصف الغازات النبيلة بأنّها مستقرّة؟"],"quiz":[{"l":0,"k":"n","q":"كيف يُسمّى العمود في الجدول الدوري؟","o":["دورة","مستوى","عائلة B","مجموعة"],"a":3},{"l":0,"k":"n","q":"كيف يُسمّى الصفّ في الجدول الدوري؟","o":["عمود","مجموعة","دورة","شعبة"],"a":2},{"l":0,"k":"n","q":"كم صفّاً (دورة) في الجدول الدوري الحديث؟","o":["٧","٩","٨","١٨"],"a":0},{"l":0,"k":"n","q":"كم عموداً في الجدول الدوري الحديث؟","o":["٧","١٨","٨","٢٠"],"a":1},{"l":0,"k":"n","q":"ماذا تُسمّى عناصر المجموعة IA؟","o":["العناصر القلوية الترابية","العناصر القلوية","الغازات النبيلة","الهالوجينات"],"a":1},{"l":0,"k":"n","q":"ماذا تُسمّى عناصر المجموعة VIIA؟","o":["القلوية","القلوية الترابية","الهالوجينات","الغازات النبيلة"],"a":2},{"l":0,"k":"n","q":"ما الاسم الشائع لعناصر المجموعة الثامنة (He, Ne, Ar)؟","o":["الغازات النبيلة","القلويات","الفلزات الانتقالية","الهالوجينات"],"a":0},{"l":0,"k":"n","q":"رقم المجموعة (A) لعنصرٍ يساوي عدد:","o":["نيوتروناته","مستويات الطاقة فيه","بروتوناته","إلكترونات التكافؤ فيه"],"a":3},{"l":1,"k":"p","q":"في أيّ مجموعة يقع الكلور ₁₇Cl (٢، ٨، ٧)؟","o":["IA","VIA","VIIIA","VIIA"],"a":3},{"l":1,"k":"p","q":"في أيّ دورة يقع المغنيسيوم ₁₂Mg (٢، ٨، ٢)؟","o": [2,"ما الصيغة الكيميائية لكبريتات الفضة؟",["AgSO₄","Ag(SO₄)₂","Ag₂(SO₄)₂","Ag₂SO₄"],3],[2,"كم رابطة تساهمية تنشأ في جزيء NH₃؟",["٣","١","٢","٤"],0],[2,"عنصران X₁₆ وY₂₀ اتّحدا. ما الصيغة الناتجة؟",["YX₂","YX","Y₂X","Y₂X₂"],1]],"lessons":[{"t":"الصيغة الكيميائية","e":["# العناصر تكوّن المركّبات (نشاط ١)","|المركّب|العناصر المكوّنة له|عدد ذرّات كلّ عنصر","|ثاني أكسيد الكربون CO₂|الكربون، الأكسجين|C: ١ ، O: ٢","|كلوريد الصوديوم NaCl|الصوديوم، الكلور|Na: ١ ، Cl: ١","|الماء H₂O|الهيدروجين، الأكسجين|H: ٢ ، O: ١","|سكر المائدة C₁₂H₂₂O₁₁|الكربون، الهيدروجين، الأكسجين|C: ١٢ ، H: ٢٢ ، O: ١١","- من استخدامات هذه المركّبات: كلوريد الصوديوم في عمل المخلّلات، وثاني أكسيد الكربون في إطفاء الحرائق، والسكر في عمل المربّى، والماء مركّب أساسيّ في الحياة.","! الصيغة الكيميائية للمركّب: تعبيرٌ بالرموز يبيّن نوع الذرّات وعددها في جزيءٍ واحدٍ من المركّب. ويساعد التعبير عن العناصر بالرموز على كتابة الصيغة.","- تسعى العناصر دائماً إلى الوصول إلى حالة الاستقرار، وهي أن يصبح تركيبها الإلكتروني مشابهاً للتركيب الإلكتروني لأقرب غازٍ نبيل لها؛ فقد يميل العنصر إلى فقد الإلكترونات أو كسبها أو المشاركة بها.","# شحنة العنصر (نشاط ٢)","|العنصر النبيل|توزيعه|العنصر|توزيعه|فقد أو كسب|الشحنة","|₂He|٢|₃Li|٢، ١|يفقد ١|1+","|₁₀Ne|٢، ٨|₁₂Mg|٢، ٨، ٢|يفقد ٢|2+","|₁₈Ar|٢، ٨، ٨|₁₅P|٢، ٨، ٥|يكسب ٣|3−","- العناصر الفلزّية تميل إلى فقد إلكترونات مستوى الطاقة الأخير، فيصبح مستواها الأخير مكتملاً بالإلكترونات وتتحوّل إلى أيون موجب، تركيبه الإلكتروني مشابهٌ تماماً للعنصر النبيل الذي يقع قبله في الدورة السابقة، وشحنته الموجبة تساوي عدد الإلكترونات المفقودة.","- العناصر اللافلزّية تميل إلى كسب إلكترونات فتتحوّل إلى أيون سالب، تركيبه الإلكتروني مشابهٌ للعنصر النبيل الذي يقع في الدورة نفسها، وشحنته السالبة تساوي عدد الإلكترونات المكتسبة.","! الأيون: ذرّة أو مجموعة من الذرّات تحمل شحنة سالبة أو موجبة. والأيون المكوَّن من مجموعة ذرّات يُسمّى المجموعة الأيونية.","! فسّر: شحنة الليثيوم أحادي موجب (Li⁺) لأنّه يفقد إلكتروناً واحداً، بينما شحنة الفسفور ثلاثي سالب (P³⁻) لأنّه يكسب ثلاثة إلكترونات.","# الشحنات الشائعة للعناصر","|العنصر|الرمز|الشحنة","|هيدروجين / ليثيوم / صوديوم / بوتاسيوم / فضة|H / Li / Na / K / Ag|1+","|مغنيسيوم / كالسيوم / خارصين / بريليوم|Mg / Ca / Zn / Be|2+","|ألومنيوم|Al|3+","|نحاس|Cu|1+ و 2+","|حديد|Fe|2+ و 3+","|فلور / كلور / بروم / يود|F / Cl / Br / I|1−","|أكسجين / كبريت|O / S|2−","|نيتروجين / فوسفور|N / P|3−","|كربون / سيليكون|C / Si|4±","- يتوفّر أكثر من شحنة لبعض العناصر كالحديد والنحاس، ويتمّ تمييزها بالأرقام اللاتينية: ١ = I ، ٢ = II ، ٣ = III. مثل: فلوريد النحاس(II).","# المجموعات الأيونية الشهيرة","|المجموعة الأيونية|الرمز|الشحنة","|هيدروكسيل|OH⁻|1−","|نترات|NO₃⁻|1−","|أمونيوم|NH₄⁺|1+","|بايكربونات|HCO₃⁻|1−","|كلورات|ClO₃⁻|1−","|برمنغنات|MnO₄⁻|1−","|كربونات|CO₃²⁻|2−","|كبريتات|SO₄²⁻|2−","# كتابة صيغ المركّبات الكيميائية","لكتابة الصيغة تُكتب رموز العناصر أو المجموعات الأيونية وشحنة كلٍّ منها، ويتمّ تبادل الشحنات حتى تصبح الشحنة الكلّية على المركّب صفراً؛ لأنّ المركّب الكيميائي يجب أن يكون متعادلاً.","- ١: نكتب الرموز. ٢: نكتب شحنة كلٍّ منها تحت الرمز. ٣: نتبادل الشحنات. ٤: الصيغة النهائية.","! مثال: كلوريد المغنيسيوم: Mg²⁺ وCl⁻ ← تبادل الشحنات فيصبح عدد الكلور ٢ وعدد المغنيسيوم ١ ← MgCl₂.","- إذا احتجنا إلى أكثر من مجموعة أيونية واحدة وضعناها بين قوسين ثم كتبنا العدد أسفل القوس: Ca(OH)₂ و(NH₄)₂SO₄.","- أجوبة تمرين الكتاب: كلوريد الليثيوم LiCl، كبريتات الفضة Ag₂SO₄، بيكربونات الصوديوم NaHCO₃، فلوريد النحاس(II) CuF₂.","# تسمية المركّبات الكيميائية","لتسمية المركّب نسمّي أولاً العنصر أو المجموعة التي تحمل الشحنة السالبة، ثمّ نسمّي العنصر أو المجموعة التي تحمل الشحنة الموجبة.","|الصيغة|الاسم الكيميائي","|MgBr₂|بروميد المغنيسيوم","|K₂O|أكسيد البوتاسيوم","|(NH₄)₂SO₄|كبريتات الأمونيوم","|Ca(OH)₂|هيدروكسيد الكالسيوم"],"q":["- ما المقصود بالصيغة الكيميائية؟ وماذا تبيّن؟","- فسّر لماذا تفقد ذرّة الليثيوم إلكتروناً واحداً بينما تكسب ذرّة الفسفور ثلاثة إلكترونات.","- اكتب الصيغة الكيميائية لكلٍّ من: كلوريد الليثيوم، كبريتات الفضة، فلوريد النحاس(II)، موضّحاً خطوات تبادل الشحنات.","- سمِّ المركّبين: K₂O و(NH₄)₂SO₄.","- اذكر ثلاث مجموعات أيونية شهيرة مع رمز كلٍّ منها وشحنت ، ٧|يكسب إلكتروناً واحداً|F⁻","- الشحنات المختلفة تتجاذب والشحنات المتشابهة تتنافر؛ لذلك يتجاذب أيون الليثيوم الموجب وأيون الفلوريد السالب بقوّة.","! تنشأ الرابطة الأيونية بين ذرّتين (فلز ولا فلز)، إحداهما قابلة لفقد الإلكترونات (فلز) والأخرى قابلة لكسب الإلكترونات (لا فلز)، بهدف الوصول إلى الاستقرار، فينتج أيونان أحدهما موجب والآخر سالب يتجاذبان بقوّة فتنشأ بينهما رابطة أيونية.","# مثال: ارتباط المغنيسيوم بالكلور","- التوزيع الإلكتروني للمغنيسيوم Mg: ٢، ٨، ٢؛ يفقد إلكترونين من مستوى الطاقة الأخير، بحيث تمنح كلّ ذرّة كلور إلكتروناً منهما، ويتحوّل إلى أيون موجب Mg²⁺.","- التوزيع الإلكتروني للكلور Cl: ٢، ٨، ٧؛ يكسب إلكتروناً واحداً حتى يكتمل مستوى الطاقة الأخير له، ويتحوّل إلى أيون سالب Cl⁻.","- تنشأ رابطة أيونية بين الأيونات: Cl⁻ ، Mg²⁺ ، Cl⁻، والصيغة الكيميائية الناتجة: MgCl₂.","- تمرين: عنصران افتراضيان X₁₆ و Y₂₀: التوزيع (٢، ٨، ٦) و(٢، ٨، ٨، ٢)؛ X يكسب إلكترونين فيصير X²⁻، وY يفقد إلكترونين فيصير Y²⁺، والصيغة الناتجة YX (من نوع Y²⁺ وX²⁻).","# الرابطة التساهمية (نشاط ٢)","يوجد الهيدروجين في الطبيعة على شكل جزيئات (H₂)، وتتكوّن الرابطة بين ذرّتين، ويُمثَّل H–H أو H:H. تنشأ الرابطة التساهمية بين ذرّتين لا تميل أيٌّ منهما إلى فقد أو كسب إلكترونات، وإنّما تتشاركان بإلكترونات التكافؤ لكلٍّ منهما، بحيث تصل كلّ ذرّة إلى حالة الثبات والاستقرار لتشبه تركيب العنصر النبيل.","|الجزيء|ذرّاته وتوزيعها|عدد الإلكترونات المحتاجة|الرابطة","|H₂|H: ١ ، H: ١|إلكترون واحد لكلّ ذرّة|رابطة تساهمية أحادية H–H","|O₂|O: ٢، ٦ ، O: ٢، ٦|إلكترونان لكلّ ذرّة|رابطة تساهمية ثنائية O=O","|CH₄|C: ٢، ٤ ، H: ١ (٤ ذرّات)|C تحتاج ٤ إلكترونات، وكلّ H إلكتروناً واحداً|أربع روابط تساهمية أحادية","- تمثيل الأكسجين: O=O أو O::O. وتمثيل الميثان: ذرّة كربون في الوسط ترتبط بأربع ذرّات هيدروجين، أي C–H أربع مرّات.","- حلّ سؤال الكتاب (النشادر NH₃): توزيع النيتروجين ٢، ٥ فهو يحتاج إلى ٣ إلكترونات، وكلّ هيدروجين يحتاج واحداً؛ فترتبط ذرّة النيتروجين بثلاث ذرّات هيدروجين بثلاث روابط تساهمية أحادية.","# مقارنة بين نوعي الروابط","|وجه المقارنة|الرابطة الأيونية|الرابطة التساهمية","|بين أيّ ذرّات؟|فلز ولا فلز|ذرّتين لا  الفلور ₉F (٢، ٧) لتصل إلى حالة الاستقرار؟":"قارن بين عدد إلكترونات مستواها الأخير وسعته ٨.","ما التوزيع الإلكتروني لأيون المغنيسيوم Mg²⁺ بعد فقد إلكترونين؟":"الذرّة ٢، ٨، ٢؛ انزع إلكترونات المستوى الأخير.","عنصران X₁₆ و Y₂₀ اتّحدا. ما شحنة كلٍّ منهما وما الصيغة الناتجة؟":"اكتب التوزيع (٢، ٨، ٦) و(٢، ٨، ٨، ٢) ثمّ حدّد من يفقد ومن يكسب وكم.","ما عدد الإلكترونات التي يفقدها المغنيسيوم، وما عدد التي تكسبها ذرّتا الكلور معاً في MgCl₂؟":"كلّ ذرّة كلور تكسب إلكتروناً واحداً وعددها ٢."}}]},{"title":"التفاعلات وأنواع المركّبات","ic":"flask","color":"#fbc473","uq":[[0,"التغيّر الذي ينتج مواداً جديدة يُسمّى:",["تفاعلاً كيميائياً","تبخّراً","ذوباناً","تغيّراً فيزيائياً"],0],[0,"الحموض تغيّر لون ورقة دوّار الشمس الزرقاء إلى:",["الأخضر","الأحمر","لا تغيّر لونها","الأصفر"],1],[0,"القواعد تتأيّن في الماء منتجةً أيون:",["الكلوريد Cl⁻","الهيدروجين H⁺","الهيدروكسيل OH⁻","النترات NO₃⁻"],2],[1,"أيّ مما يأتي دلالة على حدوث تفاعل كيميائي؟",["تغيّر الشكل فقط","تغيّر الحجم فقط","قصّ المادة","تصاعد غاز"],3],[1,"ما ناتج تفاعل التعادل بين NaOH وHCl؟",["NaCl + H₂O","Na₂O + HCl","NaClO + H₂","NaH + OCl"],0],[1,"ما المعادلة الموزونة لتفاعل الكالسيوم مع الأكسجين؟",["Ca + O₂ ← CaO₂","2Ca + O₂ ← 2CaO","Ca + O₂ ← CaO","2Ca + 2O₂ ← 2CaO"],1],[1,"الأكاسيد القاعدية تنتج من اتّحاد الأكسجين مع عنصر:",["غازي دائماً","نبيل","فلزّي","لافلزّي"],2],[2,"وازن المعادلة: HgO ← Hg + O₂",["HgO ← 2Hg + O₂","2HgO ← Hg + O₂","HgO ← Hg + 2O₂","2HgO ← 2Hg + O₂"],3],[2,"أيّ الصيغ الآتية تمثّل مركّباً لا يوصل محلوله التيار الكهربائي؟",["C₆H₁₂O₆","CaBr₂","HCl","LiOH"],0],[2,"محلول غيّر لون ورقة دوّار الشمس الحمراء إلى الأزرق. ما نوعه؟",["ملحي متعادل دائماً","قاعدي","حمضي ضعيف","حمضي"],1]],"lessons":[{"t":"التفاعل الكيميائي ودلالاته","e":["# التفاعل الكيميائي (نشاط ١)","المواد والأدوات: دورق مخروطي، قطعة خارصين، بالون، حمض الهيدروكلوريك المخفّف، مخبار مدرّج. الخطوات: نأخذ ٢٠ مل من الحمض المخفّف، نسكبه في الدورق، نضع قطعة الخارصين بحذر، ثم نضع فوهة البالون على فوهة الدورق ونسجّل الملاحظات.","- ينتفخ البالون بسبب غازٍ ناتج من تفاعل الخارصين مع الحمض، وهو غاز الهيدروجين، أي تغيّر التركيب الكيميائي وتكوّنت مواد جديدة.","! التغيّر في التركيب الكيميائي للمواد الذي ينتج موادّ جديدة بصفاتٍ جديدة يُسمّى تفاعلاً كيميائياً، وعندها لا يمكن إعادة المواد الجديدة إلى حالتها الأصلية بطرق عادية.","# المعادلة الكيميائية الموزونة","يُعبَّر عن التفاعل الكيميائي بمعادلة كيميائية موزونة تعبّر بالرموز عن المواد المتفاعلة والمواد الناتجة والحالة الفيزيائية لكلٍّ منها وظروف التفاعل. خطوات كتابتها:","- نكتب معادلة لفظية تعبّر عن التفاعل، تشمل أسماء المواد المتفاعلة والمواد الناتجة يفصل بينها سهم مكتوب عليه ظروف التفاعل.","- نكتب الرموز والصيغ الكيميائية للمواد المتفاعلة والناتجة، وحالة كلٍّ منها بين قوسين صغيرين أسفل اليمين: (s) صلب، (g) غاز، (aq) محلول مائي، (l) سائل.","- نوازن المعادلة بحيث يكون عدد ذرّات كلّ عنصر في الجهة اليسرى واليمنى من المعادلة متساوياً.","# موازنة المعادلة الكيميائية","- ١: تحديد الذرّة ذات العدد الأكبر في طرفي المعادلة، بشرط ألّا تكون ذرّة هيدروجين أو أكسجين.","- ٢: موازنة الذرّة الأكبر ثم التي تليها من حيث العدد.","- ٣: موازنة ذرّات الهيدروجين إن وجد.","- ٤: موازنة ذرّات الأكسجين إن وجد.","! مثال: تفاعل فلز الكالسيوم مع غاز الأكسجين بالتسخين لإنتاج أكسيد الكالسيوم الصلب. اللفظية: كالسيوم + أكسجين ← أكسيد الكالسيوم. بالرموز: Ca(s) + O₂(g) ← CaO(s). الذرّات ليست متساوية (الأكسجين ٢ في المتفاعلات و١ في الناتج) فنضرب CaO بـ ٢ ثم نضرب Ca بـ ٢: 2Ca(s) + O₂(g) ← 2CaO(s).","# دلالات حدوث التفاعل الكيميائي (أنشطة ٢ – ٦)","|النشاط|ماذا نلاحظ|الدلالة|المعادلة / ملاحظة","|٢: ألمنيوم + حمض الكبريتيك المخفّف|تسخن أنبوب الاختبار ويتصاعد غاز|ارتفاع درجة الحرارة (حرارة تنتج) وتصاعد غاز|2Al + 3H₂SO₄ ← Al₂(SO₄)₃ + 3H₂ ؛ الغاز هيدروجين","|٣: محلول اليود + الخبز / الحليب|يتغيّر لون الخبز إلى البنفسجي الغامق المائل إلى الأسود، ولا يتغيّر لون الحليب|تغيّر في اللون (دليل على تفاعل اليود والنشا في الخبز)|لا تغيّر في الحليب يدلّ على عدم حدوث تفاعل","|٤: نترات الفضة + ملح الطعام (محلول)|يتكوّن راسب ويستقرّ في قاع الكأس|تشكّل راسب (مادة غير ذائبة في الماء)|AgNO₃ + NaCl ← AgCl(s) + NaNO₃ ؛ الراسب كلوريد الفضة AgCl","|٥: ماء الملفوف الأحمر (كاشف طبيعي)|يصبح أحمر مع الحمض وأخضر مع القاعدة|تغيّر لون الكاشف الطبيعي|بايكربونات الصوديوم NaHCO₃ قاعدة تُغيّر لونه إلى الأخضر","|٦: احتراق شريط المغنيسيوم|ضوء ساطع (وميض) ويتبقّى مسحوق|إنتاج ضوء ووميض|2Mg(s) + O₂(g) ← 2MgO(s) ؛ الناتج أكسيد المغنيسيوم","- تُنظَّف شريحة المغنيسيوم بورق الصنفرة قبل الاحتراق لإزالة ما يعلوها.","- تُنتج بعض التفاعلات ضوءاً ووميضاً، وهو ما يحدث في الألعاب النارية المستخدمة في الأفراح والمناسبات.","# خلاصة: علامات حدوث التفاعل","- ارتفاع درجة الحرارة أو انخفاضها — تصاعد غاز — تغيّر اللون — تكوّن راسب — انبعاث ضوء ووميض.","! لا يُعدّ تغيّر لون الحليب مع اليود دليلاً على تفاعل؛ فعدم تغيّر اللون يدلّ على عدم وجود تفاعل كيميائي."],"q":["- ما المقصود بالتفاعل الكيميائي؟ وكيف يُعبَّر عنه؟","- اذكر أربعاً من دلالات حدوث التفاعل الكيميائي مع مثال على كلٍّ منها.","- اكتب الخطوات الأربع لموازنة المعادلة الكيميائية.","- اكتب معادلة تفاعل المغنيسيوم مع الأكسجين وأوزنها.","- ما دلالة حدوث التفاعل في كلٍّ من: HgO ← Hg + O₂ ، Zn + HCl ← ZnCl₂ + H₂ ، AgNO₃ + NaCl ← AgCl + NaNO₃؟"],"quiz":[{"l":0,"k":"n","q":"التغيّر الذي ينتج مواد جديدة بصفات جديدة يُسمّى:","o":["تبخّراً","ذوباناً","تغيّراً فيزيائياً","تفاعلاً كيميائياً"],"a":3},{"l":0,"k":"n","q":"ماذا يعني الرمز (aq) بجانب المادة في المعادلة الكيميائية؟","o":["غاز","محلول مائي","سائل","صلب"],"a":1},{"l":0,"k":"n","q":"ماذا يعني الرمز (g)؟","o":["غاز","صلب","محلول مائي","سائل"],"a":0},{"l":0,"k":"n","q":"ما الغاز الذي ينتج من تفاعل الخارصين مع حمض الهيدروكلوريك؟","o":["ثاني أكسيد الكربون","الأكسجين","الهيدروجين","النيتروجين"],"a":2},{"l":0,"k":"n","q":"أيّ مما يأتي دلالة على حدوث تفاعل كيميائي؟","o":["تكوّن راسب","قصّ قطعة ورق","تغيّر شكل المادة فقط","تبريد الماء دون تغيّر مكوّناته"],"a":0},{"l":0,"k":"n","q":"عند موازنة المعادلة نجعل عدد ذرّات كلّ عنصر:","o":["أكبر في طرف النواتج","متساوياً في الطرفين","أكبر في طرف المتفاعلات","واحداً فقط"],"a":1},{"l":0,"k":"n","q":"عند إضافة محلول اليود إلى الخبز يتغيّر لونه إلى:","o":["الأحمر","الأصفر","البنفسجي الغامق المائل إلى الأس
