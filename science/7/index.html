<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>العلوم العامة — الصف السابع</title>
<meta name="theme-color" content="#0a5230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../shared/icons/portal-192.png">
<link rel="apple-touch-icon" href="../../shared/icons/portal-180.png">
<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--hd:#0a5230;--hd2:#073d22;--bg:#FAF6EB;--card:#fff;--ink:#0a5230;--mut:#4b7a5f;--g:#00a152;--y:#ffc107;--bd:#e9dfc8;--ok:#1f9d55;--bad:#d63c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:min(760px,100%);margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
/* الرأس */
.hdr{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 40px;position:relative}
.hdr .row1{display:flex;align-items:center;gap:12px}
.av{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--y);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--g);font-weight:700;font-size:1.4rem}
.av img{width:100%;height:100%;object-fit:cover}
.hi{flex:1;min-width:0}.hi b{display:block;font-size:1.2rem;line-height:1.3}
.pts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#f3dc92;font-size:.9rem;margin-top:0}
.pts .dr-chip{padding:0 9px !important;font-size:.78rem !important}
.portal{display:flex;align-items:center;gap:6px;color:var(--y);text-decoration:none;font-weight:700;font-size:.9rem;flex:none}
.portal svg{width:24px;height:24px}
.sheet{background:var(--bg);margin-top:-26px;border-radius:26px 26px 0 0;padding:12px 16px 0;position:relative}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--bd);border-radius:999px;padding:6px 14px;margin-bottom:6px}
.search input{border:0;outline:0;background:transparent;flex:1;font:inherit;color:var(--ink);min-width:0}
.search svg{width:20px;height:20px;color:var(--mut);flex:none}
.sec{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:700;margin:4px 0 8px}
.sec i{font-style:normal;color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;grid-auto-rows:clamp(92px,calc((100svh - 300px) / 4),132px)}
.uc{border:0;border-radius:18px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;box-shadow:0 5px 0 var(--s,#007a3d);color:#fff;text-align:center;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.uc svg{width:clamp(36px,6.5svh,52px);height:clamp(36px,6.5svh,52px);flex:none;background:#fff;border-radius:50%;padding:5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.uc b{font-size:.92rem;line-height:1.25}
.uc small{font-size:.74rem;opacity:.95;font-weight:600}
.uc .dn{position:absolute;top:6px;inset-inline-start:6px;background:#fff;border-radius:99px;font-size:.68rem;padding:0 7px;font-weight:700;color:var(--g)}
#drToast{top:0 !important;bottom:auto !important;border-radius:0 0 14px 14px !important;font-size:.72rem !important;padding:3px 14px !important;opacity:.92}
.card>svg{width:60px;height:60px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:right}
.cont .t{flex:1;min-width:0}.cont .t b{display:block;font-size:1.1rem}.cont .t small{color:var(--mut)}
.bar{height:10px;background:#ece6d4;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--y);border-radius:99px}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:var(--ink);background:conic-gradient(var(--y) calc(var(--p)*1%),#ece6d4 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.85rem}
.daily{background:linear-gradient(135deg,#f6e3a1,#ffc107);border:2px solid #cfa23a;border-radius:26px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.daily .tr{font-size:3rem;line-height:1}
.daily b{font-size:1.3rem;display:block}.daily small{display:block;margin:2px 0 10px;color:#4a3a10}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--hd);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700}
.cta.alt{background:var(--g)}
/* التنقّل */
.nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);border-radius:26px 26px 0 0;display:grid;grid-template-columns:repeat(var(--n,5),1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(17,61,46,.08);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8a8a8a;text-decoration:none;font-size:.82rem;font-weight:700;padding:4px 0}
.nav a svg{width:28px;height:28px}
.nav a.on{color:#b8902f}
/* شاشات داخلية */
.top{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.4}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:1.3rem}
.body{padding:16px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;width:100%;text-align:right;text-decoration:none;color:inherit}
.row .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:700;background:#fbf0c8;border:1px solid var(--y)}
.row .ic svg{width:34px;height:34px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx small{color:var(--mut)}
.row .go{color:var(--mut);font-size:1.3rem}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:#e0d9c4}.dots i.on{background:var(--ok)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;border:1.5px solid #7fe0a2;background:#fff;color:var(--g);border-radius:999px;padding:6px 16px;font-weight:700}
.tb.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 0 var(--y)}
.lc h3{margin:14px 0 6px;font-size:1.1rem;color:var(--g)}
.lc p{margin:8px 0}.lc ul{margin:8px 0;padding-inline-start:20px}.lc li{margin:4px 0}
.note{background:#fdf0d8;border-inline-start:5px solid #f08a00;border-radius:12px;padding:8px 12px;margin:10px 0}
.exm{background:#e6f3ec;border-inline-start:5px solid var(--g);border-radius:12px;padding:8px 12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--bd);padding:6px 8px;text-align:center}.tbl th{background:#d7e8dc}
.lv{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px;margin-bottom:10px;border:2px solid;background:#fff;width:100%;text-align:right}
.lv i{font-style:normal;font-size:1.8rem}.lv b{display:block}.lv small{color:var(--mut)}
.lv .st{margin-inline-start:auto;font-weight:700}
/* الاختبار */
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y)}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 14px;line-height:1.7}
.kk{display:inline-block;font-size:.75rem;background:#e6f3ec;color:var(--g);border-radius:99px;padding:0 10px;margin-bottom:6px}
.op{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:1.02rem}
.op.ok{border-color:var(--ok);background:#e5f6ec}.op.bad{border-color:var(--bad);background:#fde9e9}
.hint{background:#fff6dc;border:1px solid var(--y);border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.res{text-align:center;padding:24px 8px}.res .big{font-size:3.4rem}.res h2{margin:6px 0}
.stars{font-size:2.2rem;letter-spacing:4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat div{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;color:var(--g)}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bd div{background:#fff;border:1px solid var(--y);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem;line-height:1.4}.bd i{display:block;font-style:normal;font-size:1.8rem}
.wis{text-align:center}.wis small{color:var(--mut)}
.btn{display:block;width:100%;text-align:center;border:0;background:linear-gradient(135deg,#00c853,var(--g));color:#fff;border-radius:14px;padding:12px;font-weight:700;margin-top:10px;text-decoration:none}
.btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.empty{color:var(--mut);text-align:center;padding:20px}
@media (min-width:640px){.grid,.mg{grid-template-columns:repeat(3,1fr)}.nav{max-width:760px}.grid{grid-auto-rows:clamp(110px,18svh,150px)}}
@media (max-width:340px){.grid,.mg{grid-template-columns:1fr}.hi b{font-size:1rem}}
/* محاكاة جرّب بنفسك */
.wgv{display:grid;place-items:center;margin:4px 0}
.wgbig{text-align:center;font-size:1.45rem;font-weight:800;margin:8px 0;padding:8px;border-radius:16px;background:linear-gradient(135deg,#fff3c4,#ffe082);color:#4e2a00}
.wgbig span{display:inline-block;background:#ff6d00;color:#fff;border-radius:10px;padding:0 10px}.wgbig b{color:#d50000}.wgbig small{display:block;font-size:.85rem;color:#6d4c00;font-weight:600}
.wgc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.wgc span{font-weight:700;min-width:100%}
.wgc button{flex:1;min-width:58px;border:0;border-radius:14px;padding:10px 4px;font:800 1.05rem inherit;background:#fff;color:var(--c);box-shadow:inset 0 0 0 3px var(--c);cursor:pointer;transition:.15s}.wgc button.on{background:var(--c);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.wgs{margin:8px 0}.wgs label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}.wgs input{width:100%;height:30px}
.wgm{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7c4dff,#e040fb);color:#fff;border-radius:16px;padding:10px 12px;margin:10px 0;font-weight:700}
.wgn{display:block;width:100%;border:0;border-radius:14px;padding:11px;margin-top:8px;font:800 1rem inherit;color:#fff;background:linear-gradient(135deg,#ff6d00,#ffab00);box-shadow:0 4px 0 #c43e00;cursor:pointer}.wgn.g{background:linear-gradient(135deg,#00c853,#64dd17);box-shadow:0 4px 0 #008a39}
.wgrow{display:flex;gap:8px}.wgrow .wgn{flex:1}
.wgok{background:#00c853;color:#fff;border-radius:14px;padding:8px;text-align:center;font-weight:800;margin-top:8px;animation:wgpop .4s}
.wgb{text-align:center;font-size:2.2rem;animation:wgpop .5s}
@keyframes wgpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.wgst{position:relative;height:90px;border-radius:16px;overflow:hidden;background:linear-gradient(#80d8ff,#e1f5fe 60%,#a5d6a7 60%)}.wgball{position:absolute;bottom:8px;left:0;line-height:1;transition:font-size .2s}
@keyframes wgrun{from{left:-40px}to{left:100%}}
.wgsvg{width:100%;height:auto}
.wgbars{display:flex;gap:10px;height:92px;align-items:flex-end;justify-content:center;margin:6px 0}.wgbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:56px}.wgbars i{display:block;width:100%;border-radius:8px 8px 0 0;min-height:2px;transition:height .15s}.wgbars span{font-weight:800}
.wgat{display:flex;gap:8px;align-items:center}.wgai{flex:1;font-size:.92rem;line-height:1.7}.wgtag{color:#fff;border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:700}
.wgel{margin-top:6px}.wgrow2{display:flex;gap:3px;align-items:center;margin:4px 0;flex-wrap:wrap}.wgrow2>small{width:100%;color:#6a5a2a;font-weight:700}
.wgrow2 button{width:38px;height:44px;border:0;border-radius:10px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgrow2 button small{font-size:.6rem;opacity:.85}.wgrow2 button b{font-size:.95rem}.wgrow2 button.on{transform:translateY(-3px) scale(1.12);outline:3px solid #fff;box-shadow:0 0 0 3px #111}
.wgcv{width:100%;height:auto;border-radius:16px;display:block}
.wgsnd{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}.wgsnd>b{width:100%}.wgsnd button{flex:1;border:0;border-radius:12px;padding:8px 2px;background:var(--c);color:#fff;font:800 .95rem inherit;display:flex;flex-direction:column;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgsnd small{font-weight:500;opacity:.9}.wgsr{width:100%;background:#e3f2fd;border-radius:12px;padding:8px;font-weight:700}
.wgcard{text-align:center;background:linear-gradient(135deg,#fff3c4,#ffe0b2);border-radius:20px;padding:14px;margin-bottom:10px}.wgem{font-size:4rem;line-height:1.2}.wgcard b{font-size:1.2rem;display:block}.wgcard small{color:#6d4c00}
.wgks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wgks button{border:0;border-radius:14px;padding:12px 4px;color:#fff;font:800 1rem inherit;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.22);cursor:pointer}.wgks button:last-child{grid-column:1/-1}.wgks button.ok{outline:4px solid #fff;box-shadow:0 0 0 4px #00c853}.wgks button.no{animation:wgshake .4s}.wgks button[disabled]{opacity:.55}
@keyframes wgshake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.wgarrow{position:absolute;left:8px;bottom:60px;height:8px;background:#ff1744;border-radius:4px}.wgarrow::after{content:"▶";position:absolute;right:-12px;top:-7px;color:#ff1744}
.wgtank{position:relative;height:130px;border-radius:16px;background:linear-gradient(#e1f5fe 0 38%,#4fc3f7 38%,#0288d1);overflow:hidden;margin-bottom:8px}.wgtank.tall{height:190px}
.wgcube{position:absolute;left:calc(50% - 22px);line-height:1;transition:bottom .4s,font-size .2s}.wgdiver{position:absolute;left:calc(50% - 16px);font-size:2rem;transition:top .3s}
.wgglass{width:120px;height:130px;margin:6px auto;border:5px solid #90a4ae;border-top:0;border-radius:0 0 22px 22px;position:relative;overflow:hidden;background:#f5fbff}.wgglass i{position:absolute;bottom:0;left:0;right:0;transition:.3s}
.wgrods{display:flex;flex-direction:column;gap:8px}.wgrod{display:grid;grid-template-columns:78px 1fr 88px;gap:8px;align-items:center;font-weight:700}.wgrod div{height:16px;background:#e3e8ee;border-radius:99px;overflow:hidden}.wgrod i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd54f,var(--c));border-radius:99px}.wgrod small{font-weight:500;color:#6a5a2a}
.wgmsg{text-align:center;font-weight:800;margin-top:10px;min-height:1.6em}.wgfin{text-align:center;padding:10px}.wgfin b{font-size:1.6rem}

/* عناصر تفاعلية */
.ipb{height:7px;background:#ece6d4;border-radius:99px;overflow:hidden;margin:6px 0 2px}.ipb i{display:block;height:100%;width:0;background:var(--y);transition:width .35s}
.ipt{display:block;color:var(--mut);font-size:.8rem;margin-bottom:6px}
.pt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:right;background:#f4f8ee;border:2px solid #d7e6c4;border-radius:14px;padding:9px 12px;margin:6px 0;font-size:1rem;line-height:1.6}
.pt::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid #9bbf86;flex:none;margin-top:2px;transition:.2s;display:grid;place-items:center;color:#fff;font-size:.8rem}
.pt.done{background:#e5f6ec;border-color:var(--ok)}.pt.done::before{content:"✓";background:var(--ok);border-color:var(--ok)}
.cl{display:inline-block;min-width:52px;border:0;border-radius:8px;background:var(--y);color:#3b2a08;padding:0 8px;font:inherit;font-weight:700;letter-spacing:2px;animation:pulse 1.6s infinite}
.cl.rv{background:#d8f0e0;color:var(--g);letter-spacing:0;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,185,77,.35)}}
.ip{margin:10px 0}
.nt,.ex2{display:block;width:100%;text-align:right;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:1rem;line-height:1.6;border:2px dashed}
.nt{background:#fdf0d8;border-color:#f08a00}.ex2{background:#e6f3ec;border-color:var(--g)}
.nt .bd2,.ex2 .bd2{display:none}.nt.done .bd2,.ex2.done .bd2{display:block;margin-top:4px;font-weight:700}.nt.done .hd2,.ex2.done .hd2{display:none}
.nt.done,.ex2.done{border-style:solid}
.tbw{overflow-x:auto;margin:10px 0}.tbw .tbl{margin:0}.tbl td.mk{background:#e9efe0;color:transparent;cursor:pointer;user-select:none}.tbl td.mk.rv{background:none;color:inherit}
.tbs{display:block;margin:6px auto 0;border:0;background:var(--y);color:#3b2a08;border-radius:99px;padding:4px 16px;font-weight:700;font-size:.85rem}
/* الرياضيات */
.t-math{--bg:#f6f0dd;--ink:#17402b;--mut:#5f7a63;--g:#1d5a3b;--bd:#e8e0c4}
.mh{display:flex;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top)) 18px 4px}
.mhi{flex:1}.mhi b{font-size:1.8rem;line-height:1.25;display:block}.mhi small{color:#6a8a5c;font-size:1rem}
.mportal{display:inline-block;margin-top:6px;background:#fffaf0;border:1.5px solid #cfe3b0;border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:700;color:#1d5a3b;text-decoration:none}
.mav{width:76px;height:76px;background:#1d4d35;color:#fff;border:6px solid #cfe3b0;font-size:2rem}
.pc{margin:14px 16px;background:linear-gradient(135deg,#00a152,#00e676);color:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 0 #007a3d}
.pct{display:flex;justify-content:space-between;align-items:center}.pct b{font-size:1.35rem}
.chp{background:#fff;color:#00a152;border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem}
.pcr{display:flex;justify-content:space-between;margin:10px 0 6px;font-size:.95rem}
.bar.big{height:14px;background:#d5dcc0}.bar.big i{background:#1d5a3b}
.pcs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}.chp2{background:#fff;color:#0a5230;border-radius:99px;padding:3px 14px;font-weight:700;font-size:.92rem}.chp2.g{background:#ffc107;color:#3b2a00}
.sec2{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 8px;font-size:1.3rem}.sec2 a{font-size:.95rem;color:#3d7a4f;text-decoration:none;font-weight:400}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 10px}
.mu{border:0;border-radius:22px;padding:14px 8px;text-align:center;text-decoration:none;color:#fff;box-shadow:0 6px 0 var(--s,#007a3d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:124px;position:relative;font:inherit;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.mu.w{grid-column:1/-1}
.mu svg{width:46px;height:46px;filter:brightness(0) invert(1)}.mu b{font-size:1.1rem}.mu small{font-size:.85rem;opacity:.95;font-weight:600}
.mu .dn{position:absolute;top:8px;inset-inline-start:8px;background:#1d5a3b;color:#fff;border-radius:99px;font-size:.7rem;padding:0 8px}
.t-math .nav{background:#fffaf0}.t-math .nav a.on{color:#1d4d35}
/* الآلة الحاسبة */
#calc{position:fixed;inset:0;background:rgba(17,40,28,.55);z-index:50;display:grid;place-items:end center}
.cbox{width:100%;max-width:520px;background:#fffaf0;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:slin .25s ease both}
.cd{background:#e9f0d5;border-radius:16px;padding:10px 14px;text-align:left;direction:ltr;min-height:76px}.cd small{display:block;color:var(--mut);min-height:22px;word-break:break-all}.cd b{font-size:2rem;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;direction:ltr}
.ck button{border:0;border-radius:14px;padding:13px 0;font-size:1.25rem;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 2px 0 #e0d8bc}.ck button.o{background:#cfe3b0}.ck button.eq{background:#1d5a3b;color:#fff;grid-column:span 2}.ck button.cx{background:#f6d8d0}
.cclose{display:block;margin:10px auto 0;border:0;background:none;color:var(--mut);font-weight:700}
/* درس البطاقات التفاعلية */
.dots2{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}.dots2 button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:#d9d2bd;transition:.2s}.dots2 button.on{width:26px;border-radius:99px;background:var(--y)}.dots2 button.dn{background:var(--ok)}
.deck{position:relative;overflow:hidden;touch-action:pan-y}
.dc{background:#fff;border:1px solid var(--bd);border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(17,61,46,.06);animation:slin .32s ease both}
.dc.rev{animation-name:slinr}
@keyframes slin{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes slinr{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.dc h3{margin:0 0 8px;font-size:1.15rem;color:var(--g);display:flex;align-items:center;gap:8px}.dc h3 em{font-style:normal;background:var(--y);color:#3b2a08;border-radius:99px;font-size:.75rem;padding:0 9px}
.dc h3 svg{width:34px;height:34px;flex:none}
.dc p{margin:8px 0}.dc ul{margin:8px 0;padding-inline-start:20px}.dc li{margin:4px 0}
.fcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fc{display:grid;perspective:700px;border:0;background:none;padding:0;text-align:center}.fc.wide{grid-column:1/-1}
.fc>span{grid-area:1/1;backface-visibility:hidden;transition:transform .45s;border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:78px}
.ff{background:linear-gradient(135deg,#00c853,#00a152);color:#fff}.ff b{font-size:1rem}.ff small{opacity:.8;font-size:.72rem}
.fb{background:#fff7da;border:1.5px solid var(--y);transform:rotateY(180deg);font-size:.88rem;line-height:1.55;color:var(--ink)}
.fc.on .ff{transform:rotateY(180deg)}.fc.on .fb{transform:rotateY(360deg)}
.chk{background:#eef7f1;border:1.5px dashed #7fb897;border-radius:18px;padding:12px;margin-top:14px}
.ck-h{font-weight:700;color:var(--g);margin-bottom:4px}.ck-q{font-weight:700;margin-bottom:8px}
.ck-o{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:.95rem}
.ck-o.ok{border-color:var(--ok);background:#e5f6ec}.ck-o.bad{border-color:var(--bad);background:#fde9e9}
.ck-f{font-size:.9rem;margin-top:4px}
.dnav{display:flex;gap:10px;margin-top:12px}.dnav button{flex:1;border:0;border-radius:14px;padding:11px;font-weight:700;background:#fff;border:1.5px solid var(--g);color:var(--g)}.dnav button.pri{background:var(--g);color:#fff}.dnav button[disabled]{opacity:.35}
.rq{display:flex;gap:10px;align-items:flex-start;background:#f7f2e1;border-radius:14px;padding:10px 12px;margin:8px 0;width:100%;text-align:right;border:0}.rq i{font-style:normal;width:24px;height:24px;border-radius:50%;border:2px solid var(--g);display:grid;place-items:center;flex:none;color:#fff;font-size:.85rem}.rq.on i{background:var(--ok);border-color:var(--ok)}.rq.on{opacity:.7}

<script>
window.SCI={"cfg":{"widgets":true,"name":"العلوم العامة","hello":"أهلاً يا بطل العلوم!","unitsTitle":"وحدات العلوم","unitsHint":"خمس وحدات من رزمة العلوم والحياة: الكائنات الحية، والذرة والتفاعلات، والحركة وقوانين نيوتن، والكثافة والضغط والمحاليل، وأجهزة الجسم والحرارة. اضغط وحدة لترى دروسها.","theme":"sci","key":"sci7:st","wid":"science","kxid":"science7","student":"طالب العلوم","packT":"رزمة العلوم والحياة","dir":"science/7","gradeName":"الصف السابع","gradeFor":"للصف السابع"},"units":[{"title":"الكائنات الحية وعملياتها الحيوية","ic":"plant","color":"#cfe2b0","uq":[[0,"ما العملية التي تصنع بها النباتات غذاءها مستغلّةً ضوء الشمس؟",["التخمّر","البناء الضوئي","الترمّم","الانشطار"],1],[0,"الحيوان الذي يتغذّى على النباتات والحيوانات معاً يسمّى:",["آكل نبات","آكل لحوم","قارت","مترمّم"],2],[0,"ما اسم مجموعة تفاعلات البناء والهدم التي تحدث في أجسام الكائنات الحيّة؟",["النموّ","الإخراج","الاستجابة","الأيض"],3],[0,"ما الهدف من عملية التنفس؟",["إنتاج الطاقة","إنتاج الغلوكوز","استهلاك ثاني أكسيد الكربون","إخراج الماء فقط"],0],[1,"المرحلة العمرية للإنسان من ١٢ إلى ٢٠ سنة تقريباً وفيها نموّ سريع تسمّى:",["الطفولة","المراهقة","الرشد","الشيخوخة"],1],[1,"الأميبا تتحرّك بوساطة:",["أهداب","أسواط","أقدام كاذبة","ثغور"],2],[1,"فتح الثغور وإغلاقها في النباتات حركة:",["انتقالية","أميبية","سيتوبلازمية","موضعية"],3],[1,"لماذا تحتاج الكائنات الحيّة إلى الإخراج؟",["لأنّ تراكم الفضلات يسبّب أضراراً وتسمّماً","لأنّ الفضلات مصدر الطاقة","لأنّ الإخراج يزيد النموّ","لأنّ الفضلات غذاء"],0],[1,"لماذا تكون استجابة النباتات بطيئة غالباً؟",["لأنها تمتلك جهازاً عصبياً","لأنها لا تمتلك خلايا أو أجهزة متخصّصة للاستجابة","لأنها لا تتأثّر بالضوء","لأنها تتحرّك انتقالياً"],1],[2,"ما أصل الطاقة التي تحرّك يدك؟",["الأكسجين وحده","الماء وحده","ضوء الشمس الذي خزّنه النبات في الغذاء بالبناء الضوئي","لا أصل لها"],2],[2,"خميرة في بيئة خالية من الأكسجين ووجود سكر. كيف تحصل على الطاقة؟",["بالتنفس الهوائي","بالبناء الضوئي","بالانشطار","بالتخمّر"],3],[2,"أيّ الكائنات يتكاثر جنسياً؟",["الحمام","الأميبا","الخميرة","نجم البحر"],0]],"lessons":[{"t":"التغذية","e":["# تمهيد: من أين يأتي الغذاء؟","تحصل الكائنات الحيّة على حاجتها من الغذاء الضروري لعملياتها الحيوية بإحدى طريقتين: إمّا بتحويل المواد الأوليّة البسيطة إلى غذاء، وإمّا بالحصول عليه جاهزاً من كائنات حيّة أخرى.","- ذاتيّة التغذية: كائنات تصنع غذاءها بنفسها، فتحوّل الماء وثاني أكسيد الكربون إلى كربوهيدرات باستغلال ضوء الشمس في عملية البناء الضوئي. ومنها النباتات والطحالب وبعض أنواع البكتيريا (وتسمّى منتجات الغذاء).","- غير ذاتيّة التغذية: كائنات لا تصنع غذاءها، بل تحصل عليه جاهزاً من كائنات حيّة أخرى، كالفطريات والحيوانات والإنسان.","! تأمّل الشكل: نبتة تمتصّ الماء من التربة بجذورها، وتأخذ ثاني أكسيد الكربون من الهواء، وتستقبل ضوء الشمس بأوراقها وأزهارها، ثم تُطلق الأكسجين إلى الهواء.","# البناء الضوئي والنشا","|المواد الداخلة في البناء الضوئي|مصدرها|الناتج","|ثاني أكسيد الكربون|من الهواء|كربوهيدرات (سكر بسيط ثم نشا)","|الماء|يمتصّه الجذر من التربة|الأكسجين يُطلَق إلى الهواء","|ضوء الشمس|مصدر الطاقة|طاقة تُخزَّن في الغذاء","المعادلة اللفظية للبناء الضوئي: ثاني أكسيد الكربون + ماء ← (بوجود ضوء الشمس) ← كربوهيدرات + أكسجين.","يُعدّ النشا من السكريات معقّدة التركيب، ويتمّ بناؤه باتّحاد مئات من جزيئات سكر بسيط ناتجة من عملية البناء الضوئي. ويشكّل النشا مادة غذائية رئيسة للإنسان، ويعمل الجهاز الهضمي على تحويله إلى مواد بسيطة يُستفاد منها في العمليات الحيوية التي تحدث في الجسم.","? تمثيل البناء الضوئي بمعادلة لفظية بسيطة (سؤال الكتاب) || ثاني أكسيد الكربون + ماء ← (ضوء الشمس) ← كربوهيدرات (سكر) + أكسجين. المواد الداخلة: ثاني أكسيد الكربون والماء. الناتج: كربوهيدرات وأكسجين.","? إذا حرّكتَ يدك فإنك تستهلك طاقة من الشمس. فسّر ذلك (سؤال الكتاب) || الطاقة التي تحرّك يدك تأتي من غذاء تناولته؛ والغذاء أصله نباتات صنعته بالبناء الضوئي مستغلّةً ضوء الشمس، فانتقلت طاقة الشمس إلى الغذاء (مباشرة إن أكلنا النبات، أو عبر حيوان أكل النبات) ثم إلينا.","# نشاط (١): حيوانات تتغذّى","تمتاز البيئة الفلسطينية بتنوّع حيواناتها: منها النافع ومنها الضارّ. تُظهر الصورة حيوانات (ثعلب، سنجاب، طائر) وفي فقاعات الكلام ما تتغذّى عليه (حشرة، دودة...). يطلب النشاط:","- تسمية العلاقة الغذائية بين الحيوانات في الصورة.","- تحديد أيّ هذه الحيوانات مستفيد وأيّها متضرّر، وما نوع الضرر المتوقَّع.","- ذكر أمثلة أخرى لحيوانات من بيئتك مع طريقة تغذيتها.","- بيان احتياطات السلامة الواجب مراعاتها عند تربية الحيوانات.","تخزّن الكائنات الحيّة غير ذاتية التغذية (كالحيوانات والفطريات ومعظم أنواع البكتيريا) الغذاء على شكل مركّبات عضوية معقّدة حصلت عليها من النباتات مباشرة، أو من كائنات تتغذّى على النباتات، أو من كليهما.","# أنواع التغذية غير ذاتية: أساسية وغير أساسية","- التغذية الأساسية: تغذّي الحيوان على النباتات أو على حيوانات أخرى. وتشمل: آكل النبات، وآكل اللحوم، والقارت.","- آكل النبات: حيوان يتغذّى على النباتات فقط، مثل الجرادة كما ورد في أسئلة الكتاب.","- آكل اللحوم: حيوان يتغذّى على لحوم الحيوانات الأخرى، مثل الأسد.","- القارت: حيوان يتغذّى على النباتات والحيوانات معاً.","- التغذية غير الأساسية: تشمل التطفّل (داخلي أو خارجي) والترمّم.","- التطفّل الداخلي: كائن يعيش داخل جسم كائن آخر ويتغذّى منه، مثل دودة الأسكارس.","- التطفّل الخارجي: كائن يعيش على سطح جسم كائن آخر ويتغذّى منه.","- الترمّم: التغذّي على بقايا المواد العضوية الميتة، وهو ما تقوم به الفطريات مثل الخميرة وعفن الخبز.","|نوع التغذية|مثال","|آكل نبات|الجرادة","|آكل لحوم|الأسد","|قارت|يأكل النبات والحيوان معاً","|تطفّل داخلي|دودة الأسكارس","|ترمّم|الخميرة وعفن الخبز","! جدول نشاط (٣): تغذية أساسية (آكل نبات، آكل لحوم، قارت)، وتغذية غير أساسية (تطفّل: داخلي وخارجي، وترمّم).","# نشاط (٢): عفن الخبز والترمّم","لاحظت ليلى أثناء تنظيف مطبخها تغيّراً في لون قطعة من الخبز ورائحتها، وهو ما يسمّى التعفّن. تُظهر الصور فطر عيش الغراب وعفناً على الفاكهة والخبز.","يُفرز فطر العفن إنزيمات هاضمة على المواد الغذائية فيحلّلها، ثم يمتصّ نواتج التحلل ليستخدمها في عملياته الحيوية. وهذا ما يفسّر تحلّل المواد العضوية والفضلات وجثث الكائنات الحيّة بعد موتها، وهي ما يُسمّى بالترمّم، وهو شكل من أشكال التغذية غير الأساسية.","? لماذا يتعفّن الخبز إذا تُرك مدّة طويلة؟ || لأن فطر العفن ينمو عليه ويُفرز إنزيمات هاضمة تحلّل مادة الخبز، ثم يمتصّ نواتج التحلل؛ فيتغيّر لون الخبز ورائحته. وهذا ترمّم.","? كيف تفسّر اختفاء جثث الكائنات الميتة والفضلات من البيئة مع الزمن؟ || تعمل الفطريات المترمّمة على تحليل المواد العضوية بإنزيماتها فتتحلّل الجثث والفضلات وتعود موادّها إلى البيئة.","# تطبيقات حياتيّة","- أنا وبيئتي: صنّف الحيوانات التي تراها في بيئتك في جدول من خانات: آكل نبات، آكل لحوم، قارت، تطفّل داخلي، تطفّل خارجي، ترمّم.","- أيّ طعام يُترك طويلاً قد تنمو عليه فطريات العفن وتحلّله، فنتخلّص منه ولا نأكله.","! اختبر نفسي: دودة الأسكارس تتغذّى بالتطفّل الداخلي، والخميرة كائن غير ذاتي التغذية يتغذّى غير أساسياً بالترمّم، والجرادة تتغذّى على النباتات فقط."],"q":["- ما الفرق بين الكائن ذاتي التغذية والكائن غير ذاتي التغذية؟ أعطِ مثالاً لكلّ منهما.","- ما الذي يميّز آكل النبات عن آكل اللحوم وعن القارت؟","- كيف تحصل الفطريات المترمّمة على غذائها من الخبز؟","- ما الفرق بين التطفّل الداخلي والتطفّل الخارجي؟","- يضع والد أحمد طحالب في حوض أسماك الزينة، ما الهدف من ذلك؟ (فكّر في ناتج البناء الضوئي)"],"quiz":[{"l":0,"k":"n","q":"ما العملية التي تصنع بها النباتات غذاءها مستغلّةً ضوء الشمس؟","o":["التنفس الخلوي","البناء الضوئي","الترمّم","التطفّل"],"a":1},{"l":0,"k":"n","q":"أيّ الكائنات الآتية ذاتي التغذية؟","o":["الأسد","الجرادة","النبات","الفطر"],"a":2},{"l":0,"k":"n","q":"ما الغاز الذي تطلقه النبتة إلى الهواء كما يظهر في الشكل؟","o":["ثاني أكسيد الكربون","النيتروجين","بخار الماء فقط","الأكسجين"],"a":3},{"l":0,"k":"n","q":"كيف تسمّى الكائنات التي تحصل على غذائها جاهزاً من كائنات حيّة أخرى؟","o":["غير ذاتية التغذية","ذاتية التغذية","منتجات الغذاء","كائنات لا تحتاج غذاء"],"a":0},{"l":0,"k":"n","q":"الحيوان الذي يتغذّى على النباتات فقط يسمّى:","o":["آكل لحوم","آكل نبات","قارت","مترمّماً"],"a":1},{"l":0,"k":"n","q":"ما اسم التغذية التي تعتمد على بقايا المواد العضوية الميتة؟","o":["التطفّل الداخلي","التطفّل الخارجي","الترمّم","البناء الضوئي"],"a":2},{"l":0,"k":"n","q":"ماذا يُعدّ النشا في تركيبه؟","o":["ماءً","غازاً","ملحاً معدنياً","سكرياً معقّد التركيب"],"a":3},{"l":0,"k":"n","q":"كائن يعيش داخل جسم كائن آخر ويتغذّى منه، تغذيته:","o":["تطفّل داخلي","تطفّل خارجي","ترمّم","بناء ضوئي"],"a":0},{"l":1,"k":"p","q":"أيّ المجموعات الآتية كلّها ذاتية التغذية؟","o":["الفطريات والحيوانات والإنسان","النباتات والطحالب وبعض البكتيريا","الإنسان والطحالب والجراد","الفطريات والبكتيريا والنبات"],"a":1},{"l":1,"k":"p","q":"أيّ المواد الآتية يمتصّها النبات من التربة بجذوره ليستعملها في البناء الضوئي؟","o":["ثاني أكسيد الكربون","الأكسجين","الماء","النشا"],"a":2},{"l":1,"k":"p","q":"أيّ المعادلات الآتية تمثّل البناء الضوئي؟","o":["كربوهيدرات + أكسجين ← ثاني أكسيد الكربون + ماء","كربوهيدرات + ماء ← ثاني أكسيد الكربون + أكسجين","أكسجين + ماء ← ثاني أكسيد الكربون + كربوهيدرات","ثاني أكسيد الكربون + ماء ← كربوهيدرات + أكسجين"],"a":3},{"l":1,"k":"p","q":"وُجد الخبز متغيّر اللون والرائحة بعد تركه أياماً. السبب هو:","o":["فطر عفن يفرز إنزيمات هاضمة ويمتصّ النواتج","بناء ضوئي يحدث في الخبز","تغذّي الخبز على ضوء الشمس","تطفّل داخلي"],"a":0},{"l":1,"k":"p","q":"أيّ الكائنات الآتية تتغذّى على النبات فقط؟","o":["القطة","الجرادة","الأسد","الدجاجة"],"a":1},{"l":1,"k":"p","q":"الخميرة كائن غير ذاتي التغذية، وتغذيته غير أساسية. نوع تغذيتها:","o":["آكل نبات","آكل لحوم","الترمّم","قارت"],"a":2},{"l":1,"k":"p","q":"كائن يعيش على سطح جسم كائن آخر ويتغذّى منه، يصنَّف ضمن:","o":["الترمّم","التغذية الأساسية","التغذية الذاتية","التطفّل الخارجي"],"a":3},{"l":1,"k":"p","q":"في جدول نشاط (٣) تتفرّع التغذية غير الأساسية إلى:","o":["تطفّل (داخلي وخارجي) وترمّم","آكل نبات وآكل لحوم وقارت","بناء ضوئي وتنفس","نشا وسكر"],"a":0},{"l":2,"k":"p","q":"تحرّك الطفل ذراعه فاستهلك طاقة. ما أصل هذه الطاقة؟","o":["طاقة صنعها الجسم من لا شيء","طاقة الشمس التي خُزّنت في الغذاء بالبناء الضوئي","ثاني أكسيد الكربون وحده","الماء وحده"],"a":1},{"l":2,"k":"p","q":"نبتة وُضعت في غرفة مظلمة تماماً لمدة طويلة. أيّ مادة لازمة للبناء الضوئي تنقصها؟","o":["ثاني أكسيد الكربون","الماء","ضوء الشمس","الأكسجين"],"a":2},{"l":2,"k":"p","q":"لماذا لا تستطيع الحيوانات صنع غذائها بالبناء الضوئي مثل النباتات؟","o":["لأنها لا تتنفّس","لأنها لا تحتاج إلى غذاء","لأنها تعيش في الظلام دائماً","لأنها غير ذاتية التغذية وتحصل على غذائها جاهزاً من كائنات أخرى"],"a":3},{"l":2,"k":"p","q":"حيوان يتغذّى على التوت والأسماك معاً. تغذيته من النوع:","o":["قارت","آكل نبات","آكل لحوم","ترمّم"],"a":0},{"l":2,"k":"p","q":"ما الدور المتوقَّع لوضع الطحالب في حوض سمك زجاجي؟","o":["تمتصّ الأكسجين كله","تصنع غذاءً وتُطلق أكسجيناً بالبناء الضوئي","تتطفّل على السمك","تسبّب تعفّن الماء بالترمّم"],"a":1},{"l":2,"k":"p","q":"لماذا يمكن القول إنّ النباتات أساس الغذاء لمعظم الكائنات؟","o":["لأنها لا تحتاج إلى الماء","لأنها لا تنتج أكسجيناً","لأنها تحوّل المواد البسيطة إلى غذاء، وتحصل منها الكائنات غير ذاتية التغذية على غذائها مباشرة أو بشكل غير مباشر","لأن الحيوانات تصنع غذاءها منها بالضوء"],"a":2},{"l":2,"k":"p","q":"ديدان تعيش داخل أمعاء كائن ما وتتغذّى منه. هذه الديدان:","o":["مترمّمة","آكلة نبات","ذاتية التغذية","متطفّلة تطفّلاً داخلياً"],"a":3},{"l":2,"k":"p","q":"اختفت جثّة حيوان ميّت في الحقل بعد أسابيع. العامل الأقرب تفسيراً لذلك:","o":["فطريات مترمّمة حلّلتها بإنزيماتها","بناء ضوئي في الجثة","تغذية أساسية لدى الجثة","تغذّي الجثة على ضوء الشمس"],"a":0}],"hints":{"ما العملية التي تصنع بها النباتات غذاءها مستغلّةً ضوء الشمس؟":"فكّر في العملية التي تحتاج ضوء الشمس والماء وثاني أكسيد الكربون.","وُجد الخبز متغيّر اللون والرائحة بعد تركه أياماً. السبب هو:":"من يفرز إنزيمات هاضمة على الخبز ثم يمتصّ نواتج التحلّل؟","تحرّك الطفل ذراعه فاستهلك طاقة. ما أصل هذه الطاقة؟":"أصل كلّ غذاء نباتٌ صنعته الشمس... تتبّع الطاقة من الشمس إلى الغذاء.","ديدان تعيش داخل أمعاء كائن ما وتتغذّى منه. هذه الديدان:":"من يعيش داخل جسم غيره ويتغذّى منه؟"}},{"t":"الأيض","e":["# تمهيد: ما الأيض؟","تحدث في أجسام الكائنات الحيّة مجموعة من التفاعلات الكيميائية الضرورية للتغذية والنموّ وإنتاج الطاقة. وقد أطلق العلماء على هذه التفاعلات بنوعيها (البناء والهدم) اسم الأيض.","- الأيض: مجموعة التفاعلات الكيميائية التي تحدث في أجسام الكائنات الحيّة، وهي لازمة للتغذية والنموّ وإنتاج الطاقة.","- عملية البناء: تفاعلات يتمّ فيها تحويل مواد بسيطة إلى مواد معقّدة، كما في عملية البناء الضوئي حيث يُحوَّل ثاني أكسيد الكربون والماء إلى كربوهيدرات.","- عملية الهدم: تفاعلات يتمّ فيها تحطيم المواد المعقّدة إلى مواد بسيطة.","|نوع التفاعل|ماذا يحدث؟|مثال","|بناء|مواد بسيطة ← مادة معقّدة|البناء الضوئي (ماء + ثاني أكسيد الكربون ← كربوهيدرات)","|هدم|مادة معقّدة ← مواد بسيطة|تحطيم المركّبات العضوية للحصول على الطاقة","! الأيض = البناء + الهدم معاً.","# من أين تأخذ الكائنات طاقتها؟","تستمدّ الكائنات الحيّة طاقتها من الطاقة المخزّنة في المركّبات العضوية، وذلك بتحطيم هذه المواد، بوجود الأكسجين أو عدمه، إلى مواد صغيرة. وتنتج طاقة تخزنها خلايا الجسم على شكل مركّبات كيميائية يُستفاد منها عند الحاجة.","ومن هذه العمليات التنفس الذي يُقسَم إلى نوعين: تنفس هوائي وتخمّر.","- التنفس الهوائي: تحطيم المواد العضوية بوجود الأكسجين لإنتاج الطاقة.","- التخمّر: تحطيم المواد العضوية في غياب الأكسجين لإنتاج الطاقة.","|وجه المقارنة|التنفس الهوائي|التخمّر","|الأكسجين|موجود|غائب","|الهدف|إنتاج الطاقة|إنتاج الطاقة","|مثال من الكتاب|الكائنات الحيّة عموماً (ناتجه ثاني أكسيد الكربون)|الخميرة","# نشاط (١): التنفس الهوائي (الخلوي)","يُعدّ غاز ثاني أكسيد الكربون من مكوّنات الغلاف الجوّي، ونسبة وجوده فيه (٠٫٠٤٪) تقريباً. وتُعدّ الكائنات الحيّة من المنتجات الرئيسة له من خلال عملية التنفس.","? ما نسبة ثاني أكسيد الكربون في الغلاف الجوّي؟ ومن أين يأتي جزء منه؟ || نسبته تقريباً ٠٫٠٤٪ (أي أقلّ من نصف بالمئة)، وتُنتج الكائنات الحيّة جزءاً رئيساً منه من خلال عملية التنفس.","? أيّ الآتي من نواتج التنفس الهوائي: ثاني أكسيد الكربون، الأكسجين، الغلوكوز، الكحول؟ (سؤال الكتاب) || ثاني أكسيد الكربون؛ فالأكسجين يُستهلك في التنفس الهوائي، أمّا الهدف من التنفس فهو إنتاج الطاقة.","# نشاط (٢): التخمّر في خلايا الخميرة","قالت سهى لمعلّمتها إنّ والدتها تضع قليلاً من السكر خلال تصنيعها لمخلّل الخيار.","تُعدّ الخميرة من الفطريات الرمّية، ويمكنها العيش في بيئة خالية من الأكسجين، فهي تستمدّ الطاقة اللازمة لعملياتها الحيوية من تخمّر المواد العضوية.","- الخميرة فطر رمّي: تتغذّى بالترمّم على مواد عضوية.","- تعيش الخميرة بلا أكسجين، فطاقتها من التخمّر لا من التنفس الهوائي.","? لماذا تستطيع الخميرة العيش في بيئة خالية من الأكسجين؟ || لأنها تحصل على الطاقة بالتخمّر، أي بتحطيم المواد العضوية دون حاجة إلى الأكسجين.","# تطبيقات حياتيّة","- الأيض يحدث في كلّ لحظة في أجسامنا: نبني مواد معقّدة وننمو، ونهدم مواد لنحصل على الطاقة.","- نفس الإنسان يُخرج ثاني أكسيد الكربون من الرئتين لأنه ناتج التنفس.","! اختبر نفسي: الهدف من عملية التنفس هو إنتاج الطاقة، وناتج التنفس الهوائي غاز ثاني أكسيد الكربون."],"q":["- اشرح بكلماتك الفرق بين عملية البناء وعملية الهدم مع مثال.","- ما الفرق بين التنفس الهوائي والتخمّر؟","- لماذا تحتاج الكائنات الحيّة إلى عملية الهدم؟","- ما نسبة ثاني أكسيد الكربون في الهواء، وما دور الكائنات الحيّة فيها؟","- لماذا تعيش الخميرة في بيئة خالية من الأكسجين؟"],"quiz":[{"l":0,"k":"n","q":"ما اسم مجموعة التفاعلات الكيميائية التي تحدث في أجسام الكائنات الحيّة؟","o":["النمو","الأيض","الاستجابة","التكاثر"],"a":1},{"l":0,"k":"n","q":"تحويل مواد بسيطة إلى مواد معقّدة يسمّى عملية:","o":["الهدم","الإخراج","البناء","الحركة"],"a":2},{"l":0,"k":"n","q":"تحطيم المواد المعقّدة إلى مواد بسيطة يسمّى عملية:","o":["البناء","البناء الضوئي","الاستجابة","الهدم"],"a":3},{"l":0,"k":"n","q":"أيّ العمليات الآتية مثال على البناء؟","o":["البناء الضوئي","التخمّر","التنفس الهوائي","الإخراج"],"a":0},{"l":0,"k":"n","q":"ما الهدف من عملية التنفس؟","o":["استهلاك الطاقة","إنتاج الطاقة","إنتاج الغلوكوز","استهلاك ثاني أكسيد الكربون"],"a":1},{"l":0,"k":"n","q":"أيّ الغازات من نواتج التنفس الهوائي؟","o":["الأكسجين","النيتروجين","ثاني أكسيد الكربون","الهيدروجين"],"a":2},{"l":0,"k":"n","q":"يُقسَم التنفس إلى:","o":["بناء وهدم","داخلي وخارجي","أساسي وغير أساسي","هوائي وتخمّر"],"a":3},{"l":0,"k":"n","q":"ما نسبة ثاني أكسيد الكربون التقريبية في الغلاف الجوّي؟","o":["٠٫٠٤٪","٤٠٪","٤٪","٢٠٪"],"a":0},{"l":1,"k":"p","q":"أيّ التفاعلين يصنَّف هدماً؟","o":["تحويل الماء وثاني أكسيد الكربون إلى كربوهيدرات","تحطيم مادة معقّدة إلى مواد بسيطة","بناء النشا من جزيئات السكر","تكوين مادة معقّدة من مواد بسيطة"],"a":1},{"l":1,"k":"p","q":"الأيض يتضمّن:","o":["البناء فقط","الهدم فقط","البناء والهدم معاً","النمو فقط"],"a":2},{"l":1,"k":"p","q":"أين تُخزَّن الطاقة الناتجة عن تحطيم المواد العضوية؟","o":["في الغلاف الجوّي لهواء","أنه غاز موجود بكمية صغيرة جداً مقارنة بغيره","أنه لا ينتجه أيّ كائن"],"a":2},{"l":2,"k":"p","q":"عند تحطيم جزيء معقّد من الغذاء داخل الخلية نحصل على:","o":["مواد أكبر منه فقط","ضوء الشمس","لا شيء","مواد صغيرة وطاقة تُخزَّن كمركّبات كيميائية"],"a":3},{"l":2,"k":"p","q":"أيّ الكائنين يقوم ببناء مواد معقّدة من مواد بسيطة بالضوء؟","o":["النبات الأخضر","الخميرة","عيش الغراب","الإنسان"],"a":0}],"hints":{"تحويل مواد بسيطة إلى مواد معقّدة يسمّى عملية:":"البناء يكوّن مادة أكبر وأعقد من مواد أصغر.","أيّ الكائنات الآتية يحصل على طاقته بالتخمّر؟":"من الكائنات من يعيش دون أكسجين، فكيف يحصل على الطاقة؟","نبتة بنت نشا من ماء وثاني أكسيد الكربون، ثم حطّمت جزءاً منه لتأخذ الطاقة. العمليتان على الترتيب:":"البناء ثم الهدم: أيّ عملية تكوّن وأيّ عملية تحطّم؟","بيئة بلا أكسجين وفيها خميرة وسكر. أيّ الاستنتاجات صحيح؟":"لا أكسجين: أيّ نوع من التنفس يبقى ممكناً؟"}},{"t":"النمو","e":["# تمهيد: ما النموّ؟","- النموّ: زيادة في كتلة جسم الكائن الحيّ وحجمه نتيجة لزيادة كمية المادة الحيّة فيه.","- الانقسام الخلوي: عملية تمرّ فيها الخليّة بمجموعة من التغيّرات تؤدّي إلى إنتاج خليّتين.","- الخليّة الأمّ: الخليّة التي تنقسم، وتنتج منها خليّتان تسمّيان الخلايا الناتجة.","يحدث الانقسام في معظم خلايا جسم الحيوان خلال فترة نموّه. يوضّح الشكل خليّةً أمّاً في الأعلى يخرج منها سهمان إلى خليّتين ناتجتين في الأسفل.","# النموّ في النبات","في النباتات توجد خلايا في القمم النامية في كلّ من الجذر والساق تُدعى الخلايا المولِّدة، وهي متخصّصة بعملية الانقسام لنموّ النبتة.","|وجه المقارنة|الحيوان|النبات","|مكان الانقسام|معظم خلايا الجسم خلال فترة النموّ|القمم النامية في الجذر والساق","|الخلايا المسؤولة|معظم الخلايا|الخلايا المولِّدة","|ناتج الانقسام|خليّتان ناتجتان من خليّة أمّ|خليّتان ناتجتان من خليّة أمّ","! خلاصة: النموّ = انقسام خلايا + زيادة كمية المادة الحيّة، فتزداد الكتلة والحجم.","# نشاط (١): جسمي يتغيّر","يُظهر الشكل مجموعات من الأشخاص (أولاد وبنات ثم شباب) مرتّبة على محور أفقي للعمر: ٦ سنوات، ٩ سنوات، ١٢ سنة، ١٥ سنة، ٢١ سنة، وعلى المحور العمودي الطول بين ١ م و٢ م تقريباً. كلّما اتّجهنا نحو الأعمار الأكبر زاد طول الأشخاص.","|العمر|ما نلاحظه","|٦ سنوات|الأطوال الأقصر في الشكل","|٩ سنوات|ازدياد الطول","|١٢ سنة|بداية مرحلة المراهقة","|١٥ سنة|نموّ سريع وتغيّرات جسمية","|٢١ سنة|الأطوال الأكبر (مرحلة الرشد)","أسئلة النشاط: ما التغيّرات الجسمية الظاهرة على كلّ من الفتاة والشاب؟ وما الصفات الجنسية الثانوية المميّزة لكلّ منهما؟ وفي أيّ الجنسين تبدأ الصفات الجنسية الثانوية بالظهور قبل الجنس الآخر؟ وما قواعد النظافة الواجب اتّباعها في مرحلة المراهقة؟","# مرحلة المراهقة","تُعدّ المراهقة إحدى مراحل النموّ التي تقع بين مرحلتي الطفولة والرشد، وتشمل السنوات التي تمتدّ من ١٢ سنة إلى سنّ ٢٠ تقريباً. ويكون النموّ في هذه المرحلة سريعاً.","- تحدث التغيّرات الجسمية في مظاهر النموّ المختلفة بسرعة.","- من أهمّ التغيّرات الجسمية: ازدياد الطول والوزن.","- ظهور الصفات الجنسية الثانوية الخاصّة بكلّ جنس.","- سبب ذلك: النشاط الهرموني الزائد في الجسم.","- أيضاً تحدث في المراهقة العديد من التغيّرات النفسية (كما في أسئلة اختبر نفسي).","|المرحلة|الفترة العمرية","|الطفولة|قبل المراهقة","|المراهقة|من ١٢ إلى ٢٠ سنة تقريباً","|الرشد|بعد المراهقة","? يبلغ طول ريم ١٥٠ سم في عمر ١٢ سنة وأصبح ١٦٠ سم في عمر ١٥ سنة. كم زاد طولها؟ وفي أيّ مرحلة نموّ هي؟ || الزيادة = ١٦٠ − ١٥٠ = ١٠ سم خلال ٣ سنوات. وعمر ١٢ إلى ١٥ سنة يقع ضمن مرحلة المراهقة (١٢–٢٠) حيث يكون النموّ سريعاً.","? لماذا يظهر التغيّر في الطول والوزن بسرعة خلال المراهقة؟ || لأنّ النموّ في هذه المرحلة سريع، ولأنّ النشاط الهرموني في الجسم يكون زائداً فتظهر التغيّرات الجسمية بسرعة، ومنها ازدياد الطول والوزن وظهور الصفات الجنسية الثانوية.","# تطبيقات حياتيّة","- قارن طولك بطول أخيك الأكبر أو الأصغر لتلاحظ أثر العمر في النموّ.","- في المراهقة تهتمّ بقواعد النظافة الشخصية لأنّ جسمك يمرّ بتغيّرات سريعة.","! اختبر نفسي: المرحلة العمرية للإنسان بين ١٢ و٢٠ سنة تسمّى المراهقة."],"q":["- عرّف النموّ، وبيّن كيف يرتبط بانقسام الخلايا.","- أين تنقسم الخلايا في النبات؟ وما اسم هذه الخلايا؟","- ما مرحلة المراهقة؟ وما أبرز ما يحدث فيها من تغيّرات؟","- لماذا تظهر الصفات الجنسية الثانوية في المراهقة؟","- اذكر قاعدتين من قواعد النظافة الواجب اتّباعها في مرحلة المراهق ّها باسم الأصل.","يظهر الشكل أنّ الطول يزداد بزيادة العمر. هذا يعني أنّ:":"انظر إلى محور العمر والطول في الشكل: ماذا يحدث للطول عند الانتقال من ٦ إلى ٢١ سنة؟","ازداد طول ولد من ١٤٠ سم إلى ١٥٥ سم في ثلاث سنوات. الزيادة في طوله:":"اطرح الطول الأول من الطول الثاني.","إذا قُطع الطرف النامي (القمّة) من ساق نبتة صغيرة فماذا نتوقّع بالاعتماد على الدرس؟":"أين توجد الخلايا المسؤولة عن الانقسام في النبات؟"}},{"t":"الحركة","e":["# نشاط (١): الكائنات الدقيقة","تمتلك الكائنات الحيّة الدقيقة وسائل مختلفة للحركة بهدف تمكينها من القيام بالعمليات الحيويّة. لعلّك لاحظت أنّ بعض هذه الكائنات يمتلك زوائد قصيرة (أهداب)، وبعضها يمتلك زوائد طويلة (أسواط)، ومنها ما لا يمتلك زوائد، ولكن يتغيّر شكله باستمرار خلال حركته نتيجة حدوث انبعاجات في السيتوبلازم تسمّى أقداماً كاذبة.","- الأهداب: زوائد قصيرة تتحرّك بها بعض الكائنات الدقيقة، كما في البراميسيوم.","- الأسواط: زوائد طويلة تتحرّك بها بعض الكائنات الدقيقة، كما في الكلاميدوموناس والأيوغلينا.","- الأقدام الكاذبة: انبعاجات في السيتوبلازم يتغيّر بها شكل الكائن أثناء حركته، كما في الأميبا.","|الكائن (من الصور)|وسيلة الحركة","|براميسيوم|أهداب (زوائد قصيرة)","|كلاميدوموناس|أسواط (زوائد طويلة)","|أيوغلينا|أسواط (زوائد طويلة)","|أميبا|أقدام كاذبة (انبعاجات السيتوبلازم)","! تذكّر: الأهداب قصيرة، والأسواط طويلة، والأقدام الكاذبة انبعاجات في السيتوبلازم ويتغيّر بها الشكل باستمرار.","# نشاط (٢): سلوكات حركيّة","يهوى سامي التقاط صور للحياة البرّية في فلسطين، ورصد منها الصور التالية: ضبع، نخيل (تهتزّ في الريح)، نيص. وفي جدول النشاط صور لسلوكات أخرى: حيوان يركض هارباً من مفترس، وقلب، وقطيع كبير يتحرّك معاً، وطائر يبني عشّه.","أسئلة النشاط: أيّ الكائنات الحيّة تغيّر موضعها من وقت لآخر كما لاحظ سامي؟ ماذا يُسمّى التغيّر في الموضع؟ هل يتغيّر موضع النبتة مع حركة أغصانها؟","- الحركة الانتقالية: حركة يتغيّر فيها موضع الكائن الحيّ كلّه من مكان إلى آخر، كحركة الضبع والنيص وهروب الحيوان من المفترس وانتقال القطيع.","- الحركة الموضعية: حركة يتحرّك فيها جزء من الكائن أو الكائن في مكانه دون أن يتغيّر موضعه، كحركة أغصان النبتة أو نبضات القلب أو فتح الثغور وإغلاقها.","! الاستنتاج: من أنواع الحركة حركة موضعية وحركة انتقالية.","# جدول السلوك الحركي: النوع والهدف","|السلوك الحركي|نوع الحركة|الهدف المتوقَّع","|حيوان يركض ومفترس خلفه|انتقالية|النجاة من المفترس أو الإمساك بالفريسة","|القلب|موضعية|يتحرّك في مكانه ليؤدّي وظيفته الحيوية (ضخّ الدم)","|قطيع كبير يتحرّك معاً|انتقالية|الانتقال إلى مكان آخر، مثل البحث عن غذاء","|طائر يبني عشّه|انتقالية (ينتقل ليجمع المواد)|تهيئة مكان للتكاثر ورعاية الصغار","|أغصان النخيل في الريح|موضعية|لا يتغيّر موضع النبتة","|فتح الثغور وإغلاقها في النبات|موضعية|تبادل الغازات (حسب سؤال اختبر نفسي: حركة موضعية)","# مقارنة بين النوعين","|وجه المقارنة|الحركة الانتقالية|الحركة الموضعية","|تغيّر موضع الكائن|يتغيّر|لا يتغيّر","|أمثلة|ضبع، نيص، هروب حيوان|أغصان نبتة، القلب، الثغور","|عند النبات|لا تحدث غالباً (النبتة ثابتة بمكانها)|تحدث مثل حركة الأغصان","? ما نوع الحركة في فتح الثغور وإغلاقها في النبات؟ (سؤال الكتاب) || حركة موضعية، لأنّ النبتة لا تغيّر مكانها بل يتحرّك جزء منها في مكانه.","? نيص يمشي في الصحراء من مكان إلى آخر. ما نوع حركته؟ ولماذا؟ || حركة انتقالية لأنّ موضعه يتغيّر من وقت لآخر.","? ما الفرق بين حركة الأميبا وحركة البراميسيوم؟ || الأميبا لا تمتلك زوائد وتتحرّك بأقدام كاذبة (انبعاجات في السيتوبلازم) ويتغيّر شكلها، أمّا البراميسيوم فيمتلك أهداباً قصيرة يتحرّك بها.","# تطبيقات حياتيّة","- تأمّل نباتات الحديقة: هل تتحرّك أغصانها؟ هي حركة موضعية.","- راقب قطة أو طائراً في بيئتك: صِف حركته الانتقالية وهدفها.","! تلخيص: الكائنات الدقيقة تتحرّك بأهداب أو أسواط أو أقدام كاذبة؛ والحركة في الكائنات الكبيرة إمّا انتقالية أو موضعية."],"q":["- اذكر وسيلة الحركة لكلّ من: البراميسيوم، الأيوغلينا، الأميبا.","- ما الفرق بين الحركة الانتقالية والحركة الموضعية؟ مع مثالين لكلّ منهما.","- هل تغيّر النبتة موضعها عند حركة أغصانها؟ ماذا نسمّي حركتها؟","- لماذا تتحرّك الكائنات الحيّة؟ (فكّر في الهدف من حركة القطيع وحركة الحيوان الهارب)"],"quiz":[{"l":0,"k":"n","q":"ما اسم الزوائد القصيرة التي تتحرّك بها بعض الكائنات الدقيقة؟","o":["الأسواط","الأهداب","الأقدام الكاذبة","الثغور"],"a":1},{"l":0,"k":"n","q":"ما اسم الزوائد الطو q":"لماذا تُعدّ حركة أغصان نبتة في الريح حركة موضعية؟","o":["لأنها تنتقل إلى مكان جديد","لأن النبتة لا تغيّر مكانها ككلّ","لأنها تمتلك أقداماً كاذبة","لأنها تمتلك أهداباً"],"a":1},{"l":2,"k":"p","q":"أميبا ومعها براميسيوم تحت المجهر. أيّهما يغيّر شكله باستمرار أثناء حركته؟","o":["البراميسيوم","كلاهما","الأميبا","لا أحد منهما"],"a":2},{"l":2,"k":"p","q":"طائر يطير ليجمع القشّ ويبني عشّه. ما هدف حركته الانتقالية؟","o":["فتح الثغور","ضخّ الدم","النموّ بالانقسام الخلوي","تهيئة مكان للتكاثر ورعاية الصغار"],"a":3},{"l":2,"k":"p","q":"أيّ مجموعة تضمّ حركات موضعية فقط؟","o":["نبض القلب، فتح الثغور، اهتزاز أغصان النخيل","هروب الغزال، انتقال القطيع، نبض القلب","فتح الثغور، هروب الغزال، اهتزاز الأغصان","نبض القلب، انتقال القطيع، مشي النيص"],"a":0},{"l":2,"k":"p","q":"من لا يمتلك زوائد (أهداباً أو أسواطاً) لكنه يتحرّك، فكيف يتحرّك؟","o":["بالثغور","بأقدام كاذبة كالأميبا","بالجذور","لا يتحرّك"],"a":1},{"l":2,"k":"p","q":"ما سبب اعتبار هروب الحيوان من مفترسه سلوكاً حركياً مفيداً له؟","o":["لأنه يغيّر شكله بالأقدام الكاذبة","لأنه يفتح ثغوره","لأنه ينتقل بحركة انتقالية فينجو","لأنه ينمو بالانقسام"],"a":2},{"l":2,"k":"p","q":"إذا قلنا إنّ الحركة تمكّن الكائن من القيام بالعمليات الحيوية، فأيّ مثال يدعم ذلك؟","o":["موت الكائن","توقّف القلب","ثبات الجذر فقط","حركة القطيع بحثاً عن الغذاء"],"a":3},{"l":2,"k":"p","q":"أيّ عبارة صحيحة؟","o":["الحركة الانتقالية تغيّر موضع الكائن، والموضعية لا تغيّره","كلتاهما تغيّر الموضع","كلتاهما لا تغيّر الموضع","الموضعية تخصّ الحيوان فقط"],"a":0}],"hints":{"ما اسم الزوائد القصيرة التي تتحرّك بها بعض الكائنات الدقيقة؟":"الزوائد القصيرة التي تشبه الشعيرات هي...","هل يتغيّر موضع النبتة مع حركة أغصانها؟":"هل تنتقل النبتة من مكانها أم يتحرّك جزء منها في مكانه؟","أميبا ومعها براميسيوم تحت المجهر. أيّهما يغيّر شكله باستمرار أثناء حركته؟":"من الكائنين يتغيّر شكله دائماً؟ تذكّر الانبعاجات.","أيّ مجموعة تضمّ حركات موضعية فقط؟":"ابحث عن المجموعة التي لا يتغيّر فيها موضع الكائن في أيّ مثال."}},{"t":"الإخراج","e":["# نشاط (١): وسائل إخراجية في الجسم","تُظهر الصورة ثلاثة أشخاص: واحد يعرق بعد الركض، وآخر يبكي، وثالثة تمسك منديلاً لأنفها. ويطلب النشاط: ما أهمية التعرّق للجسم؟ وما مكوّنات العرق؟ وما الطرق السليمة للتخلّص منه؟ وما دور جهاز التنفس في الإخراج؟ واذكر وسائل إخراجية أخرى في الجسم.","تختلف الكائنات الحيّة في تعقيد تركيب أجسامها، وبالتالي في طرق تخلّصها من الفضلات. ينتج من عمليات الأيض التي تحدث في خلايا الحيوانات فضلات، يلجأ الجسم إلى التخلّص منها؛ لأنّ تراكم الفضلات في الجسم يسبّب أضراراً وتسمّماً للكائن الحيّ.","- الفضلات: مواد ناتجة من عمليات الأيض في الخلايا، لا يحتاجها الجسم ويضرّه تراكمها.","- الإخراج: التخلّص من الفضلات الناتجة عن عمليات الأيض.","- الجهاز البولي: يتمثّل دوره في تنقية الدم من بعض الفضلات النيتروجينية وإخراجها إلى خارج الجسم في البول.","- جهاز التنفس (الرئتان): يُخرج ثاني أكسيد الكربون من الجسم (ناتج التنفس).","- الجلد: يُخرج العرق (التعرّق).","|وسيلة الإخراج|ما تُخرجه|الجهاز أو العضو","|التنفس|ثاني أكسيد الكربون|الرئتان","|البول|فضلات نيتروجينية|الجهاز البولي (الكليتان)","|التعرّق|العرق|الجلد","! سبب الإخراج: تراكم الفضلات يسبّب أضراراً وتسمّماً للكائن الحيّ، لذلك لا بدّ من التخلّص منها.","? ما العضو المسؤول عن إخراج ثاني أكسيد الكربون من جسم الإنسان؟ (سؤال الكتاب) || الرئتان (جهاز التنفس).","? علّل: تلجأ الكائنات الحيّة إلى التخلّص من فضلاتها النيتروجينية بسرعة. || لأنّ تراكم الفضلات في الجسم يسبّب أضراراً وتسمّماً للكائن الحيّ، فيجب إخراجها، والفضلات النيتروجينية ينقّي الجهاز البولي الدم منها ويخرجها مع البول.","# نشاط (٢): الإخراج في النباتات","تُظهر الصورة نبتة حمراء الأوراق تحت ناقوس زجاجي. لا تحتاج النباتات إلى أجهزة إخراجية كما الحيوان؛ لأنّ كمية فضلاتها قليلة وتجمعها ببطء، وتستخدم نواتج بعض العمليات الحيوية في عمليات حيوية أخرى.","تتخلّص النباتات من فضلاتها بطرق مختلفة منها:","- تجميع الفضلات في الأوراق ثم التخلّص منها بسقوط الأوراق.","- التخلّص من الغازات غير المرغوب فيها عن طريق الثغور.","- تخزين الفضلات في فجوات خاصّة في الخلايا طيلة حياتها.","|وجه المقارنة|الحيوان|النبات","|كمية الفضلات|كبيرة نسبياً بسبب الأيض|قليلة وتتجمّع ببطء","|جهاز إخراجي|يلزمه (مثل الجهاز البولي)|لا يحتاج جهازاً متخصّصاً","|طرق التخلّص|بول، تعرّق، زفير...|سقوط الأوراق، الثغور، فجوات التخزين","? لماذا لا تحتاج النباتات إلى جهاز إخراجي متخصّص؟ (سؤال الكتاب) || لأنّ كمية فضلاتها قليلة وتجمعها ببطء، وتستخدم نواتج بعض عملياتها الحيوية في عمليات أخرى، وهي تتخلّص منها بسقوط الأوراق والثغور وتخزينها في الفجوات.","? كيف يمكن لشجرة أن تتخلّص من فضلاتها المتجمّعة في أوراقها؟ || تجمع الفضلات في الأوراق ثم تسقط الأوراق فتتخلّص منها.","# تطبيقات حياتيّة","- تعرّق الجسم عند الركض وسيلة إخراجية؛ ومن الطرق السليمة بعدها الاستحمام وتغيير الملابس والنظافة الشخصية.","- سقوط أوراق الأشجار في الخريف هو إحدى طرق إخراج النباتات.","! اختبر نفسي: الكائنات الحيّة تلجأ إلى التخلّص من فضلاتها النيتروجينية بسرعة، والنباتات لا تحتاج إلى جهاز إخراجي متخصّص."],"q":["- ما المقصود بالإخراج؟ ولماذا يحتاج الجسم إلى التخلّص من الفضلات؟","- اذكر ثلاث وسائل إخراجية في جسم الإنسان والعضو المسؤول عن كلّ منها.","- ما دور الجهاز البولي؟","- كيف تتخلّص النباتات من فضلاتها؟ اذكر ثلاث طرق.","- لماذا لا تحتاج النباتات إلى جهاز إخراجي متخصّص؟"],"quiz":[{"l":0,"k":"n","q":"ما اسم عملية التخلّص من الفضلات الناتجة عن الأيض؟","o":["التغذية","الإخراج","النموّ","الحركة"],"a":1},{"l":0,"k":"n","q":"ما العضو المسؤول عن إخراج ثاني أكسيد الكربون من الجسم؟","o":["القلب","الجلد","الرئتان","الكليتان"],"a":2},{"l":0,"k":"n","q":"ما دور الجهاز البولي؟","o":["إنتاج الطاقة","هضم الغذاء","إخراج ثاني أكسيد الكربون","تنقية الدم من بعض الفضلات النيتروجينية وإخراجها في البول"],"a":3},{"l":0,"k":"n","q":"كيف تتخلّص النباتات من الغازات غير المرغوب فيها؟","o":["عن طريق الثغور","عن طريق البول","بالتعرّق من الجلد","عن طريق الكليتين"],"a":0},{"l":0,"k":"n","q":"أين تخزّن النباتات بعض فضلاتها طيلة حياتها؟","o":["في الكلية","في فجوات خاصّة في الخلايا","في الدم","في الجلد"],"a":1},{"l":0,"k":"n","q":"ماذا يسبّب تراكم الفضلات في جسم الكائن الحيّ؟","o":["نموّاً أسرع","تخزين الطاقة","أضراراً وتسمّماً","التكاثر"],"a":2},{"l":0,"k":"n","q":"كيف تتخلّص الشجرة من فضلاتها المجمّعة في الأوراق؟","o":["بالبول","بالتعرّق","بالتنفس الهوائي","بسقوط الأوراق"],"a":3},{"l":0,"k":"n","q":"من أين تنتج الفضلات في الحيوانات؟","o":["من عمليات الأيض في الخلايا","من ضوء الشمس","من الماء فقط","من الحركة الانتقالية"],"a":0},{"l":1,"k":"p","q":"أيّ الوسائل الآتية وسيلة إخراجية في جسم الإنسان؟","o":["النموّ","التعرّق","الاستجابة للضوء","التكاثر"],"a":1},{"l":1,"k":"p","q":"أيّ الآتي ليس طريقة يتخلّص بها النبات من فضلاته؟","o":["سقوط الأوراق","الثغور","التبوّل بجهاز بولي","التخزين في الفجوات"],"a":2},{"l":1,"k":"p","q":"لماذا لا تحتاج النباتات إلى جهاز إخراجي كما الحيوان؟","o":["لأنها لا تقوم بالأيض","لأنها لا تتغذّى","لأنها تتحرّك انتقالياً","لأن فضلاتها قليلة وتجمعها ببطء"],"a":3},{"l":1,"k":"p","q":"أيّ الجمل صحيحة عن النباتات؟","o":["تستخدم نواتج بعض العمليات الحيوية في عمليات حيوية أخرى","تتخلّص من فضلاتها بالبول","لها جهاز بولي","لا تنتج أيّ فضلات أبداً"],"a":0},{"l":1,"k":"p","q":"ما أثر تراكم الفضلات النيتروجينية في الدم؟","o":["يزيد النموّ","تسمّم الكائن، ولذلك ينقّيه الجهاز البولي","يحسّن الاستجابة","لا أثر له"],"a":1},{"l":1,"k":"p","q":"لماذا يلجأ الجسم إلى الإخراج؟","o":["لأنه يحتاج الفضلات","ليُخزّن الفضلات","لأن الفضلات تضرّ بالجسم إذا تراكمت","لأنه لا يحتاج الأيض"],"a":2},{"l":1,"k":"p","q":"أيّ طرق إخراج النبات تتمّ بتجميع الفضلات في أوراق؟","o":["التبرّز","الزفير","التعرّق","سقوط الأوراق"],"a":3},{"l":1,"k":"p","q":"ينتج ثاني أكسيد الكربون من عمليات الأيض (التنفس). كيف يتخلّص منه جسم الإنسان؟","o":["عن طريق الرئتين","عن طريق الأمعاء","عن طريق الجلد فقط","عن طريق الكلية"],"a":0},{"l":2,"k":"p","q":"لماذا يُعدّ تعرّق الرياضي وسيلة إخراجية مفيدة؟","o":["لأنه يزيد الفضلات","لأنه يخلّص الجسم من فضلات ويمنع تراكمها","لأنه يخزّنها","لأنه لا علاقة له بالفضلات"],"a":1},{"l":2,"k":"p","q":"نبتة تُجمَع فضلاتها في أوراقها. متى تتخلّص منها؟","o":["عند التعرّق","بالبول","عند سقوط الأوراق","لا تتخلّص أبداً"],"a":2},{"l":2,"k":"p","q":"مقارنة النبات بالحيوان: أيّهما يحتاج جهازاً إخراجياً متخصّصاً؟","o":["النبات لأن فضلاته أكثر","كلاهما بالمقدار نفسه","لا أحد","الحيوان لأن فضلاته أكثر وأسرع تراكماً"],"a":3},{"l":2,"k":"p","q":"إذا توقّف الجهاز البولي عن عمله فماذا نتوقّع؟","o":["تراكم فضلات نيتروجينية تسبّب تسمّماً","زيادة سرعة النموّ","تحسّن التنفس","لا شيء"],"a":0},{"l":2,"k":"p","q":"أيّ الأمثلة يمثّل تخزين الفضلات في فجوات؟","o":["إنسان يتعرّق","نبات يحتفظ بفضلاته في خلاياه طيلة حياته","حيوان يبول","حيوان يزفر"],"a":1},{"l":2,"k":"p","q":"أيّ العبارات الآتية تفسّر دور الأيض في الإخراج؟","o":["الأيض يمنع الإخراج","الأيض يحدث بعد الإخراج فقط","الأيض ينتج فضلات يلزم إخراجها","لا علاقة بينهما"],"a":2},{"l":2,"k":"p","q":"أيّ المجموعات تضمّ وسائل إخراج في الجسم؟","o":["النموّ والتكاثر والحركة","البناء والهدم والانقسام","الاستجابة والحركة والتغذية","التعرّق والتنفس والبول"],"a":3},{"l":2,"k":"p","q":"تُسقط شجرة أوراقها في الخريف. ما علاقة ذلك بالإخراج؟","o":["هو وسيلة للتخلّص من فضلات تجمّعت في الأوراق","هو بناء ضوئي","هو حركة انتقالية","هو تغذية بالترمّم"],"a":0}],"hints":{"ما دور الجهاز البولي؟":"الكلى والجهاز البولي تنقّي الدم... من أيّ نوع من الفضلات؟","لماذا لا تحتاج النباتات إلى جهاز إخراجي كما الحيوان؟":"فضلات النبات قليلة وبطيئة التراكم، ما أثر ذلك؟","مقارنة النبات بالحيوان: أيّهما يحتاج جهازاً إخراجياً متخصّصاً؟":"مقارنة كمية الفضلات وسرعتها بين الحيوان والنبات.","إذا توقّف الجهاز البولي عن عمله فماذا نتوقّع؟":"إذا لم تُنقَّ الفضلات النيتروجينية فماذا يحدث؟"}},{"t":"الاستجابة","e":["# تمهيد: ما الاستجابة؟","تمتلك الكائنات الحيّة وسائل مختلفة للتكيّف مع مؤثّرات البيئة المحيطة. فالأميبا مثلاً لا تمتلك خلايا متخصّصة، لكنّها تنجذب للضوء، وتبتعد عن الحرارة الشديدة. ويُسمّى هذا السلوك الاستجابة.","- الاستجابة: سلوك يقوم به الكائن الحيّ كوسيلة للتكيّف مع مؤثّرات البيئة.","- المؤثّر: تغيّر في البيئة (مثل الضوء أو الحرارة الشديدة) يستجيب له الكائن الحيّ.","أمّا الكائنات الحيّة الراقية كالإنسان فإنها تمتلك خلايا متخصّصة تمكّنها من الاستجابة وبسرعة للمؤثّرات الخارجية.","|الكائن|مثال على الاستجابة","|الأميبا|تنجذب للضوء وتبتعد عن الحرارة الشديدة","|الإنسان|يستجيب بسرعة للمؤثّرات الخارجية بفضل خلاياه المتخصّصة","|نبات دوّار الشمس|تتّجه قمّته نحو الشمس","# استجابة سريعة أم بطيئة؟","لاحظ عيسى أنّ قمّة نبات دوّار الشمس في حديقة المنزل تكون باتّجاه الشمس، فطلب من أمّه أن تفسّر له هذه الظاهرة. فأجابته بأنّ النباتات لا تمتلك خلايا أو أجهزة متخصّصة للاستجابة، ولذلك تكون استجابتها بطيئة، إلا أنّ هناك حالات استجابة سريعة للمؤثّرات الخارجية، كما في نبات دوّار الشمس ونبات الست المستحية وغيرها.","- النباتات لا تمتلك خلايا أو أجهزة متخصّصة للاستجابة، لذلك تكون استجابتها بطيئة عادةً.","- في بعض النباتات استجابة سريعة، مثل الست المستحية وصائد الحشرات (كما في صور النشاط).","- الإنسان وسائر الراقيات: استجابتها سريعة لأنّ لديها خلايا متخصّصة.","! لتوضيح ذلك قامت الأم بنشاط (١) ورسمت المخطط (ب): استجابة الكائنات الحيّة تُقسَم إلى سريعة وبطيئة.","# نشاط (١): استجابة النبات للضوء والمخطط (ب)","تُظهر الصور ثلاثة نباتات: دوّار الشمس، والست المستحية، وصائد الحشرات. ويعرض المخطط (ب) تصنيف استجابة الكائنات الحيّة إلى فرعين: سريعة وبطيئة، وفي أسفلهما أمثلة (إنسان، أوّليات، وفراغات تُملأ).","|نوع الاستجابة|أمثلة من الدرس","|سريعة|الإنسان، الست المستحية، صائد الحشرات","|بطيئة|معظم النباتات (مثل اتّجاه قمة دوّار الشمس نحو الشمس)، الأوليّات مثل الأميبا","? لماذا تكون استجابة النباتات للمؤثّرات بطيئة غالباً؟ || لأنها لا تمتلك خلايا أو أجهزة متخصّصة للاستجابة كما في الحيوان والإنسان.","? لماذا يستجيب الإنسان بسرعة للمؤثّرات الخارجية؟ || لأنه كائن حيّ راقٍ يمتلك خلايا متخصّصة تمكّنه من الاستجابة بسرعة.","? فسّر اتّجاه قمة نبات دوّار الشمس نحو الشمس. || استجابة للضوء (مؤثّر)؛ يتكيّف النبات بتوجيه قمّته نحو الشمس، وهي استجابة بطيئة نسبياً لأنّ النبات لا يمتلك خلايا متخصّصة.","# مقارنة","|وجه المقارنة|الأميبا|النبات|الإنسان","|الخلايا المتخصّصة|لا تمتلك|لا تمتلك (أجهزة متخصّصة)|يمتلك","|سرعة الاستجابة|بطيئة (أولية)|بطيئة غالباً، وسريعة في بعض الحالات|سريعة","|مثال|تنجذب للضوء|دوّار الشمس نحو الشمس|يستجيب بسرعة للمؤثّرات","# تطبيقات حياتيّة","- ابتعادك السريع عن موقد ساخن مثال على استجابة سريعة عند الإنسان.","- راقب نباتاً على نافذة: ستلاحظ أنّ قمّته تميل نحو الضوء مع الوقت (استجابة بطيئة).","- أكمل المخطط (ب): تحت «سريعة» ضع إنسان والست المستحية وصائد الحشرات، وتحت «بطيئة» ضع دوّار الشمس والأوليّات.","! الاستجابة: كلّ كائن حيّ يتكيّف مع البيئة، لكنّ السرعة تختلف بحسب وجود الخلايا المتخصّصة."],"q":["- عرّف الاستجابة، وأعطِ مثالاً من الأميبا.","- لماذا تكون استجابة الإنسان أسرع من استجابة معظم النباتات؟","- فسّر اتّجاه قمّة نبات دوّار الشمس نحو الشمس.","- اذكر نباتين لهما استجابة سريعة للمؤثّرات الخارجية.","- أكمل: تُقسَم استجابة الكائنات الحيّة إلى ... و....."],"quiz":[{"l":0,"k":"n","q":"ما اسم سلوك الكائن الحيّ للتكيّف مع مؤثّرات البيئة؟","o":["الإخراج","الاستجابة","النموّ","التخمّر"],"a":1},{"l":0,"k":"n","q":"كيف تستجيب الأميبا للضوء؟","o":["تبتعد عنه","لا تتأثّر به","تنجذب إليه","تموت فوراً"],"a":2},{"l":0,"k":"n","q":"كيف تتصرّف الأميبا عند التعرّض لحرارة شديدة؟","o":["تنجذب إليها","لا تتحرّك أبداً","تتكاثر فوراً","تبتعد عنها"],"a":3},{"l":0,"k":"n","q":"لماذا يستجيب الإنسان بسرعة للمؤثّرات الخارجية؟","o":["لأنه يمتلك خلايا متخصّصة","لأنه لا يمتلك خلايا","لأنه نبات","لأنه يتغذّى بالترمّم"],"a":0},{"l":0,"k":"n","q":"استجابة النباتات للمؤثّرات غالباً:","o":["سريعة جداً دائماً","بطيئة","منعدمة","هوائية"],"a":1},{"l":0,"k":"n","q":"أيّ النباتات الآتية له استجابة سريعة؟","o":["الشجرة المعمّرة العادية","الطحلب فقط","الست المستحية","الفطر"],"a":2},{"l":0,"k":"n","q":"نحو أيّ شيء تتّجه قمّة نبات دوّار الشمس؟","o":["التربة","الماء المظلم","الجذر","الشمس"],"a":3},{"l":0,"k":"n","q":"تُقسَم استجابة الكائنات الحيّة (المخطط ب) إلى:","o":["سريعة وبطيئة","بناء وهدم","انتقالية وموضعية","أساسية وغير أساسية"],"a":0},{"l":1,"k":"p","q":"لماذا استجابة النباتات بطيئة؟","o":["لأنها تمتلك خلايا متخصّصة","لأنها لا تمتلك خلايا أو أجهزة متخصّصة للاستجابة","لأنها تتحرّك انتقالياً","لأنها لا تحتاج مؤثّرات"],"a":1},{"l":1,"k":"p","q":"نبات يطبق أوراقه فوراً عند لمسه. تصنَّف استجابته:","o":["بطيئة","معدومة","سريعة","تخميرية"],"a":2},{"l":1,"k":"p","q":"أيّ العبارات صحيحة عن الأميبا؟","o":["تمتلك جهازاً عصبياً كالإنسان","لا تستجيب","تستجيب فقط للصوت","لا تمتلك خلايا متخصّصة ومع ذلك تستجيب للضوء والحرارة"],"a":3},{"l":1,"k":"p","q":"أيّ الأمثلة يمثّل استجابة بطيئة؟","o":["ميل قمة النبات نحو "في أيّ فرع من المخطط (ب) نضع كائناً لا يمتلك خلايا متخصّصة كالأوليّات؟","o":["فرع الاستجابة البطيئة","فرع الاستجابة السريعة","فرع الحركة الانتقالية","فرع التكاثر"],"a":0}],"hints":{"كيف تستجيب الأميبا للضوء؟":"الأميبا تتأثّر بالضوء؛ هل تنجذب إليه أم تبتعد؟","لماذا استجابة النباتات بطيئة؟":"ما الذي تفتقده النباتات من خلايا وأجهزة؟","أميبا في طبق، وُضع مصباح قوي من جهة وحرارة شديدة من جهة أخرى. كيف نتوقّع حركتها؟":"اجمع الاستجابتين: للضوء (انجذاب) وللحرارة الشديدة (ابتعاد).","إذا قارنّا الإنسان بدوّار الشمس: أيّهما أسرع استجابة؟ ولماذا؟":"من يمتلك خلايا متخصّصة: الإنسان أم النبات؟"}},{"t":"التكاثر","e":["# تمهيد: أنواع التكاثر","تتنوّع طرق تكاثر الكائنات الحيّة، فهناك تكاثر لا جنسي أي لا يحتاج إلى وجود أزواج (ذكر وأنثى)، وتكاثر جنسي يحتاج إلى وجود أزواج (ذكر وأنثى) كما في الحيوانات والنباتات الزهرية.","- التكاثر اللاجنسي: تكاثر لا يحتاج إلى وجود أزواج (ذكر وأنثى).","- التكاثر الجنسي: تكاثر يحتاج إلى وجود أزواج (ذكر وأنثى)، كما في الحيوانات والنباتات الزهرية.","|وجه المقارنة|التكاثر اللاجنسي|التكاثر الجنسي","|الحاجة إلى ذكر وأنثى|لا يحتاج|يحتاج","|أمثلة|الأميبا، الخميرة، نجم البحر، التطعيم والترقيد والفسائل|الحيوانات (مثل الحمام)، النباتات الزهرية","# طرق التكاثر اللاجنسي","- الانشطار: ينقسم الكائن إلى جزأين متساويين كلّ منهما كائن جديد، كما في الأميبا.","- التبرعم: يظهر برعم على جسم الكائن ينمو ويصبح كائناً جديداً، كما في الخميرة.","- التكاثر بالتجزئة (تقطيع الحيوان): كما في نجم البحر؛ إذ يكفي أن يحتوي كلّ جزء على جزء من القرص المركزي ليصبح قادراً على تكوين حيوان جديد.","- التكاثر الخضري في النباتات: كالتطعيم أو الترقيد أو الفسائل.","|الطريقة|الكائن (من الدرس)","|الانشطار|الأميبا","|التبرعم|الخميرة","|التجزئة|نجم البحر","|التكاثر الخضري|نباتات (التطعيم، الترقيد، الفسائل)","! نجم البحر: جزء من الذراع مع جزء من القرص المركزي يكفي ليصبح نجماً جديداً.","# نشاط (١): التبرعم في الخميرة","يوضّح النشاط تكاثر الخميرة بالتبرعم، وهو تكاثر لا جنسي؛ ينمو فيه برعم صغير على خليّة الخميرة إلى أن يصبح خليّةً جديدة. والخميرة كما عرفنا فطر رمّي يتخمّر بوجود مادة عضوية.","? ما نوع تكاثر الخميرة؟ وما اسم طريقته؟ (سؤال الكتاب) || تكاثر لا جنسي، وطريقته التبرعم، ولا تحتاج إلى ذكر وأنثى.","? ما نوع تكاثر الأميبا؟ || لا جنسي، بالانشطار؛ إذ تنقسم الأميبا إلى كائنين جديدين دون الحاجة إلى ذكر وأنثى.","? قُطع ذراع نجم البحر ومعه جزء من القرص المركزي، فماذا نتوقّع؟ || يستطيع هذا الجزء أن يصبح حيواناً جديداً، وهذا تكاثر لا جنسي بالتجزئة.","# نشاط (٢): تكاثر وحياة","عادت نادية من جولتها في مزارع بلدتها، وقرّرت مطابقة مشاهداتها على نباتات وحيوانات جدّتها. تُظهر الصورة حمامة في عشّها (بين صغارها) على شجرة مزهرة. ويسأل النشاط: لماذا يعيش الحمام على شكل أزواج؟ وما أهمية الأزهار في النبات؟ وما نوع التكاثر فيها؟","? لماذا يعيش الحمام على شكل أزواج؟ وما نوع تكاثره؟ || لأنّ التكاثر الجنسي يحتاج إلى ذكر وأنثى، فيعيش الذكر والأنثى معاً. ونوع تكاثر الحمام جنسي.","? ما أهمية الأزهار في النبات؟ وما نوع التكاثر فيها؟ || الأزهار في النباتات الزهرية هي العضو الذي يحدث فيه التكاثر الجنسي الذي يحتاج إلى وجود أزواج (ذكر وأنثى). فالتكاثر في النباتات الزهرية جنسي.","# التكاثر الخضري في النباتات","التكاثر الخضري في النباتات هو أحد أنواع التكاثر اللاجنسي، ومن طرقه التي ذكرها الكتاب:","- التطعيم.","- الترقيد.","- الفسائل.","! لا يحتاج التكاثر الخضري إلى ذكر وأنثى، فهو تكاثر لاجنسي في النباتات.","# تطبيقات حياتيّة","- الخميرة التي تُستخدم في العجين تتكاثر بالتبرعم.","- المزارع يكثّر الأشجار بالتطعيم أو الفسائل للحصول على نباتات جديدة بلا بذور.","! اختبر نفسي: الكائن الذي يتكاثر بالانشطار الأميبا، والخميرة بالتبرعم، وحيوان يتكاثر بالتجزئة نجم البحر."],"q":["- ما الفرق بين التكاثر الجنسي والتكاثر اللاجنسي؟","- اذكر ثلاث طرق للتكاثر اللاجنسي في الحيوانات والكائنات الدقيقة مع مثال لكلّ منها.","- ما المقصود بالتكاثر الخضري؟ اذكر ثلاث طرق له.","- لماذا يعيش الحمام على شكل أزواج؟","- ما أهمية الأزهار في النباتات الزهرية؟"],"quiz":[{"l":0,"k":"n","q":"التكاثر الذي لا يحتاج إلى وجود ذكر وأنثى يسمّى:","o":["جنسياً","لاجنسياً","خضرياً فقط","تنفسياً"],"a":1},{"l":0,"k":"n","q":"التكاثر الذي يحتاج إلى ذكر وأنثى يسمّى:","o":["لاجنسياً","بالانشطار","جنسياً","بالتبرعم"],"a":2},{"l":0,"k":"n","q":"ما ؟",["S","Sd","So","Na"],3],[0,"ما الصيغة الجزيئية لملح الطعام؟",["CaO","NaCl","CCl₄","H₂O"],1],[1,"ذرّة عددها الذرّي ١٧ وعددها الكتلي ٣٥، فكم نيوتروناً فيها؟",["١٧","٣٥","١٨","٥٢"],2],[1,"أيّ التغيّرات التالية كيميائي؟",["صدأ الحديد","ذوبان الجليد","سيلان الزبدة","رمل في ماء"],0],[1,"كم عدد الذرّات الكلّي في فيتامين C (C₆H₈O₆)؟",["١٤","٦","٨","٢٠"],3],[1,"أيّ العناصر اشتُقّ رمزه من اسمه اللاتيني؟",["Mg (المغنيسيوم)","Fe (الحديد)","Ca (الكالسيوم)","C (الكربون)"],1],[2,"نواة عنصر فيها ١١ بروتوناً و١٢ نيوتروناً. ما هويّته (العدد الكتلي والذرّي)؟",["¹¹₂₃M","¹²₁₁M","²³₁₁M","²³₁₂M"],2],[2,"في المعادلة: الماء + ثاني أكسيد الكربون → (ضوء الشمس، كلوروفيل) → أكسجين + غلوكوز، ما العوامل المساعدة؟",["الماء والأكسجين","ضوء الشمس والكلوروفيل","الغلوكوز والماء","ثاني أكسيد الكربون والأكسجين"],1],[2,"كم ذرّة هيدروجين في السماد CO(NH₂)₂؟",["٤","٢","١","٨"],0],[2,"ذرّة الأكسجين فيها ٨ بروتونات و٨ نيوترونات، فما توزيع إلكتروناتها وعددها الكتلي؟",["٨ والكتلي ٨","٢، ٦ والكتلي ٨","٤، ٤ والكتلي ١٦","٢، ٦ والكتلي ١٦"],3]],"lessons":[{"t":"تركيب الذرّة","e":["# نشاط ١: عناصر ومركّبات","عرض معلّم العلوم لوحةً فيها مواد من حياتنا مكتوب تحت كلٍّ منها رمزها: Al (نافذة ألمنيوم) وCO₂ (طفّاية حريق) وS (كبريت أصفر) وNaCl (ملح الطعام) وH₂O (ماء) وFe (باب حديد). ثم طُلب تصنيفها إلى عناصر ومركّبات.","|المادة|رمزها|العنصر أو المركّب","|الألمنيوم|Al|عنصر","|الحديد|Fe|عنصر","|الكبريت|S|عنصر","|الماء|H₂O|مركّب","|ثاني أكسيد الكربون|CO₂|مركّب","|ملح الطعام|NaCl|مركّب","- الحديد Fe: مثالٌ على عنصر فلزّي، والكبريت S: مثالٌ على عنصر لا فلزّي.","- عناصر الماء: الهيدروجين H والأكسجين O. وعناصر ثاني أكسيد الكربون: الكربون C والأكسجين O.","تتكوّن المادة من وحدات صغيرة جدّاً لا تُرى بالعين المجرّدة تُسمّى الذرّات، فوحدة بناء عنصر الألمنيوم هي ذرّة الألمنيوم.","! مفتاح الفهم: العنصر وحدة بنائه ذرّة من نوعٍ واحد، أمّا المركّب مثل H₂O فيحوي ذرّاتٍ من أكثر من عنصر.","# جسيمات الذرّة","يتكوّن جسم الإنسان من أجهزة، وتتكوّن الأجهزة من أعضاء، والأعضاء من أنسجة، والأنسجة من خلايا، وتدخل في تركيب الخلايا مواد مختلفة تتكوّن من ذرّات. وقد توصّل العلماء على مرّ القرون إلى معرفة مكوّنات الذرّة وخصائص كلٍّ منها.","- الذرّة: أصغر وحدة بناءٍ في المادة، لا تُرى بالعين المجرّدة.","- النواة: مركز الذرّة، تتركّز فيها البروتونات الموجبة والنيوترونات المتعادلة.","- البروتونات: جسيمات موجبة الشحنة (+) تقع داخل النواة.","- النيوترونات: جسيمات متعادلة الشحنة (لا شحنة لها) تقع داخل النواة.","- الإلكترونات: جسيمات سالبة الشحنة (−) تدور حول النواة في مستويات الطاقة.","- مستويات الطاقة: الأماكن حول النواة التي تدور فيها الإلكترونات.","# نشاط ٢: جسيمات الذرّة","تبيّن الأشكال ذرّات ثلاثة عناصر: النيون Ne والصوديوم Na والكربون C. في كلّ شكلٍ نواةٌ في الوسط فيها بروتونات (p) ونيوترونات (n)، وحولها إلكترونات (e) تدور في مستوياتٍ دائرية. في ذرّة الكربون إلكترونان قريبان من النواة وأربعة إلكترونات في المستوى الخارجي.","|جسيمات الذرّة|البروتون|النيوترون|الإلكترون","|الرمز|p|n|e","|الشحنة|موجبة (+)|متعادل (صفر)|سالبة (−)","|الموقع|داخل النواة|داخل النواة|يدور حول النواة","! العلاقة: في الذرّة المتعادلة يكون عدد الإلكترونات مساوياً لعدد البروتونات، فتتعادل الشحنتان الموجبة والسالبة.","# كتلة الجسيمات","كتلة البروتون تساوي كتلة النيوترون، وتساوي ١٨٤٠ ضعف كتلة الإلكترون. لذلك تتركّز كتلة الذرّة تقريباً في نواتها.","|الجسيم|الكتلة بالمقارنة","|البروتون|١٨٤٠ ضعف كتلة الإلكترون","|النيوترون|يساوي كتلة البروتون","|الإلكترون|أصغر الجسيمات الثلاثة كتلةً","# أمثلة وتطبيقات","? في ذرّة الكربون C ثلاثة أنواع من الجسيمات. أيّها يكون داخل النواة وأيّها حولها؟ || داخل النواة: البروتونات (موجبة +) والنيوترونات (متعادلة). حول النواة: الإلكترونات (سالبة −) تدور في مستويات الطاقة. فشحنة النواة موجبة لأنّها تحوي البروتونات الموجبة.","? صنّف المواد التالية إلى عناصر ومركّبات: Fe وNaCl وS وCO₂. || العناصر (نوعٌ واحد من الذرّات): Fe وS. المركّبات (فيها أكثر من نوع من الذرّات): NaCl (صوديوم وكلور) وCO₂ (كربون وأكسجين).","? ما العلاقة بين عدد الإلكترونات وعدد البروتونات في ذرّةٍ متعادلة؟ ولماذا؟ || عددهما متساوٍ. لأنّ كلّ بروتون شحنته موجبة وكلّ إلكترون شحنته سالبة، فإذا تساوى العددان تلاشت الشحنات وكانت الذرّة متعادلة كهربائياً.","? كتلة النيوترون الواحد تعادل كم إلكتروناً تقريباً؟ || كتلة النيوترون = كتلة البروتون = ١٨٤٠ ضعف كتلة الإلكترون، أي تعادل كتلة ١٨٤٠ إلكتروناً تقريباً."],"q":["- ما الأجزاء الرئيسية التي تتكوّن منها الذرّة؟ وما شحنة كلٍّ منها؟","- أيّ الجسيمات يوجد داخل النواة وأيّها يدور حولها؟","- ما العلاقة بين كتلة البروتون وكتلة النيوترون وكتلة الإلكترون؟","- لماذا تكون الذرّة متعادلة كهربائياً؟","- صنّف Al وH₂O وNaCl وFe وS وCO₂ إلى عناصر ومركّبات."],"quiz":[{"l":0,"k":"n","q":"ما اسم الوحدات الصغيرة جدّاً التي لا تُرى بالعين المجرّدة وتتكوّن منها المادة؟","o":["الذرّات","الخلايا","الأنسجة","الأعضاء"],"a":0},{"l":0,"k":"n","q":"ما الجسيم موجب الشحنة داخل نواة الذرّة؟","o":["الإلكترون","البروتون","النيوترون","الفوتون"],"a":1},{"l":0,"k":"n","q":"ما الجسيم المتعادل الشحنة في نواة الذرّة؟","o":["البروتون","الإلكترون","النيوترون","الأيون"],"a":2},{"l":0,"k":"n","q":"ما الجسيم سالب الشحنة الذي يدور حول النواة؟","o":["البروتون","النيوترون","النواة","الإلكترون"],"a":3},{"l":0,"k":"n","q":"أين تتركّز البروتونات والنيوترونات في الذرّة؟","o":["في مستويات الطاقة","في النواة","خارج الذرّة","حول الإلكترونات فقط"],"a":1},{"l":0,"k":"n","q":"ما الرمز الكيميائي للألمنيوم كما في الشكل؟","o":["Fe","S","Al","Na"],"a":2},{"l":0,"k":"n","q":"أيّ المواد التالية عنصر؟","o":["الماء H₂O","ملح الطعام NaCl","ثاني أكسيد الكربون CO₂","الحديد Fe"],"a":3},{"l":0,"k":"n","q":"أين تدور الإلكترونات؟","o":["حول النواة في مستويات الطاقة","داخل النواة","داخل البروتونات","في وسط النواة"],"a":0},{"l":1,"k":"n","q":"كتلة البروتون تساوي كتلة أيّ جسيم؟","o":["الإلكترون","الذرّة كلّها","النواة كلّها","النيوترون"],"a":3},{"l":1,"k":"n","q":"كتلة البروتون تساوي كم ضعف كتلة الإلكترون؟","o":["١٨٤٠","١٨٤","٤٠٠","٢"],"a":0},{"l":1,"k":"p","q":"مادة رمزها NaCl تتكوّن من ذرّات صوديوم وكلور. إلامَ تُصنَّف؟","o":["عنصر","مركّب","ذرّة","جسيم دون ذرّي"],"a":1},{"l":1,"k":"p","q":"ما وحدة بناء عنصر الألمنيوم؟","o":["جزيء الماء","ذرّة الحديد","ذرّة الألمنيوم","خلية الألمنيوم"],"a":2},{"l":1,"k":"p","q":"لماذا تُعدّ نواة الذرّة موجبة الشحنة؟","o":["لأنّها تحوي بروتوناتٍ موجبة ونيوترونات متعادلة","لأنّها تحوي إلكترونات","لأنّها تحوي نيوترونات فقط","لأنّها فارغة"],"a":0},{"l":1,"k":"p","q":"في ذرّة متعادلة عدد بروتوناتها ٦. كم عدد إلكتروناتها؟","o":["٠","٦","١٢","٣"],"a":1},{"l":1,"k":"p","q":"أيّ الأزواج التالية يتكوّن منه ثاني أكسيد الكربون CO₂؟","o":["الكربون والهيدروجين","الأكسجين والهيدروجين","الكربون والأكسجين","الكبريت والأكسجين"],"a":2},{"l":1,"k":"p","q":"أيّ المواد التالية فلزّ (عنصر فلزّي) كما ورد في النشاط؟","o":["الكبريت S","الماء H₂O","ثاني أكسيد الكربون CO₂","الحديد Fe"],"a":3},{"l":2,"k":"p","q":"ذرّة عنصر فيها ٨ بروتونات. كم إلكتروناً فيها إن كانت متعادلة؟","o":["١٦","٤","٨","٠"],"a":2},{"l":2,"k":"p","q":"أيّ الجسيمات التالية يُهمَل غالباً عند حساب كتلة الذرّة لأنّ كتلته صغيرة جدّاً؟","o":["البروتون","النيوترون","النواة","الإلكترون"],"a":3},{"l":2,"k":"p","q":"في ذرّة الكربون C بحسب الشكل: كم إلكتروناً في المستوى الأوّل القريب من النواة؟","o":["إلكترونان","أربعة","ستّة","واحد"],"a":0},{"l":2,"k":"p","q":"جسيمٌ شحنته سالبة ويدور حول النواة، فما هو؟","o":["البروتون","الإلكترون","النيوترون","النواة"],"a":1},{"l":2,"k":"p","q":"لماذا تتركّز كتلة الذرّة تقريباً في نواتها؟","o":["لأنّ الإلكترونات ثقيلة جدّاً","لأنّ النواة فارغة","لأنّ الإلكترونات داخل النواة","لأنّ البروتونات والنيوترونات أثقل بكثير من الإلكترونات"],"a":3},{"l":2,"k":"p","q":"أيّ العبارات الآتية صحيحة؟","o":["عدد الإلكترونات = عدد البروتونات في الذرّة المتعادلة","عدد الإلكترونات دائماً ضعف البروتونات","النيوترونات سالبة الشحنة","البروتونات تدور حول النواة"],"a":0},{"l":2,"k":"p","q":"جُمعت ٣ بروتونات و٤ نيوترونات في نواة، فما شحنة النواة؟","o":["سالبة","موجبة","متعادلة","تساوي صفراً"],"a":1},{"l":2,"k":"p","q":"تحوي ذرّة الصوديوم Na نواةً حولها إلكترونات تدور في مستويات. أيّ العبارات تصف الإلكترونات؟","o":["موجبة وداخل النواة","متعادلة وداخل النواة","سالبة الشحنة وتدور حول النواة","موجبة وتدور حول النواة"],"a":2}],"hints":{"أين تدور الإلكترونات؟":"تذكّر موقع النواة في الوسط، وأنّ الإلكترونات تتحرّك في أماكن محدّدة بعيدة عنها.","لماذا تُعدّ نواة الذرّة موجبة الشحنة؟":"اسأل نفسك: ما الجسيمان الموجودان في النواة؟ وأيّهما يحمل شحنة؟","في ذرّة متعادلة عدد بروتوناتها ٦. كم عدد إلكتروناتها؟":"المتعادلة تعني أنّ الشحنتين الموجبة والسالبة متساويتان.","لماذا تتركّز كتلة الذرّة تقريباً في نواتها؟":"قارن كتلة البروتون بكتلة الإلكترون (١٨٤٠ ضعفاً) وتذكّر مكان البروتونات."}},{"t":"هوية العنصر","e":["# نشاط ١: جواز سفر","يمتلك المواطن جواز سفر يعكس هويّته، ولا يمكن أن تتطابق معلومات أيّ مواطن مع آخر. وكذلك العناصر الكيميائية: فكلّ عنصر يمتلك هويّة خاصّة به تميّزه، وتحدّد نوعه وخصائصه الكيميائية والفيزيائية.","اصطُلح على تمثيل كلّ عنصر بالرمز X ويُكتب العدد الكتلي A أعلى يسار الرمز والعدد الذرّي Z أسفله، هكذا: ᴬ_Z X.","- العدد الذرّي (Z): عدد البروتونات في نواة ذرّة العنصر.","- العدد الكتلي (A): مجموع عدد البروتونات والنيوترونات داخل نواة الذرّة.","- رمز العنصر (X): حرفٌ أو حرفان يمثّلان العنصر.","# القانونان","بما أنّ الذرّة متعادلة كهربائياً فيمكن الاستدلال على عدد الإلكترونات من العدد الذرّي، فعدد الإلكترونات يساوي عدد البروتونات.","! العدد الذرّي = عدد البروتونات = عدد الإلكترونات في الذرّة المتعادلة.","! العدد الكتلي = عدد البروتونات + عدد النيوترونات، ومنه: عدد النيوترونات = العدد الكتلي − العدد الذرّي.","|المطلوب|القانون","|عدد البروتونات|العدد الذرّي","|عدد الإلكترونات|العدد الذرّي (للذرّة المتعادلة)","|عدد النيوترونات|العدد الكتلي − العدد الذرّي","|العدد الكتلي|عدد البروتونات + عدد النيوترونات","# مثال الكلور ³⁵₁₇Cl","رمز ذرّة الكلور ³⁵₁₇Cl: العدد الكتلي ٣٥ والعدد الذرّي ١٧. عدد البروتونات = العدد الذرّي = ١٧ بروتوناً، وعدد الإلكترونات = عدد البروتونات = ١٧ إلكتروناً لأنّ الذرّة متعادلة، وعدد النيوترونات = ٣٥ − ١٧ = ١٨ نيوتروناً.","? إذا علمت أنّ رمز ذرّة الكلور ³⁵₁₇Cl فما عدد كلّ من الإلكترونات والبروتونات والنيوترونات فيها؟ || البروتونات = العدد الذرّي = ١٧. الإلكترونات = عدد البروتونات = ١٧ (الذرّة متعادلة). النيوترونات = العدد الكتلي − العدد الذرّي = ٣٥ − ١٧ = ١٨.","? تحتوي نواة العنصر الافتراضي (M) على ١١ بروتوناً و١٢ نيوتروناً. اكتب هويّة العنصر (M). || العدد الذرّي = عدد البروتونات = ١١. العدد الكتلي = ١١ + ١٢ = ٢٣. الهويّة: ²³₁₁M.","? ذرّة الأكسجين عدد بروتوناتها ٨ وعدد نيوتروناتها ٨. ارسم نموذجاً لتوزيع الإلكترونات فيها. || عدد الإلكترونات = عدد البروتونات = ٨. التوزيع: ٢، ٦، أي إلكترونان في المستوى الأوّل القريب من النواة وستّة في المستوى الثاني. والعدد الكتلي = ٨ + ٨ = ١٦ فيُكتب ¹⁶₈O.","? ذرّة عنصر عددها الذرّي ١١ وعددها الكتلي ٢٣ (الصوديوم Na). كم نيوتروناً فيها وما توزيع إلكتروناتها كما في الشكل؟ || النيوترونات = ٢٣ − ١١ = ١٢. الإلكترونات = ١١ موزّعة ٢، ٨، ١ (إلكترونان ثمّ ثمانية ثمّ إلكترون واحد في المستوى الخارجي).","? ذرّة عدد نيوتروناتها ١٨ وعددها الكتلي ٢٤. ما عدد بروتوناتها؟ || العدد الكتلي = البروتونات + النيوترونات، فالبروتونات = ٢٤ − ١٨ = ٦ بروتونات.","# نشاط ٢: اشتقاق رمز العنصر","باستخدام الجدول الدوري للعناصر نحدّد موقع الهيدروجين H، ونكتب العناصر الأحد عشر التي تليه في الترتيب الأفقي: He وLi وBe وB وC وN وO وF وNe وNa وMg. ونلاحظ أنّ رموزها حروفٌ من أسمائها، فبعضها يؤخذ من حرفها الأوّل (B وC وN وO وF) وبعضها من حرفين (He وLi وBe وNe وNa).","اشتُقّت رموز العناصر من أسمائها اللاتينية أو الإنجليزية.","- العناصر المكتشفة قديماً: اشتُقّت رموزها من أسمائها اللاتينية، كالذهب والفضة.","- العناصر المكتشفة لاحقاً: اشتُقّت رموزها من أسمائها الإنجليزية، كالمغنيسيوم والكالسيوم.","# جدول أسماء بعض العناصر ورموزها","|العنصر|الاسم اللاتيني|الاسم الإنجليزي|الرمز","|ذهب|Aurum|Gold|Au","|فضة|Argentum|Silver|Ag","|حديد|Ferrum|Iron|Fe","|نحاس|Cuprum|Copper|Cu","|صوديوم|Natrium|Sodium|Na","|بوتاسيوم|Kalium|Potassium|K","|رصاص|Plumbum|Lead|Pb","|هيدروجين|—|Hydrogen|H","|أكسجين|—|Oxygen|O","|نيتروجين|—|Nitrogen|N","|كربون|—|Carbon|C","|كلور|—|Chlorine|Cl","|كالسيوم|—|Calcium|Ca","|مغنيسيوم|—|Magnesium|Mg","! الرمز: الحرف الأوّل كبير دائماً والثاني (إن وُجد) صغير، فـ Ca للكالسيوم و Cu للنحاس، ولا نكتبهما CA أو CU.","! العناصر السامّة عند وجودها في مياه الشرب: الرصاص Pb من العناصر الواردة في الجدول.","# رموز العناصر وأسماؤها","- رموز من الاسم اللاتيني: Au وAg وFe وCu وNa وK وPb.","- رموز من الاسم الإنجليزي: H وO وN وC وCl وCa وMg وHe وLi."],"q":["- ما العدد الذرّي؟ وما العدد الكتلي؟ وما القانون الذي يربطهما بعدد النيوترونات؟","- لماذا يساوي عدد الإلكترونات العدد الذرّي في الذرّة المتعادلة؟","- اذكر ثلاثة عناصر اشتُقّت رموزها من أسمائها اللاتينية، وما ترتيب الحروف في الاسم اللاتيني الذي اشتُقّ منه رمز الصوديوم والبوتاسيوم والرصاص؟","- اذكر ثلاثة عناصر اشتُقّت رموزها من أسمائها الإنجليزية.","- قارن بين رمزي الكالسيوم والنحاس من حيث رسم الحرفين الأوّل والثاني."],"quiz":[{"l":0,"k":"n","q":"ماذا يمثّل العدد الذرّي لعنصر؟","o":["عدد البروتونات في النواة","عدد النيوترونات فقط","مجموع البروتونات والنيوترونات","عدد الإلكترونات في المستوى الأخير"],"a":0},{"l":0,"k":"n","q":"ماذا يمثّل العدد الكتلي؟","o":["عدد البروتونات فقط","مجموع عدد البروتونات والنيوترونات","عدد الإلكترونات فقط","عدد مستويات الطاقة"],"a":1},{"l":0,"k":"n","q":"ما العلاقة بين العدد الذرّي وعدد الإلكترونات في الذرّة المتعادلة؟","o":["العدد الذرّي ضعف الإلكترونات","الإلكترونات أكثر بواحد","متساويان","لا علاقة بينهما"],"a":2},{"l":0,"k":"n","q":"ما الرمز الكيميائي للذهب (Gold)؟","o":["Ag","Fe","Go","Au"],"a":3},{"l":0,"k":"n","q":"ما الاسم اللاتيني للحديد؟","o":["Cuprum","Ferrum","Argentum","Aurum"],"a":1},{"l":0,"k":"n","q":"ما رمز الصوديوم؟","o":["S","So","Na","Nu"],"a":2},{"l":0,"k":"n","q":"ما الاسم الإنجليزي للعنصر الذي رمزه Pb؟","o":["Silver","Iron","Gold","Lead"],"a":3},{"l":0,"k":"n","q":"أيّ العناصر التالية اشتُقّ رمزه من اسمه الإنجليزي؟","o":["Mg (المغنيسيوم)","Au (الذهب)","Ag (الفضة)","Fe (الحديد)"],"a":0},{"l":1,"k":"p","q":"إذا كان العدد الذرّي لعنصر ٩ فكم عدد إلكترونات ذرّته المتعادلة؟","o":["١٨","٠","٤٫٥","٩"],"a":3},{"l":1,"k":"p","q":"ذرّة عددها الذرّي ٦ وعددها الكتلي ١٢. كم عدد نيوتروناتها؟","o":["٦","١٢","١٨","٠"],"a":0},{"l":1,"k":"p","q":"ما عدد النيوترونات في ³⁵₁₇Cl؟","o":["١٧","١٨","٣٥","٥٢"],"a":1},{"l":1,"k":"p","q":"ما عدد البروتونات في ³⁵₁₇Cl؟","o":["١٨","٣٥","١٧","٥٢"],"a":2},{"l":1,"k":"p","q":"ما العدد الكتلي لذرّة تحتوي على ١١ بروتوناً و١٢ نيوتروناً؟","o":["٢٣","١١","١٢","١"],"a":0},{"l":1,"k":"p","q":"أيّ العناصر التالية اشت
