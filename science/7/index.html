ذرّي."}},{"t":"مركبات مهمة في حياتنا","e":["# نشاط ١: مركّبات في حياتنا","يوجد في حياتنا كثيرٌ من المركّبات الكيميائية التي نستخدمها في مجالاتٍ متعدّدة، كالطبّ والغذاء والصيدلة والزراعة. ولنتعرّف إلى بعضها ندرس الجدول الآتي الذي يبيّن أسماءها وصيغها الجزيئية.","|المركّب|الصيغة الجزيئية|مجال الاستخدام","|الأسبرين|C₉H₈O₄|الصيدلة والطبّ","|أحد مكوّنات غاز الطبخ|C₃H₈|الطبخ (وقود)","|أحد أنواع الأسمدة الكيميائية|CO(NH₂)₂|الزراعة","|فيتامين C|C₆H₈O₆|الغذاء","|الكحول الطبّي|CH₃CH₂OH|الطبّ","|مزيل طلاء الأظافر|C₃H₆O|الاستعمال المنزلي","|سكّر المائدة|C₁₂H₂₂O₁₁|الغذاء","|ملح الطعام|NaCl|الغذاء","# الصيغة الجزيئية","- الصيغة الجزيئية: صيغةٌ للمركّب تدلّ على عدد ذرّات العناصر المكوّنة له وعلى نوعها.","- الرقم الصغير أسفل رمز العنصر (الرمز السفلي) يدلّ على عدد ذرّات ذلك العنصر في المركّب، وإذا غاب فالعدد ذرّةٌ واحدة.","- القوس في CO(NH₂)₂: الرقم ٢ خارج القوس يضاعف كلّ ما بداخله، فتوجد ذرّتا N وأربع ذرّات H.","! للعدّ: اجمع الأرقام السفلية لكلّ عنصر، وما ليس له رقمٌ فهو ١.","# قراءة صيغة مركّب (فيتامين C)","مركّب فيتامين C صيغته C₆H₈O₆. فهو يتكوّن من ثلاثة أنواع من الذرّات: الكربون C وعددها ٦ والهيدروجين H وعددها ٨ والأكسجين O وعددها ٦.","|العنصر|C|H|O","|عدد الذرّات|٦|٨|٦","# أمثلة محلولة","? حدّد عدد الذرّات المكوّنة لرابع كلوريد الكربون CCl₄ (المستخدم في التنظيف الجاف) ونوعها. || النوع: كربون C وكلور Cl (نوعان من الذرّات). العدد: ذرّة كربون واحدة (لا رقم بجانبها) وأربع ذرّات كلور. المجموع = ١ + ٤ = ٥ ذرّات.","? حدّد عدد الذرّات المكوّنة لأكسيد الكالسيوم (الشيد) CaO المستخدم في طلاء سيقان الأشجار لمكافحة بعض الآفات الزراعية. || النوع: كالسيوم Ca وأكسجين O. العدد: ذرّة كالسيوم واحدة وذرّة أكسجين واحدة. المجموع = ٢ ذرّتان.","? حدّد نوع الذرّات وعددها في فيتامين C (C₆H₈O₆). || ثلاثة أنواع: كربون ٦ وهيدروجين ٨ وأكسجين ٦. المجموع = ٦ + ٨ + ٦ = ٢٠ ذرّة.","? كم ذرّة في جزيء الأسبرين C₉H₈O₄؟ وما أنواعها؟ || الأنواع: كربون ٩ وهيدروجين ٨ وأكسجين ٤. المجموع = ٩ + ٨ + ٤ = ٢١ ذرّة.","? عدّ الذرّات في الكحول الطبّي CH₃CH₂OH. || كربون: ١ + ١ = ٢، هيدروجين: ٣ + ٢ + ١ (الأخيرة في OH) = ٦، أكسجين: ١. المجموع = ٢ + ٦ + ١ = ٩ ذرّات.","? كم ذرّة نيتروجين وهيدروجين في السماد CO(NH₂)₂؟ || الرقم ٢ بعد القوس يضاعف ما فيه: N: ١×٢ = ٢ ذرّتان، H: ٢×٢ = ٤ ذرّات. وفيه أيضاً ذرّة C وذرّة O.","# استخدامات المركّبات","- أكسيد الكالسيوم (الشيد) CaO: يُستخدم في طلاء سيقان الأشجار لمكافحة بعض الآفات الزراعية.","- رابع كلوريد الكربون CCl₄: يُستخدم في التنظيف الجاف.","- الأسبرين وفيتامين C: من المركّبات المستخدمة في الطبّ والصيدلة والغذاء.","- ملح الطعام NaCl وسكّر المائدة C₁₂H₂₂O₁₁: مركّبان نستعملهما في الغذاء.","- الأسمدة الكيميائية مثل CO(NH₂)₂: تُستخدم في الزراعة.","# تطبيق حياتي","عند استعمال مزيل طلاء الأظافر C₃H₆O أو غيره من المركّبات علينا الانتباه إلى أنّ الاستخدام المتكرّر لبعض المركّبات قد يسبّب ضرراً، فنقرأ الإرشادات ونتعامل معها بحذر."],"q":["- ما الذي تدلّ عليه الصيغة الجزيئية لمركّب ما؟","- حدّد نوع الذرّات وعددها في مركّب فيتامين C.","- اذكر استخداماً واحداً لكلٍّ من: الأسبرين، فيتامين C، ملح الطعام، أحد أنواع الأسمدة الكيميائية.","- ما عدد ذرّات الكلور في مركّب كلوريد الألمنيوم AlCl₃؟","- ما الضرر المتوقّع حدوثه من الاستخدام المتكرّر لطلاء الأظافر؟"],"quiz":[{"l":0,"k":"n","q":"عمَّ تعبّر الصيغة الجزيئية لمركّب ما؟","o":["عدد ذرّات العناصر المكوّنة له ونوعها","عدد الذرّات المكوّنة له فقط","نوع الذرّات المكوّنة له فقط","حجم الذرّات المكوّنة له"],"a":0},{"l":0,"k":"n","q":"ما الصيغة الجزيئية لملح الطعام؟","o":["CaO","NaCl","CCl₄","H₂O"],"a":1},{"l":0,"k":"n","q":"ما الصيغة الجزيئية لفيتامين C؟","o":["C₉H₈O₄","C₃H₈","C₆H₈O₆","C₁₂H₂₂O₁₁"],"a":2},{"l":0,"k":"n","q":"ما الصيغة الجزيئية لسكّر المائدة؟","o":["NaCl","C₆H₈O₆","C₃H₆O","C₁₂H₂₂O₁₁"],"a":3},{"l":0,"k":"n","q":"ما الصيغة الجزيئية للأسبرين؟","o":["C₃H₈","C₉H₈O₄","CO(NH₂)₂","CH₃CH₂OH"],"a":1},{"l":0,"k":"n","q":"أيّ المركّبات الآتية يُستخدم في التنظيف الجاف؟","o":["أكسيد الكالسيوم CaO","الأسبرين","رابع كلوريد الكربون CCl₄","ملح الطعام"],"a":2},{"l":0,"k":"n","q":"ما الاسم الشائع لأكسيد الكالسيوم CaO في الجدول؟","o":["الأسبرين","السكّر","الكحول الطبّي","الشيد"],"a":3},{"l":0,"k":"n","q":"ما الصيغة الجزيئية لمز رّات الهيدروجين في الكحول الطبّي CH₃CH₂OH؟":"عُدّ H في CH₃ ثم في CH₂ ثم H في OH.","كم عدد ذرّات الهيدروجين في السماد CO(NH₂)₂؟":"الرقم ٢ بعد القوس يضرب ما داخل القوس كلّه.","أيّ العناصر التالية لا يدخل في تركيب سكّر المائدة C₁₂H₂₂O₁₁؟":"اقرأ رموز العناصر الثلاثة الموجودة في الصيغة."}},{"t":"التفاعلات الكيميائية","e":["# نشاط ١: المواد تتغيّر","تتأثّر المواد بنوعين من التغيّرات: تغيّراتٍ فيزيائية وتغيّراتٍ كيميائية. وللتمييز بينهما ندرس صوراً: صدأ الحديد، رملاً في ماء، بيضةً مسلوقة، زبدةً سائحة، سكّراً محترقاً، وجليداً.","- التغيّر الفيزيائي: تغيّرٌ في شكل المادة دون التأثير على تركيبها الكيميائي.","- التغيّر الكيميائي: تغيّرٌ في التركيب الكيميائي للمادة، وتنتج عنه مادة أو مواد جديدة ذات خواص مختلفة.","- التفاعل الكيميائي: الاسم الذي يُطلق على التغيّر الكيميائي.","|التغيّر|نوعه|يُنتج مادةً جديدة؟","|صدأ الحديد|كيميائي|نعم","|بيضة مسلوقة|كيميائي|نعم","|سكّر محترق|كيميائي|نعم","|رمل في ماء|فيزيائي|لا","|زبدة سائحة|فيزيائي|لا","|جليد (ذوبان الجليد)|فيزيائي|لا","! المواد الجديدة تختلف كلّياً عن المواد الأصلية في التغيّر الكيميائي: صدأ الحديد وسلق البيضة واحتراق السكّر.","# المعادلة الكيميائية","يُعبَّر عن التفاعل الكيميائي بمعادلةٍ كيميائية تبيّن المواد المتفاعلة (المتفاعلات) والمواد الناتجة (النواتج)، وعواملَ مساعدة تساعد في حدوث التفاعل تسمّى ظروف التفاعل.","|الجزء|معناه|موقعه","|المواد المتفاعلة (المتفاعلات)|المواد التي تبدأ بها|قبل السهم","|العوامل المساعدة (ظروف التفاعل)|ما يساعد على حدوث التفاعل|فوق السهم أو تحته","|المواد الناتجة (النواتج)|المواد الجديدة المتكوّنة|بعد السهم","! المعادلة الكيميائية تمثّل: المواد المتفاعلة + المواد الناتجة + ظروف التفاعل.","# مثال: البناء الضوئي","المعادلة اللفظية للبناء الضوئي: الماء + ثاني أكسيد الكربون → (ضوء الشمس، مادة الكلوروفيل) → الأكسجين + سكّر الغلوكوز.","- المواد المتفاعلة: الماء وثاني أكسيد الكربون.","- المواد الناتجة: الأكسجين وسكّر الغلوكوز.","- العوامل المساعدة: ضوء الشمس ومادة الكلوروفيل.","# أمثلة محلولة","? حدّد المواد المتفاعلة والناتجة والعوامل المساعدة في معادلة البناء الضوئي. || المتفاعلة: الماء + ثاني أكسيد الكربون. الناتجة: الأكسجين + سكّر الغلوكوز. العوامل المساعدة: ضوء الشمس ومادة الكلوروفيل.","? يتحلّل الماء كهربائياً إلى مكوّناته من الأكسجين والهيدروجين. عبّر عن التفاعل بمعادلة كيميائية لفظية. || المتفاعل: الماء. الناتجان: الهيدروجين + الأكسجين. الظرف: التيّار الكهربائي. المعادلة: الماء → (تيّار كهربائي) → الهيدروجين + الأكسجين.","? صنّف إلى تغيّر فيزيائي أو كيميائي: ذوبان الجليد، صدأ الحديد، سلق بيضة. || ذوبان الجليد: فيزيائي (تغيّر حالة دون تغيّر التركيب). صدأ الحديد: كيميائي (تنتج مادة جديدة). سلق البيضة: كيميائي (تنتج مادة بخواص جديدة).","? ما الفرق بين التغيّر الفيزيائي والتغيّر الكيميائي؟ مثّل لكلٍّ منهما. || الفيزيائي يغيّر شكل المادة دون تركيبها (مثل ذوبان الزبدة). الكيميائي يغيّر التركيب وتنتج مادة جديدة (مثل صدأ الحديد).","# اختبر نفسك","? ما عدد النيوترونات في نواة ذرّة الفسفور التي عددها الذرّي ١٥ وعددها الكتلي ٣١؟ || النيوترونات = العدد الكتلي − العدد الذرّي = ٣١ − ١٥ = ١٦ نيوتروناً.","? ما عدد الإلكترونات في ذرّة الصوديوم ²³₁₁Na؟ || عدد الإلكترونات = العدد الذرّي = ١١ إلكتروناً (الذرّة متعادلة).","? فسّر علمياً: الذرّة متعادلة كهربائياً. || لأنّ عدد البروتونات الموجبة في النواة يساوي عدد الإلكترونات السالبة التي تدور حولها، فتتعادل الشحنتان.","- أصغر مكوّنات الذرّة هو الإلكترون، والصيغة الجزيئية تدلّ على عدد الذرّات المكوّنة للمركّب ونوعها."],"q":["- ما الفرق بين التغيّر الفيزيائي والتغيّر الكيميائي؟ مع مثال لكلٍّ منهما.","- ماذا نسمّي التغيّر الكيميائي؟ وكيف نعبّر عنه؟","- عبّر بمعادلةٍ لفظية عن تحلّل الماء كهربائياً إلى أكسجين وهيدروجين، مبيّناً المتفاعلات والنواتج وظروف التفاعل.","- حدّد المتفاعلات والنواتج والعوامل المساعدة في عملية البناء الضوئي.","- فسّر: الذرّة متعادلة كهربائياً."],"quiz":[{"l":0,"k":"n","q":"ماذا يُسمّى التغيّر في شكل المادة دون التأثير على تركيبها الكيميائي؟","o":["تغيّراً فيزيائياً","تغيّراً كيميائياً","تفاعلاً كيميائياً","معادلة"],"a":0},{"l":0,"k":"n","q":"ماذا يُسمّى التغيّر في التركيب الكيميائي للمادة وتنتج عنه مواد جديدة؟","o":["تغيّراً فيزيائياً","تغيّراً كيميائياً (تفاعلاً كيميائياً)","تغيّراً في الحجم فقط","ذوباناً"], زن","تحويل الوحدات","بقاء الجسم على حالته الحركية ما لم تؤثر فيه قوة محصلة"],3],[0,"الصيغة الرياضية للقانون الثاني لنيوتن:",["ق = ك ÷ ت","ق = ت ÷ ك","ق = ك × ت","ق = ك + ت"],2],[1,"قطع جسم إزاحة ٤٥ م في ٩ ث بسرعة ثابتة. ما سرعته؟",["٣٦ م/ث","٥ م/ث","٤٠٥ م/ث","٠٫٢ م/ث"],1],[1,"سيارة زادت سرعتها من ٦ م/ث إلى ٢٦ م/ث خلال ٥ ثوانٍ. ما تسارعها؟",["٤ م/ث²","٥ م/ث²","٢٠ م/ث²","١٠٠ م/ث²"],0],[0,"ماذا ينصّ القانون الثالث لنيوتن؟",["لكل قوة فعل قوة ردّ فعل مساوية لها في المقدار ومعاكسة لها في الاتجاه","القوة تساوي الكتلة × التسارع فقط","الجسم الساكن يبقى ساكناً","القوة تؤثّر في الجسم نفسه دائماً"],0],[1,"سبب ارتفاع الصاروخ إلى أعلى هو:",["الغازات المندفعة إلى الأسفل تدفعه إلى الأعلى (ردّ فعل)","الهواء فوقه أخفّ","كتلته تتلاشى","الجاذبية تتوقف"],0],[1,"أثّرت قوة ٢٠ نيوتن في عربة فتسارعت ٥ م/ث². ما كتلتها؟",["٢ كغم","٤ كغم","٥ كغم","١٠٠ كغم"],1],[0,"ما أكثر الغازات انتشاراً في الغلاف الجوي؟",["الأكسجين","بخار الماء","النيتروجين","ثاني أكسيد الكربون"],2],[0,"الطبقة التي تحمل جميع بخار الماء وتحدث فيها التقلّبات الجوية هي:",["الستراتوسفير","الميزوسفير","الإكسوسفير","التروبوسفير"],3],[1,"سبب ارتفاع درجة الحرارة في الثيرموسفير:",["جزيئاتها تمتصّ حرارة الشمس مباشرة","قربها من سطح الأرض","احتواؤها على الغيوم","كثافة الهواء العالية فيها"],0]],"lessons":[{"t":"الحركة الانتقالية","e":["# تمهيد: رحلة أسعد الصباحية","اعتاد أسعد أن يركض صباحاً من بيته إلى البقالة، ثم يعود إلى منزله حسب المسار المبيّن في الشكل: من بيت أسعد إلى النادي الرياضي ٦٠٠ م، ثم من النادي إلى المسجد (مروراً بالمدرسة) ٤٠٠ م، ثم من المسجد إلى البقالة ٣٠٠ م، ثم من البقالة إلى البيت ٥٠٠ م.","في هذه الرحلة ينتقل أسعد من مكان إلى آخر، فنقول إن حركته حركة انتقالية، ونصفها بثلاث كميات: المسافة والإزاحة والسرعة.","# المسافة والإزاحة","- المسافة: طول المسار الفعلي الذي سلكه الجسم أثناء حركته، وتُقاس بالمتر.","- الإزاحة: خط مستقيم ينطلق من نقطة البداية إلى نقطة النهاية.","- نقطة البداية: المكان الذي ينطلق منه الجسم (بيت أسعد في المثال).","- نقطة النهاية: المكان الذي يصل إليه الجسم عند توقّفه عن الحركة.","! إذا انطبقت نقطة النهاية على نقطة البداية فإن الإزاحة تساوي صفراً مهما كانت المسافة المقطوعة.","|الكمية|ماذا تمثّل|رحلة أسعد (ذهاباً وإياباً)","|المسافة|طول المسار الفعلي|٦٠٠ + ٤٠٠ + ٣٠٠ + ٥٠٠ = ١٨٠٠ م","|الإزاحة|الخط المستقيم من البداية إلى النهاية|صفر (عاد إلى بيته)","# السرعة المتوسطة والسرعة الثابتة","- السرعة المتوسطة: الإزاحة التي يقطعها الجسم في وحدة الزمن، ووحدتها م/ث.","- السرعة الثابتة: سرعة جسم يقطع إزاحات متساوية خلال أزمنة متساوية في خط مستقيم.","السرعة المتوسطة = الإزاحة ÷ الزمن، أي: ع = Δس ÷ ز، ومنها: الزمن = الإزاحة ÷ السرعة، والإزاحة = السرعة × الزمن.","! عندما يقطع الجسم المتحرّك في خط مستقيم إزاحات متساوية خلال أزمنة متساوية فإن سرعته تكون ثابتة.","# أمثلة محلولة","? أسعد قطع أجزاء المسار ٦٠٠ م و٤٠٠ م و٣٠٠ م و٥٠٠ م وعاد إلى بيته. جد المسافة التي قطعها والإزاحة. || المسافة تمثّل طول المسار الفعلي: ٦٠٠ + ٤٠٠ + ٣٠٠ + ٥٠٠ = ١٨٠٠ م. أما الإزاحة فخط مستقيم من نقطة البداية إلى النهاية، وبما أن النهاية انطبقت على البداية فالإزاحة = صفر.","? ركض أسعد من بيته إلى النادي ثم إلى المسجد وانتهى بالبقالة. جد المسافة والإزاحة. || المسافة = ٦٠٠ + ٤٠٠ + ٣٠٠ = ١٣٠٠ م (طول المسار الفعلي). الإزاحة هي الخط المستقيم من البيت (البداية) إلى البقالة (النهاية) وطوله ٥٠٠ م في اتجاه البقالة. والحركة حركة انتقالية.","? غادرت ليلى منزلها صباحاً بمسار مستقيم نحو المدرسة التي تبعد ٦٠٠ م بسرعة ثابتة ١ م/ث. ما الزمن اللازم للوصول؟ || ع = الإزاحة ÷ الزمن ← ١ = ٦٠٠ ÷ الزمن ← الزمن = ٦٠٠ ÷ ١ = ٦٠٠ ثانية = ٦٠٠ ÷ ٦٠ = ١٠ دقائق.","? قطعت سيارة ليث بطارية جافة إزاحة ١ م خلال ثانيتين، جد الزمن اللازم لتقطع ٤ م بالسرعة الثابتة نفسها. || ع = ١ ÷ ٢ = ٠٫٥ م/ث. السرعة ثابتة فتبقى ٠٫٥ م/ث: ٠٫٥ = ٤ ÷ الزمن ← الزمن = ٤ ÷ ٠٫٥ = ٨ ثوانٍ.","? ركضت ليلى عائدة من المدرسة إلى منزلها (٦٠٠ م) في دقيقتين. احسب سرعتها المتوسطة. || الزمن = ٢ × ٦٠ = ١٢٠ ث. ع = ٦٠٠ ÷ ١٢٠ = ٥ م/ث.","? سبح عبد الله في رحلة مدرسية بسرعة ٢٫٥ م/ث في خط مستقيم لمدة دقيقتين. جد إزاحته. || الزمن = ٢ × ٦٠ = ١٢٠ ث. الإزاحة = ع × ز = ٢٫٥ × ١٢٠ = ٣٠٠ م.","# تطبيقات وتأمّل","عروس البحر (حيفا) مدينة فلسطينية تاريخية على الساحل الشرقي للبحر المتوسط، وتبعد عن القدس نحو ١٥٨ كم إلى الشمال الغربي؛ وهي مثال على مسافة طويلة تحتاج إلى زمن أطول للوصول إليها.","- عند تحديد الحركة نعيّن دائماً نقطة البداية ونقطة النهاية.","- عند حساب المسافة نجمع أطوال كل أجزاء المسار الفعلي.","- عند حساب الإزاحة ننظر إلى الخط المستقيم بين البداية والنهاية فقط.","! قاعدة الحل: اكتب المعطيات، واكتب القانون ع = الإزاحة ÷ الزمن، وحوّل الدقائق إلى ثوانٍ، ثم عوّض."],"q":["- ما الفرق بين المسافة والإزاحة؟ ومتى تساوي الإزاحة صفراً؟","- اكتب قانون السرعة المتوسطة، ووحدتها، وكيف نحسب منه الزمن؟","- متى نقول إن سرعة الجسم ثابتة؟","- ركض طالب ٣٠٠ م بسرعة ثابتة ٣ م/ث. كم ثانية احتاج؟","- في رحلة أسعد (بيت ← نادٍ ← مسجد ← بقالة) ما المسافة وما الإزاحة؟"],"quiz":[{"l":0,"k":"n","q":"ما المسافة في الحركة الانتقالية؟","o":["طول المسار الفعلي الذي سلكه الجسم","الخط المستقيم بين البداية والنهاية","الزمن الذي استغرقته الحركة","التغيّر في السرعة"],"a":0},{"l":0,"k":"n","q":"ما الإزاحة؟","o":["طول المسار الفعلي كلّه","سرعة الجسم في كل لحظة","الزمن اللازم للوصول","خط مستقيم من نقطة البداية إلى نقطة النهاية"],"a":3},{"l":0,"k":"n","q":"ما وحدة قياس السرعة؟","o":["م/ث²","كغم.م/ث²","م/ث","م"],"a":2},{"l":0,"k":"n","q":"أيّ العلاقات الآتية تمثّل السرعة المتوسطة؟","o":["السرعة = الإزاحة × الزمن","السرعة = الإزاحة ÷ الزمن","السرعة = الزمن ÷ الإزاحة","السرعة = الإزاحة + الزمن"],"a":1},{"l":0,"k":"n","q":"إذا انطبقت نقطة النهاية على نقطة البداية فإن الإزاحة:","o":["تساوي المسافة","تساوي صفراً","تساوي ضعف المسافة","لا يمكن حسابها"],"a":1},{"l":0,"k":"n","q":"متى تكون سرعة الجسم ثابتة؟","o":["عندما يقطع إزاحات متساوية خلال أزمنة متساوية","عندما يقطع إزاحات مختلفة خلال أزمنة متساوية","عندما تتغيّر الإزاحة في كل ثانية","عندما يتغيّر اتجاه حركته فقط"],"a":0},{"l":0,"k":"n","q":"المسافة التي قطعها أسعد في رحلته تُحسب بجمع:","o":["الخط المستقيم بين البيت والبقالة","الأزمنة فقط","الإزاحات المتعاكسة فقط","أطوال أجزاء المسار الفعلي"],"a":3},{"l":0,"k":"n","q":"بأيّ وحدة تُقاس المسافة والإزاحة في رحلة أسعد؟","o":["الثانية","م/ث","المتر","الكيلوغرام"],"a":2},{"l":1,"k":"p","q":"ركض أسعد من بيته إلى النادي (٦٠٠ م) ثم إلى المسجد (٤٠٠ م) ثم إلى البقالة (٣٠٠ م). ما المسافة التي قطعها؟","o":["١٠٠٠ م","١٨٠٠ م","١٣٠٠ م","٥٠٠ م"],"a":2},{"l":1,"k":"p","q":"انتهى أسعد عند البقالة بعد الرحلة السابقة، وكان الخط المستقيم من بيته إلى البقالة ٥٠٠ م. ما إزاحته؟","o":["١٣٠٠ م","٥٠٠ م","صفر","١٨٠٠ م"],"a":1},{"l":1,"k":"p","q":"تقطع ليلى ٦٠٠ م بسرعة ثابتة ١ م/ث. كم دقيقة تحتاج؟","o":["١٠ دقائق","٦ دقائق","٦٠ دقيقة","١٠٠ دقيقة"],"a":0},{"l":1,"k":"p","q":"سيارة تتحرك بسرعة ثابتة ٢ م/ث. ما إزاحتها بعد ١٥ ثانية؟","o":["١٧ م","٧٫٥ م","١٣ م","٣٠ م"],"a":3},{"l":1,"k":"p","q":"قطع متنزّه إزاحة ١٢٠ م في ٤٠ ث. ما سرعته المتوسطة؟","o":["٨٠ م/ث","١٦٠ م/ث","٠٫٣٣ م/ث","٣ م/ث"],"a":3},{"l":1,"k":"p","q":"عاد أسعد إلى بيته بعد رحلة ركض كاملة. ما إزاحته الكلية؟","o":["ضعف المسافة","نصف المسافة","صفر","تساوي المسافة"],"a":2},{"l":1,"k":"p","q":"سيارة لعبة بسرعة ثابتة ٠٫٥ م/ث. كم ثانية تحتاج لتقطع ٣ م؟","o":["١٫٥ ثانية","٦ ثوانٍ","٣٫٥ ثانية","١٢ ثانية"],"a":1},{"l":1,"k":"p","q":"ركض طالب حول الملعب دورة كاملة وعاد إلى نقطة البداية. أيّ العبارات صحيحة؟","o":["المسافة أكبر من الصفر والإزاحة تساوي صفراً","المسافة صفر والإزاحة أكبر من الصفر","المسافة والإزاحة تساويان صفراً","المسافة تساوي الإزاحة دائماً"],"a":0},{"l":2,"k":"p","q":"سبح عبد الله بسرعة ثابتة ٢٫٥ م/ث في خط مستقيم لمدة دقيقتين. ما إزاحته؟","o":["٣٠٠ م","٥ م","١٥٠ م","٣٠٠٠ م"],"a":0},{"l":2,"k":"p","q":"عادت ليلى من المدرسة إلى منزلها (٦٠٠ م) في دقيقتين. ما سرعتها المتوسطة؟","o":["٠٫٢ م/ث","٣٠٠ م/ث","٥٠ م/ث","٥ م/ث"],"a":3},{"l":2,"k":"p","q":"قطعت سيارة ١٢٠٠ م بسرعة ثابتة ٤ م/ث. كم ثانية احتاجت؟","o":["٣٠ ثانية","٤٨٠٠ ثانية","٣٠٠ ثانية","٣ ثوانٍ"],"a":2},{"l":2,"k":"p","q":"عدّاء (أ) قطع ١٠٠ م في ٢٠ ث، وعدّاء (ب) قطع ١٥٠ م في ٢٥ ث في خط مستقيم. أيّهما أسرع؟","o":["(أ) لأنه قطع مسافة أقل","(ب) لأن سرعته ٦ م/ث وسرعة (أ) ٥ م/ث","متساويان في السرعة","لا يمكن المقارنة"],"a":1},{"l":2,"k":"p","q":"جسم يقطع ٣ م في كل ثانية بخط مستقيم. ما إزاحته بعد ١٠ ثوانٍ؟","o":["١٣ م","٣٠ م","٠٫٣ م","٣ م"],"a":1},{"l":2,"k":"p","q":"ذهبت ليلى إلى المدرسة (٦٠٠ م) في ١٠ دقائق وعادت في دقيقتين. بكم دقيقة كانت العودة أسرع؟","o":["٨ دقائق","١٢ دقيقة","٥ دقائق","دقيقتين"],"a":0},{"l":2,"k":"p","q":"قطعت سيارة ليث ٤ م في ٨ ث بسرعة ثابتة. ما إزاحتها بعد ١٦ ثانية بالسرعة نفسها؟","o":["٤ م","٢ م","٣٢ م","٨ م"],"a":3},{"l":2,"k":"p","q":"مشى طالب بسرعة ١٫٥ م/ث لمدة ٤٠ ث ثم عاد إلى نقطة البداية. ما إزاحته الكلية؟","o":["٦٠ م","١٢٠ م","صفر","٤٠ م"],"a":2}],"hints":{"ركض أسعد من بيته إلى النادي (٦٠٠ م) ثم إلى المسجد (٤٠٠ م) ثم إلى البقالة (٣٠٠ م). ما المسافة التي قطعها؟":"اجمع أطوال الأجزاء الثلاثة التي سلكها فعلاً.","تقطع ليلى ٦٠٠ م بسرعة ثابتة ١ م/ث. كم دقيقة تحتاج؟":"الزمن = الإزاحة ÷ السرعة، ثم قسّم الثواني على ٦٠.","سبح عبد الله بسرعة ثابتة ٢٫٥ م/ث في خط مستقيم لمدة دقيقتين. ما إزاحته؟":"حوّل الدقيقتين إلى ثوانٍ أولاً ثم اضرب في السرعة.","عدّاء (أ) قطع ١٠٠ م في ٢٠ ث، وعدّاء (ب) قطع ١٥٠ م في ٢٥ ث في خط مستقيم. أيّهما أسرع؟":"احسب سرعة كل عدّاء بقسمة الإزاحة على الزمن ثم قارن."}},{"t":"التسارع الثابت","e":["# نشاط ١: رحلة إلى الساحل","ركب إياد بجوار والده في رحلة إلى الساحل الفلسطيني، وفي بداية الرحلة بدأ بتصوير فيلم فيديو لعداد السرعة، ونقل البيانات إلى لوحة رسم فيها السيارة كما في الشكل: عند اللحظة صفر السرعة ٠ م/ث، وبعد ١ ثانية ٣ م/ث، وبعد ٢ ثانية ٦ م/ث، وبعد ٣ ثوانٍ ٩ م/ث، وبعد ٤ ثوانٍ ١٢ م/ث.","|الزمن (ث)|٠|١|٢|٣|٤","|السرعة (م/ث)|٠|٣|٦|٩|١٢","- التغيّر في السرعة خلال الثانية الأولى (من ٠ إلى ١ ث) = ٣ − ٠ = ٣ م/ث.","- النسبة بين التغيّر في السرعة والتغيّر في الزمن = ٣ ÷ ١ = ٣ م/ث².","- التغيّر في السرعة خلال الفترة من ٠ إلى ٤ ث = ١٢ − ٠ = ١٢ م/ث، والنسبة = ١٢ ÷ ٤ = ٣ م/ث².","- سرعة السيارة ليست ثابتة، بل تتزايد؛ والنسبتان متساويتان (٣ = ٣)، أي أن السرعة تزداد بمقدار متساوٍ كل ثانية.","# مفهوم التسارع وقانونه","- التسارع: الكمية الفيزيائية الناتجة عن حساب النسبة بين التغيّر في السرعة والتغيّر في الزمن، ووحدة قياسه م/ث².","- Δز (التغيّر في الزمن): الفترة الزمنية التي حدث خلالها التغيّر في السرعة.","- ع١: السرعة الابتدائية، و ع٢: السرعة النهائية.","التسارع (ت) = التغيّر في السرعة (Δع) ÷ التغيّر في الزمن (Δز)، أي: ت = (ع٢ − ع١) ÷ Δز.","! التسارع الثابت يعني أن السرعة تتغيّر بمقدار متساوٍ في كل ثانية؛ ففي نشاط إياد التسارع ٣ م/ث².","! من القانون: Δز = (ع٢ − ع١) ÷ ت، والتغيّر في السرعة = ت × Δز.","# أمثلة محلولة","? سيارة سباق تتزايد سرعتها من ٤ م/ث إلى ٣٦ م/ث خلال فترة زمنية مقدارها ٤ ثوانٍ، فما تسارعها؟ || ت = (ع٢ − ع١) ÷ Δز = (٣٦ − ٤) ÷ ٤ = ٣٢ ÷ ٤ = ٨ م/ث².","? تدحرجت كرة بسرعة ابتدائية ٥ م/ث على سطح مائل لأسفل بتسارع ٣ م/ث². احسب الزمن اللازم حتى تصبح سرعتها ٢٠ م/ث. || ت = (ع٢ − ع١) ÷ Δز ← ٣ = (٢٠ − ٥) ÷ Δز ← ٣ × Δز = ١٥ ← Δز = ٥ ثوانٍ.","? سيارة تحركت من السكون وبعد ٥ ثوانٍ بلغت سرعتها ٢٠ م/ث. ما تسارعها؟ || ع١ = ٠ ، ع٢ = ٢٠ ، Δز = ٥ ← ت = (٢٠ − ٠) ÷ ٥ = ٤ م/ث².","? سيارة سرعتها ١٠ م/ث وتتسارع بمقدار ٢ م/ث². ما سرعتها بعد ٦ ثوانٍ؟ || التغيّر في السرعة = ت × Δز = ٢ × ٦ = ١٢ م/ث، فتصبح ع٢ = ١٠ + ١٢ = ٢٢ م/ث.","# تحليل جدول نور","ركبت نور في المقعد الأمامي ودوّنت قراءات العداد منذ لحظة انطلاق السيارة من السكون في خط أفقي مستقيم.","|الزمن (ث)|٠|١|٢|٣|٤|٥|٦","|السرعة (كم/س)|٠|١٨|٣٦|٥٤|٧٢|٣٦|٠","|السرعة (م/ث)|٠|٥|١٠|١٥|٢٠|١٠|٠","? أكمل الصف الثاني، وجد تسارع السيارة في الثانيتين الأوليين ثم في الثانيتين الأخيرتين. || من الصف الأول: ١٨ كم/س = ٥ م/ث، ٣٦ كم/س = ١٠ م/ث، ٥٤ كم/س = ١٥ م/ث، ٧٢ كم/س = ٢٠ م/ث، وعند الثانية الخامسة ٣٦ كم/س = ١٠ م/ث. أول ثانيتين: ت = (١٠ − ٠) ÷ ٢ = ٥ م/ث². آخر ثانيتين (من ٤ إلى ٦): ت = (٠ − ٢٠) ÷ ٢ = −١٠ م/ث²؛ الإشارة السالبة تعني أن السرعة تتناقص.","- كان السائق يدوس على دواسة الفرامل (الكوابح) في الفترة من الثانية ٤ إلى الثانية ٦ لأن السرعة تتناقص حتى تقف.","- وصف الحركة: تتسارع السيارة بانتظام ٥ م/ث² في الثواني الأربع الأولى حتى ٢٠ م/ث، ثم تتباطأ حتى تتوقف عند الثانية ٦.","# متى تتزايد السرعة؟","- تتزايد السرعة عند الضغط على دواسة البنزين في السيارة المتحركة.","- تتزايد السرعة عند سقوط جسم من قمة برج نحو الأرض.","- تتزايد سرعة عدّاء في بداية سباق المئة متر عندما ينطلق من السكون.","- تتناقص السرعة عند تدحرج كرة على أرض الغرفة ثم توقفها.","! إذا ازدادت السرعة فالتسارع موجب، وإذا نقصت (تباطؤ) فالتسارع سالب."],"q":["- عرّف التسارع واكتب قانونه ووحدته.","- في نش لزمن.","ما تسارع سيارة نور خلال الثانيتين الأوليتين (من ٠ إلى ١٠ م/ث)؟":"التغيّر في السرعة ١٠ م/ث خلال ثانيتين.","سيارة تحركت من السكون بتسارع ٢ م/ث². ما سرعتها بعد ٩ ثوانٍ؟":"التغيّر في السرعة = ت × Δز.","السيارة (أ) زادت سرعتها من صفر إلى ٢٠ م/ث في ٤ ث، والسيارة (ب) من صفر إلى ٢٤ م/ث في ٨ ث. أيّهما تسارعها أكبر؟":"احسب تسارع كلٍّ منهما ثم قارن بين القيمتين."}},{"t":"القانون الأول لنيوتن","e":["# نشاط ١: حالتي الحركية تتغيّر","المواد والأدوات: كتاب، وكرة، وطاولة خشبية ملساء.","- نضع الكرة والكتاب على سطح الطاولة ونتركهما فترة من الزمن: لا يتحرك أيّ منهما من تلقاء نفسه.","- نؤثر بقوة دفع على الكتاب ثم بقوة سحب عليه: يتحرك الكتاب في اتجاه القوة المؤثرة.","- لتتحرك الكرة يجب أن نؤثر فيها بقوة (دفع أو سحب) ثم نراقب حركتها.","- لزيادة سرعة كرة متحركة نؤثر فيها بقوة في اتجاه حركتها، ولإنقاص سرعتها نؤثر بقوة في عكس اتجاه حركتها.","- لتغيير اتجاه حركة الكرة نؤثر فيها بقوة جانبية تغيّر اتجاهها.","! القوة هي ما يغيّر الحالة الحركية للجسم: تحرّك الجسم الساكن، أو تغيّر سرعته أو اتجاهه.","# نشاط ٢: القصور الذاتي للأجسام","المواد والأدوات: سيارة لعبة أطفال، وحجر صغير، وكتاب.","- نضع الحجر على سطح السيارة، ثم نجعل السيارة تسير مسافة ما حتى تصطدم بالكتاب الموضوع أمامها.","- نلاحظ أن السيارة تتوقف عند اصطدامها بالكتاب، لكن الحجر يستمر في حركته إلى الأمام.","- التفسير: الحجر يقاوم تغيير حالته الحركية؛ فلم تؤثر فيه قوة محصلة توقفه، فبقي متحركاً.","# نص القانون الأول لنيوتن","ينصّ القانون الأول (لنيوتن) على: «يبقى الجسم على حالته من حيث السكون أو الحركة ما لم تؤثر فيه قوة محصلة تغيّر من مقدار سرعته أو اتجاهها أو كليهما».","- القصور الذاتي: عجز الجسم عن تغيير حالته الحركية من تلقاء نفسه وممانعته لأي مؤثر خارجي.","- قانون القصور الذاتي: الاسم الآخر للقانون الأول لنيوتن.","- القوة المحصلة: القوة التي تغيّر مقدار سرعة الجسم أو اتجاهها أو كليهما.","- الحالة الحركية: سكون الجسم أو حركته بسرعة معيّنة في اتجاه معيّن.","! الجسم الساكن يبقى ساكناً، والجسم المتحرك بسرعة ثابتة في خط مستقيم يبقى كذلك، ما دامت القوة المحصلة المؤثرة فيه صفراً.","# أمثلة وتطبيقات","? كتاب ساكن على طاولة ملساء ولا تؤثر فيه قوة محصلة. ماذا يحدث له؟ || حسب القانون الأول يبقى ساكناً ولا يتحرك من تلقاء نفسه، ولا يتحرك إلا إذا أثّرنا فيه بقوة دفع أو سحب.","? كرة تتحرك بسرعة ثابتة في خط مستقيم ولا تؤثر فيها قوة محصلة. ماذا تتوقع؟ || تبقى على حالتها الحركية: تستمر في الحركة بالسرعة نفسها وفي الاتجاه نفسه.","? في نشاط ٢ توقفت سيارة اللعبة عند الكتاب واستمر الحجر في حركته. فسّر ذلك. || الحجر له قصور ذاتي: يمانع تغيير حالته الحركية، ولم تؤثر فيه قوة محصلة توقفه، فيستمر في الحركة إلى الأمام.","? جسم تغيّرت سرعته من ٥ م/ث إلى ٨ م/ث. ماذا نستنتج حسب القانون الأول؟ || السرعة تغيّرت إذن أثّرت في الجسم قوة محصلة، لأن الجسم لا يغيّر سرعته من تلقاء نفسه.","- لماذا يبقى الكتاب ساكناً على الطاولة رغم وجود وزنه؟ لأن تأثير السطح الأفقي يوازن تأثير الوزن فتكون القوة المحصلة صفراً.","- لتغيير حالة جسم حركيّة نحتاج إلى قوة محصلة: لتحريكه، أو لزيادة سرعته، أو لإنقاصها، أو لتغيير اتجاهه."],"q":["- اذكر نص القانون الأول لنيوتن بأسلوبك.","- ما المقصود بالقصور الذاتي؟ ولماذا يُسمّى القانون الأول بقانون القصور الذاتي؟","- كيف نزيد سرعة كرة متحركة؟ وكيف نغيّر اتجاهها؟","- فسّر ما يحدث للحجر على سيارة اللعبة عند اصطدامها بالكتاب.","- متى يبقى الجسم متحركاً بسرعة ثابتة في خط مستقيم؟"],"quiz":[{"l":0,"k":"n","q":"أيّ العبارات تمثّل القانون الأول لنيوتن؟","o":["يبقى الجسم على حالته من السكون أو الحركة ما لم تؤثر فيه قوة محصلة","يتناسب التسارع طردياً مع القوة وعكسياً مع الكتلة دائماً","لكل فعل رد فعل مساوٍ له في المقدار","السرعة = الإزاحة ÷ الزمن"],"a":0},{"l":0,"k":"n","q":"ما الاسم الآخر للقانون الأول لنيوتن؟","o":["قانون التسارع","قانون السرعة","قانون الإزاحة","قانون القصور الذاتي"],"a":3},{"l":0,"k":"n","q":"ما المقصود بالقصور الذاتي؟","o":["قدرة الجسم على زيادة سرعته وحده","وزن الجسم","عجز الجسم عن تغيير حالته الحركية من تلقاء نفسه","طول مسار الجسم"],"a":2},{"l":0,"k":"n","q":"من العالم الذي ينسب إليه القانون الأول للحركة؟","o":["أمبير","نيوتن","كولوم","أرخميدس"],"a":1},{"l":0,"k":"n","q":"الكتاب الساكن على الطاولة الملساء لا يتحرك من تلقاء نفسه لأنه:","o":["لا يملك كتلة","لا تؤثر فيه قوة محصلة","يملك سرعة كبي  قوة محصلة. ما إزاحته بعد ٤ ثوانٍ؟":"الإزاحة = السرعة × الزمن لأن السرعة ثابتة."}},{"t":"القانون الثاني لنيوتن","e":["# نشاط ١: العلاقة بين القوة المؤثرة وكتلة الجسم","المواد والأدوات: ثلاث كرات مختلفة في كتلتها، ومسطرتان في وسطهما مجرى، ومكعب خشب كتلته مناسبة للاستجابة بالحركة للقوى المؤثرة عليه، ومكعبات مختلفة الارتفاع لاستخدام المسطرة كسطح مائل.","- نصنّف الكرات الثلاث حسب كتلتها تصاعدياً (١، ٢، ٣)، ونستخدم مسطرة كسطح مائل ونضع مكعب الخشب عند نهاية الطرف السفلي.","- نمسك كل كرة على حدة في أعلى المستوى المائل ونتركها لتنزلق حتى تصطدم بمكعب الخشب، ثم نقيس المسافة التي يتحركها المكعب في كل حالة.","- مع ثبات ميل المستوى يكون تسارع الكرة ثابتاً، ولكن بزيادة كتلتها تزداد القوة المؤثرة فيها، فتزداد الإزاحة الحاصلة للمكعب.","|رقم الكرة|الكتلة|المسافة التي يتحركها المكعب","|الكرة ١|الأصغر|الأقل","|الكرة ٣|الأكبر|الأكبر","! كلما زادت كتلة الكرة (عند ثبات الميل) زادت القوة المؤثرة في المكعب فزادت المسافة التي يتحركها.","# الوزن والسقوط الحر","- الوزن (و): قوة تجذب بها الكرة الأرضية أي جسم له كتلة، ويُحسب من العلاقة و = ك × ج.","- تسارع السقوط الحر (ج): التسارع الثابت الذي يكتسبه الجسم الساقط سقوطاً حراً، ويساوي تقريباً ١٠ م/ث².","عندما يتحرك الجسم على سطح أفقي فإنه يتحرك بخط مستقيم وبسرعة ثابتة، لأن تأثير السطح الأفقي يوازن تأثير الوزن على الجسم.","إذا تحرك الجسم على مستوى مائل أملس فإنه يتسارع ويزداد تسارعه تدريجياً بزيادة ميل المستوى، إلى أن يصل إلى تسارع السقوط الحر عندما تصبح زاوية ميل المستوى ٩٠°.","# نشاط ٢: العلاقة بين القوة المؤثرة في جسم وتسارعه","- نمسك الكرة (٢) في أعلى المستوى المائل ونتركها تنزلق حتى تصطدم بمكعب الخشب ونقيس المسافة التي يتحركها.","- نزيد ميل المسطرة (أ، ب، ج) ونكرر القياس في كل مرة.","- زيادة ميل المستوى تزيد تسارع الكرة، فتزداد سرعتها قبل التصادم، وتزداد القوة المؤثرة في المكعب الخشبي، فتزداد المسافة التي يتحركها على السطح الأفقي.","! كلما زاد الميل زاد التسارع وزادت القوة المؤثرة في المكعب فزادت المسافة التي يتحركها.","# القانون الثاني لنيوتن وصيغته","قام العالم إسحق نيوتن (١٦٤٣–١٧٢٧م) بتجارب توصّل من خلالها إلى قانونه الثاني، ونصّه: «إذا أثّرت قوة محصلة في جسم ما، فإنها تكسبه تسارعاً يتناسب طردياً مع مقدارها ويكون باتجاهها».","الصيغة الرياضية للقانون الثاني: ق المحصلة = ك × ت، أي القوة المحصلة (نيوتن) = الكتلة (كغم) × التسارع (م/ث²).","|الكمية الفيزيائية|الكتلة|التسارع|القوة","|وحدة قياسها|كغم|م/ث²|كغم.م/ث² (نيوتن)","- النيوتن: وحدة قياس القوة (كغم.م/ث²) تكريماً للعالم إسحق نيوتن، وهو القوة اللازمة لإكساب جسم كتلته ١ كغم تسارعاً مقداره ١ م/ث².","! من القانون: ك = ق ÷ ت ، وت = ق ÷ ك ، وق = ك × ت.","# أمثلة محلولة","? أثّرت قوة مقدارها ٢٠ نيوتن في جسم ساكن فأكسبته تسارعاً مقداره ١٠ م/ث². احسب كتلة الجسم. || المعطيات: ق = ٢٠ نيوتن، ت = ١٠ م/ث². ق = ك × ت ← ٢٠ = ك × ١٠ ← ك = ٢٠ ÷ ١٠ = ٢ كغم.","? تتعلم سوسن التزلج على الجليد في جبل الشيخ، ويساعدها والدها بأن يسحبها فتكتسب تسارعاً ٠٫٨ م/ث². إذا كانت كتلتها ٣٠ كغم فما مقدار قوة السحب المؤثرة فيها مع إهمال المقاومة بين الجليد وحذاء التزلج؟ || ق = ك × ت = ٣٠ × ٠٫٨ = ٢٤ نيوتن.","? أثّرت قوة محصلة ٣٠ نيوتن في جسم كتلته ٦ كغم. ما تسارعه؟ || ت = ق ÷ ك = ٣٠ ÷ ٦ = ٥ م/ث².","? ما وزن جسم كتلته ٥ كغم إذا اعتبرنا ج = ١٠ م/ث²؟ || و = ك × ج = ٥ × ١٠ = ٥٠ نيوتن.","? جسم كتلته ٤ كغم أثّرت فيه قوة محصلة ١٢ نيوتن، فما تسارعه؟ وإذا ضاعفنا القوة إلى ٢٤ نيوتن فكم يصبح؟ || ت = ١٢ ÷ ٤ = ٣ م/ث²، وبعد مضاعفة القوة ت = ٢٤ ÷ ٤ = ٦ م/ث²؛ أي يتضاعف التسارع بتضاعف القوة (علاقة طردية).","# تطبيقات وتلخيص","- القوة المحصلة وتسارع الجسم: علاقة طردية؛ كلما زادت القوة زاد التسارع.","- كلما كانت القوة المؤثرة أكبر في الاتجاه نفسه ازدادت سرعة الجسم أسرع.","- عند حل المسائل: اكتب المعطيات والمطلوب ثم القانون ق = ك × ت وعوّض بالوحدات الدولية (كغم، م/ث²، نيوتن).","! وزن الجسم قوة (تُقاس بالنيوتن)، أما كتلته فتُقاس بالكيلوغرام."],"q":["- اذكر نص القانون الثاني لنيوتن وصيغته الرياضية.","- ما النيوتن؟ ومن أيّ وحدات يتكوّن؟","- أثّرت قوة ٢٠ نيوتن في جسم فأكسبته تسارعاً ١٠ م/ث². ما كتلته؟","- احسب وزن جسم كتلته ٧ كغم (ج = ١٠ م/ث²).","- لماذا تزداد المسافة التي يتحركها المكعب عند زيادة ميل المسطرة؟"],"quiz":[{"l":0,"k":"n","q":"ما الصيغة الرياضية للقانون الثاني لنيوتن؟","o":["ق = ك × ت","ق = ك ÷ ت","ق = ت ÷ ك","ق = ك + ت"],"a":0},{"l":0,"k":"n","q":"ما وحدة قياس القوة؟","o":["م/ث²","كغم","م/ث","نيوتن (كغم.م/ث²)"],"a":3},{"l":0,"k":"n","q":"ما القوة اللازمة لإكساب جسم كتلته ١ كغم تسارعاً ١ م/ث²؟","o":["١٠ نيوتن","٠٫١ نيوتن","١ نيوتن","١٠٠ نيوتن"],"a":2},{"l":0,"k":"n","q":"ينصّ القانون الثاني لنيوتن على أن التسارع الذي تكسبه القوة المحصلة لجسم:","o":["يتناسب عكسياً مع مقدارها","يتناسب طردياً مع مقدارها ويكون باتجاهها","لا يعتمد على مقدارها","يكون عكس اتجاهها"],"a":1},{"l":0,"k":"n","q":"ما العلاقة التي تحسب وزن الجسم؟","o":["و = ك ÷ ج","و = ك × ج","و = ج ÷ ك","و = ك + ج"],"a":1},{"l":0,"k":"n","q":"كم تساوي قيمة تسارع السقوط الحر تقريباً؟","o":["١٠ م/ث²","١ م/ث²","٢٠ م/ث²","١٠٠ م/ث²"],"a":0},{"l":0,"k":"n","q":"ما وحدة قياس الكتلة في النظام الدولي؟","o":["نيوتن","م/ث²","م","كغم"],"a":3},{"l":0,"k":"n","q":"من العالم صاحب القانون الثاني للحركة؟","o":["أندريه أمبير","تشارلز كولوم","إسحق نيوتن","غاليليو"],"a":2},{"l":1,"k":"p","q":"أثّرت قوة محصلة ٣٠ نيوتن في جسم كتلته ٦ كغم. ما تسارعه؟","o":["٢٠٠ م/ث²","٠٫٢ م/ث²","٥ م/ث²","٣٦ م/ث²"],"a":2},{"l":1,"k":"p","q":"ما القوة المحصلة اللازمة لإكساب جسم كتلته ٦ كغم تسارعاً ٢ م/ث²؟","o":["٣ نيوتن","١٢ نيوتن","٨ نيوتن","٤ نيوتن"],"a":1},{"l":1,"k":"p","q":"ما وزن جسم كتلته ٤ كغم إذا كان ج = ١٠ م/ث²؟","o":["٤٠ نيوتن","٤ نيوتن","٠٫٤ نيوتن","١٤ نيوتن"],"a":0},{"l":1,"k":"p","q":"أثّرت قوة ٢٤ نيوتن في جسم فأكسبته تسارعاً ٣ م/ث². ما كتلته؟","o":["٧٢ كغم","٢١ كغم","٠٫١٢٥ كغم","٨ كغم"],"a":3},{"l":1,"k":"p","q":"في نشاط الكرات الثلاث على المستوى المائل، لماذا حرّكت الكرة الأكبر كتلة المكعب مسافة أكبر؟","o":["لأن الميل نقص","لأن الكرة أبطأ","لأن المكعب أخفّ فقط","لأن القوة المؤثرة في المكعب كانت أكبر"],"a":3},{"l":1,"k":"p","q":"عند زيادة ميل المسطرة في نشاط ٢ ماذا يحدث لتسارع الكرة؟","o":["يقلّ","يبقى صفراً","يزداد","لا يتأثر"],"a":2},{"l":1,"k":"p","q":"لماذا يتحرك الجسم على سطح أفقي بسرعة ثابتة في خط مستقيم؟","o":["لأن وزنه صفر","لأن تأثير السطح الأفقي يوازن تأثير الوزن","لأن الجاذبية معدومة","لأن كتلته كبيرة"],"a":1},{"l":1,"k":"p","q":"إذا تضاعفت القوة المحصلة المؤثرة في جسم مع ثبات كتلته فإن تسارعه:","o":["يتضاعف","ينصف","يبقى ثابتاً","يصبح صفراً"],"a":0},{"l":2,"k":"p","q":"وزن جسم ٦٠ نيوتن، وتسارع السقوط الحر ١٠ م/ث². ما كتلته؟","o":["٦ كغم","٦٠٠ كغم","٥٠ كغم","٠٫١٧ كغم"],"a":0},{"l":2,"k":"p","q":"سقط جسم من السكون سقوطاً حراً (ج = ١٠ م/ث²). ما سرعته بعد ٣ ثوانٍ؟","o":["١٠ م/ث","٣٣٫٣ م/ث","١٣ م/ث","٣٠ م/ث"],"a":3},{"l":2,"k":"p","q":"تتزلج سوسن (٣٠ كغم) فتكتسب تسارعاً ٠٫٨ م/ث². ما قوة السحب (مع إهمال المقاومة)؟","o":["٣٧٫٥ نيوتن","٣٠٫٨ نيوتن","٢٤ نيوتن","٢٩ نيوتن"],"a":2},{"l":2,"k":"p","q":"أثّرت القوة نفسها ١٢ نيوتن في جسم كتلته ٣ كغم ثم في جسم كتلته ٦ كغم. كم يصبح التسارع في الحالة الثانية؟","o":["٤ م/ث²","٢ م/ث²","٨ م/ث²","٠٫٥ م/ث²"],"a":1},{"l":2,"k":"p","q":"أثّرت قوة محصلة ٢٥ نيوتن في جسم كتلته ٥ كغم بدأ من السكون. ما سرعته بعد ثانيتين؟","o":["٥ م/ث","١٠ م/ث","٢٥ م/ث","١٢٫٥ م/ث"],"a":1},{"l":2,"k":"p","q":"أثّرت قوة ٨ نيوتن في جسمين: كتلة الأول ٢ كغم والثاني ٤ كغم. ماذا نستنتج؟","o":["تسارع الأول ٤ م/ث² وهو ضعف تسارع الثاني ٢ م/ث²","تسارعهما متساويان","تسارع الثاني ٨ م/ث²","تسارع الأول ١٦ م/ث²"],"a":0},{"l":2,"k":"p","q":"ما التسارع الذي تصل إليه الكرة عندما تصبح زاوية ميل المستوى ٩٠°؟","o":["صفر","٥ م/ث²","٣٠ م/ث²","تسارع السقوط الحر ≈ ١٠ م/ث²"],"a":3},{"l":2,"k":"p","q":"جسم كتلته ٣ كغم يسقط سقوطاً حراً (ج = ١٠). ما وزنه؟","o":["٣ نيوتن","١٣ نيوتن","٣٠ نيوتن","٠٫٣ نيوتن"],"a":2}],"hints":{"أثّرت قوة محصلة ٣٠ نيوتن في جسم كتلته ٦ كغم. ما تسارعه؟":"التسارع = القوة ÷ الكتلة.","أثّرت قوة ٢٤ نيوتن في جسم فأكسبته تسارعاً ٣ م/ث². ما كتلته؟":"الكتلة = القوة ÷ التسارع.","وزن جسم ٦٠ نيوتن، وتسارع السقوط الحر ١٠ م/ث². ما كتلته؟":"و = ك × ج، فالكتلة = الوزن ÷ ج.","سقط جسم من السكون سقوطاً حراً (ج = ١٠ م/ث²). ما سرعته بعد ٣ ثوانٍ؟":"التغيّر في السرعة = ت × Δز.","أثّرت قوة محصلة ٢٥ نيوتن في جسم كتلته ٥ كغم بدأ من السكون. ما سرعته بعد ثانيتين؟":"احسب التسارع أولاً ثم التغيّر في السرعة."}},{"t":"القانون الثالث لنيوتن","e":["# نشاط ١: الصاروخ (البالون المنطلق)","المواد والأدوات: خيط، وشريط لاصق، ومشبك معدني، وبالون، وماصّة، وقطعة سلك رفيع.","- ندخل الخيط داخل الماصّة بواسطة السلك، ثم نثبّت الماصّة بالبالون جيداً بالشريط اللاصق.","- نثبّت أحد طرفي الخيط في نقطة تعليق ثابتة ونمسك الطرف الآخر.","- ننفخ البالون ثم نُحكم إغلاق فوهته جيداً بالمشبك.","- ننزع المشبك بسرعة ونسجّل ملاحظاتنا عن اتجاه اندفاع الهواء واتجاه حركة البالون.","- الهواء يندفع خارجاً من فوهة البالون في اتجاه، والبالون نفسه يندفع في الاتجاه المعاكس تماماً.","! قوة الفعل هي خروج الهواء من البالون، وردّ الفعل هو اندفاع البالون في الاتجاه المعاكس.","# القانون الثالث لنيوتن","عندما يؤثّر جسم بقوة في جسم آخر فإن الجسم الآخر لا بدّ أن يؤثّر فيه بقوة أخرى مساوية لقوة الجسم الأول في المقدار ومعاكسة لها في الاتجاه. وتؤثّر كل قوة في جسم يختلف عن الجسم الذي تؤثّر فيه القوة الأخرى، بحيث لا تلغي أيٌّ من القوتين تأثير القوة الأخرى.","- القانون الثالث لنيوتن: لكلّ قوة فعل قوة ردّ فعل مساوية لها في المقدار ومعاكسة لها في الاتجاه.","- قوة الفعل: القوة التي يؤثّر بها الجسم الأول في الجسم الثاني.","- قوة ردّ الفعل: القوة التي يؤثّر بها الجسم الثاني في الجسم الأول، وهي مساوية للفعل في المقدار ومعاكسة له في الاتجاه.","- الصاروخ والبالون: الغازات أو الهواء تُدفع إلى الأسفل (أو إلى الخلف) فيندفع الجسم إلى الأعلى (أو إلى الأمام).","! لا تُلغي قوتا الفعل وردّ الفعل إحداهما الأخرى، لأنهما تؤثّران في جسمين مختلفين.","# أزواج الفعل وردّ الفعل (أمثلة)","|الموقف|قوة الفعل|قوة ردّ الفعل","|البالون المنطلق|البالون يدفع الهواء إلى الخارج|الهواء يدفع البالون في الاتجاه المعاكس","|ارتفاع الصاروخ|الصاروخ يدفع الغازات إلى الأسفل|الغازات تدفع الصاروخ إلى الأعلى","|رجل يدفع فيلاً على مزلاجتين|الرجل يدفع الفيل بقوة ق|الفيل يدفع الرجل بقوة مساوية ومعاكسة","|تصادم شاحنة بسيارة|الشاحنة تؤثّر في السيارة بقوة|السيارة تؤثّر في الشاحنة بقوة مساوية ومعاكسة","# الفيل والرجل والتصادم","يقف رجل وفيل على مزلاجتين في حالة سكون، فيدفع الرجل الفيل بقوة مقدارها ق. القوة المؤثّرة في الفيل تساوي القوة المؤثّرة في الرجل مقداراً وتعاكسها اتجاهاً. ومع تساوي القوتين فإن التسارع يختلف بسبب اختلاف الكتلة، لأن ق = ك × ت.","وعند اصطدام شاحنة كبيرة بسيارة صغيرة تكون القوة المؤثّرة في كل منهما متساوية في المقدار، لكن تسارع السيارة الصغيرة أكبر لأن كتلتها أقل.","! التسارع = القوة ÷ الكتلة: بالقوة نفسها يتسارع الجسم الأخفّ أكثر من الجسم الأثقل.","# مسائل محلولة","? أثّرت قوة مقدارها ٢٠ نيوتن في عربة فأكسبتها تسارعاً مقداره ٥ م/ث². ما كتلة العربة؟ || ق = ك × ت، فإن ك = ق ÷ ت = ٢٠ ÷ ٥ = ٤ كغم. الجواب: ٤ كغم.","? عربة كتلتها ٢ كغم تتحرّك بتسارع ٢ م/ث². ما مقدار القوة المؤثّرة فيها؟ || ق = ك × ت = ٢ × ٢ = ٤ نيوتن. الجواب: ٤ نيوتن.","? كتلة الفيل ١٠ أضعاف كتلة الرجل. إذا تسارع الرجل بمقدار ١٠ م/ث² فما تسارع الفيل؟ || نفرض كتلة الرجل ك، فكتلة الفيل ١٠ك. القوة المؤثّرة في الرجل = ك × ١٠ = ١٠ك. القوة المؤثّرة في الفيل مساوية لها = ١٠ك. تسارع الفيل = ١٠ك ÷ ١٠ك = ١ م/ث². الجواب: ١ م/ث².","? أثّرت قوة مقدارها ١٠ نيوتن في جسم كتلته ٥ كغم. ما تسارعه؟ || ت = ق ÷ ك = ١٠ ÷ ٥ = ٢ م/ث². الجواب: ٢ م/ث².","? سيارة تحرّكت من السكون فوصلت سرعتها بعد ٣ ثوانٍ إلى ١٢ م/ث. ما تسارعها؟ || ت = (السرعة النهائية − السرعة الابتدائية) ÷ الزمن = (١٢ − ٠) ÷ ٣ = ٤ م/ث². الجواب: ٤ م/ث².","? جسم يتحرّك بسرعة ٢٠ م/ث أثّرت فيه قوة فتوقّف خلال ٤ ثوانٍ. ما تسارعه؟ || ت = (٠ − ٢٠) ÷ ٤ = −٥ م/ث². الإشارة السالبة تعني أن الجسم يتباطأ (تسارع سالب). الجواب: −٥ م/ث².","# تذكّر من الوحدة (القوة والتسارع)","- وحدة القوة: نيوتن = كغم.م/ث² (كغم × م/ث²).","- التسارع: التغيّر في السرعة في وحدة الزمن، ويُقاس بوحدة م/ث².","- سيارة تتحرّك بسرعة ٢٠ م/ث تعني أنها تقطع مسافة ٢٠ م في كل ثانية.","! عند تعليل ارتفاع الصاروخ قل: الصاروخ يدفع الغازات إلى الأسفل (فعل) فتدفعه الغازات إلى الأعلى (ردّ فعل)."],"q":["- اذكر نصّ القانون الثالث لنيوتن.","- في نشاط البالون، ما اتجاه اندفاع الهواء؟ وما اتجاه حركة البالون؟ ولماذا؟","- فسّر ارتفاع الصاروخ إلى أعلى في الهواء.","- لماذا لا تلغي قوة الفعل وقوة ردّ الفعل إحداهما الأخرى؟","- رجل وفيل يقفان على مزلاجتين، دفع الرجل الفيل. قارن بين القوتين المؤثّرتين فيهما من حيث المقدار والاتجاه."],"quiz":[{"l":0,"k":"n","q":"ماذا ينصّ القانون الثالث لنيوتن؟","o":["لكلّ قوة فعل قوة ردّ فعل مساوية لها في المقدار ومعاكسة لها في الاتجاه","القوة تساوي الكتلة  ومعاكسة لها في الاتجاه"],"a":3},{"l":1,"k":"p","q":"اصطدمت شاحنة كبيرة بسيارة صغيرة. أيّ العبارات صحيحة؟","o":["القوة المؤثّرة في الشاحنة أكبر","القوة المؤثّرة في السيارة أكبر","القوة المؤثّرة في كل منهما متساوية في المقدار","لا توجد قوة مؤثّرة في الشاحنة"],"a":2},{"l":1,"k":"p","q":"أثّرت قوة ١٠ نيوتن في جسم كتلته ٢ كغم. ما تسارعه؟","o":["٢٠ م/ث²","٥ م/ث²","٠٫٢ م/ث²","١٢ م/ث²"],"a":1},{"l":1,"k":"p","q":"لماذا لا يلغي ردّ الفعل أثر الفعل؟","o":["لأنهما يؤثّران في جسمين مختلفين","لأن ردّ الفعل أصغر من الفعل","لأن الفعل يحدث قبل ردّ الفعل بزمن كبير","لأن لهما الاتجاه نفسه"],"a":0},{"l":2,"k":"p","q":"جسم يتحرّك بسرعة ٢٠ م/ث أثّرت فيه قوة فتوقّف خلال ٤ ثوانٍ. ما تسارعه؟","o":["−٥ م/ث²","٥ م/ث²","٨٠ م/ث²","−٨٠ م/ث²"],"a":0},{"l":2,"k":"p","q":"كتلة الفيل ١٠ أضعاف كتلة الرجل، وتسارع الرجل ١٠ م/ث² عند دفعه الفيل. ما تسارع الفيل؟","o":["١٠٠ م/ث²","١٠ م/ث²","٠٫١ م/ث²","١ م/ث²"],"a":3},{"l":2,"k":"p","q":"لماذا يتأثّر راكب السيارة الصغيرة بالتصادم مع شاحنة أكثر من سائق الشاحنة؟","o":["لأن الشاحنة لا تتأثّر بأي قوة","لأن القوة على السيارة أكبر من القوة على الشاحنة","القوتان متساويتان لكن كتلة السيارة أقل فيكون تسارعها أكبر","لأن السيارة أثقل من الشاحنة"],"a":2},{"l":2,"k":"p","q":"أُطلق بالون منتفخ مفتوح الفوهة فاندفع الهواء نحو اليمين. إلى أي اتجاه يتحرّك البالون؟","o":["نحو اليمين","نحو اليسار","نحو الأعلى فقط","يبقى ساكناً"],"a":1},{"l":2,"k":"p","q":"أثّرت قوة ٢٠ نيوتن في جسم كتلته ٥ كغم، ثم تضاعفت القوة مع بقاء الكتلة. ما التسارع الجديد؟","o":["٤ م/ث²","٨ م/ث²","١٠ م/ث²","٢ م/ث²"],"a":1},{"l":2,"k":"p","q":"دفعت الغازات المنطلقة من صاروخ إلى الأسفل بقوة ٥٠٠٠ نيوتن. ما قوة ردّ الفعل المؤثّرة في الصاروخ؟","o":["٥٠٠٠ نيوتن إلى الأعلى","٥٠٠٠ نيوتن إلى الأسفل","١٠٠٠٠ نيوتن إلى الأعلى","صفر"],"a":0},{"l":2,"k":"p","q":"أثّرت قوة ٦٠ نيوتن في جسم كتلته ١٢ كغم. ما تسارعه؟","o":["٧٢٠ م/ث²","٢٠ م/ث²","٠٫٢ م/ث²","٥ م/ث²"],"a":3},{"l":2,"k":"p","q":"وقف طالب على لوح تزلّج ودفع الحائط بيديه فتحرّك إلى الخلف. ما التفسير؟","o":["الحائط لا يؤثّر فيه بأي قوة","قوة الفعل أكبر من ردّ الفعل","الحائط دفعه بقوة ردّ فعل مساوية ومعاكسة لقوة دفعه","الأرض سحبته فقط"],"a":2}],"hints":{"ماذا ينصّ القانون الثالث لنيوتن؟":"فكّر: ماذا يحدث للقوة عندما يؤثّر جسم في آخر؟ تذكّر المقدار والاتجاه معاً.","أثّرت قوة ٢٠ نيوتن في عربة فأكسبتها تسارعاً ٥ م/ث². ما كتلتها؟":"استعمل العلاقة ق = ك × ت، ثم اقسم القوة على التسارع للحصول على الكتلة.","جسم يتحرّك بسرعة ٢٠ م/ث أثّرت فيه قوة فتوقّف خلال ٤ ثوانٍ. ما تسارعه؟":"التسارع = (السرعة النهائية − الابتدائية) ÷ الزمن. السرعة النهائية هنا صفر.","كتلة الفيل ١٠ أضعاف كتلة الرجل، وتسارع الرجل ١٠ م/ث² عند دفعه الفيل. ما تسارع الفيل؟":"القوتان متساويتان. فكّر في العلاقة بين الكتلة والتسارع عند القوة الثابتة."}},{"t":"الغلاف الجوي","e":["# نشاط ١: مكوّنات الغلاف الجوي","يبيّن الشكل الدائري (قطاعات) تركيب الغلاف الجوي بنسب مئوية للغازات المكوّنة له.","- النيتروجين: ٧٨٪ من الغلاف الجوي، وهو أكثر الغازات انتشاراً.","- الأكسجين: ٢١٪ من الغلاف الجوي، وهو ضروري لتنفّس الكائنات الحية.","- غازات أخرى: ١٪ فقط من الغلاف الجوي.","يُعدّ غازا الأكسجين والنيتروجين من المكوّنات الأساسية للغلاف الجوي. وبالإضافة إلى مجموعة من الغازات الأخرى التي تتواجد بنسب ضئيلة مثل بخار الماء وثاني أكسيد الكربون، فإن الغلاف الجوي يحوي نسبة من الغبار العالق المكوَّن في الغالب من المعادن والمركّبات العضوية الموجودة على سطح الأرض، أو تلك الناتجة عن النيازك.","- بخار الماء: غاز في الهواء صيغته الجزيئية H₂O.","- الغبار العالق: دقائق من المعادن والمركبات العضوية من سطح الأرض أو من النيازك.","! نسب الغازات مجموعها ١٠٠٪، فإذا ارتفعت نسبة بخار الماء قلّت النسب المئوية للغازات الأخرى.","# طبقات الغلاف الجوي","ينقسم الغلاف الجوي إلى خمس طبقات، نبدؤها من أقرب طبقة إلى سطح الأرض فنصعد إلى الفضاء.","- الطبقة المناخية (التروبوسفير): أقرب طبقات الغلاف الجوي إلى سطح الأرض، تحتوي على ٧٥٪ من الهواء الجوي وتحمل جميع بخار الماء، وفيها تحدث التقلبات الجوية، وتتناقص حرارتها بمعدل ٦٫٥ °س كلما ارتفعنا ١ كم.","- الغلاف الطبقي (الستراتوسفير): يتميّز بالاستقرار التام، ينعدم فيه بخار الماء وتكون جافة، وتزداد درجة الحرارة فيها كلما ارتفعنا، وتخلو من الظواهر الجوية كالغيوم والضباب والأمطار.","- الغلاف المتوسط (الميزوسفير): تقلّ درجات الحرارة فيها كلما زاد الارتفاع، وتُعدّ من أبرد طبقات الغلاف الجوي إذ تقلّ درجة الحرارة فيها عن الستراتوسفير بنحو ١٠٠ درجة سلسيوس.","- الغلاف الحراري (الثيرموسفير): غلاف خارجي يغطي كوكب الأرض، تزداد درجة حرارته تدريجياً بالارتفاع إلى ما يزيد عن ١٠٠٠ °س لأن الجزيئات فيه تمتصّ حرارة الشمس مباشرة.","- الغلاف الخارجي (الإكسوسفير): الطبقة الأخيرة، تحتوي على القليل من الذرّات، وتمتد من أعلى الثيرموسفير إلى أن تتلاشى في الفضاء الخارجي حيث لا يوجد فاصل واضح بين نهايتها والفضاء.","# جدول طبقات الغلاف الجوي","|الطبقة|ما يميّزها|الحرارة مع الارتفاع","|التروبوسفير|٧٥٪ من الهواء وكل بخار الماء، فيها الظواهر الجوية|تتناقص ٦٫٥ °س لكل ١ كم","|الستراتوسفير|استقرار تام، جافة وخالية من الغيوم والأمطار|تزداد","|الميزوسفير|من أبرد الطبقات، أقل بنحو ١٠٠ °س من الستراتوسفير|تقلّ","|الثيرموسفير|جزيئاتها تمتص حرارة الشمس مباشرة|تزداد إلى أكثر من ١٠٠٠ °س","|الإكسوسفير|قليل من الذرات، تتلاشى في الفضاء الخارجي|—","! ترتيب الطبقات من الأرض إلى الفضاء: التروبوسفير ثم الستراتوسفير ثم الميزوسفير ثم الثيرموسفير ثم الإكسوسفير.","# الرطوبة","تُعرَّف الرطوبة بأنها كمية بخار الماء الموجودة في الهواء الجوي، وتتشكّل نتيجة تبخّر الماء من مصادره المختلفة. ولحساب الرطوبة النسبية يجب معرفة الكمية القصوى من بخار الماء التي يستطيع الهواء حملها عند درجة حرارة معينة (الإشباع)، والكمية الفعلية لبخار الماء الموجود في نفس الحجم من الهواء عند نفس درجة الحرارة.","- الرطوبة النسبية: (كتلة بخار الماء الموجود فعلياً في حجم معيّن من الهواء ÷ كتلة البخار اللازم لإشباع الحجم نفسه عند درجة الحرارة نفسها) × ١٠٠٪.","- الإشباع: أقصى كمية من بخار الماء يستطيع الهواء حملها عند درجة حرارة معينة.","- الهيجروميتر: جهاز لقياس الرطوبة مباشرة.","? إذا علمت أنّ متراً مكعباً من الهواء يحتوي على ١٨ غم من بخار الماء، وأن أقصى كمية يمكن لهذا الحجم من الهواء حملها هي ٢٤ غم عند درجة الحرارة نفسها، فاحسب الرطوبة النسبية. || الرطوبة النسبية = (المحتوى الفعلي ÷ محتوى الإشباع) × ١٠٠٪ = (١٨ ÷ ٢٤) × ١٠٠٪ = ٧٥٪. الجواب: ٧٥٪.","? متر مكعب من الهواء يحتوي على ١٢ غم من بخار الماء، وأقصى كمية يحملها ٢٤ غم عند درجة الحرارة نفسها. احسب الرطوبة النسبية. || (١٢ ÷ ٢٤) × ١٠٠٪ = ٠٫٥ × ١٠٠٪ = ٥٠٪. الجواب: ٥٠٪.","? إذا كان الهواء الفعلي يحمل ١٥ غم بخار ماء ورطوبته النسبية ٦٠٪، فما كتلة بخار الماء اللازمة لإشباعه؟ || ٦٠٪ = (١٥ ÷ الإشباع) × ١٠٠٪، فالإشباع = ١٥ ÷ ٠٫٦ = ٢٥ غم. الجواب: ٢٥ غم.","? صعد متسلّق ٤ كم داخل التروبوسفير وكانت حرارة سطح الأرض ٢٥ °س. ما درجة الحرارة المتوقعة؟ || الانخفاض = ٦٫٥ × ٤ = ٢٦ °س. الحرارة = ٢٥ − ٢٦ = −١ °س. الجواب: −١ °س.","# نشاط ٢: دورة الماء في الطبيعة","المواد والأدوات: كأس زجاجي شفاف، وماء دافئ، ووعاء بلاستيكي، ونايلون خاص بتغليف الأطعمة، وقلم فلوماستر.","- نملأ الكأس بالماء إلى منتصفه ونحدّد مستوى الماء بالقلم.","- نضع الكأس في الوعاء البلاستيكي ثم نغطّي الوعاء بإحكام بالنايلون ونضعه في مكان مشمس.","- ننتظر فترة مناسبة من الزمن ثم نسجّل ملاحظتنا.","- ينخفض مستوى الماء في الكأس بسبب التبخّر، وتتجمّع قطرات ماء على النايلون من الداخل بسبب التكاثف.","- العملية التي يتحوّل فيها الماء من الحالة السائلة إلى الغازية هي التبخّر، والعملية التي يتحوّل فيها من الغازية إلى السائلة هي التكاثف.","عندما ترسل الشمس أشعتها إلى سطح الأرض تسخن المياه السطحية وتتبخّر من البحار والمحيطات، فتحمله تيارات الهواء الساخنة الملامسة لسطح الأرض إلى طبقات الجو العليا، حيث يتكاثف متحوّلاً إلى قطرات ماء صغيرة تتجمع في الغيوم، وعندما يكبر حجمها ويزداد وزنها تتساقط على سطح الأرض بأحد أشكال الهطول: المطر والبرد والثلج.","! مراحل دورة الماء: التبخّر ثم الانتقال بتيارات الهواء ثم التكاثف وتكوّن الغيوم ثم الهطول (مطر، برد، ثلج) ثم الجريان السطحي أو التسرّب في باطن الأرض."],"q":["- ما أكثر الغازات انتشاراً في الغلاف الجوي؟ وما نسبته؟","- اذكر طبقات الغلاف الجوي مرتّبةً من سطح الأرض إلى الفضاء الخارجي، وبيّن ما يميّز كلّ طبقة.","- ما المقصود بالرطوبة النسبية؟ وكيف تُحسب؟","- ماذا تتوقّع أن يحدث على الأرض في حال اختلال نسب الغازات المكوّنة للغلاف الجوي؟","- فسّر كيف يتكوّن المطر مبيّناً دور التبخّر والتكاثف."],"quiz":[{"l":0,"k":"n","q":"ما أكثر الغازات انتشاراً في الغلاف الجوي؟","o":["النيتروجين","الأكسجين","ثاني أكسيد الكربون","بخار الماء"],"a":0},{"l":0,"k":"n","q":"ما نسبة الأكسجين في الغلاف الجوي؟","o":["٧٨٪","١٪","٧٥٪","٢١٪"],"a":3},{"l":0,"k":"n","q":"أقرب طبقات الغلاف الجوي إلى سطح الأرض هي:","o":["الستراتوسفير","الميزوسفير","التروبوسفير","الإكسوسفير"],"a":2},{"l":0,"k":"n","q":"أيّ الطبقات تحمل جميع بخار الماء الموجود في الغلاف الجوي؟","o":["الستراتوسفير","التروبوسفير","الميزوسفير","الثيرموسفير"],"a":1},{"l":0,"k":"n","q":"أيّ الطبقات تخلو من الظواهر الجوية كالغيوم والأمطار؟","o":["التروبوسفير","الستراتوسفير","جميع الطبقات","لا شيء مما سبق"],"a":1},{"l":0,"k":"n","q":"أبرد طبقات الغلاف الجوي هي:","o":["الميزوسفير","الثيرموسفير","التروبوسفير","الستراتوسفير"],"a":0},{"l":0,"k":"n","q":"ما الصيغة الجزيئية لبخار الماء؟","o":["CO₂","O₂","N₂","H₂O"],"a":3},{"l":0,"k":"n","q":"تُعرَّف الرطوبة بأنها:","o":["كمية الأكسجين في الهواء","درجة حرارة الهواء","كمية بخار الماء الموجودة في الهواء الجوي","وزن عمود الهواء"],"a":2},{"l":1,"k":"p","q":"متر مكعب من الهواء فيه ١٨ غم بخار ماء، وأقصى كمية يحملها ٢٤ غم. ما الرطوبة النسبية؟","o":["٢٥٪","٦٠٪","٧٥٪","١٣٣٪"],"a":2},{"l":1,"k":"p","q":"متر مكعب من الهواء فيه ١٢ غم بخار ماء، وأقصى كمية يحملها ٢٤ غم. ما الرطوبة النسبية؟","o":["٢٠٪","٥٠٪","١٢٪","٢٤٪"],"a":1},{"l":1,"k":"p","q":"ارتفعنا ١ كم في التروبوسفير. بكم تتغيّر درجة الحرارة؟","o":["تنخفض ٦٫٥ °س","ترتفع ٦٫٥ °س","تنخفض ٦٥ °س","لا تتغيّر"],"a":0},{"l":1,"k":"p","q":"لماذا تزداد درجة حرارة الثيرموسفير بالارتفاع؟","o":["لأنها قريبة من سطح الأرض","لأنها تحوي بخار الماء كله","لأنها تخلو من الذرات تماماً","لأن جزيئاتها تمتص حرارة الشمس مباشرة"],"a":3},{"l":1,"k":"p","q":"لماذا لا تهطل الأمطار في الستراتوسفير؟","o":["لأن حرارتها منخفضة جداً","لأن الجاذبية تنعدم فيها","لأن الرياح شديدة فيها","لأن بخار الماء ينعدم فيها فهي جافة"],"a":3},{"l":1,"k":"p","q":"في نشاط الكأس داخل الوعاء المغطّى بالنايلون، لماذا انخفض مستوى الماء في الكأس؟","o":["بسبب تكاثف الماء","بسبب تجمّد الماء","بسبب تبخّر الماء","بسبب امتصاص النايلون له"],"a":2},{"l":1,"k":"p","q":"من أين جاءت قطرات الماء على سطح النايلون من الداخل؟","o":["من الهواء خارج الوعاء","من تكاثف بخار الماء المتبخّر من الكأس","من النايلون نفسه","من القلم"],"a":1},{"l":1,"k":"p","q":"أيّ جهاز يقيس الرطوبة مباشرة؟","o":["الهيجروميتر","البارومتر","الثيرمومتر","الأنيمومتر"],"a":0},{"l":2,"k":"p","q":"كانت حرارة سطح الأرض ٢٥ °س. ما الحرارة المتوقعة على ارتفاع ٤ كم داخل التروبوسفير؟","o":["−١ °س","٥١ °س","٠ °س","−٢٦ °س"],"a":0},{"l":2,"k":"p","q":"هواء رطوبته النسبية ٦٠٪ ويحتوي فعلياً على ١٥ غم/م³ بخار ماء. كم غم يلزم لإشباعه؟","o":["٩ غم","٧٥ غم","١٥ غم","٢٥ غم"],"a":3},{"l":2,"k":"p","q":"متر مكعب من الهواء فيه ٣٠ غم بخار ماء، وإشباعه ٤٠ غم. ما رطوبته النسبية؟","o":["٣٣٪","٨٠٪","٧٥٪","٤٠٪"],"a":2},{"l":2,"k":"p","q":"ماذا يحدث لو انعدم تكاثف بخار الماء في الجو؟","o":["تتكوّن غيوم أكثر","لا تتكوّن غيوم ولا يهطل مطر","تزداد الأمطار","يزداد الأكسجين"],"a":1},{"l":2,"k":"p","q":"ارتفعت نسبة بخار الماء في الغلاف الجوي. ماذا تتوقع لنسب الغازات الأخرى؟","o":["تزداد نسبتها المئوية","تقلّ نسبتها المئوية","لا تتأثّر إطلاقاً","تتحوّل إلى بخار ماء كلها"],"a":1},{"l":2,"k":"p","q":"أيّ الطبقتين ترتفع الحرارة فيهما مع زيادة الارتفاع؟","o":["الستراتوسفير والثيرموسفير","التروبوسفير والميزوسفير","التروبوسفير والستراتوسفير","الميزوسفير والإكسوسفير"],"a":0},{"l":2,"k":"p","q":"أراد طالب دراسة الغيوم والأمطار في الغلاف الجوي. في أيّ طبقة يجد الظواهر الجوية؟","o":["الستراتوسفير","الثيرموسفير","الإكسوسفير","التروبوسفير"],"a":3},{"l":2,"k":"p","q":"ما الذي يوضّح أنه لا يوجد فاصل واضح بين الإكسوسفير والفضاء؟","o":["الإكسوسفير تحتوي على كل الهواء","درجة حرارتها ثابتة","الإكسوسفير تتلاشى تدريجياً في الفضاء الخارجي","تحتوي على بخار الماء"],"a":2}],"hints":{"متر مكعب من الهواء فيه ١٨ غم بخار ماء، وأقصى كمية يحملها ٢٤ غم. ما الرطوبة النسبية؟":"استعمل: الرطوبة النسبية = (الفعلي ÷ الإشباع) × ١٠٠٪. ما العدد الفعلي وما عدد الإشباع؟","ارتفعنا ١ كم في التروبوسفير. بكم تتغيّر درجة الحرارة؟":"المعدل المذكور في الدرس هو ٦٫٥ °س لكل كيلومتر. هل الحرارة تزداد أم تنقص في التروبوسفير؟","كانت حرارة سطح الأرض ٢٥ °س. ما الحرارة المتوقعة على ارتفاع ٤ كم داخل التروبوسفير؟":"اضرب ٦٫٥ في ٤ ثم اطرح الناتج من ٢٥. انتبه إلى الإشارة السالبة.","هواء رطوبته النسبية ٦٠٪ ويحتوي فعلياً على ١٥ غم/م³ بخار ماء. كم غم يلزم لإشباعه؟":"الرطوبة النسبية = الفعلي ÷ الإشباع. أوجد الإشباع بقسمة الفعلي على ٠٫٦."}},{"t":"الضغط الجوي","e":["# مفهوم الضغط الجوي","ينتج عن الهواء الجوي المحيط بالأرض ضغطٌ يُسمّى الضغط الجوي، ويُعرَّف بأنه وزن عمود الهواء الواقع عمودياً على وحدة المساحة.","- الضغط الجوي: وزن عمود الهواء الواقع عمودياً على وحدة المساحة.","- يقلّ الضغط الجوي كلما ارتفعنا عن سطح البحر، ويزداد كلما انخفضنا نحو سطح البحر.","عند الانتقال من مكان مرتفع كمدينة رام الله إلى مكان منخفض كمدينة أريحا يزداد الضغط الجوي، فيحدث ألم وانسداد في الأذنين. لذلك يجب فتح الفم بين فترة وأخرى في محاولة لتقليل الفرق في الضغط على جانبي طبلة الأذن.","! ارتفاع أكبر يعني ضغطاً جوياً أقل، وانخفاض أكبر نحو سطح البحر يعني ضغطاً أكبر.","# نشاط ١: سحر البيضة المسلوقة","المواد والأدوات: قنينة زجاجية فارغة، وبيضة مسلوقة.","- نحضر قنينة عصير زجاجية ذات فوهة واسعة، وبيضة مسلوقة مقشّرة حجمها أكبر قليلاً من فوهة القنينة.","- نحاول إدخال البيضة في الزجاجة دون دفعها فلا تدخل.","- نشعل قطعة من القطن مبلّلة بقليل من الزيت ونضعها في القنينة، ثم نضع البيضة المسلوقة على فوهة القنينة.","- نراقب فتدخل البيضة إلى القنينة بعد إشعال القطن وإخماده.","عند إشعال القطن يسخن الهواء داخل القنينة ويتمدّد ويخرج بعضه، وعندما تنطفئ النار يبرد الهواء الباقي فيقلّ ضغطه داخل القنينة، فيدفع الضغط الجوي الخارجي الأكبر البيضة إلى الداخل.","! سبب دخول البيضة: ضغط الهواء داخل القنينة أصبح أقل من الضغط الجوي الخارجي. وأهمية إشعال القطن هي تسخين الهواء وإخراج جزء منه من القنينة.","# قياس الضغط الجوي والبارومتر الزئبقي","تمكّن العالم تورشيللي من اختراع البارومتر الزئبقي، حيث أخذ أنبوبة زجاجية مغلقة من أحد طرفيها طولها حوالي ١٠٠ سم وملأها تماماً بالزئبق، ثم نكّسها في حوض فيه زئبق. لاحظ بدء انخفاض الزئبق في الأنبوب حتى توقف عند ارتفاع ٧٦ سم، وهي قيمة الضغط الجوي عند مستوى سطح البحر في الظروف المعيارية.","- البارومتر: جهاز يُستخدم لقياس الضغط الجوي.","- الضغط الجوي المعياري: ٧٦ سم زئبق (٧٦٠ ملم زئبق) عند مستوى سطح البحر.","- وحدات قياس الضغط الجوي: البار، والمللي بار، والباسكال.","- في الشكل: أنبوب زجاجي، وفوق الزئبق فراغ، وحوض مملوء بالزئبق، وضغط الهواء يؤثر على سطح الزئبق في الحوض.","! يوازن ضغط الهواء على سطح الزئبق في الحوض عمود الزئبق في الأنبوب الذي ارتفاعه ٧٦ سم، والفراغ فوق الزئبق لا يوجد فيه هواء.","# تغيّر الضغط الجوي مع الارتفاع","|المكان|الارتفاع|الضغط الجوي","|سطح البحر|صفر|الأعلى (حوالي ١٠١٣ مللي بار)","|مدينة رام الله|مرتفعة|أقل","|مدينة أريحا والبحر الميت|منخفضة|أكبر، والأكبر عند البحر الميت","في الرسم البياني يبدأ منحنى الضغط الجوي بقيمة تقارب ١٠١٣ مللي بار عند مستوى سطح البحر، ثم ينخفض كلما زاد الارتفاع بالكيلومترات، أي أن العلاقة بين الضغط الجوي والارتفاع علاقة عكسية.","? ما قيمة الضغط الجوي بالمللي متر زئبق عند مستوى سطح البحر؟ || القيمة المعيارية ٧٦ سم زئبق، وكل ١ سم = ١٠ ملم، فالضغط = ٧٦ × ١٠ = ٧٦٠ ملم زئبق. الجواب: ٧٦٠ ملم زئبق.","? انتقل سائق من رام الله إلى أريحا. ماذا يحدث للضغط الجوي؟ ولماذا يشعر بألم في أذنيه؟ || أريحا أخفض من رام الله، فالضغط الجوي يزداد عند الانتقال إليها، ويصبح هناك فرق ضغط بين جانبي طبلة الأذن فيحدث الألم، ويُخفَّف بفتح الفم بين فترة وأخرى. الجواب: يزداد الضغط.","? أنبوب زئبق على قمة جبل مرتفع: هل يكون ارتفاع الزئبق أكبر من ٧٦ سم أم أقل؟ || ٧٦ سم هو الضغط عند مستوى سطح البحر، وكلما ارتفعنا قلّ الضغط الجوي، فيقلّ ارتفاع عمود الزئبق. الجواب: أقل من ٧٦ سم.","# النسيم: نسيم البر ونسيم البحر","تسقط أشعة الشمس على اليابسة وعلى البحر، فترتفع درجة حرارة اليابسة بشكل أسرع من ماء البحر، فيصبح الضغط الجوي فوق اليابسة أقل منه فوق ماء البحر، فيسبب هبوب الهواء الملامس لسطح البحر إلى اليابسة، وهو ما يسمى نسيم البحر. وفي الليل تنخفض درجة حرارة اليابسة بشكل أسرع من ماء البحر، فيصبح الضغط الجوي فوق اليابسة أعلى منه فوق البحر، فيهب الهواء الملامس لليابسة إلى البحر، وهذا ما يسمى نسيم البرّ.","|النسيم|الوقت|اتجاه الهواء|السبب","|نسيم البحر|النهار|من البحر إلى اليابسة|ضغط اليابسة أقل لأنها ترتفع حرارتها أسرع","|نسيم البر|الليل|من اليابسة إلى البحر|ضغط اليابسة أعلى لأنها تبرد أسرع","- الهواء ينتقل دائماً من منطقة الضغط الجوي المرتفع إلى منطقة الضغط الجوي المنخفض.","! النسيم هو هواء متحرّك ينتج عن اختلاف الضغط الجوي بين منطقتين بسبب اختلاف سرعة ارتفاع درجة حرارتيهما.","# نشاط ٣: نسيم الجبل ونسيم الوادي","تسقط أشعة الشمس صباحاً على الجبل قبل الوادي، فترتفع درجة حرارته فيصبح الضغط الجوي في الوادي أعلى منه في الجبل، فينتقل الهواء من الوادي باتجاه الجبل وهو ما يُسمّى نسيم الوادي. وفي الليل يحدث العكس، فيهبّ الهواء من الجبل نحو الوادي ويسمّى نسيم الجبل.","|النسيم|الوقت|اتجاه الهواء","|نسيم الوادي|صباحاً (النهار)|من الوادي إلى الجبل","|نسيم الجبل|ليلاً|من الجبل إلى الوادي","# تطبيقات حياتية","- ألم الأذنين عند الانتقال السريع بين مكان مرتفع ومكان منخفض بسبب تغيّر الضغط الجوي.","- الرطوبة النسبية: إذا كانت كتلة بخار الماء الفعلية في حجم من الهواء ١٥ غم ورطوبته النسبية ٦٠٪ فإن كتلة بخار الماء اللازمة لإشباعه تساوي ٢٥ غم.","- مناطق مثل البحر الميت وأريحا (منخفضة) ضغطها الجوي أكبر من مناطق مرتفعة مثل رام الله وجبل جرزيم."],"q":["- ما المقصود بالضغط الجوي؟ وما علاقته بالارتفاع عن سطح البحر؟","- فسّر دخول البيضة المسلوقة إلى القنينة في نشاط «سحر البيضة المسلوقة».","- صف تجربة تورشيللي، وما قيمة الضغط الجوي المعياري عند مستوى سطح البحر؟","- ما سبب حدوث نسيم البحر نهاراً؟ وكيف يختلف عنه نسيم البر؟","- ما سبب هبوب نسيم الوادي صباحاً؟"],"quiz":[{"l":0,"k":"n","q":"ما تعريف الضغط الجوي؟","o":["وزن عمود الهواء الواقع عمودياً على وحدة المساحة","درجة حرارة الهواء","كمية بخار الماء في الهواء","سرعة الرياح"],"a":0},{"l":0,"k":"n","q":"ما مقدار الضغط الجوي عند مستوى سطح البحر في الظروف المعيارية؟","o":["٧٦ ملم زئبق","٧٠ سم زئبق","٦٧٠ ملم زئبق","٧٦٠ ملم زئبق"],"a":3},{"l":0,"k":"n","q":"من العالم الذي اخترع البارومتر الزئبقي؟","o":["نيوتن","أمبير","تورشيللي","كولوم"],"a":2},{"l":0,"k":"n","q":"ما الجهاز المستخدم لقياس الضغط الجوي؟","o":["الهيجروميتر","البارومتر","الثيرمومتر","الأنيمومتر"],"a":1},{"l":0,"k":"n","q":"أيّ مما يلي وحدة لقياس الضغط الجوي؟","o":["النيوتن","الباسكال","الجول","الأمبير"],"a":1},{"l":0,"k":"n","q":"ماذا يحدث للضغط الجوي كلما ارتفعنا عن سطح البحر؟","o":["يقلّ","يزداد","يبقى ثابتاً","يصبح صفراً دائماً"],"a":0},{"l":0,"k":"n","q":"نسيم البحر يهبّ:","o":["من اليابسة إلى البحر نهاراً" خميدس: قوة الطفو تساوي وزن:",["الجسم في الهواء","الجسم في الماء","الإناء","المائع المزاح"],3],[1,"كتلة ٢٤٠ غم وحجمها ٣٠ سم³، فكثافتها:",["٧٢٠٠ غم/سم³","٠٫١٢٥ غم/سم³","٨ غم/سم³","٢١٠ غم/سم³"],2],[1,"قوة ٦٠٠ نيوتن على مساحة ٠٫٣ م²، فالضغط:",["١٨٠ باسكال","٢٠٠٠ باسكال","٢٠٠ باسكال","٠٫٠٠٠٥ باسكال"],1],[0,"المادة الأقلّ كميةً في المحلول تسمّى:",["المذيب","المذاب","الراسب","المحلول"],1],[0,"وحدة قياس تركيز المحلول:",["غم/١٠٠ غم ماء","لتر/غم","غم/لتر","سم³"],2],[0,"أكبر كتلة من المذاب تذوب في ١٠٠ غم ماء عند درجة حرارة معيّنة تسمّى:",["الذائبية","التركيز","المذيب","الترشيح"],0],[1,"محلول دقائقه كبيرة تترسّب بعد فترة قصيرة من الزمن، ويكون غير متجانس، يسمّى:",["الحقيقي","الغروي","المشبع","المعلّق"],3],[1,"تركيز محلول ناتج عن إذابة ٤ غم ملح في نصف لتر:",["٢ غم/لتر","٨ غم/لتر","٤٫٥ غم/لتر","٠٫١٢٥ غم/لتر"],1],[1,"أيّ العوامل الآتية لا يزيد سرعة الذوبان في معظم المواد؟",["رفع درجة الحرارة","التحريك","تصغير حجم البلورات","تكبير حجم البلورات"],3]],"lessons":[{"t":"الكثافة","e":["# نشاط ١: أحسب الكثافة","المواد والأدوات: ميزان حسّاس، ومسطرة، وقطع خشبية مختلفة الأبعاد منتظمة الشكل من النوع نفسه.","- نقيس أبعاد كل قطعة (الطول والعرض والارتفاع) ونسجّلها في الجدول.","- نحسب حجم كل قطعة: الحجم = الطول × العرض × الارتفاع.","- نقيس كتلة كل قطعة بالميزان الحسّاس ونسجّلها.","- نقسم كتلة كل قطعة على حجمها: الكتلة ÷ الحجم.","|رقم القطعة|الطول|العرض|الارتفاع|الحجم|الكتلة|الكتلة ÷ الحجم","|١|نقيسه|نقيسه|نقيسه|الطول × العرض × الارتفاع|نقيسها بالميزان|ناتج القسمة","! نتيجة النشاط: ناتج قسمة الكتلة على الحجم يكاد يكون واحداً في القطع الثلاث رغم اختلاف أبعادها وكتلها، لأنها من المادة نفسها.","# مفهوم الكثافة","- المادة: كل شيء له كتلة ويشغل حيّزاً.","- الكثافة: كتلة وحدة الحجوم من المادة، أي كتلة جسمٍ مقسومةً على حجمه.","عندما تتساوى المواد المختلفة في حجومها فإنها تختلف في كتلها، وبذلك نميّز مادةً من أخرى باختلاف النسبة بين الكتلة والحجم.","الكثافة ثابتة للمادة الواحدة عند درجة حرارة معيّنة، وتختلف من مادة لأخرى، فهي خاصية تميّز المواد بعضها من بعض.","# القانون ووحدات القياس","الكثافة = الكتلة ÷ الحجم، أي: ث = ك ÷ ح","ومن القانون نستنتج: الحجم = الكتلة ÷ الكثافة، والكتلة = الكثافة × الحجم.","|الكمية|وحدة قياسها","|الكتلة|غم أو كغم","|الحجم|سم³ أو م³","|الكثافة|غم/سم³ أو كغم/م³","! في سؤال الكتاب: كثافة الهواء ١٫٣ كغم/م³؛ وكثافة الماء ١٠٠٠ كغم/م³ (تُستعمل في دروس الضغط).","# نشاط ٢: كثافة السوائل","المواد والأدوات: كأس زجاجية، وماء، وصبغة طعام، وعسل، وزيت.","- نضع الماء في الكأس ثم نضيف قليلاً من الصبغة ونحرّك جيداً حتى يتجانس المحلول.","- نضيف كمية من العسل وننتظر قليلاً ونسجّل ملاحظاتنا.","- نضيف كمية من الزيت ونسجّل ملاحظاتنا.","- نقارن موقع كل سائل في الكأس: الأقل كثافة في الأعلى، والأكثر كثافة في الأسفل.","! تُعدّ الكثافة من الخصائص التي تميّز المواد بعضها من بعض: عند درجة حرارة معيّنة إذا اختلط سائلان لا يذوب أحدهما في الآخر فإن السائل الأقل كثافة يستقر في الأعلى.","# أمثلة محلولة","? احسب كثافة عيّنة من مادة كتلتها ١٧٨ غم وحجمها ٢٠ سم³. || الكثافة = الكتلة ÷ الحجم = ١٧٨ ÷ ٢٠ = ٨٫٩ غم/سم³.","? سبيكة ذهبية كتلتها ٥٧ غم وكثافتها ١٩ غم/سم³، فما حجمها؟ || الحجم = الكتلة ÷ الكثافة = ٥٧ ÷ ١٩ = ٣ سم³.","? ما كتلة الهواء داخل غرفة قياسها ٦ م × ٥ م × ٤ م، إذا علمت أن كثافة الهواء ١٫٣ كغم/م³؟ || الحجم = ٦ × ٥ × ٤ = ١٢٠ م³. الكتلة = الكثافة × الحجم = ١٫٣ × ١٢٠ = ١٥٦ كغم.","? قطعة خشب أبعادها ١٠ سم × ٥ سم × ٤ سم وكتلتها ١٠٠ غم، فما كثافتها؟ || الحجم = ١٠ × ٥ × ٤ = ٢٠٠ سم³. الكثافة = ١٠٠ ÷ ٢٠٠ = ٠٫٥ غم/سم³.","? ما كتلة ٠٫٥ م³ من الماء علماً أن كثافة الماء ١٠٠٠ كغم/م³؟ || الكتلة = الكثافة × الحجم = ١٠٠٠ × ٠٫٥ = ٥٠٠ كغم.","# تطبيقات حياتية","- ترتيب السوائل في الكأس: العسل في الأسفل ثم الماء ثم الزيت في الأعلى، لأن الأقل كثافة يطفو فوق الأكثر كثافة.","- للهواء كتلة: نحسب كتلة الهواء في غرفة بضرب كثافة الهواء في حجم الغرفة.","- نميّز المعادن والسبائك بحساب كثافتها، لأن لكل مادة كثافتها الخاصة."],"q":["- ما المقصود بالمادة؟ وما المقصود بالكثافة؟","- اكتب قانون الكثافة وبيّن وحدة كلّ كمية فيه.","- لماذا تبقى نسبة الكتلة إلى الحجم متقاربة في قطع الخشب المختلفة الأبعاد في النشاط ١؟","- عند وضع الماء والعسل والزيت في كأس واحدة، كيف تتوزع ولماذا؟","- احسب حجم قطعة كتلتها ٦٠ غم وكثافتها ٣ غم/سم³."],"quiz":[{"l":0,"k":"n","q":"ما المقصود بالكثافة؟","o":["كتلة وحدة الحجوم من المادة","حجم وحدة الكتل من المادة","وزن المادة في الهواء فقط","مساحة سطح المادة"],"a":0},{"l":0,"k":"n","q":"ما قانون حساب الكثافة؟","o":["الكثافة = الحجم ÷ الكتلة","الكثافة = الكتلة × الحجم","الكثافة = الكتلة − الحجم","الكثافة = الكتلة ÷ الحجم"],"a":3},{"l":0,"k":"n","q":"تُعرَّف المادة بأنها كل شيء:","o":["له لون ورائحة","يمكن رؤيته بالعين فقط","له كتلة ويشغل حيّزاً","له شكل ثابت"],"a":2},{"l":0,"k":"n","q":"أي الوحدات الآتية وحدة لقياس الكثافة؟","o":["نيوتن/م²","غم/سم³","م/ث","كغم.م/ث²"],"a":1},{"l":0,"k":"n","q":"الكثافة ثابتة للمادة الواحدة عند ثبوت:","o":["اللون","درجة الحرارة","الاسم","الموضع"],"a":1},{"l":0,"k":"n","q":"عند خلط سائلين لا يذوب أحدهما في الآخر يستقر السائل الأقل كثافة:","o":["في الأعلى","في الأسفل","في الوسط دائماً","لا يستقر في مكان"],"a":0},{"l":0,"k":"n","q":"ما وحدة كثافة الهواء المذكورة في سؤال الكتاب (١٫٣)؟","o":["غم/سم³","نيوتن","باسكال","كغم/م³"],"a":3},{"l":0,"k":"n","q":"نميّز مادة من أخرى عندما تتساوى حجومها باختلاف:","o":["اللون فقط","الشكل فقط","النسبة بين الكتلة والحجم","مكان وجودها"],"a":2},{"l":1,"k":"p","q":"جسم كتلته ١٥٠ غم وحجمه ٣٠ سم³، فكثافته:","o":["٠٫٢ غم/سم³","٤٥٠٠ غم/سم³","٥ غم/سم³","١٢٠ غم/سم³"],"a":2},{"l":1,"k":"p","q":"كثافة مادة ٢٫٧ غم/سم³، فكتلة ١٠ سم³ منها:","o":["١٢٫٧ غم","٢٧ غم","٠٫٢٧ غم","٣٫٧ غم"],"a":1},{"l":1,"k":"p","q":"قطعتان من مادتين مختلفتين لهما الحجم نفسه، وكتلة الأولى أكبر من كتلة الثانية. فالقطعة الأولى:","o":["كثافتها أكبر","كثافتها أقل","كثافتها مساوية للثانية","لا نستطيع معرفة شيء"],"a":0},{"l":1,"k":"p","q":"قطعة خشب كبيرة وأخرى صغيرة من النوع نفسه عند درجة الحرارة نفسها، فكثافتاهما:","o":["كثافة الكبيرة أكبر","كثافة الصغيرة أكبر","تختلفان حسب الكتلة","متساويتان"],"a":3},{"l":1,"k":"p","q":"كتلة جسم ٤٠٠ غم وكثافته ٨ غم/سم³، فحجمه:","o":["٣٢٠٠ سم³","٠٫٠٢ سم³","٤٠٨ سم³","٥٠ سم³"],"a":3},{"l":1,"k":"p","q":"وُضع جسم في كأس فيها زيت وماء وعسل فاستقر في قاعها تحت العسل، فكثافته:","o":["أقل من كثافة الزيت","بين كثافة الماء والزيت","أكبر من كثافة العسل","مساوية لكثافة الماء"],"a":2},{"l":1,"k":"p","q":"صندوق مليء بالهواء أبعاده ٢ م × ٣ م × ٤ م وكثافة الهواء ١٫٣ كغم/م³، فكتلة الهواء فيه:","o":["٢٤ كغم","٣١٫٢ كغم","١٨٫٥ كغم","٣١٢ كغم"],"a":1},{"l":1,"k":"p","q":"لماذا تختلف كتل المواد المختلفة إذا تساوت حجومها؟","o":["لأن كثافاتها مختلفة","لأن ألوانها مختلفة","لأن درجات حرارتها واحدة","لأن شكلها واحد"],"a":0},{"l":2,"k":"p","q":"سبيكة ذهبية كتلتها ٩٥ غم وكثافتها ١٩ غم/سم³، فحجمها:","o":["٥ سم³","٠٫٢ سم³","١٨٠٥ سم³","٧٦ سم³"],"a":0},{"l":2,"k":"p","q":"قطعة أبعادها ١٠ سم × ٥ سم × ٤ سم وكتلتها ١٠٠ غم، فكثافتها:","o":["٢ غم/سم³","٢٠ غم/سم³","٠٫٠٥ غم/سم³","٠٫٥ غم/سم³"],"a":3},{"l":2,"k":"p","q":"غرفة قياسها ٥ م × ٤ م × ٣ م وكثافة الهواء ١٫٣ كغم/م³، فكتلة الهواء فيها:","o":["٦٠ كغم","٤٦ كغم","٧٨ كغم","٧٨٠ كغم"],"a":2},{"l":2,"k":"p","q":"مادة (أ): كتلة ٤٠ غم وحجم ١٠ سم³، ومادة (ب): كتلة ٩٠ غم وحجم ٣٠ سم³. أيهما أكبر كثافة؟","o":["(ب) لأن كتلتها أكبر","(أ) لأن كثافتها ٤ مقابل ٣","(ب) لأن حجمها أكبر","كثافتاهما متساويتان"],"a":1},{"l":2,"k":"p","q":"عيّنة كتلتها ١٢٠ غم وحجمها ١٥ سم³ قُطعت نصفين متساويين. كثافة كل نصف:","o":["٤ غم/سم³","٨ غم/سم³","١٦ غم/سم³","٦٠ غم/سم³"],"a":1},{"l":2,"k":"p","q":"ثلاثة سوائل لا تمتزج كثافاتها: ٠٫٨ و١٫٠ و١٫٢ غم/سم³. ترتيبها من الأعلى إلى الأسفل:","o":["٠٫٨ ثم ١٫٠ ثم ١٫٢","١٫٢ ثم ١٫٠ ثم ٠٫٨","١٫٠ ثم ٠٫٨ ثم ١٫٢","١٫٠ ثم ١٫٢ ثم ٠٫٨"],"a":0},{"l":2,"k":"p","q":"كتلة ٥٠ سم³ من مادة كثافتها ٢ غم/سم³ تساوي:","o":["٢٥ غم","٥٢ غم","٠٫٠٤ غم","١٠٠ غم"],"a":3},{"l":2,"k":"p","q":"قطعة كتلتها ٢٤ غم وأبعادها ٢ سم × ٣ سم × ٢ سم، فكثافتها:","o":["١٢ غم/سم³","٠٫٥ غم/سم³","٢ غم/سم³","٢٨٨ غم/سم³"],"a":2}],"hints":{"ما المقصود بالكثافة؟":"فكّر في النسبة بين الكتلة والحجم.\nالكثافة تخصّ وحدة واحدة من الحجم.","جسم كتلته ١٥٠ غم وحجمه ٣٠ سم³، فكثافته:":"استعمل القانون: الكثافة = الكتلة ÷ الحجم.\nاقسم ١٥٠ على ٣٠.","سبيكة ذهبية كتلتها ٩٥ غم وكثافتها ١٩ غم/سم³، فحجمها:":"أعد ترتيب القانون ليعطيك الحجم.\nالحجم = الكتلة ÷ الكثافة.","قطعة أبعادها ١٠ سم × ٥ سم × ٤ سم وكتلتها ١٠٠ غم، فكثافتها:":"احسب الحجم أولاً من الأبعاد الثلاثة.\nثم اقسم الكتلة على الحجم."}},{"t":"الضغط","e":["# نشاط ١: مساحة وضغط","المواد والأدوات: قطعة رخام على شكل متوازي مستطيلات، وقطعة إسفنج منتظمة، وميزان إلكتروني حسّاس.","- نضع قطعة الإسفنج على سطح أفقي.","- نقيس كتلة قطعة الرخام بالميزان ثم نحسب وزنها.","- نضع الرخام على قاعدته الكبيرة فوق الإسفنج (الشكل أ)، ونلاحظ مقدار انضغاط الإسفنج، ثم نحسب: وزن الرخام ÷ مساحة القاعدة الكبيرة.","- نضع الرخام على قاعدته الصغيرة (الشكل ب)، ونلاحظ الانضغاط، ثم نحسب: وزن الرخام ÷ مساحة القاعدة الصغيرة.","! الاستنتاج: كلما صغرت مساحة السطح الملامس للإسفنج ازدادت نسبة الوزن إلى المساحة وازداد انضغاط الإسفنج.","# نشاط ٢: قوة وضغط","المواد والأدوات: قطعة إسفنج منتظمة سميكة، وثلاث قطع رخام على شكل متوازي مستطيلات.","- نضع إحدى قطع الرخام على قاعدتها العريضة فوق الإسفنج (الشكل أ) ونلاحظ مقدار الانضغاط.","- نضع القطعة الثانية فوق الأولى (الشكل ب) فيزداد انضغاط الإسفنج.","- نضع القطعة الثالثة فوق الثانية (الشكل ج) فيزداد الانضغاط أكثر.","! الاستنتاج: كلما زادت القوة (الوزن) المؤثرة على الإسفنج مع ثبات المساحة ازداد الضغط الواقع عليه.","# مفهوم الضغط","- الضغط: النسبة بين القوة العمودية المؤثرة على سطح ما ومساحة ذلك السطح.","يزداد الضغط بزيادة القوة المؤثرة على سطح معيّن، وينقص بنقصانها.","ويقلّ الضغط بزيادة مساحة السطح الذي تؤثر فيه قوة عمودية معيّنة، ويزداد بنقصان المساحة.","# قانون الضغط ووحداته","الضغط = القوة العمودية المؤثرة ÷ مساحة السطح، أي: ض = ق ÷ م","|الكمية الفيزيائية|وحدة قياسها","|القوة (ق)|نيوتن = كغم.م/ث²","|المساحة (م)|م²","|الضغط (ض)|نيوتن/م² = باسكال","! نستنتج من القانون: ق = ض × م، وم = ق ÷ ض. ووزن الجسم = الكتلة × تسارع الجاذبية الأرضية (جـ = ١٠ م/ث²).","# أمثلة محلولة","? أثّر جسم بقوة مقدارها ٢٠٠ نيوتن في سطح أفقي مساحته ٠٫٠١ م². احسب مقدار الضغط الواقع على ذلك السطح. || المعطيات: ق = ٢٠٠ نيوتن، م = ٠٫٠١ م². ض = ق ÷ م = ٢٠٠ ÷ ٠٫٠١ = ٢٠٠٠٠ باسكال.","? يؤثر صندوق بقوة عمودية مقدارها ٥٠٠ نيوتن في سطح مساحته ٠٫٢٥ م². ما الضغط؟ || ض = ق ÷ م = ٥٠٠ ÷ ٠٫٢٥ = ٢٠٠٠ باسكال.","? كتلة طالب ٥٠ كغم، ومساحة قدميه معاً ٠٫٠٢٥ م²، فما الضغط الذي يؤثر به على الأرض؟ (جـ = ١٠ م/ث²) || الوزن = الكتلة × جـ = ٥٠ × ١٠ = ٥٠٠ نيوتن. ض = ق ÷ م = ٥٠٠ ÷ ٠٫٠٢٥ = ٢٠٠٠٠ باسكال.","? ما القوة التي يؤثر بها مكبس مساحته ٠٫٢ م² إذا كان الضغط الناتج ٥٠٠٠ باسكال؟ || ق = ض × م = ٥٠٠٠ × ٠٫٢ = ١٠٠٠ نيوتن.","? قطعة نحاس مكعبة حجمها ٠٫٠٠١ م³ وكثافتها ٨٦٠٠ كغم/م³، وُضعت على طاولة على أحد أوجهها (مساحته ٠٫٠١ م²). جد: كتلتها، ووزنها، والضغط الذي تؤثر به. (جـ = ١٠ م/ث²) || الكتلة = الكثافة × الحجم = ٨٦٠٠ × ٠٫٠٠١ = ٨٫٦ كغم. الوزن = ٨٫٦ × ١٠ = ٨٦ نيوتن. الضغط = ٨٦ ÷ ٠٫٠١ = ٨٦٠٠ باسكال.","# تطبيقات حياتية","- ينغرس المسمار الحاد في الخشب بسهولة لأن مساحة رأسه صغيرة فيزداد الضغط للقوة نفسها.","- تُصنع أحذية الثلج العريضة لتزيد المساحة فيقلّ الضغط على سطح الثلج.","- عند الوقوف على قدم واحدة يتضاعف الضغط على الأرض لأن المساحة تصير النصف."],"q":["- عرّف الضغط واكتب قانونه ووحدة قياسه.","- كيف يتغيّر الضغط إذا زادت القوة مع ثبات المساحة؟ وإذا زادت المساحة مع ثبات القوة؟","- ماذا استنتجت من وضع قطعة الرخام على قاعدتها الكبيرة ثم الصغيرة فوق الإسفنج؟","- أثّرت قوة ٣٠٠ نيوتن في سطح مساحته ٠٫١٥ م². احسب الضغط.","- لماذا نستعمل سكيناً حادّةً عند القطع؟"],"quiz":[{"l":0,"k":"n","q":"ما قانون الضغط؟","o":["الضغط = القوة × المساحة","الضغط = القوة ÷ المساحة","الضغط = المساحة ÷ القوة","الضغط = القوة − المساحة"],"a":1},{"l":0,"k":"n","q":"وحدة قياس الضغط (باسكال) تساوي:","o":["نيوتن/م²","نيوتن × م²","كغم/م³","م/ث²"],"a":0},{"l":0,"k":"n","q":"وحدة قياس المساحة المستعملة في قانون الضغط هي:","o":["م³","نيوتن","كغم","م²"],"a":3},{"l":0,"k":"n","q":"وحدة القوة نيوتن تساوي:","o":["كغم/م³","غم/سم³","كغم.م/ث²","نيوتن/م²"],"a":2},{"l":0,"k":"n","q":"عند زيادة القوة العمودية مع ثبات المساحة فإن الضغط:","o":["يقلّ","لا يتغير","يزداد","يصبح صفراً"],"a":2},{"l":0,"k":"n","q":"عند زيادة مساحة السطح مع ثبات القوة فإن الضغط:","o":["يزداد","يقلّ","لا يتغير","يتضاعف"],"a":1},{"l":0,"k":"n","q":"في نشاط الإسفنج، أي الوضعين يسبب انضغاطاً أكبر؟","o":["الرخام على القاعدة الصغيرة","الرخام على القاعدة الكبيرة","الوضعان متساويان","لا يسبب أي منهما انضغاطاً"],"a":0},{"l":0,"k":"n","q":"يُعبَّر عن الضغط بأنه النسبة بين القوة:","o":["الأفقية ومساحة السطح","والكتلة","والحجم","العمودية ومساحة السطح"],"a":3},{"l":1,"k":"p","q":"قوة ١٠٠ نيوتن تؤثر في مساحة ٠٫٥ م²، فالضغط:","o":["٥٠ باسكال","٥٠٠ باسكال","٠٫٠٠٥ باسكال","٢٠٠ باسكال"],"a":3},{"l":1,"k":"p","q":"ضغط ١٥٠٠ باسكال ناتج عن قوة ٣٠٠ نيوتن، فمساحة السطح:","o":["٥ م²","٤٥٠٠٠٠ م²","٠٫٢ م²","١٢٠٠ م²"],"a":2},{"l":1,"k":"p","q":"ضغط ٥٠٠ باسكال على مساحة ٢ م²، فالقوة المؤثرة:","o":["٢٥٠ نيوتن","١٠٠٠ نيوتن","٥٠٢ نيوتن","٠٫٠٠٤ نيوتن"],"a":1},{"l":1,"k":"p","q":"جسم كتلته ٥ كغم، فوزنه (جـ = ١٠ م/ث²):","o":["٥٠ نيوتن","٠٫٥ نيوتن","٥ نيوتن","١٥ نيوتن"],"a":0},{"l":1,"k":"p","q":"وُضعت قطعة رخام وزنها ٥٠ نيوتن على قاعدة مساحتها ٠٫١ م²، فالضغط:","o":["٥٠٠ باسكال","٥ باسكال","٥٠٠٠ باسكال","٠٫٠٠٢ باسكال"],"a":0},{"l":1,"k":"p","q":"وُضعت قطعة رخام أخرى فوق الأولى فوق الإسفنج. ماذا يحدث لانضغاط الإسفنج؟","o":["يقلّ لأن الوزن زاد","لا يتغير","ينعدم","يزداد لأن القوة زادت"],"a":3},{"l":1,"k":"p","q":"إبرة ومسمار لهما القوة نفسها؛ تنفذ الإبرة أسهل لأن:","o":["مساحة رأسها كبيرة","كتلتها أكبر","مساحة رأسها صغيرة فالضغط أكبر","لونها أفتح"],"a":2},{"l":1,"k":"p","q":"عند الوقوف على قدم واحدة بدل قدمين يصبح الضغط على الأرض:","o":["أقلّ (النصف)","أكبر (يتضاعف)","نفسه","صفراً"],"a":1},{"l":2,"k":"p","q":"جسم يؤثر بقوة ٢٠٠ نيوتن في ٠٫٠١ م². إذا تضاعفت المساحة مع بقاء القوة فالضغط الجديد:","o":["٤٠٠٠٠ باسكال","١٠٠٠٠ باسكال","٢٠٠٠٠ باسكال","٥٠٠٠ باسكال"],"a":1},{"l":2,"k":"p","q":"طالب كتلته ٥٠ كغم ومساحة قدميه معاً ٠٫٠٢٥ م²، فضغطه على الأرض (جـ = ١٠):","o":["٢٠٠٠٠ باسكال","٢٠٠٠ باسكال","١٢٥٠٠ باسكال","٥٠٠ باسكال"],"a":0},{"l":2,"k":"p","q":"الطالب نفسه وقف على قدم واحدة مساحتها ٠٫٠١٢٥ م²، فضغطه:","o":["٢٠٠٠٠ باسكال","١٠٠٠٠ باسكال","٦٢٫٥ باسكال","٤٠٠٠٠ باسكال"],"a":3},{"l":2,"k":"p","q":"قطعة نحاس حجمها ٠٫٠٠١ م³ وكثافتها ٨٦٠٠ كغم/م³ على وجه مساحته ٠٫٠١ م²، فالضغط (جـ = ١٠):","o":["٨٦٠ باسكال","٨٦٠٠٠ باسكال","٨٦٠٠ باسكال","٨٫٦ باسكال"],"a":2},{"l":2,"k":"p","q":"ثلاث قطع رخام وزن كل منها ٢٠ نيوتن وُضعت فوق بعضها على قاعدة مساحتها ٠٫١ م²، فالضغط على الإسفنج:","o":["٢٠٠ باسكال","٦ باسكال","٦٠٠ باسكال","١٢٠٠ باسكال"],"a":2},{"l":2,"k":"p","q":"إذا زادت القوة إلى ثلاثة أمثالها وزادت المساحة إلى ثلاثة أمثالها فإن الضغط:","o":["يصبح ٩ أمثال","لا يتغير","يصبح ثلاثة أمثال","يصبح ثلث ما كان"],"a":1},{"l":2,"k":"p","q":"ضغط ٤٠٠٠ باسكال على مساحة ٠٫٥ م²، فالقوة العمودية:","o":["٢٠٠٠ نيوتن","٨٠٠٠ نيوتن","٠٫٠٠٠١٢٥ نيوتن","٤٠٠٠٫٥ نيوتن"],"a":0},{"l":2,"k":"p","q":"كتلة ٨ كغم تستقر على مساحة ٠٫٠٤ م² (جـ = ١٠)، فالضغط:","o":["٢٠٠ باسكال","٣٢٠٠ باسكال","٠٫٠٠٥ باسكال","٢٠٠٠ باسكال"],"a":3}],"hints":{"ما قانون الضغط؟":"فكّر في نسبة بين قوة ومساحة.\nالقوة في البسط والمساحة في المقام.","ضغط ١٥٠٠ باسكال ناتج عن قوة ٣٠٠ نيوتن، فمساحة السطح:":"أعد ترتيب القانون: م = ق ÷ ض.\nاقسم ٣٠٠ على ١٥٠٠.","طالب كتلته ٥٠ كغم ومساحة قدميه معاً ٠٫٠٢٥ م²، فضغطه على الأرض (جـ = ١٠):":"احسب الوزن أولاً: الكتلة × جـ.\nثم اقسم الوزن على المساحة.","قطعة نحاس حجمها ٠٫٠٠١ م³ وكثافتها ٨٦٠٠ كغم/م³ على وجه مساحته ٠٫٠١ م²، فالضغط (جـ = ١٠):":"الكتلة = الكثافة × الحجم، ثم الوزن = الكتلة × جـ.\nبعدها اقسم الوزن على المساحة."}},{"t":"الضغط في السوائل","e":["# تمهيد: حالات المادة والموائع","تتكوّن المادة من دقائق صغيرة وتوجد في حالات ثلاث: الصلبة والسائلة والغازية.","- الحالة الصلبة: تتحرك دقائق المادة حركة موضعية اهتزازية، وتمتاز بثبات الحجم والشكل لأن قوى التماسك بين دقائقها كبيرة.","- الحالة السائلة: تحتفظ المادة بحجمها وتأخذ شكل الإناء الذي توضع فيه، بسبب ضعف قوى التماسك بين دقائقها.","- الحالة الغازية: تكاد تكون قوى التماسك معدومة بين جزيئات المادة، فلا تحتفظ بشكل ثابت ولا بحجم ثابت.","- الموائع: اسم يُطلق على السوائل والغازات.","# نشاط ١: ضغط الماء","المواد والأدوات: وعاءان مختلفان منتظما القاعدة، وماء.","- نحسب مساحة قاعدة كل من الوعاءين.","- نضع في الوعاء الأول حجماً معيناً من الماء، ونحسب كتلة الماء ووزنه ثم ضغطه على القاعدة.","- نسكب الماء من الوعاء الأول في الوعاء الثاني، ونحسب ضغط الماء على قاعدته.","- حجم الماء ثابت لم يتغير بالسكب لكن شكله تغيّر (أخذ شكل الإناء)، أما الضغط على القاعدة فيختلف لأن مساحة القاعدة تختلف.","# علاقة الضغط في السوائل","تؤثر الأرض في أي جسم قريب منها بقوة جذب تُعرف بالوزن، فيؤثر وزن الماء بقوة على قاعدة الإناء الموضوع فيه مسبباً ضغطاً على قاعدته.","ضغط الماء على القاعدة = وزن الماء ÷ مساحة قاعدة الإناء.","وبما أن الوزن = الكتلة × جـ، والكتلة = الحجم × الكثافة، والحجم = مساحة القاعدة × الارتفاع (للإناء الأسطواني أو متوازي المستطيلات) فإن مساحة القاعدة تُختصر.","- ضغط السائل: الارتفاع × الكثافة × جـ، أي ض = ل × ث × جـ","|الرمز|معناه|وحدته","|ض|ضغط السائل|باسكال","|ل|ارتفاع (عمق) السائل|م","|ث|كثافة السائل|كغم/م³","|جـ|تسارع الجاذبية الأرضية|١٠ م/ث²","! الضغط في السائل يعتمد على العمق والكثافة وجـ؛ ويزداد كلما ازداد العمق.","# أمثلة محلولة","? إذا كان عمق الماء خلف سدٍّ ما ٢٠ متراً، فما ضغط الماء عند قاعدة السد؟ (كثافة الماء ١٠٠٠ كغم/م³، جـ = ١٠ م/ث²) || الضغط = الارتفاع × الكثافة × جـ = ٢٠ × ١٠٠٠ × ١٠ = ٢٠٠٠٠٠ باسكال.","? وما ضغط الماء عند نقطة على عمق ٥ أمتار من سطح الماء؟ || الضغط = ٥ × ١٠٠٠ × ١٠ = ٥٠٠٠٠ باسكال.","? وعاء قاعدته منتظمة مساحتها ٠٫٠١ م² فيه ماء حجمه ٠٫٠٠٢ م³. جد وزن الماء ثم ضغطه على القاعدة ثم ارتفاع الماء. || الكتلة = ١٠٠٠ × ٠٫٠٠٢ = ٢ كغم. الوزن = ٢ × ١٠ = ٢٠ نيوتن. الضغط = ٢٠ ÷ ٠٫٠١ = ٢٠٠٠ باسكال. الارتفاع = ٠٫٠٠٢ ÷ ٠٫٠١ = ٠٫٢ م، وبالتحقق: ٠٫٢ × ١٠٠٠ × ١٠ = ٢٠٠٠ باسكال.","? ما عمق الماء الذي يكون عنده الضغط ٤٠٠٠٠٠ باسكال؟ || ل = ض ÷ (ث × جـ) = ٤٠٠٠٠٠ ÷ (١٠٠٠ × ١٠) = ٤٠ م.","# نشاط ٢: هيا نلعب","المواد والأدوات: قارورة بلاستيكية، ومسمار، ومصدر حراري، ولاصق، وملقط خشبي.","- نمسك المسمار بالملقط ونسخّنه على اللهب، ثم نثقب القارورة بثلاثة ثقوب عمودية متباعدة.","- نملأ القارورة بالماء ونتركها مفتوحة ونسجّل ملاحظاتنا: يندفع الماء من الثقب الأسفل بشكل أكبر لأن ضغط الماء يزداد بزيادة العمق.","- نفرغ القارورة ونغلق الثقوب جيداً باللاصق، ثم نملؤها بالماء ونغلقها بالسدادة، ونزيل اللاصق ونسجّل ملاحظاتنا.","- نضغط بيدينا على جانبي القارورة من الأعلى فنلاحظ اندفاع الماء من الثقوب بزيادة متساوية.","! احتياطات السلامة: الحذر من لهب المصدر الحراري وحرارة المسمار الساخن عند الثقب.","# مبدأ باسكال والمكبس الهيدروليكي","إذا تعرض سائل محصور إلى ضغط خارجي فإن ضغط هذا السائل يزداد بمقدار الضغط الخارجي الواقع عليه، فيزداد بذلك ضغط السائل على جدران الوعاء الذي يحويه وعند أي نقطة داخله بنفس المقدار.","- مبدأ باسكال: إذا وقع ضغط خارجي على سائل محصور فإن هذا الضغط ينتقل إلى جميع أجزاء السائل وفي جميع الاتجاهات بالتساوي.","- المكبس الهيدروليكي: يتكون من أسطوانة صغرى مساحة سطحها م₁ وأسطوانة كبرى مساحة سطحها م₂، يملؤهما سائل.","عند التأثير بقوة ق₁ في الأسطوانة الصغرى يتولد ضغط ض₁ ينتقل بالتساوي إلى الأسطوانة الكبرى فينشأ عليها ضغط ض₂، وبما أن ض₁ = ض₂ فإن: ق₁ ÷ م₁ = ق₂ ÷ م₂، ومنها م₂ ÷ م₁ = ق₂ ÷ ق₁.","- الفائدة الآلية للمكبس الهيدروليكي: النسبة بين مساحة الأسطوانة الكبرى إلى مساحة الأسطوانة الصغرى (م₂ ÷ م₁ = ق₂ ÷ ق₁).","? وقف رجل كتلته ١٠٠ كغم على الأسطوانة الكبرى لمكبس هيدروليكي مساحتها ٠٫٢ م²، فإذا وقف ابنه على الأسطوانة الصغرى التي مساحتها ٠٫٠٥ م²، فجد الفائدة الآلية ووزن الابن اللازم لرفع والده. || الفائدة الآلية = م₂ ÷ م₁ = ٠٫٢ ÷ ٠٫٠٥ = ٤. وزن الأب = ١٠٠ × ١٠ = ١٠٠٠ نيوتن. وزن الابن ÷ ٠٫٠٥ = ١٠٠٠ ÷ ٠٫٢، فوزن الابن = ٢٥٠ نيوتن.","? في مكبس هيدروليكي مساحة الأسطوانة الصغرى ٠٫٠٢ م² والكبرى ٠٫٤ م². ما الفائدة الآلية، وما القوة على الكبرى إذا أثرت قوة ١٠٠ نيوتن في الصغرى؟ || الفائدة الآلية = ٠٫٤ ÷ ٠٫٠٢ = ٢٠. ق₂ = ق₁ × ٢٠ = ١٠٠ × ٢٠ = ٢٠٠٠ نيوتن.","? فائدة آلية لمكبس تساوي ٤٠، ما القوة الصغرى اللازمة لرفع سيارة وزنها ١٢٠٠٠ نيوتن؟ || ق₁ = ق₂ ÷ الفائدة الآلية = ١٢٠٠٠ ÷ ٤٠ = ٣٠٠ نيوتن.","# تطبيقات حياتية","- المكبس الهيدروليكي: يرفع السيارات الثقيلة بقوة صغيرة.","- نظام الكوابح (الفرامل) في السيارات يعمل بمبدأ باسكال.","- الماء خلف السد: يزداد الضغط بالعمق، لذلك يكون جدار السد عند القاعدة أسمك."],"q":["- ما حالات المادة الثلاث؟ وما المقصود بالموائع؟","- اكتب قانون ضغط السائل وبيّن ما تعتمد عليه قيمته.","- لماذا يندفع الماء بقوة أكبر من الثقب الأسفل في القارورة؟","- ما نص مبدأ باسكال؟ اذكر تطبيقين عليه.","- احسب الضغط عند عمق ١٥ م تحت سطح الماء (ث = ١٠٠٠ كغم/م³، جـ = ١٠ م/ث²)."],"quiz":[{"l":0,"k":"n","q":"في الحالة السائلة تحتفظ المادة:","o":["بشكلها وحجمها معاً","بشكلها دون حجمها","بحجمها وتأخذ شكل الإناء","لا بشكله
