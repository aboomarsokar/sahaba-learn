","ذائبية ملح ٣٥ غم/١٠٠ غم ماء عند ٣٠ °س. أُضيف ٤٥ غم منه إلى ١٠٠ غم ماء مع التحريك. كتلة الملح التي تبقى دون ذوبان:":"كم غراماً يذوب على الأكثر؟ اطرحه مما أُضيف.","سُخّن محلول مشبع وأُذيب فيه مزيد من الملح، ثم بُرّد ببطء ودون تحريك فلم يترسّب شيء. نوع المحلول الآن:":"زاد المذاب عن حدّ الإشباع دون أن يترسّب."}}]},{"title":"أجهزة الجسم والحرارة","ic":"cell","color":"#cfe2b0","uq":[[0,"ما اسم الوحدة البنائية للجهاز العصبي؟",["الخلية العضلية","الخلية العصبية (العصبون)","الخلية الطلائية","خلية الدم"],1],[0,"مم يتكوّن الجهاز العصبي المركزي؟",["الدماغ والحبل الشوكي","الأعصاب الدماغية فقط","الأعصاب الشوكية فقط","المخ والعين"],0],[0,"أي غدة تفرز الأنسولين والغلوكاغون؟",["الدرقية","النخامية","الكظرية","البنكرياس"],3],[0,"ما الجزء الذي يجمع الموجات الصوتية في الأذن؟",["القوقعة","الدهليز","صيوان الأذن","المطرقة"],2],[1,"أي أجزاء الدماغ ينسّق للحفاظ على توازن الجسم؟",["المخ","المخيخ","القنطرة","النخاع المستطيل"],1],[1,"ما الأثر الذي يظهر عند إفراز الأدرينالين؟",["زيادة ضربات القلب واحمرار الوجه","انخفاض عدد ضربات القلب","زيادة إفراز العصارات الهاضمة","نقص حركات التنفس"],0],[0,"درجة الحرارة صفة للمادة تحدد:",["اتجاه انتقال الطاقة الحرارية بين الأجسام المتلامسة","كتلة الجسم","نوع مادة الجسم","حجم الجسم"],0],[0,"السعة الحرارية لجسم تساوي:",["الكتلة × الحرارة النوعية","الكتلة ÷ الحرارة النوعية","الحرارة النوعية × الزمن","الكتلة + الحجم"],0],[0,"أيّ هذه المواد رديء التوصيل للحرارة؟",["الحديد","النحاس","الخشب","الألومنيوم"],2],[0,"تنتقل الطاقة من الشمس إلى الأرض بـ:",["التوصيل","الإشعاع","الضغط","التمدد"],1],[1,"كمية الحرارة المكتسبة ٠٫١ كغم نحاس (ح = ٣٨٧) ارتفعت حرارتها ٢٠ س° تساوي:",["٣٨٧ جول","٧٧٤ جول","٧٧٤٠ جول","٣٩ جول"],1],[1,"مكعب الجليد ينصهر أسرع في الماء الأكبر كتلة عند التساوي في درجة الحرارة لأن:",["طاقته الحرارية تتناسب طردياً مع كتلته","الماء الأكبر أبرد","الجليد يذوب بالضوء","درجة حرارته أقل"],0]],"lessons":[{"t":"الجهاز العصبي","e":["# أنواع الخلايا العصبية (نشاط ١)","الخلايا العصبية (العصبونات) هي وحدة البناء والوظيفة في الجهاز العصبي. تتشابه في التركيب وتختلف في الوظيفة، كما تختلف في أطوالها: فمنها ما لا يتجاوز طوله بضع سنتمترات، ومنها ما يزيد طوله على المتر.","- الخلية الحسية: تنقل المؤثرات من عضو الاستقبال إلى الجهاز العصبي المركزي (الدماغ والحبل الشوكي).","- الخلية الحركية: تنقل أوامر الجهاز العصبي المركزي إلى عضو الاستجابة (غدة أو عضلة).","- الخلية الموصلة: تصل بين الخلايا الحسية والخلايا الحركية.","# أجزاء الخلية العصبية","تتكوّن الخلية العصبية من أجزاء أساسية تظهر في الشكل بأسمائها: زوائد شجرية وجسم الخلية والمحور الأسطواني وتشعبات نهائية، وتتصل الخلية الحسية بمستقبلات حسية في عضو الاستقبال (كالجلد).","- الزوائد الشجرية: زوائد قصيرة ورفيعة ومتفرعة تخرج من جسم الخلية.","- جسم الخلية: الجزء الذي يحتوي على النواة.","- المحور الأسطواني: امتداد طويل سميك وغير متفرع غالباً.","- المستقبلات الحسية: نهايات الخلية الحسية في عضو الاستقبال (جلد مثلاً).","- التشعبات النهائية: نهايات الخلية الحركية في عضو الاستجابة (عضلة).","|نوع الخلية|وظيفتها|تتصل بـ","|حسية|تنقل المؤثرات إلى الجهاز العصبي المركزي|مستقبلات حسية في عضو الاستقبال","|موصلة|تصل بين الخلايا الحسية والحركية|الخلايا الحسية والحركية","|حركية|تنقل الأوامر إلى عضو الاستجابة|تشعبات نهائية في عضلة أو غدة","? لمست يدك إبريق شاي ساخناً فسحبتها فوراً. كيف مرّت الإشارة بين أنواع الخلايا العصبية؟ || المستقبلات الحسية في الجلد (عضو الاستقبال) تلتقط المؤثر ← الخلية الحسية تنقله إلى الجهاز العصبي المركزي ← الخلية الموصلة تصل بينها وبين الخلية الحركية ← الخلية الحركية تنقل الأمر إلى العضلة (عضو الاستجابة) فتنقبض وتسحب اليد.","? خلية عصبية تنقل أوامر من الدماغ إلى غدة. ما نوعها وما اسم نهايتها في عضو الاستجابة؟ || تنقل أوامر من الجهاز العصبي المركزي إلى عضو استجابة، فهي خلية حركية، وتنتهي بتشعبات نهائية في الغدة.","# جهازا الجهاز العصبي (نشاط ٢)","يمثّل الجهاز العصبي المركزي الجزء الأكبر من الجهاز العصبي، وهو ينظّم أنشطة أجهزة الجسم وخلاياه عن طريق مجموعة من الأعصاب المتصلة به والمنتشرة في أنحاء الجسم. أما الجهاز العصبي الطرفي فيشكّل حلقة وصل بين الجهاز العصبي المركزي وباقي أجزاء الجسم.","|الجهاز|مكوّناته","|الجهاز العصبي المركزي|الدماغ والحبل الشوكي","|الجهاز العصبي الطرفي|الأعصاب الدماغية والأعصاب الشوكية","! في الشكل: الدماغ والحبل الشوكي يتبعان الجهاز العصبي المركزي، أما الأعصاب المخية (الدماغية) والأعصاب الشوكية فتتبع جهاز الأعصاب الطرفية.","# الدماغ (نشاط ٣ و٤)","يقع الدماغ داخل تجويف الجمجمة ويتكوّن من عدد هائل من الخلايا العصبية. وقد حماه الله من المؤثرات الخارجية بوسائل مرتبة من الخارج إلى الداخل: الشعر، ثم الجلد، ثم الجمجمة، ثم أغشية السحايا، ثم السائل المخي.","- المخ: أكبر أجزاء الدماغ، ويتكوّن من نصفين متماثلين (أيمن وأيسر) يفصل بينهما شق طولي ويتصلان معاً بجسر من الألياف العصبية يسمى الجسر الجاسئ.","- التلافيف: انثناءات عديدة يحتوي عليها السطح الخارجي للمخ.","- المخيخ: ثاني أكبر أجزاء الدماغ، يقع أسفل المخ ويتكوّن من ثلاثة فصوص وينتشر على سطحه تلافيف.","- جذع الدماغ: كتلة دماغية تتصل بالحبل الشوكي وتتكوّن من النخاع المستطيل والدماغ المتوسط والقنطرة.","|الجزء|وظيفته","|المخ|استقبال المعلومات الحسية من الحواس وإدراكها","|المخ|تنظيم حركة العضلات الإرادية مثل الكتابة","|المخ|العمليات العقلية: التذكر والفهم والتفكير والابتكار","|المخيخ|معالجة المعلومات الحسية والتنسيق للحفاظ على توازن الجسم وإدراك حركاته","! الجزء الأيسر من المخ يتحكم باليد اليمنى للكتابة، والجزء الأيمن يتحكم باليد اليسرى، فالتحكم يكون بالعكس.","في الشكل مراكز مختلفة في المخ: مركز النطق، ومركز الكتابة، ومراكز السمع (لكل أذن)، ومراكز الرؤية (لكل حقل رؤيا)، ومركز تحليل المعلومات الحسية، ومركز التفكير الرياضي والتفسير المنطقي، ومركز تحليل الحيز المكاني.","? أصيب شخص بضرر في الجزء الأيسر من المخ. أي يد ستتأثر في الكتابة؟ ولماذا؟ || اليد اليمنى؛ لأن الجزء الأيسر من المخ يتحكم باليد اليمنى للكتابة، والجزء الأيمن يتحكم باليد اليسرى (التحكم بالعكس).","? يرى أحمد وردة ويشمّها ويتذكر اسمها. أي جزء من الدماغ يستقبل هذه المعلومات ويقوم بالتذكر والفهم؟ || المخ؛ فهو يستقبل المعلومات الحسية من الحواس المختلفة ويدركها، ويقوم بالعمليات العقلية مثل التذكر والفهم والتفكير.","# جذع الدماغ والحبل الشوكي","- ينقل جذع الدماغ المعلومات الحسية من أعضاء الحس إلى الدماغ، وينقل الأوامر من الدماغ إلى أعضاء الاستجابة (عضلة، غدة).","- يسيطر جذع الدماغ على الأفعال اللاإرادية: تحريك العين والرأس، والمضغ، والبلع، وإفراز اللعاب، والهضم، وحركات التنفس، ونبض القلب؛ وبذلك يحافظ على اتزان البيئة الداخلية للجسم.","الحبل الشوكي يتصل بالنخاع المستطيل، ويمتد داخل قناة العمود الفقري. تخرج منه مجموعة من الأعصاب الشوكية تربطه والدماغ بجميع أجزاء الجسم.","- ينقل الحبل الشوكي المعلومات الحسية من أعضاء الحس إلى الدماغ، وينقل أوامر الدماغ إلى أعضاء الاستجابة.","- تصدر عنه أحياناً أوامر إلى العضلات الهيكلية كردّ فعل سريع للمؤثرات الخارجية دون الرجوع إلى الدماغ، وهو الفعل المنعكس.","! الفعل المنعكس: استجابة سريعة يقوم بها الحبل الشوكي دون الرجوع إلى الدماغ، كما يحدث عند التعرض لوخزة دبوس.","? وخزتَ إصبعك بدبوس فسحبتَ يدك قبل أن تشعر بالألم. ما سبب سرعة الاستجابة؟ || هذا فعل منعكس: يصدر الحبل الشوكي الأمر إلى العضلات الهيكلية مباشرة دون الرجوع إلى الدماغ، فتكون الاستجابة سريعة وتحمي الجسم من الأذى.","# الجهاز العصبي الطرفي","يتكوّن من مجموعة من الأعصاب تربط الجهاز العصبي المركزي بجميع أجهزة الجسم وأعضائه، وهي نوعان:","- الأعصاب الدماغية: عددها ١٢ زوجاً تصل إلى الرأس والعنق، ما عدا زوج العصب العاشر الذي يصل إلى الأحشاء الداخلية في الصدر والبطن.","- الأعصاب الشوكية: عددها ٣١ زوجاً تتفرع إلى أعضاء الجسم المختلفة.","- العصب: يتكوّن من ألياف عصبية على شكل حزم محاطة بنسيج ضام، وفي مقطعه المستعرض نرى الألياف العصبية والنسيج الضام وعرقاً دموياً.","- الألياف الحسية: تنقل الإحساسات من أعضاء الحس إلى الجهاز العصبي المركزي (الدماغ والحبل الشوكي).","- الألياف الحركية: تنقل أوامر الجهاز العصبي المركزي إلى أعضاء الاستجابة (عضلة أو غدة).","|نوع الأعصاب|العدد|تصل إلى","|الدماغية|١٢ زوجاً|الرأس والعنق (والعاشر إلى الأحشاء في الصدر والبطن)","|الشوكية|٣١ زوجاً|أعضاء الجسم المختلفة","# جسمي والخطر (نشاط ٥)","الجهاز العصبي من أهم أجهزة جسم الإنسان، فهو الذي ينظّم عمل أجهزة الجسم وأعضائه المختلفة. وأي ضرر يلحق به يؤدي إلى خلل في قدرة الجسم على أداء وظائفه، وقد يسبب إعاقة في عضو معين أو شللاً كاملاً.","- تناول الغذاء الصحي.","- اتخاذ التدابير التي تقي الجسم من الإصابات.","- الحصول على قدر كاف من النوم والراحة.","- الابتعاد عن ملوثات البيئة."],"q":["- ما أنواع الخلايا العصبية، وما وظيفة كل نوع؟","- قارن بين الجهاز العصبي المركزي والجهاز العصبي الطرفي من حيث المكوّنات والوظيفة.","- ما وظائف المخ والمخيخ وجذع الدماغ؟","- كيف يحمي الله تعالى الدماغ من المؤثرات الخارجية؟","- ما الفعل المنعكس؟ أعطِ مثالاً وبيّن لماذا لا يمرّ عبر الدماغ."],"quiz":[{"l":0,"k":"n","q":"ما اسم الوحدة البنائية للجهاز العصبي؟","o":["الخلية العصبية (العصبون)","الخلية العضلية","الخلية الضامة","الخلية الطلائية"],"a":0},{"l":0,"k":"n","q":"أي أجزاء الخلية العصبية يحتوي على النواة؟","o":["الزوائد الشجرية","المحور الأسطواني","التشعبات النهائية","جسم الخلية"],"a":3},{"l":0,"k":"n","q":"ما اسم الخلايا العصبية التي تنقل أوامر الجهاز العصبي المركزي إلى عضو الاستجابة؟","o":["الخلايا الحسية","الخلايا الموصلة","الخلايا الحركية","الخلايا الضامة"],"a":2},{"l":0,"k":"n","q":"مم يتكوّن الجهاز العصبي المركزي؟","o":["الدماغ والأعصاب الشوكية","الدماغ والحبل الشوكي","الحبل الشوكي والأعصاب الدماغية","المخ والمخيخ فقط"],"a":1},{"l":0,"k":"n","q":"ما اسم الجسر من الألياف العصبية الذي يصل بين نصفي المخ؟","o":["القنطرة","الجسر الجاسئ","النخاع المستطيل","السحايا"],"a":1},{"l":0,"k":"n","q":"أي أجزاء الدماغ يقع أسفل المخ ويتكوّن من ثلاثة فصوص؟","o":["المخيخ","جذع الدماغ","المهاد","النخاع المستطيل"],"a":0},{"l":0,"k":"n","q":"كم عدد أزواج الأعصاب الشوكية؟","o":["١٢ زوجاً","١٠ أزواج","٤٠ زوجاً","٣١ زوجاً"],"a":3},{"l":0,"k":"n","q":"أين يمتد الحبل الشوكي؟","o":["داخل الجمجمة","داخل القفص الصدري فقط","داخل قناة العمود الفقري","تحت الجلد مباشرة"],"a":2},{"l":1,"k":"p","q":"الخلايا التي تصل بين الخلايا الحسية والخلايا الحركية هي:","o":["خلايا الدم","الخلايا الموصلة","الخلايا الحسية","الخلايا الطلائية"],"a":1},{"l":1,"k":"p","q":"أي الوسائل التالية ليست من وسائل حماية الدماغ من الخارج إلى الداخل؟","o":["العمود الفقري","الجمجمة","أغشية السحايا","السائل المخي"],"a":0},{"l":1,"k":"p","q":"في الشكل تظهر أعصاب مخية وأعصاب شوكية. لأي جهاز تنتمي الأعصاب الشوكية؟","o":["الجهاز العصبي المركزي","جذع الدماغ","المخيخ","جهاز الأعصاب الطرفية"],"a":3},{"l":1,"k":"p","q":"أصيب شخص بضرر في الجزء الأيمن من المخ. أي يد للكتابة تتأثر؟","o":["اليد اليمنى","اليدان معاً دائماً","اليد اليسرى","لا تتأثر أي يد"],"a":2},{"l":1,"k":"p","q":"أي الأفعال التالية يسيطر عليه جذع الدماغ؟","o":["حل مسألة رياضية","تذكر اسم صديق","نبض القلب وحركات التنفس","الكتابة بالقلم"],"a":2},{"l":1,"k":"p","q":"لمس طفل إبريقاً ساخناً فسحب يده. أي الخلايا تنقل الأمر إلى العضلة؟","o":["الخلية الحسية","الخلية الحركية","الخلية الضامة","الخلية الطلائية"],"a":1},{"l":1,"k":"p","q":"ما العصب الدماغي الذي يصل إلى الأحشاء الداخلية في الصدر والبطن؟","o":["زوج العصب العاشر","زوج العصب الأول","زوج العصب الثاني عشر","الأعصاب الشوكية فقط"],"a":0},{"l":1,"k":"p","q":"ما الذي يحيط بالألياف العصبية في العصب على شكل حزم؟","o":["نسيج عظمي","نسيج دهني فقط","نسيج طلائي","نسيج ضام"],"a":3},{"l":2,"k":"p","q":"ينقل عصب إحساس الحرارة من الجلد إلى الحبل الشوكي والدماغ. ما نوع الألياف العصبية فيه؟","o":["ألياف حركية","ألياف موصلة فقط","ألياف حسية","ألياف عظمية"],"a":2},{"l":2,"k":"p","q":"حدث لشخص ضرر في المخيخ فصار يفقد توازن جسمه عند المشي. ما تفسير ذلك؟","o":["المخ هو وحده المسؤول عن التوازن","المخيخ يعالج المعلومات الحسية وينسّق للحفاظ على توازن الجسم","الحبل الشوكي ينتج الأفكار","النخاع المستطيل يخزن الذاكرة"],"a":1},{"l":2,"k":"p","q":"ما تسلسل مرور الإشارة في فعل منعكس عند لمس شيء ساخن؟","o":["مستقبل حسي ← خلية حسية ← حبل شوكي ← خلية حركية ← عضلة","مستقبل حسي ← مخ ← مخيخ ← عضلة","عضلة ← خلية حركية ← حبل شوكي ← جلد","خلية حركية ← مستقبل حسي ← عضلة"],"a":0},{"l":2,"k":"p","q":"لماذا يعدّ الفعل المنعكس مفيداً للجسم؟","o":["لأنه يحتاج تفكيراً عميقاً","لأنه يتحكم بالكتابة","لأنه يخزّن الطعام","لأنه استجابة سريعة تحمي الجسم من الأذى دون الرجوع إلى الدماغ"],"a":3},{"l":2,"k":"p","q":"حادث شديد قطع الحبل الشوكي لشخص فلم تصل أوامر الدماغ إلى العضلات تحت موضع القطع. ماذا يتوقع؟","o":["زيادة في الذاكرة","لا شيء لأن الأعصاب تعمل بلا حبل شوكي","فقدان الرؤية فقط","شلل في الأعضاء التي لا تصلها الأوامر"],"a":3},{"l":2,"k":"p","q":"عصب يحتوي ألياف حسية وحركية معاً. ما الذي يمكنه أن يؤديه؟","o":["نقل الإحساس فقط","نقل الأوامر فقط","نقل الإحساس إلى الدماغ ونقل الأوامر إلى العضلة","تخزين الطاقة"],"a":2},{"l":2,"k":"p","q":"أي عادة تحافظ على سلامة الجهاز العصبي بحسب الرزمة؟","o":["السهر الطويل","نوم كافٍ وغذاء صحي وابتعاد عن الملوثات","الغذاء غير الصحي","التعرض للمواد الملوثة"],"a":1},{"l":2,"k":"p","q":"في الشكل: مخطط يوضح مسار إشارة من مستقبلات في جلد اليد إلى عضلة الذراع. أي ترتيب لأنواع الخلايا صحيح؟","o":["حسية ثم موصلة ثم حركية","حركية ثم موصلة ثم حسية","موصلة ثم حسية ثم حركية","حسية ثم حركية ثم موصلة"],"a":0}],"hints":{"ما اسم الوحدة البنائية للجهاز العصبي؟":"فكّر في وحدة البناء والوظيفة التي تتصل ببعضها لتكوّن الأعصاب.\nهي خلية متخصصة لها زوائد شجرية ومحور أسطواني.","أي أجزاء الدماغ يقع أسفل المخ ويتكوّن من ثلاثة فصوص؟":"ثاني أكبر أجزاء الدماغ، وله علاقة بالتوازن.\nاسمه يشبه اسم المخ لكنه أصغر.","أصيب شخص بضرر في الجزء الأيمن من المخ. أي يد للكتابة تتأثر؟":"تذكّر أن التحكم يكون بالعكس.\nنصف المخ الأيمن يتحكم بيدٍ في الجهة المقابلة.","لمس طفل إبريقاً ساخناً فسحب يده. أي الخلايا تنقل الأمر إلى العضلة؟":"العضلة عضو استجابة.\nأي الخلايا تنقل الأوامر من الجهاز العصبي المركزي إلى عضو الاستجابة؟","ما تسلسل مرور الإشارة في فعل منعكس عند لمس شيء ساخن؟":"الفعل المنعكس لا يمرّ بالدماغ بل بالحبل الشوكي.\nتبدأ الإشارة من المستقبل وتنتهي بالعضلة."}},{"t":"جهاز الغدد الصماء","e":["# نخامية وعملقة (نشاط ١)","يُصنَّف إبراهيم تقي الله الكثاني أطول شخص في العالم؛ يبلغ طوله الإجمالي ٢٫٤٦ متراً، وهو رجل مغربي الجنسية يعيش في فرنسا، ويملك أطول قدمين في العالم يبلغ طول قدمه ٣٨٫١ سنتيمتراً. وتدفعنا حالته إلى السؤال: ما العوامل المؤثرة في نمو الجسم، وهل للغدد دور في ذلك؟","الغدة النخامية غدة صغيرة تقع في قاعدة الدماغ داخل تجويف عظمي في قاعدة الجمجمة، لا تتجاوز كتلتها نصف غرام، وتتحكم بإفرازات كثير من العمليات الحيوية في جسم الإنسان، وتسيطر على عمل جميع الغدد الصماء.","- هرمون النمو: ينظّم معدل النمو؛ فزيادة إفرازه تسبب الإفراط في الطول (العملقة) ويصاحبها خمول في القدرات العقلية والجنسية.","- البرولاكتين: الهرمون المنشط لإفراز الحليب، يُفرَز بعد الولادة مباشرة فينشّط تصنيع الحليب وتجميعه في قنوات غدد الحليب في ثدي المرأة.","- الأوكسيتوسين: الهرمون المنشط لإدرار الحليب، ينشّط خروج الحليب أثناء الرضاعة إلى فم الرضيع.","|الهرمون|مصدره|وظيفته","|النمو|الغدة النخامية|تنظيم معدل النمو (زيادته تسبب العملقة)","|البرولاكتين|الغدة النخامية|تنشيط تصنيع الحليب بعد الولادة","|الأوكسيتوسين|الغدة النخامية|تنشيط خروج الحليب أثناء الرضاعة","! تُسمّى الغدة النخامية «سيدة الغدد» لأنها تسيطر على عمل جميع الغدد الصماء، مع أن كتلتها لا تتجاوز نصف غرام.","? شخص يزيد طوله عن المعتاد كثيراً مع خمول في قدراته العقلية. أي غدة وأي هرمون يُشتبه بزيادة إفرازه؟ || الغدة النخامية وهرمون النمو؛ فزيادة إفراز هرمون النمو تسبب الإفراط في الطول (العملقة) ويصاحبها خمول في القدرات العقلية والجنسية.","? لماذا تحتاج الأم المرضع إلى هرمونَي البرولاكتين والأوكسيتوسين؟ || البرولاكتين ينشّط تصنيع الحليب وتجميعه في قنوات غدد الحليب بعد الولادة، والأوكسيتوسين ينشّط خروج الحليب إلى فم الرضيع أثناء الرضاعة.","# الدرقية (نشاط ٢)","تُعدّ الغدة الدرقية واحدة من أكبر الغدد الصماء، وتقع في الناحية الأمامية للرقبة حيث تحيط بالقصبة الهوائية والحنجرة. تتكوّن من فصين وتشبه في شكلها الفراشة التي تفرد جناحيها. ويظهر في الشكل: الحنجرة، والقصبة الهوائية، وفص الغدة الأيمن وفصها الأيسر.","- هرمون الثيروكسين: ينظّم أكسدة الغذاء وإطلاق الطاقة على شكل حرارة، وينظّم النمو.","- هرمون الكالسيتونين: يلعب دوراً مهماً في توازن الكالسيوم في الدم.","|الغدة|موقعها|أهم هرموناتها","|الدرقية|الناحية الأمامية للرقبة حول القصبة الهوائية والحنجرة|الثيروكسين والكالسيتونين","? غدة تقع أمام الرقبة وتشبه الفراشة وتنظّم أكسدة الغذاء. ما هي، وما هرمونها؟ || الغدة الدرقية، وهرمونها الثيروكسين الذي ينظّم أكسدة الغذاء وإطلاق الطاقة على شكل حرارة وينظّم النمو.","# البنكرياس والسكر (نشاط ٣)","يقع البنكرياس خلف المعدة مباشرة في الجزء الخلفي من منطقة البطن، ويبلغ طوله حوالي ١٥ سم، ويرتبط بالاثني عشر بقناة قصيرة تسمى قناة البنكرياس لنقل إفرازاته الهاضمة. ويحتوي على تجمعات خلوية تسمى جزر لانغرهانز تشكل غدداً صماء تفرز هرمونين هما الأنسولين والغلوكاغون.","- الأنسولين: بعد وجبة غذائية يرتفع السكر في الدم عن معدله الطبيعي فتُحفَّز خلايا جزر لانغرهانز لإفراز الأنسولين، فينشّط أنزيمات تحوّل السكر إلى غلايكوجين يُخزَّن في الكبد والعضلات، فينقص تركيز السكر في الدم.","- الغلوكاغون: عند انخفاض تركيز السكر في الدم عن معدله تُحفَّز مجموعة أخرى من الخلايا في البنكرياس لتفرز الغلوكاغون، فيحوّل الغلايكوجين في الكبد والعضلات إلى سكر فيزداد تركيز السكر في الدم.","! معدل السكر الطبيعي في الدم يدور حول ٨٠ إلى ١٠٠ ملي غرام لكل ديسيلتر، ويعمل الهرمونان معاً على ثباته.","|الحالة|الهرمون المُفرَز|ماذا يحدث|النتيجة","|ارتفاع السكر بعد وجبة|الأنسولين|تحويل السكر إلى غلايكوجين يُخزَّن في الكبد والعضلات|ينقص السكر في الدم","|انخفاض السكر عن المعدل|الغلوكاغون|تحويل الغلايكوجين إلى سكر|يزداد السكر في الدم","? تناول خالد وجبة غنية بالسكر فارتفع سكر دمه كثيراً عن المعدل. اشرح ما يفعله جسمه لإعادة التوازن. || ترتفع نسبة السكر عن المعدل فتُحفَّز خلايا جزر لانغرهانز في البنكرياس لإفراز الأنسولين، وينشّط الأنسولين أنزيمات تحوّل السكر إلى غلايكوجين يُخزَّن في الكبد والعضلات، فينخفض السكر نحو المعدل الطبيعي (٨٠ إلى ١٠٠ ملي غرام لكل ديسيلتر).","? صام رجل ساعات طويلة فانخفض سكر دمه. أي هرمون يعمل وماذا يفعل؟ || يُفرَز الغلوكاغون من البنكرياس، فيحوّل الغلايكوجين المخزّن في الكبد والعضلات إلى سكر فيزداد تركيز السكر في الدم.","# الغدة الكظرية والخوف (نشاط ٤)","تقع الغدتان الكظريتان، كل غدة فوق كلية. وعند تعرض الجسم لموقف طارئ تستجيب هذه الغدد لأوامر الدماغ لتفرز هرمون الأدرينالين.","- يزيد الأدرينالين عدد ضربات القلب وحركات التنفس، ويسبب احمرار الوجه.","- ينشّط خلايا لانغرهانز في البنكرياس لتفرز الغلوكاغون الذي يحوّل غلايكوجين الكبد إلى غلوكوز في الدم لإمداد العضلات بالطاقة اللازمة لمواجهة الموقف.","- يثبّط إفراز العصارات الهاضمة من البنكرياس والأمعاء الدقيقة.","? تعرّض سامر لموقف مخيف فخفق قلبه بسرعة واحمر وجهه. فسّر ما حدث. || استجابت الغدتان الكظريتان لأوامر الدماغ فأفرزتا الأدرينالين، فزاد عدد ضربات القلب وحركات التنفس واحمرّ الوجه، ونشط إفراز الغلوكاغون ليرفع الغلوكوز في الدم ويمدّ العضلات بالطاقة.","# ملخص الغدد الصماء وهرموناتها","|الغدة|الموقع|الهرمونات","|النخامية|قاعدة الدماغ في تجويف عظمي بقاعدة الجمجمة|النمو، البرولاكتين، الأوكسيتوسين","|الدرقية|أمام الرقبة حول القصبة والحنجرة|الثيروكسين، الكالسيتونين","|البنكرياس (جزر لانغرهانز)|خلف المعدة في البطن|الأنسولين، الغلوكاغون","|الكظرية|فوق كل كلية|الأدرينالين","! الغدة النخامية تسيطر على عمل جميع الغدد الصماء، والأنسولين والغلوكاغون يعملان معاً على ثبات السكر في الدم."],"q":["- ما العوامل المؤثرة في نمو الجسم، وما دور الغدة النخامية في ذلك؟","- اذكر هرمونات الغدة النخامية ووظيفة كل منها.","- وضّح بمخطط كيف يعمل الأنسولين والغلوكاغون معاً على ثبات السكر في الدم.","- ماذا يحدث في جسمك عند التعرض لموقف خطير؟ وما الغدة المسؤولة؟","- أين تقع الغدة الدرقية وماذا تفرز؟"],"quiz":[{"l":0,"k":"n","q":"أين تقع الغدة النخامية؟","o":["في قاعدة الدماغ داخل تجويف عظمي بقاعدة الجمجمة","في الناحية الأمامية للرقبة","خلف المعدة","فوق الكلية"],"a":0},{"l":0,"k":"n","q":"ما الهرمون الذي ينظّم معدل نمو الجسم؟","o":["الأدرينالين","الأنسولين","الكالسيتونين","هرمون النمو"],"a":3},{"l":0,"k":"n","q":"أي غدة تقع في الناحية الأمامية للرقبة وتشبه الفراشة؟","o":["النخامية","الكظرية","الدرقية","البنكرياس"],"a":2},{"l":0,"k":"n","q":"ما الهرمون الذي ينظّم أكسدة الغذاء وإطلاق الطاقة على شكل حرارة؟","o":["الأنسولين","الثيروكسين","الغلوكاغون","الأوكسيتوسين"],"a":1},{"l":0,"k":"n","q":"أي هرمون يلعب دوراً مهماً في توازن الكالسيوم في الدم؟","o":["الأدرينالين","الكالسيتونين","البرولاكتين","الأنسولين"],"a":1},{"l":0,"k":"n","q":"ما اسم التجمعات الخلوية في البنكرياس التي تفرز الأنسولين والغلوكاغون؟","o":["جزر لانغرهانز","فصوص الدرقية","غدد الحليب","الغدة الكظرية"],"a":0},{"l":0,"k":"n","q":"أي غدة تفرز الأدرينالين؟","o":["النخامية","الدرقية","اللعابية","الكظرية"],"a":3},{"l":0,"k":"n","q":"ما معدل تركيز السكر الطبيعي في الدم؟","o":["٨ إلى ١٠ ملي غرام لكل ديسيلتر","٢٠٠ إلى ٣٠٠ ملي غرام لكل ديسيلتر","٨٠ إلى ١٠٠ ملي غرام لكل ديسيلتر","٥٠٠ ملي غرام لكل ديسيلتر"],"a":2},{"l":1,"k":"p","q":"هرمون ينشّط خروج الحليب إلى فم الرضيع أثناء الرضاعة هو:","o":["البرولاكتين","الأوكسيتوسين","الثيروكسين","الغلوكاغون"],"a":1},{"l":1,"k":"p","q":"هرمون يُفرَز بعد الولادة مباشرة وينشّط تصنيع الحليب في ثدي المرأة هو:","o":["البرولاكتين","الأوكسيتوسين","هرمون النمو","الكالسيتونين"],"a":0},{"l":1,"k":"p","q":"بعد تناول وجبة غنية بالسكر، أي هرمون يزداد إفرازه؟","o":["الغلوكاغون","الأدرينالين","الثيروكسين","الأنسولين"],"a":3},{"l":1,"k":"p","q":"ما الذي يفعله الأنسولين بالسكر الزائد في الدم؟","o":["يحوّله إلى غلوكاغون","يطرحه من الجلد","يحوّله إلى غلايكوجين يُخزَّن في الكبد والعضلات","يحوّله إلى كالسيوم"],"a":2},{"l":1,"k":"p","q":"أي الغدد التالية من الغدد الصماء؟","o":["الغدة العرقية","الغدة الدمعية","الغدة الكظرية","الغدة اللعابية"],"a":2},{"l":1,"k":"p","q":"عند انخفاض السكر في الدم عن معدله يُفرَز:","o":["الأنسولين","الغلوكاغون","الأوكسيتوسين","الكالسيتونين"],"a":1},{"l":1,"k":"p","q":"لماذا تسمّى الغدة النخامية «سيدة الغدد»؟","o":["لأنها تسيطر على عمل جميع الغدد الصماء","لأنها أكبر الغدد","لأنها تقع في البطن","لأنها تفرز الأنسولين"],"a":0},{"l":1,"k":"p","q":"أي الأعضاء يقع البنكرياس خلفه مباشرة؟","o":["القلب","الرئة","الدماغ","المعدة"],"a":3},{"l":2,"k":"p","q":"شاب فوجئ بكلب يهاجمه فخفق قلبه بسرعة وزادت حركات تنفسه. أي هرمون ظهر أثره؟","o":["الأنسولين","الكالسيتونين","الأدرينالين","البرولاكتين"],"a":2},{"l":2,"k":"p","q":"أي ما يلي يحدث عند إفراز الأدرينالين في موقف طارئ؟","o":["يقلّ عدد ضربات القلب","يزيد عدد ضربات القلب ويحمرّ الوجه وينشط الغلوكاغون","يزداد إفراز العصارات الهاضمة","ينخفض السكر في الدم دائماً"],"a":1},{"l":2,"k":"p","q":"شخص لم يعد يفرز الأنسولين. ما الذي يُتوقع أن يحدث لسكر دمه بعد وجبة؟","o":["يبقى مرتفعاً لأن السكر لا يتحوّل إلى غلايكوجين","ينخفض بسرعة جداً","يتحوّل كله إلى كالسيوم","لا يتغير أبداً"],"a":0},{"l":2,"k":"p","q":"لماذا يمدّ الجسم عضلاته بالغلوكوز عند الخوف بحسب الرزمة؟","o":["ليخزّن الغلايكوجين فقط","ليزيد إفراز العصارات الهاضمة","ليحمي القصبة الهوائية","ليزوّدها بالطاقة اللازمة لمواجهة الموقف"],"a":3},{"l":2,"k":"p","q":"ما سبب توقف الهضم مؤقتاً عند الخوف الشديد؟","o":["الأنسولين يفرز العصارات","الثيروكسين يوقف المعدة","الأوكسيتوسين يمنع الأكل","الأدرينالين يثبّط إفراز العصارات الهاضمة من البنكرياس والأمعاء الدقيقة"],"a":3},{"l":2,"k":"p","q":"يعمل الأنسولين والغلوكاغون «معاً» على ثبات السكر. كيف؟","o":["كلاهما يخفض السكر دائماً","كلاهما يرفع السكر دائماً","الأنسولين يخفض السكر عند ارتفاعه والغلوكاغون يرفعه عند انخفاضه","الأنسولين يفرز الحليب والغلوكاغون يخزّنه"],"a":2},{"l":2,"k":"p","q":"طفل ينمو بسرعة شديدة ويتجاوز زملاءه في الطول كثيراً بشكل غير طبيعي مع خمول عقلي. أي غدة تُفحَص؟","o":["الغدة الدرقية","الغدة النخامية","الغدة الكظرية","غدة الحليب"],"a":1},{"l":2,"k":"p","q":"غدة تتكوّن من فصين وتحيط بالقصبة الهوائية، ومن هرموناتها ما يوازن الكالسيوم في الدم. ما هي؟","o":["الدرقية","النخامية","الكظرية","البنكرياس"],"a":0}],"hints":{"ما الهرمون الذي ينظّم معدل نمو الجسم؟":"يُفرَز من غدة قاعدة الدماغ.\nزيادة إفرازه تسبب العملقة.","بعد تناول وجبة غنية بالسكر، أي هرمون يزداد إفرازه؟":"السكر في الدم يرتفع عن معدله فيُخزَّن في الكبد والعضلات.\nأي هرمون يخفض السكر؟","شاب فوجئ بكلب يهاجمه فخفق قلبه بسرعة وزادت حركات تنفسه. أي هرمون ظهر أثره؟":"الغدة فوق الكلية تستجيب لأوامر الدماغ في المواقف الطارئة.\nيزيد ضربات القلب ويحمرّ الوجه.","يعمل الأنسولين والغلوكاغون «معاً» على ثبات السكر. كيف؟":"أحدهما يعمل عند ارتفاع السكر والآخر عند انخفاضه.\nفكّر في الغلايكوجين."}},{"t":"المستقبلات الحسية","e":["# اعرف أذنك (نشاط ١)","تتكوّن الأذن من ثلاثة أجزاء رئيسة: الأذن الخارجية، والأذن الوسطى، والأذن الداخلية. ويظهر في الشكل: صيوان الأذن، القناة السمعية، طبلة الأذن، المطرقة، السندان، الركاب، قناة استاكيوس، القوقعة، القنوات الهلالية، العصب السمعي.","- صيوان الأذن: جزء بارز على جانبي الرأس يتكوّن من نسيج غضروفي قمعي الشكل، في داخله تجاعيد، يجمّع الموجات الصوتية وينقلها للقناة السمعية.","- القناة السمعية: تنتهي بغشاء الطبلة الذي باهتزازه ينقل الموجات الصوتية إلى عظيمات الأذن الوسطى.","- الأذن الوسطى: توجد داخل تجويف عظمي في الجمجمة، وتتكوّن من ثلاث عظيمات هي المطرقة والسندان والركاب.","- المطرقة: تتصل بغشاء الطبلة وترتكز على السندان.","- الركاب: يرتكز على السندان ويتصل بالأذن الداخلية.","- قناة استاكيوس: تصل الأذن الوسطى بالبلعوم من الخلف، وتعمل على مساواة الضغط على جانبي غشاء الطبلة للمحافظة على سلامتها.","- الأذن الداخلية: تقع داخل تجويف عظمي مملوء بسائل يمفي لحمايتها من الصدمات ومنع تداخل الموجات الصوتية، وتضم المستقبلات المسؤولة عن السمع والتوازن.","- القوقعة: تشبه قوقعة الحلزون، وتحتوي خلايا الاستقبال السمعي، وتتصل بالعصب السمعي التوازني.","- الدهليز: يقع بين القوقعة والقنوات الهلالية، وله دور هام في توازن الجسم.","- القنوات الهلالية: تتكوّن من ثلاث قنوات، وتعمل مع الدهليز على حفظ توازن الجسم.","|جزء الأذن|مكوّناته|وظيفته","|الخارجية|الصيوان والقناة السمعية|تجميع الموجات الصوتية ونقلها إلى غشاء الطبلة","|الوسطى|المطرقة والسندان والركاب وقناة استاكيوس|نقل الاهتزازات، ومساواة الضغط على جانبي الطبلة","|الداخلية|القوقعة والدهليز والقنوات الهلالية|السمع (القوقعة) والتوازن (الدهليز والقنوات)","! وجود الأذن الوسطى داخل تجويف عظمي في الجمجمة وارتباط عظيماتها بعضها ببعض يحميها وينقل الاهتزازات من الطبلة إلى الأذن الداخلية.","# أنا أسمع جيداً (نشاط ٢)","عندما يتكلم طفل بمكبّر الصوت يتحوّل صوته إلى موجات صوتية في الهواء، فتنتقل لتصل إلى صيوان أذن زميله فيجمعها ويوجهها عبر القناة السمعية إلى غشاء الطبلة، فيهتز وتهتز بدوره المطرقة فالسندان فالركاب، وتصل الاهتزازات إلى سائل القوقعة في الأذن الداخلية، فتتأثر تشعبات العصب السمعي الذي ينقل هذه المؤثرات إلى مراكز السمع في الدماغ، وبالتالي نسمع الصوت وندركه.","|ترتيب مسار الصوت|الجزء","|١|صيوان الأذن (يجمع الموجات)","|٢|القناة السمعية","|٣|غشاء الطبلة (يهتز)","|٤|المطرقة ثم السندان ثم الركاب","|٥|سائل القوقعة في الأذن الداخلية","|٦|العصب السمعي ثم مراكز السمع في الدماغ","? ما مسار الموجة الصوتية حتى يدركها الدماغ؟ || تصل الموجات إلى الصيوان فيجمعها ← القناة السمعية ← غشاء الطبلة فيهتز ← المطرقة ← السندان ← الركاب ← سائل القوقعة ← تشعبات العصب السمعي ← مراكز السمع في الدماغ فنسمع الصوت وندركه.","? عند تغيّر الضغط حولك تشعر بضغط على أذنك. ما الجزء الذي يساوي الضغط على جانبي الطبلة؟ || قناة استاكيوس التي تصل الأذن الوسطى بالبلعوم، فهي تساوي الضغط على جانبي غشاء الطبلة وتحافظ على سلامته.","# أذن واتزان (نشاط ٣)","تقوم فتاة بنشاط رياضي تحافظ فيه على توازنها فوق لوح. خلال حركاتها تتأثر مستقبلات التوازن في الدهليز والقنوات الهلالية، فيتولد سيال عصبي ينتقل عبر الألياف العصبية إلى منطقة التوازن في المخيخ، حيث تتم ترجمة السيالات العصبية وإدراكها، وبالتالي إدراك وضع الجسم. فتصدر الأوامر إلى العضلات المناسبة لتعمل على تعديل وضع الجسم وإعادة توازنه.","- أعضاء التوازن: الدهليز والقنوات الهلالية في الأذن الداخلية، والمخيخ يترجم السيالات.","! للأذن وظيفتان: السمع (القوقعة) والتوازن (الدهليز والقنوات الهلالية).","? أصيب شخص بضربة على خده الأيمن فشعر بفقدان التوازن. أي أجزاء الأذن قد تأثرت؟ || الدهليز والقنوات الهلالية، فهما المسؤولان عن توازن الجسم.","# سحر العيون (نشاط ٤)","العين من أهم أعضاء الإنسان، ومن خلالها يحصل على جزء كبير من معرفته. تمكّننا من رؤية الأجسام وتمييز ألوانها، ويعود ذلك إلى احتواء العين على نوعين من الخلايا الخاصة بالرؤية: أحدهما يختص برؤية الأجسام، والآخر يختص برؤية الألوان. وتتركب العين من ثلاث طبقات هي:","- الطبقة الخارجية (الصلبة): نسيج ضام أبيض يحيط بالعين، سميكة من الخلف قرب خروج العصب البصري وتحتوي عدداً قليلاً من الأوعية الدموية. جزؤها الأمامي رقيق شفاف يسمى القرنية ويسمح بمرور الضوء إلى داخل العين. تثبّتها في تجويف الجمجمة عضلات ترتبط بالصلبة وتحرّكها في جميع الاتجاهات.","- الطبقة الوسطى: رقيقة غنية بالصبغات والأوعية الدموية التي تحمل الغذاء إلى أنسجة العين. وتتحكم في شكل العدسة وفي كمية الضوء الداخلة للعين وتفرز سائل العين وتعيد امتصاصه.","- المشيمية: بين طبقتي العين الخارجية والداخلية، غنية بالأوعية الدموية وتحتوي على صبغة سوداء قاتمة.","- القزحية: الجزء الأمامي من المشيمية، تتكون من ألياف عضلية ملساء تتحكم بفتحة بؤبؤ العين لتنظيم كمية الضوء الداخلة، وغنية بالأوعية الدموية، وتحتوي الخلايا الصبغية الملونة (صبغة الميلانين) التي تعطي العين لونها المميز.","- العدسة والجسم الهدبي: يقسمان حيز العين الداخلي إلى تجويفين: تجويف أمامي مملوء بسائل مائي بين العدسة والقرنية، وتجويف خلفي مملوء بسائل زجاجي بين العدسة والشبكية. يعمل السائلان معاً على تجميع وتوجيه الضوء نحو الشبكية.","- الطبقة الداخلية (الشبكية): تشكل الغلاف الداخلي للعين، وتتكوّن من طبقتين: الأولى طلائية صبغية، والثانية تحتوي المستقبلات الضوئية. ترتبط من الخلف بالعصب البصري الذي ينقل الإشارات العصبية إلى مركز البصر في المخ.","- العِصي: مستقبلات ضوئية عالية الحساسية تمكّننا من الرؤية في الضوء الخافت والظلام باللونين الأبيض والأسود.","- المخاريط: مستقبلات ضوئية تحتاج إلى ضوء ساطع، وتمكّننا من تمييز الألوان.","|الجزء|موقعه/تركيبه|وظيفته","|الصلبة|الطبقة الخارجية البيضاء|حماية العين وتثبيتها وتحريكها بالعضلات","|القرنية|الجزء الأمامي الشفاف من الصلبة|السماح بمرور الضوء إلى داخل العين","|المشيمية|الطبقة الوسطى، غنية بالأوعية الدموية|تغذية أنسجة العين","|القزحية|الجزء الأمامي من المشيمية|تنظيم كمية الضوء عبر البؤبؤ، وإعطاء العين لونها","|الشبكية|الطبقة الداخلية|استقبال الضوء بالعصي والمخاريط","|العصب البصري|يخرج من خلف الشبكية|نقل الإشارات إلى مركز البصر في المخ","|العصي|في الشبكية|الرؤية في الضوء الخافت (أبيض وأسود)","|المخاريط|في الشبكية|الرؤية في الضوء الساطع وتمييز الألوان","? دخلت من غرفة مضيئة إلى غرفة شبه معتمة فصرت ترى الأشياء بالأبيض والأسود. أي المستقبلات تعمل؟ || العِصي؛ لأنها عالية الحساسية للضوء الخافت وتُظهر الأجسام باللونين الأبيض والأسود، أما المخاريط فتحتاج إلى ضوء ساطع.","? ما الجزء الذي يعطي العين لونها المميز، ولماذا؟ || القزحية؛ لأن خلاياها الصبغية الملونة تحتوي صبغة الميلانين.","? اتبع مسار الضوء من الخارج حتى مركز البصر في الدماغ. || القرنية ← البؤبؤ (فتحة القزحية) ← العدسة ← السائل الزجاجي ← الشبكية (العصي والمخاريط) ← العصب البصري ← مركز البصر في المخ.","# مستودع الإحساس في الجلد (نشاط ٥)","المواد: كأس شاي ساخن، ثلج، حجر، قطعة إسفنج، قطن. نمسك كل مادة على حدة ونسجّل ملاحظاتنا في جدول خصائصه: ناعم، خشن، ليّن، قاس، ساخن، بارد. ثم نجيب: أي المواد قد يشكل الإمساك بها خطراً؟ وما الذي جعلك تشعر ببرودة الثلج أو حرارة الشاي؟","يتكوّن الجلد من طبقتين رئيستين هما: البشرة وهي طبقة خارجية طلائية تتكوّن من عدة طبقات، والأدمة وهي طبقة داخلية تتكوّن من نسيج ضام غني بالأوعية الدموية، ونهايات عصبية لمستقبلات حسية متنوعة لاستقبال المؤثرات المختلفة مثل الحرارة والضغط والألم، وتحويلها إلى إشارات عصبية تنقل بالأعصاب إلى مراكز عصبية في الدماغ الذي يعمل على تحليلها وتفسيرها وإدراكها.","- البشرة: الطبقة الخارجية الطلائية.","- الأدمة: الطبقة الداخلية من نسيج ضام غني بالأوعية الدموية، وفيها نهايات المستقبلات الحسية.","- مستقبلات الجلد: للبرودة والسخونة، واللمس، والألم، والضغط (ويظهر في الشكل أيضاً بصيلة الشعر).","|مستقبلات الجلد|المؤثر","|البرودة والسخونة|الحرارة","|اللمس|ملامسة الأجسام","|الألم|ما يؤذي الجسم","|الضغط|الضغط على الجلد","? لمست قطعة ثلج ثم كأس شاي ساخن. كيف عرفت الفرق؟ || مستقبلات الحرارة (البرودة والسخونة) في الأدمة تحوّل المؤثر إلى إشارات عصبية، تنقلها الأعصاب إلى مراكز عصبية في الدماغ التي تحلّلها وتفسّرها فنشعر بالبرودة أو بالسخونة.","# اللسان والاستقبال الذوقي (نشاط ٦)","يوجد على سطح اللسان خلايا تذوق (براعم) ذات أشكال مختلفة، تستقبل المؤثرات الكيميائية الذائبة في اللعاب، وتكوّن إشارات عصبية يحملها العصب الذوقي إلى مراكز الإحساس بالتذوق في المخ الذي يقوم بتفسير وتمييز المذاق.","- الأذواق الأساسية: حلو، مالح، حامض، مر.","- ترتيبها على اللسان من مقدمته إلى الخلف: حلو ثم مالح ثم حامض ثم مر.","|الطعم|موضعه على اللسان","|حلو|مقدمة اللسان","|مالح|بعد المقدمة","|حامض|بعده نحو الخلف","|مر|مؤخرة اللسان","? لماذا يجب أن تذوب مادة الطعام في اللعاب حتى نتذوقها؟ || لأن براعم التذوق تستقبل المؤثرات الكيميائية الذائبة في اللعاب فقط، ثم يحمل العصب الذوقي الإشارة إلى مراكز التذوق في المخ.","# الاستقبال الشمي (نشاط ٧)","يستطيع الإنسان التمييز والتعرف إلى أكثر من ١٠٠٠٠ رائحة متعددة، وقدرة المرأة على التمييز بين الروائح تفوق قدرة الرجل. وترتبط حاسة الشم بحاسة التذوق ارتباطاً وثيقاً؛ فعدم القدرة على تمييز الأطعمة من أول علامات وجود مشاكل في حاسة الشم، كما ترتبط بشكل مباشر بالعواطف إيجاباً مثل شم رائحة الأزهار صباحاً، وسلباً مثل شم رائحة الحرائق التي تؤثر على المزاج العام ونفسية الإنسان.","- الأنف: عضو الاستقبال الشمي، يحتوي على المستقبلات الشمية الموجودة داخل الوجه وتحت العينين.","- في الشكل: الأنف، المنخران، التجويف الأنفي، الحيشوم.","- مسار الرائحة: جزيئات المادة ذات الرائحة محمولة بالهواء ← تدخل التجويف الأنفي وتذوب في الغشاء المخاطي المبطن ← إشارة عصبية في الخلايا الشمية ← العصب الشمي ← مراكز الشم في المخ، فيميّز الرائحة ويفسّرها ويدركها.","! ينصح بعدم شمّ رائحة مادة غير معروفة، فقد تكون ضارة.","? كيف نشمّ رائحة العطر من بعيد؟ || جزيئات العطر محمولة في الهواء تدخل التجويف الأنفي وتذوب في الغشاء المخاطي المبطن فتتولّد إشارة عصبية في الخلايا الشمية، ينقلها العصب الشمي إلى مراكز الشم في المخ الذي يميّز الرائحة ويدركها.","# ملخص المستقبلات الحسية","|العضو|المستقبلات|مؤثرها|ينقل الإشارة إلى المخ","|الأذن (القوقعة)|خلايا الاستقبال السمعي|الموجات الصوتية|العصب السمعي","|الأذن (الدهليز والقنوات)|مستقبلات التوازن|حركات الجسم ووضعه|ألياف عصبية إلى المخيخ","|العين (الشبكية)|العصي والمخاريط|الضوء|العصب البصري","|الجلد|مستقبلات الحرارة واللمس والألم والضغط|مؤثرات حسية متنوعة|أعصاب إلى مراكز في الدماغ","|اللسان|براعم التذوق|مواد كيميائية ذائبة في اللعاب|العصب الذوقي","|الأنف|الخلايا الشمية|جزيئات الرائحة|العصب الشمي"],"q":["- اذكر أجزاء الأذن الثلاثة ومكوّنات كل جزء ووظيفته.","- تتبّع مسار الموجات الصوتية من صيوان الأذن حتى مراكز السمع.","- ما الفرق بين العصي والمخاريط من حيث الوظيفة والضوء المناسب لكل منها؟","- ما طبقات العين الثلاث، وما أهم أجزاء كل طبقة؟","- كيف نميّز الطعم الحلو من المر؟ وما علاقة حاسة الشم بالتذوق؟"],"quiz":[{"l":0,"k":"n","q":"ما الأجزاء الثلاثة الرئيسة للأذن؟","o":["الخارجية والوسطى والداخلية","الصيوان والطبلة والقوقعة","المطرقة والسندان والركاب","القوقعة والدهليز والقنوات"],"a":0},{"l":0,"k":"n","q":"أي أجزاء الأذن يقوم بتجميع الموجات الصوتية؟","o":["المطرقة","القوقعة","الدهليز","صيوان الأذن"],"a":3},{"l":0,"k":"n","q":"ما عظيمات الأذن الوسطى؟","o":["الصيوان والطبلة والقناة","القوقعة والدهليز والقناة","المطرقة والسندان والركاب","الزجاجي والمائي والعدسة"],"a":2},{"l":0,"k":"n","q":"ما اسم الجزء الشفاف من الطبقة الخارجية للعين الذي يسمح بمرور الضوء؟","o":["القزحية","القرنية","الشبكية","المشيمية"],"a":1},{"l":0,"k":"n","q":"أي أجزاء العين يتحكم بفتحة البؤبؤ ويعطي العين لونها؟","o":["العدسة","القزحية","الصلبة","العصب البصري"],"a":1},{"l":0,"k":"n","q":"أي مستقبلات الشبكية تمكّننا من الرؤية في الضوء الخافت؟","o":["العصي","المخاريط","القرنية","الصلبة"],"a":0},{"l":0,"k":"n","q":"ما طبقتا الجلد الرئيستان؟","o":["القرنية والصلبة","الصيوان والطبلة","المخ والمخيخ","البشرة والأدمة"],"a":3},{"l":0,"k":"n","q":"ما الأذواق الأساسية على اللسان؟","o":["حار وبارد ولين وقاس","حلو وساخن وبارد ومر","حلو ومالح وحامض ومر","مر وناعم وخشن وحامض"],"a":2},{"l":1,"k":"p","q":"ما وظيفة قناة استاكيوس؟","o":["نقل الضوء إلى الشبكية","مساواة الضغط على جانبي غشاء الطبلة","نقل الرائحة إلى المخ","تجميع الموجات الصوتية"],"a":1},{"l":1,"k":"p","q":"أي أجزاء الأذن الداخلية يحتوي خلايا الاستقبال السمعي؟","o":["القوقعة","الدهليز","القنوات الهلالية","غشاء الطبلة"],"a":0},{"l":1,"k":"p","q":"أي جزأين من الأذن الداخلية لهما دور في توازن الجسم؟","o":["القوقعة والطبلة","المطرقة والركاب","الصيوان والقناة السمعية","الدهليز والقنوات الهلالية"],"a":3},{"l":1,"k":"p","q":"أي طبقات العين غنية بالأوعية الدموية وتغذّي أنسجتها؟","o":["الصلبة","الشبكية","المشيمية","القرنية"],"a":2},{"l":1,"k":"p","q":"أين تقع الخلايا الشمية؟","o":["في فتحة الأنف فقط","على اللسان","داخل الوجه وتحت العينين","في المخ"],"a":2},{"l":1,"k":"p","q":"كيف تصل المؤثرات الكيميائية المسؤولة عن الطعم إلى براعم التذوق؟","o":["محمولة بالضوء","ذائبة في اللعاب","عبر الموجات الصوتية","عبر العضلات"],"a":1},{"l":1,"k":"p","q":"ما العصب الذي ينقل الإشارات من الشبكية إلى مركز البصر في المخ؟","o":["العصب البصري","العصب السمعي","العصب الذوقي","العصب الشمي"],"a":0},{"l":1,"k":"p","q":"أي مستقبلات الجلد تنبّه إلى ما يؤذي الجسم؟","o":["مستقبلات اللمس","مستقبلات البرودة","مستقبلات السمع","مستقبلات الألم"],"a":3},{"l":2,"k":"p","q":"وضع طفل كوب ماء ساخن جداً ثم قطعة ثلج في يده. كيف يميّز بينهما؟","o":["الأذن الداخلية تقرر ذلك","اللسان يستقبل الحرارة","مستقبلات الحرارة في الأدمة ترسل إشارات عصبية إلى الدماغ ليفسرها","القزحية تقيس الحرارة"],"a":2},{"l":2,"k":"p","q":"دخل رجل غرفة مظلمة تقريباً فرأى الأشياء بالأبيض والأسود. ما سبب ذلك؟","o":["تعمل المخاريط فقط","تعمل العصي عالية الحساسية في الضوء الخافت","غابت الأدمة","عمل غشاء الطبلة"],"a":1},{"l":2,"k":"p","q":"في أي ترتيب يمرّ الضوء داخل العين؟","o":["القرنية ثم البؤبؤ ثم العدسة ثم السائل الزجاجي ثم الشبكية","الشبكية ثم العدسة ثم القرنية","العدسة ثم الصلبة ثم القزحية","القرنية ثم الشبكية ثم العدسة"],"a":0},{"l":2,"k":"p","q":"ما ترتيب اهتزاز الأجزاء عند وصول الصوت إلى الأذن؟","o":["الركاب ثم السندان ثم المطرقة ثم الطبلة","القوقعة ثم الطبلة ثم الركاب","الدهليز ثم المطرقة ثم القنوات","الطبلة ثم المطرقة ثم السندان ثم الركاب ثم سائل القوقعة"],"a":3},{"l":2,"k":"p","q":"لماذا يصعب على من فقد حاسة الشم أن يميّز الأطعمة؟","o":["لأن اللسان يفقد براعمه","لأن العين تتأثر","لأن الجلد لا يستقبل الألم","لأن حاسة الشم ترتبط بحاسة التذوق ارتباطاً وثيقاً"],"a":3},{"l":2,"k":"p","q":"جزيئات عطر وصلت إلى الأنف. ما التسلسل الصحيح لإدراك رائحته؟","o":["العصب الشمي ثم الجلد ثم الدهليز","القوقعة ثم الطبلة ثم المخيخ","تذوب في الغشاء المخاطي ثم إشارة في الخلايا الشمية ثم العصب الشمي ثم مراكز الشم في المخ","الشبكية ثم القرنية ثم المخ"],"a":2},{"l":2,"k":"p","q":"فتاة تحافظ على توازنها فوق لوح. أي الأجزاء يستقبل مؤثرات الحركة وأين تُترجَم السيالات؟","o":["القوقعة، ثم القرنية","الدهليز والقنوات الهلالية، ثم المخيخ","الصيوان، ثم المخ","الطبلة، ثم الحبل الشوكي"],"a":1},{"l":2,"k":"p","q":"أي اضطراب يُتوقع إذا تضرّر العصب السمعي بين القوقعة والدماغ؟","o":["لا تصل المؤثرات إلى مراكز السمع فلا يُدرَك الصوت","لا تعمل الشبكية","يتعطل التذوق فقط","لا تتحرك العضلات الهيكلية فقط"],"a":0}],"hints":{"أي أجزاء الأذن يقوم بتجميع الموجات الصوتية؟":"هو الجزء البارز على جانبي الرأس.\nشكله قمعي ومن نسيج غضروفي.","أي مستقبلات الشبكية تمكّننا من الرؤية في الضوء الخافت؟":"نوعان من المستقبلات: أحدهما للألوان والآخر للأبيض والأسود.\nالأكثر حساسية للضوء الخافت هو الذي يُظهر الأبيض والأسود.","في أي ترتيب يمرّ الضوء داخل العين؟":"يبدأ من الجزء الشفاف الأمامي وينتهي بالطبقة الداخلية.\nيمرّ بالعدسة قبل السائل الزجاجي.","جزيئات عطر وصلت إلى الأنف. ما التسلسل الصحيح لإدراك رائحته؟":"تذوب أولاً في الغشاء المخاطي.\nتنتهي الإشارة في مراكز الشم في المخ."}},{"t":"الحرارة","e":["# تمهيد: الإحساس بسخونة الأجسام (نشاط ١)","في هذا النشاط نضع ثلاثة أوعية: ماءً بارداً (فيه ثلج)، وماءً صنبوراً، وماءً دافئاً. نضع اليد اليمنى في الماء الدافئ واليسرى في الماء البارد، ثم نضع اليدين في ماء الصنبور، ثم نقيس حرارة الأوعية الثلاثة بميزان الحرارة ونسجّل القراءات.","- ميزان الحرارة: الأداة التي نقيس بها درجة حرارة السائل بدقة، لأن إحساس اليد وحده غير دقيق.","- الإحساس بالسخونة أو البرودة: يعتمد على الفرق بين درجة حرارة الجسم ودرجة حرارة اليد، لا على الجسم وحده.","! تلميح: اليد التي كانت في الماء الدافئ تشعر ببرودة ماء الصنبور، واليد التي كانت في الماء البارد تشعر بسخونته، مع أن الماء واحد؛ فإحساسنا يتأثر بالفرق في درجة الحرارة.","# درجة الحرارة","نشعر بسخونة الجسم أو برودته اعتماداً على الفرق في درجة الحرارة بينه وبين درجة حرارة اليد. فعند لمس جسم درجة حرارته أعلى من درجة حرارة اليد نشعر بسخونته، وعند لمس جسم درجة حرارته أقل من درجة حرارة اليد نشعر ببرودته.","- درجة الحرارة: صفة للمادة تحدد اتجاه انتقال الطاقة الحرارية بين الأجسام عند تلامسها.","- اتجاه انتقال الطاقة الحرارية: تنتقل من الأجسام الساخنة إلى الأجسام الأقل سخونة.","- ميزان الحرارة: أداة قياس درجة الحرارة، وتُقاس بالدرجة السلسيوسية (س°).","! الطاقة الحرارية تنتقل دائماً من الجسم الأعلى حرارةً إلى الأقل حرارةً عند تلامسهما.","# الطاقة ودرجة الحرارة (نشاط ٢)","نضع ٢٠٠ سم³ من الماء في كل من كأسين زجاجيتين متماثلتين، ونضع في كل كأس ميزان حرارة، ثم نضعهما فوق شبكة تسخين على منصب ثلاثي ونشعل لهب بنسن. نسجّل قراءة الميزانين كل ٢٠ ثانية. وبعد ٦٠ ثانية نرفع إحدى الكأسين عن اللهب ونتابع قياس حرارة الماء في كل منهما (مع مراعاة قواعد السلامة العامة).","|الزمن (بالثواني)|الكأس الأولى (ما زالت على اللهب)|الكأس الثانية (رُفعت بعد ٦٠ ثانية)","|٢٠ ← ٦٠|ترتفع الحرارة|ترتفع الحرارة","|٨٠ ← ١٦٠|تواصل الارتفاع|تنخفض تدريجياً","- شكل طاقة اللهب: طاقة حرارية.","- العلاقة بين كمية الحرارة والارتفاع في درجة الحرارة: علاقة طردية؛ فكلما ازدادت كمية الحرارة المكتسبة ازداد ارتفاع درجة الحرارة.","- إجراءات السلامة: الحذر من اللهب والماء الساخن، واستعمال ماسك للكأس الساخنة، وإبعاد المواد القابلة للاشتعال.","عند تعريض جسم لمصدر حراري فإن الطاقة الحرارية التي يكتسبها تزداد بمرور الزمن، وتبعاً لذلك ترتفع درجة حرارته تدريجياً ما دام محافظاً على حالته من حيث الصلابة أو السيولة. وكمية الحرارة التي تكتسبها الأجسام أو تفقدها تسبّب ارتفاع درجة حرارتها أو انخفاضها، فكلما كان التغيّر في درجة حرارة جسم ما أكبر كانت كمية الحرارة اللازمة لإحداث هذا التغيّر أكبر.","# الطاقة والكتلة، والطاقة ونوع المادة (نشاط ٣ و٤)","نشاط ٣: نضع مكعب جليد في كل دورق، ثم نسكب ١٠٠ مل من الماء الساخن (٧٠ س°) في الدورق الأول و٥٠٠ مل في الثاني. درجة حرارة الماء متساوية، لكنّ مكعب الجليد ينصهر بشكل أسرع في الدورق الذي يحتوي كمية أكبر من الماء.","! النتيجة: الطاقة الحرارية التي يمتلكها الماء تعتمد على كتلته عند درجة حرارة معيّنة، وتتناسب طردياً مع الكتلة.","نشاط ٤: نضع ١٥٠ غم ماء في كأس و١٥٠ غم زيت في كأس ثانية، ونسخّنهما المدة نفسها (دقيقتين) ونسجّل قراءة الميزانين. تختلف درجتا الحرارة النهائيتان؛ فالزيت يسخن أكثر من الماء لأنه يحتاج حرارة أقل لرفع درجة حرارته.","- كمية الحرارة اللازمة لرفع حرارة جسم: تعتمد على نوع مادته (مرتبطة بحرارتها النوعية)، فتزويد جسمين مختلفين بالكمية نفسها من الطاقة يعطي ارتفاعاً مختلفاً في درجة الحرارة.","# الحرارة النوعية والسعة الحرارية","- الحرارة النوعية (ح): كمية الحرارة اللازمة لرفع درجة حرارة وحدة الكتل (١ كغم) من المادة درجة سلسيوس واحدة؛ وحدتها جول/كغم.س°.","- السعة الحرارية: كمية الطاقة الحرارية اللازمة لرفع درجة حرارة الجسم كلّه درجة سلسيوس واحدة؛ وتساوي الكتلة × الحرارة النوعية، ووحدتها جول/س°.","|المادة|الحرارة النوعية (جول/كغم.س°)","|الذهب|١٢٥","|النحاس|٣٨٧","|الحديد|٤٤٨","|الألومنيوم|٩٠٠","|الفضة|٢٣٤","|الماء|٤١٨٦","|السيليكون|٧٠٣","|زيت الزيتون|١٩٧١","! أعلى حرارة نوعية في الجدول للماء (٤١٨٦)، وأقلّها للذهب (١٢٥). فالماء يحتاج طاقة كبيرة ليسخن، ويفقدها ببطء عند التبريد.","# قانون كمية الحرارة","كمية الحرارة المكتسبة أو المفقودة = كتلة الجسم × حرارته النوعية × التغيّر في درجة الحرارة.","ويُعبَّر عنها بالرموز: ك ح = ك × ح × Δ د، حيث Δ د = د₂ − د₁ (درجة الحرارة النهائية − الابتدائية).","! الكتلة في القانون بالكيلوغرام: حوّل الغرام إلى كيلوغرام بالقسمة على ١٠٠٠ قبل التعويض.","السعة الحرارية = ك × ح. وكمية الحرارة المكتسبة أو المفقودة = السعة الحرارية × التغيّر في درجة الحرارة.","# أمثلة محلولة","? وُضع خاتم من الذهب كتلته ٢٠ غم ودرجة حرارته ٢٥ س° في وعاء به ماء له درجة الحرارة نفسها، ثم سُخّن الماء حتى درجة الغليان (١٠٠ س°). ما كمية الحرارة التي اكتسبها الخاتم إذا علمت أن الحرارة النوعية للذهب ١٢٥ جول/كغم.س°؟ || الكتلة = ٢٠ ÷ ١٠٠٠ = ٠٫٠٢ كغم. Δ د = ١٠٠ − ٢٥ = ٧٥ س°. كمية الحرارة = ك × ح × Δ د = ٠٫٠٢ × ١٢٥ × ٧٥ = ١٨٧٫٥ جول.","? احسب السعة الحرارية للخاتم نفسه (كتلته ٠٫٠٢ كغم وحرارته النوعية ١٢٥ جول/كغم.س°). || السعة الحرارية = ك × ح = ٠٫٠٢ × ١٢٥ = ٢٫٥ جول/س°. (تحقّق: ٢٫٥ × ٧٥ = ١٨٧٫٥ جول).","? احسب السعة الحرارية لقطعة خشب كتلتها ١٠٠ غم وحرارتها النوعية ١٦٧٢ جول/كغم.س°. || الكتلة = ٠٫١ كغم. السعة الحرارية = ك × ح = ٠٫١ × ١٦٧٢ = ١٦٧٫٢ جول/س°.","? كرة من الحديد كتلتها ٣٠٠ غم بُرّدت من ١٧٥ س° إلى ٢٥ س°. احسب كمية الحرارة التي تفقدها الكرة علماً بأن الحرارة النوعية للحديد ٤٦٠ جول/كغم.س°. || الكتلة = ٠٫٣ كغم. Δ د = ١٧٥ − ٢٥ = ١٥٠ س°. كمية الحرارة = ٠٫٣ × ٤٦٠ × ١٥٠ = ٢٠٧٠٠ جول (تفقدها الكرة).","? إناء من النحاس كتلته ٠٫٠٤ كغم في درجة ٢٥ س°. احسب درجة الحرارة التي يصل إليها الإناء لإكسابه حرارة مقدارها ١٢٠٠ جول، علماً بأن الحرارة النوعية للنحاس ٤٠٠ جول/كغم.س°. || Δ د = كمية الحرارة ÷ (ك × ح) = ١٢٠٠ ÷ (٠٫٠٤ × ٤٠٠) = ١٢٠٠ ÷ ١٦ = ٧٥ س°. درجة الحرارة النهائية = ٢٥ + ٧٥ = ١٠٠ س°.","? قطعة من النحاس كتلتها ١٠٠ غم رُفعت درجة حرارتها من ٢٠ س° إلى ٤٠ س°. ما كمية الحرارة التي اكتسبتها؟ (الحرارة النوعية للنحاس من الجدول ٣٨٧). || الكتلة = ٠٫١ كغم. Δ د = ٤٠ − ٢٠ = ٢٠ س°. كمية الحرارة = ٠٫١ × ٣٨٧ × ٢٠ = ٧٧٤ جول.","? ما السعة الحرارية لكمية من الماء كتلتها ١٠٠ غم علماً بأن الحرارة النوعية للماء = ٤٠٠٠ جول/كغم.س°؟ || السعة الحرارية = ٠٫١ × ٤٠٠٠ = ٤٠٠ جول/س°."],"q":["- كيف نعرّف درجة الحرارة؟ وفي أي اتجاه تنتقل الطاقة الحرارية بين جسمين متلامسين؟","- ما الفرق بين الحرارة النوعية والسعة الحرارية؟ اذكر وحدة كلٍّ منهما.","- اذكر قانون كمية الحرارة، ثم بيّن العوامل الثلاثة التي تعتمد عليها كمية الحرارة المكتسبة.","- لماذا انصهر مكعب الجليد أسرع في الدورق الذي فيه ٥٠٠ مل ماء مقارنةً بـ ١٠٠ مل رغم تساوي درجة الحرارة؟","- لماذا نحوّل الكتلة من غرام إلى كيلوغرام قبل استعمال قانون كمية الحرارة؟"],"quiz":[{"l":0,"k":"n","q":"درجة الحرارة هي صفة للمادة تحدد:","o":["كتلة الجسم","اتجاه انتقال الطاقة الحرارية بين الأجسام عند تلامسها","حجم الجسم","لون الجسم"],"a":1},{"l":0,"k":"n","q":"عند تلامس جسمين تنتقل الطاقة الحرارية من:","o":["الجسم الأقل حرارةً إلى الأعلى حرارةً","الجسم الأكبر حجماً إلى الأصغر حجماً","الجسم الأخف إلى الأثقل","الجسم الأعلى حرارةً إلى الجسم الأقل حرارةً"],"a":3},{"l":0,"k":"n","q":"الأداة المستعملة لقياس درجة الحرارة هي:","o":["ميزان الحرارة","الميزان ذو الكفتين","المسطرة","الساعة"],"a":0},{"l":0,"k":"n","q":"قانون كمية الحرارة المكتسبة أو المفقودة هو:","o":["الكتلة ÷ الحرارة النوعية","الحرارة النوعية + الكتلة","الكتلة × الحرارة النوعية × التغيّر في درجة الحرارة","الكتلة × التغيّر في الحجم"],"a":2},{"l":0,"k":"n","q":"الحرارة النوعية هي كمية الحرارة اللازمة لرفع درجة حرارة:","o":["أي كتلة من المادة ١٠٠ درجة","الجسم كلّه درجة واحدة مهما كانت المادة","الماء فقط درجة واحدة","وحدة الكتل (١ كغم) من المادة درجة سلسيوس واحدة"],"a":3},{"l":0,"k":"n","q":"وحدة قياس الحرارة النوعية هي:","o":["جول/كغم.س°","جول فقط","كغم/جول","س°"],"a":0},{"l":0,"k":"n","q":"السعة الحرارية لجسم تساوي:","o":["الكتلة + الحرارة النوعية","الحرارة النوعية ÷ الكتلة","الكتلة × الحرارة النوعية","الكتلة × الحجم"],"a":2},{"l":0,"k":"n","q":"أعلى حرارة نوعية في جدول الحرارة النوعية للمواد هي لـ:","o":["الذهب","الماء","الحديد","الفضة"],"a":1},{"l":1,"k":"p","q":"سخّنّا ماءً في كأس وتابعنا الميزان كل ٢٠ ثانية فوجدنا أن درجة الحرارة:","o":["تبقى ثابتة","تنخفض باستمرار","ترتفع تدريجياً بمرور الزمن","ترتفع ثم تعود لقيمتها الأولى فوراً"],"a":2},{"l":1,"k":"p","q":"وُضع مكعب جليد في دورق فيه ١٠٠ مل ماء ساخن (٧٠ س°) وآخر فيه ٥٠٠ مل ماء بالدرجة نفسها. أين ينصهر المكعب أسرع؟","o":["في دورق ٥٠٠ مل لأن طاقته الحرارية أكبر","في دورق ١٠٠ مل لأن الماء فيه أقل","يتساوى الانصهار تماماً لتساوي درجة الحرارة","لا ينصهر في أيّ منهما"],"a":0},{"l":1,"k":"p","q":"سخّنّا ١٥٠ غم ماء و١٥٠ غم زيت المدة نفسها. أي العبارات صحيحة؟","o":["ترتفع حرارة الماء أكثر لأن حرارته النوعية أقل","ترتفع حرارة الزيت أكثر لأن حرارته النوعية أقل من الماء","ترتفع حرارتهما بالقدر نفسه دائماً","لا تتغيّر حرارة أيّ منهما"],"a":1},{"l":1,"k":"p","q":"وضعنا يدنا اليمنى في ماء دافئ واليسرى في ماء بارد ثم في ماء الصنبور، فشعرنا بأن الماء نفسه يبدو مختلفاً. السبب أن الإحساس يعتمد على:","o":["لون الماء فقط","كمية الماء فقط","وزن اليد","الفرق بين درجة حرارة اليد ودرجة حرارة الجسم الملموس"],"a":3},{"l":1,"k":"n","q":"كلما كان التغيّر في درجة حرارة جسم أكبر كانت كمية الحرارة اللازمة:","o":["أكبر","أقل","صفراً","ثابتة دائماً"],"a":0},{"l":1,"k":"p","q":"جسمان من مادتين مختلفتين زُوّدا بالكمية نفسها من الطاقة الحرارية. نتوقع أن:","o":["يرتفع كلاهما بالقدر نفسه حتماً","يختلف ارتفاع درجة حرارة كلٍّ منهما","لا يرتفع أيٌّ منهما","ينخفض كلاهما"],"a":1},{"l":1,"k":"p","q":"السعة الحرارية لقطعة خشب كتلتها ١٠٠ غم وحرارتها النوعية ١٦٧٢ جول/كغم.س° تساوي:","o":["١٦٧٢٠ جول/س°","١٦٧٢ جول/س°","١٦٫٧٢ جول/س°","١٦٧٫٢ جول/س°"],"a":3},{"l":1,"k":"p","q":"كتلة ٢٠ غم من الذهب تساوي بالكيلوغرام:","o":["٢٠","٠٫٢","٠٫٠٢","٢٠٠٠"],"a":2},{"l":2,"k":"p","q":"ما كمية الحرارة اللازمة لرفع درجة حرارة ٠٫٥ كغم ماء ١٠ س°؟ (ح = ٤١٨٦)","o":["٤١٨٦٠ جول","٢٠٩٣ جول","٥٠٠ جول","٢٠٩٣٠ جول"],"a":3},{"l":2,"k":"p","q":"ما كمية الحرارة اللازمة لرفع درجة حرارة ٠٫١ كغم ألومنيوم ٣٠ س°؟ (ح = ٩٠٠)","o":["٢٧٠٠٠ جول","٢٧٠٠ جول","٩٠٠٠ جول","٢٧٠ جول"],"a":1},{"l":2,"k":"p","q":"قطعة فضة كتلتها ٠٫٠٥ كغم اكتسبت ١١٧٠ جول. ما مقدار ارتفاع درجة حرارتها؟ (ح = ٢٣٤)","o":["٥٠ س°","١٠ س°","١٠٠ س°","٢٠٠ س°"],"a":2},{"l":2,"k":"p","q":"كرة حديد كتلتها ٣٠٠ غم بُرّدت من ١٧٥ س° إلى ٢٥ س° (ح = ٤٦٠). كمية الحرارة التي فقدتها:","o":["٢٠٧٠٠ جول","٢٠٧٠ جول","٢٠٧٠٠٠ جول","٦٩٠٠ جول"],"a":0},{"l":2,"k":"p","q":"إناء نحاسي كتلته ٠٫٠٤ كغم في ٢٥ س° اكتسب ١٢٠٠ جول (ح = ٤٠٠). درجة حرارته النهائية:","o":["٧٥ س°","١٠٠ س°","١٢٥ س°","٥٠ س°"],"a":1},{"l":2,"k":"p","q":"جسم كتلته ٠٫٥ كغم اكتسب ٩٠٠٠ جول فارتفعت حرارته ٢٠ س°. حرارته النوعية تساوي ٩٠٠ جول/كغم.س°؛ فهو على الأرجح من:","o":["الذهب","الحديد","الألومنيوم","الفضة"],"a":2},{"l":2,"k":"p","q":"جسمان متساويان في الكتلة اكتسبا الكمية نفسها من الحرارة، ارتفعت حرارة الأول ضعف ارتفاع حرارة الثاني. إذن الحرارة النوعية للأول:","o":["نصف الحرارة النوعية للثاني","ضعف الحرارة النوعية للثاني","تساويها","لا يمكن تحديدها"],"a":0},{"l":2,"k":"p","q":"السعة الحرارية لـ ٠٫٢ كغم ماء (ح = ٤١٨٦) تساوي:","o":["٨٣٧٢ جول/س°","٤١٨٦ جول/س°","٠٫٢ جول/س°","٨٣٧٫٢ جول/س°"],"a":3}],"hints":{"ما كمية الحرارة اللازمة لرفع درجة حرارة ٠٫٥ كغم ماء ١٠ س°؟ (ح = ٤١٨٦)":"استعمل ك × ح × Δ د. الكتلة معطاة بالكيلوغرام أصلاً، فاضرب الأعداد الثلاثة.","قطعة فضة كتلتها ٠٫٠٥ كغم اكتسبت ١١٧٠ جول. ما مقدار ارتفاع درجة حرارتها؟ (ح = ٢٣٤)":"أعد ترتيب القانون: Δ د = كمية الحرارة ÷ (ك × ح). احسب المقام أولاً.","كرة حديد كتلتها ٣٠٠ غم بُرّدت من ١٧٥ س° إلى ٢٥ س° (ح = ٤٦٠). كمية الحرارة التي فقدتها:":"حوّل ٣٠٠ غم إلى كيلوغرام، ثم احسب الفرق بين الحرارتين.","وُضع مكعب جليد في دورق فيه ١٠٠ مل ماء ساخن (٧٠ س°) وآخر فيه ٥٠٠ مل ماء بالدرجة نفسها. أين ينصهر المكعب أسرع؟":"فكّر: أيّ الدورقين يملك كتلة ماء أكبر، وما علاقة الكتلة بالطاقة الحرارية؟","سخّنّا ١٥٠ غم ماء و١٥٠ غم زيت المدة نفسها. أي العبارات صحيحة؟":"قارن الحرارة النوعية للماء (٤١٨٦) والزيت (١٩٧١): من يحتاج طاقة أقل ليسخن؟","جسمان متساويان في الكتلة اكتسبا الكمية نفسها من الحرارة، ارتفعت حرارة الأول ضعف ارتفاع حرارة الثاني. إذن الحرارة النوعية للأول:":"من القانون: ح = كمية الحرارة ÷ (ك × Δ د). ماذا يحدث لـ ح إذا تضاعف Δ د؟","إناء نحاسي كتلته ٠٫٠٤ كغم في ٢٥ س° اكتسب ١٢٠٠ جول (ح = ٤٠٠). درجة حرارته النهائية:":"أوجد Δ د أولاً ثم أضفها إلى درجة الحرارة الابتدائية."}},{"t":"المواد الموصلة والمواد العازلة للحرارة","e":["# موصل وعازل (نشاط ١)","المواد والأدوات: كأس معدنية، وكأس زجاجية، وماء مثلّج. نضع كمّيتين متساويتين من الماء المثلّج في كل كأس، ثم نضع اليد اليمنى على السطح الخارجي للكأس المعدنية، واليسرى على السطح الخارجي للكأس الزجاجية، ونقارن شعورنا.","- الكأس الأبرد ملمساً: المعدنية، لأن المعدن موصل جيد يسحب الحرارة من اليد بسرعة فنشعر بالبرودة.","- الكأس التي تحتفظ بسخونة الماء أكبر: الزجاجية، لأن الزجاج رديء التوصيل للحرارة (عازل) فيمنع تسرّب الحرارة.","# المواد الموصلة والمواد العازلة","تختلف المواد في قدرتها على توصيل الحرارة؛ فهناك مواد جيدة التوصيل للحرارة، ومواد رديئة التوصيل للحرارة.","- المواد الموصلة (جيدة التوصيل): تسمح بانتقال الحرارة خلالها بسهولة، مثل النحاس والألومنيوم والحديد.","- المواد العازلة (رديئة التوصيل): تعيق انتقال الحرارة، مثل البلاستيك والزجاج والخشب والغازات.","|المادة|هل هي جيدة التوصيل للحرارة؟","|النحاس|نعم (موصل)","|الألومنيوم|نعم (موصل)","|الحديد|نعم (موصل)","|البلاستيك|لا (عازل)","|الزجاج|لا (عازل)","|الخشب|لا (عازل)","|الغازات (كالهواء)|لا (عازل)","# العزل الحراري (نشاط ٢)","تعاني كثير من دول العالم من انخفاض درجات الحرارة أو ارتفاعها، ففكّر الإنسان في إيجاد طرق للحدّ من ارتفاع درجات الحرارة وانخفاضها داخل المنازل. ومن ذلك النوافذ ذات الطبقتين من الزجاج بينهما مادة عازلة (طبقة هواء أو غاز)، فهي تقلّل انتقال الحرارة بين داخل البيت وخارجه.","- العزل الحراري: استعمال مواد رديئة التوصيل للحرارة للحدّ من انتقال الحرارة بين الداخل والخارج.","- أهمية المادة بين طبقتي الزجاج: تعمل كعازل يحافظ على دفء المنزل شتاءً وبرودته صيفاً.","# طرق انتقال الحرارة (نشاط ٣)","نثبّت عيدان أسنان بالشمع على قضيب معدني على مسافات مختلفة، ونسخّن أحد طرفي القضيب بمصدر حراري. يذوب الشمع تحت الأسنان القريبة من المصدر أولاً فتسقط أولاً، وتسقط الأبعد آخراً، فتنتقل الحرارة على امتداد القضيب.","- التوصيل: انتقال الحرارة في الأجسام الصلبة من الطرف الأكثر سخونة إلى الطرف الأقل سخونة، كما يحدث عند تسخين طرف قضيب حديد من جهة واحدة فتنتقل الحرارة إلى الطرف الآخر.","- الإشعاع: انتقال الحرارة بالإشعاع؛ فجميع الأجسام تشعّ وتمتص طاقة بالإشعاع، وبه تنتقل الطاقة الحرارية من الشمس إلى الأرض (بسرعة الضوء).","- الحمل: انتقال الحرارة مع حركة السائل أو الغاز الساخن إلى الأعلى (ويظهر في الشكل بأسهم متصاعدة فوق اللهب).","! في شكل النار: اليد التي تمسك القضيب تنقل الحرارة بالتوصيل، والأسهم الصاعدة فوق النار حمل، واليدان بجانب النار أو بعيداً عنها تشعران بالدفء بالإشعاع.","! احتياطات السلامة في النشاط: الحذر من اللهب والشمع الساخن والقضيب الساخن، واستعمال الحامل المعدني مع الماسك.","# تمدد الأجسام بالحرارة (نشاط ٤)","نركّب دارة كهربائية من أسلاك توصيل وبطارية وجرس، وتكون إحدى الأسلاك قضيباً نحاسياً، ثم نشعل شمعة أو لهباً تحت طرف القضيب النحاسي ونسجّل ملاحظاتنا. يتمدد القضيب بالحرارة حتى يلامس الموصل فتُغلق الدارة ويقرع الجرس.","- عناصر الدارة: أسلاك توصيل، وبطارية، وجرس، وقضيب نحاسي (يعمل كمفتاح عند تمدده).","- أهمية اللهب: يزوّد القضيب بالحرارة فيتمدد.","- سبب قرع الجرس: تمدد القضيب فأغلق الدارة الكهربائية.","تتمدد المواد بارتفاع درجة حرارتها وتتقلص بانخفاضها، وهذا ينطبق على جميع المواد الصلبة والغازية والسائلة، لكنّ الماء عند درجة حرارة معينة يسلك سلوكاً مهماً قد يبدو فيه غريباً وشاذاً عن هذه القاعدة.","# حكمة في شذوذ الماء (نشاط ٥)","يتمدد الماء بالحرارة ويتقلص بالبرودة في درجات الحرارة التي تزيد عن ٤ س°، لكنه يشذّ عن هذه القاعدة في درجات الحرارة التي تقل عن ٤ س°، فيتمدد بالبرودة وتقل كثافته، ويتقلص بالسخونة وتزداد كثافته. وتُسمّى هذه الظاهرة شذوذ الماء.","|درجة حرارة الماء|عند التسخين|عند التبريد","|أعلى من ٤ س°|الحجم يزداد والكثافة تقل|الحجم يقل والكثافة تزداد","|أقل من ٤ س°|الحجم يقل والكثافة تزداد|الحجم يزداد والكثافة تقل","! أعلى كثافة للماء عند ٤ س° (وأقل حجم لكتلة معيّنة منه). وتفيد هذه الظاهرة الكائنات البحرية في المناطق الباردة: فالماء القريب من ٤ س° الأثقل يهبط إلى القاع فيبقى سائلاً تعيش فيه الكائنات.","- أثر رفع حرارة عيّنة ماء من ٥ س° إلى ١٠ س°: يزداد حجمها وتقل كثافتها.","- أثر خفض حرارة عيّنة ماء من ٣ س° إلى ١ س°: يزداد حجمها وتقل كثافتها (شذوذ الماء).","# أمثلة وتطبيقات","? ما اسم طريقة انتقال الحرارة في كلٍّ من: (أ) انتقال الطاقة من الشمس إلى الأرض، (ب) انتقال الحرارة في ملعقة معدنية وُضع طرفها في شاي ساخن، (ج) إحساسنا بدفء النار ونحن بجانبها؟ || (أ) الإشعاع (يمرّ عبر الفراغ بسرعة الضوء). (ب) التوصيل (في الجسم الصلب من الطرف الساخن إلى البارد). (ج) الإشعاع (كل الأجسام تشعّ طاقة حرارية).","? لماذا تُصنع مقابض أواني الطبخ المعدنية من الخشب أو البلاستيك؟ || لأنهما مادتان رديئتا التوصيل (عازلتان)، فلا تنتقل إليهما حرارة الإناء بسرعة فنمسكه دون أن نحترق، بينما جسم الإناء من معدن جيد التوصيل ليسخن الطعام بسرعة.","? وُضعت عيّنة ماء درجة حرارتها ٨ س° في مبرّد فبردت إلى ٤ س°. ماذا حدث لحجمها وكثافتها؟ ثم ماذا يحدث لو بردت أكثر إلى ٢ س°؟ || من ٨ إلى ٤ س° (أعلى من ٤): بالتبريد يقل الحجم وتزداد الكثافة حتى تبلغ الكثافة أعلاها عند ٤ س°. ومن ٤ إلى ٢ س° (أقل من ٤): يشذّ الماء فيزداد الحجم وتقل الكثافة.","? قدر ألومنيوم كتلته ٠٫٣ كغم سُخّن من ٢٠ س° إلى ١٠٠ س°. احسب كمية الحرارة التي اكتسبها (الحرارة النوعية للألومنيوم ٩٠٠ جول/كغم.س°). || Δ د = ١٠٠ − ٢٠ = ٨٠ س°. كمية الحرارة = ك × ح × Δ د = ٠٫٣ × ٩٠٠ × ٨٠ = ٢١٦٠٠ جول.","? أيّ من المواد الآتية جيدة التوصيل للحرارة: الخشب، البلاستيك، الهواء، النحاس؟ ولماذا؟ || النحاس، لأنه فلز جيد التوصيل للحرارة؛ أما الخشب والبلاستيك والهواء فمواد عازلة رديئة التوصيل."],"q":["- صنّف المواد الآتية إلى موصلة وعازلة للحرارة: النحاس، الخشب، الحديد، الزجاج، الألومنيوم، الغازات.","- اذكر طرق انتقال الحرارة الثلاث مع مثال لكلٍّ منها.","- ما شذوذ الماء؟ وما درجة الحرارة التي تكون عندها كثافة الماء أعلى ما يمكن؟","- فسّر: يبدو الكأس المعدني أبرد من الكأس الزجاجي عند لمس سطحيهما وفيهما ماء مثلّج.","- ما أهمية ظاهرة شذوذ الماء للكائنات البحرية؟"],"quiz":[{"l":0,"k":"n","q":"من المواد الجيدة التوصيل للحرارة:","o":["الخشب","النحاس","البلاستيك","الهواء"],"a":1},{"l":0,"k":"n","q":"أيّ مجموعة تضم مواد كلها رديئة التوصيل للحرارة؟","o":["النحاس والحديد والألومنيوم","الحديد والخشب والنحاس","الألومنيوم والزجاج والنحاس","البلاستيك والزجاج والخشب"],"a":3},{"l":0,"k":"n","q":"تنتقل الطاقة الحرارية من الشمس إلى الأرض بطريقة:","o":["الإشعاع","التوصيل","الضغط","الحمل فقط عبر الفراغ"],"a":0},{"l":0,"k":"n","q":"تنتقل الحرارة في الأجسام الصلبة بطريقة:","o":["الإشعاع فقط","التبخر","التوصيل الحراري","الانكسار"],"a":2},{"l":0,"k":"n","q":"عند ارتفاع درجة حرارة المواد (عدا حالة الماء الخاصة) فإنها:","o":["تتقلص","لا تتغير أبداً","تتجمد","تتمدد"],"a":3},{"l":0,"k":"n","q":"تكون كثافة الماء أعلى ما يمكن عند درجة:","o":["٤ س°","صفر س°","١٠ س°","٤٠ س°"],"a":0},{"l":0,"k":"n","q":"تُسمّى ظاهرة تمدد الماء بالتبريد دون ٤ س° وانكماشه بالتسخين:","o":["التوصيل","الإشعاع","شذوذ الماء","الحرارة النوعية"],"a":2},{"l":0,"k":"n","q":"المواد التي تعيق انتقال الحرارة تُسمّى:","o":["مواد موصلة","مواد عازلة","مواد مشعّة","مواد ذائبة"],"a":1},{"l":1,"k":"p","q":"كأسان فيهما ماء مثلّج: معدنية وزجاجية. نشعر بأن المعدنية أبرد لأن المعدن:","o":["عازل فيحبس البرودة","أثقل من الزجاج فقط","جيد التوصيل فيسحب الحرارة من اليد بسرعة",
