٢ نيوتن","٠٫٠٠٠٠٠٥ نيوتن","٢٠ نيوتن"],"a":3},{"l":1,"k":"p","q":"كثافة الماء ١٠٠٠ كغم/م³ وحجم الماء ٠٫٠٠٢ م³، فكتلة الماء:","o":["٢٠٠٠ كغم","٠٫٢ كغم","٢ كغم","٠٫٠٠٢ كغم"],"a":2},{"l":2,"k":"p","q":"عمق الماء عند الضغط ٤٠٠٠٠٠ باسكال (ث = ١٠٠٠، جـ = ١٠):","o":["٤ م","٤٠٠ م","٤٠ م","٠٫٤ م"],"a":2},{"l":2,"k":"p","q":"إذا تضاعف عمق نقطة في الماء من ١٠ م إلى ٢٠ م فإن الضغط:","o":["يبقى ١٠٠٠٠٠ باسكال","يتضاعف من ١٠٠٠٠٠ إلى ٢٠٠٠٠٠ باسكال","يصبح النصف","يزداد ١٠ باسكال فقط"],"a":1},{"l":2,"k":"p","q":"مكبس فائدته الآلية ٤٠، فالقوة اللازمة لرفع سيارة وزنها ١٢٠٠٠ نيوتن:","o":["٣٠٠ نيوتن","٤٨٠٠٠٠ نيوتن","٣٠٠٠ نيوتن","٣٠ نيوتن"],"a":0},{"l":2,"k":"p","q":"أسطوانتا مكبس مساحتهما ٠٫٠٥ م² و٠٫٢ م²، ورجل وزنه ١٠٠٠ نيوتن على الكبرى. وزن الابن على الصغرى لرفعه:","o":["٤٠٠٠ نيوتن","٥٠ نيوتن","١٠٠٠ نيوتن","٢٥٠ نيوتن"],"a":3},{"l":2,"k":"p","q":"الفرق بين ضغط الماء على عمق ٨ م وعمق ٣ م (ث = ١٠٠٠، جـ = ١٠):","o":["٨٠٠٠٠ باسكال","٣٠٠٠٠ باسكال","١١٠٠٠٠ باسكال","٥٠٠٠٠ باسكال"],"a":3},{"l":2,"k":"p","q":"وعاء ارتفاع الماء فيه ٠٫٢ م، فضغط الماء على قاعدته:","o":["٢٠٠ باسكال","٢٠ باسكال","٢٠٠٠ باسكال","٢٠٠٠٠ باسكال"],"a":2},{"l":2,"k":"p","q":"لماذا يكون جدار السد عند القاعدة أسمك؟","o":["لأن الماء أقل كثافة في الأسفل","لأن الضغط يزداد بزيادة العمق","لأن الماء أخف في الأسفل","لأن الضغط ينعدم عند القاعدة"],"a":1},{"l":2,"k":"p","q":"قوة ٥٠ نيوتن على مساحة ٠٫٠١ م² في مكبس تعطي ضغطاً ينتقل إلى أسطوانة مساحتها ٠٫٥ م². القوة عليها:","o":["٢٥٠٠ نيوتن","٢٥ نيوتن","٥٠٠٠ نيوتن","٠٫١ نيوتن"],"a":0}],"hints":{"في الحالة الصلبة تتحرك الدقائق حركة:":"تذكّر وصف الصلب: له شكل وحجم ثابتان.\nوالقوى بين دقائقه كبيرة.","قانون ضغط السائل هو:":"الضغط يعتمد على العمق والكثافة وتسارع الجاذبية.\nكلها تُضرب معاً.","ضغط الماء على عمق ١٠ م (ث = ١٠٠٠، جـ = ١٠):":"طبّق ض = ل × ث × جـ.\nاضرب ١٠ × ١٠٠٠ × ١٠.","مساحة الأسطوانة الصغرى ٠٫٠٢ م² والكبرى ٠٫٤ م²، فالفائدة الآلية:":"الفائدة الآلية = الكبرى ÷ الصغرى.\nاقسم ٠٫٤ على ٠٫٠٢.","عمق الماء عند الضغط ٤٠٠٠٠٠ باسكال (ث = ١٠٠٠، جـ = ١٠):":"اقلب القانون: ل = ض ÷ (ث × جـ).\nاحسب المقام ١٠٠٠ × ١٠ أولاً.","أسطوانتا مكبس مساحتهما ٠٫٠٥ م² و٠٫٢ م²، ورجل وزنه ١٠٠٠ نيوتن على الكبرى. وزن الابن على الصغرى لرفعه:":"الضغط متساوي: ق₁ ÷ م₁ = ق₂ ÷ م₂.\nضع ١٠٠٠ مكان ق₂."}},{"t":"قاعدة أرخميدس","e":["# نشاط ١: وجدتها","يُحكى أن صائغاً صنع لملك سرقسطة (هيرو) تاجاً جديداً، لكن الملك شك في أن هذا التاج ليس ذهباً خالصاً وقد يكون مغشوشاً بالفضة، فكلّف العالم (أرخميدس) بأن يكشف له حقيقة هذا الأمر.","ذات يوم كان أرخميدس يستحم في حوض الاستحمام فلاحظ أن مياه الحوض فاضت من فوق حافته حينما تمدد بداخله وتدفق الماء على الجوانب، فاستدل على أن الماء المتدفق لو حُبس في إناء وقيس حجمه فإنه سيكون مساوياً لحجم جسمه.","فرح فرحاً كبيراً وردّد: «يوريكا» أي وجدتها! فقام بوضع التاج في الماء فتبيّن أن التاج أزاح كمية من الماء أكبر من الكمية التي أزاحها نفس الوزن من الذهب الخالص، واتضح أن الصائغ غشّ في التاج إذ كان مخلوطاً بالفضة.","# نشاط: قياس وزن الماء المزاح","المواد والأدوات: دورق إزاحة، وماء، وكأس مدرّجة، وميزان نابضي، وميزان رقمي، وجسم صلب.","- نملأ دورق الإزاحة بالماء ونضع الكأس المدرجة بحيث تكون فوهته أسفل دورق الإزاحة.","- نعلّق الجسم في خطاف الميزان النابضي ونسجّل قراءته: وزن الجسم في الهواء.","- ننزل الجسم بلطف وهو معلّق بالميزان في الماء حتى ينغمر تماماً ونسجّل القراءة: وزن الجسم في الماء، ونجمع الماء المزاح في الكأس المدرّجة.","- نقيس حجم الماء المزاح بالمخبار المدرّج.","|الكمية|كيف نحصل عليها","|وزن الجسم في الهواء|قراءة الميزان النابضي في الهواء","|وزن الجسم في الماء|قراءة الميزان النابضي والجسم مغمور في الماء","|الخسارة الظاهرة في الوزن|وزنه في الهواء − وزنه في الماء","|وزن الماء المزاح|يساوي الخسارة الظاهرة في الوزن","! سبب إزاحة كمية من الماء: الجسم المغمور يشغل حيّزاً فيدفع الماء بعيداً. حجم الجسم المغمور = حجم الماء المزاح، ووزن الماء المزاح = الفرق بين قراءتي الميزان.","# قاعدة أرخميدس وقوة الطفو","من قصة الملك هيرو والصائغ توصل أرخميدس إلى أن قوة الطفو تنشأ من غمر جسم ما في مائع كلياً أو جزئياً، حيث يتساوى وزن المائع المزاح أثناء الغمر مع الخسارة الظاهرة في الوزن.","- قاعدة أرخميدس: يتعرض الجسم المغمور كلياً أو جزئياً في مائع ما لقوة تدفعه رأسياً إلى أعلى تسمى قوة الطفو ومقدارها يساوي وزن المائع المزاح.","- قوة الطفو: قوة يؤثر بها المائع في الجسم المغمور فيه، اتجاهها رأسياً إلى أعلى (عكس وزن الجسم).","- الخسارة الظاهرة في الوزن: الفرق بين وزن الجسم في الهواء ووزنه في السائل.","وصف الشكل: ميزان نابضي يعلّق جسماً مغموراً في إناء ماء، وتشير الأسهم إلى قوة الطفو لأعلى ووزن الجسم في السائل لأسفل، وبجانب الإناء كأس تجمع السائل المزاح.","# العلاقات والقوانين","عند غمر جسم كلياً في سائل:","- حجم الجسم = حجم السائل المزاح.","- وزن السائل المزاح = الخسارة الظاهرة في وزن الجسم = وزنه في الهواء − وزنه في السائل.","- قوة الطفو = وزن السائل المزاح.","! وزن السائل المزاح = كتلته × جـ، وكتلة السائل = حجمه × كثافته؛ فقوة الطفو = الحجم المزاح × كثافة السائل × جـ.","# أمثلة محلولة","? جسم وزنه في الهواء ٨ نيوتن وحجمه ٢٠٠ سم³، غُمر في الماء فأصبح وزنه ٦ نيوتن. احسب وزن الماء المزاح وحجمه. || وزن الماء المزاح = وزن الجسم في الهواء − وزنه في الماء = ٨ − ٦ = ٢ نيوتن. حجم الماء المزاح = حجم الجسم = ٢٠٠ سم³.","? غُمر جسم حجمه ٠٫٠٠٠٥ م³ كلياً في الماء، ووزنه في الهواء ٦٠ نيوتن. احسب: حجم الماء المزاح، ووزن الماء المزاح، ووزن الجسم في الماء. (ث = ١٠٠٠ كغم/م³، جـ = ١٠ م/ث²) || حجم الماء المزاح = حجم الجسم = ٠٫٠٠٠٥ م³. كتلة الماء المزاح = ١٠٠٠ × ٠٫٠٠٠٥ = ٠٫٥ كغم، فوزنه = ٠٫٥ × ١٠ = ٥ نيوتن. وزن الجسم في الماء = ٦٠ − ٥ = ٥٥ نيوتن.","? كرة وزنها في الهواء ٩ نيوتن غُمرت في سائل فأصبح وزنها ٦ نيوتن. ما وزن السائل المزاح؟ || وزن السائل المزاح = ٩ − ٦ = ٣ نيوتن (وهو قوة الطفو).","? جسم وزنه في الهواء ١٢ نيوتن، ووزنه في الماء ٩ نيوتن. احسب قوة الطفو وحجم الجسم. (ث = ١٠٠٠، جـ = ١٠) || قوة الطفو = ١٢ − ٩ = ٣ نيوتن = وزن الماء المزاح. كتلة الماء المزاح = ٣ ÷ ١٠ = ٠٫٣ كغم. الحجم = ٠٫٣ ÷ ١٠٠٠ = ٠٫٠٠٠٣ م³ (٣٠٠ سم³).","? جسم وزنه في الهواء ٨ نيوتن وزنه في الماء صفر. ما وزن السائل المزاح؟ || وزن السائل المزاح = ٨ − ٠ = ٨ نيوتن.","# تطبيقات حياتية","- كشف غش التاج: التاج المخلوط بالفضة يزيح كمية من الماء أكبر من التي يزيحها الذهب الخالص بالوزن نفسه.","- نشعر بخفة وزننا في الماء لأن الماء يؤثر فينا بقوة طفو لأعلى.","- نقيس حجم جسم غير منتظم بغمره في الماء وقياس الماء المزاح."],"q":["- ما قصة اكتشاف أرخميدس لقاعدته؟ ولماذا فرح؟","- اكتب نص قاعدة أرخميدس.","- ما العلاقة بين حجم الجسم المغمور وحجم الماء المزاح؟","- ما العلاقة بين الفرق في قراءتي الميزان ووزن الماء المزاح؟","- جسم وزنه ١٥ نيوتن في الهواء و١١ نيوتن في الماء. احسب قوة الطفو."],"quiz":[{"l":0,"k":"n","q":"من العالم الذي توصل إلى قاعدة الطفو بعد ملاحظة فيضان ماء الحوض؟","o":["باسكال","هيرو","نيوتن","أرخميدس"],"a":3},{"l":0,"k":"n","q":"قوة الطفو تؤثر في الجسم المغمور باتجاه:","o":["رأسياً إلى أسفل","أفقياً إلى اليمين","رأسياً إلى أعلى","أفقياً إلى اليسار"],"a":2},{"l":0,"k":"n","q":"مقدار قوة الطفو يساوي:","o":["وزن الجسم في الهواء","وزن المائع المزاح","حجم الجسم","كثافة الجسم"],"a":1},{"l":0,"k":"n","q":"الخسارة الظاهرة في وزن الجسم تساوي:","o":["وزنه في الهواء − وزنه في السائل","وزنه في الهواء + وزنه في السائل","وزنه في الهواء × وزنه في السائل","وزنه في السائل ÷ وزنه في الهواء"],"a":0},{"l":0,"k":"n","q":"عند غمر جسم كلياً فإن حجم الجسم يساوي:","o":["حجم السائل المزاح","وزن السائل المزاح","كثافة السائل","كتلة الجسم"],"a":0},{"l":0,"k":"n","q":"الأداة المستخدمة لقياس وزن الجسم في الهواء وفي الماء هي:","o":["المسطرة","المخبار فقط","الترمومتر","الميزان النابضي"],"a":3},{"l":0,"k":"n","q":"ماذا قال أرخميدس عندما اكتشف الفكرة؟","o":["أخيراً","سأعود","يوريكا (وجدتها)","فاض الماء"],"a":2},{"l":0,"k":"n","q":"أي أداة نستعمل لقياس حجم الماء المزاح؟","o":["الميزان النابضي","المخبار المدرّج","المسطرة","الميزان الرقمي"],"a":1},{"l":1,"k":"p","q":"وزن جسم في الهواء ١٠ نيوتن وفي الماء ٧ نيوتن، فوزن الماء المزاح:","o":["١٧ نيوتن","٣ نيوتن","٧٠ نيوتن","١٠ نيوتن"],"a":1},{"l":1,"k":"p","q":"كرة وزنها في الهواء ٩ نيوتن وفي السائل ٦ نيوتن، فقوة الطفو عليها:","o":["٣ نيوتن","١٥ نيوتن","٥٤ نيوتن","٦ نيوتن"],"a":0},{"l":1,"k":"p","q":"جسم حجمه ٢٥٠ سم³ غُمر كلياً في الماء، فحجم الماء المزاح:","o":["١٢٥ سم³","٥٠٠ سم³","لا يمكن تحديده","٢٥٠ سم³"],"a":3},{"l":1,"k":"p","q":"جسم وزنه في الهواء ٨ نيوتن ووزنه في الماء صفر، فوزن السائل المزاح:","o":["صفر","٤ نيوتن","٨ نيوتن","١٦ نيوتن"],"a":2},{"l":1,"k":"p","q":"جسم وزنه في الهواء ٢٠ نيوتن وقوة الطفو عليه ٥ نيوتن، فوزنه في الماء:","o":["٢٥ نيوتن","٤ نيوتن","١٥ نيوتن","١٠٠ نيوتن"],"a":2},{"l":1,"k":"p","q":"لماذا شكّ الملك هيرو في تاجه؟","o":["لأنه ثقيل جداً","ظنّ أنه مغشوش بالفضة وليس ذهباً خالصاً","لأنه لا يلمع","لأنه صغير الحجم"],"a":1},{"l":1,"k":"p","q":"وزن جسم في الهواء ٧ نيوتن، وقوة الطفو عليه ٢ نيوتن، فوزن الماء المزاح:","o":["٢ نيوتن","٥ نيوتن","٩ نيوتن","٧ نيوتن"],"a":0},{"l":1,"k":"p","q":"سبب إزاحة كمية من الماء عند غمر جسم فيه:","o":["لأن الماء يتبخر","لأن الجسم يذوب","لأن الماء يتجمد","لأن الجسم يشغل حيّزاً فيدفع الماء بعيداً"],"a":3},{"l":2,"k":"p","q":"غُمر جسم حجمه ٠٫٠٠٠٥ م³ كلياً في الماء (ث = ١٠٠٠، جـ = ١٠)، فوزن الماء المزاح:","o":["٥٠٠ نيوتن","٠٫٥ نيوتن","٥٠ نيوتن","٥ نيوتن"],"a":3},{"l":2,"k":"p","q":"الجسم السابق وزنه في الهواء ٦٠ نيوتن، فوزنه في الماء:","o":["٦٥ نيوتن","٣٠ نيوتن","٥٥ نيوتن","٥ نيوتن"],"a":2},{"l":2,"k":"p","q":"جسم وزنه ١٢ نيوتن في الهواء و٩ نيوتن في الماء، فحجمه (ث = ١٠٠٠، جـ = ١٠):","o":["٣ سم³","٣٠٠ سم³","٣٠ سم³","٣٠٠٠ سم³"],"a":1},{"l":2,"k":"p","q":"جسم حجمه ٠٫٠٠٢ م³ مغمور كلياً في الماء (ث = ١٠٠٠، جـ = ١٠)، فقوة الطفو:","o":["٢٠ نيوتن","٢ نيوتن","٢٠٠ نيوتن","٠٫٢ نيوتن"],"a":0},{"l":2,"k":"p","q":"جسمان بالوزن نفسه في الهواء: الأول يزيح ٢٠ سم³ من الماء والثاني ٣٠ سم³. أيهما حجمه أكبر؟","o":["الثاني لأنه أزاح ماء أكثر","الأول","متساويان","لا يمكن المقارنة"],"a":0},{"l":2,"k":"p","q":"كيف عرف أرخميدس أن التاج مغشوش؟","o":["كان التاج أخف من الذهب","غيّر التاج لونه في الماء","ذاب التاج في الماء","أزاح التاج ماء أكثر من ذهب خالص له الوزن نفسه"],"a":3},{"l":2,"k":"p","q":"ميزان نابضي قرأ ٤٠ نيوتن في الهواء، وبعد الغمر نقصت القراءة ٦ نيوتن، فقراءته في الماء:","o":["٤٦ نيوتن","٦ نيوتن","٣٤ نيوتن","٢٤٠ نيوتن"],"a":2},{"l":2,"k":"p","q":"جسم يزيح ٢ كغم من الماء عند غمره (جـ = ١٠)، فقوة الطفو عليه:","o":["٢ نيوتن","٢٠ نيوتن","٠٫٢ نيوتن","١٢ نيوتن"],"a":1}],"hints":{"مقدار قوة الطفو يساوي:":"قاعدة أرخميدس تربط القوة بشيء يُزاح.\nفكّر في وزن ماذا؟","وزن جسم في الهواء ١٠ نيوتن وفي الماء ٧ نيوتن، فوزن الماء المزاح:":"وزن الماء المزاح = الخسارة الظاهرة.\nاطرح القراءتين.","غُمر جسم حجمه ٠٫٠٠٠٥ م³ كلياً في الماء (ث = ١٠٠٠، جـ = ١٠)، فوزن الماء المزاح:":"احسب كتلة الماء المزاح: الكثافة × الحجم.\nثم اضربها في جـ.","جسم وزنه ١٢ نيوتن في الهواء و٩ نيوتن في الماء، فحجمه (ث = ١٠٠٠، جـ = ١٠):":"قوة الطفو = وزن الماء المزاح = ٣ نيوتن.\nاحسب كتلته ثم الحجم = الكتلة ÷ الكثافة."}},{"t":"الحركة الانتقالية","e":["# تمهيد: رحلة أسعد الصباحية","اعتاد أسعد أن يركض صباحاً من بيته إلى البقالة، ثم يعود إلى منزله حسب المسار المبيّن في الشكل: من بيت أسعد إلى النادي الرياضي ٦٠٠ م، ثم من النادي إلى المسجد (مروراً بالمدرسة) ٤٠٠ م، ثم من المسجد إلى البقالة ٣٠٠ م، ثم من البقالة إلى البيت ٥٠٠ م.","في هذه الرحلة ينتقل أسعد من مكان إلى آخر، فنقول إن حركته حركة انتقالية، ونصفها بثلاث كميات: المسافة والإزاحة والسرعة.","# المسافة والإزاحة","- المسافة: طول المسار الفعلي الذي سلكه الجسم أثناء حركته، وتُقاس بالمتر.","- الإزاحة: خط مستقيم ينطلق من نقطة البداية إلى نقطة النهاية.","- نقطة البداية: المكان الذي ينطلق منه الجسم (بيت أسعد في المثال).","- نقطة النهاية: المكان الذي يصل إليه الجسم عند توقّفه عن الحركة.","! إذا انطبقت نقطة النهاية على نقطة البداية فإن الإزاحة تساوي صفراً مهما كانت المسافة المقطوعة.","|الكمية|ماذا تمثّل|رحلة أسعد (ذهاباً وإياباً)","|المسافة|طول المسار الفعلي|٦٠٠ + ٤٠٠ + ٣٠٠ + ٥٠٠ = ١٨٠٠ م","|الإزاحة|الخط المستقيم من البداية إلى النهاية|صفر (عاد إلى بيته)","# السرعة المتوسطة والسرعة الثابتة","- السرعة المتوسطة: الإزاحة التي يقطعها الجسم في وحدة الزمن، ووحدتها م/ث.","- السرعة الثابتة: سرعة جسم يقطع إزاحات متساوية خلال أزمنة متساوية في خط مستقيم.","السرعة المتوسطة = الإزاحة ÷ الزمن، أي: ع = Δس ÷ ز، ومنها: الزمن = الإزاحة ÷ السرعة، والإزاحة = السرعة × الزمن.","! عندما يقطع الجسم المتحرّك في خط مستقيم إزاحات متساوية خلال أزمنة متساوية فإن سرعته تكون ثابتة.","# أمثلة محلولة","? أسعد قطع أجزاء المسار ٦٠٠ م و٤٠٠ م و٣٠٠ م و٥٠٠ م وعاد إلى بيته. جد المسافة التي قطعها والإزاحة. || المسافة تمثّل طول المسار الفعلي: ٦٠٠ + ٤٠٠ + ٣٠٠ + ٥٠٠ = ١٨٠٠ م. أما الإزاحة فخط مستقيم من نقطة البداية إلى النهاية، وبما أن النهاية انطبقت على البداية فالإزاحة = صفر.","? ركض أسعد من بيته إلى النادي ثم إلى المسجد وانتهى بالبقالة. جد المسافة والإزاحة. || المسافة = ٦٠٠ + ٤٠٠ + ٣٠٠ = ١٣٠٠ م (طول المسار الفعلي). الإزاحة هي الخط المستقيم من البيت (البداية) إلى البقالة (النهاية) وطوله ٥٠٠ م في اتجاه البقالة. والحركة حركة انتقالية.","? غادرت ليلى منزلها صباحاً بمسار مستقيم نحو المدرسة التي تبعد ٦٠٠ م بسرعة ثابتة ١ م/ث. ما الزمن اللازم للوصول؟ || ع = الإزاحة ÷ الزمن ← ١ = ٦٠٠ ÷ الزمن ← الزمن = ٦٠٠ ÷ ١ = ٦٠٠ ثانية = ٦٠٠ ÷ ٦٠ = ١٠ دقائق.","? قطعت سيارة ليث بطارية جافة إزاحة ١ م خلال ثانيتين، جد الزمن اللازم لتقطع ٤ م بالسرعة الثابتة نفسها. || ع = ١ ÷ ٢ = ٠٫٥ م/ث. السرعة ثابتة فتبقى ٠٫٥ م/ث: ٠٫٥ = ٤ ÷ الزمن ← الزمن = ٤ ÷ ٠٫٥ = ٨ ثوانٍ.","? ركضت ليلى عائدة من المدرسة إلى منزلها (٦٠٠ م) في دقيقتين. احسب سرعتها المتوسطة. || الزمن = ٢ × ٦٠ = ١٢٠ ث. ع = ٦٠٠ ÷ ١٢٠ = ٥ م/ث.","? سبح عبد الله في رحلة مدرسية بسرعة ٢٫٥ م/ث في خط مستقيم لمدة دقيقتين. جد إزاحته. || الزمن = ٢ × ٦٠ = ١٢٠ ث. الإزاحة = ع × ز = ٢٫٥ × ١٢٠ = ٣٠٠ م.","# تطبيقات وتأمّل","عروس البحر (حيفا) مدينة فلسطينية تاريخية على الساحل الشرقي للبحر المتوسط، وتبعد عن القدس نحو ١٥٨ كم إلى الشمال الغربي؛ وهي مثال على مسافة طويلة تحتاج إلى زمن أطول للوصول إليها.","- عند تحديد الحركة نعيّن دائماً نقطة البداية ونقطة النهاية.","- عند حساب المسافة نجمع أطوال كل أجزاء المسار الفعلي.","- عند حساب الإزاحة ننظر إلى الخط المستقيم بين البداية والنهاية فقط.","! قاعدة الحل: اكتب المعطيات، واكتب القانون ع = الإزاحة ÷ الزمن، وحوّل الدقائق إلى ثوانٍ، ثم عوّض."],"q":["- ما الفرق بين المسافة والإزاحة؟ ومتى تساوي الإزاحة صفراً؟","- اكتب قانون السرعة المتوسطة، ووحدتها، وكيف نحسب منه الزمن؟","- متى نقول إن سرعة الجسم ثابتة؟","- ركض طالب ٣٠٠ م بسرعة ثابتة ٣ م/ث. كم ثانية احتاج؟","- في رحلة أسعد (بيت ← نادٍ ← مسجد ← بقالة) ما المسافة وما الإزاحة؟"],"quiz":[{"l":0,"k":"n","q":"ما المسافة في الحركة الانتقالية؟","o":["طول المسار الفعلي الذي سلكه الجسم","الخط المستقيم بين البداية والنهاية","الزمن الذي استغرقته الحركة","التغيّر في السرعة"],"a":0},{"l":0,"k":"n","q":"ما الإزاحة؟","o":["طول المسار الفعلي كلّه","سرعة الجسم في كل لحظة","الزمن اللازم للوصول","خط مستقيم من نقطة البداية إلى نقطة النهاية"],"a":3},{"l":0,"k":"n","q":"ما وحدة قياس السرعة؟","o":["م/ث²","كغم.م/ث²","م/ث","م"],"a":2},{"l":0,"k":"n","q":"أيّ العلاقات الآتية تمثّل السرعة المتوسطة؟","o":["السرعة = الإزاحة × الزمن","السرعة = الإزاحة ÷ الزمن","السرعة = الزمن ÷ الإزاحة","السرعة = الإزاحة + الزمن"],"a":1},{"l":0,"k":"n","q":"إذا انطبقت نقطة النهاية على نقطة البداية فإن الإزاحة:","o":["تساوي المسافة","تساوي صفراً","تساوي ضعف المسافة","لا يمكن حسابها"],"a":1},{"l":0,"k":"n","q":"متى تكون سرعة الجسم ثابتة؟","o":["عندما يقطع إزاحات متساوية خلال أزمنة متساوية","عندما يقطع إزاحات مختلفة خلال أزمنة متساوية","عندما تتغيّر الإزاحة في كل ثانية","عندما يتغيّر اتجاه حركته فقط"],"a":0},{"l":0,"k":"n","q":"المسافة التي قطعها أسعد في رحلته تُحسب بجمع:","o":["الخط المستقيم بين البيت والبقالة","الأزمنة فقط","الإزاحات المتعاكسة فقط","أطوال أجزاء المسار الفعلي"],"a":3},{"l":0,"k":"n","q":"بأيّ وحدة تُقاس المسافة والإزاحة في رحلة أسعد؟","o":["الثانية","م/ث","المتر","الكيلوغرام"],"a":2},{"l":1,"k":"p","q":"ركض أسعد من بيته إلى النادي (٦٠٠ م) ثم إلى المسجد (٤٠٠ م) ثم إلى البقالة (٣٠٠ م). ما المسافة التي قطعها؟","o":["١٠٠٠ م","١٨٠٠ م","١٣٠٠ م","٥٠٠ م"],"a":2},{"l":1,"k":"p","q":"انتهى أسعد عند البقالة بعد الرحلة السابقة، وكان الخط المستقيم من بيته إلى البقالة ٥٠٠ م. ما إزاحته؟","o":["١٣٠٠ م","٥٠٠ م","صفر","١٨٠٠ م"],"a":1},{"l":1,"k":"p","q":"تقطع ليلى ٦٠٠ م بسرعة ثابتة ١ م/ث. كم دقيقة تحتاج؟","o":["١٠ دقائق","٦ دقائق","٦٠ دقيقة","١٠٠ دقيقة"],"a":0},{"l":1,"k":"p","q":"سيارة تتحرك بسرعة ثابتة ٢ م/ث. ما إزاحتها بعد ١٥ ثانية؟","o":["١٧ م","٧٫٥ م","١٣ م","٣٠ م"],"a":3},{"l":1,"k":"p","q":"قطع متنزّه إزاحة ١٢٠ م في ٤٠ ث. ما سرعته المتوسطة؟","o":["٨٠ م/ث","١٦٠ م/ث","٠٫٣٣ م/ث","٣ م/ث"],"a":3},{"l":1,"k":"p","q":"عاد أسعد إلى بيته بعد رحلة ركض كاملة. ما إزاحته الكلية؟","o":["ضعف المسافة","نصف المسافة","صفر","تساوي المسافة"],"a":2},{"l":1,"k":"p","q":"سيارة لعبة بسرعة ثابتة ٠٫٥ م/ث. كم ثانية تحتاج لتقطع ٣ م؟","o":["١٫٥ ثانية","٦ ثوانٍ","٣٫٥ ثانية","١٢ ثانية"],"a":1},{"l":1,"k":"p","q":"ركض طالب حول الملعب دورة كاملة وعاد إلى نقطة البداية. أيّ العبارات صحيحة؟","o":["المسافة أكبر من الصفر والإزاحة تساوي صفراً","المسافة صفر والإزاحة أكبر من الصفر","المسافة والإزاحة تساويان صفراً","المسافة تساوي الإزاحة دائماً"],"a":0},{"l":2,"k":"p","q":"سبح عبد الله بسرعة ثابتة ٢٫٥ م/ث في خط مستقيم لمدة دقيقتين. ما إزاحته؟","o":["٣٠٠ م","٥ م","١٥٠ م","٣٠٠٠ م"],"a":0},{"l":2,"k":"p","q":"عادت ليلى من المدرسة إلى منزلها (٦٠٠ م) في دقيقتين. ما سرعتها المتوسطة؟","o":["٠٫٢ م/ث","٣٠٠ م/ث","٥٠ م/ث","٥ م/ث"],"a":3},{"l":2,"k":"p","q":"قطعت سيارة ١٢٠٠ م بسرعة ثابتة ٤ م/ث. كم ثانية احتاجت؟","o":["٣٠ ثانية","٤٨٠٠ ثانية","٣٠٠ ثانية","٣ ثوانٍ"],"a":2},{"l":2,"k":"p","q":"عدّاء (أ) قطع ١٠٠ م في ٢٠ ث، وعدّاء (ب) قطع ١٥٠ م في ٢٥ ث في خط مستقيم. أيّهما أسرع؟","o":["(أ) لأنه قطع مسافة أقل","(ب) لأن سرعته ٦ م/ث وسرعة (أ) ٥ م/ث","متساويان في السرعة","لا يمكن المقارنة"],"a":1},{"l":2,"k":"p","q":"جسم يقطع ٣ م في كل ثانية بخط مستقيم. ما إزاحته بعد ١٠ ثوانٍ؟","o":["١٣ م","٣٠ م","٠٫٣ م","٣ م"],"a":1},{"l":2,"k":"p","q":"ذهبت ليلى إلى المدرسة (٦٠٠ م) في ١٠ دقائق وعادت في دقيقتين. بكم دقيقة كانت العودة أسرع؟","o":["٨ دقائق","١٢ دقيقة","٥ دقائق","دقيقتين"],"a":0},{"l":2,"k":"p","q":"قطعت سيارة ليث ٤ م في ٨ ث بسرعة ثابتة. ما إزاحتها بعد ١٦ ثانية بالسرعة نفسها؟","o":["٤ م","٢ م","٣٢ م","٨ م"],"a":3},{"l":2,"k":"p","q":"مشى طالب بسرعة ١٫٥ م/ث لمدة ٤٠ ث ثم عاد إلى نقطة البداية. ما إزاحته الكلية؟","o":["٦٠ م","١٢٠ م","صفر","٤٠ م"],"a":2}],"hints":{"ركض أسعد من بيته إلى النادي (٦٠٠ م) ثم إلى المسجد (٤٠٠ م) ثم إلى البقالة (٣٠٠ م). ما المسافة التي قطعها؟":"اجمع أطوال الأجزاء الثلاثة التي سلكها فعلاً.","تقطع ليلى ٦٠٠ م بسرعة ثابتة ١ م/ث. كم دقيقة تحتاج؟":"الزمن = الإزاحة ÷ السرعة، ثم قسّم الثواني على ٦٠.","سبح عبد الله بسرعة ثابتة ٢٫٥ م/ث في خط مستقيم لمدة دقيقتين. ما إزاحته؟":"حوّل الدقيقتين إلى ثوانٍ أولاً ثم اضرب في السرعة.","عدّاء (أ) قطع ١٠٠ م في ٢٠ ث، وعدّاء (ب) قطع ١٥٠ م في ٢٥ ث في خط مستقيم. أيّهما أسرع؟":"احسب سرعة كل عدّاء بقسمة الإزاحة على الزمن ثم قارن."}},{"t":"التسارع الثابت","e":["# نشاط ١: رحلة إلى الساحل","ركب إياد بجوار والده في رحلة إلى الساحل الفلسطيني، وفي بداية الرحلة بدأ بتصوير فيلم فيديو لعداد السرعة، ونقل البيانات إلى لوحة رسم فيها السيارة كما في الشكل: عند اللحظة صفر السرعة ٠ م/ث، وبعد ١ ثانية ٣ م/ث، وبعد ٢ ثانية ٦ م/ث، وبعد ٣ ثوانٍ ٩ م/ث، وبعد ٤ ثوانٍ ١٢ م/ث.","|الزمن (ث)|٠|١|٢|٣|٤","|السرعة (م/ث)|٠|٣|٦|٩|١٢","- التغيّر في السرعة خلال الثانية الأولى (من ٠ إلى ١ ث) = ٣ − ٠ = ٣ م/ث.","- النسبة بين التغيّر في السرعة والتغيّر في الزمن = ٣ ÷ ١ = ٣ م/ث².","- التغيّر في السرعة خلال الفترة من ٠ إلى ٤ ث = ١٢ − ٠ = ١٢ م/ث، والنسبة = ١٢ ÷ ٤ = ٣ م/ث².","- سرعة السيارة ليست ثابتة، بل تتزايد؛ والنسبتان متساويتان (٣ = ٣)، أي أن السرعة تزداد بمقدار متساوٍ كل ثانية.","# مفهوم التسارع وقانونه","- التسارع: الكمية الفيزيائية الناتجة عن حساب النسبة بين التغيّر في السرعة والتغيّر في الزمن، ووحدة قياسه م/ث².","- Δز (التغيّر في الزمن): الفترة الزمنية التي حدث خلالها التغيّر في السرعة.","- ع١: السرعة الابتدائية، و ع٢: السرعة النهائية.","التسارع (ت) = التغيّر في السرعة (Δع) ÷ التغيّر في الزمن (Δز)، أي: ت = (ع٢ − ع١) ÷ Δز.","! التسارع الثابت يعني أن السرعة تتغيّر بمقدار متساوٍ في كل ثانية؛ ففي نشاط إياد التسارع ٣ م/ث².","! من القانون: Δز = (ع٢ − ع١) ÷ ت، والتغيّر في السرعة = ت × Δز.","# أمثلة محلولة","? سيارة سباق تتزايد سرعتها من ٤ م/ث إلى ٣٦ م/ث خلال فترة زمنية مقدارها ٤ ثوانٍ، فما تسارعها؟ || ت = (ع٢ − ع١) ÷ Δز = (٣٦ − ٤) ÷ ٤ = ٣٢ ÷ ٤ = ٨ م/ث².","? تدحرجت كرة بسرعة ابتدائية ٥ م/ث على سطح مائل لأسفل بتسارع ٣ م/ث². احسب الزمن اللازم حتى تصبح سرعتها ٢٠ م/ث. || ت = (ع٢ − ع١) ÷ Δز ← ٣ = (٢٠ − ٥) ÷ Δز ← ٣ × Δز = ١٥ ← Δز = ٥ ثوانٍ.","? سيارة تحركت من السكون وبعد ٥ ثوانٍ بلغت سرعتها ٢٠ م/ث. ما تسارعها؟ || ع١ = ٠ ، ع٢ = ٢٠ ، Δز = ٥ ← ت = (٢٠ − ٠) ÷ ٥ = ٤ م/ث².","? سيارة سرعتها ١٠ م/ث وتتسارع بمقدار ٢ م/ث². ما سرعتها بعد ٦ ثوانٍ؟ || التغيّر في السرعة = ت × Δز = ٢ × ٦ = ١٢ م/ث، فتصبح ع٢ = ١٠ + ١٢ = ٢٢ م/ث.","# تحليل جدول نور","ركبت نور في المقعد الأمامي ودوّنت قراءات العداد منذ لحظة انطلاق السيارة من السكون في خط أفقي مستقيم.","|الزمن (ث)|٠|١|٢|٣|٤|٥|٦","|السرعة (كم/س)|٠|١٨|٣٦|٥٤|٧٢|٣٦|٠","|السرعة (م/ث)|٠|٥|١٠|١٥|٢٠|١٠|٠","? أكمل الصف الثاني، وجد تسارع السيارة في الثانيتين الأوليين ثم في الثانيتين الأخيرتين. || من الصف الأول: ١٨ كم/س = ٥ م/ث، ٣٦ كم/س = ١٠ م/ث، ٥٤ كم/س = ١٥ م/ث، ٧٢ كم/س = ٢٠ م/ث، وعند الثانية الخامسة ٣٦ كم/س = ١٠ م/ث. أول ثانيتين: ت = (١٠ − ٠) ÷ ٢ = ٥ م/ث². آخر ثانيتين (من ٤ إلى ٦): ت = (٠ − ٢٠) ÷ ٢ = −١٠ م/ث²؛ الإشارة السالبة تعني أن السرعة تتناقص.","- كان السائق يدوس على دواسة الفرامل (الكوابح) في الفترة من الثانية ٤ إلى الثانية ٦ لأن السرعة تتناقص حتى تقف.","- وصف الحركة: تتسارع السيارة بانتظام ٥ م/ث² في الثواني الأربع الأولى حتى ٢٠ م/ث، ثم تتباطأ حتى تتوقف عند الثانية ٦.","# متى تتزايد السرعة؟","- تتزايد السرعة عند الضغط على دواسة البنزين في السيارة المتحركة.","- تتزايد السرعة عند سقوط جسم من قمة برج نحو الأرض.","- تتزايد سرعة عدّاء في بداية سباق المئة متر عندما ينطلق من السكون.","- تتناقص السرعة عند تدحرج كرة على أرض الغرفة ثم توقفها.","! إذا ازدادت السرعة فالتسارع موجب، وإذا نقصت (تباطؤ) فالتسارع سالب."],"q":["- عرّف التسارع واكتب قانونه ووحدته.","- في نشاط إياد: ما تسارع السيارة؟ وكيف عرفنا أنه ثابت؟","- سيارة سرعتها ٢ م/ث صارت ١٤ م/ث خلال ٤ ثوانٍ. ما تسارعها؟","- ما الفترة التي كان فيها السائق يضغط الفرامل في جدول نور؟ ولماذا؟","- اذكر حالتين تتزايد فيهما السرعة وحالة تتناقص فيها."],"quiz":[{"l":0,"k":"n","q":"ما تعريف التسارع؟","o":["النسبة بين التغيّر في السرعة والتغيّر في الزمن","حاصل ضرب السرعة في الزمن","المسافة المقطوعة في ثانية واحدة","النسبة بين الإزاحة والزمن"],"a":0},{"l":0,"k":"n","q":"ما وحدة قياس التسارع؟","o":["م/ث","نيوتن","كغم","م/ث²"],"a":3},{"l":0,"k":"n","q":"أيّ العلاقات الآتية تمثّل التسارع؟","o":["ت = ع × ز","ت = ع٢ + ع١","ت = (ع٢ − ع١) ÷ Δز","ت = Δز ÷ Δع"],"a":2},{"l":0,"k":"n","q":"ماذا يمثّل الرمز Δز في قانون التسارع؟","o":["السرعة النهائية","الفترة الزمنية التي حدث خلالها التغيّر في السرعة","السرعة الابتدائية","التسارع نفسه"],"a":1},{"l":0,"k":"n","q":"في نشاط رحل /ث في ٤ ث، والسيارة (ب) من صفر إلى ٢٤ م/ث في ٨ ث. أيّهما تسارعها أكبر؟","o":["(ب) لأن سرعتها النهائية أكبر","متساويان","(أ) لأن تسارعها ٥ م/ث² وتسارع (ب) ٣ م/ث²","لا يمكن المقارنة"],"a":2},{"l":2,"k":"p","q":"تدحرجت كرة بسرعة ٥ م/ث على سطح مائل بتسارع ٣ م/ث². ما سرعتها بعد ٤ ثوانٍ؟","o":["١٢ م/ث","١٧ م/ث","٢٠ م/ث","٧ م/ث"],"a":1},{"l":2,"k":"p","q":"في نشاط إياد زادت السرعة ٣ م/ث كل ثانية. كم يبلغ التغيّر في السرعة خلال ٤ ثوانٍ؟","o":["٣ م/ث","١٢ م/ث","٧ م/ث","٤ م/ث"],"a":1},{"l":2,"k":"p","q":"في جدول نور كانت السرعة بعد ٥ ثوانٍ ١٠ م/ث. كم تساوي بوحدة كم/س؟","o":["٣٦ كم/س","٠ كم/س","٧٢ كم/س","١٨ كم/س"],"a":0},{"l":2,"k":"p","q":"عدّاء بدأ من السكون وبعد ٢ ث صارت سرعته ٨ م/ث وبعد ٤ ث صارت ١٦ م/ث. ماذا نستنتج؟","o":["تسارعه ثابت ويساوي ٨ م/ث²","تسارعه ثابت ويساوي ١٦ م/ث²","تسارعه غير ثابت","تسارعه ثابت ويساوي ٤ م/ث²"],"a":3},{"l":2,"k":"p","q":"ماذا يعني أن التسارع ثابت ومقداره ٣ م/ث²؟","o":["أن السرعة ثابتة دائماً ٣ م/ث","أن المسافة ٣ م كل ثانية","أن السرعة تزداد ٣ م/ث في كل ثانية","أن الزمن ٣ ثوانٍ"],"a":2}],"hints":{"زادت سرعة سيارة من ٢ م/ث إلى ١٤ م/ث خلال ٣ ثوانٍ. ما تسارعها؟":"اطرح السرعة الابتدائية من النهائية ثم اقسم على الزمن.","ما تسارع سيارة نور خلال الثانيتين الأوليتين (من ٠ إلى ١٠ م/ث)؟":"التغيّر في السرعة ١٠ م/ث خلال ثانيتين.","سيارة تحركت من السكون بتسارع ٢ م/ث². ما سرعتها بعد ٩ ثوانٍ؟":"التغيّر في السرعة = ت × Δز.","السيارة (أ) زادت سرعتها من صفر إلى ٢٠ م/ث في ٤ ث، والسيارة (ب) من صفر إلى ٢٤ م/ث في ٨ ث. أيّهما تسارعها أكبر؟":"احسب تسارع كلٍّ منهما ثم قارن بين القيمتين."}},{"t":"الذائبية","e":["# نشاط ١: ذائبية المواد","نضع ١٠٠ غم ماء مقطّر في كأس، ونضيف تدريجياً كميات قليلة من ملح الطعام مع التحريك المستمر حتى يصبح المحلول غير قادر على إذابة المزيد ويبدأ ترسّب بلورات الملح. نرشّح المحلول لفصل البلورات غير الذائبة، ثم نزن المحلول الناتج ونحسب كتلة الملح الذائبة. نكرّر الخطوات نفسها باستعمال السكر.","- تفاوت المواد: تتفاوت المواد في درجة ذوبانها في الكمية نفسها من الماء وعند درجة الحرارة نفسها؛ فكمية سكر المائدة الذائبة أكبر من كمية ملح الطعام عند الظروف نفسها.","- أهمية الإضافة التدريجية: نضيف المذاب قليلاً قليلاً لنعرف بدقّة اللحظة التي يبدأ عندها الترسّب.","- أهمية استمرار التحريك: يسرّع الذوبان فنتأكّد أنّ ما بقي من بلورات هو ما عجز الماء عن إذابته فعلاً.","# مفهوم الذائبية","لكلّ مذيب قدرة محدّدة على إذابة كمية من المذاب عند درجة حرارة معيّنة.","- الذائبية: أكبر كتلة من المذاب تذوب في ١٠٠ غم ماء عند درجة حرارة معيّنة.","- وحدة الذائبية: غم/١٠٠ غم ماء.","- المحلول المشبع: المحلول الذي بلغ حدّ الإشباع، فلا يستطيع إذابة المزيد من المذاب عند درجة الحرارة المعيّنة ويبدأ المذاب بالترسّب.","- المحلول غير المشبع: المحلول الذي يسمح بإذابة كميات إضافية من المذاب دون أن تترسّب.","- المحلول فوق المشبع: محلول زادت كمية المذاب فيه عن حدّ الإشباع، يُحضَّر برفع درجة حرارة المحلول ثم تبريده تدريجياً دون تحريك.","! ننتقل من المشبع إلى فوق المشبع هكذا: نضيف مزيداً من المذاب مع رفع الحرارة ليذوب، ثم نبرّد المحلول ببطء ودون تحريك.","# قانون الذائبية","إذا عرفنا كتلة المذاب التي ذابت في كتلة معيّنة من الماء حتى الإشباع فنحسب الذائبية بقاعدة النسبة والتناسب، أي بحساب كتلة المذاب التي تذوب في ١٠٠ غم ماء.","! الذائبية (غم/١٠٠ غم ماء) = كتلة المذاب (غم) × ١٠٠ ÷ كتلة المذيب (غم).","|المطلوب|القانون","|الذائبية|كتلة المذاب × ١٠٠ ÷ كتلة الماء","|كتلة المذاب اللازمة للإشباع|الذائبية × كتلة الماء ÷ ١٠٠","# أمثلة محلولة","? حُضّر محلول مشبع من ملح نترات الفضّة بإذابة ٥٫٥ غم من هذا الملح في ٢٥ غم ماء عند درجة حرارة ٢٥ °س. احسب ذائبية هذا الملح في الماء. || ٥٫٥ غم تذوب في ٢٥ غم ماء، وس غم تذوب في ١٠٠ غم ماء. الذائبية = ٥٫٥ × ١٠٠ ÷ ٢٥ = ٥٥٠ ÷ ٢٥ = ٢٢ غم/١٠٠ غم ماء.","? ذائبية كلوريد البوتاسيوم ٣٥ غم/١٠٠ غم ماء عند ٣٠ °س. احسب كتلة الملح اللازمة لتحضير محلول مشبع مذاب في ٥٠٠ غم ماء. || ٣٥ غم تذوب في ١٠٠ غم ماء، وس غم تذوب في ٥٠٠ غم ماء. س = ٣٥ × ٥٠٠ ÷ ١٠٠ = ١٧٥ غم.","? احسب كتلة ملح الطعام اللازم إذابتها في ٥٠ غم ماء لتحضير محلول مشبع ذائبيته ١٠ غم/١٠٠ غم ماء. || الكتلة = ١٠ × ٥٠ ÷ ١٠٠ = ٥ غم.","? أُذيب ٨ غم من ملحٍ في ٢٥ غم ماء حتى الإشباع. ما ذائبية الملح؟ || الذائبية = ٨ × ١٠٠ ÷ ٢٥ = ٨٠٠ ÷ ٢٥ = ٣٢ غم/١٠٠ غم ماء.","? أُذيب ١٤ غم من ملحٍ في ٤٠ غم ماء حتى الإشباع. ما ذائبيته؟ || الذائبية = ١٤ × ١٠٠ ÷ ٤٠ = ١٤٠٠ ÷ ٤٠ = ٣٥ غم/١٠٠ غم ماء.","# قراءة جدول الذائبية وتصنيف المحلول","نأخذ ملحاً ذائبيته ٣٥ غم/١٠٠ غم ماء عند ٣٠ °س. الجدول يبيّن كتلة الملح اللازمة لتشبّع كميات مختلفة من الماء عند هذه الدرجة:","|كتلة الماء (غم)|كتلة الملح اللازمة للإشباع (غم)","|٥٠|١٧٫٥","|١٠٠|٣٥","|٢٠٠|٧٠","|٣٠٠|١٠٥","|٥٠٠|١٧٥","نلاحظ أنّ كتلة الملح اللازمة تتناسب طردياً مع كتلة الماء: كلما تضاعفت كتلة الماء تضاعفت كتلة الملح اللازمة للإشباع.","? ملح ذائبيته ٣٥ غم/١٠٠ غم ماء عند ٣٠ °س. صنّف المحلول إذا أُذيب ٢٠ غم منه في ١٠٠ غم ماء، ثم ٣٥ غم، ثم أُضيف ٤٥ غم. || ٢٠ غم أقلّ من ٣٥ فالمحلول غير مشبع ويقبل المزيد. ٣٥ غم يساوي الذائبية فالمحلول مشبع. وعند إضافة ٤٥ غم يذوب ٣٥ غم فقط ويبقى ١٠ غم دون ذوبان ترسب في القاع.","? ملحان عند الظروف نفسها: ذائبية الأول ٣٥ وذائبية الثاني ٢٢ غم/١٠٠ غم ماء. أيّهما أكبر ذائبية وبكم تزيد كتلته الذائبة في ١٠٠ غم ماء؟ || الأول أكبر ذائبية؛ ويذوب منه ٣٥ − ٢٢ = ١٣ غم أكثر في ١٠٠ غم ماء.","? ذائبية ملح ٣٥ غم/١٠٠ غم ماء. كم غراماً من الماء يلزم لإذابة ٧٠ غم منه حتى الإشباع؟ || ٣٥ غم تحتاج ١٠٠ غم ماء، فـ ٧٠ غم (الضعف) تحتاج ٢٠٠ غم ماء.","# تطبيقات حياتية","- يُستعمل محلول ملح الطعام في تخليل الخضار (الفقّوس).","- نحضّر المشروبات الحلوة بإذابة السكر في الماء، وسكر المائدة أكثر ذائبيةً من ملح الطعام.","- يمكن تحضير محلول فوق مشبع من الملح برفع الحرارة وزيادة المذاب ثم التبريد ببطء دون تحريك.","? قال رامي: عند تسخين محلول ملح الطعام يتبخّر كلّياً، وقال سامي: الماء يتبخّر ويبقى الملح في الوعاء. ما رأيك؟ || سامي على صواب؛ فالمذيب (الماء) يتبخّر والمذاب (الملح) صلب يبقى في الوعاء."],"q":["- ما المقصود بذائبية مادة؟ وما وحدتها؟","- ما الفرق بين المحلول المشبع وغير المشبع وفوق المشبع؟","- كيف تحضّر محلولاً فوق مشبع؟","- ذائبية كلوريد البوتاسيوم ٣٥ غم/١٠٠ غم ماء عند ٣٠ °س. احسب كتلته اللازمة لتحضير محلول مشبع في ٢٠٠ غم ماء.","- لماذا نضيف المذاب تدريجياً ونحرّك باستمرار عند تعيين الذائبية؟"],"quiz":[{"l":0,"k":"n","q":"الذائبية هي:","o":["أكبر كتلة من المذاب تذوب في ١٠٠ غم ماء عند درجة حرارة معيّنة","كتلة المذاب في لتر م
