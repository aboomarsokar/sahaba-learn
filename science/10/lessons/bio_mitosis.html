<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دورة الخلية والانقسام</title>
<base href="../"><script src="lib/bg.js"></script><script src="lib/icons.js"></script>
<style>
@font-face{font-family:"PCB Naskh";font-style:normal;font-weight:400 700;font-display:swap;src:url("fonts/naskh-arabic.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"PCB Naskh";font-style:normal;font-weight:400 700;font-display:swap;src:url("fonts/naskh-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#2A2016;--muted:#5C4B38;--bg:#EFE3CC;--card:#FBF5E8;--accent:#1565C0;--accent-ink:#fff;--soft:#E6D3AE;--line:#C9B28C;--ok:#2E7D32;--bad:#D32F2F;--r:18px;--edge:rgba(0,0,0,.28);--sh:rgba(20,40,30,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F6EEE2;--muted:#E6D3B8;--bg:#5A4636;--card:#6A5442;--soft:#7A624C;--line:#8A7058;--ok:#66BB6A;--bad:#EF5350;--accent-ink:#0b1f17;--edge:rgba(0,0,0,.5);--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--ink:#F6EEE2;--muted:#E6D3B8;--bg:#5A4636;--card:#6A5442;--soft:#7A624C;--line:#8A7058;--ok:#66BB6A;--bad:#EF5350;--accent-ink:#0b1f17;--edge:rgba(0,0,0,.5);--sh:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:"PCB Naskh","Noto Naskh Arabic","Amiri",system-ui,sans-serif;font-weight:600;font-size:18px;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
body[data-topic]{--accent:var(--acc-raw);--soft:color-mix(in srgb,var(--acc-raw) 14%,var(--card));--line:color-mix(in srgb,var(--acc-raw) 30%,var(--card));background:linear-gradient(180deg,var(--soft),var(--bg) 340px)}
:root[data-theme="dark"] body[data-topic]{--accent:color-mix(in srgb,var(--acc-raw) 58%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-topic]{--accent:color-mix(in srgb,var(--acc-raw) 58%,#fff)}}
header{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:800;min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html,body{max-width:100%;overflow-x:hidden}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:12px 12px 24px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;transition:transform .15s,background .2s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn-ghost{background:transparent}
.hidden{display:none!important}
.hint{color:var(--muted);margin:4px 0 14px}
.sp{width:8px;display:inline-block}

/* clouds */
.sky{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:6px}
@media (min-width:640px){.sky{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
.cloud{position:relative;border:0;background:none;padding:0 0 4% 0;border-radius:0;aspect-ratio:300/180;background-size:100% 100%;background-repeat:no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#1f2a33;font-weight:800;font-size:17px;line-height:1.3}
.cloud:hover{transform:translateY(-3px)}
.cloud .ico{font-size:26px;margin-bottom:2px}
.cloud .nm{padding:0 14%;margin-top:8px;white-space:normal;min-width:0}
.cloud small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:0;padding-bottom:6%}
.cloud.done::after{content:"✓";position:absolute;top:10%;left:14%;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ok);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.cloud.leaving{opacity:0;transform:scale(.92);transition:opacity .75s,transform .75s}

.c4{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 180%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 gradientUnits=%22userSpaceOnUse%22 x1=%220%22 y1=%2240%22 x2=%220%22 y2=%22165%22%3E%3Cstop offset=%220%22 stop-color=%22%23cfe6fb%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%238cc4ee%22/%3E%3Cstop offset=%221%22 stop-color=%22%233f7fb8%22/%3E%3C/linearGradient%3E%3Cfilter id=%22s%22 x=%22-10%25%22 y=%22-20%25%22 width=%22120%25%22 height=%22150%25%22%3E%3CfeGaussianBlur stdDeviation=%221.6%22/%3E%3C/filter%3E%3C/defs%3E%3Cg filter=%22url%28%23s%29%22 fill=%22url%28%23g%29%22%3E%3Ccircle cx=%2266%22 cy=%22120%22 r=%2232%22/%3E%3Ccircle cx=%22108%22 cy=%2294%22 r=%2244%22/%3E%3Ccircle cx=%22164%22 cy=%2274%22 r=%2254%22/%3E%3Ccircle cx=%22222%22 cy=%2296%22 r=%2244%22/%3E%3Ccircle cx=%22256%22 cy=%22120%22 r=%2228%22/%3E%3Crect x=%2244%22 y=%22110%22 width=%22228%22 height=%2246%22 rx=%2223%22/%3E%3C/g%3E%3Cellipse cx=%22150%22 cy=%2262%22 rx=%2258%22 ry=%2214%22 fill=%22%23fff%22 opacity=%22.55%22/%3E%3C/svg%3E")}.c5{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 180%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 gradientUnits=%22userSpaceOnUse%22 x1=%220%22 y1=%2240%22 x2=%220%22 y2=%22165%22%3E%3Cstop offset=%220%22 stop-color=%22%23e6d6fb%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%23b493e8%22/%3E%3Cstop offset=%221%22 stop-color=%22%237452b8%22/%3E%3C/linearGradient%3E%3Cfilter id=%22s%22 x=%22-10%25%22 y=%22-20%25%22 width=%22120%25%22 height=%22150%25%22%3E%3CfeGaussianBlur stdDeviation=%221.6%22/%3E%3C/filter%3E%3C/defs%3E%3Cg filter=%22url%28%23s%29%22 fill=%22url%28%23g%29%22%3E%3Ccircle cx=%2266%22 cy=%22120%22 r=%2232%22/%3E%3Ccircle cx=%22108%22 cy=%2294%22 r=%2244%22/%3E%3Ccircle cx=%22164%22 cy=%2274%22 r=%2254%22/%3E%3Ccircle cx=%22222%22 cy=%2296%22 r=%2244%22/%3E%3Ccircle cx=%22256%22 cy=%22120%22 r=%2228%22/%3E%3Crect x=%2244%22 y=%22110%22 width=%22228%22 height=%2246%22 rx=%2223%22/%3E%3C/g%3E%3Cellipse cx=%22150%22 cy=%2262%22 rx=%2258%22 ry=%2214%22 fill=%22%23fff%22 opacity=%22.55%22/%3E%3C/svg%3E")}.c6{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 180%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 gradientUnits=%22userSpaceOnUse%22 x1=%220%22 y1=%2240%22 x2=%220%22 y2=%22165%22%3E%3Cstop offset=%220%22 stop-color=%22%23c9f3ef%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%2379d3c8%22/%3E%3Cstop offset=%221%22 stop-color=%22%233b9d92%22/%3E%3C/linearGradient%3E%3Cfilter id=%22s%22 x=%22-10%25%22 y=%22-20%25%22 width=%22120%25%22 height=%22150%25%22%3E%3CfeGaussianBlur stdDeviation=%221.6%22/%3E%3C/filter%3E%3C/defs%3E%3Cg filter=%22url%28%23s%29%22 fill=%22url%28%23g%29%22%3E%3Ccircle cx=%2266%22 cy=%22120%22 r=%2232%22/%3E%3Ccircle cx=%22108%22 cy=%2294%22 r=%2244%22/%3E%3Ccircle cx=%22164%22 cy=%2274%22 r=%2254%22/%3E%3Ccircle cx=%22222%22 cy=%2296%22 r=%2244%22/%3E%3Ccircle cx=%22256%22 cy=%22120%22 r=%2228%22/%3E%3Crect x=%2244%22 y=%22110%22 width=%22228%22 height=%2246%22 rx=%2223%22/%3E%3C/g%3E%3Cellipse cx=%22150%22 cy=%2262%22 rx=%2258%22 ry=%2214%22 fill=%22%23fff%22 opacity=%22.55%22/%3E%3C/svg%3E")}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 8px;font-size:22px;color:var(--accent)}
.card h3{margin:0 0 4px;font-size:18px;color:var(--accent)}
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s ease}
.blk p{margin:0}
.blk .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.speak{flex:none;padding:6px 10px;font-size:15px}
.opts{display:grid;gap:10px;margin:12px 0}
.opts button{text-align:right;font-size:17px}
.opts button.ok{background:color-mix(in srgb,var(--ok) 20%,var(--card));border-color:var(--ok)}
.opts button.bad{background:color-mix(in srgb,var(--bad) 18%,var(--card));border-color:var(--bad)}
.fb{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--soft);font-weight:500}
.figs{display:grid;gap:14px;grid-template-columns:1fr;margin:14px 0}
@media (min-width:640px){.figs.two{grid-template-columns:1fr 1fr}}
figure{margin:0;background:#fff;border-radius:14px;padding:10px;border:1px solid var(--line)}
figure img{width:100%;height:auto;display:block;border-radius:8px}
figcaption{color:var(--muted);font-size:15px;text-align:center;margin-top:6px}
.act-items{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.act-items button.used{opacity:.4}
.picked{margin:8px 0;color:var(--muted)}
.cls{display:grid;gap:10px;margin:10px 0}
.cls .it{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 12px}
.cls .it .bks{display:flex;gap:6px;flex-wrap:wrap}
.cls .bks button{padding:6px 12px;font-size:15px}
.cls .bks button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cls .it.good{outline:2px solid var(--ok)}
.cls .it.wrong{outline:2px solid var(--bad)}
.think textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.think .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nextrow{display:flex;justify-content:center;margin:18px 0 6px}
.score{font-size:20px;font-weight:800;text-align:center;margin:10px 0}
footer{text-align:center;color:var(--muted);font-size:14px;padding:16px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ================= مظهر ثلاثي الأبعاد ================= */
.scene{perspective:900px;perspective-origin:50% 40%}
button{box-shadow:0 4px 0 var(--edge),0 8px 14px -6px var(--sh);transform:translateY(0);transition:transform .12s,box-shadow .12s,background .2s;font-weight:700}
button:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--edge),0 12px 18px -6px var(--sh)}
button:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge),0 2px 4px var(--sh)}
button:disabled{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn-ghost{box-shadow:0 3px 0 var(--edge)}
.btn-main{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 82%,#000))}
.opts button{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 70%,#fff),var(--card))}
.card{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 6px 0 -1px var(--edge),0 16px 26px -12px var(--sh);border-radius:var(--r);transform-style:preserve-3d}
.rv{opacity:0;transform:perspective(900px) rotateX(-14deg) translateY(28px) translateZ(-60px);transform-origin:50% 100%}
.rv.in{opacity:1;transform:none;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
figure{box-shadow:0 8px 0 -2px var(--edge),0 18px 28px -10px var(--sh);transition:transform .25s;transform-style:preserve-3d}
figure:hover{transform:perspective(800px) rotateX(3deg) rotateY(-4deg) translateZ(10px)}
.sky{perspective:1000px;gap:18px}
.cloud{transform-style:preserve-3d;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);transition:transform .18s ease-out,filter .2s;filter:drop-shadow(0 14px 10px var(--sh));will-change:transform;box-shadow:none!important}
.cloud:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.04)}
.cloud:active{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(2px) scale(.98);box-shadow:none}
.cloud .ico,.cloud .nm,.cloud small{transform:translateZ(34px);text-shadow:0 2px 0 rgba(255,255,255,.35)}
.cloud .ico{font-size:30px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.cloud.leaving{opacity:0;transform:perspective(700px) translateZ(120px) scale(1.4);transition:opacity .75s,transform .75s}
/* حلزون DNA ثلاثي الأبعاد */
.hx{height:250px;margin:2px auto 6px;display:block;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.hx:active{cursor:grabbing}.hx canvas{width:100%;height:100%;display:block}
.hx3{position:relative;width:150px;height:200px;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(0deg)}
.rg{position:absolute;left:0;top:0;width:150px;height:14px;transform-style:preserve-3d}
.rg i{position:absolute;top:0;height:14px;width:14px;border-radius:50%;margin-top:0;background:radial-gradient(circle at 32% 28%,#fff 0 12%,var(--c) 36%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 3px 5px rgba(0,0,0,.35)}
.rg i:nth-of-type(1){left:0}.rg i:nth-of-type(2){right:0}
.rg b{position:absolute;left:12px;right:12px;top:5px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--c),var(--d));box-shadow:0 1px 2px rgba(0,0,0,.3)}
.hxn{text-align:center;color:var(--muted);font-size:14px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.rv,.rv.in{transform:none!important;transition:none!important}.cloud{transition:none}}


.fig-step h3{color:var(--accent);margin:0 0 10px;font-size:19px}
.figimg{width:100%;height:auto;border-radius:10px;background:#fff;display:block;margin-bottom:10px;border:1px solid var(--line)}
.legend{margin-top:12px;background:var(--soft);border-radius:12px;padding:10px 14px}
.legend b{display:block;margin-bottom:4px}
.legend ul{list-style:none;margin:0;padding:0}
.legend li{margin:6px 0;display:flex;gap:8px;align-items:flex-start}
.dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:9px;border:1px solid rgba(0,0,0,.2)}
canvas.scene{width:100%;height:320px;display:block;touch-action:none;cursor:grab;border-radius:8px;background:#fbfcfe}
.figs figure.wide{grid-column:1/-1}
@media (max-width:480px){canvas.scene{height:280px}}

/* ===== القرص التفاعلي ===== */
.discw{max-width:460px;margin:6px auto 0;padding:4px}.disc{width:100%;height:auto;display:block;color:var(--ink)}
.disc .ring{transform-origin:200px 200px;animation:dspin 60s linear infinite}@keyframes dspin{to{transform:rotate(360deg)}}
.disc .sec{cursor:pointer;transform-box:view-box;transform-origin:200px 200px;transition:transform .25s ease,filter .25s ease,opacity .6s;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));outline:none;animation:dpop .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes dpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.disc .sec:hover,.disc .sec:focus-visible{transform:scale(1.05);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35)) brightness(1.06)}
.disc .sec.leaving{opacity:0;transform:scale(1.25)}

let muted = false; // tick sound only
function visibleText(){
  const sec = ['home','pscreen','app','quiz'].map(id => document.getElementById(id)).find(s => !s.classList.contains('hidden'));
  if (!sec) return [];
  const out = [];
  sec.querySelectorAll('h2,h3,p,.hint,.fb,.picked,.score,.opts button,.cloud .nm,.cloud small').forEach(n => {
    if (n.closest('.hidden') || n.offsetParent === null) return;
    const t = (n.textContent || '').replace(/\s+/g, ' ').trim();
    if (t && !out.includes(t)) out.push(t);
  });
  return out;
}
let AC = null;
function tick(){
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(1600, t); o.frequency.exponentialRampToValueAtTime(700, t + 0.06);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.07);
  } catch (e) {}
}

/* ---------- labelled 3D scenes (canvas, depth-sorted, drag to rotate) ---------- */
const COL = {A:'#3fae5a', T:'#e25a5a', G:'#8a5cc7', C:'#e0962e'};
const COMP = {A:'T', T:'A', G:'C', C:'G'};
const SEQ = 'ATGCCGTAGCTAGGCATC';
function hexRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function mixc(c, to, k){ const a=hexRgb(c); const b = to==='w' ? [255,255,255] : [0,0,0];
  return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')+')'; }
const __mixc=mixc,_mcache={}; mixc=function(c,to,k){const key=c+'|'+to+'|'+k;return _mcache[key]||(_mcache[key]=__mixc(c,to,k))};
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function proj(p, yaw, pitch, cx, cy, S){
  const cyw=Math.cos(yaw), syw=Math.sin(yaw);
  const x1 = p[0]*cyw + p[2]*syw, z1 = -p[0]*syw + p[2]*cyw;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const y1 = p[1]*cp - z1*sp, z2 = p[1]*sp + z1*cp;
  const f = 6/(6 - z2);
  return {x: cx + x1*S*f, y: cy - y1*S*f, z: z2, f};
}
const L = (a,b,w,c) => ({t:'l',a,b,w,c});
const SP = (p,r,c) => ({t:'s',p,r,c});
const DS = (a,b,c) => ({t:'d',a,b,c});

/* DNA helix; withMut adds the G->A substitution toggle */
function buildDNA(withMut){
  return function(st){
    const items=[], labels=[]; const N=12, SUB=4, turn=2*Math.PI/10, rise=0.42, R=1.0;
    const A=[], B=[];
    for(let k=0;k<=N*SUB;k++){ const t=k/SUB, th=t*turn, y=(t-N/2)*rise;
      A.push([R*Math.cos(th), y, R*Math.sin(th)]); B.push([R*Math.cos(th+Math.PI), y, R*Math.sin(th+Math.PI)]); }
    for(let k=0;k<A.length-1;k++){ items.push(L(A[k],A[k+1],0.13,'#5b8fd6')); items.push(L(B[k],B[k+1],0.13,'#7aa7e8')); }
    for(let k=0;k<=N;k++){ items.push(SP(A[k*SUB],0.1,'#f2a33c')); items.push(SP(B[k*SUB],0.1,'#f2a33c')); }
    const mutOn = withMut && st.mut;
    for(let k=0;k<N;k++){
      let b1 = SEQ[k % SEQ.length];
      if (k===7 && withMut) b1 = mutOn ? 'A' : 'G';
      const b2 = COMP[b1]; const i=k*SUB, th=k*turn;
      const mid=[0, A[i][1], 0];
      items.push(L(A[i], mid, 0.09, COL[b1]));
      items.push(L(mid, B[i], 0.09, COL[b2]));
      const n = (b1==='A'||b1==='T') ? 2 : 3;
      for(let j=0;j<n;j++){ const dy=(j-(n-1)/2)*0.07;
        items.push(DS([0.2*Math.cos(th), A[i][1]+dy, 0.2*Math.sin(th)], [-0.2*Math.cos(th), A[i][1]+dy, -0.2*Math.sin(th)], '#444')); }
      if (k===7 && withMut && mutOn) items.push(SP(mid, 0.2, '#ff4d4d'));
    }
    const mk = (k)=>{ const th=k*turn; return [0.5*Math.cos(th), A[k*SUB][1], 0.5*Math.sin(th)]; };
    labels.push({p:A[6*SUB], t:'الهيكل: الفوسفات والسكر', c:'#2f6fb0'});
    labels.push({p:mk(9), t:'القواعد النيتروجينية', c:'#8a5cc7'});
    const th5=5*turn; labels.push({p:[0.2*Math.cos(th5), A[5*SUB][1], 0.2*Math.sin(th5)], t:'روابط هيدروجينية', c:'#444'});
    labels.push({p:A[0], t:'الطرف 5′', c:'#2f6fb0'});
    labels.push({p:A[N*SUB], t:'الطرف 3′', c:'#2f6fb0'});
    if (withMut) { const p7=[0,A[7*SUB][1],0];
      labels.push({p:p7, t: mutOn ? 'بعد الطفرة: استبدال G بـ A' : 'قبل الطفرة: الزوج G–C', c:'#ff4d4d'}); }
    return {items, labels};
  };
}

/* nucleosome: histone octamer + DNA wrapped 1.65 turns */
function buildNuc(st){
  const items=[], labels=[];
  for(let q=0;q<2;q++) for(let j=0;j<4;j++){
    const a=j*Math.PI/2 + q*Math.PI/4, y=q?-0.22:0.22;
    items.push(SP([0.55*Math.cos(a), y, 0.55*Math.sin(a)], 0.33, q?'#7a6fd0':'#8c7fd9'));
  }
  const S=220, turns=1.65, dna=[];
  for(let s=0;s<=S;s++){ const ph=s/S*turns*2*Math.PI; dna.push([1.25*Math.cos(ph), (s/S-0.5)*0.9, 1.25*Math.sin(ph)]); }
  for(let s=0;s<S;s++) items.push(L(dna[s], dna[s+1], 0.09, '#3b82c4'));
  const end=dna[S]; items.push(L(end, [1.9, end[1]+0.3, 0.6], 0.09, '#3b82c4'));
  const H1=[1.6,0.5,0.0]; items.push(SP(H1, 0.2, '#d4a84b'));
  labels.push({p:dna[60], t:'DNA ملتف حول الهستون', c:'#3b82c4'});
  labels.push({p:[0.55,0.55,0], t:'بروتين الهستون (ثمانية)', c:'#7a6fd0'});
  labels.push({p:H1, t:'بروتين رابط H1', c:'#b07d1f'});
  labels.push({p:end, t:'DNA رابط بين النيوكليوسومات', c:'#3b82c4'});
  labels.push({p:[0.55,-0.55,0], t:'النيوكليوسوم: وحدة التكدّس', c:'#5b4fb8'});
  return {items, labels};
}

/* nucleotide with labelled phosphate, sugar, base */
function buildNucl(st){
  const items=[], labels=[];
  const P=[-2.0,0.6,0], O5=[-1.45,0.45,0], C5=[-1.05,0.3,0];
  const ring=[]; const angs=[90,18,-54,-126,162]; const zs=[0.0,0.15,-0.1,0.2,-0.15];
  angs.forEach((a,i)=>ring.push([0.75*Math.cos(a*Math.PI/180), 0.75*Math.sin(a*Math.PI/180), zs[i]]));
  // ring order: O4' (0), C1' (1), C2' (2), C3' (3), C4' (4)
  for(let i=0;i<5;i++) items.push(L(ring[i], ring[(i+1)%5], 0.1, '#8a8f99'));
  items.push(L(ring[4], C5, 0.1, '#8a8f99'));
  items.push(L(C5, O5, 0.1, '#8a8f99'));
  items.push(L(O5, P, 0.1, '#8a8f99'));
  // phosphate group
  [[0.35,0.35,0.25],[0.35,-0.35,0.25],[-0.35,0.35,-0.25],[-0.35,-0.35,-0.25]].forEach(d=>{
    const q=[P[0]+d[0], P[1]+d[1], P[2]+d[2]]; items.push(L(P,q,0.08,'#999')); items.push(SP(q,0.2,'#e25a5a')); });
  items.push(SP(P,0.3,'#f2a33c'));
  items.push(SP(O5,0.16,'#e25a5a')); items.push(SP(C5,0.15,'#8a8f99'));
  ring.forEach((r,i)=>items.push(SP(r, i===0?0.2:0.16, i===0?'#e25a5a':'#8a8f99')));
  // H on C2' (DNA: no hydroxyl)
  const c2=ring[2], H=[c2[0]+0.3, c2[1]-0.35, c2[2]+0.3];
  items.push(L(c2,H,0.07,'#999')); items.push(SP(H,0.1,'#f4f4f4'));
  // base attached to C1'
  const c1=ring[1], N1=[c1[0]+0.6, c1[1], c1[2]];
  items.push(L(c1,N1,0.1,'#8a8f99')); items.push(SP(N1,0.15,'#3a6fd8'));
  const hc=[N1[0]+0.6, N1[1], 0]; const hv=[];
  for(let k=0;k<6;k++){ const a=(180+60*k)*Math.PI/180; hv.push([hc[0]+0.55*Math.cos(a), hc[1]+0.55*Math.sin(a), 0]); }
  for(let k=0;k<6;k++){ items.push(L(hv[k],hv[(k+1)%6],0.1,'#8a8f99')); items.push(SP(hv[k],0.14,k%2?'#8a8f99':'#3a6fd8')); }
  items.push(L(N1,hv[0],0.1,'#8a8f99'));
  labels.push({p:P, t:'مجموعة الفوسفات', c:'#b8651a'});
  labels.push({p:ring[0], t:'السكر الخماسي', c:'#555'});
  labels.push({p:H, t:'H: منقوص الأكسجين (DNA)', c:'#444'});
  labels.push({p:hc, t:'القاعدة النيتروجينية', c:'#3a6fd8'});
  labels.push({p:N1, t:'الرابطة عند الكربون 1′', c:'#2f6fb0'});
  return {items, labels};
}

/* replication fork: helicase, polymerase, ligase, parental and new strands */
function buildFork(st){
  const items=[], labels=[];
  const xs=[]; for(let x=-3;x<=3.001;x+=0.12) xs.push(+x.toFixed(2));
  const sm=(t)=>t<=0?0:t>=1?1:t*t*(3-2*t);
  const helix = (x,off)=>{ const th = x*(2*Math.PI/1.4)+off; return [x, 0.8*Math.cos(th), 0.8*Math.sin(th)]; };
  const pathP1=[], pathP2=[], pathN1=[], pathN2=[];
  xs.forEach(x=>{
    const t = sm((x+0.8)/1.6);
    const h1=helix(x,0), h2=helix(x,Math.PI);
    const tg1=[x,1.5,0], tg2=[x,-1.5,0];
    pathP1.push([x, h1[1]+(tg1[1]-h1[1])*t, h1[2]+(tg1[2]-h1[2])*t]);
    pathP2.push([x, h2[1]+(tg2[1]-h2[1])*t, h2[2]+(tg2[2]-h2[2])*t]);
    if (x>=0){ pathN1.push([x,1.5,0.9]); pathN2.push([x,-1.5,-0.9]); }
  });
  for(let i=0;i<xs.length-1;i++){
    items.push(L(pathP1[i],pathP1[i+1],0.12,'#5b8fd6'));
    items.push(L(pathP2[i],pathP2[i+1],0.12,'#5b8fd6'));
    if (xs[i] < 0){ const a=helix(xs[i],0), b=helix(xs[i],Math.PI); if (i%3===0) items.push(L(a,b,0.05,'#c2b07a')); }
  }
  for(let i=0;i<pathN1.length-1;i++){
    items.push(L(pathN1[i],pathN1[i+1],0.12,'#3fae5a'));
    items.push(L(pathN2[i],pathN2[i+1],0.12,'#3fae5a'));
  }
  for(let i=0;i<pathN1.length;i+=3){
    items.push(L(pathP1[xs.length-pathN1.length+i], pathN1[i], 0.05, '#c2b07a'));
    items.push(L(pathP2[xs.length-pathN2.length+i], pathN2[i], 0.05, '#c2b07a'));
  }
  // helicase ring at the fork
  for(let k=0;k<6;k++){ const a=k*Math.PI/3; items.push(SP([0.05, 0.45*Math.cos(a), 0.45*Math.sin(a)], 0.2, '#f2a33c')); }
  // DNA polymerase on upper duplex
  [[1.6,1.9,0.4],[1.2,1.85,0.9],[2.0,1.8,0.85],[1.6,2.1,0.7]].forEach(p=>items.push(SP(p,0.2,'#2e9e62')));
  // DNA ligase on lower duplex
  [[2.5,-1.9,-0.6],[2.9,-1.9,-0.9],[2.7,-2.1,-0.3]].forEach(p=>items.push(SP(p,0.2,'#e3c341')));
  labels.push({p:[0.05,0,0], t:'إنزيم الهيليكيز', c:'#c76b12'});
  labels.push({p:[1.6,1.9,0.4], t:'إنزيم بلمرة DNA', c:'#2e7d4f'});
  labels.push({p:[2.7,-2.1,-0.3], t:'إنزيم الليغيز', c:'#a58a10'});
  labels.push({p:[-1.2,0.8,0], t:'السلسلة الأصلية', c:'#2f6fb0'});
  labels.push({p:[2.0,1.5,0.9], t:'السلسلة الجديدة', c:'#2e7d4f'});
  return {items, labels};
}

function buildChrom(st){
  const items=[], labels=[]; const Hh=1.6, turns=6, n=160;
  [-0.42, 0.42].forEach((cx,ci)=>{
    const P1=[], P2=[];
    for(let s=0;s<=n;s++){ const y=-Hh+2*Hh*s/n, th=s/n*turns*2*Math.PI;
      P1.push([cx+0.2*Math.cos(th), y, 0.2*Math.sin(th)]); P2.push([cx+0.2*Math.cos(th+Math.PI), y, 0.2*Math.sin(th+Math.PI)]); }
    for(let s=0;s<n;s++){ items.push(L(P1[s],P1[s+1],0.12,'#6f7fd0')); items.push(L(P2[s],P2[s+1],0.12,'#3b82c4')); }
    for(let s=0;s<=n;s+=12) items.push(SP(P1[s],0.13,'#c9a64a'));
    if (ci===0){ labels.push({p:P1[40], t:'الكروماتيد', c:'#6f7fd0'}); labels.push({p:P2[60], t:'DNA', c:'#3b82c4'}); labels.push({p:P1[84], t:'بروتين الهستون', c:'#c9a64a'}); }
  });
  items.push(SP([0,0,0],0.26,'#e0b050'));
  labels.push({p:[0,0,0], t:'السنترومير', c:'#b07d1f'});
  return {items, labels};
}

function buildRNA(st){
  const items=[], labels=[]; const N=12, SUB=4, turn=0.9, rise=0.42, RB=0.55, RR=1.05;
  const seq='AUGCUAGGCAUC', bcol={A:'#3fae5a', U:'#c46ae0', G:'#8a5cc7', C:'#e0962e'};
  const P=[], Bp=[];
  for(let k=0;k<=N*SUB;k++){ const t2=k/SUB, th=t2*turn, y=(t2-N/2)*rise;
    P.push([RB*Math.cos(th), y, RB*Math.sin(th)]); }
  for(let k=0;k<P.length-1;k++) items.push(L(P[k],P[k+1],0.14,'#2e8b6a'));
  for(let k=0;k<=N;k++){ const i=k*SUB, th=k*turn; const b=seq[k%seq.length];
    items.push(SP(P[i],0.1,'#f2a33c'));
    const bp=[RR*Math.cos(th), P[i][1], RR*Math.sin(th)];
    items.push(L(P[i],bp,0.07,'#8a8f99'));
    items.push(SP(bp,0.17,bcol[b]));
  }
  labels.push({p:P[4*SUB], t:'الهيكل السكري الفوسفاتي (ريبوز)', c:'#2e8b6a'});
  labels.push({p:[RR*Math.cos(3*turn), P[3*SUB][1], RR*Math.sin(3*turn)], t:'U يوراسيل بدل T', c:'#c46ae0'});
  labels.push({p:[RR*Math.cos(7*turn), P[7*SUB][1], RR*Math.sin(7*turn)], t:'G / C / A', c:'#3fae5a'});
  labels.push({p:P[0], t:'شريط مفرد', c:'#2e8b6a'});
  return {items, labels};
}

/* ---------- cell-division scenes: translucent bodies, animated division ---------- */
function stageText(def, i){ return def.stages[i] + ' · اضغط للمرحلة التالية ←'; }
const clamp01 = v => Math.max(0, Math.min(1, v));
const ease = v => { v = clamp01(v); return v*v*(3-2*v); };
const seg01 = (t,a,b) => ease((t-a)/(b-a));
const lerp = (a,b,k) => a + (b-a)*k;
const CHR = '#9b3fa0', CHR2 = '#c96bd0', SPN = '#b6e39a', POLE = '#f4e28a', CYTO = '#e6f5d4', MEM = '#7fb069', NUC = '#b9a2e6';
/* translucent sphere: al = alpha (drawn first, unsorted) */
const BG = (p, r, al, c) => ({t:'s', bg:true, al, p, r, c});
function chromatin(cx, cy, ph, al){
  const out = []; let prev = null;
  for (let s = 0; s <= 8; s++){
    const p = [cx-0.22+0.44*s/8, cy+0.07*Math.sin(s*1.3+ph*2.1), 0.05*Math.cos(s+ph)];
    if (prev) out.push({...L(prev, p, 0.03, CHR2), al});
    prev = p;
  }
  return out;
}
function animPhaseName(t){
  if (t < 0.2) return 'الطور البيني: تتضاعف الكروموسومات';
  if (t < 0.35) return 'الدور التمهيدي: تتكثف الكروموسومات وتتلاشى النواة';
  if (t < 0.5) return 'الدور الاستوائي: تصطف الكروموسومات في الوسط';
  if (t < 0.7) return 'الدور الانفصالي: تنفصل الكروماتيدات وتتجه إلى القطبين';
  if (t < 0.85) return 'الدور النهائي: تتكون نواتان جديدتان';
  return 'انقسام السيتوبلازم: تتكون خليتان جديدتان';
}
function chromLine(a, b, w, col){ return [L(a, b, w*1.35, '#5e2466'), L(a, b, w, col)]; }
function buildAnim(st){
  const items = [], labels = []; const t = st.t || 0;
  const cond = seg01(t, 0.2, 0.35), pole = lerp(0.3, 1.45, seg01(t, 0.2, 0.35));
  const sep = seg01(t, 0.5, 0.7), elong = seg01(t, 0.5, 0.66)*0.55, pinch = seg01(t, 0.85, 1.0);
  const envelope = 1 - seg01(t, 0.2, 0.35), newNuc = seg01(t, 0.7, 0.85);
  const spindle = seg01(t, 0.2, 0.3) * (1 - seg01(t, 0.93, 1.0));
  const R = 1.0, midR = lerp(R, 0.22, pinch);
  [-elong, elong].forEach(x => { items.push(BG([x,0,0], R*1.03, 0.1, MEM)); items.push(BG([x,0,0], R, 0.3, CYTO)); });
  items.push(BG([0,0,0], midR*1.03, 0.1, MEM)); items.push(BG([0,0,0], midR, 0.3, CYTO));
  for (let i = 0; i < 34; i++){ const u = i*0.7137, v = i*1.3291;
    items.push({...SP([0.75*Math.sin(u)*Math.cos(v), 0.6*Math.sin(v), 0.6*Math.cos(u)], 0.035, '#a9c96b'), al: 0.55}); }
  if (envelope > 0.02){ items.push(BG([0,0,0], 0.62, 0.4*envelope, NUC)); items.push(BG([0,0,0], 0.62, 0.5*envelope, '#8a6fc0')); }
  if (newNuc > 0.02){ items.push(BG([-(elong+0.55),0,0], 0.5, 0.45*newNuc, NUC)); items.push(BG([elong+0.55,0,0], 0.5, 0.45*newNuc, NUC)); }
  const PL = [-pole,0,0], PR = [pole,0,0];
  const starts = [[-0.32,0.36],[0.3,-0.3],[-0.06,-0.12]], ends = [[0,-0.6],[0,0],[0,0.6]];
  const m = seg01(t, 0.2, 0.5), ua = 1 - cond; const cen = [];
  for (let k = 0; k < 3; k++){
    const cx = lerp(starts[k][0], ends[k][0], m), cy = lerp(starts[k][1], ends[k][1], m);
    cen.push([cx, cy]);
    if (ua > 0.02){
      items.push(...chromatin(cx, cy, k, ua));
      const dup = seg01(t, 0.04, 0.14) * ua;
      if (dup > 0.02) items.push(...chromatin(cx, cy+0.1, k+5, dup));
    }
    if (cond > 0.02){
      const w = 0.04 + 0.035*cond*(1 - seg01(t, 0.75, 0.9));
      const cxA = cx - sep*1.2, cxB = cx + sep*1.2;
      items.push(...chromLine([lerp(cx-0.14,cxA,sep), cy-0.26, 0], [lerp(cx+0.14,cxA,sep), cy+0.26, 0], w, CHR));
      items.push(...chromLine([lerp(cx+0.14,cxB,sep), cy-0.26, 0], [lerp(cx-0.14,cxB,sep), cy+0.26, 0], w, CHR2));
      items.push(SP([cx, cy, 0], 0.07+0.02*cond, POLE));
    }
    if (spindle > 0.02){
      items.push({...L(PL, [cx-sep*1.2, cy, 0], 0.03, SPN), al: spindle});
      items.push({...L(PR, [cx+sep*1.2, cy, 0], 0.03, SPN), al: spindle});
    }
  }
  [PL, PR].forEach(P => { items.push(SP(P, 0.09, POLE)); items.push(L([P[0],-0.11,0], [P[0],0.11,0], 0.03, '#d8b640')); items.push(L([P[0],0,-0.11], [P[0],0,0.11], 0.03, '#d8b640')); });
  labels.push({p:[-(elong+0.75), 0.7, 0], t:'الغشاء الخلوي', c:'#5f8f4a'});
  labels.push({p:[cen[2][0], cen[2][1], 0], t:'الكروموسومات', c:CHR});
  labels.push({p:PL, t:'المريكز (القطب)', c:'#b7a53a'});
  return {items, labels};
}
function buildCycle(st){
  const items = [], labels = []; const R = 1.1, N = 16;
  const P = th => [R*Math.cos(th), 0, R*Math.sin(th)];
  [['#5b8fd6',0,0.5*Math.PI],['#3fae5a',0.5*Math.PI,Math.PI],['#e3c341',Math.PI,1.5*Math.PI],['#d46a8a',1.5*Math.PI,2*Math.PI]].forEach(([c,a0,a1]) => {
    for (let k = 0; k < N; k++){ const t0 = a0+(a1-a0)*k/N, t1 = a0+(a1-a0)*(k+1)/N; items.push(L(P(t0), P(t1), 0.15, c)); }
  });
  [0.5*Math.PI, 1.5*Math.PI, 1.92*Math.PI].forEach(th => items.push(SP(P(th), 0.14, '#c0392b')));
  labels.push({p:P(0.25*Math.PI), t:'G1', c:'#3f7fb8'});
  labels.push({p:P(0.75*Math.PI), t:'S', c:'#2f8a4a'});
  labels.push({p:P(1.25*Math.PI), t:'G2', c:'#b08a10'});
  labels.push({p:P(1.7*Math.PI), t:'M (الانقسام)', c:'#b5487a'});
  labels.push({p:P(0.5*Math.PI), t:'نقطة تحكم G1', c:'#c0392b'});
  labels.push({p:P(1.5*Math.PI), t:'نقطة تحكم G2', c:'#c0392b'});
  labels.push({p:P(1.92*Math.PI), t:'نقطة تحكم الانقسام', c:'#c0392b'});
  return {items, labels};
}
function buildInter(st){
  const items = [], labels = []; const s = st.stage|0;
  const rad = [0.66, 0.78, 0.92][s], col = ['#5b8fd6','#3fae5a','#e3c341'][s];
  items.push(BG([0,0,0], rad*1.03, 0.1, MEM));
  items.push(BG([0,0,0], rad, 0.3, col));
  const MITO = [[-0.5,0.4,0.1],[0.45,0.38,-0.1],[-0.42,-0.45,0.2],[0.5,-0.36,0.1],[0.1,0.62,0],[-0.1,-0.62,-0.1],[0.66,0.05,0],[-0.66,0.02,0.05]];
  MITO.slice(0, [4,5,7][s]).forEach(p => { items.push(L(p, [p[0]+0.14, p[1]+0.06, p[2]], 0.08, '#d9733a')); items.push(L(p, [p[0]+0.14, p[1]+0.06, p[2]], 0.03, '#f7c08a')); });
  items.push(BG([0,0,0], rad*0.55, 0.42, NUC));
  items.push(BG([0,0,0], rad*0.55, 0.5, '#8a6fc0'));
  if (s === 0) items.push(...chromatin(0, 0, 0.5, 1));
  if (s === 1){ items.push(...chromatin(-0.07, 0.05, 1, 1)); items.push(...chromatin(0.07, -0.05, 2, 1)); }
  if (s === 2){ items.push(SP([-0.25,0.18,0.25], 0.07, POLE)); items.push(SP([0.22,-0.2,0.25], 0.07, POLE)); }
  items.push(SP([0.08,-0.06,0.12], 0.12, '#7a5aa8'));
  labels.push({p:[rad*0.85, 0.15, 0.1], t:['G1: نمو الخلية','S: كروموسوم من نسختين','G2: مريكزان جاهزان'][s], c:col});
  labels.push({p:[-rad*0.5, -rad*0.5, 0.2], t:'النواة', c:'#8a6fc0'});
  labels.push({p:[0.5,-0.36,0.1], t:'الميتوكوندريا', c:'#d9733a'});
  return {items, labels};
}
function buildCyto(st){
  const items = [], labels = []; const s = st.stage|0;
  const A = [-1.0,0,0], B = [1.0,0,0], body = s === 0 ? '#f6d3c8' : '#cfe9c0';
  [A, B].forEach(p => { items.push(BG(p, 0.88, 0.12, MEM)); items.push(BG(p, 0.85, 0.3, body)); items.push(BG(p, 0.4, 0.42, NUC)); });
  if (s === 0){
    for (let k = 0; k < 18; k++){ const a = k*2*Math.PI/18; items.push(SP([0, 0.7*Math.cos(a), 0.7*Math.sin(a)], 0.07, '#d9685a')); }
    labels.push({p:[0,0.7,0], t:'حلقة التخصّر', c:'#c0392b'});
    labels.push({p:A, t:'خلية ابنة حيوانية', c:'#b5533a'});
  } else {
    for (let y = -0.8; y <= 0.81; y += 0.2) for (let z = -0.8; z <= 0.81; z += 0.2)
      if (y*y+z*z <= 0.49) items.push(SP([0, y, z], 0.1, '#8fc465'));
    for (let k = 0; k < 24; k++){ const a = k*2*Math.PI/24, b = (k+1)*2*Math.PI/24;
      items.push(L([0, 0.85*Math.cos(a), 0.85*Math.sin(a)], [0, 0.85*Math.cos(b), 0.85*Math.sin(b)], 0.06, '#6aa35a')); }
    labels.push({p:[0,0.5,0.3], t:'صفيحة خلوية من الوسط', c:'#4f8a2e'});
    labels.push({p:[0,0.85,0], t:'جدار خلوي جديد', c:'#3c7a2a'});
  }
  return {items, labels};
}
function buildTumor(st){
  const items = [], labels = []; const s = st.stage|0;
  const outer = []; for (let k = 0; k < 8; k++){ const a = k*Math.PI/4; outer.push([1.75*Math.cos(a), 1.75*Math.sin(a), 0]); }
  outer.forEach((p, k) => { items.push(BG(p, 0.28, 0.4, (s === 2 && k%2 === 0) ? '#d9766b' : '#f0cfe2')); items.push(BG(p, 0.14, 0.55, NUC)); });
  if (s === 0){
    items.push(BG([0,0,0], 0.28, 0.4, '#f0cfe2')); items.push(BG([0,0,0], 0.14, 0.55, NUC));
    labels.push({p:[0,0,0], t:'خلية طبيعية منظمة', c:'#b06a8e'});
    labels.push({p:outer[1], t:'انقسام تحكمه نقاط التحكم', c:'#b06a8e'});
  } else if (s === 1){
    items.push(BG([0,0,0], 0.97, 0.14, '#9b6fb0'));
    for (let k = 0; k < 24; k++){ const a = k*2*Math.PI/24; items.push(SP([0.97*Math.cos(a), 0.97*Math.sin(a), 0], 0.035, '#9b6fb0')); }
    [[0.35,0.25,0.3],[-0.3,-0.2,0.3],[0.1,-0.4,0.35],[-0.25,0.35,0.28]].forEach(p => { items.push(BG(p, 0.25, 0.4, '#f0cfe2')); items.push(BG(p, 0.12, 0.55, NUC)); });
    labels.push({p:[0,0.97,0], t:'الورم الحميد: محاط بكبسولة', c:'#9b6fb0'});
    labels.push({p:outer[3], t:'لا يغزو الأنسجة المجاورة', c:'#9b6fb0'});
  } else {
    const cl = []; for (let k = 0; k < 6; k++){ const a = k*Math.PI/3+0.3; cl.push([0.55*Math.cos(a), 0.55*Math.sin(a), 0.15*(k%2)]); }
    cl.forEach((p, k) => { if (k%2 === 0) items.push(L([0,0,0], outer[k], 0.09, '#c4524c')); });
    cl.forEach(p => { items.push(BG(p, 0.3, 0.45, '#d9766b')); items.push(BG(p, 0.14, 0.6, NUC)); });
    items.push(BG([0,0,0], 0.3, 0.4, '#d9766b'));
    labels.push({p:[0,0.45,0.2], t:'الورم الخبيث: يغزو', c:'#c4524c'});
    labels.push({p:outer[2], t:'تنتشر لأماكن أخرى', c:'#c4524c'});
  }
  return {items, labels};
}

function buildCheck(st){
  const items = [], labels = []; const s = st.stage|0;
  if (s < 2){
    const gc = s === 0 ? '#c0392b' : '#3fae5a', n = s === 0 ? 2 : 6;
    items.push(BG([0,0,0], 0.9, 0.12, MEM)); items.push(BG([0,0,0], 0.86, 0.28, '#e3f2d6'));
    items.push(BG([0,0,0], 0.42, 0.42, NUC));
    for (let i = 0; i < n; i++){ const a = i*2*Math.PI/n + 0.4; items.push(SP([0.66*Math.cos(a), 0.66*Math.sin(a), 0.1], 0.07, '#8a4fc0')); }
    for (let k = 0; k < 20; k++){ const a = k*2*Math.PI/20; items.push(SP([1.05*Math.cos(a), 1.05*Math.sin(a), 0], 0.05, gc)); }
    labels.push({p:[1.05,0,0], t: s === 0 ? 'بوابة G1: الفحص' : 'بوابة G2: الفحص', c:gc});
    labels.push({p:[0.66,0.2,0.1], t: s === 0 ? 'سايكلين قليل: تبقى الخلية' : 'سايكلين كافٍ: تنتقل الخلية', c:'#8a4fc0'});
  } else {
    items.push(...chromLine([-0.14,-0.26,0], [0.14,0.26,0], 0.09, CHR));
    items.push(...chromLine([0.14,-0.26,0], [-0.14,0.26,0], 0.09, CHR2));
    items.push(SP([-0.12,0,0.05], 0.05, '#c0392b')); items.push(SP([0.12,0,0.05], 0.05, '#c0392b'));
    items.push(L([-1.1,0,0], [-0.12,0,0], 0.03, SPN)); items.push(L([1.1,0,0], [0.12,0,0], 0.03, SPN));
    items.push(SP([-1.1,0,0], 0.09, POLE)); items.push(SP([1.1,0,0], 0.09, POLE));
    labels.push({p:[0.12,0,0.05], t:'الكينيتوكور: يتصل بالخيوط', c:'#c0392b'});
    labels.push({p:[1.1,0,0], t:'القطب (المريكز)', c:'#b7a53a'});
  }
  return {items, labels};
}

const SCENE_DEF = {
  sc_check:{build:buildCheck, yaw:0.3, pitch:0.2, stages:['بوابة G1','بوابة G2','نقطة فحص الانقسام'], fit:(W,H)=>Math.min(W/4.2,H/2.6)},
  sc_inter:{build:buildInter, yaw:0.35, pitch:0.2, stages:['G1 · النمو الأول','S · تضاعف الكروموسومات','G2 · الاستعداد للانقسام'], fit:(W,H)=>Math.min(W/3.6,H/2.6)},
  sc_mitosis:{build:buildAnim, anim:true, phases:[{n:'البيني',t:0.1},{n:'التمهيدي',t:0.27},{n:'الاستوائي',t:0.45},{n:'الانفصالي',t:0.62},{n:'النهائي',t:0.8},{n:'انقسام السيتوبلازم',t:0.94}], yaw:0.3, pitch:0.15, fit:(W,H)=>Math.min(W/6.2,H/2.8)},
  sc_cyto:{build:buildCyto, yaw:0.35, pitch:0.2, stages:['الحيوانية: تخصّر','النباتية: صفيحة خلوية'], fit:(W,H)=>Math.min(W/4.2,H/2.4)},
  sc_tumor:{build:buildTumor, yaw:0.3, pitch:0.5, stages:['خلايا طبيعية','ورم حميد','ورم خبيث'], fit:(W,H)=>Math.min(W/5.4,H/4.6)},
  sc_rna:{build:buildRNA, yaw:0.5, pitch:0.2, fit:(W,H)=>Math.min(W*0.2, H*0.85/5.04)},
  sc_chrom:{build:buildChrom, yaw:0.3, pitch:0.2, fit:(W,H)=>Math.min(W/3.2, H/3.8)},
  sc_dna:{build:buildDNA(false), yaw:0.5, pitch:0.25, fit:(W,H)=>Math.min(W*0.2, H*0.85/5.04)},
  sc_mut:{build:buildDNA(true), yaw:0.5, pitch:0.25, toggle:true, fit:(W,H)=>Math.min(W*0.2, H*0.85/5.04)},
  sc_nuc:{build:buildNuc, yaw:0.3, pitch:0.35, fit:(W,H)=>Math.min(W*0.16, H*0.3)},
  sc_nucl:{build:buildNucl, yaw:0.1, pitch:0.1, fit:(W,H)=>Math.min(W/5.4, H/2.4)},
  sc_fork:{build:buildFork, yaw:0.9, pitch:0.4, fit:(W,H)=>Math.min(W/7.4, H/4.8)}
};
const SCENES = [];
function renderScene(sc){
  const cv=sc.cv, W=cv.clientWidth, H=cv.clientHeight; if(!W||!H) return;
  const dpr=Math.min(1.5, window.devicePixelRatio||1);
  if (cv.width!==Math.round(W*dpr) || cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const st=sc.st; const scene=sc.def.build(st);
  const S=sc.def.fit(W,H), cx=W/2, cy=H/2;
  const pr=p=>proj(p, st.yaw, st.pitch, cx, cy, S);
  scene.items.forEach(it=>{
    if (it.t==='s'){ it.P=pr(it.p); it.z=it.P.z; }
    else { it.A=pr(it.a); it.B=pr(it.b); it.z=(it.A.z+it.B.z)/2; }
  });
  const _bk=scene.items.filter(it=>it.bg), _fr=scene.items.filter(it=>!it.bg); _fr.sort((u,v)=>u.z-v.z); scene.items=_bk.concat(_fr);
  const seg=(a,b,dx,dy)=>{ ctx.beginPath(); ctx.moveTo(a.x+dx,a.y+dy); ctx.lineTo(b.x+dx,b.y+dy); ctx.stroke(); };
  for (const it of scene.items){
    const A0 = it.al===undefined ? 1 : it.al; ctx.globalAlpha = A0;
    if (it.t==='s'){
      const r=it.r*S*it.P.f;
      const g=ctx.createRadialGradient(it.P.x-r*0.35,it.P.y-r*0.35,r*0.1,it.P.x,it.P.y,r);
      g.addColorStop(0,mixc(it.c,'w',0.6)); g.addColorStop(0.55,it.c); g.addColorStop(1,mixc(it.c,'b',0.45));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(it.P.x,it.P.y,Math.max(1,r),0,Math.PI*2); ctx.fill();
    } else if (it.t==='l'){
      const w=it.w*S*((it.A.f+it.B.f)/2); ctx.lineCap='round';
      ctx.strokeStyle=mixc(it.c,'b',0.35); ctx.lineWidth=w*1.2; seg(it.A,it.B,0,0);
      ctx.strokeStyle=it.c; ctx.lineWidth=w; seg(it.A,it.B,0,0);
      ctx.strokeStyle=mixc(it.c,'w',0.55); ctx.lineWidth=Math.max(1,w*0.3); ctx.globalAlpha=0.7*A0; seg(it.A,it.B,-w*0.2,-w*0.2); ctx.globalAlpha=A0;
    } else {
      ctx.strokeStyle=it.c; ctx.lineWidth=1.4; ctx.setLineDash([3,3]); seg(pr(it.a),pr(it.b),0,0); ctx.setLineDash([]);
    }
  }
  ctx.globalAlpha=1;
  // labels with leader lines, alternating sides
  ctx.font='bold 12px Tajawal, Tahoma, Arial, sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
  const n=scene.labels.length; const sideCount={L:0,R:0};
  scene.labels.forEach((lb,i)=>{
    const side = i%2 ? 'R':'L';
    const idx = sideCount[side]++;
    const perSide = Math.ceil(n/2);
    const y = 26 + idx*Math.min(56, (H-52)/Math.max(1,perSide-1||1));
    const ax = pr(lb.p);
    const w = ctx.measureText(lb.t).width + 16, h = 24;
    const x = side==='L' ? 6 : W-6-w;
    const ex = side==='L' ? x+w : x;
    ctx.strokeStyle='rgba(20,30,40,0.45)'; ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(ax.x,ax.y); ctx.lineTo(ex,y); ctx.stroke();
    ctx.fillStyle=lb.c; ctx.beginPath(); ctx.arc(ax.x,ax.y,3.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.94)'; ctx.strokeStyle=lb.c; ctx.lineWidth=1.4;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x,y-h/2,w,h,8); else ctx.rect(x,y-h/2,w,h); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#1d2630'; ctx.fillText(lb.t, x+w-8, y+0.5);
  });
}
let sceneLoopOn=false;
let lastFrame=0;
function sceneLoop(t){
  requestAnimationFrame(sceneLoop);
  if(document.hidden||t-lastFrame<33) return; lastFrame=t; /* نحو 30 إطاراً في الثانية لتخفيف الحمل */
  SCENES.forEach(sc=>{ if(!sc.visible) return;
    const st=sc.st;
    if (sc.def.anim){ if (st.play) st.t = (st.t + 0.0032) % 1; if (sc.ui && st.play){ sc.ui.range.value = Math.round(st.t*1000); sc.ui.phase.textContent = animPhaseName(st.t); } }
    else if(!sc.drag){ sc.autoT=(sc.autoT||0); if(sc.autoT<200){ st.yaw += 0.008; sc.autoT++; } }
    else sc.autoT=200;
    const sig=st.yaw+'|'+st.pitch+'|'+st.t+'|'+st.stage+'|'+st.mut+'|'+sc.cv.clientWidth+'|'+sc.cv.clientHeight;
    if(sig!==sc._sig){ sc._sig=sig; renderScene(sc); } });
}
const sceneIO = ('IntersectionObserver' in window) ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.target._sc) e.target._sc.visible=e.isIntersecting; })) : null;
function makeScene(key, canvas, toggleBtn, ui){
  const def=SCENE_DEF[key];
  const sc={cv:canvas, def, st:{yaw:def.yaw, pitch:def.pitch, mut:false, stage:0, t:0, play:true}, visible:true, drag:false};
  canvas._sc=sc; SCENES.push(sc);
  if (sceneIO) sceneIO.observe(canvas);
  let lx=0, ly=0;
  canvas.addEventListener('pointerdown', e=>{ sc.drag=true; lx=e.clientX; ly=e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e=>{ if(!sc.drag) return; sc.st.yaw += (e.clientX-lx)*0.01; sc.st.pitch=clamp(sc.st.pitch+(e.clientY-ly)*0.008,-1.2,1.2); lx=e.clientX; ly=e.clientY; });
  const up=()=>{ sc.drag=false; }; canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  if (toggleBtn) toggleBtn.onclick = () => { if (def.stages){ sc.st.stage = (sc.st.stage+1) % def.stages.length; toggleBtn.textContent = stageText(def, sc.st.stage); } else { sc.st.mut = !sc.st.mut; } };
  if (!sceneLoopOn){ sceneLoopOn=true; requestAnimationFrame(sceneLoop); }
  if (ui){ sc.ui = ui; ui.phase.textContent = animPhaseName(0); ui.setT = (v) => { sc.st.t = v; sc.st.play = false; ui.btn.textContent = '▶ تشغيل'; sc.ui.range.value = Math.round(v*1000); sc.ui.phase.textContent = animPhaseName(v); };
    ui.range.oninput = () => { sc.st.t = ui.range.value/1000; };
    ui.btn.onclick = () => { sc.st.play = !sc.st.play; ui.btn.textContent = sc.st.play ? '⏸ إيقاف مؤقت' : '▶ تشغيل'; }; }
  return sc;
}

$('mapBtn').onclick = () => { if(!window._cmd){ window._cmd=1; CMap.mount($('cmapbox'), JSON.parse(document.getElementById('cmapdata').textContent)); } show('mapsec'); };
function init(){ buildHome(); show('home'); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
