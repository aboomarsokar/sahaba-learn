:root{
  --bg:#EFE3CC; --card:#FBF5E8; --ink:#2A2016; --mute:#5C4B38; --line:#C9B28C;
  --accent:#2E7D32; --accent-ink:#ffffff; --soft:#E6D3AE;
  --plant:#2E7D32; --animal:#D32F2F; --both:#1565C0; --warn:#a86a10;
  --stage:#FBF5E8; --shadow:0 4px 14px rgba(20,40,30,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#5A4636; --card:#6A5442; --ink:#F6EEE2; --mute:#E6D3B8; --line:#8A7058;
    --accent:#66BB6A; --accent-ink:#0d1f17; --soft:#7A624C;
    --plant:#66BB6A; --animal:#EF5350; --both:#64B5F6; --warn:#f0b957;
    --stage:#6A5442; --shadow:0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#5A4636; --card:#6A5442; --ink:#F6EEE2; --mute:#E6D3B8; --line:#8A7058;
  --accent:#66BB6A; --accent-ink:#0d1f17; --soft:#7A624C;
  --plant:#66BB6A; --animal:#EF5350; --both:#64B5F6; --warn:#f0b957;
  --stage:#6A5442; --shadow:0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'PCB Naskh','Noto Naskh Arabic','Amiri',system-ui,sans-serif;font-weight:600;line-height:1.8;font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1240px;margin:0 auto;padding:12px 12px 24px}
header h1{margin:0;font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800}
header p{margin:4px 0 0;color:var(--mute)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px}
.tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 18px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:920px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stage{padding:10px 10px 12px;background:var(--stage)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 6px 10px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.hint{margin-inline-start:auto;color:var(--mute);font-size:.88rem}
svg.cell{width:100%;height:auto;display:block;direction:ltr}
.imgbox{border-radius:12px;overflow:hidden;background:#0d1b1e;line-height:0}
.hs{cursor:pointer}
.hs .s{fill:transparent;stroke:transparent;stroke-width:3px;vector-effect:non-scaling-stroke;pointer-events:all}
.hs .l{fill:none;stroke:transparent;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
.hs:hover .s{stroke:#ffd23f;fill:rgba(255,255,255,.16)}
.hs:hover .l{stroke:rgba(255,210,63,.55)}
.hs.sel .s{stroke:#ffb703;stroke-width:4px;fill:rgba(255,210,63,.1);filter:drop-shadow(0 0 6px #ffb703)}
.hs.sel .l{stroke:rgba(255,183,3,.6)}
.hs:focus{outline:none}.hs:focus-visible .s{stroke:#4da3ff;stroke-width:5px}
svg.showhs .hs .s{stroke:rgba(255,255,255,.95);stroke-dasharray:7 5;fill:rgba(255,255,255,.07)}
svg.showhs .hs .l{stroke:rgba(255,255,255,.45)}
svg.showhs .hs.lab .s{stroke:#ffe27a}
.hs.diff .s{stroke:#ff3d71;stroke-width:4px;fill:rgba(255,61,113,.14);animation:pulse2 1.5s ease-in-out infinite}
@keyframes pulse2{50%{stroke-opacity:.25;fill-opacity:.04}}
@media (prefers-reduced-motion:reduce){.hs.diff .s{animation:none}}
.cov{display:none;pointer-events:none}
svg.quizmode .cov{display:block}
.cov rect{fill:#fff;opacity:.97;stroke:#1d4ed8;stroke-width:3px}
.cov text{font:800 34px 'PCB Naskh','Amiri',sans-serif;fill:#1d4ed8}
.parts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 4px 2px}
.parts b{color:var(--mute);font-size:.9rem;margin-inline-end:4px}
.pchip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 13px;font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
.pchip:hover{border-color:var(--accent)}
.pchip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.part{cursor:pointer;transition:filter .15s}
.part:hover{filter:brightness(1.1) drop-shadow(0 0 3px rgba(255,200,0,.9))}
.part.sel{filter:drop-shadow(0 0 5px #ffb703) drop-shadow(0 0 2px #ffb703)}
.part:focus{outline:none}
.part:focus-visible{outline:none;filter:drop-shadow(0 0 6px #1d4ed8)}
.lblg{transition:opacity .3s}
svg.zoomed .lblg{opacity:0;pointer-events:none}
.lbl{font:600 15px 'PCB Naskh','Amiri',sans-serif;fill:var(--ink);cursor:pointer}
.lbl.sel{fill:var(--accent);font-weight:800}
.lead{stroke:var(--mute);stroke-width:1.2;fill:none;opacity:.7}
.dot{fill:var(--mute)}
.diff{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 7px #ff3d71) drop-shadow(0 0 2px #ff3d71)}}
@media (prefers-reduced-motion:reduce){.diff{animation:none;filter:drop-shadow(0 0 5px #ff3d71)}}
.panel{padding:18px 18px 20px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:920px){.panel{position:static;max-height:none}}
.panel h2{margin:0;font-size:1.5rem;font-weight:800}
.panel .en{direction:ltr;text-align:right;color:var(--mute);font-size:.95rem}
.badge{display:inline-block;padding:2px 12px;border-radius:999px;font-size:.82rem;font-weight:700;margin-top:6px;color:#fff}
.b-both{background:#4a6fa5}.b-plant{background:#2f8f4e}.b-animal{background:#c8553d}
.sec{margin-top:14px}
.sec h3{margin:0 0 6px;font-size:1rem;color:var(--accent);display:flex;align-items:center;gap:6px}
.sec p{margin:0}
.sec ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.sec li{background:var(--soft);border-radius:10px;padding:8px 12px}
.sec li b{display:block}
.sec li small{color:var(--mute)}
.go{margin-top:4px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 12px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.func li{background:transparent;border-inline-start:4px solid var(--accent);border-radius:0 8px 8px 0;padding:2px 12px}
.think{background:rgba(255,183,3,.14);border:1px dashed var(--warn);border-radius:12px;padding:8px 12px}
.note{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:.95rem}
.facts li{background:transparent;border:1px solid var(--line);padding:5px 12px}
.rels{display:flex;flex-wrap:wrap;gap:6px}
.rels .go{padding:4px 14px;font-size:.88rem}
.src{margin-top:12px;color:var(--mute);font-size:.82rem}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
.empty .big{font-size:2.6rem}
table{width:100%;border-collapse:collapse;font-size:.97rem}
th,td{border:1px solid var(--line);padding:9px 10px;text-align:center;vertical-align:middle}
th{background:var(--soft);font-weight:800}
td.name{text-align:start;font-weight:700}
td.name button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline dotted;font-weight:700}
td.yes{color:var(--plant);font-weight:700}
td.no{color:var(--mute)}
tr.d td{background:rgba(255,61,113,.07)}
.tw{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.two h4{margin:2px 0;text-align:center;font-size:1rem}
.pad{padding:16px}
.theory ol{margin:6px 0 0;padding-inline-start:22px}
.theory li{margin:4px 0}
.score{font-weight:800;color:var(--accent)}
.toast{padding:6px 14px;border-radius:12px;font-weight:700}
.ok{background:rgba(47,143,78,.18);color:var(--plant)}
.bad{background:rgba(200,85,61,.18);color:var(--animal)}
.ask{background:var(--soft);color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 8px 0;font-size:.86rem;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
footer{margin-top:22px;text-align:center;color:var(--mute);font-size:.85rem}

body{padding-bottom:92px;overscroll-behavior:contain}
.predict{margin-top:14px;padding:14px 16px}
.pq-title{font-weight:800;color:var(--accent);margin-bottom:6px;font-size:1.1rem}
.q{margin:0 0 8px;font-weight:600}
.ctabs{display:flex;flex-wrap:wrap;gap:8px}
.ctab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.ctab:hover{border-color:var(--accent)}
.ctab:disabled{cursor:default}
.popt.okb{background:rgba(47,143,78,.18);border-color:var(--plant);color:var(--plant)}
.popt.badb{background:rgba(200,85,61,.18);border-color:var(--animal);color:var(--animal)}
.bigtab{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:rise .5s ease both}
.medbox{text-align:center;margin-top:12px}
.orgimg{width:100%;max-height:340px;object-fit:contain;border-radius:12px;display:block;background:#0d1b1e}
.noimg{padding:30px 10px;border:1px dashed var(--line);border-radius:12px;color:var(--mute)}
.medmsg{font-size:1.15rem;font-weight:700;margin:12px 0 2px}
.ring{width:78px;height:78px;margin:8px auto;border-radius:50%;border:4px solid var(--accent);display:grid;place-items:center;font-size:1.7rem;font-weight:800;color:var(--accent)}
.ring.done{background:var(--soft)}
.medhint{color:var(--mute);margin:6px 0 12px;font-size:.92rem}
.choose .q{margin-top:14px}
.kind{margin-top:10px;font-weight:800;color:var(--accent);font-size:1.1rem}
.stack{display:grid;gap:4px}
.shade{background:linear-gradient(90deg,var(--soft),transparent 90%);border-inline-start:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:8px;animation:rise .6s ease both}
.shade b{display:block;color:var(--accent);margin-bottom:2px}
.navbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.think2{margin-top:12px;background:rgba(255,183,3,.14);border:1px dashed var(--warn);border-radius:12px;padding:10px 12px}
.ans{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.talk{position:fixed;bottom:12px;inset-inline:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 24px);z-index:50;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px 16px 8px 12px;font-weight:600}
.talk .av{font-size:1.5rem;flex:none}
#bub{min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.shade,.bigtab{animation:none}}

#sky{padding-top:8px}
.skyhint{text-align:center;font-weight:800;font-size:1.15rem;color:var(--accent);margin:14px 0 4px}
.sky{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 22px;padding:84px 8px 22px}
.cloud{position:relative;width:250px;min-height:140px;border:0;cursor:pointer;border-radius:999px;background:var(--cc);color:#1c2a23;font:inherit;padding:44px 22px 26px;box-shadow:0 14px 30px rgba(20,50,35,.15);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .7s ease,opacity .7s ease,filter .7s ease;animation:float 4.5s ease-in-out infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--cc);border-radius:50%;z-index:-1}
.cloud::before{width:110px;height:110px;top:-46px;inset-inline-start:34px}
.cloud::after{width:140px;height:140px;top:-64px;inset-inline-start:100px}
.cloud span{font-size:1.2rem;font-weight:800}
.cloud small{color:#4b5b52;font-size:.9rem}
.c-animal{--cc:#d6f0df}.c-plant{--cc:#cdeff0}.c-diff{--cc:#e4dcf8}
.cloud:nth-child(2){animation-delay:-1.5s}.cloud:nth-child(3){animation-delay:-3s}
.cloud:hover{filter:brightness(1.04) drop-shadow(0 0 10px rgba(255,210,63,.6))}
.cloud.pick{transform:scale(1.22);opacity:1;filter:drop-shadow(0 0 18px rgba(255,210,63,.9));animation:none}
.cloud.fade{opacity:0;transform:scale(.55) translateY(-30px);filter:blur(8px);animation:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none}}
.ansrow{display:flex;gap:8px;margin-top:8px}
.ansrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit}
.tmsg{margin-top:8px;font-weight:700}
.tmsg.ok{color:var(--plant)}.tmsg.bad{color:var(--animal)}

function shape(h){
  const v=h.v;
  if(h.t==='e')return `<ellipse class="s" cx="${v[0]}" cy="${v[1]}" rx="${v[2]}" ry="${v[3]}" transform="rotate(${v[4]} ${v[0]} ${v[1]})"/>`;
  if(h.t==='r')return `<rect class="s" x="${v[0]}" y="${v[1]}" width="${v[2]}" height="${v[3]}" rx="14"/>`;
  if(h.t==='p'){let pts='';for(let i=0;i<v.length;i+=2)pts+=v[i]+','+v[i+1]+' ';return `<polygon class="s" points="${pts}"/>`}
  let d='M'+v[0]+' '+v[1];for(let i=2;i<v.length;i+=2)d+=' L'+v[i]+' '+v[i+1];
  return `<path class="l" d="${d}" style="stroke-width:${h.w||24}px"/>`;
}

function say(t){
  const b=$('#bub'); if(b) b.textContent=t;
  return; /* الشرح الصوتي ملغى */
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ar-SA'; u.rate=0.95;
    const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
let actx=null;
function beep(){
  if(muted) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(990,t+0.12);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.25);
  }catch(e){}
}

let zAnim=null;
function animVB(svg,to){
  const from=svg.getAttribute('viewBox').split(/\s+/).map(Number);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){svg.setAttribute('viewBox',to.join(' '));return}
  cancelAnimationFrame(zAnim);const t0=performance.now(),D=520;
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    svg.setAttribute('viewBox',from.map((v,i)=>v+(to[i]-v)*e).join(' '));if(k<1)zAnim=requestAnimationFrame(step)};
  zAnim=requestAnimationFrame(step);
}
function resetZoom(){
  const svg=document.querySelector('svg.cell:not(.mini)');if(!svg)return;
  animVB(svg,svg.dataset.vb.split(' ').map(Number));const b=$('#bReset');if(b)b.style.display='none';
}
const ZFALL={envelope:'nucleus',chromatin:'nucleus'};
function zoomTo(svg,id){
  if(!state.zoom||svg.classList.contains('mini'))return;
  const el=svg.querySelector(`.hs:not(.lab)[data-part="${ZFALL[id]||id}"]`);if(!el){resetZoom();return}
  const r=el.getBoundingClientRect(),m=svg.getScreenCTM().inverse();
  const p1=new DOMPoint(r.left,r.top).matrixTransform(m),p2=new DOMPoint(r.right,r.bottom).matrixTransform(m);
  const w=Math.abs(p2.x-p1.x),h=Math.abs(p2.y-p1.y),cx=(p1.x+p2.x)/2,cy=(p1.y+p2.y)/2;
  const ar=IW/IH;let tw=Math.max(w*2.3,h*2.3*ar,430);
  if(tw>=900){resetZoom();return}
  const th=tw/ar;
  animVB(svg,[Math.min(Math.max(cx-tw/2,0),IW-tw),Math.min(Math.max(cy-th/2,0),IH-th),tw,th]);
  const b=$('#bReset');if(b)b.style.display='';
}

function tick(){

    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type='square';o.frequency.setValueAtTime(1600,t);o.frequency.exponentialRampToValueAtTime(700,t+0.04);
    g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.07);
  }catch(e){}
}

function checkThink(){
