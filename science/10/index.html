دث العبور في الطور:": "العبور هو تبادل أجزاء بين كروماتيدات غير شقيقة من كروموسومين متماثلين، ولذلك لا يحدث إلا إذا اقترب الكروموسومان المتماثلان وتزاوجا معاً.\nفي أي انقسام (الأول أم الثاني) تكون الكروموسومات المتماثلة مجتمعة؟ وفي أي طور منه يحدث هذا الاقتران؟\nانتبه إلى رقم الانقسام في كل خيار.", "الخلية الأم الواحدة في الذكر والأنثى على الترتيب تعطي:": "قارن بين تكوّن الحيوانات المنوية وتكوّن البويضات: كم خلية ناضجة تنتج عن كل خلية أم؟ وكيف يُقسَّم السيتوبلازم في كل حالة؟\nانتبه إلى أن السؤال يطلب الترتيب: الذكر أولاً ثم الأنثى.", "يكتمل الانقسام المنصف الثاني في البويضة:": "تُطلق البويضة من المبيض في مرحلة متوقفة من الانقسام المنصف، ثم تنتظر حدثاً يحفزها على إكمال الانقسام الثاني.\nاسأل نفسك: ما الحدث الذي يجعل البويضة تكمل انقسامها؟ ومتى يحدث بالنسبة للتبويض؟", "الترتيب الصحيح لتكوين الحيوانات المنوية:": "تكوين الحيوانات المنوية يسير بالترتيب: خلية منوية أولية تخضع للانقسام المنصف الأول فتعطي خلايا ثانوية، وتخضع الثانوية للانقسام المنصف الثاني فتعطي خلايا تسمى الطلائع، ثم تتمايز الطلائع إلى حيوانات منوية بذيل ورأس.\nتحقق من خيار يوافق هذا التسلسل ويكون فيه عدد الكروموسومات في كل مرحلة صحيحاً (2n ثم n).", "تعطي الخلية الأم بويضة واحدة فقط لأن:": "البويضة تحتاج إلى مخزون كبير من السيتوبلازم والغذاء لتغذية الجنين في بداياته.\nفكّر كيف يُقسَّم السيتوبلازم عند انقسام الخلية الأم في الأنثى مقارنة بالذكر، وماذا يحدث للخلايا الصغيرة الناتجة؟\nاختر التفسير الذي يربط بين الشكل الذي ينقسم به السيتوبلازم وبين عدد البويضات الناتجة.", "من أهمية الانقسام المنصف:": "فكّر في التكاثر الجنسي: عند اندماج الغاميتين، ماذا يحدث لعدد الكروموسومات لو لم يُخفَّض في الغاميتات؟\nوتذكّر أن العبور وتوزيع الكروموسومات المتماثلة عشوائياً يؤديان إلى تراكيب وراثية جديدة.\nاستبعد أي عبارة تصف وظائف الانقسام المتساوي كالنمو والإصلاح أو إنتاج نسخ مطابقة.", "عدد الأنسجة الرئيسة في جسم الإنسان:": "تُصنَّف الأنسجة إلى مجموعات كبرى بحسب شكل الخلايا ووظيفتها، لا بحسب العضو الموجود فيه.\nاسترجع هذا التصنيف من درسك: اذكر كل مجموعة مع مثال عليها، ثم عدّها.", "النسيج الذي تتراص خلاياه ووظيفته الحماية والامتصاص والإفراز:": "فكّر في الأسطح التي تحتاج إلى حماية وامتصاص وإفراز: الجلد من الخارج، وبطانة الأمعاء، والغدد.\nالنسيج المطلوب تكون خلاياه متلاصقة ومادته بين الخلوية قليلة جداً. أي أنواع الأنسجة يغطي الأسطح ويبطّن التجاويف؟", "المستوى التنظيمي الذي يلي النسيج مباشرة:": "التنظيم في جسم الكائن الحي يبدأ من الأصغر إلى الأكبر: الخلية ثم النسيج ثم مستوى ثالث ثم الجهاز ثم الكائن الحي.\nالمستوى المطلوب هو الذي تتعاون فيه عدة أنسجة مختلفة لتؤدي وظيفة محددة، كالقلب والمعدة.", "النسيج العضلي الذي يوجد في القلب فقط هو:": "العضلات في الجسم ثلاثة أنواع، ويُسمّى بعضها بحسب مكانه أو شكله أو عمله.\nاسأل نفسك: أي نوع منها لا يوجد إلا في عضو واحد هو القلب؟\nانتبه إلى أن بعض العضلات لها أكثر من اسم يُستعمل في الكتب.", "أي مما يلي من أنواع النسيج الضام؟": "النسيج الضام يربط الأنسجة ويدعمها، ويتميز بأن خلاياه متباعدة وتوجد في مادة بين خلوية وفيرة، قد تكون صلبة أو هلامية أو سائلة.\nاختر الخيار الذي تنتمي كل عناصره إلى هذه الصفة، وانتبه إلى أن الخيار الصحيح تنطبق عليه الصفة في كل ما يذكره لا في بعضه.", "الوحدة البنائية والوظيفية للنسيج العصبي:": "لكل نسيج أو عضو وحدة بنائية ووظيفية: فهي أصغر جزء يقوم بوظيفة النسيج كاملة.\nالنسيج العصبي وظيفته استقبال السيالات ونقلها، فما الخلية المتخصصة في ذلك؟ وانتبه إلى أن بعض الخيارات تخص الدم أو الكلية.", "من صفات النسيج الطلائي:": "للنسيج الطلائي صفات يمكنك التحقق منها بأسئلة: كيف تتراص خلاياه؟ وما مقدار المادة بين الخلوية؟ وهل تخترقه الأوعية الدموية أم يتغذى بالانتشار من النسيج الذي تحته؟ وعلى ماذا يستند؟ وما قدرته على التجدد؟\nأجب عن هذه الأسئلة ثم قارن كل عبارة بإجاباتك.", "الألياف الثلاثة في النسيج الضام هي:": "الألياف جزء من المادة بين الخلوية في النسيج الضام، ولها وظائف: أنواع تمنح القوة وتحمل الشد، وأنواع تمنح المرونة، وأنواع دقيقة متفرعة تشكل شبكة دعم.\nاسترجع أسماء هذه الألياف من درسك، وانتبه إلى أن الخيار المطلوب يتحدث عن النسيج الضام بالتحديد.", "أي أنواع العضلات التالية لا إرادية وتحيط بالأعضاء الجوفاء؟": "ضع شرطين للعضلة المطلوبة: أن تكون لا إرادية، وأن تحيط بجدران الأعضاء الجوفاء مثل الأمعاء والأوعية الدموية والمثانة.\nثم تذكّر أنواع العضلات الثلاثة وخصائص كل نوع من حيث الإرادة والموقع، واختر النوع الذي يجمع الشرطين.", "العضو الذي ينتج الحيوانات المنوية:": "الجهاز التناسلي الذكري فيه عضو ينتج الغاميتات وأعضاء تنقلها أو تخزنها أو تضيف إليها إفرازات.\nاسأل نفسك: أي العضو هو الغدة التناسلية الذكرية التي تُصنَّع فيها الحيوانات المنوية داخل الأنابيب المنوية؟", "الهرمون الذكري الذي تفرزه الخصيتان:": "الغدد التناسلية تنتج الغاميتات وتفرز هرمونات جنسية تظهر الصفات الجنسية الثانوية.\nفكّر: ما الهرمون المسؤول عن الصفات الذكرية كخشونة الصوت ونمو الشعر والعضلات؟ وما أنواع الهرمونات التي ينتجها المبيض؟", "يحدث الإخصاب غالباً في:": "تتبّع رحلة البويضة بعد التبويض: تلتقطها نهاية قناة البيض وتدفعها الأهداب نحو الرحم، وهي تعيش وقتاً قصيراً بعد خروجها.\nوتتبّع رحلة الحيوانات المنوية وهي تصعد من المهبل عبر الرحم.\nفأين يلتقيان في الغالب؟ وانتبه إلى أن الإخصاب غير الانغراس.", "تفرز الخلايا البينية (خلايا ليديج) في الخصية:": "تقع الخلايا البينية في الفراغات بين الأنابيب المنوية في الخصية، وهي خلايا صماء وظيفتها إفراز هرمون.\nأما الأنابيب المنوية نفسها فهي مكان تكوّن الحيوانات المنوية.\nاسأل نفسك: ماذا تفرز الخلايا الصماء في الخصية؟", "تحتوي القطعة الوسطى في الحيوان المنوي على:": "الحيوان المنوي له رأس فيه النواة والأكروسوم، وقطعة وسطى، وذيل سوطي يسبح به.\nالسباحة تحتاج إلى طاقة كبيرة. ما العضية المسؤولة عن إنتاج الطاقة في الخلية؟ وفي أي جزء من الحيوان المنوي تتجمع؟", "عدد كروموسومات الزايجوت البشري:": "تذكّر عدد الكروموسومات في الخلية الجسمية البشرية، ثم عدد ما تحمله كل غاميت منها.\nالزايجوت ينشأ من اندماج غاميتين، فاجمع ما يحمله كل منهما، وقارن ذلك بعدد الكروموسومات في خلايا الجسم.", "أي الهرمونات يحفز التبويض؟": "في دورة المبيض تعمل هرمونات من الغدة النخامية وأخرى من المبيض، ولكل منها دور: واحد ينمّي الجريب، وآخر يسبب انفجار الجريب وإطلاق البويضة، وآخر يهيئ بطانة الرحم ويحافظ عليها.\nاستحضر أسماء هذه الهرمونات ووظيفة كل منها، ثم اختر الهرمون المسؤول عن إطلاق البويضة.", "التوائم المتطابقة تنتج من:": "التوأمان المتطابقان يتشابهان في المادة الوراثية تشابهاً كاملاً.\nفكّر: كم بويضة وكم حيواناً منوياً يشاركون في تكوين زايجوت واحد؟ ولو انقسم الجنين المبكر إلى جنينين، فمن أين تأتي المادة الوراثية لكل منهما؟\nقارن ذلك بحالة التوأمين غير المتطابقين.", "يكتمل نضج الحيوانات المنوية وتُخزَّن في:": "مسار الحيوانات المنوية: تتكون في الأنابيب المنوية، ثم تنتقل إلى قناة ملتفة ملتصقة بالخصية تنضج فيها وتكتسب الحركة وتُخزَّن، ثم إلى الوعاء الناقل.\nاستحضر أسماء هذه التراكيب، وتذكّر أن غدداً مثل البروستات تضيف إفرازات فقط ولا تُخزّن الحيوانات المنوية.", "الوحدة التركيبية والوظيفية في الكلية:": "وحدة التركيب والوظيفة هي أصغر جزء يؤدي وظيفة العضو كاملة.\nفي الكلية تبدأ الوظيفة بترشيح الدم ثم تتم معالجة الراشح في أنبوب طويل. فما اسم التركيب الذي يجمع الجزأين معاً؟ وانتبه إلى كلمة فقط في بعض الخيارات.", "العضو الذي يخزن البول مؤقتاً:": "تتبّع مسار البول بالترتيب: عضو يكوّن البول، ثم قناتان تنقلانه، ثم عضو يتسع ليتجمع فيه، ثم قناة تطرحه إلى الخارج.\nاسأل نفسك: أي عضو جداره مرن يتسع ويمتلئ ثم يفرغ عند التبول؟", "وظيفة الحالبين:": "تذكّر مسار البول بالترتيب من مكان تكوينه إلى طرحه، وحدّد موقع الحالبين فيه.\nما العضو الذي يسبقهما وما العضو الذي يليهما؟ والقناة التي تصل بين عضوين وظيفتها النقل لا التخزين ولا التصفية.", "يحدث الترشيح في:": "الترشيح أول خطوة في تكوين البول، ويتم بضغط الدم عبر جدران شعيرات دموية في بداية النفرون، فتخرج الماء والمواد الصغيرة إلى حيز يحيط بها.\nأما إعادة الامتصاص فتحدث لاحقاً في الأنابيب.\nحدّد التركيب الذي توجد فيه هذه الشعيرات المحاطة بالمحفظة.", "تُعاد من الراشح في الكلية نسبة تقارب:": "تترشح من الدم في الكلية كمية كبيرة جداً من السائل كل يوم، أما البول الذي يطرحه الجسم فقليل جداً بالمقارنة.\nما الذي يحدث إذاً لمعظم الراشح؟ لأن الجسم لا يستطيع أن يفقد الماء والجلوكوز والأملاح النافعة.\nقدّر النسبة بناءً على هذه المقارنة.", "خطوات تكوين البول بالترتيب:": "لكل عملية في تكوين البول دور واضح: الترشيح يدفع الماء والمواد الصغيرة من الدم إلى النفرون، وإعادة الامتصاص تُرجع المواد النافعة من النبيب إلى الدم، والإفراز ينقل مواد زائدة من الدم إلى النبيب.\nفكّر منطقياً: أي عملية تحتاج أولاً إلى وجود سائل داخل النبيب لتعمل عليه؟ وأي عملية تُكمل التنقية في النهاية؟", "من طرق علاج الفشل الكلوي:": "الفشل الكلوي يعني أن الكلى فقدت قدرتها على تنقية الدم من الفضلات والماء الزائد.\nالعلاج الصحيح إما أن يقوم بعمل الكلية خارج الجسم، أو أن يستبدل العضو التالف نفسه. اسأل نفسك عن كل خيار: هل يعالج وظيفة الترشيح المفقودة فعلاً؟", "السبب الرئيس لحصى الكلية والوقاية منها:": "حصى الكلية بلورات تتكوّن عندما تتركّز أملاح معدنية في البول فتترسب وتتجمع.\nابحث في كتابك عن نوع الأملاح الأكثر ارتباطاً بتكوّن الحصى. ثم فكّر في طريقة الوقاية: ما الذي يجعل البول أقل تركيزاً فتقلّ فرصة ترسّب الأملاح؟", "يأتي حمض البوليك في البول من أيض:": "حمض البوليك فضلة نيتروجينية، أي أن ذرات النيتروجين موجودة في تركيبه.\nإذن لا بد أنه ينتج من تكسير جزيئات حيوية تحتوي النيتروجين في بنيتها (مثل القواعد النيتروجينية). تذكّر أن بعض الجزيئات الحيوية تتكوّن من الكربون والهيدروجين والأكسجين فقط.", "عدد المجالات في التصنيف الحديث:": "المجال هو أعلى مستوى في التصنيف الحديث، ويقع فوق المملكة. اعتمد العلماء في تحديد المجالات على الفروق في rRNA وفي تركيب الخلية.\nتذكّر أن الكائنات بدائية النواة لم تعد تُعدّ مجموعة واحدة بعد دراسة rRNA، وأن للكائنات حقيقية النواة مجالها الخاص. عدّ المجالات التي يذكرها كتابك.", "عدد الممالك في التصنيف الحديث:": "المملكة مستوى أصغر من المجال، فبعض المجالات تضم مملكة واحدة وبعضها يضم عدة ممالك.\nالمجال الذي تنتمي إليه الكائنات حقيقية النواة يضم الأوليات والفطريات والنباتات والحيوانات. اجمع هذه مع ممالك المجالين الآخرين كما في كتابك.", "يتكون الاسم العلمي من:": "نظام التسمية الذي وضعه لينيوس يسمى التسمية الثنائية، أي أن الاسم يتكون من كلمتين لاتينيتين.\nالكلمة الأولى تبدأ بحرف كبير وتدل على مجموعة أوسع، والثانية تبدأ بحرف صغير وتحدد الكائن بدقة. راجع مستويات التصنيف وانظر أي مستويين يمثلان هاتين الكلمتين.", "الوحدة الأساسية في التصنيف:": "الوحدة الأساسية في التصنيف هي المستوى الذي يُعرَّف بأن أفراده قادرون على التزاوج فيما بينهم وإنتاج نسل خصب.\nطبّق هذا التعريف على مستويات التصنيف المذكورة: أيها يُعرَّف بهذه الطريقة؟", "الاسم العلمي للقط المنزلي:": "الاسم العلمي يتكوّن من الجنس (بحرف كبير) ثم النوع (بحرف صغير)، وهو لاتيني الأصل.\nكل خيار هو اسم كائن مختلف. اربط اسم الجنس بما تعرفه عن الكائن: القطط تنتمي إلى عائلة السنوريات اللاحمة، وكل جنس يضم أنواعاً متقاربة في صفاتها.", "أهمية الاسم العلمي أنه:": "فكّر في مشكلة الأسماء الشائعة: الحيوان نفسه قد يُسمّى بأسماء مختلفة في بلدان ولغات مختلفة، وقد يُطلق الاسم نفسه على كائنين مختلفين.\nالاسم العلمي وُضع ليحلّ هذه المشكلة. اسأل نفسك أي خيار يصف ميزة تجعل العلماء في العالم يفهمون الكائن نفسه من الاسم وحده.", "الترتيب الصحيح لمستويات التصنيف من الأكبر إلى الأصغر:": "ابدأ من الطرفين: حدّد أوسع مستوى في التصنيف الحديث وهو الذي يضم أكبر عدد من الكائنات، ثم حدّد أدق مستوى.\nرتّب الباقي بحيث يقلّ عدد الكائنات في المجموعة كلما نزلت: الجنس يضم أنواعاً، والعائلة تضم أجناساً، وهكذا. اختر الخيار الذي يتبع هذا التدرج كاملاً.", "البغل ليس نوعاً مستقلاً لأنه:": "تعريف النوع: مجموعة من الكائنات تتزاوج فيما بينها وتنتج نسلاً قادراً هو نفسه على التكاثر.\nالبغل ناتج عن تزاوج كائنين من نوعين مختلفين. اسأل نفسك: ماذا يحدث لقدرة البغل على التكاثر، وكيف ينعكس ذلك على تعريف النوع؟", "التصنيف الجيني يعتمد على:": "التصنيف الجيني يقارن الكائنات على مستوى جزيئات الوراثة، فكلما تشابهت المعلومات الوراثية زادت القرابة بين الكائنين.\nفكّر: أي الخيارات تقيس شيئاً داخل الجزيء الوراثي نفسه، وأيها يعتمد على ما نراه من الخارج أو على بيئة الكائن؟", "كم يساوي 1 كيلومتر بالمتر؟": "البادئة كيلو معناها مضاعف ثابت للوحدة الأساسية، كما في الكيلوغرام مع الغرام.\nارجع إلى جدول البوادئ واكتب قيمة كيلو، ثم عوّض: كم متراً في كيلومتر واحد؟", "أي أداة تستخدم لقياس قطر سلك رفيع بدقة عالية جداً؟": "دقة الأداة تتحدد بأصغر تدريج تستطيع قراءته، وقطر السلك الرفيع قد يكون أجزاء قليلة من الملّيمتر.\nقارن أصغر تدريج في كل أداة مذكورة، وتذكّر أن الأداة المصممة لهذا الغرض تعتمد على برغي دقيق الخطوة يُدار لإطباق فكّيها على الجسم.", "رمز البادئة «ميلي» هو:": "رموز البوادئ حساسة لحالة الحرف: الرمز الصغير والرمز الكبير يعنيان بادئتين مختلفتين جداً.\nملّي تعني جزءاً من ألف من الوحدة. راجع جدول البوادئ في كتابك وانتبه إلى حالة الحرف عند مطابقة الرمز.", "5 سم تساوي كم متراً؟": "السنتي تعني جزءاً من مئة من المتر، أي أن المتر الواحد يحوي عدداً معلوماً من السنتيمترات.\nعند التحويل من وحدة أصغر إلى أكبر نقسم على عدد الوحدات الصغيرة في الكبيرة. وللتحقق: 5 سم أقل من متر، فيجب أن تكون النتيجة أقل من واحد.", "الورنية تستخدم لقياس:": "تخيّل شكل الورنية: لها فكّان قابلان للانزلاق وساق رفيعة تبرز من طرفها.\nفكّر ماذا تقيس بكل جزء منها، ثم اختر الخيار الذي يجمع استعمالاتها كاملةً دون أن يخرج عن نوع الكمية التي تقيسها.", "القيمة 10⁻⁶ تمثل البادئة:": "البوادئ تُرتّب بأسس تتغيّر بخطوات من ثلاث مراتب: ملّي تعني 10⁻³، ثم تأتي البوادئ الأصغر بعدها تباعاً.\nضع البوادئ بالترتيب من الأكبر إلى الأصغر وحدّد أيها يقابل الأس -6 في جدول البوادئ.", "قطر خلية 20 μm، فكم يساوي بالمتر؟": "ابدأ بمعنى البادئة ميكرو (μ): اكتب قيمتها بالصيغة العلمية 10 أس عدد سالب.\nاضرب العدد 20 في هذه القيمة، ثم اكتب 20 على صورة (عدد بين 1 و10) × 10 أس، وادمج الأسّين بقانون ضرب الأسس. قارن الصيغة التي حصلت عليها بالخيارات.", "في الميكرومتر: التدريج الطولي 5.5 ملم والدائري 28 قسماً (كل قسم 0.01 ملم). القراءة:": "قراءة الميكرومتر = قراءة التدريج الطولي + (قراءة التدريج الدائري).\nقراءة التدريج الدائري = عدد الأقسام × قيمة القسم الواحد بالملّيمتر. احسب هذا الجزء أولاً بعناية في مرتبته العشرية، ثم أضفه إلى القراءة الطولية.", "السرعة 72 km/h تساوي بوحدة m/s:": "للتحويل نغيّر الوحدتين معاً: الكيلومتر إلى متر، والساعة إلى ثانية.\nتذكّر أن الكيلومتر الواحد فيه 1000 متر، وأن الساعة الواحدة فيها 60 دقيقة في كل دقيقة 60 ثانية. اضرب في عدد الأمتار واقسم على عدد الثواني.", "ما رمز عنصر الصوديوم؟": "رمز العنصر يتكوّن من حرف أو حرفين: الأول كبير والثاني صغير.\nبعض الرموز لا تُشتق من الاسم العربي أو الإنجليزي بل من الاسم اللاتيني القديم، مثل Fe للحديد من ferrum. ابحث عن الاسم اللاتيني للصوديوم، واستخرج منه الرمز.", "العناصر في المجموعة الواحدة في الجدول الدوري تقع في:": "الجدول الدوري منظّم في اتجاهين: أفقي ورأسي، ولكل منهما اسم: دورة أو مجموعة.\nالعناصر في المجموعة الواحدة تتشابه في عدد إلكترونات مستوى الطاقة الخارجي، فتتشابه خواصها الكيميائية. اسأل: في أي الاتجاهين يتكرر هذا التشابه؟", "أي مما يلي غاز نبيل؟": "الغازات النبيلة تقع في المجموعة الأخيرة من الجدول (المجموعة 18)، وهي غازات خاملة لأن مستوى طاقتها الخارجي ممتلئ.\nحدّد موقع كل عنصر من الخيارات في الجدول الدوري، واختر العنصر الذي يقع في تلك المجموعة.", "العدد الذري يمثل عدد:": "العدد الذري هو ما يحدد هوية العنصر، ويُكتب عادةً أسفل رمزه.\nفكّر في الجسيم الذي لو تغيّر عدده تغيّر العنصر نفسه، بينما نظائر العنصر الواحد تختلف في جسيم آخر موجود في النواة.", "فلز من المجموعة IA يتفاعل بشدة مع الماء:": "فلزات المجموعة IA (القلويات) نشيطة جداً، تتفاعل مع الماء بعنف وتنتج غاز الهيدروجين ومحلولاً قاعدياً، ويزداد نشاطها كلما نزلنا في المجموعة.\nحدّد موقع كل عنصر في الجدول الدوري. المطلوب عنصر فلزي يقع في المجموعة IA.", "عند تفاعل CaCO₃ مع HCl يتصاعد غاز:": "الكربونات تتفاعل مع الحموض وفق القاعدة: كربونات + حمض ← ملح + ماء + غاز.\nاكتب المعادلة العامة وطبّقها على CaCO₃ وHCl. تذكّر أن هذا الغاز يعكّر ماء الجير، وهو الاختبار المعروف للكشف عنه.", "كم مولاً من HCl يلزم للتفاعل مع مول واحد من CaCO₃؟": "اكتب معادلة التفاعل: CaCO₃ + HCl ← CaCl₂ + H₂O + CO₂، ثم زنها.\nابدأ بذرات الكلور: كم ذرة منها في المواد الناتجة؟ ومنها تحدد معامل HCl، ثم تحقق من توازن H وO. النسبة بين المعاملين هي النسبة المولية.", "لون الراسب الناتج من تفاعل Pb(NO₃)₂ مع KI:": "هذا تفاعل تبادل مزدوج: يتبادل المركبان الأيونات، فيتحد الرصاص مع أيون اليوديد ويتحد البوتاسيوم مع أيون النترات.\nاكتب صيغة الناتج الذي يرسب مستعيناً بقواعد الذوبان، ثم تذكّر لون هذا الراسب المميز الذي قد تكون رأيته في المختبر.", "نوع التفاعل Ca + 2H₂O → Ca(OH)₂ + H₂ هو:": "صنّف التفاعل بمقارنة المتفاعلات بالنواتج: كم مادة في كل جانب؟ وهل يوجد عنصر منفرد في المتفاعلات وعنصر منفرد في النواتج؟\nفي الإحلال البسيط يحل عنصر منفرد محل عنصر آخر في مركب، ويظهر عنصر جديد منفرد. طبّق ذلك على الكالسيوم والماء.", "العضية المسؤولة عن إنتاج الطاقة ATP:": "ATP هي عملة الطاقة في الخلية، وتُنتج معظمها في مراحل التنفس الخلوي الهوائي.\nابحث عن العضية ذات الغشاءين التي يلتف غشاؤها الداخلي في طيّات، وهي موضع هذا التفاعل.", "العضية التي تحتوي على المادة الوراثية:": "المادة الوراثية DNA في الخلايا حقيقية النواة محفوظة داخل عضية محاطة بغشاء، وهي مركز التحكم في الخلية.\nفكّر في العضية التي تصدر الأوامر لبناء البروتينات وتنظّم نشاط الخلية، وقارنها بوظائف العضيات الأخرى.", "الجدار الخلوي يوجد في الخلايا:": "الجدار الخلوي طبقة صلبة تقع خارج الغشاء الخلوي، تعطي الخلية شكلها وتدعمها.\nقارن بين الخلية النباتية والخلية الحيوانية: أي التراكيب ينفرد بها نوع منهما؟ ثم فكّر في المادة التي يتكوّن منها الجدار.", "أي عضية تعتبر مصنع البروتين؟": "بناء البروتين (الترجمة) يحدث عندما تُقرأ شيفرة mRNA وتُربط الأحماض الأمينية في سلسلة واحدة.\nابحث عن العضية الصغيرة المكوّنة من rRNA وبروتينات التي تقوم بهذا العمل، ولا تخلط بينها وبين عضيات وظيفتها الهضم أو إنتاج الطاقة أو الانقسام.", "المجهر الذي يعطي صورة ثلاثية الأبعاد للعينات الكبيرة نسبياً:": "الصورة المجسّمة تنتج عن النظر إلى الجسم من زاويتين مختلفتين قليلاً، وهو ما يتيحه مجهر له عينيتان، ويعتمد على الضوء المنعكس عن سطح الجسم.\nهذا النوع يفحص أجساماً كاملة وسميكة بتكبير منخفض، بخلاف المجهر الذي يمرّر الضوء عبر شريحة رقيقة جداً. اربط ذلك بأنواع المجاهر في الخيارات.", "يتكون كل مريكز من:": "المريكز تركيب أسطواني صغير يشارك في تكوين خيوط المغزل أثناء الانقسام، ويتألف من أنيبيبات دقيقة مرتبة في مجموعات متكررة حول محيطه.\nارجع إلى الرسم المقطعي في كتابك: كم مجموعة حول المحيط؟ وكم أنيبيباً في كل مجموعة؟ تحقق أن الخيار الذي تختاره يطابق الترتيب كاملاً.", "مجهر عدسته العينية 10× والشيئية 40×، التكبير الكلي:": "التكبير الكلي للمجهر = تكبير العدسة العينية × تكبير العدسة الشيئية.\nاكتب القيمتين من السؤال واضربهما معاً. تذكّر أن العدسة العينية هي التي تنظر من خلالها، وأن الشيئية قريبة من الشريحة.", "الفرق في السكر بين DNA وRNA:": "الحرف الأول من اسم كل حمض نووي يدل على نوع السكر الخماسي فيه، فتأمّل الاسمين كاملين: ديوكسي ريبو نيوكلييك أسيد، وريبو نيوكلييك أسيد.\nالبادئة ديوكسي تعني منقوص الأكسجين. اربط كل اسم بنوع السكر في حمضه، ثم طابق ذلك مع الخيارات.", "الترتيب الصحيح لتنظيم المادة الوراثية من الأصغر:": "ابدأ من أصغر مستوى وهو الجزيء الحامل للشيفرة الوراثية نفسه، وانتهِ بأعلى مستويات الإحكام وهو التركيب الذي يظهر واضحاً أثناء الانقسام.\nفي الوسط يلتف الخيط الوراثي حول بروتينات الهستون فتتكوّن وحدات متكررة تشبه الخرز، ثم تلتف وتتكاثف هذه الوحدات في ألياف. رتّب هذه المراحل من الأقل إحكاماً إلى الأكثر.", "حوّل 5 كم و600 ملم و200 سم إلى المتر.": "ثلاث مسائل تحويل إلى المتر، ولكل منها بادئتها. راجع قاعدة التحويل والأمثلة التي تليها في درس البادئات.\nعند التحويل إلى الوحدة الأساسية نضرب في قيمة البادئة. حوّل كل قياس وحده، ثم اجمع النواتج بعد أن تصبح كلها بالمتر.", "حوّل 45 سم إلى المتر.": "السنتيمتر جزء من مئة من المتر، أي أن المتر الواحد يحوي مئة سنتيمتر.\nعند التحويل من وحدة أصغر إلى وحدة أكبر نقسم على عدد الوحدات الصغيرة التي في الكبيرة. طبّق ذلك ثم تأكد أن الناتج أصغر من العدد الأصلي.", "حوّل 108 كم/س إلى م/ث.": "التحويل هنا فيه وحدتان: وحدة الطول ووحدة الزمن، فحوّل كلاً منهما على حدة.\nراجع قسم تحويل الوحدات المركبة، وفكّر: كم متراً في الكيلومتر؟ وكم ثانية في الساعة؟ ثم ضع الرقمين في الموضع الصحيح من الكسر.", "حوّل 72 كم/س إلى م/ث.": "هذا تحويل من كم/س إلى م/ث: الكيلومتر يتحول إلى أمتار، والساعة إلى ثوانٍ.\nيمكنك أن تجمع التحويلين في عامل واحد ثابت تضرب به أو تقسم عليه كلما انتقلت بين الوحدتين. استنتجه أولاً من الكيلومتر = ألف متر والساعة = 3600 ثانية، ثم طبّقه.\nتحقق أخيراً: السرعة بوحدة م/ث تأتي عددياً أصغر من السرعة بوحدة كم/س.", "كم ثانية في اليوم الواحد؟": "فكّر في الزمن بسلسلة من الوحدات: يوم، ثم ساعة، ثم دقيقة، ثم ثانية.\nراجع فقرة الزمن في درس التحويل، واكتب كم وحدة صغرى في كل وحدة أكبر، ثم اضرب الأعداد بالتسلسل. اعرض الخطوات في إجابتك، لا الناتج وحده.", "حوّل 3 غم/سم³ إلى كغم/م³.": "الكثافة وحدتها مركبة: وحدة كتلة فوق وحدة حجم، فحوّل كل واحدة بمفردها.\nراجع قسم تحويل الوحدات المركبة، وستجد مثالاً مشابهاً تماماً. انتبه إلى أن السنتيمتر المكعب يحتاج إلى رفع قيمة البادئة إلى القوة المناسبة للحجم، وليس إلى قوة واحدة فقط.", "ورنية: التدريج الرئيسي 2.4 سم، والخط المنطبق رقم 2، ودقة الورنية 0.01 سم. احسب القراءة.": "قراءة الورنية = القراءة على التدريج الرئيسي + (رقم الخط المنطبق × دقة الورنية).\nالجزء الثاني هو ما تضيفه الورنية من كسور صغيرة، فاحسبه أولاً ثم أضفه إلى قراءة التدريج الرئيسي.\nاحرص على أن تكون الوحدة واحدة في الحدين، وتحقق أن الناتج النهائي أكبر قليلاً من قراءة التدريج الرئيسي.", "ورنية: التدريج الرئيسي 3.1 سم، والخط المنطبق رقم 7، ودقة الورنية 0.01 سم. احسب القراءة.": "تذكّر قاعدة الورنية: القراءة = التدريج الرئيسي + (رقم الخط المنطبق × الدقة).\nنفّذ الضرب أولاً لتعرف ما أضافته الورنية، ثم اجمعه مع القراءة الرئيسية.\nتأكد أن الإضافة أصغر من أصغر تقسيم على التدريج الرئيسي.", "ميكرومتر: التدريج الثابت 9 ملم، والدائري 44، والدقة 0.01 ملم. احسب القراءة.": "في الميكرومتر: القراءة = التدريج الثابت + (قراءة التدريج الدائري × الدقة).\nاحسب مساهمة التدريج الدائري أولاً (عدد الأقسام × قيمة القسم الواحد)، ثم أضفها إلى قراءة التدريج الثابت.\nلاحظ أن الوحدة هنا بالملّيمتر في الحدين.", "ميكرومتر: التدريج الثابت 5.5 ملم، والدائري 28 قسماً. احسب القراءة.": "الميكرومتر المعتاد دقته جزء من مئة من الملّيمتر، أي أن كل قسم على التدريج الدائري يساوي هذه القيمة.\nثم القراءة = التدريج الثابت + (عدد الأقسام على الدائري × قيمة القسم الواحد).\nاحسب الجزء الدائري أولاً ثم اجمع.", "قياس قطر سلك بالميكرومتر: الثابت 1.5 ملم والدائري 36. ما القطر بالملم؟": "القطر يُقرأ بالميكرومتر هكذا: القراءة = التدريج الثابت + (التدريج الدائري × الدقة).\nدقة الميكرومتر المعتاد جزء من مئة من الملّيمتر. حوّل قراءة الدائري إلى ملّيمترات بضربها في الدقة، ثم أضفها إلى الثابت.\nالناتج بالملّيمتر كما طُلب، فلا حاجة لأي تحويل آخر.", "إذا كان 1 سم يمثل 10 م، فكم سنتيمتراً تمثل 100 م؟": "مسألة مقياس رسم: الدرس يحوي مثالاً مشابهاً. اقرأه وافهم العلاقة بين الطول على الورقة والمسافة الحقيقية.\nاحسب كم مرة تتسع قيمة السنتيمتر الواحد في المسافة المعطاة، ثم اكتب الخطوة بجملة واضحة وأتبعها بالناتج مع وحدته.", "إذا كان 1 سم يمثل 50 م، فكم سنتيمتراً تمثل 250 م؟": "في الرسم بمقياس، كل سنتيمتر يمثل مسافة حقيقية ثابتة.\nعدد سنتيمترات الرسم = المسافة الحقيقية ÷ ما يمثله السنتيمتر الواحد.\nطبّق القسمة وتأكد أن الوحدتين المقسوم والمقسوم عليه متماثلتان (متر على متر).", "رُسم متجه طوله 3 سم بمقياس 1 سم = 20 م. كم مقدار الكمية التي يمثلها بالمتر؟": "هنا نعكس العملية: نعرف طول الرسم ونريد الكمية الحقيقية.\nالكمية الحقيقية = طول الرسم بالسنتيمتر × ما يمثله السنتيمتر الواحد.\nاضرب وانتبه لوحدة الناتج، فهي وحدة الكمية التي يمثلها السنتيمتر الواحد.", "سيارة إزاحتها 120 م خلال 20 ث. ما سرعتها المتوسطة؟": "السرعة المتوسطة = الإزاحة ÷ الزمن الذي استغرقته.\nحدّد في المسألة أي القيمتين هي الإزاحة وأيهما الزمن، ثم اقسم.\nوحدة الناتج تأتي من وحدة الإزاحة مقسومة على وحدة الزمن.", "دراجة تتحرك بسرعة ثابتة 15 م/ث لمدة 8 ث. ما إزاحتها؟": "عندما تكون السرعة ثابتة فإن الإزاحة = السرعة × الزمن.\nفكّر: السرعة تعني ما يقطعه الجسم في كل ثانية، فماذا يحدث إذا استمر ذلك عدة ثوانٍ؟\nاضرب وتحقق أن الوحدة هي المتر.", "تغيرت سرعة جسم من 4 م/ث إلى 16 م/ث خلال 3 ث. ما تسارعه المتوسط؟": "التسارع المتوسط = التغير في السرعة ÷ الزمن، والتغير في السرعة = السرعة النهائية − السرعة الابتدائية.\nاحسب التغير أولاً (الأخيرة ناقص الأولى)، ثم اقسمه على الزمن.\nوحدة التسارع م/ث²: لأن السرعة تتغير بمقدار معين في كل ثانية.", "جسم يبدأ من السكون بتسارع 2 م/ث². ما سرعته بعد 6 ث؟": "معادلة السرعة بالتسارع الثابت: ع = ع₀ + ت × ز.\nاسأل نفسك: ماذا تساوي السرعة الابتدائية لجسم يبدأ من السكون؟ ثم احسب ما يضيفه التسارع في الزمن المعطى.\nعوّض بنفسك واحسب.", "جسم يتحرك على دائرة نصف قطرها 5 م، فأتم دورة كاملة. ما المسافة المقطوعة؟ (π = 3.14)": "عند إتمام دورة كاملة تكون المسافة المقطوعة مساوية لمحيط الدائرة.\nمحيط الدائرة = 2 × π × نق.\nعوّض نصف القطر وقيمة π المعطاة واحسب، ولا تخلط بين نصف القطر والقطر.", "في الدورة الكاملة على الدائرة، ما مقدار الإزاحة؟": "الإزاحة هي الفرق بين نقطة البداية ونقطة النهاية مع الاتجاه، ولا تهتم بالمسار الذي سلكه الجسم.\nبعد دورة كاملة على الدائرة، قارن موضع الجسم النهائي بموضعه عند البداية. ماذا تلاحظ؟\nمن ذلك تستنتج مقدار الإزاحة.", "ما وزن جسم كتلته 5 كغم؟ (جـ = 10 م/ث²)": "الوزن قوة جذب الأرض للجسم، ويُحسب بالقانون: الوزن = الكتلة × تسارع الجاذبية.\nوحدة الوزن النيوتن لأنه قوة، أما الكتلة فبالكيلوغرام.\nعوّض الكتلة وقيمة جـ المعطاة في القانون.", "قوة محصلة 30 نيوتن تؤثر في جسم كتلته 6 كغم. ما تسارعه؟": "قانون نيوتن الثاني: القوة المحصلة = الكتلة × التسارع.\nالمطلوب التسارع، فأعد ترتيب القانون: التسارع = القوة ÷ الكتلة.\nعوّض القيمتين واحسب، وتذكّر أن وحدة الناتج م/ث².", "جسم كتلته 4 كغم يتسارع 3 م/ث². ما القوة المحصلة المؤثرة فيه؟": "استعمل قانون نيوتن الثاني: القوة المحصلة = الكتلة × التسارع.\nالكتلة والتسارع معطيان، فلا حاجة لإعادة ترتيب القانون.\nاضرب وانتبه أن وحدة القوة النيوتن.", "ما التردد لجسم زمنه الدوري 0.5 ث؟": "التردد والزمن الدوري مقلوب أحدهما الآخر: التردد = 1 ÷ الزمن الدوري.\nالزمن الدوري هو زمن دورة واحدة، والتردد هو عدد الدورات في الثانية الواحدة، ووحدته الهرتز.\nاقسم 1 على الزمن الدوري المعطى، وتحقق: إذا كان الزمن الدوري أقل من ثانية فالتردد يزيد على 1.", "القوة المركزية لجسم كتلته 2 كغم يدور بسرعة 3 م/ث على دائرة نصف قطرها 1.5 م؟": "القوة المركزية = الكتلة × مربع السرعة ÷ نصف القطر.\nانتبه إلى التربيع: يقع على السرعة وحدها، فربّعها أولاً ثم اضرب في الكتلة، وأخيراً اقسم على نصف القطر.\nنفّذ الخطوات بالترتيب، ووحدة الناتج نيوتن.", "الزمن الدوري لجسم يدور بسرعة 4 م/ث على دائرة نصف قطرها 2 م؟ (π = 3.14)": "الزمن الدوري هو زمن دورة كاملة واحدة، والجسم يقطع في الدورة الواحدة محيط الدائرة.\nتذكّر أن المحيط = 2π نق، وأن الزمن = المسافة ÷ السرعة، فاجمع الفكرتين في قانون واحد للزمن الدوري ن بدلالة نق وع.\nعوّض بالقيم المعطاة (وانتبه لقيمة π المطلوبة) ثم احسب. أنت قادر!", "قوة عمودية 200 نيوتن على مساحة 0.5 م². ما الضغط؟": "الضغط يقيس مقدار القوة العمودية الواقعة على كل وحدة مساحة: الضغط = القوة ÷ المساحة.\nتأكد أن وحدتي القوة والمساحة هما النيوتن والمتر المربع، فتكون وحدة الناتج الباسكال.\nعوّض واقسم بحذر، فالقسمة على عدد أصغر من الواحد تعطي ناتجاً أكبر.", "ما الضغط الناتج عن عمود ماء ارتفاعه 3 م؟ (ث = 1000 كغم/م³، جـ = 10)": "ضغط عمود السائل لا يتوقف على شكل الوعاء، بل على كثافة السائل وعمق النقطة وتسارع الجاذبية: ض = ث × ل × جـ.\nالمطلوب هنا الضغط الناتج عن العمود وحده، فلا تضف إليه ضغط الهواء.\nعوّض القيم المعطاة بوحداتها (كغم/م³ ثم م ثم م/ث²) واضرب، وستحصل على الباسكال.", "ما كثافة جسم كتلته 2 كغم وحجمه 0.001 م³؟": "الكثافة تعبّر عن مقدار الكتلة الموجودة في وحدة الحجم: الكثافة = الكتلة ÷ الحجم.\nتحقق أن الكتلة بالكيلوغرام والحجم بالمتر المكعب، فتأتي الكثافة بوحدة كغم/م³.\nاقسم بعناية، وانتبه لمنزلة الفاصلة العشرية في الحجم.", "مكبس هيدروليكي: أ₁ = 0.02 م²، أ₂ = 0.4 م²، ق₁ = 50 نيوتن. ما ق₂؟": "مبدأ باسكال: الضغط المنتقل في سائل محبوس ينتقل كاملاً إلى جميع أجزائه، فالضغط عند المكبس الأول يساوي الضغط عند المكبس الثاني.\nوبما أن الضغط = القوة ÷ المساحة فإن ق₁ ÷ أ₁ = ق₂ ÷ أ₂.\nأعد ترتيب العلاقة لتعزل ق₂ ثم عوّض بالقيم. ما الذي يحدث للقوة حين تكبر المساحة؟ فكّر في ذلك لتتأكد من منطقية ناتجك.", "تفاعل 12 غم كربون مع 32 غم أكسجين. ما كتلة CO₂ الناتج؟": "قانون حفظ الكتلة: مجموع كتل المتفاعلات يساوي مجموع كتل النواتج، فالمادة لا تفنى ولا تُستحدث في التفاعل الكيميائي.\nهنا تفاعلت مادتان وناتج التفاعل مادة واحدة، فكتلتها تساوي مجموع كتلتي المتفاعلين.\nاجمع الكتلتين واكتب الناتج بالغرام.", "تفاعل 32 غم ميثان مع أكسجين فنتج 44 غم CO₂ و18 غم ماء. ما كتلة الأكسجين المستهلكة؟": "نطبق قانون حفظ الكتلة: كتلة المتفاعلات كلها = كتلة النواتج كلها.\nاجمع كتل النواتج المعطاة، واجمع كتل المتفاعلات (المجهول هو كتلة الأكسجين المستهلكة)، ثم ساوِ بين المجموعين.\nحلّ المعادلة لتجد المجهول. ستنجح!", "ما النسبة المئوية الكتلية للهيدروجين في الماء H₂O؟ (H = 1، O = 16)": "النسبة المئوية الكتلية للعنصر = (كتلة العنصر في الصيغة ÷ الكتلة الكلية للمركب) × 100.\nاحسب أولاً الكتلة المولية للمركب بجمع كتل الذرات كلها، وانتبه للرقم الصغير أسفل الرمز فهو عدد ذرات العنصر.\nثم خذ كتلة ذرات الهيدروجين وحدها في الصيغة واقسمها على الكتلة الكلية واضرب في مئة.", "ما النسبة المئوية الكتلية للأكسجين في الماء H₂O؟": "النسبة المئوية الكتلية للعنصر = (كتلة العنصر في الصيغة ÷ الكتلة الكلية للمركب) × 100.\nاحسب الكتلة المولية للماء من كتل ذراته (راجع الجدول الدوري لكتلتي H وO)، ثم خذ كتلة ذرة الأكسجين وحدها.\nفكّر: إذا عرفت نسبة الهيدروجين في الماء فكم يجب أن يكون مجموع النسبتين؟ استعمل ذلك للتحقق من إجابتك.", "ما النسبة المئوية الكتلية للنيتروجين في الأمونيا NH₃؟ (N = 14، H = 1)": "النسبة المئوية الكتلية للعنصر = (كتلة العنصر في الصيغة ÷ الكتلة الكلية للمركب) × 100.\nاجمع كتل الذرات في NH₃ مراعياً الرقم الصغير بعد H فهو يضاعف كتلة الهيدروجين، ثم خذ كتلة النيتروجين فقط.\nاقسم واضرب في مئة، وقرّب الناتج إلى منزلة عشرية واحدة.", "في عينات سكر: نسبة الكربون 42% والهيدروجين 6.5%. ما نسبة الأكسجين؟": "مجموع النسب المئوية لجميع العناصر في المركب النقي يساوي 100%.\nما دام السكر مكوناً من الكربون والهيدروجين والأكسجين فقط، فنسبة الأكسجين هي ما تبقّى بعد طرح النسبتين المعلومتين من 100.\nاجمع النسبتين أولاً ثم اطرحهما من المئة.", "ما الكتلة المولية لثاني أكسيد الكربون CO₂؟ (C = 12، O = 16)": "الكتلة المولية للمركب هي مجموع الكتل الذرية لكل الذرات في صيغته، وتُقاس بوحدة غم/مول.\nانظر إلى الرقم الصغير أسفل رمز كل عنصر في CO₂ فهو يخبرك كم ذرة منه في الجزيء.\nاضرب كتلة كل عنصر في عدد ذراته ثم اجمع.", "كم مولاً في 36 غم من الماء؟ (الكتلة المولية 18 غم/مول)": "عدد الموالت = الكتلة ÷ الكتلة المولية.\nالكتلة المولية معطاة لك، فلا تحتاج إلا إلى القسمة، وتحقق أن وحدة الغرام تُختصر فيبقى الناتج بوحدة المول.\nعوّض وأوجد عدد الموالت.", "ما كتلة 0.5 مول من CaCO₃؟ (الكتلة المولية 100 غم/مول)": "الكتلة = عدد الموالت × الكتلة المولية، وهي إعادة ترتيب لقانون عدد الموالت.\nتأكد أن وحدة مول تُختصر مع مول في المقام فيبقى الغرام.\nعوّض القيمتين المعطاتين واضرب.", "ما حجم 2 مول من غاز عند الظروف المعيارية STP؟": "عند الظروف المعيارية STP يشغل المول الواحد من أي غاز حجماً ثابتاً هو 22.4 لتراً.\nإذن الحجم = عدد الموالت × حجم المول الواحد.\nاضرب عدد الموالت المعطى في هذا الحجم ثم اكتب الوحدة باللتر.", "كم ذرة في 0.25 مول من الحديد؟ (أعطِ الناتج بوحدة ×10²³ ذرة)": "المول الواحد من أي مادة يحتوي على عدد أفوجادرو من الجسيمات، وهو يساوي تقريباً 6.02 × 10²³.\nعدد الذرات = عدد الموالت × عدد أفوجادرو.\nاضرب العدد العشري في 6.02 وأبقِ القوة 10²³ كما هي، وقرّب الناتج كما يطلب السؤال.", "ما كتلة 11.2 لتر من غاز O₂ عند STP؟ (O = 16)": "الكتلة لا تُحسب من الحجم مباشرة، فالجسر بينهما هو المول: حجم الغاز ← عدد الموالت ← الكتلة.\nأولاً: عدد الموالت = الحجم ÷ 22.4 عند STP. ثانياً: الكتلة = الموالت × الكتلة المولية.\nانتبه أن الأكسجين الغازي جزيء ثنائي الذرة O₂، فكتلته المولية ضعف كتلة ذرة O.", "في التفاعل 5O₂ + 4NH₃ → 4NO + 6H₂O: كم مولاً من NO يتكون من 2 مول NH₃؟": "معاملات المعادلة الموزونة تعبّر عن النسبة بين الموالت: عدد موالت المادة الأولى إلى عدد موالت الثانية يساوي النسبة بين معاملَيهما.\nحدّد معامل NH₃ ومعامل NO في المعادلة، وكوّن النسبة بينهما.\nثم اضرب عدد الموالت المعلوم في النسبة (معامل المطلوب ÷ معامل المعلوم).", "2H₂ + O₂ → 2H₂O: ما كتلة الماء الناتجة من 4 غم H₂؟ (H₂ = 2، H₂O = 18)": "المسألة تتطلب المرور بالمول: الكتلة المعلومة ← موالت H₂ ← موالت H₂O ← كتلة H₂O.\nحوّل الكتلة إلى موالت بالقسمة على الكتلة المولية، ثم استعمل معاملَي H₂ وH₂O في المعادلة الموزونة لإيجاد موالت الماء.\nأخيراً حوّل الموالت إلى كتلة بالضرب في الكتلة المولية للماء.", "N₂ + 3H₂ → 2NH₃: ما حجم NH₃ الناتج من 10 لتر N₂ (نفس الظروف)؟": "للغازات في الظروف نفسها من ضغط ودرجة حرارة تكون نسبة الحجوم مساوية لنسبة الموالت، أي لنسبة المعاملات في المعادلة الموزونة.\nحدّد معاملي N₂ وNH₃ وكوّن منهما النسبة.\nاضرب الحجم المعلوم في (معامل المطلوب ÷ معامل المعلوم). لا حاجة هنا إلى تحويل الحجم إلى موالت.", "CaCO₃ → CaO + CO₂: ما كتلة CO₂ الناتجة من تحلل 50 غم CaCO₃؟ (CaCO₃ = 100، CO₂ = 44)": "هذه مسألة كتلة ← كتلة، ولا يمكن الانتقال من مادة لأخرى إلا عبر المول.\nالخطوات: موالت CaCO₃ = الكتلة ÷ الكتلة المولية، ثم استعمل نسبة المعاملات بين CaCO₃ وCO₂ في المعادلة، ثم الكتلة = الموالت × الكتلة المولية لـ CO₂.\nلاحظ المعاملين في المعادلة قبل أن تبدأ.", "5O₂ + 4NH₃ → 4NO + 6H₂O: ما كتلة O₂ اللازمة لتفاعل 17 غم NH₃؟ (NH₃ = 17، O₂ = 32)": "هذه مسألة كتلة ← كتلة، والجسر بين المادتين هو المول.\nحوّل كتلة NH₃ إلى موالت بالقسمة على كتلته المولية، ثم اضرب في نسبة معاملي O₂ وNH₃ من المعادلة الموزونة (معامل المطلوب ÷ معامل المعلوم)، ثم حوّل موالت O₂ إلى كتلة بالضرب في كتلته المولية.\nانتبه ألا تعكس النسبة. أحسنت التفكير!", "محتوى النواتج الحراري −300 كيلوجول والمتفاعلات −100. احسب ΔH.": "التغير في المحتوى الحراري: ΔH = H(النواتج) − H(المتفاعلات).\nالإشارة تدل على نوع التفاعل: إن كانت ΔH سالبة فالتفاعل طارد للحرارة، وإن كانت موجبة فهو ماص.\nانتبه عند طرح عدد سالب فهو يتحول إلى جمع، ثم احسب.", "محتوى النواتج 150 كيلوجول والمتفاعلات 90. احسب ΔH.": "التغير في المحتوى الحراري: ΔH = H(النواتج) − H(المتفاعلات).\nاطرح بالترتيب الصحيح، النواتج أولاً ثم المتفاعلات، ولا تعكسه.\nبعد الحساب انظر إلى إشارة الناتج: الموجبة تعني تفاعلاً ماصاً والسالبة تعني تفاعلاً طارداً للحرارة.", "عرّف الفيزياء والقياس والكمية الفيزيائية.": "المطلوب ثلاثة تعريفات، فرتّبها في ثلاث جمل قصيرة، لكل مصطلح جملة.\nراجع بداية الدرس: ستجد الفيزياء موصوفة بما تدرسه، والقياس موصوفاً بما نفعله عند المقارنة، والكمية الفيزيائية موصوفة بما يمكن عمله بها. اكتب كل تعريف بكلماتك دون أن تكتفي بنقل الجملة.", "لماذا توجد وحدات للقياس؟": "السؤال عن الغرض من الوحدات، لا عن أنواعها. تخيّل أن شخصين قاسا طول الغرفة، أحدهما بخطواته والآخر بخطوات صديقه.\nفكّر: ماذا سيحدث عند مقارنة النتيجتين؟ ثم ارجع إلى الفقرة التي تشرح مواصفات الوحدة المناسبة والعبارة المميّزة بعد تعريف القياس، واربط ما فيها بفكرة المقارنة.", "قارن بين النظام الدولي والنظام الأمريكي في وحدات الطول والكتلة والزمن.": "هذا سؤال مقارنة، لذلك أنشئ جدولاً صغيراً في ذهنك أو على ورقتك بثلاثة صفوف: الطول، والكتلة، والزمن.\nراجع الجدول في فقرة أنظمة القياس، وانتبه إلى كمية يتفق فيها النظامان. اكتب إجابتك جملةً لكل كمية، مع ذكر اسم النظامين بوضوح.", "ما أشهر أنظمة القياس؟ وأيها الأكثر انتشاراً؟": "السؤال له جزءان: الأول سرد للأنظمة، والثاني تحديد الأكثر انتشاراً.\nراجع فقرة أنظمة القياس، وانتبه إلى أن لكل نظام وحدات الطول والكتلة والزمن الخاصة به. رتّب إجابتك بذكر كل نظام مع وحداته، ثم اختم بجملة تبيّن أيها يُستعمل أكثر في العلوم الحديثة.", "ما الكميات الأساسية السبع ووحداتها؟": "عدد الكميات الأساسية مذكور في السؤال، ولكل كمية وحدتها. راجع الجدول في بداية درس الكميات الأساسية والمشتقة.\nاكتب إجابتك كأزواج، كمية ثم وحدتها، ولا تنسَ أن بعض الوحدات لها رمز بجانب اسمها. بعد الكتابة عُدّ ما كتبت لتتأكد أنه يطابق العدد المطلوب.", "ما الفرق بين الكمية الأساسية والكمية المشتقة؟": "ابدأ بسؤال نفسك: هل يمكن بناء هذه الكمية من كميات أخرى؟ هذا هو معيار التمييز بين النوعين.\nعرّف الأساسية بهذا المعيار، ثم عرّف المشتقة بما تُشتق منه. وأيّد كلامك بمثال من كل نوع يوضحه، وستجد أمثلتك في جدولي الدرس.", "اشتق وحدة السرعة بالنظام الدولي.": "الاشتقاق يبدأ من العلاقة التي تعرّف الكمية. راجع جدول الكميات المشتقة لتعرف علاقة السرعة بالمسافة والزمن.\nثم عوّض بوحدة كل كمية في هذه العلاقة، مع الانتباه إلى أن الوحدات تُعامل كما تُعامل الأرقام في القسمة. اكتب العلاقة أولاً، ثم التعويض، ثم الوحدة الناتجة.", "اشتق وحدة القوة (النيوتن) ووحدة الضغط (الباسكال).": "السؤال يطلب وحدتين، فاشتق كل واحدة على حدة بالخطوات نفسها: العلاقة ثم التعويض ثم الوحدة الناتجة.\nراجع الجدول لتعرف علاقة القوة بالكتلة والتسارع، وتذكّر أن وحدة التسارع مشتقة أيضاً. والضغط مرتبط بالقوة، فاستعمل وحدة القوة التي وجدتها في اشتقاقه. وبعدها اذكر الاسم الخاص بكل وحدة.", "ما قيمة كل من: كيلو، ميغا، غيغا، ملي، مايكرو، نانو؟": "ستجد جدول البادئات في بداية الدرس، وفيه لكل بادئة رمز وقيمة. المطلوب هنا قيمة ست بادئات.\nاكتب كل بادئة مع قيمتها على صورة قوة للعدد 10، وانتبه إلى أيها يكبّر الوحدة وأيها يصغّرها، فهذا يظهر من إشارة الأس.", "ما الذي تقيسه الورنية؟": "الورنية أداة محددة الاستعمال، وفي الدرس فقرة تذكر ما تقيسه. ارجع إلى بداية فقرة الورنية.\nلاحظ أن الأمثلة المذكورة تشمل أبعاداً خارجية وأخرى داخلية. اكتب ما تقيسه الورنية، وبيّن لماذا تفضّلها عن المسطرة.", "كيف نحسب القراءة النهائية للورنية؟": "القراءة النهائية تتكون من جزأين يُجمعان. راجع الصيغة المميّزة في فقرة الورنية، وانظر ما الذي يُقرأ من كل تدريج.\nرتّب إجابتك بذكر الجزء الأول، ثم الجزء الثاني وكيف يُحسب، ثم الجمع. ويمكنك تدعيم الشرح بمثال عددي من الدرس.", "ما دقة الميكرومتر؟ وكيف نحسب قراءته؟": "السؤال له جزءان: دقة الميكرومتر أولاً، ثم طريقة القراءة.\nدقته مذكورة في تعريفه. وللقراءة راجع الصيغة المميّزة في فقرة الميكرومتر، وانتبه إلى أن الميكرومتر له تدريجان، واحد ثابت وآخر دائري. اذكر ما يُقرأ من كل واحد ثم كيف يُجمعان.", "التدريج الرئيسي 2.4 سم والخط المنطبق 2 ودقة الورنية 0.01 سم، احسب القراءة.": "طبّق صيغة قراءة الورنية الموجودة في الدرس على الأرقام المعطاة. المثال المحلول في الدرس يشبه المسألة كثيراً.\nاحسب أولاً الجزء الذي يأتي من التدريج المتحرك، ثم أضفه إلى قراءة التدريج الرئيسي. اكتب خطوات الحل ولا تنسَ الوحدة في النهاية.", "إلى ماذا تنقسم الكميات الفيزيائية؟": "الدرس يذكر في أول فقرة تحت عنوان الكميات الفيزيائية نوعين تنقسم إليهما الكميات.\nاكتب اسم النوعين، ويمكنك إضافة جملة قصيرة عن الفكرة التي يقوم عليها التقسيم، وهي حاجة الكمية إلى الاتجاه أو عدم حاجتها.", "ماذا نحتاج لوصف كتلة جسم 20 كغم؟": "اسأل نفسك: لو قلت لزميلك إن كتلة الجسم كذا، فهل يحتاج أن يسألك إلى أين؟\nراجع السؤال الأول في فقرة الكميات الفيزيائية، وحدّد العناصر التي تكفي لوصف هذه الكمية. ثم بيّن في جملة لماذا لا تحتاج إلى عنصر إضافي.", "ماذا نحتاج لوصف سرعة سيارة 20 كم/ساعة؟ ولماذا؟": "تتبّع مثال السيارة في الدرس. هناك عنصر ثالث يظهر في الوصف لا يحتاجه وصف الكتلة.\nاذكر ما نحتاجه لوصف هذه السرعة، ثم علّل: ماذا يحدث لو حذفنا هذا العنصر؟ هل تتغير الصورة التي تتكوّن لدى من يسمع الوصف؟", "ما الفرق بين الكمية القياسية والكمية المتجهة؟": "قارن بين النوعين من حيث العناصر اللازمة لتحديد كل منهما، وهي مذكورة في الصيغتين المميّزتين في فقرتي الكميات القياسية والكميات المتجهة.\nرتّب إجابتك بتعريف الأولى وما تحتاجه، ثم تعريف الثانية وما تحتاجه، ثم اختم بالفرق بينهما.", "اذكر ثلاثة أمثلة على كميات قياسية وثلاثة على كميات متجهة.": "ثلاثة أمثلة لكل نوع، وأمثلة الدرس مذكورة تحت كل نوع.\nإن اخترت من عندك فاختبر كل مثال بسؤال: هل يكتمل وصفه بالمقدار والوحدة فقط؟ وانتبه إلى أن بعض الكميات المتجهة لها شقيق قياسي قريب منها في الاسم، فلا تخلط بين الشقيقين.", "ما المتجه؟ وكيف يُرسم؟": "السؤال له جزءان: ما المتجه، وكيف يُرسم.\nعرّف المتجه بأنه شكل هندسي يمثل نوعاً معيناً من الكميات، ثم راجع فقرة المتجه لتعرف ما الذي يمثله طوله وما الذي يمثله اتجاه السهم. رتّب إجابتك بالتعريف ثم خطوات الرسم.", "ما المقصود بذيل المتجه ورأسه؟": "ارسم سهماً على ورقتك وسمِّ طرفيه. راجع أول فقرة في درس تمثيل المتجه.\nثم عرّف الذيل واذكر موقعه من السهم، وافعل الأمر نفسه مع الرأس. جملة لكل طرف تكفي.", "لماذا نحتاج إلى نقطة إسناد؟": "فكّر في طريقة وصف موقع جسم: هل نقول إنه بعيد 5 م فقط؟ ماذا ينقصنا لنحدد موضعه؟\nراجع فقرة نقطة الإسناد والاتجاهات، وبيّن ما الذي تُقاس منه المواقع، وكيف تساعدنا النقطة على وصف الاتجاه.", "اذكر الاتجاهات الثمانية وما الزاوية بين كل اتجاهين متجاورين؟": "السؤال له جزءان: سرد الاتجاهات الثمانية، وحساب الزاوية بين الاتجاهين المتجاورين.\nراجع فقرة نقطة الإسناد والاتجاهات، فهي تفصل الأصلية عن الفرعية. اذكر الأربعة الأصلية أولاً ثم الفرعية، وللزاوية انظر ما ذُكر في الدرس عن الاتجاهات الفرعية، وتأكد أنها تتسق مع دائرة كاملة من 360 درجة.", "ما المقصود بالدورة؟ وبالمجموعة؟": "المصطلحان من الجدول الدوري، ولكل منهما اتجاه خاص في الجدول. راجع الفقرة الأولى من الدرس.\nاسأل نفسك: أي اتجاه تمتد فيه الدورة، وأي اتجاه تمتد فيه المجموعة؟ ثم عرّف كل مصطلح بجملة تذكر اتجاهه وما يشترك فيه عناصره.", "عرّف العدد الذري والعدد الكتلي.": "عرّف كل مصطلح على حدة، وانتبه إلى ما تعدّه كل منهما: بروتونات فقط، أم بروتونات وشيئاً آخر.\nراجع فقرة رمز العنصر، وانظر مكان كل رقم بالنسبة إلى الرمز. ويمكنك أن تضيف ما تساويه الشحنة في الذرة المتعادلة.", "ما مكونات الذرة وشحنة كل منها؟": "للذرة ثلاثة جسيمات أساسية، وقد رُتّبت في الدرس بحسب مكانها. راجع فقرة مكونات الذرة.\nاكتب كل جسيم مع موضعه وشحنته. وإن أضفت جملة عن شحنة الذرة المتعادلة ككل، فاربطها بعدد الجسيمات.", "ما فائدة التوزيع الإلكتروني؟": "الجملة التي تلي السؤال في فقرة التوزيع الإلكتروني فيها الجواب، لكن اكتبه بأسلوبك وأضف ما يتعلق بكل رقم يُستخلص منه.\nاسأل: ماذا نعرف عن العنصر حين نعرف عدد إلكتروناته في كل مستوى؟ وكيف نحدد الدورة وكيف نحدد المجموعة؟", "ما المقصود برقم الدورة ورقم المجموعة وإلكترونات التكافؤ؟": "ثلاثة مصطلحات، ولكل منها مصدر في التوزيع الإلكتروني. راجع فقرة التوزيع الإلكتروني.\nاسأل نفسك: أي جزء من التوزيع نعدّه لنعرف الدورة، وأي جزء نقرأه لنعرف المجموعة؟ ثم اذكر ما تسمّى به إلكترونات المستوى الأخير. جملة قصيرة لكل مصطلح تكفي.", "بمَ تصل الذرة إلى الاستقرار؟": "ارجع إلى فقرة قاعدة الثمانية والاستقرار. اسأل: ما حال المستوى الأخير في الذرة المستقرة؟\nاشرح الفكرة، ثم اذكر الطرق التي تتبعها الذرات لبلوغ هذه الحالة. يمكنك أن تدعّم إجابتك بمثال من الجدول الذي في الدرس.", "ما نوع المركبات التي يشكلها Na و Cl و Ne؟": "ابدأ بتوزيع كل عنصر من الجدول في فقرة الأمثلة. ثم اسأل نفسك: هل مستواه الأخير ممتلئ؟ وإن لم يكن فما سيفعل ليكتمل؟\nراجع فقرة أنواع المركبات، وهي تربط نوع الأيون بنوع المركب الذي يكوّنه. أجب عن العناصر الثلاثة واحداً واحداً، ولاحظ أن أحدها قد لا يكوّن مركبات أصلاً.", "كيف يتواجد الكالسيوم في الطبيعة؟": "السؤال عن حالة الكالسيوم في الطبيعة، حراً أم متحداً. راجع فقرة وجوده في الطبيعة وفقرة خصائصه.\nاذكر أين يوجد، ثم علّل بخاصية كيميائية عنده تفسر لماذا هو بهذه الحالة.", "اذكر أهم خامات الكالسيوم.": "الخامات مذكورة في فقرة محددة من الدرس، وبعضها يوجد في صخور القشرة الأرضية وواحد منها يوجد في مياه البحار.\nرتّبها بحسب مكان وجودها، واكتب اسم كل خامة مع صيغتها الكيميائية. وراجع كتابة الصيغ بدقة، فبعضها فيه ماء تبلور.", "علّل: يستخدم كلوريد الكالسيوم كمجفف.": "في التعليل ابدأ بالخاصية التي تجعل المركب مناسباً لهذا الاستخدام، ثم صل بينها وبين الاستخدام. راجع فقرة كلوريد الكالسيوم.\nاسأل: ماذا يفعل هذا المركب بالرطوبة المحيطة به؟ وما حاجة المجفف أصلاً؟ ثم رتّب إجابتك في جملتين: السبب ثم النتيجة.", "علّل: يطلي بعض المزارعين جذوع الأشجار بالجير المطفأ.": "الجير المطفأ مركب له اسم كيميائي، وطريقة تحضيره موجودة في فقرة أكسيد الكالسيوم. ابدأ بتحديد المادة التي نتكلم عنها.\nثم راجع فقرة الاستخدامات الحياتية لتعرف الفائدتين المذكورتين للمزارعين، ورتّب إجابتك بتسمية المادة ثم ذكر الفائدة.", "علّل: تعالج آثار المطر الحمضي في البحيرات بكربونات الكالسيوم.": "التعليل هنا يربط بين خاصية في المركب وبين مشكلة في البحيرة. ابدأ بسؤال: ما طبيعة المطر الحمضي؟ وما طبيعة هذا المركب؟\nراجع آخر نقطة في فقرة الاستخدامات الحياتية، ثم اشرح ماذا يحدث حين يلتقي الطرفان وماذا يحصل لتركيز الحمض.", "اكتب معادلة تفاعل الكالسيوم مع الماء.": "المعادلة تحتاج إلى متفاعلات ونواتج. المتفاعلان هما الكالسيوم والماء، والنواتج مذكورة في فقرة خصائص الكالسيوم.\nاكتب الصيغ الصحيحة أولاً، ثم زِن المعادلة بحيث يتساوى عدد كل ذرة في الطرفين. وتأكد من الهيدروجين والأكسجين خصوصاً.", "كيف يتواجد السيليكون في الطبيعة؟": "ابدأ بتذكر طبيعة هذا العنصر: هل يوجد حراً؟ راجع بداية الدرس عند السؤال عن وجوده في الطبيعة.\nاذكر الحالة التي يوجد بها، ثم سمِّ المركبين المذكورين، وتذكّر أن أحدهما معروف في الرمل. وإن شئت فاذكر ما يدخل فيه كل منهما من صناعات.", "حدّد موقع السيليكون واكتب توزيعه الإلكتروني.": "السؤال له جزءان: الموقع ثم التوزيع. راجع فقرة هوية عنصر السيليكون، فقد يكون الجواب مذكوراً بوضوح، لكن حاول أن تشتقه بنفسك.\nالعدد الذري يساوي عدد الإلكترونات في الذرة المتعادلة. وزّعها على المستويات بالترتيب، وعدد المستويات يعطيك الدورة، وعدد إلكترونات المستوى الأخير يعطيك المجموعة. ثم قارن ما وجدته بالدرس.", "لماذا يصنف السيليكون من أشباه الموصلات؟": "السؤال يطلب تعليل التصنيف، أي أن تربط خاصية السيليكون بتعريف شبه الموصل. راجع فقرة «أشباه الموصلات» في الدرس وانظر كيف تُقسَّم المواد بحسب موصليتها.\nفكّر: أين يقع السيليكون بين الموصل والعازل؟ وكيف يتصرف عند تغيّر الظروف؟ ابدأ بتعريف شبه الموصل ثم طبّقه على السيليكون.", "ما العامل المؤثر في مقاومة السيليكون للتيار الكهربائي؟": "السؤال عن عامل خارجي يغيّر موصلية السيليكون، فراجع الفقرة التي تتحدث عن مقاومته للتيار في قسم «أشباه الموصلات».\nانتبه إلى اتجاه العلاقة: ماذا يحدث للموصلية عند تغيّر هذا العامل؟ وماذا يعني ذلك بالنسبة للمقاومة؟ اكتب العامل ثم وضّح أثره بجملة قصيرة.", "علّل: يفيد السيليكون في التقنية والمعلوماتية.": "في أسئلة «علّل» اربط بين السبب والنتيجة. النتيجة هنا هي فائدة السيليكون في التقنية، والسبب شيء يدخل فيه السيليكون.\nراجع فقرة «أهميته» وفكّر: في صناعة أي أجهزة أو قطع إلكترونية يُستعمل؟ ثم رتّب إجابتك: السبب أولاً ثم أمثلة تدعمه.", "هل يمكن التعرف على أشباه الفلزات من توزيعها الإلكتروني؟ لا، لأن هناك عناصر عدد إلكترونات التكافؤ فيها 4 وليست أشباه فلزات.": "فكّر في العبارة المعطاة كفكرة تحتاج إلى تبرير: هل يكفي عدد إلكترونات التكافؤ وحده للحكم على العنصر؟\nراجع هوية السيليكون وخواصه الفيزيائية في الدرس، وانتبه إلى أن عدد إلكترونات التكافؤ قد يتشابه بين عناصر مختلفة في الخواص. اكتب رأيك ثم علّله بجملة واضحة.", "عرّف دلالات حدوث التفاعل الكيميائي واذكرها.": "السؤال من جزأين: تعريف ثم ذكر. ابدأ بجملة تشرح ما المقصود بالدلالة، ثم ارجع إلى فقرة «دلالات حدوث التفاعل الكيميائي» لتتذكر العلامات.\nلا تنسَ الملاحظة المهمة في نهاية الفقرة عن ظهور هذه الدلالات؛ ذكرها يُكمل إجابتك.", "ما المعادلة الموزونة؟": "اقرأ فقرة «المعادلة الموزونة» وركّز على ما يجب أن يتساوى في طرفي المعادلة.\nعرّفها بجملة واحدة دقيقة، ويمكنك أن تضيف ما تمثّله كل جهة من المعادلة. لاحظ أن المقصود هو عدد الذرات لا شيء آخر.", "زن: H₂ + O₂ → H₂O": "اتّبع خطوات وزن المعادلة في الدرس: احسب عدد ذرات كل عنصر في الطرفين وقارن بينهما.\nابدأ بالعنصر الأقل تكراراً، وغيّر المعاملات (الأرقام الكبيرة أمام الصيغ) ولا تغيّر الأرقام الصغيرة السفلية داخل الصيغة. تأكد في النهاية بإعادة العدّ.", "2H₂ + O₂ → 2H₂O": "المعادلة معطاة لك، فالمطلوب أن تتحقق من أنها موزونة وتشرح لماذا. اعدّ ذرات كل عنصر في الطرف الأيسر ثم الأيمن.\nتذكّر أن المعامل يضرب كل الذرات في الصيغة. قارن العددين لكل عنصر ثم اكتب النتيجة مع بيان العدّ.", "زن: N₂ + H₂ → NH₃": "طبّق خطوات وزن المعادلة: احسب ذرات النيتروجين والهيدروجين في كل طرف.\nابدأ بالعنصر الذي يظهر بأقل تكرار، ثم عدّل المعاملات لباقي العناصر. لا تغيّر الأرقام السفلية داخل الصيغ. تحقق في النهاية بإعادة عدّ الذرات.", "N₂ + 3H₂ → 2NH₃": "المعادلة معطاة، فاحكم هل هي موزونة. اعدّ ذرات النيتروجين وذرات الهيدروجين في الطرفين مع مراعاة أن المعامل يضرب الصيغة كلها.\nاكتب عدد ذرات كل عنصر في كل طرف، ثم قارن لتبرر حكمك.", "زن: Na + Cl₂ → NaCl": "طبّق خطوات وزن المعادلة من الدرس: اعدّ ذرات كل عنصر في طرفي المعادلة وقارن.\nلاحظ أن الكلور موجود على صورة جزيء ثنائي الذرة. غيّر المعاملات فقط، ثم أعد العدّ لتتأكد.", "2Na + Cl₂ → 2NaCl": "المعادلة معطاة، فتحقق من كونها موزونة. اعدّ ذرات الصوديوم والكلور في كل طرف، وانتبه إلى أن Cl₂ يحتوي ذرتين.\nاكتب العدّ لكل عنصر ثم قارن بين الطرفين لتبرر حكمك.", "اذكر نص قانون حفظ الكتلة.": "راجع فقرة «قانون حفظ الكتلة» في الدرس. النص يقارن بين كتلتين مرتبطتين بالتفاعل، ويحمل شرطاً مهماً يتعلق بنوع النظام.\nصُغ النص بأسلوبك دون أن تنسى هذا الشرط.", "ما المقصود بالنظام المغلق؟": "السؤال تعريف، وتجده في فقرة «قانون حفظ الكتلة». فكّر في معنى كلمة «مغلق»: ماذا يُسمح له بالدخول أو الخروج؟\nعرّفه بجملة واضحة، ويمكنك أن تضيف سبب أهمية هذا الشرط لصحة القانون.", "فكّر: احترقت قطعة خشب فنتج رماد كتلته أقل من كتلة الخشب، كيف يتفق ذلك مع قانون حفظ الكتلة؟ كتلة المواد الناتجة = كتلة الرماد + كتلة الغازات التي تطايرت.": "فكّر في ما حدث أثناء الاحتراق: هل بقيت كل المواد في مكانها؟ وأين ذهب ما لم يبقَ في الرماد؟\nارجع إلى قانون حفظ الكتلة وشرط النظام المغلق، وفكّر هل الاحتراق في الهواء المفتوح نظام مغلق أم لا. ثم وضّح كيف يظل القانون صحيحاً عند حساب جميع النواتج.", "اذكر نص قانون النسب الثابتة.": "راجع فقرة «قانون النسب الثابتة» في الدرس. النص يتحدث عن نسب كتل العناصر في المركب وعما لا يؤثر فيها.\nصُغ النص بأسلوبك، وفكّر في مثال المركب الذي قد تحضّره بطريقتين مختلفتين.", "احسب النسبة الكتلية لكل عنصر في الماء H₂O.": "ارجع إلى مثال الماء في فقرة «قانون النسب الثابتة»، وتتبّع خطواته بنفسك: كتلة الجزيء أولاً ثم كتلة كل عنصر فيه.\nانتبه إلى عدد ذرات كل عنصر في الصيغة H₂O، واقسم كتلة العنصر على كتلة الجزيء. تحقق أن المجموع يساوي 100%.", "هل تختلف خصائص الأمونيا الناتجة بالطريقتين؟ ولماذا؟": "ارجع إلى مثال الأمونيا في فقرة «قانون النسب الثابتة»، وتأمل طريقتي التحضير: هل المركب الناتج واحد أم مختلف؟\nاربط إجابتك بالقانون: ماذا يقول عن نسب العناصر مهما اختلفت طريقة التحضير؟ ابدأ بالحكم ثم اذكر السبب.", "من أول من اكتشف الخلية؟ ومن أول من شاهد الكائنات الحية الدقيقة؟": "السؤال من جزأين، فأجب عن كل منهما باسم عالم وما فعله. راجع فقرة «أهمية المجاهر» ففيها الاسمان.\nانتبه إلى الفرق بين من اكتشف الخلية ومن شاهد الكائنات الدقيقة، ولا تخلط بينهما. يمكنك ذكر ما رآه كل منهما.", "قارن بين المجهر المركب والمجهر التشريحي.": "المقارنة تحتاج وجوهاً محددة. راجع فقرة «أنواع المجاهر» وانظر ما يخص كل مجهر: نوع العينة المفحوصة، وطبيعة الصورة (الأبعاد)، واستعماله.\nرتّب إجابتك على شكل وجه مقارنة ثم ما يخص كل مجهر، مع ذكر ما يشتركان فيه إن وجد.", "ما الفرق بين المجهر الإلكتروني الماسح والنافذ؟": "المجهران إلكترونيان، فراجع الفقرة الخاصة بالمجاهر الإلكترونية في «أنواع المجاهر». ركّز على ما يدرسه كل منهما من العينة: سطحها أم داخلها.\nاكتب لكل مجهر جملة تبين غرضه، وقد تذكر ما يشتركان فيه.", "ما وظيفة القرص الدوار في المجهر؟": "فكّر في اسم الجزء نفسه: ما الذي يحمله القرص الدوار؟ راجع فقرة «أجزاء المجهر الضوئي المركب» وابحث عن العدسة المثبتة عليه.\nثم اسأل نفسك: لماذا نحتاج إلى تغيير القوة؟ اربط حركة القرص بتبديل التكبير.", "اذكر أجزاء المجهر الضوئي المركب.": "راجع فقرة «أجزاء المجهر الضوئي المركب» وانظر الصورة المرفقة. صنّف الأجزاء ذهنياً: ما يتعلق بالعدسات، وما يحمل الشريحة، وما يتعلق بالضوء، وما يحمل الجهاز.\nاذكر الأجزاء بأسمائها الصحيحة، ويفضل أن تضيف وظيفة موجزة لكل جزء.", "ما وظيفة كل من الضابط الكبير والضابط الصغير؟": "راجع جزء «الضابطان» في فقرة أجزاء المجهر. اسأل نفسك: ما الذي يتحرك عندما ندير كلاً منهما؟ وأيهما نستعمل في بداية الفحص وأيهما لضبط دقيق في النهاية؟\nاكتب وظيفة كل ضابط على حدة ثم بيّن الفرق بينهما.", "اذكر نص نظرية الخلية.": "راجع فقرة «نص نظرية الخلية» في أول الدرس. للنظرية شقان: الأول عن مكوّن الكائنات الحية، والثاني عن أصل الخلايا الجديدة.\nصُغ النص بأسلوبك متضمناً الشقين، ولا تكتفِ بأحدهما.", "قارن بين الخلايا بدائية النواة وحقيقية النواة.": "راجع جدول المقارنة وفقرة «تصنيف الخلايا بحسب تركيب النواة». رتّب إجابتك حسب وجوه المقارنة: الحجم، والغلاف النووي، والمادة الوراثية، والعضيات، والانقسام.\nاذكر لكل وجه ما يخص النوع الأول ثم الثاني. وأعطِ مثالاً لكل نوع.", "ما أوجه التشابه بينهما؟": "فكّر في ما تحتويه كل خلية حية مهما كان نوعها. راجع فقرة «أوجه التشابه» في آخر الدرس.\nتحقق أن ما تذكره موجود في النوعين معاً، ولا تذكر ما يختص بأحدهما.", "ما المكونات الأساسية للخلية حقيقية النواة؟": "راجع بداية درس الخلية حقيقية النواة، فالمكونات الأساسية مذكورة مع الخلية الحيوانية. فكّر: ما الذي يحيط بالخلية؟ وما الوسط الذي تسبح فيه العضيات؟ وما مركز التحكم؟\nاذكر كل مكون ثم وظيفته بإيجاز إن استطعت.", "علّل: يعد السيتوبلازم وسطاً ملائماً للعمليات الحيوية.": "في «علّل» اربط الخاصية بالسبب. راجع فقرة «ثانياً: السيتوبلازم» وانظر ما يتكون منه السيتوسول وما الذي يوجد فيه.\nفكّر: ماذا تحتاج التفاعلات الحيوية لتحدث؟ وأين تتواجد العضيات؟ اربط ذلك بوصف السيتوبلازم.", "علّل: تكثر الأجسام الحالّة في خلايا الدم البيضاء.": "راجع فقرة «الأجسام الحالّة» وما يحتويه هذا العضي ووظيفته. ثم فكّر في عمل خلايا الدم البيضاء: ما الذي تتعامل معه في الجسم؟\nاربط الوظيفة بحاجة الخلية: لماذا يلزمها عدد كبير من هذه العضيات؟", "علّل: يكثر وجود الميتوكندريا في خلايا العضلات والكبد.": "راجع فقرة «الميتوكندريا» وانظر وظيفتها الأساسية. ثم فكّر في عمل العضلات والكبد: ما الذي يحتاجانه بكثرة؟\nاربط بين حاجة الخلية ووجود العضية، وابدأ بذكر وظيفة الميتوكندريا ثم السبب في كل خلية.", "ما العلاقة بين الشبكة الإندوبلازمية الخشنة وجهاز جولجي؟": "راجع فقرتي «الشبكة الإندوبلازمية» و«جهاز جولجي»، وخاصة ما يتعلق بالخشنة. تتبّع مسار البروتين: أين يُصنع؟ وإلى أين ينتقل؟ وماذا يحدث له هناك؟\nرتّب إجابتك بحسب تسلسل المراحل، ولا تنسَ ما ينقل المواد بينهما.", "خلية في ورقة نبات الخبيزة تلفت إحدى بلاستيداتها الخضراء، وضّح كيف تتخلص منها.": "فكّر في العضية التي تتخلص من العضيات التالفة وتهضمها. راجع فقرتي «الأجسام الحالّة» و«جهاز جولجي» لتعرف ما تحتويه وأين تتكون.\nرتّب إجابتك بحسب تسلسل ما يحدث للبلاستيدة التالفة، وركّز على الإنزيمات.", "قارن بين الميتوكندريا والبلاستيدات.": "راجع فقرتي «الميتوكندريا» و«البلاستيدات» وفقرة التشابه بينهما. نظّم المقارنة في وجهين: ما يتشابهان فيه، وما يختلفان.\nانتبه لوجه المقارنة: التركيب، والوظيفة، ووجودهما في الخلايا النباتية والحيوانية.", "اذكر المكونات الأساسية للخلية حقيقية النواة.": "راجع بداية الدرس، فالمكونات الأساسية للخلية حقيقية النواة مذكورة في عبارة واحدة قصيرة.\nاذكرها ثم أضف وظيفة موجزة لكل منها لتكتمل إجابتك.", "صنّف العضيات إلى غشائية وغير غشائية.": "السؤال تصنيف، فاقرأ في الدرس كيف قُسّمت العضيات تحت مكونات الخلية الحيوانية. تذكّر معيار التصنيف: هل للعضية غشاء يحيط بها أم لا؟\nاكتب قائمتين، واحدة لكل نوع، وتأكد أن كل عضية في المكان الصحيح.", "ما الذي تتميز به الخلية النباتية عن الحيوانية؟": "راجع الملاحظة في بداية الدرس بعد وصف مكونات الخلية الحيوانية، ثم قارن بين الجدول الخاص بالفجوة والجدار.\nركّز على ما تنفرد به الخلية النباتية، ولا تذكر المكونات المشتركة بين النوعين.", "اذكر مكونات النواة ووظيفة كل منها.": "راجع فقرة «النواة ومكوناتها» في الدرس. اقرأ كل مكوّن على حدة وانظر وظيفته.\nرتّب إجابتك على شكل: المكوّن ثم وظيفته، وتأكد من ذكر كل المكونات التي وردت في الفقرة.", "ما الفرق بين الكروماتين والكروموسوم؟": "راجع فقرة «الكروماتين» ضمن مكونات النواة. اسأل نفسك: متى يظهر DNA بشكل خيوط، ومتى يتكثف؟\nاربط الفرق بحالة الخلية (في أثناء الانقسام وقبله). عرّف كلاً منهما ثم وضّح متى يتحول أحدهما إلى الآخر.", "ما وظيفة النوية؟": "راجع فقرة «النواة ومكوناتها» وابحث عن وصف النوية وما تنتجه. اربط ذلك بما تفعله الريبوسومات في الخلية.\nاذكر الوظيفة بجملة واضحة، ويمكنك أن توضح أهميتها للخلية.", "ما أنواع الشبكة الإندوبلازمية؟": "راجع فقرة «الشبكة الإندوبلازمية» وانظر الوصف الأول لها. ما الذي يميّز نوعاً عن آخر في سطحها؟\nاذكر النوعين بأسمائهما، وأضف الفرق المميز لكل نوع.", "قارن بين الخشنة والملساء.": "راجع فقرة «الشبكة الإندوبلازمية» وقارن بين النوعين. الوجوه المفيدة: وجود الريبوسومات على السطح، والوظيفة، والخلايا التي يكثران فيها.\nنظّم إجابتك على شكل وجوه مقارنة، لكل وجه ما يخص الخشنة ثم الملساء.", "ما الوظائف الرئيسية للشبكة الإندوبلازمية؟": "ابدأ بمعرفة الفرق بين الشبكة الخشنة والملساء، فلكل نوع عمل يرتبط بما يوجد (أو لا يوجد) على سطحه.\nراجع فقرة «الشبكة الإندوبلازمية» وتفحّص ما يخص كل نوع، ثم انتبه إلى الاتصال بين الشبكة والغشاء النووي. رتّب إجابتك: وظائف الخشنة أولاً، ثم وظائف الملساء.", "ما وظائف جهاز جولجي؟": "فكّر في جهاز جولجي كأنه مركز استلام وتجهيز وشحن في مصنع. ما الذي يصله من الشبكة؟ وماذا يُفعل به قبل أن يغادره؟\nراجع فقرة «جهاز جولجي» وانتبه إلى الأفعال المتتابعة في وصف وظيفته، وإلى ما يتكوّن منه من عضيات. اكتب إجابتك بترتيب منطقي يتبع مسار المادة.", "ما الفرق بين الوجه الداخلي cis والخارجي trans؟": "الاسمان cis وtrans يدلاّن على الاستقبال والإرسال، فاسأل نفسك أي وجه يتجه نحو الشبكة وأيهما يتجه نحو بقية الخلية.\nراجع فقرة تركيب جولجي (الصهاريج المفلطحة). اكتب جملة لكل وجه توضح موقعه ودوره، ثم قارن بينهما.", "ما علاقة جهاز جولجي بالشبكة الإندوبلازمية؟": "تتبّع رحلة البروتين: أين يُصنَع؟ وإلى أين ينتقل بعدها؟ وبماذا ينتقل بين العضيتين؟\nراجع فقرتي الشبكة الخشنة وجهاز جولجي، وابحث عن العبارة التي تصف «العلاقة» بينهما. رتّب إجابتك على شكل مراحل متسلسلة.", "ما الأجسام الحالّة؟ وما وظيفتها؟": "ابدأ بتعريف العضية: ما شكلها وما الذي تحتويه؟ ثم اربط محتواها بالمهام التي تقوم بها.\nراجع فقرة «الأجسام الحالّة» وانتبه إلى معنى كلمة «محطات إعادة التدوير». عرّف أولاً ثم اذكر الوظائف، ولا تنسَ دور جولجي في تكوينها.", "اذكر ثلاثة أنواع من الإنزيمات الهاضمة فيها.": "اسم كل إنزيم يوحي بنوع المادة التي يهضمها، فاربط بين الاسم والمادة العضوية المقابلة له.\nراجع بند «الإنزيمات» في فقرة الأجسام الحالّة، واكتب لكل نوع اسمه ونوع الهضم الذي يقوم به.", "ما وظيفة الميتوكندريا؟": "اسأل نفسك: ما الذي تحتاجه الخلية لتقوم بأنشطتها، وكيف تحصل عليه؟ وما اللقب المرتبط بهذه العضية؟\nراجع فقرة «الميتوكندريا» وانتبه إلى العملية التي تتم فيها والناتج المهم منها. اربط ذلك بأنواع الخلايا التي تكثر فيها هذه العضية وتفسير ذلك.", "ما دور الأعراف الميتوكندرية؟": "انظر إلى تركيب الغشاء الداخلي للميتوكندريا: كيف يختلف شكله عن الغشاء الخارجي؟\nفكّر في أثر هذا الشكل على المساحة المتاحة، ثم اربطه بالتفاعلات التي تتم عليه. راجع فقرة تركيب الميتوكندريا، وابدأ بتعريف الأعراف ثم اذكر دورها.", "لماذا تحتوي الميتوكندريا على DNA وريبوسومات خاصة بها؟": "فكّر في ما يمكن أن تفعله عضية تملك DNA وريبوسومات معاً؛ ما الذي يخزّنه الأول وما الذي تصنعه الثانية؟\nراجع الفقرة التي تذكر أن للميتوكندريا مادة وراثية وريبوسومات خاصة بها، وقارن ذلك بالريبوسومات الموجودة في السيتوبلازم. ثم صل بين هذه المعلومات في تعليل واضح.", "ما وظيفة الريبوسومات؟": "تذكّر اللقب الذي يُطلق على الريبوسومات في الدرس، فهو يدلّ على عملها.\nراجع فقرة العضيات اللاغشائية واقرأ ما يذكر عن دورها مع mRNA وtRNA. اكتب الوظيفة العامة أولاً ثم وضّح كيف تؤديها باختصار.", "مم تتكون الريبوسومات؟": "الريبوسوم يتكون من مادتين مختلفتين في طبيعتهما، إحداهما نوع من RNA والأخرى من جزيئات بروتينية.\nراجع الدرس لتعرف بنية الريبوسوم من حيث عدد وحداته ومكوناته. ابدأ بذكر المكونات ثم وصف تركيبه.", "أين توجد الريبوسومات في الخلية؟": "للريبوسومات أكثر من موقع في الخلية، بعضها حر وبعضها مرتبط بشيء ما، وقد توجد داخل عضيات أخرى.\nراجع فقرتي الريبوسومات والعضيات الغشائية، وابحث عن كل موضع ذُكرت فيه. صنّف المواقع في مجموعات ثم اكتبها.", "مم يتكون الجسم المركزي؟": "الجسم المركزي يتكوّن من تراكيب أصغر منه، ولكل تركيب بناء داخلي منظّم من أنابيب دقيقة.\nراجع فقرة الجسم المركزي، وانتبه إلى العدد والترتيب. ابدأ بالأعم (ما الذي يتكوّن منه الجسم المركزي) ثم انتقل إلى الأدق.", "ما وظيفته أثناء انقسام الخلية؟": "فكّر في ما تحتاجه الخلية عند الانقسام حتى توزّع الكروموسومات بين الخليتين الجديدتين.\nراجع بند الوظائف في فقرة الجسم المركزي، وانتبه إلى ما يحدث للمريكزات قبل الانقسام وإلى أين تتجه. اكتب الإجابة بتسلسل زمني قبل الانقسام وأثناءه.", "هل يوجد الجسم المركزي في الخلايا النباتية؟": "هذا السؤال عن وجود عضية في نوع محدد من الخلايا، فإجابته تبدأ بالحكم ثم التوضيح.\nراجع الملاحظة المميزة في آخر فقرة الجسم المركزي، وانتبه إلى نوع الخلايا الذي ذُكر لوجوده. اكتب حكمك ثم قارن بالخلايا الحيوانية.", "ما وظائف الهيكل الخلوي؟": "فكّر في الخلية بوصفها بناءً يحتاج إلى هيكل يمنحه الشكل ويساعد على الحركة.\nراجع فقرة «الهيكل الخلوي» وجدول المقارنة بينه وبين الجدار الخلوي. اجمع الوظائف المذكورة وصنّفها: ما يتعلق بالشكل، وما يتعلق بالحركة.", "اذكر أنواع الخيوط في الهيكل الخلوي وقطر كل نوع.": "الهيكل الخلوي ليس نوعاً واحداً من الخيوط، بل أنواع تختلف في الحجم والتركيب.\nراجع فقرة الهيكل الخلوي، فهي تعرض كل نوع باسمه وقطره. نظّم إجابتك على شكل قائمة: اسم النوع ثم قطره، وانتبه إلى ترتيب الأقطار.", "ما دور الهيكل الخلوي في الخلية النباتية؟": "الخلية النباتية لها جدار صلب، فاسأل نفسك: هل ما زالت تحتاج إلى هيكل داخلي؟ وماذا يفعل لها؟\nراجع فقرة الهيكل الخلوي وركّز على الوظائف العامة، ثم فكّر في تطبيقها على الخلية النباتية مثل دعم الخلية وحركة العضيات داخلها.", "ما مكونات الجدار الخلوي؟": "فكّر أولاً في المادة التي يُبنى منها هذا الجدار، وهل هي مختلفة بين النبات وغيره من الكائنات؟\nراجع فقرة «الهيكل الخلوي والجدار الخلوي» وجدول المقارنة، ثم استعن بما درسته عن تركيب الجدار في الخلية النباتية. ابدأ بالمكوّن الرئيس ثم اذكر ما يرافقه إن وُجد.", "ما وظائف الجدار الخلوي؟": "فكّر في ما يحدث للخلية النباتية عندما تمتص كمية كبيرة من الماء، وما الذي يمنعها من الانفجار.\nراجع خانة «الوظيفة» في جدول المقارنة بين الهيكل الخلوي والجدار الخلوي. اكتب كل وظيفة في جملة قصيرة مع تعليلها.", "أين يوجد الجدار الخلوي؟": "السؤال عن مكان وجود الجدار، فانتبه إلى أنه ليس في كل الخلايا.\nراجع صف «المكان» في جدول المقارنة، وقارن بين الخلايا النباتية والحيوانية. اذكر الأنواع التي ورد ذكرها في الدرس.", "ماذا يحدث عندما يلتف جزء من DNA حول بروتينات الهستون؟": "تذكّر ما يلتف حول بروتينات الهستون وما يُسمى الناتج عن هذا الالتفاف.\nراجع فقرة «النيوكليوسوم» وانتبه إلى عدد مرات اللف. ابدأ بوصف ما يحدث ثم سمّ الناتج.", "علّل: تستطيع البلاستيدات الخضراء صنع بروتيناتها.": "التعليل يعني أن تذكر السبب. فكّر: ما الذي تحتاجه أي عضية لتصنع بروتيناً؟\nراجع فقرة البلاستيدات وما تحتويه الستروما. ثم صل بين ما وجدته وبين قدرتها على صنع البروتينات، بأسلوب: لأنها تحتوي كذا وكذا.", "علّل: تتكدس المادة الوراثية على شكل نيوكليوسوم.": "فكّر في المشكلة التي يواجهها DNA الطويل جداً داخل نواة صغيرة، وكيف يحلّها هذا الترتيب.\nراجع بند «الحاجة إليه» في فقرة النيوكليوسوم. اكتب إجابتك على شكل: المشكلة ثم الحل المتمثل في النيوكليوسوم.", "ما المقصود بتضاعف المادة الوراثية؟ وما الغرض منه؟": "السؤال يطلب تعريفاً ثم غرضاً، فرتّب إجابتك في جزأين.\nراجع فقرة «تضاعف المادة الوراثية» وانتبه إلى متى يحدث ولماذا. لا تنسَ أن تذكر ما يحدث للسلسلتين أثناءه.", "ما المكونات الثلاثة للنيوكليوتيد؟": "النيوكليوتيد وحدة بنائية تتألف من ثلاثة أجزاء مختلفة الطبيعة.\nراجع فقرة الحموض النووية وابحث عن الإجابة عن السؤال: مم يتكون النيوكليوتيد؟ اذكر كل جزء باسمه.", "ما الفرق بين سكر DNA وسكر RNA؟": "السكران متشابهان في البنية ويختلفان في ذرة أو مجموعة واحدة على الكربون الثاني.\nراجع بند السكر الخماسي في فقرة الحموض النووية، وانتبه إلى ما يحمله الكربون 2′ في كل منهما. اكتب مقارنة قصيرة بين الاثنين.", "ما القواعد النيتروجينية في DNA؟ وفي RNA؟": "القواعد في الحمضين متشابهة إلا قاعدة واحدة تختلف.\nراجع جدول القواعد النيتروجينية في درس الحموض النووية. اذكر قواعد DNA أولاً ثم قواعد RNA، وانتبه إلى القاعدة التي تميّز كل منهما.", "لماذا تحتاج الخلية إلى تكثيف DNA في الكروموسوم؟": "فكّر في الفرق بين طول DNA وحجم النواة، وفي أهمية حمايته وتوزيعه عند الانقسام.\nراجع فقرة النيوكليوسوم وما بعدها، وانتبه إلى ما يجعل DNA يتسع داخل النواة. اربط التكثيف بحاجة الخلية في جملتين أو ثلاث.", "اذكر نوع الروابط بين القواعد المتقابلة في DNA.": "السؤال عن الروابط بين القواعد المتقابلة، وهي ليست الروابط بين النيوكليوتيدات المتتابعة.\nراجع فقرة «ارتباط النيوكليوتيدات والقواعد» في درس الحموض النووية. اذكر نوع الرابطة ثم اعدد الروابط بين كل زوج من القواعد.", "ما مستويات تنظيم المادة الوراثية؟": "فكّر في المادة الوراثية كأنها خيط يُلفّ على مراحل حتى يصير أكثر تماسكاً.\nراجع الملخص في نهاية فقرة النيوكليوسوم، وهو يعرض تسلسل التنظيم. رتّب المستويات من الأصغر إلى الأكبر.", "ما النيوكليوسوم؟ مم يتكون؟": "عرّف النيوكليوسوم أولاً ثم اذكر مكوناته.\nراجع فقرة «النيوكليوسوم» وانتبه إلى ما يلتف حول ماذا وإلى عدد مرات اللف وعدد جزيئات الهستون. اكتب وصفاً قصيراً لما تراه.", "كيف يتكوّن الكروموسوم؟": "الكروموسوم يتكوّن من تجمع وحدات أصغر وتكاثفها.\nراجع بند «علاقته بالكروموسوم» وملخص التنظيم في فقرة النيوكليوسوم. صف الخطوات متتابعة ابتداءً من DNA.", "لماذا سُمّي DNA بالحمض النووي الريبوزي منقوص الأكسجين؟": "الاسم الطويل يحمل معلومات عن تركيب السكر: الجزء الأول منه يدل على السكر الأصلي، والثاني على ما نقص منه.\nراجع بند السكر الخماسي في درس الحموض النووية، وانتبه إلى ما يوجد على الكربون 2′. فسّر كل جزء من الاسم على حدة.", "ما القواعد النيتروجينية في كل من DNA وRNA؟": "القواعد في الحمضين أربع لكل منهما، وثلاث منها مشتركة.\nراجع جدول القواعد النيتروجينية، واكتب قواعد كل حمض مع رمزها واسمها، ثم أشر إلى القاعدة التي تختلف.", "ما الذي يرتبط بالكربون 1′ و5′ و3′ في السكر؟": "سكر النيوكليوتيد له كربونات مرقّمة، ولكل موضع منها ما يرتبط به.\nراجع بند «مواقع الارتباط على السكر» في درس الحموض النووية. اذكر لكل رقم ما يرتبط به، ويمكنك ترتيبها في قائمة قصيرة.", "هل يحتوي DNA وRNA على العدد نفسه من السلاسل؟": "قارن بين التركيب العام للحمضين من حيث عدد السلاسل.\nراجع جدول المقارنة بين DNA وRNA، واكتب إجابتك بحكم واضح ثم تفصيل عن كل حمض.", "لماذا سميت النيوكليوتيدات بهذا الاسم؟": "اسم الشيء يأتي عادة من أصله أو مكوناته، فاسأل: ما علاقة هذه الوحدات بالنواة وبالحموض؟\nراجع فقرة الحموض النووية، فهي تذكر أن النيوكليوتيدات هي الوحدات البنائية، وتأمل في الأجزاء الثلاثة المكونة لها. اكتب سبب التسمية بجملتين.", "ما نوع الروابط بين النيوكليوتيدات؟": "السؤال عن الروابط بين النيوكليوتيدات المتتابعة في السلسلة نفسها، وليس بين السلسلتين.\nراجع فقرة «ارتباط النيوكليوتيدات والقواعد» وانتبه إلى نوع الروابط الذي يشكّل السلسلة الطويلة. ميّز بينها وبين روابط القواعد.", "ما أهمية تضاعف المادة الوراثية؟": "فكّر في ما تحتاجه كل خلية جديدة بعد الانقسام، وماذا يحدث لو لم تحصل عليه.\nراجع فقرة «تضاعف المادة الوراثية» في درس تركيب المادة الوراثية، وانتبه إلى الغرض المذكور. اربطه بانتقال المعلومات بين الخلايا وبين الأجيال.", "ما عدد البروتونات في ذرة الأكسجين (O)؟": "العدد الذري لأي عنصر هو عدد بروتونات نواته، وهو رقمه في الجدول الدوري.\nابحث عن رمز الأكسجين O في الجدول الدوري وانظر إلى رقمه الذري.", "ما نوع الرابطة في جزيء H₂O؟": "تأمّل نوع العنصرين في الجزيء: هل هما فلزان أم لافلزان؟\nالرابطة بين ذرتين لافلزيتين تختلف عن الرابطة بين فلز ولافلز: في الأولى تتشارك الذرات الإلكترونات، وفي الثانية ينتقل إلكترون من ذرة إلى أخرى.", "أين يحدث التمثيل الضوئي؟": "التمثيل الضوئي عملية تحوّل فيها الخلية الطاقة الضوئية إلى طاقة كيميائية مخزّنة، ويلزمها صبغة تمتص الضوء.\nاسأل نفسك: أي العضيات تحتوي على هذه الصبغة الخضراء؟", "ما قوة التكبير الكلية لعدسة عينية ×10 وشيئية ×40؟": "القوة الكلية للتكبير في المجهر الضوئي تُحسب بعملية حسابية بين قوة العدسة العينية وقوة العدسة الشيئية.\nتذكّر القاعدة، ثم عوّض الرقمين وانتبه إلى مرتبة العدد.", "أي العضيات مسؤولة عن إنتاج ATP؟": "ATP هو «عملة الطاقة» في الخلية، وتصنعه الخلية في عضية تُلقَّب بمحطة توليد الطاقة.\nراجع وظيفة كل عضية في الخيارات وقارن بينها.", "مم يتكون النيوكليوتيد؟": "النيوكليوتيد هو اللبنة الأساسية التي تُبنى منها الأحماض النووية DNA وRNA.\nتذكّر أن له ثلاثة أجزاء مرتبطة معاً، وأن بعضها يرتبط بالطاقة وبعضها بالمعلومات الوراثية. اختر الخيار الذي يذكر الأجزاء كاملة ولا يخلط بمواد أخرى كالدهون والبروتينات.", "القاعدة النيتروجينية الموجودة في RNA فقط:": "في DNA أربع قواعد نيتروجينية: A وT وG وC.\nأما RNA فتتشابه معه في ثلاث منها، وتحلّ قاعدة أخرى محلّ الرابعة. اسأل: أي القواعد الواردة ليست من قواعد DNA الأربع؟", "الوحدة الأساسية لتعبئة DNA هي:": "DNA جزيء طويل جداً فيحتاج إلى تعبئة محكمة ليتسع في النواة.\nيلتفّ الشريط حول بروتينات خاصة تسمى الهستونات فيتكوّن تركيب يشبه حبّات العقد. ما اسم هذا التركيب؟", "رقم الدورة للعنصر يساوي:": "الدورة هي الصف الأفقي في الجدول الدوري، وتتغير خصائص العناصر بالانتقال عبرها.\nتذكّر أن رقم الدورة يرتبط بعدد المستويات الرئيسية التي تدور فيها الإلكترونات، لا بعدد إلكترونات المستوى الأخير (فهذا يخصّ رقم المجموعة).", "ما رقم تأكسد Na (توزيعه 2,8,1)؟": "رقم التأكسد للأيون البسيط يساوي شحنته.\nمن التوزيع الإلكتروني: كم إلكتروناً في المستوى الأخير؟ الذرة تميل لتحقيق ثباتها كالغاز النبيل، فهل تكسب إلكترونات أم تفقدها؟ وما شحنتها بعد ذلك؟", "المجموعة السابعة (VIIA) تسمى:": "عناصر المجموعة السابعة تحتاج إلكتروناً واحداً لتكمل مستواها الأخير، وهي شديدة النشاط وتكوّن أملاحاً مع الفلزات.\nتذكّر أسماء مجموعات الجدول الدوري ثم اختر الاسم المناسب (مثلاً: IA وIIA وVIIIA لها أسماء أخرى).", "تفاعل 12 غم كربون مع 32 غم أكسجين، فكتلة CO₂ الناتج:": "قانون حفظ الكتلة: مجموع كتل المواد المتفاعلة يساوي مجموع كتل المواد الناتجة.\nاجمع كتلتي المادتين المتفاعلتين واربط الناتج بالقانون.", "يصنف عنصر السيليكون ضمن:": "تُصنَّف العناصر حسب خصائصها إلى أصناف، ولبعضها خصائص وسطى بين صنفين.\nابحث عن السيليكون في الجدول الدوري: في أي منطقة يقع؟ وهل يوصل الكهرباء كالفلزات تماماً، أم لا يوصلها كاللافلزات تماماً؟", "الجير الحي هو:": "الجير الحي مادة بيضاء تنتج من تسخين الحجر الجيري (كربونات الكالسيوم) فيتحلّل ويتصاعد غاز ثاني أكسيد الكربون.\nفكّر: ما المادة الصلبة المتبقية بعد خروج CO₂؟ وتذكّر أن الجير المطفأ هو الذي يتكوّن عند إضافة الماء.", "عدد الكميات الأساسية في النظام الدولي للوحدات:": "النظام الدولي للوحدات (SI) يقوم على عدد محدّد من الكميات الأساسية، منها الطول والكتلة والزمن وشدة التيار ودرجة الحرارة...\nعُدّ الكميات الأساسية التي تعرفها، ولا تعدّ الكميات المشتقة كالسرعة والقوة.", "وحدة قياس الطول في النظام الدولي:": "لكل كمية فيزيائية وحدة قياسية في النظام الدولي، والبادئات مثل «كيلو» و«سنتي» تضاعف الوحدة الأساسية أو تجزّئها.\nاسأل: ما وحدة الطول الأساسية (دون بادئة)؟", "1 كيلومتر يساوي:": "البادئة «كيلو» تعني مضاعفة الوحدة الأساسية بعدد معيّن.\nتذكّر قيمة كيلو (ألف)، ثم اكتبها كقوة للعدد 10 مع الانتباه إلى إشارة الأس: موجب للمضاعفات وسالب للأجزاء.", "وحدة السرعة في النظام الدولي:": "السرعة تعبّر عن المسافة المقطوعة في وحدة الزمن.\nاكتب وحدة المسافة في النظام الدولي، ثم وحدة الزمن، واقسم إحداهما على الأخرى. وانتبه ألا تخلط بين السرعة والتسارع.", "القراءة النهائية للورنية =": "الورنية أداة تقيس بدقة أعلى من المسطرة العادية، فالقراءة تتكوّن من جزأين: جزء صحيح من التدريج الرئيسي وجزء كسري تحدّده الورنية.\nفكّر كيف تجمع الجزأين معاً، وأي الخطوط تحدّد الجزء الكسري؟", "الفيزياء هي العلم الذي يدرس:": "الفيزياء فرع من العلوم الطبيعية، وكل فرع يُعرَّف بما يدرسه.\nتذكّر الكلمتين الأساسيتين في تعريفها ثم قارن بين مجال كل علم طبيعي: الأحياء والكيمياء والجيولوجيا والفيزياء.", "الكمية الفيزيائية هي:": "الكمية الفيزيائية تتكوّن من جزأين معاً لا يكتمل التعبير عنها إلا بهما.\nاسأل نفسك: ما الشرط الأساسي لنعدّ شيئاً ما كمية فيزيائية؟ وما الذي نكتبه بعد الرقم عند ذكر قيمتها؟", "القياس هو عملية:": "في أي قياس هناك شيء نريد معرفته وشيء آخر نقارنه به.\nفكّر: عندما نقيس طول طاولة بمسطرة، ما الذي نقارنه بماذا؟ وهل يصح أن تكون الكميتان المقارَنتان من نوعين مختلفين؟", "أي مما يلي من مواصفات الوحدة المناسبة للقياس؟": "الوحدة مرجع نقارن به، فلا بد أن يتفق عليه الجميع ويعطي النتيجة نفسها كل مرة.\nاسأل نفسك: ماذا يحدث لو تغيرت قيمة المرجع من مرة إلى أخرى؟ وهل نستطيع حينها مقارنة النتائج؟", "وحدات الطول والكتلة والزمن في نظام cgs على الترتيب هي:": "اسم النظام يلخّص وحداته: كل حرف من الحروف الثلاثة يرمز إلى وحدة كمية أساسية بالترتيب.\nفكّر بما يشير إليه كل حرف، وتذكّر أن الطول والكتلة والزمن هي الكميات الثلاث التي تتضمنها هذه الأنظمة.", "توجد وحدات للقياس لكي:": "فكّر في موقف يقيس فيه شخصان الشيء نفسه ثم يريدان معرفة هل نتيجتاهما متفقتان.\nما الذي يجب أن يتوفر لديهما حتى تصبح المقارنة ممكنة وسهلة؟", "أي زوج من الوحدات يمثل الطول ثم الكتلة في النظام الأمريكي؟": "في كل نظام قياس مجموعة وحدات تنتمي إليه معاً، ولا يصح الخلط بين وحدات نظامين مختلفين.\nتذكّر جدول المقارنة بين النظام الدولي والنظام الأمريكي، وحدد أولاً وحدتي الطول والكتلة في كل نظام، ثم انتبه إلى أن المطلوب وحدتان من النظام نفسه.", "قاس طالب طول طاولة بعدد أشباره فحصل على نتيجة، وقاسها زميله بأشباره فحصل على نتيجة مختلفة. السبب الأقرب لاختلاف النتيجتين أن الشبر:": "ارجع إلى ما يجب أن تتحلى به الوحدة المرجعية حتى تتفق نتائج القياس.\nحلّل الموقف: ما الشيء الذي تغيّر بين القياسين، الطاولة أم المرجع المستخدم؟ ثم اربط ذلك بمواصفات الوحدة المناسبة.", "أي الكميات التالية تُقاس بوحدة واحدة متطابقة في النظام الدولي ونظام cgs والنظام الأمريكي معاً؟": "قارن جدول الأنظمة الثلاثة كمية كمية: الطول والكتلة والزمن، وابحث عن الكمية التي لا تتغير وحدتها من نظام إلى آخر.\nالمطلوب كمية واحدة تتفق فيها الأنظمة الثلاثة، فتحقّق أن الكمية التي تختارها تتفق في الأنظمة كلها لا في اثنين منها فقط.", "الكمية الأساسية هي كمية فيزيائية:": "الاسم يدل على المعنى: الأساسية هي اللبنات الأولى التي تُبنى منها غيرها.\nفكّر في الفرق بين كمية تُعرَّف بنفسها وكمية تحتاج إلى علاقة بين كميات أخرى لتعريفها.", "وحدة قياس درجة الحرارة في النظام الدولي هي:": "درجة الحرارة إحدى الكميات الأساسية السبع، ولكل كمية منها وحدة أساسية خاصة بها.\nراجع جدول الكميات الأساسية وطابق كل كمية بوحدتها، وتذكّر أن وحدة الحرارة في النظام الدولي مسمّاة باسم عالم.", "الكمية الأساسية التي وحدتها «المول» هي:": "المول وحدة تُستخدم لعدّ الجسيمات الدقيقة في المادة، لا لقياس مقدارها بالوزن أو الطول.\nراجع جدول الكميات الأساسية السبع، وانتبه إلى أن لكل كمية وحدة واحدة مرتبطة بها.", "أي الكميات التالية كمية مشتقة؟": "الكمية المشتقة تُشتق من كميات أساسية بعلاقة فيزيائية تعرّفها.\nاسأل عن كل خيار: هل يُعرَّف بنفسه أم بالقسمة أو الضرب بين كميات أخرى؟ ثم تذكّر قائمة الكميات الأساسية السبع.", "أي المجموعات التالية تتكوّن من كميات أساسية فقط؟": "يكفي وجود كمية مشتقة واحدة في المجموعة لتُستبعد.\nاستحضر الكميات الأساسية السبع، ثم افحص كل مجموعة واسأل: هل كل عنصر فيها من هذه القائمة؟", "إذا أثّرت قوة في جسم كتلته 4 كغم فأكسبته تسارعاً مقداره 3 م/ث²، فإن مقدار القوة بالنيوتن يساوي:": "القوة كمية مشتقة تُعرَّف بعلاقة تربط الكتلة بالتسارع، وقد وردت في جدول الكميات المشتقة.\nاكتب العلاقة، وتأكد أن الوحدات تنسجم مع النيوتن (كغم·م/ث²)، ثم عوّض القيمتين المعطاتين.", "أي علاقة فيزيائية تُنتج كمية وحدتها م/ث²؟": "اشتقاق الوحدات يكون من العلاقة التي تعرّف الكمية، فاختبر وحدة ناتج كل علاقة.\nحلّل وحدة م/ث²: ما وحدة البسط وما وحدة المقام؟ ثم اسأل أي كمية تُقاس هكذا، وأي علاقة تعرّفها.", "وحدة الضغط (الباسكال) إذا عُبّر عنها بالوحدات الأساسية للنظام الدولي تساوي:": "الضغط يعرَّف بعلاقة تربط القوة بالمساحة، والقوة نفسها كمية مشتقة وحدتها مركّبة.\nعوّض وحدة القوة بما تساويه من وحدات أساسية، ثم قسّمها على وحدة المساحة، واختصر الوحدات المتكررة بعناية.", "تؤثر قوة مقدارها 60 نيوتن عمودياً على سطح مساحته 0.5 م². الضغط الناتج بالباسكال يساوي:": "الضغط يقيس مقدار القوة الموزعة على كل وحدة مساحة.\nاستعمل العلاقة التي تعرّف الضغط ووحدته (نيوتن/م²)، وتأكد من أن المساحة بالمتر المربع قبل التعويض، ثم فكّر: هل يصغر الضغط أم يكبر عندما تقل المساحة؟", "قيمة البادئة «كيلو» تساوي:": "البادئات تعبّر عن مضاعفات الوحدة أو أجزائها، والأس الموجب للمضاعفات والسالب للأجزاء.\nتذكّر جدول البادئات: هل الكيلو مضاعف للوحدة أم جزء منها؟ وكم رتبة يفصله عن الوحدة؟", "قيمة البادئة «نانو» تساوي:": "انتبه إلى إشارة الأس: النانو من الأجزاء الصغيرة جداً من الوحدة.\nرتّب البادئات الصغيرة من الأكبر إلى الأصغر (ملي، مايكرو، نانو، بيكو) وحدد موقع النانو بينها.", "عدد الثواني في الساعة الواحدة يساوي:": "الساعة تتكون من دقائق، والدقيقة تتكون من ثوانٍ.\nاضرب عدد الدقائق في الساعة بعدد الثواني في الدقيقة، وانتبه ألا تخلط بين الساعة واليوم.", "250 سم تساوي بالمتر:": "للتحويل إلى النظام الدولي نضرب في قيمة البادئة.\nحدّد قيمة بادئة السنتي، ثم اضرب بها، وتحقق من المعقولية: هل السنتيمتر أكبر من المتر أم أصغر منه؟", "72 كم/س تساوي بوحدة م/ث:": "التحويل هنا مركّب: وحدة الطول تتحول من الكيلومتر إلى المتر، ووحدة الزمن من الساعة إلى الثانية.\nحوّل البسط والمقام كلاً على حدة، وتحقق أن الناتج منطقي: م/ث أصغر عددياً من كم/س عند السرعة نفسها.", "المتر المربع الواحد يساوي بالسنتيمتر المربع:": "المساحة حاصل ضرب بعدين، فعامل التحويل يدخل مرتين.\nتذكّر أن المتر يساوي عدداً معلوماً من السنتيمترات، ثم ربّع هذا العدد لا تكتفِ بتكراره مرة واحدة.", "كثافة مادة 5 غم/سم³ تساوي بوحدة كغم/م³:": "الكثافة وحدة مركّبة من الكتلة والحجم، وكل منهما يتحول بعامل مختلف.\nحوّل الغرام إلى كيلوغرام، ثم السنتيمتر المكعب إلى متر مكعب (الحجم يتضمن ثلاثة أبعاد)، ثم اقسم وراقب إشارة الأس.", "طول موجة ضوء مقداره 40 نانومتر يساوي بالمتر:": "للتحويل إلى المتر نضرب القيمة في قيمة البادئة، ثم نكتب الناتج بالصيغة العلمية.\nاضرب 40 في قيمة النانو، ثم عبّر عن الناتج كعدد بين 1 و10 مضروباً في قوة للعدد 10.", "مستطيل طوله 200 سم وعرضه 50 سم. مساحته بالمتر المربع تساوي:": "احسب المساحة بعد توحيد الوحدات، والأسهل أن تحوّل كل ضلع إلى المتر قبل الضرب.\nتذكّر أن مساحة المستطيل = الطول × العرض، وأن ضرب الناتجين بالسنتيمتر ثم التحويل يحتاج عامل تحويل مربّعاً.", "تتكون الورنية من:": "اسم الأداة نفسه (الورنية) يدل على التدريج المنزلق المساعد.\nتذكّر أن للأداة جزأين من التدريج، أحدهما يبقى في مكانه والآخر يتحرك عند القياس.", "دقة الميكرومتر تساوي:": "الميكرومتر أدق من المسطرة ومن الورنية في قياس الأطوال الصغيرة جداً.\nتذكّر القيمة التي تحدد أصغر قراءة يستطيع المقياس الدائري أن يضيفها إلى القراءة الطولية.", "أي مما يلي لا تقيسه الورنية؟": "الورنية أداة لقياس الأطوال والأبعاد الصغيرة بدقة.\nصنّف كل خيار: هل هو بُعد (طول أو قطر أو عمق) أم كمية من نوع مختلف؟ المطلوب ما لا يُعدّ بُعداً.", "القراءة النهائية للورنية تُحسب بالعلاقة:": "القراءة تتألف من جزء صحيح تقريبي يعطيه التدريج الثابت، وجزء دقيق تضيفه الورنية.\nفكّر: هل يُضاف الجزء الدقيق إلى القراءة الرئيسية أم يُطرح منها؟ وكيف نحوّل رقم الخط المنطبق إلى طول؟", "التدريج الرئيسي للورنية يقرأ 3.1 سم، والخط المنطبق من الورنية هو رقم 4، ودقة الورنية 0.01 سم. القراءة النهائية بالسنتيمتر:": "طبّق قاعدة الورنية: جزء من التدريج الرئيسي، وجزء من الورنية ناتج عن ضرب رقم الخط في الدقة.\nانتبه إلى وحدة الدقة المعطاة، ثم أضف الجزءين بعناية في المنزلة العشرية الصحيحة.", "أنسب أداة لقياس قطر سلك رفيع جداً بدقة عالية هي:": "اختر الأداة بحسب حجم الكمية المقاسة ودقة الأداة المطلوبة.\nرتّب الأدوات من الأقل إلى الأعلى دقة، ثم اختر الأنسب لقياس قطر صغير جداً.", "قُرئ التدريج الثابت في ميكرومتر فكان 7 ملم، وقراءة التدريج الدائري 36 قسماً، ودقة الميكرومتر 0.01 ملم. القراءة النهائية بالملم:": "قراءة الميكرومتر = جزء من التدريج الثابت + حاصل ضرب قراءة التدريج الدائري في الدقة.\nحوّل أقسام التدريج الدائري إلى ملليمترات أولاً، ثم أضفها إلى الجزء الثابت وانتبه إلى موضع الفاصلة العشرية.", "في ورنية دقتها 0.02 سم قُرئ التدريج الرئيسي 5.7 سم، وانطبق الخط رقم 6 من الورنية. القراءة النهائية بالسنتيمتر:": "الدقة هنا ليست 0.01، فاستخدمها كما هي في العلاقة العامة للورنية.\nاحسب الجزء الذي تضيفه الورنية بضرب رقم الخط المنطبق في الدقة، ثم أضفه إلى قراءة التدريج الرئيسي.", "المقياس الدائري في ميكرومتر مقسم إلى 50 قسماً ودقته 0.01 ملم. عند تدوير المقياس الدائري دورة كاملة واحدة يتحرك الفك المتحرك مسافة تساوي بالملم:": "الدقة هي المسافة التي يقطعها الفك عند تحريك قسم واحد من المقياس الدائري.\nالدورة الكاملة تعني المرور بجميع الأقسام، فاربط عدد الأقسام بقيمة القسم الواحد لتحصل على المسافة الكلية.", "ما المقصود بالدورة في الجدول الدوري؟": "الجدول الدوري شبكة من الصفوف والأعمدة، ولكل منهما اسم مختلف.\nتذكّر أن العناصر التي تتشابه خصائصها الكيميائية تقع في الاتجاه الآخر غير اتجاه الدورة. حدّد أولاً اتجاه الدورة ثم طابق.", "العدد الذري (Z) لذرة عنصر يساوي عدد:": "العدد الذري هو «هوية» العنصر، ويُكتب أسفل رمزه.\nتذكّر الفرق بينه وبين العدد الكتلي الذي يجمع نوعين من الجسيمات داخل النواة.", "إلكترونات التكافؤ هي إلكترونات:": "اسم «التكافؤ» يرتبط بالمستوى الذي يشارك في تكوين الروابط وفي فقد الإلكترونات أو اكتسابها.\nانظر إلى التوزيع الإلكتروني مثل 2,8,1 وفكّر أي رقم فيه يعبّر عن هذه الإلكترونات.", "ذرة عنصر توزيعها الإلكتروني 2,8,6 تقع في:": "رقم الدورة يساوي عدد مستويات الطاقة، ورقم المجموعة يساوي عدد إلكترونات التكافؤ.\nعدّ الأرقام في التوزيع الإلكتروني لتعرف عدد المستويات، ثم انظر إلى الرقم الأخير لتعرف إلكترونات المستوى الأخير.", "ذرة عنصر فيها 7 إلكترونات في مستواها الأخير، وهي تصل إلى حالة الاستقرار غالباً عن طريق:": "قاعدة الثمانية: تميل الذرة إلى أن يصبح في مستواها الأخير ثمانية إلكترونات.\nقارن العدد الموجود بالعدد المطلوب، ثم اسأل نفسك: أي طريق أقرب وأقل كلفة، الفقد أم الاكتساب؟", "الأيون الموجب يشكل مركبات من النوع:": "الأيون الموجب نتج عن فقد ذرة لإلكترونات، فهو يرتبط بجسيم يقبل هذه الإلكترونات.\nتذكّر القاعدة التي وردت في الدرس عن نوع المركبات التي يشكلها كل من الأيون الموجب والأيون السالب.", "ذرة عنصر عددها الذري 11 وعددها الكتلي 23، فكم عدد النيوترونات في نواتها؟": "العدد الكتلي هو مجموع نوعين من الجسيمات الموجودة في النواة، والعدد الذري يمثل أحدهما.\nإذا عرفت المجموع وعرفت أحد الجزأين فاطرح لتجد الجزء الآخر.", "أيون سالب شحنته (-1) ناتج عن ذرة عددها الذري 17، فكم إلكتروناً يحتوي هذا الأيون؟": "الذرة المتعادلة يتساوى فيها عدد البروتونات وعدد الإلكترونات.\nالأيون السالب تكوّن باكتساب إلكترونات؛ حدّد عدد الإلكترونات المكتسبة من مقدار الشحنة، ثم أضفها إلى عدد إلكترونات الذرة المتعادلة.", "ذرة متعادلة فيها 20 بروتوناً، توزيعها الإلكتروني 2,8,8,2. أي العبارات التالية صحيحة؟": "اربط ثلاث معلومات معاً: عدد مستويات الطاقة يحدد الدورة، وعدد إلكترونات التكافؤ يحدد المجموعة وطريقة الوصول إلى الاستقرار.\nثم فكّر: هل الأقرب لهذه الذرة فقد إلكترونات التكافؤ أم اكتساب ما يكمل ثمانية؟ وما نوع الأيون الناتج وما المركبات التي يشكلها؟", "يتركز نحو 99% من كتلة الكالسيوم في جسم الإنسان في:": "الكالسيوم من العناصر المعدنية الرئيسية في الجسم، ومن وظائفه المعروفة بناء الأجزاء الصلبة.\nفكّر في أصلب الأنسجة في جسمك.", "الصيغة الكيميائية لكربونات الكالسيوم هي:": "اسم المركب يدل على أيونين: فلز الكالسيوم ومجموعة الكربونات.\nتذكّر أن الكربونات تتكون من ذرة كربون واحدة مرتبطة بعدد من ذرات الأكسجين، وقارن مع الصيغ الأخرى.", "لا يوجد الكالسيوم في الطبيعة حراً بل:": "الكالسيوم عنصر نشط كيميائياً يتفاعل بسهولة نسبياً مع المواد الأخرى.\nما الذي يحدث لعنصر نشط حين يتواجد في بيئة فيها ماء وهواء وعناصر أخرى لزمن طويل؟", "يستخدم كلوريد الكالسيوم مجففاً لأنه:": "المجفف مادة وظيفتها إزالة الرطوبة من الوسط المحيط بها.\nفكّر في الخاصية التي يجب أن تتوفر في المادة حتى تؤدي هذه الوظيفة، ثم اختر التفسير المطابق.", "عند تسخين كربونات الكالسيوم إلى 900°س تتحلل إلى أكسيد الكالسيوم و:": "في التحلل الحراري تتفكك مادة واحدة إلى مادتين أو أكثر، وتبقى أنواع الذرات نفسها قبل التفاعل وبعده.\nاطرح من صيغة CaCO₃ ما يمثل أكسيد الكالسيوم، وانظر إلى ما تبقى من الذرات.", "عند تفاعل الكالسيوم مع الماء ينتج غاز ويكون المحلول الناتج:": "الناتج الفلزي هنا هو هيدروكسيد، وفي معادلة التفاعل ذرات هيدروجين لا تدخل في الهيدروكسيد.\nتذكّر ما يعنيه وجود أيونات الهيدروكسيد في المحلول من حيث الحمضية والقاعدية.", "عند تحلل 200 غ من كربونات الكالسيوم النقية تحللاً تاماً، فإن كتلة أكسيد الكالسيوم الناتجة تساوي (الكتل الذرية: Ca=40، C=12، O=16):": "احسب أولاً الكتلة المولية لكل من المادة المتفاعلة والمادة الناتجة بجمع الكتل الذرية.\nمن المعادلة الموزونة: كل مول من المتفاعل يعطي عدداً محدداً من مولات المادة المطلوبة؛ حوّل الكتلة إلى مولات ثم عد إلى الكتلة.", "كتلة شخص 50 كغ. إذا شكلت أملاح الكالسيوم 2% من كتلة جسمه وكان 99% منها في العظام والأسنان، فإن كتلتها هناك تقارب:": "الحساب على خطوتين متتاليتين: نسبة مئوية من كتلة الجسم كله، ثم نسبة مئوية من الناتج.\nانتبه إلى أن النسبة الثانية تُطبّق على كتلة الأملاح وليس على كتلة الجسم.", "تعالج بحيرة تأثرت بالمطر الحمضي بإضافة كربونات الكالسيوم. أي التفسيرات التالية أنسب؟": "المطر الحمضي يحتوي على تركيز مرتفع من الحمض، والعلاج المطلوب هو خفض هذا التركيز.\nفكّر في نوع المادة التي تتفاعل مع الحمض فتستهلكه، وتذكّر ما قيل في الدرس عن خصائص كربونات الكالسيوم وتفاعلها مع الأحماض.", "السيليكون ثاني أكثر العناصر وفرة في القشرة الأرضية بعد:": "يشكل السيليكون نحو 28% من كتلة القشرة الأرضية.\nتذكّر أن العنصر الأول يدخل مع السيليكون في تكوين مركبات الرمل والكوارتز.", "الصيغة الكيميائية للسيليكا (الكوارتز) هي:": "السيليكا مركب من السيليكون والأكسجين فقط.\nتذكّر أن ذرة السيليكون ترتبط بذرات الأكسجين بنسبة محددة، وانتبه إلى ترتيب الرمزين وأرقام الأسفل.", "ينتمي السيليكون إلى:": "لون السيليكون رمادي غامق ولمعانه شبه فلزي، وهذا يوحي بأنه ليس فلزاً تاماً ولا لافلزاً تاماً.\nتذكّر عدد العناصر التي تصنف في هذه الفئة (6).", "يصنف السيليكون من أشباه الموصلات لأنه:": "تنقسم المواد حسب موصليتها إلى ثلاثة أنواع: موصلة وشبه موصلة وعازلة.\nمقاومة شبه الموصل ليست في أحد الطرفين؛ فكّر في سلوكه تحت ظروف مختلفة.", "العامل الذي تتغير بتغيره موصلية السيليكون هو:": "ورد في الدرس أن مقاومة السيليكون للكهرباء ليست ثابتة في كل الظروف.\nفكّر في الظرف الفيزيائي الذي يتغير عندما نسخّن المادة أو نبرّدها وتأثيره في حركة الإلكترونات.", "ذرة السيليكون عددها الذري 14. موقعها في الجدول الدوري هو:": "في الذرة المتعادلة يساوي عدد الإلكترونات العدد الذري، فوزّعها على مستويات الطاقة بالترتيب (2 ثم 8 ثم
