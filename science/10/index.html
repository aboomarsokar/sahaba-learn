<head>

<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="PCB">

<title>PCB - نسخة الطالب v43</title>
<style>
:root{--bg:#EFE3CC;--card:#FBF5E8;--text:#2A2016;--muted:#5C4B38;--bd:#C9B28C;--pri:#5A3E1A;--ink:#2A2016;--c1:#1565C0;--c1b:#E6D3AE;--c2:#D32F2F;--c2b:#F1D9D0;--c3:#2E7D32;--c3b:#dcebd9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#5A4636;--card:#6A5442;--text:#F6EEE2;--muted:#E6D3B8;--bd:#8A7058;--pri:#F0D9A8;--ink:#F6EEE2;--c1:#1565C0;--c1b:#7A624C;--c2:#D32F2F;--c2b:#6E4A3C;--c3:#2E7D32;--c3b:#2c4a3a}}
:root[data-theme="dark"]{--bg:#5A4636;--card:#6A5442;--text:#F6EEE2;--muted:#E6D3B8;--bd:#8A7058;--pri:#F0D9A8;--ink:#F6EEE2;--c1:#1565C0;--c1b:#7A624C;--c2:#D32F2F;--c2b:#6E4A3C;--c3:#2E7D32;--c3b:#2c4a3a}
@font-face{font-family:"PCB Naskh";font-style:normal;font-weight:400 700;font-display:swap;src:url("fonts/naskh-arabic.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"PCB Naskh";font-style:normal;font-weight:400 700;font-display:swap;src:url("fonts/naskh-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"PCB Naskh","Noto Naskh Arabic","Amiri","Traditional Arabic",system-ui,sans-serif;font-weight:600}
body.sp{background:linear-gradient(135deg,#a8743a 0%,#6f8f5e 52%,#c0504a 100%)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:16px 16px 96px}
.sp #app{padding-bottom:20px}
.col{display:flex;flex-direction:column;gap:14px}
.ctr{align-items:center;justify-content:center;text-align:center;min-height:90vh}
.logo{width:130px;height:130px;border-radius:50%;border:3px dashed #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;background:rgba(255,255,255,.18);overflow:hidden;cursor:pointer}
.logo img{width:100%;height:100%;object-fit:cover}
.sp h1{font-size:64px;margin:0;letter-spacing:6px;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.25)}
.sp p{color:#fff;margin:0}
.chip{background:rgba(255,255,255,.22);color:#fff;border-radius:30px;padding:8px 22px;font-weight:600}
.row3{display:flex;gap:22px;justify-content:center}
.cir{width:62px;height:62px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:auto}
.cl{color:#fff;font-size:14px;margin-top:6px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:700;cursor:pointer;width:100%}
.btn.w{background:#fff;color:#1b2433}
.btn.o{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}
h2{margin:0}
.sub{color:var(--muted);margin:0;font-size:14px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--text);font-size:17px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);cursor:pointer;font-size:17px;text-align:start}
.opt.sel{border-color:var(--pri);background:var(--c1b)}
.opt.ok{border-color:var(--c3);background:var(--c3b)}.opt.no{border-color:var(--c2);background:var(--c2b)}
.box{width:22px;height:22px;border:2px solid var(--pri);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex:none}
.opt.sel .box{background:var(--pri)}
.rad{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex:none}
.err{color:#d64545;min-height:20px;font-size:14px}
.hd{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;padding-bottom:4px}
.ic{width:44px;height:44px;border-radius:12px;background:var(--card);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--text);position:relative}
.ic.g{visibility:hidden}
.bg i{display:block;width:20px;height:3px;background:var(--text);border-radius:2px;margin:2.5px 0}
.dot{position:absolute;top:8px;inset-inline-end:8px;width:9px;height:9px;border-radius:50%;background:#e5484d}
.ban{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c3),var(--c2));font-size:15px}
.ban b{font-size:22px;display:block;margin-bottom:4px}
.sc{display:flex;align-items:center;gap:14px;border-radius:18px;padding:14px 16px;color:#fff;cursor:pointer;background:var(--c)}
.sc .cir{margin:0;width:52px;height:52px;font-size:26px}
.sc .x{flex:1}.sc b{font-size:22px;display:block}.sc small{opacity:.9}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q4 div{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer}
.q4 span{display:block;font-size:22px;margin-bottom:4px}
.ui{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer}
.ui .ib{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--cb);flex:none}
.ui .x{flex:1}.ui small{color:var(--muted);display:block}
.tabs{display:flex;gap:6px}
.tab{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--card);border:1.5px solid var(--bd);cursor:pointer;font-size:15px}
.tab.on{background:var(--c);color:#fff;border-color:var(--c)}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:16px;line-height:1.8}
.nv{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nv div{text-align:center;font-size:12px;color:var(--muted);cursor:pointer;flex:1}
.nv div.on{color:var(--pri);font-weight:700}
.nv span{display:block;font-size:22px}
.pg{height:10px;border-radius:6px;background:var(--bd);overflow:hidden}
.pg i{display:block;height:100%;background:var(--c3)}
.menu{position:fixed;top:0;bottom:0;inset-inline-start:0;width:80%;max-width:330px;background:var(--card);padding:calc(20px + env(safe-area-inset-top,0px)) 16px 16px;transform:translateX(-110%);transition:transform .25s;z-index:20;box-shadow:0 0 30px rgba(0,0,0,.3);overflow-y:auto}
[dir=rtl] .menu{transform:translateX(110%)}
.menu.open{transform:none!important}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}.veil.on{display:block}
.mi{display:flex;justify-content:space-between;align-items:center;padding:14px 6px;border-bottom:1px solid var(--bd);font-size:17px;cursor:pointer}
.tg{padding:4px 12px;border-radius:20px;background:var(--pri);color:#fff;font-size:14px}
.sw{width:46px;height:26px;border-radius:14px;background:var(--bd);position:relative}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--c3)}.sw.on:after{inset-inline-start:23px}
.n{padding:10px;border-radius:10px;background:var(--c1b);margin:8px 0 0}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.tb th,.tb td{border:1px solid var(--bd);padding:8px;text-align:start;vertical-align:top}.tb th{background:var(--c1b)}.li{padding:3px 0}.nt{background:var(--c3b);border-inline-start:4px solid var(--c3);padding:10px;border-radius:10px;margin:8px 0}h4{margin:14px 0 4px;color:var(--c)}.card p{margin:6px 0}
.lg{width:150px;height:150px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.3);flex:none}.lg img{width:100%;height:100%;display:block}
.fm{width:100%;background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.ft{text-align:center;font-size:13px;color:var(--muted);margin:18px 0 0;direction:ltr}.sp .ft{color:#fff;font-weight:600}
.tabs{overflow-x:auto;padding-bottom:4px}.tab{flex:none;white-space:nowrap;padding:10px 14px;font-weight:700}
.rd{font-size:17px;line-height:2;font-weight:500;border-inline-start:6px solid var(--k)}.rd h4{color:var(--k);font-size:20px}
.li:before{content:"●";color:var(--d,var(--k));margin-inline-end:8px}.rd .tb th{background:color-mix(in srgb,var(--k) 22%,transparent)}.rd .tb{font-size:15px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:50;font-size:15px}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.mbx{background:var(--card);color:var(--text);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
.mhd{display:flex;justify-content:space-between;align-items:center;font-size:19px}.mx{cursor:pointer;font-size:22px;padding:4px 8px}
.mlg{width:80px;height:80px;border-radius:50%;overflow:hidden;margin:0 auto;box-shadow:0 3px 12px rgba(0,0,0,.25)}.mlg img{width:100%;height:100%}
.mrow{display:flex;gap:8px}.mb{flex:1;text-align:center;padding:12px 6px;border-radius:14px;color:#fff;font-weight:700;text-decoration:none;cursor:pointer;font-size:15px}
.mb.wa{background:#25a244}.mb.tg{background:#1f8fd6}.mb.ot{background:#8b5cf6}
.ta{width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--text);font:inherit;font-size:15px;line-height:1.7}
.qa{margin-bottom:14px}.qa textarea{width:100%;min-height:84px;border:1.5px solid var(--bd);border-radius:12px;padding:10px;background:var(--card);color:var(--text);font:inherit;font-size:16px;margin-top:6px}
.tchb{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-radius:12px;padding:8px 12px;font-size:14px;text-align:center}
.inf{width:100%;border-radius:12px;margin:8px 0;border:1px solid var(--bd);display:block}
.zm{position:fixed;inset:0;background:#000;z-index:60;overflow:auto}.zm img{width:230%;max-width:none;display:block}
.zx{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;background:#fff;color:#000;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:61;cursor:pointer}
.logos{display:flex;align-items:center;justify-content:center;gap:12px}
.logos img{width:110px;height:110px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.logos .x{color:#fff;font-size:32px;font-weight:700}
.sup{color:#fff;font-size:14px;font-weight:600;margin:6px 0 0}
.ld{width:100%;display:flex;flex-direction:column;gap:6px;align-items:center;color:#fff;font-size:13px}
.ld .pg{width:100%;background:rgba(255,255,255,.3)}
.ld .pg i{background:#fff;width:0;transition:width .4s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ui .ib.im{width:56px;height:56px;background:none;padding:0}.ib.im img{width:100%;height:100%;display:block;border-radius:14px}
.vs0{width:100%;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;text-align:center;min-height:92vh;color:#fff;font-family:"Amiri","Traditional Arabic","Scheherazade New",serif}
.vs0 .vi{width:100%;max-height:210px;object-fit:cover;border-radius:20px;border:2px solid rgba(255,255,255,.7);box-shadow:0 6px 22px rgba(0,0,0,.3)}
.vs0 .va{font-size:36px;font-weight:700;line-height:2.1;white-space:nowrap;width:100%;overflow:hidden;text-shadow:0 3px 12px rgba(0,0,0,.3)}
.vs0 .vm{font-size:15px;opacity:.92;font-family:system-ui,sans-serif}
.vs0 .vc{width:100%;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.6);border-radius:22px;padding:16px 14px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.vs0 .vk{font-size:13px;font-weight:700;font-family:system-ui,sans-serif;letter-spacing:.5px}
.vs0 .vh{font-size:26px;line-height:2;margin:4px 0}
.vs0 hr{border:0;border-top:1.5px solid rgba(255,255,255,.7);margin:6px 30px 10px}
.vnx{width:100%;border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:700;color:#fff;cursor:pointer;font-family:system-ui,sans-serif;background:linear-gradient(110deg,#1f6fd1,#1f9d55,#f08a00,#d63c3c,#1f6fd1);background-size:300% 100%;animation:sh 8s linear infinite;border:2px solid #ffd98a;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.av{position:relative;overflow:visible;width:72px;height:72px;border-radius:50%;flex:none;cursor:pointer;background:var(--card);border:3px solid #ffd98a;box-shadow:0 3px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--pri)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av b{position:absolute;bottom:-2px;inset-inline-end:-2px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.avr{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.avh{display:flex;align-items:center;gap:12px}
.avg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.avg div{aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;border:3px solid transparent}
.avg div.on{border-color:var(--pri)}.avg img{width:100%;height:100%;display:block}
.avb{position:relative;overflow:hidden;text-align:center;padding:13px;border-radius:14px;background:var(--pri);color:#fff;font-weight:700;font-size:16px}
.avb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.sc.im{position:relative;overflow:hidden;min-height:170px;height:170px;flex:none;padding:0;background-size:cover;background-position:center;display:block;border:2px solid #ffd98a}
.sc.im:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.45) 42%,rgba(0,0,0,.08) 100%)}
.sc.im .x{position:absolute;inset-inline:0;bottom:0;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.sc.im .x b{font-size:32px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 3px #000;line-height:1.3}
.sc.im .x small{display:inline-block;margin-top:2px;background:var(--c);color:#fff;border-radius:20px;padding:2px 12px;font-size:14px;font-weight:700;text-shadow:none}
.sc.im .go{font-size:34px;color:#fff;text-shadow:0 2px 8px #000}
.pgr{margin:10px 0}.pgr .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.pgr .pg{height:12px}.pgr .pg i{background:var(--c)}
.big{font-size:44px;font-weight:800;color:var(--pri);text-align:center;line-height:1.2}
.ban.bim{padding:0!important;overflow:hidden;animation:none!important;background:#FFFBF2!important;border:2px solid #ffd98a}.ban.bim img{display:block;width:100%;height:auto}
.cr2{margin:16px 0 6px;padding:12px;border-radius:16px;text-align:center;background:linear-gradient(135deg,#1E6FD9,#7c3aed,#D92B2B);color:#fff;border:2px solid #ffd98a}.cr2 .k{font-size:13px;font-weight:700;opacity:.9;margin-bottom:4px}.cr2 .n{font-size:17px;font-weight:700;line-height:1.9;background:none!important;padding:0!important;margin:0!important;color:#fff!important}

/* v43 usability and contrast fixes */
.pcb-video{background:#fff!important;color:#243247!important;border:1px solid #cbd5e1!important;box-shadow:0 3px 12px rgba(15,23,42,.10)!important;opacity:1!important}
.pcb-video small{color:#475569!important}
:root[data-theme="light"] .q4 div,.q4 div{color:var(--text);background:var(--card);border-color:var(--bd)}
:root[data-theme="light"] .q4 div span{color:var(--pri)}
.q4 div{min-height:76px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:650}
.lab-exp{width:100%;padding:13px;margin:8px 0 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--text);font:inherit}
.lab-card{background:linear-gradient(115deg,#0f766e,#0d9488)!important;color:#fff!important}
#calc.cx{touch-action:none!important}
#calc.cx .cxg{touch-action:manipulation}
#calc.cx .cxk{ -webkit-tap-highlight-color:transparent; touch-action:manipulation}

/* ===== تجاوب: جوال / آيباد / لابتوب ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (min-width:760px){
 #app{max-width:920px;padding-inline:28px}
 .subs{display:grid!important;grid-template-columns:repeat(3,1fr);gap:14px}
 .subs .sc.im{height:240px!important;min-height:240px!important}
 .q4{grid-template-columns:repeat(4,1fr);gap:12px}.q2{gap:14px}
 .avh{margin-bottom:6px}
 .ban.bim{max-width:640px;margin-inline:auto;width:100%}
 .mdl .mbx{max-width:620px;border-radius:22px;margin-bottom:5vh}
 .mdl{align-items:center}
}
@media (min-width:1180px){
 #app{max-width:1160px}
 .subs .sc.im{height:300px!important;min-height:300px!important}
 .q4 div{min-height:96px;font-size:14px}
 .ban.bim{max-width:700px}
}
@media (orientation:landscape) and (max-height:520px){
 #app{max-width:760px}.hd{font-size:17px}
}
@media (hover:hover){.sc,.gi,.gc,.q4 div,.gb{transition:transform .15s}.sc:hover,.gi:hover,.gc:hover,.q4 div:hover,.gb:hover{transform:translateY(-2px)}}
</style>

"- الوظيفة: يفصل مكونات الخلية عن الوسط المحيط، وينظم دخول وخروج الجزيئات.",
"- التركيب: طبقتان من الليبيدات المفسفرة (رأس قطبي محب للماء وذيل غير قطبي كاره للماء)؛ كوليسترول يتخلل الطبقتين لزيادة مرونة الغشاء؛ بروتينات ناقلة تسمح بدخول بعض المواد ولا تسمح بمرور مواد أخرى.",
"# ثانياً: السيتوبلازم",
"المنطقة بين النواة والغشاء الخلوي، يتكون من محلول غروي يسمى السيتوسول تسبح فيه العضيات الغشائية واللاغشائية.",
"- مكونات السيتوسول: ماء، أملاح، مواد كيميائية، مواد عضوية وغير عضوية.",
"# العضيات الغشائية",
"? الشبكة الإندوبلازمية",
"- الخشنة: على سطحها ريبوسومات. الملساء: بلا ريبوسومات.",
"- وظائفها: تصنيع الأغشية الخلوية، نقل البروتينات بعد تصنيعها، وتصنيع الليبيدات في الملساء.",
"? جهاز جولجي",
"أكياس غشائية مسطحة متراصة فوق بعضها، في الخلايا الحيوانية والنباتية ويكثر في الإفرازية. وظيفته: تعديل وفرز وتغليف وتوجيه بعض البروتينات.",
"- العلاقة مع الشبكة الخشنة: تُصنع البروتينات على ريبوسوماتها ثم تنتقل داخل حويصلات إلى جولجي لتُعدَّل وتُغلَّف وتُوجَّه.",
"- الحويصلات: أكياس صغيرة محاطة بغشاء تساعد على نقل المواد داخل الخلية أو إلى خارجها.",
"? الأجسام الحالّة",
"حويصلات غشائية صغيرة في سيتوبلازم الخلية الحيوانية تحتوي إنزيمات هاضمة. وظيفتها: التخلص من محتويات الخلية التالفة، هضم المواد الواصلة للخلية، الدفاع عن الخلية، وإعادة تدوير مكوناتها. يساهم جولجي في تكوينها وتجهيزها بالإنزيمات.",
"! تكثر في خلايا الدم البيضاء لأنها تلتهم الميكروبات والأجسام الغريبة وتحتاج الإنزيمات الهاضمة لتدميرها.",
"? الميتوكندريا",
"تستخلص الطاقة من المواد الغذائية وتحوّل جزءاً منها إلى ATP. تتركب من: غشاء خارجي أملس؛ غشاء داخلي متعرج له انثناءات تسمى الأعراف؛ الحشوة (Matrix): سائل كثيف يحتوي ريبوسومات والإنزيمات اللازمة للتنفس الخلوي.",
"! وظيفتها الأساسية التنفس الخلوي لإنتاج ATP. وتكثر في خلايا العضلات (جهد حركي كبير) والكبد (عمليات أيضية مكثفة) لحاجتها إلى كميات كبيرة من ATP.",
"? البلاستيدات",
"عضيات غشائية في الخلايا النباتية وبعض الطلائعيات ولا توجد في الحيوانية، أشهرها الخضراء، ووظيفتها إنتاج الغذاء بالبناء الضوئي. تتركب من: غشاء مزدوج؛ الستروما (حشوة فيها إنزيمات وDNA وريبوسومات)؛ الثايلاكويد (أكياس مسطحة كالأقراص تحمل الكلوروفيل)؛ الجرانا (أقراص ثايلاكويد متراصة كالأعمدة).",
"! تتشابه الميتوكندريا والبلاستيدات في: غشاء مزدوج، DNA خاص بكل منهما، ومسؤوليتهما عن إنتاج الطاقة (الميتوكندريا للتنفس والبلاستيدات للبناء الضوئي).",
"? الفجوات",
"حويصلات غشائية تخزن الماء والأملاح والغذاء والفضلات؛ تُصنف إلى منقبضة وعصارية (مركزية) وغذائية.",
"|وجه المقارنة|النباتية|الحيوانية",
"|الحجم|كبيرة جداً (حتى 90% من الخلية)|صغيرة جداً",
"|العدد|واحدة أو اثنتان (عصارية مركزية)|كثيرة ومتفرقة",
"|الدور الهيكلي|دعم الخلية وجعلها منتفخة وقوية|ليس لها دور في التدعيم",
"# العضيات اللاغشائية",
"- الريبوسومات: تراكيب صغيرة جداً من وحدتين (كبيرة وصغيرة) تتكون من rRNA وبروتينات، حرة في السيتوبلازم أو مرتبطة بالشبكة الخشنة، وظيفتها تصنيع البروتينات (مصانع البروتين).",
"- الجسم المركزي: في الخلايا الحيوانية القابلة للانقسام، يحتوي مريكزين يتألف كل منهما من تسع مجموعات ثلاثية متوازية من الأنيبيبات الدقيقة (9+0).",
"# الهيكل الخلوي والجدار الخلوي",
"|وجه المقارنة|الهيكل الخلوي|الجدار الخلوي",
"|المكان|السيتوسول|الخلايا النباتية وبعض الطلائعيات",
"|التركيب|شبكة من الألياف والأنيبيبات البروتينية|جدار حيوي غير حي لكنه مسامي",
"|الوظيفة|دعم الخلية والحفاظ على شكلها، والإسهام في حركتها وحركة عضياتها|يحافظ على شكل الخلية، يحميها من الانفجار الناتج من امتصاص الماء، ويعطيها المتانة والصلابة"],
q:["- علّل: يعد السيتوبلازم وسطاً ملائماً للعمليات الحيوية.","- علّل: تكثر الأجسام الحالّة في خلايا الدم البيضاء.","- علّل: يكثر وجود الميتوكندريا في خلايا العضلات والكبد.","- ما العلاقة بين الشبكة الإندوبلازمية الخشنة وجهاز جولجي؟","- خلية في ورقة نبات الخبيزة تلفت إحدى بلاستيداتها الخضراء، وضّح كيف تتخلص منها.","- قارن بين الميتوكندريا والبلاستيدات."]}],
[{t:"تركيب المادة الوراثية",e:[

q:["- لماذا سُمّي DNA بالحمض النووي الريبوزي منقوص الأكسجين؟","- ما القواعد النيتروجينية في كل من DNA وRNA؟","- ما الذي يرتبط بالكربون 1′ و5′ و3′ في السكر؟","- هل يحتوي DNA وRNA على العدد نفسه من السلاسل؟"]}],[{"t": "دورة الخلية والانقسام المتساوي", "e": ["# دورة الخلية", "- الأطوار المتتابعة المنظمة من النمو والانقسام بين انقسامين متتاليين.", "- الطور البيني (حوالي 90%): G1 نمو الخلية، وS تضاعف DNA، وG2 تجهيز الانقسام.", "- طور الانقسام M: الانقسام المتساوي ثم انقسام السيتوبلازم.", "- G0: سكون دائم (كريات الدم الحمراء الناضجة، العضلات الهيكلية، العصبونات).", "# الانقسام المتساوي (الميتوزي)", "- يحدث في الخلايا الجسمية. فائدته: النمو، وإصلاح الخلايا وتجديدها.", "- التمهيدي: تتكثف الكروموسومات، ويتحلل الغلاف النووي.", "- الاستوائي: تصطف الكروموسومات في وسط الخلية.", "- الانفصالي: تنفصل الكروماتيدات الشقيقة إلى القطبين.", "- النهائي: تتكون خليتان متطابقتان وراثياً مع الأم.", "# الأورام", "- انقسام غير منظم وغير متحكم به، إما خبيث (سرطان) أو غير خبيث."]}],[{"t": "الانقسام المنصف وتكوين الغاميتات", "e": ["- الانقسام المنصف يحدث في الخلايا الجنسية، وينتج 4 خلايا كل منها نصف العدد الكروموسومي (n).", "- أهميته: يحافظ على ثبات العدد الكروموسومي للنوع مع الإخصاب، ويزيد التنوع.", "# المرحلة الأولى", "- تقترن الكروموسومات المتناظرة، ويحدث العبور، ثم تنفصل الكروموسومات المتناظرة.", "# المرحلة الثانية", "- تشبه الانقسام المتساوي، فتنفصل الكروماتيدات الشقيقة، وتنتج 4 خلايا أحادية المجموعة.", "# العبور", "- يحدث في التمهيدي الأول، ويتبادل فيه كروماتيدان غير شقيقين أجزاء بينهما، وينتج تنوعاً وراثياً.", "# تكوين الحيوانات المنوية", "- خلية جذعية ← خلية تناسلية أولية ← خلية منوية أولية ← خليتان ثانويتان ← 4 طلائع منوية ← 4 حيوانات منوية.", "- تركيبها: الرأس (النواة والإنزيمات)، والعنق، والقطعة الوسطى (ميتوكوندريا كثيرة)، والذيل للحركة.", "# تكوين البويضات", "- المنصف الأول ينتج خلية بيضية ثانوية وجسماً قطبياً أول، والمنصف الثاني لا يكتمل إلا بعد دخول الحيوان المنوي.", "! الخلية الأم الواحدة تعطي 4 حيوانات منوية، لكنها تعطي بويضة واحدة فقط."]}],[{"t": "أنسجة جسم الإنسان", "e": ["# مستويات التنظيم", "- ذرات ← جزيئات ← عضيات ← خلية ← نسيج ← عضو ← جهاز ← كائن حي.", "# أنواع الأنسجة الرئيسة", "- الطلائي: خلايا متراصة، وظيفته الحماية والامتصاص والإفراز.", "- الضام: خلايا غير متراصة في مادة بين خلوية وفيرة، ويشمل العظمي والغضروفي واللمفي والدم.", "- العضلي: هيكلي (مخطط)، وأملس (يحيط بالأعضاء الجوفاء)، وقلبي (في القلب فقط).", "- العصبي: في الدماغ والحبل الشوكي والأعصاب، وينقل السيالات العصبية، ومكوناته العصبون والخلايا الدبقية."]}],[{"t": "الجهاز التناسلي والتكاثر", "e": ["# الجهاز الذكري", "- الخصيتان: تنتجان الحيوانات المنوية والتستوستيرون.", "- البربخ: يكتمل فيه نضج الحيوانات المنوية وتُخزن.", "- الغدد الملحقة: الحويصلتان المنويتان والبروستات وغدتا كوبر، تفرز السائل المنوي.", "# الجهاز الأنثوي", "- المبيضان: ينتجان الخلية البيضية والإستروجين والبروجسترون.", "- قناتا البيض: يحدث فيهما الإخصاب غالباً في الثلث الأول.", "- الرحم والمهبل: الرحم مكان نمو الجنين، والمهبل قناة الولادة.", "# الدورة الشهرية", "- FSH ينشط نمو حويصلة غراف، وLH يحفز التبويض.", "- مراحلها: الطمث، ثم النمو، ثم الإفراز.", "# الإخصاب والحمل", "- حيوان منوي واحد يخترق البويضة، فتتكون الزايجوت بـ 46 كروموسوماً.", "- الحمل نحو 38 أسبوعاً على أربع مراحل.", "# التوائم", "- متطابقة: من بويضة واحدة وحيوان منوي واحد.", "- غير متطابقة: من بويضتين مختلفتين."]}],[{"t": "الجهاز البولي", "e": ["# وظيفته", "- الإخراج: التخلص من الفضلات للحفاظ على الاتزان الداخلي.", "# مكوناته", "- الكليتان، والحالبان (ينقلان البول)، والمثانة (تخزن البول مؤقتاً)، وقناة البول.", "# النفرون (الوحدة الأنبوبية الكلوية)", "- يوجد نحو 1.3 مليون في كل كلية، ويتكون من محفظة بومان والكبة، والأنبوب الملتوي القريب، وتواء هنلي، والأنبوب الملتوي البعيد، والأنبوب الجامع.", "# خطوات تكوين البول", "- الترشيح في الكبة.", "- إعادة الامتصاص: يُعاد امتصاص نحو 99% من الراشح.", "- الإفراز: تُضاف مواد من الدم إلى البول في الأنبوب الملتوي البعيد.", "# المشكلات الصحية", "- الفشل الكلوي: يُعالج بغسيل الكلى أو زراعة كلية.", "- حصى الكلية: وسببها الرئيس أملاح الكالسيوم، والوقاية بشرب الماء باستمرار."]}],[{"t": "تصنيف الكائنات الحية", "e": ["# التصنيف الحديث", "- 3 مجالات: البكتيريا، والبكتيريا القديمة، وحقيقية النوى.", "- 6 ممالك: البكتيريا، والبكتيريا القديمة، والطلائعيات، والفطريات، والنباتات، والحيوانات.", "# الاسم العلمي", "- ثابت لا يتغير بين الدول واللغات، ويتكون من الجنس ثم النوع. مثل القط المنزلي Felis catus.", "# التسلسل الهرمي", "- المجال ← المملكة ← الشعبة ← الصف ← الرتبة ← العائلة ← الجنس ← النوع.", "! النوع هو الوحدة الأساسية في التصنيف، وأفراده متشابهون ويتزاوجون وينتجون نسلاً خصباً. البغل ليس نوعاً لأنه عقيم.", "# أنواع التصنيف", "- الشكلي: يعتمد على الصفات الظاهرية.", "- الجيني: يعتمد على التكوين الوراثي وتتابع القواعد النيتروجينية في DNA."]}]];

var CHEM=[[{"t": "العناصر الكيميائية في حياتنا", "e": ["الجدول الدوري: جدول رُتّبت فيه العناصر تبعاً لتزايد أعدادها الذرية من اليسار إلى اليمين، يتكون من صفوف أفقية تسمى دورات وأعمدة رأسية تسمى مجموعات.", "! تتشابه عناصر المجموعة الواحدة في خصائصها الكيميائية.", "# مكونات الذرة", "- بروتونات موجبة داخل النواة.", "- نيوترونات متعادلة داخل النواة.", "- إلكترونات سالبة تدور حول النواة.", "# رمز العنصر", "يُكتب رمز العنصر X ويوضع العدد الكتلي A أعلاه والعدد الذري Z أسفله.", "- العدد الذري (Z): عدد البروتونات في الذرة، ويساوي عدد الإلكترونات في الذرة المتعادلة.", "- العدد الكتلي (A): مجموع عدد البروتونات والنيوترونات.", "# التوزيع الإلكتروني", "التوزيع الإلكتروني: طريقة ترتيب إلكترونات الذرة على مستويات الطاقة حول النواة.", "? ما فائدة التوزيع الإلكتروني؟", "نعرف من خلاله موقع العنصر في الجدول الدوري: رقم دورته ورقم مجموعته.", "- رقم الدورة: عدد مستويات الطاقة في التوزيع الإلكتروني.", "- رقم المجموعة: عدد إلكترونات التكافؤ.", "- إلكترونات التكافؤ: إلكترونات المستوى الأخير في التوزيع الإلكتروني.", "# المجموعات", "تنقسم عناصر الجدول الدوري إلى: عناصر ممثلة رمزها A، وعناصر انتقالية رمزها B.", "|المجموعة|الاسم", "|الأولى (IA)|الفلزات القلوية", "|الثانية (IIA)|الفلزات القلوية الترابية", "|السابعة (VIIA)|الهالوجينات", "|الثامنة (VIIIA)|الغازات النبيلة (الخاملة)", "# قاعدة الثمانية والاستقرار", "! قاعدة الثمانية: تميل الذرات إلى ملء مستواها الأخير بثمانية إلكترونات لتصل إلى حالة الاستقرار.", "? كيف تصل الذرة إلى حالة الاستقرار؟", "بالفقد أو الاكتساب أو التشارك.", "- رقم التأكسد: عدد الإلكترونات التي تفقدها الذرة أو تكتسبها.", "- إذا فقدت الذرة إلكترونات تحولت إلى أيون موجب، وإذا اكتسبت إلكترونات تحولت إلى أيون سالب.", "# أنواع المركبات", "- مركبات أيونية، ومركبات تشاركية.", "! الأيون الموجب يشكل مركبات أيونية فقط، والأيون السالب يشكل مركبات أيونية وتشاركية.", "# أمثلة", "|العنصر|التوزيع|رقم التأكسد|المركبات", "|Na|2,8,1|+1|أيونية فقط", "|Cl|2,8,7|-1|أيونية وتشاركية", "|Ne|2,8|لا يوجد|لا يشكل مركبات", "- التوزيع 2,8,2: الدورة الثالثة، المجموعة الثانية (قلوية ترابية)، رقم التأكسد  الكيميائي", "العلامات التي تدل على أن المواد المتفاعلة تحولت إلى مواد جديدة ذات خواص مختلفة:", "- تغير اللون.", "- تكون غاز.", "- تكون راسب.", "- تغير درجة الحرارة.", "- انبعاث ضوء.", "- ظهور رائحة جديدة.", "! ليس شرطاً أن تظهر كل هذه الدلالات معاً.", "# المعادلة الموزونة", "المعادلة التي يكون فيها عدد ذرات كل عنصر متساوياً في طرفي المعادلة.", "! المتفاعلات في يسار المعادلة والنواتج في يمينها.", "# خطوات وزن المعادلة", "- نكتب المعادلة بصورة صحيحة وبرموز المواد المتفاعلة والناتجة.", "- نحسب عدد ذرات كل عنصر في الطرفين.", "- نضع أرقاماً (معاملات) أمام الصيغ الكيميائية اللازمة.", "- نبدأ بالعنصر الأقل تكراراً ثم نزن باقي العناصر.", "- نتأكد أن عدد ذرات كل عنصر متساوٍ في الطرفين.", "! لا نغير الأرقام الصغيرة (السفلية) داخل الصيغة لأنها جزء من تركيب المادة.", "# قانون حفظ الكتلة", "! قانون حفظ الكتلة: كتلة المواد المتفاعلة = كتلة المواد الناتجة في التفاعل الكيميائي في نظام مغلق.", "- النظام المغلق: نظام لا تخرج منه مواد ولا تدخل إليه مواد.", "- بعبارة أخرى: المواد المتفاعلة لا تفنى ولا تظهر من العدم أثناء التفاعل، وإنما تعيد ترتيب نفسها.", "? ماذا يحدث للمواد المتفاعلة في التفاعل الكيميائي؟", "- تتفكك عن بعضها.", "- ترتبط بطريقة جديدة.", "- تكوّن مواد جديدة.", "# مثال 1", "في التفاعل C + O₂ → CO₂: إذا تفاعل 12 غم من الكربون مع 32 غم من الأكسجين، فكتلة CO₂ الناتج = 12 + 32 = 44 غم.", "# مثال 2", "تفاعل 32 غم من غاز الميثان مع كمية من الأكسجين، وكانت النواتج 44 غم CO₂ و18 غم ماء. ما كتلة الأكسجين المستهلكة؟", "كتلة المتفاعلات = كتلة النواتج", "32 + ص = 44 + 18 = 62", "ص = 62 − 32 = 30 غم", "# مثال 3", "2KI + Pb(NO₃)₂ → PbI₂ + 2KNO₃", "- دلائل التفاعل: تغير اللون وتكون راسب.", "- كتل المواد قبل التفاعل وبعده تبقى ثابتة.", "# قانون النسب الثابتة", "! قانون النسب الثابتة: مهما اختلفت طريقة تحضير المركب الكيميائي أو مصدره، فإن نسب كتل العناصر المكونة له تبقى ثابتة.", "# مثال 1: الماء H₂O", "إذا كانت كتلة H = 1 وكتلة O = 16، فكتلة جزيء الماء = 16 + 2 = 18", "- نسبة H = (2 × 1) ÷ 18 × 100% = 11.1%", "- نسبة O = 16 ÷ 18 × 100% = 88.9%", "- مجموع النسب = 88.9 + 11.1 = 100%", "# مثال 2: سكر السكروز C₁₂H₂₂O₁₁", "ثلاث عينات من مصادر مختلفة (قصب السكر، الشمندر السكري، البطاطا الحلوة): نسبة الكربون في سكر القصب 42%، ونسبة الهيدروجين في سكر الشمندر 6.5%. نسبة الأكسجين في سكر البطاطا الحلوة:", "100% − (6.5% + 42%) = 51.5%", "# مثال 3: الأمونيا NH₃", "تحضّر بطريقتين: 2NH₄Cl + Ca(OH)₂ → CaCl₂ + 2NH₃ + H₂O، أو N₂ + 3H₂ → 2NH₃", "كتلة H = 1 وكتلة N = 14، وكتلة NH₃ = 14 + 3 = 17", "- نسبة H = 3 ÷ 17 × 100% = 17.6%", "- نسبة N = 14 ÷ 17 × 100% = 82.4%", "- مجموع النسب = 100%", "! خصائص الأمونيا الناتجة لا تختلف في الطريقتين لأنهما تنتجان المركب نفسه."], "q": ["- عرّف دلالات حدوث التفاعل الكيميائي واذكرها.", "- ما المعادلة الموزونة؟", "- زن: H₂ + O₂ → H₂O", "2H₂ + O₂ → 2H₂O", "- زن: N₂ + H₂ → NH₃", "N₂ + 3H₂ → 2NH₃", "- زن: Na + Cl₂ → NaCl", "2Na + Cl₂ → 2NaCl", "- اذكر نص قانون حفظ الكتلة.", "- ما المقصود بالنظام المغلق؟", "- فكّر: احترقت قطعة خشب فنتج رماد كتلته أقل من كتلة الخشب، كيف يتفق ذلك مع قانون حفظ الكتلة؟ كتلة المواد الناتجة = كتلة الرماد + كتلة الغازات التي تطايرت.", "- اذكر نص قانون النسب الثابتة.", "- احسب النسبة الكتلية لكل عنصر في الماء H₂O.", "- هل تختلف خصائص الأمونيا الناتجة بالطريقتين؟ ولماذا؟"]}],[{"t": "المول والكتلة المولية والحجم المولي", "e": ["# المول وعدد أفوجادرو", "- المول: كمية المادة التي تحتوي 6.023×10²³ جسيم (ذرة أو جزيء أو أيون). وهذا العدد يسمى عدد أفوجادرو.", "- مثال: في 0.25 مول من الحديد Fe، عدد الذرات = 1.5×10²³ ذرة تقريباً.", "# الكتلة المولية", "- الكتلة المولية: كتلة مول واحد من المادة بوحدة غم/مول. تساوي العدد الكتلي للعنصر تقريباً.", "- تعتمد على حالة العنصر: مول من ذرات O كتلته 16 غم، ومول من جزيئات O₂ كتلته 32 غم.", "- مثال: الكتلة المولية لكربونات الكالسيوم CaCO₃ = 100 غم/مول.", "# العلاقة بين الموالت والكتلة", "- عدد الموالت = الكتلة (غم) ÷ الكتلة المولية (غم/مول).", "# الحجم المولي للغازات", "- الظروف المعيارية STP: ضغط 1 جوي، ودرجة حرارة 0 °س.", "- مول واحد من أي غاز في STP يشغل 22.4 لتر.", "- الحجم = عدد الموالت × 22.4 لتر.", "! حجم الغاز يتغير بالحرارة والضغط، لذلك نستخدم الظروف المعيارية للحسابات."]}],[{"t": "استخدام المعادلة الموزونة في الحسابات", "e": ["# خطوات الحل", "- تأكد أن المعادلة موزونة.", "- حوّل المعطى (كتلة أو حجم) إلى موالت.", "- استخدم نسبة المعاملات لإيجاد موالت المادة المطلوبة.", "- حوّل الموالت إلى المطلوب: كتلة (× الكتلة المولية) أو حجم (× 22.4 لتر).", "! المعاملات في المعادلة الموزونة تمثل نسب الموالت، وفي الغازات تمثل أيضاً نسب الحجوم.", "# مثال", "- يتفاعل الأمونيا مع الأكسجين: 5O₂ + 4NH₃ → 4NO + 6H₂O", "- كتلة O₂ اللازمة لـ 17 غم أمونيا: الموالت = 1، وO₂ = 1.25 مول، والكتلة = 40 غم."]}],[{"t": "الهيدروكربونات", "e": ["# الكربون وخصائصه", "- الكربون من أكثر العناصر انتشاراً، وله متآصلات أشهرها الجرافيت (طبقات تنفصل بسهولة) والماس (الأكثر قساوة).", "- يكوّن روابط تساهمية، وسلاسله: مفتوحة غير متفرعة، أو مفتوحة متفرعة، أو حلقية.", "# الهيدروكربونات", "- مركبات تتكون من الكربون والهيدروجين فقط، وهي مصدر رئيس للطاقة.", "# مصادرها", "- النفط (الأهم)، والغاز الطبيعي، والصخر الزيتي.", "- التقطير التجزيئي: فصل مكونات المخلوط حسب درجات غليانها.", "# الألكانات", "- هيدروكربونات مشبعة، روابطها أحادية فقط. صيغتها العامة CnH2n+2.", "- التسمية: مقطع يدل على عدد ذرات الكربون + مقطع 'ان'. مثل ميثان وإيثان وبروبان.", "- التشكل: مركبات لها الصيغة الجزيئية نفسها واختلاف في الصيغة البنائية (مثل البيوتان: ع-بيوتان وأيزو-بيوتان).", "- الخصائص: لا تذوب في الماء، وتزداد درجة الغليان بزيادة عدد ذرات الكربون.", "- التفاعلات: الاحتراق، والاستبدال مع الهالوجينات.", "# الألكينات", "- هيدروكربونات غير مشبعة، فيها رابطة ثنائية واحدة على الأقل. صيغتها العامة CnH2n.", "- التفاعلات: الاحتراق، والإضافة (الهدرجة بوجود Ni أو Pt، وإضافة الهالوجين).", "! للتمييز بين الألكان والألكين: محلول البروم الأحمر يزول لونه مع الألكين ولا يتغير مع الألكان.", "# البلمرة", "- تفاعل يتحد فيه عدد كبير من المونومرات لتكوين البوليمر.", "- البوليمرات الصناعية: مثل البولي إيثيلين (من الإيثيلين)، وPVC (من فينيل كلوريد).", "- البوليمرات الطبيعية: السليلوز (في القطن)، والنشا (في البطاطا والأرز والقمح)."]}],[{"t": "الطاقة في التفاعلات الكيميائية", "e": ["# تغيرات الطاقة", "- تصاحب التفاعلات الكيميائية طاقة بأشكال مختلفة.", "- قانون حفظ الطاقة: الطاقة لا تفنى ولا تُستحدث، والطاقة الكلية قبل التفاعل = بعده.", "# نوعا التفاعلات", "- طارد للطاقة: يطلق طاقة، مثل تعادل HCl مع NaOH، و ΔH سالبة.", "- ماص للطاقة: يحتاج طاقة، مثل تحلل CaCO₃ بالحرارة، و ΔH موجبة.", "# المحتوى الحراري", "- المحتوى الحراري H: تعبير عن الطاقة المخزنة في المادة.", "- حرارة التفاعل ΔH = H(النواتج) − H(المتفاعلات).", "# المعادلة الكيميائية الحرارية", "- معادلة موزونة يُذكر فيها مقدار الحرارة المصاحبة.", "- في التفاعل الطارد: تُكتب الحرارة في جهة النواتج، أو تُكتب ΔH بإشارة سالبة.", "- في التفاعل الماص: تُكتب الحرارة في جهة المتفاعلات، أو تُكتب ΔH بإشارة موجبة.", "# استخدامها في الحسابات", "- نحسب الموالت، ثم نستخدم الحرارة المكتوبة للعدد المحدد من الموالت، وبالنسبة نحسب المطلوب.", "- مثال: احتراق 5 أطنان من الفحم (كتلة الكربون 5,000,000 غم، كتلته المولية 12) = 416,666.7 مول، والطاقة الناتجة ≈ 1.64×10⁸ كيلو جول."]}]];

{t:"أدوات القياس: الورنية والميكرومتر",e:[
"# الورنية",
"أداة قياس تستخدم لقياس الأطوال الصغيرة بدقة أكبر من المسطرة، وتقيس: السُّمك، والقطر الخارجي، والقطر الداخلي، وعمق الثقوب.",
"- تتكون من تدريج رئيسي ثابت وتدريج متحرك هو الورنية.",
"! القراءة النهائية = قراءة التدريج الرئيسي + (رقم الخط المنطبق × دقة الورنية)",
"? مثال: التدريج الرئيسي 2.4 سم، والخط المنطبق من الورنية رقم 2، ودقة الورنية 0.01 سم.",
"قراءة الورنية = 2 × 0.01 = 0.02 سم",
"القراءة النهائية = 2.4 + 0.02 = 2.42 سم",
"# الميكرومتر",
"أداة قياس دقيقة جداً (دقته 0.01 ملم) تستخدم لقياس الأطوال الصغيرة جداً مثل سمك ورقة أو قطر سلك.",
"! القراءة النهائية = قراءة التدريج الثابت + (قراءة التدريج الدائري × دقة الميكرومتر)"],
q:["- ما الذي تقيسه الورنية؟","- كيف نحسب القراءة النهائية للورنية؟","- ما دقة الميكرومتر؟ وكيف نحسب قراءته؟","- التدريج الرئيسي 2.4 سم والخط المنطبق 2 ودقة الورنية 0.01 سم، احسب القراءة."]}],[],[{"t": "وصف الحركة", "e": ["# المفاهيم الأساسية", "- متجه الموضع: المتجه من نقطة الإسناد إلى موضع الجسم.", "- المسافة: طول المسار الحقيقي، كمية قياسية دائماً موجبة.", "- الإزاحة: المتجه من البداية إلى النهاية، كمية متجهة.", "! في دورة كاملة على دائرة: المسافة = 2πنق، والإزاحة = صفر. الإزاحة لا تزيد على المسافة أبداً.", "- السرعة المتوسطة = الإزاحة ÷ الزمن، وحدتها م/ث، وهي متجهة باتجاه الإزاحة.", "- السرعة اللحظية: سرعة الجسم عند لحظة معينة، وتساوي ميل المماس لمنحنى (ف–ز).", "- التسارع المتوسط = التغير في السرعة ÷ الزمن، وحدته م/ث².", "# قراءة المنحنيات", "- ساكن: خط أفقي في (ف–ز)، والسرعة والتسارع صفر.", "- سرعة ثابتة: خط مستقيم مائل في (ف–ز)، ميله = السرعة، والتسارع صفر.", "- تسارع ثابت: منحنى تتزايد فيه السرعة بانتظام.", "- ميل منحنى (ع–ز) = التسارع، والمساحة تحته = الإزاحة.", "# معادلات الحركة بتسارع ثابت", "- ع2 = ع1 + ت·ز", "- ف = ع1·ز + ½ت·ز²", "- ع2² = ع1² + 2ت·ف", "# السقوط الحر", "- يُهمل فيه مقاومة الهواء، والتسارع ثابت = تسارع الجاذبية جـ ≈ 9.8 م/ث² (وتُستخدم 10 في المسائل).", "- جميع الأجسام تسقط بالتسارع نفسه بغض النظر عن كتلتها.", "# المقذوف رأسياً للأعلى", "- التسارع = −جـ أثناء الصعود، والسرعة عند أقصى ارتفاع = صفر.", "- زمن التحليق الكلي = ضعف زمن الوصول لأقصى ارتفاع."]}],[{"t": "قوانين نيوتن", "e": ["# القوة", "- القوة: مؤثر خارجي متجه قد يغيّر شكل الجسم أو مقدار سرعته أو اتجاهه. وحدتها النيوتن.", "# أنواع القوى", "- الوزن: و = ك × جـ.", "- القوة العمودية (التلامس): عمودية دائماً على السطح.", "- الاحتكاك: يعاكس اتجاه الحركة، وينشأ من تداخل نتوءات السطحين.", "- الشد: في الحبال والخيوط، باتجاه الحبل.", "- قوة النابض: ق = −أ·س، والإشارة السالبة تعني أنها تعاكس الإزاحة.", "# القوة المركزية في الحركة الدائرية المنتظمة", "- ق مركزية = ك·ع² ÷ نق، وتتجه نحو المركز.", "- الزمن الدوري ن = 2πنق ÷ ع، والتردد تر = 1 ÷ ن (وحدته هرتز).", "# القانون الأول (القصور الذاتي)", "- الجسم الساكن يبقى ساكناً، والمتحرك بسرعة ثابتة يبقى كذلك، ما لم تؤثر عليه محصلة قوى خارجية.", "- القصور الذاتي: ممانعة الجسم لتغيير حالته الحركية، ويعتمد على الكتلة.", "# القانون الثاني", "- محصلة القوى ق = ك × ت، والتسارع باتجاه المحصلة.", "! الكتلة لا تتغير بتغير المكان، أما الوزن فيتغير. على القمر وزنك يساوي سدس وزنك على الأرض.", "# القانون الثالث", "- لكل فعل رد فعل يساويه في المقدار ويعاكسه في الاتجاه، ويؤثران في جسمين مختلفين.", "- أمثلة: خرطوم الإطفاء، وارتداد المدفع."]}],[{"t": "الموائع السكونية", "e": ["# المائع", "- المائع: كل مادة تتصف بالجريان (السوائل) أو الانتشار (الغازات).", "# الضغط", "- الضغط = القوة العمودية ÷ المساحة، وحدته الباسكال (نيوتن/م²).", "- الضغط الجوي ≈ 1.013 × 10⁵ باسكال = 760 ملم زئبق.", "# ضغط السائل", "- ض = ث × ل × جـ، ويعتمد على العمق والكثافة وتسارع الجاذبية، ولا يعتمد على شكل الوعاء.", "! لهذا يُوضع خزان الماء مرتفعاً.", "# مبدأ باسكال", "- الضغط الخارجي على سائل محصور ينتقل بالتساوي إلى جميع أجزائه.", "- المكبس الهيدروليكي: ق1/أ1 = ق2/أ2. يُستخدم الزيت عادة لأن الهواء ينضغط.", "- تطبيقاته: رافعات السيارات، ومعاصر الزيتون، والفرامل.", "# قاعدة أرخميدس", "- الجسم المغمور في مائع يفقد من وزنه مقدار وزن المائع المزاح، وهذه هي قوة الطفو.", "- ينغمر إذا كانت كثافته أكبر من كثافة السائل، ويعلق إذا تساوت، ويطفو إذا كانت أقل.", "- تطبيقاته: الهيدروميتر، والسفينة، وعوامة الخزان، والغواصة، والبالون."]}]];

// المختبر العلمي: مساعد إرشادي محلي، وستُضاف تفاصيل التجارب من كتاب الطالب عند إرساله.
function labOpen(){nav("lab")}
function labAnalyze(){
  var q=$("labq"),obs=$("labobs"),data=$("labdata"),out=$("labanswer");
  if(!q||!out)return;
  var question=q.value.trim(),observations=obs?obs.value.trim():"",values=data?data.value.trim():"",experiment=$("labexp")?$("labexp").value:"";
  if(experiment&&!question)question="أريد تحليل تجربة: "+experiment;
  if(!question&&!observations&&!values){toast("اكتب سؤالك أو ملاحظات التجربة أولاً");return}
  var answer="ابدأ بمقارنة خطوات التجربة بين المحاولات، ثم افحص المتغيرات التي قد تؤثر في النتيجة.";
  if(/نسبة الخطأ|الخطأ المئوي|احسب الخطأ/i.test(question)){
    answer="لحساب نسبة الخطأ المئوية: |القيمة التجريبية − القيمة المقبولة| ÷ القيمة المقبولة × 100%.\nتأكد من توحيد الوحدات قبل التعويض. إذا لم تكن القيمة المقبولة معروفة، فلا يمكن حساب نسبة الخطأ المئوية بدقة.";
  }else if(/اختلفت النتائج|اختلاف النتائج|النتائج/i.test(question)){
    answer="قد تختلف النتائج بسبب اختلاف دقة القياس، أو قراءة التدريج، أو درجة الحرارة، أو كمية المواد، أو زمن التفاعل، أو عدم تثبيت الظروف بين المحاولات. حدّد أولاً أي متغير تغيّر فعلياً في تجربتك، ولا تعتمد سبباً قبل مقارنته بالملاحظات.";
  }else if(/التفاعل|سبب حدوث/i.test(question)){
    answer="لتفسير حدوث التفاعل، اذكر المواد قبل التفاعل وبعده، ثم اربط الملاحظة (مثل تغيّر اللون أو تكوّن غاز أو راسب أو تغيّر الحرارة) بما توضحه معادلة التفاعل في كتابك. لا يمكن تحديد التفاعل بدقة من دون اسم المواد والملاحظات.";
  }else if(/استنتاجي|الاستنتاج|صحيح/i.test(question)){
    answer="الاستنتاج الجيد يجيب عن هدف التجربة ويستند مباشرة إلى النتائج، ولا يضيف معلومة لم تُقَس. أرسل نص استنتاجك والنتائج حتى أراجع مدى توافقهما.";
  }
  answer+="\n\nالتجربة: "+(experiment||"لم تُحدد")+"\nسؤالك: "+question+"\nالملاحظات: "+(observations||"لم تُذكر")+
    "\nالبيانات: "+(values||"لم تُذكر")+
    "\n\nتنبيه: هذه إرشادات عامة أولية؛ ستُربط التجارب والمصطلحات بنص كتاب المنهاج عند إرساله.";
  out.textContent=answer;out.style.display="block";
}

BIO[0].push(LS("أجزاء المجهر الضوئي",["mic1","mic2","mic3"],["العدسة العينية: ينظر من خلالها الفاحص، والاسطوانة تحملها.","العدسات الشيئية: مثبتة على قرص تحريك العدسات (القرص الدوار).","المنضدة (المنصة): توضع عليها الشريحة وتثبتها مثبتات الشريحة.","المكثف (مجمّع الضوء) ومصدر الضوء: يوجهان الضوء نحو العينة.","الضابط الكبير والضابط الصغير: لتوضيح الصورة.","الذراع والقاعدة: يحملان أجزاء المجهر."],"",["ما وظيفة القرص الدوار في المجهر؟","اذكر أجزاء المجهر الضوئي المركب.","ما وظيفة كل من الضابط الكبير والضابط الصغير؟"]));
BIO[1].push(
LS("مكونات الخلية حقيقية النواة (حيوانية)",["cell"],["مكونات أساسية: الغشاء البلازمي، السيتوبلازم، النواة، النوية.","عضيات غشائية: الشبكة الإندوبلازمية الخشنة والملساء، جهاز جولجي، الميتوكندريا، الليسوسومات، حويصلات النقل والإفراز.","عضيات غير غشائية: الريبوسومات، المريكزات (الجسم المركزي)، الهيكل الخلوي.","وظائف الخلية: البناء، الحصول على الطاقة ATP، النقل والإفراز، الهضم وإعادة التدوير، الانقسام والتكاثر."],"الخلايا النباتية تشترك في معظم هذه المكونات، وتتميز بالجدار الخلوي والبلاستيدات الخضراء والفجوة العصارية الكبيرة.",["اذكر المكونات الأساسية للخلية حقيقية النواة.","صنّف العضيات إلى غشائية وغير غشائية.","ما الذي تتميز به الخلية النباتية عن الحيوانية؟"]),
LS("النواة ومكوناتها",["nucl"],["الغشاء النووي: غشاءان خارجي وداخلي، يفصل محتويات النواة عن السيتوبلازم ويحتوي مسامّ نووية.","المسام النووية: قنوات بروتينية تسمح بمرور مواد مثل RNA والبروتينات.","النوية: منطقة داكنة داخل النواة تنتج وحدات الريبوسومات (rRNA).","الكروماتين: DNA وبروتينات هستونية يحمل المعلومات الوراثية، ويتكثف إلى كروموسومات عند انقسام الخلية.","النيوكليوبلازم: مادة سائلة تشبه السيتوبلازم وتوفر بيئة مناسبة لتفاعلات النواة."],"النواة هي مركز التحكم في الخلية، وتحتوي المادة الوراثية وتنظم الأنشطة الخلوية.",["اذكر مكونات النواة ووظيفة كل منها.","ما الفرق بين الكروماتين والكروموسوم؟","ما وظيفة النوية؟"]),
LS("الشبكة الإندوبلازمية",["er"],["شبكة معقدة من الأغشية المترابطة في السيتوبلازم، تعمل كمنصة لتصنيع ونقل البروتينات والدهون.","الخشنة: على سطحها ريبوسومات، مسؤولة عن تصنيع البروتينات وتعديلها ونقلها إلى جهاز جولجي.","الملساء: بلا ريبوسومات، تصنّع الدهون والستيرويدات، وتزيل السموم، وتخزن الكالسيوم (مثل خلايا العضلات).","تتصل مباشرة بالغشاء النووي، وتكثر في الخلايا التي تصنع البروتينات والدهون بكميات كبيرة (مثل خلايا الكبد)."],"",["ما أنواع الشبكة الإندوبلازمية؟","قارن بين الخشنة والملساء.","ما الوظائف الرئيسية للشبكة الإندوبلازمية؟"]),
LS("جهاز جولجي",["golgi"],["عضية في معظم الخلايا حقيقية النواة، تعدّل وتغلّف وتنقل البروتينات والدهون التي تصنعها الشبكة الإندوبلازمية.","التركيب: أكياس غشائية مفلطحة (الصهاريج)، وجه داخلي cis يستقبل المواد ووجه خارجي trans يرسلها.","الوظائف: تعديل البروتينات والدهون، تغليف المواد في حويصلات، تكوين الليسوسومات، المشاركة في تكوين الغشاء البلازمي، وإفراز المواد خارج الخلية."],"",["ما وظائف جهاز جولجي؟","ما الفرق بين الوجه الداخلي cis والخارجي trans؟","ما علاقة جهاز جولجي بالشبكة الإندوبلازمية؟"]),
LS("الأجسام الحالّة (الليسوسومات)",["lyso"],["عضيات صغيرة محاطة بغشاء، تحتوي إنزيمات هاضمة قوية، وتُعرف بمحطات إعادة التدوير في الخلية.","الوظائف: هضم المواد غير المرغوب فيها (مثل العضيات التالفة)، تكسير الجزيئات الكبيرة، إعادة تدوير مكونات الخلية، الدفاع ضد الميكروبات، والمشاركة في موت الخلية المبرمج.","الإنزيمات: البروتيازات (للهضم البروتيني) والليبيزات (للهضم الدهني) والنوكليازات (للهضم النووي).","تتكون في جهاز جولجي، ويختلف عددها حسب نوع الخلية وحاجتها."],"",["ما الأجسام الحالّة؟ وما وظيفتها؟","اذكر ثلاثة أنواع من الإنزيمات الهاضمة فيها.","علّل: تكثر الأجسام الحالّة في خلايا الدم البيضاء."]),
LS("الميتوكندريا",["mito"],["عضيات تُعرف بمحطات الطاقة، تنتج جزيئات ATP من خلال التنفس الخلوي.","التركيب: غشاء خارجي يحيط بها، غشاء داخلي مطوي يكوّن الأعراف، والمصفوفة التي تحدث فيها معظم التفاعلات الاستقلابية.","تحتوي DNA خاصاً بها وريبوسومات خاصة بها (أصغر من ريبوسومات السيتوبلازم).","توجد في الخلايا الحيوانية والنباتية، ويختلف عددها حسب حاجة الخلية للطاقة."],"الميتوكندريا مسؤولة عن إنتاج الطاقة في الخلية.",["ما وظيفة الميتوكندريا؟","ما دور الأعراف الميتوكندرية؟","لماذا تحتوي الميتوكندريا على DNA وريبوسومات خاصة بها؟"]),
LS("الريبوسومات",["ribo"],["مصنع البروتين في الخلية: ترتبط بـ mRNA وتقرأ تسلسل النيوكليوتيدات، وتربط الأحماض الأمينية بواسطة tRNA.","المكونات: rRNA (حوالي 60-70%) وبروتينات ريبوسومية (حوالي 30-40%).","وحدتان: كبيرة وصغيرة. في حقيقيات النوى 80S (60S + 40S)، وفي بدائيات النوى 70S (50S + 30S).","توجد حرة في السيتوبلازم أو مرتبطة بالشبكة الإندوبلازمية الخشنة، وداخل الميتوكندريا والبلاستيدات الخضراء."],"الريبوسومات جسيمات صغيرة مكونة من rRNA وبروتينات، وتعمل على تصنيع البروتينات في الخلية.",["ما وظيفة الريبوسومات؟","مم تتكون الريبوسومات؟","أين توجد الريبوسومات في الخلية؟"]),
LS("الجسم المركزي",["cent"],["مركز تنظيم الأنابيب الدقيقة في الخلية الحيوانية.","يتكون من زوج من المريكزات (السنتريولات)، كل منها مكوّن من 9 ثلاثيات من الأنيبيبات الدقيقة، والمادة المحيطة بالجسم المركزي.","الوظائف: تنظيم تكوّن الأنيبيبات الدقيقة، تكوين مغزل الانقسام، والمساهمة في حركة الكروموسومات والعضيات.","تتضاعف السنتريولات قبل الانقسام، وتتجه كل مجموعة إلى أحد قطبي الخلية."],"الجسم المركزي موجود في الخلايا الحيوانية فقط ولا يوجد في الخلايا النباتية العالية.",["مم يتكون الجسم المركزي؟","ما وظيفته أثناء انقسام الخلية؟","هل يوجد الجسم المركزي في الخلايا النباتية؟"]),
LS("الهيكل الخلوي",["cyto"],["شبكة من الخيوط والبروتينات تمنح الخلية شكلاً ودعماً وتساعد في حركتها.","الخيوط الدقيقة (أكتين): قطرها ≈ 7 نانومتر، تشارك في حركة الخلية وتقلص العضلات وتكوين الأهداب والأسواط.","الخيوط المتوسطة (مثل الكيراتين): قطرها ≈ 10 نانومتر، تعطي الخلية قوة ميكانيكية ومقاومة للشد.","الخيوط السميكة (ميوسين): قطرها ≈ 15 نانومتر، تشارك في انقباض العضلات وحركة العضيات."],"الهيكل الخلوي ليس عضية محددة بغشاء، بل شبكة من الخيوط البروتينية في السيتوبلازم تحافظ على شكل الخلية وتسهّل حركتها ودعمها.",["ما وظائف الهيكل الخلوي؟","اذكر أنواع الخيوط في الهيكل الخلوي وقطر كل نوع.","ما دور الهيكل الخلوي في الخلية النباتية؟"]),
LS("الجدار الخلوي (ملخص مصوّر)",["wall"],["طبقة صلبة خارجية توجد في الخلايا النباتية، تمنحها الشكل والدعم والحماية.","مكوناته: السليلوز (المكون الأساسي)، الهيميسليلوز، البكتين، واللجنين (في بعض الخلايا الخشبية).","وظائفه: إعطاء الخلية الشكل والثبات، حمايتها من العوامل الميكانيكية والضغط الأسموزي، تنظيم مرور المواد، والمساهمة في النمو والانقسام، ودعم الفجوة العصارية."],"الجدار الخلوي بنية قوية ومرنة، يتكون أساساً من السليلوز مع الهيميسليلوز والبكتين.",["ما مكونات الجدار الخلوي؟","ما وظائف الجدار الخلوي؟","أين يوجد الجدار الخلوي؟"]));
BIO[2].push(
LS("المادة الوراثية (ملخص مصوّر)",["gen"],["الكروموسوم في حقيقيات النوى يتكون من DNA وبروتينات، أهمها بروتينات الهستون.","يلتف DNA حول بروتينات الهستون مكوناً النيوكليوسوم، وهو الوحدة الأساسية لتعبئة DNA.","ثم يحدث التفاف إضافي وتكثيف (Super-coil) لتشكيل الكروموسوم.","الأحماض النووية DNA وRNA مكونة من نيوكليوتيدات."],"المادة الوراثية تحمل المعلومات الوراثية في الكائن الحي وتحدد صفاته وتنتقل من الخلايا والأجيال إلى بعضها.",["ما المكونات الثلاثة للنيوكليوتيد؟","ما الفرق بين سكر DNA وسكر RNA؟","ما القواعد النيتروجينية في DNA؟ وفي RNA؟","لماذا تحتاج الخلية إلى تكثيف DNA في الكروموسوم؟","اذكر نوع الروابط بين القواعد المتقابلة في DNA."]),

var KH={"أي الكميات التالية كمية قياسية؟": "الكمية القياسية يكفي لتحديدها «مقدار + وحدة» فقط، ولا معنى لأن نضيف إليها اتجاهاً.\nجرّب مع كل خيار أن تقول «... نحو الشمال»: إن بدت العبارة غريبة فهي على الأرجح قياسية، وإن كانت مفهومة فهي متجهة.", "أي الكميات التالية كمية متجهة؟": "الكمية المتجهة تحتاج إلى «مقدار + وحدة + اتجاه» معاً.\nتذكّر أن بعض الكميات لها شقيق قياسي وآخر متجه (مثل المسافة والإزاحة). ما الذي يدلّ على الاتجاه في اسم الكمية؟ ثم ابحث عنه بين الخيارات.", "الكمية المتجهة تحتاج لتحديدها إلى:": "فكّر في مثال: إذا قلت لصديقك «ابتعد 5 أمتار» فهل يعرف أين يذهب؟\nاسأل نفسك: ما العناصر التي لا يكتمل وصف الكمية المتجهة إلا بها؟ وتأكد أن الخيار الذي تختاره لا ينقصه شيء ولا يزيد عليه.", "هل يجوز جمع قوة مع سرعة؟": "قاعدة مهمة: لا نجمع إلا كميات من النوع نفسه؛ فلا نجمع أمتاراً مع ثوانٍ مثلاً.\nانظر إلى القوة والسرعة: هل هما قياس للشيء نفسه؟ وهل يكفي تساوي المقدار أو اتحاد الاتجاه لنجمعهما؟", "العبارة «سرعة سيارة 20 كم/ساعة باتجاه الشرق» تمثل كمية:": "حلّل العبارة إلى أجزائها: ما الذي ذُكر فيها؟ رقم ووحدة، وهل ذُكر شيء آخر؟\nثم طابق ما وجدته مع تعريف الكمية القياسية والمتجهة.", "أي المجموعات التالية جميعها كميات متجهة؟": "المطلوب أن تكون كل الكميات في المجموعة متجهة، فيكفي أن تحتوي المجموعة كمية واحدة قياسية لتُستبعد.\nصنّف الكميات كلاً على حدة أولاً (قياسية/متجهة)، ثم افحص الخيارات واحداً واحداً.", "أي العبارات التالية صحيحة؟": "ميّز بين الكتلة والوزن: الكتلة هي مقدار المادة في الجسم، والوزن هو قوة جذب الأرض للجسم.\nاسأل: أيهما له اتجاه (نحو مركز الأرض)؟ وأيهما يُعبَّر عنه بمقدار فقط؟", "تحرك جسم 5 م شرقاً ثم 5 م غرباً، فتكون المسافة والإزاحة على الترتيب:": "المسافة هي طول المسار الكلي الذي قطعه الجسم مهما تغيّر اتجاهه.\nالإزاحة هي الفرق بين نقطة البداية ونقطة النهاية مع الاتجاه. ارسم الحركة على خط مستقيم، وحدّد أين بدأ الجسم وأين انتهى.", "متجهان |أ| = 3 و |ب| = 4 بالاتجاه نفسه، فإن مقدار المحصلة واتجاهها:": "عندما يكون المتجهان في الاتجاه نفسه تُجمع مقاديرهما مباشرة، وتكون المحصلة في ذلك الاتجاه.\nأما إذا كانا متعاكسين فيُطرح الأصغر من الأكبر. حدّد أي الحالتين لدينا ثم احسب.", "ذيل المتجه هو:": "يُرسم المتجه على شكل سهم له طرفان: طرف فيه رأس السهم، وطرف آخر في الجهة المقابلة له.\nتخيّل سهماً حقيقياً: ذيله يقع في الجهة المعاكسة لرأسه. اسأل نفسك: أي طرف من المتجه يقابل رأس السهم، وهل هو مكان البدء أم الانتهاء عند رسم المتجه؟", "طول السهم الذي يمثل المتجه يدل على:": "عند رسم متجه بمقياس رسم معيّن يكون لكل جزء من السهم معنى. فكّر: ماذا يخبرنا طول السهم، وماذا يخبرنا شكله وجهة رأسه؟\nتذكّر أن الكمية المتجهة لها مقدار واتجاه ووحدة، وكل واحد منها يُمثَّل بجزء مختلف من الرسم؛ حدّد الجزء الذي يعبّر عنه الطول.", "الاتجاهات الأصلية الأربعة هي:": "الاتجاهات الأصلية هي الاتجاهات الرئيسية التي تقابل أضلاع البوصلة، وتتعامد على بعضها وتُسمّى بأسماء بسيطة من كلمة واحدة.\nأما الاتجاهات التي تقع بين اتجاهين أصليين فتُسمّى فرعية. تحقّق أن الخيار يحتوي أربعة اتجاهات من كلمة واحدة وأنها خاصة بالبوصلة على سطح الأرض.", "متجه الوحدة هو متجه:": "متجه الوحدة يُستخدم لتعيين الاتجاه فقط، فهو بمثابة سهم مرجعي لا نهتم فيه بالكبر.\nاسأل نفسك: ما مقداره حتى يصلح لهذه المهمة (رقم بسيط لا يغيّر مقدار أي كمية عند الضرب)؟ وهل ما زال له اتجاه أم لا؟ قارن ذلك بالخيارات.", "يتساوى متجهان إذا تساويا في:": "المتجه كمية لها وصفان يحدّدانه. لكي نقول إن متجهين متساويان يجب أن يتطابق وصفاهما كاملين.\nلاحظ أن مكان رسم المتجه على الورقة لا يغيّر المتجه إذا حرّكناه موازياً لنفسه. فاسأل: ما الصفات التي لا بد أن تتطابق؟", "معكوس المتجه (أ) هو متجه:": "معكوس المتجه هو المتجه الذي إذا جمعناه مع المتجه الأصلي أعطى محصلة صفراً، أي يلغيه تماماً.\nفكّر في شخصين يشدّان حبلاً بالقوة نفسها من جهتين متقابلتين: ماذا تغيّر بينهما وماذا بقي كما هو؟ ثم ابحث عن الخيار الذي يطابق ذلك.", "إذا ضُرب متجه في العدد 3 فإن:": "ضرب المتجه في عدد ثابت (سلّمي) يغيّر طوله بحسب قيمة العدد، ويتحدد اتجاهه بإشارة هذا العدد.\nإذا كان العدد أكبر من 1 فهو يكبّر الطول، وإذا كان بين 0 و1 فهو يصغّره، وإذا كان سالباً فهو يعكس الاتجاه. طبّق ذلك على العدد في السؤال.", "الطريقة البيانية التي تستخدم لإيجاد محصلة متجهين لهما نقطة بداية واحدة هي طريقة:": "عندما يخرج متجهان من نقطة بداية واحدة نرسم من نهاية كل منهما خطاً موازياً للآخر فيتكوّن شكل رباعي.\nالمحصلة هي القطر الخارج من نقطة البداية المشتركة. فكّر في اسم الشكل الرباعي الذي أضلاعه المتقابلة متوازية، وابحث عن الطريقة التي ترتبط به.", "إذا كان 1 سم على الورقة يمثل 10 م، فإن 100 م تُمثَّل بسهم طوله:": "مقياس الرسم يربط طولاً على الورق بمسافة حقيقية. اكتب العلاقة على شكل نسبة: كل سنتيمتر واحد يقابل عدداً معيناً من الأمتار.\nلإيجاد طول السهم اقسم المسافة الحقيقية على قيمة ما يمثله السنتيمتر الواحد، وتأكد أن الوحدة الناتجة هي سنتيمتر.", "متجهان متعامدان مقداراهما 3 و 4، فإن مقدار محصلتهما:": "عندما يكون المتجهان متعامدين يشكلان ضلعي مثلث قائم الزاوية والمحصلة هي الوتر.\nاستخدم نظرية فيثاغورس: مربع الوتر = مجموع مربعي الضلعين. اربع كل مقدار واجمعهما، ثم خذ الجذر التربيعي للمجموع.", "في المسألة السابقة (3 و 4 متعامدان) زاوية ميل المحصلة θ = ظا⁻¹(4÷3) تساوي تقريباً:": "زاوية ميل المحصلة هي الزاوية بين المحصلة والمتجه الذي نقيس منه، وفي المثلث القائم ظل الزاوية = المقابل ÷ المجاور.\nالمعطى في السؤال يخبرك أي ضلع يكون في البسط وأي ضلع في المقام، فاحسب الناتج داخل القوسين أولاً.\nثم استخدم الآلة الحاسبة بوضع الدرجات (DEG) وطبّق الدالة العكسية للظل، وقارن الناتج بالخيارات.", "متجهان |أ| = 10 و |ب| = 6 متعاكسان (180°)، فإن مقدار المحصلة واتجاهها:": "عندما يكون المتجهان على خط واحد وباتجاهين متعاكسين فإن المقادير تُطرح بدلاً من أن تُجمع.\nاطرح المقدار الأصغر من الأكبر لتحصل على مقدار المحصلة. أما اتجاهها فيكون نحو المتجه الذي كان أقوى (أكبر مقداراً)؛ حدّد أي المتجهين هو ذلك.", "وحدة التسارع في النظام الدولي هي:": "التسارع هو معدل تغيّر السرعة بالنسبة للزمن، أي: التسارع = التغيّر في السرعة ÷ الزمن.\nاكتب وحدة السرعة في النظام الدولي، ثم اقسمها على وحدة الزمن، وانظر إلى الصيغة الناتجة وطابقها مع الخيارات.", "إذا كان منحنى (ف–ز) خطاً أفقياً فإن الجسم:": "في منحنى الموضع (الإزاحة) مع الزمن يدل الميل على السرعة. الخط الأفقي معناه أن الميل لا يتغيّر ولا يوجد ارتفاع أو انخفاض.\nاسأل نفسك: إذا لم يتغيّر موضع الجسم مع مرور الزمن فماذا يحدث لسرعته، وبالتالي لتسارعه؟ وانتبه للفرق بين الخط الأفقي والخط المائل.", "جسم أكمل دورة كاملة على دائرة نصف قطرها نق، فإن المسافة والإزاحة:": "المسافة هي طول المسار الكلي الذي سلكه الجسم، أما الإزاحة فهي المسافة المستقيمة من نقطة البداية إلى نقطة النهاية مع الاتجاه.\nمحيط الدائرة = 2π نق. اسأل نفسك: عندما يكمل الجسم دورة كاملة أين يصبح بالنسبة لنقطة بدايته؟ وكم يكون البعد بين البداية والنهاية؟", "ميل المماس لمنحنى (ف–ز) عند لحظة معينة يمثل:": "في منحنى (ف–ز) ميل الخط المستقيم يساوي التغيّر في الموضع ÷ التغيّر في الزمن. فما الكمية الفيزيائية التي لها هذا التعريف؟\nأما المماس فهو المستقيم الذي يلمس المنحنى عند نقطة واحدة فقط، فهو يعطي الميل عند تلك اللحظة بالذات وليس خلال فترة. اجمع الفكرتين لاختيار الجواب.", "تتأخر الريشة في السقوط عن الحجر في الهواء بسبب:": "عندما يسقط جسم في الهواء تؤثر فيه قوتان: جذب الأرض، وقوة أخرى من الهواء تعاكس الحركة وتزداد مع مساحة الجسم وخفته.\nتذكّر تجربة السقوط في الفراغ حيث تسقط الأجسام معاً. فكّر: ما العامل الذي يختلف بين الريشة والحجر في الهواء ويختفي في الفراغ؟", "المساحة تحت منحنى (ع–ز) تمثل:": "إذا تحرك الجسم بسرعة ثابتة فإن مساحة المستطيل تحت المنحنى = السرعة × الزمن. فما الكمية الفيزيائية الناتجة عن ضرب السرعة في الزمن؟\nالفكرة نفسها تنطبق عندما تتغيّر السرعة، فالمساحة تجمع هذه النواتج الصغيرة معاً. طابق وحدة الناتج (م/ث × ث) مع الخيارات.", "مقذوف رأسياً للأعلى: عند أقصى ارتفاع تكون سرعته وتسارعه:": "عندما يُقذف الجسم للأعلى تتناقص سرعته تدريجياً بسبب الجاذبية، ثم تنعكس حركته نحو الأسفل. عند اللحظة التي ينعكس فيها اتجاه الحركة ما قيمة السرعة؟\nأما الجاذبية فتبقى مؤثرة طوال الرحلة بدون توقف، ولها اتجاه ثابت نحو الأسفل. فكّر في تسارع الجاذبية هل يتغير عند القمة أم لا؟", "جسم سقط سقوطاً حراً من السكون (جـ = 10 م/ث²)، فإن سرعته بعد 3 ثوانٍ:": "في السقوط الحر من السكون السرعة الابتدائية تساوي صفراً، والتسارع هو تسارع الجاذبية المعطى.\nاستخدم القانون: ع = ع₀ + جـ × ز. عوّض السرعة الابتدائية والتسارع والزمن بالقيم المعطاة بنفس الوحدات (م/ث²، ثانية) ثم احسب الناتج.", "وحدة القوة في النظام الدولي:": "القوة تُعرَّف بقانون نيوتن الثاني: ق = ك × ت. اكتب وحدة الكتلة ووحدة التسارع في النظام الدولي ثم اضربهما.\nهذه الوحدة المركّبة لها اسم خاص تكريماً لعالم، وبعض الخيارات تمثل وحدات كميات أخرى مثل الطاقة والقدرة والضغط. اربط كل وحدة بكميتها.", "القانون الأول لنيوتن يسمى قانون:": "يصف القانون الأول لنيوتن ما يحدث للجسم عندما تكون محصلة القوى المؤثرة فيه صفراً: يبقى على حالته من السكون أو الحركة المنتظمة.\nهذه الخاصية تعني ممانعة الجسم لأي تغيير في حالته الحركية. فكّر في الاسم الذي يعبّر عن هذه الخاصية.", "العلاقة ق = ك × ت تمثل القانون:": "علاقة ق = ك × ت تربط محصلة القوى بالكتلة والتسارع، أي أنها تخبرنا كيف تتغير حركة الجسم عندما تؤثر فيه قوة.\nتذكّر أن كل قانون من قوانين نيوتن الثلاثة يصف أمراً مختلفاً: الأول عن حالة عدم وجود محصلة، والثالث عن أزواج القوى المتبادلة. حدّد أيها يتناول العلاقة بين القوة والتسارع، وانتبه أن قانون هوك يخص النوابض.", "القصور الذاتي للجسم يعتمد على:": "القصور الذاتي هو مقاومة الجسم لتغيير حالته الحركية، فالأجسام الثقيلة يصعب تحريكها أو إيقافها.\nفكّر: إذا دفعت صندوقاً فارغاً ثم صندوقاً مملوءاً بالكتب أيهما أصعب تحريكه؟ وما الخاصية التي تغيّرت بينهما: اللون أم السرعة أم الحجم أم خاصية أخرى؟", "الإشارة السالبة في قانون هوك ق = −أ·س تعني أن قوة النابض:": "قانون هوك يربط قوة النابض بمقدار استطالته أو انضغاطه (الإزاحة س عن وضع الاتزان). والنابض يحاول دائماً أن يعود إلى وضعه الطبيعي.\nفكّر: إذا سحبت النابض نحو اليمين فإلى أي جهة يشدّ يدك؟ وماذا تدل عليه الإشارة السالبة عن العلاقة بين اتجاه القوة واتجاه الإزاحة؟", "جسم كتلته 5 كغم أثرت فيه محصلة قوى 20 نيوتن، فإن تسارعه:": "استخدم قانون نيوتن الثاني: ق = ك × ت، ومنه ت = ق ÷ ك.\nالقوة هنا هي المحصلة، والكتلة بالكيلوغرام، والتسارع بوحدة م/ث². عوّض القيمتين المعطاتين مباشرة في العلاقة وأجرِ القسمة.", "وزن جسم على الأرض 60 نيوتن، فإن وزنه على القمر (سدس وزنه على الأرض) وكتلته:": "الوزن قوة جذب الكوكب للجسم، ويتغيّر بتغيّر الجاذبية. أما الكتلة فهي مقدار المادة في الجسم، وهي ثابتة أينما ذهب.\nاحسب الوزن الجديد بضرب الوزن الأول في الكسر المعطى في السؤال. ثم اسأل: هل يتغيّر عدد الذرات في الجسم عند نقله إلى القمر؟", "جسم كتلته 2 كغم يتحرك في دائرة نصف قطرها 1 م بسرعة 3 م/ث، فإن القوة المركزية:": "القوة المركزية هي القوة اللازمة لإبقاء الجسم في مسار دائري، وقانونها: ق = ك × ع² ÷ نق.\nعوّض الكتلة والسرعة ونصف القطر بوحداتها الصحيحة (كغم، م/ث، م). تذكّر أن السرعة تُربَّع أولاً ثم تُضرب في الكتلة ثم تُقسم على نصف القطر.", "ارتداد خرطوم الإطفاء إلى الخلف عند اندفاع الماء يُفسَّر بقانون نيوتن:": "عندما يندفع الماء بقوة إلى الأمام من الخرطوم فإن الخرطوم نفسه يتأثر بشيء ما. ما هي القوة التي يؤثر بها الماء في الخرطوم؟\nتذكّر قانون نيوتن الذي ينص على أن لكل فعل رد فعل. حدّد من يؤثر في من، وما اتجاه كل قوة مقارنةً بالأخرى.", "وحدة الضغط في النظام الدولي:": "الضغط = القوة العمودية ÷ المساحة. اكتب وحدة القوة في النظام الدولي ووحدة المساحة، ثم اقسم إحداهما على الأخرى.\nالوحدة الناتجة لها اسم خاص أيضاً تكريماً لعالم، ابحث بين الخيارات عن الوحدة التي تطابق قياس الضغط وليس القوة أو الطاقة أو الكتلة.", "الضغط يساوي:": "الضغط يقيس مدى تركيز القوة على مساحة معينة. تخيّل أن تضغط بإصبعك على جدار ثم تضغط بكفك بالقوة نفسها: أيهما يؤثر أكثر؟\nمن هذه الفكرة فكّر كيف يتناسب الضغط مع القوة (طردياً أم عكسياً) ومع المساحة، ثم اختر الصيغة التي تعبّر عن ذلك.", "الضغط الجوي المعياري يعادل:": "الضغط الجوي هو ضغط عمود الهواء فوقنا، ويُقاس بالبارومتر الزئبقي بارتفاع عمود الزئبق في الأنبوب عند مستوى سطح البحر.\nتذكّر القيمة المعيارية التي تعادل جوياً واحداً (1 atm) بوحدة ملم زئبق، وانتبه لمنازل العدد.", "ضغط السائل عند نقطة يعتمد على:": "في السوائل الساكنة يُحسب الضغط بالعلاقة: ض = ث × جـ × ع (الكثافة × تسارع الجاذبية × العمق).\nانظر إلى المتغيرات الموجودة في القانون، وانتبه أن شكل الوعاء أو كمية السائل الكلية لا تظهر فيه. ثم اختر الخيار الذي يطابق ما يظهر في القانون.", "المكبس الهيدروليكي يعمل وفق مبدأ:": "في المكبس الهيدروليكي نؤثر بقوة صغيرة على مكبس صغير فتنتقل إلى مكبس كبير فيرفع حملاً ثقيلاً.\nفكّر في الفكرة التي تفسر انتقال الضغط من نقطة إلى بقية السائل المحبوس دون نقصان، وانسبها إلى العالم الذي وضعها. وانتبه إلى أن العلماء الآخرين في الخيارات اشتهروا بأفكار تخص الطفو والنوابض والحركة.", "يطفو الجسم في السائل إذا كانت كثافته:": "يحدّد الطفو أو الغرق كون الجسم أكثف أو أخف من السائل المحيط به. تخيّل قطعة خشب وقطعة حديد في ماء.\nقارن بين كثافة الجسم وكثافة السائل: متى تكون القوة الرافعة (قوة الطفو) كافية لدفع الجسم للأعلى وإبقائه عند السطح؟", "مكبس هيدروليكي مساحة مكبسه الصغير 2 سم² والكبير 20 سم²، أثرت قوة 10 نيوتن على الصغير، فالقوة على الكبير:": "في المكبس الهيدروليكي الضغط متساوي على المكبسين: ق₁ ÷ م₁ = ق₂ ÷ م₂.\nومنها ق₂ = ق₁ × (م₂ ÷ م₁). احسب نسبة المساحتين أولاً (الكبير على الصغير)، ثم اضربها في القوة المؤثرة على المكبس الصغير. لا حاجة لتحويل الوحدات لأن المساحتين بنفس الوحدة.", "ضغط الماء (ث = 1000 كغم/م³) على عمق 2 م (جـ = 10 م/ث²) يساوي:": "استخدم قانون ضغط السائل: ض = ث × جـ × ع.\nعوّض الكثافة وتسارع الجاذبية والعمق بالقيم المعطاة بوحداتها (كغم/م³، م/ث²، م) وأجرِ الضرب لتحصل على الضغط بالباسكال. لاحظ أن السؤال يطلب ضغط الماء وحده.", "يُستخدم الزيت في المكبس الهيدروليكي وليس الهواء لأن:": "المكبس الهيدروليكي ينقل الضغط عبر مائع محبوس. فكّر في ما يحدث للغاز عندما نضغطه (هل يقلّ حجمه بسهولة؟) وما يحدث للسائل.\nاسأل: ما الصفة التي تجعل السائل أفضل في نقل القوة كاملة؟ وما الذي سيحدث لجزء من الجهد المبذول لو كان المائع قابلاً للانضغاط؟", "عدد أفوجادرو يساوي تقريباً:": "عدد أفوجادرو هو عدد الجسيمات (ذرات أو جزيئات أو أيونات) في مول واحد من أي مادة.\nيُكتب بالصيغة العلمية على شكل عدد مضروب في قوة للعدد 10، وهو عدد ضخم جداً. تذكّر القيمة وانتبه للأس الموجب الكبير، فبعض الخيارات تمثل ثوابت فيزيائية أخرى.", "وحدة الكتلة المولية:": "الكتلة المولية هي كتلة مول واحد من المادة. اكتب هذا التعريف على شكل نسبة: كتلة مقسومة على كمية المادة.\nالكتلة تُقاس بالغرام وكمية المادة تُقاس بالمول، فركّب الوحدة بوضع البسط والمقام في موضعيهما الصحيحين.", "حجم مول واحد من أي غاز في الظروف المعيارية STP:": "الحجم المولي هو الحجم الذي يشغله مول واحد من الغاز، وقد وجد العلماء أنه ثابت لكل الغازات تقريباً في الظروف المعيارية.\nتذكّر القيمة الشهيرة للحجم المولي بوحدة اللتر، وتحقّق من أنها تقع بين الأرقام التي تمثل حجماً صغيراً جداً وحجماً كبيراً جداً.", "الظروف المعيارية STP هي:": "الظروف المعيارية STP اتفاق بين العلماء على ضغط ودرجة حرارة محددين لتسهيل المقارنة بين الغازات.\nتذكّر أن درجة الحرارة هي درجة تجمد الماء، وأن الضغط هو الضغط الجوي المعتاد عند مستوى سطح البحر. ثم راجع كل خيار على حدة وتأكد من تطابق القيمتين معاً.", "عدد المولات يُحسب من القانون:": "انتبه إلى الوحدات: الكتلة تُقاس بالغرام، والكتلة المولية بوحدة غم/مول، والمطلوب عدد بوحدة مول.\nجرّب كل صيغة في الخيارات وانظر: أيّها تجعل وحدة الغرام تختفي فتبقى «مول» فقط؟ تذكّر أن (غم ÷ غم/مول) تعني ضرب الغرامات في مقلوب الكسر.", "الكتلة المولية لكربونات الكالسيوم CaCO₃ (Ca=40، C=12، O=16):": "الكتلة المولية للمركب = مجموع الكتل الذرية لكل الذرات الموجودة في صيغة جزيء المركب (أو وحدة صيغته).\nاقرأ الأرقام الصغيرة أسفل رمز كل عنصر لتعرف عدد ذراته، واضرب هذا العدد في كتلته الذرية، ثم اجمع النتائج وضع الوحدة غم/مول.", "كتلة مول واحد من جزيئات الأكسجين O₂ (O=16):": "الأكسجين الغازي يوجد على شكل جزيئات ثنائية الذرة، والرقم 2 في الصيغة O₂ يخبرك بعدد الذرات في الجزيء الواحد.\nالكتلة المولية للجزيء = مجموع كتل ذراته، وكتلة مول واحد بالغرام تساوي عددياً الكتلة المولية. احسب كتلة الذرتين معاً.", "في مول واحد من الجلوكوز C₆H₁₂O₆ يوجد من ذرات الكربون:": "الأرقام الصغيرة في الصيغة الكيميائية تدل على عدد الذرات في الجزيء الواحد، وهي نفسها عدد مولات الذرات في مول واحد من المركب.\nانظر إلى الرقم المكتوب بعد رمز الكربون في C₆H₁₂O₆ ولا تخلطه بأرقام العناصر الأخرى.", "عدد ذرات الحديد في 0.25 مول Fe يساوي تقريباً:": "عدد الجسيمات = عدد المولات × عدد أفوجادرو، وقيمة عدد أفوجادرو تقريباً 6.02 × 10²³ جسيم/مول.\nاضرب العدد العشري في 6.02 ثم عدّل الناتج ليصبح على صورة الصيغة العلمية (رقم بين 1 و10 مضروباً في قوة للعدد 10). انتبه أن تكون القوة صحيحة بعد التعديل.", "عدد مولات 10 غم من الكالسيوم (الكتلة الذرية 40):": "عدد المولات = الكتلة ÷ الكتلة المولية، والكتلة المولية للعنصر تساوي عددياً كتلته الذرية بوحدة غم/مول.\nعوّض الكتلة المعطاة والكتلة المولية في القانون، وتأكد أن الغرامات تختصر فتبقى وحدة المول.", "حجم 5 مول من غاز N₂ في STP:": "عند STP يشغل مول واحد من أي غاز حجماً ثابتاً مقداره 22.4 لتر، لذلك: الحجم = عدد المولات × 22.4 لتر/مول.\nعوّض عدد المولات المعطى في القانون، ولا تحتاج هنا إلى الكتلة المولية للنيتروجين.", "كتلة أسطوانة حجمها 10 لتر من غاز H₂ في STP (H=1) تساوي تقريباً:": "المسألة من خطوتين: حوّل الحجم إلى عدد مولات بالقسمة على الحجم المولي 22.4 لتر/مول عند STP، ثم حوّل المولات إلى كتلة بالضرب في الكتلة المولية.\nانتبه أن الهيدروجين الغازي جزيء ثنائي الذرة H₂، فاحسب كتلته المولية من ذرتين لا من ذرة واحدة.", "الكتلة المولية للشبة KAl(SO₄)₂·12H₂O (K=39، Al=27، S=32، O=16، H=1):": "اجمع الكتل الذرية لكل ذرات الصيغة، وانتبه لما يضاعفه الرقم: الرقم الصغير بعد القوس يضاعف كل ما داخل القوس.\nالنقطة قبل 12H₂O تعني جمع ماء التبلور، أي أن الرقم 12 يضاعف جزيء الماء كله (ذرتا هيدروجين وذرة أكسجين). احسب كتلة الماء وحدها أولاً ثم أضفها إلى كتلة الجزء الآخر.", "نزن المعادلة الكيميائية لتحقيق قانون:": "في أي تفاعل كيميائي تُعاد ترتيب الذرات فقط؛ لا تظهر ذرات جديدة ولا تختفي ذرات قديمة.\nوزن المعادلة يعني جعل عدد ذرات كل عنصر متساوياً في طرفيها. ابحث بين الخيارات عن القانون الذي يتحدث عن بقاء شيء ما ثابتاً قبل التفاعل وبعده.", "المعاملات في المعادلة الموزونة تمثل نسب:": "المعاملات هي الأعداد التي نكتبها أمام الصيغ، وتدل على عدد الجسيمات (جزيئات أو ذرات) التي تتفاعل وتنتج بنسبة معينة.\nالمول وحدة لعدّ الجسيمات (6.02 × 10²³ جسيماً). وفكّر: هل كتلة مول من مادة تساوي كتلة مول من مادة أخرى؟", "في المعادلة الموزونة للغازات تمثل المعاملات أيضاً نسب:": "في المعادلة الموزونة تدلّ المعاملات على نسبة عدد المولات (أو الجزيئات) بين المواد.\nوعند ثبات درجة الحرارة والضغط يقول قانون أفوجادرو إن الغازات المتساوية في الحجم تحتوي العدد نفسه من الجزيئات.\nاربط بين الفكرتين، ثم اسأل نفسك: أي كمية للغازات تتناسب مع عدد المولات؟", "في التفاعل 2H₂ + O₂ → 2H₂O، عدد مولات الماء الناتجة من 4 مول H₂:": "نسبة المولات تؤخذ من المعاملات في المعادلة الموزونة: كوّن نسبة بين معامل المادة المعطاة ومعامل المادة المطلوبة.\nاضرب عدد المولات المعطى في هذه النسبة بحيث تختصر وحدة المادة المعطاة. لا حاجة هنا إلى الكتل.", "أول خطوة في حل مسائل المعادلة الموزونة:": "كل حسابات المعادلة تعتمد على المعاملات لأننا نأخذ منها النسب المولية بين المواد.\nاسأل نفسك: هل يمكن الوثوق بنسبة مأخوذة من معادلة لم نتأكد من اتزانها؟ ما الذي يجب فعله قبل أي حساب كي لا تكون النسب خاطئة؟", "في التفاعل 2H₂ + O₂ → 2H₂O، مولات O₂ اللازمة لتفاعل 2 مول H₂:": "خذ المعاملين من المعادلة: معامل H₂ ومعامل O₂، وتذكّر أن غياب الرقم أمام الصيغة يعني أن معاملها 1.\nكوّن نسبة مولية (مولات O₂ لكل مولات H₂) ثم اضربها في المعطى 2 مول H₂.", "في التفاعل 5O₂ + 4NH₃ → 4NO + 6H₂O، كتلة O₂ اللازمة لتفاعل 17 غم من NH₃ (N=14، H=1، O=16):": "الحل على ثلاث خطوات: (1) حوّل كتلة NH₃ إلى مولات بقسمتها على كتلتها المولية (N + 3H). (2) استعمل النسبة المولية بين معاملي O₂ وNH₃ لإيجاد مولات O₂. (3) حوّل مولات O₂ إلى كتلة بالضرب في كتلتها المولية.\nانتبه أن O₂ جزيء ثنائي الذرة، وأن النسبة المولية تُقرأ من المعاملين 5 و4 مرتبين حسب المطلوب والمعطى.", "في التفاعل 2H₂ + O₂ → 2H₂O، حجم O₂ اللازم لتفاعل 10 لتر من H₂ (الظروف نفسها):": "المادتان غازان في الظروف نفسها من الضغط ودرجة الحرارة، فنسبة الحجوم تساوي نسبة المعاملات (نسبة المولات).\nلا حاجة إلى تحويل الحجم إلى مولات: اضرب الحجم المعطى مباشرة في نسبة معامل O₂ إلى معامل H₂.", "كتلة الماء الناتجة من تفاعل 2 مول من H₂ مع كمية كافية من O₂ (H₂O = 18 غم/مول):": "أولاً أوجد عدد مولات الماء الناتجة من النسبة بين معاملي H₂ وH₂O في المعادلة، فعبارة (كمية كافية من O₂) تعني أن H₂ هو الذي يحدد الناتج.\nثم حوّل المولات إلى كتلة بالضرب في الكتلة المولية للماء (18 غم/مول).", "الهيدروكربونات مركبات تتكون من:": "فكّك اسم المركب إلى جزأين: «هيدرو» و«كربون»؛ كل جزء منهما يدل على عنصر.\nانتبه إلى كلمة (فقط) في الخيارات، فالمركب الذي يحتوي عناصر إضافية لا ينطبق عليه تعريف الهيدروكربون.", "أهم مصدر للهيدروكربونات:": "الهيدروكربونات هي المادة الأولية لوقود السيارات والديزل وكثير من البلاستيك، وهذه المواد تُستخرج من باطن الأرض بعد أن تكوّنت من بقايا كائنات حية عبر ملايين السنين.\nاسأل: أي الخيارات خام يحتوي مركبات الكربون والهيدروجين بكثرة ويُكرَّر لنحصل على هذه الوقودات؟", "الصيغة العامة للألكانات:": "في الألكانات ترتبط كل ذرة كربون بأربع روابط أحادية. جرّب القانون على أبسط مثالين: الميثان CH₄ (n = 1) والإيثان C₂H₆ (n = 2).\nعوّض n في كل صيغة من الخيارات وقارن عدد الهيدروجين الناتج بعددها الحقيقي في المثالين.", "الصيغة العامة للألكينات:": "الألكين هيدروكربون يحتوي رابطة ثنائية واحدة بين ذرتي كربون، وهذه الرابطة تقلل عدد الهيدروجين مقارنة بالألكان نفسه.\nاختبر الصيغ على الإيثين C₂H₄ والبروبين C₃H₆: عوّض n بـ 2 ثم 3 وانظر أي صيغة تعطي عدد الهيدروجين الصحيح.", "أي متآصلات الكربون التالية الأكثر قساوة؟": "المتآصلات أشكال مختلفة للعنصر نفسه، تختلف في طريقة ترتيب الذرات وترابطها. تأكد أولاً أن كل خيار هو فعلاً شكل من أشكال الكربون.\nثم قارن بنيتها: شبكة ثلاثية الأبعاد ترتبط فيها كل ذرة بأربع ذرات، أم طبقات يسهل أن تنزلق فوق بعضها؟ والبنية الأكثر ترابطاً هي الأقسى.", "الألكانات هيدروكربونات مشبعة لأن روابطها:": "كلمة (مشبع) تعني أن كل ذرة كربون ارتبطت بأكبر عدد ممكن من الذرات الأخرى، فلا مجال لإضافة ذرات جديدة.\nفكّر: ماذا يحدث لعدد الذرات المرتبطة بالكربون إذا شاركت ذرتا كربون بأكثر من زوج من الإلكترونات؟ ثم حدّد نوع الروابط التي تحقق التشبع.", "المقطع «ان» في اسم «ميثان» يدل على أن المركب:": "أسماء عائلات الهيدروكربونات تتميز بنهايتها: يشترك الميثان والإيثان والبروبان في نهاية واحدة، وتختلف عنها نهاية الإيثين والإيثاين.\nاسأل: إلى أي عائلة ينتمي الميثان؟ ثم طابق نهاية اسمه مع العائلة المناسبة.", "التقطير التجزيئي لمكونات النفط يعتمد على اختلاف:": "التقطير التجزيئي يفصل مزيجاً من عشرات المركبات بتسخينه في برج، فتتبخر المكوّنات ثم تتكثف عند مستويات مختلفة.\nلا ينجح الفصل إلا إذا اختلفت المكوّنات في خاصية فيزيائية تحدد متى يتحول السائل منها إلى بخار ومتى يعود فيتكثف. ما هذه الخاصية؟", "أي نواتج تقطير النفط تخرج أولاً (الأقل درجة غليان)؟": "كلما كبر الجزيء (زاد عدد ذرات الكربون في سلسلته) زادت قوى التجاذب بين الجزيئات وارتفعت درجة غليانه.\nرتّب الخيارات من أصغر جزيئات إلى أكبرها، والجزء ذو الجزيئات الأصغر يتبخر عند أقل حرارة فيخرج من أعلى البرج أولاً. تذكّر أيضاً الحالة الفيزيائية لكل منها في درجة حرارة الغرفة.", "عند إضافة محلول البروم الأحمر إلى ألكين:": "اللون الأحمر لمحلول البروم سببه جزيئات البروم Br₂ الحرة في المحلول.\nالألكين يحتوي رابطة ثنائية تتفاعل بالإضافة مع Br₂، فتتحد ذرتا البروم بذرتي الكربون. فكّر: ماذا يحدث لجزيئات البروم الحرة بعد التفاعل، وكيف ينعكس ذلك على لون المحلول؟", "ألكان يحتوي 14 ذرة هيدروجين، فعدد ذرات الكربون فيه:": "الصيغة العامة للألكانات CₙH₂ₙ₊₂ تربط عدد ذرات الهيدروجين بعدد ذرات الكربون n.\nضع عدد الهيدروجين المعطى مكان 2n + 2 وحلّ المعادلة البسيطة لإيجاد n.", "عدد متشكلات البيوتان C₄H₁₀:": "المتشكلات مركبات لها الصيغة الجزيئية نفسها لكن ترتيب ذراتها مختلف.\nارسم هيكل الكربون الأربعة أولاً كسلسلة مستقيمة، ثم حاول رسم هيكل آخر بتفرع. انتبه: إذا أمكن الحصول على أحد الرسمين من الآخر بالدوران أو بقلب السلسلة فهما مركب واحد لا مركبان.", "التفاعل: بروبين + H₂ (بوجود Ni) → بروبان يسمى تفاعل:": "قارن بين المتفاعلات والناتج: ماذا حدث للرابطة الثنائية في البروبين، وما الذي دخل على الجزيء؟\nفرّق بين تفاعل تُستبدل فيه ذرة بذرة، وتفاعل تُضاف فيه ذرات إلى الجزيء من دون أن يخرج منه شيء، وبين الاحتراق مع الأكسجين وتكوين سلاسل طويلة من وحدات متكررة.", "المونومر المستخدم لتحضير البولي إيثيلين:": "المونومر هو الوحدة الصغيرة التي تتكرر وتتحد مع أمثالها لتكوّن البوليمر. بادئة (بولي) تعني (عدة)، وبقية الاسم تدل على الوحدة المتكررة.\nلكي تتصل المونومرات تحتاج إلى رابطة ثنائية تنفتح فتصل الجزيء بالجزيء التالي، فاسأل أي الخيارات هيدروكربون يحتوي رابطة ثنائية.", "أي المواد التالية بوليمر طبيعي؟": "البوليمر الطبيعي تصنعه الكائنات الحية (مثل النباتات والحيوانات) ويوجد في الطبيعة، أما البوليمر الصناعي فيُصنَّع في المصانع من مواد خام نفطية.\nاسأل نفسك عن كل خيار: هل هو مادة بلاستيكية مصنعة، أم مكوّن أساسي في جدران الخلايا النباتية؟", "التفرع في سلسلة الألكان يؤدي عادة إلى:": "قارن بين سلسلة مستقيمة وسلسلة متفرعة لها عدد الذرات نفسه: الأولى طويلة وممتدة والثانية أكثر تقارباً من الشكل الكروي.\nكلما قلّت مساحة التلامس بين الجزيئات المتجاورة ضعف التجاذب بينها، فاسأل كيف يؤثر ذلك في الحرارة اللازمة لفصل الجزيئات عن بعضها.", "ينص قانون حفظ الطاقة على أن الطاقة:": "فكّر في مثال: عند احتراق وقود تتحول الطاقة الكيميائية المخزنة فيه إلى حرارة وضوء.\nقارن مجموع الطاقة قبل التحول وبعده، واسأل: هل تغيّر المجموع أم تغير الشكل فقط؟ واختر العبارة التي تصف ذلك.", "إشارة ΔH في التفاعل الطارد للطاقة:": "ΔH = H(النواتج) − H(المتفاعلات). التفاعل الطارد يطلق طاقة إلى المحيط، فينقص المحتوى الحراري للمواد المتفاعلة.\nاسأل: إذا كان الناتج أقل طاقة من المتفاعلات، فهل الفرق (النواتج − المتفاعلات) أكبر من الصفر أم أصغر منه؟", "أي التفاعلات التالية ماص للطاقة؟": "التفاعل الماص يمتص طاقة من المحيط، فيحتاج إلى تسخين مستمر ليستمر، وإذا توقف التسخين توقف التفاعل.\nأما الطارد فيُطلق حرارة وقد يصاحبه لهب أو سخونة. اسأل عن كل خيار: هل يعطي حرارة أم يحتاج إليها؟", "حرارة التفاعل ΔH تساوي:": "ΔH تعبّر عن التغير في المحتوى الحراري، والتغير في أي كمية يُحسب دائماً بالنهائي ناقص الابتدائي (مثل تغير درجة الحرارة).\nحدّد ما الحالة النهائية وما الحالة الابتدائية في التفاعل الكيميائي، ثم طابقهما مع الخيارات.", "في المعادلة الحرارية للتفاعل الماص تُكتب الحرارة:": "عند كتابة معادلة حرارية نضع الحرارة في الجهة التي يظهر فيها دورها: الحرارة الناتجة تظهر مع المواد الناتجة، كما في مثال الكربون في السؤال 83.\nفي التفاعل الماص تُمتص الحرارة فتكون مثل مادة مستهلكة. في أي جهة تكتب المواد المستهلكة؟", "تفاعل Na مع الماء ΔH = −368.6 كيلو جول، والإشارة السالبة تعني أن التفاعل:": "الإشارة في ΔH تدل على اتجاه انتقال الطاقة، وهي مأخوذة من القانون: ΔH = H(النواتج) − H(المتفاعلات).\nإذا كانت قيمة ΔH سالبة فاسأل: هل المحتوى الحراري للنواتج أكبر أم أصغر من المتفاعلات؟ ثم هل ذلك يعني أن النظام امتص طاقة أم أطلقها؟", "في التفاعل الطارد يكون المحتوى الحراري للنواتج:": "في التفاعل الطارد تكون ΔH سالبة، وΔH = H(النواتج) − H(المتفاعلات).\nأو تخيل مخططاً للطاقة: النظام يطلق طاقة إلى المحيط، فينتقل من مستوى طاقة أعلى إلى مستوى طاقة آخر. حدّد أي الطرفين (المتفاعلات أم النواتج) يكون في المستوى الأعلى.", "C + O₂ → CO₂ + 394 كيلو جول. الطاقة الناتجة من احتراق 2 مول كربون:": "المعادلة تخبرك بالطاقة الناتجة عن كمية محددة من الكربون، وهي المعامل المكتوب أمام C في المعادلة.\nالطاقة الناتجة تتناسب طردياً مع عدد المولات المتفاعلة. قارن كمية الكربون في السؤال بتلك الكمية، وضاعف الطاقة بالنسبة نفسها.", "الطاقة الناتجة من احتراق 5 أطنان من الفحم (كربون صافٍ، C=12) وفق المعادلة السابقة تقريباً:": "هذه مسألة حرارة تفاعل: المعادلة السابقة تعطي الطاقة الناتجة عن احتراق كمية معلومة من الكربون (عدد مولات محدد في المعادلة)، ومنها تحصل على الطاقة لكل مول واحد.\nالخطوات: حوّل الكتلة من طن إلى غرام (الطن الواحد يساوي مليون غرام)، ثم احسب عدد المولات = الكتلة ÷ الكتلة المولية. بعدها اضرب عدد المولات في الطاقة الناتجة عن مول واحد من الكربون (انتبه لمعامل الكربون في المعادلة).\nأخيراً قارن رتبة الناتج (قوة العشرة) بالخيارات للتأكد من أنك لم تخطئ في تحويل الوحدات.", "أطول أطوار دورة الخلية هو:": "تتكون دورة الخلية من مرحلة إعداد تنمو فيها الخلية وتنسخ مادتها الوراثية وتجهّز نفسها، ومن مرحلة انقسام فعلي تنقسم فيها النواة ثم السيتوبلازم.\nاسأل نفسك: أي المرحلتين تقضي فيها الخلية معظم عمرها، وأيهما سريعة نسبياً؟\nثم صنّف كل خيار: هل هو طور من أطوار الانقسام أم اسم لمرحلة أخرى من الدورة؟", "يتضاعف DNA في الخلية خلال المرحلة:": "في دورة الخلية مراحل نمو ومرحلة للانقسام، ولكل حرف في أسمائها معنى باللغة الإنجليزية يدل على ما يحدث فيها.\nفكّر: متى يجب أن تحصل الخلية على نسخة ثانية كاملة من مادتها الوراثية، قبل أن تبدأ الانقسام أم بعده؟ وما الذي يضمن أن تأخذ كل خلية بنت نسخة كاملة؟", "من الخلايا التي تدخل طور السكون الدائم G0:": "طور G0 هو خروج الخلية من الدورة فلا تنقسم، وقد يكون مؤقتاً أو دائماً.\nالخلايا التي يتلف منها الكثير وتحتاج إلى تعويض مستمر يجب أن تواصل الانقسام. أما الخلايا شديدة التخصص أو التي فقدت النواة فلا تستطيع العودة إلى الانقسام.\nاسأل نفسك: أي الخيارات يصف خلايا فقدت قدرتها على الانقسام نهائياً؟", "يحدث الانقسام المتساوي في الخلايا:": "الانقسام المتساوي يعطي خلايا مطابقة للخلية الأم، ووظيفته النمو وتعويض التالف وإصلاح الأنسجة.\nفكّر في الخلايا التي تبني جسمك وتتجدد فيه، وقارنها بالخلايا التي تُنتج الأمشاج بنوع آخر من الانقسام يقلل عدد الكروموسومات.", "تصطف الكروموسومات في وسط الخلية في الطور:": "أطوار الانقسام المتساوي بالترتيب: التمهيدي (تكثف الكروموسومات)، ثم طور تصطف فيه الكروموسومات، ثم طور تنفصل فيه، ثم طور تتكون فيه نواتان.\nاسم الطور يرتبط أحياناً بموضع الحدث؛ فكّر في خط الاستواء الذي يقسم الكرة الأرضية إلى نصفين، وفي منتصف الخلية حيث تصطف الكروموسومات.", "تنفصل الكروماتيدات الشقيقة نحو القطبين في الطور:": "بعد أن تصطف الكروموسومات في وسط الخلية تنقسم المراكز (السنترومير) وتصبح الكروماتيدات الشقيقة كروموسومات مستقلة.\nتقصر خيوط المغزل فتسحب كل كروماتيد نحو قطب مختلف.\nحدّد أي الأطوار يأتي بعد الاصطفاف مباشرة، وانتبه إلى أن الانقسام المتساوي ليس كل ما تمر به الخلية في دورتها.", "ناتج الانقسام المتساوي لخلية أم:": "قبل الانقسام المتساوي تُضاعف الخلية مادتها الوراثية مرة واحدة، ثم تنقسم مرة واحدة فقط.\nفكّر: كم خلية تنتج عن انقسام واحد؟ وكيف يكون عدد الكروموسومات والمعلومات الوراثية فيها مقارنة بالأم؟ تذكّر أن هدف هذا الانقسام النمو والتعويض لا التنوع.", "دور السايكلين ونقاط التحكم في دورة الخلية:": "السايكلينات بروتينات يرتفع تركيزها وينخفض في أوقات محددة من الدورة، فتنشّط إنزيمات تدفع الخلية للانتقال من مرحلة إلى التي تليها.\nأما نقاط التحكم فتفحص الخلية (سلامة DNA، الحجم، اكتمال التضاعف) قبل السماح لها بالمتابعة، تماماً كإشارة المرور.\nفما الوظيفة العامة التي تجمع بين الاثنين؟", "الأورام تنتج عن انقسام خلايا:": "في الحالة الطبيعية تنقسم الخلايا تحت إشراف السايكلينات ونقاط التحكم، فتتوقف إذا وُجد خلل أو إذا كان العدد كافياً.\nالورم يتكوّن عندما يختل هذا الإشراف بسبب طفرات في الجينات المنظمة للدورة.\nاختر الوصف الذي يعبّر عن غياب الضبط، وليس عن وجوده.", "يحدث الانقسام المنصف في الخلايا:": "الانقسام المنصف وظيفته إنتاج الغاميتات (الأمشاج) التي تُستعمل في التكاثر، ويتم في الغدد التناسلية (الخصيتين والمبيضين).\nفكّر في الخلايا التي تحمل مهمة التكاثر، وقارنها بالخلايا التي تؤدي وظائف أخرى كالتوصيل العصبي والحركة.", "عدد الخلايا الناتجة من الانقسام المنصف لخلية أم واحدة:": "الانقسام المنصف تسبقه مرحلة تضاعف واحدة للمادة الوراثية، ثم تتبعه مرحلتا انقسام متتاليتان: المنصف الأول ثم المنصف الثاني.\nتتبّع عدد الخلايا: كم خلية تنتج بعد الانقسام الأول؟ ثم ماذا يحدث لكل واحدة منها في الانقسام الثاني؟ طبّق ذلك وسيظهر لك العدد النهائي.", "الخلايا الناتجة من الانقسام المنصف عدد كروموسوماتها:": "فكّر في الإخصاب: عندما يندمج غاميتان لتكوين الزايجوت، ماذا يحدث لعدد الكروموسومات؟\nولكي يبقى عدد كروموسومات النوع ثابتاً من جيل إلى جيل، كم يجب أن يحمل كل غاميت منها مقارنةً بالخلية الجسمية؟\nتذكّر أن الانقسام المنصف الأول يفصل الكروموسومات المتماثلة عن بعضها.", "يح
