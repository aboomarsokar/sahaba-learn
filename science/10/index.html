ما تبقى).\nمن التوزيع تستنتج عدد المستويات وعدد إلكترونات المستوى الأخير.", "عنصران لكل منهما 4 إلكترونات تكافؤ: السيليكون (شبه فلز) والكربون (لافلز). ماذا نستنتج؟": "اختبر العبارة العامة بمثال مضاد: إن وُجد عنصر يحقق الشرط ولا ينتمي إلى الفئة فالشرط وحده لا يحدد الفئة.\nتذكّر أن تصنيف العنصر يعتمد على خصائصه الفيزيائية والكيميائية، وأن التوزيع الإلكتروني يحدد موقعه في الجدول فقط.", "ذرة سيليكون متعادلة عددها الكتلي 28 وعددها الذري 14. مجموع ما فيها من بروتونات ونيوترونات وإلكترونات يساوي:": "حدّد عدد كل نوع من الجسيمات الثلاثة على حدة: البروتونات من العدد الذري، والإلكترونات في الذرة المتعادلة تساويها، والنيوترونات من الفرق بين العددين.\nثم اجمع الأنواع الثلاثة، ولا تكتفِ بالعدد الكتلي لأنه لا يشمل أحد الأنواع.", "يستخدم السيليكون في صنع الترانزستورات والرقائق الحاسوبية بدلاً من الفلز الموصل أو المادة العازلة، لأن:": "العناصر الإلكترونية تحتاج أحياناً إلى السماح بمرور التيار وأحياناً إلى منعه.\nفكّر: ماذا يحدث لو كانت المادة موصلة دائماً، أو عازلة دائماً؟ وما الخاصية التي تجعل شبه الموصل مناسباً لتحقيق الحالتين؟", "أي مما يلي ليس من دلالات حدوث التفاعل الكيميائي؟": "دلالات التفاعل الكيميائي هي علامات تدل على تكوّن مواد جديدة ذات خواص مختلفة عن المواد الأصلية.\nاسأل نفسك عن كل خيار: هل تغيّرت هوية المادة فعلاً وظهرت مادة جديدة، أم تغيّر شكلها أو حالتها الفيزيائية فقط؟", "المعادلة الكيميائية الموزونة هي المعادلة التي:": "الوزن يعبّر عن حفظ الذرات: الذرات لا تفنى ولا تُستحدث في التفاعل، وإنما تعيد ترتيب نفسها.\nفكّر فيما يجب أن يتساوى بين يسار المعادلة ويمينها لكي يتحقق هذا المعنى، وهل المقصود عدد الصيغ أم عدد الذرات من كل عنصر.", "ينص قانون حفظ الكتلة على أن كتلة المواد المتفاعلة:": "المادة لا تفنى ولا تظهر من العدم أثناء التفاعل، وإنما تعيد ترتيب نفسها.\nتذكّر أن للقانون شرطاً هو أن يكون النظام مغلقاً، أي لا تدخل إليه مواد ولا تخرج منه. اربط بين هذا المعنى والمقارنة بين الكتلتين.", "عند وزن معادلة كيميائية يُسمح لنا بتغيير:": "الأرقام السفلية جزء من تركيب المادة نفسها؛ فتغييرها يعني أننا غيّرنا المادة وليس عدد جزيئاتها.\nما الذي يمكننا ضبطه دون المساس بهوية المواد؟ فكّر في الأرقام التي تدل على عدد الجزيئات أو الوحدات التي تشارك في التفاعل.", "تفاعل 24 غم من المغنيسيوم مع كمية من الأكسجين في وعاء مغلق، فنتج 40 غم من أكسيد المغنيسيوم. كتلة الأكسجين المتفاعلة تساوي:": "طبّق قانون حفظ الكتلة على النظام المغلق: كتلة المتفاعلات كلها تساوي كتلة النواتج كلها.\nالمتفاعلات هنا مادتان إحداهما معلومة الكتلة، فاكتب معادلة بسيطة فيها كتلة المجهول ثم حلّها.", "احترقت قطعة خشب في وعاء مفتوح فكانت كتلة الرماد أقل من كتلة الخشب الأصلية. التفسير الصحيح لذلك أن:": "كتلة النواتج الكلية تشمل كل ما تكوّن في التفاعل، سواء بقي صلباً أو تطاير على هيئة غاز.\nانظر إلى نوع النظام في هذه التجربة: هل هو مغلق كما يشترط القانون؟ وأين يمكن أن تذهب النواتج الغازية؟", "النسبة المئوية الكتلية للكربون في ثاني أكسيد الكربون CO₂ (C = 12، O = 16) تساوي تقريباً:": "النسبة الكتلية لعنصر = (كتلة ذرات العنصر في الصيغة ÷ الكتلة الكلية للصيغة) × 100%.\nانتبه إلى عدد ذرات كل عنصر في الصيغة عند حساب الكتلة الكلية وكتلة العنصر المطلوب، ثم اقسم وحوّل الناتج إلى نسبة مئوية.\nيمكنك التحقق بجمع نسب العنصرين فيجب أن يكون المجموع 100%.", "في عينة من الماء من مصدر ما، كل 9 غم من الماء تحتوي 1 غم من الهيدروجين. كم غراماً من الهيدروجين في 27 غم من الماء النقي من مصدر آخر؟": "قانون النسب الثابتة: مهما اختلف مصدر المركب أو طريقة تحضيره، تبقى نسب كتل عناصره ثابتة.\nاستفد من العينة الأولى لتحديد نسبة كتلة الهيدروجين إلى كتلة الماء، ثم طبّق النسبة نفسها على العينة الثانية بالتناسب.", "عند وزن المعادلة Al + O₂ → Al₂O₃ يكون معامل O₂ في المعادلة الموزونة:": "ابدأ بإحصاء ذرات كل عنصر في الطرفين، وانتبه إلى أن الأكسجين يظهر في المتفاعلات على هيئة جزيء ثنائي الذرة.\nابحث عن أصغر عدد من ذرات الأكسجين يمكن أن يتساوى في الطرفين، ثم زن الألمنيوم بعد ذلك.\nلا تغيّر الأرقام السفلية، وتأكد في النهاية من تساوي ذرات كل عنصر.", "من العالم الذي اكتشف الخلية عندما فحص شريحة رقيقة من الفلين بمجهر بسيط؟": "اكتشاف الخلية ارتبط بفحص نسيج نباتي ميّت هو الفلين.\nلا تخلط بين من اكتشف الخلية ومن كان أول من شاهد الكائنات الحية الدقيقة؛ فكل منهما لعالم مختلف.", "الجزء من المجهر الضوئي المركب الذي ينظر الفاحص من خلاله هو:": "في المجهر المركب عدستان: إحداهما قريبة من الشيء المفحوص والأخرى قريبة من عين الفاحص.\nاسأل نفسك أيهما يوضع عند العين، وتذكّر أن الاسم يشير إلى موضعها.", "يُستخدم المجهر الضوئي المركب لفحص:": "المجهر المركب مجهر ضوئي، أي يعتمد على مرور ضوء مرئي خلال العينة.\nفكّر في الشرط الذي يجب أن تحققه العينة كي يخترقها الضوء فنرى تفاصيلها وهي حية.", "أي المجاهر التالية يُستعمل لدراسة التفاصيل الداخلية للخلية وبنيتها؟": "المجاهر الإلكترونية نوعان: أحدهما يمسح سطح العينة والآخر تنفذ حزمة الإلكترونات خلالها.\nفكّر في معنى كلمة نافذ وماذا تكشف الحزمة التي تمر داخل العينة مقارنة بالتي تمسح سطحها.", "فحص طالب شريحة بعدسة عينية قوة تكبيرها ×10 وعدسة شيئية قوة تكبيرها ×45. التكبير الكلي يساوي:": "التكبير الكلي يعتمد على العدستين معاً، ولا تكفي إحداهما وحدها.\nتذكّر العملية الحسابية التي تربط بين تكبير العينية وتكبير الشيئية، ثم انتبه إلى مواضع الأصفار في الناتج.", "تُستخدم نقطة زيت مع العدسة الشيئية الكبرى لأنها:": "مع قوة التكبير الكبيرة يصبح الضوء الداخل إلى العدسة أقل وأكثر عرضة للتشتت، فتقل وضوح الصورة.\nفكّر في الدور الذي يمكن أن تؤديه قطرة من مادة شفافة موضوعة بين العدسة والشريحة في توجيه الضوء.", "المجهر الضوئي المركب قوة تكبير عدسته الشيئية ×40، وكان التكبير الكلي ×800. تكبير العدسة العينية يساوي:": "ابدأ من قانون التكبير الكلي واعلم أن أحد العاملين معلوم والآخر مجهول.\nاستعمل العملية العكسية للضرب لإيجاد العامل المجهول، ثم تحقق بضربه في المعلوم لترى هل تعود إلى التكبير الكلي المعطى.", "لماذا لا يصلح المجهر الضوئي المركب لفحص قطعة سميكة معتمة من نسيج دون تشريحها وتقطيعها لشرائح رقيقة؟": "اربط بين مبدأ عمل المجهر المركب ومصدر إضاءته، وبين ما يجب أن يحدث للضوء عند وصوله إلى العينة كي تتكوّن الصورة.\nثم فكّر في ما يحدث للضوء عند اصطدامه بعينة سميكة معتمة، وماذا يعني ذلك لوصوله إلى عين الفاحص.", "فحص طالب شريحة بعدسة عينية ×10 وعدسة شيئية صغرى ×4، ثم بدّل العدسة الشيئية بالكبرى ×40. التكبير الكلي ازداد بمقدار:": "احسب التكبير الكلي في الحالتين كلتيهما بالقانون نفسه، فالعدسة العينية لم تتغير.\nثم قارن بين الناتجين بالقسمة لمعرفة كم مرة زاد التكبير؛ ويمكنك اختصار ذلك بملاحظة أي العاملين تغيّر فقط.", "الخلية هي:": "الكلمتان المفتاحيتان في التعريف هما البناء والوظيفة: منها تتكوّن أجسام الكائنات، وبها تتم أنشطتها.\nابحث عن الخيار الذي يشمل جميع الكائنات الحية، لا فئة منها ولا وظيفة واحدة.", "أي الكائنات التالية خلاياه بدائية النواة؟": "الخلية بدائية النواة مادتها الوراثية حرة في السيتوبلازم وغير محاطة بغلاف نووي.\nتذكّر أي الكائنات عادةً تُذكر مثالاً على هذا النوع من الخلايا، وقارنه بالخلايا النباتية والحيوانية ذات النواة الواضحة.", "وفق نظرية الخلية، تنتج الخلايا من:": "نظرية الخلية تتضمن فكرتين: مما تتكون الكائنات الحية، ومن أين تأتي الخلايا.\nتذكّر الجزء الثاني من النص، وهو يربط الخلية الجديدة بخلية موجودة من قبل.", "أي وصف لـ DNA الموجود في الخلية بدائية النواة صحيح؟": "قارن بين شكل المادة الوراثية وعددها وعلاقتها ببروتين الهستون في النوعين من الخلايا.\nتذكّر أن غياب الغلاف النووي يتبعه اختلاف في تنظيم DNA مقارنة بالأنوية الحقيقية.", "أي مما يلي يُعد صفة مشتركة بين الخلايا بدائية النواة وحقيقية النواة؟": "ابحث عما لا تستغني عنه أي خلية كي تعمل، بصرف النظر عن كونها بسيطة التركيب أو معقدته.\nثم تحقق من كل صفة تفكر فيها: هل تنتمي إلى أحد النوعين فقط أم إلى كليهما؟", "طريقة انقسام الخلية بدائية النواة هي:": "الانقسام المتساوي والمنصف يحتاجان إلى تنظيم معقد للمادة الوراثية داخل النواة.\nفكّر في نوع الانقسام الأنسب لخلية صغيرة بسيطة التركيب ذات كروموسوم وحيد.", "عُثر في مختبر على خلية مادتها الوراثية حرة في السيتوبلازم. أي مما يلي يُتوقع وجوده فيها؟": "حدّد أولاً نوع الخلية من موضع مادتها الوراثية، ثم استرجع ما يميز هذا النوع وما يشترك فيه مع النوع الآخر.\nانتبه إلى أن العضيات نوعان: غشائية ولاغشائية، وأن أحد النوعين فقط يرتبط بالخلايا البدائية.", "أي مجموعة من الصفات التالية تجتمع معاً في الخلية حقيقية النواة؟": "كل خيار يجمع صفتين؛ المطلوب أن تكون الصفتان كلتاهما من صفات الخلية حقيقية النواة.\nراجع جدول المقارنة بين النوعين: شكل DNA وعلاقته بالهستون، ثم نوع الانقسام، ثم تحقق من أن الخيار لا يخلط صفة من نوع بصفة من النوع الآخر.", "أي العبارات التالية عن المقارنة بين الخلايا بدائية النواة وحقيقية النواة خاطئة؟": "المطلوب هنا اكتشاف العبارة غير الصحيحة، فاختبر كل عبارة على حدة مقابل جدول المقارنة.\nركّز على العبارات التي تتحدث عن العضيات الغشائية وعن الغلاف النووي، فهما من أهم ما يفصل بين النوعين.", "أي مكوّنات الخلية يحيط بها ويفصل محتوياتها عن الوسط الخارجي وينظّم دخول المواد وخروجها؟": "ابحث عن التركيب الذي يقع في الحد الفاصل بين داخل الخلية وخارجها، فهو ما يتحكم بما يدخل وما يخرج.\nتذكّر أن هذا التركيب يتكوّن من طبقتين من الليبيدات المفسفرة وله نفاذية اختيارية.", "ما العضية التي تُعرف بمحطة الطاقة وتنتج جزيئات ATP من خلال التنفس الخلوي؟": "الاسم الشائع لهذه العضية يصفها بأنها مصدر الطاقة في الخلية.\nفكّر أي العضيات يرتبط ذكرها بالأعراف والمصفوفة والتنفس الخلوي.", "أي العضيات التالية لا يحيط بها غشاء؟": "قسّم العضيات في ذهنك إلى مجموعتين: غشائية وغير غشائية.\nالعضيات غير الغشائية قليلة في الخلية الحيوانية، وهي تراكيب صغيرة جداً مرتبطة بتصنيع البروتين أو بالانقسام أو بالدعم.", "لماذا تكثر الأجسام الحالّة في خلايا الدم البيضاء؟": "اربط بين وظيفة العضية ووظيفة الخلية التي تكثر فيها: ماذا تفعل خلايا الدم البيضاء في الجسم؟\nالأجسام الحالّة تحتوي إنزيمات هاضمة، فاسأل نفسك أي دور دفاعي يستفيد من هذه الإنزيمات.", "أي الترتيبات التالية يصف مسار البروتين الذي يُصنَّع على الشبكة الإندوبلازمية الخشنة حتى يُعدَّل ويُغلَّف؟": "العلاقة بين هاتين العضيتين علاقة تصنيع ثم تعديل وتوجيه.\nتذكّر أن نقل المواد بين العضيات الغشائية يتم عادة بتراكيب صغيرة محاطة بغشاء، وفكّر في العضية التي تعمل مركزاً للتعديل والفرز.", "تحمي الجدار الخلوي الخلية النباتية من الانفجار عند امتصاصها كمية كبيرة من الماء. ما سبب ذلك؟": "عندما يدخل الماء إلى الخلية يزداد الضغط داخلها، فتحتاج إلى بنية خارجية تقاوم هذا التمدد.\nفكّر في المادة الأساسية التي يتركب منها الجدار وفي صفة الصلابة والمتانة التي تمنحها للخلية.", "تحتوي الميتوكندريا والبلاستيدات DNA وريبوسومات خاصة بها. ما الذي تدل عليه هذه الصفة؟": "لتصنيع البروتين يلزم وجود معلومات وراثية وآلة بناء، فاسأل نفسك أي مكونات العضية تمثل كلاً منهما.\nثم استنتج ما يمكن أن تفعله عضية تملك الاثنين معاً من دون الاعتماد الكامل على بقية الخلية.", "أي التسلسلات التالية يصف الطريق الصحيح لبروتين يُفرز خارج الخلية؟": "تتبّع البروتين من لحظة تصنيعه حتى خروجه: أين يُصنع أولاً؟ وأين يُعدَّل؟ وبماذا ينتقل بين المحطات؟\nتذكّر أن لجهاز جولجي وجهين، أحدهما يستقبل المواد والآخر يرسلها، وأن المواد تغادره في حويصلات.", "لو تعطلت المسام النووية في خلية ما، فأي نتيجة هي الأرجح؟": "تذكّر وظيفة المسام النووية، وما الذي يجب أن ينتقل بين النواة والسيتوبلازم حتى تُصنَّع البروتينات.\nفكّر في موقع الريبوسومات وفي مصدر المعلومات التي تقرؤها، ثم تتبّع أثر انقطاع هذا الانتقال خطوة بعد خطوة.", "ما المادة الوراثية؟": "فكّر في الصفتين اللتين تميزان هذه المادة: ماذا تحمل؟ وكيف تنتقل بين الخلايا والأجيال؟\nاختر التعريف الذي يجمع الأمرين معاً.", "أين يوجد DNA في الخلية حقيقية النواة؟": "تذكّر أن النواة مركز التحكم في الخلية وتحتوي المادة الوراثية.\nوالمادة الوراثية فيها لا تكون سائبة، بل منظمة داخل تراكيب محددة.", "ما البروتينات التي يلتف حولها DNA وتساعد على تنظيمه؟": "الكروموسوم يتركب من DNA وبروتينات، وأهم هذه البروتينات هو ما يقوم بدور الأسطوانة التي يلتف عليها الخيط.\nتذكّر أن بعض البروتينات الأخرى مسؤول عن الحركة أو الدعم، وليس عن تنظيم DNA.", "ما النيوكليوسوم؟": "النيوكليوسوم هو الوحدة الأساسية لتعبئة DNA، فاسأل نفسك من أي مادتين يتكوّن وكيف تترتبان.\nتخيّل خيطاً يلتف حول بكرة، وطابق الصورة مع التركيب الصحيح.", "لماذا يحتاج DNA في الخلية إلى اللف والتنظيم والتعبئة؟": "قارن بين طول جزيء DNA الكامل وحجم النواة التي يجب أن يوجد فيها.\nفكّر في حل بسيط نستعمله يومياً عندما نريد وضع شيء طويل جداً في حيز صغير.", "ما الغرض من تضاعف المادة الوراثية قبل الانقسام الخلوي؟": "فكّر في الخلية التي ستنقسم إلى خليتين: ماذا يجب أن تحصل عليه كل خلية جديدة؟\nولاحظ أن التضاعف يحدث قبل الانقسام وليس بعده.", "أي الترتيبات التالية يعبّر عن مستويات تنظيم المادة الوراثية من الأصغر إلى الأكبر؟": "ابدأ من الجزيء الطويل نفسه، ثم فكّر كيف يلتف حول البروتينات لتكوين الوحدة الأساسية.\nبعدها تتجمع هذه الوحدات وتتكاثف تدريجياً حتى تصل إلى أكبر تركيب يُرى عند الانقسام.", "لو انقسمت خلية دون أن يسبق انقسامها تضاعف للمادة الوراثية، فما أرجح النتيجة؟": "تتبّع كمية DNA: ما الموجود في الخلية قبل الانقسام، وكيف يتوزع بين الخليتين الناتجتين؟\nثم قارن بين هذه الحالة والحالة الطبيعية التي تُنتج فيها نسخة إضافية قبل الانقسام.", "لو فقدت خلية قدرتها على تصنيع بروتينات الهستون، فما أبرز مشكلة ستواجه DNA فيها؟": "اربط بين وظيفة الهستونات والمستوى الأول من تعبئة DNA.\nاسأل نفسك ماذا يحدث لخيط طويل إذا فقد الجسم الذي يلتف حوله، وماذا يعني ذلك لاتساعه في الحيز المتاح.", "ما الوحدة البنائية التي تتكوّن منها سلاسل الحموض النووية؟": "كل من DNA وRNA سلسلة طويلة مكوّنة من وحدات متكررة متشابهة التركيب.\nتذكّر الاسم المشتق من كلمة النواة الذي يطلق على هذه الوحدات.", "مم يتكوّن النيوكليوتيد الواحد؟": "يتألف النيوكليوتيد من ثلاثة مكونات مختلفة ترتبط معاً: أحدها سكر، والثاني يحمل الفوسفور، والثالث يحمل خاصية قاعدية.\nانتبه إلى عدد الكربونات في السكر وإلى أن لكل مكون نسخة واحدة فقط.", "أي القواعد النيتروجينية تدخل في تركيب RNA ولا توجد في DNA؟": "قارن بين قواعد الحمضين: ثلاث قواعد مشتركة بينهما، وقاعدة واحدة مميزة لكل حمض.\nحدّد القاعدة المميزة للحمض الذي يتكوّن عادة من سلسلة مفردة.", "ما الفرق بين السكر الموجود في DNA والسكر الموجود في RNA؟": "السكران كلاهما خماسي ومن عائلة واحدة، والفرق في ذرة أو مجموعة عند موقع معيّن واحد.\nيدل اسم DNA نفسه على النقص الذي حدث في السكر، فاستعن به لتحديد الذي ينقص الأكسجين.", "أي العبارات التالية عن عدد السلاسل في الحموض النووية صحيحة؟": "ارجع إلى المقارنة بين الحمضين من حيث عدد السلاسل.\nتذكّر أن الروابط الهيدروجينية بين القواعد المتقابلة تحتاج سلسلتين متقابلتين، فأي الحمضين تحتاج بنيته إلى ذلك؟", "في نيوكليوتيد ما، بأي ذرة كربون في السكر ترتبط مجموعة الفوسفات؟": "لكل ذرة كربون في السكر الخماسي ما يرتبط بها: واحدة للقاعدة، وواحدة للفوسفات، وواحدة لمجموعة OH التي تُستعمل في ربط النيوكليوتيد التالي.\nراجع هذه المواقع ورتّبها حسب الأرقام.", "مقطع من DNA مكوّن من 10 أزواج قواعد، منها 4 أزواج A-T والبقية G-C. كم عدد الروابط الهيدروجينية الكلي بين السلسلتين؟": "لكل نوع من أزواج القواعد عدد ثابت من الروابط الهيدروجينية، واختلاف العدد بين النوعين هو سبب اختلاف ثباتهما.\nاحسب أولاً عدد أزواج النوع الثاني من المجموع، ثم احسب الروابط لكل نوع على حدة، وبعدها اجمعها.", "إذا كانت إحدى سلاسل DNA بالتسلسل 5′-ATGC-3′، فما تسلسل السلسلة المتممة مكتوباً بالاتجاه 5′→3′؟": "تتقابل القواعد حسب قاعدة الاقتران (A مع T وG مع C)، وتكون السلسلتان متعاكستين في الاتجاه.\nاكتب أولاً التسلسل المتمم تحت السلسلة الأصلية مع مراعاة التعاكس، ثم اقرأه من الطرف 5′ إلى الطرف 3′ كما يُطلب.", "في جزيء DNA مزدوج السلسلة كانت نسبة الأدينين 30% من مجموع القواعد. ما نسبة الجوانين فيه؟": "استعمل قاعدة الاقتران بين القواعد: كل قاعدة ترتبط بشريكتها المحددة، فتتساوى نسبتا كل قاعدتين متقابلتين.\nمجموع نسب القواعد الأربع يساوي 100%، فاستخدم ذلك بعد تحديد نسبة شريكة الأدينين."};
