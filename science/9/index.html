<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>العلوم العامة — الصف التاسع</title>
<meta name="theme-color" content="#0a5230">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../shared/icons/portal-192.png">
<link rel="apple-touch-icon" href="../../shared/icons/portal-180.png">
<style>
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("../../shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
:root{--hd:#0a5230;--hd2:#073d22;--bg:#FAF6EB;--card:#fff;--ink:#0a5230;--mut:#4b7a5f;--g:#00a152;--y:#ffc107;--bd:#e9dfc8;--ok:#1f9d55;--bad:#d63c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Plex Arabic",system-ui,Tahoma,sans-serif;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:min(760px,100%);margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
/* الرأس */
.hdr{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 40px;position:relative}
.hdr .row1{display:flex;align-items:center;gap:12px}
.av{width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid var(--y);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--g);font-weight:700;font-size:1.4rem}
.av img{width:100%;height:100%;object-fit:cover}
.hi{flex:1;min-width:0}.hi b{display:block;font-size:1.2rem;line-height:1.3}
.pts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#f3dc92;font-size:.9rem;margin-top:0}
.pts .dr-chip{padding:0 9px !important;font-size:.78rem !important}
.portal{display:flex;align-items:center;gap:6px;color:var(--y);text-decoration:none;font-weight:700;font-size:.9rem;flex:none}
.portal svg{width:24px;height:24px}
.sheet{background:var(--bg);margin-top:-26px;border-radius:26px 26px 0 0;padding:12px 16px 0;position:relative}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--bd);border-radius:999px;padding:6px 14px;margin-bottom:6px}
.search input{border:0;outline:0;background:transparent;flex:1;font:inherit;color:var(--ink);min-width:0}
.search svg{width:20px;height:20px;color:var(--mut);flex:none}
.sec{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:700;margin:4px 0 8px}
.sec i{font-style:normal;color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;grid-auto-rows:clamp(92px,calc((100svh - 300px) / 4),132px)}
.uc{border:0;border-radius:18px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:0;box-shadow:0 5px 0 var(--s,#007a3d);color:#fff;text-align:center;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.uc svg{width:clamp(36px,6.5svh,52px);height:clamp(36px,6.5svh,52px);flex:none;background:#fff;border-radius:50%;padding:5px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.uc b{font-size:.92rem;line-height:1.25}
.uc small{font-size:.74rem;opacity:.95;font-weight:600}
.uc .dn{position:absolute;top:6px;inset-inline-start:6px;background:#fff;border-radius:99px;font-size:.68rem;padding:0 7px;font-weight:700;color:var(--g)}
#drToast{top:0 !important;bottom:auto !important;border-radius:0 0 14px 14px !important;font-size:.72rem !important;padding:3px 14px !important;opacity:.92}
.card>svg{width:60px;height:60px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:right}
.cont .t{flex:1;min-width:0}.cont .t b{display:block;font-size:1.1rem}.cont .t small{color:var(--mut)}
.bar{height:10px;background:#ece6d4;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--y);border-radius:99px}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;color:var(--ink);background:conic-gradient(var(--y) calc(var(--p)*1%),#ece6d4 0)}
.ring span{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.85rem}
.daily{background:linear-gradient(135deg,#f6e3a1,#ffc107);border:2px solid #cfa23a;border-radius:26px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.daily .tr{font-size:3rem;line-height:1}
.daily b{font-size:1.3rem;display:block}.daily small{display:block;margin:2px 0 10px;color:#4a3a10}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--hd);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700}
.cta.alt{background:var(--g)}
/* التنقّل */
.nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);border-radius:26px 26px 0 0;display:grid;grid-template-columns:repeat(var(--n,5),1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(17,61,46,.08);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8a8a8a;text-decoration:none;font-size:.82rem;font-weight:700;padding:4px 0}
.nav a svg{width:28px;height:28px}
.nav a.on{color:#b8902f}
/* شاشات داخلية */
.top{background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top h1{font-size:1.15rem;margin:0;flex:1;line-height:1.4}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;text-decoration:none;font-size:1.3rem}
.body{padding:16px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:10px;width:100%;text-align:right;text-decoration:none;color:inherit}
.row .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:700;background:#fbf0c8;border:1px solid var(--y)}
.row .ic svg{width:34px;height:34px}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx small{color:var(--mut)}
.row .go{color:var(--mut);font-size:1.3rem}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:#e0d9c4}.dots i.on{background:var(--ok)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;border:1.5px solid #7fe0a2;background:#fff;color:var(--g);border-radius:999px;padding:6px 16px;font-weight:700}
.tb.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 0 var(--y)}
.lc h3{margin:14px 0 6px;font-size:1.1rem;color:var(--g)}
.lc p{margin:8px 0}.lc ul{margin:8px 0;padding-inline-start:20px}.lc li{margin:4px 0}
.note{background:#fdf0d8;border-inline-start:5px solid #f08a00;border-radius:12px;padding:8px 12px;margin:10px 0}
.exm{background:#e6f3ec;border-inline-start:5px solid var(--g);border-radius:12px;padding:8px 12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.tbl th,.tbl td{border:1px solid var(--bd);padding:6px 8px;text-align:center}.tbl th{background:#d7e8dc}
.lv{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px;margin-bottom:10px;border:2px solid;background:#fff;width:100%;text-align:right}
.lv i{font-style:normal;font-size:1.8rem}.lv b{display:block}.lv small{color:var(--mut)}
.lv .st{margin-inline-start:auto;font-weight:700}
/* الاختبار */
.prog{height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y)}
.q{font-size:1.2rem;font-weight:700;margin:6px 0 14px;line-height:1.7}
.kk{display:inline-block;font-size:.75rem;background:#e6f3ec;color:var(--g);border-radius:99px;padding:0 10px;margin-bottom:6px}
.op{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:1.02rem}
.op.ok{border-color:var(--ok);background:#e5f6ec}.op.bad{border-color:var(--bad);background:#fde9e9}
.hint{background:#fff6dc;border:1px solid var(--y);border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.res{text-align:center;padding:24px 8px}.res .big{font-size:3.4rem}.res h2{margin:6px 0}
.stars{font-size:2.2rem;letter-spacing:4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat div{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;color:var(--g)}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bd div{background:#fff;border:1px solid var(--y);border-radius:14px;padding:10px 4px;text-align:center;font-size:.8rem;line-height:1.4}.bd i{display:block;font-style:normal;font-size:1.8rem}
.wis{text-align:center}.wis small{color:var(--mut)}
.btn{display:block;width:100%;text-align:center;border:0;background:linear-gradient(135deg,#00c853,var(--g));color:#fff;border-radius:14px;padding:12px;font-weight:700;margin-top:10px;text-decoration:none}
.btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.empty{color:var(--mut);text-align:center;padding:20px}
@media (min-width:640px){.grid,.mg{grid-template-columns:repeat(3,1fr)}.nav{max-width:760px}.grid{grid-auto-rows:clamp(110px,18svh,150px)}}
@media (max-width:340px){.grid,.mg{grid-template-columns:1fr}.hi b{font-size:1rem}}
/* محاكاة جرّب بنفسك */
.wgv{display:grid;place-items:center;margin:4px 0}
.wgbig{text-align:center;font-size:1.45rem;font-weight:800;margin:8px 0;padding:8px;border-radius:16px;background:linear-gradient(135deg,#fff3c4,#ffe082);color:#4e2a00}
.wgbig span{display:inline-block;background:#ff6d00;color:#fff;border-radius:10px;padding:0 10px}.wgbig b{color:#d50000}.wgbig small{display:block;font-size:.85rem;color:#6d4c00;font-weight:600}
.wgc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.wgc span{font-weight:700;min-width:100%}
.wgc button{flex:1;min-width:58px;border:0;border-radius:14px;padding:10px 4px;font:800 1.05rem inherit;background:#fff;color:var(--c);box-shadow:inset 0 0 0 3px var(--c);cursor:pointer;transition:.15s}.wgc button.on{background:var(--c);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.wgs{margin:8px 0}.wgs label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}.wgs input{width:100%;height:30px}
.wgm{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7c4dff,#e040fb);color:#fff;border-radius:16px;padding:10px 12px;margin:10px 0;font-weight:700}
.wgn{display:block;width:100%;border:0;border-radius:14px;padding:11px;margin-top:8px;font:800 1rem inherit;color:#fff;background:linear-gradient(135deg,#ff6d00,#ffab00);box-shadow:0 4px 0 #c43e00;cursor:pointer}.wgn.g{background:linear-gradient(135deg,#00c853,#64dd17);box-shadow:0 4px 0 #008a39}
.wgrow{display:flex;gap:8px}.wgrow .wgn{flex:1}
.wgok{background:#00c853;color:#fff;border-radius:14px;padding:8px;text-align:center;font-weight:800;margin-top:8px;animation:wgpop .4s}
.wgb{text-align:center;font-size:2.2rem;animation:wgpop .5s}
@keyframes wgpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.wgst{position:relative;height:90px;border-radius:16px;overflow:hidden;background:linear-gradient(#80d8ff,#e1f5fe 60%,#a5d6a7 60%)}.wgball{position:absolute;bottom:8px;left:0;line-height:1;transition:font-size .2s}
@keyframes wgrun{from{left:-40px}to{left:100%}}
.wgsvg{width:100%;height:auto}
.wgbars{display:flex;gap:10px;height:92px;align-items:flex-end;justify-content:center;margin:6px 0}.wgbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:56px}.wgbars i{display:block;width:100%;border-radius:8px 8px 0 0;min-height:2px;transition:height .15s}.wgbars span{font-weight:800}
.wgat{display:flex;gap:8px;align-items:center}.wgai{flex:1;font-size:.92rem;line-height:1.7}.wgtag{color:#fff;border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:700}
.wgel{margin-top:6px}.wgrow2{display:flex;gap:3px;align-items:center;margin:4px 0;flex-wrap:wrap}.wgrow2>small{width:100%;color:#6a5a2a;font-weight:700}
.wgrow2 button{width:38px;height:44px;border:0;border-radius:10px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgrow2 button small{font-size:.6rem;opacity:.85}.wgrow2 button b{font-size:.95rem}.wgrow2 button.on{transform:translateY(-3px) scale(1.12);outline:3px solid #fff;box-shadow:0 0 0 3px #111}
.wgcv{width:100%;height:auto;border-radius:16px;display:block}
.wgsnd{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}.wgsnd>b{width:100%}.wgsnd button{flex:1;border:0;border-radius:12px;padding:8px 2px;background:var(--c);color:#fff;font:800 .95rem inherit;display:flex;flex-direction:column;box-shadow:0 3px 0 rgba(0,0,0,.2)}.wgsnd small{font-weight:500;opacity:.9}.wgsr{width:100%;background:#e3f2fd;border-radius:12px;padding:8px;font-weight:700}
.wgcard{text-align:center;background:linear-gradient(135deg,#fff3c4,#ffe0b2);border-radius:20px;padding:14px;margin-bottom:10px}.wgem{font-size:4rem;line-height:1.2}.wgcard b{font-size:1.2rem;display:block}.wgcard small{color:#6d4c00}
.wgks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wgks button{border:0;border-radius:14px;padding:12px 4px;color:#fff;font:800 1rem inherit;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.22);cursor:pointer}.wgks button:last-child{grid-column:1/-1}.wgks button.ok{outline:4px solid #fff;box-shadow:0 0 0 4px #00c853}.wgks button.no{animation:wgshake .4s}.wgks button[disabled]{opacity:.55}
@keyframes wgshake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.wgmsg{text-align:center;font-weight:800;margin-top:10px;min-height:1.6em}.wgfin{text-align:center;padding:10px}.wgfin b{font-size:1.6rem}

/* عناصر تفاعلية */
.ipb{height:7px;background:#ece6d4;border-radius:99px;overflow:hidden;margin:6px 0 2px}.ipb i{display:block;height:100%;width:0;background:var(--y);transition:width .35s}
.ipt{display:block;color:var(--mut);font-size:.8rem;margin-bottom:6px}
.pt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:right;background:#f4f8ee;border:2px solid #d7e6c4;border-radius:14px;padding:9px 12px;margin:6px 0;font-size:1rem;line-height:1.6}
.pt::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid #9bbf86;flex:none;margin-top:2px;transition:.2s;display:grid;place-items:center;color:#fff;font-size:.8rem}
.pt.done{background:#e5f6ec;border-color:var(--ok)}.pt.done::before{content:"✓";background:var(--ok);border-color:var(--ok)}
.cl{display:inline-block;min-width:52px;border:0;border-radius:8px;background:var(--y);color:#3b2a08;padding:0 8px;font:inherit;font-weight:700;letter-spacing:2px;animation:pulse 1.6s infinite}
.cl.rv{background:#d8f0e0;color:var(--g);letter-spacing:0;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,185,77,.35)}}
.ip{margin:10px 0}
.nt,.ex2{display:block;width:100%;text-align:right;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:1rem;line-height:1.6;border:2px dashed}
.nt{background:#fdf0d8;border-color:#f08a00}.ex2{background:#e6f3ec;border-color:var(--g)}
.nt .bd2,.ex2 .bd2{display:none}.nt.done .bd2,.ex2.done .bd2{display:block;margin-top:4px;font-weight:700}.nt.done .hd2,.ex2.done .hd2{display:none}
.nt.done,.ex2.done{border-style:solid}
.tbw{overflow-x:auto;margin:10px 0}.tbw .tbl{margin:0}.tbl td.mk{background:#e9efe0;color:transparent;cursor:pointer;user-select:none}.tbl td.mk.rv{background:none;color:inherit}
.tbs{display:block;margin:6px auto 0;border:0;background:var(--y);color:#3b2a08;border-radius:99px;padding:4px 16px;font-weight:700;font-size:.85rem}
/* الرياضيات */
.t-math{--bg:#f6f0dd;--ink:#17402b;--mut:#5f7a63;--g:#1d5a3b;--bd:#e8e0c4}
.mh{display:flex;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top)) 18px 4px}
.mhi{flex:1}.mhi b{font-size:1.8rem;line-height:1.25;display:block}.mhi small{color:#6a8a5c;font-size:1rem}
.mportal{display:inline-block;margin-top:6px;background:#fffaf0;border:1.5px solid #cfe3b0;border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:700;color:#1d5a3b;text-decoration:none}
.mav{width:76px;height:76px;background:#1d4d35;color:#fff;border:6px solid #cfe3b0;font-size:2rem}
.pc{margin:14px 16px;background:linear-gradient(135deg,#00a152,#00e676);color:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 0 #007a3d}
.pct{display:flex;justify-content:space-between;align-items:center}.pct b{font-size:1.35rem}
.chp{background:#fff;color:#00a152;border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem}
.pcr{display:flex;justify-content:space-between;margin:10px 0 6px;font-size:.95rem}
.bar.big{height:14px;background:#d5dcc0}.bar.big i{background:#1d5a3b}
.pcs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}.chp2{background:#fff;color:#0a5230;border-radius:99px;padding:3px 14px;font-weight:700;font-size:.92rem}.chp2.g{background:#ffc107;color:#3b2a00}
.sec2{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 8px;font-size:1.3rem}.sec2 a{font-size:.95rem;color:#3d7a4f;text-decoration:none;font-weight:400}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 10px}
.mu{border:0;border-radius:22px;padding:14px 8px;text-align:center;text-decoration:none;color:#fff;box-shadow:0 6px 0 var(--s,#007a3d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:124px;position:relative;font:inherit;background:linear-gradient(150deg,var(--c,#00c853),var(--d,#009624))}
.mu.w{grid-column:1/-1}
.mu svg{width:46px;height:46px;filter:brightness(0) invert(1)}.mu b{font-size:1.1rem}.mu small{font-size:.85rem;opacity:.95;font-weight:600}
.mu .dn{position:absolute;top:8px;inset-inline-start:8px;background:#1d5a3b;color:#fff;border-radius:99px;font-size:.7rem;padding:0 8px}
.t-math .nav{background:#fffaf0}.t-math .nav a.on{color:#1d4d35}
/* الآلة الحاسبة */
#calc{position:fixed;inset:0;background:rgba(17,40,28,.55);z-index:50;display:grid;place-items:end center}
.cbox{width:100%;max-width:520px;background:#fffaf0;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:slin .25s ease both}
.cd{background:#e9f0d5;border-radius:16px;padding:10px 14px;text-align:left;direction:ltr;min-height:76px}.cd small{display:block;color:var(--mut);min-height:22px;word-break:break-all}.cd b{font-size:2rem;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;direction:ltr}
.ck button{border:0;border-radius:14px;padding:13px 0;font-size:1.25rem;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 2px 0 #e0d8bc}.ck button.o{background:#cfe3b0}.ck button.eq{background:#1d5a3b;color:#fff;grid-column:span 2}.ck button.cx{background:#f6d8d0}
.cclose{display:block;margin:10px auto 0;border:0;background:none;color:var(--mut);font-weight:700}
/* درس البطاقات التفاعلية */
.dots2{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}.dots2 button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:#d9d2bd;transition:.2s}.dots2 button.on{width:26px;border-radius:99px;background:var(--y)}.dots2 button.dn{background:var(--ok)}
.deck{position:relative;overflow:hidden;touch-action:pan-y}
.dc{background:#fff;border:1px solid var(--bd);border-radius:24px;padding:16px;box-shadow:0 6px 0 rgba(17,61,46,.06);animation:slin .32s ease both}
.dc.rev{animation-name:slinr}
@keyframes slin{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
@keyframes slinr{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.dc h3{margin:0 0 8px;font-size:1.15rem;color:var(--g);display:flex;align-items:center;gap:8px}.dc h3 em{font-style:normal;background:var(--y);color:#3b2a08;border-radius:99px;font-size:.75rem;padding:0 9px}

.dc p{margin:8px 0}.dc ul{margin:8px 0;padding-inline-start:20px}.dc li{margin:4px 0}
.fcs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fc{display:grid;perspective:700px;border:0;background:none;padding:0;text-align:center}.fc.wide{grid-column:1/-1}
.fc>span{grid-area:1/1;backface-visibility:hidden;transition:transform .45s;border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:78px}
.ff{background:linear-gradient(135deg,#00c853,#00a152);color:#fff}.ff b{font-size:1rem}.ff small{opacity:.8;font-size:.72rem}

.fc.on .ff{transform:rotateY(180deg)}.fc.on .fb{transform:rotateY(360deg)}
.chk{background:#eef7f1;border:1.5px dashed #7fb897;border-radius:18px;padding:12px;margin-top:14px}
.ck-h{font-weight:700;color:var(--g);margin-bottom:4px}.ck-q{font-weight:700;margin-bottom:8px}
.ck-o{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:.95rem}

.ck-f{font-size:.9rem;margin-top:4px}
.dnav{display:flex;gap:10px;margin-top:12px}.dnav button{flex:1;border:0;border-radius:14px;padding:11px;font-weight:700;background:#fff;border:1.5px solid var(--g);color:var(--g)}.dnav button.pri{background:var(--g);color:#fff}.dnav button[disabled]{opacity:.35}
.rq{display:flex;gap:10px;align-items:flex-start;background:#f7f2e1;border-radius:14px;padding:10px 12px;margin:8px 0;width:100%;text-align:right;border:0}.rq i{font-style:normal;width:24px;height:24px;border-radius:50%;border:2px solid var(--g);display:grid;place-items:center;flex:none;color:#fff;font-size:.85rem}.rq.on i{background:var(--ok);border-color:var(--ok)}.rq.on{opacity:.7}

<script>
window.SCI={"cfg":{"widgets":false,"name":"العلوم العامة","hello":"أهلاً يا بطل العلوم!","unitsTitle":"وحدات العلوم","unitsHint":"خمس وحدات من رزمة العلوم والحياة: أجهزة الجسم، والكهرباء، والعناصر والتفاعلات، والضوء، والنبات الزهري. اضغط وحدة لترى دروسها.","theme":"sci","key":"sci9:st","wid":"science","kxid":"science9","student":"طالب العلوم","packT":"رزمة العلوم والحياة","dir":"science/9","gradeName":"الصف التاسع","gradeFor":"للصف التاسع"},"units":[{"title":"أجهزة جسم الإنسان","ic":"split","color":"#f9b8d0","uq":[[0,"أي المغذيات هو المصدر الأساسي للطاقة في الخلايا؟",["الكربوهيدرات","البروتينات","الألياف","الفيتامينات"],0],[0,"ما العضو الذي يخزّن العصارة الصفراء؟",["الكبد","البنكرياس","المرارة","المعدة"],2],[1,"أي إنزيم يحوّل البروتين إلى عديدات الببتيد في المعدة؟",["الأميليز","الليبيز","المالتيز","الببسين"],3],[1,"لماذا يزداد امتصاص المغذيات في الأمعاء الدقيقة؟",["لأنها قصيرة","لوجود خملات تزيد مساحة السطح الداخلي","لأنها خالية من الأوعية","لأنها لا تفرز عصارات"],1],[0,"ما العضو المشترك بين الجهازين الهضمي والتنفسي؟",["البلعوم","المريء","القصبة الهوائية","الحنجرة"],0],[1,"ما الذي يحدث لحجم التجويف الصدري وضغط الهواء فيه أثناء الشهيق؟",["يقلّ الحجم ويزداد الضغط","يزداد الحجم والضغط","يزداد الحجم ويقلّ الضغط","لا يتغيران"],2],[0,"أي أجزاء الجهاز الدوراني يتألف من أربع حجرات؟",["الأوعية الدموية","القلب","الدم","الليمف"],1],[0,"ما الوعاء الذي ينقل دماً مؤكسجاً من الرئتين إلى القلب؟",["الأوردة الرئوية","الشريان الرئوي","الوريد الأجوف السفلي","الأبهر"],0],[0,"ما المكوّن الذي يحمل الأكسجين في الدم؟",["الصفائح الدموية","خلايا الدم البيضاء","بلازما الدم دون غيرها","الهيموغلوبين في خلايا الدم الحمراء"],3],[1,"ما اسم السائل المتبقي بين الخلايا والذي يعود عبر الأوعية الليمفية؟",["البلازما","الصفراء","الليمف","العصارة الهاضمة"],2],[1,"أي العبارات تمثل فرقاً صحيحاً بين الشريان والوريد؟",["الشريان فيه صمّامات والوريد لا","الوريد فيه صمّامات والشريان لا","تجويف الشريان أوسع من الوريد","الطبقة العضلية للوريد أسمك"],1],[1,"يعود الليمف إلى الدورة الدموية عبر:",["الوريد الأجوف العلوي","الوريد الأجوف السفلي","الشريان الرئوي","الأوردة الرئوية"],0]],"lessons":[{"t":"المغذيات والجهاز الهضمي","e":["# المغذيات والهرم الغذائي","المغذيات مواد في الطعام يحتاجها الجسم ليحصل على الطاقة وينمو ويصلح أنسجته. وتشمل: الكربوهيدرات، والبروتينات، والليبيدات (الدهون والزيوت)، والفيتامينات، والأملاح المعدنية، والألياف الغذائية، والماء.","رتّب العلماء المجموعات الغذائية في الهرم الغذائي بحيث تشكّل الأغذية التي نكثر منها قاعدة الهرم الواسعة، وتقلّ الكمية المنصوح بها كلما اتجهنا نحو القمة. وكل وجبة نتناولها تحتوي عادة على مزيج من هذه المغذيات.","- في نشاط (٢): وجبة إفطار أمّ محمود فيها خبز القمح وزيت الزيتون واللبنة والبندورة والبيض، وتُصنَّف مكوّناتها على مجموعات الهرم لنعرف هل تضمّ جميع المجموعات.","- في نشاط (٣): يبيّن الشكل المحتوى الغذائي للبيض والفاصولياء البيضاء، فنقارن النسب المئوية للمغذيات في كلٍّ منهما ونحدّد موقعهما في الهرم.","! أكثر أسباب الوفاة في فلسطين عام ٢٠١٥ هي الأمراض المزمنة، وترتبط بأسلوب الحياة وقلّة النشاط البدني والعادات الغذائية السيئة؛ فللغذاء علاقة مباشرة بالصحة.","# الكربوهيدرات والبروتينات","الكربوهيدرات (السكريات) هي المصدر الأساسي للطاقة اللازمة للخلايا لأنها تمدّها بمصدر سريع، ويُمتصّ السكر الأحادي بسرعة في القناة الهضمية. وتتكوّن من جزيء سكر أحادي واحد أو أكثر:","- السكريات الأحادية: جزيء سكر واحد، مثل الغلوكوز والفركتوز والغلاكتوز. والغلوكوز هو الأكثر شيوعاً، وهو مصدر الطاقة المفضّل لخلايا الدماغ ومهمّ لجميع خلايا الجسم، والفركتوز أكثرها حلاوة.","- السكريات الثنائية: اتحاد سكرَين أحاديَّين (تُعدّ أيضاً ضمن قليلة التسكّر)، وهي مبيّنة في الجدول.","- عديدات التسكّر: اتحاد عدد كبير من السكريات الأحادية، مثل النشا والسيليلوز.","|السكر الثنائي|السكريات الأحادية المكوِّنة له","|مالتوز (سكر الشعير)|غلوكوز + غلوكوز","|سكروز (سكر المائدة)|غلوكوز + فركتوز","|لاكتوز (سكر الحليب)|غلوكوز + غلاكتوز","# نشاط (٤): الكشف عن السكريات","الأدوات: غلوكوز (عنب أو تمر)، سكروز، نشا (أرز)، محلول بندكت، عصير ليمون (أو HCl مخفّف)، ماء، أنابيب اختبار، حمام ماء ساخن، محلول لوغول.","- السكريات الأحادية والثنائية: نرقّم أربعة أنابيب ونضع في الأول ماء وفي الثاني غلوكوز وفي الثالث والرابع سكروزاً، ثم نضيف ٢ مل من بندكت لكل أنبوب ونضعها في حمام ماء ساخن دقيقتين ونلاحظ تكوّن راسب. ثم نضيف قطرتين من عصير الليمون إلى أحد أنبوبَي السكروز ونعيد التسخين ونلاحظ الفرق.","- عديدات التسكّر: نضع ٣ مل ماء في الأنبوب الأول و٣ مل من محلول النشا (٢٪) في الثاني، ونضيف ٢ مل من محلول لوغول إلى كل أنبوب ونراقب اللون.","- أنبوب الماء هو الأنبوب الضابط للمقارنة، والتسخين يلزم لتفاعل بندكت، والليمون (الحمض) يُحلّل السكروز إلى سكرَين أحاديَّين.","! بندكت يحتوي كبريتات النحاس CuSO₄ (ويمكن استعمال محلول فهلنج بدلاً منه)، ويُحضَّر لوغول بإذابة ٦ غم يوديد البوتاسيوم في ١٠٠ مل ماء ثم إضافة ٤ غم يود.","البروتينات تقوم بوظائف كثيرة: تشكيل الإنزيمات وعدة هرمونات كالإنسولين، وتكوين عضلات الجسم. وتتكوّن من وحدات بنائية تسمّى الحموض الأمينية (نحو ٢٠ حمضاً)، وعند اتحاد عدة حموض أمينية تكوّن عديد الببتيد الذي يكوّن البروتين. وبعض الحموض الأمينية لا تستطيع خلايا الجسم تصنيعها فلا بدّ من توافرها في الغذاء؛ والمصادر الحيوانية غنية بجميع الحموض الأمينية، أما المصادر النباتية فتفتقر لبعضها.","# نشاط (٥): الكشف عن البروتينات","الأدوات: زلال بيض، محلول هيدروكسيد الصوديوم المخفّف، محلول كبريتات النحاس (II) ٪٥، أنبوبا اختبار.","- نضع ٢ مل ماء في الأنبوب (١) و٢ مل زلال بيض في الأنبوب (٢)، ونضيف ٢ مل من هيدروكسيد الصوديوم المخفّف وكبريتات النحاس (II) لكل منهما ثم نرجّهما جيداً.","- النتيجة: يظهر اللون البنفسجي في أنبوب زلال البيض فقط، فهو يدل على وجود البروتين.","# الليبيدات والفيتامينات والألياف والماء","الليبيدات: الزيوت والدهون والكوليسترول. تُعدّ الدهون والزيوت مخازن غنية بالطاقة، ولها دور في تشكيل الغشاء الخلوي، وتشكّل عازلاً حرارياً للجلد وعازلاً كهربائياً للخلايا العصبية. وتتكوّن من حموض دهنية وغليسرول. ومن علامات وجودها البقعة الشفافة التي تتركها على الورق.","- نشاط (٦): نضع ١ مل ماء في الأنبوب (١) و١ مل زيتاً في الأنبوب (٢)، ثم نضيف ٥ مل إيثانول إلى كليهما ونرجّهما جيداً ونقارن بينهما؛ فالإيثانول مذيب للدهون والزيوت يُستعمل في الكشف عنها.","الفيتامينات والأملاح المعدنية: مواد يحتاجها الجسم بكميات قليلة لكنها ضرورية ليستفيد من جميع المغذيات بفاعلية؛ يوجد ما لا يقل عن ١٥ فيتاميناً و١٧ ملحاً معدنياً.","|الفيتامين أو الملح|أهميته|من مخاطر نقصه","|فيتامين C|التئام الجروح والمحافظة على صحة الجلد واللثة|نزيف اللثة والنزيف الداخلي","|فيتامين D|المساعدة في امتصاص الكالسيوم والاستفادة منه|الكساح عند الصغار ولين العظام عند الكبار","|الكالسيوم|يدخل في تركيب العظام والأسنان، وضروري لعمل العضلات وتخثّر الدم|الكسور","|الحديد|صناعة خلايا الدم الحمراء|الأنيميا (فقر الدم)","- نشاط (٧) للكشف عن فيتامين C: نضع ٣ مل من محلول الإندوفينول في كل أنبوب، ونضيف عصير البرتقال بالقطّارة حتى يختفي اللون ونعدّ القطرات، ثم نكرّر مع عصير التفاح والماء. الأنبوب الذي يختفي لونه بقطرات أقل يحتوي كمية أكبر من فيتامين C.","الألياف الغذائية: الأجزاء الغنية بالسيليلوز وقشور الحبوب التي لا تُهضم داخل القناة الهضمية للإنسان، فتشكّل نسبة كبيرة من الفضلات الصلبة. وهي ضرورية لتمكين عضلات القناة الهضمية من دفع الفضلات بسرعة، فتحمي الجسم من الإمساك والسرطان.","الماء: يشكّل نحو ٧٠٪ من كتلة جسم الإنسان، ويتواجد في سيتوبلازم الخلايا وبلازما الدم. وهو وسط ممتاز لنقل المواد، ويحافظ على الاتزان الحراري، ومذيب لكثير من المواد ما يتيح حدوث التفاعلات الكيميائية اللازمة. ويفقد الجسم نحو ١٫٥ لتر يومياً فيجب تعويضه بشرب القدر الكافي.","! نمط التغذية في دول حوض البحر الأبيض المتوسط ومنها فلسطين يرتبط بانخفاض الإصابة بأمراض القلب والجلطات والسرطان: زيت الزيتون هو الدهن الرئيس، واللحوم شهرياً، والبيض والدجاج والسمك والحلوى أسبوعياً، ويومياً الحبوب والخبز واللبن الرائب والفواكه والبقوليات والخضار.","# الجهاز الهضمي: الفم والمريء والمعدة","يتكوّن الجهاز الهضمي من القناة الهضمية (طولها نحو ٧ أمتار) والغدد الملحقة بها (الغدد اللعابية والكبد والبنكرياس). ووظائفه: ابتلاع الطعام، وهضمه ميكانيكياً وكيميائياً، وامتصاص ناتج الهضم، والتخلّص من الفضلات الصلبة.","الهضم الميكانيكي يحطّم الطعام إلى قطع صغيرة، ثم يحدث الهضم الكيميائي بفعل جزيئات تسمى الإنزيمات تحطّم المواد الغذائية إلى وحداتها البنائية القابلة للذوبان والامتصاص. وبعد اكتمال الهضم تنتقل الوحدات البنائية عبر جدار القناة الهضمية إلى الدم، وهذا هو الامتصاص.","- الفم: تقوم الأسنان بالهضم الميكانيكي، ويمزج اللسان الطعام باللعاب ويدفعه نحو البلعوم. وتفرز الغدد اللعابية اللعاب الذي يرطّب الطعام ويهضمه جزئياً لاحتوائه على إنزيم الأميليز: نشا + ماء ← (أميليز) ← مالتوز.","- نشاط (٩): نضع ٢ سم³ من النشا (٪٢) في أنبوبين، ونضيف ٢ سم³ ماء إلى الأول و٢ سم³ لعاب إلى الثاني، ونتركهما ٢٠ دقيقة ثم نضيف قطرات اليود. بقاء اللون الأزرق في أنبوب الماء مع غيابه في أنبوب اللعاب يدل على أن اللعاب حطّم النشا، أي أن تحطيم النشا يبدأ في الفم.","- البلعوم والمريء: يندفع الطعام عبر المريء بفعل انقباض عضلات دائرية لاإرادية ملساء في جداره، وتسمى حركته الحركة الدودية التي تميّز القناة الهضمية.","- المعدة: جدارها ثلاث طبقات من العضلات الملساء تتقلّص باتجاهات مختلفة فتعصر الطعام وتمزجه بالعصارات الهاضمة. يفرز جدارها إنزيم الببسين الذي يعمل في وسط حمضي: بروتين + ماء ← (ببسين) ← عديدات ببتيد. ويفرز أيضاً حمض الهيدروكلوريك الذي يقتل معظم الجراثيم في الغذاء ويوفّر الوسط الحمضي للببسين. فيتعرض الطعام في المعدة لهضم ميكانيكي وكيميائي.","# الاثنا عشر والأمعاء الدقيقة: العصارات والإنزيمات","يحدث معظم الهضم الكيميائي بعد مغادرة الطعام المعدة على شكل دفعات (الكيموس الحمضي) إلى الاثني عشر (أول ٢٥ سم من الأمعاء الدقيقة)، حيث يمتزج بثلاث عصارات:","- العصارة الصفراء: تُفرز من الكبد وتُخزَّن في المرارة (الحويصلة الصفراوية). تعمل عمل الصابون فتحوّل الدهون والزيوت إلى مستحلب دهني (قطرات دقيقة)، ما يسهّل هضمها كيميائياً لاحقاً (نشاط ١٠: الصابون يفتّت الزيت في الماء). ولذلك يُنصح من استُؤصلت مرارته بتقليل الأغذية الغنية بالدهون.","- عصارة البنكرياس: تحتوي بيكربونات الصوديوم التي تخفّف حموضة الكيموس، وإنزيمات هاضمة (نشاط ١١: بيكربونات الصوديوم تغيّر ورقة عباد الشمس الحمراء إلى الأزرق، أي أنها قاعدية وتقلّل الحموضة).","|الإنزيم|عمله","|أميليز البنكرياس|نشا + ماء ← مالتوز","|تربسين|عديدات الببتيد ← ببتيدات قصيرة","|ليبيز|المستحلب الدهني ← غليسرول + حموض دهنية (فيكتمل هضم الدهون)","- عصارة الأمعاء الدقيقة: تُفرز من جدرانها وتضمّ إنزيمات تستكمل هضم البروتينات والكربوهيدرات: محلّلات الببتيد (ببتيدات قصيرة + ماء ← حموض أمينية)، ومالتيز (مالتوز + ماء ← غلوكوز + غلوكوز)، وسكريز (سكروز + ماء ← غلوكوز + فركتوز)، ولاكتيز (لاكتوز + ماء ← غلوكوز + غلاكتوز).","! اسم الإنزيم يشبه اسم المادة التي يهضمها. ونقص اللاكتيز عند بعض الناس يسبب صعوبة في هضم سكر الحليب.","# الامتصاص والكبد والفضلات والمشكلات الصحية","الامتصاص: معظمه في الأمعاء الدقيقة (نحو ٦ أمتار)، وهي مبطّنة بطبقة مخاطية تنثني إلى بروزات إصبعية تسمى خملات، تغلّفها زوائد دقيقة، وفي كل خملة شعيرات دموية وشعيرة ليمفية. تزيد هذه الخصائص مساحة السطح الداخلي إلى ٢٠٠–٣٠٠ م² فيتم الامتصاص بكفاءة.","- يُمتصّ الغلوكوز والحموض الأمينية وبعض الحموض الدهنية والغليسرول عبر الشعيرات الدموية ثم تُنقل إلى الكبد.","- أما معظم الحموض الدهنية والغليسرول فتُحمل عبر الشعيرات الليمفية ثم إلى تيار الدم لتصل إلى جميع الخلايا.","الكبد: أكبر عضو داخل الجسم ويزن أكثر من ١ كغم، ويصله الدم المحمّل بالمواد الغذائية أولاً لأنه: يخزّن الغلوكوز والنحاس والحديد والبوتاسيوم وفيتامينات A وB وD؛ ويعدّ مصنعاً كيميائياً ينتج العصارة الصفراء ومواد لازمة لتخثّر الدم؛ وينقّي الدم من السموم مصدرها الجراثيم والكحول والعقاقير.","التخلّص من الفضلات: الأمعاء الغليظة طولها نحو ١٫٥ متر تقريباً، يُمتصّ فيها معظم ما تبقّى من الماء، وتخرج المواد غير المهضومة من فتحة الشرج فضلات. تكرّر خروج البراز سائلاً مع فقدان الكثير من السوائل يسبب الإسهال، وتأخّر خروجه صلباً يسبب الإمساك. ويلزم الحرص على النظافة الشخصية بعد قضاء الحاجة.","دراسة حالة: ألم في أسفل البطن من الجهة اليمنى وزيادة الألم عند رفع اليد بعد الضغط يدل على التهاب الزائدة الدودية، وهي بروز بحجم الخنصر بين الأمعاء الدقيقة والغليظة، ويُعالج باستئصالها جراحياً بعد الفحوص.","أنماط التغذية عند كائنات أخرى: الأميبا تهضم داخل الخلية، والدودة الشريطية لا تملك جهازاً هضمياً بل تتطفّل وتمتصّ غذاءها عبر جسمها، والفراشة يتحوّر فمها إلى أنبوب مجوّف يستطيل عند ضخّ الرحيق، والأغنام جهازها الهضمي متخصص للتغذّي على النباتات وهضم السيليلوز."],"q":["- صمّم خريطة مفاهيمية لأنواع المغذيات وفروعها ومصادر كل منها.","- لماذا يصل الدم المحمّل بالمواد الغذائية إلى الكبد أولاً قبل توزيعه على الخلايا؟","- بيّن دور الإنزيمات والعصارات (الصفراء، البنكرياس، الأمعاء الدقيقة) في هضم الدهون والبروتينات والكربوهيدرات.","- كيف يتلاءم تركيب الأمعاء الدقيقة مع وظيفة الامتصاص؟","- لماذا نُصح هاشم بتقليل الأغذية الدهنية بعد استئصال مرارته؟"],"quiz":[{"l":0,"k":"n","q":"ما المصدر الأساسي للطاقة اللازمة للخلايا؟","o":["الكربوهيدرات","البروتينات","الفيتامينات","الألياف الغذائية"],"a":0},{"l":0,"k":"n","q":"ما السكر الأحادي الذي يُعدّ مصدر الطاقة المفضّل لخلايا الدماغ؟","o":["السكروز","النشا","اللاكتوز","الغلوكوز"],"a":3},{"l":0,"k":"n","q":"ما الوحدات البنائية للبروتينات؟","o":["الحموض الدهنية","الغليسرول","الحموض الأمينية","السكريات الأحادية"],"a":2},{"l":0,"k":"n","q":"مم تتكوّن الدهون والزيوت؟","o":["حموض أمينية وماء","حموض دهنية وغليسرول","غلوكوز وفركتوز","فيتامينات وأملاح"],"a":1},{"l":0,"k":"n","q":"أي الفيتامينات يساعد على امتصاص الكالسيوم والاستفادة منه؟","o":["فيتامين D","فيتامين C","الحديد","السيليلوز"],"a":0},{"l":0,"k":"n","q":"كم تقريباً نسبة الماء من كتلة جسم الإنسان؟","o":["٣٠٪","٥٠٪","٩٠٪","٧٠٪"],"a":3},{"l":0,"k":"n","q":"أي عضو يفرز العصارة الصفراء؟","o":["المرارة","البنكرياس","الكبد","المعدة"],"a":2},{"l":0,"k":"n","q":"أين يبدأ تحطيم النشا في الجهاز الهضمي؟","o":["المعدة","الفم","المريء","الأمعاء الغليظة"],"a":1},{"l":1,"k":"p","q":"أُضيف بندكت إلى أنبوب فيه سكروز وسُخّن فلم يتكوّن راسب. ماذا نفعل ليظهر الراسب؟","o":["نضيف لوغول","نضيف عصير الليمون (حمضاً) قبل التسخين","نبرّد الأنبوب","نضيف ماء كثيراً"],"a":1},{"l":1,"k":"p","q":"أُضيف هيدروكسيد الصوديوم وكبريتات النحاس (II) إلى زلال البيض فظهر لون بنفسجي. على ماذا يدل؟","o":["وجود البروتين","وجود النشا","وجود السكروز","وجود الدهون"],"a":0},{"l":1,"k":"p","q":"سقطت قطعة بطاطا مقلية على دفتر فظهرت بقعة شفافة. على ماذا يدل ذلك؟","o":["وجود بروتين","وجود نشا","وجود فيتامين C","وجود دهون أو زيوت"],"a":3},{"l":1,"k":"p","q":"اختفى لون الإندوفينول بعد ٥ قطرات من عصير (أ) وبعد ١٥ قطرة من عصير (ب). أيهما أغنى بفيتامين C؟","o":["العصير (ب)","كلاهما متساويان","العصير (أ)","لا يمكن الحكم"],"a":2},{"l":1,"k":"p","q":"لم يظهر اللون الأزرق بعد إضافة اليود إلى أنبوب النشا واللعاب، وظهر في أنبوب النشا والماء. ماذا نستنتج؟","o":["اللعاب أضاف نشا جديداً","اللعاب حطّم النشا بفعل الأميليز","الماء حطّم النشا","اللعاب لا يؤثر في النشا"],"a":1},{"l":1,"k":"p","q":"لماذا يُنصح من استُؤصلت مرارته بتقليل الأغذية الغنية بالدهون؟","o":["لأن العصارة الصفراء التي تُحوّل الدهون إلى مستحلب تقلّ كميتها","لأن الدهون تُمتصّ في المعدة","لأن الأميليز لا يعمل في وجود الدهون","لأن الدهون تتحوّل إلى نشا"],"a":0},{"l":1,"k":"p","q":"هل يستطيع الببسين العمل دون حمض الهيدروكلوريك؟","o":["نعم، يعمل في أي وسط","نعم، ويعمل في الوسط القاعدي فقط","لا، لأنه يحتاج إلى الصفراء","لا، لأنه يعمل في وسط حمضي"],"a":3},{"l":1,"k":"p","q":"شخص يعاني صعوبة في هضم سكر الحليب. أي إنزيم ينقصه؟","o":["السكريز","المالتيز","اللاكتيز","الببسين"],"a":2},{"l":2,"k":"p","q":"أيّ التسلسلات صحيح لهضم النشا حتى الغلوكوز؟","o":["ببسين ← مالتوز ← ليبيز ← غلوكوز","ليبيز ← غلوكوز ← مالتيز","أميليز ← مالتوز ← مالتيز ← غلوكوز","أميليز ← أحماض أمينية ← غلوكوز"],"a":2},{"l":2,"k":"p","q":"أيّ التسلسلات صحيح لهضم البروتين حتى الحموض الأمينية؟","o":["تربسين ← ببسين ← مالتيز","ببسين ← تربسين ← محلّلات الببتيد","أميليز ← ببسين ← لاكتيز","ليبيز ← تربسين ← ببسين"],"a":1},{"l":2,"k":"p","q":"ما ناتج هضم السكروز بإنزيم السكريز؟","o":["غلوكوز + فركتوز","غلوكوز + غلاكتوز","غلوكوز + غلوكوز","فركتوز + غلاكتوز"],"a":0},{"l":2,"k":"p","q":"لو تسطّحت الخملات وقلّ عددها في الأمعاء الدقيقة فماذا يُتوقع؟","o":["يزداد الامتصاص","يتوقف الهضم الميكانيكي في الفم","تزداد كفاءة المعدة فقط","تقلّ مساحة السطح الداخلي فيقلّ امتصاص المغذيات"],"a":3},{"l":2,"k":"p","q":"لماذا يصل الدم القادم من الأمعاء الدقيقة إلى الكبد قبل بقية الجسم؟","o":["لأن الكبد يمتص الماء فقط","لأن الكبد يهضم النشا","ليخزّن الكبد بعض المواد وينقّي الدم من السموم","لأن الكبد يضخّ الدم إلى الرئتين"],"a":2},{"l":2,"k":"p","q":"ماذا يحدث لحموضة الكيموس عند إضافة بيكربونات الصوديوم إليه في الاثني عشر؟","o":["تزداد الحموضة","تقلّ الحموضة","لا تتغير الحموضة","يتحوّل إلى حمض الهيدروكلوريك"],"a":1},{"l":2,"k":"p","q":"نباتي يعتمد على مصدر نباتي واحد للبروتين. ما المشكلة المحتملة؟","o":["افتقاره لبعض الحموض الأمينية الضرورية","زيادة الحموض الأمينية عن الحاجة","عدم وجود بروتين في النباتات كلياً","تحوّل البروتين إلى دهن"],"a":0},{"l":2,"k":"p","q":"أي ممارسة غذائية تتفق مع نمط التغذية في حوض المتوسط؟","o":["اللحوم يومياً والخضار شهرياً","الحلوى يومياً","استبعاد الحبوب والبقوليات","زيت الزيتون دهناً رئيساً واللحوم شهرياً"],"a":3}],"hints":{"أُضيف بندكت إلى أنبوب فيه سكروز وسُخّن فلم يتكوّن راسب. ماذا نفعل ليظهر الراسب؟":"تذكّر ما أُضيف إلى أحد أنبوبَي السكروز في نشاط الكشف عن السكريات، وماذا يفعل بالسكروز.","ما الوحدات البنائية للبروتينات؟":"هي ما يتّحد ليكوّن عديد الببتيد، وعددها نحو ٢٠.","لماذا يُنصح من استُؤصلت مرارته بتقليل الأغذية الغنية بالدهون؟":"فكّر في دور الصابون في الزيت، وفي مكان تخزين العصارة الصفراء.","أيّ التسلسلات صحيح لهضم النشا حتى الغلوكوز؟":"ابدأ بإنزيم يعمل على النشا فينتج سكراً ثنائياً، ثم إنزيم يحلّل هذا السكر الثنائي.","لو تسطّحت الخملات وقلّ عددها في الأمعاء الدقيقة فماذا يُتوقع؟":"ما وظيفة الخملات في زيادة مساحة السطح الداخلي؟","لم يظهر اللون الأزرق بعد إضافة اليود إلى أنبوب النشا واللعاب، وظهر في أنبوب النشا والماء. ماذا نستنتج؟":"اليود يكشف النشا؛ غياب لونه يعني غياب النشا."}},{"t":"الجهاز التنفسي","e":["# لماذا نحتاج إلى الجهاز التنفسي؟","كل الأنشطة (المشي والتفكير وانقباض العضلات) وكل العمليات الحيوية في الجسم تحتاج إلى طاقة باستمرار. في نشاط (١): احتراق الحطب في الكانون يتطلب أكسجيناً وينتج ثاني أكسيد الكربون والحرارة؛ ولذلك طلب الجدّ تهوية الغرفة قبل النوم. وكذلك تحصل الخلايا على الطاقة بأكسدة الغذاء بوجود الأكسجين.","- التنفس الخارجي: دخول الهواء إلى الرئتين وخروجه منهما، وتبادل الغازات بين الرئتين والدم.","- التنفس الداخلي: تبادل الغازات بين الدم وأنسجة الجسم.","- التنفس الخلوي: أكسدة (حرق) جزيئات المغذيات كالغلوكوز داخل كل خلية بوجود الأكسجين لتحرير الطاقة المخزّنة فيها.","مصدر الأكسجين هو الهواء، ومصدر المغذيات الجهاز الهضمي، ويوصلهما الدم إلى كل خلية. وهدف التنفس تحرير الطاقة من المغذيات. ويدرس هذا الدرس تركيب الجهاز التنفسي وتلاؤمه مع التنفس الخارجي.","! للجهاز التنفسي وظائف أخرى تتعلق بالقدرة على الكلام وبحاسة الشم.","# تركيب الجهاز التنفسي ومسار الهواء","مسار الهواء: الأنف ← البلعوم ← الحنجرة ← القصبة الهوائية ← الشعبتان ← القصيبات ← الحويصلات الهوائية. والفم ليس من أعضاء الجهاز التنفسي وإن دخل منه الهواء أحياناً (عند اللهاث مثلاً).","نشاط (٢): نفحص رئتي خروف متصلتين بالقصبة الهوائية بالقفازات وأدوات التشريح والعدسة، ونقارنها بالشكل ونصف أعضاءها من حيث اللون والملمس والشكل، ثم:","- نتحسّس القصبة الهوائية: مرنة قابلة للانثناء وتبقى مفتوحة بفعل حلقاتها الغضروفية، ويلزم أن تبقى مفتوحة ليمرّ الهواء دائماً.","- ننفخ الرئتين بمضخة هواء عبر أنبوب مطاطي (لا ننفخ مباشرة تجنباً لاستنشاق مواد منها): تنتفخ الرئتان عند دخول الهواء وتنكمشان عند خروجه.","- نقصّ القصبة طولياً: تتفرع داخل الرئة إلى شعب فقنوات أدق كتفرّعات أغصان الشجرة.","- نفحص فصوص الرئتين: للرئة اليمنى ثلاثة فصوص وللرئة اليسرى فصّان لأن القلب يشغل جزءاً من الجهة اليسرى.","- نضغط قطعة من نسيج الرئة فنجدها إسفنجية القوام، وتطفو في الماء لأنها مملوءة بالهواء.","# أعضاء الجهاز التنفسي بالتفصيل","- الأنف: يبطّنه شعيرات ومخاط وخلايا مهدّبة تنقّي الهواء وتدفّئه وترطّبه، وهذا ما لا يقوم به الفم.","- البلعوم والحنجرة: البلعوم عضو مشترك بين الجهازين الهضمي والتنفسي. والحنجرة تشبه الصندوق في نهاية البلعوم، وفي أعلاها فتحة يغطيها لسان المزمار عند مرور الطعام فلا يدخل الرئتين. وتقع القصبة الهوائية أمام المريء.","- القصبة الهوائية: أنبوب مرن طوله نحو ١٢ سم وقطره نحو ٢٫٥ سم، مبطّن بنسيج يساهم في تنقية الهواء الداخل. ومدعّمة بنحو ١٦ إلى ٢٠ حلقة غضروفية على شكل C غير مكتملة الاستدارة، لتبقى مفتوحة دوماً دون أن تعيق حركة الطعام في المريء خلفها.","- الشعبتان والقصيبات: تتفرع القصبة إلى شعبتين (يمنى ويسرى) ثم تتفرع كل شعبة إلى آلاف القنوات الضيقة تسمى القصيبات (تختفي منها الأقراص الغضروفية)، وتنتهي كل قصيبة بحويصلة هوائية.","- الرئتان: مقعّرتا الشكل تقعان على جانبي القلب في تجويف القفص الصدري، وقاعدتهما العريضة المقعّرة ترتكز على الحجاب الحاجز.","# الحويصلات الهوائية وتبادل الغازات","الحويصلات الهوائية تشبه عنقود العنب، وعددها في الرئتين من ٣٠٠ إلى ٧٠٠ مليون حويصلة، وهي تمنح الرئتين الملمس الإسفنجي وخفة الوزن، وتزيد مساحة السطح الداخلي لتبادل الغازات إلى نحو ٧٠–٩٠ م².","تتكوّن الحويصلة من غشاء رقيق رطب يسمح بمرور الغازات بسهولة، وتحيط بها شبكة من الشعيرات الدموية فيها دم. وفي القصيبات والحويصلات يوجد الهواء. ويحمل الدم في الوريد الرئوي أكسجيناً أكثر مما يحمله الشريان الرئوي لأنه عائد من الرئتين بعد تبادل الغازات.","# الحركات التنفسية","نشاط (٣): بناء أنموذج للرئة من قنينة شفافة وبالونين: البالون المثبّت في القاعدة يمثّل الحجاب الحاجز، والقنينة تجويف الصدر، والبالون الداخلي الرئة، وعنق القنينة ممراً هوائياً. عند سحب بالون القاعدة إلى الأسفل يزداد الحجم فيقلّ الضغط فيدخل الهواء وينتفخ البالون الداخلي. والأنموذج يحاكي الحركات التنفسية جزئياً فقط.","الشهيق: تنقبض العضلات بين الضلوع فيرتفع القفص الصدري إلى الأعلى والخارج، وينقبض الحجاب الحاجز فيتسطّح، فيزداد حجم التجويف الصدري ويقلّ ضغط الهواء داخله عن ضغط الهواء الخارجي، فيندفع الهواء إلى الرئتين فتنتفخان. (العلاقة: عند ثبات درجة الحرارة يقلّ ضغط الغاز المحصور بزيادة حجمه.)","الزفير: عكس ذلك؛ ترتخي العضلات بين الضلوع والحجاب الحاجز فيهبط القفص الصدري إلى الأسفل والداخل ويعود الحجاب مقوّساً، فيقلّ حجم التجويف ويزداد الضغط فيخرج الهواء.","|وجه المقارنة|هواء الشهيق|هواء الزفير","|الأكسجين|٪٢١|٪١٦","|ثاني أكسيد الكربون|٪٠٫٠٤|٪٤","|النيتروجين|٪٧٩|٪٧٩٫٤","|بخار الماء|متغيّر|مشبع","|درجة الحرارة|متغيّرة|٣٧°س","! يختلف الهواءان لأن الخلايا تستهلك الأكسجين وتنتج ثاني أكسيد الكربون؛ ويحمل الزفير بخار ماء وافراً ودرجة حرارة شبه ثابتة لأنه يمرّ بممرات رطبة دافئة.","كل شهيق وزفير يُعدّ مرّة تنفس واحدة؛ ويمكنك عدّ مرات تنفسك في الدقيقة في حالة الراحة وحساب المعدّل لعينة من الطلبة.","# تنظيم عملية التنفس","تنقبض العضلات التنفسية وتنبسط في الوقت المناسب بتأثير عاملين:","- العامل الكيميائي: ارتفاع تركيز CO₂ في الدم إلى حد معيّن يستثير مركز التنفس في الدماغ (في النخاع المستطيل)، فيرسل سيالات عصبية إلى الحجاب الحاجز والعضلات بين الضلوع فتنقبض ويحدث الشهيق ويدخل الهواء الغني بالأكسجين.","- العامل العصبي: عند امتلاء الرئتين يستثير ضغط الهواء في الحويصلات المنتفخة مستقبلات عصبية على جدرانها، فترسل سيالات إلى مركز التنفس فيتوقف عن إرسال سيالاته إلى الحجاب والعضلات بين الضلوع فترتخي ويحدث الزفير.","! قد يلجأ المسعف إلى إسعاف المصاب بالتنفس عن طريق الفم بدل الضغط على الصدر؛ والأفضل استشارة مختص بالإسعافات الأولية.","# التدخين والمشكلات الصحية وأنماط التنفس","ينتج عن التدخين نحو ١٠٠٠ مادة كيميائية معروفة بسميتها، وضرره بطيء متدرّج لكنه مميت: النيكوتين يسبب الإدمان وينبّه القلب فيزيد نبضاته ويضيّق الأوعية فيرتفع الضغط؛ وأول أكسيد الكربون يقلّل توافر الأكسجين في الدم؛ والقطران يسبب السرطان ويهيّج الممرات التنفسية فيسعل المدخّن باستمرار ثم تتدمّر الرئة. وللتدخين غير المباشر ضرر أيضاً.","تلوّث الهواء بالجراثيم والغبار (السيليكا) والتدخين ودخان السيارات والمصانع واحتراق البلاستيك يرتبط بمشكلات الجهاز التنفسي. ومن أمراضه: الرشح والإنفلونزا والتهاب القصبات الهوائية والتهاب الرئتين والسل والأزمة الصدرية وسرطان الرئة؛ وتُبحث أسباب كل منها وأعراضه وانتشاره في فلسطين وطرق الوقاية.","أنماط التنفس عند كائنات أخرى:","|الكائن|نمط تبادل الغازات","|البراميسيوم|عبر الغشاء الخلوي بالانتشار","|دودة الأرض|عبر جلدها الرطب المغطّى بمادة مخاطية","|الحشرات|فتحات جانبية على سطح الجسم تتصل بنظام قصيبات داخلي يصل الهواء مباشرة بالأنسجة","|السمك|الأكسجين من الماء، ويتم التبادل عبر الخياشيم على جانبي الرأس"],"q":["- ماذا يمكن أن يحدث لو اختفت الشعيرات والأهداب والمخاط من الأنف؟","- كيف يتلاءم تركيب القصبة الهوائية مع وظيفتها؟","- فسّر كيف يحدث الشهيق من حيث العضلات وحجم التجويف الصدري وضغط الهواء.","- قارن بين هواء الشهيق وهواء الزفير في نسب الأكسجين وثاني أكسيد الكربون.","- تتبّع بمخطط سهمي كيف يُنظَّم التنفس بالعاملين الكيميائي والعصبي."],"quiz":[{"l":0,"k":"n","q":"ما اسم دخول الهواء إلى الرئتين وخروجه منهما وتبادل الغازات بين الرئتين والدم؟","o":["التنفس الخارجي","التنفس الداخلي","التنفس الخلوي","الهضم"],"a":0},{"l":0,"k":"n","q":"ماذا يُسمّى تبادل الغازات بين الدم وأنسجة الجسم؟","o":["التنفس الخارجي","التنفس الخلوي","الامتصاص","التنفس الداخلي"],"a":3},{"l":0,"k":"n","q":"ماذا يُسمّى أكسدة جزيئات المغذيات داخل الخلية بوجود الأكسجين؟","o":["التنفس الخارجي","التنفس الداخلي","التنفس الخلوي","الشهيق"],"a":2},{"l":0,"k":"n","q":"ما هدف عملية التنفس؟","o":["تصنيع الأكسجين","تحرير الطاقة المخزّنة في المغذيات","التخلص من الماء فقط","هضم الغذاء"],"a":1},{"l":0,"k":"n","q":"أي عضو مشترك بين الجهازين الهضمي والتنفسي؟","o":["البلعوم","المريء","القصبة الهوائية","الرئة"],"a":0},{"l":0,"k":"n","q":"كم حلقة غضروفية تدعّم القصبة الهوائية تقريباً؟","o":["من ٢ إلى ٤","من ٥٠ إلى ٦٠","حلقة واحدة","من ١٦ إلى ٢٠"],"a":3},{"l":0,"k":"n","q":"إلى ماذا تتفرع القصبة الهوائية عند نهايتها؟","o":["ثلاث شعب","أربع شعب","شعبتين يمنى ويسرى","لا تتفرع"],"a":2},{"l":0,"k":"n","q":"بماذا تنتهي كل قصيبة هوائية؟","o":["شريان","حويصلة هوائية","غضروف","لسان المزمار"],"a":1},{"l":1,"k":"p","q":"لماذا لا يغني التنفس عن طريق الفم عن التنفس عن طريق الأنف؟","o":["لأن الفم لا يدخل منه هواء","لأن الأنف فيه شعيرات ومخاط وخلايا مهدّبة تنقّي الهواء وتدفّئه وترطّبه","لأن الفم يوصل الهواء إلى المعدة فقط","لأن الأنف يضخّ الدم"],"a":1},{"l":1,"k":"p","q":"لماذا حلقات القصبة الهوائية على شكل C غير مكتملة؟","o":["لتبقى مفتوحة دون أن تعيق مرور الطعام في المريء خلفها","لتغلق القصبة عند البلع تماماً","لتزيد سمك الرئتين","لتفرز المخاط"],"a":0},{"l":1,"k":"p","q":"ما الذي يمنع دخول الطعام إلى الرئتين عند البلع؟","o":["الحجاب الحاجز","الأقراص الغضروفية في القصيبات","الحويصلات الهوائية","لسان المزمار الذي يغطي فتحة الحنجرة"],"a":3},{"l":1,"k":"p","q":"في أنموذج الرئة (قنينة وبالونان)، ماذا يمثّل البالون المثبّت في قاعدة القنينة؟","o":["الرئة","الممر الهوائي","الحجاب الحاجز","القلب"],"a":2},{"l":1,"k":"p","q":"ماذا يحدث للعضلات والقفص الصدري أثناء الشهيق؟","o":["يرتخي الحجاب ويهبط القفص","ينقبض الحجاب والعضلات بين الضلوع ويرتفع القفص الصدري","ينقبض القلب فقط","ترتخي جميع العضلات"],"a":1},{"l":1,"k":"p","q":"لماذا نسبة الأكسجين في هواء الزفير (٪١٦) أقل منها في الشهيق (٪٢١)؟","o":["لأن جزءاً من الأكسجين انتقل إلى الدم واستُهلك في الخلايا","لأن الرئتين تصنعان النيتروجين","لأن الأكسجين يتحوّل إلى بخار ماء في الأنف","لأن الشهيق يحتوي ثاني أكسيد الكربون أكثر"],"a":0},{"l":1,"k":"p","q":"ماذا يستثير مركز التنفس في النخاع المستطيل (العامل الكيميائي)؟","o":["انخفاض النيتروجين","زيادة تركيز الأكسجين في الدم","ارتفاع الحرارة فقط","ارتفاع تركيز CO₂ في الدم"],"a":3},{"l":1,"k":"p","q":"وُضعت قطعة من نسيج الرئة في كأس ماء فطفت. ما تفسير ذلك؟","o":["لأنها ثقيلة جداً","لأنها مصنوعة من الغضروف فقط","لأنها مملوءة بالهواء إسفنجية القوام","لأنها لا تحتوي أنسجة"],"a":2},{"l":2,"k":"p","q":"في أي حالة يكون ضغط الهواء داخل التجويف الصدري أقل من ضغط الهواء خارج الجسم؟","o":["أثناء الزفير","عند توقف التنفس","أثناء الشهيق عند زيادة حجم التجويف","دائماً"],"a":2},{"l":2,"k":"p","q":"لماذا يحمل الدم في الوريد الرئوي أكسجيناً أكثر من الشريان الرئوي؟","o":["لأنه يأتي من الكبد","لأنه عائد من الرئتين بعد تبادل الغازات في الحويصلات","لأنه يحمل الغذاء","لأنه قادم من الأمعاء"],"a":1},{"l":2,"k":"p","q":"ما فائدة وجود ٣٠٠–٧٠٠ مليون حويصلة هوائية في الرئتين؟","o":["زيادة مساحة السطح الداخلي لتبادل الغازات","زيادة وزن الرئتين","تخزين الطعام","تقليل تدفق الدم"],"a":0},{"l":2,"k":"p","q":"ما أثر غاز أول أكسيد الكربون الناتج عن التدخين في الجسم؟","o":["يزيد الأكسجين في الدم","يقوّي الحويصلات","يزيل القطران","يقلّل توافر الأكسجين في الدم"],"a":3},{"l":2,"k":"p","q":"كيف يرفع النيكوتين ضغط الدم؟","o":["يوسّع الأوعية الدموية","يقلّل نبضات القلب","يزيد نبضات القلب ويضيّق الأوعية الدموية","يسدّ القصبة الهوائية فقط"],"a":2},{"l":2,"k":"p","q":"عند امتلاء الرئتين بالهواء، ماذا يُنتج العامل العصبي؟","o":["يزداد انقباض الحجاب فيزداد الشهيق","تُستثار مستقبلات في الحويصلات فيتوقف مركز التنفس عن إرسال السيالات فيحدث الزفير","تنقبض القصيبات وتغلق","يتوقف القلب"],"a":1},{"l":2,"k":"p","q":"لماذا لا تستطيع دودة الأرض التنفس جيداً لو جفّ جلدها؟","o":["لأن تبادل الغازات يتم عبر جلدها الرطب بالانتشار","لأن لديها خياشيم","لأن لديها رئتين","لأن الهواء يدخل عبر فتحات جانبية"],"a":0},{"l":2,"k":"p","q":"ما سبب ثبات درجة حرارة هواء الزفير تقريباً عند ٣٧°س وتشبّعه ببخار الماء؟","o":["لأنه يبرد في الحويصلات","لأنه يتحوّل إلى نيتروجين","لأنه لا يلامس الجسم","مروره بممرات تنفسية رطبة ودافئة داخل الجسم"],"a":3}],"hints":{"ماذا يُسمّى تبادل الغازات بين الدم وأنسجة الجسم؟":"قارن بين الخارجي (رئتان ودم) والداخلي (دم وأنسجة) والخلوي (داخل الخلية).","لماذا حلقات القصبة الهوائية على شكل C غير مكتملة؟":"فكّر في موقع المريء بالنسبة للقصبة الهوائية، وماذا يمرّ فيه.","ماذا يحدث للعضلات والقفص الصدري أثناء الشهيق؟":"الشهيق يزيد حجم التجويف الصدري؛ فما العضلتان اللتان تنقبضان لتحقيق ذلك؟","لماذا يحمل الدم في الوريد الرئوي أكسجيناً أكثر من الشريان الرئوي؟":"تتبّع اتجاه الدم: هل هو متجه إلى الرئتين أم عائد منهما؟","في أي حالة يكون ضغط الهواء داخل التجويف الصدري أقل من ضغط الهواء خارج الجسم؟":"اربط بين زيادة الحجم ونقصان ضغط الغاز المحصور، ثم بين حركة الهواء واتجاه فرق الضغط.","لماذا لا يغني التنفس عن طريق الفم عن التنفس عن طريق الأنف؟":"ما الذي يبطّن الأنف ولا يوجد في الفم؟"}},{"t":"الجهاز الدوراني","e":["# مكونات الجهاز الدوراني: القلب","الجهاز الدوراني هو نظام النقل في جسم الإنسان؛ فكل خلية تحتاج إلى المغذيات والأكسجين لتقوم بالتنفس الخلوي، ويَنتج عنه ثاني أكسيد الكربون وفضلات يجب التخلص منها، والجهاز الدوراني هو الذي ينقل هذه المواد. ومكوناته: القلب والأوعية الدموية والدم.","القلب عضلة مجوّفة مخروطية الشكل، قاعدتها إلى الأعلى وقمّتها تتجه إلى الأسفل، وحجمه يساوي تقريباً حجم قبضة اليد، ويتراوح وزنه بين 250 و350 غم تقريباً. ويحيط به غشاء التامور الذي يحميه ويسهّل حركته.","يُقسم القلب طولياً إلى نصفين أيمن وأيسر يفصل بينهما حاجز عضلي، ويتألف من أربع حجرات هي الأذينان والبطينان، ويفصل بين كل أذين وبطين صمّام يمنع رجوع الدم إلى الخلف.","- الأذين الأيمن يستقبل الوريدين الأجوفين (العلوي والسفلي) وجدرانهما رقيقة، والأذين الأيسر تتصل به الأوردة الرئوية.","- من البطين الأيمن يخرج الشريان الرئوي، ومن البطين الأيسر يخرج الأبهر، وجدار الأبهر أسمك من جدار الشريان الرئوي.","- جدران البطينين أسمك من جدران الأذينين لأن البطينين يدفعان الدم إلى مسافات أبعد.","# نشاط ١: تشريح قلب خروف أو عجل","الأدوات: أدوات تشريح وحوض تشريح وقلب خروف أو عجل.","- نتأمل الشكل الخارجي للقلب ونحدد أقرب الأشكال الهندسية إليه (مخروط)، ونلاحظ الغشاء الخارجي المحيط به وهو التامور.","- نحدد الأوعية الدموية المتصلة بالقلب ونقارن سُمك جدرانها وسعة تجاويفها، وندخل قلماً في الوعاءين المتصلين بالأذين الأيمن (الوريدان الأجوفان العلوي والسفلي) فنلاحظ رقّة جدرانهما.","- نفتح الأذين الأيمن بالمقص ونلاحظ الصمّام، ثم ندخل ماءً عبره إلى البطين الأيمن ونضغط البطينين فينتقل الماء نحو الأذين، فنعرف وظيفة الصمّام.","- نفتح الجانب الأيسر فنرى فتحات الأوردة الرئوية في الأذين الأيسر وفتحة الأبهر في البطين الأيسر.","- نستنتج أن للقلب أربع حجرات، وأن حجرات النصف الأيمن منفصلة عن حجرات النصف الأيسر بحاجز عضلي، وأن جدار البطين أسمك من جدار الأذين.","# نبض القلب","! بعد نشاط رياضي قوي ومستمر نشعر بزيادة سرعة حركة القلب في الصدر، فيزداد عدد نبضاته.","نشاط ٢: نقيس النبض بالضغط بأطراف الأصابع على باطن مقدمة الرسغ، ونعدّ النبضات مدة 30 ثانية ثم نضرب العدد في 2 لنحصل على عدد النبضات في الدقيقة، ونكرر القياس لعدد من الطلبة وننظم النتائج في جدول، ثم نكرره بعد القفز مدة دقيقة فنجد أن العدد يزداد.","يتأثر عدد نبضات القلب بعوامل كالعمر ومستوى اللياقة البدنية والجهد المبذول.","# الأوعية الدموية","تنقسم الأوعية الدموية إلى ثلاثة أنواع، والجدول يقارن بين أهم صفاتها:","|النوع|الاتجاه ونوع الدم|الخصائص","|الشرايين|تنقل الدم من القلب إلى أجزاء الجسم؛ دمها مؤكسج ما عدا الشريان الرئوي فدمه غير مؤكسج|جدار سميك ومرن وطبقة عضلية سميكة تتحمل ضغط الدم الناتج عن انقباض القلب، وتجويفها ضيّق نسبياً","|الأوردة|تنقل الدم من أجزاء الجسم إلى القلب؛ دمها غير مؤكسج ما عدا الأوردة الرئوية فدمها مؤكسج|جدارها أرق وطبقتها العضلية أقل سمكاً، وتجويفها أوسع، وفيها صمّامات تمنع رجوع الدم إلى الخلف","|الشعيرات الدموية|تربط الشرائين بالأوردة (الشُريّنات بالوُريّدات) وفيها يتبادل الدم المواد مع الخلايا|أوعية دقيقة قطرها أقل من 10 ميكرون وجدارها رقيق، تنتشر في الأنسجة كشبكة واسعة","يعود الدم إلى القلب عبر الأوردة بمساعدة عضلات الجسم الرئيسة وبمساعدة الصمّامات التي تضمن سير الدم نحو القلب.","# الدم ومكوناته","تُفصل مكونات الدم بجهاز الطرد المركزي، فتظهر طبقة عليا هي البلازما (حوالي 55% من حجم الدم) وطبقة سفلى فيها المكونات الخلوية.","- البلازما: سائل لزج يميل إلى الصفرة، 92% منه ماء، والباقي بروتينات وأملاح (كالصوديوم والبوتاسيوم) وسكر غلوكوز وحموض أمينية وهرمونات وفيتامينات وفضلات كاليوريا.","نشاط ٣: نفحص شرائح جاهزة لخلايا الدم بالمجهر المركب ونرسم ما نراه ونقارنه بالشكل المرجعي. وتنشأ جميع المكونات الخلوية في نخاع العظم الأحمر.","|المكوّن|العدد|الشكل والتركيب|الوظيفة","|خلايا الدم الحمراء (RBC)|5–6 مليون في كل ملم³|قرص مقعّر الوجهين، غشاؤه مرن، سيتوبلازمها مملوء بالهيموغلوبين (بروتين يحوي الحديد)|نقل الأكسجين من الرئتين إلى الجسم ونقل جزء من ثاني أكسيد الكربون إلى الرئتين","|خلايا الدم البيضاء (WBC)|4–11 ألف في كل ملم³|كروية الشكل|الدفاع عن الجسم ضد مسببات الأمراض، ويتغير عددها عند المرض","|الصفائح الدموية|200–400 ألف في كل ملم³|أجزاء من خلايا، فيها حبيبات|الدور الأكبر في تخثّر الدم لإيقاف النزيف","عند الجرح الذي يسبب النزف تبدأ عملية تخثّر الدم لإيقاف النزيف. ويصنَّف النزيف إلى خارجي وداخلي.","# وظائف الجهاز الدوراني","- البلازما: تحفظ اتزان السوائل في أنسجة الجسم لوجود الأيونات، وتسهم في حفظ درجة حرارة الجسم، وتنقل المواد (الغلوكوز والحموض الأمينية والهرمونات والفيتامينات والفضلات).","- خلايا الدم الحمراء: نقل الأكسجين وجزء من ثاني أكسيد الكربون. خلايا الدم البيضاء: الدفاع. الصفائح الدموية: التخثّر.","# الدورة الدموية","الدورة الدموية نظام متكامل ينقل الدم إلى أجزاء الجسم كافة بتكامل عمل القلب والأوعية الدموية والدم. وينتقل الدم عبر دورتين:","- الدورة الصغرى (الرئوية): البطين الأيمن ← الشريان الرئوي ← الرئتان (يتبادل الدم الغازات فيصير مؤكسجاً) ← الأوردة الرئوية ← الأذين الأيسر.","- الدورة الكبرى (الجهازية): البطين الأيسر ← الأبهر ← الشرايين ← الشعيرات الدموية في الأنسجة (يتم فيها تبادل المواد الغذائية والغازات بين الدم والخلايا) ← الأوردة ← الوريدان الأجوفان ← الأذين الأيمن.","! الدم في الشريان الرئوي غير مؤكسج وفي الوريد الرئوي مؤكسج، وفي الوريدين الأجوفين غير مؤكسج وفي الأبهر مؤكسج.","ابن النفيس (1213–1288م) هو مكتشف الدورة الدموية الصغرى، واعتمد وليم هارفي على أبحاثه للكشف عن الدورة الكبرى.","عضلة القلب نفسها تحصل على الغذاء والأكسجين بواسطة الشريان التاجي الذي يخرج من الأبهر ويتفرع إلى فرعين يصلان إلى جانبي القلب.","المواد الغذائية المهضومة الممتصة لا تذهب مباشرة إلى القلب: يُمتص كثير منها عبر الشعيرات الدموية والأوردة الواردة من الأمعاء والمعدة والبنكرياس والطحال، وتتجمع في وريد واحد هو الوريد البابي الذي يدخل إلى الكبد ثم تمر إلى القلب عبر الوريد الأجوف السفلي.","# مشكلات صحية تتعلق بجهاز الدوران","- فقر الدم: ينتج عن نقص عدد خلايا الدم الحمراء أو قلّة الهيموغلوبين فيها، فتقل قدرة الدم على حمل الأكسجين، فيصاب المريض بالهزال والتعب السريع والدوار وضعف القدرة على إنجاز الأعمال. من أسبابه سوء التغذية (نقص الحديد والبروتين في الطعام) أو ضعف امتصاص الحديد أو خلل جيني كمرض الثلاسيميا، والطفيليات المتطفلة في الأمعاء الدقيقة.","نشاط ٤: أثر الشاي في أيونات الحديد: عند سكب محلول كبريتات الحديد (II) على الشاي يتكوّن راسب يدل على ارتباط الحديد بمواد الشاي فيقلّ ما يمتصه الجسم منه، وإضافة عصير الليمون تؤثر في هذا الراسب. لذلك تُعد عادة شرب الشاي مع الطعام ممارسة غذائية خاطئة تسهم في فقر الدم.","- تصلّب الشرايين: ارتفاع نسبة الدهون في الدم وترسّبها على جدران الشرايين يضيّق تجويفها ويقلل مرونة جدارها ويضعف تدفق الدم فيها، فيتضرر العضو الذي يغذيه الشريان. من أسبابه التدخين والبدانة.","# نظرة إلى: أجهزة الدوران عند كائنات أخرى","|الكائن|نمط تبادل المواد","|البلاناريا|لا تمتلك جهازاً دورانياً، وتنتقل المواد بالانتشار","|نجم البحر|جهاز دوراني مائي","|الحشرات|جهاز دوراني مفتوح","|الرخويات|جهاز دوراني مغلق"],"q":["- ارسم القلب مقطعاً طولياً وسمِّ حجراته وأوعيته الدموية، وبيّن نوع الدم (مؤكسج أم غير مؤكسج) في كل منها.","- قارن بين خلايا الدم الحمراء والبيضاء والصفائح الدموية في جدول من حيث الشكل والعدد والوظيفة ووجود النواة.","- كيف يتلاءم تركيب خلية الدم الحمراء مع وظيفتها؟","- تتبّع مسار الدم في الدورتين الصغرى والكبرى مبيّناً أين يحدث تبادل المواد.","- ما سبب فقر الدم؟ وما أثر ترسّب الدهون على جدران الشرايين؟"],"quiz":[{"l":0,"k":"n","q":"ما الذي يحيط بالقلب ويحميه ويسهّل حركته؟","o":["غشاء التامور","الحاجز العضلي","الصمّام","الشريان التاجي"],"a":0},{"l":0,"k":"n","q":"كم حجرة في القلب؟","o":["حجرتان","أربع حجرات","ثلاث حجرات","ست حجرات"],"a":1},{"l":0,"k":"n","q":"ما وظيفة الصمّامات الواقعة بين الأذين والبطين؟","o":["ضخ الدم إلى الرئتين","إنتاج خلايا الدم","منع رجوع الدم إلى الخلف","فصل نصفي القلب طولياً"],"a":2},{"l":0,"k":"n","q":"أي الأوعية الدموية تنقل الدم من القلب إلى أجزاء الجسم؟","o":["الأوردة","الشعيرات الليمفية","الوريد البابي","الشرايين"],"a":3},{"l":0,"k":"n","q":"ما الوعاء الدموي الذي ينقل د "أي الأوعية الدموية تنقل الدم من القلب إلى أجزاء الجسم؟":"فكّر في اتجاه سريان الدم: من القلب أو إليه؟","وضع طالب أصابعه على رسغ زميله وعدّ 36 نبضة في 30 ثانية. كم نبضة في الدقيقة؟":"العدد المقيس لنصف دقيقة يمثّل نصف عدد الدقيقة؛ فماذا تفعل به؟","لماذا يكون جدار الشريان أسمك وأكثر مرونة من جدار الوريد؟":"تأمل ما يتعرض له الشريان عند انقباض القلب، وما يحتاجه جداره ليقاوم ذلك.","تُظهر نتيجة تحليل دم أن عدد خلايا الدم البيضاء 20 ألفاً في الملم³. ماذا تتوقع؟":"قارن العدد المقيس بالمعدل الطبيعي لخلايا الدم البيضاء، وتذكّر وظيفتها.","في أي ترتيب يمر الدم في الدورة الصغرى؟":"ابدأ من البطين الأيمن، وتذكّر أن الدم يتجه إلى الرئتين ثم يعود إلى جهة اليسار."}},{"t":"الجهاز الليمفي","e":["# مكونات الجهاز الليمفي","عندما نصاب بالتهاب اللوزتين أو نشاهد طحال خروف نتساءل عن أهمية هذه الأعضاء؛ إنها جزء من الجهاز الليمفي.","تمرّ الشعيرات الدموية الشريانية ثم الوريدية في الأنسجة، ولا يغادر الدم الشعيرات الدموية، لكن سائلاً يسمى السائل بين الخلوي (البيني) يرشح منها حاملاً الأكسجين والمغذيات لتصل إلى جميع الخلايا.","ثم يحمل السائل بين الخلوي فضلات الخلايا وثاني أكسيد الكربون، ويعود معظمه إلى الجانب الوريدي من الشعيرات الدموية. أما الجزء المتبقي بين الخلايا فيسمى الليمف، وهو يعود عبر الشعيرات الليمفية ثم الأوعية الليمفية ليصبّ في الوريد الأجوف العلوي.","! اتجاه سريان السائل في الأوعية الليمفية أحادي نحو القلب، وتتصل الأوعية الليمفية بالدورة الدموية عبر الوريد الأجوف العلوي.","# أجزاء الجهاز الليمفي","|الجزء|الموقع|الدور","|الأوعية الليمفية|منتشرة في الجسم وتشمل الشعيرات الليمفية (كما في خملات الأمعاء)|تجمع الليمف وتعيده إلى الدم","|العقيدات الليمفية (اللوزتان)|عند مدخل البلعوم|تمنع دخول مسببات الأمراض","|العقد الليمفية|في أماكن مثل تحت الإبط والرقبة|تحتوي خلايا ليمفية تحارب مسببات الأمراض في الليمف","|الغدة الزعترية|على طول القصبة الهوائية|جزء من الجهاز الليمفي","|الطحال|في الجهة اليسرى من تجويف البطن العلوي|يحوي خلايا ليمفية تحارب مسببات الأمراض","|نخاع العظم الأحمر|داخل العظام|تنشأ فيه الخلايا الدموية ومنها خلايا ليمفية، لذلك يُعد جزءاً من الجهاز الليمفي","تحتوي العقيدات الليمفية والعقد الليمفية والطحال على خلايا ليمفية تحارب مسببات الأمراض الموجودة في الليمف.","# وظائف الجهاز الليمفي","- إعادة السائل الزائد بين الخلايا (الليمف) إلى الدورة الدموية فيحفظ اتزان السوائل.","- الدفاع عن الجسم ومحاربة مسببات الأمراض بواسطة الخلايا الليمفية في العقد والطحال واللوزتين.","- امتصاص نواتج هضم الدهون من الأمعاء الدقيقة عبر الأوعية الليمفية في الخملات ونقلها إلى الدم.","# مشكلات صحية: دراسة حالة التهاب اللوزتين","بعد أن تناولت مريم مثلجات ومشروباً بارداً جداً شعرت بآلام في الحلق وصعوبة في البلع مع ارتفاع درجة الحرارة وقشعريرة وفقدان للشهية ورائحة كريهة للفم. وجد الطبيب احمراراً في اللوزتين وتضخمهما وتكوّن صديد عليهما.","- المرض المتوقع: التهاب اللوزتين، وأعراضه ما سبق.","- المخاطر عند تكرار الإصابة: تضرر اللوزتين واحتمال انتقال العدوى إلى أعضاء أخرى، وقد يحتاج الأمر إلى استئصالهما بنصيحة الطبيب.","- النصيحة: مراجعة الطبيب، وتجنب المشروبات والمأكولات شديدة البرودة، والعناية بالنظافة وتناول الغذاء الصحي.","! ألم تحت الإبط عند وجود جرح غائر في اليد يدل على أن العقد الليمفية هناك تحارب العدوى فتتضخم وتؤلم.","مرض الإيدز له آثار وخيمة على الأفراد والمجتمع؛ والوقاية منه بالابتعاد عن مسبباته والسلوك الصحيح."],"q":["- ما المقصود بالليمف؟ وكيف يعود إلى الدورة الدموية؟","- كيف يتم تبادل المواد بين الدم والخلايا رغم أن الدم لا يغادر الشعيرات الدموية؟","- اذكر ثلاث وظائف أساسية للجهاز الليمفي.","- فسّر شعور حاتم بألم تحت الإبط عند إصابته بجرح غائر في يده.","- ما مخاطر تعرض الجانب الأيسر من الجسم لضربة قوية، علماً بأن الطحال يقع هناك؟"],"quiz":[{"l":0,"k":"n","q":"ما اسم السائل الذي يرشح من الشعيرات الدموية إلى الخلايا حاملاً الأكسجين والمغذيات؟","o":["السائل بين الخلوي","البلازما المركّزة","الصفراء","اللعاب"],"a":0},{"l":0,"k":"n","q":"ما اسم السائل المتبقي بين الخلايا الذي يعود عبر الشعيرات الليمفية؟","o":["الهيموغلوبين","الليمف","العصارة الهاضمة","الصديد"],"a":1},{"l":0,"k":"n","q":"إلى أي وعاء يصبّ الليمف ليعود إلى الدورة الدموية؟","o":["الشريان الرئوي","الأبهر","الوريد الأجوف العلوي","الوريد البابي"],"a":2},{"l":0,"k":"n","q":"ماذا تسمى العقيدات الليمفية الموجودة عند مد وزتان ← الخلية ← الطحال","الأبهر ← الليمف ← الأوردة الرئوية","شعيرة شريانية ← السائل بين الخلوي ← الخلية ← السائل بين الخلوي ← شعيرة وريدية"],"a":3}],"hints":{"ما اسم السائل الذي يرشح من الشعيرات الدموية إلى الخلايا حاملاً الأكسجين والمغذيات؟":"السائل الذي يملأ المسافات بين الخلايا ويحمل الأكسجين والمغذيات.","كيف يختلف اتجاه سريان السائل في الأوعية الليمفية عنه في الدورة الدموية؟":"تذكّر أن الليمف لا يدور في حلقة مغلقة كالدم.","أي العبارات تصف خروج السائل بين الخلوي من الشعيرات الدموية؟":"ما الذي يخرج من الشعيرات وإلى أين يعود معظمه؟","تعرّض رامي لضربة على جانبه الأيسر. ما الخطر المتوقع على الجهاز الليمفي؟":"أي الأعضاء الليمفية يقع في الجهة اليسرى؟","جُرح حاتم جرحاً غائراً في يده فشعر بألم تحت الإبط. ما أقرب تفسير؟":"العقد الليمفية في منطقة الإبط قريبة من اليد.","لماذا يمكن عدّ الطحال جزءاً من الدفاع عن الجسم؟":"ماذا يحدث للسائل بين الخلوي إذا لم يعد إلى الدم؟","تتناول وجبة غنية بالدهون. أي طريق تسلكه نواتج هضم الدهون الممتصة؟":"فكر في دور العقد الليمفية عند حدوث عدوى قريبة."}}]},{"title":"الكهرباء في حياتنا","ic":"bolt","color":"#f7e18a","uq":[[0,"كيف يوصَل الفولتميتر لقياس فرق الجهد بين طرفي عنصر؟",["على التوالي مع العنصر","على التوازي مع العنصر","بدل العنصر","بعد فصل البطارية"],1],[0,"ما وحدة قياس القدرة الكهربائية؟",["الواط","الأوم","الأمبير","الفولت"],0],[0,"ما القوة الدافعة الكهربائية لعمود؟",["شدة التيار الأعظم فيه","مقاومته الخارجية","قدرته بالواط","فرق الجهد بين قطبيه عند عدم مرور تيار"],3],[1,"سرى تيار ٠٫٢ أمبير مدة ٥ دقائق. ما كمية الشحنة التي مرّت؟",["١ كولوم","٦ كولوم","٦٠ كولوماً","٠٫٠٤ كولوم"],2],[1,"مقاومتان ٥ أوم و١٠ أوم على التوالي. ما المقاومة المكافئة؟",["٣٫٣ أوم","١٥ أوماً","٥٠ أوماً","٢ أوم"],1],[1,"مكنسة قدرتها ١٦٠٠ واط ومقاومتها ١٠٠ أوم. ما شدة التيار المار فيها؟",["٤ أمبير","١٦ أمبير","٢ أمبير","٠٫٢٥ أمبير"],0],[1,"مجفف شعر قدرته ٩٦٠ واط ومقاومته ٦٠ أوماً. على أيّ فرق جهد يعمل؟",["١٢٠ فولتاً","١٦ فولتاً","٤ فولت","٢٤٠ فولتاً"],3],[2,"مقاومتان ٢٠ أوم و٥ أوم على التوازي. ما المقاومة المكافئة؟",["٢٥ أوماً","١٢٫٥ أوم","٤ أوم","١٠٠ أوم"],2],[2,"قد = ١٨ فولت، مد = ١ أوم، والتيار ٢ أمبير ومصباحان متماثلان على التوالي. ما مقاومة كل مصباح؟",["٨ أوم","٤ أوم","٩ أوم","٢ أوم"],1],[2,"أيّ العلاقات الآتية للقدرة غير صحيحة؟",["القدرة = م × جـ","القدرة = ط ÷ ز","القدرة = ت² × م","القدرة = جـ² ÷ م"],0],[2,"ميكروويف ١١٠٠ واط يعمل ساعة يومياً لمدة ٣٠ يوماً، وثمن الكيلوواط ساعة ١٠ قروش. كم ثمن الاستهلاك الشهري؟",["٣٣ قرشاً","٣٣٠٠ قرش","١١٠ قروش","٣٣٠ قرشاً"],3],[2,"سلكان من المادة نفسها وطولهما واحد، ومقاومة (أ) أربعة أمثال مقاومة (ب). كم مرة يزيد قطر (ب) على قطر (أ)؟",["٤ مرات","٨ مرات","مرتين","نصف مرة"],2]],"lessons":[{"t":"التيار الكهربائي والدارات الكهربائية","e":["# الدارة الكهربائية البسيطة","الأجهزة الكهربائية كالحاسوب والتلفاز والمذياع تحتوي قطعاً صغيرة مربوطة بأسلاك ملوّنة، وهي تشكّل دارات كهربائية. الدارة البسيطة تتكوّن من أسلاك نحاسية وبطارية ومفتاح ومصباح.","نشاط ١: نربط الأجزاء السابقة ونغيّر ترتيبها ونرصد الحالات التي يضيء فيها المصباح، ثم نرسم الدارة التي أضاء فيها.","- يضيء المصباح عندما تكون الدارة مغلقة: مسار مغلق متصل يبدأ من أحد قطبي البطارية، ويمرّ بالمصباح والأسلاك، ثم يعود إلى القطب الآخر.","- لا يضيء المصباح إذا انفصل أيّ سلك (دارة مفتوحة)، أو إذا لم يتصل طرفا المصباح بقطبي البطارية معاً.","- دور المفتاح: فتح الدارة وإغلاقها؛ فإذا فُتح المفتاح انقطع المسار ولم يسرِ تيار، وإذا أُغلق سرى التيار.","! شروط سريان التيار: مصدر كهربائي (بطارية)، ومسار مغلق من مادة موصلة. ولا يلزم اتجاه معيّن لدخول التيار في المصباح كي يضيء.","# التيار الكهربائي وشدّته","سلك النحاس وأيّ موصل فلزّي يحتوي إلكترونات حرّة تتحرّك حركة عشوائية مستمرة. وعند وصل طرفي السلك بالبطارية تصير محصّلة حركة الإلكترونات الحرة في اتجاه محدّد، وهذا ما يُسمّى التيار الكهربائي، وهو ينقل الطاقة الكهربائية من نقطة إلى أخرى عبر الموصل. ففي الموصل قبل وصله ببطارية تتحرك الإلكترونات حول أنوية الذرات، وبعد وصله تتجه نحو القطب الموجب للبطارية.","يُعبَّر عن كمية الشحنة التي تمرّ في مقطع الموصل كل ثانية بشدّة التيار الكهربائي، ويُرمز لها (ت) وتُقاس بالأمبير نسبةً إلى الفيزيائي الفرنسي أندريه أمبير.","شدة التيار (ت) = كمية الشحنة (ش) ÷ الزمن (ز)، أي: ت = Δش / Δز، حيث الشحنة بالكولوم والزمن بالثانية.","مثال محلول: يسري تيار شدته ٠٫٥ أمبير في دارة فيها مصباح وبطارية. كمية الشحنة التي تمرّ خلال ١٠ دقائق = ت × ز = ٠٫٥ × (١٠ × ٦٠) = ٣٠٠ كولوم.","! الاتجاه الاصطلاحي للتيار هو من القطب الموجب إلى القطب السالب خارج البطارية، ويعاكس الاتجاه الفعلي لحركة الإلكترونات في الموصلات الفلزية الذي يُسمّى التيار الإلكتروني.","! وحدة الشحنة الكولوم نسبةً إلى تشارلز كولوم. شحنة الإلكترون ١٫٦ × ١٠⁻¹⁹ كولوم، أي أنّ الكولوم الواحد يكافئ نحو ٦٫٢٥ × ١٠¹⁸ إلكتروناً.","معظم الأجهزة الكهربائية في البيت تعمل بتيار أقل من ١٥ أمبير، بينما تُنتج محطة توليد الكهرباء آلاف الأمبيرات. وتنقل الموصلات (عادةً أسلاك نحاسية) التيار، لكن الدارات قد تتضمّن غازات أو سوائل موصلة أيضاً.","# قياس شدّة التيار وفرق الجهد","تُقاس شدة التيار بجهاز الأميتر، ويُوصل على التوالي مع عناصر الدارة، بحيث يتصل قطبه الموجب بالقطب الموجب للبطارية وقطبه السالب بالجهة السالبة، مع وجود مقاومة في الدارة. وتُقاس التيارات الضعيفة بجهاز الجلفانوميتر.","فرق الجهد: التفاعلات الكيميائية في البطارية تولّد طاقة تدفع الإلكترونات للتجمّع على أحد قطبيها فيُشحن بشحنة سالبة، ويصير القطب الآخر موجباً، فينشأ فرق جهد بين القطبين. وبذلك تكتسب الشحنات الحرة طاقة تمكّنها من السريان في مسار مغلق مولّدةً تياراً يضيء مصباحاً أو يشغّل جهازاً.","يُقاس فرق الجهد بجهاز الفولتميتر، ووحدته الفولت نسبةً إلى العالم الإيطالي أليساندرو فولتا. ويُوصل الفولتميتر على التوازي مع العنصر المراد قياس فرق الجهد بين طرفيه، ويتصل قطبه الموجب بجهة القطب الموجب للبطارية. ويمكن الاستعاضة عن الأميتر والفولتميتر بجهاز المقياس المتعدد (Multimeter) الذي يقيس الجهد والتيار والمقاومة.","# نشاط ٢: قياس شدة التيار وفرق الجهد","الجزء الأول (التيار): نبني دارة فيها مصباح ومفتاح وأميتر، ونقيس التيار في أربع نقاط (أ، ب، ج، د) والدارة مفتوحة ثم مغلقة.","- والنتيجة: عند إغلاق الدارة تكون شدة التيار متساوية في جميع النقاط، وعند فتحها تساوي صفراً؛ فالشحنات لا تُستنفد في المصباح، وكمية الشحنة الداخلة إلى المصباح تساوي الخارجة منه.","الجزء الثاني (فرق الجهد): نقيس فرق الجهد بين طرفي كل عنصر في دارة فيها مصباحان متماثلان.","- البطارية هي الجزء الذي يزوّد الدارة بالطاقة، أما المصابيح فتستهلك الطاقة الكهربائية وتحوّلها إلى ضوء وحرارة.","- فرق جهد البطارية يساوي مجموع فرقي الجهد بين طرفي المصباحين.","- عند استبدال مصباح بآخر مختلف يختلف فرق الجهد عليه وتختلف إضاءته.","# الصعقة الكهربائية","تُغطّى أسلاك الكهرباء بمادة بلاستيكية عازلة، لكنها قد تنقطع أو تحترق فيسري التيار في مسار غير متوقّع، كأن يمسك شخص بسلك مكشوف فتكتمل الدارة عبر جسمه وهو خطر على حياته. وتتوقف الخطورة على فرق الجهد وشدة التيار.","- تيار ٠٫٠٠١ أمبير قد لا يُشعَر به، وبين ٠٫٠١٥ و٠٫٠٢٠ أمبير يسبّب ألماً وفقدان السيطرة على بعض العضلات، وكمية أكبر قد تسبب الحرق أو تدمير القلب، وتيار قليل بمعدّل ٠٫١ أمبير قد يكون مميتاً.","- تُستخدم الصعقات الكهربائية المنضبطة في الطب لإنقاذ الحياة (كإعادة نبض القلب).","! عند تقطّع خطوط الكهرباء وسقوطها على سيارة، يُنصح السائق بالبقاء داخل السيارة وعدم لمسها والاتصال بالمختصين؛ لأنه لو نزل فقد يصير جسمه مساراً للتيار بين السيارة والأرض."],"q":["- في الشكل: مرّت شحنة ١٠ كولوم في مقطع موصل خلال ثانيتين، احسب شدة التيار.","- ارسم دارة كهربائية بالرموز فيها بطارية ومفتاح ومصباح وأميتر وأسلاك، وضع أسهماً تبيّن اتجاه التيار الإلكتروني والاصطلاحي، وصف وظيفة كل عنصر.","- ما صحة العبارة: «شدة التيار في النقطة (د) أقل من شدتها في النقاط (أ) و(ب) و(ج)»؟ فسّر إجابتك.","- إذا قارنّا الدارة الكهربائية بدورة مائية في حديقة ألعاب مائية، فماذا يمثّل كلٌّ من: الماء، ضغط الماء، مضخة الماء، كمية الماء المتدفق في الدقيقة؟","- كيف يوصَل كلٌّ من الأميتر والفولتميتر في الدارة؟"],"quiz":[{"l":0,"k":"n","q":"ما الرمز المستعمل لشدة التيار الكهربائي في الكتاب؟","o":["ش","ت","ز","جـ"],"a":1},{"l":0,"k":"n","q":"ما وحدة قياس شدة التيار الكهربائي؟","o":["الأمبير","الفولت","الأوم","الكولوم"],"a":0},{"l":0,"k":"n","q":"أيّ الأجهزة الآتية يُستعمل لقياس شدة التيار؟","o":["الفولتميتر","الأوميتر","المحرار","الأميتر"],"a":3},{"l":0,"k":"n","q":"كيف يوصَل الأميتر في الدارة؟","o":["على التوازي مع العنصر","بين قطبي البطارية فقط","على التوالي مع عناصر الدارة","بعد فصل الدارة عن البطارية"],"a":2},{"l":0,"k":"n","q":"كيف يوصَل الفولتميتر لقياس فرق الجه
