 ٠٫٣ أمبير","٠٫٣ أمبير","صفراً","أكبر من ٠٫٣ أمبير"],"a":1},{"l":2,"k":"p","q":"مرّت شحنة ٤٨٠ كولوماً في مقطع موصل خلال ٤ دقائق. ما شدة التيار؟","o":["٢ أمبير","١٢٠ أمبير","١٩٢٠ أمبيراً","٠٫٥ أمبير"],"a":0},{"l":2,"k":"p","q":"يسري تيار ٠٫٥ أمبير في مصباح مدة ١٠ دقائق. كم كولوماً يمرّ؟","o":["٥ كولوم","٥٠ كولوماً","٣٠٠٠ كولوم","٣٠٠ كولوم"],"a":3},{"l":2,"k":"p","q":"كم تساوي شحنة ١٫٢٥ × ١٠¹⁹ إلكترون علماً أن شحنة الإلكترون ١٫٦ × ١٠⁻¹⁹ كولوم؟","o":["١٫٢٥ كولوم","٠٫٨ كولوم","٢ كولوم","٢٠ كولوماً"],"a":2},{"l":2,"k":"p","q":"وُصل مصباحان على التوالي ببطارية ١٢ فولت، فكان فرق الجهد على الأول ٥ فولت. كم فرق الجهد على الثاني؟","o":["٥ فولت","٧ فولت","١٢ فولتاً","١٧ فولتاً"],"a":1},{"l":2,"k":"p","q":"نُزع المصباحان من دارة مغلقة ثم قيس فرق الجهد عند طرفي المنطقة الخالية (و). ماذا تتوقع القراءة؟","o":["تساوي فرق جهد البطارية","صفراً","نصف فرق جهد البطارية","ضعف فرق جهد البطارية"],"a":0},{"l":2,"k":"p","q":"سائق سيارة علقت في الثلج وتقطّعت فوقها خطوط كهرباء. ما النصيحة الأنسب؟","o":["النزول فوراً والركض بعيداً","لمس الخط لإبعاده عن السيارة","النزول والتمسّك بجسم السيارة","البقاء داخل السيارة وعدم لمسها وطلب المساعدة"],"a":3},{"l":2,"k":"p","q":"تيار شدته ٠٫٠٢ أمبير مرّ في جسم شخص. ما أثره المتوقع حسب الكتاب؟","o":["لا يشعر به إطلاقاً","موت محقّق","ألم الصدمة وفقدان السيطرة على بعض العضلات","لا شيء لأنه أقل من ٠٫١ أمبير"],"a":2}],"hints":{"كيف يوصَل الأميتر في الدارة؟":"الأميتر يقيس التيار الذي يمرّ في الدارة نفسها؛ فكيف تجعل التيار كله يمرّ فيه؟","سرى تيار شدته ٢ أمبير مدة ٥ ثوانٍ. كم كولوماً من الشحنة مرّ؟":"استعمل ت = ش ÷ ز ثم اضرب لإيجاد الشحنة: ش = ت × ز.","مرّت شحنة مقدارها ٦ كولوم في مقطع سلك خلال ٢ ثانية. ما شدة التيار؟":"اقسم الشحنة بالكولوم على الزمن بالثواني.","في نشاط الأميتر: قراءته عند النقطة (أ) قبل المصباح ٠٫٣ أمبير. ماذا تتوقع قراءته بعد المصباح عند (د)؟":"في الدارة المغلقة على التوالي: هل تُستنفد الشحنات في المصباح؟","مرّت شحنة ٤٨٠ كولوماً في مقطع موصل خلال ٤ دقائق. ما شدة التيار؟":"حوّل الدقائق إلى ثوانٍ ثم احسب ت = ش ÷ ز.","كم تساوي شحنة ١٫٢٥ × ١٠¹⁹ إلكترون علماً أن شحنة الإلكترون ١٫٦ × ١٠⁻¹⁹ كولوم؟":"كم كولوماً يكافئ ٦٫٢٥ × ١٠¹⁸ إلكتروناً؟ اضرب عدد الإلكترونات في شحنة الإلكترون الواحد."}},{"t":"المقاومات الكهربائية وقانون أوم","e":["# المقاومة الكهربائية","المقاومة الكهربائية خاصيّة فيزيائية للمواد تعيق مرور التيار الكهربائي وتحوّل الطاقة الكهربائية إلى أشكال أخرى من الطاقة. فالتيار يعبّر عن حركة الإلكترونات، وفرق الجهد هو ما يجعلها تتحرك، والمقاومة هي ما يعيق حركتها.","- الموصلات الجيدة كالنحاس لها مقاومة قليلة لأن فيها عدداً كافياً من الإلكترونات الحرة، أما المواد ضعيفة التوصيل فمقاومتها عالية.","- المقاومة مفيدة في الدارات: لضبط شدة التيار وفرق الجهد بما يناسب الأجهزة، ولتحويل الطاقة الكهربائية إلى حرارة في بعض الأجهزة.","- أنواعها: المقاومات الفلزية والكربونية (الأكثر استخداماً في الدارات الإلكترونية لأنها أقل تكلفة)، وتُعرف قيمتها من دلالات الألوان المرسومة عليها.","- المقاومات المتغيرة: تتغير قيمتها بالتحكّم (كقرص التحكم بصوت المذياع)، وبعضها يتغير استجابةً للحرارة أو الضوء أو فرق الجهد.","تُقاس المقاومة بوحدة الأوم (Ω) نسبةً إلى العالم الألماني أوم، بجهاز الأوميتر أو بالمقياس المتعدد. ومقاومة جلد الإنسان الجاف تقدَّر بنحو ٥٠٠٠٠٠ أوم.","# قانون أوم","نشاط ٢: نركّب دارة فيها مقاومة وأميتر على التوالي وفولتميتر على التوازي، ونغيّر فرق الجهد من ١ إلى ٦ فولت ونسجّل التيار في كل مرة، ثم نكرّر مع مقاومة ثانية، ونرسم العلاقة بين فرق الجهد والتيار.","- مع زيادة فرق الجهد تزداد شدة التيار بالنسبة نفسها، ويكون الخط الناتج مستقيماً يمرّ بنقطة الأصل.","- عند فرق الجهد نفسه يكون التيار أقل في المقاومة الأكبر.","! احتياطات السلامة: لا تلمس المقاومات أثناء مرور التيار، ولا تستعمل تياراً أكبر من ٠٫٥ أمبير أو فرق جهد أكبر من ١٢ فولت.","توصّل أوم عام ١٨٢٦ إلى قانونه: عند ثبوت درجة الحرارة تتناسب شدة التيار طردياً مع فرق الجهد بين طرفي المقاومة، أي:","المقاومة (م) = فرق الجهد (جـ) ÷ شدة التيار (ت)، ومنه جـ = م × ت و ت = جـ ÷ م. وتُقاس المقاومة بالأوم وفرق الجهد بالفولت والتيار بالأمبير (١ أوم = ١ فولت/أمبير).","ميل الخط المستقيم في الرسم البياني (جـ على المحور الصادي وت على السيني) يساوي المقاومة. وهناك مقاومات لا تتبع قانون أوم تسمى مقاومات لا أومية.","مثال محلول (١): سخّان كهربائي يسري فيه تيار ١٢٫٥ أمبير على فرق جهد ٢٢٠ فولت (فلسطين). المقاومة م = جـ ÷ ت = ٢٢٠ ÷ ١٢٫٥ = ١٧٫٦ أوم.","- لو أُخذ السخّان إلى كندا (فرق الجهد ١٢٠ فولت) لصار التيار ت = ١٢٠ ÷ ١٧٫٦ ≈ ٦٫٨ أمبير، أقل بكثير؛ ولذلك يحتاج استعمال الأجهزة في الدول المختلفة إلى محولات.","مثال محلول (٢): من الرسم البياني لمصباح: المقاومة = ميل الخط = (٤ − ٢) ÷ (٢ − ١) = ٢ أوم. عند فرق جهد ٩ فولت: ت = جـ ÷ م = ٩ ÷ ٢ = ٤٫٥ أمبير. وعند تيار ٦ أمبير: جـ = ت × م = ٦ × ٢ = ١٢ فولت.","# توصيل المقاومات وحساب المقاومة المكافئة","للمقاومات طريقتان للتوصيل: على التوالي وعلى التوازي. وأجهزة البيت تُوصل على التوازي حتى يعمل كل جهاز بمعزل عن الآخر.","- التوالي: للتيار مسار واحد، فشدة التيار متساوية في كل المقاومات (ت الكلي = ت₁ = ت₂ = ت₃)، وفرق الجهد الكلي يساوي مجموع فروق الجهد على المقاومات (جـ الكلي = جـ₁ + جـ₂ + جـ₃).","- التوازي: ينقسم التيار في التفرعات، والتيار الكلي يساوي مجموع التيارات الفرعية (ت الكلي = ت₁ + ت₂ + ت₃)، وفرق الجهد واحد على كل فرع (جـ الكلي = جـ₁ = جـ₂ = جـ₃).","المقاومة المكافئة (مك) مقاومة واحدة تحلّ محل مجموعة مقاومات دون تغيير شدة التيار الكلي:","- على التوالي: مك = م₁ + م₂ + م₃ + … + مₙ","- على التوازي: ١/مك = ١/م₁ + ١/م₂ + ١/م₃ + … + ١/مₙ","مثال محلول: مقاومتان ٥٠ أوم و١٠٠ أوم على التوازي: ١/مك = ١/٥٠ + ١/١٠٠ = ٣/١٠٠ فتكون مك = ٣٣٫٣ أوم. ثم توصل مع ٨٠ أوم على التوالي: المقاومة المكافئة الكلية = ٣٣٫٣ + ٨٠ = ١١٣٫٣ أوم.","سؤال الكتاب: مقاومتان متساويتان ٦ أوم؛ على التوالي المكافئة = ٦ + ٦ = ١٢ أوم، وعلى التوازي ١/مك = ١/٦ + ١/٦ = ١/٣ فتكون ٣ أوم. نستنتج أن التوالي يزيد المقاومة، والتوازي يقلّلها لتصير أقل من كل مقاومة منفردة.","# العوامل المؤثرة في المقاومة","نشاط ٥: نقيس بالأوميتر مقاومة أسطوانات جرافيت مختلفة الطول والقطر، فنجد أن مقاومة الموصل تعتمد على:","- طول الموصل: تزداد المقاومة بازدياد الطول.","- مساحة مقطع الموصل: تزداد المقاومة بنقصان مساحة المقطع (السلك الأرفع مقاومته أكبر).","- نوع المادة: تختلف المقاومة باختلاف المادة بثبوت درجة الحرارة والضوء، وتتميّز كل مادة بما يسمى المقاومية (المقاومة النوعية) ويُرمز لها بالرمز ρ.","مقاومة السلك = المقاومية × طول السلك ÷ مساحة المقطع، أي م = ρ ل ÷ س. والمقاومية هي مقاومة سلك فلزّي طوله ١ سم ومساحة مقطعه ١ سم². والموصلية خاصية تعبّر عن قدرة المادة على توصيل التيار، والمقاومية = ١ ÷ الموصلية.","جدول المقاومية عند ٢٠°م (أوم.سم): الفضة ١٫٥٩ × ١٠⁻⁶، النحاس ١٫٦٨ × ١٠⁻⁶، التنجستون ٥٫٦ × ١٠⁻⁶، الكربون (الجرافيت) ٣٫٥ × ١٠⁻³؛ والفضة أكثر موصلية من التنجستون. وتغلَّف الأسلاك بالمطاط أو البلاستيك لأن مقاوميتها هائلة فتعزل التيار.","مثال محلول: سلك نحاسي طوله ٢ متر (٢٠٠ سم) ومساحة مقطعه ١ سم². م = (١٫٦٨ × ١٠⁻⁶ × ٢٠٠) ÷ ١ = ٣٫٣٦ × ١٠⁻⁴ أوم.","! مقاومة النحاس تزداد بزيادة درجة الحرارة، بعكس الكربون الذي تقل مقاومته بزيادتها."],"q":["- عرّف المقاومة الكهربائية، وما وحدة قياسها؟ وبماذا تُقاس؟","- اذكر نص قانون أوم واكتب صيغه الثلاث.","- قارن بين توصيل المقاومات على التوالي وعلى التوازي من حيث شدة التيار وفرق الجهد والمقاومة المكافئة.","- لديك مقاومتان ٢ أوم و٣ أوم؛ احسب المقاومة المكافئة على التوالي وعلى التوازي.","- ما العوامل التي تعتمد عليها مقاومة السلك؟ وماذا يحدث لها إذا تضاعف الطول؟"],"quiz":[{"l":0,"k":"n","q":"ما وحدة قياس المقاومة الكهربائية؟","o":["الواط","الأوم","الفولت","الأمبير"],"a":1},{"l":0,"k":"n","q":"أيّ العلاقات الآتية تمثّل قانون أوم؟","o":["م = جـ ÷ ت","م = جـ × ت","م = ت ÷ جـ","م = جـ + ت"],"a":0},{"l":0,"k":"n","q":"أيّ الأجهزة يقيس المقاومة مباشرة؟","o":["الأميتر","الفولتميتر","الجلفانوميتر","الأوميتر"],"a":3},{"l":0,"k":"n","q":"عند توصيل المقاومات على التوالي تكون:","o":["فروق الجهد متساوية على كل مقاومة","شدة التيار تتجمع من التفرعات","شدة التيار متساوية في كل مقاومة","المقاومة المكافئة أصغر من أصغر مقاومة"],"a":2},{"l":0,"k":"n","q":"عند توصيل المقاومات على التوازي يكون:","o":["التيار نفسه في كل فرع دائماً","فرق الجهد واحداً على كل مقاومة","فرق الجهد الكلي مجموع فروق الأجهزة","للتيار مسار واحد فقط"],"a":1},{"l":0,"k":"n","q":"أيٌّ ممّا يلي لا يؤثر في مقاومة السلك؟","o":["لون الغلاف العازل","طول السلك","مساحة مقطعه","نوع مادته"],"a":0},{"l":0,"k":"n","q":"ما الرمز الذي يُستعمل للمقاومية (المقاومة النوعية)؟","o":["Ω","ت","ق","ρ"],"a":3},{"l":0,"k":"n","q":"المقاومية تساوي معكوس:","o":["فرق الجهد","شدة التيار","الموصلية","القدرة"],"a":2},{"l":1,"k":"p","q":"فرق جهد ١٢ فولت على مقاومة، والتيار ٣ أمبير. ما قيمة المقاومة؟","o":["٣٦ أوم","٤ أوم","٠٫٢٥ أوم","١٥ أوم"],"a":1},{"l":1,"k":"p","q":"مقاومة ١٠ أوم يسري فيها تيار ٢ أمبير. ما فرق الجهد بين طرفيها؟","o":["٢٠ فولتاً","٥ فولت","١٢ فولتاً","٠٫٢ فولت"],"a":0},{"l":1,"k":"p","q":"وُصل فرق جهد ٢٤ فولت بمقاومة ٨ أوم. ما شدة التيار؟","o":["١٩٢ أمبيراً","١٦ أمبيراً","٠٫٣٣ أمبير","٣ أمبير"],"a":3},{"l":1,"k":"p","q":"مقاومتان ٤ أوم و٦ أوم على التوالي. ما المقاومة المكافئة؟","o":["٢٫٤ أوم","٢٤ أوماً","١٠ أوم","٥ أوم"],"a":2},{"l":1,"k":"p","q":"مقاومتان متساويتان ٦ أوم على التوازي. ما المقاومة المكافئة؟","o":["١٢ أوماً","٣ أوم","٦ أوم","٣٦ أوماً"],"a":1},{"l":1,"k":"p","q":"بطارية ١٠ فولت وُصلت بمقاومتين ٢ أوم و٣ أوم على التوالي. ما شدة التيار؟","o":["٢ أمبير","٥٠ أمبيراً","١٠ أمبير","٥ أمبير"],"a":0},{"l":1,"k":"p","q":"تفرّع تيار كلي إلى فرعين متوازيين: ١٫٥ أمبير و٢٫٥ أمبير. ما التيار الكلي؟","o":["١ أمبير","٣٫٧٥ أمبير","٠٫٦ أمبير","٤ أمبير"],"a":3},{"l":1,"k":"p","q":"إذا تضاعف طول سلك مع بقاء مساحة مقطعه ومادته، فإن مقاومته:","o":["تنقص إلى النصف","لا تتغير","تتضاعف","تصبح أربعة أمثال"],"a":2},{"l":2,"k":"p","q":"مقاومتان ١٢ أوم و٤ أوم على التوازي. ما المقاومة المكافئة؟","o":["١٦ أوماً","٣ أوم","٨ أوم","٠٫٣٣ أوم"],"a":1},{"l":2,"k":"p","q":"مقاومتان ٥٠ أوم و١٠٠ أوم على التوازي ثم وُصلتا على التوالي مع ٨٠ أوم. ما المقاومة المكافئة الكلية تقريباً؟","o":["١١٣٫٣ أوم","٢٣٠ أوماً","٣٣٫٣ أوم","١٦٣٫٣ أوم"],"a":0},{"l":2,"k":"p","q":"مقاومة ٣ أوم موصولة على التوالي مع مقاومتين ٦ أوم و٣ أوم موصولتين على التوازي. ما المقاومة المكافئة؟","o":["١٢ أوماً","٩ أوم","٣٫٥ أوم","٥ أوم"],"a":3},{"l":2,"k":"p","q":"سلكان من المادة نفسها وطولهما واحد، ومقاومة (أ) أربعة أمثال مقاومة (ب). كم مرة يزيد قطر (ب) على قطر (أ)؟","o":["٤ مرات","نصف مرة","مرتين","١٦ مرة"],"a":2},{"l":2,"k":"p","q":"سخّان مقاومته ١٧٫٦ أوم وُصل بفرق جهد ١٢٠ فولت (كما في كندا). ما شدة التيار تقريباً؟","o":["١٢٫٥ أمبير","٦٫٨ أمبير","٢١١٢ أمبيراً","٠٫١٥ أمبير"],"a":1},{"l":2,"k":"p","q":"سلك نحاسي طوله ٢٠٠ سم ومساحة مقطعه ١ سم²، ومقاوميته ١٫٦٨ × ١٠⁻⁶ أوم.سم. ما مقاومته؟","o":["٣٫٣٦ × ١٠⁻⁴ أوم","٣٫٣٦ × ١٠⁻⁶ أوم","١٫٦٨ × ١٠⁻⁶ أوم","٨٫٤ × ١٠⁻⁹ أوم"],"a":0},{"l":2,"k":"p","q":"من رسم بياني لمصباح مقاومته ٢ أوم: ما شدة التيار عندما يكون فرق الجهد بين طرفيه ٩ فولت؟","o":["١٨ أمبيراً","٧ أمبير","٠٫٢٢ أمبير","٤٫٥ أمبير"],"a":3},{"l":2,"k":"p","q":"في سلسلة مصابيح موصولة على التوالي احترق أحدها، ماذا يحدث للباقي ولماذا؟","o":["تبقى مضيئة لأن لكل منها مساراً خاصاً","تزداد إضاءتها لأن المقاومة قلّت","تنطفئ لأن الدارة صارت مفتوحة بمسار واحد","تنطفئ لأن فرق الجهد زاد"],"a":2}],"hints":{"عند توصيل المقاومات على التوالي تكون:":"على التوالي للتيار مسار واحد فقط؛ فهل يتغير التيار من مقاومة إلى أخرى؟","فرق جهد ١٢ فولت على مقاومة، والتيار ٣ أمبير. ما قيمة المقاومة؟":"استعمل م = جـ ÷ ت وعوّض مباشرة.","مقاومتان ١٢ أوم و٤ أوم على التوازي. ما المقاومة المكافئة؟":"على التوازي: ١/مك = ١/م₁ + ١/م₂؛ وحّد المقامات قبل أن تقلب الناتج.","مقاومتان ٥٠ أوم و١٠٠ أوم على التوازي ثم وُصلتا على التوالي مع ٨٠ أوم. ما المقاومة المكافئة الكلية تقريباً؟":"احسب أولاً المكافئة للتوازي (٣٣٫٣) ثم أضف ٨٠ لأنها على التوالي معها.","سلكان من المادة نفسها وطولهما واحد، ومقاومة (أ) أربعة أمثال مقاومة (ب). كم مرة يزيد قطر (ب) على قطر (أ)؟":"المقاومة تتناسب عكسياً مع مساحة المقطع، والمساحة تتناسب مع مربع القطر.","مقاومتان ٤ أوم و٦ أوم على التوالي. ما المقاومة المكافئة؟":"على التوالي تُجمع المقاومات جمعاً مباشراً.","سلك نحاسي طوله ٢٠٠ سم ومساحة مقطعه ١ سم²، ومقاوميته ١٫٦٨ × ١٠⁻⁶ أوم.سم. ما مقاومته؟":"م = ρ × ل ÷ س؛ انتبه أن الطول بالسنتيمتر."}},{"t":"الأعمدة الكهربائية والقوة الدافعة الكهربائية","e":["# الأعمدة الكهربائية (البطاريات)","جهاز تنظيم ضربات القلب (Pacemaker) يُزرع تحت الجلد ويعطي كمية قليلة من التيار في فترات منتظمة ليحافظ على نبض القلب، وكهرباؤه تأتي من خلية إلكتروكيميائية نتيجة تفاعلات كيميائية بين موادّها. والأعمدة الكهربائية (البطاريات) تحتوي مواد كيميائية تُنتج طاقة تُسيّر تياراً كهربائياً، وتُستخدم في مجالات كثيرة.","- جلفاني: لاحظ انتفاض عضلات أرجل ضفدع ميت حين لامست قضيبين فلزيين مختلفين، فظنّ أن في الحيوانات كهرباء تتولّد في الدماغ وتنتقل عبر الأعصاب وتُخزَّن في العضلات.","- فولتا: اعتقد أن الكهرباء تأتي من مكان آخر وأن للمعادن علاقة بذلك، فصمّم أول مصدر لفرق جهد كهربائي هو «خلية فولتا» أو العمود البسيط، ثم طُوّرت أعمدة أولية وثانوية.","# الأعمدة الجافة (الأولية)","تتكوّن البطارية من مجموعة خلايا. وفي كل خلية مكوّنان أساسيان هما القطبان، وكل قطب من مادة كيميائية مختلفة، وبينهما مادة كهرلية (إلكتروليت) فيها أيونات حرة تشكّل وسطاً ناقلاً للكهرباء.","- القطب المشحون بشحنة سالبة يسمى المصعد (الأنود)، والقطب المشحون بشحنة موجبة يسمى المهبط (الكاثود).","- التفاعلات الكيميائية في المادة الكهرلية (من نوع التأكسد والاختزال) تولّد فرق جهد وطاقة تولّد تياراً كهربائياً. فالخلية أداة بسيطة تحوّل الطاقة الكيميائية إلى طاقة كهربائية، وإذا توقفت التفاعلات الكيميائية فيها توقّف التيار.","- التأكسد: فقد الذرة للإلكترونات. الاختزال: اكتساب الذرة للإلكترونات.","- شدة التيار في الأعمدة الأولية صغيرة نسبياً فلا تناسب الأجهزة التي تحتاج تياراً كبيراً، وجزء كبير منها غير قابل للشحن مرة أخرى، ولذلك طُوّرت الأعمدة الثانوية.","# الأعمدة الثانوية (المراكم)","تشترك مع الأولية في الأجزاء الرئيسة، ومنها المركم الرصاصي:","- القطب السالب (المصعد): مجموعة ألواح من الرصاص.","- القطب الموجب (المهبط): مجموعة ألواح من ثاني أكسيد الرصاص.","- المادة الكهرلية: محلول حمض الكبريتيك.","تعتمد الخلايا الثانوية مبدأ عمل الأولية نفسه في إنتاج الطاقة الكهربائية، لكنها تتميّز بإمكانية إعادة شحنها وتوليد تيار أكبر.","# القوة الدافعة الكهربائية والمقاومة الداخلية","التفاعلات الكيميائية داخل العمود تولّد فرق جهد بين طرفيه يسمى القوة الدافعة الكهربائية (قد) وتُقاس بالفولت. ولكل عمود مقاومة داخلية (مد) تمثَّل في الدارة، وقد يُوصَل العمود بمقاومة خارجية (مخ).","تكون القوة الدافعة الكهربائية هي فرق الجهد بين قطبي العمود في حالة عدم مرور تيار (الدارة مفتوحة).","في دارة تحتوي عموداً ومقاومة خارجية: المقاومة المكافئة = مد + مخ (موصولتان على التوالي)، والتيار نفسه يمرّ فيهما. وفرق الجهد الكلي يساوي مجموع فرقي الجهد على المقاومتين الداخلية والخارجية: جـ الكلي = جـ(مد) + جـ(مخ).","وحسب قانون أوم: قد = ت × مد + ت × مخ = ت (مد + مخ).","أي أن: قد = ت × مد + جـ، حيث جـ فرق الجهد بين طرفي المقاومة الخارجية (وهو فرق جهد طرفي العمود عند مرور التيار)، فيكون جـ = قد − ت × مد.","- عندما تكون المقاومة الداخلية أصغر بكثير من الخارجية يكون فرق الجهد بين قطبي العمود قريباً جداً من القوة الدافعة.","! المصدر المثالي: مصدر ليس له مقاومة داخلية (مد = صفر)، وعندها جـ = قد.","مثال محلول: دارة فيها مصباحان متشابهان على التوالي، التيار ٢ أمبير، قد = ١٨ فولت، مد = ١ أوم. قد = ت (مد + مخ) ⇒ ١٨ = ٢ (١ + مخ) ⇒ ٩ = ١ + مخ ⇒ مخ = ٨ أوم. وبما أن المصباحين على التوالي: مخ = م + م = ٢م = ٨ فتكون مقاومة كل مصباح ٤ أوم.","سؤال الكتاب: عمود قوته الدافعة ٦ فولت، وقياسات (ت بالأمبير، جـ بالفولت): (٠٫٥، ٥)، (١، ٤)، (١٫٥، ٣)، (٢، ٢). تكون قيمة (قد − جـ) = ١، ٢، ٣، ٤ على التوالي. برسم (قد − جـ) على المحور الصادي وت على السيني نحصل على خط مستقيم ميله = ١ ÷ ٠٫٥ = ٢ أوم، وهو يمثّل المقاومة الداخلية مد. وعند ت = صفر (دارة مفتوحة) يكون جـ = قد = ٦ فولت. والمقاومة الخارجية ليست ثابتة، فهي تتغير في كل قياس (تساوي جـ ÷ ت)."],"q":["- قارن بين الأعمدة الأولية والثانوية من حيث: التركيب، وإمكانية إعادة الشحن، وتحولات الطاقة، وشدة التيار، وسهولة الاستخدام.","- ما أجزاء الخلية الكهربائية؟ وما اسم كل قطب؟ وما وظيفة المادة الكهرلية؟","- ما القوة الدافعة الكهربائية؟ وكيف تختلف عن فرق الجهد بين قطبي العمود عند مرور التيار؟","- اشتقّ العلاقة بين القوة الدافعة والتيار والمقاومتين الداخلية والخارجية.","- ماذا يمثّل ميل الخط الناتج من رسم (قد − جـ) مقابل ت؟"],"quiz":[{"l":0,"k":"n","q":"من العالم الذي صمّم أول مصدر لفرق جهد كهربائي (العمود البسيط)؟","o":["جلفاني","فولتا","أوم","أمبير"],"a":1},{"l":0,"k":"n","q":"ماذا لاحظ جلفاني في تجاربه؟","o":["انتفاض عضلات أرجل ضفدع ميت عند ملامسة قضيبين فلزيين","اشتعال مصباح عند ملامسة سلك","تسخّن الماء بالتيار","توهّج سلك النحاس"],"a":0},{"l":0,"k":"n","q":"الخلية الكهربائية تحوّل:","o":["الطاقة الكهربائية إلى كيميائية فقط","الطاقة الحرارية إلى ضوئية","الطاقة الصوتية إلى كهربائية","الطاقة ال وم","١٧ أوماً","٣٦ أوماً"],"a":1},{"l":2,"k":"p","q":"في المثال السابق مصباحان متماثلان على التوالي، فما مقاومة كلٍّ منهما؟","o":["٤ أوم","٨ أوم","٢ أوم","١٦ أوماً"],"a":0},{"l":2,"k":"p","q":"عمود قوته الدافعة ١٢ فولت ومقاومته الداخلية ٢ أوم، وُصل بمقاومة خارجية ٤ أوم. ما شدة التيار؟","o":["٣ أمبير","٦ أمبير","١٫٥ أمبير","٢ أمبير"],"a":3},{"l":2,"k":"p","q":"عمود قوته الدافعة ١٢ فولت ومقاومته الداخلية ٠٫٥ أوم يمرّ فيه تيار ٢ أمبير. ما فرق الجهد بين طرفيه؟","o":["١٢ فولتاً","١٣ فولتاً","١١ فولتاً","١ فولت"],"a":2},{"l":2,"k":"p","q":"عمود قوته الدافعة ٦ فولت، قرأنا فرق جهد ٣ فولت عند تيار ١٫٥ أمبير. ما مقاومته الداخلية؟","o":["٤٫٥ أوم","٢ أوم","٠٫٥ أوم","٩ أوم"],"a":1},{"l":2,"k":"p","q":"عمود قوته الدافعة ١٠ فولت ومقاومته الداخلية ١ أوم وصل بمقاومة خارجية ٤ أوم. ما فرق الجهد على المقاومة الخارجية؟","o":["٨ فولت","١٠ فولت","٢ فولت","٤٠ فولتاً"],"a":0},{"l":2,"k":"p","q":"في تجربة (ت، جـ): (٠٫٥، ٥) و(١، ٤) و(١٫٥، ٣) و(٢، ٢) لعمود قوته الدافعة ٦ فولت. ماذا يمثل ميل خط (قد − جـ) مقابل ت؟","o":["القوة الدافعة (٦ فولت)","المقاومة الخارجية الثابتة","شدة التيار الأعظم","المقاومة الداخلية (٢ أوم)"],"a":3},{"l":2,"k":"p","q":"إذا كانت المقاومة الداخلية لعمود أصغر بكثير من المقاومة الخارجية، فماذا تتوقع؟","o":["فرق الجهد قريب من صفر","التيار يساوي صفراً","فرق الجهد بين قطبيه قريب من قد","القوة الدافعة تساوي صفراً"],"a":2}],"hints":{"ما اسم القطب السالب في الخلية؟":"الأنود هو القطب المشحون بشحنة سالبة.","قد = ١٨ فولت، مد = ١ أوم، وكان التيار ٢ أمبير. ما قيمة المقاومة الخارجية؟":"استعمل قد = ت (مد + مخ) ثم اعزل مخ.","في المثال السابق مصباحان متماثلان على التوالي، فما مقاومة كلٍّ منهما؟":"المصباحان متماثلان على التوالي: المقاومة الخارجية مجموع مقاومتيهما.","عمود قوته الدافعة ١٢ فولت ومقاومته الداخلية ٢ أوم، وُصل بمقاومة خارجية ٤ أوم. ما شدة التيار؟":"ت = قد ÷ (مد + مخ)، أي ١٢ ÷ (٢ + ٤).","عمود قوته الدافعة ١٢ فولت ومقاومته الداخلية ٠٫٥ أوم يمرّ فيه تيار ٢ أمبير. ما فرق الجهد بين طرفيه؟":"جـ = قد − ت × مد.","إذا كانت المقاومة الداخلية لعمود أصغر بكثير من المقاومة الخارجية، فماذا تتوقع؟":"إذا كانت مد صغيرة جداً فإن الحد (ت × مد) يكاد يهمل في جـ = قد − ت × مد.","لماذا لا تناسب الأعمدة الجافة الأولية الأجهزة التي تحتاج تياراً كبيراً؟":"فكّر في التيار الصغير والقابلية لإعادة الشحن."}},{"t":"القدرة والطاقة الكهربائية","e":["# الطاقة والكهرباء","العمل يحتاج إلى طاقة، فهي المقدرة على إنجاز عمل، ولها أشكال متعددة. وتعمل الأجهزة الكهربائية على مبدأ حفظ الطاقة: الطاقة لا تفنى ولا تُستحدث وإنما تتحول من شكل إلى آخر، فتحوّل الأجهزة الطاقة الكهربائية إلى أشكال أخرى حسب تصميمها (ضوئية، حرارية، صوتية، ميكانيكية).","وتكتب الشركة المصنّعة مواصفات الجهاز ليختار المستهلك الأنسب؛ وكفاءة الجهاز تعتمد على قدرته على تحويل الطاقة الكهربائية في فترة زمنية محددة إلى أيّ شكل من أشكال الطاقة.","# العلاقة بين الطاقة الكهربائية والطاقة الحرارية (قانون جول)","مرور التيار في سلك مقاومته كبيرة يولّد فيه حرارة بسبب اصطدام الإلكترونات بذرات الموصل مما يولّد احتكاكاً. وأثبت العالم جول أن الطاقة الحرارية تتناسب طردياً مع مقاومة الموصل ومع مربع شدة التيار ومع زمن مرور التيار:","ط = م × ت² × ز","وبما أن جـ = ت × م فإن ط = جـ × ت × ز، وتساوي الطاقة الكهربائية المتحولة الطاقة الحرارية الناتجة: ط = جـ × ت × ز، حيث جـ فرق الجهد بالفولت وت التيار بالأمبير وز الزمن بالثواني.","تُقاس الطاقة بالجول (J) تكريماً للعالم جول، وتُقاس أيضاً بالسعر (١ سعر = ٤٫١٨ جول).","مثال محلول: سلك سخّان مقاومته ٢٢٠ أوم يعمل ١٥ دقيقة على ٢٢٠ فولت. ت = جـ ÷ م = ١ أمبير. الطاقة = جـ² × ز ÷ م = (٢٢٠ × ٢٢٠ × ١٥ × ٦٠) ÷ ٢٢٠ = ١٩٨٠٠٠ جول = ١٩٨ كيلوجول ≈ ٤٧٣٦٨ سعراً.","# القدرة الكهربائية","إذا قال البائع إن قدرة المدفأة ٢٠٠٠ واط فهي تحوّل ٢٠٠٠ جول من الطاقة الكهربائية كل ثانية إلى طاقة حرارية. فالقدرة هي المعدل الزمني للطاقة (مقدار الطاقة المتحولة في وحدة الزمن)، وتُقاس بالواط (W) تكريماً لجيمس واط. والواط هو قدرة جهاز تتحول فيه الطاقة الكهربائية بمعدل ١ جول في الثانية (١ واط = ١ جول/ثانية).","- القدرة (ق) = الطاقة ÷ الزمن = جـ × ت × ز ÷ ز، أي: ق = جـ × ت.","- باستعمال قانون أوم: ق = ت² × م، و ق = جـ² ÷ م.","نشاط ٢: مصباحان (١٢ فولت – ٢ واط) و(١٢ فولت – ٤ واط) على فرق جهد ٣ ثم ٦ فولت، ونحسب جـ × ت × ز ونقارن الإضاءة. المصباح ذو القدرة الأكبر يعطي إضاءة أشد ويمرّ فيه تيار أكبر وتتحول فيه طاقة أكبر في الزمن نفسه، فشدة الإضاءة ترتبط بقدرة المصباح.","مثال محلول: تلفاز مدوّن عليه (٢٥٠ فولت – ٥٠٠ واط). القدرة = جـ × ت ⇒ ٥٠٠ = ٢٥٠ × ت ⇒ ت = ٢ أمبير. المقاومة: ق = ت² × م ⇒ ٥٠٠ = ٤ × م ⇒ م = ١٢٥ أوماً. الطاقة في ١٠ دقائق = ق × ز = ٥٠٠ × (١٠ × ٦٠) = ٣٠٠٠٠٠ جول = ٣٠٠ كيلوجول.","# حساب ثمن الطاقة الكهربائية","يسجّل العدّاد الكهربائي في كل بيت أو مصنع الطاقة المستهلكة، وتُحسب شهرياً بأخذ قراءة العدّاد، ويُدفع ثمنها في فاتورة الكهرباء.","! الوحدة العملية لقياس الطاقة الكهربائية هي الكيلوواط ساعة (kWh) عند قياس القدرة بالكيلوواط والزمن بالساعة. وثمن الطاقة = الطاقة (kWh) × ثمن الكيلوواط ساعة.","مثال محلول: ترك إبراهيم مدفأة (٢٢٠ فولت – ١٠ أمبير) مشغّلة من السادسة صباحاً إلى الثانية عشرة ظهراً (٦ ساعات). القدرة = جـ × ت = ٢٢٠ × ١٠ = ٢٢٠٠ واط = ٢٫٢ كيلوواط. الطاقة المهدورة = ٢٫٢ × ٦ = ١٣٫٢ كيلوواط ساعة.","سؤال: أيّهما أفضل مصباح ٢٠ واط أم ١٣ واط؟ الأفضل غالباً ذو القدرة الأقل إذا أعطى إضاءة مناسبة لأنه يستهلك طاقة أقل ويوفّر في الفاتورة (ترشيد الاستهلاك، خاصة في ظل أزمة الكهرباء في فلسطين).","سؤال الكتاب (ميكروويف): قدرته ١١٠٠ واط على ٢٢٠ فولت ويعمل ساعة يومياً. الجهاز: ت = ق ÷ جـ = ٥ أمبير، م = جـ ÷ ت = ٤٤ أوماً. الاستهلاك الشهري = ١٫١ × ٣٠ = ٣٣ كيلوواط ساعة، ثمنه = ٣٣ × ١٠ = ٣٣٠ قرشاً.","سؤال الكتاب (حاسوب): قدرته ٢٠٠ واط لمدة ٦٠ ساعة شهرياً = ٠٫٢ × ٦٠ = ١٢ كيلوواط ساعة، فيدفع ١٢ × ١٠ = ١٢٠ قرشاً. وإذا شُغّل على ١١٠ فولت بدل ٢٢٠ فيقل التيار والقدرة لأن ق = جـ² ÷ م (تصير القدرة ربع قيمتها إذا بقيت المقاومة ثابتة).","سؤال الكتاب: سلك المصباح ١٠٠ واط أسمك من ٦٠ واط (الطول نفسه)؛ لأن القدرة الأكبر عند الجهد نفسه تعني مقاومة أقل (ق = جـ² ÷ م)، والمقاومة الأقل تعني مساحة مقطع أكبر أي قطراً أكبر. وأيضاً: جهاز يحوّل ١٢٠ كيلوجول في دقيقة قدرته = ١٢٠٠٠٠ ÷ ٦٠ = ٢٠٠٠ واط.","سؤال الكتاب (تحولات الطاقة): ماسح زجاج السيارة: كهربائية إلى ميكانيكية؛ مجفف الشعر: كهربائية إلى حرارية وميكانيكية (حركة المروحة) وصوتية؛ المكواة: كهربائية إلى حرارية."],"q":["- ما المقصود بالقدرة الكهربائية؟ وما وحدتها؟ وما معنى أن قدرة مدفأة ٢٠٠٠ واط؟","- اكتب قانون جول وبيّن دلالة كل رمز فيه.","- جهاز تحوّلت فيه طاقة ١٢٠ كيلوجول خلال دقيقة، احسب قدرته.","- ميكروويف ١١٠٠ واط على ٢٢٠ فولت يعمل ساعة يومياً: احسب مقاومته وتياره وثمن استهلاكه الشهري (١٠ قروش لكل كيلوواط ساعة).","- أيّ المصباحين سلكه أسمك: ٦٠ واط أم ١٠٠ واط (الطول نفسه)؟ ولماذا؟"],"quiz":[{"l":0,"k":"n","q":"ما وحدة قياس القدرة الكهربائية؟","o":["الجول","الواط","الأمبير","الكيلوواط ساعة"],"a":1},{"l":0,"k":"n","q":"القدرة الكهربائية تساوي:","o":["الطاقة ÷ الزمن","الطاقة × الزمن","الزمن ÷ الطاقة","التيار ÷ فرق الجهد"],"a":0},{"l":0,"k":"n","q":"أيّ العلاقات الآتية تمثل قانون جول للطاقة الحرارية؟","o":["ط = جـ ÷ ت","ط = ق ÷ ز","ط = م ÷ ت","ط = جـ × ت × ز"],"a":3},{"l":0,"k":"n","q":"ما الوحدة العملية لقياس الطاقة الكهربائية؟","o":["واط","أوم","كيلوواط ساعة","فولت"],"a":2},{"l":0,"k":"n","q":"كم جولاً في الثانية يحوّل جهاز قدرته ١ واط؟","o":["١٠ جول","جول واحد","١٠٠ جول","١٠٠٠ جول"],"a":1},{"l":0,"k":"n","q":"أيّ العلاقات الآتية تعبّر عن القدرة بدلالة فرق الجهد والتيار؟","o":["ق = جـ × ت","ق = جـ ÷ ت","ق = ت ÷ جـ","ق = جـ + ت"],"a":0},{"l":0,"k":"n","q":"ما سبب توليد الحرارة عند مرور تيار في سلك مقاومته كبيرة؟","o":["انتقال البروتونات","تبخّر السلك","تغيّر لون العازل","اصطدام الإلكترونات بذرات الموصل"],"a":3},{"l":0,"k":"n","q":"ما المبدأ الذي تعمل عليه الأجهزة الكهربائية في تحويل الطاقة؟","o":["فناء الطاقة","استحداث الطاقة","حفظ الطاقة","ثبات المقاومة"],"a":2},{"l":1,"k":"p","q":"مدفأة قدرتها ٢٠٠٠ واط. كم جولاً تحوّل في الثانية الواحدة؟","o":["٢٠٠ جول","٢٠٠٠ جول","٢٠ جولاً","٢ جول"],"a":1},{"l":1,"k":"p","q":"جهاز قدرته ١٠٠ واط يعمل ١٠ ثوانٍ. كم جولاً من الطاقة يستهلك؟","o":["١٠٠٠ جول","١٠ جول","١١٠ جول","٠٫١ جول"],"a":0},{"l":1,"k":"p","q":"جهاز يعمل على ٢٢٠ فولت ويمر فيه تيار ٢ أمبير. ما قدرته؟","o":["١١٠ واط","٢٢٢ واط","١ واط","٤٤٠ واط"],"a":3},{"l":1,"k":"p","q":"مصباح قدرته ١٠٠ واط شُغّل ١٠ ساعات. كم كيلوواط ساعة استهلك؟","o":["١٠","٠٫١","١","١٠٠"],"a":2},{"l":1,"k":"p","q":"استهلكت أسرة ٥٠ كيلوواط ساعة وثمن الكيلوواط ساعة ١٠ قروش. كم تدفع؟","o":["٦٠ قرشاً","٥٠٠ قرش","٥ قروش","٥٠ قرشاً"],"a":1},{"l":1,"k":"p","q":"مقاومة ٤ أوم يمر فيها تيار ٣ أمبير. ما قدرتها؟","o":["٣٦ واط","١٢ واط","٧ واط","١٫٣٣ واط"],"a":0},{"l":1,"k":"p","q":"فرق جهد ١٠ فولت على مقاومة ٥ أوم. ما القدرة؟","o":["٥٠ واط","٢ واط","٠٫٥ واط","٢٠ واط"],"a":3},{"l":1,"k":"p","q":"في نشاط المصباحين (٢ واط و٤ واط) على الجهد نفسه، أيهما يعطي إضاءة أشد؟","o":["مصباح ٢ واط","متساويان","مصباح ٤ واط","لا يضيء أيٌّ منهما"],"a":2},{"l":2,"k":"p","q":"تلفاز (٢٥٠ فولت – ٥٠٠ واط). ما مقاومته؟","o":["٠٫٥ أوم","١٢٥ أوماً","٢٥٠ أوماً","٢ أوم"],"a":1},{"l":2,"k":"p","q":"في التلفاز نفسه، ما الطاقة المتحولة خلال ١٠ دقائق؟","o":["٣٠٠ كيلوجول","٥ كيلوجول","٣٠٠٠ كيلوجول","٣٠ كيلوجول"],"a":0},{"l":2,"k":"p","q":"سخّان مقاومته ٢٢٠ أوم وصل بفرق جهد ٢٢٠ فولت مدة ١٥ دقيقة. ما الطاقة الحرارية المتحولة؟","o":["٣٫٣ كيلوجول","١٩٨ جول","١١ كيلوجول","١٩٨ كيلوجول"],"a":3},{"l":2,"k":"p","q":"مدفأة (٢٢٠ فولت – ١٠ أمبير) تُركت مشغّلة ٦ ساعات. كم كيلوواط ساعة هُدرت؟","o":["٢٫٢","١٣٢٠","١٣٫٢","٢٢"],"a":2},{"l":2,"k":"p","q":"ميكروويف قدرته ١١٠٠ واط على ٢٢٠ فولت. ما شدة التيار ومقاومته؟","o":["٠٫٢ أمبير و١١٠٠ أوم","٥ أمبير و٤٤ أوماً","٥ أمبير و٢٢٠ أوماً","٢٤٢ أمبيراً و٤٤ أوماً"],"a":1},{"l":2,"k":"p","q":"كم تدفع مقابل تشغيل حاسوب ٢٠٠ واط مدة ٦٠ ساعة شهرياً إذا كان ثمن الكيلوواط ساعة ١٠ قروش؟","o":["١٢٠ قرشاً","١٢ قرشاً","١٢٠٠ قرش","٢٠ قرشاً"],"a":0},{"l":2,"k":"p","q":"جهاز كهربائي تحوّل فيه ١٢٠ كيلوجول خلال دقيقة. ما قدرته؟","o":["١٢٠ واط","٧٢٠٠ واط","٢ واط","٢٠٠٠ واط"],"a":3},{"l":2,"k":"p","q":"مصباحان لهما الطول نفسه والجهد نفسه، قدرة أحدهما ٦٠ واط والآخر ١٠٠ واط. أيّهما سلكه أسمك؟","o":["مصباح ٦٠ واط لأن مقاومته أقل","متساويان لأن الطول نفسه","مصباح ١٠٠ واط لأن مقاومته أقل","لا يمكن المقارنة"],"a":2}],"hints":{"القدرة الكهربائية تساوي:":"القدرة تعبّر عن معدل تحوّل الطاقة، أي الطاقة لكل وحدة زمن.","تلفاز (٢٥٠ فولت – ٥٠٠ واط). ما مقاومته؟":"من ق = ت² × م ومن ق = جـ × ت: أوجد ت أولاً ثم م.","في التلفاز نفسه، ما الطاقة المتحولة خلال ١٠ دقائق؟":"الطاقة = القدرة × الزمن، والزمن بالثواني.","مدفأة (٢٢٠ فولت – ١٠ أمبير) تُركت مشغّلة ٦ ساعات. كم كيلوواط ساعة هُدرت؟":"القدرة = جـ × ت، ثم اضرب بالساعات وحوّل الواط إلى كيلوواط.","مصباحان لهما الطول نفسه والجهد نفسه، قدرة أحدهما ٦٠ واط والآخر ١٠٠ واط. أيّهما سلكه أسمك؟":"القدرة الأكبر عند الجهد نفسه تعني مقاومة أقل، والمقاومة الأقل تعني مقطعاً أكبر.","مدفأة قدرتها ٢٠٠٠ واط. كم جولاً تحوّل في الثانية الواحدة؟":"واط واحد = جول في الثانية؛ اضرب بعدد الثواني.","مقاومة ٤ أوم يمر فيها تيار ٣ أمبير. ما قدرتها؟":"استعمل ق = ت² × م.","كم تدفع مقابل تشغيل حاسوب ٢٠٠ واط مدة ٦٠ ساعة شهرياً إذا كان ثمن الكيلوواط ساعة ١٠ قروش؟":"الطاقة بالكيلوواط ساعة = ق (كيلوواط) × الساعات، ثم اضرب في الثمن."}}]},{"title":"العناصر والتفاعلات الكيميائية في حياتنا","ic":"mol","color":"#cfe2b0","uq":[],"lessons":[{"t":"الجدول الدوري الحديث","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}},{"t":"الروابط الكيميائية وتمثيل لويس","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}},{"t":"أنواع التفاعلات الكيميائية","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}},{"t":"مفهوم التأكسد والاختزال","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}}]},{"title":"الضوء والحياة","ic":"wave","color":"#cfe2b0","uq":[],"lessons":[{"t":"خصائص الضوء","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}},{"t":"انكسار الضوء","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}},{"t":"المرايا","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}},{"t":"انعكاس الضوء وتطبيقاته","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}}]},{"title":"النبات الزهري","ic":"plant","color":"#cfe2b0","uq":[],"lessons":[{"t":"أنسجة النبات الزهري","e":["# قريباً","سيُضاف شرح هذا الدرس وأنشطته بإذن الله."],"q":[],"quiz":[],"hints":{}},{"t":"أجزاء النبات الزهري","e":  if(t.d==t.t&&t.t){if(!S.cert)S.cert=Date.now();c.push({t:"إتمام مادة "+CFG.name+" — "+(CFG.gradeName||"الصف الثامن"),d:new Date(S.cert).toLocaleDateString("ar")})}
 localStorage.setItem("sahaba-ach:"+CFG.dir,JSON.stringify({pct:t.t?Math.round(t.d*100/t.t):0,units:{done:t.u,total:D.units.length},certs:c,badges:b,extra:["⭐ "+ar(S.xp)+" نقطة • المستوى "+ar(level()),"🔥 أيام متتالية: "+ar(streak())],updated:new Date().toISOString()}))}catch(e){}}
