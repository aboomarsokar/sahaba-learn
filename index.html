<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة الصحابة التعليمية</title>
<meta name="description" content="بوابتك نحو العلم والمعرفة والتميّز: دروس تفاعلية وأنشطة واختبارات لطلاب مدارس الصحابة.">
<meta name="theme-color" content="#123C46">
<style>
@font-face{font-family:"Plex Arabic";src:url("shared/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url("shared/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Aref Ruqaa";src:url("shared/fonts/aref-ruqaa-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--bg:#123C46;--card:#1B5563;--soft:#1F5F6D;--ink:#F4F8F9;--muted:#B7D0D6;--line:#2D6F7E;--gold:#E6B94D;--gold2:#F0D9A8;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#123C46;color:var(--ink)}
body{font-family:"Plex Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.scr{min-height:100dvh}
/* ---------- شاشة البداية ---------- */
#splash{position:fixed;inset:0;z-index:30;background:#123C46;display:flex;justify-content:center;align-items:center;cursor:pointer;overflow:hidden}
.spb{position:relative;width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;font-size:calc(min(100vw,100dvh*9/16)/100)}
.spb img{display:block;width:100%;height:100%;-webkit-user-drag:none;user-select:none}
.spr{position:absolute;left:50%;top:39.85%;width:49%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:.8em solid transparent;background:linear-gradient(135deg,#F6DE9A,#C99A2E 45%,#F3D27A 60%,#A87A1E) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
.spr:before{content:"";position:absolute;inset:-2.4em;border-radius:50%;border:.28em solid #E6B94D;opacity:.7}
.bsm{position:absolute;left:0;right:0;top:11.2%;display:flex;align-items:center;justify-content:center;gap:2em;pointer-events:none;direction:rtl}
.bsm span{font-family:"Aref Ruqaa","Plex Arabic",serif;font-weight:700;font-size:8.2em;line-height:1.5;background:linear-gradient(180deg,#FFF1BE 0%,#F1CF73 45%,#C99A2E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 .12em .12em rgba(0,0,0,.45));white-space:nowrap}
.bsm i{flex:none;width:5em;height:.35em;border-radius:1em;background:linear-gradient(90deg,transparent,#E6B94D)}
.bsm i:last-child{background:linear-gradient(270deg,transparent,#E6B94D)}
/* ---------- رأس الصفحة ---------- */
.hd{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 10px;background:linear-gradient(#123C46 70%,rgba(18,60,70,0))}
.hd h1{margin:0;font-size:1.1rem;font-weight:700;text-align:center;flex:1}
.ic{width:44px;height:44px;flex:none;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ic svg{width:22px;height:22px}
.ic.g{visibility:hidden}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
.hi{text-align:center;font-weight:700;margin:2px 0 14px}
/* ---------- الاسم ---------- */
.fm{max-width:460px;margin:8px auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px}
.fm h2{margin:0 0 12px;text-align:center;font-size:1.5rem}
.fm input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:13px 14px;margin:6px 0;border-radius:14px;border:1.5px solid var(--line);background:#143F4A;color:var(--ink);outline:none}
.fm input[type=text]:focus{border-color:var(--gold)}
.av{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:10px;cursor:pointer;color:var(--muted);font-size:.9rem}
.av .circ{width:92px;height:92px;border-radius:50%;border:2px solid var(--gold);background:#143F4A;display:grid;place-items:center;overflow:hidden;font-size:2rem}
.av img{width:100%;height:100%;object-fit:cover}
.btn{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:1.05rem;background:linear-gradient(180deg,#F6DE9A,#E6B94D);color:#123C46;cursor:pointer}
.er{color:#ffb4a8;min-height:1.4em;font-size:.9rem;text-align:center}
/* ---------- لافتات ---------- */
.rects{display:grid;gap:12px}
@media (min-width:760px){.rects{grid-template-columns:1fr 1fr}.rects .odd{grid-column:1/-1;max-width:50%;justify-self:center}}
.rect{display:block;width:100%;padding:0;border:2px solid #ffd98a;border-radius:16px;overflow:hidden;background:none;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.28);transition:transform .15s}
.rect:active{transform:scale(.985)}
.rect img{display:block;width:100%;height:auto}
/* ---------- الغلاف ---------- */
#cover{position:fixed;inset:0;z-index:40;background:#000;display:flex;justify-content:center;align-items:center;cursor:pointer}
#cover img{max-width:100%;max-height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
/* ---------- القائمة ---------- */
#veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;right:0;z-index:51;width:min(86vw,340px);background:#1B5563;border-left:1px solid var(--line);padding:max(16px,env(safe-area-inset-top)) 14px 20px;transform:translateX(105%);transition:transform .22s;overflow:auto}
#drawer.on{transform:none}
#drawer h2{margin:6px 6px 12px;font-size:1.15rem}
.mi{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;border:1px solid var(--line);border-radius:16px;background:#164A56;cursor:pointer;width:100%;text-align:start}
.mi .ic3{width:46px;height:46px;border-radius:14px;background:#123C46;display:grid;place-items:center;font-size:22px;flex:none}
.mi b{display:block;font-size:1.02rem}.mi small{display:block;color:var(--muted);font-size:.8rem}
/* ---------- نافذة ---------- */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.box{width:100%;max-width:560px;max-height:86dvh;overflow:auto;background:#1B5563;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 18px 24px}
@media (min-width:760px){#sheet{align-items:center}.box{border-radius:22px}}
.box .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.box .t b{font-size:1.15rem}.box .x{cursor:pointer;font-size:1.3rem;padding:4px 10px}
.row{margin:12px 0}.row .l{display:flex;justify-content:space-between;font-weight:700;margin-bottom:5px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}.bar i{display:block;height:100%;background:#2fa37f}
.note{background:#164A56;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}.bd div{text-align:center;font-size:.72rem;line-height:1.4}.bd img{width:100%;height:auto;border-radius:12px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#0b2a31;border:1px solid var(--gold);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700}
.sm{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>

<div id="splash" role="button" aria-label="ابدأ الآن" hidden>
  <div class="spb"><img alt="بوابة الصحابة التعليمية" src="shared/img/splash.webp"><div class="spr"></div><div class="bsm"><i></i><span>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span><i></i></div></div>
</div>

<main id="app" class="scr"></main>
<div id="cover" role="button" aria-label="فتح المادة" hidden></div>
<div id="veil"></div>
<aside id="drawer" aria-label="قائمة البوابة"></aside>
<div id="sheet" hidden></div>

<script>
var SW_KEY = "sahaba-user", GRADE_KEY = "sahaba-learn-grade", PROG_KEY = "sahaba-progress";
var data = null, user = null, view = "splash", curGrade = null;
var HOUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg>';
var MENU = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
var FULL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function toast(m) { var t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }
function readUser() { try { var u = JSON.parse(lsGet(SW_KEY) || "null"); return u && u.first && u.father && u.family ? u : null; } catch (e) { return null; } }
function progress() { try { return JSON.parse(lsGet(PROG_KEY) || "{}") || {}; } catch (e) { return {}; } }
function subject(id) { return data.subjects.filter(function (s) { return s.id === id; })[0]; }
function grade(id) { return data.grades.filter(function (g) { return g.id === id; })[0]; }

/* ---------- الشاشات ---------- */
function header(title, left) {
  return '<div class="hd"><button class="ic" id="bMenu" aria-label="القائمة">' + MENU + '</button><h1>' + esc(title) + '</h1>' +
    (left || '<button class="ic" id="bFull" aria-label="ملء الشاشة">' + FULL + '</button>') + '</div>';
}
function bindHeader() {
  var m = $("bMenu"); if (m) m.onclick = openMenu;
  var f = $("bFull"); if (f) f.onclick = function () { var d = document.documentElement; try { if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen(); else toast("أضف التطبيق إلى الشاشة الرئيسية لملء الشاشة الكامل"); } catch (e) {} };
}
function show(name) {
  view = name; $("splash").hidden = name !== "splash";
  var a = $("app"); a.hidden = name === "splash";
  if (name === "name") drawName(); else if (name === "grades") drawGrades(); else if (name === "subjects") drawSubjects();
  window.scrollTo(0, 0);
}
function drawName() {
  var u = user || {}, img = u.avatar ? '<img alt="" src="' + esc(u.avatar) + '">' : '👤';
  $("app").innerHTML = header("بوابة الصحابة التعليمية", '<button class="ic g" aria-hidden="true"></button>') +
    '<div class="wrap"><div class="fm"><h2>ما اسمك؟</h2>' +
    '<label class="av"><span class="circ" id="avc">' + img + '</span><span>الصورة الشخصية (اختيارية)</span><input type="file" id="avf" accept="image/*" hidden></label>' +
    '<input type="text" id="n1" placeholder="الاسم الأول" autocomplete="given-name" value="' + esc(u.first || "") + '">' +
    '<input type="text" id="n2" placeholder="اسم الوالد" value="' + esc(u.father || "") + '">' +
    '<input type="text" id="n3" placeholder="اسم العائلة" autocomplete="family-name" value="' + esc(u.family || "") + '">' +
    '<div class="er" id="er"></div><button class="btn" id="bNext">التالي ›</button></div></div>';
  bindHeader();
  var avatar = u.avatar || "";
  $("avf").onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = 192, c = document.createElement("canvas"); c.width = c.height = s;
        var k = Math.max(s / im.width, s / im.height), w = im.width * k, h = im.height * k;
        c.getContext("2d").drawImage(im, (s - w) / 2, (s - h) / 2, w, h);
        avatar = c.toDataURL("image/jpeg", .8); $("avc").innerHTML = '<img alt="" src="' + avatar + '">';
      };
      im.onerror = function () { toast("صيغة الصورة غير مدعومة"); };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  };
  $("bNext").onclick = function () {
    var a = [$("n1").value, $("n2").value, $("n3").value].map(function (x) { return x.replace(/\s+/g, " ").trim(); });
    if (!a[0] || !a[1] || !a[2]) { $("er").textContent = "اكتب الاسم الأول واسم الوالد واسم العائلة"; return; }
    user = { first: a[0], father: a[1], family: a[2], avatar: avatar };
    lsSet(SW_KEY, JSON.stringify(user));
    show("grades");
  };
}
function drawGrades() {
  $("app").innerHTML = header("اختر صفّك الدراسي") + '<div class="wrap"><p class="hi">مرحباً ' + esc(user.first) + ' ⭐</p><div class="rects">' +
    data.grades.map(function (g, i) { return '<button class="rect' + (i === data.grades.length - 1 && data.grades.length % 2 ? ' odd' : '') + '" data-g="' + esc(g.id) + '" aria-label="' + esc(g.name) + '"><img alt="' + esc(g.name) + '" src="' + esc(g.img) + '"></button>'; }).join("") + '</div></div>';
  bindHeader();
  document.querySelectorAll(".rect").forEach(function (b) { b.onclick = function () { curGrade = b.dataset.g; lsSet(GRADE_KEY, curGrade); show("subjects"); }; });
}
function bannerOf(s, g) { var b = s.banner || {}; return b[g] || b["default"]; }
function drawSubjects() {
  var g = grade(curGrade), ids = g.subjects || [];
  $("app").innerHTML = header(g.name, '<button class="ic" id="bBack" aria-label="رجوع إلى الصفوف" title="رجوع إلى الصفوف">' + HOUSE + '</button>') +
    '<div class="wrap"><div class="rects">' + ids.map(function (id, i) {
      var s = subject(id); if (!s) return "";
      return '<button class="rect' + (i === ids.length - 1 && ids.length % 2 ? ' odd' : '') + '" data-s="' + esc(id) + '" aria-label="' + esc(s.name) + '"><img alt="' + esc(s.name) + '" src="' + esc(bannerOf(s, curGrade)) + '"></button>';
    }).join("") + '</div></div>';
  bindHeader();
  $("bBack").onclick = function () { show("grades"); };
  document.querySelectorAll("[data-s]").forEach(function (b) { b.onclick = function () { openCover(b.dataset.s); }; });
}
function openCover(id) {
  var s = subject(id), e = s.grades && s.grades[curGrade], src = s.cover || bannerOf(s, curGrade), c = $("cover");
  c.innerHTML = '<img alt="" src="' + esc(src) + '">'; c.hidden = false;
  try { history.pushState({ cov: 1 }, ""); } catch (x) {}
  c.onclick = function () {
    closeCover();
    if (e) location.href = e.dir + "/" + (e.query || "");
    else toast("سيُضاف قريباً");
  };
}
function closeCover() { var c = $("cover"); if (!c.hidden) { c.hidden = true; c.innerHTML = ""; if (history.state && history.state.cov) try { history.back(); } catch (e) {} } }
window.addEventListener("popstate", function () { var c = $("cover"); if (!c.hidden) { c.hidden = true; c.innerHTML = ""; } });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeCover(); closeSheet(); closeMenu(); } });

/* ---------- قائمة البوابة ---------- */
function openMenu() {
  var it = [["🛟", "المساعدة والدعم", "الاستفسارات والملاحظات والتواصل", "support"], ["🔔", "الإشعارات", "التنبيهات والتحديثات", "notif"], ["📊", "إنجازاتي", "ما أنجزتَه في كل مادة", "ach"], ["🏅", "شهاداتي وأوسمتي", "كل ما حصلتَ عليه في موادك", "cert"]];
  $("drawer").innerHTML = '<h2>بوابة الصحابة التعليمية</h2>' + it.map(function (x) { return '<button class="mi" data-k="' + x[3] + '"><span class="ic3">' + x[0] + '</span><span><b>' + x[1] + '</b><small>' + x[2] + '</small></span></button>'; }).join("");
  document.querySelectorAll("#drawer .mi").forEach(function (b) { b.onclick = function () { closeMenu(); sheet(b.dataset.k); }; });
  $("drawer").classList.add("on"); $("veil").classList.add("on");
}
function closeMenu() { $("drawer").classList.remove("on"); $("veil").classList.remove("on"); }
$("veil").onclick = closeMenu;
function closeSheet() { var s = $("sheet"); s.hidden = true; s.innerHTML = ""; }
function sheet(k) {
  var P = progress(), t = "", b = "";
  var sci = ["physics", "chemistry", "biology"].map(function (id) { return subject(id); });
  if (k === "support") {
    t = "المساعدة والدعم";
    b = '<p>نسعد بتواصلك معنا لأي استفسار أو ملاحظة حول التطبيق أو المحتوى التعليمي.</p><button class="btn" id="bSend">✉️ أرسل استفساراً أو ملاحظة</button>' +
      '<div class="note"><b>تحت إشراف</b><p style="margin:4px 0">عبد الهادي كاظم الزميلي | حازم الخولي</p><b>إعداد</b><p style="margin:4px 0">المهندس كريم أسامة أبو حصيرة • المهندس فتحي محمد الأشرم</p></div>';
  } else if (k === "notif") {
    t = "الإشعارات";
    b = '<div class="note">🌟 مرحباً بك في بوابة الصحابة التعليمية.</div><div class="note">📝 أُضيفت أسئلة مراجعة جديدة لدروس الصف العاشر.</div>';
  } else if (k === "ach") {
    t = "إنجازاتي";
    b = sci.map(function (s) {
      var p = P[s.id] || {}, pc = p.pct || 0;
      return '<div class="row"><div class="l"><span>' + esc(s.name) + '</span><span>' + pc + '%</span></div><div class="bar"><i style="width:' + pc + '%"></i></div><span class="sm">' +
        (p.done || 0) + ' / ' + (p.total || 0) + ' درس مكتمل • أفضل اختبار: ' + (p.best == null ? "—" : p.best + "/9") + '</span></div>';
    }).join("") + '<p class="sm">الرياضيات والإنجليزية والعربية والتربية الإسلامية: تُحسب إنجازاتها في تطبيقاتها.</p>';
  } else if (k === "cert") {
    t = "شهاداتي وأوسمتي";
    b = sci.map(function (s) {
      var p = P[s.id] || {}, bs = p.badges || [];
      return '<h3 style="margin:14px 0 4px">' + esc(s.name) + ' <small>(' + bs.length + ')</small></h3>' + (bs.length ? '<div class="bd">' + bs.map(function (x) { return '<div><img alt="" src="' + esc(x.img) + '"><span>' + esc(x.t || "") + '</span></div>'; }).join("") + '</div>' : '<p class="sm">لم تنل أوسمة في هذه المادة بعد. أكمل أسئلة المراجعة لتنال أولها 🏅</p>');
    }).join("");
  }
  var s = $("sheet"); s.innerHTML = '<div class="box"><div class="t"><b>' + t + '</b><span class="x" id="sx">✕</span></div>' + b + '</div>'; s.hidden = false;
  s.onclick = function (e) { if (e.target === s) closeSheet(); }; $("sx").onclick = closeSheet;
  var sd = $("bSend"); if (sd) sd.onclick = function () { var tx = "ملاحظة/استفسار حول بوابة الصحابة التعليمية:\n"; try { if (navigator.share) { navigator.share({ text: tx }).catch(function () {}); return; } } catch (e) {} try { navigator.clipboard.writeText(tx).then(function () { toast("تم نسخ نص الرسالة، ألصقه وأرسله"); }); } catch (e) {} };
}

/* ---------- البدء ---------- */
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function () {});
fetch("subjects.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
  data = d; user = readUser(); curGrade = lsGet(GRADE_KEY);
  $("splash").onclick = function () { show(user ? "grades" : "name"); };
  /* ?home=1 (من زر 🏠 في التطبيقات): نعود مباشرةً إلى المواد أو الصفوف بلا غلاف البداية */
  var q = new URLSearchParams(location.search);
  if (q.get("home") && user) { var g = q.get("g"); if (g && grade(g)) { curGrade = g; show("subjects"); } else show("grades"); return; }
  show("splash");
}).catch(function () {
  $("app").innerHTML = '<div class="wrap"><div class="note" style="margin-top:40px">تعذّر تحميل البوابة. تأكّد من الاتصال وأعد المحاولة.</div></div>'; $("splash").hidden = true;
});
</script>
</body>
</html>
